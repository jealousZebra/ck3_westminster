 wm_1979.1.t: "A New Government"
 wm_1979.1.desc: "The removal vans have barely left Downing Street. Inflation remains high, strikes have shaken public confidence and the government's Commons majority is workable rather than overwhelming. The first Cabinet must decide where to spend its political capital."
 wm_1979.1.a: "Begin the economic break with the past."
 wm_1979.1.b: "Put industrial relations first."
 wm_1979.1.c: "Steady the government before moving faster."
