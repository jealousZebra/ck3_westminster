 wm_ideo_pick_green_desc: "グリーンになる。社会正義とより公正な民主主義と共に、気候非常事態を最優先。"
 wm_ideo_pick_liberal_desc: "リベラルになる。個人の自由、公正な投票、ヨーロッパとの緊密な関係：リベラルの伝統。"
 wm_ideo_pick_centrist_desc: "中道主義者になる。イデオロギーよりも能力を重視：穏健派で親ビジネス、実用主義。"
 wm_ideo_pick_cross_community_desc: "クロスコミュニティになる。ユニオニストでもナショナリストでもない：北アイルランドのコミュニティのための共有の未来。"
 wm_ideo_pick_one_nation_desc: "ワンネーション保守主義者になる。穏健な家父長的保守主義：社会的責任、安定した制度、連合。"
 wm_ideo_pick_free_market_desc: "フリーマーケット主義者になる。成長を促すために、減税、規制緩和、小さな国家。"
 wm_ideo_pick_national_conservative_desc: "国家保守主義者になる。家族、国家、伝統、そしてはるかに低い移民。"
 wm_ideo_pick_populist_right_desc: "ポピュリストになる。ウェストミンスターの体制に反対：国境管理、主権、減税。"
 wm_ideo_pick_scottish_nationalist_desc: "スコットランド民族主義者になる。ヨーロッパに独立したスコットランド、国内では社会民主主義的プログラム。"
 wm_ideo_pick_welsh_nationalist_desc: "ウェールズ民族主義者になる。ウェールズの自治とウェールズ語の保護。"
 wm_ideo_pick_irish_republican_desc: "アイルランド共和主義者になる。アイルランド統一と分断の終焉、左派的プログラムと共に。"
 wm_ideo_pick_irish_nationalist_desc: "アイルランド民族主義者になる。憲法的ナショナリズム：同意によるアイルランド統一、権力共有、社会民主主義。"
 wm_ideo_pick_unionist_desc: "ユニオニストになる。北アイルランドのイギリス連合王国での地位を何よりも守る。"
