l_japanese:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "リーダーシップコンテスト"
 wm_leadership.1.desc_vacancy: "[wm_lead_party.GetNameNoTier]は新しいリーダーを必要としています。[wm_lead_party_holder.GetName]が現在店舗を管理していますが、党自体が選ぶことになります。\n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] は [wm_lead_party.GetNameNoTier] のリーダーとして退くことになり、後任を巡る争いが始まりました。\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] [wm_lead_party.GetNameNoTier]のリーダー権を巡る挑戦に直面しています。他にもチャンスを望む人は参加できます。\n\n"
 wm_leadership.1.rules: "#bold ルール:#!党の議員からの指名は10日後に締め切られます。候補者はそのうち15%(挑戦者は20%)の支持が必要で、最も支持された2人は3週間後に党員投票にかけられます。党員はコミュニケーター、実績、党内の政治的資本、そして議員の支持を求めます。"
 wm_leadership.1.a: "立候補する"
 wm_leadership.1.a.tt: "あなたはリーダーに立候補します。同僚たちがあなたを指名するかどうかを決めます。"
 wm_leadership.1.b: "今回は違う。"
 wm_leadership.2.t: "挑戦"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName]は、[wm_lead_party.GetNameNoTier]のあなたの指導権への挑戦を発表しました。十分な推薦が集まれば、メンバーはあなたとの選択を行います。"
 wm_leadership.2.a: "彼らと戦い、勝利せよ。"
 wm_leadership.2.a.tt: "現在、あなたは投票用紙に載っています。挑戦者は、党の議員の5分の1の推薦が必要です。"
 wm_leadership.2.b: "品位を持って退け。"
 wm_leadership.2.b.tt: "あなたは立候補しません。コンテストはあなた抜きで進み、勝者が決まるまであなたはリードします。"
 wm_leadership.3.t: "議員の投票"
 wm_leadership.3.desc: "あなたは[wm_lead_party.GetNameNoTier] のリーダーシップの候補者リストに入りました。[wm_lead_rival.GetName] と競います。3週間にわたる選挙運動、電話作戦、インタビューが待っています。メンバーが決定します。"
 wm_leadership.3.a: "支部党を巡回する。"
 wm_leadership.3.a.tt: "握手や集会のキャンペーン: あなたの#bold カリスマ#!を活かします。"
 wm_leadership.3.b: "真剣なプログラムを提示した"
 wm_leadership.3.b.tt: "政策プラットフォーム：それはあなたの#bold 経済#!と#bold 政策#!に訴えます。"
 wm_leadership.3.c: "キャンペーン資金で最高の人材を雇う。"
 wm_leadership.3.c.tt: "洗練された動画と容赦ない地上活動。高額だが効果的"
 wm_leadership.3.d: "私の記録に語らせる"
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] リーダー [wm_lead_news_party.GetAdjective|U]勝利 ウォード"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] 無対抗で戴冠"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] 挑戦を退ける"
 wm_leadership.4.t_failed: "挑戦は消え去る"
 wm_leadership.4.desc_ballot: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\nメンバーが発言しました:[wm_lead_news_winner.GetName] [wm_lead_news_second.GetName]に対して[EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%の票を獲得し、[wm_lead_news_party.GetNameNoTier]の新しいリーダーです。党の議員の[EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0]が彼らを指名していました。"
 wm_leadership.4.desc_ballot_alone: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName]は[wm_lead_news_party.GetNameNoTier]の新しいリーダーであり、議員の投票率は[EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%です。"
 wm_leadership.4.desc_survives: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\nメンバーはリーダーを支持しています。[wm_lead_news_winner.GetName]は[wm_lead_news_second.GetName]に対して[EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%の票を獲得しており、のキャリアは回復しないかもしれません。"
 wm_leadership.4.desc_unopposed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n [wm_lead_news_winner.GetName] [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0]議員の[EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0]票を獲得し、無投票で[wm_lead_news_party.GetNameNoTier]党首に選出されました。メンバーは投票権を持ちませんでした。"
 wm_leadership.4.desc_failed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n [wm_lead_news_winner.GetName]への挑戦は始まる前に失敗しました。どの挑戦者も投票を強制するために必要な指名を見つけられませんでした。リーダーは今のところ安全です。"
 wm_leadership.4.a_won: "さあ、本当の仕事が始まる。"
 wm_leadership.4.a: "党は決定した。"
 wm_leadership.5.t: "伯爵の後"
 wm_leadership.5.desc: "総選挙は[wm_lead_party.GetNameNoTier]にとって悪い結果になった。新聞はすでにあなたの政治的訃報を書き始めており、一部の同僚は電話に出ていない。\n\nあなたは戦い続けるか、党が後継者を選んだ後に辞任を発表するかもできる。"
 wm_leadership.5.a: "私はどこにも行きません。"
 wm_leadership.5.b: "別の誰かの時です。"
 wm_leadership.5.b.tt: "指導者選挙が始まります。あなたは立候補せず、選挙が終わるまで率います。"
 wm_leadership_contest_toast: "党首選挙: [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "[wm_lead_party.GetNameNoTier] は指導者を選ぶことです：議員からの指名、その後メンバーによる投票。"
 wm_leadership_result_toast: "新リーダー:[wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] は [wm_lead_party.GetNameNoTier] を率います。"
 wm_leadership_challenge_decision: "指導者の座をめぐる挑戦"
 wm_leadership_challenge_decision_desc: "あなたの党はもっと良いものに値しますし、その人も知っています。挑戦を宣言する:党の議員の5分の1があなたを指名した場合、メンバーはあなたとリーダーのどちらかを選びます。"
 wm_leadership_challenge_decision_tooltip: "あなたの党の指導者に挑戦する"
 wm_leadership_challenge_decision_confirm: "挑戦を宣言せよ"
 wm_leadership_challenge_decision_effect_tt: "#bold の指導者選挙 #! が始まります：党の議員による指名が10日間行われ、その後会員の投票が行われます。敗北した場合、指導者はそれを忘れません。"
 wm_leadership_no_contest_tt: "指導者選は行われていません"
 wm_leadership_parliament_sitting_tt: "総選挙は行われていません"
 wm_leadership_challenged_opinion: "私に指導者の座を挑戦した"
 wm_leadership_deposed_opinion: "私から党を奪った"
 wm_leadership_gracious_opinion: "寛大な勝者"
