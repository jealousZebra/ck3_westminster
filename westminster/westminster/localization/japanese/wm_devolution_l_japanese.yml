l_japanese:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: ""
 wm_devolution_briefing_decision_desc: "内閣府が発行する週刊の『国の状況』メモ：\n\n#bold スコットランド：#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]独立支持者の％; 権限[EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10基準 \n#bold ウェールズ：#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]独立支持者の％; 権限 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10基準 \n#bold 北アイルランド：#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]統一アイルランド支持者の％; 権限 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10基準; 権限分担の安定性 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100基準 \n\n#bold 政治に対する国民の信頼：#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] 100基準。"
 wm_devolution_briefing_decision_tooltip: "連合の立場と、国民がその政治家をどれだけ信頼しているか。"
 wm_devolution_briefing_decision_confirm: "読んでみろ"
 wm_devolution.30.t: "国情"
 wm_devolution.30.desc: "#italic 内閣府、流通数 #!\n\n#bold スコットランド:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% 独立支持;[EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0]権限 10\n#bold ウェールズ:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% 独立支持;権限 10\n#bold 北アイルランド [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] #! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% 統一アイルランド支持;権限[EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10;権力分担安定性[EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100\n\nS支持が、ウェストミンスターでの国民の信頼、権限の取り戻し、譲渡され、各分権政府の運営者に影響を与えています。半数を超えると、民族主義主導の政府は正式に国民投票を要請できます。\n\n#bold 政治に対する国民の信頼:100 #! [EmptyScope.ScriptValue('wm_ui_public_trust')|0];総選挙の予想投票率は[EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%。"
 wm_devolution.30.suspended: "\n\n#N 北アイルランド議会は停止されています: #! 権力共有は崩壊しており、話し合い（または時間）だけがそれを回復させます。"
 wm_devolution.30.sitting: "\n\n北アイルランド議会は開会中であり、権力分担が維持されている。"
 wm_devolution.30.a: "承知。"
 wm_devolution_devolve_decision: "権力の退化"
 wm_devolution_devolve_decision_desc: "エディンバラ、カーディフ、またはベルファストにもう一つの権限を譲ろう。より多くの権限は離脱の主張を和らげ、権限委譲政府を喜ばせる。\n\n#bold スコットランド:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]%が独立を支持;権限[EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold ウェールズ:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]%が独立を支持;大国 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold 北アイルランド:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]%が統一アイルランドを支持;大国 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10;権力分担の安定性 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100"
 wm_devolution_devolve_decision_tooltip: "権限移譲政府により多くの権限を与えましょう。"
 wm_devolution_devolve_decision_confirm: "国家を選択"
 wm_devolution_devolve_decision_effect_tt: "国家を選択：その権限は1上がり、離脱支持は#P 3#!ポイント下落（そして低めに定着）、首相は喜び、公共の信頼は1上がります。"
 wm_devolution_claw_back_decision: "力を取り戻す"
 wm_devolution_claw_back_decision_desc: "権限をウェストミンスターに取り戻す。連合派の新聞は喜ぶだろうが、分権政府とその有権者はそうではない。\n\n#bold スコットランド:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]%が独立支持; 権限 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold ウェールズ:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]%が独立支持; 権限 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold 北アイルランド:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]%が統一アイルランド支持; 権限 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10; 権力分担の安定 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100"
 wm_devolution_claw_back_decision_tooltip: "権限をウェストミンスターに返還する。"
 wm_devolution_claw_back_decision_confirm: "国家を選択"
 wm_devolution_claw_back_decision_effect_tt: "国家を選択：その権限は1下がり、離脱支持は#N 3#!ポイント上昇（そして高めに定着）、首相は激怒し、公共の信頼は2下がり、少しだけ知名度が上がります。"
 wm_devolution_stormont_talks_decision: "ストーモント会談を招集"
 wm_devolution_stormont_talks_decision_desc: "北アイルランドでの権力分担は崩壊しています。関係者をテーブルに呼び、集中的な協議を行いましょう：合意がアセンブリーを復活させます。チャンスはあなたのカリスマ性と権力分担の安定性（現在 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0]／100）によって高まります。"
 wm_devolution_stormont_talks_decision_tooltip: "ストーモントで権力分担の復元を試みる。"
 wm_devolution_stormont_talks_decision_confirm: "会談を招集"
 wm_devolution_stormont_talks_decision_effect_tt: "成功すれば議会が復活し、国民の信頼度が2上昇し、あなたの知名度も得られます。失敗しても政党はさらに近づきます(安定度+5)。"
 wm_devolution.1.t: "国民投票の要請"
 wm_devolution.1.desc: "[wm_dev_gov.GetNameNoTier]は正式にウェストミンスターに対し、イギリス離脱に関する国民投票実施の権限を求めました。同局の世論調査では支持率は[wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%であり、その権限は明確であると述べています。\n\nユニオニストの議員たちは明確なノーを望んでいます。あなたの側近たちはあまり確信が持てません。"
 wm_devolution.1.a: "国民投票に同意する。"
 wm_devolution.1.a.tt: "6か月後の投票日。その結果はその時点での支持に依存し、数ポイントの増減はあるかもしれません。「はい」はあなたにとって災難となるでしょう。"
 wm_devolution.1.b: "今はその時ではない。"
 wm_devolution.1.b.tt: "4#!ポイント#N 上昇し、首相はあなたに反感を抱く。3年後にまた頼めばいい。"
 wm_devolution.1.c: "代わりにもっと多くの能力を提供してください。"
 wm_devolution.1.c.tt: "国家は権力を得るが、支持は#P 3#!ポイント減少し、プロフィールにわずかなコストがかかる。三年後に再び要請できる。"
 wm_devolution.20.t: "権力の権限の移譲"
 wm_devolution.20.desc: "どの地方政府が新しい権限を得るか？"
 wm_devolution.20.scotland: "スコットランドへの権限移譲(10の大国[EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0])。"
 wm_devolution.20.wales: "ウェールズへの権限移譲(10の権限[EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0])。"
 wm_devolution.20.northern_ireland: "北アイルランドに権限移譲(10の権限[EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0])。"
 wm_devolution.20.none: "やっぱり今は無理だ。"
 wm_devolution.21.t: "コントロールを取り戻す"
 wm_devolution.21.desc: "どの地方政府がウェストミンスターに権限を失うか？"
 wm_devolution.21.scotland: "スコットランドから奪還(10の力[EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0])。"
 wm_devolution.21.wales: "Claw back from Wales(パワー [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10)。"
 wm_devolution.21.northern_ireland: "北アイルランドから奪還(権限[EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10の中)。"
 wm_devolution.21.none: "やっぱり今は無理だ。"
 wm_dev_referendum_agreed_toast: "国民投票が承認された"
 wm_dev_referendum_agreed_toast_desc: "[wm_dev_gov.GetNameNoTier]の要請に同意し、イギリス離脱に関する国民投票が6か月後に実施されることになりました。 ウェストミンスター"
 wm_dev_referendum_refused_toast: "国民投票は拒否されました"
 wm_dev_referendum_refused_toast_desc: "[wm_dev_gov.GetNameNoTier]の国民投票要請を却下しました。離脱支持が高まっています。"
 wm_dev_referendum_powers_toast: "力を増やす"
 wm_dev_referendum_powers_toast_desc: "、[wm_dev_gov.GetNameNoTier]の国民投票要請に対し、新たな権限の提供を提案しました。 ウェストミンスター"
 wm_dev_stormont_collapse_toast: "ストーモント 崩壊"
 wm_dev_stormont_collapse_toast_desc: "北アイルランドの権力分担は崩壊し、議会は停止されています。公共の信頼は打撃を受けます。"
 wm_dev_stormont_restored_toast: "ストーモント 復元"
 wm_dev_stormont_restored_toast_desc: "取引が成立し、北アイルランドに権力の分担が戻りました。"
 wm_dev_stormont_talks_failed_toast: "ストーモント 議論失敗"
 wm_dev_stormont_talks_failed_toast_desc: "協議は合意に至らず解散しましたが、両当事者は以前よりも接近しています。"
 wm_dev_referendum_yes_toast_scotland: "スコットランドがイエスに投票"
 wm_dev_referendum_yes_toast_scotland_desc: "スコットランド独立に[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%の差で賛成票を投じました。イギリスからの離脱交渉が始まり、首相の権威は打ち砕かれます。"
 wm_dev_referendum_no_toast_scotland: "スコットランドがノーに投票"
 wm_dev_referendum_no_toast_scotland_desc: "独立を拒否しており、賛成票を投じたのはわずか[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%です。この問題は一世代の先に決着がついたとウェストミンスターは望んでいます。 スコットランド"
 wm_dev_referendum_yes_toast_wales: "ウェールズはYESに投票"
 wm_dev_referendum_yes_toast_wales_desc: "ウェールズはウェールズ独立に賛成票を投じました、賛成は[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%です。イギリスからの離脱交渉が始まり、首相の権威は粉砕されます。"
 wm_dev_referendum_no_toast_wales: "ウェールズはNOに投票"
 wm_dev_referendum_no_toast_wales_desc: "ウェールズはウェールズ独立を拒否しました：賛成は[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%のみでした。この問題は一世代にわたって解決された、とウェストミンスターは期待しています。"
 wm_dev_referendum_yes_toast_northern_ireland: "北アイルランドはYESに投票"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "北アイルランドは [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% で統一アイルランドに投票しました。イギリスからの離脱交渉が始まり、首相の権威は粉砕されます。"
 wm_dev_referendum_no_toast_northern_ireland: "北アイルランドはNOに投票"
 wm_dev_referendum_no_toast_northern_ireland_desc: "北アイルランドは統一アイルランドを拒否しました：[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]％だけが「はい」と投票しました。この問題は一世代にわたって解決済みであると、ウェストミンスターは望んでいます。"
 wm_dev_assembly_suspended_modifier: "議会休会"
 wm_dev_assembly_suspended_modifier_desc: "権力分担は崩壊し、北アイルランド議会は停止されました。"
