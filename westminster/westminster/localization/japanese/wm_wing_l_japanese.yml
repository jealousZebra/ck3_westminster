l_japanese:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "労働左翼"
 wm_wing_badge_1_desc: "党の社会主義左派のメンバー：公有制、労働組合の権利、支出。（このゲームでの実際の議員の派閥はランダムであり、彼らの見解を示すものではありません。）"
 wm_wing_badge_2: "ソフト・レフト"
 wm_wing_badge_2_desc: "党の柔軟な左翼のメンバー：党首への批判的な友人、公的サービスに熱心。（このゲームでの実際の議員の派閥はランダムであり、彼らの見解を示すものではありません。）"
 wm_wing_badge_3: "労働中道派"
 wm_wing_badge_3_desc: "党の中道派のメンバー：財政慎重、公共サービスの改革、選挙での当選可能性を最優先。（このゲームでの実際の議員の派閥はランダムであり、彼らの見解を示すものではありません。）"
 wm_wing_badge_4: "ワン・ネイション"
 wm_wing_badge_4_desc: "党の「ワンネーション」穏健派のメンバー：実利的で公的サービス支持。（このゲームでの実際の議員の派閥はランダムであり、彼らの見解を示すものではありません。）"
 wm_wing_badge_5: "自由市場主義者たち"
 wm_wing_badge_5_desc: "党の自由市場派のメンバー：減税、小さな国家、規制緩和。（このゲームでの実際の議員の派閥はランダムであり、彼らの見解を示すものではありません。）"
 wm_wing_badge_6: "伝統主義者"
 wm_wing_badge_6_desc: "党の伝統主義者のメンバー：法と秩序、制度、国家のアイデンティティ。（このゲームでの実際の議員の派閥はランダムであり、彼らの見解を示すものではありません。）"
 wm_wing_court_decision: "裁判所の党派ウィング"
 wm_wing_court_decision_desc_labour: "労働党議会内派閥が党首についてどう感じているか（100点満点）：\n#bold 労働党左派#!（[EmptyScope.ScriptValue('wm_ui_wing_size_1')|0]議員）：支持 [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold ソフト左派#!（[EmptyScope.ScriptValue('wm_ui_wing_size_2')|0]議員）：支持 [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold 労働党中道派#!（[EmptyScope.ScriptValue('wm_ui_wing_size_3')|0]議員）：支持 [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\n 派閥に取り入れるには#N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! プロフィール: 取り入れると支持は15増え、他は4減る。閣僚席（または影の閣僚席）がない派閥は毎月支持を失う。30未満の派閥は下院で不満を述べ反抗し、3か月間15未満では党首挑戦を行う。"
 wm_wing_court_decision_desc_conservative: "保守党内の各派閥が党首についてどう感じているか（100点満点）：\n#bold ワンネーション#!（[EmptyScope.ScriptValue('wm_ui_wing_size_4')|0]議員）：支持 [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold 自由市場派#!（[EmptyScope.ScriptValue('wm_ui_wing_size_5')|0]議員）：支持 [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold 伝統主義者#!（[EmptyScope.ScriptValue('wm_ui_wing_size_6')|0]議員）：支持 [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\n 派閥に取り入れるには#N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! プロフィール: 取り入れると支持は15増え、他は4減る。閣僚席（または影の閣僚席）がない派閥は毎月支持を失う。30未満の派閥は下院で不満を述べ反抗し、3か月間15未満では党首挑戦を行う。"
 wm_wing_court_decision_tooltip: "党の翼を味方につけておけ。"
 wm_wing_court_decision_confirm: "派閥を選択"
 wm_wing_court_decision_effect_tt: "派閥を選択：あなたへの承認は#P 15#!上昇、その他すべての派閥は#N 4#!下落します。"
 wm_wing.1.t: "党をまとめる"
 wm_wing.1.desc: "基調講演、政策の承認、今後の昇進の約束。党のどの派閥が注目を必要としているか？"
 wm_wing.1.w1: "労働党左派に働きかけること(承認[EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0])。"
 wm_wing.1.w2: "ソフト・レフトに連絡を取る(承認[EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])。"
 wm_wing.1.w3: "労働党中道派に働きかけること(承認[EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]。"
 wm_wing.1.w4: "ワン・ネイションに連絡を取ること(承認[EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0])。"
 wm_wing.1.w5: "フリーマーケット支持者に連絡を取る(承認[EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0])。"
 wm_wing.1.w6: "伝統主義者に連絡を取ること(承認[EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]。"
 wm_wing.10.t: "リーダーシップの挑戦"
 wm_wing.10.desc: "手紙が届いた。議会党の一派が我慢できず、あなたに対してリーダーシップを挑戦するために[wm_wing_challenger.GetName]を立てた。新聞は名前を数え、放送局はグラフィックを用意しており、あなたの電話は鳴り止まない。\n\n反逆者たちに望むものを与えるか、対立するか。"
 wm_wing.10.a: "彼らが望むものを与えろ。"
 wm_wing.10.a.tt: "あなたは #N のプロフィールを 300#! 失い、反乱派の支持は #P 30#! 上昇、他の派閥は #N 4#! 下落します。"
 wm_wing.10.b: "立ち向かえ。"
 wm_wing.10.b.tt: "[wm_wing_challenger.GetName]とのカリスマ#!の価値ある競争#bold。勝てば反乱は沈み、負ければリーダーシップ(そして首相ならダウニング街)を奪う。"
 wm_wing_challenge_toast: "リーダーシップ挑戦 リーダーシップ"
 wm_wing_challenge_toast_desc_1: "労働党左派は[wm_wing_leader.GetName]に対して動きました：[wm_wing_challenger.GetName]が[wm_wing_party.GetNameNoTier]の指導権に挑戦しています。"
 wm_wing_challenge_toast_desc_2: "ソフト・レフトは[wm_wing_leader.GetName]に対抗し、[wm_wing_challenger.GetName] [wm_wing_party.GetNameNoTier]のリーダー職を争っています。"
 wm_wing_challenge_toast_desc_3: "労働党中道派は[wm_wing_leader.GetName]に対して動きました：[wm_wing_challenger.GetName]が[wm_wing_party.GetNameNoTier]の指導権に挑戦しています。"
 wm_wing_challenge_toast_desc_4: "ワン・ネイションは[wm_wing_leader.GetName]に反対する動きを起こしました。[wm_wing_challenger.GetName]は[wm_wing_party.GetNameNoTier]のリーダーシップを争っています。"
 wm_wing_challenge_toast_desc_5: "自由市場派は[wm_wing_leader.GetName]に対抗しました：[wm_wing_challenger.GetName]が[wm_wing_party.GetNameNoTier]のリーダーシップに挑戦しています。"
 wm_wing_challenge_toast_desc_6: "伝統主義者たちは[wm_wing_leader.GetName]に反対している。[wm_wing_challenger.GetName] [wm_wing_party.GetNameNoTier]のリーダーシップを争っている。"
