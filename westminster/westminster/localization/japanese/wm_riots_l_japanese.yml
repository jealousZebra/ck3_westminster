l_japanese:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "[wm_riot_seat.GetName]の暴徒"
 wm_riot_gathering_toast_desc: "怒れる群衆が[wm_riot_seat.GetName]に集まっています。[wm_riot_organiser.GetName]ウェストミンスターでの抗議行進を組織しています。"
 wm_riot_marching_toast: "[wm_riot_seat.GetName]からの抗議行進"
 wm_riot_marching_toast_desc: "[wm_riot_seat.GetName]からの抗議行進は[wm_riot_organiser.GetName]に率いられ、ウェストミンスターへ出発しました。要求事項と共に今月中に到着する予定です。"

 wm_riot_demand_1_desc: "\n\n彼らは#bold 生活費#!の支援を望んでいる：請求書、家賃、食料価格は急騰しており、政府は関心がないと言っている。"
 wm_riot_demand_2_desc: "\n\n彼らは#bold 大臣の辞任#!を望んでいる：内閣の誰かが責任を取る必要があり、首が欲しいと言っている。"
 wm_riot_demand_3_desc: "\n\n彼らは#bold 総選挙#!を望んでいる：政府が行っていることには正当性がないと言い、国が決定すべきだと言っている。"
 wm_riot_demand_4_desc: "\n\n 彼らは #bold Uターン#! を望んでいます：彼らが嫌う政策を今すぐ、条件なしに撤廃することです。"

 wm_riot.10.t: "[wm_riot_seat.GetName]でのトラブル"
 wm_riot.10.desc: "私の選挙区事務所の電話は鳴り止みません。数百人の人々が[wm_riot_seat.GetName]の街頭に出ており、店はシャッターを下ろし、地元の活動家[wm_riot_organiser.GetName]がカメラに向かって、この群衆は誰かが耳を傾けない限りウェストミンスターに向かって行進すると話しています。"
 wm_riot.10.a: "外に出て話しかけてみろ。"
 wm_riot.10.a.success: "観客は耳を傾けて帰っていった"
 wm_riot.10.a.failure: "通りから野次られる"
 wm_riot.10.b: "公に彼らの言う通りだと言ってください。"
 wm_riot.10.c: "頭を低くして、ナンバー10に任せておけ。"

 wm_riot.20.t: "西敏寺への行進"
 wm_riot.20.desc: "議会広場にはプラカードがたくさん並んでいます。  議会"
 wm_riot.20.desc_first: "[wm_riot_seat.GetName]からのデモ行進が到着し、その主催者である[wm_riot_organiser.GetName]は、要求事項のリストと共に私と会いたいと申し入れている。"
 wm_riot.20.desc_bigger: "[wm_riot_seat.GetName]からのデモ行進が戻ってきた、以前よりも大きく、怒りに満ちている。[wm_riot_organiser.GetName]はこれ以上の交渉はないと言っている。"
 wm_riot.20.desc_gone: "\n\nブリーフィングを読んでいる間に、群衆は家に帰ってしまいました。"
 wm_riot.20.a: "彼らが望むものを与えろ。"
 wm_riot.20.b: "主催者を招いて話をしてもらう"
 wm_riot.20.b.success: "妥協が合意されました。"
 wm_riot.20.b.failure: "協議は崩壊します。"
 wm_riot.20.c: "警察に広場を片付けるように伝えてください。"
 wm_riot.20.c.dispersed: "警察が広場を掃除する。"
 wm_riot.20.c.violence: "夕方ニュースの暴力シーン"
 wm_riot.20.d: "いいね。"

 wm_riot_county_modifier: "暴動"
 wm_riot_county_modifier_desc: "怒れる群衆が街頭に繰り広げられ、抗議行進が進行中です。"
 wm_riot_demands_met_county_modifier: "要求が満たされた"
 wm_riot_demands_met_county_modifier_desc: "政府は抗議者たちに望むものを与えました。"
 wm_riot_compromise_county_modifier: "妥協案"
 wm_riot_compromise_county_modifier_desc: "抗議者たちは合意のもと帰宅しました。"
 wm_riot_policed_county_modifier: "抗議活動の分断"
 wm_riot_policed_county_modifier_desc: "警察はデモ行進を解散させたが、人々はそれを忘れていない。"
 wm_riot_crackdown_county_modifier: "警察の暴力 警察の抗議行進"
 wm_riot_crackdown_county_modifier_desc: "デモ行進に突入する警察の写真は、今も共有されている。"
 wm_mp_backed_protesters_county_modifier: "議員は抗議を支持しました"
 wm_mp_backed_protesters_county_modifier_desc: "地元の国会議員は抗議者たちと共に立った。"
 wm_cost_of_living_package_modifier: "生活費支援パッケージ"
 wm_cost_of_living_package_modifier_desc: "請求書の支払いは政府が負担しています。"
 wm_u_turn_modifier: "Uターン"
 wm_u_turn_modifier_desc: "抗議デモによって屈辱的なUターンを強いられた。"
 wm_heavy_handed_modifier: "厳格な手法"
 wm_heavy_handed_modifier_desc: "抗議行進に警察を送り込んだ"
 wm_crackdown_modifier: "警察の暴力の責任を問われた"
 wm_crackdown_modifier_desc: "暴力的になり、その責任はここに及びました。"

 wm_forced_to_resign_opinion: "辞任を余儀なくされた"
 wm_backed_protesters_opinion: "抗議者側に立った"
 wm_policed_my_constituents_opinion: "自分の支持者に警察を送り込んだ"
