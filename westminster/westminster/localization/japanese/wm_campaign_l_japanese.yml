l_japanese:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "選挙戦の道中:第[EmptyScope.ScriptValue('wm_campaign_week_value')|0]週"
 wm_campaign.1.desc: "議会は解散され、戦争バスが外でアイドリングしています。今週埋めるべきスロットがグリッドにあり、私の電話には140件の未読メッセージがあり、誰かが許可なく私にロゼットを付けました。"
 wm_campaign.1.desc_leader: "\n\n[wm_campaign_party.GetNameNoTier]のリーダーとして、私のすべての行動は全国ニュースになります。放送局は[wm_campaign_rival.GetName]との対決を望んでおり、政策ユニットはすぐに実行できる準備ができています。故郷では、[wm_campaign_seat.GetNameNoTier]の私のエージェントが、投票日までに少なくとも一度私に会いたがっています。"
 wm_campaign.1.desc_leader_no_rival: "\n\n[wm_campaign_party.GetNameNoTier]のリーダーとして、私のすべての行動は全国ニュースになり、政策ユニットはすぐに実行できる準備ができています。"
 wm_campaign.1.desc_mp: "\n\n 全国キャンペーンは私を知りません、これは安心です。重要なのは、[wm_campaign_seat.GetNameNoTier]：チラシ、戸別訪問、そして地元紙が私の写真を正しい向きで掲載するかどうかです。"
 wm_campaign.1.a: "大規模な集会を開く。"
 wm_campaign.1.b: "テレビ討論で[wm_campaign_rival.GetFirstName]に挑戦する。"
 wm_campaign.1.c: "テレビ討論をして、統計に埋もれ[wm_campaign_rival.GetFirstName]。"
 wm_campaign.1.d: "旗艦政策を打ち出す"
 wm_campaign.1.e: "[wm_campaign_seat.GetNameNoTier]でドアノックをする。"
 wm_campaign.1.f: "キャンペーン本部で静かな週、パンフレットを承認する。"

 wm_campaign_rally_success: "ラリー:熱狂的な歓迎"
 wm_campaign_rally_flat: "集会:丁寧な拍手"
 wm_campaign_rally_flop: "ラリー:半分空のホール"
 wm_campaign_debate_won: "討論会:インスタント・ポークスが答える"
 wm_campaign_debate_lost: "討論:ライトの下でもがき"
 wm_campaign_debate_wonk_won: "討論:スプレッドシートによる死(彼らのもの)"
 wm_campaign_debate_wonk_lost: "討論会:「財政ヘッドルーム」で聴衆を失った"
 wm_campaign_policy_success: "政策発表：切り込む"
 wm_campaign_policy_flop: "政策発表：朝のラジオで費用が明らかに"
 wm_campaign_door_knock: "ドアノック:ドアステップスが勝ち取られた"

 wm_campaign.2.t: "失態！"
 wm_campaign.2.desc: "私の広報担当者の顔は、まるで明日の新聞の一面を見たばかりの人のようです。"
 wm_campaign_gaffe_1: "写真家がカフェでベーコンサンドイッチを食べている私を撮影し、その結果はオンラインで『朝食での人質事件\"』として描写されています\"。それはすでにミーム、マグカップ、着信音になっています。"
 wm_campaign_gaffe_2: "工場訪問の後、マイクがまだついているのを忘れてしまい、今や国中が私が有権者を\"と呼ぶのを聞いてしまいました。正直に言って\"です。彼女は昼食以降、4回のインタビューを受けています。"
 wm_campaign_gaffe_3: "ライブラジオで1パイントの牛乳がいくらかと尋ねられ、私は \" 約11ポンド？\" と本当に自信を持って答えました。司会者は沈黙を9秒間続けさせました。"
 wm_campaign_gaffe_4: "写真撮影の場で、私は自信満々に間違った扉を通って戸棚に入り、カメラは私が戻ってくるのを待っていました。最終的にはモップを持って戻りました。"
 wm_campaign_gaffe_5: "私は一度、スピーチ全体で我々のビラを逆さまに掲げているところを撮影され、選挙区名が誤って綴られた横断幕の下に立っていた。我々の候補者の名前も同様だ。"
 wm_campaign.2.a: "笑い飛ばそう。誰でも悪いサンドイッチの日はあります。"
 wm_campaign.2.b: "若手スタッフのせいにする。"
 wm_campaign.2.c: "それに乗る: わざと、カメラの前で再びやる。"
 wm_campaign_gaffe_shrugged: "失態：大衆はむしろ好意的に受け取る"
 wm_campaign_gaffe_stuck: "失態：全てのニュース速報の冒頭に"
 wm_campaign_gaffe_viral: "失態：自己風刺がバイラルに（良い意味で）"
 wm_campaign_gaffe_doubled: "失態：\"倍増戦術\"では解決にならない"

 wm_campaign_doorstep_county_modifier: "玄関先で議員に会いました"
 wm_campaign_doorstep_county_modifier_desc: "選挙期間中に彼らの議員がここを訪問し、足を拭くのを忘れませんでした。"
 wm_campaign_viral_gaffe_modifier: "バイラルな失態"
 wm_campaign_viral_gaffe_modifier_desc: "インターネットが忘れないキャンペーンの失策。"

 wm_campaign_debate_humiliated_opinion: "テレビ討論で私に勝った"
