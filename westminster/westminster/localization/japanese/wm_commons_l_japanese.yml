l_japanese:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "法案を提出"
 wm_commons_introduce_bill_decision_desc: "政府法案を下院に提出する。幹事は人数を数え、後方議員は不満を漏らし、1週間後には下院が分裂する。"
 wm_commons_introduce_bill_decision_tooltip: "政府法案を下院で投票にかけること"
 wm_commons_introduce_bill_decision_effect_tt: "法案を選択。下院は1週間後に採決します。"
 wm_commons_no_confidence_decision: "不信任動議を提出する"
 wm_commons_no_confidence_decision_desc: "野党党首として、この議会が陛下の政府に不信任であるという動議を提出してください。もし政府が敗北すれば、総選挙が行われなければなりません。"
 wm_commons_no_confidence_decision_tooltip: "政府を倒そうとする"
 wm_commons_no_confidence_decision_effect_tt: "下院は1週間以内に動議について投票します。可決された場合、#bold 総選挙#!が行われなければなりません。否決された場合、あなたは面目を失い、首相はそれを忘れません。"
 wm_commons_house_free_desc: "他の法案や動議は庶民院で投票待ちではありません"
 wm_commons_no_election_pending_desc: "総選挙は政府に強制されていません"
 wm_commons_leader_of_opposition_desc: "あなたは政府外で最大の党を率います"

 # Bills
 wm_commons_bill_1_name: "#bold 財政法案#!"
 wm_commons_bill_2_name: "#bold 公共サービス法案#!"
 wm_commons_bill_3_name: "#bold 公共サービス改革法案#!"
 wm_commons_bill_4_name: "#bold 緊急権限法案#!"
 wm_commons_bill_5_name: "#bold 陛下政府に対する不信任動議#!"
 wm_commons_bill_1_desc: "\n\n #bold 財政法案#! は帳簿を均衡させるために税金を引き上げます。党の右翼はこれを嫌い、左翼は受け入れられます。"
 wm_commons_bill_2_desc: "\n\n #bold 公共サービス法案#! は学校や病院により多くの資金を投入します。人気があり、左翼はこれを好みます；右翼は費用を心配しています。"
 wm_commons_bill_3_desc: "\n\n #bold 公共サービス改革法案#! は公共サービスの運営方法を大きく変えます。右翼は何年もこの改革を望んでいました。左翼はこれを裏切りと呼び、そのうちの一部は反対票を投じると脅しています。"
 wm_commons_bill_4_desc: "\n\n#bold 緊急権限法#! は、危機に対処するために閣僚に広範な権限を与える。誰もあまり好まないが、危機の際には国は議会の行動を期待する。"
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName]、野党のリーダーとして、政府に対する#bold 不信任案#!を提出しました。通過した場合、総選挙が行われます。"

 wm_commons.1.t: "立法プログラム"
 wm_commons.1.desc: "下院の指導者は、政府が次に下院に提出するものを知りたがっています。公務員は複数の法案を作成しており、それぞれに我々の議席で支持者と反対者がいます。"
 wm_commons.1.a: "財政法案:税金は増えなければなりません。"
 wm_commons.1.a.tt: "通過した場合: 政府への資金と増税、しかし世論調査は好まない。党の#bold 右派#!は反発する可能性がある。"
 wm_commons.1.b: "公共サービス法案:学校と病院への資金増加。"
 wm_commons.1.b.tt: "通過した場合: 人気があり、世論調査には良い、しかし数年分の費用がかかる。党の#bold 右派#!は不満を言うかもしれない。"
 wm_commons.1.c: "公務員改革法案:本当の変革の時です。"
 wm_commons.1.c.tt: "通過した場合: 権限と改革者の評判。#bold 論争的#!: 党の#bold 左派#!は多数で反発する可能性がある。"
 wm_commons.1.d: "緊急権限法案：国はそれを必要としている。"
 wm_commons.1.d.tt: "通過した場合: プロフィールと権限。野党も支援する可能性がある。"
 wm_commons.1.e: "今のところ何もなし。"

 # The whips
 wm_commons.2.t: "幹事報告"
 wm_commons.2.t_confidence: "不信任動議"
 wm_commons.2.desc_bill: "党の幹事はティールームで票数を数えていました。"
 wm_commons.2.desc_confidence: "野党は政府を倒す動議を提出し、チーフ・ウィップはすでに私のオフィスにいます。"
 wm_commons.2.numbers: "\n\n我々には#bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#!議員がいる；他のベンチには[EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0]がいる。チーフウィップは、約#bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#!の我々の者が反抗するか欠席する可能性があると見ている。"
 wm_commons.2.opposition_backs: "野党のフロントベンチは我々を支持すると述べた。"
 wm_commons.2.no_opposition_help: "野党は反対票を投じるだろう。"
 wm_commons.2.a: "党務に任せる。"
 wm_commons.2.b: "三行ウィップを出す。私の権威がかかっている"
 wm_commons.2.c: "揺れる人たちを一人ずつ呼び寄せろ。どの選挙区にも何かが必要だ。"
 wm_commons.2.d: "譲歩を提供する。"
 wm_commons.2.d.tt: "反抗する議員は少ないが、法案は#bold 水増し#!される。：通れば半分しか効果がない。"
 wm_commons.2.e: "法案が否決される前に撤回する"

 # The result
 wm_commons_headline_government_falls: "政府が崩壊"
 wm_commons_headline_pm_survives: "首相が信任投票を生き延びる"
 wm_commons_headline_humiliation: "ナンバー10の屈辱"
 wm_commons_headline_defeated: "政府が敗北"
 wm_commons_headline_knife_edge: "ナイフエッジ:政府が功績を取る"
 wm_commons_headline_revolt: "バックベンチの反乱にもかかわらず法案が可決される"
 wm_commons_headline_comfortable: "快適な多数派"
 wm_commons_headline_passed: "法案通過"

 wm_commons.4.lobbies: "\n\n 投票結果のロビー：#bold 賛成 [EmptyScope.ScriptValue('wm_commons_ayes_value')|0]、反対 [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!。[EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] 議員は投票しませんでした。"
 wm_commons.4.rebels: "#bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! の政府議員が幹事命令に背いた。"
 wm_commons.4.no_rebels: "一人の政府議員も幹事命令に背かなかった。"
 wm_commons.4.outcome_government_falls: "\n\n下院は [wm_commons_pm.GetName] の政府に信任を置いていない。#bold 総選挙 が必要である#!。"
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] [EmptyScope.ScriptValue('wm_commons_majority_value')|0]票で生き残り、野党は顔に卵をぶつけられたような状態です。"
 wm_commons.4.outcome_defeated: "\n\n その法案は [EmptyScope.ScriptValue('wm_commons_majority_value')|0]票 によって否決され、失敗しました。[wm_commons_pm.GetName] は下院の支配権を失いました。"
 wm_commons.4.outcome_passed_watered_down: "\n\n その法案は [EmptyScope.ScriptValue('wm_commons_majority_value')|0] の多数で可決されました、しかし政府がほぼ全てに譲歩した後でのみです。"
 wm_commons.4.outcome_passed: "\n\n その法案は [EmptyScope.ScriptValue('wm_commons_majority_value')|0] の多数で可決されました。"
 wm_commons.4.a: "静粛に、静粛に!"
 wm_commons.4.a_pm: "次の話に進みましょう。"

 # The division bell
 wm_commons.5.t: "投票ベル"
 wm_commons.5.desc: "ウェストミンスター宮殿中に分割の鐘が鳴り響いています。数分後に議会が投票します。"
 wm_commons.5.whip_none: "\n\n党の拘束がなければ、私は好きなように投票できる。"
 wm_commons.5.whip_abstain: "\n\n私の党はウェストミンスターで席に着きません。私は投票しません。"
 wm_commons.5.whip_government: "\n\n 党の幹部は私たち全員に #bold 政府と一緒にロビーにいること#! を望んでいます。反抗者は記憶されます。"
 wm_commons.5.whip_opposition_backs: "\n\n我々の前列ベンチは今回、政府を支持しており、党の幹部たちは私が従うことを期待している。"
 wm_commons.5.whip_opposition: "\n\n党の幹部たちは私がロビーにいることを望んでいる #bold 政府に反対して#!。"
 wm_commons.5.wing_left: "私は党の#bold 左派#!に座っている。"
 wm_commons.5.wing_right: "私は党の#bold 右派#!に座っている。"
 wm_commons.5.wing_centre: "私は党の#bold 中央#!に座っている。"
 wm_commons.5.a: "政府に賛成票を投じる。"
 wm_commons.5.b: "政府に反対票を投じる。"
 wm_commons.5.c: "近づかず、控えめにしてください。"

 wm_commons_whip_withdrawn_toast: "ムチの撤去"
 wm_commons_whip_withdrawn_toast_desc: "反乱を繰り返した[wm_commons_whipless.GetName]、党の党鞭を失い、現在は無所属として座っています。"

 # Modifiers
 wm_commons_tax_rise_modifier: "税金引き上げ"
 wm_commons_tax_rise_modifier_desc: "財政法案は税金を引き上げました。資金は入っており、有権者はそれに気づきました。"
 wm_commons_public_services_modifier: "公共サービス支出"
 wm_commons_public_services_modifier_desc: "学校や病院への資金増加:人気があり、高額です。"
 wm_commons_reformer_modifier: "改革者"
 wm_commons_reformer_modifier_desc: "下院で物議を醸す改革を得ました。"
 wm_commons_emergency_powers_modifier: "緊急権限"
 wm_commons_emergency_powers_modifier_desc: "政府に危機に対処するための広範な権限を与えました。"
 wm_commons_defeated_in_commons_modifier: "下院での敗北"
 wm_commons_defeated_in_commons_modifier_desc: "政府の法案が下院で否決されました。"
 wm_commons_lost_confidence_modifier: "議会の信頼を失った"
 wm_commons_lost_confidence_modifier_desc: "下院はこの政府に信任を与えないと投票しました。"

 # Opinions
 wm_commons_defied_whip_opinion: "鞭に逆らった"
 wm_commons_whip_withdrawn_opinion: "鞭を私から取り上げた"
 wm_commons_tabled_no_confidence_opinion: "私の政府を倒そうとした"
 wm_commons_introduce_bill_decision_confirm: "議会にかける"
 wm_commons_no_confidence_decision_confirm: "動議を提出する"
