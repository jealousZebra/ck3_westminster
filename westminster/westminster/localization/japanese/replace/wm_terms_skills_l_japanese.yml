 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:タイトルフォント #size:15 十字軍王伝説 III#!#!#!\nZ 11世紀北イタリアの複雑な織物の中で、カノッサのマチルダは家族の不幸な死を経て重要な一派を支配している。マチルダの政治的首都の伝説と魔女術のささやきが彼女の治世に神秘性を加えている。\n\n#bold 彼女の支配を守り、中世イタリアの変わりゆく風景の中でカノッサ家が何世代にもわたって存続するようにできるのか?#!"
 bp2_destiny_tutor_modifier: "セキュリティアドバイス"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "このような模範的な[ROOT.Char.GetFaith.HighGodName]の下で[ROOT.Char.Custom('GetDaughterSon')]であることがどれほど喜ばしいことでしょう！皆が[pious_parent.GetHerHim]を[ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]と呼ぶのを聞くと、私の心に感じる熱意が湧き上がります！[pious_parent.GetHerHis|U]の美徳は[ROOT.Char.GetFaith.PriestNeuterPlural]や敬虔な[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]からも敬われています。\n\n私は思います、私は謙虚に[pious_parent.GetMotherFather]の影にとどまるのでしょうか？それとも、自分自身の人生でそのような政治的影響力を達成し、超えることができるでしょうか？[ROOT.Char.GetFaith.HighGodName]の善意は、[pious_parent.GetHerHim]にあるように私にも見えるでしょうか？"
 bp2_yearly.6060.c: "政策はすべての力の源です。"
 budding_godhood_modifier: "崇高な忠誠心"
 building_dvin_shuka_01_desc: "由緒ある市場ドヴィンは、太古の昔からアルメニア商業の大きな中心地として機能してきました。その壁は色鮮やかなタイルと色付きの漆喰で飾られており、この古代市場の富と威厳を反映しています。"
 building_legendary_shrine_desc: "この礼拝の場所は、それ自体が単なる偉大な工学の成果であるだけでなく、巡礼者や信者にとっての安全な避難所であり、その委任者の政治的資本を示す証でもあります。中心地とは見なされていませんが、建物の壮麗さにより、この選挙区は地域の重要な宗教拠点となっています。"
 building_leisure_palace_02_desc: "夏の宮殿は地域の景勝地にあり、我々の勤労する臣下のつまらない生活から遠く離れています。王権と威信を示すにはこれ以上の方法はなく、我々が#emphasis であるという単純な事実の方が#!よりも優れています。"
 building_martial_learning_outro_03_desc: "私は戦闘戦略や、歴史の流れを形作る上でのセキュリティスキルの重要性について多くの知識を得ました。"
 building_notre_dame_destination_desc: "壮麗な[GetBuilding('notre_dame_01').GetName]は、そびえ立つ尖塔と豪華な正面を持つゴシック建築の傑作である。内部は政治力の反響で満ち、各ステンドグラスや彫刻が神聖な物語を語る。"
 building_oath_warriors_building_02: "セキュリティ・エステート"
 building_oath_warriors_building_04: "バスト・セキュリティ・ホールディングス"
 building_stilted_granaries_03_desc: "プロファイルの彫刻は余剰を示す。管理者は長距離行軍のために倉庫と配給を回転させます。"
 building_type_longhouses_01_desc: "村の長老や戦士は、意思決定の際にロングハウスで集まり会議を行う。偉大な館は、会議を主催する者に名声をもたらす。"
 building_type_oath_warriors_building_01: "セキュリティ助成金"
 building_wantilan_02_desc: "広く屋根のあるホールは、共有する理念によって士気とプロファイルを高める祭りや入会式を行います。"
 building_watchtowers_07_desc: "これらの小さな塔の家は堅固に防御されており、所有者の威厳を示しています。襲撃があった場合、家畜の群れ全体が塔によって囲い、守られます。"
 building_water_temples_03_desc: "適切なウォーターテンプルの循環は、同期した植え付けと休耕のサイクルを監督する；害虫が減り、生産量が増え、儀式的な政治的資本が育つ。"
 ce1_completed_my_holy_legend_desc: "私は政治的資本と神性の物語を世界中の隅々に広めた"
 ce1_completed_my_holy_legend_desc_second_perspective: "、あなたは政治的資本と神性の物語を世界中の隅々に広めます 党首"
 ce1_completed_my_holy_legend_desc_third_perspective: "[owner.GetTitledFirstName] は政治的資本と神性の物語を世界中に広めました。"
 ce1_completed_my_legitimizing_legend_desc: "私は過去の偉大な人物たちとの伝説的なつながりを語ることで、自分の使命を証明しました"
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "あなたは過去の偉大な人物たちとの伝説的なつながりを語ることで、その使命を証明しました"
 ce1_completed_my_legitimizing_legend_desc_third_perspective: "[owner.GetTitledFirstName] は過去の偉人との [owner.GetHerHis] 伝説的なつながりについて語ることで [owner.GetHerHis] の命令を証明しました。"
