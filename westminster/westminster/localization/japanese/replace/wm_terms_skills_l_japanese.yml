 investiture_crisis_desc: "神の納屋の鍵の所有者をめぐって対立し、世俗的な後援者は聖職者に杖と指輪を授けますが、教会は彼らの使命を認めません。"
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$は毎月ハーレムの病気の一員を探し出し、そのストレスや症状を和らげる。"
 kharijite_desc: "初期のイスラム教グループは、指導権は血統ではなく政治的資本に基づくべきであり、罪深い支配者は排除できると信じていました。彼らはシーア派の動乱の際に現れ、両陣営を拒否し、イスラム教外の重い罪人と宣言しました。"
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "この[modifier|E]は、解決を担当する[adventurer|E]が外交、陰謀、スタミナ判定のいずれかで解除できます。"
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier_desc: "この[modifier|E]は、解決を担当する[adventurer|E]が外交、学習、スタミナ判定のいずれかで解除することができます。"
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc: "この[modifier|E]は、外交、武力、またはスタミナの判定で解決する任務を負った[adventurer|E]によって除去される可能性があります。"
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier_desc: "この[modifier|E]は、外交、管理、またはスタミナの判定で解決する任務を負った[adventurer|E]によって除去される可能性があります。"
 laamp_base_4021_contract_scheme: "政策の仕事を作る"
 laamp_base_contract_schemes.0011.desc: "[employer.GetTitledFirstNamePossessive]評判が十分ではないことは周知の事実です。不満を持つ議員、専制的な行動についての心配なささやき、目に見えない存在感の欠如――これらは、多くの人が望むよりも権力の掌握が不安定になっている兆候[employer.Custom('LadiesLords')]。\n\nもちろん、誰かに誤解を解くよう頼むのは安くは得ません。少なくとも、私が何か言える限りはそうです。"
 laamp_base_contract_schemes.0331.d.tt.success: "政策はそれ自体が報酬です"
 laamp_base_contract_schemes.4042.desc: "[employer.GetCapitalLocation.GetTitle.GetName] での私たちの時間は非常に利益が大きいです！[employer.GetTitledFirstNamePossessive] との交易は暗黙の承認を与え、すべての巧妙な話術では成し得ない私たちの在庫への権限を与えます。\n\n護符、薬、装飾品、奇妙な小物 — スタッフもゲストもすべて購入し、質問されません。\n\nまだではありません。彼らの懸念が現れる頃には私たちはすでに長く去った後です。"
 laamp_boost_legitimacy_contract_contract: "委任統治の昇進"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] は [Localize( god )] を [ROOT.Legend.GetProtagonist.GetHerHis] の指導者として、公正かつ敬虔に統治しました。神聖な計画が成就すると、[ROOT.Legend.GetProtagonist.GetSheHe] は大いなる名誉と政治的資本に満ちた生活を送りました。"
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip]のために懸命に働き、地球で[ROOT.Legend.GetProtagonist.GetFaith.DevilName]の手先たちと戦ってきたが、ついに[ROOT.Legend.GetProtagonist.GetHerHis]闘いは終わった。神の計画が成就し、[ROOT.Legend.GetProtagonist.GetSheHe]偉大な名誉と政治的資本に満ちた人生を送った。"
 legend_shibi_chakravarti_desc: "謙虚さと政治的資本の模範である英雄的なシビ王は、鳥に変えられた賢者アグニを守る任務を負いました。凧が鳩を救うために自分の肉を犠牲にするよう要求したとき、シビは自らの全てを喜んで捧げましたが、命は助けられ、息子のカポタロマを授かりました。この自己犠牲の王の血が、すべての [GetDynastyByID('1043008').GetNameNoTooltip] の血管を流れています。"
 legendary_conversion_desc: "政治資本と献身の伝説的な物語が党員全員の心をつかみました。少しの励ましで、党内の非信者たちも私のように崇拝するようになる可能性があります。"
 legendary_holy_war_desc: "私の伝説的な政治的資本の物語は終わりを迎えました。そして真の信奉者に称賛される一方で、信じない者の心を動かすことはほとんどありませんでした。私たちは唯一知っている方法で平和的な道を広め続けなければなりません：剣によって。"
 legendary_integration_d_desc: "党内で語られる伝説は、私の支配の権威を固める。この新たに得られた委任は、党の核心領域と見なされるものを拡大し、歴史上異邦人である公爵に永続的な忠誠を要求するために活用できるかもしれない。"
