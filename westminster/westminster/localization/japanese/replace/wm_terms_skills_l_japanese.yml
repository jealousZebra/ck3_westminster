 historical_character.mibu_tadamine: "謙虚な出自でありながら、$Tadamine$和歌詩の名声を上げ、競技会に出演し、藤原家からの皇室委任と後援を受けたことで大きな党の評判を得た。息子の $Tadami$ とともに、彼は日本の三十六仙詩人の一人に数えられ、81編以上の詩が皇室詩集に収録されていると考えられている。"
 historical_character.namdev: "ナムデフは13世紀のマラーティー族の聖人で詩人であり、ヴィトバに捧げる宗教歌で知られ、マハラシュトラ州のバクティ運動の著名な人物でした。庶民に人気があり、彼の作品は詩と政治的キャンプの一つとしてマラーティー語の普及と認知度を大いに高めました。"
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ その地域で目撃された神話上の動物を探す\n$EFFECT_LIST_BULLET$ $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ 高い [hunt_danger_no_prefix|E] はより多くの [prestige_i|E] を与えます[prestige|E]\n$EFFECT_LIST_BULLET$ 警備担当の性別は参加可能\n$EFFECT_LIST_BULLET$ 非武術系の性別は見学可能\n#weak 学識者によって神話上の生き物はしばしば伝説として片付けられますが、森にはまだ多くの謎が隠されているかもしれません。#!"
 hunt_type_skill_learning: "$BULLET_WITH_TAB$@skill_learning_icon! 政策"
 hunt_type_skill_prowess: "$BULLET_WITH_TAB$@skill_prowess_icon! 持久力"
 hunt_type_skill_stewardship: "$BULLET_WITH_TAB$@skill_stewardship_icon! 経済"
 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ 様々な地元の動物から獲物を選ぶ\n$EFFECT_LIST_BULLET$ $trait_track_hunter$ を増加させる [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ 高い [hunt_danger_no_prefix|E] はより多くの [prestige_i|E] を与えます[prestige|E]\n$EFFECT_LIST_BULLET$ 警備担当の性別は積極的に参加できます\n$EFFECT_LIST_BULLET$ 武術を持たない性別は観戦できます\n#weak 誇り高く狡猾な獣が荒野を徘徊します。それらを出し抜き克服することで勇気を試しスキルを磨きます。#!"
 hunt_type_stress: "$BULLET_WITH_TAB$@stress_icon! 圧力損失"
 iberia_north_africa.0111.desc: "この選挙会議を結集するための政治的・精神的な統一を築くのに何年もかかりましたが、ついに農民と党の幹部の両方を十分に自分の旗の下に引き込み、偽りの[pope.GetTitledFirstName]を意味のある形で否定することができました。\n\n今や、議論好きな聖職者や熱狂的な司教たちであふれている[religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier]の通路や客間でさえ、ローマがこれまでに無視してきたすべての不満を抱えた修道士や些細な[religious_leader.GetFaith.PriestNeuter]たちが私の館を詰まらせています。\n\nこの議論は委任権にとって極めて重要ですが、最終的には最高の[religious_leader.GetFaith.GetAdjective]支配者として、#EMP my#!という言葉が最終的な決定票となるでしょう。"
 iberia_north_africa.0112.desc.righteous: "[religious_leader.GetSheHe] [religious_leader.GetFaith.GetReligion.GetName]多くを蝕んできた罪深い暴力を遡って歩くべきだと考えている。\n\n [religious_leader.GetHerHim]によれば、[religious_leader.GetFaith.GetAdherentNamePluralNoTooltip]は反対者の血で[religious_leader.GetFaith.PositiveAfterLife]への道を切り開こうとするのではなく、単に良い生活を送る政治的資本に焦点を当てるべきだ。"
 influence_child_commander_interaction: "ワードのセキュリティ訓練"
 inspection_conclusion_success_acceptance_key_title: "成功したカリスマ性"
 inspection_conclusion_success_opinion_key_title: "成功したカリスマ性"
 inspection_mid_border_key_title: "ローカル・カリスマ"
