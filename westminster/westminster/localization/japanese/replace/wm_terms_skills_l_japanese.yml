 dlc_015_desc: "旅行、アクティビティ、ライフスタイルなど、いくつかの愛されるシステムに新しいコンテンツをもたらします。富、知名度、個人的成長を追い求めるどんなスリリングな旅にあなたの支配者を送り出しましょう。彼らを放置しないでください — 冒険があらゆる曲がり角を待っています!"
 doctrine_imperial_anointment_desc: "疑いの余地なく皇帝として統治するには、ひざまずく必要があります。なぜなら、最も高い権威を持つ教会だけが、その最終的かつ疑いのない委任を与えることができるからです。"
