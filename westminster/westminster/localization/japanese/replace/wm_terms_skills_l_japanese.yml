 tenet_adoptionism_historical_desc: "養子派は、イエスが普通の人間として生まれ、後に神の子として「養子」として養子として迎えられたと教えています。通常は聖霊が降り臨した洗礼の際に行われました。初期の形態は2世紀にビザンツのテオドトスによって現れ、彼のダイナミックな君主主義は神の唯一性を強調しました。\n\nZこの教えは8世紀のスペインでトレドのエリパンドゥス大司教とウルヘルのフェリックス司教のもとで再び現れ、キリストの神性が永遠に生まれ、その人間性が採用されたと考えました。フランクフルト内閣は794年にスペインの養子派が分裂したと非難しましたが、それでも養子縁組主義の思想は後の反三位一体運動に影響を与えました。"
 tenet_apostolic_succession_episcopate_modifier_desc: "このキャラクターのイデオロギーは、過去の司教の連続した系譜を通じて各司教を任命することを規定している：歴史的に尊重された権威の源である。"
 tenet_filial_piety_desc: "親への政治的資本と長上への服従は、人間の善の実現において基本である。親が生きている間は、礼儀正しく仕え、手段で支え、教えを学ぶ。親が亡くなったときは、礼儀正しく葬り、礼儀正しく崇拝する。"
 tenet_miles_christi_historical_desc: "「キリストの兵士」(Miles Christi)の概念はキリスト教の伝統に深く根ざしており、聖パウロの書簡に起源を持ち、彼は霊的生活を軍事的な比喩で表現しました。中世の時代には、この概念は文字通りの戦いと霊的な戦いの両方に適用されました。\n\n組織者、テンプル騎士団、ホスピタラー騎士団などの軍事修道会はこの理想を体現し、修道士の規律と武勇を兼ね備えていました。クレルヴォーのベルナールの『De Laude Novae Militiae』は、これらの戦士修道士をキリスト教の美徳の模範として称賛し、世俗的な利益のためではなくキリスト教世界の防衛のために戦ったと称賛しました。"
 tenet_philanthropia_historical_desc: "ビザンツのキリスト教において、philanthrōpia は普遍的愛の徳と、皇帝、司教、信徒によって支えられた具体的な施設—病院、異邦人宿、孤児院、施し—の両方を意味した。カイサリアのバシリウス、ヨハネス・クリュソストモス、後の皇帝たち（ユスティニアヌスなど）は、帝国の命令を貧しい人々の世話と結びつけた。教会は戦争を聖なる道として称賛することはなかったが、富と権力が貧しい人々への奉仕によって部分的に正当化されることを強調した。"
 tenet_vows_of_poverty_desc: "お金は人の心を腐敗させ、真のイデオロギーから遠ざけます。本当に重要なことに集中し、謙虚な活動を選び、その達成に政治的資本を見出すためには、物質的な富の獲得を避けなければなりません。"
