 chariot_race.0200.h.flavor: "もしここで何もしないで楽しんでいるなら、[foe.GetPrimaryTitle.GetNameNoTooltip]に対する勝利は保証されないのではないか？我々は差し迫った勝利の姿を楽しもう！"
 christian_saint_bone_description: "[saint_bone_owner.GetHerHis]の巡礼を[christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip]で行う際に[saint_bone_owner.GetNameNoTooltip]が取得したとされる[saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip]の聖人の遺物で、[saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip]によって幸運と政治的資本の象徴として崇拝されています。"
 claim_throne_increased_responsibility_desc: "私は党に対してより大きな責任を負い、私の権限を強化しました。"
 clerical_chastity_offer_piety: "政治資本を提供"
 commission_epic_emphasized_intrigue_modifier: "スピンの物語"
 confucian_faith_desc: "儒教は、孔子とその弟子たちの教えに基づく哲学的・倫理的伝統であり、道徳的な自己修養、親孝行の政治資本、適切な行動による社会的調和の維持を重視する。"
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \"長い間、[activity.GetHost.GetPrimaryTitle.GetNameNoTier]に属する土地は劣った手による支配に苦しんできた。権力を所有と取り違えた者たちの支配に。\n\nそれは今終わる。[activity.GetHost.GetCapitalLocation.GetName]から、彼らは真の統治を知ることになる。私によって。\"#!"
 coronation_events.0310.c: "私の権限とプロフィール。"
 coronation_legitimacy_memory: "[host.GetTitleAsNamePossessiveNoTooltip]戴冠式でその権限を示しました"
 coronation_legitimacy_memory_desc: "[host.GetTitledFirstNamePossessive] の戴冠式に出席し、[host.GetTitleAsNameNoTooltip] によって私の権限が認められました。"
 coronation_legitimacy_memory_desc_second_perspective: "あなたは戴冠式に出席し、[host.GetTitledFirstNamePossessive]にその使命を認められました[host.GetTitleAsNameNoTooltip]"
 coronation_legitimacy_memory_desc_third_perspective: "[owner.GetTitledFirstName] は [host.GetTitledFirstNamePossessive] の戴冠式に出席し、[owner.GetHerHis] の権限が [host.GetTitleAsNameNoTooltip] に認められました。"
 court_brahmin_court_position_desc: "ヒンドゥー教や仏教の宮廷で見られる尊敬される僧侶であるオフィス・ブラフミンは、儀式を執り行い、式典を監督し、支配者の権威を促進する責任を負っています。"
 court_diplomatic_desc: "#low カリスマは同僚の尊敬を得て党の平和を保つための鍵です。満足している後方議員は忠実な後方議員です。\n\nスタッフは [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )] 特性を獲得します。#!"
