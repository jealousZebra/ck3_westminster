 tradition_chivalry_desc: "この文化は、行動を規制する社会的手段として騎士道と騎士道的行動規範を受け入れてきた。安全保障の能力、義務、名誉、道徳が重視され、悪い詩やロマンチックな文学も同様に評価される。"
 tradition_martial_admiration_name: "セキュリティへの敬意"
 tradition_tgp_fortified_strongholds_desc: "この文化は、宗教、軍事、政府の機能を果たす大きな要塞化された都市が特徴である。これらの文化的拠点の保護は重要であり、さらなる都市の基盤は注目度の高い問題である。"
 tradition_tgp_warrior_monks_desc: "道徳的に生きることへの忠誠心は、特に宗教共同体を対立する宗派や腐敗した役人から守ったり、困窮者を守る必要がある場合には、武力行使を排除すべきではありません。"
