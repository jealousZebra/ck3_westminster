 mongol_invasion.1004.desc: "モンゴルに支配されたすべての土地の支配者である強大な[old_mongol_emperor.GetFirstName]の死とともに、いくつかの後継者が大ハーンの座を奪おうと叫[old_mongol_emperor.GetHerHis]。誰一人として他の者の使命を認めようとしない。\n\nこうしてモンゴルは統一帝国として終焉を迎える。\n\n最初の偉大な征服者の子孫たちはまだ力を保っている。彼らは戦争を呼びかける。しかし、誰一人として、[successor_1.GetName]も[successor_2.GetName]も、宇宙全体の支配者として他者たちを凌駕している者はいない。"
