 efg_contested_wrath_desc: "我々の組織者を使って、ライバルの皇帝に対する我々の帝国の権限を布教することは、戦士たちを鼓舞し、民衆の尊敬を勝ち取る。"
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] は個人的に私の即時任命を帝国の勅命によって命じました。誰も新しい地位の命令に挑戦することはできません、[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] において。"
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip]軍は私の優れた武器には敵わず、[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]の名のもとに州を守るという私のより大きな使命を証明した。"
 ep3_decisions_event.0007.desc: "それで[Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )]は再びなだめられた。私の力と権限は再確認された。\n\n"
 ep3_decisions_event.9010.desc: "深く息を吸い込み、吐きながら釣り糸を水に投げる。釣り針が静かな「ポン」と音を立てて落ち、世界は静寂に包まれる。\n\n私の視界は海岸線に沿ってさまよい、一人で考えを整理するひとときを過ごしている。冒険者としての生活はそれほど悪くはないが、どんなプレッシャーもない人生はない。休もうと目を閉じたその時、突然何かが釣り竿を手から引き離して目を覚ました。"
