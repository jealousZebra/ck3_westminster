 ep3_governor_yearly.3040.a.flavor: "そのような孝行的な政治資本は、私たち二人を強くするだけだ。"
 ep3_governor_yearly.3040.desc: "――[emperor.GetPrimaryTitle.GetName]本当に、高貴な[emperor.GetTitledFirstName]が笏を取る前の完全な闇と無秩序[emperor.GetHerHis]だったのだろうか?\n\n社交界の人々は、ただの仲間の存在以外の何かを夢見ている[emperor.GetHouse.GetName]だろうか?我々の兵士たちは醜く、意味不明な見知らぬ者の名前を唱えていたのか?我らの大貴族たちは――[ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip]の完璧な肉体でできていない足にキスをする気があったのか?\n\nI本当に思い出す必要はない。私の主権者の確かな使命を疑うことは無駄だろう。"
 ep3_governor_yearly.8070.desc: "栄誉、プロフィール、権力。[ROOT.Char.GetTitleAsNameNoTooltip]になるとこれらのものが手に入るかもしれないが、#EMP には#!代償がある...\n\n山のような[ROOT.Char.Custom('GetWritingMaterial')]が私の印や目を通すのを待って丸まって座っている一方で、途切れのない官僚たちが耳を麻痺させる詳細で順番を争っている。\n\n誰もこれほど#EMP 多くの#!仕事があるとは教えてくれなかった—しかも最終的には勝手に進む仕事だ。"
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "数十年にわたり、私は知識人の足跡をたどり、人々の怒りに立ち向かってきました。私の詩は党のブランドとして着実に成長してきましたが、それでも…\n\n何かが欠けています。今、黄昏の年が訪れた今こそ、[cordoba.GetName]を離れ、世界を広く見渡す時かもしれません。\n\n私の別の不可分の一部が、心にここに留まるように引き続けています。私はここで、自分自身だけでなく、ここ数年間に訓練された多くの徒弟のために人生を築いてきました。\n\n学者たちが歩む街路や、なじみ深い壁のパティーナのせいであれ、#EMP 何か#!が私をこの都市、私の家に結びつけています。"
