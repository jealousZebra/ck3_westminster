 game_rule.1101.desc.combat.locale.southwark: "イングランドで最も裕福な都市がすぐ近くにいる今、戦うべきものはすべてある。家であれ戦利品であれ、栄光であれ政治的資本であれ、両軍は何度も激突する。\n\nテムズ川の南岸は我々の血で泡立つが、私は諦めない、決して#!を屈#EMP しない。\n\nイングランドはすでに私のものだ。この戦いがそれを証明するだろう。そして必要なのは最後の#EMP #!を押すことだけだ—"
 generic_rite_focus_tenet_cranial_trophies: "このイデオロギーは敵の遺体を勝利の神聖な証、そして恐ろしいプロフィールとして扱います。"
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] は敵の遺骸を勝利の神聖な証と恐ろしいプロフィールとして扱います。"
 glory_hound_desc: "$glory_hound$ [vassals|E] 立場やプロフィールを気にし、自分が所属する党の強さを世界に示すことを重視する。大胆または無情な後方議員はしばしばこの [vassal_stance|E].\n\n#low $glory_hound$ 後方議員は党首が次のことを行うと喜ぶ：#!\n$EFFECT_LIST_BULLET$ いずれかの分割 [succession_law|E]\n$EFFECT_LIST_BULLET$ 攻撃的 [victory|E] を達成 [wars|E]\n$EFFECT_LIST_BULLET$ 招待 [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ 後方議員は党首が次のことを行うと嫌う：#!\n$EFFECT_LIST_BULLET$ 高い [crown_authority|E]\n$EFFECT_LIST_BULLET$ 戦争で [defeat|E] または [white_peace|E] に署名 \n$EFFECT_LIST_BULLET$[marries|E] [lowborn|E] というキャラクターとして [primary_spouse|E]\n\n 大胆で勇敢な [heirs|E] 高い [martial_i][martial|E] スキルを持つことを好む。"
 grand_ambitions.0180.desc: "私は自分の民の精神的指導者である[hof.GetTitleAsName]の前に立っている。空気は線香と何世紀もの重みで重く感じられる。\n\n[hof.GetHerHis]の好意を得ることは、私の[target_title.GetName]に対する主張に権威を与えるだけでなく、帝国内の信徒の心を揺さぶる可能性がある。[hof.GetSheHe|U]は私に王冠を授けなければならない。\n\n[hof.GetTitleAsNameNoTooltip]は単なる精神的な存在ではない；[hof.GetSheHe]は[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]という世俗的な策略に鋭く気づいている。"
