 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U]は私たちのイデオロギーの価値をうまく維持しておらず、そのために[target.GetNameNoTier]の[puppet_or_actor.GetFaith.GetAdherentNamePlural]が苦しんでいます。[secondary_recipient.GetHerHis]の誤った支配からその地を解放することにあなたの祝福を与えていただけますか？"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "熱意は羨ましいが、我々のイデオロギーを勝利に導きたいなら現実的でなければならない。聖戦の標的に[target.GetNameNoTier]る方が賢明ではないか?"
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "、自分の過ちを認め、自分の過ちを悔い改めた上で、破門を解除していただき、イデオロギーの兄弟姉妹たちに再び合流できるようお願い申し上げます。"
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "\n私は良い[puppet_or_actor.GetFaith.GetAdherentName]であろうと努力していますが、他の[actor.GetWomanMan]と同様に完璧ではありません。私のつまづきや失敗を補うために、この資金を教会に寄付したいと思います。\n\nさらに、すべての罪を避けることを誓います。"
 RETRACT_VASSAL_PROPOSAL: "、[secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip]の利益のために、[recipient.GetFullName]を私の直接の権限下に置くべきだと結論づけました。"
