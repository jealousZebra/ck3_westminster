 piety_level_7_desc: "$piety_level_7$ は7番目の[piety_level|E]です。次のレベルは[GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]です。\n\n[mandala|E] [ruler|E]が[aspect|E]に受け入れられる方法で死亡すると、[GetModifier( 'piety_level_6' ).GetNameWithTooltip|L]に到達した後、その支配者の[heir|E]はこの政治資本レベルに進む能力を発展させます。\n\n効果：\n[GetPietyLevelDesc('(int32)7')|=+]"
 piety_level_8_desc: "$piety_level_8$ は、[mandala|E] [government|E] のための 8 番目で最高の [piety_level|E] です。\n\n[mandala|E] [ruler|E] が [aspect|E] に受け入れられる方法で死亡すると、[GetModifier( 'piety_level_7' ).GetNameWithTooltip|L] に到達した後、その統治者の [heir|E] はこの究極の政治資本レベルに進む能力を発展させます。\n\n効果:\n[GetPietyLevelDesc('(int32)8')|=+]"
