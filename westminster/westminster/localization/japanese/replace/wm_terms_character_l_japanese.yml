 ally_at_court_opinion: "オフィスのアリー"
 backwater_county_modifier_desc: "大きいほど、倒れるのは難しくなります。かつてはヘラスの容赦ない支配者の領域だったこの選挙区は、悲しいことに名誉を失いました。現在はかつての影のような存在ですが、この選挙区は再び偉大さを迎えるかもしれません。\n\n#X @warning_icon!この修正値は、この[county|E] [development|E]が50#!以上#V たら、[GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E]で解除される可能性があります!#!\n\n"
 barons_and_minor_landholders_disapproves_baron_revocations_opinion: "[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName] 保護区域の取り消しに反対"
 celestial_bureaucracy_0_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 下位議員の [titles|E] は [realm|E]#! 以外のキャラクターが継承できません"
 celestial_bureaucracy_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 非[governor|E]の[vassals|E]は、自分の[liege|E]#!に[hook|E]を使用しない限り、他の議員席に対して[war|E]を行うことはできません。"
 celestial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 支配者は利用可能なすべての[succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline 間で変更できます：3 タイトルの取り消しや議員席の撤回を拒否するすべての議員席は、[criminals|E]#!\n$EFFECT_LIST_BULLET$#high として扱われ、$demand_admin_interaction$#!のコストが減少します。"
 char_interaction.0001.desc: "あなたの寛大な臣従の申し出を受け入れます。私の党首！"
 char_interaction.0002.desc: "あなたの保護は必要なく、私は自分の党の賞金を自分のものとして保持したいです。"
 char_interaction.0010.a: "私の党首！"
 char_interaction.0090.from_ward.desc: "あなたのオフィスでの教育がもはや私の必要に合わないことを恐れます。私は直ちに[capital.GetNameNoTierNoTooltip]に戻ります。"
 char_interaction.0090.one_ward.desc: "あなたのオフィスでの[ward.GetTitledFirstName] の教育がもはや私たちの必要に合わないことを恐れます。[ward.GetSheHe|U] はここに私たちの管理下に召還されます。"
 char_interaction.0090.two_wards.desc: "あなたのオフィスでの[ward.GetTitledFirstName] と [ward_2.GetTitledFirstName] の教育がもはや私たちの必要に合わないことを恐れます。ここに彼らを私たちの管理下に召還します。"
 char_interaction.0180.desc: "議会の指導者として、あなたは [puppet_or_actor.GetFaith.GetName]、唯一の真のイデオロギーを受け入れなければならないと決めました。恐れ入りますが、この件に関して選択の余地はありません。"
 char_interaction.0180.desc.liege: "あなたの党の党首として、偽のイデオロギーを放棄し、すぐに私と共に [puppet_or_actor.GetFaith.GetAdherentName] の仲間として参加することを要求します。"
 char_interaction.0181.desc: "わかりました、[puppet_or_actor.GetFaith.GetAdjective] イデオロギーを受け入れますが、多くの慣れ親しんだものを手放すのは奇妙に感じるでしょう。"
 char_interaction.0182.desc: "私は自分のイデオロギーを決して捨てず、代わりに自分の家を築く！"
 char_interaction.0190.desc: "わかりました、[puppet_or_actor.GetFaith.GetAdjective] イデオロギーを受け入れますが、多くの慣れ親しんだものを手放すのは奇妙に感じるでしょう。"
 char_interaction.0191.desc: "私のイデオロギーは私の存在の核心にあります — 決してそれを捨てません。"
 char_interaction.0200.desc: "私は、あなたに[landed_title.GetName]の尊厳と責任を託すことはできないと結論づけました。したがって、党の大義のために、今後この称号を剥奪します。"
 char_interaction.0211.desc: "あなたの私に対する[secondary_recipient.GetShortUIName]を後援者にしてくださるという寛大な申し出には本当に感謝するが、残念ながら辞退せざるを得ない。"
 char_interaction.0220.desc: "私のバックベンチャー、[secondary_recipient.GetShortUIName] の撤回を受け入れます。とはいえ不当だと思います。"
 char_interaction.0221.desc: "[secondary_recipient.GetShortUIName] の忠誠の誓いを裏切ることはできません。私はバックベンチャーを守ります、たとえあなたに対する誓いを破ることになっても。"
 char_interaction.0232.liege: "我々の党首が[actor.GetHerHis]の忠実な後援者を虐待している間、私は傍観しない。この暴君を打倒する戦いにあなたも参加することを促す。"
 char_interaction.0232.regent: "[actor.GetSheHe]が[ceremonial_liege.GetTitledFirstNamePossessive]の忠実な後援者を虐待している間、私は傍観しない。この暴君を打倒する戦いにあなたも参加することを促す。"
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n私はあなたにとって良い後方座席の生徒であったが、もちろん私にも自分の科目があることは理解しているでしょう！\n\n私の現在の契約は非常に制限が多いので、もっと柔軟にすることの賢明さを理解してくれるでしょう？\n\nそれに、あなたは私に借りがあるのです！#emphasis#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n私たちの奉仕と[recipient.GetPrimaryTitle.GetNameNoTooltip]への敬意を認めて、私はあなたがその献身を尊重し[SCOPE.Custom('CelestialTributaryRequest')]を与えてくださるようお願い申し上げます。\n\nこの恩恵が、あなたの玉座と私たちの控えめな党との間の調和を強化しますように。"
 char_interaction.0271.desc: "私に[intermediary.GetTitledFirstName]から与えられた職務の権限により、党の境界における些細な矛盾を正す。\n\n あなたは正当な党首に[intermediary.GetTitledFirstName]の属国を降伏する[intermediary.GetHerHis]命じられている。私だ。"
 char_interaction.0272.desc: "あなたは権限の範囲を超えましたが、私の [intermediary.GetTitleAsName] の職務を拒めません、それが #EMP あなた#! が行使するだけであっても。\n\n 私はあなたのバックベンチャーからの撤回を受け入れます。"
 char_interaction.0273.desc: "私は自分の後援者を守ることを誓った、そしてそれには#EMP のような者からも守ることが含まれる#!。\n\n戦いで[intermediary.GetTitledFirstName]や[intermediary.GetHerHis]の土地を私から奪うこともできるし、[recipient.GetFaith.random_GoodGodNames]に見捨てられた穴に戻ることもできる。"
 char_interaction.0282.desc: "私の行動とは違い、あなたの要求は犯罪的です。\n\n党のために従いますが、この侮辱を忘れることは決してありません。"
 char_interaction.0291.a: "私の党首が最善を知っていると確信しています。"
 char_interaction.0291.desc.negative: "#! #EMP 何もできないのか?この国で一番の鈍い愚か者でさえ、[recipient.GetTitledFirstName]に集中すべきことじゃないと気づくだろう。優秀な後方議員をいじめるのはやめて、自分の仕事をしろ。"
 char_interaction.0370.a.herder: "パーティーをまとめておくべきだった。"
 church_authority_0: "自律的党職員"
 church_authority_0_effects_not_in_prev: "#weak 事務的な後方議員は [levies|E] と [taxes|E] を提供しますが、広範な自主権を保持します。#!"
 church_authority_2_effects: "$EFFECT_LIST_BULLET$統治者は神権政治を確立できる [dynasty|E]\n$EFFECT_LIST_BULLET$[vassals|E] 他のバックベンチャーに対して [war|E] を行うことはできない。ただし、[hook|E] を [liege|E] に使用する場合を除く\n$EFFECT_LIST_BULLET$バックベンチャーの [titles|E] は [realm|E] 以外のキャラクターに継承されない\n$EFFECT_LIST_BULLET$タイトルの剥奪やバックベンチャーの撤回を拒否したすべてのバックベンチャーは [criminals|E] と見なされる\n$EFFECT_LIST_BULLET$A [christian|E] [head_of_faith|E] は [GetDecision('enact_a_bull_decision').GetName] [decision|E] を使用して [great_holy_war|E] を宣言できる\n$EFFECT_LIST_BULLET$[GetDecision('pam_establish_theocratic_dynasty_decision').GetName] [decision|E] を使用できる\n$EFFECT_LIST_BULLET$[subordinates|E] 世俗的な [rulers|E] は [puppet|E] が容易である"
 church_claim_de_jure_liege_modifier: "名義上はバックベンチャー(後方議員)の称号を主張しました"
 claimant_faction_member_opinion: "王座に就く党首"
 convert_to_religion_interaction: "イデオロギーを採用する"
 council_interaction.0001.desc.accept: "私は新しい責務を果たすための仕事を直ちに始め、次の閣議でお会いする！"
 county_capital_province_modifier: "選挙区の首都"
 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "私たちは何時間も身だしなみや身だしなみの法則について議論し、オフィスのほとんど誰も知らない古い法律を引用しながら激しく身振りを交わしていたに違いない。見世物の煙が晴れると、"
 court_amenities_interactions.0002.desc_lost: "自分が実際に法律に違反していることにショックを受けました！\n\n [debate_locale.GetNameNoTierNoTooltip] の城の警備員とスタイリストに下着まで脱がされ、その後も脱がされ続けました！ オフィスで晒され、私は自尊心を腿に挟んでその場を逃げます。"
