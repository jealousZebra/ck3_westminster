 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "ついに！[faction_target.GetName]は道化が[faction_target.GetTitleAsNameNoTooltip]を演じているに過ぎず、党が私の支持に立ち上がると確信している。私を助ける者は忘れられないだろう。"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] は本来あなたのものであるべき玉座に座っています！私は言葉と剣であなたの権利を支持する用意がありますし、党内の他の人々もこの正当な主張を擁護してくれると確信しています。あなたがするべきことは、受け入れることだけです。"
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "ついに！[faction_target.GetName]は道化が[faction_target.GetTitleAsNameNoTooltip]を演じているに過ぎず、党が私の支持に立ち上がると確信している。私を助ける者は忘れられないだろう。"
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] は本来あなたのものであるべき玉座に座っています！私は言葉と剣であなたの権利を支持する用意がありますし、党内の他の人々もこの正当な主張を擁護してくれると確信しています。あなたがするべきことは、受け入れることだけです。"
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "ついに![faction_target.GetName]はただの道化師で、[faction_target.GetTitleAsNameNoTooltip]を演じているだけだ。きっと党は私の味方になるだろう。\n\n今の卑しい立場には、助けられない。だが覚えておけ――#!が勝利したら、私はあなたに十分な報酬を与える#emphasis!"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "偽りの [faction_target.GetTitledFirstName] に対して党が立ち上がるのを見ることができるのは嬉しいですが、現在の私の状況ではこの正義の活動に参加することができません。もし成功すれば、私はあなたに借りがあります。"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "私には明らかです。あなたはこの愚かな試みをあきらめる前に、党が燃えるのを見たいのでしょう。党のために、私はあなたの要求を受け入れなければなりませんが、今日ここで大きな不正が行われたことを知っておいてください。これは許されません！"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "あなた方はこの愚かな試みをあきらめる前に党が燃えるのを見るだろうということは私には明らかだ。[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]のために私はあなた方の要求を受け入れなければならないが、今日ここで大きな不正が行われたことを知ってほしい。これは容認できない！"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nあなたの誤った要求は、私たち全員を弱体化させるだけです。それでも党を無駄な流血から守るため、私はあなたの独立要求を受け入れざるを得ません。"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "あなた方はこの愚かな試みをあきらめる前に党が燃えるのを見たいのだということは私には明らかだ。[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]のために私はあなた方の要求を受け入れなければならないが、今日ここで大きな不正が行われたことを知っていてほしい。これは容認できない！"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n党の忠実な臣民たちは、あなたの誤った政策にあまりにも長く耐えてきました。[faction.GetName] あなたが[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]の新しい方向性に同意することを要求します。さもなければ、私たちがあなたに押し付けます！"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "時が来た！[faction_target.GetTitledFirstNamePossessive]の誤った政策を中止することを支持する全ての者は今こそ一つになり、党が新たな方向へ舵を切ることを確実にしなければならない。必要なら剣と火でそれを成し遂げるのだ！"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nあなたの誤った要求は、私たち全員を弱体化させるだけです。それでも党を無駄な流血から守るため、私はあなたの独立要求を受け入れざるを得ません。"
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nあなたの『自由』に対する利己的な考えは、党全体を弱体化させるでしょう。しかし、無意味な流血を避けるため、私はあなたの要求を受け入れます。"
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n もはや、あなたのバックベンチャーたちの古代からの不可侵の権利を認める時です！[faction.GetName]の要求を受け入れるか、戦場で我々の剣に直面してください！"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "いいだろう!私の一行にはお前の洗われていない家畜の居場所はない。"
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "我々はもはや誇り高き者たちの卑劣な[peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]の抑圧を容認しない。この開かれた空の下で自由に歩き回るために生まれた我々は、君の専制を拒絶する――我々の時は近い!\n\n我々は、あなたとあなたの党首、[faction_target.GetTitledFirstName]の支配を完全に捨て去ろう!!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "我々はあなた方の[ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)]支配によるさらなる抑圧を許さない。[peasant_leader.GetRite.GetName|U]は[ROOT.Char.GetPrimaryTitle.GetName]の卓越した[rite|E]として認められなければならない!\n\n 我々のイデオロギーに正当な地位を与えよ、さもなければ多くの信者の怒りに直面する覚悟をせよ!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "私たちはもはやあなたの善[peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]の卑劣な抑圧を許しません。私たちの時は今こそ来ました!\n\n私たちはあなた方の支配と党首の専制から解放されます、[faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "私たちはもはや[peasant_leader.GetCulture.GetName]伝統に対する外国からの抑圧を許しません。今こそ私たちの時が来ました!\n\n私たちは、あなたの党首[faction_target.GetTitledFirstName]から完全な自由以外は求めません!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "私たちは、もはやあなたの信徒[peasant_leader.GetFaith.GetAdherentNamePlural]の卑劣な抑圧を許しません。私たちの時は今こそ来ました!\n\n [peasant_leader.GetFaith.WarGodName]導き、私たちは立ち上がり、あなたの党首[faction_target.GetTitledFirstName]支配から解放します!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N もし党首が要求に屈すれば、あなたのパーティの一部を失うことになります!#!"
