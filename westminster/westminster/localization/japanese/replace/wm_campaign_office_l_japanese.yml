 baggage_train_scribes_domicile_building: "広報担当者"
 baggage_train_scribes_domicile_building_desc: "#weak([GetDomicileBuilding('baggage_train_01').GetName]必要)#!\nPress リリース、編集者への手紙、誰かが質問する前に作成した声明。"
 baggage_train_shrine_domicile_building: "静かな部屋"
 baggage_train_shrine_domicile_building_desc: "#weak([GetDomicileBuilding('baggage_train_01').GetName]必要)#!\n祈ったり、考えたり、単に電話から離れて10分間過ごしたりする場所。"
 baggage_train_siege_engineers_domicile_building: "デジタルチーム"
