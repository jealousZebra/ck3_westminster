 head_porter_camp_officer: "物流コーディネーター"
 head_porter_camp_officer_desc: "$head_porter_camp_officer$はオフィス、箱、そして人々を無事に次の町まで移送します。"
 heavy_cavalry_captain_camp_officer: "バトルバス隊長"
