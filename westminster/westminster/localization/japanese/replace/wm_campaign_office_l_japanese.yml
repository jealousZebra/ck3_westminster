 camp_purpose_wanderers: "党の活動家"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$あらゆる種類の仕事が提供され、他のどれよりも多い仕事はありません\n$EFFECT_LIST_BULLET$別の$camp_purpose$に変更することが可能で、[prestige|E]を消費する必要はありません\n\n#WEAK 片方のポケットにビラを、もう片方に会員カードを持ちながら、まだすべてがどこへ導くのかは分かりません。#!"
