 barber_tent_surgeons_tools_domicile_building: "応急処置キット"
 barber_tent_surgeons_tools_domicile_building_desc: "#weak([GetDomicileBuilding('barber_tent_01').GetName]が必要)#!\nZの手紙箱用と犬の噛み傷用の氷嚢を適切に備蓄してください。"
 barber_tent_torturers_tools_domicile_building: "模擬面接室"
 barber_tent_torturers_tools_domicile_building_desc: "#weak([GetDomicileBuilding('barber_tent_01').GetName]が必要)#!\n一つの椅子、明るいランプ一つ、そして敵対的なプレゼンターをあまりにも上手く演じるスタッフ。"
 camelry_captain_camp_officer: "農村チームリーダー"
