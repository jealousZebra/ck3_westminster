 camp_fire_juicy_rumors_domicile_building: "ジューシー・ルーマーズ"
 camp_fire_juicy_rumors_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] が必要)#!\nオフレコで言われたことはどこかに必ず伝わります。ここに伝わる方が良いでしょう。"
 camp_fire_libations_for_the_lost_domicile_building: "敗れた者のためのドリンク"
 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] が必要)#!\n議席を失った人のためのパイントと、それらを取り戻す約束。"
