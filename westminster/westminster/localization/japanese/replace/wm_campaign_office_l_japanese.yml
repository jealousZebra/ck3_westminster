 camp_fire_trailing_musicians_domicile_building: "オフィスプレイリスト"
 camp_fire_trailing_musicians_domicile_building_desc: "#weak([GetDomicileBuilding('camp_fire_01').GetName]が必要)#!\nある人のスピーカー、誰かのプレイリスト、そして封筒詰め物を乗り越える士気。"
 camp_fire_wandering_poets_domicile_building: "言葉の師匠たち プレッシャーを少し"
 camp_fire_wandering_poets_domicile_building_desc: "#weak([GetDomicileBuilding('camp_fire_01').GetName]必要)#!\nPeople。チラシを歌わせたりスローガンスティックを作ったりできます。"
 camp_main_01_domicile_building: "キャンペーン本部"
 camp_main_01_domicile_building_desc: "事務所自体：最初は賃貸の部屋、その後はハイストリートの店舗、そして各机に電話がある本格的な本部。"
 camp_move_desc: "Moving your [camp|E] to another town brings new [task_contracts|E] and new doors to knock on.

#weak Moving far puts you out of reach of your [contact_list_contacts|E], so call in any favours first.#!

#P Click to move your Campaign Office#!"
