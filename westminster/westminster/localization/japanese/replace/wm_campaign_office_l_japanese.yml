 camp_perimeter_01_domicile_building_desc: "ドア、電話、怒っている有権者に出る人、その順番で。"
 camp_perimeter_camp_hygiene_domicile_building: "クリーニング・ロタ"
 camp_perimeter_camp_hygiene_domicile_building_desc: "#weak（[GetDomicileBuilding('camp_perimeter_01').GetName]が必要です）#!\n冷蔵庫は毎週金曜日に清掃されます。それは法律です。"
 camp_perimeter_ditch_domicile_building: "ボラード"
 camp_perimeter_ditch_domicile_building_desc: "#weak([GetDomicileBuilding('camp_perimeter_01').GetName]が必要)#!\n 誰もオフィスのドアの前にバンを2回停めます。"
 camp_perimeter_extra_watch_domicile_building: "ドアエントリーシステム"
 camp_perimeter_extra_watch_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_perimeter_01').GetName] が必要)#!\nブザー、カメラ、そして誰が来るかのリスト。"
 camp_perimeter_fixed_layout_domicile_building: "ホットデスクプラン"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak（[GetDomicileBuilding('camp_perimeter_01').GetName]が必要です）#!\n同じ机、同じローテーション、オフィスがどこに移動しても。誰もが何がどこにあるかを知っている。"
 camp_perimeter_good_siting_domicile_building: "ハイストリート正面"
 camp_perimeter_good_siting_domicile_building_desc: "#weak([GetDomicileBuilding('camp_perimeter_01').GetName]が必要)#!\nバス停とスーパーのそばで、みんな窓の前を通り過ぎる。"
 camp_perimeter_palisade_domicile_building: "シャッター"
 camp_perimeter_palisade_domicile_building_desc: "#weak([GetDomicileBuilding('camp_perimeter_01').GetName]が必要)#!\n日没後のシャッター:選挙の夜も窓が無事に耐える。"
 camp_priest_camp_officer: "福祉担当官"
 camp_priest_camp_officer_desc: "$camp_priest_camp_officer$はチームを管理します: 話を聞く耳、こっそり言葉をかけ、誰が燃え尽きているかに目を配ります。"
 camp_purpose: "政治的焦点"
 camp_purpose_brigands: "メディア評論家"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$さらなるメディアラウンドと対立調査を提供\n$EFFECT_LIST_BULLET$すべての仕事をうまく行うと追加報酬が得られます [prestige|E]: さらなる放送時間\n$EFFECT_LIST_BULLET$解除[camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$特定の特殊なものにアクセス可能 [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak ($supply_tent_subdued_gear_domicile_building$を介して解除)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak ($baggage_train_ransom_cages_domicile_building$を介して解除)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak ($proving_grounds_lockwagon_domicile_building$を介して解除)#!\n\n#WEAK どのチャンネルでも、どの時間でも、どのテーマでもコメント可能。#!"
 camp_purpose_confirmation_button_text: "焦点を変更"
 camp_purpose_explorers: "草の根オーガナイザー"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$より多くの訪問キャンペーン、電話キャンペーン、投票促進の仕事が提供される\n$EFFECT_LIST_BULLET$家の間をより速く移動する\n$EFFECT_LIST_BULLET$解放される[camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK どの通りにもまだノックされていないドアがあります。#!"
 camp_purpose_legitimists: "党のフィクサー"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$党の内部仕事をさらに提供：スピーチライティングとリサーチ\n$EFFECT_LIST_BULLET$すべての仕事をうまくこなすと党の評価が上がる\n$EFFECT_LIST_BULLET$解除[camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$特定の特別な [officers|E]にアクセス可能:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak ($baggage_train_proof_of_claims_domicile_building$を通じて解除)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak ($proving_grounds_lockwagon_domicile_building$を通じて解除)#!\n\n#WEAK 誰かが投票前に票を数え、誰が誰に借りがあるかを知る必要がある。#!"
 camp_purpose_mercenaries: "キャンペーンコンサルタント"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$さらなる資金調達、電話バンク、およびコスト計算の仕事を提供\n$EFFECT_LIST_BULLET$すべての仕事をうまく行うと追加報酬が得られます [gold|E]: 請求書\n$EFFECT_LIST_BULLET$解除[camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$特定の特殊なものにアクセス可能 [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak ($baggage_train_siege_engineers_domicile_building$を介して解除)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak ($proving_grounds_lockwagon_domicile_building$を介して解除)#!\n\n#WEAK 戦略、データ、日額報酬。結果は保証されませんが、請求書は保証されます。#!"
