 baggage_train_kennel_domicile_building: "オフィスドッグ"
 baggage_train_kennel_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName]が必要)#!\n士気には良いが、写真撮影にはさらに良い。"
 baggage_train_negotiators_domicile_building: "評判管理者"
