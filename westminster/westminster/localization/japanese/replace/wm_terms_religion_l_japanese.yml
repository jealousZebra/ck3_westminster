 doctrine_pluralism_fundamentalist_desc: "私たちのイデオロギーは唯一の真のイデオロギーであり、私たちの言葉は唯一の真の言葉です。[ROOT.Faith.ReligiousText] からの逸脱は、本質的に冒涜です。"
 doctrine_sacraments_absent_desc: "この伝統は、秘跡や公式な神聖イデオロギーの体系を強調しません。宗教生活は、党の役員による儀式の執行や特定の式典の重要性に中心を置くものではありません。"
 doctrine_sacraments_general_desc: "イデオロギーは秘跡や神聖なイデオロギーに中心的な重要性を与えます。儀式は単なる象徴的なものではなく、神の存在を呼び起こすものです。党の役人がそれらを執り行い、信者は破門されることがあります。"
 doctrine_spiritual_head_desc: "物理的な世界と霊的な世界は同じではない。私たちは霊的な世界に独自の指導者を立て、私たちを導き、物質的な欲望によってイデオロギーが冒されないように守らなければならない。"
 doctrine_status_mainline: "主な政策立場"
 doctrine_status_rite: "イデオロギー政策の立場"
 doctrine_status_rite_mainline: "主な政策立場"
 doctrine_temporal_head_desc: "精神的なものと物理的なものは本質的に結びついており、一体であり分離できません。1つの党に2人の異なる指導者を置くことは愚かです。"
 doctrine_theocracy_lay_clergy_desc: "忠実な支持者なら誰でも、私たちの理念の政策立場を理解し、従い、説くことが十分に可能である。"
 doctrine_theocracy_lay_clergy_name: "党の幹部を非専門職で配置する"
 doctrine_theocracy_temporal_desc: "公認された[ROOT.Faith.PriestNeuterPlural]だけが、私たちのイデオロギーの政策立場を守り、ひいては神聖な場所の管理と世話を任せられます。"
