 doctrine_monasticism_forbidden_desc: "このイデオロギーは明確に出家生活を否定しています。誓願を立てることは禁じられており、出家の特性を持つ者はこのイデオロギーの目には犯罪者と見なされます。"
 doctrine_mythic_literary_desc: "このイデオロギーは神聖な業績の物語を通じて広まり、多くは文学作品にまとめられています。"
