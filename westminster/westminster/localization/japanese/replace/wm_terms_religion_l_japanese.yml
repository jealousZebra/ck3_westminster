 global_religion.1000.desc_any_counties: "Religious persecution is rife in the [target_rite_associated_county.GetName], where the [target_rite_associated_county_rite.GetAdjective] nobility is forcibly converting followers of [target_rite.GetName].\n\nNow, over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] exiles wish to enter my party. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] pleads. "Let us settle around [initial_county_target.GetNameNoTier]."\n\nIf I permit it, the [local_character.GetFaith.GetAdjective] ideology will spread across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.desc_any_counties_alt: "Over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] followers of [target_rite.GetName], exiled from the [target_rite_associated_county.GetName], wish to enter my party. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] pleads. "Let us settle around [initial_county_target.GetNameNoTier]."\n\nIf I permit it, the [local_character.GetFaith.GetAdjective] ideology will spread across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.desc_same_faith_counties: "Over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] followers of [target_rite.GetName], exiled from the [target_rite_associated_county.GetName], wish to enter my party. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] says. "Let us settle across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].""
 global_religion.1000.desc_same_faith_counties_alt: "Religious persecution is rife in the [target_rite_associated_county.GetName], where the [target_rite_associated_county_rite.GetAdjective] nobility is forcibly converting followers of [target_rite.GetName].\n\nNow, over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] exiles wish to enter my party. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] says. "Let us settle across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].""
