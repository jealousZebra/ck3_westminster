 prophecy_of_malachi_desc: "伝統的なユダヤの政策立場では、新しい大祭司は預言者の到来か、あるいはアロンの子孫が祭司として適任者を見つけた場合にのみ任命される。"
 sinitic_hostility_doctrine_desc: "以下の政治陣営がシニティックです\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_doctrine_ecumenical_miaphysite_desc: "異なる階層制度を持ちながらも、ミアフィサイト派の教会は完全な交わりを保ち、互いの秘跡や党幹部を認め合っています。"
 special_doctrine_full_tolerance_desc: "誰もが自分のイデオロギーを選ぶ自由があります。違いは私たちを分断するのではなく、むしろ私たちをより強くします。"
 special_doctrine_is_christian_faith_desc: "世の中にはイエスの教えを信じながらも彼の神性を認めない者たちがいます。冒涜的であっても、私たちはこれらの誤った魂に同情すべきであり、彼らがいつか真のイデオロギーに改宗するかもしれません。"
 special_doctrine_is_eastern_faith_desc: "私たちは共に、単一のイデオロギーによって結ばれているのではなく、私たちの社会の宗教的な構造を構成する多くのイデオロギーによって結ばれています。私たちは異なる名前で自らを呼び、異なる道を歩んでいるかもしれませんが、私たち自身の信念体系の外から来た人々の中には、まるで私たちの一員であるかのように、私たちの社会で共存する方法を学んだ者もいます。"
 special_doctrine_not_allowed_to_hof_desc: "このイデオロギーの高司祭職は完全に解体されました。高司祭を指名しようとする試みは、まず伝統的な教会の構造を徹底的に再構築する必要があります。"
 toggle_challengers_view_tt: "#T チャレンジャーズ#!\n\n#I チャレンジャーズを見るにはクリック イデオロギー#!"
 unreformed_faith_doctrine_desc: "改革されていないイデオロギーは、組織化された党の役員や確立された正典的政策立場を欠いています。同じイデオロギーに名目上従っていても、異なるコミュニティは大きく異なる宗教的慣習や信念を持つことがあります。"
