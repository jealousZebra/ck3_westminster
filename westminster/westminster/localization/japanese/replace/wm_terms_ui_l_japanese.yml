 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! 後席議員は正当な党首に付与することができます"
 action_has_any_display_cb_on_HELP: "\n\n#help もしあなたの軍事力と[allies|E]が敵より強いなら、戦争は非常に有益です。[titles|E]を奪い、[realm|E]を拡大し、[prestige_experience|E]を得ることができます。\n\nとはいえ、戦争はコストがかかります。特に[defeat|E]を認めなければならない場合はなおさらです。野心的な隣国は弱体化した政党を利用するかもしれません#!"
 action_has_courtier_or_guest_with_inspiration_desc: "スタッフやゲストの誰かが[inspiration|E]を持っていて、スポンサーを受けて[artifact|E]を作ることができます"
 action_has_courtier_or_guest_with_inspiration_label: "スタッフやゲストの誰かが [inspiration|E]"
