 action_ghw_participation_alert_desc: "あなたは[gold|E] を寄付もせず、また次の[actor.GetFaith.GHWName] に[armies|E] を誓約もしていません。\n\n#help 戦争努力に資金や兵力を提供しなければ、あなたの[head_of_faith|E] があなたを非難し、[piety|E] を失います。#!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon!正当な党首にバックベンチャー議員を任命できます"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] あなたが正当な党首でない場合、彼らはあなたに少ない資源を与え、あなたへの[opinion|E]が減少します。時には、彼らがあなたのバックベンチャーであると仮定して、それらを正当な党首に渡すのが最良です。\n\n 正当な党首にバックベンチャーを譲ることは、収入が減ることを意味する場合がありますが、それでも譲る価値は通常あります。正当な党首は、自分のものであると思っているバックベンチャーを保持していることに対して、あなたへの意見ペナルティが大きくなるからです。\n\n 良いバックベンチャー構造を維持することは、安定した党の鍵です。#!"
 action_grant_vassal_to_rightful_liege_click: "#I 後方議員に#!を与えるにはクリック"
