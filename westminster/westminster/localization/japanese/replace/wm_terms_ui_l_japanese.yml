 action_above_vassal_limit_desc: "バックベンチャーの上限[actor.GetVassalLimit|V]を超えて[actor.GetVassalLimitOverrun|V] [direct_vassals|E]、[vassals|E]から得られる[taxes|E]や [levies|E]が減少します。\n#help 各[ruler|E]は直接バックベンチャーの人数に限られています。直接バックベンチャーとしてではなく、他のバックベンチャーの誰かが管理すべきです。そのためには、バックベンチャーの一人を別のバックベンチャーに譲りましょう#!"
 action_accolade_can_spend_attribute_click: "#I 組織者を見るにはクリック#!"
 action_appoint_tax_collector_desc: "あなたは[clan|E] [vassals|E]に課税しているわけではありません。\n\n#help [tax_collectors|E]氏族のバックベンチャーから[levies|E]と[gold|E]を徴収する責任があります。$game_concept_tax_collector$を任命し、[tax_jurisdictions|E]に割り当てる[taxpayers|E]を割り当てるべきです。#!"
 action_appoint_tax_collector_label: "@tax_collector_icon! あなたはバックベンチャーに課税していません"
 action_ask_for_pardon_desc: "現在、あなたは[top_liege|E]からは[criminal|E]と見なされていますが、[recipient.GetSheHe]は恩赦を与えることができます。\n\n#help もしあなたが犯罪者であれば、党首はいつでもあなたを打ち[imprison|E]ることができます![hook|E]の費用はかかるかもしれませんが、通常は恩赦を目指すのが最善です。#!"
 action_assign_tax_payers_desc: "あなたは[clan|E] [vassals|E]に課税していません。[tax_jurisdiction|E] \n\n#help [tax_collector|E]があっても[taxpayers|E]がない場合は、貢献も[gold|E]も[levy|E]もありません。氏族の後方議員を彼らから集$game_concept_taxes$集めるために$game_concept_taxpayers$に割り当ててください。#!"
 action_can_ask_hof_for_claim: "@hof_icon! ムーブメントリーダーにクレームを依頼できます"
