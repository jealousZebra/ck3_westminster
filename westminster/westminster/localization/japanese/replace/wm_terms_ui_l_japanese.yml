 action_has_unopened_court_event: "オフィスイベント開催"
 action_has_unopened_court_event_label: "あなたには新しいオフィスイベントがあります。"
 action_in_debt_desc: "あなたは[gold_i|E]#V 0#! [gold|E] 未満であり、そのため[debt|E]にいます！\n\n 借金状態での影響は以下の通りです:\n$BULLET_WITH_TAB$ [war|E] を宣言できません\n$BULLET_WITH_TAB$ [men_at_arms|E] を強化できません[gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] があなたの[domain|E]\n$BULLET_WITH_TAB$[vassals|E] に拡散する確率が高くなります[factions|E]\n\n 借金が深くなるほど、受けるペナルティは厳しくなります。現在の借金レベルでの追加効果は以下の通りです:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help 毎月資金を得ていない場合は、例えば以下の方法で支出を減らすことを検討してください:\n$BULLET_WITH_TAB$ [armies|E] を解散する\n$BULLET_WITH_TAB$ [men_at_arms|E] の規模を縮小するか、破壊する\n$BULLET_WITH_TAB$ [control|E] を[marshal|E] を使って増やす\n$BULLET_WITH_TAB$ [court_positions|E] を取り消す#!"
 action_in_debt_landless_desc: "あなたは[gold_i|E]#V 0#! [gold|E] 未満であり、そのため[debt|E]にいます！\n\n 借金状態での影響は以下の通りです:\n$BULLET_WITH_TAB$ [war|E] を宣言できません\n$BULLET_WITH_TAB$ [men_at_arms|E] を[gold_i|E] を使って強化できません[gold|E]\n\n 借金が深くなるほど、受けるペナルティは厳しくなります。現在の借金レベルでの追加効果は以下の通りです:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help [task_contract|E] を取って資金を稼ぐことを検討してください#!"
 action_landless_admin_escape_to_realm: "他党への逃避"
