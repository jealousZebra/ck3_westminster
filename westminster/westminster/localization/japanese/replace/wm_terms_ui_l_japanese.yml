 action_convert_at_war_interaction_desc: "あなたは[faith|E]の[recipient.GetShortUIName]に変換して、[recipient.GetHerHis] [holy_war|E]をあなたに対して終わらせることができます。\n\n#help 負けている戦争を終わらせることは有用ですが、元のイデオロギーのメンバーはあなたへの[opinion|E]を失うことになります！#!"
