 action_county_in_dangerous_populist_faction_combined_group_description: "あなたのいくつかの選挙区の農民が党首に対抗する[popular_faction|E]団結しています。\n\nこれらの選挙区の[county_opinion|E]を増やさなければ、彼らが要求を出すときに完全に失う危険があります!"
