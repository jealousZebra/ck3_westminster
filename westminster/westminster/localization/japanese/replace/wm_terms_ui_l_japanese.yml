 action_not_rightful_liege: "[recipient.GetShortUINameNoTooltip]の正当な党首ではない"
 action_not_rightful_liege_combined_group_description: "あなたは何人かのバックベンチャーの[rightful_liege|E]ではありません。\n\nCK もしあなたが[de_jure|E] [liege|E]になる称号を[usurp|E] [create|E]得られるなら、そうすることで彼らの[opinion|E]が向上し、[taxes|E]や[levies|E]も増えます。\n\nそれが難しいなら、特にそのバックベンチャーが[rightful_liege|E]であれば、他のバックベンチャーに[transferring|E]ることを検討してみてはどうでしょうか。"
 action_not_rightful_liege_combined_group_label: "バックベンチャーの正当な党首ではない"
 action_not_rightful_liege_desc: "あなたは自分の[rightful_liege|E]の[actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nではありません。[create|E]または[usurp|E]して、[recipient.GetHerHis] [de_jure|E] [liege|E]にするタイトルを得られるか確認するべきです。そうすることで、[recipient.GetHerHis] [opinion|E]が改善され、[taxes|E]および[levies|E]を[recipient.GetHerHim]から受け取る量も増えます。\n\nそれが不可能な場合は、特にそのバックベンチャーが彼らの[rightful_liege|E]である場合、[transferring|E]を別のあなたのバックベンチャーに移すことを検討するかもしれません。"
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon!強力なバックベンチャー議員は、 [GetPlayer.Custom( 'GetCouncilConcept' )] ポジションを期待している"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help パワフル・バックベンチャーには、[GetPlayer.Custom( 'GetCouncillorConcept' )|E]ポジションを与えることを検討すべきです。そうでなければ、彼らの[opinion|E]は下がり、あなたに対抗する[faction|E]に加わることもあります。\n\nとはいえ、すべての人が役に立つほど高い[skills|E]わけではなく、もしあなたの[rank|E]が十分に高ければ、[GetPlayer.Custom( 'GetCouncilConcept' )|E]の席数よりもパワフルなバックベンチャーの方が多いかもしれません。#!"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! 強力な後方議員は 期待する [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )]"
