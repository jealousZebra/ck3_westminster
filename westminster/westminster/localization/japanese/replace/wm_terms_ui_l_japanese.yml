 action_can_ask_hof_for_money: "@gold_icon!ムーブメントリーダーに資金をお願いできます"
 action_can_choose_dynasty_perk_desc: "あなたは [dynasty|E] 用の [dynasty_perk|E] を解除するのに十分な [dynasty_prestige|E] を持っています。\n\n#help [dynast|E] として、同じ王朝メンバーに対する行動にパーティーブランドを使用できますが、レガシーは王朝全体への長期的なボーナスです。#!"
 action_can_claim_liege_title: "@titles_icon! あなたは党首の称号を主張できる"
 action_can_claim_liege_title_desc: "あなたは [liege_possessive|E] [titles|E] の一つに [de_jure|E] されている [counties|E] の大部分を支配しています。これは、[prestige|E] を使ってそれに [unpressed_claim|E] を得ることができることを意味します！\n\n#help 高位のタイトルに対する未申請のクレームを持つことは、ランクを上げる機会を与えます。それを使って [claimant_faction|E] を開始するか、単にあなたの党首に対して直接 [war|E] を宣言することができます。#!"
 action_can_claim_liege_title_label: "@titles_icon! あなたは党首の称号を主張できる"
 action_can_create_head_of_faith_title_click: "#I イデオロギーを見るにはクリック#!"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help 運動のリーダーのタイトルを作ることによって、あなたも[temporal_head_of_faith|E]となります！#!"
 action_can_demand_payment_desc: "あなたは持っている[hook|E]を[recipient.GetUIName]に使って、[gold|E]を支払うよう要求できます。\n\n[recipient.GetSheHe|U] 現在、@gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#!の資金を要求することができます。$action_can_demand_payment_HELP$"
 action_can_find_secrets_HELP: "\n\n#help ここに表示されるのは、最も重要なターゲットである上位10名の[title_tier|E] [titles|E]保有者[vassals|E]のみですが、[liege|E]の任意の後方議員をターゲットにすることも自由です.#!"
 action_can_make_clerical_puppet: "@theological_agent_puppet_icon!パーティプリーストはパペット化可能です"
 action_can_ransom_desc: "あなたは[prisoner|E]、[recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUIName]を[gold|E]のために身代金にすることができます。\n\n[recipient.GetSheHe|U] 現在、@gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!の資金を要求することができます。$action_can_ransom_HELP$"
 action_can_request_preach_legitimacy: "@legitimacy_icon! 説教の使命"
 action_can_request_preach_legitimacy_combined_group_label: "@legitimacy_icon! 説教の使命"
 action_can_request_preach_legitimacy_help_desc: "\n\n#help [legitimacy|E] の [rulers|E] は [actor.GetFaith.HighGodNamePossessive] 承認に依存しており、[actor.GetFaith.HighGodNamePossessive] 承認がわかるのは党の役員を通じてのみです.#!"
 action_can_request_preach_legitimacy_label: "@legitimacy_icon![recipient.GetPrimaryTitle.Custom('GetTierIcon')] によってあなたのマンダテは改善される可能性があります[recipient.GetShortUINameNoTooltip]"
