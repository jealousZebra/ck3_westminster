 action_promote_foreign_legend_desc: "あなたは他の誰かの [legend|E] を昇進させることができます。\n\n#help [legends|E] は [legitimacy|E]、[dynasty_prestige|E]、[prestige|E]、[piety|E]、[traits|E]、および [claims|E] を得るために有用です。[legend|E] があなたの党に広がっており、支援することで報酬を得ます。"
