l_japanese:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "教会の聖職は、党役員が信託(commendam#!)で#i 授与できる地域または遠隔地の財産、役職、または教皇からの共有収入であった。これらは収入を生み出し、通常は直接的な行政責任を伴わなかった。"
 additional_mandala_government_piety_levels: "[mandala|E] [government|E]は、[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L]から[GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]までの追加の政治資本レベルをアンロックすることができます。そのような神格を達成するためには、彼らの忠誠心が世代を超えて証明される必要があります。"
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ は [crown_authority|E] の最高レベルです。[vassals|E] は #N に対して -30#! [opinion|E] のペナルティを受けます[liege|E]。\n\nこのレベルでは — [high|E] と [limited|E] のクラウン権限の効果に加え — 統治者は [designated_heir|E] を [prestige|E] のコストで選択できます。\n\nさらに、野党議員は外国の統治者に対しても戦争を宣言できません。"
 game_concept_acclaimed_knight: "スター・オーガナイザー"
 game_concept_acclaimed_knight_desc: "[accolade|E]を持つ[knight|E]。\n\nスター・オーガナイザーになるには、[unlanded|E]または[baron|E]であり、少なくとも[EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V]以上の[prowess|E]を持つ必要があります。スター・オーガナイザーは、他の[liege|e]のスター・オーガナイザーがすでに所有していない少なくとも1つの[accolade_type|E]の資格を持っている必要があります。\n\nスター・オーガナイザーは戦闘で殺されたり捕虜になったりする可能性が低くなります。彼らは主に[wars|E]戦や[GetActivityType( 'activity_tournament' ).GetName]のような[activities|E]に参加することで[glory|E]を向上させることができます。\n\n評価を受けた主催者は、時折アカレード属性に関連する[skills|E]や[traits|E]を得ることがあります"
 game_concept_acclaimed_knight_possessive: "スター・オーガナイザーズ"
 game_concept_acclaimed_knights: "スター主催者"
 game_concept_accolade_desc: "アコレードは[liege|E]から[knights|E]に与えられる栄誉です。\n\n アコレードを持つオーガナイザーは[acclaimed_knight|E]となります。\n\nAスターオーガナイザーは[glory|E]を獲得し、[accolade_squires|E]適性が増加([accolade_succession|E]向上)、[accolade_ranks|E]を得ることができます。これによりより多くの[accolade_types|E]がアンロックされ、より強力なボーナスが得られます。\n\nスター・オーガナイザーが亡くなると、[accolade_succession|E]が起こり、そのオーガナイザーはすぐに後継者に交代し、その後継者は[accolade_squires|E]アプティチュード.\n\n[innovations|e]以上の[title_tiers|e]能力によってスキルが修正され、同時により多くのアカレードを獲得[rulers|E]ることができます。"
 game_concept_accolade_squires_desc: "各[accolade|E]は小姓適性指標を持っており、それは次の[acclaimed_knight|E]の[traits|E]および[skills|E]（主に[prowess_skill|E]、[martial_skill|E]および[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]）を修正します。\n\n小姓の適性には5つのレベルがあります:\n$EFFECT_LIST_BULLET$熟達\n$EFFECT_LIST_BULLET$有能\n$EFFECT_LIST_BULLET$未熟\n$EFFECT_LIST_BULLET$無能\n$EFFECT_LIST_BULLET$哀れ\n\n未熟以上の適性を持つ場合、星のオーガナイザーは若い武術系性別[courtiers|E]の[traits|E]および[skills|E]に断続的に影響を与え、[accolade_succession|E]時に栄誉を引き受ける優先権を与えます。\n\n小姓は主に[glory|E]の獲得によって改善されますが、次の方法でも改善されます:\n$EFFECT_LIST_BULLET$星のオーガナイザーの[prowess_skill|E]\n$EFFECT_LIST_BULLET$星のオーガナイザーの[martial_skill|E]'\n$EFFECT_LIST_BULLET$星のオーガナイザーが[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]を獲得\n$EFFECT_LIST_BULLET$星のオーガナイザーが[GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]を獲得\n$EFFECT_LIST_BULLET$栄誉の[liege|E]の[martial_skill|E]\n$EFFECT_LIST_BULLET$栄誉の[liege|E]の[prowess_skill|E]\n\n各[accolade_succession|E]が栄誉の小姓をリセットします。"
 game_concept_accolade_succession_desc: "アコレード継承は、[accolade_possessive|E] [acclaimed_knight|e]が死亡または無効になると起こります。\n\n元スター・オーガナイザーは即座に交代します。アコレードの[accolade_squires|E]アプティチュードによって訓練された若い[courtiers|E]と[knights|E]が最初に後継者として優先されます。その後、他のオーガナイザー、他のスタッフ、ワンダラー、そして最後に新たに創設された[characters|E]が優先されます。アカレードのアカデ[accolade_squires|E]の適性に基づき、新しいオーガナイザーは[prowess_skill|E]、[martial_skill|E]、[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]、そして場合によってはその他の[skills|E]を受け取ることになる。\n\n アコレード継承後、[glory|E]が少なく失われる可能性があり、アカレイドのスクワイアア適性は新しいスターオーガナイザーのスキルと経験を反映する形にリセットされる。\n\nスターオーガナイザーが戦闘で死亡した場合、決闘やその他の名誉ある方法で死亡した場合、栄光の喪失は無効となり、アコレードのスクワイアを強化する。"
 game_concept_accolade_type_desc: "An [accolade|E] は最大で #value 3#! の属性を持ち、それらの高いレベルがアンロックされるとスケーリングボーナスを提供します。各属性には #value 3#! レベルがあります。栄誉がその [accolade_rank|E] を増加させると、所有者は既存の属性のレベルを上げるか、栄誉に新しい属性を追加することができます。ただし、[acclaimed_knight|E] は新しい属性の要件を満たす必要があります。\n\n 各 [knight|E] は、[traits|E]、[skills|E]、または主催者として務めている間に経験に基づいてアンロックされた特定の属性のみに適用されます。\n\n すべての栄誉にはユニークな属性が必要です：パーティリーダー #high は #! 栄誉間で属性を重複させることはできません。各栄誉は #value 1#! [men_at_arms|E] 型属性にのみ特化することもできます。"
 game_concept_ai_economical_boom_personality_desc: "$game_concept_ai_economical_boom_personality$は[realm|E]に全ての[gold|E]資金を投資したいと考えます。彼らは[buildings|E]や[men_at_arms|E]の資金調達のために財政を空にし、しばしばさらに[economic_buildings|E]や[holdings|E]を建設します。強い[faction|E]など直接的な脅威に直面した場合にのみ資金を貯めます。\n\n$game_concept_ai_economical_boom_personality$支配者は[legends|E]を創出・推進する可能性がやや低いです。\n\n 建築に熱心で[war|E]に特に興味がない大胆な支配者は$game_concept_ai_economical_boom_personality$sであることが多いです。\nの特徴には[GetTrait('calm').GetName( GetNullCharacter )]、[GetTrait('patient').GetName( GetNullCharacter )]、[GetTrait('diligent').GetName( GetNullCharacter )]、[GetTrait('generous').GetName( GetNullCharacter )]、[GetTrait('stubborn').GetName( GetNullCharacter )]、[GetTrait('profligate').GetName( GetNullCharacter )]が含まれます。[GetFocus('stewardship_domain_focus').GetName]を持つ支配者は$game_concept_ai_economical_boom_personality$であることが多いです。"
 game_concept_ai_pious_builder_personality_desc: "$game_concept_ai_pious_builder_personality$は自らの全[gold|E]を[piety|E]の増加に投資したいと考えています。\n\n彼らは宗教や儀式の[buildings|E]、[great_projects|E]、[activities|E]、[decisions|E]に財政を使い、しばしばさらに[pious_buildings|E]や[temple|E]、あるいは[temple_citadel|E] [holdings|E]を建設します。彼らは強い[faction|E]など直接的な脅威に直面した場合にのみ資金を貯めます。\n\n$game_concept_ai_pious_builder_personality$は、聖なる聖[legends|E]を生み出し促進する可能性が高いです。\n\n [virtue|E]を好む[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] [war|E]に特に興味がない傾向があり、一般的に$game_concept_ai_pious_builder_personality$sです。\nの特徴は[GetTrait('zealous').GetName( GetNullCharacter )]、[GetTrait('forgiving').GetName( GetNullCharacter )]、[GetTrait('improvident').GetName( GetNullCharacter )]、[GetTrait('humble').GetName( GetNullCharacter )]、[GetTrait('patient').GetName( GetNullCharacter )]、[GetTrait('diligent').GetName( GetNullCharacter )]、[GetTrait('generous').GetName( GetNullCharacter )]が含まれます。[GetFocus('learning_theology_focus').GetName]を持つ支配者は$game_concept_ai_pious_builder_personality$であることが多いです。"
 game_concept_ai_warlike_personality_desc: "$game_concept_ai_warlike_personality$ [ruler|E]は常に[war|E]を宣言する準備ができている。[realm|E]の発展に投資する前に[war|E]のために[gold|E]を貯めておく。$game_concept_ai_warlike_personality$支配者が長期間平和を保つと、戦争資金の資金を使って[buildings|E]を築く。\n\n$game_concept_ai_warlike_personality$支配者は英雄的な[legends|E]を創出し促進する可能性が高い。\n\n大胆で貪欲な支配者は好戦的である傾向があります。\nコモン特性には[GetTrait('wrathful').GetName( GetNullCharacter )]、[GetTrait('impatient').GetName( GetNullCharacter )]、[GetTrait('sadistic').GetName( GetNullCharacter )]、[GetTrait('ambitious').GetName( GetNullCharacter )]、[GetTrait('vengeful').GetName( GetNullCharacter )]、[GetTrait('irritable').GetName( GetNullCharacter )]、[GetTrait('zealous').GetName( GetNullCharacter )]が含まれます。"
 game_concept_alliance_desc: "$game_concept_alliance$とは、二つの[rulers|E]間の外交関係のことです。[independent|E]支配者は$game_concept_allies$を呼び寄せ合うことができます[wars|E]。\n\nllianceは、結婚した二人のキャラクターが二人の支配者と十分に近い血縁関係であれば、[marriage|E]またはあるいは一[betrothal|E]によって作成・維持されます。例えば、ある[king|E]が娘を別の王の息子と結婚させると、二人の王は互いに結婚$game_concept_allies$となります。\n\n[lieges|E] [vassals|E]でも$game_concept_alliances$を作ることができます。党首はバックベンチャーを戦争に呼び出すことはできませんが、参加を妨げ[factions|E]。"
 game_concept_anointment_request_desc: "リクエスト・アノインメント[character_interaction|E]は、[head_of_faith|E] [empire|E] [title_tier|E]以上の[ruler|E]や、党幹[head_of_rite|E]部がいない場合は党幹部が使う特別な交流で、[anointment|E]での支持を得るために使えます。"
 game_concept_archdiocese_desc: "大司教区は[christian|E]の形式の[clerical_region|E]であり、[archbishop|E]がその[clerical_title|E]を通じて保持する教会のポートフォリオであり、首都[county|E]に本拠地を置いており、[grand_cathedral|E]を昇格させることができる。\n\n A [christian|E] [ruler|E]は、自らの[capital|E] [county|E]を含む大司教区の[archbishop|E]に霊的な事柄で回答し、大司教区の管轄地域は総じて[the_christian_church|E] [situation|E]を構成する。"
 game_concept_aspect_of_serenity_desc: "平和な党は繁栄する党 — 静穏の側面は安らぎと外交的取引を重んじ、その目的に沿う者にボーナスを与えます。\n$EFFECT_LIST_BULLET$は [diplomacy|E]\n$EFFECT_LIST_BULLET$に焦点を当て、攻撃的な [wars|E] を避けます。[GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L] のスタックによって公開されます。\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] および [GetScheme('befriend').GetTypeName] [schemes|E] はより成功します。\n$EFFECT_LIST_BULLET$は #high $request_great_project_contribution_interaction$s#! からも行う場合があります。[allies|E]\n$EFFECT_LIST_BULLET$は [death_natural_cause|E] または [death_religious|E] [character_death_deaths|E] だけで死亡する可能性があります。"
 game_concept_at_peace_opinion_desc: "[GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E]を[faith|E]に含むキャラクターは、[offensive_war_opinion|E]ペナルティの代わりに「$game_concept_at_peace_opinion$」が付与されます。\n\n長く平和状態を保ち続けると、[vassals|E]はあなたのイデオロギーを共有している場合#weak あなたを軽蔑します。#!"
 game_concept_autonomous_vassals: "自律的バックベンチャー"
 game_concept_autonomous_vassals_crown_authority: "自律的バックベンチャー 王権"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' は [crown_authority|E] の最低レベルです。このレベルでは、[vassals|E] は [liege|E] に対して [opinion|E] のペナルティがなく、党首は基本的な権限しか持ちません。"
 game_concept_available_spouse_desc: "統治者の[council|E]に奉仕するためには、[spouse|E]がその役割の責任を果たすことができる状態でなければなりません。\n\nさまざまな状況が$game_concept_spouse$がこれらの責任を果たすのを妨げることがありますが、最も一般的なものには次のようなものがあります：\n$BULLET_WITH_TAB$自分自身の[realm|E]の[ruler|E]であること。\n$BULLET_WITH_TAB$他の統治者の[court|E]に居住していること。\n$BULLET_WITH_TAB$[imprisoned|E]国内外で\nであること。$BULLET_WITH_TAB$[GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]\n\n不在の配偶者が再び利用可能になった場合、自動的に内閣での職務を再開します。\n\n自ら統治者である配偶者は、あなたの[direct_vassals|E]であれば内閣に就任することができますが、それ以外の場合は利用可能と見なされません。"
 game_concept_baronies: "区画"
 game_concept_barony: "区"
 game_concept_beneficiary_desc: "[great_holy_war|E]の参加者は自分の中から自分の中から1つ$game_concept_beneficiary$を選べ[dynasty|E]。勝利すると、$game_concept_beneficiary$は対象となる政党内の土地を、後援者の[war_contribution|E]に比例して受け取る。\n\n最大の貢献者は、争われている主要な称号を受益者に強制的に受け取らせることができる。"
 game_concept_buy_claim_desc: "キャラクターが [unpressed_claims|E] を [piety|E] と引き換えに購入できるインタラクションです。\n\n$EFFECT_LIST_BULLET$A [vassal|E] はどの [liege|E] の [title|E] に対しても権利を購入できず、パーティリーダーはどのバックベンチャラーのタイトルに対しても権利を購入できません。\n$EFFECT_LIST_BULLET$A [king|E] または [emperor|E] は国家のタイトルに対して権利を購入できず、皇帝は他の帝国の権利を購入できません。\n$EFFECT_LIST_BULLET$ 誰も自分の [head_of_faith|E] に対する権利を購入できません。"
 game_concept_canonized_desc: "死後に聖人またはワリや崇敬される祖先など他の思想に相当する存在に宣言された聖人[character|E]、その聖人[GetTrait('saint').GetName( GetNullCharacter )] [trait|E]を得る。\n\nA徳ある人生は$game_concept_canonization$で終わることがある。[decision|E]を通じて請願し、[head_of_faith|E]の祝福を必要とし、聖人の埋葬地を聖別して封印される。その後、彼らの安息の地は敬虔な旅人を引き寄せ、その遺骸は遺[holy_relics|E]をもたらすことがある。"
 game_concept_capital_duchy: "首都圏"
 game_concept_capital_duchy_desc: "$game_concept_capital_duchy$の修飾子は、あなたの[capital|E]と同じ[de_jure|E] [duchy|E]内に保持しているすべての[holdings|E]から得られる[levies|E]の量を増加させます。また、すべての[stationed|E] [men_at_arms|E]にボーナスを与えます。この修飾子を有効にするには、関連するRegionを個人的に保持する必要があります。\n\nこの修飾子はホームベースのボーナスとは重複しません。"
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$は特定の[claimant|E]を任命しようと[ceremonial_liege|E]します。成功した場合、現職の儀礼党リーダーは[title|E]を請求者に譲渡しなければなりません。すべての[faction|E]メンバーは請求者に対して[hook|E]を得ます。"
 game_concept_ceremonial_liege_desc: "ある [realms|E] （日本など）では、有力な官僚や司令官が [ceremonial_regent|E] として実権を握り、形式的に在位する $game_concept_ceremonial_liege$ を単なる象徴や [vassal|E] にしてしまうことがある。$game_concept_ceremonial_liege_possessive$ [house|E] のすべてのメンバーは [ceremonial_house|E] の一部と見なされる。\n\n直接統治していなくても、$game_concept_ceremonial_house$ は党内で最も尊ばれる血筋であり、他の [houses|E] も彼らとの結婚でより多くの [prestige|E] を得ることができ、これらの結びつきは $game_concept_ceremonial_regent$ の継承に強く影響する。\n\n$game_concept_ceremonial_liege$ は、党の [primary_title|E] を何らかの方法で取り戻すことによって、実権を取り戻すことができる。たとえば [faction|E] の要求や $game_concept_ceremonial_regent$ [title|E] の競争による [influence|E] などである。"
 game_concept_challenger_hof: "挑戦者運動の指導者"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$は[mainline_rite|E] $game_concept_head_of_faith$に対抗して結成されたライバル[head_of_faith|E]です。\n\nA [ruler|E]は自分の部[clergy|E]のメンバーを$game_concept_challenger_hof$として推薦することができます。時間運動リーダーを持つ[faith|E]の[clergy|E] [ruler|E]や支配者は、代わりに挑戦者として自らを宣言することができます。スポンサー \n\nA $game_concept_challenger_hof$スポンサーの[rite|E]を引き継ぎ、そのスポンサーの[external_clerical_puppet|E]となり、[weak_hook|E]を負う義務があります。\n\n $game_concept_mainline_rite$ $game_concept_head_of_faith$ $game_concept_challenger_hof$をフォローする誰も[excommunicate|E]、スポンサーとその[vassals|E]を追いかけていけません。\n\nE $game_concept_challenger_hof$の後、事務的な要請を自分に持ち込む者は必ず、$game_concept_mainline_rite$ $game_concept_head_of_faith$ではなく自分たちに持ち込むことがあります。その中には[interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nA $game_concept_challenger_hof$やスポンサーが正当な$game_concept_head_of_faith$に対してこの[pam_challenge_hof_cb|E] [casus_belli|E]を利用することがあります。\n\nZrival [kings|E]以上の同[faith|E]州のリバルは、代わりに[pam_antiking_cb|E]をスポンサーに対して使用し、ライバル請求者を排除することができます。"
 game_concept_chancellor: "外務大臣"
 game_concept_chancellor_desc: "$game_concept_chancellor$ は外交、海外および他の [realm|E] との関係を担当する [councillor|E] です。"
 game_concept_chancellors: "外務大臣たち"
 game_concept_church_authority_desc: "$game_concept_church_authority$ は [theocratic|E] [ruler|E] が [clergy|E] と [vassals|E] に対して持つ力を表しています。\n\n $game_concept_church_authority$ には 4 つのレベルがあります：$church_authority_0$、$church_authority_1$、$church_authority_2$、$church_authority_3$。$game_concept_church_authority$ を上げるには、レベルと支配者の [learning_skill|E] に応じて、[piety|E] と [prestige|E] が必要です。\n\n#weak 議員は高いレベルの $game_concept_church_authority$ を好まず、それを下げることが [Concept( 'liberty_faction', 'Liberty Factions' )|E] の主要な目標です。#!"
 game_concept_claimant_desc: "$game_concept_claimant$は、1つ以上の[claims|E]を持つ人のこと[titles|E]。[ruler|E]請求者は、請求[casus_belli|E]を使って[wars|E]を宣言することでこれらの主張を行使できます。\n\nこの理由は、[vassals|E]の請求や[realm|E]の[unlanded|E]キャラクターの請求を行うこともできます。\n\n請求者は、パーティにいなくても[factions|E]をリードできます。"
 game_concept_claimant_faction_desc: "$game_concept_claimant_faction$は、[liege|E]が保持する[title|E]の玉座に特定の[claimant|E]を据えようとします。成功した場合、党首は請求者に称号を譲渡し、それに応じて[vassal|E]構造が更新されます。すべての[faction|E]メンバーは請求者に一[hook|E]を与えます。"
 game_concept_clan_desc: "[government_form|E]、その党首の[tax_collector|E]の[aptitude|E]によって[vassals|E] [liege|E]に与えられる[levies|E]と[taxes|E]の量が決まるです。クランもまた[house_unity|E]を利用します。"
 game_concept_clergy: "党幹部"
 game_concept_clergy_desc: "[court_chaplains|E]、[realm_priests|E]、[theocratic|E]の支配者、および[GetTrait('devoted').GetName( GetNullCharacter )]の特性を持つ者は、党の公務員のメンバーと見なされる。\n\n[doctrines|E][faith|E]が党の公務員のメンバーになれるか、および党の公務員のメンバーが結婚や土地の相続ができるかを決定する。"
 game_concept_clergy_opinion: "党幹部の意見"
 game_concept_clerical_puppet: "パーティー司祭パペット"
 game_concept_clerical_puppets: "パーティー司祭パペット"
 game_concept_clerical_region_desc: "聖職者地域とは、[clerical_title|E]の管轄下にある地理的地域です。その地域の党幹部のいかなるメンバーも、その地域に関連する[title|E]の保持者の[subordinate|E]となります。\n\nA [ruler|E]はその地域に属し、その地域は[capital|E] [county|E]を含み、創設者の[primary_title|E]の[capital|E]に基づいて新たな地域が設立されます。この地域は複数の[realms|E]をカバーし、異なる政党に属する部下が存在することがあります。\n\nA $game_concept_ruler$一度に一つの$game_concept_clerical_region$しか保持できません。新たな地域を与えられた場合、支配者は前の地域内の全ての土地を没収します。"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$は、[faith|E]その地域の中の[clerical_region|E]を統治する [clergy|E] の [ecclesiastical|E] [title|E] です。[christian|E]イデオロギーの中でも、これは[archdiocese|E]の一つです。\n\n 保持者はその地域の[clergy|E]の[religious_superior|E]であり、通常はその地域の [head_of_faith|E] によって任命されます。"
 game_concept_commander_trait_desc: "$game_concept_commander_traits$ は特別な [traits|E] であり、[army|E] [commanders|E] として行動するとキャラクターに有用な特典を付与します。\n\n コマンダー特性は通常、セキュリティ [education_focus|E] で育てられた子供によって獲得されますが、[martial_lifestyle|E] やその他の手段で得ることも可能です。"
 game_concept_complete_control_desc: "この条件は、対象の称号のすべての[de_jure|E]傍系議員[titles|E]が[ruler|E]またはその[vassals|E]のいずれかに保持され、その選挙区のいずれも敵対[armies|E]によって[occupied|E]されていない場合に達成される。"
 game_concept_complete_control_region_desc: "この条件は、対象の[region|E]におけるすべての[counties|E]が支配者またはその[vassals|E]のいずれかに保持され、その選挙区のいずれも敵軍によって占領されていない場合に達成される。"
 game_concept_confederation_desc: "[tribal|E]または[nomadic|E] [rulers|E]を相互防衛で結びつける関係で、[alliance|E]に似ています。#high $call_for_confederation_decision$#! [decision|E]を通じて形成される連合は、メンバー同士が互いの防御[wars|E]に参加することを義務付けます。連合はカリスマタブで確認できます。\n\nFellow [confederates|E]互いに攻撃や[raid|E]をしてはいけません。彼らは高いレベルの[tribal_authority|E]や[nomadic_authority|E]を制限されており、新たな[titles|E]を生み出すことはできません。\n\n[confederates|E] #high $leave_confederation_decision$#! [decision|E]や[migrate|E]を使って[independent|E]になれます。もし連合が一人だけ残れば、それは壊滅します。"
 game_concept_contestant_desc: "[GetActivityType( 'activity_tournament' ).GetName] [contests|E]で競うためには、その要件を満たす必要があります。ボードゲームではすべてのキャラクターが競うことができますが、レスリングのような他のものはセキュリティルールに依存します。\n\n競技に参加しないキャラクターは[spectators|E]され、観戦したい場合、潜在的な[contestants|E]は参加を辞退することができます。\n\nコンテストに参加する資格は、主催者の[culture|E]および[religion|E]に基づく性別と健康状態で決まります。"
 game_concept_convert_county_desc: "[court_chaplain|E]が実施する[councillor_task|E]で、異なる[faith|E]、あるいは同じイデオロギーの一方で異なる[rite|E]の[county|E]を標的にする[liege|E]。\nProgressは毎月増加し、ターゲット選挙区の過半数が議会リーダーのイデオロギーを100%採用します。新しい[rite|E]は、得られたイデオロギーが党首のものと一致するときにその[liege|E]に従います。そうでなければチャプレン自身のイデオロギーとなります。\n\n変換速度は、[councillor|E]の[learning_skill|E]や関与するイデオロギーの[fervor|E]など多くの要因に影響されます。チャプレン[rite|E]が[liege|E]の改宗者とより遅く異なる場合、\n [rite|E]のみの変化として、[fervor|E]は上#V 50%の主流イデオロギーを支持し#!その下の非主流(分裂を含む)イデオロギーを支持しています。"
 game_concept_convince_dejure_desc: "[steward|E]が実施する[councillor_task|E]。これは大臣の[liege|E]の[de_jure|E] [county|E]を標的とし、その土地は[independent|E] [ruler|E]が所有します。選挙区が納得すると、彼らは[ruler|E]に自分たちを[de_jure|E] [liege|E]に引き渡すよう求めます。"
 game_concept_coronation_anointment_desc: "顔に油を塗ることは[coronation|E]の一種であり、[ruler|E]は[head_of_faith|E]、もしくは存在しない場合は党の役員[head_of_rite|E]を探し出し、王位への即位を祝福する。特定の理念では、これを行うことが真に[legitimate|E]の支配者と見なされるために必要である。\n\n権威の支持を確保するために、[host|E]は[anointment_request|E] [interaction|E]を使用できる。"
 game_concept_council: "内閣"
 game_concept_council_desc: "$game_concept_council$はリーダーのトップチームで、[councillors|E]がそれぞれ部門を運営しています。重要な役割を与えられることもあります[councillor_tasks|E]。"
 game_concept_councillor: "大臣"
 game_concept_councillor_desc: "大臣はあらゆる[ruler|E]の主要な補佐官であり、その[council|E]を構成します。内閣には6つの役職があります:[chancellor|E]、[marshal|E]、[steward|E]、[spymaster|E]、[court_chaplain|E](または[realm_priest|E])、そして最後に[spouse|E]です。\n\nEachは、異なる職務を担当する部門を担当しており、その部門には異なる役割[councillor_tasks|E]が与えられます。\n\n[powerful_vassals|E]これらのポジションに任命されなければ不満を抱くため、強力な後方議員をなだめるか、実際に有能な人物を任命するかの選択を迫られることが多いのです。\n\n [liege|E]の大臣として働くとボーナスがもらえ、党首の支持[rank|E]に加わるボーナスが増えます。"
 game_concept_councillor_task: "省庁任務"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ は、[councillors|E] に与えることができる重要な仕事です。これらのタスクは、一般的なもの、または特定の [county|E] や [court|E] を対象にするものがあります。\n\n もし[relation|E] に大臣がいる場合、完了までの時間があるタスクは、より長くまたは短くなることがあります。\n\n#weak なお、大臣はこれらのタスクを直接行うのではなく、努力を指導するだけです。#!"
 game_concept_councillor_task_possible_side_effects_desc: "[councillor_task|E] には時間と共に予期せぬ結果が生じることがあります。これらは良い場合も悪い場合もあり、良い影響は大臣の関連する [skill|E] が高いほど起こりやすく、悪い影響は関連スキルが低いほど起こりやすくなります。"
 game_concept_councillor_tasks: "省庁任務複数"
 game_concept_councillors: "大臣"
 game_concept_counties: "選挙区"
 game_concept_county: "選挙区"
 game_concept_county_capital: "選挙区の首都"
 game_concept_county_capital_desc: "$game_concept_county_capital$は[county|E]の主要な[holding|E]です。この保有物は決して破壊されたり[leased|E]に出されたりすることはなく、常に選挙区[title|E]を保持する[ruler|E]に属します。\n\n選挙区首都は、より小さな保有物に比べて追加の[building|E]の建設を可能にします。"
 game_concept_county_capitals: "選挙区の首都"
 game_concept_county_control: "選挙区の支配"
 game_concept_county_control_desc: "$game_concept_county_control$ は [county|E] の住民に対する政府の支配力を測ります。それは特に [holdings|E] から [taxes|E] を徴収する際に重要です。\n\n 選挙区が [war|E] を通じて所有権を変えると、支配力は劇的に低下します。その場合、現在の [holder|E] を従属させる方がよい理由となります（[casus_belli|E] が許可する場合）。選挙区の支配力は [sieges|E] と [Concept( 'peasant_faction', 'Peasant Uprisings' )|E] によっても損なわれることがあります。\n\n 低い支配力は [county_corruption|E] を引き起こす可能性があり、支配力を高める主要な方法は [councillor_task|E] があなたの [marshal|E] に利用可能であることです。"
 game_concept_county_corruption: "選挙区の腐敗"
 game_concept_county_corruption_desc: "[county|E] の [control|E] が低いか、またはその [holder|E] が [debt|E] にある場合、有権者区は $game_concept_county_corruption$ を獲得する可能性があります。これらはさまざまな種類のネガティブな [county_modifiers|E] です。\n\n$game_concept_county_corruption$ 時間とともに消えますが、根本原因（[debt|E] または [control|E] の低下）が続く場合、再び現れることがあります。\n\n $councillor_marshal$ の $task_increase_control$ $game_concept_councillor_task$ は $game_concept_county_corruption$ をより早く取り除くことができます。"
 game_concept_county_fertility: "選挙区の出生率"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$は[the_great_steppe|E]内の[counties|E]に存在し、[GetGovernment( 'nomad_government' ).GetName] [rulers|E]が放牧して[herd|E]を増やすことができます。\n\nA選挙区の肥沃度は牧草地の質を表します。\n\n [fertility_equilibrium|E]周辺で効率性が安定し、[domain_limit|E]の大きい遊牧支配者が群れの成長を維持できるようになっています。肥沃度は[steppe_seasons|E]の影響を受け、[herders|E]によってゆっくりと回復されます。\n\n [realm|E]の出生率が低いときは、それを[migrate|E]すべきサインです。\n\n[county_control|E]出生率の成長率を現在のコントロール値と同じパーセンテージだけ遅らせます。"
 game_concept_county_modifier: "選挙区の修飾子"
 game_concept_county_modifiers: "選挙区の修飾子たち"
 game_concept_county_opinion_desc: "各[county|E]の一般住民には、その$game_concept_county$を持つ[character|E]の[opinion|E]がいます。もし住民が不満を抱えていると、彼らはある[peasant_faction|E]や[popular_faction|E]を始めたり、参加したりすることがあり、いずれもすぐに一つの[realm|E]全体に広がることもあります。\n\n $game_concept_county_opinion$を制御する最も簡単な方法は、その住民と同じ[culture|E]かつ[faith|E]を持つ$game_concept_county$ [holder|E]を確保することです。異なる[faith|E]を持つ\n\n$game_concept_county_opinion$は、選挙区の[faith_hostility|E]と、その選挙区の[fervor|E]の両方によって変化し、0から100 $game_concept_fervor$の間で線形にスケーリングされます。"
 game_concept_court: "事務所"
 game_concept_court_amenities: "オフィス設備"
 game_concept_court_amenity: "オフィスアメニティ オフィスアメニティ"
 game_concept_court_artifact: "オフィス・アーティファクト"
 game_concept_court_artifact_desc: "オフィスアーティファクトは [artifact|E] で、[ruler|E] の [royal_court|E] に展示されるものです（タペストリーや美しく装飾された書籍など）。\n\n オフィスアーティファクトは、個人オフィスの [court_grandeur|E] を決定する要因のひとつです。\n\n キャラクターが持てるアーティファクトの数には制限はありませんが、そのタイプのスロットに展示されているもののみが効果を持ちます。\n\n 新しいオフィスアーティファクトは、[inspired|E] [characters|E] から、委員会のアーティファクト決定から、あるいは [reforge|E] に [inventory_artifact|E] を選択することで作成できます。"
 game_concept_court_artifacts: "オフィスの遺物"
 game_concept_court_chaplain: "下院の党首"
 game_concept_court_chaplain_desc: "$game_concept_court_chaplain$ は [faiths|E] における宗教および精神的事務を担当する [councillor|E] で、[GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E] を持っています。\n\n [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] の政策立場を持つイデオロギーは、$game_concept_court_chaplain$ の代わりにはるかに強力で（そして厄介な）[realm_priest|E] を持ちます。"
 game_concept_court_chaplain_possessive: "下院の党首の"
 game_concept_court_chaplains: "国会のリーダーたち"
 game_concept_court_chaplains_possessive: "国会リーダーの"
 game_concept_court_desc: "すべての政治家には$game_concept_court$があります。それは、自分たちのために働く[unlanded|E]人たちです。\n\nこれらの人は[courtiers|E]家族、助言者、研究者、取り巻きです。"
 game_concept_court_event: "オフィスイベント"
 game_concept_court_events: "オフィスイベント"
 game_concept_court_grandeur: "オフィス・グランジュア"
 game_concept_court_grandeur_desc: "[royal_court|E]の$game_concept_court_grandeur_value$はその役職の知名度を示し、増加することで新しい[court_grandeur_levels|E]を解除します。\n\n値は0から100の範囲で、時間が経つと基準値に落ち着きます。基準値は、[dynasty_perks|E]、[court_amenities|E]への支出、および壮麗な[court_artifacts|E]の有無などによって影響を受けます。\n\nZZの一部は[succession|E]の際に失われます。"
 game_concept_court_grandeur_expectation: "オフィスの壮大さへの期待"
 game_concept_court_grandeur_expectations: "オフィスの壮大さの期待"
 game_concept_court_grandeur_level: "オフィス・グランジュールレベル"
 game_concept_court_grandeur_level_desc: "[royal_court|E]のグランドゥールレベルは所有者にボーナスを与え、オフィスの[court_grandeur_value|E]が上がるとアンロックされます。\n\n各レベルの効果に加え、多くの大[realms|E]がより高いグランデュアレベルに達していると予想されます。これを[court_grandeur_expectations|E]と呼びます。"
 game_concept_court_grandeur_levels: "オフィス・グランジュール・レベル"
 game_concept_court_grandeur_value: "オフィス・グランジュール・バリュー"
 game_concept_court_guest: "オフィスゲスト"
 game_concept_court_host: "オフィスホスト"
 game_concept_court_host_desc: "$game_concept_court_host$は、キャラクターのパーティリーダーではないが、そのキャラクターを[court]に連れている[ruler|E]のことです。\n\nこのようなことが起こる理由はいくつか考えられます。例えば、[wanderers|E]ルーラーを訪ねたり、[wards|E] [guardian|E]と同じオフィスに滞在したりします。"
 game_concept_court_language: "オフィス言語"
 game_concept_court_language_desc: "オフィス言語は、[royal_court|E] の公式 [language|E] であり、貴族によって話され、官僚によって使用されます。\n\n [court_grandeur|E] ベースラインは、言語を共有する各 [realm|E] [county|E]、同じオフィス言語を話す各個人オフィス、そして [ruler|E] の母語である場合に増加します。"
 game_concept_court_languages: "オフィス言語"
 game_concept_court_position: "任命"
 game_concept_court_position_task: "任務の任命"
 game_concept_court_position_tasks: "任務の任命（複数）"
 game_concept_court_positions: "任命"
 game_concept_court_type: "オフィスタイプ"
 game_concept_court_type_desc: "[royal_court|E]の一環として、[rulers|E]は指定された$game_concept_court_type$を持つことができます。\n\nach $game_concept_court_type$は、[court_grandeur_level|E]に応じてルーラーと[court|E]に独自のボーナスセットを提供します。\n\nルーラーの[culture|E]の[ethos|E]が、どの役職タイプを持てるかを決定します。\n\nThe different Office Types は以下の\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "オフィスタイプ特性"
 game_concept_court_type_trait_desc: "その特性の質は、その裁判所の[court_type|E]スタッフとして勤務した期間によって、その事務所でスタッフとして勤務した期間によって決まる[royal_court|E] [trait|E] [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] [courtier|E]。\n\n この特性の質は、[character|E]がオフィスでスタッフとして勤務した期間によって決まります。"
 game_concept_court_types: "オフィスの種類"
 game_concept_courtier: "スタッフ"
 game_concept_courtier_desc: "$game_concept_courtier$は[court|E]で一つの[ruler|E]に仕える[unlanded|E]キャラクターのことです。\n\nStaffは:\n$BULLET_WITH_TAB$Serve as [councillors|E]\n$BULLET_WITH_TAB$Serve in [court_positions|E]\n$BULLET_WITH_TAB$Serve in [armies|E] [commanders|E]または[knights|E]\n$BULLET_WITH_TAB$支配者の[vassal|E]を与えられた場合 [title|E]\n$BULLET_WITH_TAB$Z支配者の[claims|E]を押[war|E]\n\n#WEAK [adventurers|E] [followers|E] $game_concept_courtiers$ではなく — 同じ役割を果たす。ただし、全体的に臭いが強く、泥も多かったです。#!"
 game_concept_courtiers: "スタッフ"
 game_concept_courts: "役所"
 game_concept_criminal_task_contract_desc: "$game_concept_criminal_task_contract$ は通常、儲かるかもしれないが、@gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E] を与えるような嫌らしい契約を伴います。\n\n $trait_gallowsbait$ [trait|E] を上げると、世界のほとんどがあなたをより嫌い、尊敬しなくなり、最終的にはあなたの無法行為を嫌う [followers|E] が劇的に職を離れることになります。\n\n#WEAK $trait_gallowsbait$ は非常にネガティブな $game_concept_trait$ であり、キャラクターが最低レベルの軽犯罪者であることを意味します——少なくともオフィスでの殺人には何らかの #EMP クラス#! が存在します。\n\n [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E] できれいに消去できます。#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ は [ruler|E] がその [vassals|E] に及ぼす一般的な権力を表しています。\n\n $game_concept_crown_authority$ には四つのレベルがあります: [autonomous_vassals|E]、[limited|E]、[high|E]、[absolute|E]。$game_concept_crown_authority$ を上げるには、レベルと支配者の [learning_skill|E] に応じた量の [prestige|E] が必要です。\n\n#weak 後列議員は高いレベルの $game_concept_crown_authority$ を嫌い、それを下げることが [Concept( 'liberty_faction', 'Liberty Factions' )|E] の主な目標です。#!"
 game_concept_culture_head_desc: "'$game_concept_culture_head$' は、自身の [culture|E] に最も影響力を持つ [ruler|E] です。\n\n 特に、自身の [realm|E] 内で同じ文化の [counties|E] の総数が最も多い支配者は、[domain|E] の所在や他文化 Constituencies の有無に関係なく $game_concept_cultural_head$ になります。[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\n $game_concept_cultural_head$ は、[cultural_fascination|E] を設定することでどの [innovation|E] を優先的に発見すべきかに影響を与えることができます。\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "[title|E]の[de_jure|E] [liege|E]がゆっくりと変化するプロセスです。これは、その地域の法的な党首の称号を持たない[ruler|E]が[duchy|E]や[kingdom|E]を完全に支配しているときに自然に起こります。\n\nこのプロセスは、[chancellor|E]を適切な[councillor_task|E] #weak($task_integrate_title$)に割り当てることで加速できます#!。地域は国家にしか$game_concept_de_jure_drift$できず、国家は[empires|E]にしかドリフトできません。\n\nのタイトルを自分の[primary_title|E]に「De Jure Drift」を付けることは、[rightful_liege|E]ペナルティを取り除く良い方法です。"
 game_concept_de_jure_drift_desc_part_2: "#weak 例: $d_northumberland$の地域は法的には$k_england$の一部ですが、地域の領土は完全に$k_scotland$の中にあります。$k_scotland$の王が$k_england$も保持していないため、その地域は$game_concept_de_jure_drift$を開始して$k_scotland$の一部になろうとします。#!"
 game_concept_death_religion: "政治的陣営"
 game_concept_death_religion_desc: "敵によってあの世へと渡され、殉教や磔刑という冒涜的な死を迎え、最後まで自分のイデオロギーに忠実であり続ける、これ以上真実な伝え方はない。"
 game_concept_debt_desc: "負債とは、負の額の[gold_i][gold|E]状態です。これは通常、戦争中の[ruler|E]が全費用を賄う資金が足りないまま雇[mercenaries|E]った場合や、戦争状態が長すぎる場合に起こります。\n\n借金状態では新たな発[wars|E]を宣言できず、[men_at_arms|E]は補強せず、[advantage|E]敵は戦闘であなたを圧倒します。借金が深まるほど、ペナルティが増え、[levies|E]が減り、 [county_opinion|E]が減り、[vassals|E]はあなたを好まなくなります。\n\nこれに加えて、[domain|E] [counties|E]の[county_corruption|E]を得るなど、さまざまな小さな不安定化イベントが発生することがあります。\n\n#help 敵が借金を抱えている間に攻撃するのは一般的に良い考えです。敵は戦闘の力を減らして戦うため、[advantage|E]が減ってきます!#!"
 game_concept_demand_conversion_desc: "[rulers|E] は別の [faith|E] の臣下を持っている場合、臣下のイデオロギーを自分のものに変えるために要求変換を行うことがあります。臣下が要求を受け入れるか [Concept('refuse_conversion_crime','refuses')|E] するかは、支配者の [learning|E] スキルと臣下の党首への忠誠心 [opinion|E] が主な要因です。"
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$は、[diarch|E]が[liege|E]によって設定した各[mandate|E]をどれだけうまく達成できるかを決定します。\n\n [skills|E]と[personality_traits|E]が役割を果たします。例えば、「$fill_coffers_mandate$」委任を担う[GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$は、党首に多くの[gold|E]物資を送らない場合があります。\n\n#WEAK [diarchs|E] $game_concept_mandate$には約40+の$game_concept_aptitude$がある場合に適しています。#!"
 game_concept_diarch_power_desc: "活動中の[power_sharing|E]の[diarch|E]は特別なもの$game_concept_diarch_powers$にアクセスできます。\n\nこれらは、[liege|E]が持つものを模倣する特別な[character_interaction|E]や、その他の権力乱用のことです。例としては、[vassals|E]仲間の[revoking|E] [titles|E]や、党首から[gold|E]を横取りすることなどがあります。\n\nM党首に自分たちを打ち[veto|E]る機会を与える$game_concept_diarch_powers$。"
 game_concept_diplomacy: "カリスマ性"
 game_concept_diplomacy_lifestyle: "カリスマライフスタイル"
 game_concept_diplomacy_skill: "カリスマスキル"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$は魅力、説得、取引の[skill|E]であり、場を動かし、同僚を説得し、取引を成立させることです。\n\nこれは他のキャラクターがあなたに抱くこと[opinions|E]に直接影響し、カリスマ[schemes|E]をさらに高めます。\n\n対応する[lifestyle|E]が[diplomacy_lifestyle|E]です。"
 game_concept_diplomacy_task_contract: "カリスマ契約"
 game_concept_diplomacy_task_contract_possessive: "カリスマ契約の"
 game_concept_diplomacy_task_contracts: "カリスマ契約"
 game_concept_diplomacy_task_contracts_possessive: "カリスマ契約"
 game_concept_direct_vassal: "直接議員"
 game_concept_direct_vassals: "直接のバックベンチャー"
 game_concept_directed_great_holy_war_desc: "$doctrine_temporal_head_name$ [head_of_faith|E]が[kingdom|E]を自らの支配下に置くことを目的として$game_concept_directed_great_holy_war$を宣言します。\n\n[rulers|E]の誰[faith|E]ムーブメントリーダーを支援することを選ぶことができ、そのことで報酬を得ることもあります。報酬には[piety|E]や、[dynasty|E]が征服された国家内で[landed|E]されることが含まれます。\n\n標的[religion|E]のルーラーは、[alliance|E]を必要とせずにこの戦争から防衛することを選択できます。"
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ は [tribal_authority|E] の最低レベルです。このレベルでは、[vassals|E] は [opinion|E] に対して [liege|E] のペナルティを受けず、党の指導者は [levies|E] および [taxes|E] を要求する能力以外に彼らに対する力を持ちません。"
 game_concept_dissolution_faction_desc: "[dissolution_faction|E]は[liege|E]の[realm|E]を破壊しようとしています。成功すれば、党内のすべての後方議員が[independent|E]となり、党首は[primary_title|E]を失います。"
 game_concept_doctrine: "政策立場"
 game_concept_doctrine_knowledge: "政策立場知識"
 game_concept_doctrines: "政策立場"
 game_concept_doctrines_desc: "政策立場とは [faith|E] が意味するものです：税金と支出、所有権、移民、ヨーロッパ、連合、および市民の自由。議員の政策立場と衝突する法案は反乱を起こす可能性を高めます。"
 game_concept_domain: "ポートフォリオ"
 game_concept_domain_desc: "政治家の$game_concept_domain$は、個人的に保持しているすべてのもの：その議席とその選挙区です\n\n[domain_limit|E]とは、指導者が少数の議席以上を導くために[vassals|E]に頼らなければならないことを意味します。"
 game_concept_domain_fertility: "ポートフォリオ収益性"
 game_concept_domain_fertility_desc: "ポートフォリオ収益性とは、保有しているすべての[counties|E]の総[county_fertility|E]です。"
 game_concept_domain_income: "ポートフォリオ収入"
 game_concept_domain_limit: "ポートフォリオ上限"
 game_concept_domain_size: "ポートフォリオ規模"
 game_concept_domain_taxes: "ポートフォリオ税金"
 game_concept_domains: "ポートフォリオ（複数）"
 game_concept_dominant_family_desc: "$game_concept_dominant_family$は、その支配を広範囲に広げた[powerful_family|E]のことです。彼らは[realm|E]の中で最も影響力のある[house|E]と見なされています。$game_concept_dominant_family$の\n\nAメンバーは[political_schemes|E]に優れており、他の[characters|E]と[interacting|E]することで望むものを手に入れる可能性がさらに高まります。\n\nA $game_concept_house$支配者になるには、党の少なくとも[EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%]を支配しなければなりません。"
 game_concept_dread: "クラウト"
 game_concept_dread_desc: "$game_concept_dread$ は [ruler|E] がどれだけ恐れられているかを示します：大臣を平然と解雇するリーダー、反乱を決して忘れない総務官。\n\n 政治家は冷酷な行動、例えば解雇、粛清、反乱者や [prisoners|E] を見せしめにすることで $game_concept_dread$ を得ます。\n\n 影響力があれば [tyrant|E] のように指導することが可能です。なぜなら手に負えない [vassals|E] は [intimidated|E] や [cowed|E] になる可能性があり、反対することを恐れるからです。\n\n キャラクターの影響力は 0 から 100 までの範囲ですが、[nomads|E] の場合は 150 に達することがあります。時間の経過とともに、彼らの影響力は自身の [personality_traits|E] によって定義される自然な影響力に向かいます。\n\n#high 圧倒的な [ruler] は次の利益を得ます：#!\n$BULLET_WITH_TAB$[vassals] は [factions|E] に加わることを抑制します。\n$BULLET_WITH_TAB$[vassals] は [scheming|E] を抑制します。\n$BULLET_WITH_TAB$ [vassal] の承認率を高めます #weak （例：称号剥奪）#!\n$BULLET_WITH_TAB$ [offer_vassalization|E] の承認を増やします \n$BULLET_WITH_TAB$ [electors|E] があなたと同じように投票する可能性を高めます \n$BULLET_WITH_TAB$ 下院議員が [law|E] の変更に反対しにくくなります \n\n#weak 勇敢で大胆な [vassals] は影響力の影響を受けにくいことに注意してください！#!"
 game_concept_dreaded: "手ごわい"
 game_concept_dreadful: "手ごわい"
 game_concept_dreams_desc: "占いの目的を持つイデオロギーに従うキャラクターは、時折夢を見ることがあります。これらの夢は神秘主義者によって占いされ、良い結果も悪い結果も持ち得ます。"
 game_concept_duchies: "地域"
 game_concept_duchy: "地域"
 game_concept_duchy_building: "地域の建物"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ は強力な [buildings|E] で、[duchy|E] の [de_jure_capital|E] にのみ構築可能です。各地域で構築できるのは1種類のみです。\n\n$game_concept_duchy_buildings$ は、所有者が関連する地域 [title|E] も保持している場合にのみ有効です。\n\n 多くの $game_concept_duchy_buildings$ には、地域内のすべての [holdings|E] に影響する修飾子があり、[domain|E] を専門化するための強力なツールになります。"
 game_concept_duchy_buildings: "地域の建物群"
 game_concept_duchy_desc: "$game_concept_duchy$は[kingdom|E]より下、[county|E] [title_tier|E]上の[title|E]のものを指します。\n\n $game_concept_duchy$の[holder|E]は構成$game_concept_counties$に対して[de_jure|E]権利を持ち、[vassals|E]と同様に権利[counts|E]を持つことができます。\n\nレギオンは休止状態で、現在の保有者がいない場合もあります。このような$game_concept_title_succession$ものは、$game_concept_counties$の少なくとも半分を支配する[ruler|E]によって作り出されることがあります。"
 game_concept_dynasty_perks: "党の遺産"
 game_concept_dynasty_prestige: "党のブランド"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$は党全体の評判です：有権者がその名前で何を意味するか、そしてメンバーにどのような扉を開くかです。\n\nA [dynasty|E]は、生きているメンバー、職務を持つメンバー、他の職務保持者と結婚しているメンバーから$game_concept_dynasty_prestige$を得ます。\n\nこれは党の[dynasty_prestige_level|E]に含まれ、党の指導者は[dynasty_perks|E]に使うことができます。"
 game_concept_dynasty_prestige_level: "党ブランドレベル"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\n これは最高の党ブランドレベルです。"
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ は [dynasty|E] のどれだけ有名かの尺度です。レベル進行は、あなたの王朝が [dynasty_prestige|E] を得るたびに行われます。キャラクターは生まれたときに $game_concept_dynasty_prestige_level$ に応じて初期の [prestige|E] を得ます。同様に、[spouses|E] は [marry|E] するとき、互いの王朝からいくらかのプロフィールを得ます。\n\nレベルは以下の通りです:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[ecclesiastical|E] [rulers|E]が敵対的なイデオロギーを持つ支配者に対して[holy_war|E] [faith|E]を宣言するための[interaction|E]。"
 game_concept_ecumenical_councils: "エキュメニカル・キャビネット"
 game_concept_eminent_holy_site: "著名なハートランド"
 game_concept_eminent_holy_site_desc: "An $game_concept_eminent_holy_site$ は [holy_site|E] にとって非常に重要な [faith|E] です。各イデオロギーは、その $game_concept_holy_sites$ のうちいくつかだけを卓越と指定できます。\n\n 卓越したハートランドのみが、イデオロギーのすべての信者に影響を与える修正値に寄与します。"
 game_concept_eminent_holy_sites: "著名なハートランズ"
 game_concept_empire: "イギリス"
 game_concept_empires: "組合"
 game_concept_enshrined_desc: "[holy_site|E]に祀られた[holy_relic|E]はハートランドのボーナスを発動し、与えるボーナスをすべての納められたアーティファクトの総レベル[rarity|E]に基づけて強化します。\n\n納められたアーティファクトはもはやキャラクターの所有物ではなく、ハートランドの[holder|E]、[top_liege|E]、または[clerical_region|E]保持者が操作することができます。アーティファクトはもはや腐敗しません。自分の[faith|E]のために聖なる遺物のみを祀ることができます。他のイデオロギーの聖なる遺物は恩恵を受けません。\n\n祀られた遺物の安置や除去に伴う報酬やコストが存在する場合もあります。"
 game_concept_entrenched_regency_desc: "[regency|E]が長く続くと、それは固定化する可能性があり、[regent|E]は彼らの[liege|E]に比べてさらに強力になる。\n\n[regent|E]が[scales_of_power|E]から得る利益は、はるかに強力になる。\n\n$game_concept_entrenched_regency$を終わらせるには、摂政は党首からの贈り物を受け入れるか、党首が有利に働きかける必要がある。"
 game_concept_escalated_peasant_factions: "抗議運動のエスカレート（複数）"
 game_concept_expected_legitimacy: "予想される任期"
 game_concept_expected_legitimacy_desc: "[vassals|E] [ruler|E]に期待する歴史的な関係に基づく、[legitimacy_level|E]。期待値を下げる要因のいくつかは以下の通りです:\n$BULLET_WITH_TAB$バックベンチャーの[de_jure|E] [liege|E]を回すこと\n$BULLET_WITH_TAB$バックベンチャーの[close_family|E]一部のバックベンチャーが\n$BULLET_WITH_TAB$バックベンチャーの[preferred_heir|E]を下げる\n$BULLET_WITH_TAB$バックベンチャーが50#!年数#color_white以上務めてきた同じ[dynasty|E] \n$BULLET_WITH_TAB$Zバックベンチャーが[powerful_vassal|E]\n\nZに当てはまるならば期待値を下回ると、彼らは手に負えなくなり、[opinion|E]が低くなり、自分の[liege|E]意思に反して[factions|E]に加わることもあります。\n\nEppの数値は、[primary_title|E]のレベルや[era|E]のレベルに応じて増加します。"
 game_concept_external_clerical_puppet_desc: "[clergy|E]の強力なメンバー — [archbishop|E]や[head_of_faith|E]でさえ — が他の[ruler|E]の[puppet|E]となった。\n\n僧侶が強ければ強いほど、影響力も大きい：操られた運動リーダーは[excommunicate|E]で敵を動かし、[cardinals|E]を任命し、[pressed_claim|E]を与え、あるいは[holy_war|E]をあなたのために扇動することができる。"
 game_concept_faction_desc: "$game_concept_faction$は共通の政治的利害を持つ人々の集まり[vassals|E]です。[counties|E]の地元住民は、抗議運動のような特定の派閥にも参加できます。\n\nFの派閥は、[faction_discontent|E]が一定の段階に達すると危険になり、その時点で最後通告を出します。\n\n [liege|E]が従わなければ、派閥は反乱を起こし、[civil_war|E]を引き起こします。もし派閥が戦争が終わる前に解散した場合、党首は戦争に勝つために少なくとも1 [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E]が必要です。"
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$は、[faction|E]の目標に対する総合的な軍事力の指標です。\n\n各個人の派閥メンバーは、派閥に所属している限り、その完全な強さを派閥に加えます。派閥の目標がメンバーの[liege|E]である場合、そのメンバーの強さは派閥指導者の相対的な力からも差し引かれます。"
 game_concept_faith: "イデオロギー"
 game_concept_faith_astray: "ダイバージェント"
 game_concept_faith_astray_desc: "この[rite|E]はあなたの政治陣営か隣接する陣営のもので、詳細で意見が合わないのです。\n\n#S 影響:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "ある政治家の$game_concept_faith$は、より大きな[religion|E]の中で政治家の信条です。すべてのキャラクターや[county|E]には信条があります。選挙区のイデオロギーは有権者の傾向であり、その選挙区の議員の信条に寄り添いていきます。\n\n イデオロギーの[doctrines|E]はその政策立場と[core_tenets|E]、その代表的な大義です。その[fervor|E]は活動家たちの熱意にあります。\n\n 異なるイデオロギーを持つ政治家同士は、陣営が離れるほどお互いを好む傾向が薄れていきます。誰でも考えを変えることができます(その決定は「政治を変える」)、ただし代償があります。"
 game_concept_faith_evil: "妥協できない"
 game_concept_faith_evil_desc: "この[rite|E]は反対の憲法的未来を望んでいます：ナショナリストはユニオニストに対して。\n\n#S 効果: \n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "反対"
 game_concept_faith_hostile_desc: "この[rite|E]は主要な政治的分断を越え、左派対右派です。\n\n#S 影響:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "イデオロギー的距離"
 game_concept_faith_hostility_desc: "すべての [faiths|E] は、それぞれの政治的距離によって互いに関係を持っています。\n\n同じか隣接する [religion|E] のイデオロギーは細部で意見が異なります；左派と右派は対立します；ナショナリストとユニオニストは和解できません。\n\n次の関係が存在します: [faith_righteous|L]、[faith_astray|L]、[faith_hostile|L]、および [faith_evil|L]。"
 game_concept_faith_righteous: "同志的"
 game_concept_faith_righteous_desc: "この[rite|E]はあなたの政治を共有します。\n\n#S 効果: \n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "イデオロギーの"
 game_concept_faiths: "イデオロギー"
 game_concept_feast_desc: "支配者やスタッフがパーティーで集まり、何かを祝う[activity|E]です...何かしらのことを。\n\narticipantsは[stress|E]を失い、ホストからの[opinion|E]を増やします。これほど多くの人を集めることで、他にもさまざまな影響が及ぶ可能性があります。\n\nA [ruler|E] [liege|E]や[vassals|E](そして様々な[courtiers|E])を$activity_feast$に招待します。"
 game_concept_fervor: "確信"
 game_concept_fervor_desc: "$game_concept_fervor$の[faith|E]の範囲は#V 0#!から#V 100%#!までです。それは活動家や有権者がどれだけ熱心かを測定します: 出席率、ボランティア、活動音。\n\n高い$game_concept_fervor$はイデオロギーの選挙区がそのMPの政治により関心を持つようにします。"
 game_concept_feudal_desc: "封建[government_form|E]の下では、[liege|E]は統治のための[vassals|E] [land|E]権力を譲る代わりに、後方議員と党首の間の個別の[vassal_contract|E]によって調整される、[levies|E]と[taxes|E]政権を交換します。"
 game_concept_flowery_war_desc: "これは特別なタイプの[war|E]で、[faith|E]が人身御供を行う[ruler|E]によって始められます。$game_concept_flowery_warring$の主な目的は、生贄として戦い、捕らえた生贄の対象となる[prisoners|E]であり、どちらの側も戦闘を通じて十分な[war_score|E]を得て、決して生贄を[siege|E]せずに勝利できるようにすることです。\n\n $game_concept_war$の終わりに、勝者(防御者を含む)が$game_concept_faith$人身御供を実践した場合、敗者の数[court|E]から数$game_concept_prisoners$を奪われます。もし$game_concept_flowery_war$の両主要な戦闘員が同じイデオロギーを持った場合、その戦争は神聖なものとみなされ、敗北しても敗北した側は(減った)[piety|E]を受け取ることができます。\n\n [dungeon|E]で$game_concept_flowery_war$勝利して得た$game_concept_prisoners$があれば、$game_concept_flowery_war$を実施または継続することはできません。"
 game_concept_foreign_affairs_desc: "[chancellor|E]が実施する[councillor_task|E]。\n [independent|E] [ruler|E]としては、他の独立系支配者からの評価が高まります。バックベンチャーにとっては、同じ[liege|E]の他のバックベンチャーからの評価が高まります。"
 game_concept_fp3_demand_submission_interaction_desc: "政治的資本、策略、威圧を用いて[hook|E]の形で[character_possessive|E]忠誠を要求する。"
 game_concept_gender_doctrines: "ジェンダー政策の立場"
 game_concept_gender_doctrines_desc: "これらの[doctrines|E]は、[faith|E]のキャラクターがどのキャラクターに利用可能な[gender_laws|E]かを決定します。\n\nItはまた、どの継承[claims|E]ができるか、誰が[commanders|E]・[knights|E]できるか、そして[bastard|E]がどの親の[house|E]に属するかなど、いくつかの追加ルールも決定します。\n\nジェンダー政策の立場は:\n$BULLET_WITH_TAB$Zメール支配\n$BULLET_WITH_TAB$Equal\n$BULLET_WITH_TAB$Female Dominated"
 game_concept_gift_desc: "他のキャラクターにギフトを送ると、その見返りとして[gold|E][gold_i].\n\nに対するあなたの[opinion|E]が増加します。受け取る側が欲張りであるほど、送らなければならない資金は多くなり、得られる好意も増えます。\n\nあなたの[diplomacy|E]が高いほど、得られる好意は増えます。"
 game_concept_glory_desc: "An [accolade_possessive|E] 栄光はその [accolade_rank|E].\n\n 栄光は、[acclaimed_knight|E] が [battles|E] に勝利したり、戦士を倒したり、[GetActivityType( 'activity_tournament' ).GetName] [contests|E] に参加したり、[activities|E] に出席したりすることで得られます。\n\n しかし、星の主催者が敗北した戦闘に関与すると、栄誉の栄光は下がり、星の主催者が戦闘、決闘、または他の名誉ある方法で死ななかった場合、[accolade_succession|E] にも減少する可能性があります。"
 game_concept_gold: "資金"
 game_concept_gold_desc: "資金とは政治家のお金：寄付、会費、選挙資金。スタッフ、事務所、チラシ、キャンペーンの費用に使われる"
 game_concept_goliardic_shenanigans_desc: "[GetActivityType('activity_adult_education').GetName]のキャラクターは、学生生活を受け入れることであらゆるいたずらをすることがあります。それらの冒険の結果は予測不可能で、[skill|E]ポイント、生活および圧力[traits|E]、生活経験、病気、傷などが含まれます。"
 game_concept_government_authority_desc: "$game_concept_government_authority$ は [ruler|E] がその [vassals|E] に及ぼす一般的な権力を表しています。\n\n 異なる [governments|E] には異なる形態の $game_concept_government_authority$ があります。例えば、[feudal|E] [realms|E] は [crown_authority|E] を使用し、[clans|E] は [tribal_authority|E] を使用し、[administrative|E] は [imperial_bureaucracy|E] を使用します。$game_concept_government_authority$ を上げるには、レベルと支配者の [learning_skill|E] に応じた量の [prestige|E] が必要です。\n\n#weak 後列議員は高いレベルの $game_concept_government_authority$ を嫌い、それを下げることが [Concept( 'liberty_faction', 'Liberty Factions' )|E] の主な目標です。#!\n\n すべての [governments|E] が $game_concept_government_authority$ を持っているわけではありません。"
 game_concept_governor_desc: "$game_concept_governor$ は [liege|E] の主要なバックスベンチャー（後方議員）であり、[government_bureaucratic_gov|E] を持っています。彼らは党首によって指名され、[realm|E] 内の領地を管理し、[governor_efficiency|E] を活用します。\n\n $game_concept_governor$ の [title|E] および、それに含まれる [counties|E] は [province|E] と呼ばれます。[governance_issues|E] は州内に現れることがあり、$game_concept_governor$ がそれを解決する必要があります。\n\n$game_concept_governors$ は [influence|E] を蓄積し、他の $game_concept_governorships$ の [succession|E] を操作することができます。"
 game_concept_great_holy_war_desc: "$game_concept_great_holy_war$は、特定の[faiths|E]の[head_of_faith|E]のみが宣言できる[war|E]の特別なタイプであり、目的は自分たちのイデオロギーの支配下に全[kingdom|E]を置くことです。\n\n$game_concept_great_holy_wars$は、選ばれた[kingdom|E]内の別の[religion|E]のすべての[rulers|E]を対象とし、彼らに共同で防衛させます。勝利した場合、対象となった国家内のすべての[titles|E]が奪取され、攻撃者間で分配されます。\n\nイデオロギーは、その[doctrines|E]によって、[directed_great_holy_wars|E]、[undirected_great_holy_wars|E]、またはまったく$game_concept_great_holy_wars$にアクセスできない場合があります。\n$EFFECT_LIST_BULLET$[GetTenetType('tenet_armed_pilgrimages').GetBaseName]、[GetTenetType('tenet_struggle_submission').GetBaseName]、または[GetTenetType('tenet_warmonger').GetBaseName]の[core_tenets|E]は、一般的にグレート聖戦にアクセスするために必要です。\n$EFFECT_LIST_BULLET$[GetDoctrineType('doctrine_temporal_head').GetBaseName]のリーダーを持つイデオロギーは、指向型グレート聖戦にのみアクセスできます。\n$EFFECT_LIST_BULLET$[GetDoctrineType('doctrine_spiritual_head').GetBaseName]のリーダーを持つイデオロギーは、非指向型グレート聖戦にのみアクセスできます。\n$EFFECT_LIST_BULLET$リーダーのいないイデオロギーは、通常適格であっても、グレート聖戦を宣言できません。\n\n一部のイデオロギーでは、聖戦に「十字軍」や「ジハード」などの特別な名称があります。これらのグレート聖戦は名前が異なるだけで、他のグレート聖戦と同様に機能します。"
 game_concept_great_project_desc: "偉大なプロジェクトは、[realm|E]の全資源を投入する大規模な事業です。\n\n偉大なプロジェクトの一部は[great_building|E]の建設を含み、他は、あるものは、大[natural_disaster|E]からの回復を含みます。\n\n党の[ruler|E]が偉大なプロジェクトの発展を監督する一方で、[subjects|E]その進展を支援するための[great_project_contributions|E]を提供できます。"
 game_concept_head_of_faith: "運動リーダー"
 game_concept_head_of_faith_desc: "$game_concept_head_of_faith$ とは、[faith|E] の正式な指導者のことです。$game_concept_head_of_faith$ の権限と性質は、イデオロギーの [doctrines|E] に依存します。\n\nいくつかのイデオロギーには、[spiritual_head_of_faith|E] #weak（例:ローマ教皇）、#! があり、[temporal_head_of_faith|E] #weak（例:カリフ）、#! があり、$game_concept_head_of_faith$ が全く存在しないものもあります。"
 game_concept_head_of_faith_possessive: "運動指導者の"
 game_concept_head_of_rite: "主要な声"
 game_concept_head_of_rite_desc: "[character|E]が主導する[rite|E]：その[counties|E]の多くを率いる政治家。"
 game_concept_heads_of_faith: "運動指導者"
 game_concept_herder_desc: "牧畜民の政党は統治のあらゆる側面から排除されています。彼らは[armies|E]を指揮せず、[buildings|E]を所有せず、[alliances|E]を創設し、[wars|E]を宣言しません。[holding|E]を作[nomads|E] [migrate|E]すると、牧畜民は小さな群れによって徐々に地元の[county_fertility|E]土地を補充していきます。\n\n彼らは適切な[nomad|E] [rulers|E]に怯え、挑戦されるとすぐに土地を明け渡します。"
 game_concept_heresies: "分派グループ"
 game_concept_heresy: "分裂"
 game_concept_heresy_desc: "[faith|E] の [fervor|E] が致命的に低下すると、分裂の発生が起こる可能性があります。発生には、次第に重症化する3つの形態があります:\n#indent_newline:7 $BULLET_WITH_TAB$ 既存の [rite|E] がより [rite_divergent|E] になり、さらに広範囲に拡散します。#!\n#indent_newline:7 $BULLET_WITH_TAB$ 新たに [rite_divergent|E] を伴う [rite|E] が現れ、土地全体に広がります。#!\n#indent_newline:7 $BULLET_WITH_TAB$ キリスト教の [faiths|E] において、ボゴミリ主義やカタリ派のような歴史的分裂が現れます。#!\n\n [faith|E] が真に分裂の危険にさらされるのは、その [mainline_rite|E] が少なくとも #V 100#! [counties|E] に達している場合のみです。それ未満では、より深刻な2つの形態は全く発生せず、最も軽度なものもはるかに稀です。\n\n すべての発生は、$game_concept_fervor$ の統一の高まりで終わります。"
 game_concept_heretical: "ブレイクアウェイ"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ は2番目に高いレベルです。[vassals|E] は#N -20#! [opinion|E]の罰則を[liege|E]に対して受けます。\n\nこのレベルでは、[limited_crown_authority|E]で党首が得る権限に加えて、同じ党首の下の平議員はもはや互いに戦いを仕掛けることはできず、支配者は利用可能な全ての[succession_laws|E]の間で交代でき、平議員の[titles|E]は党首の[realm|E]外の支配者によって継承されることはありません。\n\n最後に、タイトル[revocation|E]や平議員[retraction|E]を拒否することは、党首に十分な正当な理由がなくても[crime|E]と見なされます。"
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ は [nomadic_authority|E] の中間レベルです。このレベルでは、[migration|E] は [de_jure|E] [kingdom|E] [titles|E] を [the_great_steppe|E] 内で対象にでき、党の指導者は [vassal|E] の野党議員を [retract|E] できます。"
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ は[tribal_authority|E]の2番目に高いレベルです。[vassals|E] は#N -20#! [opinion|E]の罰則を[liege|E]に対して受けます。\n\nこのレベルでは、[imprison|E] [characters|E]する能力に加えて、党首は[revoke|E] [titles|E]し、平議員の平議員を[retract|E]できます。"
 game_concept_hold_court_desc: "[vassals|E]と[courtiers|E]が[realm|E]に集まり、[liege|E]を請願し、不満を表明する[royal_court|E] [activity|E]。\n\n 党首が判断を下す対象となるのは、些細な争いや誤解から、世界全体に及ぶ大惨事まで多岐にわたります。ほとんどの問題には有益な解決策があります。関係者にとってはそうでなくても、少なくとも党首にとってはそうです。"
 game_concept_holder_desc: "[title|E]の$game_concept_holder$は、その称号を持つキャラクターです。[barony|E]および[county|E]の称号は、定着すれば常に$game_concept_holders$を持っていますが、[duchy|E]、[kingdom|E]および[empire|E]の称号はまだ作られていない場合があります。さらに注意点として、高レベルの称号の$game_concept_holder$は、実際にはその称号の[de_jure|E]領域内の領土を支配していないかもしれません。\n\nより高い階層の称号を保持すると、より高い階層の[vassals|E]を持つことができます。例えば、デュークは伯爵を補佐役として持つことができ、王はデュークを持つことができます。"
 game_concept_holding_court: "手術（個別面談）を行う"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$は[faith|E]にとって宗教的な意味を持つ[artifact|E]です。$game_concept_holy_relic$はそのイデオロギーの一[holy_site|E]に含めて利益を得るために、その中に[enshrined|E]ることができます。\n\n一部の遺物は本質的にイデオロギーにとって神聖ですが、聖遺物として[sanctified|E]されることもあります。"
 game_concept_holy_site: "ハートランド"
 game_concept_holy_site_desc: "$game_concept_holy_site$とは、[faith|E]にとって宗教的に重要な場所を含む[county|E]です。正しいイデオロギーの性格が保持する$game_concept_holy_sites$は、そのイデオロギーの全員に効果をもたらし、[special_buildings|E]や[holy_orders|E]の創造も可能にします。各イデオロギーは異なるセット$game_concept_holy_sites$を持っています。\n\n通常の$game_concept_holy_site$はグローバルなイデオロギーの利益をもたらさず、局所的な利益のみをもたらします。イデオロギーの最も尊敬される場所は代わりに[eminent_holy_sites|E]として指定されます。イデオロギーはそれぞれの存在数に制限があります。"
 game_concept_holy_sites: "ハートランド"
 game_concept_holy_war_desc: "$game_concept_holy_war$は、一つの[faith|E]の[ruler|E]が異なるイデオロギーの支配者に対して行う[war|E]の特別なタイプです。\n\n$game_concept_holy_war$は通常非常に破壊的で、聖戦の勝者は通常、対象地域のすべての[counties|E]を自分のものとして奪います。しかし、攻撃者のイデオロギーが[GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName]である場合や、防御側が対象地域に攻撃者自身のイデオロギーの[vassals|E]を持っている場合、対象地域の一部またはすべてのバックベンチャー支配者は単に攻撃者に移される場合があります。\n\n他の戦争と異なり、対象と同じイデオロギーの支配者は、[alliance|E]を必要とせずに防衛に加わることを選択できます。\n\n聖戦は、異なる[religious_families|E]に応じて許可される場合や制限される場合があります。"
 game_concept_home_court: "内務省"
 game_concept_home_courts: "内務省（複数）"
 game_concept_home_courts_possessive: "内務省の"
 game_concept_hungarian_invasion_casus_belli_desc: "キャンペーン中に一度だけ使用できる強力な[casus_belli|E]で、パンノニア内でターゲットが保持するすべての領土を征服することができます\n\n勝利した場合、攻撃者の$mogyer_collective_noun$内のすべての[realm|E]がパンノニアに移動し、[counties|E] #EMP そして#! [vassals|E]を移動させ、$avar$ $game_concept_counties$を排除します。パンノニア外の他の後部議員は放置され、かつて$game_concept_counties$によって占領または保持されていた$mogyer_collective_noun$は、現地の小競争する諸侯やライバルの草原部族に委ねられます。"
 game_concept_hybrid_culture_desc_DLC: "Aの$game_concept_hybrid_culture$は、既存の2つの文化を組み合わせて作られた[ruler|E] [culture|E]です。\n\n $game_concept_hybrid_culture$は、元の文化の[traditions|E]、[culture_pillars|E]、美学の混合体です。\n\nKEEP0009ZZKEEP異なる[heritage|E]の文化だけでハイブリッドを形成でき、その[prestige|E]コストは互いの合い[cultural_acceptance|E]に基づいています。\n\n文化受容度が高いほど、ハイブリッドが形成される際に多くの[counties|E]が改宗します。ハイブリッド文化の支配者は、形成後#V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#!年間、親文化の選挙区ではるかに速く[promote_culture|E]活動します。\n\nNew文化は[divergent_culture|E]としても現れることがあります。"
 game_concept_iberian_reclamation_desc: "これは[iberian_struggle|E]の[struggle_involved|E] [rulers|E]が利用できる特別なタイプの[war|E]です。\n\n攻撃者は、[struggle_uninvolved|E] [ruler|E] [struggle_interloper|E]その地域外に土地を持たない[struggle_involved|E] [counties|E]を含むあらゆる[duchy|E]を征服するか、その地域以外に土地を持たない場合は[vassalize|E]することを目指します。"
 game_concept_initial_legitimacy: "初期任期"
 game_concept_intrigue: "スピン"
 game_concept_intrigue_lifestyle: "スピン・ライフスタイル"
 game_concept_intrigue_skill: "スピンスキル"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$はメディアとやり取り、人々を読むための[skill|E]です。ブリーフィング、リーク、友好的な新聞への記事掲載、陰謀は秘密にされる。\n\nitは主にスピン[schemes|E]を推進し、防衛するために使われています。\n\n対応する[lifestyle|E]が[intrigue_lifestyle|E]です。"
 game_concept_intrigue_task_contract: "スピン契約"
 game_concept_intrigue_task_contract_possessive: "スピン・コントラクト"
 game_concept_intrigue_task_contracts: "スピン契約"
 game_concept_intrigue_task_contracts_possessive: "スピン・コントラクト"
 game_concept_kingdom: "ネイション"
 game_concept_kingdoms: "国"
 game_concept_knight: "オーガナイザー"
 game_concept_knight_army_modifier: "オーガナイザー軍の修飾子"
 game_concept_knight_army_modifier_desc: "#!を含む関連の該当[acclaimed_knight|e]を含む任意の[army|e]に適用される効果#high \n\nオーガナイザー軍修飾子が適用されるには、その#high の軍隊の[commander|e]でない#! [knight|e]必要です。"
 game_concept_knight_army_modifiers: "オーガナイザー軍の修飾語"
 game_concept_knight_desc: "$game_concept_knight$とは、あなたの[army|E]内で直接戦う[vassal|E]、[courtier|E]、または[follower|E]のことです。\n\n [battles|E]、$game_concept_knights$ [prowess_skill|E]を使ってより効果的に戦うことができます。高い$game_concept_prowess$は敵により多くのダメージを与えられ、生き残るか無傷で抜け出す可能性$game_concept_battle$高くなります。\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak オーガナイザーは、隊[culture]や、[faith]によって異なる名前で呼ばれることがあります。例えば、$knight_champion_no_tooltip_plural$、$knight_faris_no_tooltip_plural$、$knight_baghatur_no_tooltip_plural$などです。\n\nガニザーは、キャラクターとその部隊の随行員の両方を表します。#!"
 game_concept_knight_desc_ACCOLADE_DLC: "[accolade|E] が与えられたオーガナイザーは [acclaimed_knights|E].\n\n になります"
 game_concept_knight_effectiveness: "オーガナイザーの効果"
 game_concept_knight_effectiveness_desc: "[ruler|E]のオーガナイザーの有効性は、その[knights|E]が[battle|E]でどれだけうまく戦うかを決定します。\n\n有効性が100%の場合、オーガナイザーは通常通り戦いますが、200%の場合、[prowess|E]が倍になったかのように戦います。"
 game_concept_knights: "主催者"
 game_concept_knights_possessive: "主催者"
 game_concept_kurultai_desc: "クルルタイは[council|E]を[nomadic_government|E]のために置き換えます。クルルタイのメンバーは党のエリートであり、円滑な[succession|E]を確保するために慰めるか[obedience|E]に強いるべきです。\n\n混乱した継承の出来事の後、彼らは[herd|E]の一部を盗み、新たな[liege|E]を放棄し、[realm|E] [title|E]で[claim|E]を獲得するでしょう。"
 game_concept_law_desc: "A [realm_possessive|E]法は、その党の構造を決定づけるものです。\n\n これらの中で最も基本的なのは党の[government_authority|E]であり、これらの法則が、日々の関係[lieges|E]と[vassals|E]がどのように関わるかを決定します。\n\n 党の日常生活には影響が少ないものの、党の[rulers|E] [succession_laws|E]と[title_laws|E]は依然として[succession|E]にとって非常に重要な要素です。"
 game_concept_learning: "政策"
 game_concept_learning_lifestyle: "政策ライフスタイル"
 game_concept_learning_skill: "政策スキル"
 game_concept_learning_skill_desc: "$game_concept_learning$はアイデアや詳細の[skill|E]です。ブリーフの読み上げ、法案の起草、選択委員会の存続などです。また、毎月[piety|E]も集まります。\n\n対応する[lifestyle|E]が[learning_lifestyle|E]です。"
 game_concept_learning_task_contract: "保険契約"
 game_concept_learning_task_contract_possessive: "契約書"
 game_concept_learning_task_contracts: "保険契約"
 game_concept_learning_task_contracts_possessive: "保険契約"
 game_concept_leasing_desc: "小[baronies|E]は[holy_orders|E]、[monastic_holy_orders|E]、または[clergy|E]に貸し出すことができます。リースされた結界は[holder|E]ではなく[lessee|E]に貸し出[taxes|E]と[levies|E]を提供します。\n\nミリタリー・オーダーは[castle_holdings|E]や[city_holdings|E]をリースでき、修道会や党の役人は[temple_holdings|E]リースが可能です。リースには、あるリース[lease_contract|E]が設けられる場合があります。\n\nリースされた[holdings|E]は依然として保有者の[realm|E]の一部と見なされます。[county_capitals|E]リースはできません。"
 game_concept_legitimacy: "任務"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ は党や国の目におけるリーダーの統治権です: 選挙で勝利、指導者選で勝利、議会の信任。 [ruler|E] がない者は追い借りた時間で生きています。 [vassals|E] はまた [legitimacy_expectations|E] を生成し、[liege|E] が満たすべきものとされます。\n\n [rulers|E] のみ $game_concept_legitimacy$ を持ち、これは彼らが統治者になる瞬間に計算され、[initial_legitimacy|E] につながります。 前の統治者の $game_concept_legitimacy$ の一部はまた彼らの [heir|E] に受け継がれます。\n\n$game_concept_legitimacy$ 多くのゲームシステムに影響を与え、[marriage|E] の提案、[vassalization|E] および [alliances|E] が受け入れられやすくなり、[claims|E] が安くなり、[scales_of_power|E] が [regency|E] で変動します。\n\n$game_concept_legitimacy$ 通常、[legitimacy_levels|E] と 1 つの #weak 不正な #! 下層レベルを持っています。[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "使命の期待"
 game_concept_legitimacy_gain: "議席獲得"
 game_concept_legitimacy_level: "任務レベル"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] 支配者は戦争で勝利すると#V 50%#!多くの任期を得ますが、敗北すると倍失います。また、[single_combat_duel_plural|E]および同等またはそれ以上の[dominance|E]を持つ貴族との結婚からも任期を得ます。[courtiers|E]"
 game_concept_legitimacy_levels: "任務レベル"
 game_concept_levies: "ボランティアたち"
 game_concept_levy: "ボランティア"
 game_concept_liege: "党首"
 game_concept_liege_desc: "A $game_concept_liege$ は、少なくとも一人の [vassal|E] が従う政治家です。党のリーダー自身は首相に従います。"
 game_concept_liege_possessive: "党首の"
 game_concept_liege_taxes: "党首が課税"
 game_concept_liege_taxes_desc: "あなたの$game_concept_liege_taxes$は、[obligations|E]の一部として[liege|E]に支払わなければならない[taxes|E]です。[independent|E]であれば、一切$game_concept_liege_taxes$を支払う必要はありません。\n\n あなたの党首の視点から見ると、これらの同じ税金は、彼ら自身の家の税金と区別するために[vassal_taxes|E]と呼ばれています$game_concept_liege$。"
 game_concept_lieges: "党首"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' は [crown_authority|E] の最低レベルから2番目のレベルです。[vassals|E] は [liege|E] に対して #N -10#! [opinion|E] のペナルティがあり、党首は後列議員の [titles|E] や [retract|E] を [revoke|E] することができます。[ruler|E] は利用可能な Partition [succession_laws|E] の間で変更可能です。"
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ は[nomadic_authority|E]の2番目に低いレベルです。[migration|E] は[de_jure|E] [duchy|E] [titles|E]を[the_great_steppe|E]内でターゲットにでき、[titles|E]は取り消される可能性があり、党首は現在[imprison|E] [characters|E]を[realm|E]で実行できます。\n\n#V $step_away_from_the_steppe_decision$#! [decision|E]を使用できます。"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ は[tribal_authority|E]の2番目に低いレベルです。[vassals|E] は#N -10#! [opinion|E]の罰則を[liege|E]に対して受け、党首は現在[imprison|E] [characters|E]を[realm|E]で実行できます。"
 game_concept_long_reign_desc: "『長期在位』は、長期間支配した[liege|E]を持つ[realm|E]内のすべてのキャラクターに増加する[opinion|E]ボーナスを与える。\n\n同様に、臣民は新しい党首に対して減衰する[short_reign|E]意見のペナルティを受ける。"
 game_concept_mainline_rite: "イデオロギー"
 game_concept_mainline_rites: "イデオロギー"
 game_concept_manage_guards_desc: "$game_concept_increase_control$は、[marshal|E]が実施する[councillor_task|E]です。\n\nは大臣の [liege|E]に対する[hostile_scheme|E] [success_chance|E] [knight_effectiveness|E]を増やし、下げます。"
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$は、[mandala|E] [ruler|E]によって課された3つの勅令で、[prosperity_decree|E]、[expansion_decree|E]、[reverence_decree|E]で示されます。\n\n一般に、マンダラ党は非常に中央集権的な権力構造を持ち、[subjects|E]と[laws|E]に対する権力は関連する統治者にあり、住民からほとんど異議なく必要に応じて変更することができます。"
 game_concept_mandala_desc: "$game_concept_mandala$ [government_form|E]の下では、[domain_limit|E]と[direct_vassals|E]の量が制限されています。代わりに、[liege|E]と[suzerain|E]は党派を拡大するために[tributaries|E]に依存しています。マンダラ\n\nA [ruler|E]神王やデヴァラージャとして見られたいと願い、その後[mandala_radiance|E]に頼って$game_concept_tributaries$を得て維持します。\n\nA $game_concept_ruler$ [opinion|E]を維持し、長期的に維持するために$game_concept_tributaries$との関係を深めなければなりません。継承に関しては$game_concept_tributaries$が散り散りになることがあります。$game_concept_ruler$が価値ある[mandala_succesor|E]でない限り。"
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ は [legitimacy|E] の特別なタイプで、[son_of_heaven|E] のみが利用可能です。それは君主の統治権を表し、誰が天下の下で最高の支配者と見なされるかを示します。\n\n 権威は [dynastic_cycle|E] と密接に関係しています。サイクルは現君主がどのように権威を得るかに影響を与え、また君主の権威のレベルに基づいて [situation_dynastic_cycle_phase|E] を変更することもあります。"
 game_concept_marshal: "内務大臣"
 game_concept_marshal_desc: "$game_concept_marshal$ は治安担当の [councillor|E] です：警察、国境、秩序維持。"
 game_concept_marshals: "内務大臣（複数）"
 game_concept_martial: "セキュリティ"
 game_concept_martial_lifestyle: "セキュリティライフスタイル"
 game_concept_martial_skill: "セキュリティスキル"
 game_concept_martial_skill_desc: "$game_concept_martial$は法と秩序、防衛、危機管理のための[skill|E]ものであり、街と国の安全を守るための機関です。\n\n対応する[lifestyle|E]は[martial_lifestyle|E]です。"
 game_concept_master_assassin_desc: "$game_concept_master_assassin$は[GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]との関係[faiths|E]によって可能になった[court_position|E]です。$game_concept_master_assassin$は危険な狂信者で、下位の暗殺者と協力してイデオロギーの敵と見なされる者を討ち取ります。"
 game_concept_maximum_piety_level: "最大政治資本レベル"
 game_concept_men_at_arms: "活動家"
 game_concept_men_at_arms_counter: "活動家の対抗"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$ はプロフェッショナルな [soldiers|E] であり、[levies|E] よりも優れています。\n\n プレイヤーは、自身のアクティビストの構成や人数を直接管理できます。[regiments|E].\n\n アクティビストの種類によって、異なる [terrain|E] で良し悪しがあります。各タイプはまた別のタイプを [counters|E] します。\n\n アクティビストは、[stationed|E] 内の [holdings|E] で効果を高めることができます。"
 game_concept_mental_break_desc: "[stress|e]がキャラクターに圧倒されると、彼らはメンタルブレイク—自分のプレッシャーを下げるために何でもしなければならないと感じる個人的な危機—を経験します。\n\nメンタルブレイクに苦しむキャラクターは、状況に対処するいくつかの方法を持っていますが、その多くは負の結果を伴います。\n\n低い[stress_levels|E]では、これらの結果は軽微で簡単に管理できます。しかし、プレッシャーのレベルが上がると、これらの結果も増加し、最終的には狂気や死に至ることさえあります。"
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$は最も高位の[minister|E]であり、外交問題を担当します。通常、彼らは[grand_secretariat_director|E]の地位に任命されます。\n\n外務大臣は、#V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]によって指定[grand_secretariat_director|E]となることがあります。\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$は[realm|E]で最も高位の指揮官であり、[title_men_at_arms|E]人の部隊[army|E]を指揮します。\n\n内務大臣は、#V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]によって指定[grand_secretariat_director|E]となることがあります。\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$は[ministers|E]のみに利用可能な独自の[vassal_obligations|E]セットです。\n\n全ての文民大臣は特定のオプションをデフォルトとして持ち、[minister_grand_marshal|E]は内務大臣に[title_men_at_arms|E]を提供する独自のオプションを持っています。\n\nこれらの義務は変更できません。"
 game_concept_natural_prowess: "自然なスタミナ"
 game_concept_noble_family_desc: "$game_concept_noble_families$ は [houses|E] において強力な存在です [government_bureaucratic_type|E] [realm|E]。彼らは [estate|E] を所有し、[house_head|E] によって管理され、党の重要な一部であり続け、[influence|E] を集めて [provinces|E] を確保しようとします。\n\n 影響力のある $game_concept_noble_family$ は [powerful_family|E] または [dominant_family|E] になる可能性があります。"
 game_concept_obedience_desc: "[GetGovernment( 'nomad_government' ).GetName] [realms|E] において、忠誠は、[character|E] がその [liege|E]、[suzerain|E]、または [court|E] の所有者にどれだけ従順であるかを決定する。キャラクターは一度に一つの [ruler|E] にしか従うことができない。\n\n従順なキャラクターは、[hostile_schemes|E] に参加したり、[wars|E] に加入したり、[factions|E] に基づいて党首に反抗したりする可能性が低い。彼らは [succession|E] の間、党首の好みを常に支持し、[claims|E] を押し付けることはない。非従順な [tributaries|E] は自由になろうとする場合がある。\n\nキャラクターのスコアが [obedience_threshold|E] を上回ると、従順になる。"
 game_concept_offer_vassalization_desc: "[title_rank|E]の低い[independent|E] [ruler|E]に[vassalage|E]を差し出し、平和的にパーティに加える交流。"
 game_concept_organize_levies_desc: "[marshal|E]が実施する[councillor_task|E]。大臣の部隊[liege|E] [realm|E]で、[garrison|E]規模と[levy|E]増援率を増加させます。"
 game_concept_organized_desc: "組織化された [faith|E] は宗教的階層を持っています。礼拝や慣習はより組織化され、聖典は形式化されています。\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] イデオロギーは改革によって組織化されることがありますが、他のイデオロギーは常に組織化されていると見なされます。"
 game_concept_pam_challenge_hof_cb: "指導者への挑戦運動"
 game_concept_papal_recipient_desc: "[great_holy_war|E]の主なターゲットがすでに保持されているか侵略者のイデオロギーのメンバーによって主張されている場合、主な[Concept( 'war_contribution', 'Contributor' )|E]が[beneficiary|E]に優先権を与えると決定しない限り、戦われている称号の正当な受取人と見なされる。"
 game_concept_peasant_faction_desc: "$game_concept_peasant_faction$ は低い [county_opinion|E] を持つ [counties|E] によって構成されています。他の [factions|E] とは異なり、これは [faction_military_power|E] が低くても常に反乱を起こします。農民は一般に楽観的で非識字であるためです… 成功した抗議運動は [realm|E] における統制を大幅に低下させます。"
 game_concept_peasant_factions: "抗議運動"
 game_concept_perk_desc: "パークは多くの有用で興味深い効果をもたらすアンロック可能な恩恵です。これらは[lifestyle|E]内の[focus|E]を選択し、関連する形態の[experience|E] #weak を使うことでアンロックされます(例:$game_concept_intrigue_lifestyle$ $game_concept_perk$をアンロックしたい場合はスピン$game_concept_experience$)。#!"
 game_concept_personal_tenet: "個人的な目的"
 game_concept_personal_tenets: "個人的な目的"
 game_concept_petition_antipope_gold_interaction: "反教皇への資金請求 請願"
 game_concept_piety: "政治資本"
 game_concept_piety_desc: "$game_concept_piety$は政治家の党および権力層に対する信用です：示された忠誠、行った便宜、支持した適切な大義。\n\nこれは[government_form|E]に応じて、党や権力層に要求する際に使われます。\n\nキャラクターがPolitical Capitalを得るたびに、次の[piety_level|E]に向けて進展します。"
 game_concept_piety_experience: "忠誠心"
 game_concept_piety_experience_desc: "キャラクターが得る忠誠ポイントごとに、次の[piety_level|E]への進行度が増加します。キャラクターが[piety|E]を獲得すると、同量の忠誠も獲得します。"
 game_concept_piety_level: "政治資本レベル"
 game_concept_piety_level_desc: "キャラクターの $game_concept_piety_level$ は、彼らが党や体制側からどれだけ信用を得ているか、そして[faith|E]の他者との関係を示す指標です。\n\nキャラクターが[piety|E]を得るたびに、次の政治的資本レベルへと進みます。\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nレベルは以下の通りです\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "政治資本レベルの影響"
 game_concept_piety_level_impact_desc: "政治資本レベルの影響は、現在の [piety_level|E] から得られる [modifiers|E] の増減に影響します。"
 game_concept_piety_levels: "政治資本レベル"
 game_concept_playdate_desc: "[EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V]歳未満の支配者やスタッフが集まり、日々の退屈さを忘れて遊ぶ[activity|E]。\n\nパーティチャントは[stress|E]を失い、ホストへのご[opinion|E]が増えます。これだけ多くの子どもたちを集めることで、他にもさまざまな影響が起こる可能性があります。\n\nA [ruler|E] [liege|E]や[vassals|E](そして様々な[courtiers|E])を$activity_playdate$に招待します。"
 game_concept_player_heir_desc: "$game_concept_player_heir$は、プレイヤーが引き続きプレイし続けるという、[succession|E]でプレイし続けるためのもの[heir|E]です。\n\n $game_concept_player_heir$は通常、[primary_heir|E]と同じですが、[primary_title|E]の[succession_law|E]が[dynasty|E]以外のキャラクターに渡るべきだと決めている場合は、代わりに2番目に高いティア(または3番目、4番目など)の王朝継承者としてプレイし続けます。\n\nこの状況は、選挙継承法により$game_concept_player_heir$が追放される際によく見られます。もし[administrative|E] [realm|E]の[noble_family|E] [house_head|E]なら、[house|E]外のプライマリー・ヘイアーにパーティーを奪われるかもしれませんが、貴族の称号は保持されます。\n\n [ecclesiastical|e]なら、$game_concept_player_heir$はあなたの長子、通常は[archdiocese|e]を継ぐ[primary_title|e]を継ぐキャラクターです。"
 game_concept_popular_faction_desc: "$game_concept_popular_faction$ は低い [county_opinion|E] を持ち、共通の要素（例：[culture|E] または [faith|E]）を共有する [counties|E] によって構成されています。彼らは自由になろうとし、文化やイデオロギーに基づいて新しい [ruler|E] を選びます。このタイプの反乱は通常非常に危険です。"
 game_concept_popular_factions: "ポピュリスト運動（複数）"
 game_concept_powerful_family_desc: "$game_concept_powerful_family$は[government_bureaucratic_type|E] [realm|E]における最も影響力のある[houses|E]と[noble_families|E]の一つを表します。$game_concept_powerful_family$のメンバー \n\nA [political_schemes|E]が得意で、他の[characters|E]と共に行動することで望むものを手に入れ[interacting|E]可能性が高いです。\n\n常に存在する$game_concept_powerful_families$の数は限られており、その[powerful_family_rating_short|E]に基づいて強力とされるのは評価のトップ$game_concept_noble_families$です。[top_liege|E]家は例外で、常に強力とみなされます。\n\nA 家族がパーティの土地の大部分を支配すると[dominant_family|E]になることがあります。"
 game_concept_powerful_vassal: "有力背後議員"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' は、最も [soldiers|E] が多く、[income|E] が最も高い少数の [vassals|E] です。これらの後列議員には注意を払う必要があります。なぜなら、彼らはあなたの [council|E] に座席を持つことを期待しており、もし持たなければ、あなたに対する [opinion|E] が大幅に低くなるからです。\n\n [succession_law|E] を変更するには、すべての $game_concept_powerful_vassals$ があなたに対して肯定的な [opinion|E] を持っている、あなたによって [cowed|E] されている、または [imprisoned|E] されている必要があります。"
 game_concept_powerful_vassal_possessive: "有力背後議員の"
 game_concept_powerful_vassals: "有力背後議員たち"
 game_concept_prestige: "プロフィール"
 game_concept_prestige_desc: "$game_concept_prestige$は政治家の公的な名声です：名前の認知、新聞の紙面、放送時間。\n\nこれは[government_form|E]に応じて公の動きに使われます。\n\nキャラクターがProfileを獲得するたびに、次の[prestige_level|E]に向けて進展します。"
 game_concept_prestige_experience: "名声"
 game_concept_prestige_level: "プロフィールレベル"
 game_concept_prestige_level_impact: "プロフィールレベルへの影響"
 game_concept_prestige_level_impact_desc: "プロファイルレベルの影響は、現在の[prestige_level|E]から得られる[modifiers|E]を増減させます。"
 game_concept_prestige_levels: "プロファイルレベル"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$ は #V 7#! [electors|E] であり、[GetLaw('princely_elective_succession_law').GetName] [succession_law|E] を使用する [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )] によって皇帝と共に [title_heir|E] を選びます。\n\n[holders|E] #V 7#! の優先される [titles|E] は $game_concept_prince_electors$ として優先されます。これらの称号は帝国が創設されるときに選定されます。\n\n $game_concept_prince_elector$ の称号が破壊された場合、[de_jure|E] が保持していない帝国 [vassal|E]、その他の $game_concept_prince_elector$ が保持している場合、または保持者の [religion|E] が皇帝のものと異なる場合、直接の帝国バックスベンチャーまたは [independent_ruler|E] が保持する別の法定称号が以下の基準に基づいて選ばれます:\n$EFFECT_LIST_BULLET$[rulers|E] 皇帝の [faith|E] と [culture|E] が優先されます。\n$EFFECT_LIST_BULLET$[theocratic|E] と [feudal|E] の支配者が優先されます。\n\n#help 優先称号は選挙ビューに表示されます。#!"
 game_concept_promote_other_culture_development_decision_desc: "[decision|E] は、[development|E]、[control|E]、[building|E] のコスト、および異なる [cultures|E] から [counties|E] における防御側 [advantage|E] を改善することを可能にします。[cultural_acceptance|E] が #V 75%#! 以上である場合。\n\n この決定を下すことで、[prestige|E] [prestige_i] および [levies|E] も増加します。\n\n [realm|E] 内のすべての選挙区に影響があります。[gold|E] のコストは影響を受ける選挙区の数に応じて変動します。"
 game_concept_prowess: "スタミナ"
 game_concept_prowess_skill: "スタミナスキル"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ はキャラクターの身体的および精神的な耐久力を反映する [skill|E] です。十八時間勤務、徹夜、選挙運動の旅路。\n\n高いスタミナスキルは、[knights|E]として [battles|E] で、また [single_combat_duel_plural|E] でも生き残り、よく働く可能性が高いことを意味します。\n\nスタミナの各ポイントはオーガナイザーに与えられます:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E] は [rally_points|E] から $game_concept_raiders$ として育成することができます。$game_concept_raiders$ は隣接する土地に移動して [gold|E] を略奪することができます。\n\n $game_concept_raid$ を行うためには、略奪軍は外国の [ruler|E] が所有する [holding|E] に停まり、略奪を開始することを選択する必要があります — こうすると、しばらくの間略奪を行うことになり、その後に資金を獲得し、所持地を略奪します。\n\n 資金は軍に蓄えられ、帰還した時のみ財務に加えられます。資金を運んでいる略奪軍を倒すと、その資金を奪うことができ、しばらくの間あなたを略奪することはできなくなります。\n\n 一部の統治者のみが $game_concept_raid$ が許されており、特に [tribal|E] および [GetGovernment( 'nomad_government' ).GetName] の統治者が該当します。\n\n 特定の [raid_intents|E] は異なる報酬を得るよう設定することができます。"
 game_concept_rally_point_desc: "$game_concept_rally_point$は、あなたの指揮下にある[levies|E]と[men_at_arms|E]の集結地です。\n\n [war|E]時には、ラリーポイントの[soldiers|E]に連絡して、[army|E] 14を集めることができます。\n\nラリーポイントに割り当てられたボランティアは、あなたの[domain|E]か[vassals|E]のいずれかから来なければなりません。ラリーポイントは必要に応じて再編成、分割、統合が可能です。"
 game_concept_realm: "党"
 game_concept_realm_capital: "本拠地"
 game_concept_realm_capital_desc: "$game_concept_realm_capital$は[ruler|E]とその[court|E]家族が居住する[holding|E]です。このホールディングは[tax|E]ボーナスがあり、常にその地[primary_heir|E]に継承されます。\n\n[occupying|E]戦争中の敵の本拠地はかなりの[war_score|E]価値を与え、時には敵の家族のメンバーを[imprison|E]ることができます。"
 game_concept_realm_capital_possessive: "本拠地の"
 game_concept_realm_capitals: "本拠地（複数）"
 game_concept_realm_desc: "$game_concept_realm$ とは、政治家が直接的または [vassals|E] を通じて導く全ての人と全ての物のことです（[domain|E] とは異なり、それは彼ら自身が保持するものだけです）。"
 game_concept_realm_heir: "党の後継者"
 game_concept_realm_heir_desc: "パーティ・ヘアは[realm|E]の一[heirs|E]であり、そのルーラーが亡くなった際にパーティの[ruler|E]が保有する全てまたは一部の領取[titles|E]を受け取ります。\n\nAパーティは[succession_law|E]によって一人以上のパーティ・ヘイヤーを持つことがあります。"
 game_concept_realm_heirs: "党の後継者たち"
 game_concept_realm_law: "党の法律"
 game_concept_realm_law_desc: "このキャラクターの党に適用される法律、例えば[crown_authority|E]や[tribal_authority|E]のレベルなど。"
 game_concept_realm_possessive: "パーティーの"
 game_concept_realm_priest: "党司祭"
 game_concept_realm_priest_desc: "$game_concept_realm_priest$は[GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E]と[faiths|E]共に宗教的・精神的な事務を担当する[councillor|E]です。\n\nU [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName]の同等のもの([court_chaplains|E])と同様に$game_concept_realm_priests$、自動的に[ruler|E]の[domain|E]の[temple_holdings|E]を[lease|E]自動的に取り込み、また[vassal|E] $game_concept_realm_priests$から[taxes|E]や[levies|E]の一部を受け取ります。\n\n$game_concept_realm_priests$ [liege|E]が好意的な意見を持つなら、ボランティアや税金を供給します。[liege|E]の[opinion|E]が高いほど、より多くのものを提供します。党首に対する評価が低い\n\n$game_concept_realm_priests$は、税金やボランティアを一切提供せず、問題を引き起こす可能性があります。"
 game_concept_realm_priest_possessive: "党司祭の"
 game_concept_realm_priests: "党の司祭"
 game_concept_realm_size: "パーティーの人数"
 game_concept_realms: "政党"
 game_concept_regency_desc: "リージェンシーは、[ruler|E]が自力で[realm|E]を統治できない場合の特別な[diarchy|E]です。\n\nこれは、一般的に支配者が[child|E]、[imprisoned|E]、[GetTrait('incapable').GetName( GetNullCharacter )]、または党外の[activity|E]に参加している場合に発生します。長く続く\n\nA $game_concept_regency$ [entrenched_regency|E]になることがあります。"
 game_concept_religion: "政治的陣営"
 game_concept_religion_desc: "A、[faiths|E]関連する$game_concept_religion$グループは左派、中道派、右派、ナショナリスト、ユニオニストです。同じ陣営または隣接する陣営のイデオロギーは「ダイバージェント」と呼ばれ、左派と右派は対立派、ナショナリストとユニオニストは和解不能です。"
 game_concept_religions: "政治的陣営"
 game_concept_religious_families: "政治的家族"
 game_concept_religious_family: "政治的家族"
 game_concept_religious_family_desc: "$game_concept_religious_family$は、さまざまな[religions|E]政治陣[faiths|E]営やその中の関係者たちが互いをどう見ているか$game_concept_religious_family$です。\n\n [GetReligionFamily('rf_abrahamic').GetName]家族は、すべての#weak 人(他のアブラハム系を含む)に対する[holy_wars|E]を容認しています#!。政治陣営は、い[heresy|E]の影響を受けやすいです。\n\n [GetReligionFamily('rf_eastern').GetName]家系は他の政治家系に対する聖戦のみを容認している。\n\nZ [GetReligionFamily('rf_pagan').GetName]家系はすべての人に対する聖戦を容認しているが、政治陣営内のイデオロギーはそれにアクセスするために改革しなければならない。"
 game_concept_religious_head_succession_law: "運動指導者継承法"
 game_concept_religious_head_succession_law_desc: "[rulers|E] は [heads_of_faith|E] でもあり、追加の党 [succession|E] 法があります。それにより、[heir|E] は自分と同じ [faith|E] でなければなりません。これは決して変えることができず、$game_concept_head_of_faith$ [titles|E] は別の [title_succession|E] を持つことはできません。このタイプの党法を取り除く唯一の方法は、外部の力が [head_of_faith|E] $game_concept_title$ を破壊することです。"
 game_concept_religious_head_succession_law_short: "運動指導者法"
 game_concept_religious_head_succession_laws: "運動指導者継承法"
 game_concept_religious_head_succession_laws_short: "運動指導者法"
 game_concept_religious_superior_desc: "宗教上級者は、階層的な宗教構造の中で一人または複数の[subordinate|E]宗教党幹部に対して宗教的管轄権を持つ教区[character|E]です。"
 game_concept_retinue_maa: "付き人活動家"
 game_concept_retract_desc: "[limited_crown_authority|E] 以上であれば、[rulers|E] は議会議員の [vassal|E] を $game_concept_retract$ できるが、後者が [imprisoned|E] でない限りリスクがあります。議会議員は拒否して反乱を起こす可能性があります。\n\n 議会議員の撤回は、対象者がかなり深刻な [crime|E] の有罪でない限り [tyrannical|E] と見なされます。"
 game_concept_revoke_desc: "[limited_crown_authority|E]またはそれ以上のZZQ0000ZZで、[rulers|E]は自分たちの[vassals|E]の[titles|E]を$game_concept_revoke$することができますが、バックベンチャーが[imprisoned|E]でない限り、これはリスクの高い提案です。バックベンチャーは拒否して反乱を起こす可能性があります。\n\nタイトルの剥奪は、バックベンチャーがかなり重い[crime|E]の罪を犯していない限り、[tyrannical|E]と見なされます。"
 game_concept_rightful_liege: "正当な党指導者"
 game_concept_rightful_liege_desc_part2: "#weak 例: $c_dunbar$の伯爵は$k_england$の王の直接の補佐官です。王は$d_lothian$の公爵でも、$k_scotland$の王でも、$e_britannia$の皇帝でもないため、$c_dunbar$の伯爵はわずかな税金とボランティアしか提供しません。\n\n $c_norfolk$の伯爵も$k_england$の王の直接の補佐官です。王が$d_norfolk$の領域を保持していないため、伯爵も減少した税金とボランティアを提供します。しかし、$k_england$は$c_norfolk$の法的国であるため、$c_norfolk$の伯爵は$c_dunbar$の伯爵よりもはるかに多くの税金とボランティアを王に貢献します。#!"
 game_concept_rite: "イデオロギー"
 game_concept_rite_desc: "ウェストミンスターでは、各 [faith|E] は同名の単一 $game_concept_rite$ を持っている: そのイデオロギー自体と、その [core_tenets|E] および [doctrines|E] である。これらは固定されている: 政治家は考えを変えるが、イデオロギーそのものは変わらない。"
 game_concept_rite_divergence_desc: "ダイバージェンスは、親イデオロギーからどれだけ[rite_possessive|E] [core_tenets|E]や[doctrines|E]が離れているかを測る指標[faith|E]。[prohibited_tenet_status|E]原因を[core_tenet_status|E]として採用するイデオロギーは、よりダイバージェントである。\n\n ダイバージェンスは親イデオロギーの[fervor|E]を弱め、[heresy|E]の発生をより頻繁にする。イデオロギーが100#! ダイバージェンス#V に達すると自動的に分裂と宣言され、新たな[faith|E]となる。"
 game_concept_rite_knowledge: "イデオロギー知識"
 game_concept_rite_possessive: "イデオロギーの"
 game_concept_rites: "イデオロギー"
 game_concept_rites_possessive: "イデオロギー"
 game_concept_royal_court: "私人室"
 game_concept_royal_court_desc: "名[rulers|E]はプライベートオフィスを維持しており、さまざまなボーナスや機会にアクセスできます。\n\n [GetGovernment( 'feudal_government' ).GetName]、[GetGovernment( 'clan_government' ).GetName]、または[GetGovernment( 'tribal_government' ).GetName] [ruler|E]が[king|E]や[emperor|E]になると、プライベートオフィスにアクセスできます。\n\nach プライベートオフィスには[court_grandeur_level|E]があり、プライベートオフィスの知名度やプライベートオフィスの[court_type|E]に応じて特典が与えられます。\n\n担当者、[vassals|E]、[courtiers|E]はあなたのプライベートオフィスに現れるか、[realm|E]の誰でも不満を表明するために招待する[hold_court|E]こともできます。\n\nAプライベートオフィスでは、支配者が自分のオフィスに出[court_artifacts|E]表示でき、[inspired|E] [guests|E]がプライベートオフィスに現れて新しい[artifacts|E]を作成することを申し出ることができます。\n\nあなたが亡くなると、[player_heir|E]があなたのプライベートオフィスを相続します。"
 game_concept_royal_courts: "私人室（複数）"
 game_concept_sanctified_desc: "[artifact|E]を聖化することは、[faith|E]にとっての[holy_relic|E]にします。アーティファクトは複数のイデオロギーのために聖化することができます。"
 game_concept_scales_of_power_desc: "[power_sharing|E]中、[liege|E]と[diarch|E]の勢力バランスが$game_concept_scales_of_power$上で測定されます。\n\nAは$game_concept_diarch$に$game_concept_scales_of_power_scales$チップを向け、[diarch_powers|E]を解放し、党首の[diarch_affected_actions|E]コストを増加させることがあります。\n\nAは$game_concept_liege$に傾けると、党首が[diarchy|E]を終わらせやすくなります。\n\n $game_concept_scales_of_power_scales$は次の通りに振られます:\n$EFFECT_LIST_BULLET$U対立する相手に対して$swing_scales_currency_interaction$ [character_interaction|E]を振るう\n$EFFECT_LIST_BULLET$Aは$game_concept_diarch$であり、[mandate|E]イベントで(皮肉に)あなたの$game_concept_liege$に役立つ"
 game_concept_seasonal_prediction_desc: "熟練した$court_position_court_astrologer$は地域の次の[steppe_season|E]動きを予測し、パーティーリーダーに有益な情報を提供して次の行動を計画します。"
 game_concept_seize_peripheral_duchy: "周辺地域を奪取"
 game_concept_settlement_issue_desc: "開拓地の問題は、[migration|E]の新しい土地への移動を終えた後に[nomad|E] [ruler|E]に与えられるタスクです。これにより、紛争を処理し、新しい[domain|E]の地域[county_control|E]を増加させる機会が得られます。\n\n統治者が移住してから最初の数年間は、選挙区の統制が低いうちはこれらの問題が発生し続けます。"
 game_concept_short_reign_desc: "『短期在位』は、新しい[liege|E]を持つ[realm|E]内のすべてのキャラクターに減衰する[opinion|E]ペナルティを与える。\n\n同様に、臣民は長期間支配した党首に対して増加する[long_reign|E]意見ボーナスを受ける。"
 game_concept_shunned_desc: "多くの[rites|E]は特定の行動を「拒絶」と指定する[doctrines|E]を持っています。具体的な政策立場によっては、これらの行動もまた[criminal|E]と見なされることがあります。\n\nイデオロギーによって排斥された行動を実践している者が発覚した者は、[piety_level|E]を失い、それに対応する一[fame_trait|E]を得る;この特性は、その行動を排斥または犯罪者とみなすイデオロギーを持つすべての人に好まれません。\n\n排斥された行動の例には以下が含まれます\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "すべての[rite|E]は特定の[traits|E]特性を罪深いものとみなします。これらの特性を持つキャラクターは、たとえ同じイデオロギーを共有していなくても、その特性を罪深いと考えるすべてのキャラクターから[opinion|E]罰則を受けます。さらに、自分のイデオロギーが罪深いとみなす特性を持つキャラクターは毎月[piety|E]を失います。\n\nどの特性が罪とみなされるかはイデオロギーによって異なりますが、通常はそのイデオロギーの[core_tenets|E]とイデオロギーが属するもの[religion|E]の組み合わせによって決まります。"
 game_concept_spiritual_fulfillment: "個人的信念"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ は [character|E] が自身の政治にどれだけ慣れているかを示します。それは彼らの [traits|E] や行動によって上下します。"
 game_concept_spiritual_fulfillment_level: "確信レベル"
 game_concept_spiritual_fulfillment_level_desc: "[character_possessive|E] [spiritual_fulfillment|E]は$game_concept_spiritual_fulfillment_levels$に分かれており、それぞれに独自の効果があります。"
 game_concept_spiritual_fulfillment_levels: "確信レベルたち"
 game_concept_spiritual_head_of_faith: "精神運動リーダー"
 game_concept_spymaster: "チーフ・ウィップ"
 game_concept_spymaster_desc: "$game_concept_spymaster$は党を統括し、全員の秘密を知る[councillor|E]です。不忠なチーフ・ウィップには注意してください。彼らは簡単にあなたに対する陰謀を隠したり、加担したりすることがあります。"
 game_concept_state_rite: "国家イデオロギー"
 game_concept_state_rite_desc: "$game_concept_state_rite$ は [rite|E] で、[administrative_government|E] に支持され容認されています。このイデオロギーは [title|E] に結び付けられており、特定の [character|E] には結び付けられていません。[realm|E] 内のキャラクターを国家イデオロギーに変えるのは簡単ですが、国家イデオロギーから転換させるのは非常に困難です。\n\n 行政党の [ruler|E] のみが国家イデオロギーを変更できますが、[governors|E] は自由にそれに変換できます。"
 game_concept_stationed_regiment_desc: "[men_at_arms|E] [regiment|E]は[holding|E]に駐屯することで効果にボーナスが加えられます。\n\n[buildings|E]これらのボーナスをさらに増やすことができます。時には活動家の種類に限られますが、一般的には1人か2人に限られます。例えば、[GetBuilding('stables_01').GetName]は駐屯[light_cavalry|E]と駐屯した活動家にボーナスを与え[heavy_cavalry|E]。\n\n [war|E]中またはホールディングが[occupied|E]中を除くいつでもステーションに就くことができます。ホールディングが失われた場合、駐屯中の活動家は配置解除されます。"
 game_concept_steward: "大蔵大臣"
 game_concept_steward_desc: "$game_concept_steward$ は経済と [domain|E] を担当する [councillor|E] です：[taxation|E]、支出、[development|E]。"
 game_concept_stewards: "大蔵大臣たち"
 game_concept_stewardship: "経済"
 game_concept_stewardship_lifestyle: "経済生活"
 game_concept_stewardship_skill: "経済スキル"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$は予算、経済運営、および管理のための[skill|E]です。それは直接[taxation|E]を増加させるので、すべてのリーダーが望みます。\n\n対応する[lifestyle|E]は[stewardship_lifestyle|E]です。"
 game_concept_stewardship_task_contract: "経済契約"
 game_concept_stewardship_task_contract_possessive: "エコノミー契約"
 game_concept_stewardship_task_contracts: "経済契約"
 game_concept_stewardship_task_contracts_possessive: "経済契約"
 game_concept_story_content_el_cid_desc: "#tooltip_heading ストーリースタイル: 軽量#!\n\nエル・シッドとして、あなたはパーティのリーダーによって不当に排除されるでしょう。亡命中、忠誠を守ることも、自分の道を見つけることも選べ、最終的には宮廷に戻る#EMP か、#!究極の賞 — バレンシアに至ります。\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading ストーリースタイル: 中程度#!\n\nハサンとして、あなたは宗教的狂信の道に導かれ、真理の理念の光をもたらす場所を選び、[counties|E]をその[rulers|E]の下から改宗させます。\n\n最終的に、あなたの物語は選んだ敵に対する大規模な宗教反乱で頂点に達します。\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading ストーリースタイル: 軽量#!\n\nテムジンとして、あなたは配偶者を捕らえたライバル部族に復讐し、最も信頼する側近兼友人ジャムカの忠誠を試すことになるでしょう。\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "圧力"
 game_concept_stress_desc: "、自分の[personality_traits|E]立場に反する行動を取ったときには$game_concept_stress$、忠誠心のある議員が党鞭に反対票を投じ、正直な大臣が悪い立場を守ろうとしている場合、\n\n十分な圧力を受けると、役員は体力に[stress_level|E]を得て、その影響は再び下がるまで続きます。\n\nウェストミンスターから離れて、それを和らげ[activities|E]。"
 game_concept_stress_level: "圧力レベル"
 game_concept_stress_level_desc: "[stress|E] ごとにキャラクターは蓄積し、同時にプレッシャーレベルを獲得します。プレッシャーレベルは0から3までで、各レベルはキャラクターの[fertility|E]および[health|E]に対して増大するペナルティを課します。\n\nさらに、キャラクターが少なくとも1つのプレッシャーレベルを持っている限り、[mental_breaks|E]に対して脆弱になります。"
 game_concept_stress_levels: "圧力レベル"
 game_concept_stress_loss: "圧力損失"
 game_concept_stressed: "プレッシャーの中で"
 game_concept_strong_vassal: "ストロング・バックベンチャー"
 game_concept_strong_vassal_desc: "$game_concept_strong_vassal$は、権力の上[liege|E]に近づくかそれを超える、あるいはそれを超えると、[opinion|E]ペナルティを受ける[vassal|E]のことです。#weak 彼らは党のリーダーを弱く、党を統治するには不適格だと見なしています。#!"
 game_concept_strong_vassals: "ストロング・バックベンチャー"
 game_concept_struggle_involved_faith: "関わったイデオロギー"
 game_concept_struggle_involved_faiths: "関わったイデオロギー"
 game_concept_struggle_persia_phase_unrest_desc: "、カリフ制は崩壊していく。野心的な軍閥や狡猾な総督たちが、奪える権力を奪い、絶えず争いを繰り広げる。\n\n今後、[ending_phase|E]で状況が解決されない限り、党は[struggle_persia_phase_stabilisation|E]期に入り、必死な支持者たちがカリフの権威を取り戻すだろう。"
 game_concept_struggle_phase_desc: "A $game_concept_struggle_phase_phase$とは、その場の中の[struggle_involved|E] [characters|E]一般的なムードであり、その[struggle_region|E]の中で共通するもの[counties|E]です。それは短期的な社会的傾向や慣習が[struggle|E]の対話を一時的に支配していることを表します。\n\n#weak 例:ある$game_concept_struggle_phase_phase$では、$game_concept_struggle_region_region$の人々は、他のイデオロギーが反対であっても宗教的寛容が最優先だと考えることがあります。#!"
 game_concept_supply_limit_desc: "$game_concept_supply_limit$は、Wardの[terrain|E]と[development|E]により決定される[barony|E]における[soldiers|E]の数を決定します。\n\n合計[army|E]のサイズが$game_concept_supply_limit$を超えると、$game_concept_armies$は[supply|E]を失い、最終的には[attrition|E]に苦しむことになります。"
 game_concept_temporal_head_of_faith: "時間移動リーダー"
 game_concept_tenet: "原因"
 game_concept_tenet_desc: "[doctrines|E] が [rite|E] に関する問題を示す一方で、$game_concept_tenets$ はイデオロギー固有の特徴や習慣を表します。"
 game_concept_tenet_knowledge: "政策知識"
 game_concept_tenet_knowledge_desc: "政治家は他のすべてのイデオロギーの考えを詳細には知りません。\n\n$game_concept_core_tenets$と$game_concept_doctrines$をすべて知っていると、$game_concept_rite$ に考えを変えるのが容易になります。\n\n[core_tenets|E]と[doctrines|E] のすべては自分自身の [faith|E] に知られています。[spouses|E]、[friends|E]、および[activities|E] からさらに学ぶことができます。"
 game_concept_tenet_popularity: "人気の原因"
 game_concept_tenet_popularity_desc: "[personal_tenets|E]が一つの[faith|E]内で広がるにつれて、その実践はより一般的になります。$game_concept_tenet_popularity$ [core_tenet|E]の広範囲を追跡し、[ecumenical_council|E]の討論テーマや[papal_bull|E]の標的として選ばれる可能性に影響を与えます。\n\n $game_concept_tenet_popularity$が高いほど、[ecumenical_council|E]で議論される際に[clergy|E]はより大義に賛同します。一度#high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$に到達すると、[head_of_faith|E]は自分の信念に関係なく、それを[permitted_tenet_status|E]宣言する可能性が高いです。"
 game_concept_tenet_status: "原因の状況"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$は、[core_tenet|E]や[doctrine|E]に対する[rite_possessive|E]立場です。考えられる立場は5つあります。\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — $game_concept_rite$はこの$game_concept_core_tenet$や$game_concept_doctrine$を聞いたことがありません。\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — $game_concept_rite$はそれを認識しており、その実践について判断を下していません。\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — $game_concept_rite$はその行為を承認する。\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — $game_concept_rite$はその行為を禁止する。\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — $game_concept_rite$は$game_concept_core_tenet$を許可し、積極的に推進する。\n\nAnイデオロギーの立場は、$game_concept_rite$あるいは分かるときにどの$game_concept_core_tenet$か$game_concept_doctrine$を選べるか、またどの実践が精神的な罰則[followers|E]代償を伴うかを規定します。\n\nカウズステータスは、[character_possessive|E] [tenet_knowledge|E]とは別物であり、は個人的な認識であり、全体の$game_concept_rite$の立場ではありません。"
 game_concept_tenets: "原因"
 game_concept_the_christian_church_desc: "キリスト教会は、イエス・キリストの信徒を監督し導く教会組織であり、[situation|E]として表され、[the_christian_church_chapters_short|E]の一連を通じて進行します。\n\nその境界は世界中のすべての[archdiocese|E]を含みます; 党の役員や世俗の身分であろうと、架空教区内に[realm|E]を持つ[county|E]以上のすべての[christian|E] [ruler|E]がメンバーです。"
 game_concept_theocratic_vassal: "神権政治の後方議員"
 game_concept_theocratic_vassal_desc: "[theocratic_government|E]フォームを持つバックベンチャー議員。\n\n彼らの機能は[faithpossessive|E] [doctrines|E]によって決まります。"
 game_concept_theocratic_vassals: "神権政治の後方議員"
 game_concept_title_allegiance_desc: "[vassals|E] は [liege|E] の個人ではなく、特定の [title|E] に忠誠を誓うことができます。これは、タイトルが独自の [succession_law|E] を持っている場合にのみ発生します。[succession|E] では、そのようなバックベンチャーは新しいタイトル [holder|E] のバックベンチャーになります。"
 game_concept_title_desc: "$game_concept_title$は本質的に土地所有権の証明書です。\n\n地図上で最小の土地単位は[barony|E]です。区画は[counties|E]と呼ばれるより大きなエリアに組織されています。選挙区は [duchy|E]、地域は [kingdom|E]、国家は [empire|E] に[de_jure|E]属します。\n\n列名、国家、帝国は必ずしも[holder|E]を持つわけではなく、対応する領土の十分な部分を支配する支配者が[created|E]できる称号です。"
 game_concept_title_men_at_arms: "タイトル活動家"
 game_concept_top_liege: "首相"
 game_concept_top_liege_possessive: "首相の"
 game_concept_top_lieges: "首相たち"
 game_concept_top_realm: "トップ・パーティ"
 game_concept_torture_desc: "[imprisoned|E]キャラクターは$game_concept_tortured$で、[health|E]を傷つけたり、さまざまな形で傷つけたりすることもあります。\n\nZortureは[GetTrait('callous').GetName( GetNullCharacter )]や[GetTrait('sadistic').GetName( GetNullCharacter )]キャラクターの[stress|E]負担を軽減できますが、親切なキャラクターにはプレッシャーを与えます。\n\nの拘束[rulers|E]も、[dread|E]を上げることができます。"
 game_concept_tour_stop_desc: "An [activity_phase|E] は、[royal_tour|E] の間に、パーティリーダーが次のいずれかを行える場合があります：[hosted_dinner|E] に出席する、[tour_the_grounds|E] [vassal|E] を行う、または [cultural_festival|E] を楽しむ。"
 game_concept_transfer_desc: "[rulers|E] は、自分の [vassals|E] のうちの一つを、後者よりも低いランクであれば別のバックベンチャーに $game_concept_transfer$ することができます。これは、特に転任されたバックベンチャーが [de_jure|E] 彼らの [realm|E] の一部である場合、バックベンチャーの [opinion|E] を上げる良い方法です。"
 game_concept_treasury_vassal_development: "バックベンチャー育成"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ は [tribal|E] [ruler|E] がその [vassals|E] に及ぼす一般的な影響力を表しています。[crown_authority|E] と比べると、より少ない権力を提供し、遅い段階で供与されます。\n\n $game_concept_tribal_authority$ には四つのレベルがあります: [disparate_tribes|E]、[limited_tribal|E]、[high_tribal|E]、[absolute_tribal|E]。$game_concept_tribal_authority$ を上げるには、レベルと支配者の [learning_skill|E] に応じた量の [prestige|E] が必要ですが、クラウン権限の拡大よりも一般的に高価です。\n\n#weak 後列議員は高いレベルの $game_concept_tribal_authority$ を嫌い、それを下げることが [liberty_faction|E] の主な目標です。#!"
 game_concept_tribal_desc: "部族の政党は限られた選挙区[development|E]、部族時代[innovations|E]を超えて進めない、新しい[holdings|E]を建設できない、通常は[succession_law|E].\n\nを変更できない。しかし、[gold|E]の代わりに[prestige|E]を利用して政党を作り[men_at_arms|E]を雇うことができる。また、[feudal|E]の政党と比べてより多くの[casus_belli|E]にアクセスできる。非部族軍は敵対的部族領土で[supply_limit|E]のペナルティを受ける。"
 game_concept_unassigned_vassal: "課税されていない後方議員"
 game_concept_unassigned_vassals: "課税されていない後方議員"
 game_concept_undirected_great_holy_war_desc: "$game_concept_undirected_great_holy_war$は、$doctrine_spiritual_head_name$ [head_of_faith|E]が[kingdom|E] [faith|E]の支配下に置くことを目的として宣言するものである。\n\n$game_concept_undirected_great_holy_wars$はすぐに始まるのではなく、代わりに[preparation_phase|E]に入る。\n\n 戦争前および戦争中、攻撃側イデオロギーの支配者は[gold|E]をその[war_chest|E]に寄付することを選べる。\n\n勝利した場合、標的となった国家は攻撃側イデオロギーのキャラクターに与えられる。攻撃者への報酬には[piety|E]や、[dynasty|E]が征服された国の中で[landed|E]される可能性もあります。"
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E]彼らのイデオロギー [counties|E] [battle|E] [advantage|E]を得ています。"
 game_concept_usurp_title_desc: "外国[ruler|E]が保有する[title|E]通常は、その40%以上#! [de_jure|E] [counties|E]があなたの[realm|E]内にあれば奪われ#V る可能性があります。このプロセスはあなたに[title|E]を与え、特にあなたが[vassals|E]の[rightful_liege|E]であることを保証するために重要です。\n\nU現在の保有者の[faith|E] 1があなたのものに敵対的であれば、剥奪はより困難になります。この場合、簒奪は保持者が党内でその[de_jure|E] [counties|E]を一切持たなくなった場合にのみ可能です。"
 game_concept_varangian_adventure_desc: "これは特別なタイプの[war|E]で、攻撃側は[realm|E]を[war_target|E]に大量に移すつもりです。\n\nもし彼らが勝てば、直ちに適切な[counties|E]を併合し、[capital|E]をそこに移します。彼らの古い後方議員は独立し、かつての$game_concept_counties$は新興の地元の軍閥に渡されます。$game_concept_varangian_adventures$は[duke|E]や$game_concept_count$ [title_tier|E] [rulers|E]で#EMP ONLY#!利用可能で、成功するごとに価格が徐々に高くなってい$game_concept_varangian_adventure_adventure$します。\n\nこの[casus_belli|E]は$culture_era_tribal$ [era|E]以降#EMP NEVER#!利用できず、$game_concept_varangian_adventure_adventure$できる他の[cultures|E]敵や隣接する$game_concept_rulers$に対しては使用できません。最初の$game_concept_varangian_adventure$立ち上げ\n\n$north_germanic_group_collective_noun$、最大[EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0]ボーナス[special_troops|E]を受け取ります。これは、同じ[culture|E] [faith|E]同じの選挙区が[GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]内で完全に支配するごとに増えていきます。"
 game_concept_vassal: "バックベンチャー議員"
 game_concept_vassal_contract: "バックベンチャー契約"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ [vassal|E]と[liege|E]の[obligations|E]を決定します。\n\n議員は、[feudal|E]、[clan|E]、[administrative|E]、[nomadic|E] $game_concept_government_forms$の各バックベンチャーごとに個別に交渉された異なる[obligations|E]にアクセスできます。\n\nすべてのバックベンチャーは、その[obligations|E]に基づいて総[taxes|E]と[levies|E]の一定割合を党首に支払います。#EMP これらの[modifier_contributions|E]は、[GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )]などの「細かい文字」オプションによって修正されることがあります。#!\n\n一部の特別契約は特定のランクに限定されています:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V]および[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]:[duke|E] 以上 \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]:[count|E] 以上 \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]:[count|E]のみ\n\n#weak 注、[governor|E] [obligations|E]は[province_administrations|E]とも呼ばれます。#!"
 game_concept_vassal_contracts: "バックベンチャー契約"
 game_concept_vassal_desc: "$game_concept_vassal$とは、他者に報告する政治家のことです。すなわち、自分の党の議員は[liege|E]に、党首は首相です。\n\nバックベンチャーは党首に鞭と支持と引き換えに[levies|E]と[taxes|E](自分の[obligations|E])を渡します。\n\n $game_concept_vassal$の党首の[opinion|E]が低い場合、[factions|E]に加わるか、[scheme|E]代わりを務めることがあります。"
 game_concept_vassal_directive: "バックベンチャー指令"
 game_concept_vassal_directive_desc: "[liege|E]として、[vassals|E]に指令を発行でき、その[councillor_tasks|E]や構築する[buildings|E]に影響を与えます。\n\n指令を発行するには、Backbencherと50#!以上の[opinion|E]を持つなど、#P 有効化する必要があります。上級[government_forms|E]はこれを必要としません。"
 game_concept_vassal_directives: "バックベンチャー指令"
 game_concept_vassal_limit: "バックベンチャー・リミット"
 game_concept_vassal_limit_desc: "$game_concept_vassal_limit$は、合法的に保持できる[direct_vassals|E]の数を決定します（[barony|E]級の補欠議員を除く）。\n\n$game_concept_vassal_limit$を超えることは可能ですが、そうすると補欠議員が提供する[taxes|E]と[levies|E]が低下し、制限を下回るために一部の補欠議員を[transferring|E]した方が良い場合があります。"
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ [subject|E]が自分の自分の[suzerain|E]にどれだけの[tax|E]、そしてどれだけの[levies|E]を提供するかを定義します。被験者の[government_form|E]が、その対象の$game_concept_obligations$がどのように変化するかを決定します。\n\n#weak 例えば、議員[GetGovernment('feudal_government').GetName]と[GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$は[vassal_contract|E]に依存し、[GetGovernment('administrative_government').GetName]バックベンチャーは自分の[province_administration|E]に依存し、[tributary_possessive|E]は彼らの [tributary_contract|E] に依存します。"
 game_concept_vassal_possessive: "バックベンチャー議員の"
 game_concept_vassal_stance: "後方議員の立場"
 game_concept_vassal_stance_desc: "すべての[vassal|E]にはバックベンチャー・スタンスがあり、それがあなたを[liege|E]とする際の[opinion|E]関係や、[realm|E]の後継者としてどの[heir|E]を好むかに影響を与えます。\n\n同じ立場のバックベンチャーは同じことを好むし嫌いです。例えば;すべてのバックベンチャー [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]あなたが[wars|E]を失うことを嫌います。\n\n非常にバックベンチャーの立場は特定の後継者を好みます。継承後、各優先相続人はその立場の後方議員との低い[legitimacy_expectations|E]を持つことになります。\n\n#low バックベンチャーの立場は以下の通りです#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "バックベンチャーの立場"
 game_concept_vassal_taxes: "議員議員の税金"
 game_concept_vassal_taxes_desc: "あなたの$game_concept_vassal_taxes$は、あなたが[vassals|E]から受け取る[taxes|E]で構成されています。その金額は各バックベンチャーの持つもの[obligations|E]によって異なります。\n\nバックベンチャーの視点から見ると、これらの同じ税金は[liege_taxes|E]と呼ばれ、彼ら自身の$game_concept_vassals$議席から徴収するどんな税$game_concept_vassal_taxes$と区別されています。"
 game_concept_vassals: "後方議員 転向する"
 game_concept_vassals_possessive: "バックベンチャー議員たち"
 game_concept_victory_desc: "$game_concept_victory$ は、3つの可能な [peace_offers|E] のうちの1つです。[war|E] における勝利の正確な結果は、[casus_belli|E] に依存します。\n\n 攻撃側にとっては、通常、[war_target|E] 地域内の [titles|E] の占領を伴います。\n\n 防御側にとっては、勝利は通常、攻撃側が戦争賠償金として多額の資金を支払わなければならないことを意味します。"
 game_concept_virtue_desc: "すべての[rite|E]は特定の[traits|E]を徳あるものとみなします。これらの特性を持つキャラクターは、同じイデオロギーを共有していなくても、その特性を徳あると考えるすべてのキャラクターから[opinion|E]ボーナスを受け取ります。さらに、自分のイデオロギーが徳とみなす特性を持つキャラクターは毎月ボーナス[piety|E]得ます。\n\nどの特性が美徳とみなされるかはイデオロギーによって異なりますが、通常はそのイデオロギーの[core_tenets|E]とイデオロギーが属する[religion|E]の組み合わせによって決まります。"
 game_concept_virtue_weight_desc: "特性は、[rite|E]の[core_tenets|E]および[doctrines|E]、ならびにそれが属する[religion|E]によって決定される関連する[sin|E]または[virtue|E]の重みを持つことがあります。\n\nイデオロギー内で最も高い罪または徳の重みを持つ特性は、そのイデオロギーの[sins|E]および[virtues|E]となります。"
 game_concept_wanderer_desc: "[court|E]に属さず、いかなる[titles|e]職種も持たないキャラクターはワンダラーと呼ばれます。彼らは世界中を旅し、道中でオフィスを訪れ[guests|E]します。ワンダラーは[mercenary|E]キャプテン、[holy_orders|E]のリーダー、[clergy|E]メンバー、[city|E]保持者になることもあります。"
 game_concept_wanua_desc: "$wanua_government_adjective$ [government|E]は[GetGovernment('tribal_government').GetNameWithIcon] [government|E]と弱点を共有しますが、[domain_limit|E]と[vassal_limit|E]は減少しています。[gold|E]を使用して[buildings|E]を建設し、[men_at_arms|E]を募集しますが、建物から得られる資金はほとんどありません。\n\nしかし、彼らは[barter_goods_i][barter|E]、[raid|E]でき、[GetGovernment('mandala_government').GetName]政府とシナジーを持ち、[tributary|E]になることで[legitimacy|E]を得ます。"
 game_concept_war_chest_desc: "$game_concept_war_chest$は[gold|E]、[piety|E]、[prestige|E]のコレクションです。内容は主に[undirected_great_holy_wars|E]に勝利した報酬として使われ、[war|E]への参加に応じて攻撃側に分配されます。$game_concept_war_chest$の中の\n\nAの一部も、戦争宣言時に攻撃側で分配されます。\n\n [undirected_great_holy_war|E]が敗北した場合、防御側は政治資本とプロフィールの分$game_concept_war_chest$を分け合います#weak(資金は失われます)。#!"
 game_concept_winter_desc: "時間とともに[supply|E]を徐々に消耗し、冬の影響を受けたワード内にいる軍隊は補給を失います。補給ペナルティは厳しさの重さが重くなるほど増加します。冬には3つの重さがあります。[Concept( 'winter_severity_mild', 'Mild' )|E]、[Concept( 'winter_severity_normal', 'Normal' )|E]、[Concept( 'winter_severity_harsh', 'Harsh' )|E]です。"
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ は $game_concept_yurt$.\n\n に対するユニークな改善策です。機械的には [domicile_buildings|E] ですが、多くは文字通りの構造体ではなく、$game_concept_nomad$ 部族の社会的慣習や関心分野を表しています。\n\n 彼らが付与できるボーナスには次のものが含まれます：\n$EFFECT_LIST_BULLET$ [court_positions|E] と Nomadic [decisions|E] と [character_interaction|E]s\n の解除$EFFECT_LIST_BULLET$ [herd|E] と [county_fertility|E] に対する様々なボーナス、[terrain|E] の専門化を含む\n$EFFECT_LIST_BULLET$ Nomadic [men_at_arms|E] の解除と改善、および [horde|E] の強化\n$EFFECT_LIST_BULLET$ ユニークな遊牧 [culture_tradition|E] ボーナス\n$EFFECT_LIST_BULLET$ 自分の [vassals|E] と [tributaries|E] の管理方法、およびオフィスで [characters|E] に影響を与える方法\n$EFFECT_LIST_BULLET$ [kurultai|E] と [obedience|E] のボーナス。"
 maximum_piety_level_mandala: "\n\nしかし、[mandala|E] [ruler|E] がその [aspect|E] に受け入れられる方法で亡くなると、[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] に到達した後、その統治者の [heir|E] は [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L] に到達するまで次の政治首都レベルに進む能力を発展させます。"
