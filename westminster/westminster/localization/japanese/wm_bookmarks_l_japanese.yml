 bm_2024_starmer: "2024: 政権交代"
 bm_2024_starmer_desc: "労働党は2024年7月4日の総選挙で411議席を獲得し、174議席の過半数を得ました。キア・スターマーが首相となり、保守党は121議席に減少したため、新しい党首を選ぶ必要があります。自由民主党は過去100年で最高の成果を上げ、改革UK、緑の党、独立議員のグループが下院に進出しました。\n\n#bold 650人すべての議員がプレイ可能です。#!"
