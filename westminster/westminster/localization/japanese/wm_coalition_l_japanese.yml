l_japanese:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "連合はこれに同意した 連立"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] と [wm_coal_leader.GetName] はナンバー10の階段で握手しました。[wm_coal_party.GetNameNoTier]（[wm_coal_party_seats|0] 席）が [wm_coal_senior.GetNameNoTier]（[wm_coal_senior_seats|0]）に参加し、[wm_coal_leader.GetFirstName] が副首相になります。"
 wm_coalition_headline_supply: "取引完了:政府が支えられる"
 wm_coalition_headline_supply_desc: "[wm_coal_party.GetNameNoTier]は[wm_coal_pm.GetName]の政府と信任・供給協定に合意しました。その[wm_coal_party_seats|0]議員は信任投票と予算で政府を支持し、指導者は優先事項のための資金を確保しました。他のすべてに関しては、自身の投票のみです。"
 wm_coalition_headline_minority: "少数派政府 代わりに"
 wm_coalition_headline_minority_desc: "会談は決着に至らなかった。[wm_coal_pm.GetName]は[wm_coal_senior.GetNameNoTier]議席を持つ少数派[wm_coal_senior_seats|0]政権を率い、下院での全ての投票を厳しく勝ち取らなければならない。"
 wm_coalition_headline_collapse: "崩壊"
 wm_coalition_headline_collapse_desc: "[wm_coal_party.GetNameNoTier]は[wm_coal_pm.GetName]政権を離脱しました。その投票がなければ政府は過半数を持たず、ウェストミンスターは不信任決議か選挙に備えています。"

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "ハング議会"
 wm_coalition.1.desc: "国は声を上げましたが、誰も何を言ったのか正確にはわかりません。[wm_coal_senior.GetNameNoTier]は議席数が#bold [wm_coal_senior_seats|0]#!議席で最大の政党であり、私たちだけで下院で票を獲得するのに十分な[wm_coal_majority|0]数には届きません。\n\n内閣事務官は公務員の交渉室を準備しています。他党の指導者たちは電話のそばで待機しており、報道陣は10番地の外に陣を立てています。誰に連絡すればいいですか?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] 議席数"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] 議席数"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] 議席数"
 wm_coalition.1.a: "[wm_coal_choice_1.GetNameNoTier]とオープンな話し合いをする。"
 wm_coalition.1.b: "[wm_coal_choice_2.GetNameNoTier]とオープンな話し合いをする。"
 wm_coalition.1.c: "[wm_coal_choice_3.GetNameNoTier]とオープンな話し合いをする。"
 wm_coalition.1.d: "我々が単独で統治し、彼らに我々を倒す挑発を試みる。"
 wm_coalition.1.d.tt: "あなたは #bold 少数派政府#! を率います: すべての法案および信任投票はその日のうちに票を見つけなければなりません。"

 # The terms
 wm_coalition.2.t: "交渉の場"
 wm_coalition.2.desc: "[wm_coal_talks_leader.GetName]率いる [wm_coal_talks.GetNameNoTier] チームは長い要求リストを持って内閣府に到着しました。彼らは議員#bold [wm_coal_talks_seats|0]#!人います。私たちの議員が加われば、 [wm_coal_combined_seats|0]です。"
 wm_coalition.2.majority: "一緒なら我々は過半数を持つだろう。"
 wm_coalition.2.no_majority: "一緒でも過半数には届かないが、これは提供されている中で最良の取引だ。"
 wm_coalition.2.mood_warm: "\n\n 雰囲気は温かいです。彼らの交渉担当者は私たちのマニフェストの多くに同意しており、政府に入りたいと思っています。"
 wm_coalition.2.mood_cool: "\n\n 雰囲気は業務的です。彼らは多くの見返りを求めるでしょう、そして彼らの活動家は私たちのミスの責任を問われることに慎重です。"
 wm_coalition.2.mood_cold: "\n\n 雰囲気は冷淡です。我々の党は大きく隔たりがあり、彼らの議員は安易に私たちを支えるよりも野党に座る方を好みます。"
 wm_coalition.2.a: "連立を申し出：副首相と閣僚ポスト1つ。"
 wm_coalition.2.a.tt: "彼らのリーダーは副首相#!に#bold され、議員の一人が内閣に加わります。議員たちはすべての投票で政府の鞭を受けます。"
 wm_coalition.2.b: "連立を申し出、彼らの旗艦政策の1つを採用。"
 wm_coalition.2.b.tt: "上記の通りで、彼らのペット方針は政府プログラムに組み込まれます。我々の議会内野党は喜ばないでしょう：#bold 連立妥協 #! 5年間。"
 wm_coalition.2.c: "連立を申し出る：閣僚ポスト2と彼らの政策の1つを提供。"
 wm_coalition.2.c.tt: "彼らのリーダーが副首相#! #bold、2人の議員が内閣に加わり、彼らの得意政策は政府のプログラムに組み込まれます。"
 wm_coalition.2.d: "信頼と供給を提供する:信頼と予算に関する彼らの投票、つまりお金のために。"
 wm_coalition.2.d.tt: "彼らは政府から離れていますが、不信任動議#bold #!と#bold 財務委員会Bill#!を支持しています。その見返りとして、私たちは彼らの優先事項に資金を提供します。それは私たちにお金を払い、彼らの指導者に支払うことになります。"
 wm_coalition.2.e: "別の政党を試そう"
 wm_coalition_signals_yes_tt: "彼らの交渉担当者は、この法案に署名できると示唆しています。"
 wm_coalition_signals_no_tt: "彼らの交渉担当者は、これだけでは不十分だと示唆しています。"

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "連合の申し出"
 wm_coalition.3.t_supply: "信認および支援の申し出"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName]が呼びかけました。[wm_coal_senior.GetNameNoTier]は[wm_coal_senior_seats|0]議席を持ち、過半数に届かず、私たちを政府に加えたいと考えています：あなたが#bold 副首相#!として、[wm_coal_offer_seats|0]の私たちの議員が閣僚テーブルに加わります。その代わりに、私たちの議員はすべての事項で政府に同調して投票します。"
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName]が呼びかけました。[wm_coal_senior.GetNameNoTier]は[wm_coal_senior_seats|0]議席を持ち、過半数に届かず、私たちを政府に加えたいと考えています：あなたが#bold 副首相#!として、[wm_coal_offer_seats|0]の私たちの議員が閣僚テーブルに加わり、私たちの主要政策の一つが政府プログラムに組み込まれます。その代わりに、私たちの議員はすべての事項で政府に同調して投票します。"
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName]が呼びかけました。[wm_coal_senior.GetNameNoTier]は[wm_coal_senior_seats|0]議席を持ち、過半数に届かず、信任投票と予算に関して政府を支援する信任および供給の協定を希望しています。その代わりに政府は私たちの優先事項に資金を提供します。それ以外のすべてについては、私たちは自由に投票することができます。"
 wm_coalition.3.a: "我々は合意を得ました。"
 wm_coalition.3.a.tt: "契約は成立し、[wm_coal_pm.GetFirstName]はあなたに借りがあります。"
 wm_coalition.3.b: "ありがとう、でも結構です。"
 wm_coalition.3.b.tt: "私たちの議員たちは野党に留まり、政府に反対票を投じる自由があります。"

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "取引が成立した"
 wm_coalition.4.t_refused: "会談決裂"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName]同意した。その[wm_coal_party.GetNameNoTier]が政府に加わり、副首相になる[wm_coal_leader.GetFirstName]、報道陣はすでにそれを便宜結婚だと呼んでいる。その議員たちは我々の鞭を取るだろう。"
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName]は同意しました。[wm_coal_party.GetNameNoTier]は、代償のために信任投票や財政法案で私たちを支援します。それ以外のすべてについては、与党の鞭が一度に一票ずつ議員を説得する必要があります。"
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName]は私たちを断りました。[wm_coal_talks.GetNameNoTier]によると、私たちの提案はそのメンバーが受け入れる水準には程遠いとのことです。"
 wm_coalition.4.a: "国の新しい章。"
 wm_coalition.4.b: "申し出を甘くして。"
 wm_coalition.4.c: "他の政党を試す。"
 wm_coalition.4.d: "ならば我々が単独で統治する。"

 # Breakdown
 wm_coalition.20.t: "退場の時間か？"
 wm_coalition.20.desc_coalition: "私たちの議員たちは落ち着きがありません。政府がする不人気な決定はすべて私たちのせいにされ、[wm_coal_senior.GetNameNoTier] はうまくいったことに対して功績を受け取ります。今日、連立からの離脱を望む人もいます。"
 wm_coalition.20.desc_supply: "私たちの議員たちは落ち着きがありません。[wm_coal_pm.GetName] の政府を支えることは私たちに費用をかけさせ、私たちの優先事項のための資金は期待した感謝を得られませんでした。今日、この取引を破棄したい人もいます。"
 wm_coalition.20.polls_bad: "\n\n 世論調査は厳しいです：私たちは取引後、かなり下がっています。"
 wm_coalition.20.polls_ok: "\n\n 世論調査は今のところ維持されています。"
 wm_coalition.20.a: "もう終わりだ。政府に任せろ。 ケントのウィールド"
 wm_coalition.20.a.tt: "取引は終わりだ。政府はあなたの議員の票を失い、不信任決議か選挙に直面するかもしれない。首相はあなたを許さないだろう。"
 wm_coalition.20.b: "我々は約束しました。我々は留まります。"
 wm_coalition.21.t: "私たちのパートナーが退席"
 wm_coalition.21.desc: "私たちのパートナーが去り、それとともに多数派も失いました。野党は血の匂いを感じ、メディアは私たちが生き残れるか知りたがり、チーフウィップはすでに票を数えています。"
 wm_coalition.21.a: "我々は少数政府として継続します。"
 wm_coalition.21.a.tt: "下院での投票はすべて闘いになるでしょう。"
 wm_coalition.21.b: "新しいパートナーを見つけてください。"
 wm_coalition.21.c: "国に決めさせる: 総選挙を実施"
 wm_coalition.21.c.tt: "解散され、5週間後に#bold 総選挙#!が行われます。"

 # Decision
 wm_coalition_leave_decision: "政府の取引を離れる"
 wm_coalition_leave_decision_desc: "あなたの党を政府との取引から引き離す。あなたの議員は自由に投票でき、政府は過半数を失い、首相は決してあなたを許さない"
 wm_coalition_leave_decision_tooltip: "連合や信頼と供給の取引を終わらせる"
 wm_coalition_leave_decision_confirm: "立ち去る"
 wm_coalition_leave_decision_effect_tt: "取引は終了します。政府はあなたの議員の票を失い、不信任決議か選挙に直面する可能性があります。"
 wm_coalition_leave_no_election_desc: "総選挙は呼ばれていません"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "副首相"
 wm_coalition_deputy_pm_modifier_desc: "政府内での副政権であり、下位連立パートナーのリーダーです。"
 wm_coalition_compromise_modifier: "連立妥協"
 wm_coalition_compromise_modifier_desc: "連立パートナーの旗艦政策の一つが政府プログラムに含まれており、我々の後方議員たちも不満を漏らしています。"
 wm_coalition_supply_deal_modifier: "信任と供給の取り決め"
 wm_coalition_supply_deal_modifier_desc: "信任投票や予算で政府を支え、自分の優先事項に資金を持つ。"
 wm_coalition_partner_opinion: "連立パートナー"
 wm_coalition_walked_out_opinion: "我々の政府を離れた"
 wm_coalition_deputyship_diarchy_type: "連合"
 wm_coalition_deputyship_diarch_title: "副首相"
