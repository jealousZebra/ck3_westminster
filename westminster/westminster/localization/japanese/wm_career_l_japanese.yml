l_japanese:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "党活動"
 wm_job_canvassing_contract: "選挙運動"
 wm_job_canvassing_desc_title: "ドアノッカー募集"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] は今週末、玄関先でのボランティアを必要としています：クリップボード、チラシ、そして厚い心。党は雨の中に現れた人々を見ています。"
 wm_job_canvassing_request: "3週間かけて戸別訪問をしてみてください。成功はあなたのご[diplomacy|E]次第です。"
 wm_job_fundraising_contract: "資金集めディナー"
 wm_job_fundraising_desc_title: "テーブルを埋めるのを手伝って"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] は資金集めのディナーを主催しており、テーブルを販売したり、寄付者を追いかけたり、抽選を公正に行う人が必要です。"
 wm_job_fundraising_request: "ディナーは3週間かけて企画します。成功はあなたの能力次第[stewardship|E]。"
 wm_job_speechwriting_contract: "スピーチライティング"
 wm_job_speechwriting_desc_title: "成功するスピーチ"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName]は大きなスピーチを控えており、現在の草案は彼らの事務所の言葉を借りれば「人質ビデオ」です。"
 wm_job_speechwriting_request: "スピーチは3週間かけて書き上げてください。成功はあなたの能力次第[learning|E]。"
 wm_job_research_contract: "反対派研究"
 wm_job_research_desc_title: "反対側を掘り下げてみよう"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] は対戦相手に関するブリーフィングを求めています：投票記録、古いツイート、破られた約束。すべて公開されており、すべて有用です。"
 wm_job_research_request: "ドシエを3週間かけてまとめる。成功はあなたの[intrigue|E]に依存する。"
 wm_job_phonebank_contract: "電話バンク"
 wm_job_phonebank_desc_title: "電話での夜"
 wm_job_phonebank_desc: "[TaskContract.GetEmployer.GetName]の事務所には、更新していない400人のメンバーのリスト、借りた電話の部屋、誰もリハーサルしていないスクリプトがある。"
 wm_job_phonebank_request: "3週間かけてコールリストを一つずつ処理してください。成功はあなたの手の[diplomacy|E]次第です。"
 wm_job_policy_paper_contract: "政策文書"
 wm_job_policy_paper_desc_title: "十ページ、完全見積もり済み"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] はスローガンではない何か、地元のバスについて言えること、証拠、数字、そして大臣が署名できる提案を求めています。"
 wm_job_policy_paper_request: "レポートは3週間かけて書きましょう。成功はあなたの能力次第[learning|E]。"
 wm_job_media_round_contract: "メディアラウンド"
 wm_job_media_round_desc_title: "朝食前に6つのスタジオ"
 wm_job_media_round_desc: "地元のラジオ、地域テレビ、2つのポッドキャストが[TaskContract.GetEmployer.GetName]側の誰かに出演してラインを守るよう求めている。他にボランティアはいなかった。"
 wm_job_media_round_request: "線を準備し、3週間にわたってインタビューを行う。成功はあなたの [intrigue|E] に依存します。"
 wm_job_gotv_contract: "投票を動かす"
 wm_job_gotv_desc_title: "彼らを育てて、連れ出せ"
 wm_job_gotv_desc: "[TaskContract.GetEmployer.GetName]のチームは、評議会の補欠選挙のためのランナーが必要だ：投票カード、開票担当者の番号、そして多くのタワーブロックにあるたくさんの階段。"
 wm_job_gotv_request: "投票を3週間かけて実施する。成功は[prowess|E]次第だ。"
 wm_job_budget_contract: "誓約の費用計算"
 wm_job_budget_desc_title: "お金はどこから来ているのですか？"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName]は高額な約束をし、相手側はその費用がどのように支払われるのかを何度も尋ねています。スプレッドシートが緊急に必要です。"
 wm_job_budget_request: "3週間で誓約の費用。成功はあなたの[stewardship|E]に依存。"
 wm_selection_contract: "候補者評価"
 wm_selection_contract_contract: "候補者評価"
 wm_selection_contract_desc_title: "党の承認されたリスト。"
 wm_selection_contract_desc: "誰も党に立候補できる前に、査定日を通過しなければならない：模擬面接、政策テスト、怒った「有権者」とのロールプレイ。"
 wm_selection_contract_request: "審査に合格して承認候補者リストに参加してください。成功はあなたの能力次[diplomacy|E]です。"

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "応募は[wm_sel_seat.GetName]で開始"
 wm_career.20.desc: "地元の[wm_sel_party.GetName]は[wm_sel_seat.GetName]の候補者を選んでいる。選挙区委員長からのメールは短い：応募は数週間で締め切り、コミュニティセンターで公開討論会が行われる。\n\nこのような選挙区で立候補する人々は国会議員になる。"
 wm_career.20.a: "私の名前を推薦してください。"
 wm_career.20.b: "これではない。"
 wm_career.21.t: "[wm_sel_seat.GetName] でのハスティングス"
 wm_career.21.desc: "プラスチックの椅子、ティーポール、そしてすべての提案を聞いたことのある60人の党員。応募者一人ひとりに10分間の時間と、フロアからの質問があります。どうやって彼らの心を掴むか?"
 wm_career.21.a: "地域について話す: ハイストリート、バス、人々。"
 wm_career.21.b: "コストを算出した計画を政策ごとに提示した"
 wm_career.21.c: "他の応募者が過去に言ったことを優しく思い出させましょう。"
 wm_career.21.success: "部屋はあなたに温かくなりました。"
 wm_career.21.failure: "部屋は冷たいままでした。"

 wm_career_selected_toast: "[wm_sel_seat.GetName]に選ばれました"
 wm_career_selected_toast_desc: "地元の[wm_sel_party.GetName]はあなたを候補者として選んだ。次の選挙か補欠選挙でその議席を勝ち取れば、あなたは国会議員になる。"
 wm_career_not_selected_toast: "[wm_sel_seat.GetName]で選択されていない"
 wm_career_not_selected_toast_desc: "メンバーは[wm_sel_winner.GetName]を選んだ。次回はもっと知られるだろう。"
 wm_career_elected_toast: "議会選出"
 wm_career_elected_toast_desc: "集計が決まり、議席はあなたのものです。選挙運動チームは整理されました。あなたの党の幹事たちが連絡します。"

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "選考に応募"
 wm_career_apply_decision_desc: "地元議員が選ぶ選挙区で党の候補者として私の名前を出してください。党の立候補:[GetPlayer.MakeScope.Var('wm_standing').GetValue|0]。"
 wm_career_apply_decision_tooltip: "席のための党の候補者になるために応募"
 wm_career_apply_decision_free_tt: "すでに議席を応募していない、または候補者として選ばれていない"
 wm_career_apply_decision_standing_tt: "党の承認候補者リスト、または党の得票率が30以上の者"
 wm_career_apply_decision_open_tt: "党はどこかで候補者を選んでいる。"
 wm_career_apply_decision_effect_tt: "あなたは党が開けている選考の一つに応募し、できれば自国で選ぶ選挙で講演します。"
 wm_career_return_decision: "選挙戦の道に戻る"
 wm_career_return_decision_desc: "有権者は意見を述べ、考えを変えることができる。選挙チームを結成し、議席を探しなさい。"
 wm_career_return_decision_tooltip: "議席を失った後に再び選考を目指す"
 wm_career_return_decision_effect_tt: "あなたはキャンペーンチームを得て、党の承認済み候補者リストに参加し、選考に応募することができます。"

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "私のために良い仕事をしてくれました"
 wm_career_poor_work_opinion: "失望させる"
 wm_career_apply_decision_confirm: "申請書を提出する"
 wm_career_return_decision_confirm: "ドアステップへ戻る"
