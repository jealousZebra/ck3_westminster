l_japanese:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "計数"
 wm_dispute.1.desc: "#italic 開票担当者の宣言#!\n\n[wm_dispute_mp.GetName] [wm_dispute_seat.GetNameNoTier] で勝者として宣言され、[EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] ポイント差で勝利しました。"
 wm_dispute.1.close: "それはもう十分に接近していて、エージェントたちはすでに重複してカウントされた票の束や遅れて到着した箱についてつぶやいています。再集計（料金[EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]で1週間）は結果を変える可能性があります、おそらく[EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0]％の確率；選挙請願（4か月と[EmptyScope.ScriptValue('wm_dispute_court_cost')|0]）では結果が無効宣言され、議席が再度争われる可能性があります、おそらく[EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0]％の確率です。"
 wm_dispute.1.clear: "接戦ではありません。再集計（[EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]）でもほとんど何も変わらない可能性が高く、世間は負け惜しみを嫌います：争うことはあなたの知名度と政治的資本を失わせるでしょう。"
 wm_dispute.1.bad: "競り合いでもありませんでした：圧勝でした。争うことはあなたを笑いものにし、怒った支持者たちが街に出る可能性があります。"
 wm_dispute.1.a: "勝者を祝福する"
 wm_dispute.1.b: "再集計を要求しろ。"
 wm_dispute.1.b.tt: "すべての投票用紙は再度集計されます。費用がかかります。結果が接戦でなければ、知名度や政治的資本も失われます。"
 wm_dispute.1.c: "選挙裁判所に請願。"
 wm_dispute.1.c.tt: "裁判官は選挙の進行を審査します。手続きは遅く、費用もかかります。裁判官は選挙を無効と宣言し、新たな補欠選挙を命じるか、あなたに対して費用を科すことがあります。"
 wm_dispute_recount_toast: "[wm_dispute_seat.GetNameNoTier]年の再集計"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName]は[wm_dispute_seat.GetNameNoTier]での再集計を要求しました。集計スタッフはテーブルに戻っています。"
 wm_dispute_court_toast: "選挙請願:[wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName]は[wm_dispute_seat.GetNameNoTier]の結果に対して選挙裁判所に請願しました。裁判官は数か月以内に報告します。"
 wm_dispute_overturned_toast: "再集計の結果が覆される"
 wm_dispute_overturned_toast_desc: "再集計の結果、[wm_dispute_mp.GetName] [wm_dispute_seat.GetNameNoTier]選挙区の議員としてわずかな票差で宣言されます。"
 wm_dispute_upheld_toast: "再集計で結果が確定"
 wm_dispute_upheld_toast_desc: "[wm_dispute_seat.GetNameNoTier]での再集計により[wm_dispute_mp.GetName]がその議員として確認されました。"
 wm_dispute_void_toast: "選挙は無効と宣言された"
 wm_dispute_void_toast_desc: "選挙裁判所は結果を無効と宣言[wm_dispute_seat.GetNameNoTier]。新たな補欠選挙が行われる予定です。"
 wm_dispute_dismissed_toast: "選挙請願は却下されました"
 wm_dispute_dismissed_toast_desc: "選挙裁判所は[wm_dispute_seat.GetNameNoTier]理由で請願を却下し、請願者に対して訴訟費用を認めました。[wm_dispute_mp.GetName]停止します。"
 wm_dispute_national_toast: "は降伏を拒否している"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] は総選挙の結果を受け入れません。何も変わりませんが、支持者たちは通りに集まり、新聞は容赦ありません。"
 wm_dispute_seat_decision: "カウントに挑戦する"
 wm_dispute_seat_decision_desc: "あなたは議席を失いましたが、集計は正確でしたか？ 再集計を要求するか、選挙を無効と宣言するよう選挙裁判所に請願してください。接戦でなければ、世間は負け惜しみと思うでしょう。"
 wm_dispute_seat_decision_tooltip: "失った議席の結果に異議を唱えてください。"
 wm_dispute_seat_decision_confirm: "検討する"
 wm_dispute_seat_decision_effect_tt: "あなたは、結果を受け入れるか、#bold の再集計を要求するか、#bold 選挙裁判所に請願するかを決めます。#!#!"
 wm_dispute_not_disputed_tt: "結果はまだ異議が出ていません。"
 wm_dispute_no_byelection_tt: "その議席は補欠選挙を待っていません。"
 wm_dispute_national_decision: "謝罪を拒否"
 wm_dispute_national_decision_desc: "有権者はあなたをダウニング街から追い出しました。受け入れることを拒否することもできます。開票結果、郵便投票、放送局に疑問を呈しましょう。しかしそれは何も変えず、あなたに大きな代償をもたらし、最も怒れる支持者たちを街頭に引き出します。"
 wm_dispute_national_decision_tooltip: "総選挙の結果を受け入れない。"
 wm_dispute_national_decision_confirm: "謝罪を拒む"
 wm_dispute_national_decision_effect_tt: "あなたは多くの #bold プロフィールと政治的資本#! を失い、党の支持率は低下し、新しい首相はそれに不満を抱き、#bold の暴動#! が発生する可能性があります。"
 wm_dispute_sore_loser_modifier: "負け惜しみ"
 wm_dispute_sore_loser_modifier_desc: "総選挙の結果を受け入れなかった。"
 wm_dispute_bad_loser_modifier: "バッド・ルーザー"
 wm_dispute_bad_loser_modifier_desc: "明らかに負けた結果に異議を唱えた。"
 wm_dispute_sore_loser_opinion: "謝罪を拒否した"
