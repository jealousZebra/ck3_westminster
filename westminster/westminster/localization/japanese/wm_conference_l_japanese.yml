l_japanese:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "会議：リーダーのスピーチ"
 wm_conference.1.desc: "会議シーズンであり、[wm_conference_party.GetNameNoTier]は4日間の周辺会議、ネームタグ、ぬるいコーヒーのために海辺の会議センターを占拠しました。明日は大舞台です：会場での私の演説がすべてのニュースチャンネルで生中継されます。演説の原稿は19稿目に達しました。トローチは私のポケットにあります。ステージには高さ4フィートの文字でスローガンが掲げられ、誰かが文字が外れていないか確認してくれました。おそらく。"
 wm_conference.1.a: "書かれた通りに演説を行ってください。"
 wm_conference.1.b: "台本を破り捨て、心から話す。"
 wm_conference.1.c: "明確な政策発表を発表する。"

 wm_conference_headline_triumph: "勝利の演説がホールを立ち上がらせる"
 wm_conference_headline_solid: "党首の演説:「わかった」と代表たちは言う"
 wm_conference_headline_disaster: "泣きまみれの災害、セットが崩壊"
 wm_conference_headline_policy_hit: "大胆な誓約が主役をさらう"
 wm_conference_headline_policy_flop: "主要政策が昼までに沈みを迎える"
 wm_conference.2.desc_triumph: "11人のスタンディングオベーション、そのうちの一つは息を整える間に行われました。スケッチライターたちは失礼をこらえ、一晩の世論調査が出て、議会党は突然私と一緒にバーにいるところを見たがっています。"
 wm_conference.2.desc_solid: "スタンディングオベーションなし、災害なし、背景の文字落下なし。新聞はこれを\"実務的な\"と呼んでおり、彼らにとってはほぼラブレターです。"
 wm_conference.2.desc_disaster: "それは喉のかゆみから始まり、私の背後のスローガンの文字が二つ消える中、ロゼンジをステージに渡す代表者で満たされたホールで終わった。抗議者は講演台まで進んだ。スケッチ作家たちは何年もこんな日を経験しておらず、バーでは同僚たちが低い声で話している"
 wm_conference.2.desc_policy_hit: "その政策は事前に試されず、漏らされず、すべての速報のトップに載るものであった。対抗する党は、自分たちが先に考えたと言い張ろうと慌てている。会場は私の名前を連呼し、嬉しかったが、少し不安にもなった。"
 wm_conference.2.desc_policy_flop: "私が舞台を去った頃には、シンクタンクが原価計算に400億ポンドの穴を見つけ、私の前線の二人はラジオでそのことを聞いたことがないと言っていました。"
 wm_conference.2.a: "来年はいつでもあるよ。"

 wm_conference.10.t: "会議：ランヤードと周辺"
 wm_conference.10.desc: "[wm_conference_party.GetNameNoTier]の会議は盛況です：過熱したサイドルームでの4日間の周辺会議、誰も知らない貿易団体が主催するレセプション、そして真のビジネスが深夜に行われるホテルバー。[wm_conference_leader.GetName]は明日話します。私は会議をどのように過ごしますか?"
 wm_conference.10.a: "周辺の集会で話す。"
 wm_conference.10.b: "ホテルのバーでの陰謀。"
 wm_conference.10.c: "受付を担当し、人脈を作ること。"
 wm_conference.10.d: "議場に座り、党首を大声で目立つように拍手する"
 wm_conference_fringe_good: "フリンジ：満席の部屋と良いレビュー"
 wm_conference_fringe_off_message: "フリンジ：発言が『公式見解と異なる』"
 wm_conference_plot_found_out: "陰謀:鞭に聞かれて"

 wm_conference.20.t: "党首動向"
 wm_conference.20.desc: "会議は終わり、話題は私のスピーチではない。匿名の同僚たちは日曜紙に、[wm_conference_party.GetNameNoTier]には\"新たなスタートが必要\"だと言っている。このフレーズは決して新しいロゴを意味しない。党議員たちには名前がある。問題は私が何をするかだ。"
 wm_conference.20.a: "陰謀者たちに立ち向かえ。"
 wm_conference.20.b: "議会党の話を聞くことを約束する。"
 wm_conference.20.c: "それをウェストミンスターのバブルの噂だと片付けてください。"
 wm_conference_faced_down: "噂:陰謀者たちは引き下がる"
 wm_conference_not_faced_down: "地鳴り:物語はどんどん続く"

 wm_conference_triumph_modifier: "会議の勝利"
 wm_conference_triumph_modifier_desc: "来年も人々が正しい理由で引用する会議スピーチをしました。"
 wm_conference_disaster_modifier: "会議の災難"
 wm_conference_disaster_modifier_desc: "来年も人々が間違った理由で引用する会議のスピーチをした。"

 wm_conference_triumph_opinion: "勝利の演説"
 wm_conference_disaster_opinion: "悲惨な会議演説"
 wm_conference_listened_opinion: "党の話を聞くことを約束した"
 wm_conference_contacts_opinion: "会議で会合"
 wm_conference_fellow_plotter_opinion: "ホテルのバーで共謀した"
 wm_conference_caught_plotting_opinion: "私に対して陰謀を企てていたところが捕まった"
 wm_conference_loyal_applause_opinion: "私の演説に最も大きな拍手を送った"
 wm_conference_off_message_opinion: "周縁集会でメッセージを外した"
