l_french:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "Conférence : Discours du leader"
 wm_conference.1.desc: "C'est la saison des conférences, et le [wm_conference_party.GetNameNoTier] a pris le contrôle d'un centre de conférence en bord de mer pour quatre jours de réunions périphériques, de badges et de café tiède. Demain est le grand jour : mon discours devant la salle, en direct sur toutes les chaînes d'info. Les rédacteurs du discours ont produit la dix-neuvième ébauche. Les pastilles sont dans ma poche. Le décor a un slogan en lettres de quatre pieds de hauteur, et quelqu'un a vérifié qu'aucune d'elles n'est desserrée. Probablement."
 wm_conference.1.a: "Prononcez le discours tel qu’il est écrit."
 wm_conference.1.b: "Déchirez le script et parlez avec le cœur."
 wm_conference.1.c: "Dévoiler une annonce politique en grande ligne."

 wm_conference_headline_triumph: "UN DISCOURS TRIOMPHANT FAIT SE LEVER LA SALLE"
 wm_conference_headline_solid: ": « TRÈS BIEN », DISENT LES DÉLÉGUÉS"
 wm_conference_headline_disaster: "DÉSASTRE PLEIN DE TOUX ALORS QUE LA SET SE DÉMANTÈLE"
 wm_conference_headline_policy_hit: "PROMESSE AUDACIEUSE MONTE SUR SCÈNE"
 wm_conference_headline_policy_flop: "LA POLITIQUE PHARE COULE À MIDI"
 wm_conference.2.desc_triumph: "Onze ovations debout, dont une pendant une pause pour respirer. Les chroniqueurs de sketches peinent à être impolis, les sondages de la nuit sont en ligne, et le groupe parlementaire est soudain très désireux d’être vu avec moi au bar."
 wm_conference.2.desc_solid: "Pas d'ovations debout, pas de désastres et pas de lettres tombant du fond. Les journaux qualifient cela de \"travailleur\", ce qui pour eux est pratiquement une lettre d'amour."
 wm_conference.2.desc_disaster: "Tout a commencé par un chatouillement dans la gorge et s’est terminé par une salle remplie de délégués passant des pastilles à la scène tandis que le slogan derrière moi perdait deux de ses lettres. Un manifestant est allé jusqu’au pupitre. Les auteurs de sketches n’ont pas eu une journée pareille depuis des années, et au bar, mes collègues parlent à voix basse."
 wm_conference.2.desc_policy_hit: "La politique n'a pas été testée, elle n'a pas été divulguée, et elle mène chaque bulletin. Les partis rivaux se précipitent pour dire qu'ils y ont pensé en premier. La salle a scandé mon nom, ce qui était agréable, bien que légèrement troublant."
 wm_conference.2.desc_policy_flop: "Au moment où j'avais quitté la scène, un groupe de réflexion avait trouvé un trou de quarante milliards de livres dans les estimations et deux de mes collègues de la première ligne avaient déclaré à la radio qu'ils n'en avaient jamais entendu parler."
 wm_conference.2.a: "Il y a toujours l'année prochaine."

 wm_conference.10.t: "Conférence : Lanières et Fringe"
 wm_conference.10.desc: "La conférence [wm_conference_party.GetNameNoTier] bat son plein : quatre jours de réunions parallèles dans des salles annexes surchauffées, des réceptions sponsorisées par des organismes commerciaux dont personne n'a entendu parler, et le bar de l'hôtel, où les véritables affaires se déroulent après minuit. [wm_conference_leader.GetName] prend la parole demain. Comment dois-je passer ma conférence ?"
 wm_conference.10.a: "Parler lors d’une réunion marginale."
 wm_conference.10.b: "Parcelle dans le bar de l’hôtel."
 wm_conference.10.c: "Travaillez lors des réceptions et nouez des contacts."
 wm_conference.10.d: "S'asseoir dans la salle et applaudir le chef, bruyamment et visiblement."
 wm_conference_fringe_good: "Fringe : Une salle remplie et un bon compte-rendu"
 wm_conference_fringe_off_message: "Fringe : Remarques 'hors sujet'"
 wm_conference_plot_found_out: "Intrigues : Entendu par les Whips"

 wm_conference.20.t: "Rumeurs sur le leadership"
 wm_conference.20.desc: "La conférence est terminée, et on ne parle pas de mon discours. Des collègues anonymes disent aux journaux du dimanche que le [wm_conference_party.GetNameNoTier] a besoin d'un \" nouveau départ\", une phrase qui ne signifie jamais un nouveau logo. Les whips ont des noms. La question est de savoir ce que j'en fais."
 wm_conference.20.a: "Affrontez les comploteurs."
 wm_conference.20.b: "Promets d’écouter le groupe parlementaire."
 wm_conference.20.c: "Rejeter cela comme des bavardages de la bulle de Westminster."
 wm_conference_faced_down: "Rumeurs : Les comploteurs reculent"
 wm_conference_not_faced_down: "Rumeurs : L'histoire continue et continue"

 wm_conference_triumph_modifier: "Triomphe de la conférence"
 wm_conference_triumph_modifier_desc: "A prononcé un discours lors d'une conférence que les gens citeront encore l'année prochaine, pour les bonnes raisons."
 wm_conference_disaster_modifier: "Désastre de la conférence"
 wm_conference_disaster_modifier_desc: "A prononcé un discours lors d'une conférence que les gens citeront encore l'année prochaine, pour les mauvaises raisons."

 wm_conference_triumph_opinion: "Discours triomphant à la conférence"
 wm_conference_disaster_opinion: "Discours catastrophique à la conférence"
 wm_conference_listened_opinion: "Promis d’écouter la fête"
 wm_conference_contacts_opinion: "Rencontré lors de la conférence"
 wm_conference_fellow_plotter_opinion: "Ont comploté ensemble dans le bar de l’hôtel"
 wm_conference_caught_plotting_opinion: "Pris à comploter contre moi"
 wm_conference_loyal_applause_opinion: "Applaudit mon discours le plus fort"
 wm_conference_off_message_opinion: "A dévié du message lors d'une réunion marginale"
