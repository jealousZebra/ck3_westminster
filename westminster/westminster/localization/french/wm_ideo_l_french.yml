 # Policy positions (doctrines) and their groups
 doctrine_category_wm_ideo_policy: "Politique"
 wm_ideo_grp_economy_name: "Taxes et dépenses"
 wm_ideo_doc_tax_and_spend_name: "Taxer et dépenser"
 wm_ideo_doc_tax_and_spend_desc: "Des impôts plus élevés sur les plus aisés pour financer des services publics généreux."
 wm_ideo_doc_balanced_budget_name: "Budget équilibré"
 wm_ideo_doc_balanced_budget_desc: "Dépensez ce que le pays peut se permettre, et rien de plus : les règles budgétaires passent avant tout."
 wm_ideo_doc_low_tax_name: "Faible Impôt"
 wm_ideo_doc_low_tax_desc: "Baisser les impôts et laisser les gens garder une plus grande partie de ce qu’ils gagnent ; l’État doit vivre avec moins de ressources."
 wm_ideo_grp_ownership_name: "Propriété"
 wm_ideo_doc_public_ownership_name: "Propriété publique"
 wm_ideo_doc_public_ownership_desc: "Les chemins de fer, l'eau et l'énergie doivent appartenir au public."
 wm_ideo_doc_mixed_economy_name: "Économie mixte"
 wm_ideo_doc_mixed_economy_desc: "Marchés où ils travaillent, l'état où ils ne le font pas."
 wm_ideo_doc_free_markets_name: "Marchés Libres"
 wm_ideo_doc_free_markets_desc: "La concurrence et l'entreprise privée donnent de meilleurs résultats que l'État."
 wm_ideo_grp_migration_name: "Immigration"
 wm_ideo_doc_open_migration_name: "Accueillant"
 wm_ideo_doc_open_migration_desc: "L'immigration enrichit le pays ; les réfugiés méritent un accueil équitable."
 wm_ideo_doc_managed_migration_name: "Migration gérée"
 wm_ideo_doc_managed_migration_desc: "Immigration contrôlée et planifiée pour répondre aux besoins du pays."
 wm_ideo_doc_restrictive_migration_name: "Restrictif"
 wm_ideo_doc_restrictive_migration_desc: "Les chiffres doivent baisser fortement et les frontières doivent être sécurisées."
 wm_ideo_grp_europe_name: "Europe"
 wm_ideo_doc_pro_european_name: "Pro-européen"
 wm_ideo_doc_pro_european_desc: "Des liens plus étroits avec l’Europe, jusqu’à la réintégration du marché unique ou de l’UE."
 wm_ideo_doc_pragmatic_europe_name: "Pragmatique"
 wm_ideo_doc_pragmatic_europe_desc: "Une relation pratique avec l'Europe, au cas par cas."
 wm_ideo_doc_eurosceptic_name: "Eurosceptique"
 wm_ideo_doc_eurosceptic_desc: "La souveraineté compte le plus : pas de retour aux règles européennes."
 wm_ideo_grp_union_name: "L'Union"
 wm_ideo_doc_self_determination_name: "Autodétermination"
