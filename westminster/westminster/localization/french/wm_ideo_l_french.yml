 # Change Your Politics (common/decisions/wm_ideo_decisions.txt)
 wm_ideo_change_decision: "Changer votre politique"
 wm_ideo_change_decision_desc: "Les arguments changent, et les gens aussi. Adoptez une nouvelle vision politique : les collègues appelleront cela un demi-tour, les admirateurs une conversion."
 wm_ideo_change_decision_tooltip: "Adopter une idéologie différente"
 wm_ideo_change_decision_confirm: "Changer d'avis"
 wm_ideo_change_decision_choose: "Choisissez une idéologie"
 wm_ideo_change_decision_effect_tt: "Votre [faith|E] devient celui que vous avez choisi. Un député travailliste ou conservateur se rend à l'aile de son parti."
 wm_ideo_pick_socialist_desc: "Devenez un socialiste. Propriété publique, droits des travailleurs et fin des inégalités : la gauche socialiste démocratique."
 wm_ideo_pick_social_democrat_desc: "Devenez un social-démocrate. Un pays plus juste grâce à des services publics bien financés et une économie mixte : le centre-gauche traditionnel."
 wm_ideo_pick_green_desc: "Devenir un Écologiste. L’urgence climatique d’abord, avec la justice sociale et une démocratie plus équitable."
 wm_ideo_pick_liberal_desc: "Devenir un Libéral. Liberté personnelle, votes justes et une relation étroite avec l’Europe : la tradition libérale."
 wm_ideo_pick_centrist_desc: "Devenir un Centriste. La compétence avant l’idéologie : modéré, pro-entreprise et pragmatique."
 wm_ideo_pick_cross_community_desc: "Devenir un Transcommunautaire. Ni unioniste ni nationaliste : un avenir partagé pour les communautés d’Irlande du Nord."
 wm_ideo_pick_one_nation_desc: "Devenir un conservateur One Nation. Conservatisme modéré et paternaliste : responsabilité sociale, institutions stables et l'Union."
 wm_ideo_pick_free_market_desc: "Devenir un Libéral du marché. Taxes plus basses, déréglementation et un État plus petit pour stimuler la croissance."
 wm_ideo_pick_national_conservative_desc: "Devenez un conservateur national. Famille, nation et tradition, avec une immigration beaucoup plus faible."
 wm_ideo_pick_populist_right_desc: "Devenez un populiste. Contre l'establishment de Westminster : contrôle des frontières, souveraineté et baisse des impôts."
 wm_ideo_pick_scottish_nationalist_desc: "Devenez un nationaliste écossais. Une Écosse indépendante en Europe, avec un programme social-démocrate à l'intérieur du pays."
 wm_ideo_pick_welsh_nationalist_desc: "Devenez un nationaliste gallois. Autonomie pour le Pays de Galles et protection de la langue galloise."
 wm_ideo_pick_irish_republican_desc: "Devenir un républicain irlandais. Une Irlande unie et la fin de la partition, avec un programme de gauche."
 wm_ideo_pick_irish_nationalist_desc: "Devenir un nationaliste irlandais. Nationalisme constitutionnel : unité irlandaise par consentement, partage du pouvoir et démocratie sociale."
 wm_ideo_pick_unionist_desc: "Devenir un unioniste. La place de l'Irlande du Nord dans le Royaume-Uni, défendue avant tout."
