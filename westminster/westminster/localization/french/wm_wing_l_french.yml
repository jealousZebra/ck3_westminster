l_french:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "Gauche travailliste"
 wm_wing_badge_1_desc: "Un membre de la gauche socialiste du parti : la propriété publique, les droits syndicaux et les dépenses. (L'aile réelle d'un député dans ce jeu est aléatoire, ce n'est pas une déclaration de ses points de vue.)"
 wm_wing_badge_2: "Gauche modérée"
 wm_wing_badge_2_desc: "Un membre de la gauche modérée du parti : les amis critiques de la direction, attachés aux services publics. (L'aile réelle d'un député dans ce jeu est aléatoire, ce n'est pas une déclaration de ses points de vue.)"
 wm_wing_badge_3: "Centristes travaillistes"
 wm_wing_badge_3_desc: "Un membre des centristes du parti : prudence fiscale, réforme des services publics, électoralisme avant tout. (L'orientation politique réelle d'un député dans ce jeu est aléatoire, ce n'est pas une affirmation de ses convictions.)"
 wm_wing_badge_4: "Une Nation"
 wm_wing_badge_4_desc: "Un membre des modérés One Nation du parti : pragmatique, en faveur des services publics. (L'orientation politique réelle d'un député dans ce jeu est aléatoire, ce n'est pas une affirmation de ses convictions.)"
 wm_wing_badge_5: "Partisans du marché libre"
 wm_wing_badge_5_desc: "Un membre des libéraux du parti : des impôts plus bas, un État plus petit, la déréglementation. (L'aile réelle d'un député dans ce jeu est aléatoire, ce n'est pas une déclaration de ses points de vue.)"
 wm_wing_badge_6: "Traditionnalistes"
 wm_wing_badge_6_desc: "Un membre des traditionalistes du parti : la loi et l'ordre, les institutions, l'identité nationale. (L'aile réelle d'un député dans ce jeu est aléatoire, ce n'est pas une déclaration de ses points de vue.)"
 wm_wing_court_decision: "Cour une aile de parti"
 wm_wing_court_decision_desc_labour: "Sentiment des ailes du Parti travailliste parlementaire vis-à-vis de leur leader (sur 100) :\n#bold Gauche travailliste#! ([EmptyScope.ScriptValue('wm_ui_wing_size_1')|0] députés) : approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold Centre-gauche#! ([EmptyScope.ScriptValue('wm_ui_wing_size_2')|0] députés) : approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold Centristes travaillistes#! ([EmptyScope.ScriptValue('wm_ui_wing_size_3')|0] députés) : approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\nCourtiser une aile coûte #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! profil : elle gagne 15 points d'approbation, les autres en perdent 4. Une aile sans siège dans votre Cabinet (ou cabinet fantôme) perd de l'approbation chaque mois ; une sous 30 grogne et se rebelle à la Chambre des communes, et une sous 15 pendant trois mois lance un défi au leadership."
 wm_wing_court_decision_desc_conservative: "Sentiment des ailes conservatrices vis-à-vis de leur leader (sur 100) :\n#bold Une Nation#! ([EmptyScope.ScriptValue('wm_ui_wing_size_4')|0] députés) : approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold Libéraux du marché#! ([EmptyScope.ScriptValue('wm_ui_wing_size_5')|0] députés) : approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold Traditionalistes#! ([EmptyScope.ScriptValue('wm_ui_wing_size_6')|0] députés) : approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\nCourtiser une aile coûte #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! profil : elle gagne 15 points d'approbation, les autres en perdent 4. Une aile sans siège dans votre Cabinet (ou cabinet fantôme) perd de l'approbation chaque mois ; une sous 30 grogne et se rebelle à la Chambre des communes, et une sous 15 pendant trois mois lance un défi au leadership."
 wm_wing_court_decision_tooltip: "Maintenir les ailes du parti de notre côté."
 wm_wing_court_decision_confirm: "Choisissez une Aile"
 wm_wing_court_decision_effect_tt: "Choisissez une aile : son approbation de vous augmente de #P 15#!, celle de chaque autre aile diminue de #N 4#!."
 wm_wing.1.t: "Maintenir le parti uni"
 wm_wing.1.desc: "Un discours d'ouverture, un clin d'œil à la politique, une promesse de promotions à venir. Quelle aile du parti nécessite de l'attention ?"
 wm_wing.1.w1: "Contacter la Gauche travailliste (approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0])."
 wm_wing.1.w2: "Contacter la Gauche modérée (approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])."
 wm_wing.1.w3: "Contacter les Centrists travaillistes (approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0])."
 wm_wing.1.w4: "Contacter One Nation (approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0])."
 wm_wing.1.w5: "Contacter les Free-marketeers (approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0])."
 wm_wing.1.w6: "Contacter les Traditionalistes (approbation [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0])."
 wm_wing.10.t: "Un défi de leadership"
 wm_wing.10.desc: "Les lettres sont arrivées. Une aile du parti parlementaire a perdu patience et a présenté [wm_wing_challenger.GetName] pour vous défier pour la direction. La presse compte les noms, les diffuseurs ont leurs graphiques prêts, et votre téléphone n’a pas cessé de sonner.\n\nVous pouvez donner aux rebelles ce qu’ils veulent, ou les affronter."
 wm_wing.10.a: "Leur donner ce qu'ils veulent."
 wm_wing.10.a.tt: "Vous perdez #N 300#! de profil ; l'approbation de l'aile rebelle augmente de #P 30#!, celle des autres ailes diminue de #N 4#!."
 wm_wing.10.b: "Affrontez-les."
 wm_wing.10.b.tt: "Un concours de charisme #bold #! contre [wm_wing_challenger.GetName]. Gagnez et la rébellion s’éteint ; perdez et ils prennent la direction (et Downing Street, si vous êtes Premier ministre)."
 wm_wing_challenge_toast: "DÉFI DE LEADERSHIP"
 wm_wing_challenge_toast_desc_1: "La Gauche travailliste a agi contre [wm_wing_leader.GetName] : [wm_wing_challenger.GetName] défie la direction du [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_2: "La Soft Left s'est opposée à [wm_wing_leader.GetName] : [wm_wing_challenger.GetName] conteste la direction de [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_3: "Les Gauchistes centristes ont agi contre [wm_wing_leader.GetName] : [wm_wing_challenger.GetName] défie la direction du [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_4: "Le One Nation s'est opposé à [wm_wing_leader.GetName] : [wm_wing_challenger.GetName] conteste la direction de [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_5: "Les partisans du libre-marché se sont opposés à [wm_wing_leader.GetName] : [wm_wing_challenger.GetName] conteste la direction du [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_6: "Les Traditionalistes se sont opposés à [wm_wing_leader.GetName] : [wm_wing_challenger.GetName] conteste la direction de [wm_wing_party.GetNameNoTier]."
