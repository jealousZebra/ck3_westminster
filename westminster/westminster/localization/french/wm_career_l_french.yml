l_french:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "Travail du parti"
 wm_job_canvassing_contract: "Démarchage"
 wm_job_canvassing_desc_title: "Chercheurs de portes"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] a besoin de volontaires à sa porte ce week-end : tablettes, prospectus et peau dure. Le parti remarque qui se présente sous la pluie."
 wm_job_canvassing_request: "Passe trois semaines à frapper aux portes. Le succès dépend de ta [diplomacy|E]."
 wm_job_fundraising_contract: "Dîner de collecte de fonds"
 wm_job_fundraising_desc_title: "Aider à remplir les tableaux"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] organise un dîner de collecte de fonds et a besoin de quelqu'un pour vendre les tables, relancer les donateurs et garder la tombola honnête."
 wm_job_fundraising_request: "Organisez le dîner sur trois semaines. Le succès dépend de votre [stewardship|E]."
 wm_job_speechwriting_contract: "Rédaction de discours"
 wm_job_speechwriting_desc_title: "Un discours qui fait mouche"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName] a un grand discours à venir et le projet actuel est, selon les mots de son bureau, 'une vidéo de prise d'otage'."
 wm_job_speechwriting_request: "Rédigez le discours sur trois semaines. Le succès dépend de votre [learning|E]."
 wm_job_research_contract: "Recherche sur l'opposition"
 wm_job_research_desc_title: "Explorer l'autre côté"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] veut un briefing sur ses adversaires : les dossiers de vote, les vieux tweets, les promesses non tenues. Tout est public, tout est utile."
 wm_job_research_request: "Compiler le dossier sur trois semaines. Le succès dépend de votre [intrigue|E]."
 wm_job_phonebank_contract: "Phone Bank"
 wm_job_phonebank_desc_title: "Une soirée au téléphone"
 wm_job_phonebank_desc: "Le bureau de [TaskContract.GetEmployer.GetName] a une liste de quatre cents membres qui n'ont pas renouvelé, une salle de téléphones empruntés et un script que personne n'a répété."
 wm_job_phonebank_request: "Travaillez la liste d'appels sur trois semaines. Le succès dépend de votre [diplomacy|E]."
 wm_job_policy_paper_contract: "Document de politique"
 wm_job_policy_paper_desc_title: "Dix pages, entièrement chiffrées"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] veut quelque chose à dire sur les bus locaux qui ne soit pas un slogan : preuves, chiffres et une recommandation qu'un ministre pourrait signer."
 wm_job_policy_paper_request: "Rédigez le devoir sur trois semaines. Le succès dépend de votre [learning|E]."
 wm_job_media_round_contract: "Tour des médias"
 wm_job_media_round_desc_title: "Six studios avant le petit-déjeuner"
 wm_job_media_round_desc: "La radio locale, la télévision régionale et deux podcasts veulent que quelqu'un du côté de [TaskContract.GetEmployer.GetName] intervienne pour défendre la ligne. Personne d'autre ne s'est porté volontaire."
 wm_job_media_round_request: "Préparez les lignes et faites les interviews sur trois semaines. Le succès dépend de votre [intrigue|E]."
 wm_job_gotv_contract: "Mobiliser les électeurs"
 wm_job_gotv_desc_title: "Mets-les enceintes, sors-les"
 wm_job_gotv_desc: "L'équipe de [TaskContract.GetEmployer.GetName] a besoin de coursiers pour l'élection partielle du conseil : cartes de vote, numéros des scrutateurs et beaucoup d'escaliers dans beaucoup d'immeubles."
 wm_job_gotv_request: "Menez l'opération de mobilisation du vote sur trois semaines. Le succès dépend de votre [prowess|E]."
 wm_job_budget_contract: "Coût d'un engagement"
 wm_job_budget_desc_title: "D'où vient l'argent ?"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName] a promis quelque chose de cher et l’autre partie ne cesse de demander comment cela sera payé. Un tableau est nécessaire, d’urgence."
 wm_job_budget_request: "Coût de l'engagement sur trois semaines. Le succès dépend de votre [stewardship|E]."
 wm_selection_contract: "Évaluation des candidats"
 wm_selection_contract_contract: "Évaluation des candidats"
 wm_selection_contract_desc_title: "La liste approuvée du parti."
 wm_selection_contract_desc: "Avant que quiconque puisse se présenter pour le parti, il doit réussir un jour d'évaluation : un entretien simulé, un test de politique et un jeu de rôle avec un 'constituant' en colère."
 wm_selection_contract_request: "Passez l'évaluation pour rejoindre la liste des candidats approuvés. Le succès dépend de votre [diplomacy|E]."

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "Candidatures ouvertes en [wm_sel_seat.GetName]"
 wm_career.20.desc: "Le [wm_sel_party.GetName] local choisit son candidat pour [wm_sel_seat.GetName]. L’e-mail du président de circonscription est court : les candidatures se terminent dans quelques semaines, et il y aura des réunions publiques au centre communautaire.\n\nLes personnes qui se présentent dans des circonscriptions comme celle-ci deviennent députés."
 wm_career.20.a: "Proposer mon nom."
 wm_career.20.b: "Pas celui-ci."
 wm_career.21.t: "Hustings à [wm_sel_seat.GetName]"
 wm_career.21.desc: "Chaises en plastique, une boîte à thé et soixante membres du groupe qui ont déjà entendu toutes les propositions. Chaque candidat dispose de dix minutes et de questions sur le plateau. Comment les convaincre ?"
 wm_career.21.a: "Parler de la zone : sa rue principale, ses bus, ses habitants."
 wm_career.21.b: "Définir un plan chiffré, politique par politique."
 wm_career.21.c: "Leur rappeler doucement ce que les autres candidats ont dit dans le passé."
 wm_career.21.success: "La pièce s'est réchauffée pour vous"
 wm_career.21.failure: "La pièce est restée froide"

 wm_career_selected_toast: "Sélectionné pour [wm_sel_seat.GetName]"
 wm_career_selected_toast_desc: "Le [wm_sel_party.GetName] local vous a choisi comme candidat. Gagnez le siège lors de la prochaine élection ou élection partielle et vous serez député."
 wm_career_not_selected_toast: "Non sélectionné dans [wm_sel_seat.GetName]"
 wm_career_not_selected_toast_desc: "Les membres ont choisi [wm_sel_winner.GetName]. Vous serez mieux connu la prochaine fois."
 wm_career_elected_toast: "Élu au Parlement"
 wm_career_elected_toast_desc: "Le comptage est fait et le siège est à vous. L'équipe de campagne est démantelée ; les whips de votre parti vous contacteront."

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "Postuler à la sélection"
 wm_career_apply_decision_desc: "Proposer mon nom pour être le candidat de mon parti dans une circonscription où les membres locaux choisissent un candidat. Position du parti : [GetPlayer.MakeScope.Var('wm_standing').GetValue|0]."
 wm_career_apply_decision_tooltip: "Postuler pour être le candidat du parti à un siège"
 wm_career_apply_decision_free_tt: "Ne postule pas déjà pour un siège ou n'est pas sélectionné en tant que candidat"
 wm_career_apply_decision_standing_tt: "Sur la liste des candidats approuvés par le parti, ou avec un score de Parti d'au moins 30"
 wm_career_apply_decision_open_tt: "Le parti est en train de choisir un candidat quelque part."
 wm_career_apply_decision_effect_tt: "Vous postulez à l’une des sélections que le parti a ouvertes, de préférence dans votre propre pays, et vous prenez la parole lors de ses sessions."
 wm_career_return_decision: "De retour sur la route de la campagne"
 wm_career_return_decision_desc: "Les électeurs se sont exprimés, et ils peuvent changer d'avis. Constituez une équipe de campagne et cherchez un siège."
 wm_career_return_decision_tooltip: "Chercher à se représenter après avoir perdu votre siège"
 wm_career_return_decision_effect_tt: "Vous obtenez une équipe de campagne, rejoignez la liste des candidats approuvés du parti et pouvez postuler aux sélections."

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "A fait du bon travail pour moi"
 wm_career_poor_work_opinion: "Laisse-moi descendre"
 wm_career_apply_decision_confirm: "Soumettre ma candidature"
 wm_career_return_decision_confirm: "Retour aux marches"
