 backwater_county_modifier_desc: "Plus ils sont grands, plus ils tombent durement. Cette circonscription, autrefois le territoire de dirigeants implacables de Hellas, est malheureusement tombée dans l'ignominie. Bien qu'elle soit actuellement l'ombre d'elle-même, cette circonscription pourrait bien redevenir grande.\n\n#X @warning_icon! Ce modificateur peut être supprimé en utilisant le [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] une fois que [development|E] de ce [county|E] est #V 50#! ou plus !#!\n\n"
 barons_and_minor_landholders_disapproves_baron_revocations_opinion: "[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName] Désapprouve la révocation des Ward"
