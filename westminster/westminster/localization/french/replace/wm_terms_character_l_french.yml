 celestial_bureaucracy_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Les [governor|E] non [vassals|E] ne peuvent pas mener de [war|E] contre d'autres députés de base à moins d'utiliser un [hook|E] sur leur [liege|E]#!"
 celestial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvent passer entre tous les [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline disponibles :3 Tous les députés de base qui refusent la révocation du titre ou le retrait du statut de député de base sont considérés comme [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! le coût est réduit"
 char_interaction.0001.desc: "J'accepte votre généreuse offre de vassalisation. Mon chef de parti !"
 char_interaction.0002.desc: "Je n'ai pas besoin de votre protection et préfère garder la récompense de mon Parti pour moi."
 char_interaction.0010.a: "Mon chef de parti !"
 char_interaction.0090.from_ward.desc: "Je crains que mon éducation à votre bureau ne réponde plus à mes besoins. Je retournerai immédiatement à [capital.GetNameNoTierNoTooltip]."
 char_interaction.0090.one_ward.desc: "Je crains que l'éducation de [ward.GetTitledFirstName] à votre bureau ne réponde plus à nos besoins. [ward.GetSheHe|U] est par la présente rappelé à notre garde."
 char_interaction.0090.two_wards.desc: "Je crains que l'éducation de [ward.GetTitledFirstName] et de [ward_2.GetTitledFirstName] à votre bureau ne réponde plus à nos besoins. Ils sont par la présente rappelés à notre garde."
 char_interaction.0180.desc: "En tant que chef de votre maison, j'ai décidé que vous devez adopter [puppet_or_actor.GetFaith.GetName], la seule véritable idéologie. Je crains que vous n'ayez aucun choix en cette matière."
 char_interaction.0180.desc.liege: "En tant que chef de votre parti, j'exige que vous abandonniez votre fausse idéologie et que vous me rejoigniez en tant que compagnon [puppet_or_actor.GetFaith.GetAdherentName], immédiatement."
 char_interaction.0181.desc: "Très bien, j'embrasserai l'idéologie [puppet_or_actor.GetFaith.GetAdjective] bien qu'il soit étrange d'abandonner tant de choses familières."
 char_interaction.0182.desc: "Je n’abandonnerai jamais mon idéologie et, au contraire, je fonderai ma propre maison !"
 char_interaction.0190.desc: "Très bien, j'embrasserai l'idéologie [puppet_or_actor.GetFaith.GetAdjective] bien qu'il soit étrange d'abandonner tant de choses familières."
 char_interaction.0191.desc: "Mon idéologie est au cœur de mon être — je ne l'abandonnerai jamais."
 char_interaction.0200.desc: "Je suis arrivé à la conclusion que vous ne pouvez pas être investi de la dignité et de la responsabilité du [landed_title.GetName]. Par conséquent, je vous retire désormais ce titre pour le bien supérieur du Parti."
 char_interaction.0211.desc: "J’apprécie vraiment votre généreuse proposition de faire de [secondary_recipient.GetShortUIName] mon député de base, mais je crains de devoir refuser."
 char_interaction.0220.desc: "J'accepte votre retrait de mon député de backbench, [secondary_recipient.GetShortUIName], bien que je pense que c'est injuste."
 char_interaction.0221.desc: "Je ne peux trahir le serment de fidélité de [secondary_recipient.GetShortUIName]. Je protégerai mon député de backbench, même si cela signifie rompre le serment que j'ai envers vous."
 char_interaction.0232.liege: "Je ne resterai pas inactif pendant que notre leader de parti abuse des députés de base loyaux à [actor.GetHerHis]. Je vous exhorte à me rejoindre dans le combat pour renverser ce tyran."
 char_interaction.0232.regent: "Je ne resterai pas inactif pendant que [actor.GetSheHe] abuse des députés de base loyaux à [ceremonial_liege.GetTitledFirstNamePossessive]. Je vous exhorte à me rejoindre dans le combat pour renverser ce tyran."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nJ'ai été un bon député de l'arrière-ban pour vous, mais vous comprenez sûrement que j'ai aussi mes propres sujets !\n\nMon contrat actuel est très restrictif, vous verriez sûrement la sagesse de le rendre plus souple ?\n\nEt, en plus, vous #emphasis me devez quelque chose !#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nEn reconnaissance de nos offrandes et du respect envers [recipient.GetPrimaryTitle.GetNameNoTooltip], je demande que vous honoriez cette dévotion en accordant [SCOPE.Custom('CelestialTributaryRequest')].\n\nPuisse cette faveur renforcer l'harmonie entre votre trône et notre humble parti."
 char_interaction.0271.desc: "Par l'autorité de la fonction qui m'est accordée par [intermediary.GetTitledFirstName], je corrige certaines incohérences triviales dans les frontières du parti.\n\nVous êtes commandé de céder la vassalité de [intermediary.GetTitledFirstName] au leader légitime du parti [intermediary.GetHerHis]. Moi."
 char_interaction.0272.desc: "Vous outrepassez les limites de votre autorité, mais je ne peux résister à l'office de mon [intermediary.GetTitleAsName], même lorsque c'est seulement #EMP vous#! l'exerçant.\n\nJ'accepte votre rétractation de mon backbencher."
 char_interaction.0273.desc: "J’ai prêté serment de protéger mes députés de base, et cela inclut contre les déprédations de gens comme #EMP vous#!.\n\nVous pouvez me prendre les terres de [intermediary.GetTitledFirstName] et [intermediary.GetHerHis] au combat ou vous pouvez retourner à n’importe quel trou abandonné par [recipient.GetFaith.random_GoodGodNames] où vous vous terriez."
 char_interaction.0282.desc: "Contrairement à mes actes, tes exigences sont criminelles. \n\nPobébéis, je me conformerai, mais sache que je n’oublierai pas cette offense."
 char_interaction.0291.a: "Je suis sûr que mon chef de parti sait ce qui est le mieux."
 char_interaction.0291.desc.negative: "Tu ne peux rien faire#EMP#!, n'est-ce pas ? Même le plus lent des simples du pays pourrait voir que [recipient.GetTitledFirstName] n'est pas sur quoi tu devrais te concentrer. Arrête de harceler les meilleurs députés de backbench et fais ton travail."
 char_interaction.0370.a.herder: "J'aurais dû garder mon parti uni."
 church_authority_0: "Responsables de parti autonomes"
 church_authority_0_effects_not_in_prev: "#weak Les députés cléricaux fournissent [levies|E] et [taxes|E], mais conservent une large autonomie.#!"
 church_authority_2_effects: "$EFFECT_LIST_BULLET$Les dirigeants peuvent établir une théocratie [dynasty|E]\n$EFFECT_LIST_BULLET$[vassals|E] ne peut pas mener de [war|E] contre d'autres Backbenchers à moins qu'ils n'utilisent un [hook|E] sur leur [liege|E]\n$EFFECT_LIST_BULLET$Les [titles|E] des Backbenchers ne peuvent pas être hérités par des personnages en dehors du [realm|E]\n$EFFECT_LIST_BULLET$Tous les Backbenchers qui refusent la révocation d'un titre ou le retrait d'un Backbencher sont considérés comme [criminals|E]\n$EFFECT_LIST_BULLET$A [christian|E] [head_of_faith|E] peut utiliser le [GetDecision('enact_a_bull_decision').GetName] [decision|E] pour déclarer un [great_holy_war|E]\n$EFFECT_LIST_BULLET$Peut utiliser le [GetDecision('pam_establish_theocratic_dynasty_decision').GetName] [decision|E]\n$EFFECT_LIST_BULLET$[subordinates|E] et le [rulers|E] laïque sont plus faciles à [puppet|E]"
