 convert_to_religion_interaction: "Adopter l'idéologie"
 council_interaction.0001.desc.accept: "Je commencerai à travailler pour remplir mes nouvelles responsabilités immédiatement, et je vous verrai à la prochaine réunion du cabinet !"
 county_capital_province_modifier: "Capitale de circonscription"
 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "Nous avons dû rester à débattre des lois de la toilette et de l'apparence appropriées pendant des heures, gesticulant violemment les uns vers les autres, citant des lois anciennes dont peu au bureau semblaient conscients. Alors que la fumée du spectacle se dissipait,"
 court_amenities_interactions.0002.desc_lost: "Je suis choqué de découvrir que je suis en fait en violation de la loi ! \n\n Je me tiens embarrassé tandis que les gardes du château [debate_locale.GetNameNoTierNoTooltip] et les stylistes me déshabillent jusqu'à mes sous-vêtements et continuent à me déshabiller ! Exposé au bureau, je fuis la scène avec ma fierté entre mes jambes."
 court_amenities_interactions.0002.desc_won: "il semblerait que j'ai gagné ! \n\n En tant que tel, [recipient.GetName] a été obligé de se déshabiller jusqu'à [recipient.GetHerHis] sous-vêtements ! Tous les présents dans le bureau ont vu [recipient.GetHerHim] exactement comme [ROOT.Char.GetFaith.CreatorName] a créé [recipient.GetHerHim] !"
 court_amenities_interactions.0003.desc_won: "il semblerait que j'ai gagné ! \n\n En tant que tel, [actor.GetName] a été obligé de se déshabiller jusqu'à [actor.GetHerHis] sous-vêtements ! Tous les présents dans le bureau ont vu [actor.GetHerHim] exactement comme [ROOT.Char.GetFaith.CreatorName] a créé [actor.GetHerHim] !"
