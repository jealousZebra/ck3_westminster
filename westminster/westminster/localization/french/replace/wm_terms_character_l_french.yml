 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U] n’a pas bien défendu les valeurs de notre idéologie, et les [puppet_or_actor.GetFaith.GetAdherentNamePlural] en [target.GetNameNoTier] en souffrirent. Me donneriez-vous votre bénédiction pour libérer ces terres de [secondary_recipient.GetHerHis] règne mal orientée ?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "Si le zèle est enviable, nous devons aussi être pragmatiques si nous voulons que notre idéologie soit triomphante. Ne serait-il pas plus sage de faire de [target.GetNameNoTier] la cible de notre guerre sainte ?"
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "J'ai vu l'erreur de mes façons et, m'étant repenti de mes méfaits, je vous demande de bien vouloir lever mon excommunication afin que je puisse rejoindre mes frères et sœurs de l'idéologie."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "\nJ'essaie d'être un bon [puppet_or_actor.GetFaith.GetAdherentName], mais je ne suis pas plus parfait que n'importe quel autre [actor.GetWomanMan]. Pour compenser mes trébuchements et mes manquements, je souhaite faire don de cette somme d'argent à l'Église.\n\nDe plus, je jurerai de m'abstenir de tout péché."
 RETRACT_VASSAL_PROPOSAL: "Je suis arrivé à la conclusion que, pour le bien supérieur de [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip], [recipient.GetFullName] doit être placé en tant que simple député sous mon autorité directe."
