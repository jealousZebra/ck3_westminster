 ep3_fireside_chat_stewardship: "Discussion au coin du feu : Économie"
 ep3_governor_yearly.3040.a.flavor: "Un tel capital politique filial ne pouvait que nous renforcer tous les deux."
 ep3_governor_yearly.3040.desc: "J'ai commencé à avoir du mal à me rappeler — [emperor.GetPrimaryTitle.GetName] était-il vraiment que ténèbres et désordre avant que le noble [emperor.GetTitledFirstName] ne prenne le sceptre de [emperor.GetHerHis] ? \n\n Les mondains rêvaient-ils de quoi que ce soit d'autre que de partager la compagnie de [emperor.GetHouse.GetName] ? Nos soldats chantaient-ils le nom d'un étranger laid et incompréhensible ? Nos magnats — daignaient-ils embrasser des pieds non faits de la chair parfaite de [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip] ? \n\n Je n'ai vraiment pas besoin de me souvenir. Remettre en question le mandat infaillible de mon souverain ainsi serait inutile."
 ep3_governor_yearly.8070.desc: "Honneurs, profil, pouvoir. Être un [ROOT.Char.GetTitleAsNameNoTooltip] peut accorder ces choses, mais il y a #EMP des#! coûts...\n\nDes montagnes de [ROOT.Char.Custom('GetWritingMaterial')] attendent, recroquevillées, mon sceau ou un coup d'œil, tandis que des bureaucrates sans fin se disputent un tour pour remplir mes oreilles de détails abrutissants.\n\nPersonne ne m'a dit qu'il y aurait autant de #EMP travail#! — et un travail qui semble finalement se faire tout seul, en plus."
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "Depuis des décennies, j'ai suivi les traces des intellectuels et me suis dressé contre la colère des hommes. Ma poésie a grandi inexorablement dans la marque du parti, et pourtant...\n\nIl manque quelque chose. Maintenant que mes années crépusculaires sont sur moi, peut-être est-il temps de quitter [cordoba.GetName] et de me donner une vue large sur le monde ?\n\nUne autre partie inextricable de moi tire toujours sur mon cœur pour rester. J'ai construit une vie ici non seulement pour moi, mais aussi pour les nombreux apprentis qui ont été formés ici au fil des ans.\n\nQue ce soit à cause des érudits qui arpentent ses rues ou de la patine familière de ses murs, #EMP quelque chose#! me garde attaché à cette ville, mon foyer."
