 game_rule.1101.desc.combat.locale.southwark: "Avec la ville la plus riche d'Angleterre si proche, il y a tout à gagner. Que ce soit des maisons ou du butin, la gloire ou du capital politique, les deux armées s'affrontent encore et encore.\n\nLa rive sud de la Tamise bouillonne et écume de notre sang, mais je ne céderai pas, je #EMP ne#! reculerai pas.\n\nL'Angleterre est déjà à moi, cette bataille le prouvera, et tout ce qu'il faut, c'est une dernière #EMP poussée#! pour prouver que—"
 generic_rite_focus_tenet_cranial_trophies: "Cette idéologie traite les restes des ennemis comme une preuve sacrée de triomphe et un profil terrifiant."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] considère les restes des ennemis comme une preuve sacrée de triomphe et un profil terrifiant."
 glory_hound_desc: "$glory_hound$ [vassals|E] se soucient de leur position et de leur profil, et de montrer au monde la force du parti dont ils font partie. Les députés de base audacieux ou sans compassion adoptent souvent ce [vassal_stance|E].\n\n#low $glory_hound$ Les députés de base aiment quand leur chef de parti : #!\n$EFFECT_LIST_BULLET$ A tout Partition [succession_law|E]\n$EFFECT_LIST_BULLET$ Atteint [victory|E] dans l'offensive [wars|E]\n$EFFECT_LIST_BULLET$ Les invite à [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ Les députés de base n'aiment pas quand leur chef de parti : #!\n$EFFECT_LIST_BULLET$ A un haut [crown_authority|E]\n$EFFECT_LIST_BULLET$ Signe [defeat|E] ou [white_peace|E] dans des guerres \n$EFFECT_LIST_BULLET$[marries|E] un caractère [lowborn|E] comme [primary_spouse|E]\n\n Ils préfèrent des [heirs|E] audacieux et courageux avec une haute [martial_i][martial|E] compétence."
 grand_ambitions.0180.desc: "Je me tiens devant le [hof.GetTitleAsName], le chef spirituel de mon peuple. L’air est lourd d’encens et du poids des siècles.\n\nObtenir la faveur de [hof.GetHerHis] ne serait pas seulement accorder un mandat à ma revendication sur [target_title.GetName], mais pourrait influencer les cœurs des fidèles à travers l’empire. [hof.GetSheHe|U] doit me couronner.\n\nLe [hof.GetTitleAsNameNoTooltip] n’est pas une simple figure spirituelle ; [hof.GetSheHe] est parfaitement conscient des machinations temporelles de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]."
