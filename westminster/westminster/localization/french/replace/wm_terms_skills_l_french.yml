 chancellor_task_powerful_vassal_increased_opinion: "Charisme habile"
 chariot_race.0200.h.flavor: "La victoire contre [foe.GetPrimaryTitle.GetNameNoTooltip] n’est-elle pas assurée, si je peux rester ici à organiser des fêtes-à-vis ? Réjouissons-nous du proche du triomphe !"
 christian_saint_bone_description: "Les prétendus restes d'un saint de [saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip], acquis par [saint_bone_owner.GetNameNoTooltip] lors d'un pèlerinage [saint_bone_owner.GetHerHis] à [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip], et vénérés comme un symbole de chance et de capital politique par [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip]."
 claim_throne_increased_responsibility_desc: "J'ai acquis plus de responsabilités pour le parti, renforçant mon mandat."
 clerical_chastity_offer_piety: "Offrir du capital politique"
 commission_epic_emphasized_intrigue_modifier: "Histoires de Spin"
 confucian_faith_desc: "Le confucianisme est une tradition philosophique et éthique enracinée dans les enseignements de Confucius et de ses disciples, mettant l'accent sur l'auto-culture morale, le capital politique filial et le maintien de l'harmonie sociale par une conduite appropriée."
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \" Pendant trop longtemps, les terres appartenant à [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ont souffert de la domination de mains moins habiles. De ceux qui ont confondu possession et mandat.\n\n Cela se termine maintenant. À partir de [activity.GetHost.GetCapitalLocation.GetName], ils connaîtront la véritable gouvernance. Par moi.\"#!"
 coronation_events.0310.c: "Mon mandat et mon profil."
 coronation_legitimacy_memory: "mandat démontré lors d'une coronation [host.GetTitleAsNamePossessiveNoTooltip]"
 coronation_legitimacy_memory_desc: "J'ai assisté à la coronation de [host.GetTitledFirstNamePossessive] et mon mandat a été reconnu par le [host.GetTitleAsNameNoTooltip]"
 coronation_legitimacy_memory_desc_second_perspective: "vous avez assisté à la coronation de [host.GetTitledFirstNamePossessive] et votre mandat a été reconnu par le [host.GetTitleAsNameNoTooltip]"
 coronation_legitimacy_memory_desc_third_perspective: "[owner.GetTitledFirstName] a assisté au couronnement de [host.GetTitledFirstNamePossessive] et a fait reconnaître son mandat [owner.GetHerHis] par le [host.GetTitleAsNameNoTooltip]."
 court_brahmin_court_position_desc: "Un prêtre vénérable trouvé dans les cours hindoues et bouddhistes, le Brahmane de bureau est responsable de l'exécution des rituels, de la supervision des cérémonies et de la promotion du mandat du dirigeant."
 court_diplomatic_desc: "#low Le charisme est la clé pour obtenir le respect de nos pairs et maintenir la paix au sein du parti. Un député satisfait est un député loyal. \n\nLe personnel acquiert les traits [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )].#!"
