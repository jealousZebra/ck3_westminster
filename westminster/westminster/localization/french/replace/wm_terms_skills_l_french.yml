 pam_interactions_events.0034.desc_method_legitimacy: "Une grave menace contre mon mandat. Une hideuse querelle publique à propos de [target.GetNameNoTierNoTooltip], un scandale qui nous ridiculise tous les deux..."
 pam_interactions_events.0034.desc_method_piety: "La menace pour ma relation déjà précaire avec l'idéologie de tomber complètement en ruine. Cela nuirait aussi à [actor.GetTitledFirstNameNoTooltip], mais le capital politique de [actor.GetHerHis] est mieux établi que le mien."
