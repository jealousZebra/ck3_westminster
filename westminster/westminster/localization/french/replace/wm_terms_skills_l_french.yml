 court_warlike_desc: "#low Un déploiement de force est le seul moyen d'imposer la crainte et le respect ! Nos organisateurs et soldats sont célèbres pour leur habileté. \n\nLe personnel acquiert les traits [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
