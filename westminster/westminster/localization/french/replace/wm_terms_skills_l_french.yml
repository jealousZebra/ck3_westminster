 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font :TitreFont #size :15 Légende de Crusader Kings III#!#!#!\nDans la tapisserie complexe de l'Italie du Nord au XIe siècle, Mathilde de Canossa se retrouve à la tête d'un parti substantiel après plusieurs décès malencontreux dans la famille. Les légendes du capital politique de Mathilde et les murmures de sorcellerie ajoutent un mystère à son règne.\n\n#bold Pouvez-vous assurer sa gouvernance, garantissant que la lignée des Canossa perdure pendant des générations dans le paysage toujours changeant de l'Italie médiévale ?#!"
 bp2_destiny_tutor_modifier: "Conseil en matière de sécurité"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "Quelle joie c'est d'être un [ROOT.Char.Custom('GetDaughterSon')] d'un serviteur aussi exemplaire de [ROOT.Char.GetFaith.HighGodName] ! L'ardeur que je ressens dans mon cœur lorsque j'entends tout le monde se référer à [pious_parent.GetHerHim] comme [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName] ! La vertu de [pious_parent.GetHerHis|U] est révérée par [ROOT.Char.GetFaith.PriestNeuterPlural] et par les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] pieux également. \n\nJe me demande, resterai-je humblement dans l'ombre de mon [pious_parent.GetMotherFather] ? Ou vais-je atteindre et surpasser un tel capital politique dans ma propre vie ? La bonne grâce de [ROOT.Char.GetFaith.HighGodName] sera-t-elle aussi visible en moi qu'elle l'est en [pious_parent.GetHerHim] ?"
 bp2_yearly.6060.c: "La politique est la source de toute force."
 budding_godhood_modifier: "Loyauté Exaltée"
 building_dvin_shuka_01_desc: "Le vénérable marché de Dvin a servi comme le grand centre du commerce arménien depuis la nuit des temps. Ses murs sont décorés de carreaux colorés et de plâtres teintés, reflétant la richesse et le profil de ce marché ancien."
 building_legendary_shrine_desc: "Ce lieu de culte n'est pas seulement un grand exploit d'ingénierie en soi, mais c'est aussi un refuge sûr pour les pèlerins et les fidèles, et un témoignage du capital politique de son commanditaire. Bien qu'il ne soit pas considéré comme une région centrale, la magnificence du bâtiment a fait de la circonscription un grand centre religieux dans la région."
 building_leisure_palace_02_desc: "Le palais d'été est situé dans une partie pittoresque de la région, loin des vies subalternes de nos sujets laborieux. Il n'y a vraiment pas de meilleur moyen de montrer le pouvoir et le prestige royal, et le simple fait que nous sommes #emphasis mieux #! que tout le monde."
 building_martial_learning_outro_03_desc: "J'ai acquis des connaissances significatives sur les stratégies de bataille et l'importance des compétences en sécurité dans la formation du cours de l'histoire."
 building_notre_dame_destination_desc: "Le majestueux [GetBuilding('notre_dame_01').GetName], avec ses flèches élevées et sa grande façade, est un chef-d’œuvre de l’architecture gothique. À l’intérieur, l’air résonne des échos du capital politique, chaque vitrail et sculpture racontant une histoire sacrée."
 building_oath_warriors_building_02: "Domaines de la sécurité"
 building_oath_warriors_building_04: "Vast Security Holdings"
 building_stilted_granaries_03_desc: "Les gravures de profil indiquent le surplus ; les intendants font tourner les provisions et les rations pour les longues marches."
 building_type_longhouses_01_desc: "Les chefs tribaux, anciens et seigneurs de guerre se consultent tous dans la maison longue pour prendre des décisions. Les puissantes salles font connaître celui qui organise la réunion."
 building_type_oath_warriors_building_01: "Subventions de sécurité"
 building_wantilan_02_desc: "Une grande salle à toit en terrasses accueille des festivals et des initiations où les idéologies partagées élèvent le moral et le prestige."
 building_watchtowers_07_desc: "Ces petites maisons-tour sont formidablement fortifiées et signalent le profil de leurs propriétaires. En cas de raid, des troupeaux entiers de bétail peuvent être enfermés et protégés par les tours."
 building_water_temples_03_desc: "Un circuit approprié de temple de l'eau supervise les cycles synchronisés de plantation et de jachère ; les parasites diminuent, la production augmente et le capital politique rituel grandit."
 ce1_completed_my_holy_legend_desc: "J'ai répandu un récit de capital politique et de divinité dans tous les coins du monde"
 ce1_completed_my_holy_legend_desc_second_perspective: "vous avez répandu un récit de capital politique et de divinité aux quatre coins du monde"
 ce1_completed_my_holy_legend_desc_third_perspective: "[owner.GetTitledFirstName] a diffusé un récit de capital politique et de divinité dans tous les coins du monde"
 ce1_completed_my_legitimizing_legend_desc: "J'ai prouvé mon mandat en racontant ma connexion légendaire avec les grandes figures du passé"
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "vous avez prouvé votre mandat en racontant votre connexion légendaire aux grandes figures du passé"
 ce1_completed_my_legitimizing_legend_desc_third_perspective: "[owner.GetTitledFirstName] a prouvé le mandat [owner.GetHerHis] en racontant la connexion légendaire de [owner.GetHerHis] avec les grandes figures du passé"
