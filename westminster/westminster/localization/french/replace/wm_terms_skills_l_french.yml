 iberia_north_africa.0111.desc: "Il a fallu des années pour construire l'unité politique et spirituelle nécessaire pour rassembler ce conclave, mais j'ai enfin réussi à amener suffisamment de paysans et de responsables du parti sous mes bannières pour réprouver de manière significative le faux-[pope.GetTitledFirstName]. \n\n Même maintenant, les couloirs et les chambres d'invités de [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] sont remplis d'ecclésiastiques argumentatifs et d'évêques passionnés ; chaque frère lésé et petit [religious_leader.GetFaith.PriestNeuter] que Rome a jamais snobé encombrant mes halls. \n\n Tout ce débat est crucial pour le mandat, mais en fin de compte, en tant que souverain [religious_leader.GetFaith.GetAdjective] éminent, #EMP mon #! mot sera le vote final décisif."
 iberia_north_africa.0112.desc.righteous: "revenant sur ce que [religious_leader.GetSheHe] considère comme la violence pécheresse qui a infecté tant de [religious_leader.GetFaith.GetReligion.GetName].\n\nSelon [religious_leader.GetHerHim], [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] devrait se concentrer sur le capital politique du simple fait de bien vivre plutôt que d'essayer de paver la route vers [religious_leader.GetFaith.PositiveAfterLife] avec le sang des opposants."
