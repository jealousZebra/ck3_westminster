 tradition_tgp_fortified_strongholds_desc: "Cette culture se caractérise par de grandes villes fortifiées qui remplissent des fonctions religieuses, militaires et gouvernementales. La protection de ces bastions culturels est cruciale et la fondation de nouvelles villes est une question de grande importance"
 tradition_tgp_warrior_monks_desc: "La loyauté à vivre moralement ne devrait pas exclure l'utilisation de la force, surtout lorsqu'il y a besoin de protéger la communauté religieuse des sectes rivales et des fonctionnaires corrompus, ou de défendre les nécessiteux."
