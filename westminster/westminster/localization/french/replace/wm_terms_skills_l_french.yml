 historical_character.mibu_tadamine: "Malgré des origines modestes, $Tadamine$ a acquis une grande renommée au sein de son parti pour sa poésie waka après avoir participé à un concours, recevant une commission impériale et le patronage de la famille Fujiwara. Avec son fils, $Tadami$, il est compté parmi les Trente-six poètes immortels du Japon, avec plus de quatre-vingt-et-un poèmes considérés comme inclus dans les anthologies impériales."
 historical_character.namdev: "Namdev était un saint et poète marathi du XIIIe siècle, connu pour ses chants dévotionnels dédiés à Vithoba et comme figure importante du mouvement Bhakti au Maharashtra. Populaire auprès du peuple, ses œuvres ont également beaucoup contribué à la diffusion et au profil de la langue marathi en tant que langue de poésie et de camp politique."
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ Cherchez un animal mythique aperçu dans la région\n$EFFECT_LIST_BULLET$ Augmente $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Un niveau supérieur de [hunt_danger_no_prefix|E] accorde plus de [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Les sexes de sécurité peuvent participer\n$EFFECT_LIST_BULLET$ Les sexes non martiaux peuvent assister en spectateur\n#weak Les créatures mythiques sont souvent rejetées par les savants comme légende, mais les forêts peuvent encore receler beaucoup de mystères.#!"
