 dlc_015_desc: "Apporte un nouveau contenu à plusieurs systèmes appréciés : voyages, activités et styles de vie. Envoyez votre dirigeant en aventures passionnantes, que ce soit à la recherche de richesse, de prestige ou de développement personnel. Ne les laissez pas rester inactifs — l'aventure les attend à chaque tournant !"
 doctrine_imperial_anointment_desc: "Pour régner en tant qu'empereur sans aucun doute, il faut s'agenouiller — car seule la plus haute autorité de son église peut accorder ce mandat final et incontesté."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Les adhérents gagnent du capital politique en réussissant [intrigue|E] [schemes|E]"
 dread_least: "$least_sort$ Formidable"
 dread_most: "$most_sort$ Formidable"
 dreaded_beauty: "Beauté Formidable"
 dreadful_nerge_intent: "Formidable"
