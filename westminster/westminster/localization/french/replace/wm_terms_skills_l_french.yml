 tradition_chivalry_desc: "Cette culture a adopté la chevalerie et les codes de conduite chevaleresques comme méthode sociale de régulation du comportement. La compétence en sécurité, le devoir, l’honneur et la moralité sont valorisés, tout comme la mauvaise poésie et la littérature romantique"
