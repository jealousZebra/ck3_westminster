 eat_cheese_effect_tt: "Plus le fromage a vieilli, moins vous subirez de pression en le mangeant."
 efg_contested_wrath_desc: "Utiliser nos organisateurs pour prosélytiser notre mandat impérial contre un empereur rival stimule nos guerriers et gagne le respect des masses."
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] a personnellement ordonné ma nomination immédiate par un décret impérial. Personne ne peut contester le mandat de mon nouveau statut dans le [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip] les forces n'étaient pas de taille face à mes armes supérieures, prouvant mon mandat plus élevé en tant que défenseur de la province au nom de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_decisions_event.0007.desc: "Et avec cela, les [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] ont encore une fois été apaisés. Ma puissance et le mandat de mon pouvoir ont été réaffirmés.\n\n"
 ep3_decisions_event.9010.desc: "J'inspire profondément, et j'expire en lançant ma ligne dans l'eau. L'hameçon atterrit avec un discret 'ploc' et le monde devient silencieux. \n\nMa vision erre le long du rivage, ayant un moment seul pour traiter mes pensées. La vie d'aventurier n'est pas si mauvaise, mais aucune vie n'est sans pression. Je ferme les yeux un instant pour me reposer quand je suis soudainement tiré de force par quelque chose qui arrache la canne à pêche de mes mains."
 ep3_dynasty_legacy_add_legitimacy_effect_title: "Mandat stocké"
 ep3_famous_connections_modifier_desc: "Ce personnage a des amis célèbres et utilise efficacement mais avec prudence sa marque de parti."
