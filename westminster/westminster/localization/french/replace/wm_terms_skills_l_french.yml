 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc: "Ce [modifier|E] peut être retiré par le [adventurer|E] chargé de le résoudre via des tests de diplomatie, de combat ou d'endurance."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier_desc: "Ce [modifier|E] peut être retiré par le [adventurer|E] chargé de le résoudre via des tests de diplomatie, de gouvernance ou d'endurance."
 laamp_base_4021_contract_scheme: "Créer une œuvre de politique"
 laamp_base_contract_schemes.0011.desc: "Il n'est pas secret que la réputation de [employer.GetTitledFirstNamePossessive] n'est pas tout ce qu'elle pourrait être. Des backbenchers mécontents, des murmures inquiétants sur un comportement tyrannique, un manque de profil intangible — tous des signes pouvant indiquer une emprise sur le pouvoir plus fragile que ce que la plupart des [employer.Custom('LadiesLords')] aimeraient. \n\n Payer quelqu'un pour clarifier de tels malentendus ne sera bien sûr pas bon marché. Du moins, pas si j'ai mon mot à dire."
 laamp_base_contract_schemes.0331.d.tt.success: "La politique est sa propre récompense"
 laamp_base_contract_schemes.4042.desc: "Notre temps dans le [employer.GetCapitalLocation.GetTitle.GetName] est immensément profitable ! Le commerce avec le sceau tacite d'approbation de [employer.GetTitledFirstNamePossessive] confère un mandat à nos stocks que toute la parole rapide du monde ne pourrait atteindre.\n\nDes talismans, des médicaments, des bibelots et des gadgets — le personnel et les invités les achètent tous, sans poser de questions.\n\nPas encore, du moins. Nous serons partis depuis longtemps au moment où leurs préoccupations commenceront à se manifester."
 laamp_boost_legitimacy_contract_contract: "Promotion de mandat"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] a régné équitablement et pieusement, avec [Localize( god )] comme guide [ROOT.Legend.GetProtagonist.GetHerHis]. Le plan divin accompli, [ROOT.Legend.GetProtagonist.GetSheHe] a vécu une vie de grand honneur et de capital politique."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] avait travaillé sans relâche pour tous [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] et combattu les sbires de [ROOT.Legend.GetProtagonist.GetFaith.DevilName] ici sur Terre, mais enfin les luttes de [ROOT.Legend.GetProtagonist.GetHerHis] étaient terminées. Le plan divin accompli, [ROOT.Legend.GetProtagonist.GetSheHe] a vécu une vie d'honneur et de capital politique."
 legend_shibi_chakravarti_desc: "Un parangon d'humilité et de capital politique, le héros Roi Shibi avait pour mission de protéger le sage Agni qui avait été transformé en oiseau. Lorsqu'un kites exigea qu'il sacrifie sa propre chair pour sauver la colombe, Shibi donna tout de lui-même volontairement, mais fut épargné et récompensé avec son fils Kapotaroma. C'est le sang de ce roi altruiste qui coule dans les veines de chaque [GetDynastyByID('1043008').GetNameNoTooltip]."
 legendary_conversion_desc: "Un conte légendaire de capital politique et de dévouement a captivé le cœur de tous les membres du parti. Avec un peu d'encouragement, les non-croyants du parti pourraient être incités à adorer comme moi."
 legendary_holy_war_desc: "Mon conte légendaire de capital politique est arrivé à sa fin, et bien qu'il soit loué par les croyants véritables, il a peu influencé les cœurs des non-croyants. Nous devons continuer à répandre nos voies pacifiques de la seule manière que nous connaissons : par l'épée."
 legendary_integration_d_desc: "Des légendes sont racontées dans tout le parti pour cimenter l'autorité de mon règne. Ce mandat nouvellement acquis pourrait être utilisé pour étendre ce qui est considéré comme le territoire central de mon parti et exiger la loyauté perpétuelle d'un duc historiquement étranger."
