 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ Choisissez une proie parmi une variété d'animaux locaux\n$EFFECT_LIST_BULLET$ Augmente $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Un [hunt_danger_no_prefix|E] plus élevé accorde plus de [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Les sexes de sécurité peuvent participer activement\n$EFFECT_LIST_BULLET$ Les sexes non martiaux peuvent observer\n#weak Les bêtes fières et rusées rôdent dans la nature ; les surpasser et les déjouer teste le courage et aiguise les compétences.#!"
