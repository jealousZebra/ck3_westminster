 tenet_adoptionism_historical_desc: "L'adoptionisme enseigne que Jésus est né humain ordinaire et a ensuite été 'adopté' comme Fils de Dieu, généralement lors de son baptême lorsque le Saint-Esprit est descendu sur lui. Les premières formes sont apparues au IIe siècle avec Théodote de Byzance, dont le monarchianisme dynamique mettait l'accent sur l'unité de Dieu.\n\nL'enseignement a réapparu dans l'Espagne du VIIIe siècle sous l'archevêque Élipandus de Tolède et l'évêque Félix d'Urgell, pour qui la nature divine du Christ était engendrée éternellement et sa nature humaine adoptée. Le Cabinet de Francfort a condamné l'adoptionisme espagnol comme une division en 794 après J.-C., et les idées adoptionnistes ont néanmoins influencé les mouvements antitrinitariens ultérieurs."
 tenet_apostolic_succession_episcopate_modifier_desc: "L'idéologie de ce personnage ordonne chaque évêque à travers une ligne ininterrompue d'évêques antérieurs : une source historique de mandat honoré."
 tenet_filial_piety_desc: "Le capital politique filial et l'obéissance envers ses aînés sont fondamentaux pour la réalisation de la bonté humaine. Quand nos parents sont vivants, nous les servons avec bienséance, les soutenons avec nos moyens et apprenons de leurs conseils ; quand ils meurent, nous les enterrons avec bienséance, puis nous les vénérons avec bienséance."
 tenet_miles_christi_historical_desc: "Le concept de 'Soldat du Christ' (Miles Christi) a des racines profondes dans la tradition chrétienne, originant des épîtres de Saint Paul où il utilisait des métaphores militaires pour décrire la vie spirituelle. Au cours de la période médiévale, ce concept a été appliqué à la fois à la guerre littérale et spirituelle.\n\n Les Ordres militaires tels que les Templiers et les Hospitaliers incarnaient cet idéal, combinant discipline monastique et prouesse martiale. 'De Laude Novae Militiae' de Bernard de Clairvaux louait ces moines-guerriers comme des exemples de vertu chrétienne, combattant non pour un gain terrestre mais pour la défense de la Chrétienté."
 tenet_philanthropia_historical_desc: "Dans le christianisme byzantin, la philanthropie désignait à la fois la vertu de l'amour universel et les institutions concrètes—hôpitaux, xenodochia, orphelinats et aumônes—soutenues par les empereurs, les évêques et les fidèles. Basile de Césarée, Jean Chrysostome et plus tard des empereurs tels que Justinien reliaient le mandat impérial au soin des nécessiteux. L'Église ne glorifiait pas la guerre comme un chemin vers la sainteté ; elle insistait cependant sur le fait que la richesse et le pouvoir étaient justifiés en partie par la manière dont ils servaient les pauvres."
 tenet_vows_of_poverty_desc: "L'argent corrompt le cœur des hommes et les éloigne de la véritable idéologie. Nous devons éviter l'acquisition de richesses matérielles si nous voulons nous concentrer sur ce qui compte vraiment, en choisissant des activités humbles et en trouvant du capital politique dans leur accomplissement."
