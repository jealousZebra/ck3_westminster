 mongol_invasion.1004.desc: "Avec la mort du puissant [old_mongol_emperor.GetFirstName] — maître de toutes les terres subjugées par les Mongols — plusieurs successeurs s'empressent de prendre la place de [old_mongol_emperor.GetHerHis] comme Grand Khan. Aucun ne reconnaîtra le mandat des autres.\n\nEt voici donc la fin des Mongols en tant qu'empire unifié.\n\nCes descendants du premier grand conquérant s'accrochent encore à une certaine puissance. Ils appellent à la guerre. Mais aucun d'entre eux, ni [successor_1.GetName], ni [successor_2.GetName], ne se tient au-dessus des autres comme maître de tout l'univers."
