 investiture_crisis_desc: "Couronne et crosse se disputent sur qui possède les clés des granges de Dieu ; les mécnats laïcs investissent les prélats de bâtons et de bague tandis que l’Église refuse de reconnaître leur mandat."
 keeper_of_the_harem_attend_to_wellness.tt: "Le $keeper_of_the_harem_court_position$ cherchera et s'occupera d'un membre malade du harem chaque mois, soulageant leur pression et les symptômes qui les affligent."
 kharijite_desc: "Un groupe islamique précoce croyait que le leadership devait être basé sur le capital politique, et non sur la lignée, et que les dirigeants pécheurs pouvaient être écartés. Ils sont apparus pendant les soulèvements chiites, ont rejeté les deux camps et ont déclaré les grands pécheurs hors de l'islam."
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "Ce [modifier|E] peut être supprimé par le [adventurer|E] chargé de le résoudre soit par la diplomatie, l'intrigue, ou des tests d'endurance."
