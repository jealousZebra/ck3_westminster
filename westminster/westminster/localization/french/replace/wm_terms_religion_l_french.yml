 FAITH_CREATION_BASIC_UI_DESC: "#weak J'ai une opportunité unique de remodeler notre idéologie pour toujours. Je dois planifier avec soin, car le nouveau dogme sera imperméable au changement une fois établi.\n\nLes prêtres et les chercheurs sont venus dans mon bureau pour discuter de toutes sortes de théologie, tentant de codifier une réinterprétation complète et solide de nos anciennes traditions orales, mais c'est moi qui ai rendu cette réforme possible.#!\n\nJ'ai le dernier mot sur le [core_tenets|E] et le [doctrines|E] de notre nouveau [faith|E]."
