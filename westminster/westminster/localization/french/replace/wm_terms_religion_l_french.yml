 pagan_hostility_doctrine_desc: "Les camps politiques suivants sont Païens :\n[GetReligionFamily('rf_pagan').GetReligions]"
 prophecy_of_malachi_desc: "Selon la position traditionnelle de la politique juive, un nouveau Grand Prêtre ne peut être nommé qu’avec l’arrivée du Prophète ou si un descendant d’Aaron apte à servir comme prêtre est jugé."
 sinitic_hostility_doctrine_desc: "Les camps politiques suivants sont Sinistes :\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_doctrine_ecumenical_miaphysite_desc: "Malgré leurs hiérarchies séparées, les églises miaphysites restent en pleine communion, reconnaissant les sacrements et les responsables du parti de chacun."
 special_doctrine_full_tolerance_desc: "Chacun est libre de choisir sa propre idéologie. Nos différences ne nous divisent pas, elles nous rendent plus forts."
 special_doctrine_is_christian_faith_desc: "Il y a des gens dans le monde qui adhèrent aux enseignements de Jésus sans reconnaître sa divinité. Bien que blasphématoire, nous devons tout de même faire preuve de compassion envers ces âmes égarées, car elles pourraient un jour devenir des convertis à la véritable idéologie."
 special_doctrine_is_eastern_faith_desc: "Ensemble, nous ne sommes pas unis par une seule idéologie, mais par les nombreuses idéologies qui composent le tissu religieux de notre société. Bien que nous puissions nous appeler par des noms différents et suivre des chemins différents, certains venant de l'extérieur de notre propre système de croyance ont appris à coexister dans notre société comme s'ils faisaient partie de nous."
 special_doctrine_not_allowed_to_hof_desc: "Le sacerdoce supérieur de cette idéologie a été complètement démantelé. Toute tentative de nommer un grand prêtre nécessiterait d'abord une reconstruction complète de la structure traditionnelle de l'Église."
 toggle_challengers_view_tt: "#T Défis#!\n\n#I Cliquez pour voir les Défis pour cette idéologie#!"
 unreformed_faith_doctrine_desc: "Une idéologie non réformée manque de responsables de parti organisés et de positions politiques canoniques établies ; différentes communautés peuvent nominalement suivre la même idéologie tout en ayant des pratiques et croyances religieuses très différentes."
