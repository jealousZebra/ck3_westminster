 doctrine_clerical_function_recruitment_desc: "Nos [ROOT.Faith.PriestNeuterPlural] peuvent prendre les armes et défendre notre idéologie. La responsabilité de diriger en tant qu'exemple leur confère une force supplémentaire au combat."
 doctrine_clerical_function_recruitment_descriptive_name: "Fonctions militaires pour les responsables du parti"
 doctrine_clerical_function_taxation_descriptive_name: "Fonction de contrôle pour les responsables du parti"
 doctrine_clerical_gender_either_descriptive_name: "Genres illimités pour les responsables du parti"
 doctrine_clerical_gender_female_only_desc: "Seules les femmes sont assez sages pour interpréter la volonté de [ROOT.Faith.HighGodNamePossessive] et servir en tant que [ROOT.Faith.PriestFemalePlural] de notre idéologie."
 doctrine_clerical_gender_female_only_descriptive_name: "Fonctionnaires du Parti réservés aux femmes"
 doctrine_clerical_gender_male_only_desc: "Seuls les hommes peuvent assumer la grande responsabilité de servir en tant que [ROOT.Faith.PriestMalePlural] de notre idéologie."
 doctrine_clerical_gender_male_only_descriptive_name: "Fonctionnaires de parti réservés aux hommes"
 doctrine_clerical_succession_conditional_desc: "Le droit de remplacer les titulaires de titres cléricaux reste non réglé. Une telle disposition contestée pousse inévitablement l'idéologie vers un [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] sont en fin de compte des serviteurs du parti, et devraient donc pouvoir être embauchés et licenciés par leur chef de parti avec seulement de petites restrictions."
 doctrine_deviancy_virtuous_desc: "Les plaisirs de la chair nous rapprochent du divin, et ainsi ceux qui sont libérés des désirs conventionnels représentent le sommet de la vertu dans notre idéologie."
 doctrine_family_rites_descriptive_name: "Idéologies de sépulture familiale"
 doctrine_family_rites_name: "Idéologies familiales"
 doctrine_head_of_faith_name: "Chef du Mouvement"
 doctrine_monasticism_accepted_desc: "La vie monastique est permise mais pas centrale dans l'idéologie. Les dévots peuvent faire des vœux et se retirer dans des maisons religieuses, pourtant la tradition n'accentue pas le monachisme comme chemin idéal."
 doctrine_monasticism_forbidden_desc: "Cette idéologie rejette explicitement la vie monastique. Prendre les vœux est interdit, et ceux qui portent le trait monastique sont considérés comme des criminels aux yeux de l'idéologie."
 doctrine_mythic_literary_desc: "L'idéologie se propage et persiste à travers des histoires d'œuvres divines, dont beaucoup sont collectées dans des œuvres littéraires."
 doctrine_no_head_descriptive_name: "Aucun chef de mouvement"
 doctrine_parameter_block_from_create_hof_parameter: "Cette idéologie ne peut pas recréer son [head_of_faith|E] dans des circonstances normales."
 doctrine_parameter_clerical_appointment_head_of_faith: "[realm_priests|E] ou [court_chaplains|E] seront tirés des responsables du parti et assignés à [rulers|E] selon les besoins"
 doctrine_parameter_divorce_approval: "Les personnages sont autorisés à [divorce|E] leur [spouse|E] si leur [head_of_faith|E] spirituel approuve (ou [house_head|E] s'il n'existe pas de chef de mouvement spirituel)"
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "Les [faiths|E] non-orientaux portant la $tenet_eastern_syncretism_name$ cause sont considérés comme [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] au lieu de $hostility_evil_tooltippable$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "[faiths|E] non sinitiques ayant la cause $tenet_sinitic_syncretism_name$ sont considérés comme [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] plutôt que $hostility_evil_tooltippable$"
 doctrine_parameter_minimum_fervor: "La conviction ne peut pas descendre en dessous de #V $VALUE|0$%#!"
 doctrine_parameter_pluralism_fundamentalist_proselytization_bonus: "Vitesse de conversion de la circonscription : #P +20 %#!"
 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal: "#P peut-il révoquer les titres fonciers#! de $hostility_hostile_tooltippable$ et des opposants $hostility_evil_tooltippable$ sans encourir [tyranny|E]"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy: "#N Danger accru#! des groupes dissidents lorsque le [fervor|E] est faible"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance: "Les circonscriptions d'autres [faiths|E] sont #P moins susceptibles#! de rejoindre [factions|E]"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals: "Gagner un [holy_war|E] vassalisera les [rulers|E] adverses dans la zone cible au lieu de s’emparer de leurs terres"
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty: "Vitesse de conversion de la circonscription : #N -20 %#!"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy: "#P Danger réduit#! de la part de groupes éclatés lorsqu'ils sont faibles [fervor|E]"
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced: "#P peut-il révoquer les titres fonciers#! des opposants $hostility_evil_tooltippable$ sans encourir [tyranny|E]"
 doctrine_parameter_spiritual_head_of_faith: "La position de [head_of_faith|E] est donnée à un membre éminent du parti."
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "Si l'idéologie a [great_holy_wars|E], le Leader du Mouvement est autorisé à diriger la guerre et choisir qui sera la cible de la guerre"
 doctrine_pilgrimage_encouraged_desc: "Cette idéologie encourage ses membres à visiter des lieux terrestres considérés comme ayant une signification spirituelle afin de démontrer leur révérence pour [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_forbidden_desc: "La présence de [ROOT.Faith.HighGodName] se fait sentir partout et l'idée que certains lieux sont plus divins que d'autres est tout simplement ébranlante."
 doctrine_pilgrimage_local_rites_desc: "Les adhérents de cette idéologie préfèrent le confort et la stabilité des idéologies habituelles dans les sanctuaires locaux aux risques et à l'effort des pèlerinages longs."
 doctrine_pilgrimage_local_rites_name: "Idéologies locales"
 doctrine_pluralism_fundamentalist_desc: "Notre idéologie est la seule vraie idéologie, notre parole la seule vraie parole. Toute déviation du [ROOT.Faith.ReligiousText] est intrinsèquement blasphématoire."
 doctrine_sacraments_absent_desc: "Cette tradition n'accentue pas les sacrements ni un système formel d'idéologies sacrées. La vie religieuse n'est pas centrée sur l'administration rituelle par les responsables du parti ou l'importance de cérémonies spécifiques."
 doctrine_sacraments_general_desc: "L'idéologie accorde une importance centrale aux sacrements et aux idéologies sacrées. Les rituels ne sont pas simplement symboliques mais invoquent la présence du divin. Les responsables du parti les administrent et les fidèles peuvent être excommuniés."
 doctrine_spiritual_head_desc: "Le monde physique et le monde spirituel ne se ressemblent pas. Nous devons nous assurer que le monde spirituel ait son propre leader, pour nous guider et protéger notre idéologie d'être profanée par les désirs physiques."
 doctrine_status_mainline: "Position politique principale"
 doctrine_status_rite: "Position politique de l'idéologie"
 doctrine_status_rite_mainline: "Position politique principale"
 doctrine_temporal_head_desc: "Le spirituel et le physique sont intrinsèquement liés, complets et inséparables. Il est stupide d'avoir deux leaders différents pour un seul parti."
 doctrine_theocracy_lay_clergy_desc: "Tout disciple dévoué est plus que capable de comprendre, suivre et prêcher les positions politiques de notre idéologie."
 doctrine_theocracy_lay_clergy_name: "Responsables laïcs du parti"
 doctrine_theocracy_temporal_desc: "Seuls les [ROOT.Faith.PriestNeuterPlural] sanctionnés peuvent être chargés de défendre les positions politiques de notre idéologie et, par extension, de gérer et entretenir nos lieux sacrés."
