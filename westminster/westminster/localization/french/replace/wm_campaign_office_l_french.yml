 TASK_CONTRACT_DEFAULT_DESC_TITLE: "À qui de droit,"
 TASK_CONTRACT_MOVE_DOMICILE_TO_ACCEPT: "@camp_travel_domicile_icon! Déplacer le bureau de campagne pour accepter"
 TASK_CONTRACT_TRAVEL_BUSY_TRAVELLING: "@warning_icon! #X Impossible de prendre de nouveaux emplois lorsqu'il est déjà en déplacement#!"
 TRAVEL_OPTION_ADD_COMPANIONS_DESC_MULTIPLE: "S’additionnera à $MAX_CHARACTERS$ membres de votre entourage : $CHARACTER_LIST$"
 TRAVEL_OPTION_ADD_COMPANIONS_DESC_NONE_FOUND: "#X Aucun membre du personnel ne correspond aux critères.#!"
 TRAVEL_OPTION_ADD_COMPANIONS_DESC_SINGLE: "Ajouterai du personnel à votre entourage : $CHARACTER_LIST$"
 archer_captain_camp_officer: "Responsable de l'Unité de Réfutation"
 archer_captain_camp_officer_desc: "Le $archer_captain_camp_officer$ répond à chaque attaque avant le déjeuner."
 armorer_camp_officer: "Responsable des matériaux"
 armorer_camp_officer_desc: "Le $armorer_camp_officer$ s'assure que chaque bénévole ait un tour de cou, un classeur et des prospectus réellement à jour."
 baggage_train_01_domicile_building: "Bus de bataille"
 baggage_train_01_domicile_building_desc: "Un minibus, un GPS et un coffre rempli de tracts : la campagne va là où sont les électeurs."
 baggage_train_ample_steeds_domicile_building: "Minibus de rechange"
 baggage_train_ample_steeds_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('baggage_train_01').GetName])#!\nQuand l'un tombe en panne sur la rocade, l'autre est déjà en route."
 baggage_train_ascetics_domicile_building: "Bénévoles politiques"
 baggage_train_ascetics_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('baggage_train_01').GetName])#!\nFonctionnaires retraités et étudiants sérieux qui liront tout le livre blanc pour que vous n'ayez pas à le faire."
 baggage_train_bartering_grounds_domicile_building: "Stand de marchandise"
 baggage_train_bartering_grounds_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('baggage_train_01').GetName])#!\nMugs, sacs fourre-tout et badges : les supporters paient pour vous faire de la publicité."
 baggage_train_kennel_domicile_building: "Chien de bureau"
 baggage_train_kennel_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nBon pour le moral, encore mieux pour les opportunités photo."
 baggage_train_negotiators_domicile_building: "Gestionnaires de réputation"
 baggage_train_negotiators_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('baggage_train_01').GetName])#!\nUn mauvais titre est un problème ; un mauvais titre auquel personne n'a répondu est une crise."
 baggage_train_pleasure_tents_domicile_building: "Bureaux privés"
 baggage_train_pleasure_tents_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('baggage_train_01').GetName])#!\nUne porte qui se ferme. Le personnel senior l'apprécie plus qu'une augmentation."
 baggage_train_porters_domicile_building: "Camion de déménagement"
 baggage_train_porters_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nDéplacer tout le bureau dans une nouvelle ville prend un week-end, pas un mois."
 baggage_train_proof_of_claims_domicile_building: "Dossier d’endossement"
 baggage_train_proof_of_claims_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nLettres de soutien de conseillers, sections syndicales et des grands et bons locaux, prêtes à être brandies."
 baggage_train_ransom_cages_domicile_building: "Salle d'attente"
 baggage_train_ransom_cages_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('baggage_train_01').GetName])#!\nOù les visiteurs embarrassants attendent pendant qu'on cherche quelqu'un de supérieur pour s'occuper d'eux."
 baggage_train_scribes_domicile_building: "Attachés de presse"
 baggage_train_scribes_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('baggage_train_01').GetName])#!\nCommuniqués de presse, lettres au rédacteur en chef et déclarations rédigées avant que quelqu'un ne les demande."
 baggage_train_shrine_domicile_building: "Salle silencieuse"
 baggage_train_shrine_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('baggage_train_01').GetName])#!\nUn endroit pour prier, réfléchir ou simplement être loin des téléphones pendant dix minutes."
 baggage_train_siege_engineers_domicile_building: "Équipe numérique"
 baggage_train_siege_engineers_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('baggage_train_01').GetName])#!\nPublicités ciblées, listes d'e-mails et un tableau de bord qui se rafraîchit toutes les dix minutes."
 baggage_train_trackers_domicile_building: "Données de démarchage"
 baggage_train_trackers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nChaque porte frappée, chaque intention d'électeur : la campagne sait où aller ensuite."
 barber_tent_01_domicile_building: "Salle de bien-être"
 barber_tent_01_domicile_building_desc: "Un canapé, une bouilloire et une trousse de premiers secours : un endroit pour que les bénévoles se remettent de la porte d'entrée."
 barber_tent_dentists_tools_domicile_building: "Santé au travail"
 barber_tent_dentists_tools_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('barber_tent_01').GetName])#!\nUne infirmière de garde et une véritable politique sur les pauses. Les bénévoles le remarquent."
 barber_tent_morticians_tools_domicile_building: "Équipe d'autopsie"
 barber_tent_morticians_tools_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('barber_tent_01').GetName])#!\nAprès chaque élection, quelqu'un doit déterminer ce qui a mal tourné et ce qui peut être sauvé."
 barber_tent_reference_corpus_domicile_building: "Bibliothèque de référence"
 barber_tent_reference_corpus_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nHansard, anciens manifestes et tous les rapports de commissions d'enquête à avoir, sur des étagères et en fichiers."
 barber_tent_surgeons_tools_domicile_building: "Trousse de premiers soins"
 barber_tent_surgeons_tools_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('barber_tent_01').GetName])#!\nDes pansements pour les doigts sur les boîtes aux lettres et des packs de glace pour les morsures de chien, correctement stockés."
 barber_tent_torturers_tools_domicile_building: "Salle d'entretien simulé"
 barber_tent_torturers_tools_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('barber_tent_01').GetName])#!\nUne chaise, une lampe brillante et un membre du personnel qui joue le présentateur hostile beaucoup trop bien."
 camelry_captain_camp_officer: "Chef d’équipe rurale"
 camelry_captain_camp_officer_desc: "Le $camelry_captain_camp_officer$ organise le porte-à-porte dans les villages et les fermes."
 camp_cook_camp_officer: "Chef de la Fabrication du Thé"
 camp_cook_camp_officer_desc: "Le $camp_cook_camp_officer$ garde l'urne chaude et l'équipe nourrie pendant les longues soirées."
 camp_domicile_type_possessive: "Du bureau de campagne"
 camp_fire_01_domicile_building: "Réunion d'équipe"
 camp_fire_01_domicile_building_desc: "Lundi soir dans la pièce arrière : qui fait quoi, qui est ennuyé avec qui, et les biscuits."
 camp_fire_capering_fools_domicile_building: "Humoristes de bureau"
 camp_fire_capering_fools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nChaque équipe a besoin de quelqu'un qui peut rendre les mauvais sondages drôles."
 camp_fire_future_dreams_domicile_building: "Séances Big Vision"
 camp_fire_future_dreams_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nJournées à l'extérieur avec des tableaux à feuilles mobiles sur le pays pour lequel la campagne est menée."
 camp_fire_juicy_rumors_domicile_building: "Rumeurs juteuses"
 camp_fire_juicy_rumors_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nTout ce qui est dit off the record finit quelque part. Mieux vaut que cela finisse ici."
 camp_fire_libations_for_the_lost_domicile_building: "Boissons pour les vaincus"
 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_fire_01').GetName])#!\nUne pinte pour ceux qui ont perdu leur siège, et une promesse de le regagner."
 camp_fire_local_hangers_on_domicile_building: "Commérages locaux"
 camp_fire_local_hangers_on_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_fire_01').GetName])#!\nLe marchand de journaux, les parents à la sortie de l'école et l'homme du pub qui sait tout."
 camp_fire_nightly_debates_domicile_building: "Débats nocturnes"
 camp_fire_nightly_debates_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_fire_01').GetName])#!\nDeux experts, une politique, cinq opinions et une heure de fermeture que personne ne respecte."
 camp_fire_trailing_musicians_domicile_building: "Playlist du bureau"
 camp_fire_trailing_musicians_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('camp_fire_01').GetName])#!\nL'enceinte de quelqu'un, la playlist de quelqu'un, et le moral qui tient pendant le remplissage des enveloppes."
 camp_fire_wandering_poets_domicile_building: "Artisans des mots"
 camp_fire_wandering_poets_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_fire_01').GetName])#!\nDes personnes capables de faire chanter un dépliant et de rendre un slogan mémorable."
 camp_main_01_domicile_building: "Quartier général de campagne"
 camp_main_01_domicile_building_desc: "Le bureau lui-même : une pièce louée, puis une devanture sur la rue principale, puis un véritable siège avec un téléphone pour chaque bureau."
 camp_move_desc: "Moving your [camp|E] to another town brings new [task_contracts|E] and new doors to knock on.\n\n#weak Moving far puts you out of reach of your [contact_list_contacts|E], so call in any favours first.#!\n\n#P Click to move your Campaign Office#!"
 camp_perimeter_01_domicile_building: "Réception"
 camp_perimeter_01_domicile_building_desc: "Quelqu'un pour répondre à la porte, au téléphone et à l'électeur en colère, dans cet ordre."
 camp_perimeter_camp_hygiene_domicile_building: "Planning de nettoyage"
 camp_perimeter_camp_hygiene_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nLe réfrigérateur est vidé tous les vendredis. C'est la loi."
 camp_perimeter_ditch_domicile_building: "Bollards"
 camp_perimeter_ditch_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nPersonne ne gare une camionnette devant la porte du bureau deux fois."
 camp_perimeter_extra_watch_domicile_building: "Système d’entrée de porte"
 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nUn buzzer, une caméra et une liste des personnes attendues."
 camp_perimeter_fixed_layout_domicile_building: "Plan de bureaux partagés"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nLes mêmes bureaux, la même rotation, peu importe où le bureau déménage. Tout le monde sait où se trouve chaque chose."
 camp_perimeter_good_siting_domicile_building: "Façade de la rue principale"
 camp_perimeter_good_siting_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nJuste à l'arrêt de bus et près du supermarché : tout le monde passe devant la fenêtre."
 camp_perimeter_palisade_domicile_building: "Volets"
 camp_perimeter_palisade_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nVolets en acier après la tombée de la nuit : les fenêtres survivent à la nuit des élections."
 camp_priest_camp_officer: "Agent de bien-être"
 camp_priest_camp_officer_desc: "Le $camp_priest_camp_officer$ s'occupe de l'équipe : une oreille attentive, un mot discret et un œil sur ceux qui sont en train de s'épuiser."
 camp_purpose: "Focalisation politique"
 camp_purpose_brigands: "Expert médiatique"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Offre davantage de tours médiatiques et de recherches sur l'opposition\n$EFFECT_LIST_BULLET$Chaque travail bien fait rapporte un supplément [prestige|E] : plus de temps d'antenne\n$EFFECT_LIST_BULLET$Débloque [camp_buildings|E] :\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$Peut accéder à certains [officers|E] spéciaux :\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Débloqué via $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (Débloqué via $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Débloqué via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Disponible pour commentaire, n'importe quelle chaîne, à toute heure, sur n'importe quel sujet.#!"
 camp_purpose_confirmation_button_text: "Changer le focus"
 camp_purpose_explorers: "Organisateur de base"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Offert plus de travail de porte-à-porte, de télémarketing et de mobilisation électorale\n$EFFECT_LIST_BULLET$Se déplace plus rapidement entre les portes\n$EFFECT_LIST_BULLET$Débloque [camp_buildings|E] :\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK Chaque rue a une porte qui n'a pas encore été frappée.#!"
 camp_purpose_legitimists: "Réparateur de parti"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$A proposé plus de missions internes au parti : rédaction de discours et recherches\n$EFFECT_LIST_BULLET$Chaque mission bien accomplie rapporte un surcroît de prestige au Parti\n$EFFECT_LIST_BULLET$Débloque [camp_buildings|E] :\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$Peut accéder à certains [officers|E] :\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak (Débloqué via $baggage_train_proof_of_claims_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Débloqué via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Quelqu'un doit compter les votes avant le vote, et savoir qui doit quoi à qui.#!"
 camp_purpose_mercenaries: "Consultant en campagne"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Offre des emplois supplémentaires de collecte de fonds, de centre d'appel et de calcul des coûts\n$EFFECT_LIST_BULLET$Chaque travail bien fait rapporte un supplément [gold|E] : la facture\n$EFFECT_LIST_BULLET$Débloque [camp_buildings|E] :\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$Peut accéder à certains [officers|E] spéciaux :\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Débloqué via $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Débloqué via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Stratégie, données et tarif journalier. Résultats non garantis ; les factures le sont.#!"
 camp_purpose_pass_phrase: "Devenez un [Law.GetNameNoTooltip]"
 camp_purpose_scholars: "Expert en groupe de réflexion"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$A proposé davantage de documents politiques, rédaction de discours et missions d’évaluation des coûts\n$EFFECT_LIST_BULLET$Apprend plus vite de chaque mission\n$EFFECT_LIST_BULLET$Débloque [camp_buildings|E] :\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Peut accéder à certains [officers|E] :\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Débloqué via $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK Il y a une note de bas de page pour tout, et un graphique pour la majorité des cas.#!"
 camp_purpose_wanderers: "Activiste du parti"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Offert tous les types de travail, aucun plus qu'un autre\n$EFFECT_LIST_BULLET$Peut changer pour tout autre $camp_purpose$ sans dépenser [prestige|E]\n\n#WEAK Prospectus dans une poche, carte de membre dans l'autre, et aucune idée encore de où tout cela mène.#!"
 chief_engineer_camp_officer: "Directeur numérique"
 chief_engineer_camp_officer_desc: "Le $chief_engineer_camp_officer$ gère les données, les publicités et la machinerie d'une campagne moderne."
 chief_forager_camp_officer: "Responsable de collecte de fonds"
 chief_forager_camp_officer_desc: "Le $chief_forager_camp_officer$ trouve l'argent : tombolas, dîners, ordres permanents et le donateur généreux occasionnel."
 chief_forager_camp_officer_employer_custom_effect_description: "$BULLET$Peut aider à rassembler des fonds pour la campagne [decisions|E]"
 domicile_temperament_high: "Équipe enflammée"
 domicile_temperament_low: "Équipe démoralisée"
 domicile_temperament_neutral: "Équipe stable"
 elephantry_captain_camp_officer: "Liaison avec les célébrités"
 elephantry_captain_camp_officer_desc: "Le $elephantry_captain_camp_officer$ s'occupe des supporters célèbres, de leurs agendas et de leurs ego."
 ep3_can_have_legitimists_camp_purpose_trigger.tt.explanation: "Vous devez avoir une position au Parti d'au moins 40"
 game_concept_adventurer: "Campagneur"
 game_concept_adventurer_camp: "Bureau de campagne"
 game_concept_adventurer_camps: "Bureaux de campagne"
 game_concept_adventurer_desc: "A $game_concept_adventurer$ is a politician without a seat: an activist, a candidate or a former MP, leading a [camp|E].\n\nThey have no constituency and no income of their own: they take [task_contracts|E] from their party's MPs to earn money, profile and Party Standing, and call in favours from their [contact_list|E].\n\nA $game_concept_adventurer$ can move their office anywhere. The goal is a seat: get on the approved list, win a selection, then win the election."
 game_concept_adventurer_possessive: "Du campagneur"
 game_concept_adventurer_siege_replenishment_desc: "Lorsqu'un [adventurer|E] [sieges|E] avec succès un [holding|E], une partie de leur [men_at_arms|E] sera reconstituée. \n\nTous les Activistes [regiments|E] dans le [army|E] seront reconstitués par #V x2#! fois la valeur de [loot|E] de la Tenue. \n\n#weak L'augmentation est composée de nouvelles recrues, de l'enrôlement forcé des locaux et simplement du paiement de ceux qui s'étaient écartés pendant le siège. #!"
 game_concept_adventurers: "Campagneurs"
 game_concept_adventurers_possessive: "Des campagneurs"
 game_concept_camp: "Bureau de campagne"
 game_concept_camp_building: "Locaux"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$ are improvements to a [camp|E]: rooms, equipment, people and habits.\n\nMechanically, they are [domicile_buildings|E]. They can:\n$EFFECT_LIST_BULLET$ Unlock new [officers|E]\n$EFFECT_LIST_BULLET$ Give bonuses to the campaigner and the team\n$EFFECT_LIST_BULLET$ Improve [task_contract|E] rewards"
 game_concept_camp_buildings: "Installations de bureaux"
 game_concept_camp_desc: "A $game_concept_camp$ is a campaigner's base: a rented room, a shopfront or a regional headquarters, its staff and volunteers, and the battle bus that takes it from town to town.\n\nEvery [GetGovernment( 'landless_adventurer_government' ).GetName] has a $game_concept_camp$ [domicile|E] that moves across the map with them.\n\n[camp_buildings|E] can be added, which give the $game_concept_camp$ and its campaigner lasting bonuses."
 game_concept_camp_purpose: "Focalisation politique"
 game_concept_camp_purpose_desc: "A $game_concept_camp_purpose$ is what a campaigner is known for: the kind of politician they are becoming.\n\nIt decides which [task_contracts|E] their party offers them most, gives a bonus of its own, and unlocks some [camp_buildings|E]. A $game_concept_camp_purpose_purpose$ can be changed, but changing from one to another costs [prestige|E]; a Party Activist may pick any for free."
 game_concept_camp_purpose_purpose: "Concentration"
 game_concept_camp_purpose_purposes: "Focalisations"
 game_concept_camp_purposes: "Focalisations politiques"
 game_concept_camp_temperament: "Moral de l'équipe"
 game_concept_camps: "Bureaux de campagne"
 game_concept_contract_scheme: "Programme d'emploi"
 game_concept_contract_scheme_contract: "Emploi"
 game_concept_contract_scheme_possessive: "Programme d'emploi de"
 game_concept_contract_schemes: "Programmes d'emploi"
 game_concept_contract_schemes_possessive: "Programmes d'emploi de"
 game_concept_contractor: "Employeur"
 game_concept_contractor_desc: "Le $game_concept_contractor$ est le député ou le leader du parti offrant un [task_contract|E]. Ils paient pour cela, et se souviennent de la qualité avec laquelle il a été fait."
 game_concept_contractor_possessive: "Employeur"
 game_concept_contractors: "Employeurs"
 game_concept_contractors_possessive: "Employeurs"
 game_concept_domicile: "Base"
 game_concept_domicile_building: "Construction de base"
 game_concept_domicile_buildings: "Constructions de base"
 game_concept_domiciles: "Bases"
 game_concept_follower: "Membre de l'équipe"
 game_concept_follower_desc: "A $game_concept_follower$ is a volunteer or staffer who works for a [adventurer|E] without a seat.\n\nMechanically, they are like [courtiers|E], but they owe less and leave sooner if they dislike their boss.\n\nThe collective [opinion|E] of the $game_concept_followers$ sets the [camp_temperament|E]."
 game_concept_followers: "Membres de l'équipe"
 game_concept_officer: "Membre du personnel senior"
 game_concept_officer_desc: "$game_concept_officers$ are the jobs [followers|E] can be given to run the [camp|E]: office manager, field director, treasurer and so on.\n\nThey work like [court_positions|E]: what they bring depends on the holder's [aptitude|E] for the job."
 game_concept_officers: "Personnel senior"
 game_concept_provision: "Fonds de campagne"
 game_concept_provisions: "Fonds de campagnes"
 game_concept_provisions_desc: "$game_concept_provisions$ are the office's running budget: rent, fuel, print and food for the volunteers.\n\nA [camp|E] spends $game_concept_provisions$ while it moves to a new [location|E]; how much depends on the size of the team, the distance and the [officers|E] it has.\n\nRunning out means unpaid bills and an unhappy team. Jobs done well, and some [camp_buildings|E], bring more in."
 game_concept_task_contract: "Emploi"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ are work a [adventurer|E] does for the party's MPs: canvassing, fundraising, speechwriting, research, phone banks, policy papers and media rounds.\n\nEach takes three weeks and is settled by a skill check. Doing it well earns [gold|E], [prestige|E], [provisions|E], Party Standing and the MP as a contact; doing it badly costs a little standing.\n\nThe party's candidate assessment is a $game_concept_task_contract$ too: pass it to join the approved candidates list."
 game_concept_task_contract_possessive: "Emploi de"
 game_concept_task_contract_tier: "Grade de l'emploi"
 game_concept_task_contracts: "Emplois"
 game_concept_task_contracts_possessive: "Emplois"
 head_groom_camp_officer: "Responsable des transports"
 head_groom_camp_officer_desc: "Le $head_groom_camp_officer$ s'occupe des minibus, des cartes de carburant et des amendes de stationnement."
 head_porter_camp_officer: "Coordinatrice Logistique"
 head_porter_camp_officer_desc: "Le $head_porter_camp_officer$ transporte le bureau, les boîtes et les personnes jusqu'à la ville suivante en un seul morceau."
 heavy_cavalry_captain_camp_officer: "Capitaine du Bus de bataille"
 heavy_cavalry_captain_camp_officer_desc: "Le $heavy_cavalry_captain_camp_officer$ dirige les circuits en bus : grandes visites, grandes foules, grandes photos."
 heavy_infantry_captain_camp_officer: "Chef d'équipe de démarchage"
 heavy_infantry_captain_camp_officer_desc: "Le $heavy_infantry_captain_camp_officer$ dirige les grandes séances de porte-à-porte du samedi."
 horse_archer_captain_camp_officer: "Diriger la distribution de tracts"
 horse_archer_captain_camp_officer_desc: "Le $horse_archer_captain_camp_officer$ organise les tournées de distribution rapide, rue par rue."
 huntperson_camp_officer: "Organisateur de sensibilisation"
 huntperson_camp_officer_desc: "Le $huntperson_camp_officer$ planifie les sorties : stands de rue, événements communautaires et visites."
 huntperson_camp_officer_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] augmente avec [aptitude|E]\n$BULLET$Améliore [martial|E] [education|E] les résultats pour tous [children|E] dans votre [camp|E]\n$BULLET$Peut aider à collecter des fonds pour la campagne [decisions|E]"
 kennelperson_camp_officer: "Coordinateur bénévole"
 kennelperson_camp_officer_desc: "Le $kennelperson_camp_officer$ nourrit, remercie et guide les bénévoles."
 landless_adventurer_government: "Campagneur"
 landless_adventurer_government_adjective: "Campagne électorale"
 landless_adventurer_government_realm: "Bureau de campagne"
 laureate_camp_officer: "Artisan des mots"
 laureate_camp_officer_desc: "Le $laureate_camp_officer$ écrit les phrases que les gens retiennent et celles qu'ils vous répètent en retour."
 light_cavalry_captain_camp_officer: "Responsable de la Réponse Rapide"
 light_cavalry_captain_camp_officer_desc: "Le $light_cavalry_captain_camp_officer$ envoie une équipe n'importe où dans la région en une heure."
 light_infantry_captain_camp_officer: "Chef de stand de rue"
 light_infantry_captain_camp_officer_desc: "Le $light_infantry_captain_camp_officer$ gère les stands sur la place du marché et devant la gare."
 master_bard_camp_officer: "Créateur de contenu"
 master_bard_camp_officer_desc: "Le $master_bard_camp_officer$ transforme une journée sur le pas de la porte en vidéo, en publication et, de temps en temps, en moment viral."
 master_of_arms_camp_officer: "Directeur de terrain"
 master_of_arms_camp_officer_desc: "Le $master_of_arms_camp_officer$ dirige les équipes de porte-à-porte : qui frappe où, et quand."
 master_of_spoils_camp_officer: "Trésorier"
 master_of_spoils_camp_officer_desc: "Le $master_of_spoils_camp_officer$ tient les comptes, signe les chèques et dépose les déclarations auprès de la Commission électorale."
 master_thief_camp_officer: "Chercheur sur l'opposition"
 master_thief_camp_officer_desc: "Le $master_thief_camp_officer$ sait ce que l'autre camp a dit en 2011, et où c'était écrit."
 mess_tent_01_domicile_building: "Cuisine du bureau"
 mess_tent_01_domicile_building_desc: "Une urne à thé, un réfrigérateur plein de lait et le gâteau d'anniversaire de quelqu'un : la campagne avance grâce à l'estomac."
 mess_tent_bakers_domicile_building: "Roulés au bacon"
 mess_tent_bakers_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('mess_tent_01').GetName])#!\nSamedi matin, avant la séance sur le pas de porte. Personne ne la manque."
 mess_tent_brewers_domicile_building: "Machine à café"
 mess_tent_brewers_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('mess_tent_01').GetName])#!\nUne vraie, avec des haricots. La participation au porte-à-porte du matin double."
 mess_tent_cooks_domicile_building: "Cuisiniers bénévoles"
 mess_tent_cooks_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nDes membres qui ne peuvent pas faire du porte-à-porte mais qui peuvent nourrir trente personnes avec un budget limité."
 mess_tent_curers_domicile_building: "Cuisson par lots"
 mess_tent_curers_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('mess_tent_01').GetName])#!\nUn congélateur rempli de piment pour les longues nuits de la courte campagne."
 mess_tent_herbalists_domicile_building: "Collations saines"
 mess_tent_herbalists_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nDes fruits ainsi que des biscuits. Une petite révolution."
 person_haggler_camp_officer: "Courtier en affaires"
 person_haggler_camp_officer_desc: "Le $person_haggler_camp_officer$ gère les visiteurs gênants et obtient les meilleures conditions pour chaque faveur."
 pike_captain_camp_officer: "Responsable de la banque téléphonique"
 pike_captain_camp_officer_desc: "Le $pike_captain_camp_officer$ gère les centres d'appels du soir : scripts, listes et un flux constant d'appels."
 proving_grounds_01_domicile_building: "Salle de formation"
 proving_grounds_01_domicile_building_desc: "Scripts de porte, jeux de rôle et comment répondre à la question que vous n'avez pas posée."
 proving_grounds_bodyguard_drills_domicile_building: "Exercices de protection rapprochée"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUn candidat en public a besoin de quelqu'un qui observe la foule."
 proving_grounds_camel_run_domicile_building: "Routes rurales"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('proving_grounds_01').GetName])#!\nVillages, fermes et chemins sans noms de rue : un plan de porte-à-porte pour la campagne."
 proving_grounds_elephantry_reserve_domicile_building: "Supporters célèbres"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUn acteur, un footballeur et un cuisinier de télévision qui se présenteront devant les caméras."
 proving_grounds_horse_run_domicile_building: "Toile de Cycle"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nVélos pour les longues routes et les quartiers que le minibus ne peut atteindre."
 proving_grounds_life_in_the_saddle_domicile_building: "Vie sur la route"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Requiert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCertaines personnes ne s'éveillent que dans une ville différente chaque jour."
 proving_grounds_lockwagon_domicile_building: "Fonds partagé"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nToutes les donations vont dans un seul pot, et le pot paie pour tout. Pour la plupart."
 proving_grounds_martial_study_domicile_building: "Études de cas de campagne"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nChaque élection a déjà été combattue. Lisez comment elle a été gagnée."
 proving_grounds_mock_battle_drills_domicile_building: "Jours de sondage simulés"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUne répétition complète du jour du scrutin, du premier réveil à la fermeture du vote."
 proving_grounds_nightly_barding_drills_domicile_building: "Exercices du Bus de bataille"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCharger, conduire, décharger, faire du porte-à-porte, répéter, jusqu'à ce que tout fonctionne comme sur des roulettes."
 proving_grounds_personal_bouts_domicile_building: "Pratique du débat"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nDébats simulés avec un membre du personnel jouant votre adversaire le plus redoutable."
 proving_grounds_the_stick_game_domicile_building: "Concours de bureau"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSur le résultat, la participation et quel candidat pleure en premier."
 proving_grounds_the_stump_domicile_building: "Le Soapbox"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUne caisse sur la place du marché et beaucoup de pratique pour être interrompu."
 proving_grounds_training_circle_domicile_building: "Cercle de jeu de rôle"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nÉlecteur en colère, électeur inquiet, électeur qui veut parler des poubelles : tout le monde s'exerce à tout."
 quartermaster_camp_officer: "Responsable de bureau"
 quartermaster_camp_officer_desc: "Le $quartermaster_camp_officer$ gère les fonds de campagne, le placard à fournitures de bureau et le planning."
 second_camp_officer: "Directeur adjoint de campagne"
 second_camp_officer_desc: "Le $second_camp_officer$ gère le bureau lorsque le candidat est sur le terrain, et maintient tous les autres concentrés sur leurs tâches."
 stooge_camp_officer: "Stagiaire"
 stooge_camp_officer_desc: "Le $stooge_camp_officer$ fait les photocopies, la course au café et tous les travaux que personne d'autre ne veut. Le moral s'améliore, pour tout le monde."
 supply_tent_01_domicile_building: "Salle d'impression"
 supply_tent_01_domicile_building_desc: "Tracts, affiches, enveloppes et l'imprimante que tout le monde maudit. La campagne fonctionne sur papier."
 supply_tent_arsenal_domicile_building: "Stock de tracts"
 supply_tent_arsenal_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!Boîtes de tous les prospectus que la campagne a jamais conçus, prêtes pour n'importe quelle rue en une heure."
 supply_tent_climbing_gear_domicile_building: "Échelles et colliers de câble"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!Chaque lampadaire dans la circonscription est un site d'affichage si vous pouvez l'atteindre."
 supply_tent_mender_domicile_building: "Kit d'occasion"
 supply_tent_mender_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!Ordinateurs portables donnés et téléphones remis à neuf : pas jolis, mais ils fonctionnent."
 supply_tent_reserve_provisions_domicile_building: "Fonds de réserve"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!Argent mis de côté pour les deux dernières semaines, quand chaque livre compte double."
 supply_tent_reserve_water_domicile_building: "Flotteur d’urgence"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!A boîte à biscuits d'argent de poche pour les choses que personne n'a budgétisées."
 supply_tent_smithy_domicile_building: "Imprimante interne"
 supply_tent_smithy_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!A imprimante correcte dans la réserve : plus besoin d'attendre une semaine pour les impressions."
 supply_tent_subdued_gear_domicile_building: "En civil"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!Pas de rosettes, pas de cordons : certaines tâches se font mieux sans les couleurs."
 supply_tent_sutler_domicile_building: "Fournisseurs en gros"
 supply_tent_sutler_domicile_building_desc: "#weak (Nécessite [GetDomicileBuilding('supply_tent_01').GetName])#!A grossiste qui pratique un bon prix pour le A5 si vous demandez gentiment et payez à temps."
 witness_camp_officer: "Responsable des avoirs"
 witness_camp_officer_desc: "Le $witness_camp_officer$ collecte chaque lettre de soutien et s'assure que tout le monde en entend parler."
