 action_can_ask_hof_for_money: "@gold_icon!Vous pouvez demander des fonds à votre Leader de Mouvement"
 action_can_choose_dynasty_perk_desc: "Vous avez assez de [dynasty_prestige|E] pour débloquer un [dynasty_perk|E] pour votre [dynasty|E].\n\n#help En tant que [dynast|E] vous pouvez dépenser la Marque du Parti sur des actions concernant vos compagnons de Dynastie, mais les Héritages sont des bonus à long terme pour l'ensemble de votre Dynastie.#!"
 action_can_claim_liege_title: "@titles_icon! Vous pouvez réclamer le titre de votre chef de parti"
 action_can_claim_liege_title_desc: "Vous contrôlez la majorité des [counties|E] qui sont [de_jure|E] à l'un de vos [liege_possessive|E] [titles|E]. Cela signifie que vous pouvez dépenser [prestige|E] pour obtenir un [unpressed_claim|E] dessus !\n\n#help Avoir une Réclamation Non Appuyée sur un Titre de niveau supérieur vous donne l'opportunité d'augmenter votre rang. Vous pouvez l'utiliser pour commencer un [claimant_faction|E] ou simplement déclarer [war|E] directement sur votre Chef de Parti pour celui-ci.#!"
 action_can_claim_liege_title_label: "@titles_icon! Vous pouvez réclamer le titre de votre chef de parti"
 action_can_create_head_of_faith_title_click: "#I Cliquez pour consulter l'idéologie #!"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help En créant le titre de leader du mouvement, vous devenez aussi le [temporal_head_of_faith|E] !#!"
 action_can_demand_payment_desc: "Vous pouvez dépenser le [hook|E] que vous possédez sur [recipient.GetUIName] pour exiger qu'ils vous paient [gold|E].\n\n[recipient.GetSheHe|U] possède actuellement @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! des Fonds que vous pouvez exiger.$action_can_demand_payment_HELP$"
 action_can_find_secrets_HELP: "\n\n#help Seuls les [vassals|E] détenteurs des 10 plus hautes [title_tier|E] [titles|E] sont indiqués ici, car ils sont les cibles les plus importantes, mais vous êtes libre de cibler n’importe quel député de votre [liege|E]. #!"
 action_can_make_clerical_puppet: "@theological_agent_puppet_icon! Le Prêtre du Parti peut être Manipulé"
 action_can_ransom_desc: "Vous pouvez rançonner votre [prisoner|E], [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUIName], pour [gold|E].\n\n[recipient.GetSheHe|U] possède actuellement @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! des Fonds que vous pouvez exiger.$action_can_ransom_HELP$"
 action_can_request_preach_legitimacy: "@legitimacy_icon! Prêcher le Mandat"
 action_can_request_preach_legitimacy_combined_group_label: "@legitimacy_icon! Prêcher le Mandat"
 action_can_request_preach_legitimacy_help_desc: "\n\n#help L’[legitimacy|E] de [rulers|E] dépend de l’approbation [actor.GetFaith.HighGodNamePossessive], et ce n’est que par l’intermédiaire des responsables du parti que [actor.GetFaith.HighGodNamePossessive] approbation peut être connue. #!"
 action_can_request_preach_legitimacy_label: "@legitimacy_icon!Votre mandat peut être amélioré par [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip]"
 action_can_train_knights_contract: "Vous pouvez former des Organisateurs pour compléter le Contrat"
 action_convert_at_war_interaction_click: "#I Cliquez pour adopter leur idéologie #!"
 action_convert_at_war_interaction_desc: "Vous pouvez vous convertir au [faith|E] de [recipient.GetShortUIName] afin de mettre fin à [recipient.GetHerHis] [holy_war|E] contre vous.\n\n#help Bien que mettre fin à une guerre perdante soit utile, sachez que les membres de votre ancienne Idéologie perdront [opinion|E] de vous !#!"
 action_convert_at_war_interaction_label: "@religious_icon! Vous pouvez convertir à l'Idéologie de l'attaquant"
 action_county_in_dangerous_populist_faction: "@faction_icon! Circonscription dans le mouvement populiste"
 action_county_in_dangerous_populist_faction_click: "#I Cliquez pour consulter la circonscription #!"
 action_county_in_dangerous_populist_faction_combined_group_description: "Paysans de plusieurs de vos circonscriptions se sont unis en [popular_faction|E] contre votre chef de parti. \n\nugnez les [county_opinion|E] de ces circonscriptions, ou risquez de les perdre complètement lorsqu’ils présenteront leurs revendications !"
 action_county_in_dangerous_populist_faction_combined_group_label: "@faction_icon! Circonscriptions dans le Mouvement Populiste"
 action_county_in_dangerous_populist_faction_desc: "[landed_title.GetNameNoTooltip] a rejoint un [popular_faction|E] contre le chef de votre parti.\n\nAugmentez le [county_opinion|E] de cette circonscription, ou risquez de la perdre lorsque la faction présentera ses exigences !"
 action_county_in_dangerous_populist_faction_label: "@faction_icon! [landed_title.GetNameNoTooltip] dans le Mouvement Populiste"
 action_empty_accolade_slot_click: "#I Cliquez pour consulter vos organisateurs #!"
 action_empty_accolade_slot_unimportant: "@warning_icon! #X L'organisateur peut également être un successeur valable pour un hommage existant"
 action_ep3_can_ask_hof_for_influence: "@influence_icon! Vous pouvez demander à votre leader du Mouvement de l'influence"
 action_ghw_participation_alert_desc: "Vous n'avez ni donné [gold|E] ni promis votre [armies|E] au prochain [actor.GetFaith.GHWName]. \n\n#help Si vous ne fournissez ni fonds ni soldats à l'effort de guerre, votre [head_of_faith|E] vous condamnera et vous perdrez [piety|E]. #!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon! Peut accorder un député au chef de parti légitime"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] Ceux dont vous n'êtes pas le dirigeant légitime du parti vous donnent moins de ressources et ont une [opinion|E] réduite envers vous. Parfois, il est préférable de rendre ces Backbenchers à leur dirigeant légitime du parti, en supposant qu'ils sont également votre Backbencher.\n\n Parfois, accorder un Backbencher à son dirigeant légitime du parti signifie que vous gagnez moins, mais cela vaut généralement la peine de le faire – leur dirigeant légitime vous pénalisera fortement en Opinion pour avoir détenu un Backbencher qu'il considère comme le sien.\n\n Maintenir une bonne structure de backbencher est la clé d'un parti stable.#!"
 action_grant_vassal_to_rightful_liege_click: "#I Cliquez pour accorder au député #!"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! Peut accorder aux députés de base au chef légitime du parti"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Les députés de base peuvent être attribués à leur chef de parti légitime"
 action_has_any_display_cb_on_HELP: "\n\n#help Si votre armée et [allies|E] sont plus fortes que celles de votre ennemi, la guerre peut être très bénéfique. Vous pouvez prendre [titles|E], étendre votre [realm|E] et gagner [prestige_experience|E].\n\n Cependant, les guerres sont coûteuses, surtout si vous devez admettre [defeat|E]. Des voisins ambitieux peuvent profiter de votre Parti affaibli.#!"
 action_has_courtier_or_guest_with_inspiration_desc: "Un de vos employés ou invités a un [inspiration|E] et peut être parrainé pour créer un [artifact|E]"
 action_has_courtier_or_guest_with_inspiration_label: "Un de vos employés ou invités a un [inspiration|E]"
 action_has_open_court_event: "Reprendre un événement officiel"
 action_has_open_court_event_label: "Vous avez un Événement de Bureau non terminé"
 action_has_unopened_court_event: "Événement au bureau disponible"
 action_has_unopened_court_event_label: "Vous avez un nouvel Événement de Bureau"
 action_in_debt_desc: "Vous avez moins de [gold_i|E]#V 0#! [gold|E] et êtes donc en [debt|E] !\n\n Être endetté a les effets suivants :\n$BULLET_WITH_TAB$ Vous ne pouvez pas déclarer [war|E]\n$BULLET_WITH_TAB$ Vous ne pouvez pas renforcer [men_at_arms|E] qui nécessitent [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] Les [domain|E]\n$BULLET_WITH_TAB$[vassals|E] que vous diffusez sont plus susceptibles de rejoindre [factions|E]\n\n Plus vous êtes endetté, plus les sanctions que vous subissez seront sévères. Votre niveau actuel d'endettement a les effets supplémentaires suivants :\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Si vous ne gagnez pas de fonds chaque mois, envisagez de réduire vos dépenses, par exemple en :\n$BULLET_WITH_TAB$ Dissolvant votre [armies|E]\n$BULLET_WITH_TAB$ Réduisant la taille de — ou en détruisant — votre [men_at_arms|E]\n$BULLET_WITH_TAB$ Augmentant [control|E] en utilisant votre [marshal|E]\n$BULLET_WITH_TAB$ Rétrogradant [court_positions|E]#!"
 action_in_debt_landless_desc: "Vous avez moins de [gold_i|E]#V 0#! [gold|E] et êtes donc en [debt|E] !\n\n Être endetté a les effets suivants :\n$BULLET_WITH_TAB$ Vous ne pouvez pas déclarer [war|E]\n$BULLET_WITH_TAB$ Vous ne pouvez pas renforcer [men_at_arms|E] en utilisant [gold_i|E][gold|E]\n\n Plus vous êtes endetté, plus les sanctions que vous subissez seront sévères. Votre niveau actuel d'endettement a les effets supplémentaires suivants :\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Envisagez de prendre un [task_contract|E] pour gagner des fonds#!"
 action_landless_admin_escape_to_realm: "Évasion vers un Autre Parti"
 action_landless_admin_escape_to_realm_desc: "Vous êtes un [noble_family|E] sans terre [title|E] [holder|E] sous un [liege|E] avec un [government|E]\n\n#help différent. Vous pouvez demander à d'autres [independent_rulers|E] avec votre [government|E] de devenir votre nouveau chef de parti et déplacer votre [domicile|E] vers leur [capital|E]#!."
 action_legal_meddling: "Acquérir des revendications au sein du parti du leader en tant que [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_combined_group_label: "@unpressed_claim! Vous pouvez forger des réclamations au sein du parti de votre chef de parti en tant que [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_label: "@unpressed_claim! Vous pouvez réclamer les circonscriptions détenues par votre [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, en tant que [actor.GetLiege.GetDiarchTitle]"
 action_low_control_in_county: "@control_icon! Faible contrôle de la circonscription dans [landed_title.GetNameNoTierNoTooltip] #low ([landed_title.GetCountyData.GetControl|0]/100)#!"
 action_low_control_in_county_HELP: "\n\n#help Vous pouvez assigner votre [marshal|E] à la tâche [increase_control|E] pour augmenter le contrôle de la circonscription.#!"
 action_low_control_in_county_combined_group_label: "@control_icon! Faible contrôle dans les circonscriptions"
 action_no_mandala_decree_desc: "Vous n'avez pas sélectionné de [mandala_decree|E]\n\n#help Laissez votre Décret aider à orienter votre [subjects|E], et par extension votre Parti, dans la direction appropriée. #!"
 action_not_rightful_liege: "Pas le chef légitime du parti de [recipient.GetShortUINameNoTooltip]"
 action_not_rightful_liege_combined_group_description: "Vous n'êtes pas le [rightful_liege|E] de plusieurs de vos parlementaires.\n\n Vérifiez si vous pouvez [create|E] ou [usurp|E] des titres qui feront de vous leur [de_jure|E] [liege|E] ; cela améliorera également leur opinion [opinion|E] de vous ainsi qu'augmentera le [taxes|E] et [levies|E] que vous recevez d'eux.\n\n Si cela n'est pas possible, vous pouvez envisager de [transferring|E] les transférer à un autre de vos parlementaires, surtout si ce parlementaire deviendrait leur [rightful_liege|E]."
 action_not_rightful_liege_combined_group_label: "Pas le chef légitime des députés de soutien"
 action_not_rightful_liege_desc: "Vous n'êtes pas le [rightful_liege|E] de votre [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nVous devriez vérifier si vous pouvez [create|E] ou [usurp|E] un titre qui vous rendrait [recipient.GetHerHis] [de_jure|E] [liege|E] ; le faire améliorera [recipient.GetHerHis] [opinion|E] de vous ainsi qu'augmentera le [taxes|E] et [levies|E] que vous recevez de [recipient.GetHerHim].\n\nSi cela n'est pas possible, vous pourriez envisager de [transferring|E] les transférer à un autre de vos députés de réserve, surtout si ce député serait leur [rightful_liege|E]."
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! Un Député puissant s'attend à un poste [GetPlayer.Custom( 'GetCouncilConcept' )]"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help Vous devriez envisager de donner aux députés puissants une position [GetPlayer.Custom( 'GetCouncillorConcept' )|E]. Sinon, leur [opinion|E] sera réduit, et ils pourraient rejoindre un [faction|E] contre vous.\n\nCependant, tout le monde n'a pas un [skills|E] suffisamment élevé pour être utile, et si votre [rank|E] est assez élevé, il pourrait simplement y avoir plus de députés puissants que de sièges sur le [GetPlayer.Custom( 'GetCouncilConcept' )|E].#!"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! Des Députés puissants s'attendent à des postes [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )]"
 action_powerful_vassal_not_on_council_label: "@powerful_vassal_icon! Votre parlementaire puissant, [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip], attend un poste [GetPlayer.Custom( 'GetCouncilConcept' )|E] ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_promote_foreign_legend_desc: "Vous pourriez promouvoir le [legend|E] de quelqu'un d'autre.\n\n#help [legends|E] sont utiles pour obtenir des [legitimacy|E], [dynasty_prestige|E], [prestige|E], [piety|E], [traits|E] et [claims|E]. Un [legend|E] s'est propagé dans votre parti, obtenez des récompenses en le soutenant."
 action_regent_retract: "Retirer un député de base comme [actor.GetLiege.GetDiarchTitle]"
 action_regent_retract_combined_group_label: "@vassal_icon! Vous avez des parlementaires que vous pouvez retirer en tant que [actor.GetLiege.GetDiarchTitle]"
 action_regent_retract_label: "@vassal_icon! Vous pouvez retirer des députés de base de votre [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, en tant que [actor.GetLiege.GetDiarchTitle]"
 action_shift_privileges: "Voler des fonds à des collègues backbenchers en tant que [actor.GetLiege.GetDiarchTitle]"
