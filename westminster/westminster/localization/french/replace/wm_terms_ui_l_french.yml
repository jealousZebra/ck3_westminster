 action_title_lost_from_realm_by_vassal_war_HELP: "#help [vassals|E] qui obtiennent un [title|E] d'un [title_tier|E] ou au-dessus du [rank|E] de leur [liege|E] deviendront [independent|E], ou députés de base du prochain [realm|E] Chef de parti dans la hiérarchie qui les surclasse. \n\n Vous devriez envisager d'utiliser l'interaction $stop_attacker_vassal_war_interaction$, ou trouver un autre moyen de faire en sorte que la guerre se dirige contre votre député de base. #!"
