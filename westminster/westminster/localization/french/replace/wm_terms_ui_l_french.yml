 action_too_many_held_duchies_combined_group_description: "Vous détenez plus de deux [duchies|E] en tant que [king|E] ou [emperor|E], ce qui réduit le [opinion|E] que votre [vassals|E] a de vous.\n\n#help Plus vous détenez de $game_concept_duchies$ au-delà de vos deux premiers, plus vos backbenchers seront envieux. Bien que vous puissiez ignorer leurs plaintes, envisagez de céder une partie de vos $game_concept_duchy$ [titles|E].\n\nVous devriez conserver $game_concept_duchies$ là où vous détenez de nombreux $game_concept_counties$, en particulier votre [realm_capital|E].#!"
