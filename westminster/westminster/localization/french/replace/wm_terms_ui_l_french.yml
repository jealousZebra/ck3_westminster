 action_station_men_at_arms: "@stationed_regiment_icon! Les activistes peuvent être stationnés"
 action_station_men_at_arms_HELP: "\n\n#help Vous devriez stationner vos [men_at_arms|E] les plus puissants dans [holdings|E] avec des [buildings|E] qui augmentent leur efficacité.\n\nSpécialiser une ou deux de vos propriétés pour augmenter significativement le pouvoir de types spécifiques d'activistes peut vous aider dans [wars|E].#!"
