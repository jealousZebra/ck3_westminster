 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Enfin ! [faction_target.GetName] n'est rien de plus qu'un bouffon jouant un rôle [faction_target.GetTitleAsNameNoTooltip], et je suis sûr que le parti se ralliera à ma cause. Ceux qui m'aideront ne seront pas oubliés."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] occupe un trône qui devrait vous revenir de droit ! Je suis prêt à soutenir votre revendication par la parole et l'épée, et je suis sûr que d'autres dans le parti appuieront également cette cause légitime. Tout ce que vous avez à faire est d'accepter."
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "Enfin ! [faction_target.GetName] n'est rien de plus qu'un bouffon jouant un rôle [faction_target.GetTitleAsNameNoTooltip], et je suis sûr que le parti se ralliera à ma cause. Ceux qui m'aideront ne seront pas oubliés."
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] occupe un trône qui devrait vous revenir de droit ! Je suis prêt à soutenir votre revendication par la parole et l'épée, et je suis sûr que d'autres dans le parti appuieront également cette cause légitime. Tout ce que vous avez à faire est d'accepter."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "Enfin ! [faction_target.GetName] n'est rien de plus qu'un bouffon jouant un [faction_target.GetTitleAsNameNoTooltip], et je suis certain que le parti se ralliera à ma cause.\n\nEn raison de mon statut actuel inférieur, je ne peux pas vous aider. Mais sachez ceci – #emphasis lorsque#! vous serez victorieux, je veillerai à ce que vous soyez généreusement récompensé !"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "Bien que je sois heureux de voir le parti se lever contre le faux [faction_target.GetTitledFirstName], ma situation actuelle m'empêche de vous rejoindre dans cette entreprise juste. Si vous réussissez, je vous serai redevable."
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Il est clair pour moi que vous préférez voir le parti brûler plutôt que d'abandonner cette entreprise insensée. Pour le bien du parti, je dois accepter vos demandes, mais sachez qu'une grande injustice a été commise ici aujourd'hui. Cela ne restera pas impuni !"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "Il m’est clair que vous souhaitez voir le parti brûler avant d’abandonner cette entreprise insensée. Pour le bien du [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] je dois accepter vos exigences, mais sachez qu’une grande injustice a été commise ici aujourd’hui. Cela ne peut pas être toléré !"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVos demandes mal orientées ne feront que nous affaiblir tous. Quoi qu'il en soit, pour épargner au parti un effusion de sang inutile, je suis contraint d'accepter votre demande d'indépendance."
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Il m’est clair que vous voudriez voir le parti brûler avant d’abandonner cette entreprise insensée. Pour le bien de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] je dois accepter vos exigences, mais sachez qu’une grande injustice a été commise ici aujourd’hui. Cela ne sera pas permis !"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nLes sujets loyaux du parti ont enduré vos politiques mal orientées pendant trop longtemps. Le [faction.GetName] exige que vous consentiez à une nouvelle direction pour [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ou nous en imposerons une sur vous !"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "Le moment est venu ! Tous ceux qui soutiennent l'abandon des politiques erronées de [faction_target.GetTitledFirstNamePossessive] se lèveront maintenant comme un seul homme et s'assureront que le parti soit dirigé dans une nouvelle direction. Nous verrons cela se faire, à l'épée et au feu si nécessaire !"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVos demandes mal orientées ne feront que nous affaiblir tous. Quoi qu'il en soit, pour épargner au parti un effusion de sang inutile, je suis contraint d'accepter votre demande d'indépendance."
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVos notions égoïstes de 'liberté' affaibliront le Parti dans son ensemble. Cependant, pour éviter un effusion de sang inutile, j'accepterai vos exigences."
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n Il est temps pour vous de reconnaître les droits anciens et inaliénables de vos backbenchers ! Acceptez les demandes de [faction.GetName] ou affrontez nos épées sur le champ de bataille !"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Très bien ! Mon parti n'a pas de place pour vos troupeaux malpropres."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Nous ne tolérerons plus votre vile oppression du fier [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Né pour parcourir librement ces cieux ouverts, nous rejetons votre tyrannie — notre moment est arrivé ! \n\nNous renverserons votre règne et celui de votre chef de parti, [faction_target.GetTitledFirstName], une fois pour toutes !!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "Nous ne permettrons aucune oppression supplémentaire de votre règle [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)]. [peasant_leader.GetRite.GetName|U] doit être reconnu comme le [rite|E] prééminent du [ROOT.Char.GetPrimaryTitle.GetName] ! \n\nDonnez à notre idéologie le statut légitime qu'elle mérite, ou préparez-vous à affronter la colère de nos nombreux fidèles !"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "Nous ne tolérerons plus votre vile oppression des bons [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Notre moment est maintenant arrivé ! \n\nNous nous libérerons de votre règne et de la tyrannie de votre chef de parti, [faction_target.GetTitledFirstName] !"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "Nous ne tolérerons plus l'oppression étrangère des traditions [peasant_leader.GetCulture.GetName]. Notre moment est maintenant arrivé ! \n\nNous n'exigerons rien de moins que la liberté totale de votre chef de parti, [faction_target.GetTitledFirstName] !"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "Nous ne tolérerons plus votre vile oppression des fidèles [peasant_leader.GetFaith.GetAdherentNamePlural]. Notre moment est maintenant arrivé ! \n\nAvec [peasant_leader.GetFaith.WarGodName] pour nous guider, nous nous élèverons et nous libérerons du règne de votre chef de parti, [faction_target.GetTitledFirstName] !"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N Vous perdrez une partie de votre parti si votre chef de parti cède à leurs demandes !#!"
