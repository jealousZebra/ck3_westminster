 peasant_faction_desc: "Le paysan [faction|E] veut la liberté pour le peuple face à la domination étrangère ou des adversaires, et cherchera à remplacer un chef de parti qui ne partage pas les [culture|E] et [faith|E] des gens ordinaires dans le [counties|E]."
