 nation_fracturing_faction_desc: "Les membres de $nation_fracturing_faction$ [faction|E] cherchent à détruire le parti de leur [liege|E].\n\n#S Ultimatum#!\nTous les membres de la faction deviennent [independent|E]\n[liege|E] perdent leur [primary_title|E] et d'autres [titles|E] du même [title_tier|E]"
