l_french:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "Les bénéfices étaient des propriétés locales ou lointaines, des offices ou des revenus partagés du pape qu'un membre des fonctionnaires du parti pouvait se voir accorder #i en commendam#! (en fiducie). Ils généraient des revenus, généralement sans responsabilités administratives directes."
 additional_mandala_government_piety_levels: "Le [mandala|E] [government|E] peut débloquer des niveaux supplémentaires de Capital Politique après [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] jusqu'à et y compris [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]. Pour atteindre ce degré de divinité, leur loyauté doit être prouvée sur plusieurs générations."
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ est le niveau le plus élevé de [crown_authority|E]. [vassals|E] ont un malus #N de -30#! [opinion|E] envers leur [liege|E].\n\nÀ ce niveau — en plus des effets de [high|E] et de la Couronne [limited|E] — le dirigeant peut choisir un [designated_heir|E] à un coût de [prestige|E].\n\nDe plus, les parlementaires de base ne peuvent déclarer la guerre, même contre des dirigeants étrangers."
 game_concept_acclaimed_knight: "Organisateur étoile"
 game_concept_acclaimed_knight_desc: "Le [knight|E] détient un [accolade|E].\n\nPour être un Organisateur Étoile, un Organisateur doit être [unlanded|E] ou un [baron|E], avec au moins [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] ou plus de [prowess|E]. Un Organisateur Étoile doit être éligible pour au moins un [accolade_type|E] qui n'est pas déjà possédé par un autre des Organisateurs Étoiles de leur [liege|e].\n\nLes Organisateurs Étoile sont moins susceptibles d'être tués ou faits prisonniers au combat. Ils peuvent améliorer leur [glory|E] principalement en combattant des [wars|E] et en assistant à des [activities|E] comme les [GetActivityType( 'activity_tournament' ).GetName].\n\nLes organisateurs acclamés peuvent occasionnellement gagner des [skills|E] et des [traits|E] liés aux attributs de leur Distinction."
 game_concept_acclaimed_knight_possessive: "De l'organisateur étoile"
 game_concept_acclaimed_knights: "Organisateurs étoiles"
 game_concept_accolade_desc: "Les distinctions sont des honneurs donnés à [knights|E] par leur [liege|E].\n\nL'organisateur qui détient une distinction devient un [acclaimed_knight|E].\n\nÀ mesure que l'organisateur vedette gagne [glory|E], leur aptitude [accolade_squires|E] augmente (améliorant [accolade_succession|E]) et [accolade_ranks|E] peut être obtenue. Celles-ci permettent de débloquer plus de [accolade_types|E], offrant des bonus plus puissants.\n\nLorsqu'un organisateur vedette meurt, [accolade_succession|E] a lieu et l'organisateur est immédiatement remplacé par un successeur dont les compétences sont modifiées par l'aptitude [accolade_squires|E].\n\n[innovations|e] et des [title_tiers|e] supérieurs permettent à [rulers|E] d'avoir plus de distinctions simultanément."
 game_concept_accolade_squires_desc: "Chaque [accolade|E] possède une métrique d'Aptitude des Écuyers, qui modifie le [traits|E] et le [skills|E] (principalement, [prowess_skill|E], [martial_skill|E] et [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]) de son prochain [acclaimed_knight|E].\n\nIl y a 5 niveaux d'Aptitude pour les Écuyers :\n$EFFECT_LIST_BULLET$Accompli\n$EFFECT_LIST_BULLET$Capable\n$EFFECT_LIST_BULLET$Inexpérimenté\n$EFFECT_LIST_BULLET$Inefficace\n$EFFECT_LIST_BULLET$Pathétique\n\nAvoir une Aptitude Inexpérimentée ou supérieure fera que l'Organisateur Étoile influencera sporadiquement le [traits|E] et le [skills|E] des jeunes [courtiers|E] de genre martial, leur donnant la priorité pour assumer l'Accolade lors de [accolade_succession|E]\n\nLes Écuyers s'améliorent principalement par le gain de [glory|E], mais aussi :\n$EFFECT_LIST_BULLET$Le [prowess_skill|E] de l'Organisateur Étoile\n$EFFECT_LIST_BULLET$Le [martial_skill|E] de l'Organisateur Étoile'\n$EFFECT_LIST_BULLET$L'Organisateur Étoile gagne [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$L'Organisateur Étoile gagne [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$Le [martial_skill|E] de l'Accolade[liege|E]\n$EFFECT_LIST_BULLET$Le [prowess_skill|E] de l'Accolade[liege|E]\n\nChaque [accolade_succession|E] réinitialise les Écuyers de l'Accolade."
 game_concept_accolade_succession_desc: "La succession de l'Accolade se produit lorsqu'un [accolade_possessive|E] [acclaimed_knight|e] meurt ou devient invalide.\n\n L'ancien Organisateur Étoile est immédiatement remplacé. Les jeunes [courtiers|E] et [knights|E] formés en raison de l'Aptitude [accolade_squires|E] de l'Accolade sont d'abord favorisés en tant que Successeurs ; puis viennent les autres organisateurs, autres membres du personnel, voyageurs, et enfin les [characters|E] nouvellement créés. En fonction de l'Aptitude [accolade_squires|E] de l'Accolade, le nouvel Organisateur recevra une augmentation de [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E], et éventuellement d'autres [skills|E].\n\n Après la succession de l'Accolade, une petite quantité de [glory|E] peut être perdue et l'Aptitude des Écuyers de l'Accolade est réinitialisée pour refléter désormais les compétences et l'expérience de son nouvel Organisateur Étoile\n\n Le fait que l'Organisateur Étoile meure au combat, lors d'un duel ou d'une autre manière honorable annulera la perte de Gloire et améliorera les Écuyers de l'Accolade."
 game_concept_accolade_type_desc: "Un [accolade|E] peut avoir jusqu'à #value 3#! attributs, qui fournissent des bonus de progression à mesure que leurs niveaux supérieurs sont débloqués. Chaque attribut a #value 3#! niveaux. Lorsqu'un honneur augmente son [accolade_rank|E], son propriétaire peut soit augmenter le niveau d'un attribut existant, soit ajouter un nouvel attribut à l'honneur. Le [acclaimed_knight|E], cependant, doit satisfaire aux exigences de tout nouvel attribut.\n\nChaque [knight|E] n'est éligible qu'à certains attributs, qui peuvent être basés sur [traits|E], [skills|E] ou des déblocages expérimentaux lors du service en tant qu'organisateur.\n\nChaque honneur doit avoir des attributs uniques : un chef de groupe #high ne peut#! pas dupliquer des attributs entre les honneurs. Chaque honneur peut également se spécialiser dans seulement #value 1#! attribut de type [men_at_arms|E]."
 game_concept_ai_economical_boom_personality_desc: "A $game_concept_ai_economical_boom_personality$ veut investir tout leur [gold|E] dans le [realm|E]. Ils videront leur trésorerie pour financer [buildings|E] et [men_at_arms|E], et construisent souvent plus de [economic_buildings|E] et [holdings|E]. Ils n'économisent des fonds que s'ils sont directement menacés, par exemple par un fort [faction|E]. \n\n$game_concept_ai_economical_boom_personality$ les dirigeants sont légèrement moins susceptibles de créer et de promouvoir [legends|E]. \n\n Les dirigeants audacieux ayant une propension à la construction et sans inclination particulière pour [war|E] ont tendance à être des $game_concept_ai_economical_boom_personality$. \n Les traits communs incluent [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )] et [GetTrait('profligate').GetName( GetNullCharacter )]. Les dirigeants avec le [GetFocus('stewardship_domain_focus').GetName] ont également tendance à être des $game_concept_ai_economical_boom_personality$."
 game_concept_ai_pious_builder_personality_desc: "A $game_concept_ai_pious_builder_personality$ veut investir tout leur [gold|E] dans l'augmentation de leur [piety|E].\n\nIls dépenseront leur trésorerie pour financer des [buildings|E] religieux et cérémoniels, [great_projects|E], [activities|E] et [decisions|E], et construisent souvent plus de [pious_buildings|E] et [temple|E]- ou [temple_citadel|E] [holdings|E]. Ils ne mettent de côté des fonds que s'ils sont directement menacés, comme par un fort [faction|E].\n\n$game_concept_ai_pious_builder_personality$s sont plus susceptibles de créer et de promouvoir des [legends|E] sacrés.\n\nLes [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] zélés avec un penchant pour [virtue|E] et aucune inclinaison particulière pour [war|E], ont tendance à être des $game_concept_ai_pious_builder_personality$s.\nLes traits communs incluent [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], et [GetTrait('generous').GetName( GetNullCharacter )]. Les dirigeants avec le [GetFocus('learning_theology_focus').GetName] ont également tendance à être $game_concept_ai_pious_builder_personality$s."
 game_concept_ai_warlike_personality_desc: "Un $game_concept_ai_warlike_personality$ [ruler|E] veut être prêt à déclarer [war|E], toujours. Ils économiseront [gold|E] pour [war|E] avant de l'investir dans le développement de leur [realm|E]. Si un $game_concept_ai_warlike_personality$ Ruler est en paix pendant une période prolongée, ils utiliseront les fonds de leur trésorerie de guerre pour construire [buildings|E].\n\n$game_concept_ai_warlike_personality$ les dirigeants sont plus susceptibles de créer et de promouvoir des héros [legends|E].\n\n Les dirigeants audacieux et avides ont tendance à être belliqueux.\n Les traits communs incluent [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )] et [GetTrait('zealous').GetName( GetNullCharacter )]."
 game_concept_alliance_desc: "Un $game_concept_alliance$ est une relation diplomatique entre deux [rulers|E]. Les [independent|E] dirigeants peuvent solliciter $game_concept_allies$ pour rejoindre mutuellement leurs [wars|E].\n\nLes alliances sont créées et maintenues par un [marriage|E] ou [betrothal|E], tant que les deux personnages qui se marient sont suffisamment proches des deux dirigeants. Par exemple, si un [king|E] marie sa fille au fils d'un autre roi, les deux rois deviennent $game_concept_allies$.\n\n[lieges|E] peuvent également créer $game_concept_alliances$ avec leurs [vassals|E]. Le chef du parti ne peut pas appeler le député à la guerre, mais cela l'empêche de rejoindre [factions|E]."
 game_concept_anointment_request_desc: "La Demande de l'Onction [character_interaction|E] est une interaction spéciale qui peut être utilisée par un [ruler|E] de [empire|E] [title_tier|E] ou plus sur leur [head_of_faith|E], ou par des responsables de parti [head_of_rite|E] lorsqu'il n'y en a pas, pour obtenir leur soutien dans un [anointment|E]."
 game_concept_archdiocese_desc: "Une archidiocèse est la forme [christian|E] d'un [clerical_region|E], un portefeuille ecclésiastique détenu par un [archbishop|E] à travers son [clerical_title|E] et siégé dans une capitale [county|E], où un [grand_cathedral|E] peut être élevé.\n\nA [christian|E] [ruler|E] rend des comptes en matière spirituelle au [archbishop|E] de l'archidiocèse qui contient leur [capital|E] [county|E], et le territoire soumis aux archidiocèses constitue collectivement [the_christian_church|E] [situation|E]."
 game_concept_aspect_of_serenity_desc: "Une fête paisible est une fête prospère — l'Aspect Sérénité chérit la tranquillité et les relations diplomatiques, accordant des bonus à ceux qui s'alignent sur sa cause.\n$EFFECT_LIST_BULLET$Se concentre sur [diplomacy|E]\n$EFFECT_LIST_BULLET$Éviter les [wars|E] offensives est présenté par [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L] piles\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] et [GetScheme('befriend').GetTypeName] [schemes|E] sont plus réussis\n$EFFECT_LIST_BULLET$Peut également #high $request_great_project_contribution_interaction$s#! de [allies|E]\n$EFFECT_LIST_BULLET$Peut seulement mourir de [death_natural_cause|E] ou [death_religious|E] [character_death_deaths|E]"
 game_concept_at_peace_opinion_desc: "Les personnages qui ont le [GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E] comme partie de leur [faith|E] auront le '$game_concept_at_peace_opinion$' au lieu de la pénalité [offensive_war_opinion|E].\n\n Si vous êtes en paix trop longtemps, vos [vassals|E] penseront moins de vous #weak (s'ils partagent votre Idéologie).#!"
 game_concept_autonomous_vassals: "Députés autonomes"
 game_concept_autonomous_vassals_crown_authority: "Autorité de la Couronne des députés autonomes"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' est le niveau le plus bas de [crown_authority|E]. À ce niveau, les [vassals|E] n'ont aucune pénalité [opinion|E] envers leur [liege|E], et le chef de parti n'a que des pouvoirs de base sur eux."
 game_concept_available_spouse_desc: "Pour siéger au [council|E] d'un dirigeant, un [spouse|E] doit être disponible pour accomplir les responsabilités de ce rôle.\n\nDiverses circonstances peuvent empêcher un $game_concept_spouse$ de remplir ces responsabilités, mais les plus courantes incluent :\n$BULLET_WITH_TAB$Être le [ruler|E] de leur propre [realm|E]\n$BULLET_WITH_TAB$Résider dans le [court|E] d'un autre dirigeant\n$BULLET_WITH_TAB$Être [imprisoned|E], à la maison ou à l'étranger\n$BULLET_WITH_TAB$Avoir le [GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]\n\nSi un conjoint indisponible redevient disponible, il reprendra automatiquement ses fonctions au sein du cabinet.\n\nLes conjoints qui sont eux-mêmes dirigeants peuvent toujours siéger au cabinet s'ils sont votre [direct_vassals|E], mais sinon ne seront jamais considérés comme disponibles."
 game_concept_baronies: "Quartiers"
 game_concept_barony: "Ward"
 game_concept_beneficiary_desc: "Chaque participant dans un [great_holy_war|E] peut sélectionner un $game_concept_beneficiary$ de son [dynasty|E]. En cas de victoire, le $game_concept_beneficiary$ recevra des terres dans le parti ciblé proportionnelles au [war_contribution|E] de leur souverain parrain. \n\n Le plus grand contributeur peut forcer son Bénéficiaire à recevoir le titre principal sur lequel se déroule la lutte."
 game_concept_buy_claim_desc: "Une interaction qui permet à un personnage d'acheter [unpressed_claims|E] en échange de [piety|E].\n\n$EFFECT_LIST_BULLET$A [vassal|E] ne peut pas acheter de revendication sur le [liege|E] de quiconque [title|E], et un chef de parti ne peut pas acheter de revendication sur le titre de n'importe quel député de base\n$EFFECT_LIST_BULLET$A [king|E] ou [emperor|E] ne peuvent pas acheter de revendications sur des titres nationaux, et les empereurs ne peuvent pas acheter de revendications sur d'autres empires\n$EFFECT_LIST_BULLET$Personne ne peut acheter de revendication sur son propre [head_of_faith|E]"
 game_concept_canonized_desc: "Un [character|E] qui a, après sa mort, été déclaré saint ou l'équivalent dans une autre idéologie, comme un Wali ou un ancêtre vénéré, obtenant le [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\nUne vie vertueuse peut se terminer en $game_concept_canonization$ : elle est sollicitée par un [decision|E], peut nécessiter la bénédiction du [head_of_faith|E], et est scellée en consacrant le lieu de sépulture du saint. Leur lieu de repos attire ensuite des voyageurs pieux, et leurs restes peuvent produire [holy_relics|E]."
 game_concept_capital_duchy: "Région capitale"
 game_concept_capital_duchy_desc: "Le modificateur $game_concept_capital_duchy$ augmente la quantité de [levies|E] que vous obtenez de tous les [holdings|E] que vous détenez dans le même [de_jure|E] [duchy|E] que votre [capital|E]. Il donne également un bonus à tous les [stationed|E] [men_at_arms|E]. Pour que ce modificateur soit actif, vous devez personnellement détenir la Region associée.\n\nCe modificateur ne s'accumule pas avec le bonus de la base principale."
 game_concept_ceremonial_claimant_faction_desc: "Le $game_concept_claimant_faction$ cherche à installer un [claimant|E] particulier comme [ceremonial_liege|E]. S'ils réussissent, le chef de parti cérémonial en fonction devra céder son [title|E] au demandeur. Tous les membres [faction|E] bénéficieront d'un [hook|E] sur le demandeur."
 game_concept_ceremonial_liege_desc: "Dans certains [realms|E] (comme le Japon), un bureaucrate ou commandant puissant peut avoir pris le véritable pouvoir en tant que [ceremonial_regent|E], laissant un $game_concept_ceremonial_liege$ régnant nominalement comme simple figure de proue et [vassal|E] en pratique. Tous les membres d’un $game_concept_ceremonial_liege_possessive$ [house|E] sont considérés comme faisant partie du [ceremonial_house|E]. \n\nMême sans gouverner directement, le $game_concept_ceremonial_house$ est la lignée la plus estimée dans un parti, et d’autres [houses|E] gagneront plus de [prestige|E] pour des mariages avec eux, ces liens influençant fortement la succession du $game_concept_ceremonial_regent$. \n\nLe $game_concept_ceremonial_liege$ peut reprendre le véritable pouvoir s’il récupère d’une manière ou d’une autre le [primary_title|E] du parti, par exemple par [faction|E] exigence ou en concourant pour le $game_concept_ceremonial_regent$ [title|E] via [influence|E]."
 game_concept_challenger_hof: "Leader du Mouvement Challenger"
 game_concept_challenger_hof_desc: "Un $game_concept_challenger_hof$ est un rival [head_of_faith|E] élevé contre le [mainline_rite|E] $game_concept_head_of_faith$.\n\nA [ruler|E] peut parrainer un membre de leur [clergy|E] en tant que $game_concept_challenger_hof$. Un [clergy|E] [ruler|E] ou un dirigeant d'un [faith|E] avec un dirigeant du Mouvement Temporel peut se déclarer comme Challenger à la place.\n\nA $game_concept_challenger_hof$ parrainé prend la [rite|E] de son parrain, devient le [external_clerical_puppet|E] de ce parrain et lui doit un [weak_hook|E].\n\nLe $game_concept_mainline_rite$ $game_concept_head_of_faith$ ne peut pas [excommunicate|E] quiconque suit un $game_concept_challenger_hof$ : le parrain et leur [vassals|E].\n\nToute personne suivant un $game_concept_challenger_hof$ apporte leurs demandes cléricales à eux au lieu de les apporter au $game_concept_mainline_rite$ $game_concept_head_of_faith$, parmi eux ces [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nA $game_concept_challenger_hof$ ou leur parrain peut utiliser le [pam_challenge_hof_cb|E] [casus_belli|E] contre le $game_concept_head_of_faith$ légitime.\n\nLes [kings|E] rivaux ou supérieurs du même [faith|E] peuvent à la place utiliser le [pam_antiking_cb|E] contre un parrain, déposant le revendicateur rival."
 game_concept_chancellor: "Secrétaire aux affaires étrangères"
 game_concept_chancellor_desc: "Le $game_concept_chancellor$ est le [councillor|E] responsable de la diplomatie, à l'étranger et avec le reste du [realm|E]."
 game_concept_chancellors: "Secrétaires aux affaires étrangères"
 game_concept_church_authority_desc: "$game_concept_church_authority$ représente le pouvoir qu'un [theocratic|E] [ruler|E] exerce sur son [clergy|E] et son [vassals|E].\n\nIl existe quatre niveaux de $game_concept_church_authority$ ; $church_authority_0$, $church_authority_1$, $church_authority_2$ et $church_authority_3$. Augmenter le $game_concept_church_authority$ coûte une quantité de [piety|E] et de [prestige|E] selon le niveau et le [learning_skill|E] du dirigeant.\n\n#weak Les députés de l'arrière-ban n'aiment pas les niveaux plus élevés de $game_concept_church_authority$, et le réduire est l'objectif principal de [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_claimant_desc: "Un $game_concept_claimant$ est une personne ayant un ou plusieurs [claims|E] à [titles|E]. [ruler|E] Les Revendicateurs peuvent les faire valoir en utilisant la Requête [casus_belli|E] pour déclarer [wars|E]. \n\n Ce Casus Belli peut également être utilisé pour faire valoir les Revendications de [vassals|E] et même de [unlanded|E] parmi les personnages de votre [realm|E]. \n\n Les Revendicateurs peuvent également diriger [factions|E] — même s'ils ne résident pas dans votre Parti."
 game_concept_claimant_faction_desc: "Le $game_concept_claimant_faction$ cherche à installer un [claimant|E] particulier sur le trône d'un [title|E] détenu par leur [liege|E]. S'ils réussissent, le chef de parti devra céder le titre au demandeur et la structure [vassal|E] sera mise à jour en conséquence. Tous les membres [faction|E] bénéficieront d'un [hook|E] sur le demandeur."
 game_concept_clan_desc: "Clans sont des [government_form|E] où le montant de [levies|E] et de [taxes|E] attribués à un [liege|E] par son [vassals|E] est déterminé par le [aptitude|E] du [tax_collector|E] du chef du groupe. Les clans utilisent également [house_unity|E]."
 game_concept_clergy: "Fonctionnaires du parti"
 game_concept_clergy_desc: "[court_chaplains|E], [realm_priests|E], [theocratic|E] Gouverneurs, et toute personne ayant le trait [GetTrait('devoted').GetName( GetNullCharacter )] sont considérés comme membres des Fonctionnaires du Parti.\n\nLe [doctrines|E] du [faith|E] détermine qui peut être membre des Fonctionnaires du Parti, et si les membres des Fonctionnaires du Parti peuvent se marier, hériter de terres, etc."
 game_concept_clergy_opinion: "Opinion des fonctionnaires du parti"
 game_concept_clerical_puppet: "Marionnette du prêtre du parti"
 game_concept_clerical_puppets: "Marionnettes du prêtre du parti"
 game_concept_clerical_region_desc: "Une région ecclésiastique est une région géographique qui relève de la juridiction d'un [clerical_title|E]. Tout membre des officiels du parti dans la région sera un [subordinate|E] pour le détenteur du [title|E] associé à la région.\n\nA [ruler|E] appartient à la région ecclésiastique qui contient leur [capital|E] [county|E], et une nouvelle région est fondée sur le [capital|E] du [primary_title|E] de son fondateur. La région peut couvrir plusieurs [realms|E] et avoir des subordonnés qui appartiennent à différents partis.\n\nA $game_concept_ruler$ ne peut détenir plus d'un $game_concept_clerical_region$ à la fois. Si une nouvelle région est accordée, le dirigeant perd toutes les terres qu'il détient dans l'ancienne."
 game_concept_clerical_title_desc: "Un $game_concept_clerical_title$ est un [ecclesiastical|E] [title|E] de la [clergy|E] régissant un [clerical_region|E] au sein d'un [faith|E]. Parmi les idéologies [christian|E], c'est un [archdiocese|E].\n\nLe titulaire est le [religious_superior|E] de la [clergy|E] dans cette région, et est généralement nommé par le [head_of_faith|E]."
 game_concept_commander_trait_desc: "$game_concept_commander_traits$ sont des [traits|E] spéciaux qui confèrent des avantages utiles aux personnages lorsqu'ils agissent comme [army|E] [commanders|E].\n\nLes Traits de Commandant sont généralement acquis par les enfants élevés avec la Sécurité [education_focus|E], mais peuvent également être obtenus par le [martial_lifestyle|E] et d'autres moyens."
 game_concept_complete_control_desc: "Cette condition est remplie lorsque tous les [de_jure|E] parlementaires [titles|E] du titre ciblé sont détenus soit par le [ruler|E] soit par leur [vassals|E] et qu’aucune de ses circonscriptions n’est [occupied|E] par des [armies|E] hostiles"
 game_concept_complete_control_region_desc: "Cette condition est remplie lorsque tous les [counties|E] dans le [region|E] ciblé sont détenus soit par le dirigeant soit par leur [vassals|E] et qu’aucune de ses circonscriptions n’est occupée par des armées hostiles"
 game_concept_confederation_desc: "Une relation qui lie [tribal|E] ou [nomadic|E] [rulers|E] dans une défense mutuelle, similaire à un [alliance|E]. Formée par le #high $call_for_confederation_decision$#! [decision|E], une confédération exige que ses membres rejoignent les [wars|E] défensifs des uns et des autres. Les confédérations sont visibles dans l'onglet Charisme.\n\n Les camarades [confederates|E] ne peuvent également pas s'attaquer ou [raid|E] entre eux. Ils sont limités à des niveaux élevés de [tribal_authority|E] et [nomadic_authority|E], et ne peuvent pas créer de nouveaux [titles|E].\n\n[confederates|E] peuvent utiliser le #high $leave_confederation_decision$#! [decision|E] ou [migrate|E] pour devenir [independent|E]. Si une confédération ne reste qu'avec un seul membre, elle est détruite."
 game_concept_contestant_desc: "Pour participer à [GetActivityType( 'activity_tournament' ).GetName] [contests|E], vous devez remplir ses exigences. Les jeux de société permettent à tous les personnages de participer, tandis que d'autres, comme la lutte, dépendent des règles de sécurité.\n\nLes personnages ne participant pas seront [spectators|E], et les [contestants|E] potentiels peuvent choisir de ne pas participer s'ils souhaitent observer.\n\nL'éligibilité à entrer dans les concours est déterminée par le sexe et la santé, selon le [culture|E] et le [religion|E] de l'hôte."
 game_concept_convert_county_desc: "UN [councillor_task|E] effectué par le [court_chaplain|E] qui cible un [county|E] d'un [faith|E] différent — ou d'un même Idéologie mais un [rite|E] différent — que le [liege|E].\nLa progression augmente chaque mois, et à 100 %, la majorité de la Circonscription Cible adopte l'Idéologie du Chef de la Maison. Le nouveau [rite|E] suit le [liege|E] lorsque l'Idéologie résultante correspond à celle du Chef du Parti — sinon, il s'agit de l'Idéologie propre au Chapelain.\n\nLa vitesse de conversion est affectée par de nombreux facteurs, y compris le [councillor|E] du [learning_skill|E] et le [fervor|E] des Idéologies impliquées. Un Chapelain dont le [rite|E] diffère de celui du [liege|E] convertit plus lentement.\nLors d'un changement uniquement [rite|E], [fervor|E] favorise l'Idéologie principale au-dessus de #V 50 %#! et les Idéologies non principales (y compris celles dissidentes) en dessous."
 game_concept_convince_dejure_desc: "Un [councillor_task|E] réalisé par le [steward|E]. Il cible un [de_jure|E] [county|E] du [liege|E] du ministre qui appartient à un [independent|E] [ruler|E]. Lorsque la circonscription est convaincue, elle demandera à son [ruler|E] de les libérer à leur [de_jure|E] [liege|E]."
 game_concept_coronation_anointment_desc: "L'onction est un type de [coronation|E], où le [ruler|E] cherchera leur [head_of_faith|E], ou les responsables du parti [head_of_rite|E] lorsqu'il n'y en a pas, pour bénir leur accession au trône. Dans certaines idéologies, cela est nécessaire pour être véritablement considéré comme un [legitimate|E] dirigeant de leurs terres.\n\nPour obtenir le soutien de cette autorité, le [host|E] peut utiliser le [anointment_request|E] [interaction|E]."
 game_concept_council: "Cabinet"
 game_concept_council_desc: "Le $game_concept_council$ est l'équipe principale de [councillors|E] du leader, chacun dirigeant un département. Ils peuvent se voir confier des [councillor_tasks|E] importants."
 game_concept_councillor: "Ministre"
 game_concept_councillor_desc: "Les ministres sont les principaux assistants de tout [ruler|E], et composent le [council|E]. Il y a six postes au sein du cabinet : [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (ou [realm_priest|E]), et enfin votre [spouse|E].\n\nChacun est responsable d'un département auquel on peut assigner différentes [councillor_tasks|E] pour accomplir des tâches.\n\n[powerful_vassals|E] sera contrarié s'il n'est pas nommé à l'un de ces postes, ce qui signifie que vous devez souvent choisir entre apaiser un parlementaire influent ou nommer quelqu'un de réellement compétent.\n\nÊtre ministre pour votre [liege|E] vous donne un bonus, qui augmente avec le [rank|E] du chef du parti."
 game_concept_councillor_task: "Tâche ministérielle"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ sont des emplois importants qui peuvent être confiés à votre [councillors|E]. Ces tâches peuvent être générales ou cibler spécifiquement un [county|E] ou [court|E].\n\nSi vous avez un [relation|E] avec un ministre, les tâches ayant un temps de réalisation peuvent prendre plus ou moins de temps.\n\n#weak Notez que les ministres ne sont pas physiquement présents pour réaliser ces tâches, mais se contentent de diriger les efforts.#!"
 game_concept_councillor_task_possible_side_effects_desc: "Un [councillor_task|E] peut avoir des conséquences inattendues au fil du temps. Celles-ci peuvent être bonnes ou mauvaises, les effets positifs étant plus probables plus le [skill|E] pertinent du Ministre est élevé, et les effets négatifs étant plus probables plus la Compétence pertinente est faible."
 game_concept_councillor_tasks: "Tâches ministérielles"
 game_concept_councillors: "Ministres"
 game_concept_counties: "Circonscriptions"
 game_concept_county: "Circonscription"
 game_concept_county_capital: "Capitale de circonscription"
 game_concept_county_capital_desc: "Le $game_concept_county_capital$ est le principal [holding|E] d'un [county|E]. Cette détention ne peut jamais être détruite ou [leased|E] et est toujours possédée par le [ruler|E] qui détient la [title|E] de la circonscription.\n\nLes capitales de circonscription permettent la construction d'un [building|E] supplémentaire par rapport à une détention moindre."
 game_concept_county_capitals: "Capitales de circonscription"
 game_concept_county_control: "Contrôle de circonscription"
 game_concept_county_control_desc: "$game_concept_county_control$ mesure l'emprise que le gouvernement a sur la population d'un [county|E]. Cela est crucial surtout pour collecter [taxes|E] auprès du [holdings|E].\n\nLorsqu'une circonscription change de mains par [war|E], le contrôle chute drastiquement, ce qui est une bonne raison de vassaliser le [holder|E] actuel à la place (si le [casus_belli|E] le permet). Le contrôle de la circonscription peut également être endommagé par [sieges|E] et [Concept( 'peasant_faction', 'Peasant Uprisings' )|E].\n\nUn faible contrôle peut mener à [county_corruption|E], et le moyen principal d'augmenter le contrôle est un [councillor_task|E] disponible pour votre [marshal|E]."
 game_concept_county_corruption: "Corruption de circonscription"
 game_concept_county_corruption_desc: "Lorsqu'un [county|E] a un faible [control|E] ou que son [holder|E] est en [debt|E], la Circonscription pourrait acquérir $game_concept_county_corruption$. Ce sont divers types de [county_modifiers|E] négatifs.\n\n$game_concept_county_corruption$ disparaîtront avec le temps, mais si la cause principale persiste ([debt|E] ou faible [control|E]), ils peuvent réapparaître.\n\nLe $councillor_marshal$ $task_increase_control$ $game_concept_councillor_task$ peut éliminer $game_concept_county_corruption$ plus rapidement."
 game_concept_county_fertility: "Fécondité de la circonscription"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ existe dans [counties|E] situé à l'intérieur du [the_great_steppe|E], et peut être pâturé par [GetGovernment( 'nomad_government' ).GetName] [rulers|E] pour augmenter leur [herd|E].\n\n La Fertilité d'une circonscription représente la qualité de ses pâturages.\n\n La fertilité se stabilise autour du [fertility_equilibrium|E], permettant aux dirigeants nomades avec un grand [domain_limit|E] de soutenir la croissance de leur troupeau. La fertilité est affectée par le [steppe_seasons|E] et lentement reconstituée par le [herders|E].\n\n Lorsque la fertilité d'un [realm|E] est faible, c'est un signe pour [migrate|E].\n\n[county_control|E] ralentit le taux de croissance de la Fertilité d'un pourcentage égal au contrôle actuel."
 game_concept_county_modifier: "Modificateur de circonscription"
 game_concept_county_modifiers: "Modificateurs de circonscription"
 game_concept_county_opinion_desc: "La population générale de chaque [county|E] a un [opinion|E] du [character|E] qui détient leur $game_concept_county$. Si la population est mécontente, elle peut lancer ou rejoindre un [peasant_faction|E] ou [popular_faction|E], dont l'un ou l'autre peut rapidement se répandre dans tout un [realm|E].\n\nLe moyen le plus facile de contrôler $game_concept_county_opinion$ est de s'assurer que le $game_concept_county$ [holder|E] est du même [culture|E] et [faith|E] que la population.\n\n$game_concept_county_opinion$ d'avoir un [faith|E] différent est modifié à la fois par le [faith_hostility|E] et le [fervor|E] de la circonscription, variant linéairement entre 0 et 100 $game_concept_fervor$."
 game_concept_court: ""
 game_concept_court_amenities: "Équipements de bureau"
 game_concept_court_amenity: "Équipements de bureau"
 game_concept_court_artifact: "Artefact du Bureau"
 game_concept_court_artifact_desc: "Un artefact de bureau est un [artifact|E] qui est exposé dans le [royal_court|E] d'un [ruler|E], comme des tapisseries ou des livres magnifiquement illustrés.\n\nLes artefacts de bureau sont un facteur déterminant du [court_grandeur|E] d'un bureau privé.\n\nIl n'y a pas de limite au nombre d'artefacts qu'un personnage peut posséder, mais seuls ceux exposés dans un emplacement de leur type ont un effet.\n\nVous pouvez créer de nouveaux artefacts de bureau à partir de [inspired|E] [characters|E], à partir de la décision sur l'artefact de commission, ou en choisissant de [reforge|E] un [inventory_artifact|E]"
 game_concept_court_artifacts: "Artefacts du Bureau"
 game_concept_court_chaplain: "Chef de la Chambre"
 game_concept_court_chaplain_desc: "Le $game_concept_court_chaplain$ est le [councillor|E] responsable des affaires religieuses et spirituelles dans [faiths|E] avec le [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E].\n\nLes idéologies avec la Position Politique [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] ont le [realm_priest|E] beaucoup plus puissant (et problématique) au lieu d'un $game_concept_court_chaplain$."
 game_concept_court_chaplain_possessive: "Chef de la Chambre"
 game_concept_court_chaplains: "Leaders de la Chambre"
 game_concept_court_chaplains_possessive: "Des leaders de la Chambre"
 game_concept_court_desc: "Chaque politicien a un $game_concept_court$ : les [unlanded|E] qui travaillent pour lui. \n\n Ces [courtiers|E] sont sa famille, ses conseillers, ses chercheurs et ses suiveurs."
 game_concept_court_event: "Événement de bureau"
 game_concept_court_events: "Événements du bureau"
 game_concept_court_grandeur: "Grandeur du bureau"
 game_concept_court_grandeur_desc: "Le [royal_court|E] de $game_concept_court_grandeur_value$ montre à quel point l'Office est célèbre, et débloque de nouveaux [court_grandeur_levels|E] à mesure qu'il augmente.\n\nLa valeur varie entre 0 et 100, et au fil du temps se stabilisera à sa valeur de référence. La valeur de référence est influencée par des éléments tels que [dynasty_perks|E], combien vous dépensez en [court_amenities|E], et si vous possédez des [court_artifacts|E] magnifiques.\n\nUne portion de Grandeur est perdue lors de [succession|E]."
 game_concept_court_grandeur_expectation: "Grandeur du bureau Attente"
 game_concept_court_grandeur_expectations: "Attentes de grandeur du bureau"
 game_concept_court_grandeur_level: "Niveau de Grandeur du Bureau"
 game_concept_court_grandeur_level_desc: "Le niveau de grandeur d'un [royal_court|E] donne des bonus à son propriétaire, et est débloqué à mesure que le [court_grandeur_value|E] du bureau augmente.\n\nEn plus des effets de chaque niveau, on s'attend à ce que les grands [realms|E] aient atteint des niveaux de grandeur plus élevés. Cela est connu sous le nom de [court_grandeur_expectations|E]."
 game_concept_court_grandeur_levels: "Niveaux de grandeur de bureau"
 game_concept_court_grandeur_value: "Valeur de la grandeur du bureau"
 game_concept_court_guest: "Invité de bureau"
 game_concept_court_host: "Animateur de bureau"
 game_concept_court_host_desc: "Un $game_concept_court_host$ est un [ruler|E] qui n'est pas le chef de parti d'un personnage, mais qui l'a quand même dans son [court].\n\nIl y a plusieurs raisons possibles pour lesquelles cela peut se produire, comme [wanderers|E] visitant un Dirigeant ou [wards|E] restant dans le même Bureau que leur [guardian|E]."
 game_concept_court_language: "Langue du bureau"
 game_concept_court_language_desc: "Une langue de bureau est la [language|E] officielle d'un [royal_court|E], parlée par la noblesse et utilisée par la bureaucratie.\n\n La valeur de base [court_grandeur|E] est augmentée pour chaque [realm|E] [county|E] qui partage la langue, pour chaque bureau privé qui parle la même langue de bureau, et si c'est la langue maternelle du [ruler|E]."
 game_concept_court_languages: "Langues de bureau"
 game_concept_court_position: "Nomination"
 game_concept_court_position_task: "Tâche de nomination"
 game_concept_court_position_tasks: "Tâches de nomination"
 game_concept_court_positions: "Nominations"
 game_concept_court_type: "Type de bureau"
 game_concept_court_type_desc: "Dans le cadre de leur [royal_court|E], [rulers|E] peut avoir un $game_concept_court_type$ désigné.\n\nChaque $game_concept_court_type$ fournit au Dirigeant et au [court|E] leur propre ensemble d'avantages, selon [court_grandeur_level|E].\n\nLe [ethos|E] du [culture|E] d'un Dirigeant détermine quels types de bureaux ils peuvent avoir.\n\nLes différents types de bureaux sont :\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "Trait de type de bureau"
 game_concept_court_type_trait_desc: "Après avoir servi [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] années dans un [royal_court|E], un [courtier|E] reçoit un [trait|E] reflétant le [court_type|E] de ce tribunal.\n\nLa qualité de ce trait est déterminée par la durée pendant laquelle le [character|E] a servi en tant que collaborateur au sein du bureau."
 game_concept_court_types: "Types de bureaux"
 game_concept_courtier: "Membre du personnel"
 game_concept_courtier_desc: "Un $game_concept_courtier$ est un personnage [unlanded|E] qui sert un [ruler|E] dans leur [court|E].\n\nLe personnel peut :\n$BULLET_WITH_TAB$Servir comme [councillors|E]\n$BULLET_WITH_TAB$Servir dans [court_positions|E]\n$BULLET_WITH_TAB$Servir dans [armies|E] en tant que [commanders|E] ou [knights|E]\n$BULLET_WITH_TAB$Devenir le [vassal|E] de leur dirigeant si un [title|E] leur est accordéZZ\n$BULLET_WITH_TAB$Laisser leur dirigeant presser leur [claims|E] dans [war|E]\n\n#WEAK [adventurers|E] avoir [followers|E] au lieu de $game_concept_courtiers$ — ils remplissent le même rôle, bien que généralement plus malodorants et avec plus de boue.#!"
 game_concept_courtiers: "Personnel"
 game_concept_courts: "Bureaux"
 game_concept_criminal_task_contract_desc: "Un $game_concept_criminal_task_contract$ implique généralement des contrats douteux qui peuvent être lucratifs, mais vous récompenseront @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\n Monter de niveau le $trait_gallowsbait$ [trait|E] fera que la plupart des gens dans le monde vous détesteront davantage et vous respecteront moins, et finira par provoquer [followers|E] de vos employés qui désapprouvent vos brigandages à quitter dramatiquement votre service.\n\n#WEAK $trait_gallowsbait$ est un $game_concept_trait$ très négatif, signifiant qu'un personnage est un criminel de bas étage — au moins un meurtre au bureau a une sorte de #EMP classe#!.\n\n Il peut être complètement effacé avec le [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E].#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ représente le pouvoir général qu'un [ruler|E] exerce sur son [vassals|E].\n\nIl y a quatre niveaux de $game_concept_crown_authority$ ; [autonomous_vassals|E], [limited|E], [high|E] et [absolute|E]. Augmenter $game_concept_crown_authority$ coûte une quantité de [prestige|E] selon le niveau et le [learning_skill|E] du souverain.\n\n#weak Les députés de second rang n'aiment pas les niveaux plus élevés de $game_concept_crown_authority$, et le baisser est l'objectif principal de tout [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_culture_head_desc: "Un '$game_concept_culture_head$' est le [ruler|E] qui a le plus d'influence sur son propre [culture|E].\n\nPlus précisément, le dirigeant ayant le plus grand nombre total de [counties|E] de même culture dans son [realm|E] deviendra le $game_concept_cultural_head$, peu importe où se trouve son [domain|E] ou quelles circonscriptions d'autres cultures il peut posséder.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\nLe $game_concept_cultural_head$ peut influencer quel [innovation|E] doit être priorisé pour la découverte en définissant le [cultural_fascination|E].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "A slow process by which a [title|E]'s [de_jure|E] [liege|E] can change. It occurs naturally when a [duchy|E] or [kingdom|E] is completely controlled by a [ruler|E] who does not hold the territory's de jure party leader title.\n\nThis process can be sped up by assigning your [chancellor|E] to the appropriate [councillor_task|E] #weak ($task_integrate_title$)#!. Regions can only $game_concept_de_jure_drift$ into Nations, and Nations can only Drift into [empires|E].\n\nLetting titles De Jure Drift into your [primary_title|E] is a good way to get rid of the [rightful_liege|E] penalty."
 game_concept_de_jure_drift_desc_part_2: "#weak Exemple : La Région de $d_northumberland$ fait partie de jure de $k_england$, mais le territoire de la région est entièrement situé dans $k_scotland$. Comme le Roi de $k_scotland$ ne détient pas également $k_england$, la région commencera à $game_concept_de_jure_drift$ pour devenir une partie de $k_scotland$. #!"
 game_concept_death_religion: "Camp politique"
 game_concept_death_religion_desc: "Être passé dans l'autre monde par des adversaires et l'exécution sacrilège de votre enveloppe mortelle — martyre, crucifixion — rester fidèle à votre idéologie jusqu'à la fin, quelle manière plus authentique y a-t-il de passer à autre chose."
 game_concept_debt_desc: "La dette est l’état d’un montant négatif de [gold_i][gold|E]. Cela arrive généralement lorsqu’un [ruler|E] en guerre engage [mercenaries|E] sans avoir assez de fonds pour couvrir la totalité des coûts, ou lorsqu’il est en guerre trop longtemps. \n\n Lorsque vous êtes endetté, vous ne pouvez pas déclarer de nouveaux [wars|E], vos [men_at_arms|E] ne se renforcent pas, et vos ennemis auront un [advantage|E] sur vous au combat. Plus vous vous endetterez, plus vous recevrez de pénalités — moins de [levies|E], [county_opinion|E] réduits, et votre [vassals|E] vous appréciera moins. \n\nI En plus de cela, divers autres événements déstabilisateurs mineurs peuvent survenir, comme gagner [county_corruption|E] dans votre [domain|E] [counties|E]. \n\n#help Il est généralement conseillé de frapper vos ennemis lorsqu’ils sont en dette, car ils combattront avec une [advantage|E] réduite ! #!"
 game_concept_demand_conversion_desc: "[rulers|E] qui ont un sujet d'un autre [faith|E] peuvent Demander Conversion pour changer l'Idéologie de leur sujet à la leur. La compétence [learning|E] du Dirigeant et le [opinion|E] du partisan envers leur chef de parti sont des facteurs majeurs pour déterminer si le sujet accepte la demande, ou la [Concept('refuse_conversion_crime','refuses')|E]."
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$ gouverne la manière dont un [diarch|E] atteint chaque [mandate|E] fixé par son [liege|E].\n\n Tant [skills|E] que [personality_traits|E] jouent un rôle. Par exemple, un [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$ chargé du mandat '$fill_coffers_mandate$' peut ne pas envoyer autant de [gold|E] à son chef de parti.\n\n#WEAK [diarchs|E] sont bien adaptés à un $game_concept_mandate$ lorsqu'ils ont environ 40+ $game_concept_aptitude$ pour cela.#!"
 game_concept_diarch_power_desc: "Un [diarch|E] dans un [power_sharing|E] actif a accès à des $game_concept_diarch_powers$ spéciaux.\n\nCe sont des [character_interaction|E] spéciaux qui imitent ceux que leurs [liege|E] possèdent, ou sont d'autres abus de pouvoir. Des exemples incluent [revoking|E] [titles|E] d'autres [vassals|E], ou siphonner des [gold|E] du chef de leur Parti.\n\nDe nombreux $game_concept_diarch_powers$ donnent au chef du Parti une opportunité de [veto|E] les."
 game_concept_diplomacy: "Charisme"
 game_concept_diplomacy_lifestyle: "Mode de vie Charisme"
 game_concept_diplomacy_skill: "Compétence Charisme"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ est un [skill|E] pour le charme, la persuasion et la conclusion d'accords : animer une salle, convaincre les collègues et finaliser un accord.\n\nIl affecte directement le [opinions|E] que les autres personnages ont de vous, et développe le Charisme [schemes|E].\n\nLe [lifestyle|E] correspondant est le [diplomacy_lifestyle|E]."
 game_concept_diplomacy_task_contract: "Contrat de Charisme"
 game_concept_diplomacy_task_contract_possessive: "du Contrat de Charisme"
 game_concept_diplomacy_task_contracts: "Contrats de Charisme"
 game_concept_diplomacy_task_contracts_possessive: "des Contrats de Charisme"
 game_concept_direct_vassal: "Député de base direct"
 game_concept_direct_vassals: "Députés de base directs"
 game_concept_directed_great_holy_war_desc: "Un $game_concept_directed_great_holy_war$ est déclaré par un $doctrine_temporal_head_name$ [head_of_faith|E] dans l'intention de placer un [kingdom|E] sous leur propre domination.\n\n[rulers|E] de leur [faith|E] peut choisir d'aider le chef du Mouvement, et peut recevoir des récompenses pour cela. Les récompenses incluent [piety|E] et potentiellement que leur [dynasty|E] devienne [landed|E] au sein de la Nation conquise.\n\nLes dirigeants du [religion|E] ciblé peuvent choisir de se défendre contre cette guerre sans avoir besoin d'un [alliance|E]."
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ est le niveau le plus bas de [tribal_authority|E]. À ce niveau, [vassals|E] n'ont aucun malus [opinion|E] envers leur [liege|E], et le chef du parti n'a aucun pouvoir sur eux, à part la capacité d'exiger [levies|E] et [taxes|E]."
 game_concept_dissolution_faction_desc: "Le [dissolution_faction|E] cherche à détruire le [realm|E] de leur [liege|E]. S'ils réussissent, tous les députés de base du parti deviennent [independent|E], et leur chef de parti perd son [primary_title|E]."
 game_concept_doctrine: "Position politique"
 game_concept_doctrine_knowledge: "Connaissance de la position politique"
 game_concept_doctrines: "Positions politiques"
 game_concept_doctrines_desc: "Les positions politiques sont ce que représente un [faith|E] : fiscalité et dépenses, propriété, immigration, Europe, l'Union et les libertés civiles. Les projets de loi qui s'opposent aux positions politiques d'un député rendent une rébellion plus probable."
 game_concept_domain: "Portefeuille"
 game_concept_domain_desc: "Le $game_concept_domain$ d'un politicien est tout ce qu'il possède personnellement : son siège et ses circonscriptions.\n\n Le [domain_limit|E] signifie qu'un dirigeant doit s'appuyer sur [vassals|E] pour diriger plus que quelques sièges."
 game_concept_domain_fertility: "Fertilité du portefeuille"
 game_concept_domain_fertility_desc: "La fertilité du portefeuille est le total [county_fertility|E] de tous vos [counties|E] détenus."
 game_concept_domain_income: "Revenus du portefeuille"
 game_concept_domain_limit: "Limite du portefeuille"
 game_concept_domain_size: "Taille du portefeuille"
 game_concept_domain_taxes: "Taxes du portefeuille"
 game_concept_domains: "Portefeuilles"
 game_concept_dominant_family_desc: "Un $game_concept_dominant_family$ est un [powerful_family|E] qui a étendu son contrôle loin et largement. Ils sont considérés comme les [house|E] les plus influents au sein d'un [realm|E].\n\nUn membre d'un $game_concept_dominant_family$ est encore meilleur en [political_schemes|E] et est encore plus susceptible d'obtenir ce qu'il veut lors de [interacting|E] avec d'autres [characters|E].\n\nUn $game_concept_house$ doit contrôler au moins [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] du Parti pour devenir dominant."
 game_concept_dread: "Influence"
 game_concept_dread_desc: "$game_concept_dread$ correspond à combien un [ruler|E] est craint : le dirigeant qui licencie des ministres sans sourciller, le whip qui n'oublie jamais une rébellion.\n\nLes politiciens gagnent du $game_concept_dread$ par des actes impitoyables : licenciements, purges et en donnant l'exemple des rebelles ou [prisoners|E].\n\nLe pouvoir rend possible de diriger comme un [tyrant|E], car des [vassals|E] indisciplinés peuvent devenir [intimidated|E] ou [cowed|E], les rendant trop effrayés pour s'opposer à vous.\n\nLa puissance d'un personnage peut varier de 0 à 100, sauf pour [nomads|E], qui peut atteindre 150. Avec le temps, leur puissance tendra vers leur puissance naturelle, définie par leur [personality_traits|E].\n\n#high Un [ruler] redoutable bénéficie des avantages suivants :#!\n$BULLET_WITH_TAB$[vassals] sont découragés de rejoindre [factions|E]\n$BULLET_WITH_TAB$[vassals] sont découragés de [scheming|E]\n$BULLET_WITH_TAB$Augmente l'acceptation de [vassal] #weak (ex. Révocation de titre)#!\n$BULLET_WITH_TAB$Augmente l'acceptation de [offer_vassalization|E]\n$BULLET_WITH_TAB$Rend [electors|E] plus susceptible de voter comme vous\n$BULLET_WITH_TAB$Rend les députés de base peu enclins à s'opposer aux changements [law|E]\n\n#weak Notez que les [vassals] courageux et audacieux sont moins affectés par le pouvoir !#!"
 game_concept_dreaded: "Formidable"
 game_concept_dreadful: "Formidable"
 game_concept_dreams_desc: "Les personnages qui suivent une idéologie avec la cause de divination peuvent occasionnellement faire des rêves. Ces rêves peuvent ensuite être divinés par un mystique ce qui peut avoir une variété de résultats, bons comme mauvais."
 game_concept_duchies: "Régions"
 game_concept_duchy: "Région"
 game_concept_duchy_building: "Bâtiment régional"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ sont des [buildings|E] puissants qui ne peuvent être construits que dans le [de_jure_capital|E] d'un [duchy|E]. Un seul type peut être construit dans chaque région.\n\n$game_concept_duchy_buildings$ ne sont actifs que si le propriétaire détient également le [title|E] de la région associé.\n\nBeaucoup de $game_concept_duchy_buildings$ ont des modificateurs qui affectent tous les [holdings|E] dans la région, en faisant des outils puissants pour spécialiser votre [domain|E]."
 game_concept_duchy_buildings: "Bâtiments régionaux"
 game_concept_duchy_desc: "Un $game_concept_duchy$ est un [title|E] un [title_tier|E] en dessous d'un [kingdom|E] et un au-dessus d'un [county|E].\n\nLe [holder|E] d'un $game_concept_duchy$ a [de_jure|E] des droits sur ses $game_concept_counties$ constituants et peut avoir [counts|E] en tant que [vassals|E].\n\nLes régions peuvent être dormantes et n'avoir aucun titulaire actuel. De tels $game_concept_title_succession$ peuvent être créés par un [ruler|E] qui contrôle au moins la moitié de son $game_concept_counties$."
 game_concept_dynasty_perks: "Legs des partis"
 game_concept_dynasty_prestige: "Marque du parti"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$ est la réputation d'un parti dans son ensemble : ce que les électeurs pensent que son nom représente, et les portes qu'il ouvre pour ses membres.\n\nA [dynasty|E] gagne $game_concept_dynasty_prestige$ de ses membres vivants, des membres qui occupent un poste et des membres mariés à d'autres titulaires de poste.\n\nCela compte pour le [dynasty_prestige_level|E] du parti, et le chef du parti peut le dépenser en [dynasty_perks|E]."
 game_concept_dynasty_prestige_level: "Niveau de la marque du parti"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\nCeci est le plus haut niveau de marque de Parti."
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ est une mesure de la renommée d'un [dynasty|E]. La progression de niveau se fait chaque fois que votre Dynastie gagne [dynasty_prestige|E]. Les personnages reçoivent une certaine quantité de [prestige|E] initial à leur naissance en fonction de leur $game_concept_dynasty_prestige_level$. De même, [spouses|E] gagnent un certain Profil de la Dynastie des autres lorsqu'ils [marry|E].\n\nLes niveaux sont : \n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "Une [interaction|E] à travers laquelle [ecclesiastical|E] [rulers|E] peut faire en sorte que des dirigeants séculiers de même [faith|E] déclarent [holy_war|E] contre des dirigeants d’idéologie hostile."
 game_concept_ecumenical_councils: "Cabinets œcuméniques"
 game_concept_eminent_holy_site: "Éminence du Cœur"
 game_concept_eminent_holy_site_desc: "Un $game_concept_eminent_holy_site$ est un [holy_site|E] d'une grande importance pour un [faith|E]. Chaque idéologie ne peut désigner que quelques-uns de ses $game_concept_holy_sites$ comme Éminents.\n\nSeules les Heartlands Éminentes contribuent à des modificateurs qui affectent tous les partisans d'une idéologie."
 game_concept_eminent_holy_sites: "Terres éminentes"
 game_concept_empire: "Royaume-Uni"
 game_concept_empires: "Syndicats"
 game_concept_enshrined_desc: "Un [holy_relic|E] consacré à un [holy_site|E] active des bonus du cœur du territoire et améliore les bonus qu'il accorde, proportionnellement au nombre total de niveaux [rarity|E] de tous les artefacts consacrés.\n\nUn artefact consacré n'appartient plus à un personnage, mais peut être utilisé par le détenteur de [holder|E], [top_liege|E] ou [clerical_region|E] du cœur du territoire. L'artefact ne se détériorera plus. Vous ne pouvez consacrer que des reliques sacrées pour votre propre [faith|E] ; les reliques sacrées consacrées d'autres idéologies ne fourniront aucun avantage.\n\nIl peut y avoir des récompenses ou des coûts associés à la consécration ou au retrait d'un artefact consacré."
 game_concept_entrenched_regency_desc: "Si un [regency|E] dure trop longtemps, il peut devenir Enraciné, et le [regent|E] devient encore plus puissant par rapport à leur [liege|E].\n\nLes avantages que le [regent|E] obtient du [scales_of_power|E] deviennent beaucoup plus puissants.\n\nPour mettre fin à un $game_concept_entrenched_regency$, le Régent doit accepter un cadeau de leur Chef de Parti, ou le Chef de Parti doit faire pencher la Balance en leur faveur."
 game_concept_escalated_peasant_factions: "Mouvements de Protestation Intensifiés"
 game_concept_expected_legitimacy: "Mandat prévu"
 game_concept_expected_legitimacy_desc: "Le [legitimacy_level|E] que [vassals|E] attendent de leur [ruler|E], basé sur leur relation historique. Certains facteurs qui abaissent les attentes sont : \n$BULLET_WITH_TAB$ Être le [de_jure|E] [liege|E] du député de base \n$BULLET_WITH_TAB$ Faire partie du [close_family|E] du député de base \n$BULLET_WITH_TAB$ Être le [preferred_heir|E] du député de base \n$BULLET_WITH_TAB$ Avoir le même [dynasty|E] que le député de base a servi pendant plus de #color_white 50 #! ans \n$BULLET_WITH_TAB$ Ne pas être un [powerful_vassal|E] \n\n Si le niveau réel est inférieur à leurs attentes, ils peuvent devenir indisciplinés : leur [opinion|E] sera plus bas et ils peuvent rejoindre [factions|E] contre leur [liege|E]. \n\n Les attentes augmentent avec le niveau de leur [primary_title|E], ainsi qu'avec le [era|E]."
 game_concept_external_clerical_puppet_desc: "Un membre puissant du [clergy|E] — un [archbishop|E] ou même le [head_of_faith|E] — qui est devenu le [puppet|E] d'un autre [ruler|E].\n\nPlus le clerc est puissant, plus sa portée est grande : un leader du Mouvement manipulé peut [excommunicate|E] vos ennemis, nommer [cardinals|E], accorder un [pressed_claim|E] ou inciter un [holy_war|E] en votre nom."
 game_concept_faction_desc: "Un $game_concept_faction$ est un groupe de [vassals|E] ayant des intérêts politiques communs. La population locale de [counties|E] peut également rejoindre certains types de factions, comme le Mouvement de Protestation.\n\nLes factions deviennent dangereuses une fois que leur [faction_discontent|E] atteint un certain point, moment auquel elles émettront un ultimatum.\n\nSi le [liege|E] ne se conforme pas, la faction se soulèvera en révolte, déclenchant un [civil_war|E]. Si la faction se dissout avant la fin de la guerre, le chef du parti doit avoir au moins [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E] pour gagner la guerre."
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$ est une mesure de la force militaire totale d'un [faction|E] par rapport à leur cible.\n\nChaque membre individuel de la faction ajoute toute sa force à la Faction tant qu'il reste dans la Faction. Si la cible de la faction est le [liege|E] d'un membre, la force du membre est également soustraite de la puissance relative du chef du parti."
 game_concept_faith: "Idéologie"
 game_concept_faith_astray: "Divergent"
 game_concept_faith_astray_desc: "Ce [rite|E] est dans votre camp politique ou dans un voisin : vous n'êtes pas d'accord sur les détails.\n\n#S Effets :\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "Un $game_concept_faith$ est le credo politique d'un politicien, au sein d'un plus grand [religion|E]. Chaque personnage et [county|E] en possède un : l'idéologie d'une circonscription est l'inclinaison de ses électeurs, et elle dérive vers celle de son député.\n\n Les [doctrines|E] d'une idéologie sont ses positions politiques et ses [core_tenets|E] ses causes emblématiques. Son [fervor|E] est le niveau d'engagement de ses militants.\n\n Les politiciens de différentes idéologies s'apprécient moins, d'autant plus que leurs camps sont éloignés. N'importe qui peut changer d'avis (la décision Change Your Politics), à un prix."
 game_concept_faith_evil: "Irréconciliable"
 game_concept_faith_evil_desc: "Ce [rite|E] souhaite l'avenir constitutionnel opposé : nationaliste contre unioniste.\n\n#S Effets:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "Opposé"
 game_concept_faith_hostile_desc: "Ce [rite|E] est à travers le principal clivage politique, gauche contre droite.\n\n#S Effets :\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "Distance idéologique"
 game_concept_faith_hostility_desc: "Tous [faiths|E] ont une relation les uns envers les autres qui est déterminée par la distance entre leurs politiques.\n\nLes idéologies du même ou d'un voisin [religion|E] ne sont pas d'accord sur les détails ; gauche et droite sont opposées ; nationalistes et unionistes sont irréconciliables.\n\nLes relations suivantes existent : [faith_righteous|L], [faith_astray|L], [faith_hostile|L], et [faith_evil|L]."
 game_concept_faith_righteous: "Partageant les mêmes idées"
 game_concept_faith_righteous_desc: "Ce [rite|E] partage votre politique.\n\n#S Effets:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "De l'idéologie"
 game_concept_faiths: "Idéologies"
 game_concept_feast_desc: "Un [activity|E] où des dirigeants et du personnel d'un parti se réunissent pour célébrer... une chose ou une autre.\n\n Les participants perdront [stress|E] et augmenteront leur [opinion|E] de l'hôte. Il peut également y avoir de nombreuses autres conséquences à rassembler autant de personnes.\n\nA [ruler|E] invitera leurs [liege|E] et leurs [vassals|E] (ainsi que divers [courtiers|E]) à un $activity_feast$."
 game_concept_fervor: "Conviction"
 game_concept_fervor_desc: "Le $game_concept_fervor$ d'un [faith|E] varie de #V 0#! à #V 100%#!. Il mesure à quel point ses militants et électeurs sont motivés : participation, bénévoles et bruit.\n\nUn $game_concept_fervor$ élevé fait que les circonscriptions de l'idéologie se préoccupent davantage de la politique de leur député."
 game_concept_feudal_desc: "Sous le [government_form|E] féodal, un [liege|E] donne sa [vassals|E] [land|E] de gouverner en échange de [levies|E] et de [taxes|E], régulés par des [vassal_contract|E] individuels entre député d’arrière-ban et chef de parti."
 game_concept_flowery_war_desc: "Il s'agit d'un type spécial de [war|E], initié par un [ruler|E] dont le [faith|E] pratique le sacrifice humain. L'objectif principal de $game_concept_flowery_warring$ est de livrer bataille et de capturer [prisoners|E] pour le sacrifice, chaque camp pouvant obtenir suffisamment de [war_score|E] grâce au combat pour gagner sans jamais avoir à [siege|E].\n\nÀ la fin du $game_concept_war$, si le vainqueur (y compris le défenseur) suit un $game_concept_faith$ pratiquant le sacrifice humain, alors il prendra plusieurs $game_concept_prisoners$ provenant du [court|E] du perdant. Si les deux principaux combattants d'un $game_concept_flowery_war$ suivent la même idéologie, alors la guerre est considérée comme sacrée, ce qui signifie que le perdant reçoit toujours (réduit) [piety|E] même en cas de défaite.\n\nVous ne pouvez pas mener ou continuer un $game_concept_flowery_war$ si vous possédez des $game_concept_prisoners$ obtenus en remportant un $game_concept_flowery_war$ dans votre [dungeon|E]."
 game_concept_foreign_affairs_desc: "Un [councillor_task|E] réalisé par le [chancellor|E]. \nPour un [independent|E] [ruler|E], il augmente l'opinion que les autres dirigeants indépendants ont d'eux. Pour un député de rang inférieur, il augmente l'opinion que les autres députés de rang inférieur du même [liege|E] ont d'eux."
 game_concept_fp3_demand_submission_interaction_desc: "Exiger une fidélité [character_possessive|E] sous la forme d'un [hook|E] en utilisant le capital politique, la ruse ou l'intimidation."
 game_concept_gender_doctrines: "Positions sur la politique de genre"
 game_concept_gender_doctrines_desc: "Ces [doctrines|E] déterminent quels [gender_laws|E] sont disponibles pour les personnages du [faith|E].\n\nCela détermine également certaines règles supplémentaires, telles que quels [claims|E] peuvent être hérités, qui peut être [commanders|E] et [knights|E], et à quels [house|E] de leurs parents un [bastard|E] appartiendra.\n\nLes Positions de Politique de Genre sont :\n$BULLET_WITH_TAB$Dominé par les hommes\n$BULLET_WITH_TAB$Égal\n$BULLET_WITH_TAB$Dominé par les femmes"
 game_concept_gift_desc: "Envoyer un cadeau à un autre personnage augmentera leur [opinion|E] à votre égard en échange de [gold|E][gold_i].\n\nPlus le destinataire est gourmand, plus vous devrez envoyer de fonds et plus vous gagnerez d'opinion.\n\nPlus votre [diplomacy|E] est élevé, plus vous gagnerez d'opinion."
 game_concept_glory_desc: "Une [accolade_possessive|E] Gloire augmente sa [accolade_rank|E].\n\nLa gloire est gagnée par le [acclaimed_knight|E] remportant des [battles|E], en battant des guerriers, en participant à des [GetActivityType( 'activity_tournament' ).GetName] [contests|E], et en assistant à [activities|E].\n\nCependant, la gloire de l'Accolade diminue lorsque l'Organisateur Étoile est impliqué dans des batailles perdues, et peut également diminuer sur [accolade_succession|E] si l'Organisateur Étoile n'est pas mort au combat, lors d'un duel ou d'une autre manière honorable."
 game_concept_gold: "Fonds"
 game_concept_gold_desc: "Les fonds sont l'argent d'un politicien : dons, cotisations des membres et trésoreries de campagne. Ils servent à payer le personnel, les bureaux, les prospectus et les campagnes."
 game_concept_goliardic_shenanigans_desc: "Un personnage dans [GetActivityType('activity_adult_education').GetName] peut se livrer à toutes sortes de bêtises en embrassant la vie étudiante. Les conséquences de ses aventures sont imprévisibles et incluent des points [skill|E], le mode de vie et la pression [traits|E], l'expérience de vie, les maladies et les blessures."
 game_concept_government_authority_desc: "$game_concept_government_authority$ représente le pouvoir général qu'un [ruler|E] exerce sur son [vassals|E].\n\nDifférents [governments|E] ont différentes formes de $game_concept_government_authority$. Par exemple, [feudal|E] [realms|E] utilisent [crown_authority|E], [clans|E] utilisent [tribal_authority|E], et [administrative|E] utilisent [imperial_bureaucracy|E]. Augmenter $game_concept_government_authority$ coûte une quantité de [prestige|E] selon le niveau et le [learning_skill|E] du souverain.\n\n#weak Les députés de second rang n'aiment pas les niveaux plus élevés de $game_concept_government_authority$, et le baisser est l'objectif principal de tout [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!\n\nTous les [governments|E] n'ont pas $game_concept_government_authority$."
 game_concept_governor_desc: "Un $game_concept_governor$ est le député de base principal d'un [liege|E] avec un [government_bureaucratic_gov|E]. Ils sont nommés par leur chef de parti pour présider les terres au sein du [realm|E], en utilisant leur [governor_efficiency|E].\n\n Un $game_concept_governor$'s [title|E], ainsi que le [counties|E] qu'il inclut, est appelé un [province|E]. [governance_issues|E] peut apparaître à l'intérieur d'une province, que le $game_concept_governor$ doit résoudre.\n\n$game_concept_governors$ peut accumuler [influence|E] et manipuler le [succession|E] des autres $game_concept_governorships$."
 game_concept_great_holy_war_desc: "Un $game_concept_great_holy_war$ est un type spécial de [war|E] que seuls les [head_of_faith|E] de certains [faiths|E] peuvent déclarer, dans le but de soumettre un entire [kingdom|E] à la règle de leur idéologie.\n\n$game_concept_great_holy_wars$ cible tous les [rulers|E] d'un autre [religion|E] dans un [kingdom|E] choisi, les forçant à se défendre ensemble. En cas de victoire, tous les [titles|E] au sein de la Nation ciblée seront saisis et partagés entre les attaquants.\n\nSelon son [doctrines|E], une idéologie peut avoir accès à [directed_great_holy_wars|E], [undirected_great_holy_wars|E] ou à aucun $game_concept_great_holy_wars$:\n$EFFECT_LIST_BULLET$Le [GetTenetType('tenet_armed_pilgrimages').GetBaseName], [GetTenetType('tenet_struggle_submission').GetBaseName], ou [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E] sont requis pour avoir accès aux Grandes Guerres Saintes en général\n$EFFECT_LIST_BULLET$Les idéologies avec un Chef [GetDoctrineType('doctrine_temporal_head').GetBaseName] n'ont accès qu'aux Grandes Guerres Saintes Dirigées\n$EFFECT_LIST_BULLET$Les idéologies avec un Chef [GetDoctrineType('doctrine_spiritual_head').GetBaseName] n'ont accès qu'aux Grandes Guerres Saintes Non Dirigées\n$EFFECT_LIST_BULLET$Les idéologies sans Leader de Mouvement ne peuvent déclarer aucune Grande Guerre Sainte, même si elles seraient normalement éligibles\n\nCertaines idéologies ont des noms spéciaux pour leurs Grandes Guerres Saintes tels que 'Croisade' ou 'Djihad'. Ces Grandes Guerres Saintes diffèrent uniquement par le nom et fonctionnent comme n'importe quelle autre Grande Guerre Sainte."
 game_concept_great_project_desc: "Les Grands Projets sont des entreprises massives qui font appel à toutes les ressources de [realm|E].\n\nCertains Grands Projets impliquent la construction d'un [great_building|E], tandis que d'autres impliquent de se remettre d'un [natural_disaster|E].\n\nAlors que le [ruler|E] du Parti supervise le développement du Grand Projet, [subjects|E] peut offrir [great_project_contributions|E] pour aider à son avancement."
 game_concept_head_of_faith: "Chef du Mouvement"
 game_concept_head_of_faith_desc: "Un $game_concept_head_of_faith$ est le leader officiel d'un [faith|E]. Les pouvoirs et la nature du $game_concept_head_of_faith$ dépendent du [doctrines|E] de l’idéologie.\n\n Certaines idéologies ont un [spiritual_head_of_faith|E] #weak (par exemple le Pape)#!, d'autres un [temporal_head_of_faith|E] #weak (par exemple un Calife)#!, et certaines n'ont pas du tout de $game_concept_head_of_faith$."
 game_concept_head_of_faith_possessive: "du Chef du Mouvement"
 game_concept_head_of_rite: "Voix principale"
 game_concept_head_of_rite_desc: "Le [character|E] principal d’un [rite|E] : le politicien qui dirige la majorité de ses [counties|E]."
 game_concept_heads_of_faith: "Chefs du Mouvement"
 game_concept_herder_desc: "Les éleveurs sont retirés de tous les aspects du gouvernement. Ils ne commandent pas [armies|E], ne possèdent pas [buildings|E], ne créent pas [alliances|E], et ne déclarent pas [wars|E]. Quand [nomads|E] [migrate|E] un [holding|E], les éleveurs reconstitueront lentement le [county_fertility|E] local en raison de leur troupeau plus petit.\n\nIls sont intimidés par un véritable [nomad|E] [rulers|E] et céderont immédiatement leurs terres lorsqu'ils seront mis au défi."
 game_concept_heresies: "Groupes dissidents"
 game_concept_heresy: "Éclatement"
 game_concept_heresy_desc: "Lorsque la [fervor|E] d'un [faith|E] tombe à un niveau critique, une épidémie de Fragmentation peut éclater. Les épidémies se présentent sous trois formes de gravité croissante :\n#indent_newline:7 $BULLET_WITH_TAB$Un [rite|E] existant devient plus [rite_divergent|E] et se propage plus loin.#!\n#indent_newline:7 $BULLET_WITH_TAB$Un [rite_divergent|E] nouveau [rite|E] apparaît de manière significative et balaie les terres.#!\n#indent_newline:7 $BULLET_WITH_TAB$Pour les [faiths|E] chrétiens, une fragmentation historique telle que le bogomilisme ou le catharisme apparaît.#!\n\nA [faith|E] n'est réellement à risque de Fragmentation que lorsque son [mainline_rite|E] atteint au moins #V 100#! [counties|E]. En dessous de ce niveau, les deux formes les plus sévères ne peuvent pas éclater du tout, et même la plus légère est beaucoup plus rare.\n\nChaque épidémie se termine par une poussée unificatrice de $game_concept_fervor$."
 game_concept_heretical: "Breakaway"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ est le deuxième au plus haut niveau. [vassals|E] subissent une pénalité #N -20#! [opinion|E] à leur [liege|E]. \n\nA À ce niveau — en plus des pouvoirs que le chef du parti obtient à [limited_crown_authority|E] — les députés d’arrière-ban sous ce même chef ne peuvent plus se faire la guerre, le dirigeant peut changer entre tous les [succession_laws|E] disponibles, et les [titles|E] des députés ne peuvent pas être hérités par des dirigeants extérieurs à la [realm|E] du chef du parti. \n\nLastablement, refuser le titre [revocation|E] ou [retraction|E] député est considéré comme un [crime|E] même si le chef du parti n’a pas de justification suffisante."
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ est le niveau moyen de [nomadic_authority|E]. À ce niveau, [migration|E] peuvent viser [de_jure|E] [kingdom|E] [titles|E] dans la [the_great_steppe|E] et le chef du parti peut [retract|E] un/parmi les [vassal|E] de base."
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ est le deuxième niveau le plus élevé de [tribal_authority|E]. [vassals|E] subissent une pénalité #N -20#! [opinion|E] à leur [liege|E]. \n\nAà ce niveau, ainsi que la capacité à [imprison|E] [characters|E], le chef du parti peut [revoke|E] [titles|E] et [retract|E] les députés d’arrière-ban."
 game_concept_hold_court_desc: "Un [activity|E] où [vassals|E] et [courtiers|E] dans un [realm|E] se rassemblent à un [royal_court|E] pour adresser une pétition à leur [liege|E] et exprimer leurs griefs.\n\nLes situations sur lesquelles le Chef de Parti sera appelé à rendre un jugement peuvent aller de petites disputes et malentendus à des catastrophes touchant tout le royaume. La plupart des problèmes auront une solution qui est bénéfique – sinon pour les parties impliquées, du moins pour le chef de parti."
 game_concept_holder_desc: "Le [title|E] d'un $game_concept_holder$ est le personnage qui possède le titre. Les titres [barony|E] et [county|E] auront toujours $game_concept_holders$ une fois établis, tandis que les titres [duchy|E], [kingdom|E] et [empire|E] pourraient ne pas encore avoir été créés. Comme avertissement supplémentaire, le $game_concept_holder$ d'un titre de haut niveau pourrait ne pas réellement contrôler de territoire dans la zone [de_jure|E] du titre. \n\n Détenir des titres de niveau supérieur vous permet d'avoir des [vassals|E] de niveau supérieur. Par exemple, les ducs peuvent avoir des comtes comme Backbenchers, et les rois peuvent avoir des ducs."
 game_concept_holding_court: "Tenir une permanence"
 game_concept_holy_relic_desc: "Un $game_concept_holy_relic$ est un [artifact|E] qui a une signification religieuse pour un [faith|E]. Un $game_concept_holy_relic$ peut être [enshrined|E] dans un [holy_site|E] de cette idéologie pour obtenir des avantages.\n\nCertains artefacts sont intrinsèquement sacrés pour une idéologie, mais les artefacts peuvent également être [sanctified|E] pour devenir une relique sacrée."
 game_concept_holy_site: "Cœur du pays"
 game_concept_holy_site_desc: "Un $game_concept_holy_site$ est un [county|E] qui contient un lieu de signification religieuse pour un [faith|E]. Un $game_concept_holy_sites$ détenu par un personnage de la bonne idéologie fournira un effet à tous ceux de cette idéologie, et peut également permettre la création de [special_buildings|E] ou [holy_orders|E]. Chaque idéologie possède un ensemble différent de $game_concept_holy_sites$.\n\nUn $game_concept_holy_site$ ordinaire ne donne aucun avantage idéologique global, seulement des avantages locaux. Les sites les plus vénérés d'une idéologie sont plutôt désignés comme [eminent_holy_sites|E]. Une idéologie ne peut avoir qu'un nombre limité de chacun."
 game_concept_holy_sites: "Cœurs du pays"
 game_concept_holy_war_desc: "Une guerre sainte $game_concept_holy_war$ est un type spécial de [war|E] menée par un [ruler|E] d'une [faith|E] contre un dirigeant d'une idéologie différente.\n\n$game_concept_holy_war$ sont généralement assez destructives, le vainqueur d'une guerre sainte saisissant typiquement tous les [counties|E] de la zone ciblée pour lui-même. Cependant, si l'idéologie de l'attaquant est [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName] ou si le défenseur possède [vassals|E] de la même idéologie que l'attaquant dans la zone ciblée, certains ou tous les dirigeants minoritaires dans la zone ciblée peuvent simplement être transférés à l'attaquant à la place.\n\n Contrairement à d'autres guerres, les dirigeants de la même idéologie que la cible peuvent choisir de participer à leur défense sans avoir besoin d'un [alliance|E].\n\n Les guerres saintes peuvent être autorisées ou limitées selon les différents [religious_families|E]"
 game_concept_home_court: "Ministère de l'Intérieur"
 game_concept_home_courts: "Ministères de l'Intérieur"
 game_concept_home_courts_possessive: "Du ministère de l'Intérieur"
 game_concept_hungarian_invasion_casus_belli_desc: "Un puissant [casus_belli|E] qui ne peut être utilisé qu'une seule fois par campagne, au total, pour conquérir tous les territoires détenus par la cible en Pannonie. \n\n Lors de la victoire, tous les $mogyer_collective_noun$ dans le [realm|E] de l'attaquant se déplaceront avec eux en Pannonie, [counties|E] #EMP et #! [vassals|E], déplaçant $avar$ $game_concept_counties$. Les autres soutiens en dehors de la Pannonie sont abandonnés, tandis que les $game_concept_counties$ anciennement occupés ou détenus par $mogyer_collective_noun$ sont laissés aux petits seigneurs locaux et aux tribus rivales de la steppe."
 game_concept_hybrid_culture_desc_DLC: "Une $game_concept_hybrid_culture$ est une [culture|E] qui a été créée par une [ruler|E] comme la combinaison de deux Cultures existantes.\n\nLa $game_concept_hybrid_culture$ est un mélange des [traditions|E], [culture_pillars|E] et des Esthétiques des deux cultures d'origine.\n\nSeules les cultures de [heritage|E] différents peuvent former un hybride, et le coût [prestige|E] pour le faire est basé sur leur [cultural_acceptance|E] l'une de l'autre.\n\nPlus l'Acceptation Culturelle est élevée, plus de [counties|E] se convertiront lorsqu'un hybride se forme. Les dirigeants d'une culture hybride [promote_culture|E] beaucoup plus rapidement dans les circonscriptions de ses cultures parentes pour #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! ans après sa formation.\n\nDe nouvelles cultures peuvent également apparaître comme une [divergent_culture|E]."
 game_concept_iberian_reclamation_desc: "Il s'agit d'un type spécial de [war|E] disponible pour [struggle_involved|E] [rulers|E] de la [iberian_struggle|E].\n\n L'attaquant vise à conquérir un [duchy|E] qui contient tout [struggle_involved|E] [counties|E] détenu par un [struggle_interloper|E] ou [struggle_uninvolved|E] [ruler|E], ou [vassalize|E] les s'il ne détient aucune terre en dehors de cette région."
 game_concept_initial_legitimacy: "Mandat initial"
 game_concept_intrigue: "Tourner"
 game_concept_intrigue_lifestyle: "Style de vie Spin"
 game_concept_intrigue_skill: "Compétence de Tournage"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ est un [skill|E] pour travailler avec les médias et comprendre les gens : le briefing, la fuite, l'histoire placée dans un journal ami, le complot gardé secret.\n\nIl est principalement utilisé pour promouvoir et se défendre contre le Spin [schemes|E].\n\nLe [lifestyle|E] correspondant est le [intrigue_lifestyle|E]."
 game_concept_intrigue_task_contract: "Contrat de filage"
 game_concept_intrigue_task_contract_possessive: "Contrats de Spin"
 game_concept_intrigue_task_contracts: "Contrats de filage"
 game_concept_intrigue_task_contracts_possessive: "Contrats de Tournage"
 game_concept_kingdom: "Nation"
 game_concept_kingdoms: "Nations"
 game_concept_knight: "Organisateur"
 game_concept_knight_army_modifier: "Modificateur de l'Armée de l'Organisateur"
 game_concept_knight_army_modifier_desc: "Un effet appliqué à tout [army|e] qui #high contient#! le [acclaimed_knight|e] pertinent.\n\n Le [knight|e] n'ont #high pas#! besoin d'être le [commander|e] de leur armée pour que leur modificateur d'organisateur d'armée s'applique."
 game_concept_knight_army_modifiers: "Modificateurs de l'Armée de l'Organisateur"
 game_concept_knight_desc: "Un $game_concept_knight$ est un [vassal|E], [courtier|E] ou [follower|E] qui combat directement dans votre [army|E].\n\nPendant [battles|E], les $game_concept_knights$ utilisent leur [prowess_skill|E] pour combattre plus efficacement. Un haut $game_concept_prowess$ signifie qu'ils seront capables d'infliger plus de dégâts à l'ennemi et ont plus de chances de survivre ou même de sortir indemnes de $game_concept_battle$.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Les organisateurs peuvent être connus sous différents noms selon [culture] ou [faith]. Par exemple, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ ou $knight_baghatur_no_tooltip_plural$.\n\nLes organisateurs représentent à la fois le personnage et sa suite de troupes.#!"
 game_concept_knight_desc_ACCOLADE_DLC: "Les organisateurs qui reçoivent un [accolade|E] deviennent [acclaimed_knights|E].\n\n"
 game_concept_knight_effectiveness: "Efficacité de l'Organisateur"
 game_concept_knight_effectiveness_desc: "L'efficacité de l'organisateur de [ruler|E] détermine la manière dont leurs [knights|E] se battent dans [battle|E].\n\nÀ 100%, les organisateurs se battent normalement, mais à 200%, ils se battent comme si leur [prowess|E] était doublé."
 game_concept_knights: "Organisateurs"
 game_concept_knights_possessive: "de l'Organisateur"
 game_concept_kurultai_desc: "Le Kurultai remplace le [council|E] pour le [nomadic_government|E]. Les membres du Kurultai font partie de l'élite du parti et doivent soit être apaisés, soit forcés dans [obedience|E] pour assurer un [succession|E] sans encombre. \n\n Après l'événement d'une succession chaotique, ils peuvent voler certains [herd|E], abandonner leur nouveau [liege|E], ils obtiendront un [claim|E] sur le [realm|E] [title|E]."
 game_concept_law_desc: "A [realm_possessive|E] Les lois déterminent comment ce Parti est structuré.\n\nLa plus fondamentale de celles-ci est le [government_authority|E] du Parti, car ces lois déterminent comment [lieges|E] et [vassals|E] interagissent régulièrement.\n\nBien que moins impactants sur la vie quotidienne de [rulers|E] dans un Parti, [succession_laws|E] et [title_laws|E] sont tout de même très importants à considérer pour [succession|E]."
 game_concept_learning: "Politique"
 game_concept_learning_lifestyle: "Mode de vie politique"
 game_concept_learning_skill: "Compétence politique"
 game_concept_learning_skill_desc: "$game_concept_learning$ est un [skill|E] pour les idées et le détail : lectures de briefs, rédaction de projets de loi, survie aux comités sélectifs. Il rapporte également [piety|E] chaque mois.\n\nLe [lifestyle|E] correspondant est le [learning_lifestyle|E]."
 game_concept_learning_task_contract: "Contrat de police"
 game_concept_learning_task_contract_possessive: "Contrats de police"
 game_concept_learning_task_contracts: "Contrats de police"
 game_concept_learning_task_contracts_possessive: "Contrats de police"
 game_concept_leasing_desc: "Les petits [baronies|E] peuvent être loués à [holy_orders|E], [monastic_holy_orders|E], ou [clergy|E]. Les fiefs loués fournissent [taxes|E] et [levies|E] au [lessee|E] plutôt qu'au [holder|E].\n\nLes Ordres militaires peuvent louer [castle_holdings|E] et [city_holdings|E], tandis que les Ordres monastiques et les responsables du parti peuvent louer [temple_holdings|E]. Un bail peut avoir un [lease_contract|E].\n\nLes [holdings|E] loués sont toujours considérés comme faisant partie du [realm|E] du détenteur. [county_capitals|E] ne peut pas être loué."
 game_concept_legitimacy: "Mandat"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ est le droit d'un leader de gouverner aux yeux du parti et du pays : l'élection remportée, le concours de leadership achevé, la confiance de la Chambre. Un [ruler|E] sans cela vit sur du temps emprunté. [vassals|E] génèrent également [legitimacy_expectations|E] que le [liege|E] est supposé rencontrer.\n\nSeuls [rulers|E] ont $game_concept_legitimacy$, qui est calculé au moment où ils deviennent dirigeants et résulte dans leur [initial_legitimacy|E]. Une fraction du $game_concept_legitimacy$ du dirigeant précédent est également héritée par leur [heir|E].\n\n$game_concept_legitimacy$ affecte beaucoup de systèmes du jeu, rendant [marriage|E] propositions, [vassalization|E] et [alliances|E] plus susceptibles d'être acceptées, et [claims|E] moins cher, ainsi que influençant le [scales_of_power|E] dans un [regency|E].\n\n$game_concept_legitimacy$ typiquement a 5 [legitimacy_levels|E] et un #weak illégitime #! niveau inférieur.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "Attentes du mandat"
 game_concept_legitimacy_gain: "Gain de mandat"
 game_concept_legitimacy_level: "Niveau de mandat"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] Les dirigeants gagnent #V 50%#! plus de Mandat en remportant des guerres, mais ils perdent également le double en cas de défaite. Ils gagneront aussi du Mandat grâce à [single_combat_duel_plural|E] et en épousant des [courtiers|E] nobles de quelqu'un ayant un [dominance|E] égal ou supérieur."
 game_concept_legitimacy_levels: "Niveaux de mandat"
 game_concept_levies: "Bénévoles"
 game_concept_levy: "Bénévole"
 game_concept_liege: "Chef du parti"
 game_concept_liege_desc: "Un $game_concept_liege$ est un politicien avec au moins un [vassal|E] qui lui rend compte. Les chefs de parti eux-mêmes rendent compte au Premier ministre."
 game_concept_liege_possessive: "Du chef du parti"
 game_concept_liege_taxes: "Le chef du parti taxe"
 game_concept_liege_taxes_desc: "Vos $game_concept_liege_taxes$ sont les [taxes|E] que vous devez verser à vos [liege|E] dans le cadre de votre [obligations|E]. Vous ne payez aucun $game_concept_liege_taxes$ si vous êtes [independent|E].\n\n Du point de vue de votre chef de parti, ces mêmes taxes sont appelées [vassal_taxes|E] afin de les distinguer de toutes taxes qu'ils pourraient devoir à leur propre $game_concept_liege$."
 game_concept_lieges: "Chefs de file de partis"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' est le deuxième niveau le plus bas de [crown_authority|E]. Les [vassals|E] ont une pénalité #N de -10#! [opinion|E] envers leur [liege|E], et le chef de parti peut [revoke|E] [titles|E] et [retract|E] les backbenchers d'un backbencher. Le [ruler|E] peut changer entre les Partition [succession_laws|E] disponibles."
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ est le deuxième niveau le plus bas de [nomadic_authority|E]. [migration|E] peut cibler [de_jure|E] [duchy|E] [titles|E] dans le [the_great_steppe|E], [titles|E] peut être révoqué et le chef du parti peut désormais [imprison|E] [characters|E] dans son [realm|E]. \n\nCon peut utiliser le #V $step_away_from_the_steppe_decision$#! [decision|E]"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ est le deuxième niveau le plus bas de [tribal_authority|E]. [vassals|E] subir une pénalité #N -10#! [opinion|E] à leur [liege|E], et le chef du parti peut désormais [imprison|E] [characters|E] dans son [realm|E]."
 game_concept_long_reign_desc: "'Long Règne' est un bonus [opinion|E] croissant que tous les personnages d'une [realm|E] obtiennent avec un [liege|E] qui les a longtemps gouvernés.\n\n De même, les sujets ont une pénalité d'opinion [short_reign|E] décroissante avec les nouveaux chefs de parti."
 game_concept_mainline_rite: "Idéologie"
 game_concept_mainline_rites: "Idéologies"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ est un [councillor_task|E] effectué par le [marshal|E].\n\nIl augmente [knight_effectiveness|E] et diminue [hostile_scheme|E] [success_chance|E] contre le [liege|E] du ministre."
 game_concept_mandala_decree_desc: "Les $game_concept_mandala_decrees$ sont les trois Décrets mandatés par le [mandala|E] [ruler|E] — signifiés par [prosperity_decree|E], [expansion_decree|E] et [reverence_decree|E].\n\n Généralement, le parti Mandala a une autorité très centralisée, où le pouvoir sur [subjects|E] et [laws|E] incombe au Souverain associé qui peut les modifier selon les besoins avec peu ou pas d'objection de ses habitants."
 game_concept_mandala_desc: "Sous la $game_concept_mandala$ [government_form|E], la [domain_limit|E] et la quantité de [direct_vassals|E] sont limitées. Au lieu de cela, les [liege|E] et [suzerain|E] dépendent de [tributaries|E] pour agrandir leur parti. \n\nA Mandala [ruler|E] peut aspirer à être vu comme un Roi-Dieu, ou Devaraja, puis compter sur [mandala_radiance|E] pour acquérir et conserver $game_concept_tributaries$. \n\nA $game_concept_ruler$ doivent maintenir [opinion|E] et renforcer leurs relations avec leur $game_concept_tributaries$ pour les maintenir à long terme. À la succession, $game_concept_tributaries$ peuvent se disperser à moins que le $game_concept_ruler$ ne soit un [mandala_succesor|E] digne de ce nom."
 game_concept_mandate_of_heaven_desc: "Le $game_concept_mandate_of_heaven$ est un type spécial de [legitimacy|E] seulement disponible pour [son_of_heaven|E]. Il représente le droit du monarque à régner et qui est considéré comme le souverain suprême sous tout le ciel.\n\nLe Mandat est étroitement lié au [dynastic_cycle|E]. Le Cycle affecte la manière dont le monarque régnant acquiert le Mandat et peut également changer [situation_dynastic_cycle_phase|E] en fonction du niveau de Mandat du monarque."
 game_concept_marshal: "Secrétaire de l'Intérieur"
 game_concept_marshal_desc: "Le $game_concept_marshal$ est le [councillor|E] responsable de la sécurité : la police, les frontières et le maintien de l'ordre."
 game_concept_marshals: "Secrétaires de l'Intérieur"
 game_concept_martial: "Sécurité"
 game_concept_martial_lifestyle: "Mode de vie sécurisé"
 game_concept_martial_skill: "Compétence en matière de sécurité"
 game_concept_martial_skill_desc: "$game_concept_martial$ est un [skill|E] pour le droit et l'ordre, la défense et la gestion de crise : maintenir les rues et le pays en sécurité.\n\nLe [lifestyle|E] correspondant est le [martial_lifestyle|E]."
 game_concept_master_assassin_desc: "Le $game_concept_master_assassin$ est un [court_position|E] activé par [faiths|E] avec le [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]. Le $game_concept_master_assassin$ est un fanatique dangereux qui travaille avec de plus petits assassins pour tuer les ennemis perçus de l'idéologie."
 game_concept_maximum_piety_level: "Niveau maximum de capital politique"
 game_concept_men_at_arms: "Activistes"
 game_concept_men_at_arms_counter: "Contre-activistes"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$ [soldiers|E] professionnels sont supérieurs à [levies|E].\n\nLe joueur a un contrôle direct sur la composition et la taille de ses Activistes [regiments|E].\n\nDifférents types d'Activistes sont bons ou mauvais dans différents types de [terrain|E]. Chaque type [counters|E] un autre type.\n\nLes activistes peuvent être [stationed|E] dans [holdings|E] pour augmenter leur efficacité."
 game_concept_mental_break_desc: "Lorsque [stress|e] submerge un personnage, celui-ci subira une Rupture Mentale — une crise personnelle au cours de laquelle ils sentent qu'ils doivent faire quelque chose pour réduire leur Pression, peu importe le coût. \n\nLes personnages souffrant d'une Rupture Mentale auront plusieurs manières de gérer la situation, bien que beaucoup d'entre elles auront des conséquences négatives. \n\nÀ de faibles niveaux de [stress_levels|E], ces conséquences sont mineures et facilement gérables. Cependant, à mesure que le Niveau de Pression augmente, ces conséquences augmentent également, menant éventuellement à la folie et même à la mort."
 game_concept_minister_grand_chancellor_desc: "Le $game_concept_minister_grand_chancellor$ est le [minister|E] de plus haut rang et est chargé des affaires diplomatiques. Il se voit généralement attribuer le poste de [grand_secretariat_director|E].\n\nLe secrétaire aux affaires étrangères peut être le [grand_secretariat_director|E] désigné, selon le #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "Le $game_concept_minister_grand_marshal$ est le commandant de plus haut rang dans le [realm|E] et commande un [army|E] de [title_men_at_arms|E].\n\nLe secrétaire d'État à l'intérieur peut être le [grand_secretariat_director|E] désigné, selon le #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ est un ensemble unique de [vassal_obligations|E] seulement disponible pour [ministers|E].\n\nTous les ministres civils ont un ensemble d'options spécifique comme valeur par défaut, tandis que le [minister_grand_marshal|E] a une option unique qui fournit au ministre de l'Intérieur [title_men_at_arms|E].\n\nCes obligations ne peuvent pas être modifiées."
 game_concept_natural_prowess: "Endurance naturelle"
 game_concept_noble_family_desc: "$game_concept_noble_families$ sont des [houses|E] puissants dans un [government_bureaucratic_type|E] [realm|E]. Ils possèdent un [estate|E], contrôlé et géré par le [house_head|E], et restent une partie intégrante du Parti en tout temps, car ils tenteront de rassembler [influence|E] et de sécuriser [provinces|E] pour eux-mêmes.\n\nUn $game_concept_noble_family$ influent peut devenir un [powerful_family|E] ou un [dominant_family|E]."
 game_concept_obedience_desc: "Dans [GetGovernment( 'nomad_government' ).GetName] [realms|E], l’obéissance détermine la loyauté d’un [character|E] envers leur [liege|E], [suzerain|E] ou propriétaire de leur [court|E]. Les personnages ne peuvent être obéissants qu’à un seul [ruler|E] à la fois. \n\nLes personnages obéissants sont moins susceptibles de participer à [hostile_schemes|E], de rejoindre [wars|E] ou de rejoindre [factions|E] contre leur chef de parti. Ils soutiendront toujours les préférences de leur chef de parti lors de [succession|E] et ne leur imposeront pas leur [claims|E]. Les [tributaries|E] non obéissants peuvent essayer de se libérer. \n\nLorsqu’un personnage dépasse le [obedience_threshold|E], il devient obéissant."
 game_concept_offer_vassalization_desc: "Une interaction offrant [vassalage|E] à un [independent|E] [ruler|E] de [title_rank|E] inférieur, les ajoutant paisiblement à la fête."
 game_concept_organize_levies_desc: "Un [councillor_task|E] réalisé par le [marshal|E]. Il augmente la taille [garrison|E] et le taux de renforcement [levy|E] du [realm|E] du [liege|E] du ministre."
 game_concept_organized_desc: "Un [faith|E] organisé a une hiérarchie religieuse. Le culte et les pratiques sont plus organisés et les écritures sont formalisées.\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] Les idéologies [GetReligionFamily('rf_pagan').GetName] peuvent devenir organisées en se réformant, tandis que d'autres idéologies sont toujours considérées comme organisées."
 game_concept_pam_challenge_hof_cb: "Leader du Mouvement Challenge"
 game_concept_papal_recipient_desc: "Si la cible principale du [great_holy_war|E] est déjà détenue ou revendiquée par un membre de l'idéologie agresseur, ils seront considérés comme le destinataire légitime du titre en jeu, sauf si le principal [Concept( 'war_contribution', 'Contributor' )|E] décide de donner la priorité à leur [beneficiary|E]."
 game_concept_peasant_faction_desc: "Le $game_concept_peasant_faction$ est peuplé de [counties|E] avec un faible [county_opinion|E]. Contrairement aux autres [factions|E], celui-ci se révoltera toujours même si [faction_military_power|E] est faible, car les paysans sont généralement à la fois optimistes et analphabètes... Les Mouvements de Protestation réussis diminueront considérablement le Contrôle dans votre [realm|E]."
 game_concept_peasant_factions: "Mouvements de protestation"
 game_concept_perk_desc: "Avantages sont des bienfaits déblocables qui offrent de nombreux effets utiles et intéressants. Ils se débloquent en sélectionnant un [focus|E] dans un [lifestyle|E] et en dépensant la forme associée de [experience|E] #weak (par exemple, Spin $game_concept_experience$ si vous souhaitez débloquer un $game_concept_intrigue_lifestyle$ $game_concept_perk$.) #!"
 game_concept_personal_tenet: "Cause personnelle"
 game_concept_personal_tenets: "Causes personnelles"
 game_concept_petition_antipope_gold_interaction: "Pétition antipape pour des fonds"
 game_concept_piety: "Capital politique"
 game_concept_piety_desc: "$game_concept_piety$ est le crédit d'un politicien auprès de son parti et de l'establishment : loyauté démontrée, faveurs rendues, causes justes soutenues.\n\nIl est dépensé pour demander des choses au parti et à l'establishment, selon le [government_form|E].\n\nChaque fois qu'un personnage gagne du capital politique, il progresse également vers le prochain [piety_level|E]."
 game_concept_piety_experience: "Loyauté"
 game_concept_piety_experience_desc: "Chaque point de Loyauté qu'un personnage obtient augmente sa progression vers le prochain [piety_level|E]. Lorsqu'un personnage gagne [piety|E], il gagne également une quantité égale de Loyauté."
 game_concept_piety_level: "Niveau de capital politique"
 game_concept_piety_level_desc: "Le $game_concept_piety_level$ d'un personnage est une mesure de combien de crédit il a accumulé auprès de son parti et de l'établissement, et de sa position auprès des autres de son [faith|E].\n\nChaque fois qu'un personnage gagne [piety|E], il progresse également vers le niveau suivant de Capital Politique.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nLes niveaux sont :\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "Impact du niveau de capital politique"
 game_concept_piety_level_impact_desc: "L'impact du niveau de capital politique augmente ou diminue le [modifiers|E] obtenu à partir de votre [piety_level|E] actuel."
 game_concept_piety_levels: "Niveau(s) de capital politique"
 game_concept_playdate_desc: "Un [activity|E] où les dirigeants et le personnel âgés de moins de [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] se rassemblent pour jouer et oublier la morosité de la journée.\n\n Les participants perdront [stress|E] et augmenteront leur [opinion|E] de l'hôte. Il peut également y avoir de nombreuses autres conséquences à rassembler autant d'enfants.\n\n Un [ruler|E] invitera leurs [liege|E] et leurs [vassals|E] (ainsi que divers [courtiers|E]) à un $activity_playdate$."
 game_concept_player_heir_desc: "Le $game_concept_player_heir$ est le [heir|E] que le joueur continuera à jouer en [succession|E].\n\nLe $game_concept_player_heir$ est généralement le même que le [primary_heir|E], mais si le [succession_law|E] de votre [primary_title|E] dicte qu'il doit aller à un personnage en dehors de votre [dynasty|E], vous continuerez à jouer en tant qu'héritier dynastique de votre titre de second rang (ou troisième, quatrième, etc.).\n\nCette situation est courante lorsque votre $game_concept_player_heir$ est destitué sous une loi de succession élective. Si vous êtes [house_head|E] d'un [noble_family|E] dans un [administrative|E] [realm|E], vous pouvez perdre votre parti au profit des héritiers principaux en dehors de votre [house|E] mais conserver votre titre de famille noble.\n\nSi vous êtes [ecclesiastical|e], votre $game_concept_player_heir$ est le personnage qui doit hériter de votre [primary_title|e], généralement un [archdiocese|e]."
 game_concept_popular_faction_desc: "Le $game_concept_popular_faction$ est peuplé de [counties|E] avec un faible [county_opinion|E] qui partagent un élément commun, comme [culture|E] ou [faith|E]. Ils cherchent à se libérer et choisissent un nouveau [ruler|E] basé sur leur Culture ou Idéologie. Ce type de soulèvement est généralement très dangereux."
 game_concept_popular_factions: "Mouvements populistes"
 game_concept_powerful_family_desc: "Un $game_concept_powerful_family$ représente l'un des [houses|E] et [noble_families|E] les plus influents dans un [government_bureaucratic_type|E] [realm|E].\n\nUn membre d'un $game_concept_powerful_family$ est meilleur en [political_schemes|E] et a plus de chances d'obtenir ce qu'il veut lorsqu'il [interacting|E] avec d'autres [characters|E].\n\nIl ne peut y avoir qu'un nombre limité de $game_concept_powerful_families$ à un moment donné, et ce sont les $game_concept_noble_families$ les mieux notés qui sont considérés comme puissants en fonction de leur [powerful_family_rating_short|E]. La Maison des [top_liege|E] est une exception, qui est toujours considérée comme Puissante.\n\nUne Famille contrôlant une partie significative des terres d'un Parti peut devenir un [dominant_family|E]."
 game_concept_powerful_vassal: "Député de backbench puissant"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' sont la poignée de [vassals|E] ayant le plus de [soldiers|E] et le [income|E] le plus élevé. Vous devez accorder une attention particulière à ces parlementaires de fond, car ils s'attendent à occuper un siège dans votre [council|E] et auront un [opinion|E] de vous significativement plus faible si ce n'est pas le cas.\n\nChanger un [succession_law|E] nécessite que tous les $game_concept_powerful_vassals$ aient soit une [opinion|E] positive de vous, soient [cowed|E] par vous, ou soient [imprisoned|E]."
 game_concept_powerful_vassal_possessive: "Du député de backbench puissant"
 game_concept_powerful_vassals: "Députés de backbench puissants"
 game_concept_prestige: "Profil"
 game_concept_prestige_desc: "$game_concept_prestige$ est la célébrité publique d'un politicien : reconnaissance du nom, colonnes dans les journaux et temps d'antenne.\n\nIl est dépensé pour des actions publiques, selon le [government_form|E].\n\nChaque fois qu'un personnage gagne du profil, il progresse également vers le prochain [prestige_level|E]."
 game_concept_prestige_experience: "Célébrité"
 game_concept_prestige_level: "Niveau de profil"
 game_concept_prestige_level_impact: "Impact du niveau de profil"
 game_concept_prestige_level_impact_desc: "Impact sur le niveau de profil augmente ou diminue la [modifiers|E] gagnée avec votre [prestige_level|E] actuel."
 game_concept_prestige_levels: "Niveaux de profil"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$ sont les #V 7#! [electors|E] qui sélectionnent un [title_heir|E] avec l'Empereur sous le [GetLaw('princely_elective_succession_law').GetName] [succession_law|E] utilisés par [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )].\n\n[holders|E] de #V 7#!, les [titles|E] préférés sont prioritaires en tant que $game_concept_prince_electors$. Ces Titres sont sélectionnés lors de la création de l'Empire.\n\nSi un Titre $game_concept_prince_elector$ est détruit, non détenu par un [de_jure|E] Impérial [vassal|E], détenu par un autre $game_concept_prince_elector$, ou si le [religion|E] du titulaire diffère de celui de l'Empereur, un autre Titre De Jure détenu par un membre direct de l'Empire ou [independent_ruler|E] sera sélectionné selon ces critères :\n$EFFECT_LIST_BULLET$[rulers|E] des [faith|E] et [culture|E] de l'Empereur sont favorisés\n$EFFECT_LIST_BULLET$[theocratic|E] et [feudal|E] Les Dirigeants sont favorisés\n\n#help Les Titres préférés sont listés dans la vue Élection#!"
 game_concept_promote_other_culture_development_decision_desc: "UN [decision|E] qui vous permet d'améliorer [development|E], [control|E], les coûts [building|E] et la défense [advantage|E] dans [counties|E] à partir de différents [cultures|E] avec un [cultural_acceptance|E] de #V 75%#! ou plus.\n\nPrendre la décision augmentera également votre [prestige|E] [prestige_i] et [levies|E].\n\nToutes les circonscriptions dans le [realm|E] sont affectées. Le coût [gold|E] varie en fonction du nombre de circonscriptions affectées."
 game_concept_prowess: "Endurance"
 game_concept_prowess_skill: "Compétence en endurance"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ est un [skill|E] qui reflète l'endurance physique et mentale d'un personnage : des journées de dix-huit heures, des sessions toute la nuit et la campagne électorale.\n\nUne compétence d'endurance élevée signifie qu'ils sont plus susceptibles de survivre et de bien performer à la fois en tant que [knights|E] dans [battles|E] et dans [single_combat_duel_plural|E].\n\nChaque point d'endurance donne un organisateur : \n$BULLET_WITH_TAB$[damage|E] : #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E] : #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E] peut être élevé en tant que $game_concept_raiders$ depuis [rally_points|E]. $game_concept_raiders$ peut se déplacer sur les terres voisines et les piller pour [gold|E].\n\nPour $game_concept_raid$, une Armée de Raid doit s'arrêter dans un [holding|E] appartenant à un [ruler|E] étranger et choisir de commencer le Raid — ce faisant, elle restera à faire des raids pendant un certain temps, après quoi elle recevra des Fonds et pillera la Tenure.\n\nLes Fonds seront stockés sur l'Armée et seulement ajoutés au trésor lorsqu'elle rentrera chez elle. Si vous défaites une Armée de Raid transportant des Fonds, vous les prendrez, et elle ne pourra pas vous attaquer pendant un certain temps.\n\nSeuls certains Souverains sont autorisés à $game_concept_raid$, principalement les Souverains [tribal|E] et [GetGovernment( 'nomad_government' ).GetName].\n\nDes [raid_intents|E] spécifiques peuvent être configurés pour obtenir différentes récompenses."
 game_concept_rally_point_desc: "Un $game_concept_rally_point$ est un terrain de rassemblement pour le [levies|E] et le [men_at_arms|E] sous votre commandement. \n\n En temps de [war|E], vous pouvez appeler vos [soldiers|E] à un Point de Rassemblement pour réunir un [army|E]. \n\n Les Volontaires assignés à un Point de Rassemblement doivent provenir soit de votre propre [domain|E], soit de votre [vassals|E]. Les Points de Rassemblement peuvent être réorganisés, séparés et fusionnés selon votre convenance."
 game_concept_realm: "Parti"
 game_concept_realm_capital: "Base à domicile"
 game_concept_realm_capital_desc: "Le $game_concept_realm_capital$ est le [holding|E] où un [ruler|E] et leur [court|E] résident. Ce domaine a un bonus de [tax|E] et est toujours hérité par le [primary_heir|E].\n\n[occupying|E] la base principale d'un ennemi pendant une guerre donne une quantité significative de [war_score|E] et permet parfois de [imprison|E] des membres de la famille ennemie."
 game_concept_realm_capital_possessive: "De la base à domicile"
 game_concept_realm_capitals: "Bases à domicile"
 game_concept_realm_desc: "Un $game_concept_realm$ est tout le monde et tout ce qu'un politicien dirige, directement ou par le biais de son [vassals|E] (contrairement à un [domain|E], qui n'est que ce qu'il possède lui-même)."
 game_concept_realm_heir: "Héritier du parti"
 game_concept_realm_heir_desc: "Un héritier du parti est un des [heirs|E] d'un [realm|E], et recevra tout ou partie des [titles|E] détenus par le [ruler|E] de ce parti lorsque ce dirigeant décède.\n\nUn parti peut avoir un ou plusieurs héritiers du parti selon son [succession_law|E]."
 game_concept_realm_heirs: "Héritiers du parti"
 game_concept_realm_law: "Loi du parti"
 game_concept_realm_law_desc: "Lois appliquées au groupe de ce personnage, comme le niveau de [crown_authority|E] ou [tribal_authority|E]."
 game_concept_realm_possessive: "du parti"
 game_concept_realm_priest: "Prêtre du parti"
 game_concept_realm_priest_desc: "Un $game_concept_realm_priest$ est un [councillor|E] chargé des affaires religieuses et spirituelles dans [faiths|E] avec le [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E].\n\n Contrairement à leur équivalent [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] ([court_chaplains|E]), $game_concept_realm_priests$ [lease|E] automatiquement tous les [temple_holdings|E] dans le [ruler|E] de [domain|E], et reçoivent également une partie de [taxes|E] et [levies|E] de [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ fournissent leurs [liege|E] avec des bénévoles et des impôts s'ils ont une opinion positive d'eux. Plus le [opinion|E] de leur [liege|E] est élevé, plus ils fourniront. \n\n$game_concept_realm_priests$ ayant une opinion faible de leur chef de parti ne leur fourniront aucun impôt ni bénévole, et pourraient causer des problèmes."
 game_concept_realm_priest_possessive: "du prêtre du parti"
 game_concept_realm_priests: "Prêtres du parti"
 game_concept_realm_size: "Taille du parti"
 game_concept_realms: "Partis"
 game_concept_regency_desc: "Une régence est une forme spéciale de [diarchy|E] pour lorsque le [ruler|E] n'est pas capable de gouverner son [realm|E] seul. \n\n Elle se produit généralement si le Souverain est un [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )], ou assiste à un [activity|E] en dehors de son Parti. \n\n Un $game_concept_regency$ qui persiste trop longtemps peut devenir un [entrenched_regency|E]."
 game_concept_religion: "Camp politique"
 game_concept_religion_desc: "A $game_concept_religion$ groupes liés [faiths|E] : la Gauche, le Centre, la Droite, les Nationalistes et les Unionistes. Les idéologies d'un camp identique ou voisin sont Divergentes ; la gauche et la droite sont Opposées ; nationalistes et unionistes sont Irréconciliables."
 game_concept_religions: "Camps politiques"
 game_concept_religious_families: "Familles politiques"
 game_concept_religious_family: "Famille politique"
 game_concept_religious_family_desc: "Un $game_concept_religious_family$ est un groupe de [religions|E]. Le $game_concept_religious_family$ influence la manière dont les différents Camps Politiques, et les [faiths|E] qui s'y trouvent, se perçoivent mutuellement.\n\nLa Famille [GetReligionFamily('rf_abrahamic').GetName] tolère [holy_wars|E] contre tout le monde #weak (y compris d'autres Abrahamistes)#!. Les Camps Politiques sont susceptibles de [heresy|E].\n\nLa Famille [GetReligionFamily('rf_eastern').GetName] ne tolère les Guerres Saintes que contre d'autres Familles Politiques.\n\nLa Famille [GetReligionFamily('rf_pagan').GetName] tolère les Guerres Saintes contre tout le monde, mais les Idéologies au sein des Camps Politiques doivent être réformées pour y accéder."
 game_concept_religious_head_succession_law: "Loi de Succession du Chef du Mouvement"
 game_concept_religious_head_succession_law_desc: "[rulers|E] qui sont également [heads_of_faith|E] ont une loi supplémentaire du parti [succession|E], exigeant que leur [heir|E] soit du même [faith|E] qu'eux. Cela ne peut jamais être changé, et $game_concept_head_of_faith$ [titles|E] ne peut avoir de [title_succession|E] séparés. La seule façon de supprimer ce type de loi de parti est qu'une force extérieure détruise le [head_of_faith|E] $game_concept_title$."
 game_concept_religious_head_succession_law_short: "Loi sur le Chef du Mouvement"
 game_concept_religious_head_succession_laws: "Loi de Succession du Chef du Mouvement"
 game_concept_religious_head_succession_laws_short: "Lois sur le Chef du Mouvement"
 game_concept_religious_superior_desc: "Un supérieur religieux est un [character|E] qui détient l'autorité religieuse sur un ou plusieurs responsables religieux [subordinate|E] dans une structure religieuse hiérarchique."
 game_concept_retinue_maa: "Activistes de la suite"
 game_concept_retract_desc: "À [limited_crown_authority|E] ou plus, [rulers|E] peut $game_concept_retract$ le [vassal|E] d'un parlementaire de base, mais sauf si ce dernier est [imprisoned|E], c'est risqué, car le parlementaire de base peut refuser et se révolter.\n\nLe retrait du parlementaire de base est considéré comme [tyrannical|E] sauf si la cible est coupable d'une [crime|E] relativement grave."
 game_concept_revoke_desc: "À [limited_crown_authority|E] ou plus, [rulers|E] peut $game_concept_revoke$ le [titles|E] de son [vassals|E], mais sauf si le parlementaire de base est [imprisoned|E], c'est une proposition risquée, car le parlementaire de base peut refuser et se révolter.\n\nLa révocation de titre est considérée comme [tyrannical|E] sauf si le parlementaire de base est coupable d'une [crime|E] relativement grave."
 game_concept_rightful_liege: "Chef légitime du parti"
 game_concept_rightful_liege_desc_part2: "#weak Exemple : Le Comte de $c_dunbar$ est un député direct du Roi de $k_england$. Comme le Roi n'est ni Duc de $d_lothian$, ni Roi de $k_scotland$, ni Empereur de $e_britannia$, le Comte de $c_dunbar$ ne contribue qu'une très petite part de ses impôts et volontaires. \n\nLe Comte de $c_norfolk$ est également un député direct du Roi de $k_england$. Le Roi ne détient pas la Région de $d_norfolk$, donc le Comte contribue aussi à des impôts et volontaires réduits. Cependant, puisque le $k_england$ est la Nation de jure de $c_norfolk$, le Comte de $c_norfolk$ contribue encore beaucoup plus d'impôts et de volontaires au Roi que le Comte de $c_dunbar$. #!"
 game_concept_rite: "Idéologie"
 game_concept_rite_desc: "À Westminster, chaque [faith|E] a un seul $game_concept_rite$ du même nom : l’idéologie elle-même, avec son [core_tenets|E] et [doctrines|E]. Ils sont fixes : les politiciens changent d’avis, pas l’idéologie."
 game_concept_rite_divergence_desc: "La divergence mesure à quel point un [rite_possessive|E] [core_tenets|E] et [doctrines|E] se sont éloignés du [faith|E] parent. Une idéologie qui adopte [prohibited_tenet_status|E] Causes comme [core_tenet_status|E] est plus divergente.\n\nUne divergence élevée affaiblit le [fervor|E] de l'idéologie parent, rendant les éclosions de [heresy|E] plus fréquentes. Une idéologie qui atteint #V 100#! de divergence sera automatiquement déclarée comme se scindant et deviendra un nouveau [faith|E]."
 game_concept_rite_knowledge: "Connaissance de l'idéologie"
 game_concept_rite_possessive: "De l'idéologie"
 game_concept_rites: "Idéologies"
 game_concept_rites_possessive: "Idéologies'"
 game_concept_royal_court: "Bureau privé"
 game_concept_royal_court_desc: "Les [rulers|E] distingués sont suffisamment célèbres pour maintenir un Bureau Privé, ce qui donne accès à une variété d'avantages et d'opportunités.\n\nLorsqu'un [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName], ou [GetGovernment( 'tribal_government' ).GetName] [ruler|E] devient [king|E] ou [emperor|E], il obtient l'accès à son Bureau Privé.\n\nChaque Bureau Privé possède un [court_grandeur_level|E], qui donne des avantages en fonction de la renommée du Bureau Privé et de [court_type|E] où se trouve le Bureau Privé.\n\nLes pétitionnaires, [vassals|E] et [courtiers|E] peuvent apparaître à votre Bureau Privé, ou vous pouvez [hold_court|E] pour inviter quiconque dans le [realm|E] afin d’exposer leurs doléances.\n\nUn Bureau Privé permet également au Souverain de montrer [court_artifacts|E], et [inspired|E] [guests|E] peuvent apparaître au Bureau Privé, offrant de créer un nouveau [artifacts|E].\n\nLorsque vous mourrez, votre [player_heir|E] héritera de votre Bureau Privé."
 game_concept_royal_courts: "Bureaux privés"
 game_concept_sanctified_desc: "Sanctifier un [artifact|E] en fait un [holy_relic|E] pour un [faith|E]. Un artefact peut être sanctifié pour plusieurs idéologies."
 game_concept_scales_of_power_desc: "Pendant [power_sharing|E], l'équilibre des pouvoirs entre les [liege|E] et leurs [diarch|E] est mesuré sur le $game_concept_scales_of_power$.\n\nAlors que les $game_concept_scales_of_power_scales$ penchent vers les $game_concept_diarch$, ils débloquent [diarch_powers|E] et peuvent ajouter des coûts au [diarch_affected_actions|E] du chef du parti.\n\nAlors qu'ils penchent vers les $game_concept_liege$, cela facilite plutôt pour le chef du parti de mettre fin au [diarchy|E].\n\nLe $game_concept_scales_of_power_scales$ peut être influencé par :\n$EFFECT_LIST_BULLET$Utiliser le $swing_scales_currency_interaction$ [character_interaction|E] contre le parti opposé\n$EFFECT_LIST_BULLET$Alors que le $game_concept_diarch$, servir bien votre $game_concept_liege$ (aussi cyniquement soit-il) lors des événements [mandate|E]"
 game_concept_seasonal_prediction_desc: "Un $court_position_court_astrologer$ habile peut prédire le prochain [steppe_season|E] dans une région, offrant des informations utiles à leur chef de parti afin de planifier leurs prochaines actions."
 game_concept_seize_peripheral_duchy: "Saisir la région périphérique"
 game_concept_settlement_issue_desc: "Les problèmes de colonisation sont des tâches données à un [nomad|E] [ruler|E] après avoir terminé un [migration|E] vers de nouvelles terres. Ils donnent l'occasion de gérer les conflits et d'augmenter le [county_control|E] local dans les nouvelles [domain|E].\n\nCes problèmes continueront à se produire pendant les premières années après la migration d'un dirigeant, tant que le contrôle de la circonscription est faible."
 game_concept_short_reign_desc: "'Court règne' est une pénalité [opinion|E] déclinante que tous les personnages dans un [realm|E] reçoivent avec un nouveau [liege|E].\n\nDe la même manière, les sujets reçoivent un bonus d'opinion [long_reign|E] croissant avec les chefs de parti qui ont régné sur eux pendant longtemps."
 game_concept_shunned_desc: "De nombreux [rites|E] ont [doctrines|E] qui désignent certains comportements comme rejetés. Selon la Position de Politique spécifique, ces comportements peuvent également être considérés comme [criminal|E].\n\nLes personnages qui sont pris en train de pratiquer des comportements que leur Idéologie considère comme rejetés perdent un [piety_level|E] et gagnent un [fame_trait|E] correspondant ; ce Trait sera détesté par tous ceux dont l'Idéologie considère ce comportement comme soit rejeté, soit criminel.\n\nDes exemples de comportements rejetés incluent :\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "Chaque [rite|E] considère certains [traits|E] comme pécheurs. Les personnages possédant ces Traits subissent des pénalités [opinion|E] de la part de tous les personnages qui considèrent ces traits comme pécheurs, même s'ils ne partagent pas la même idéologie. De plus, les personnages ayant des Traits que leur propre idéologie considère comme pécheurs perdront [piety|E] chaque mois.\n\nLes traits considérés comme des péchés varient d'une idéologie à l'autre, mais sont généralement déterminés par une combinaison du [core_tenets|E] de cette idéologie et du [religion|E] auquel l'idéologie appartient."
 game_concept_spiritual_fulfillment: "Condamnation personnelle"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ correspond à quel point un [character|E] est à l'aise avec sa propre politique. Cela monte et descend avec leur [traits|E] et avec leur comportement."
 game_concept_spiritual_fulfillment_level: "Niveau de conviction"
 game_concept_spiritual_fulfillment_level_desc: "A [character_possessive|E] [spiritual_fulfillment|E] est divisé en $game_concept_spiritual_fulfillment_levels$, chacun ayant ses propres effets."
 game_concept_spiritual_fulfillment_levels: "Niveaux de conviction"
 game_concept_spiritual_head_of_faith: "Leader du Mouvement Spirituel"
 game_concept_spymaster: "Chef Whip"
 game_concept_spymaster_desc: "Le $game_concept_spymaster$ est le [councillor|E] qui maintient le parti uni et connaît les secrets de chacun. Méfiez-vous d'un chef de file déloyal : il peut facilement cacher ou rejoindre un complot contre vous."
 game_concept_state_rite: "Idéologie d'État"
 game_concept_state_rite_desc: "$game_concept_state_rite$ est le [rite|E] soutenu et cautionné par un [administrative_government|E]. Cette idéologie est attachée au [title|E] et non à un [character|E] spécifique. Il est plus facile de convertir des personnages dans la [realm|E] à l'idéologie de l'État et très difficile de les en détourner.\n\nSeul le [ruler|E] d'un Parti Administratif peut changer l'Idéologie de l'État, mais [governors|E] peut s'y convertir librement."
 game_concept_stationed_regiment_desc: "Un [men_at_arms|E] [regiment|E] reçoit des bonus à son efficacité lorsqu'il est Stationné dans un [holding|E]. \n\n[buildings|E] peut encore augmenter ces bonus — parfois pour tout type d'Activistes, mais le plus souvent pour un ou deux. Par exemple, [GetBuilding('stables_01').GetName] fournit un bonus aux [light_cavalry|E] et [heavy_cavalry|E] Stationnés. \n\n Vous pouvez Stationner à tout moment sauf pendant [war|E], ou si le Holding est [occupied|E]. Si un Holding est perdu, tout Activiste Stationné sera désaffecté."
 game_concept_steward: "Chancelier de l'Échiquier"
 game_concept_steward_desc: "Le $game_concept_steward$ est le [councillor|E] responsable de l'économie et du [domain|E] : [taxation|E], la dépense et [development|E]."
 game_concept_stewards: "Chanceliers de l'Échiquier"
 game_concept_stewardship: "Économie"
 game_concept_stewardship_lifestyle: "Style de vie économique"
 game_concept_stewardship_skill: "Compétence économique"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$’est un [skill|E] pour les budgets, l’économie et la gestion des choses. Cela augmente directement [taxation|E], donc chaque dirigeant le veut. \n\nL’[lifestyle|E] correspondant est le [stewardship_lifestyle|E]."
 game_concept_stewardship_task_contract: "Contrat économique"
 game_concept_stewardship_task_contract_possessive: "Du contrat économique"
 game_concept_stewardship_task_contracts: "Contrats économiques"
 game_concept_stewardship_task_contracts_possessive: "Des contrats économiques"
 game_concept_story_content_el_cid_desc: "#tooltip_heading Style de l'histoire : Léger#!\n\nEn tant qu'El Cid, vous serez injustement écarté par le chef de votre parti. En exil, vous pouvez choisir de rester loyal ou de suivre votre propre chemin, aboutissant finalement à un retour à la cour #EMP ou#! le prix ultime — Valence.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading Style de l'histoire : Modéré#!\n\nEn tant que Hasan, vous serez guidé sur un chemin de fanatisme religieux, choisissant un lieu pour apporter la lumière de la Vraie Idéologie et convertir [counties|E] hors de sous leur [rulers|E].\n\nFinalement, votre histoire culminera avec un soulèvement religieux majeur contre votre ennemi choisi.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading Style de l'histoire : Léger#!\n\nEn tant que Temüjin, vous chercherez vengeance contre une tribu rivale qui avait emprisonné votre conjoint, et testerez la loyauté de votre plus proche soutien et ami — Jamukha.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "Pression"
 game_concept_stress_desc: "Les personnages entrent sous $game_concept_stress$ lorsqu'ils agissent contre leur [personality_traits|E] : le député loyal votant contre la discipline de parti, le ministre honnête contraint de défendre une mauvaise ligne.\n\n Les personnages sous assez de pression gagnent un [stress_level|E], avec des effets sur leur santé qui durent jusqu'à ce qu'ils le réduisent à nouveau.\n\n Le temps loin de Westminster et [activities|E] le soulage."
 game_concept_stress_level: "Niveau de pression"
 game_concept_stress_level_desc: "Tous les 100 [stress|E] accumulés par un personnage provoquent également un niveau de pression. Les niveaux de pression vont de 0 à 3, chaque niveau imposant des pénalités croissantes aux [fertility|E] et [health|E] du personnage.\n\nDe plus, tant qu'un personnage a au moins 1 niveau de pression, il est vulnérable à [mental_breaks|E]."
 game_concept_stress_levels: "Niveaux de pression"
 game_concept_stress_loss: "Perte de pression"
 game_concept_stressed: "Sous pression"
 game_concept_strong_vassal: "Député d’arrière-ban fort"
 game_concept_strong_vassal_desc: "Un $game_concept_strong_vassal$ est un [vassal|E] qui approche ou dépasse son [liege|E] en puissance, subissant une pénalité de [opinion|E]. #weak Ils considèrent le chef de leur parti comme faible et mal adapté pour diriger le parti.#!"
 game_concept_strong_vassals: "Députés d’arrière-ban forts"
 game_concept_struggle_involved_faith: "Idéologie impliquée"
 game_concept_struggle_involved_faiths: "Idéologies impliquées"
 game_concept_struggle_persia_phase_unrest_desc: "Assiégé par des rébellions et des intrigues, le Califat s'effondre. Des seigneurs de guerre ambitieux et des gouverneurs rusés s'emparent de tout pouvoir qu'ils peuvent usurper, se querellant constamment. \n\n Avec le temps, à moins que la situation ne soit résolue par un [ending_phase|E], le parti entrera dans une phase [struggle_persia_phase_stabilisation|E] alors que des partisans désespérés tentent de récupérer l'autorité califale."
 game_concept_struggle_phase_desc: "Un $game_concept_struggle_phase_phase$ est un état d'esprit général commun aux [struggle_involved|E] [characters|E] et [counties|E] au sein d'un [struggle_region|E]. Il représente les tendances et mœurs sociétales à court terme dominant temporairement le dialogue du [struggle|E].\n\n#weak Exemple : dans un $game_concept_struggle_phase_phase$, les habitants d'un $game_concept_struggle_region_region$ peuvent penser que la tolérance religieuse est primordiale même si le reste de leur idéologie est en désaccord.#!"
 game_concept_supply_limit_desc: "Le $game_concept_supply_limit$ dicte la quantité de [soldiers|E] que vous pouvez avoir dans un [barony|E], telle que déterminée par le [terrain|E] et le [development|E] du Ward.\n\nSi la taille totale de votre [army|E] dépasse le $game_concept_supply_limit$, votre $game_concept_armies$ perdra du [supply|E] et subira éventuellement du [attrition|E]."
 game_concept_temporal_head_of_faith: "Chef du Mouvement Temporel"
 game_concept_tenet: "Cause"
 game_concept_tenet_desc: "Bien que [doctrines|E] représente des questions sur lesquelles un [rite|E] doit prendre position, $game_concept_tenets$ représente les particularités et pratiques uniques de l'Idéologie."
 game_concept_tenet_knowledge: "Connaissance de la politique"
 game_concept_tenet_knowledge_desc: "Les politiciens ne connaissent pas en détail la pensée de chaque autre idéologie.\n\nConnaître tous les $game_concept_core_tenets$ et $game_concept_doctrines$ d'un $game_concept_rite$ facilite le changement d'avis pour celui-ci.\n\nTous les [core_tenets|E] et [doctrines|E] de votre propre [faith|E] vous sont connus. Plus peuvent être appris de [spouses|E], [friends|E] et [activities|E]."
 game_concept_tenet_popularity: "Popularité de la cause"
 game_concept_tenet_popularity_desc: "À mesure que [personal_tenets|E] se propage dans un [faith|E], leur pratique devient plus courante. $game_concept_tenet_popularity$ suit la diffusion d'un [core_tenet|E] et influence la probabilité qu'il soit choisi comme sujet de débat dans un [ecumenical_council|E] ou comme cible d'un [papal_bull|E].\n\nPlus le $game_concept_tenet_popularity$ est élevé, plus le [clergy|E] soutiendra une cause lorsqu'elle est débattue dans un [ecumenical_council|E]. Une fois qu'une cause atteint #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, le [head_of_faith|E] la déclarera très probablement [permitted_tenet_status|E] quelle que soit leur propre conviction."
 game_concept_tenet_status: "Statut de la cause"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ est une position [rite_possessive|E] sur un [core_tenet|E] ou [doctrine|E]. Il y a cinq positions possibles :\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — le $game_concept_rite$ n'a jamais entendu parler de ce $game_concept_core_tenet$ ou $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — le $game_concept_rite$ en est conscient et n'a pas statué sur sa pratique.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — le $game_concept_rite$ approuve la pratique.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — le $game_concept_rite$ interdit la pratique.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — le $game_concept_rite$ permet et promeut activement le $game_concept_core_tenet$.\n\nLa position d'une idéologie détermine si un $game_concept_core_tenet$ ou $game_concept_doctrine$ peut être choisi lors de la création ou de la divergence d'un $game_concept_rite$, et quelles pratiques coûtent des pénalités spirituelles [followers|E].\n\nL'État de la Cause est distinct d'un [character_possessive|E] [tenet_knowledge|E], qui est la conscience personnelle, et non la position globale du $game_concept_rite$."
 game_concept_tenets: "Causes"
 game_concept_the_christian_church_desc: "L'Église chrétienne est le corps ecclésiastique qui supervise et guide les fidèles de Jésus-Christ, représenté comme un [situation|E] qui avance à travers une séquence de [the_christian_church_chapters_short|E].\n\nSes frontières englobent chaque [archdiocese|E] dans le monde; chaque [christian|E] [ruler|E] de rang [county|E] ou supérieur dans une partie de leur [realm|E] à l'intérieur d'une Archidiocèse est membre, qu'ils soient responsables de parti ou laïques."
 game_concept_theocratic_vassal: "Député de backbench théocratique"
 game_concept_theocratic_vassal_desc: "Députés de l'arrière ban qui ont le formulaire [theocratic_government|E].\n\nLa façon dont ils fonctionnent est déterminée par un [faithpossessive|E] [doctrines|E]."
 game_concept_theocratic_vassals: "Députés de backbench théocratiques"
 game_concept_title_allegiance_desc: "[vassals|E] peut devoir allégeance à un [title|E] spécifique plutôt qu'à la personne de son [liege|E]. Cela ne peut se produire que si le Titre a son propre [succession_law|E]. À [succession|E], ces députés d'arrière-ban deviendront des députés d'arrière-ban du nouveau Titre [holder|E]."
 game_concept_title_desc: "Un $game_concept_title$ est essentiellement un certificat de propriété foncière.\n\nLa plus petite unité de terrain sur la carte est le [barony|E]. Les quartiers sont organisés en zones plus grandes appelées [counties|E]. Les circonscriptions [de_jure|E] appartiennent à un [duchy|E], les régions à un [kingdom|E], et les nations à un [empire|E].\n\nLes régions, nations et empires n'ont pas toujours un [holder|E], mais ce sont des titres qui peuvent être [created|E] par un dirigeant qui contrôle suffisamment du territoire correspondant."
 game_concept_title_men_at_arms: "Activistes du titre"
 game_concept_top_liege: "Premier ministre"
 game_concept_top_liege_possessive: "Du Premier ministre"
 game_concept_top_lieges: "Premiers ministres"
 game_concept_top_realm: "Parti supérieur"
 game_concept_torture_desc: "[imprisoned|E] Les personnages peuvent être $game_concept_tortured$, endommageant leur [health|E] ou même les estropiant de différentes manières.\n\nLa torture peut soulager [stress|E] pour [GetTrait('callous').GetName( GetNullCharacter )] et [GetTrait('sadistic').GetName( GetNullCharacter )] personnages, mais cause de la pression pour ceux de nature semblable.\n\nTorturer [rulers|E] peut également augmenter votre [dread|E]."
 game_concept_tour_stop_desc: "Un [activity_phase|E] pendant un [royal_tour|E] au cours duquel un chef de parti peut soit : assister à un [hosted_dinner|E], [tour_the_grounds|E] de leur [vassal|E], ou profiter d'un [cultural_festival|E]."
 game_concept_transfer_desc: "[rulers|E] peut $game_concept_transfer$ un de leurs [vassals|E] à un autre député de la base, tant que le premier est de rang inférieur au second. C'est un bon moyen d'augmenter le [opinion|E] d'un député de la base, surtout si le député transféré [de_jure|E] fait partie de leur [realm|E]."
 game_concept_treasury_vassal_development: "Développement de l'arrière-ban"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ représente l'influence générale qu'un [tribal|E] [ruler|E] exerce sur son [vassals|E]. Comparé à [crown_authority|E], il offre moins de pouvoirs et à des niveaux plus tardifs.\n\nIl y a quatre niveaux de $game_concept_tribal_authority$ : [disparate_tribes|E], [limited_tribal|E], [high_tribal|E] et [absolute_tribal|E]. Augmenter $game_concept_tribal_authority$ coûte une quantité de [prestige|E] selon le niveau et le [learning_skill|E] du souverain, mais est généralement plus cher qu'augmenter l'autorité de la couronne.\n\n#weak Les députés de second rang n'aiment pas les niveaux plus élevés de $game_concept_tribal_authority$, et le baisser est l'objectif principal de tout [liberty_faction|E].#!"
 game_concept_tribal_desc: "Les partis tribaux ont [development|E] de circonscription limitée, ne peuvent pas dépasser les [innovations|E] de l’ère tribale, ne peuvent pas construire de nouveaux [holdings|E] et sont généralement incapables de changer leur [succession_law|E]. \n\nH Cependant, ils peuvent utiliser [prestige|E] plutôt que [gold|E] pour construire leurs partis et embaucher des [men_at_arms|E], et ont accès à plus de [casus_belli|E] que [feudal|E] partis. Les armées non tribales subissent une pénalité [supply_limit|E] dans les territoires tribaux hostiles."
 game_concept_unassigned_vassal: "Députés d’arrière-ban non taxés"
 game_concept_unassigned_vassals: "Députés d’arrière-ban non taxés"
 game_concept_undirected_great_holy_war_desc: "Une $game_concept_undirected_great_holy_war$ est déclarée par un $doctrine_spiritual_head_name$ [head_of_faith|E] dans le but de soumettre un [kingdom|E] à la règle de leur [faith|E].\n\n$game_concept_undirected_great_holy_wars$ ne sont pas lancés immédiatement, ils entrent plutôt dans un [preparation_phase|E].\n\nAvant et pendant la guerre, les dirigeants de l’idéologie attaquante peuvent choisir de donner des [gold|E] au [war_chest|E].\n\nSi elle est victorieuse, la Nation ciblée sera prise et donnée à un personnage de l’idéologie attaquante. Les récompenses pour les attaquants incluent [piety|E] et éventuellement le fait que leur [dynasty|E] devienne [landed|E] au sein de la Nation conquise."
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] obtenir un [battle|E] [advantage|E] dans [counties|E] de leur idéologie."
 game_concept_usurp_title_desc: "Un [title|E] détenu par un [ruler|E] étranger peut généralement être Usurpé si plus de #V 50%#! de son [de_jure|E] [counties|E] se trouvent à l'intérieur de votre [realm|E]. Ce processus vous donne le [title|E], ce qui est particulièrement important pour garantir que vous êtes le [rightful_liege|E] de votre [vassals|E].\n\nL'usurpation est plus difficile si le [faith|E] du détenteur actuel est hostile au vôtre ; dans ce cas, l'usurpation n'est possible que si le détenteur ne possède plus aucun de ses [de_jure|E] [counties|E] à l'intérieur de son Parti."
 game_concept_varangian_adventure_desc: "Il s'agit d'un type spécial de [war|E], où l'attaquant a l'intention de déplacer son [realm|E] vers le [war_target|E] en gros.\n\nS'ils gagnent, ils annexeront immédiatement le [counties|E] approprié et y déplaceront leur [capital|E]. Leurs anciens sièges arrière deviendront indépendants, et leurs anciens $game_concept_counties$ seront donnés à de nouveaux seigneurs locaux. $game_concept_varangian_adventures$ sont #EMP UNIQUEMENT#! disponibles pour [duke|E] et $game_concept_count$-[title_tier|E] [rulers|E], devenant progressivement plus chers avec chaque $game_concept_varangian_adventure_adventure$ réussi.\n\nCe [casus_belli|E] est #EMP JAMAIS#! disponible après le $culture_era_tribal$ [era|E], et ne peut pas être utilisé contre d'autres [cultures|E] pouvant $game_concept_varangian_adventure_adventure$ ou contre les $game_concept_rulers$ voisins.\n\n$north_germanic_group_collective_noun$Lancement de leur premier $game_concept_varangian_adventure$ reçoivent jusqu'à [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] bonus [special_troops|E], le montant augmentant avec chaque circonscription même-[faith|E] même-[culture|E] qu'ils contrôlent complètement à l'intérieur de [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_vassal: "Arrière-ban"
 game_concept_vassal_contract: "Contrat d'arrière-ban"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ dictent le [obligations|E] entre un [vassal|E] et leur [liege|E].\n\n Les députés de l'arrière banc du [feudal|E], [clan|E], [administrative|E] et [nomadic|E] $game_concept_government_forms$ ont accès à différents [obligations|E], négociés individuellement pour chaque député de l'arrière banc.\n\n Tous les députés de l'arrière banc paient un pourcentage de leur total [taxes|E] et [levies|E] à leur chef de parti, basé sur leur [obligations|E]. #EMP Ces [modifier_contributions|E] peuvent à leur tour être modifiés par des options de 'petites lignes' such as [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\n Certains Contrats Spéciaux sont limités à certains Rangs:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] et [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] et au-dessus\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] et au-dessus\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: [count|E] uniquement\n\n#weak Note, [governor|E] [obligations|E] sont également connus sous le nom de [province_administrations|E].#!"
 game_concept_vassal_contracts: "Contrats d'arrière-ban"
 game_concept_vassal_desc: "Un $game_concept_vassal$ est un politicien qui rend compte à un autre : un député à son [liege|E], un chef de parti au Premier ministre.\n\nLes députés de base donnent à leur chef de parti [levies|E] et [taxes|E] — leur [obligations|E] — en échange du whip et du soutien.\n\nSi le $game_concept_vassal$ d'un [opinion|E] à l'égard de leur chef de parti est faible, ils peuvent rejoindre [factions|E], ou [scheme|E] pour les remplacer."
 game_concept_vassal_directive: "Directive de l'arrière-ban"
 game_concept_vassal_directive_desc: "En tant que [liege|E], vous pouvez émettre des Directives à votre [vassals|E], influençant leur [councillor_tasks|E] et quels [buildings|E] ils construisent.\n\nPour émettre une Directive, vous devez l'activer, par exemple en ayant #P 50#! ou plus [opinion|E] avec le Backbencher. Les [government_forms|E] avancés ne nécessitent pas cela."
 game_concept_vassal_directives: "Directives de l'arrière-ban"
 game_concept_vassal_limit: "Limite de l'arrière-ban"
 game_concept_vassal_limit_desc: "Le $game_concept_vassal_limit$ détermine combien de [direct_vassals|E] vous pouvez légalement avoir (à l'exclusion des [barony|E] de rang inférieur).\n\nBien que vous puissiez dépasser votre $game_concept_vassal_limit$, le faire réduira le [taxes|E] et le [levies|E] fournis par vos députés de rang inférieur, et il pourrait être préférable de [transferring|E] certains députés de rang inférieur pour rester en dessous de la limite."
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ définit combien de [tax|E] et combien de [levies|E] un [subject|E] fournit à leurs [suzerain|E]. Le [government_form|E] d'un Sujet détermine comment leurs $game_concept_obligations$ sont modifiés.\n\n#weak Par exemple, [GetGovernment('feudal_government').GetName] et [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$ dépendent de leur [vassal_contract|E], [GetGovernment('administrative_government').GetName] Les députés de l'arrière banc dépendent de leur [province_administration|E], tandis que [tributary_possessive|E] dépendent de leur [tributary_contract|E]."
 game_concept_vassal_possessive: "De l'arrière-ban"
 game_concept_vassal_stance: "Position de l'arrière-ban"
 game_concept_vassal_stance_desc: "Chaque [vassal|E] a une position de rétrograde qui affecte le [opinion|E] qu'ils ont avec vous en tant que leur [liege|E], et le [heir|E] qu'ils préfèrent comme successeur du [realm|E].\n\nLes rétrogrades ayant la même position aimeront et n'aimeront pas les mêmes choses. Par exemple; tous les [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] rétrogrades n'aiment pas quand vous perdez [wars|E].\n\nChaque position de rétrograde préfère un héritier spécifique. Lors de la succession, chaque héritier préféré aura un [legitimacy_expectations|E] plus faible avec les rétrogrades de cette position.\n\n#low Les positions de rétrograde sont :#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "Positions de l'arrière-ban"
 game_concept_vassal_taxes: "Taxes de l'arrière-ban"
 game_concept_vassal_taxes_desc: "Vos $game_concept_vassal_taxes$ consistent en les [taxes|E] que vous recevez de vos [vassals|E]. Le montant dépend du [obligations|E] de chaque député de base.\n\n Du point de vue de vos députés de base, ces mêmes taxes sont appelées [liege_taxes|E] afin de les distinguer de tous $game_concept_vassal_taxes$ qu'ils perçoivent de leurs propres $game_concept_vassals$."
 game_concept_vassals: "Arrière-bans"
 game_concept_vassals_possessive: "Députés de l'arrière ban"
 game_concept_victory_desc: "$game_concept_victory$ est l'un des trois [peace_offers|E] possibles. Le résultat exact de la Victoire dans un [war|E] dépend du [casus_belli|E].\n\nPour l'Attaquant, cela implique généralement la saisie de [titles|E] dans la région [war_target|E].\n\nPour le Défenseur, la Victoire signifie généralement que l'attaquant doit payer une grande somme d'argent en réparations de guerre."
 game_concept_virtue_desc: "Chaque [rite|E] considère certains [traits|E] comme vertueux. Les personnages possédant ces Traits gagnent des bonus [opinion|E] de tous les personnages qui considèrent ces traits comme vertueux, même s'ils ne partagent pas la même idéologie. De plus, les personnages ayant des Traits que leur propre idéologie considère comme vertueux gagneront des bonus [piety|E] chaque mois.\n\nLes traits considérés comme des vertus varient d'une idéologie à l'autre, mais sont généralement déterminés par une combinaison du [core_tenets|E] de cette idéologie et du [religion|E] auquel l'idéologie appartient."
 game_concept_virtue_weight_desc: "Les traits peuvent avoir un [sin|E] ou un [virtue|E] associé au poids, déterminé par le [core_tenets|E] et [doctrines|E] d’un [rite|E], et le [religion|E] auquel il appartient.\n\nLes traits ayant le plus grand poids de Péché ou de Vertu au sein d’une idéologie deviennent le [sins|E] et [virtues|E] de cette idéologie."
 game_concept_wanderer_desc: "Les personnages qui n'appartiennent pas à un [court|E] ou ne détiennent aucun [titles|e] sont appelés Vagabonds. Ils voyagent à travers le monde, visitant des Bureaux en tant que [guests|E] en chemin. Les Vagabonds peuvent devenir [mercenary|E] Capitaines, chefs de [holy_orders|E], membres [clergy|E], ou détenteurs de [city|E]."
 game_concept_wanua_desc: "Le $wanua_government_adjective$ [government|E] partage des faiblesses avec le [GetGovernment('tribal_government').GetNameWithIcon] [government|E], mais a également [domain_limit|E] et [vassal_limit|E] réduits. Bien qu'ils utilisent [gold|E] pour construire [buildings|E] et recruter [men_at_arms|E], ils gagnent très peu de Fonds à partir des bâtiments.\n\nCependant, ils peuvent [barter_goods_i][barter|E], [raid|E], et avoir des synergies avec le Gouvernement [GetGovernment('mandala_government').GetName] car ils gagnent [legitimacy|E] en étant un [tributary|E]."
 game_concept_war_chest_desc: "Le $game_concept_war_chest$ est une collection de [gold|E], [piety|E] et [prestige|E]. Le contenu est principalement utilisé comme récompense pour avoir gagné avec succès des [undirected_great_holy_wars|E], où ils sont répartis entre les attaquants en fonction de leur participation au [war|E].\n\nUne certaine portion de ce qui se trouve dans le $game_concept_war_chest$ est également répartie entre les attaquants lors de la déclaration de guerre.\n\nSi un [undirected_great_holy_war|E] est vaincu, les défenseurs diviseront la portion de Capital Politique et de Profil du $game_concept_war_chest$ entre eux #weak (les fonds sont perdus.)#!"
 game_concept_winter_desc: "L’hiver draine progressivement [supply|E] au fil du temps, faisant perdre des approvisionnements aux armées alors qu’elles se trouvent dans une barrière affectée par l’hiver. La pénalité d’approvisionnement augmente à chaque sévérité. L’hiver a trois sévérités différentes ; [Concept( 'winter_severity_mild', 'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E] et [Concept( 'winter_severity_harsh', 'Harsh' )|E]."
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ sont des améliorations uniques de la $game_concept_yurt$.\n\nMécaniquement, elles sont [domicile_buildings|E] — bien que beaucoup représentent des coutumes sociales ou simplement des domaines d'intérêt pour la tribu $game_concept_nomad$, plutôt que d'être des structures littérales.\n\nLes bonus qu'elles peuvent conférer incluent :\n$EFFECT_LIST_BULLET$ Déblocage de [court_positions|E] et de [decisions|E] nomades et [character_interaction|E]s\n$EFFECT_LIST_BULLET$ Divers bonus à [herd|E] et [county_fertility|E], y compris des spécialisations [terrain|E]\n$EFFECT_LIST_BULLET$ Déblocage et amélioration de [men_at_arms|E] nomades et augmentation de la force de [horde|E]\n$EFFECT_LIST_BULLET$ Bonus uniques de [culture_tradition|E] nomades\n$EFFECT_LIST_BULLET$ Moyens de gérer votre [vassals|E] et [tributaries|E], ainsi que d'influencer [characters|E] dans votre bureau.\n$EFFECT_LIST_BULLET$ Bonus [kurultai|E] et [obedience|E]."
 maximum_piety_level_mandala: "\n\nCependant, lorsqu'un [mandala|E] [ruler|E] meurt d'une manière acceptable pour son [aspect|E], après avoir atteint [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], le [heir|E] de ce dirigeant développe la capacité de progresser au niveau suivant du capital politique jusqu'à atteindre [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
