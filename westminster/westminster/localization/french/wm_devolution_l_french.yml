l_french:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "Lire le Briefing sur la Dévolution"
 wm_devolution_briefing_decision_desc: "Note hebdomadaire du Cabinet sur l'état de l'Union:\n\n#bold Écosse:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% soutiennent l'indépendance; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10\n#bold Pays de Galles:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% soutiennent l'indépendance; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10\n#bold Irlande du Nord:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% soutiennent une Irlande unie; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10; stabilité du partage du pouvoir [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100\n\n#bold Confiance du public dans la politique:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] de 100."
 wm_devolution_briefing_decision_tooltip: "Où se situe l'Union et à quel point le public fait-il confiance à ses politiciens."
 wm_devolution_briefing_decision_confirm: "Lire-le"
 wm_devolution.30.t: "L'État de l'Union"
 wm_devolution.30.desc: "#italic Bureau du Cabinet, pour diffusion#!\n\n#bold Écosse :#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% en faveur de l'indépendance ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10\n#bold Pays de Galles :#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% en faveur de l'indépendance ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10\n#bold Irlande du Nord :#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% en faveur d'une Irlande unie ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10 ; stabilité du partage du pouvoir [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100\n\nLe soutien au départ fluctue avec la confiance du public envers Westminster, avec des pouvoirs récupérés ou transférés, et selon qui dirige chaque gouvernement dévolu. Une fois que la moitié est dépassée, un gouvernement dirigé par des nationalistes peut demander formellement un référendum.\n\n#bold Confiance du public dans la politique :#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] de 100 ; participation prévue à une élection générale [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%."
 wm_devolution.30.suspended: "\n\n#N L’Assemblée d’Irlande du Nord est suspendue : #! partage du pouvoir s’est effondré, et seules les négociations (ou le temps) le ramènera."
 wm_devolution.30.sitting: "\n\nL'Assemblée d'Irlande du Nord siège, et le partage du pouvoir tient."
 wm_devolution.30.a: "Noté."
 wm_devolution_devolve_decision: "Déléguer un pouvoir"
 wm_devolution_devolve_decision_desc: "Remettre un autre pouvoir à Édimbourg, Cardiff ou Belfast. Plus de pouvoirs réduisent la pression sur le cas du départ et satisfont le gouvernement dévolu. \n\n#bold Écosse : #! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% en faveur de l'indépendance ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10 \n#bold Pays de Galles : #! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% en faveur de l'indépendance ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10 \n#bold Irlande du Nord : #! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% en faveur d'une Irlande unie ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10 ; stabilité du partage du pouvoir [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100"
 wm_devolution_devolve_decision_tooltip: "Donner plus de pouvoirs à un gouvernement dévolu."
 wm_devolution_devolve_decision_confirm: "Choisissez une Nation"
 wm_devolution_devolve_decision_effect_tt: "Choisissez une nation : ses pouvoirs augmentent de 1, le soutien pour le départ diminue de #P 3#! points (et se stabilise plus bas), son Premier Ministre est satisfait, et la confiance publique augmente de 1."
 wm_devolution_claw_back_decision: "Griffer un pouvoir"
 wm_devolution_claw_back_decision_desc: "Reprendre un pouvoir à Westminster. Les journaux unionistes se réjouiront ; le gouvernement dévolu et ses électeurs ne seront pas satisfaits. \n\n#bold Écosse : #! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% pour l'indépendance ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] sur 10\n#bold Pays de Galles : #! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% pour l'indépendance ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] sur 10\n#bold Irlande du Nord : #! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% pour une Irlande unie ; pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] sur 10 ; stabilité du partage du pouvoir [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] sur 100"
 wm_devolution_claw_back_decision_tooltip: "Rendre un pouvoir dévolu à Westminster."
 wm_devolution_claw_back_decision_confirm: "Choisissez une Nation"
 wm_devolution_claw_back_decision_effect_tt: "Choisissez une nation : ses pouvoirs diminuent de 1, le soutien pour le départ augmente de #N 3#! points (et se stabilise plus haut), son Premier Ministre est furieux, la confiance publique diminue de 2, et vous gagnez un peu de notoriété."
 wm_devolution_stormont_talks_decision: "Convoquer les pourparlers de Stormont"
 wm_devolution_stormont_talks_decision_desc: "Le partage du pouvoir en Irlande du Nord s'est effondré. Faites revenir les partis à la table pour des discussions intensives : un accord rétablit l'Assemblée. Vos chances augmentent avec votre charisme et avec la stabilité du partage du pouvoir (maintenant [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] sur 100)."
 wm_devolution_stormont_talks_decision_tooltip: "Essayer de rétablir le partage du pouvoir à Stormont."
 wm_devolution_stormont_talks_decision_confirm: "Convoquer les pourparlers"
 wm_devolution_stormont_talks_decision_effect_tt: "Le succès restaure l'Assemblée, augmente la confiance du public de 2 et vous fait gagner du profil. L'échec rapproche néanmoins les partis (+5 stabilité)."
 wm_devolution.1.t: "Une demande de référendum"
 wm_devolution.1.desc: "Le [wm_dev_gov.GetNameNoTier] a officiellement demandé à Westminster le pouvoir d'organiser un référendum sur la sortie du Royaume-Uni. Ses propres sondages indiquent un soutien de [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%, et il affirme que le mandat est clair.\n\nLes bancs unionistes veulent un refus total. Vos conseillers sont moins sûrs."
 wm_devolution.1.a: "Accepter un référendum."
 wm_devolution.1.a.tt: "Jour de scrutin dans six mois. Le résultat dépendra du soutien à ce moment-là, plus ou moins quelques points. Un Oui serait un désastre pour vous."
 wm_devolution.1.b: "Ce n'est pas le moment."
 wm_devolution.1.b.tt: "Le soutien pour le départ augmente de #N 4#! points et le Premier ministre vous en veut. Ils peuvent demander de nouveau dans trois ans."
 wm_devolution.1.c: "Offrir plus de pouvoirs à la place.  Bureau"
 wm_devolution.1.c.tt: "La nation gagne un pouvoir et le soutien chute de #P 3#! points, à un faible coût en profil. Ils peuvent demander à nouveau dans trois ans."
 wm_devolution.20.t: "Délégation de pouvoirs"
 wm_devolution.20.desc: "Quel gouvernement décentralisé obtient les nouveaux pouvoirs ?"
 wm_devolution.20.scotland: "Dévoluer à l'Écosse (pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10)."
 wm_devolution.20.wales: "Dévoluer au Pays de Galles (pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10)."
 wm_devolution.20.northern_ireland: "Dévoluer à l'Irlande du Nord (pouvoirs [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10)."
 wm_devolution.20.none: "En y repensant, pas maintenant."
 wm_devolution.21.t: "Reprendre le contrôle"
 wm_devolution.21.desc: "Quel gouvernement décentralisé perd un pouvoir au profit de Westminster ?"
 wm_devolution.21.scotland: "Claw back from Scotland (puissances [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10)."
 wm_devolution.21.wales: "Creadback du Pays de Galles ([EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10 puissances)."
 wm_devolution.21.northern_ireland: "Revient d’Irlande du Nord ([EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10 puissances)."
 wm_devolution.21.none: "En y repensant, pas maintenant."
 wm_dev_referendum_agreed_toast: "RÉFÉRENDUM ACCEPTÉ"
 wm_dev_referendum_agreed_toast_desc: "Westminster a accepté la demande de [wm_dev_gov.GetNameNoTier] : un référendum sur la sortie du Royaume-Uni aura lieu dans six mois."
 wm_dev_referendum_refused_toast: "RÉFÉRENDUM REFUSÉ"
 wm_dev_referendum_refused_toast_desc: "Westminster a refusé la demande de référendum de [wm_dev_gov.GetNameNoTier]. Le soutien au départ augmente."
 wm_dev_referendum_powers_toast: "PLUS DE POUVOIRS À LA PLACE"
 wm_dev_referendum_powers_toast_desc: "Westminster a répondu à la demande de référendum de [wm_dev_gov.GetNameNoTier] par une offre de nouveaux pouvoirs."
 wm_dev_stormont_collapse_toast: "S’EFFONDRE DE STORMONT"
 wm_dev_stormont_collapse_toast_desc: "Le partage du pouvoir en Irlande du Nord s'est effondré et l'Assemblée est suspendue. La confiance publique en prend un coup."
 wm_dev_stormont_restored_toast: "STORMONT RESTAURÉ"
 wm_dev_stormont_restored_toast_desc: "Un accord a été conclu et le partage du pouvoir revient en Irlande du Nord."
 wm_dev_stormont_talks_failed_toast: "POURPARLERS DE STORMONT ÉCHOUENT"
 wm_dev_stormont_talks_failed_toast_desc: "Les pourparlers se sont terminés sans accord, bien que les parties soient plus proches qu'elles ne l'étaient."
 wm_dev_referendum_yes_toast_scotland: "L’ÉCOSSE VOTE OUI"
 wm_dev_referendum_yes_toast_scotland_desc: "L'Écosse a voté pour l'indépendance écossaise, avec [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Les négociations sur le départ du Royaume-Uni commencent, et l'autorité du Premier ministre est brisée."
 wm_dev_referendum_no_toast_scotland: "L’ÉCOSSE VOTE NON"
 wm_dev_referendum_no_toast_scotland_desc: "L'Écosse a rejeté l'indépendance écossaise : seulement [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% ont voté Oui. La question est réglée pour une génération, du moins l'espère Westminster."
 wm_dev_referendum_yes_toast_wales: "LE PAYS DE GALLES VOTE OUI"
 wm_dev_referendum_yes_toast_wales_desc: "Pays de Galles a voté pour l’indépendance galloise, avec une avance de [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0] %. Les négociations sur le départ du Royaume-Uni commencent, et l’autorité du Premier ministre est brisée."
 wm_dev_referendum_no_toast_wales: "LE PAYS DE GALLES VOTE NON"
 wm_dev_referendum_no_toast_wales_desc: "Pays de Galles a rejeté l’indépendance galloise : seulement [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0] % ont voté Oui. La question est réglée pour une génération, du moins c’est ce que Westminster espère."
 wm_dev_referendum_yes_toast_northern_ireland: "L'IRLANDE DU NORD VOTE OUI"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "L’Irlande du Nord a voté pour une Irlande unie, avec une marge de [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0] %. Les négociations pour quitter le Royaume-Uni commencent, et l’autorité du Premier ministre est brisée."
 wm_dev_referendum_no_toast_northern_ireland: "L'IRLANDE DU NORD VOTE NON"
 wm_dev_referendum_no_toast_northern_ireland_desc: "l’Irlande du Nord a rejeté une Irlande unie : seulement [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0] % ont voté Oui. La question est réglée pour une génération, du moins c’est ce que Westminster espère."
 wm_dev_assembly_suspended_modifier: "Assemblée suspendue"
 wm_dev_assembly_suspended_modifier_desc: "Le partage du pouvoir s'est effondré et l'Assemblée d'Irlande du Nord est suspendue."
