l_french:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "Le Comte"
 wm_dispute.1.desc: "#italic Déclaration du responsable du dépouillement#!\n\n[wm_dispute_mp.GetName] a été déclaré gagnant dans [wm_dispute_seat.GetNameNoTier] avec une marge de [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] points."
 wm_dispute.1.close: "C'est assez proche pour que les agents murmurent déjà au sujet de lots de bulletins comptés deux fois et d'une boîte arrivée en retard. Un recompte (une semaine, [EmptyScope.ScriptValue('wm_dispute_recount_cost')|0] en frais) pourrait changer le résultat, peut-être une chance de [EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0] % ; une pétition électorale (quatre mois et [EmptyScope.ScriptValue('wm_dispute_court_cost')|0]) pourrait voir le résultat déclaré nul et la circonscription se revoir attribuée, peut-être une chance de [EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0] %."
 wm_dispute.1.clear: "Ce n'est pas proche. Un recompte ([EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]) ne changerait très probablement rien, et le public n'aime pas un mauvais perdant : contester cela vous coûtera en image et en capital politique."
 wm_dispute.1.bad: "Ce n'était même pas proche : une défaite écrasante. Contester cela ferait de vous la risée et pourrait amener des partisans en colère dans les rues."
 wm_dispute.1.a: "Féliciter le gagnant."
 wm_dispute.1.b: "Exiger un recompte."
 wm_dispute.1.b.tt: "Chaque bulletin de vote est recompté. Cela coûte de l'argent ; si le résultat n'était pas serré, cela vous coûte également du profil et du capital politique."
 wm_dispute.1.c: "Requête auprès du tribunal électoral."
 wm_dispute.1.c.tt: "Les juges examinent le déroulement de l’élection. Elle est lente et coûteuse ; ils peuvent déclarer l’élection nulle et ordonner une nouvelle élection partielle, ou vous accorder des frais."
 wm_dispute_recount_toast: "Recompte à [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName] a demandé un recomptage à [wm_dispute_seat.GetNameNoTier]. Le personnel de comptage est de retour à ses tables."
 wm_dispute_court_toast: "Requête électorale : [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName] a saisi le tribunal électoral concernant le résultat en [wm_dispute_seat.GetNameNoTier]. Les juges rendront leur rapport dans quelques mois."
 wm_dispute_overturned_toast: "RECOMPTE ANNULE LE RÉSULTAT"
 wm_dispute_overturned_toast_desc: "Après un recomptage, [wm_dispute_mp.GetName] est déclaré député de [wm_dispute_seat.GetNameNoTier] par une poignée de voix."
 wm_dispute_upheld_toast: "Recompte Confirme le Résultat"
 wm_dispute_upheld_toast_desc: "le recomptage à [wm_dispute_seat.GetNameNoTier] confirme [wm_dispute_mp.GetName] comme son député."
 wm_dispute_void_toast: "ÉLECTION DÉCLARÉE NULLE"
 wm_dispute_void_toast_desc: "Le tribunal électoral a déclaré le résultat de [wm_dispute_seat.GetNameNoTier] nul. Il y aura une nouvelle élection partielle."
 wm_dispute_dismissed_toast: "Requête électorale rejetée"
 wm_dispute_dismissed_toast_desc: "Le tribunal électoral a rejeté la requête concernant [wm_dispute_seat.GetNameNoTier] et a condamné le requérant aux dépens. [wm_dispute_mp.GetName] reste."
 wm_dispute_national_toast: "REFUSE DE CONCÉDER"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] n'acceptera pas le résultat de l'élection générale. Rien ne changera, mais les partisans se rassemblent dans les rues et les journaux sont impitoyables."
 wm_dispute_seat_decision: "Contester le Relevé"
 wm_dispute_seat_decision_desc: "Vous avez perdu votre siège, mais le dépouillement était-il correct ? Demandez un recomptage ou saisissez le tribunal électoral pour déclarer l'élection nulle. Si ce n'était pas serré, le public vous considérera comme un mauvais perdant."
 wm_dispute_seat_decision_tooltip: "Contester le résultat dans le siège que vous avez perdu."
 wm_dispute_seat_decision_confirm: "En tenir compte"
 wm_dispute_seat_decision_effect_tt: "Vous décidez d'accepter le résultat, de demander un recomptage #bold#! ou de pétitionner le tribunal électoral #bold#!."
 wm_dispute_not_disputed_tt: "Le résultat n'a pas déjà été contesté"
 wm_dispute_no_byelection_tt: "Le siège n'attend pas d'élection partielle"
 wm_dispute_national_decision: "Refuser de céder"
 wm_dispute_national_decision_desc: "Les électeurs vous ont chassé de Downing Street. Vous pourriez refuser de l'accepter : contestez le comptage, les votes par correspondance, les diffuseurs. Cela ne changera rien, vous coûtera cher et fera descendre vos partisans les plus en colère dans la rue."
 wm_dispute_national_decision_tooltip: "Refuser d'accepter le résultat des élections générales."
 wm_dispute_national_decision_confirm: "Refuser de céder"
 wm_dispute_national_decision_effect_tt: "Vous perdez beaucoup de #bold de profil et de capital politique#!, votre parti chute dans les sondages, le nouveau Premier ministre en est contrarié, et #bold des émeutes#! peuvent éclater."
 wm_dispute_sore_loser_modifier: "Mauvais perdant"
 wm_dispute_sore_loser_modifier_desc: "A refusé d'accepter le résultat d'une élection générale."
 wm_dispute_bad_loser_modifier: "Mauvais perdant"
 wm_dispute_bad_loser_modifier_desc: "Contesté un résultat qu'ils avaient clairement perdu."
 wm_dispute_sore_loser_opinion: "A refusé de céder"
