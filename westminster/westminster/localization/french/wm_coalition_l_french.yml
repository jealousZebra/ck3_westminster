l_french:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "COALITION ACCEPTÉE"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] et [wm_coal_leader.GetName] se sont serré la main sur les marches du numéro 10. Le [wm_coal_party.GetNameNoTier] ([wm_coal_party_seats|0] sièges) rejoint le [wm_coal_senior.GetNameNoTier] ([wm_coal_senior_seats|0]) au gouvernement, et [wm_coal_leader.GetFirstName] devient Vice-Premier ministre."
 wm_coalition_headline_supply: "ACCORD CONCLU : GOUVERNEMENT SOUTENU"
 wm_coalition_headline_supply_desc: "Le [wm_coal_party.GetNameNoTier] a conclu un accord de confiance et d'approvisionnement avec le gouvernement de [wm_coal_pm.GetName]. Ses députés [wm_coal_party_seats|0] soutiendront le gouvernement lors des votes de confiance et du Budget, et son leader a obtenu de l'argent pour leurs priorités. Pour tout le reste, chaque vote compte pour soi."
 wm_coalition_headline_minority: "GOUVERNEMENT DE MINORITÉ"
 wm_coalition_headline_minority_desc: "Les négociations n'ont abouti à rien. [wm_coal_pm.GetName] dirigera un gouvernement minoritaire [wm_coal_senior.GetNameNoTier] avec [wm_coal_senior_seats|0] sièges, et devra gagner chaque vote à la Chambre des communes de manière difficile."
 wm_coalition_headline_collapse: "EFFONDREMENT DE LA COALITION"
 wm_coalition_headline_collapse_desc: "Le [wm_coal_party.GetNameNoTier] a quitté le gouvernement de [wm_coal_pm.GetName]. Sans ses votes, le gouvernement n'a pas de majorité et Westminster se prépare à un vote de censure ou à une élection."

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "Parlement suspendu"
 wm_coalition.1.desc: "Le pays a parlé, et personne ne sait vraiment ce qu'il a dit. Le [wm_coal_senior.GetNameNoTier] est le plus grand parti avec #bold [wm_coal_senior_seats|0]#! sièges, insuffisant pour obtenir [wm_coal_majority|0] votes à la Chambre des communes par nous-mêmes.\n\nLe secrétaire du Cabinet a préparé les salles de négociation de la fonction publique. Les dirigeants des autres partis attendent près de leurs téléphones, et la presse est installée devant le numéro 10. Qui appelons-nous ?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier] :#! [wm_coal_choice_1_seats|0] sièges"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier] :#! [wm_coal_choice_2_seats|0] sièges"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier] :#! [wm_coal_choice_3_seats|0] sièges"
 wm_coalition.1.a: "Pourparlers ouverts avec le [wm_coal_choice_1.GetNameNoTier]."
 wm_coalition.1.b: "Pourparlers ouverts avec le [wm_coal_choice_2.GetNameNoTier]."
 wm_coalition.1.c: "Pourparlers ouverts avec le [wm_coal_choice_3.GetNameNoTier]."
 wm_coalition.1.d: "Nous gouvernerons seuls et oserons qu'ils nous renversent."
 wm_coalition.1.d.tt: "Vous dirigez un gouvernement minoritaire #bold#! : chaque projet de loi et chaque vote de confiance doivent obtenir leurs votes le jour même."

 # The terms
 wm_coalition.2.t: "La table des négociations"
 wm_coalition.2.desc: "L'équipe [wm_coal_talks.GetNameNoTier], dirigée par [wm_coal_talks_leader.GetName], est arrivée au Cabinet Office avec une longue liste de demandes. Elles ont #bold [wm_coal_talks_seats|0]#! députés ; avec les nôtres, cela fait [wm_coal_combined_seats|0]."
 wm_coalition.2.majority: "Ensemble, nous aurions une majorité."
 wm_coalition.2.no_majority: "Même ensemble, nous serions à court d'une majorité, mais c'est le meilleur accord proposé."
 wm_coalition.2.mood_warm: "\n\nL’ambiance est chaleureuse. Leurs négociateurs sont d’accord avec une grande partie de notre manifeste et veulent être au gouvernement."
 wm_coalition.2.mood_cool: "\n\nL’humeur est professionnelle. Ils voudront beaucoup en retour, et leurs militants se méfient d’être accusés de nos erreurs."
 wm_coalition.2.mood_cold: "\n\nL’ambiance est glaciale. Nos partis sont éloignés, et leurs députés préfèrent s’asseoir dans l’opposition plutôt que de nous soutenir à bas prix."
 wm_coalition.2.a: "Offrir une coalition : Vice-Premier ministre et un siège au Cabinet."
 wm_coalition.2.a.tt: "Leur chef devient #bold vice-Premier ministre#! et un de leurs députés rejoint le Cabinet. Leurs députés suivent les directives du gouvernement à chaque vote."
 wm_coalition.2.b: "Offrir une coalition et adopter l'une de leurs politiques phares."
 wm_coalition.2.b.tt: "Comme ci-dessus, et leur politique en matière d'animaux de compagnie entre dans le programme gouvernemental. Nos propres députés de l'arrière-ban ne l'aimeront pas : #bold Compromis de coalition#! pour cinq ans."
 wm_coalition.2.c: "Offrir une coalition avec deux sièges au Cabinet et une de leurs politiques."
 wm_coalition.2.c.tt: "Leur chef devient #bold vice-Premier ministre#!, deux de leurs députés rejoignent le Cabinet, et leur politique phare entre dans le programme du gouvernement."
 wm_coalition.2.d: "Offrir confiance et approvisionnement : leurs votes sur la confiance et le budget, contre l’argent."
 wm_coalition.2.d.tt: "Ils restent en dehors du gouvernement mais nous soutiennent sur les motions de confiance négative #bold#! et le projet de loi de finances #bold#!. En retour, nous finançons leurs priorités : cela nous coûte de l'argent et le verse à leur dirigeant."
 wm_coalition.2.e: "Essayons une autre fête."
 wm_coalition_signals_yes_tt: "Leurs négociateurs signalent qu'ils pourraient signer cela."
 wm_coalition_signals_no_tt: "Leurs négociateurs signalent que cela ne suffira pas."

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "Une offre de coalition"
 wm_coalition.3.t_supply: "Une offre de confiance-et-approvisionnement"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName] a appelé. Le [wm_coal_senior.GetNameNoTier] dispose de [wm_coal_senior_seats|0] sièges, en deçà de la majorité, et souhaite que nous entrions au gouvernement : vous comme #bold Vice-Premier Ministre#! et [wm_coal_offer_seats|0] de nos députés autour de la table du Cabinet. En retour, nos députés voteraient avec le gouvernement sur tous les sujets."
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName] a appelé. Le [wm_coal_senior.GetNameNoTier] dispose de [wm_coal_senior_seats|0] sièges, en deçà de la majorité, et souhaite que nous entrions au gouvernement : vous comme #bold Vice-Premier Ministre#!, [wm_coal_offer_seats|0] de nos députés autour de la table du Cabinet, et une de nos politiques phares dans le programme du gouvernement. En retour, nos députés voteraient avec le gouvernement sur tous les sujets."
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName] a appelé. Le [wm_coal_senior.GetNameNoTier] dispose de [wm_coal_senior_seats|0] sièges, en deçà de la majorité, et souhaite un accord de confiance et d'approvisionnement : nos députés soutiennent le gouvernement lors des votes de confiance et le budget, et en contrepartie, le gouvernement finance nos priorités. Pour tout le reste, nous serions libres de voter comme nous le souhaitons."
 wm_coalition.3.a: "Marché conclu."
 wm_coalition.3.a.tt: "L'accord est signé, et [wm_coal_pm.GetFirstName] vous sera redevable."
 wm_coalition.3.b: "Merci, mais non."
 wm_coalition.3.b.tt: "Nos députés restent dans l'opposition, libres de voter contre le gouvernement."

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "Un accord est conclu"
 wm_coalition.4.t_refused: "Échec des négociations"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName] a accepté. Le [wm_coal_party.GetNameNoTier] rejoint le gouvernement, [wm_coal_leader.GetFirstName] devient Premier ministre adjoint, et la presse parle déjà d'un mariage de convenance. Ses députés accepteront notre discipline de vote."
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName] a accepté. Le [wm_coal_party.GetNameNoTier] nous soutiendra lors des votes de confiance et pour le projet de loi sur les finances, moyennant un prix. Pour tout le reste, les whips devront convaincre ses députés un vote à la fois."
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName] nous a refusés. Le [wm_coal_talks.GetNameNoTier] dit que notre offre est bien en deçà de ce que ses membres accepteraient."
 wm_coalition.4.a: "Un nouveau chapitre pour le pays."
 wm_coalition.4.b: "Améliorer l'offre."
 wm_coalition.4.c: "Essaie une autre fête."
 wm_coalition.4.d: "Alors nous gouvernons seuls."

 # Breakdown
 wm_coalition.20.t: "Il est temps de partir?"
 wm_coalition.20.desc_coalition: "Nos députés sont agités. Chaque décision impopulaire prise par le gouvernement nous est attribuée, et le [wm_coal_senior.GetNameNoTier] reçoit le crédit pour tout ce qui se passe bien. Certains veulent que nous quittions la coalition aujourd'hui."
 wm_coalition.20.desc_supply: "Nos députés sont agités. Soutenir le gouvernement de [wm_coal_pm.GetName] nous coûte, et l'argent pour nos priorités n'a pas apporté la gratitude que nous espérions. Certains veulent annuler l'accord aujourd'hui."
 wm_coalition.20.polls_bad: "\n\nL’ela est sombre : nous sommes bien en baisse depuis la transaction."
 wm_coalition.20.polls_ok: "\n\nEl sondage tient le coup, pour l’instant."
 wm_coalition.20.a: "Nous sommes sortis. Que le gouvernement se débrouille seul."
 wm_coalition.20.a.tt: "L'accord prend fin. Le gouvernement perd le vote de vos députés et peut faire face à un vote de défiance ou à des élections. Le Premier ministre ne vous pardonnera pas."
 wm_coalition.20.b: "Nous avons donné notre parole. Nous restons."
 wm_coalition.21.t: "Nos partenaires se retirent"
 wm_coalition.21.desc: "Nos partenaires se sont retirés, et avec eux notre majorité. L'opposition sent le sang, la presse veut savoir si nous pouvons survivre, et le whip en chef compte déjà les têtes."
 wm_coalition.21.a: "Nous continuons en tant que gouvernement minoritaire."
 wm_coalition.21.a.tt: "Chaque vote à la Chambre sera une lutte."
 wm_coalition.21.b: "Trouver de nouveaux partenaires."
 wm_coalition.21.c: "Que le pays décide : convoquez des élections générales."
 wm_coalition.21.c.tt: "Parlement est dissous et une #bold élection générale #! se tient dans cinq semaines."

 # Decision
 wm_coalition_leave_decision: "Quitter l'accord gouvernemental"
 wm_coalition_leave_decision_desc: "Retirez votre parti de son accord avec le gouvernement. Vos députés seront libres de voter comme ils le souhaitent, le gouvernement perdra sa majorité, et le Premier ministre ne vous pardonnera jamais."
 wm_coalition_leave_decision_tooltip: "Mettez fin à votre accord de coalition ou de confiance et d’approvisionnement"
 wm_coalition_leave_decision_confirm: "Sortez"
 wm_coalition_leave_decision_effect_tt: "L'accord prend fin. Le gouvernement perd le vote de vos députés et peut faire face à un vote de défiance ou à des élections."
 wm_coalition_leave_no_election_desc: "Aucune élection générale n'a été convoquée"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "Vice-Premier ministre"
 wm_coalition_deputy_pm_modifier_desc: "Deuxième dans le gouvernement et chef du partenaire junior de la coalition"
 wm_coalition_compromise_modifier: "Compromis de la coalition"
 wm_coalition_compromise_modifier_desc: "L'une des politiques phares du partenaire de la coalition est dans le programme du gouvernement, et nos propres députés de l'arrière-ban se plaignent."
 wm_coalition_supply_deal_modifier: "Accord de confiance et d'approvisionnement"
 wm_coalition_supply_deal_modifier_desc: "Soutient le gouvernement sur les votes de confiance et le budget, et dispose de fonds pour ses priorités à démontrer."
 wm_coalition_partner_opinion: "Partenaire de la coalition"
 wm_coalition_walked_out_opinion: "a quitté notre gouvernement"
 wm_coalition_deputyship_diarchy_type: "Coalition"
 wm_coalition_deputyship_diarch_title: "Vice-Premier ministre"
