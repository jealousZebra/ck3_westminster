l_french:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "Émeutiers dans [wm_riot_seat.GetName]"
 wm_riot_gathering_toast_desc: "Des foules en colère se sont rassemblées à [wm_riot_seat.GetName]. [wm_riot_organiser.GetName] organise une marche de protestation à Westminster."
 wm_riot_marching_toast: "Marche de protestation de [wm_riot_seat.GetName]"
 wm_riot_marching_toast_desc: "La marche de protestation de [wm_riot_seat.GetName] est partie pour Westminster, menée par [wm_riot_organiser.GetName]. Elle arrivera dans le mois avec ses revendications."

 wm_riot_demand_1_desc: "\n\nIls veulent de l'aide avec le #bold coût de la vie#! : les factures, les loyers et les prix des aliments ont flambé, et ils disent que le gouvernement s'en fiche."
 wm_riot_demand_2_desc: "\n\nIls veulent la #bold démission d'un ministre#! : quelqu'un dans le Cabinet doit porter la responsabilité, et ils veulent une tête."
 wm_riot_demand_3_desc: "\n\nIls veulent une #bold élection générale#! : le gouvernement n'a aucun mandat pour ce qu'il fait, disent-ils, et le pays devrait décider."
 wm_riot_demand_4_desc: "\n\nEils veulent un #bold U-turn#! : une politique qu’ils détestent abandonnée, maintenant, sans si ni mais."

 wm_riot.10.t: "Problèmes dans [wm_riot_seat.GetName]"
 wm_riot.10.desc: "Le téléphone de mon bureau de circonscription n'arrête pas de sonner. Des centaines de personnes sont dans les rues de [wm_riot_seat.GetName], les magasins ont baissé leurs rideaux, et un militant local, [wm_riot_organiser.GetName], dit aux caméras que la foule marchera sur Westminster à moins que quelqu'un n'écoute."
 wm_riot.10.a: "Sortez et parlez-leur."
 wm_riot.10.a.success: "La foule écoute, puis rentre chez elle."
 wm_riot.10.a.failure: "Interrompu dans la rue"
 wm_riot.10.b: "Dire publiquement qu'ils ont raison."
 wm_riot.10.c: "Garder la tête basse et laisser le numéro 10 s'en occuper."

 wm_riot.20.t: "La Marche atteint Westminster"
 wm_riot.20.desc: "Place du Parlement est remplie de pancartes."
 wm_riot.20.desc_first: "La marche de protestation de [wm_riot_seat.GetName] est arrivée, et son organisateur, [wm_riot_organiser.GetName], a demandé à me rencontrer avec une liste de demandes."
 wm_riot.20.desc_bigger: "La marche de [wm_riot_seat.GetName] est de retour, plus grande et plus en colère qu’avant. [wm_riot_organiser.GetName] dit qu’il n’y aura plus de négociations."
 wm_riot.20.desc_gone: "\n\nAu moment où j'ai lu le briefing, la foule s'était dispersée chez elle."
 wm_riot.20.a: "Leur donner ce qu'ils veulent."
 wm_riot.20.b: "Invitez les organisateurs à discuter."
 wm_riot.20.b.success: "Un compromis est convenu"
 wm_riot.20.b.failure: "Les pourparlers s'effondrent"
 wm_riot.20.c: "Dites à la police de dégager la place."
 wm_riot.20.c.dispersed: "La police dégage la place."
 wm_riot.20.c.violence: "Scènes de violence aux informations du soir"
 wm_riot.20.d: "Bien."

 wm_riot_county_modifier: "Émeutes"
 wm_riot_county_modifier_desc: "Des foules en colère sont dans les rues et une marche de protestation est en cours."
 wm_riot_demands_met_county_modifier: "Exigences satisfaites"
 wm_riot_demands_met_county_modifier_desc: "Le gouvernement a donné aux manifestants ce qu'ils voulaient."
 wm_riot_compromise_county_modifier: "Un compromis"
 wm_riot_compromise_county_modifier_desc: "Les manifestants sont rentrés chez eux avec un accord."
 wm_riot_policed_county_modifier: "Protestation dispersée"
 wm_riot_policed_county_modifier_desc: "La police a dispersé la marche de protestation, et les gens ici ne l'ont pas oubliée."
 wm_riot_crackdown_county_modifier: "Violence policière"
 wm_riot_crackdown_county_modifier_desc: "Les images de la police chargeant la marche de protestation sont encore partagées."
 wm_mp_backed_protesters_county_modifier: "Député ayant soutenu la manifestation"
 wm_mp_backed_protesters_county_modifier_desc: "Le député local s’est tenu aux côtés des manifestants."
 wm_cost_of_living_package_modifier: "Forfait du coût de la vie"
 wm_cost_of_living_package_modifier_desc: "Aide pour les factures, payée par le gouvernement."
 wm_u_turn_modifier: "Demi-tour"
 wm_u_turn_modifier_desc: "Forcé à faire demi-tour de manière humiliante par une marche de protestation."
 wm_heavy_handed_modifier: "Autoritaire"
 wm_heavy_handed_modifier_desc: "A envoyé la police contre une marche de protestation."
 wm_crackdown_modifier: "Reproché pour violence policière"
 wm_crackdown_modifier_desc: "la police lors d’une marche de protestation est devenue violente, et la faute est tombée ici."

 wm_forced_to_resign_opinion: "M'a forcé à démissionner"
 wm_backed_protesters_opinion: "S'est rangé du côté des manifestants"
 wm_policed_my_constituents_opinion: "A envoyé la police contre mes électeurs"
