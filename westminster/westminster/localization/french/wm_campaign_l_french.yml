l_french:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "Sur la piste de la campagne : Semaine [EmptyScope.ScriptValue('wm_campaign_week_value')|0]"
 wm_campaign.1.desc: "Le Parlement est dissous et le bus de campagne est en train de tourner à l'extérieur. L'agenda a une case à remplir cette semaine, mon téléphone a 140 messages non lus, et quelqu'un a mis une rosette sur moi sans demander."
 wm_campaign.1.desc_leader: "\n\nEn tant que leader du [wm_campaign_party.GetNameNoTier], chaque mouvement que je fais est une nouvelle nationale. Les diffuseurs veulent un face-à-face avec [wm_campaign_rival.GetName], et l'unité de politique a un lancement prêt à partir. À la maison, mon agent à [wm_campaign_seat.GetNameNoTier] aimerait me voir au moins une fois avant le jour des élections."
 wm_campaign.1.desc_leader_no_rival: "\n\nEn tant que leader du [wm_campaign_party.GetNameNoTier], chaque mouvement que je fais est une nouvelle nationale, et l'unité de politique a un lancement prêt à partir."
 wm_campaign.1.desc_mp: "\n\nL’équipe nationale n’a aucune idée de qui je suis, ce qui est un soulagement. Ce qui compte, c’est [wm_campaign_seat.GetNameNoTier] : les tracts, les seuils, et si le journal local imprime ma photo dans la bonne direction."
 wm_campaign.1.a: "Organiser un grand rassemblement."
 wm_campaign.1.b: "Affronter [wm_campaign_rival.GetFirstName] lors du débat télévisé."
 wm_campaign.1.c: "Faites le débat télévisé et enterrez [wm_campaign_rival.GetFirstName] dans les statistiques."
 wm_campaign.1.d: "Lancez une politique phare."
 wm_campaign.1.e: "Aller frapper aux portes à [wm_campaign_seat.GetNameNoTier]."
 wm_campaign.1.f: "Une semaine tranquille au QG de campagne, approuvant des tracts."

 wm_campaign_rally_success: "Rassemblement : Accueil enthousiaste"
 wm_campaign_rally_flat: "Rassemblement : Applaudissements polis"
 wm_campaign_rally_flop: "Rassemblement : Salle à moitié vide"
 wm_campaign_debate_won: "Débat : Les sondages instantanés annoncent la décision pour vous"
 wm_campaign_debate_lost: "Débat : S’est éloigné sous les projecteurs"
 wm_campaign_debate_wonk_won: "Débat : Mort par tableau (Leur Feuille de Calcul)"
 wm_campaign_debate_wonk_lost: "Débat : A perdu le public lors de « Budget Headroom »"
 wm_campaign_policy_success: "Lancement de la politique : Ça fait sensation"
 wm_campaign_policy_flop: "Lancement de la politique : Décortiquer les coûts à la radio du petit-déjeuner"
 wm_campaign_door_knock: "Démarchage : Portes conquises"

 wm_campaign.2.t: "Gaffe !"
 wm_campaign.2.desc: "Mon attaché de presse a le visage de quelqu'un qui vient de voir les unes de demain."
 wm_campaign_gaffe_1: "Un photographe m'a surpris en train de manger un sandwich au bacon lors d'une pause café, et le résultat est décrit en ligne comme \"une situation d'otage avec un petit-déjeuner\". C'est déjà un mème, une tasse et une sonnerie."
 wm_campaign_gaffe_2: "J'ai oublié que mon microphone était encore allumé après une visite d'usine, et tout le pays a maintenant entendu que j'appelle un électeur \"un peu trop, franchement\". Elle a donné quatre entretiens depuis le déjeuner."
 wm_campaign_gaffe_3: "Interrogé en direct à la radio sur le prix d’une pinte de lait, j’ai répondu \"environ onze livres ?\" avec une réelle confiance. Le présentateur a laissé le silence durer neuf secondes."
 wm_campaign_gaffe_4: "Lors d'une séance photo, j'ai traversé confiants la mauvaise porte, suis entré dans un placard, et les caméras attendaient que je ressorte. Je l'ai fait, finalement, tenant une serpillière."
 wm_campaign_gaffe_5: "J’ai été filmé tenant l’un de nos tracts à l’envers pendant tout un discours, sous une banderole qui orthographiait mal le nom de la circonscription. Le nom de notre propre candidat aussi."
 wm_campaign.2.a: "Rire-en. Tout le monde a une mauvaise journée de sandwich."
 wm_campaign.2.b: "Blâmez un employé junior."
 wm_campaign.2.c: "S'y mettre : le refaire, exprès, devant les caméras."
 wm_campaign_gaffe_shrugged: "Gaffe : Le public trouve cela plutôt attachant"
 wm_campaign_gaffe_stuck: "Gaffe : Elle ouvre tous les bulletins"
 wm_campaign_gaffe_viral: "Gaffe : L'autodérision devient virale (dans le bon sens)"
 wm_campaign_gaffe_doubled: "Gaffe : \"Insister\" n'était pas la solution"

 wm_campaign_doorstep_county_modifier: "Ont rencontré leur député sur le pas de la porte"
 wm_campaign_doorstep_county_modifier_desc: "Leur député a frappé aux portes ici pendant la campagne, et a pensé à essuyer ses pieds."
 wm_campaign_viral_gaffe_modifier: "Gaffe virale"
 wm_campaign_viral_gaffe_modifier_desc: "Une gaffe de campagne que l'internet ne laissera pas passer."

 wm_campaign_debate_humiliated_opinion: "Battez-moi au débat télévisé"
