 bm_2024_starmer: "2024 : Un changement de gouvernement"
 bm_2024_starmer_desc: "Labour a remporté les élections générales du 4 juillet 2024 avec 411 sièges, soit une majorité de 174. Keir Starmer est Premier ministre ; les conservateurs, réduits à 121 sièges, doivent choisir un nouveau chef ; les Libéraux-démocrates obtiennent leur meilleur résultat depuis un siècle ; et Reform UK, les Verts et un groupe d’indépendants ont percé dans la Chambre des communes. \n\n#bold Chacun des 650 députés est jouable. #!"
 bm_group_2024: "2024"
 bookmark_2024_keir_starmer: "Keir Starmer"
 bookmark_2024_keir_starmer_subheading: "Premier ministre"
 bookmark_2024_keir_starmer_desc: "Premier ministre avec une victoire écrasante derrière lui et un bureau plein devant lui."
 bookmark_2024_rishi_sunak: "Rishi Sunak"
 bookmark_2024_rishi_sunak_subheading: "Chef de l'Opposition"
 bookmark_2024_rishi_sunak_desc: "Chef de l'Opposition pour l'instant, après la pire défaite des Conservateurs. Son parti choisira bientôt son successeur."
 bookmark_2024_ed_davey: "Ed Davey"
 bookmark_2024_ed_davey_subheading: "Chef des Libéraux-Démocrates"
 bookmark_2024_ed_davey_desc: "Chef des Libéraux-démocrates, de retour en tant que troisième parti avec 72 sièges."
 bookmark_2024_sam_carling: "Sam Carling"
 bookmark_2024_sam_carling_subheading: "Député du Nord-Ouest du Cambridgeshire"
 bookmark_2024_sam_carling_desc: "Le plus jeune député du nouveau Parlement, élu dans sa vingtaine. Une longue carrière l'attend, s'il le souhaite."
