 # Decisions (common/decisions/wm_party_decisions.txt)
 wm_party_join_decision: "Traverse la Salle"
 wm_party_join_decision_desc: "Quitter mon parti pour un autre. Mes anciens collègues ne le pardonneront pas rapidement, mais un nouveau parti signifie un nouveau leader, un nouveau whip et de nouveaux amis."
 wm_party_join_decision_tooltip: "Rejoindre un autre parti, ou siéger en tant qu'indépendant"
 wm_party_join_decision_confirm: "Traversez la salle"
 wm_party_join_decision_choose: "Choisissez un parti"
 wm_party_join_decision_effect_tt: "Vous rejoignez le parti que vous avez choisi : vous prenez son whip, rejoignez ses rangs (vos [house|E]) et servez son leader. Votre ancien leader de parti s'en souviendra."
 wm_party_found_decision: "A trouvé un parti"
 wm_party_found_decision_desc: "Les anciens partis ont échoué. Créez-en un nouveau, avec un nom, un emblème et un leader : moi."
 wm_party_found_decision_tooltip: "A trouvé un nouveau parti et l'a dirigé"
 wm_party_found_decision_confirm: "Lancez la fête"
 wm_party_found_decision_slot_tt: "Il y a de la place pour un autre parti (au maximum six nouveaux partis)"
 wm_party_found_decision_head_tt: "Pas le chef de la [house|E] de votre parti"
 wm_party_found_decision_effect_tt: "Vous fondez un nouveau parti et devenez son leader, servant le Premier Ministre. Il a son propre [house|E] et emblème, et votre ancien chef de parti s'en souviendra. Les nouveaux partis ne figurent pas encore dans les sondages."

