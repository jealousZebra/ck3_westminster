l_french:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "Présenter un projet de loi"
 wm_commons_introduce_bill_decision_desc: "Présenter un projet de loi du gouvernement à la Chambre des communes. Les whips compteront les voix, les députés de backbench se plaindront et dans une semaine, la Chambre se divisera."
 wm_commons_introduce_bill_decision_tooltip: "Mettre un projet de loi du gouvernement au vote à la Chambre des communes"
 wm_commons_introduce_bill_decision_effect_tt: "Choisissez un projet de loi. La Chambre vote dessus une semaine plus tard."
 wm_commons_no_confidence_decision: "Présenter une motion de censure"
 wm_commons_no_confidence_decision_desc: "En tant que chef de l'opposition, déposer une motion selon laquelle cette Chambre n'a pas confiance dans le gouvernement de Sa Majesté. Si le gouvernement perd, il doit y avoir des élections générales."
 wm_commons_no_confidence_decision_tooltip: "Essayer de faire tomber le gouvernement"
 wm_commons_no_confidence_decision_effect_tt: "La Chambre vote la motion dans la semaine. Si elle est adoptée, un #bold élection générale #! doit avoir lieu. Si elle échoue, vous perdez la face et le Premier ministre ne l'oubliera pas."
 wm_commons_house_free_desc: "Aucun autre projet de loi ou motion n'attend un vote aux Communes"
 wm_commons_no_election_pending_desc: "Aucun gouvernement n'a déjà été contraint à une élection générale"
 wm_commons_leader_of_opposition_desc: "Vous dirigez le plus grand parti en dehors du gouvernement"

 # Bills
 wm_commons_bill_1_name: "#bold Le projet de loi sur les finances#!"
 wm_commons_bill_2_name: "#bold Le projet de loi sur les services publics#!"
 wm_commons_bill_3_name: "#bold Le projet de loi sur la réforme de la fonction publique#!"
 wm_commons_bill_4_name: "#bold Le projet de loi sur les pouvoirs d'urgence#!"
 wm_commons_bill_5_name: "#bold La motion de censure contre le gouvernement de Sa Majesté#!"
 wm_commons_bill_1_desc: "\n\nL’#bold Finance Bill#! met des impôts en hausse pour équilibrer les comptes. La droite du parti déteste cela ; la gauche peut vivre avec."
 wm_commons_bill_2_desc: "\n\nEl’#bold projet de loi sur les services publics#! investit plus d’argent dans les écoles et les hôpitaux. C’est populaire, et la gauche adore cela ; la droite s’inquiète du coût."
 wm_commons_bill_3_desc: "\n\nEl’#bold projet de loi sur la réforme des services publics#! bouleverse la gestion des services publics. La droite le veut depuis des années. La gauche le qualifie de trahison, et certains menacent de voter contre."
 wm_commons_bill_4_desc: "\n\nLe #bold projet de loi sur les pouvoirs d'urgence#! donne aux ministres des pouvoirs étendus pour gérer la crise. Personne ne l'apprécie beaucoup, mais en période de crise, le pays attend du Parlement qu'il agisse."
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName], en tant que dirigeant de l'Opposition, a présenté une #bold motion de censure#! contre le gouvernement. Si elle est adoptée, il doit y avoir des élections générales."

 wm_commons.1.t: "Le Programme législatif"
 wm_commons.1.desc: "Le leader de la Chambre veut savoir ce que le gouvernement présente ensuite aux Communes. Les fonctionnaires ont rédigé plusieurs projets de loi, chacun avec ses amis et ses ennemis sur nos propres bancs."
 wm_commons.1.a: "Un projet de loi financière : les impôts doivent augmenter."
 wm_commons.1.a.tt: "Si adopté : argent pour le gouvernement et augmentation d'impôts, mais les sondages ne l'apprécieront pas. La #bold aile droite du parti#! peut se rebeller."
 wm_commons.1.b: "Un projet de loi sur les services publics : plus d'argent pour les écoles et les hôpitaux."
 wm_commons.1.b.tt: "Si adopté : populaire et bon pour les sondages, mais cela coûte de l'argent pendant des années. La #bold aile droite du parti#! peut grogner."
 wm_commons.1.c: "Un projet de réforme des services publics : il est temps de changer vraiment."
 wm_commons.1.c.tt: "Si adopté : mandat et réputation d'un réformateur. #bold Controversé#! : la #bold aile gauche du parti#! peut se rebeller en nombre."
 wm_commons.1.d: "Un projet de loi sur les pouvoirs d'urgence : le pays en a besoin."
 wm_commons.1.d.tt: "Si adopté : profil et mandat. L'opposition pourrait bien le soutenir."
 wm_commons.1.e: "Rien pour le moment."

 # The whips
 wm_commons.2.t: "Le Rapport du Chef de Discipline"
 wm_commons.2.t_confidence: "Une motion de censure"
 wm_commons.2.desc_bill: "Le Chef de Discipline a compté les voix dans la salle de thé."
 wm_commons.2.desc_confidence: "L'Opposition a rejeté une motion visant à renverser le gouvernement, et le Chief Whip est déjà dans mon bureau."
 wm_commons.2.numbers: "\n\nNous avons #bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#! députés ; il y a [EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0] sur les autres bancs. Le Chief Whip estime qu'environ #bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#! des nôtres pourraient se rebeller ou s'absenter."
 wm_commons.2.opposition_backs: "Le banc de l'opposition a déclaré qu'il nous soutiendra."
 wm_commons.2.no_opposition_help: "L'opposition votera contre."
 wm_commons.2.a: "Laissez faire les whips."
 wm_commons.2.b: "Émettez un fouet à trois lignes. Mon autorité est en jeu."
 wm_commons.2.c: "Rappeler les hésitants, un par un. Chaque circonscription a besoin de quelque chose."
 wm_commons.2.d: "Offrir des concessions."
 wm_commons.2.d.tt: "Moins de députés se rebellent, mais un projet de loi est #bold dilué#! : il fait environ la moitié de ce qu'il fait s'il est adopté."
 wm_commons.2.e: "Retirez le projet de loi avant qu’il ne soit rejeté."

 # The result
 wm_commons_headline_government_falls: "CHUTE DU GOUVERNEMENT"
 wm_commons_headline_pm_survives: "PREMIER MINISTRE SURVIT AU VOTE DE CONFIANCE"
 wm_commons_headline_humiliation: "HUMILIATION POUR NUMBER 10"
 wm_commons_headline_defeated: "GOUVERNEMENT BATTU"
 wm_commons_headline_knife_edge: "TRANCHANT : LE GOUVERNEMENT PARVIENT À LA RÉALITÉ"
 wm_commons_headline_revolt: "LE PROJET DE LOI EST ADOPTÉ MALGRÉ LA RÉVOLTE DES DÉPUTÉS"
 wm_commons_headline_comfortable: "MAJORITÉ CONFORTABLE"
 wm_commons_headline_passed: "LE PROJET DE LOI EST ADOPTÉ"

 wm_commons.4.lobbies: "\n\nL’affectation des divisions : #bold Ouais [EmptyScope.ScriptValue('wm_commons_ayes_value')|0], Non [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!. [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] députés n’ont pas voté."
 wm_commons.4.rebels: "Les députés du gouvernement #bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! ont défié la discipline de parti."
 wm_commons.4.no_rebels: "Aucun député gouvernemental n'a défié la discipline du parti."
 wm_commons.4.outcome_government_falls: "\n\nLa Chambre n'a pas confiance dans le gouvernement de [wm_commons_pm.GetName]. Il doit y avoir une #bold élection générale#!."
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] survit par [EmptyScope.ScriptValue('wm_commons_majority_value')|0] votes, et l'Opposition est embarrassée."
 wm_commons.4.outcome_defeated: "\n\nEl projet de loi tombe, rejeté par [EmptyScope.ScriptValue('wm_commons_majority_value')|0] voix. [wm_commons_pm.GetName] a perdu le contrôle de la Chambre."
 wm_commons.4.outcome_passed_watered_down: "\n\nEl projet de loi passe avec une majorité de [EmptyScope.ScriptValue('wm_commons_majority_value')|0], mais seulement après que le gouvernement ait cédé sur presque tout."
 wm_commons.4.outcome_passed: "\n\nEl projet de loi est adopté à la majorité des [EmptyScope.ScriptValue('wm_commons_majority_value')|0]."
 wm_commons.4.a: "Ordre, ordre !"
 wm_commons.4.a_pm: "Passons au suivant."

 # The division bell
 wm_commons.5.t: "La Cloche de Vote"
 wm_commons.5.desc: "La cloche de division sonne dans tout le Palais de Westminster. Dans quelques minutes, la Chambre votera."
 wm_commons.5.whip_none: "\n\nSans whip de parti, je peux voter comme je veux."
 wm_commons.5.whip_abstain: "\n\nMon parti n'occupe pas ses places à Westminster. Je ne voterai pas."
 wm_commons.5.whip_government: "\n\nL’épaule veut que chacun d’entre nous soit dans le hall #bold avec le gouvernement#!. Les rebelles seront rappelés."
 wm_commons.5.whip_opposition_backs: "\n\nNotre banc de première ligne soutient le gouvernement sur ce point, et les whips s'attendent à ce que je suive."
 wm_commons.5.whip_opposition: "\n\nNos whips veulent que je sois dans le lobby #bold contre le gouvernement#!."
 wm_commons.5.wing_left: "Je siège à #bold gauche#! de mon parti."
 wm_commons.5.wing_right: "Je siège à #bold droite#! de mon parti."
 wm_commons.5.wing_centre: "Je siège au #bold centre#! de mon parti."
 wm_commons.5.a: "Voter avec le gouvernement."
 wm_commons.5.b: "Voter contre le gouvernement."
 wm_commons.5.c: "Éloignez-vous et abstenez-vous."

 wm_commons_whip_withdrawn_toast: "Fouet retiré"
 wm_commons_whip_withdrawn_toast_desc: "Après avoir rebellié une fois de trop, [wm_commons_whipless.GetName] a perdu le soutien du parti et siège désormais comme indépendant."

 # Modifiers
 wm_commons_tax_rise_modifier: "Augmentation d'impôts"
 wm_commons_tax_rise_modifier_desc: "Le projet de loi financier a augmenté les impôts. L'argent arrive, et les électeurs l'ont remarqué."
 wm_commons_public_services_modifier: "Dépenses des services publics"
 wm_commons_public_services_modifier_desc: "Plus d'argent pour les écoles et les hôpitaux : populaire et coûteux."
 wm_commons_reformer_modifier: "Réformateur"
 wm_commons_reformer_modifier_desc: "A fait passer une réforme controversée au sein de la Chambre des communes."
 wm_commons_emergency_powers_modifier: "Pouvoirs d’urgence"
 wm_commons_emergency_powers_modifier_desc: "Parlement a donné au gouvernement de vastes pouvoirs pour gérer une crise."
 wm_commons_defeated_in_commons_modifier: "Défait à la Chambre des communes"
 wm_commons_defeated_in_commons_modifier_desc: "Un projet de loi du gouvernement a été rejeté par la Chambre des communes."
 wm_commons_lost_confidence_modifier: "Perdu la confiance de la Chambre"
 wm_commons_lost_confidence_modifier_desc: "La Chambre des communes a voté qu'elle n'a pas confiance dans ce gouvernement."

 # Opinions
 wm_commons_defied_whip_opinion: "Défia le fouet"
 wm_commons_whip_withdrawn_opinion: "Retira le fouet de moi"
 wm_commons_tabled_no_confidence_opinion: "Essayé de renverser mon gouvernement"
 wm_commons_introduce_bill_decision_confirm: "Mise à la maison"
 wm_commons_no_confidence_decision_confirm: "Présenter la motion"
