l_french:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "Un concours de leadership"
 wm_leadership.1.desc_vacancy: "Le [wm_lead_party.GetNameNoTier] a besoin d'un nouveau leader. [wm_lead_party_holder.GetName] gère provisoirement, mais le parti choisira pour lui-même.\n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] se retire en tant que leader du [wm_lead_party.GetNameNoTier], et la course pour leur successeur a commencé.\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] fait face à un défi pour la direction du [wm_lead_party.GetNameNoTier]. Toute autre personne qui se sent capable peut se joindre.\n\n"
 wm_leadership.1.rules: "#bold Les règles :#! les nominations des députés du parti se terminent dans dix jours. Un candidat a besoin de 15 % d'entre eux (un challenger 20 %) pour pouvoir se présenter, et les deux mieux soutenus passent à un vote des membres, trois semaines plus tard. Les membres recherchent un communicateur, un bilan, du capital politique dans le parti et le soutien des députés."
 wm_leadership.1.a: "Jeter mon chapeau dans l'arène."
 wm_leadership.1.a.tt: "Vous vous présentez à la direction. Vos collègues décideront s’ils vous nomment."
 wm_leadership.1.b: "Pas cette fois."
 wm_leadership.2.t: "Un Défi"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName] a annoncé un défi à votre direction du [wm_lead_party.GetNameNoTier]. S'ils trouvent suffisamment de nominations, les membres choisiront entre vous."
 wm_leadership.2.a: "Combattez-les et gagnez."
 wm_leadership.2.a.tt: "Vous êtes sur le bulletin de vote pour le moment. Le challenger a besoin d'un cinquième des députés du parti pour le nommer."
 wm_leadership.2.b: "Retirez-vous avec dignité."
 wm_leadership.2.b.tt: "Vous ne vous présentez pas. Le concours continue sans vous, et vous dirigez jusqu'à ce qu'il y ait un gagnant."
 wm_leadership.3.t: "Le scrutin des membres"
 wm_leadership.3.desc: "Vous avez été présélectionné pour la direction du [wm_lead_party.GetNameNoTier], contre [wm_lead_rival.GetName]. Trois semaines de réunions, de centres d'appels et d'entretiens vous attendent. Les membres décideront."
 wm_leadership.3.a: "Faire le tour des partis de circonscription."
 wm_leadership.3.a.tt: "Une campagne de poignées de main et de réunions électorales : elle joue sur votre #bold charisme#!."
 wm_leadership.3.b: "Définir un programme sérieux."
 wm_leadership.3.b.tt: "Une plateforme politique : elle joue sur votre #bold économie#! et #bold politique#!."
 wm_leadership.3.c: "Embaucher la meilleure campagne que l'argent peut acheter."
 wm_leadership.3.c.tt: "Vidéos soignées et une stratégie sur le terrain impitoyable. Coûteux, mais ça fonctionne."
 wm_leadership.3.d: "Que mon dossier parle de lui-même."
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] GAGNANTS [wm_lead_news_party.GetAdjective|U] LEADERSHIP"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] COURONNÉ SANS OPPOSITION"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] REPOUSSE LE DÉFI"
 wm_leadership.4.t_failed: "DÉFI DE LEADERSHIP S’ESTOMPE"
 wm_leadership.4.desc_ballot: "#italic Le [wm_lead_news_party.GetNameNoTier]#!\n\nLes membres se sont exprimés : [wm_lead_news_winner.GetName] obtient [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% des voix contre [wm_lead_news_second.GetName] et devient le nouveau leader du [wm_lead_news_party.GetNameNoTier]. [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] des députés [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] du parti les avaient nominés."
 wm_leadership.4.desc_ballot_alone: "#italic Le [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName] est le nouveau leader du [wm_lead_news_party.GetNameNoTier], avec [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% des votes des membres."
 wm_leadership.4.desc_survives: "#italic Le [wm_lead_news_party.GetNameNoTier]#!\n\nLes membres ont soutenu leur leader : [wm_lead_news_winner.GetName] remporte [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% des voix contre [wm_lead_news_second.GetName], dont la carrière pourrait ne pas se remettre."
 wm_leadership.4.desc_unopposed: "#italic Le [wm_lead_news_party.GetNameNoTier]#!\n\nSeulement [wm_lead_news_winner.GetName] a atteint les nominations nécessaires pour le scrutin, avec [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] des députés [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] du parti, et est élu leader du [wm_lead_news_party.GetNameNoTier] sans opposition. Les membres n'ont jamais voté."
 wm_leadership.4.desc_failed: "#italic Le [wm_lead_news_party.GetNameNoTier]#!\n\nLe défi contre [wm_lead_news_winner.GetName] a échoué avant même de commencer : aucun challenger n'a obtenu les nominations nécessaires pour forcer un scrutin. Le leader est en sécurité, pour l'instant."
 wm_leadership.4.a_won: "Maintenant, le vrai travail commence."
 wm_leadership.4.a: "Le parti a choisi."
 wm_leadership.5.t: "Après le dépouillement"
 wm_leadership.5.desc: "Les élections générales se sont mal passées pour [wm_lead_party.GetNameNoTier]. Les journaux écrivent déjà votre nécrologie politique, et certains collègues ne répondent plus aux appels.\n\nVous pourriez continuer à vous battre, ou annoncer que vous vous retirerez une fois que le parti aura choisi un successeur."
 wm_leadership.5.a: "Je ne vais nulle part."
 wm_leadership.5.b: "Il est temps pour quelqu'un d'autre."
 wm_leadership.5.b.tt: "Un concours de leadership commence. Vous ne vous présentez pas, et vous dirigez jusqu'à ce qu'il soit terminé."
 wm_leadership_contest_toast: "Concours de leadership : [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "Le [wm_lead_party.GetNameNoTier] consiste à choisir un leader : des nominations de ses députés, puis un vote des membres."
 wm_leadership_result_toast: "Nouveau leader : [wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] dirige le [wm_lead_party.GetNameNoTier]."
 wm_leadership_challenge_decision: "Challenge pour la Direction"
 wm_leadership_challenge_decision_desc: "Votre parti mérite mieux, et vous savez qui. Déclarez un défi : si un cinquième des députés du parti vous nomment, les membres choisiront entre vous et le leader."
 wm_leadership_challenge_decision_tooltip: "Contestez le leader de votre parti."
 wm_leadership_challenge_decision_confirm: "Déclarez le défi"
 wm_leadership_challenge_decision_effect_tt: "Un concours de leadership #bold commence #! : dix jours de nominations par les députés du parti, puis un vote des membres. Si vous perdez, le leader ne l'oubliera pas."
 wm_leadership_no_contest_tt: "Aucun concours de leadership n'est déjà en cours"
 wm_leadership_parliament_sitting_tt: "Aucune élection générale n'est en cours"
 wm_leadership_challenged_opinion: "M'a contesté pour la direction"
 wm_leadership_deposed_opinion: "On m'a pris mon parti"
 wm_leadership_gracious_opinion: "Un gagnant gracieux"
