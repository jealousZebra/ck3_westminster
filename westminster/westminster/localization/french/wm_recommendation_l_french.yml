 wm_recommendation.1.t: "Vous appréciez Westminster ?"
 wm_recommendation.1.desc: "Si Westminster a trouvé sa place dans votre sélection de mods, une évaluation positive sur le Steam Workshop aidera davantage de joueurs de CK3 à le découvrir. Merci de jouer et de soutenir le développement du mod."
 wm_recommendation.1.a: "Je laisserai une évaluation sur Steam."
 wm_recommendation.1.b: "Retour à Westminster."
