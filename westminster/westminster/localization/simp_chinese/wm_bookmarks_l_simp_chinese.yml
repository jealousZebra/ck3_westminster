 bm_2024_starmer: "2024: 政府更迭"
 bm_2024_starmer_desc: "工党在2024年7月4日举行的大选中赢得了411个席位，以174席的多数获胜。基尔·斯塔默担任首相；保守党席位减少到121席，必须选择新的领导人；自由民主党取得了一个世纪以来的最佳成绩；改革英国党、绿党和一群独立人士进入了下议院。\n\n#bold 每一位650名议员都可操作。#!"
