l_simp_chinese:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "伯爵"
 wm_dispute.1.desc: "#italic 返票官声明#!\n\n[wm_dispute_mp.GetName] 已被宣布在 [wm_dispute_seat.GetNameNoTier] 胜出，获胜差距为 [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] 分。"
 wm_dispute.1.close: "情况很接近，以至于特工们已经开始低声议论多数选票被重复计数，以及一个晚到的箱子。重新计票（花费一周时间，费用为[EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]）可能会改变结果，也许有[EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0]%的几率；选举申诉（四个月，费用为[EmptyScope.ScriptValue('wm_dispute_court_cost')|0]）可能会使结果被宣布作废，并再次争夺席位，也许有[EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0]%的机会。"
 wm_dispute.1.clear: "并不接近。重新计票（[EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]）很可能不会改变任何结果，公众不喜欢不服输的人：争议此事将会损失你的声望和政治资本。"
 wm_dispute.1.bad: "连近似都算不上：是一次彻底失败。争议将使你成为笑柄，也可能把愤怒的支持者带到街头。"
 wm_dispute.1.a: "祝贺获胜者。"
 wm_dispute.1.b: "要求重新计票。"
 wm_dispute.1.b.tt: "每张选票都会被重新计数。这需要花费金钱；如果结果差距不大，还会花费你的声望和政治资本。"
 wm_dispute.1.c: "向选举法院请愿。"
 wm_dispute.1.c.tt: "法官审查选举行为。这过程缓慢且昂贵；他们可能宣布选举无效并下令重新举行补选，或判你承担费用。"
 wm_dispute_recount_toast: "在 [wm_dispute_seat.GetNameNoTier] 复计"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName] 已要求对 [wm_dispute_seat.GetNameNoTier] 进行重新计票。计票人员已回到他们的桌子上。"
 wm_dispute_court_toast: "选举请愿书：[wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName] 已就 [wm_dispute_seat.GetNameNoTier] 的选举结果向选举法院提出申请。法官们将在几个月内做出报告。"
 wm_dispute_overturned_toast: "重新计票推翻结果"
 wm_dispute_overturned_toast_desc: "在重新计票后，[wm_dispute_mp.GetName]以少数几票被宣布为[wm_dispute_seat.GetNameNoTier]的议员。"
 wm_dispute_upheld_toast: "复计确认结果"
 wm_dispute_upheld_toast_desc: "[wm_dispute_seat.GetNameNoTier] 的重新计票确认 [wm_dispute_mp.GetName] 为其议员。"
 wm_dispute_void_toast: "选举被宣布无效"
 wm_dispute_void_toast_desc: "选举法庭宣布[wm_dispute_seat.GetNameNoTier]的结果无效。将举行新的补选。"
 wm_dispute_dismissed_toast: "选举请愿被驳回"
 wm_dispute_dismissed_toast_desc: "选举法庭驳回了关于[wm_dispute_seat.GetNameNoTier]的请愿，并判请愿人承担费用。[wm_dispute_mp.GetName]依旧有效。"
 wm_dispute_national_toast: "拒绝承认失败"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] 不会接受大选结果。情况不会改变，但支持者正在街上集结，报纸无情报道。"
 wm_dispute_seat_decision: "挑战伯爵"
 wm_dispute_seat_decision_desc: "你失去了席位，但计票结果正确吗？要求重新计票，或者向选举法庭申请宣布选举无效。如果票数不接近，公众就会看到一个输不起的人。"
 wm_dispute_seat_decision_tooltip: "对你失去的选区结果提出异议。"
 wm_dispute_seat_decision_confirm: "考虑一下"
 wm_dispute_seat_decision_effect_tt: "您决定是否接受结果、要求 #bold 重新计票 #! 或向 #bold 选举法院请愿 #!。"
 wm_dispute_not_disputed_tt: "结果尚未被质疑。"
 wm_dispute_no_byelection_tt: "该席位不在等待补选。"
 wm_dispute_national_decision: "拒绝让步"
 wm_dispute_national_decision_desc: "选民已将你赶出唐宁街。你可以拒绝接受：质疑计票、邮寄选票、广播机构。这不会改变任何事情，会让你付出高昂代价，并把你最愤怒的支持者推上街头。"
 wm_dispute_national_decision_tooltip: "拒绝接受大选结果。"
 wm_dispute_national_decision_confirm: "拒绝承认"
 wm_dispute_national_decision_effect_tt: "你会失去大量#bold 声望和政治资本#!，你的政党在民调中下滑，新首相对此心生怨恨，#bold 可能爆发骚乱#!。"
 wm_dispute_sore_loser_modifier: "难以接受失败的人"
 wm_dispute_sore_loser_modifier_desc: "拒绝接受大选结果。"
 wm_dispute_bad_loser_modifier: "输不起的人"
 wm_dispute_bad_loser_modifier_desc: "对明显输掉的结果提出异议。"
 wm_dispute_sore_loser_opinion: "拒绝让步"
