l_simp_chinese:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "一场领导权竞赛"
 wm_leadership.1.desc_vacancy: "[wm_lead_party.GetNameNoTier]需要一位新领导人。[wm_lead_party_holder.GetName]暂时在掌管事务，但党会自己做出选择。\n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] 将不再担任 [wm_lead_party.GetNameNoTier] 的领导者，继任者的竞选已经开始。\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName]面临着[wm_lead_party.GetNameNoTier]领导权的挑战。任何有希望的人都可以加入。\n\n"
 wm_leadership.1.rules: "#bold 规则：#!党内议员的提名将在十天内截止。候选人需获得15%的提名（挑战者为20%）才能晋级，支持率最高的两名将在三周后进行党员投票。党员们寻找沟通者、记录、党内政治资本以及议员的支持。"
 wm_leadership.1.a: "我也加入这个圈子。"
 wm_leadership.1.a.tt: "你竞选领导职务。你的同事将决定是否提名你。"
 wm_leadership.1.b: "这次不行。"
 wm_leadership.2.t: "一个挑战"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName] 已宣布对你领导 [wm_lead_party.GetNameNoTier] 发起挑战。如果他们找到足够的提名，成员将会在你和对手之间做出选择。"
 wm_leadership.2.a: "与他们作战，并取得胜利。"
 wm_leadership.2.a.tt: "你目前在选票上。挑战者需要党内五分之一的议员提名他们。"
 wm_leadership.2.b: "体面地下台。"
 wm_leadership.2.b.tt: "您没有参选。竞赛在您不参赛的情况下继续进行，并且您将领导直到产生胜利者。"
 wm_leadership.3.t: "议员投票"
 wm_leadership.3.desc: "你已入围 [wm_lead_party.GetNameNoTier] 的领导人候选名单，对手为 [wm_lead_rival.GetName]。接下来有三周的竞选活动、电话筹款和面试。成员们将做出决定。"
 wm_leadership.3.a: "巡回选区政党活动。"
 wm_leadership.3.a.tt: "一场握手和竞选集会的运动：它利用了你的#bold 魅力#!。"
 wm_leadership.3.b: "制定一个严肃的方案。"
 wm_leadership.3.b.tt: "一个政策平台：它迎合你的#bold 经济#!和#bold 政策#!。"
 wm_leadership.3.c: "雇佣最优秀的竞选团队。"
 wm_leadership.3.c.tt: "流畅的视频和无情的地面游戏。虽然贵，但效果不错。"
 wm_leadership.3.d: "让我的记录自己说明。"
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] 胜利 [wm_lead_news_party.GetAdjective|U] 领导层"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U]无对手加冕"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] 驳回挑战"
 wm_leadership.4.t_failed: "领导权挑战逐渐消退"
 wm_leadership.4.desc_ballot: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\nZ成员们已经表态：[wm_lead_news_winner.GetName]获得了[EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%的选票，[wm_lead_news_second.GetName]成为[wm_lead_news_party.GetNameNoTier]的新领导人。党内[EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0]议员中有[EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0]提名了他们。"
 wm_leadership.4.desc_ballot_alone: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName]是[wm_lead_news_party.GetNameNoTier]的新领导人，拥有[EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%的成员投票权。"
 wm_leadership.4.desc_survives: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n成员支持他们的领导人：[wm_lead_news_winner.GetName]赢得了[EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%的选票，击败了可能无法恢复的政治生涯[wm_lead_news_second.GetName]。"
 wm_leadership.4.desc_unopposed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n仅[wm_lead_news_winner.GetName]获得党内[EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0]议员的提名，并无竞争当选[wm_lead_news_party.GetNameNoTier]领袖。成员们从未获得投票权。"
 wm_leadership.4.desc_failed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n挑战[wm_lead_news_winner.GetName]的挑战在开始前就失败了：没有挑战者找到强制投票所需的提名。目前领袖是安全的。"
 wm_leadership.4.a_won: "现在真正的工作才开始。"
 wm_leadership.4.a: "党派已作出选择。"
 wm_leadership.5.t: "在清点之后"
 wm_leadership.5.desc: "大选对[wm_lead_party.GetNameNoTier]来说进展不顺利。报纸已经在写你的政治讣告，一些同事也没有回应电话。\n\n 你可以继续奋斗，也可以宣布一旦党选择继任者你就会下台。"
 wm_leadership.5.a: "我无处可去。"
 wm_leadership.5.b: "该轮到别人了。"
 wm_leadership.5.b.tt: "领导层竞赛开始。你不参选，但你将领导直到竞赛结束。"
 wm_leadership_contest_toast: "领导权竞选：[wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "[wm_lead_party.GetNameNoTier] 是选择领导者：由其议员提名，然后由成员投票。"
 wm_leadership_result_toast: "新领导人：[wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] 领导 [wm_lead_party.GetNameNoTier]。"
 wm_leadership_challenge_decision: "领导权挑战"
 wm_leadership_challenge_decision_desc: "你们政党应得到更好的待遇，你们知道是谁。发起挑战：如果五分之一的政党议员提名你，成员将从你和领导人之间做出选择。"
 wm_leadership_challenge_decision_tooltip: "挑战你党的领导人。"
 wm_leadership_challenge_decision_confirm: "宣布挑战"
 wm_leadership_challenge_decision_effect_tt: "#bold 领导权竞赛 #! 开始：党派议员提名十天，然后进行成员投票。如果失败，领导不会忘记。"
 wm_leadership_no_contest_tt: "目前还没有领导权竞选正在进行"
 wm_leadership_parliament_sitting_tt: "目前没有举行大选"
 wm_leadership_challenged_opinion: "曾挑战我担任领导"
 wm_leadership_deposed_opinion: "我的政党被夺走"
 wm_leadership_gracious_opinion: "一位宽容的获胜者"
