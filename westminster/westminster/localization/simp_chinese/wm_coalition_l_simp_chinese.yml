l_simp_chinese:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "联盟达成"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] 和 [wm_coal_leader.GetName] 已在10号楼台阶上握手。[wm_coal_party.GetNameNoTier]（[wm_coal_party_seats|0] 个席位）加入 [wm_coal_senior.GetNameNoTier]（[wm_coal_senior_seats|0]）政府，[wm_coal_leader.GetFirstName] 成为副首相。"
 wm_coalition_headline_supply: "交易完成：政府获得支持"
 wm_coalition_headline_supply_desc: "[wm_coal_party.GetNameNoTier] 已与 [wm_coal_pm.GetName] 的政府达成信任与供给协议。其 [wm_coal_party_seats|0] 议员将在信任投票和预算上支持政府，其领导人已为其优先事项争取到资金。在其他事务上，每票都是为自己。"
 wm_coalition_headline_minority: "少数民族政府"
 wm_coalition_headline_minority_desc: "会谈无果。[wm_coal_pm.GetName] 将领导一个少数派 [wm_coal_senior.GetNameNoTier] 政府，拥有 [wm_coal_senior_seats|0] 个席位，必须在下议院艰难赢得每一票。"
 wm_coalition_headline_collapse: "联盟崩溃"
 wm_coalition_headline_collapse_desc: "[wm_coal_party.GetNameNoTier] 已经退出了 [wm_coal_pm.GetName] 的政府。没有其投票，政府将没有多数席位，威斯敏斯特正在准备不信任投票或选举。"

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "悬浮议会"
 wm_coalition.1.desc: "国家已经表态，但没有人完全明白其意。[wm_coal_senior.GetNameNoTier]是最大的政党，拥有#bold [wm_coal_senior_seats|0]#!个席位，距离单独在下议院赢得投票所需的[wm_coal_majority|0]席位仍有差距。\n\n内阁秘书已经准备好公务部门的谈判室。其他政党的领导人正守候电话，媒体则驻扎在10号唐宁街外。我们该打电话给谁？\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] 席位"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] 席位"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] 席位"
 wm_coalition.1.a: "与 [wm_coal_choice_1.GetNameNoTier] 进行公开谈判。"
 wm_coalition.1.b: "与 [wm_coal_choice_2.GetNameNoTier] 进行公开谈判。"
 wm_coalition.1.c: "与 [wm_coal_choice_3.GetNameNoTier] 进行公开谈判。"
 wm_coalition.1.d: "我们将独自管理并敢于挑战他们来推翻我们。"
 wm_coalition.1.d.tt: "你领导的#bold 少数政府#!：每一项法案和每一项信任投票都必须在当天获得支持。"

 # The terms
 wm_coalition.2.t: "谈判桌"
 wm_coalition.2.desc: "由 [wm_coal_talks_leader.GetName] 领导的 [wm_coal_talks.GetNameNoTier] 团队，带着长长的要求清单抵达内阁办公室。他们有 #bold [wm_coal_talks_seats|0]#! 国会议员；加上我们的，总数为 [wm_coal_combined_seats|0]。"
 wm_coalition.2.majority: "一起我们将拥有多数。"
 wm_coalition.2.no_majority: "即使在一起，我们仍然难以获得多数，但这是提供的最佳交易。"
 wm_coalition.2.mood_warm: "\n\n 气氛热络。他们的谈判人员同意我们宣言的大部分内容，并希望参与政府。"
 wm_coalition.2.mood_cool: "\n\n 气氛很务实。他们会要求很多回报，他们的活动人员也担心被指责我们的错误。"
 wm_coalition.2.mood_cold: "\n\n 气氛冷淡。我们的党派差距很大，他们的议员宁愿坐在反对党也不愿廉价支撑我们。"
 wm_coalition.2.a: "提出组建联合政府：副总理和一个内阁席位。"
 wm_coalition.2.a.tt: "他们的领导人成为#bold 副首相#!，并且他们的一名议员加入内阁。他们的议员在每次投票中都遵守政府指令。"
 wm_coalition.2.b: "提供联盟，并采纳他们的旗舰政策之一。"
 wm_coalition.2.b.tt: "如上所述，他们的宠物政策进入政府计划。我们自己党团的后座议员不会喜欢：#bold 联盟妥协#! 为期五年。"
 wm_coalition.2.c: "提供一个拥有两个内阁席位和其中一项政策的联合政府。"
 wm_coalition.2.c.tt: "他们的领导人成为#bold 副首相#!，两个议员加入内阁，他们的宠物政策纳入政府计划。"
 wm_coalition.2.d: "提供信任与供应：用他们在信任投票和预算上的选票换取金钱。"
 wm_coalition.2.d.tt: "他们不参与政府事务，但在 #bold 对不信任动议 #! 和 #bold 财政法案 #! 上支持我们。作为回报，我们资助他们的优先事项：这花费了我们的资金，并支付给他们的领导人。"
 wm_coalition.2.e: "让我们尝试另一个政党。"
 wm_coalition_signals_yes_tt: "他们的谈判代表正在表示他们可能会签署这个协议。"
 wm_coalition_signals_no_tt: "他们的谈判代表正在表示这还不够。"

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "联盟提议"
 wm_coalition.3.t_supply: "信任与协助的提议"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName] 已打来电话。[wm_coal_senior.GetNameNoTier] 拥有 [wm_coal_senior_seats|0] 个席位，未达到多数，希望我们加入政府：你担任 #bold 副首相#!，[wm_coal_offer_seats|0] 名我们的议员在内阁会议桌旁。作为回报，我们的议员将对所有事项与政府一致投票。"
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName] 已打来电话。[wm_coal_senior.GetNameNoTier] 拥有 [wm_coal_senior_seats|0] 个席位，未达到多数，希望我们加入政府：你担任 #bold 副首相#!，[wm_coal_offer_seats|0] 名我们的议员在内阁会议桌旁，并将我们的一个旗舰政策纳入政府议程。作为回报，我们的议员将对所有事项与政府一致投票。"
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName] 已打来电话。[wm_coal_senior.GetNameNoTier] 拥有 [wm_coal_senior_seats|0] 个席位，未达到多数，想要一个信任与支持协议：我们的议员在信任投票和预算上支持政府，作为回报，政府资助我们的优先事项。在其他所有事情上，我们可以自由投票。"
 wm_coalition.3.a: "我们达成了协议。"
 wm_coalition.3.a.tt: "协议签署，[wm_coal_pm.GetFirstName]将欠你人情。"
 wm_coalition.3.b: "谢谢，但不行。"
 wm_coalition.3.b.tt: "我们的议员留在反对派，自由投票反对政府。"

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "一项交易完成"
 wm_coalition.4.t_refused: "会谈破裂"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName]已经同意了。[wm_coal_party.GetNameNoTier]加入政府，[wm_coal_leader.GetFirstName]成为副总理，媒体已经开始称这是权宜之计。他们的议员将接受我们的党鞭。"
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName] 已同意。[wm_coal_party.GetNameNoTier] 将在信任投票和财政法案上支持我们，但要付出代价。在其他所有事情上，党鞭必须一次一票地争取其议员的支持。"
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName] 拒绝了我们。[wm_coal_talks.GetNameNoTier] 表示我们的提议远不符合其成员可接受的标准。"
 wm_coalition.4.a: "国家新的篇章。"
 wm_coalition.4.b: "给你点甜点。"
 wm_coalition.4.c: "尝试另一个政党。"
 wm_coalition.4.d: "那么我们单独执政。"

 # Breakdown
 wm_coalition.20.t: "时候走人了？"
 wm_coalition.20.desc_coalition: "我们的议员们坐立不安。政府每一项不受欢迎的决定都归咎于我们，而 [wm_coal_senior.GetNameNoTier] 则因为任何顺利的事务而被赞扬。有些人今天就想让我们退出联盟。"
 wm_coalition.20.desc_supply: "我们的议员们坐立不安。支持 [wm_coal_pm.GetName] 的政府正在让我们付出代价，而为我们的优先事项提供的资金并没有换来我们所希望的感谢。有些人今天就想撕毁协议。"
 wm_coalition.20.polls_bad: "\n\n 民调情况严峻：自从我们达成协议以来，我们大幅下滑。"
 wm_coalition.20.polls_ok: "\n\n 民调暂时保持稳定。"
 wm_coalition.20.a: "我们退出。让政府自力更生吧。"
 wm_coalition.20.a.tt: "协议结束。政府失去你所在党议员的投票，可能面临不信任投票或选举。首相不会原谅你。"
 wm_coalition.20.b: "我们给了承诺。我们留下。"
 wm_coalition.21.t: "我们的合作伙伴退出"
 wm_coalition.21.desc: "我们的合作伙伴已经退出，我们的多数席位也随之消失。反对派嗅到了血腥，媒体想知道我们是否能生存，首席党鞭已经开始点人数。"
 wm_coalition.21.a: "我们以少数政府身份继续执政。"
 wm_coalition.21.a.tt: "下议院的每一次投票都将是一场斗争。"
 wm_coalition.21.b: "寻找新合作伙伴。"
 wm_coalition.21.c: "让国家决定：举行大选。"
 wm_coalition.21.c.tt: "议会解散，#bold 的大选#!将在五周后举行。"

 # Decision
 wm_coalition_leave_decision: "放弃政府协议"
 wm_coalition_leave_decision_desc: "让你的政党退出与政府的协议。你的议员将自由投票，政府将失去多数党地位，总理永远不会原谅你。"
 wm_coalition_leave_decision_tooltip: "结束你的联盟或信任与供应协议"
 wm_coalition_leave_decision_confirm: "退出"
 wm_coalition_leave_decision_effect_tt: "协议结束。政府失去你所在党议员的投票，可能面临不信任投票或选举。"
 wm_coalition_leave_no_election_desc: "尚未宣布大选"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "副总理"
 wm_coalition_deputy_pm_modifier_desc: "政府中的第二名，以及次要联盟伙伴的领导人。"
 wm_coalition_compromise_modifier: "联盟妥协"
 wm_coalition_compromise_modifier_desc: "联盟伙伴的其中一项旗舰政策在政府计划中，而我们自己的后座议员正在抱怨。"
 wm_coalition_supply_deal_modifier: "信心与供应协议"
 wm_coalition_supply_deal_modifier_desc: "在信任投票和预算上支持政府，并且有资金用于显示他们的优先事项。"
 wm_coalition_partner_opinion: "联盟伙伴"
 wm_coalition_walked_out_opinion: "退出我们的政府"
 wm_coalition_deputyship_diarchy_type: "联盟"
 wm_coalition_deputyship_diarch_title: "副总理"
