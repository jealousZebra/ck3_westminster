 # Change Your Politics (common/decisions/wm_ideo_decisions.txt)
 wm_ideo_change_decision: "改变你的政治"
 wm_ideo_change_decision_desc: "论点会改变，人也会改变。采纳新的政治观点：同事们会称之为180度大转弯，崇拜者会称之为皈依。"
 wm_ideo_change_decision_tooltip: "采用不同的意识形态"
 wm_ideo_change_decision_confirm: "改变我的想法"
 wm_ideo_change_decision_choose: "选择一种意识形态"
 wm_ideo_change_decision_effect_tt: "你的[faith|E]会变成你选择的那个。工党或保守党议员转入其党派。"
 wm_ideo_pick_socialist_desc: "成为社会主义者。公有制、工人权利以及消除不平等：民主社会主义左派。"
 wm_ideo_pick_social_democrat_desc: "成为社会民主派。通过充足的公共服务和混合经济实现更公平的国家：主流中左派。"
 wm_ideo_pick_green_desc: "成为环保派。将气候紧急状态放在首位，同时关注社会正义和更公平的民主。"
 wm_ideo_pick_liberal_desc: "成为自由主义者。个人自由、公平投票以及与欧洲的密切关系：自由主义传统。"
 wm_ideo_pick_centrist_desc: "成为中间派。能力优先于意识形态：温和、亲商且务实。"
 wm_ideo_pick_cross_community_desc: "成为跨社区派。既非联合派也非民族主义者：北爱尔兰社区的共同未来。"
 wm_ideo_pick_one_nation_desc: "成为一国保守派。温和、父权式保守主义：社会责任、稳固制度和联合。"
 wm_ideo_pick_free_market_desc: "成为自由市场派。降低税收、放松管制和缩小政府规模以推动增长。"
 wm_ideo_pick_national_conservative_desc: "成为民族保守派。家庭、国家和传统，同时大幅降低移民。"
