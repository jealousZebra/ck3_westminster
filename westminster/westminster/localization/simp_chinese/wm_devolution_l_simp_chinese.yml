l_simp_chinese:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "阅读权力下放简报"
 wm_devolution_briefing_decision_desc: "内阁办公室关于联邦状况的每周说明：\n\n#bold 苏格兰：#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]%支持独立;权力[EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold 威尔士：#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]%支持独立;权力[EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold 北爱尔兰：#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]%支持统一爱尔兰;权力[EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10;权力分享稳定性[EmptyScope.ScriptValue('wm_ui_dev_stability')|0]为100\n\n#bold Z 公众对政治的信任度：#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] 100。"
 wm_devolution_briefing_decision_tooltip: "联盟所处的位置，以及公众对其政客的信任程度。"
 wm_devolution_briefing_decision_confirm: "阅读它"
 wm_devolution.30.t: "国情咨文"
 wm_devolution.30.desc: "#italic 内阁办公室，供传阅#!\n\n#bold 苏格兰：#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% 支持独立；权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold 威尔士：#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% 支持独立；权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold 北爱尔兰：#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% 支持统一爱尔兰；权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10；权力共享稳定 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100\n\n 对离开欧盟的支持随着公众对西敏寺信任的变化而波动，权力被收回或下放，以及各去中心化政府的管理者。一旦超过一半，由民族主义领导的政府可以正式请求进行公投。\n\n#bold 政治信任：#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] 100；预期大选投票率 [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%。"
 wm_devolution.30.suspended: "\n\n#N 北爱尔兰议会被暂停：#! 权力分享已崩溃，只有通过谈判（或时间）才能恢复。"
 wm_devolution.30.sitting: "\n\n北爱尔兰议会正在开会，共享权力仍然有效。"
 wm_devolution.30.a: "记下了。"
 wm_devolution_devolve_decision: "下放一项权力"
 wm_devolution_devolve_decision_desc: "将另一个权力交给爱丁堡、加的夫或贝尔法斯特。更多权力可以减轻脱欧案例的压力，并取悦分权政府。\n\n#bold 苏格兰:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% 支持独立; 权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 的 10\n#bold 威尔士:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% 支持独立; 权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 的 10\n#bold 北爱尔兰:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% 支持统一爱尔兰; 权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 的 10; 权力共享稳定 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 的 100"
 wm_devolution_devolve_decision_tooltip: "赋予下放政府更多权力。"
 wm_devolution_devolve_decision_confirm: "选择一个国家"
 wm_devolution_devolve_decision_effect_tt: "选择一个国家：其权力上升1点，脱欧支持下降#P 3#!Z点（且更低），其首席部长满意，公众信任度上升1点。"
 wm_devolution_claw_back_decision: "收回权力"
 wm_devolution_claw_back_decision_desc: "将权力收回到西敏寺。联邦主义报纸会欢呼；下放政府及其选民则不会。\n\n#bold 苏格兰：#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% 支持独立；权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 为 10\n#bold 威尔士：#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% 支持独立；权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 为 10\n#bold 北爱尔兰：#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% 支持统一爱尔兰；权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 为 10；权力共享稳定 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 为 100"
 wm_devolution_claw_back_decision_tooltip: "将一个下放权力归还给威斯敏斯特。"
 wm_devolution_claw_back_decision_confirm: "选择一个国家"
 wm_devolution_claw_back_decision_effect_tt: "选择一个国家：其权力下降1，支持退出支持率#N 3#!点（且更高），首席部长愤怒，公众信任下降2点，且你获得了一些知名度。"
 wm_devolution_stormont_talks_decision: "召开斯托蒙特会谈"
 wm_devolution_stormont_talks_decision_desc: "北爱尔兰的权力分享已经崩溃。将各方召集到谈判桌前进行密集谈判：达成协议可恢复议会。随着你的魅力和权力分享的稳定性（现在为100的[EmptyScope.ScriptValue('wm_ui_dev_stability')|0]），你的机会会提高。"
 wm_devolution_stormont_talks_decision_tooltip: "尝试恢复斯托蒙特的权力分享。"
 wm_devolution_stormont_talks_decision_confirm: "召开谈判"
 wm_devolution_stormont_talks_decision_effect_tt: "成功恢复议会，提升公众信任度2，并获得知名度。失败仍会让政党更接近（+5稳定性）。"
 wm_devolution.1.t: "公投申请"
 wm_devolution.1.desc: "[wm_dev_gov.GetNameNoTier] 已正式向威斯敏斯特请求获得举行脱离英国公投的权力。其自身的民意调查显示支持率为 [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%，并表示授权意图明确。\n\n 联合主义者席位希望直接拒绝。你的顾问则不那么确定。"
 wm_devolution.1.a: "同意举行公投。"
 wm_devolution.1.a.tt: "六个月后的投票日。结果取决于那时的支持率，上下浮动几个点。一个“是”对你来说将是灾难。"
 wm_devolution.1.b: "现在不是时候。"
 wm_devolution.1.b.tt: "支持脱欧的#N 上升了4#!点，而首席部长对你心生怨恨。他们三年后可以再问一次。"
 wm_devolution.1.c: "改为提供更多权力。"
 wm_devolution.1.c.tt: "国家获得了一项权力，支持度下降了#P 3#!点，代价是一定的声望损失。三年后可以再次请求。"
 wm_devolution.20.t: "下放权力"
 wm_devolution.20.desc: "哪个下放政府获得新权力？"
 wm_devolution.20.scotland: "下放至苏格兰（权力[EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0]为10）。"
 wm_devolution.20.wales: "下放至威尔士（权力[EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0]为10）。"
 wm_devolution.20.northern_ireland: "下放至北爱尔兰（权力[EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0]为10）。"
 wm_devolution.20.none: "重新考虑，目前不行。"
 wm_devolution.21.t: "收回控制权"
 wm_devolution.21.desc: "哪个下放政府将权力移交给威斯敏斯特？"
 wm_devolution.21.scotland: "从苏格兰收回（权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 为 10）。"
 wm_devolution.21.wales: "从威尔士收回（权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 为 10）。"
 wm_devolution.21.northern_ireland: "从北爱尔兰收回（权力 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 为 10）。"
 wm_devolution.21.none: "重新考虑，目前不行。"
 wm_dev_referendum_agreed_toast: "公投通过"
 wm_dev_referendum_agreed_toast_desc: "威斯敏斯特已同意[wm_dev_gov.GetNameNoTier]的请求：将在六个月后举行关于脱离英国的公投。"
 wm_dev_referendum_refused_toast: "公投拒绝"
 wm_dev_referendum_refused_toast_desc: "威斯敏斯特拒绝了[wm_dev_gov.GetNameNoTier]的公投请求。脱离支持率上升。"
 wm_dev_referendum_powers_toast: "更多能力"
 wm_dev_referendum_powers_toast_desc: "威斯敏斯特回应了[wm_dev_gov.GetNameNoTier]的公投请求，提供了新的权力。"
 wm_dev_stormont_collapse_toast: "斯托蒙特坍塌"
 wm_dev_stormont_collapse_toast_desc: "北爱尔兰的权力分享已崩溃，议会被暂停。公众信任受到打击。"
 wm_dev_stormont_restored_toast: "斯托蒙特修复"
 wm_dev_stormont_restored_toast_desc: "一项协议已达成，北爱尔兰权力共享恢复。"
 wm_dev_stormont_talks_failed_toast: "斯托蒙特谈判失败"
 wm_dev_stormont_talks_failed_toast_desc: "会谈在没有达成协议的情况下结束，尽管各方关系比以前更接近。"
 wm_dev_referendum_yes_toast_scotland: "苏格兰投赞成票"
 wm_dev_referendum_yes_toast_scotland_desc: "苏格兰以[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%的优势投票支持苏格兰独立。脱离英国的谈判开始，首相的权威被摧毁。"
 wm_dev_referendum_no_toast_scotland: "苏格兰投反对票"
 wm_dev_referendum_no_toast_scotland_desc: "苏格兰拒绝了苏格兰独立：只有[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%投了赞成票。这个问题在一代人内就已尘埃落定，至少威斯敏斯特希望如此。"
 wm_dev_referendum_yes_toast_wales: "威尔士投赞成票"
 wm_dev_referendum_yes_toast_wales_desc: "威尔士以 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% 的票数投票支持威尔士独立。脱离联合王国的谈判开始，首相的权威被粉碎。"
 wm_dev_referendum_no_toast_wales: "威尔士投票反对"
 wm_dev_referendum_no_toast_wales_desc: "威尔士拒绝威尔士独立：只有 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% 投赞成票。这个问题在一代人中已经解决，或者说西敏寺希望如此。"
 wm_dev_referendum_yes_toast_northern_ireland: "北爱尔兰投赞成票"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "北爱尔兰以 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% 的比例投票支持统一爱尔兰。脱离英国的谈判开始，首相的权威被破坏。"
 wm_dev_referendum_no_toast_northern_ireland: "北爱尔兰投反对票"
 wm_dev_referendum_no_toast_northern_ireland_desc: "北爱尔兰拒绝了统一爱尔兰：仅有 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% 投票赞成。这个问题对一代人来说已解决，或者说威斯敏斯特希望如此。"
 wm_dev_assembly_suspended_modifier: "议会暂停"
 wm_dev_assembly_suspended_modifier_desc: "权力分享已崩溃，北爱尔兰议会被暂停。"
