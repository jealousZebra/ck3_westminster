l_simp_chinese:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "工党左翼"
 wm_wing_badge_1_desc: "该党社会主义左派成员：公有制、工会权利和支出。（在此游戏中，真实议员的派别是随机的，并不代表其观点。）"
 wm_wing_badge_2: "温和左翼"
 wm_wing_badge_2_desc: "该党温和左派成员：领导层的批评朋友，热衷公共服务。（在此游戏中，真实议员的派别是随机的，并不代表其观点。）"
 wm_wing_badge_3: "工党中间派"
 wm_wing_badge_3_desc: "该党中间派成员：财政谨慎，公共服务改革，首要考虑选举胜算。（在此游戏中，真实议员的派别是随机的，并不代表其观点。）"
 wm_wing_badge_4: "一个国家"
 wm_wing_badge_4_desc: "党内“统一国家”派的温和派成员：务实、支持公共服务。（此游戏中真实议员的派系是随机的，并不代表他们的观点。）"
 wm_wing_badge_5: "自由市场主义者们"
 wm_wing_badge_5_desc: "该党自由市场派成员：减税、小政府、放松管制。（在此游戏中，真实议员的派别是随机的，并不代表其观点。）"
 wm_wing_badge_6: "传统主义者"
 wm_wing_badge_6_desc: "该党传统主义者成员：法律与秩序、制度、国家认同。（在此游戏中，真实议员的派别是随机的，并不代表其观点。）"
 wm_wing_court_decision: "法院 一个党翼"
 wm_wing_court_decision_desc_labour: "议会工党派别对其领导人的看法（满分100分）：\n#bold 工党左翼#!（[EmptyScope.ScriptValue('wm_ui_wing_size_1')|0]名议员）：支持率[EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold 软左派#!（[EmptyScope.ScriptValue('wm_ui_wing_size_2')|0]名议员）：支持率[EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold 工党中间派#!（[EmptyScope.ScriptValue('wm_ui_wing_size_3')|0]名议员）：支持度[EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\n关注一个派系的成本#N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#!形象：获得15个支持率，其他获得失去4个。没有席位的派别（或影子内阁）每月都会失去支持率;一个不到30岁的议员在下议院抱怨和叛变，一个15岁以下的派系连续三个月发起领导权挑战。"
 wm_wing_court_decision_desc_conservative: "保守派对其领导人的看法（满分100人）：\n#bold 一国#!（[EmptyScope.ScriptValue('wm_ui_wing_size_4')|0]名议员）：自由市场派[EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold 支持度#!（[EmptyScope.ScriptValue('wm_ui_wing_size_5')|0]名议员）：[EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold 传统派支持率#!（[EmptyScope.ScriptValue('wm_ui_wing_size_6')|0]名议员）：支持率[EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\nZ关注一个派系#N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#!的费用：获得15个支持，其他获得4个。没有席位的派别（或影子内阁）每月都会失去支持率;一个不到30岁的议员在下议院抱怨和叛变，一个15岁以下的派系连续三个月发起领导权挑战。"
 wm_wing_court_decision_tooltip: "让党的各翼保持一致。"
 wm_wing_court_decision_confirm: "选择一个翼"
 wm_wing_court_decision_effect_tt: "选择一个翼：其对你的好感度#P 上升15#!Z，其他翼的好感度下降#N 4#!。"
 wm_wing.1.t: "团结党内。"
 wm_wing.1.desc: "主题演讲，一个政策的暗示，未来晋升的承诺。党内哪个派系需要关注？"
 wm_wing.1.w1: "联系工党左翼（批准 [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]）。"
 wm_wing.1.w2: "联系温和左翼（批准 [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]）。"
 wm_wing.1.w3: "联系工党温和派（批准 [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]）。"
 wm_wing.1.w4: "联系一国主义（批准 [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]）。"
 wm_wing.1.w5: "联系自由市场派（批准 [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]）。"
 wm_wing.1.w6: "联系传统派（批准 [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]）。"
 wm_wing.10.t: "一场领导权挑战"
 wm_wing.10.desc: "信件已经寄来了。议会党派的一派失去耐心，提出挑战你领导权的举[wm_wing_challenger.GetName]。报纸正在数名字，广播员已经准备好了他们的图表，你的电话也一直响个不停。\n\n你可以给叛军他们想要的东西，也可以直接对抗他们。"
 wm_wing.10.a: "给他们想要的东西。"
 wm_wing.10.a.tt: "你失去#N 300#!的形象;叛军派系的支持率上升#P 30#!Z，其他派系下降#N 4#!。"
 wm_wing.10.b: "面对他们。"
 wm_wing.10.b.tt: "一场#bold 的魅力#!对抗[wm_wing_challenger.GetName]。赢了叛乱就会消散;输了他们就掌控领导权（如果你是首相，还包括唐宁街）。"
 wm_wing_challenge_toast: "领导挑战"
 wm_wing_challenge_toast_desc_1: "工党左翼已对 [wm_wing_leader.GetName] 发起行动：[wm_wing_challenger.GetName] 正在挑战 [wm_wing_party.GetNameNoTier] 的领导权。"
 wm_wing_challenge_toast_desc_2: "温和左派已对 [wm_wing_leader.GetName] 发起行动：[wm_wing_challenger.GetName] 正在挑战 [wm_wing_party.GetNameNoTier] 的领导权。"
 wm_wing_challenge_toast_desc_3: "工党中间派已对 [wm_wing_leader.GetName] 发起行动：[wm_wing_challenger.GetName] 正在挑战 [wm_wing_party.GetNameNoTier] 的领导权。"
 wm_wing_challenge_toast_desc_4: "一个民族已对 [wm_wing_leader.GetName] 发起行动：[wm_wing_challenger.GetName] 正在挑战 [wm_wing_party.GetNameNoTier] 的领导权。"
 wm_wing_challenge_toast_desc_5: "自由市场派已经对[wm_wing_leader.GetName]采取了行动：[wm_wing_challenger.GetName]正面临[wm_wing_party.GetNameNoTier]领导权的挑战。"
 wm_wing_challenge_toast_desc_6: "传统主义者已对 [wm_wing_leader.GetName] 发起行动：[wm_wing_challenger.GetName] 正在挑战 [wm_wing_party.GetNameNoTier] 的领导权。"
