l_simp_chinese:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "暴徒在[wm_riot_seat.GetName]"
 wm_riot_gathering_toast_desc: "愤怒的人群已在 [wm_riot_seat.GetName] 聚集。[wm_riot_organiser.GetName] 正在组织一场前往威斯敏斯特的抗议游行。"
 wm_riot_marching_toast: "由 [wm_riot_seat.GetName] 发起的抗议游行"
 wm_riot_marching_toast_desc: "从 [wm_riot_seat.GetName] 发起的抗议游行在 [wm_riot_organiser.GetName] 的带领下已出发前往威斯敏斯特。它将在本月内抵达，并提出诉求。"

 wm_riot_demand_1_desc: "\n\n他们希望得到#bold 生活成本#!方面的帮助：账单、房租和食品价格已经飞涨，他们说政府不关心。"
 wm_riot_demand_2_desc: "\n\n他们想要一次#bold 部长辞职#!：内阁中有人必须承担责任，他们想要有人负责。"
 wm_riot_demand_3_desc: "\n\n他们想要一次#bold 大选#!：他们说，政府正在做的事情没有授权，国家应该做出决定。"
 wm_riot_demand_4_desc: "\n\n 他们希望 #bold 彻底掉头 #!：立即取消他们讨厌的政策，没有任何条件。"

 wm_riot.10.t: "[wm_riot_seat.GetName] 的麻烦"
 wm_riot.10.desc: "我的选区办公室电话一直响个不停。数百人在[wm_riot_seat.GetName]的街头游行，商店都拉上了卷闸门，当地活动家[wm_riot_organiser.GetName]告诉摄像机，如果没人听取他们的声音，队伍将会向西敏寺进发。"
 wm_riot.10.a: "出去和他们谈谈。"
 wm_riot.10.a.success: "人群聆听后散去"
 wm_riot.10.a.failure: "被街头唾弃"
 wm_riot.10.b: "公开说他们说得有道理。"
 wm_riot.10.c: "保持低调，让10号处理。"

 wm_riot.20.t: "三月抵达威斯敏斯特"
 wm_riot.20.desc: "议会广场上满是标语牌。"
 wm_riot.20.desc_first: "[wm_riot_seat.GetName] 的抗议游行已经到达，其组织者 [wm_riot_organiser.GetName] 请求与我会面并提交一份要求清单。"
 wm_riot.20.desc_bigger: "[wm_riot_seat.GetName]的游行回来了，比以前更大更愤怒。[wm_riot_organiser.GetName]说不会再有谈判。"
 wm_riot.20.desc_gone: "\n\n 当我阅读完简报时，人群已经慢慢散去。"
 wm_riot.20.a: "给他们想要的东西。"
 wm_riot.20.b: "邀请组织者进来讨论。"
 wm_riot.20.b.success: "达成妥协。"
 wm_riot.20.b.failure: "会谈破裂。"
 wm_riot.20.c: "告诉警察清理广场。"
 wm_riot.20.c.dispersed: "警察清理了广场"
 wm_riot.20.c.violence: "晚间新闻中的暴力场面"
 wm_riot.20.d: "很好。"

 wm_riot_county_modifier: "骚乱"
 wm_riot_county_modifier_desc: "愤怒的人群涌上街头，抗议游行正在进行中。"
 wm_riot_demands_met_county_modifier: "要求已满足"
 wm_riot_demands_met_county_modifier_desc: "政府给了抗议者他们想要的东西。"
 wm_riot_compromise_county_modifier: "一项妥协"
 wm_riot_compromise_county_modifier_desc: "抗议者带着协议回家了。"
 wm_riot_policed_county_modifier: "抗议被镇压"
 wm_riot_policed_county_modifier_desc: "警察驱散了抗议游行，这里的人们没有忘记此事。"
 wm_riot_crackdown_county_modifier: "警察暴力"
 wm_riot_crackdown_county_modifier_desc: "警察冲散抗议游行的照片仍在传播。"
 wm_mp_backed_protesters_county_modifier: "议员支持了抗议"
 wm_mp_backed_protesters_county_modifier_desc: "当地议员站在抗议者一边。"
 wm_cost_of_living_package_modifier: "生活费用补偿包"
 wm_cost_of_living_package_modifier_desc: "政府支付的账单帮助。"
 wm_u_turn_modifier: "U 型转弯"
 wm_u_turn_modifier_desc: "被一场抗议游行迫使做出屈辱性的回转。"
 wm_heavy_handed_modifier: "高压手段"
 wm_heavy_handed_modifier_desc: "派警察对抗一次抗议游行。"
 wm_crackdown_modifier: "因警察暴力而被指责"
 wm_crackdown_modifier_desc: "警务，一场抗议游行演变成暴力，责任就落到了这里。"

 wm_forced_to_resign_opinion: "逼我辞职"
 wm_backed_protesters_opinion: "站在抗议者一边"
 wm_policed_my_constituents_opinion: "派警察对付我的选民"
