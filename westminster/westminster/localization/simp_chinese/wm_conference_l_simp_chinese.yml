l_simp_chinese:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "会议：领导人的演讲"
 wm_conference.1.desc: "现在正值会议季，[wm_conference_party.GetNameNoTier]已经占用了一个海边会议中心，举办为期四天的边缘会议、挂绳和温热的咖啡。明天是重点：我将在大厅发表演讲，所有新闻频道将现场直播。演讲稿已经出到第十九稿。喉片在我口袋里。舞台上有一个标语，字母高度四英尺，有人已经检查过，没有松动。大概吧。"
 wm_conference.1.a: "按稿件发表演讲。"
 wm_conference.1.b: "撕掉剧本，真心发言。"
 wm_conference.1.c: "揭示一项特定政策公告。"

 wm_conference_headline_triumph: "得意的演讲让霍尔站了起来"
 wm_conference_headline_solid: "领导人演讲：“很好，”代表们说"
 wm_conference_headline_disaster: "咳嗽肆虐，舞台破碎的灾难"
 wm_conference_headline_policy_hit: "大胆承诺成为焦点"
 wm_conference_headline_policy_flop: "旗舰政策在午餐前就败坏了"
 wm_conference.2.desc_triumph: "十一起起立鼓掌，其中一次是在喘息的暂停时。小品编剧们努力忍住无礼，隔夜民调已经公布，议会党团突然非常渴望和我一起出现在酒吧里。"
 wm_conference.2.desc_solid: "没有起立鼓掌，没有灾难，也没有信件从背景上掉落。报纸称之为\"工作者类似\"，对他们来说几乎是一封情书。"
 wm_conference.2.desc_disaster: "一切始于喉咙的轻微痒感，最终变成大厅里代表们向舞台递喉片，而我身后的口号少了两个字母。一名抗议者走到了讲台前。多年来，幽默稿作者们都没经历过这样的日子，在酒吧里，我的同事们低声交谈。"
 wm_conference.2.desc_policy_hit: "这项政策没有经过试行，没有被泄露，并且在每份公告中都名列前茅。对立党派争相声称他们最先想到它。大厅里有人高呼我的名字，这很好，虽有些令人不安。"
 wm_conference.2.desc_policy_flop: "当我离开舞台时，一个智库发现成本预算中存在四百亿英镑的漏洞，我自己前座的两名议员在广播中说他们从未听说过这个。"
 wm_conference.2.a: "明年总还有机会。"

 wm_conference.10.t: "会议：挂绳与边缘议题"
 wm_conference.10.desc: "[wm_conference_party.GetNameNoTier] 会议如火如荼：四天的边缘会议在闷热的侧室进行，由无人知晓的贸易机构赞助的招待会，以及酒店酒吧，真正的业务在午夜后进行。[wm_conference_leader.GetName] 明天发言。我该如何安排我的会议？"
 wm_conference.10.a: "在边缘会议上发言。"
 wm_conference.10.b: "酒店酒吧的剧情。"
 wm_conference.10.c: "参与接待并建立人脉。"
 wm_conference.10.d: "坐在大厅里，大声而明显地为领袖鼓掌。"
 wm_conference_fringe_good: "边缘节目：座无虚席和好评如潮"
 wm_conference_fringe_off_message: "边缘节目：评论‘偏离主题’"
 wm_conference_plot_found_out: "阴谋：被鞭子偷听"

 wm_conference.20.t: "领导权传闻"
 wm_conference.20.desc: "会议结束了，人们谈论的不是我的演讲。匿名同事在向周日的报纸透露，[wm_conference_party.GetNameNoTier] 需要\"重新开始\"，这个词语从不意味着新标志。党鞭们有名字。问题是我会怎么处理。"
 wm_conference.20.a: "面对阴谋者。"
 wm_conference.20.b: "承诺听从议会党派。"
 wm_conference.20.c: "将其视为西敏寺圈子的闲谈而不予理会。"
 wm_conference_faced_down: "传言：密谋者退缩"
 wm_conference_not_faced_down: "传言：故事延续不断"

 wm_conference_triumph_modifier: "会议胜利"
 wm_conference_triumph_modifier_desc: "发表了一次人们明年仍会引用的会议演讲，理由正确。"
 wm_conference_disaster_modifier: "会议灾难"
 wm_conference_disaster_modifier_desc: "发表了一次人们明年仍会引用的会议演讲，理由不正确。"

