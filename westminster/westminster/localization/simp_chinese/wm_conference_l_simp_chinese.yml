 wm_conference_listened_opinion: "承诺听从党派"
 wm_conference_contacts_opinion: "在会议上见面"
 wm_conference_fellow_plotter_opinion: "一起在酒店酒吧策划"
 wm_conference_caught_plotting_opinion: "被抓到密谋对付我"
 wm_conference_loyal_applause_opinion: "为我的演讲鼓掌最响亮"
 wm_conference_off_message_opinion: "在边缘会议上跑题"
