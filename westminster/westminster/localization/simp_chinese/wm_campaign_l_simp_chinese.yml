l_simp_chinese:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "选战巡礼：第 [EmptyScope.ScriptValue('wm_campaign_week_value')|0] 周"
 wm_campaign.1.desc: "国会解散，战斗巴士正在外面待命。本周日程表有一个空缺，我的手机有140条未读消息，还有人未经允许就给我戴上了花结。"
 wm_campaign.1.desc_leader: "\n\n 作为 [wm_campaign_party.GetNameNoTier] 的领导者，我的每一个举动都是全国新闻。广播公司想要与 [wm_campaign_rival.GetName] 进行正面对决，政策部门已经准备好发布。在国内，我在 [wm_campaign_seat.GetNameNoTier] 的代理希望我能在投票日之前至少见一次。"
 wm_campaign.1.desc_leader_no_rival: "\n\n 作为 [wm_campaign_party.GetNameNoTier] 的领导者，我的每一个举动都是全国新闻，政策部门已经准备好发布。"
 wm_campaign.1.desc_mp: "\n\n 全国竞选不知道我是谁，这让人放心。重要的是 [wm_campaign_seat.GetNameNoTier]：传单、上门拜访，以及当地报纸是否正确打印我的照片。"
 wm_campaign.1.a: "举行一场大型集会。"
 wm_campaign.1.b: "在电视辩论中应对 [wm_campaign_rival.GetFirstName]。"
 wm_campaign.1.c: "进行电视辩论，并用统计数据压倒 [wm_campaign_rival.GetFirstName]。"
 wm_campaign.1.d: "推出旗舰政策。"
 wm_campaign.1.e: "去[wm_campaign_seat.GetNameNoTier]挨家挨户拜访。"
 wm_campaign.1.f: "竞选总部的一个平静的星期，批准传单。"

 wm_campaign_rally_success: "集会：热烈欢迎"
 wm_campaign_rally_flat: "集会：礼貌掌声"
 wm_campaign_rally_flop: "集会：半空大厅"
 wm_campaign_debate_won: "辩论：即时民调帮你猜测"
 wm_campaign_debate_lost: "辩论：在灯光下挣扎"
 wm_campaign_debate_wonk_won: "辩论：电子表格致死（他们的）"
 wm_campaign_debate_wonk_lost: "辩论：在“财政前台”失去观众"
 wm_campaign_policy_success: "政策发布：直击要点"
 wm_campaign_policy_flop: "政策发布：早餐广播中揭秘成本"
 wm_campaign_door_knock: "上门拜访：赢得门前支持"

 wm_campaign.2.t: "失误！"
 wm_campaign.2.desc: "我的新闻官脸上写满了刚看到了明天头版的表情。"
 wm_campaign_gaffe_1: "一位摄影师在我在咖啡馆吃培根三明治时抓拍到我，这一结果在网上被描述为\"一次早餐人质事件\"。它已经成为一个模因、一个马克杯和一个铃声。"
 wm_campaign_gaffe_2: "我忘了在工厂参观后麦克风还开着，全国的人现在都听到我称一位选民为 \"，说实话有点过分\"。她从午饭后已经接受了四次采访。"
 wm_campaign_gaffe_3: "在电台直播中被问及一品脱牛奶多少钱时，我以非常自信的语气说：\"大约十一英镑？\"。主持人让沉默持续了九秒。"
 wm_campaign_gaffe_4: "在一次拍照机会中，我自信地走错门，走进了一个橱柜，摄影机等着我再走出来。我最终出来了，手里拿着一把拖把。"
 wm_campaign_gaffe_5: "我在整场演讲中一直把我们的一份传单倒过来举着，背景的横幅甚至拼错了选区名称。我们自己的候选人的名字也是如此。"
 wm_campaign.2.a: "一笑而过。每个人都有糟糕的三明治日。"
 wm_campaign.2.b: "责怪初级员工。"
 wm_campaign.2.c: "倾向于此：再次故意为镜头做"
 wm_campaign_gaffe_shrugged: "失误：公众觉得颇为可爱"
 wm_campaign_gaffe_stuck: "失误：成为每条新闻头条"
 wm_campaign_gaffe_viral: "失误：自嘲引发病毒式传播（好的一面）"
 wm_campaign_gaffe_doubled: "失误：\"加倍赌注\"不是解决办法"

 wm_campaign_doorstep_county_modifier: "在门口见了他们的议员"
 wm_campaign_doorstep_county_modifier_desc: "他们的议员在竞选期间敲门，并记得擦鞋。"
 wm_campaign_viral_gaffe_modifier: "病毒失误"
 wm_campaign_viral_gaffe_modifier_desc: "一个网络无法忘记的竞选失误。"

 wm_campaign_debate_humiliated_opinion: "在电视辩论中打败我"
