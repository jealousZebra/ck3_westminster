l_simp_chinese:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "职业敛财权是可以授予政党官员的地方或远程财产、职务，或共享的教皇收入#i 以受托形式#!。它们会产生收入，通常无需直接管理职责。"
 additional_mandala_government_piety_levels: "[mandala|E] [government|E] 可以在 [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] 之后解锁额外的政治资本等级，直到 [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]（包含）。为了达到这种神圣程度，他们的忠诚需要被一代代证明。"
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ 是 [crown_authority|E] 的最高级别。[vassals|E] 对其 [liege|E] 有一个 #N -30#! [opinion|E] 的惩罚。\n\n在这个级别——除了 [high|E] 和 [limited|E] 皇冠权力的效果外——统治者可以以 [prestige|E] 的代价选择一个 [designated_heir|E]。\n\n此外，后座议员甚至不能对外国统治者宣战。"
 game_concept_acclaimed_knight: "明星组织者"
 game_concept_acclaimed_knight_desc: "[knight|E] 举行 [accolade|E]。\n\n 要成为明星组织者，组织者必须是 [unlanded|E] 或 [baron|E]，并且至少有 [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] 个或更多 [prowess|E]。明星组织者必须至少有资格获得一项尚未被其 [liege|e] 的其他明星组织者拥有的 [accolade_type|E]。\n\n 明星组织者在战斗中不太可能被杀或被俘。他们可以通过主要与 [wars|E] 作战以及参加诸如 [GetActivityType( 'activity_tournament' ).GetName] 的 [activities|E] 来提升 [glory|E]。\n\n 受赞誉的组织者可能偶尔获得与其荣誉属性相关的 [skills|E] 和 [traits|E]。"
 game_concept_acclaimed_knight_possessive: "明星组织者的"
 game_concept_acclaimed_knights: "明星组织者们"
 game_concept_accolade_desc: "荣誉是由 [liege|E] 给予 [knights|E] 的荣誉。\n\n持有荣誉的组织者将成为 [acclaimed_knight|E]。\n\n随着星级组织者获得 [glory|E]，他们的 [accolade_squires|E] 天赋会提升（改善 [accolade_succession|E]），并可能获得 [accolade_ranks|E]。这允许解锁更多 [accolade_types|E]，提供更强的加成。\n\n当星级组织者死亡时，将进行 [accolade_succession|E] 并且组织者会立即被继承者替换，其技能会受 [accolade_squires|E] 天赋的影响。\n\n[innovations|e] 及更高级的 [title_tiers|e] 允许 [rulers|E] 同时拥有更多荣誉。"
 game_concept_accolade_squires_desc: "每个[accolade|E]都有侍从天赋指标，它会修改其下一个[acclaimed_knight|E]的[traits|E]和[skills|E]（主要是[prowess_skill|E]、[martial_skill|E]和[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]）。\n\n侍从天赋分为5个等级：\n$EFFECT_LIST_BULLET$熟练\n$EFFECT_LIST_BULLET$有能力\n$EFFECT_LIST_BULLET$缺乏经验\n$EFFECT_LIST_BULLET$无能\n$EFFECT_LIST_BULLET$可怜\n\n具有缺乏经验或更高的天赋会使星组织者偶尔影响年轻、武术性别[courtiers|E]的[traits|E]和[skills|E]，使他们在[accolade_succession|E]时优先获得荣誉。\n\n侍从主要通过[glory|E]获得提升，但也包括：\n$EFFECT_LIST_BULLET$星组织者的[prowess_skill|E]\n$EFFECT_LIST_BULLET$星组织者的[martial_skill|E]'\n$EFFECT_LIST_BULLET$星组织者获得[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$星组织者获得[GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$荣誉的[martial_skill|E] [liege|E]\n$EFFECT_LIST_BULLET$荣誉的[prowess_skill|E] [liege|E]\n\n每个[accolade_succession|E]会重置荣誉的侍从。"
 game_concept_accolade_succession_desc: "荣誉继承发生在 [accolade_possessive|E] [acclaimed_knight|e] 死亡或失效时。\n\n前任星级组织者会立即被替换。由于荣誉的 [accolade_squires|E] 天赋而接受训练的年轻 [courtiers|E] 和 [knights|E] 会首先被优先作为继承者；然后是其他组织者、其他工作人员、流浪者，最后是新创建的 [characters|E]。根据荣誉的 [accolade_squires|E] 天赋，新组织者将获得增加的 [prowess_skill|E]、[martial_skill|E]、[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]，并可能获得其他 [skills|E]。\n\n荣誉继承后，可能会损失少量 [glory|E]，并且荣誉的见习天赋将重置，以反映其新星级组织者的技能和经验\n\n在战斗、决斗或其他光荣方式中死去的星级组织者将抵消荣耀损失，并提升荣誉的见习者。"
 game_concept_accolade_type_desc: "一个[accolade|E] 最多有#value 3#! 属性，当其更高等级被解锁时提供增长奖励。每个属性有#value 3#!等级。当一个荣誉提升其[accolade_rank|E]时，其拥有者可以选择提升现有属性的等级或为荣誉添加新属性。然而，[acclaimed_knight|E]必须满足任何新属性的要求。\n\n每个[knight|E]仅有资格获得某些属性，这些属性可能基于[traits|E]、[skills|E]或在担任组织者期间的经验解锁。\n\n每个荣誉必须具有唯一属性：一位队长#high 不能#!在不同荣誉之间重复属性。每个荣誉也可以专精于仅#value 1#! [men_at_arms|E]类型属性。"
 game_concept_ai_economical_boom_personality_desc: "一个 $game_concept_ai_economical_boom_personality$ 想将他们所有的 [gold|E] 投资于 [realm|E]。他们会清空国库来资助 [buildings|E] 和 [men_at_arms|E]，并且经常建造更多 [economic_buildings|E] 和 [holdings|E]。只有在直接受到威胁时，比如来自强大的 [faction|E]，他们才会储蓄资金。\n\n$game_concept_ai_economical_boom_personality$ 的统治者稍微不太可能创造和推广 [legends|E]。\n\n 有倾向于建筑而对 [war|E] 没有特别兴趣的大胆统治者通常是 $game_concept_ai_economical_boom_personality$。\n 常见特征包括 [GetTrait('calm').GetName( GetNullCharacter )]、[GetTrait('patient').GetName( GetNullCharacter )]、[GetTrait('diligent').GetName( GetNullCharacter )]、[GetTrait('generous').GetName( GetNullCharacter )]、[GetTrait('stubborn').GetName( GetNullCharacter )] 和 [GetTrait('profligate').GetName( GetNullCharacter )]。拥有 [GetFocus('stewardship_domain_focus').GetName] 的统治者也倾向于是 $game_concept_ai_economical_boom_personality$。"
 game_concept_ai_pious_builder_personality_desc: "一个 $game_concept_ai_pious_builder_personality$ 想将他们所有的 [gold|E] 投资于增加他们的 [piety|E].\n\n他们会花费国库资金来资助宗教和仪式性的 [buildings|E]、[great_projects|E]、[activities|E] 和 [decisions|E]，并且经常建造更多的 [pious_buildings|E] 和 [temple|E] 或 [temple_citadel|E] [holdings|E]。只有在直接受到威胁时，比如来自强大的 [faction|E]，他们才会储蓄资金。\n\n$game_concept_ai_pious_builder_personality$ 更可能创造和推广神圣的 [legends|E]。\n\n 热心的 [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] 倾向于 [virtue|E] 而对 [war|E] 没有特别兴趣，通常是 $game_concept_ai_pious_builder_personality$。\n 常见特征包括 [GetTrait('zealous').GetName( GetNullCharacter )]、[GetTrait('forgiving').GetName( GetNullCharacter )]、[GetTrait('improvident').GetName( GetNullCharacter )]、[GetTrait('humble').GetName( GetNullCharacter )]、[GetTrait('patient').GetName( GetNullCharacter )]、[GetTrait('diligent').GetName( GetNullCharacter )] 和 [GetTrait('generous').GetName( GetNullCharacter )]。拥有 [GetFocus('learning_theology_focus').GetName] 的统治者也倾向于是 $game_concept_ai_pious_builder_personality$。"
 game_concept_ai_warlike_personality_desc: "一个$game_concept_ai_warlike_personality$的[ruler|E]希望随时准备宣布[war|E]。他们会为[war|E]保存[gold|E]，然后再投资于发展他们的[realm|E]。如果$game_concept_ai_warlike_personality$的统治者长期处于和平状态，他们将使用战争基金中的资金建造[buildings|E]。\n\n$game_concept_ai_warlike_personality$统治者更可能创造和提升英雄[legends|E]。\n\n大胆且贪婪的统治者往往好战。\n常见特征包括[GetTrait('wrathful').GetName( GetNullCharacter )]、[GetTrait('impatient').GetName( GetNullCharacter )]、[GetTrait('sadistic').GetName( GetNullCharacter )]、[GetTrait('ambitious').GetName( GetNullCharacter )]、[GetTrait('vengeful').GetName( GetNullCharacter )]、[GetTrait('irritable').GetName( GetNullCharacter )]和[GetTrait('zealous').GetName( GetNullCharacter )]。"
 game_concept_alliance_desc: "$game_concept_alliance$ 是两个 [rulers|E] 之间的外交关系。[independent|E] 君主可以呼吁 $game_concept_allies$ 加入彼此的 [wars|E]。\n\n 联盟通过 [marriage|E] 或 [betrothal|E] 创建和维持，只要缔结婚姻的两个角色与两个君主关系足够密切。例如，如果一个 [king|E] 将他的女儿嫁给另一位国王的儿子，这两位国王就会成为 $game_concept_allies$。\n\n[lieges|E] 也可以与他们的 [vassals|E] 创建 $game_concept_alliances$。党派领袖不能呼叫后座议员参战，但可以阻止他们加入 [factions|E]。"
 game_concept_anointment_request_desc: "请求任命 [character_interaction|E] 是一种特殊互动，可由 [empire|E] [title_tier|E] 的 [ruler|E] 或更高职务的 [head_of_faith|E]，或在没有该职务时的党派官员 [head_of_rite|E] 使用，以确保他们在 [anointment|E] 中的支持。"
 game_concept_archdiocese_desc: "总教区是[christian|E]的一种[clerical_region|E]形式，是由[archbishop|E]通过其[clerical_title|E]持有的宗教职务，座落于首都[county|E]，可设立[grand_cathedral|E]。\n\nA [christian|E] [ruler|E]在精神事务上对包含其[capital|E] [county|E]的总教区[archbishop|E]负责，总教区管辖的领土总称为[the_christian_church|E] [situation|E]。"
 game_concept_aspect_of_serenity_desc: "和平党就是繁荣党——宁静面向珍视安宁与外交事务，对与其理念一致的个体给予奖励。\n$EFFECT_LIST_BULLET$专注于[diplomacy|E]\n$EFFECT_LIST_BULLET$避免冒犯[wars|E]由[GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L]堆栈\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName]和[GetScheme('befriend').GetTypeName] [schemes|E]更为成功\n$EFFECT_LIST_BULLET$也可能#high $request_great_project_contribution_interaction$s#!来自[allies|E]\n$EFFECT_LIST_BULLET$只能死于[death_natural_cause|E]或[death_religious|E] [character_death_deaths|E]"
 game_concept_at_peace_opinion_desc: "将[GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E]纳入[faith|E]的角色将获得“$game_concept_at_peace_opinion$”而非[offensive_war_opinion|E]惩罚。\n\n如果你和平太久，你的[vassals|E]会#weak 看不起你（如果他们和你有相同的意识形态）。#!"
 game_concept_autonomous_vassals: "自主普通议员"
 game_concept_autonomous_vassals_crown_authority: "自主普通议员 王权"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' 是 [crown_authority|E] 的最低等级。在此等级，[vassals|E] 对他们的 [liege|E] 没有 [opinion|E] 惩罚，而党领袖对他们只有基本的权力。"
 game_concept_available_spouse_desc: "为了在统治者的 [council|E] 任职，[spouse|E] 必须可用以履行该角色的职责。\n\n各种情况可能阻止 $game_concept_spouse$ 履行这些职责，但最常见的几种包括：\n$BULLET_WITH_TAB$成为自己 [ruler|E] 的 [realm|E]\n$BULLET_WITH_TAB$居住在其他统治者的 [court|E]\n$BULLET_WITH_TAB$身处 [imprisoned|E]，不论在国内还是国外\n$BULLET_WITH_TAB$拥有 [GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]\n\n如果不可用的配偶再次可用，他们将自动恢复在内阁的职责。\n\n如果配偶本身是统治者，他们仍然可以作为你的 [direct_vassals|E] 在内阁任职，否则永远不会被认为可用。"
 game_concept_baronies: "选区"
 game_concept_barony: "沃德"
 game_concept_beneficiary_desc: "[great_holy_war|E]中的每个参与者都可以从自己的[dynasty|E]中选择一个$game_concept_beneficiary$。胜利后，$game_concept_beneficiary$将在目标政党中获得与其主保统治者的主[war_contribution|E]成比例的土地。\n\n最大的贡献者可以强制其受益者获得争夺的主要头衔。"
 game_concept_buy_claim_desc: "一种允许角色用[piety|E]交换购买[unpressed_claims|E]的互动。\n\n$EFFECT_LIST_BULLET$A [vassal|E] 不能购买任何[liege|E]的[title|E]的主张，党派领导人也不能购买任何后座议员的职称主张\n$EFFECT_LIST_BULLET$A [king|E] 或 [emperor|E] 不能购买国家职称的主张，皇帝不能购买其他帝国的主张\n$EFFECT_LIST_BULLET$任何人不能购买自己[head_of_faith|E]的主张。"
 game_concept_canonized_desc: "一个 [character|E] 在死后被宣布为圣人或其他意识形态的等同者，例如 Wali 或受尊敬的祖先，获得 [GetTrait('saint').GetName( GetNullCharacter )] [trait|E]。\n\n 有德行的生活可能以 $game_concept_canonization$ 结束：这需要通过 [decision|E] 提出请求，可能需要 [head_of_faith|E] 的祝福，并通过奉献圣人的墓地来封印。此后的安息之地会吸引虔诚的旅行者，他们的遗体可能提供 [holy_relics|E]。"
 game_concept_capital_duchy: "首都区"
 game_concept_capital_duchy_desc: "$game_concept_capital_duchy$ 修饰符会增加你从同一个 [de_jure|E] [duchy|E] 内持有的所有 [holdings|E] 中获得的 [levies|E] 数量，就像你的 [capital|E] 一样。它还会给所有 [stationed|E] [men_at_arms|E] 提供奖励。为了使此修饰符生效，你需要亲自持有相关的区域。\n\n此修饰符不能与基地加成叠加。"
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$ 试图任命特定的 [claimant|E] 为 [ceremonial_liege|E]。如果成功，现任礼仪党领袖将不得不将他们的 [title|E] 交给申索者。所有 [faction|E] 成员将对申索者获得 [hook|E]。"
 game_concept_ceremonial_liege_desc: "在某些 [realms|E]（如日本），强大的官僚或指挥官可能作为 [ceremonial_regent|E] 掌握了真正的权力，使名义上的 $game_concept_ceremonial_liege$ 仅为傀儡和实际的 [vassal|E]。$game_concept_ceremonial_liege_possessive$ [house|E] 的所有成员都被视为 [ceremonial_house|E] 的一部分。\n\n 尽管不直接统治，但 $game_concept_ceremonial_house$ 是党派中最受尊敬的血统，其他 [houses|E] 与之通婚时会获得更多 [prestige|E]，这样的联系强烈影响 $game_concept_ceremonial_regent$ 的继承。\n\n 如果 $game_concept_ceremonial_liege$ 以某种方式重新获得党派的 [primary_title|E]，例如通过 [faction|E] 的要求或使用 [influence|E] 竞争 $game_concept_ceremonial_regent$ [title|E]，他们可能会重新掌握真正的权力。"
 game_concept_challenger_hof: "挑战者运动领导者"
 game_concept_challenger_hof_desc: "A $game_concept_challenger_hof$ 是针对 [mainline_rite|E] $game_concept_head_of_faith$ 提出的对手 [head_of_faith|E]。\n\nA [ruler|E] 可以赞助他们 [clergy|E] 的成员担任 $game_concept_challenger_hof$。[clergy|E] [ruler|E] 或拥有时间运动领导者的 [faith|E] 的统治者可以宣布自己为挑战者。\n\nA 被赞助的 $game_concept_challenger_hof$ 会继承他们赞助者的 [rite|E]，成为该赞助者的 [external_clerical_puppet|E]，并欠其 [weak_hook|E]。\n\n $game_concept_mainline_rite$ $game_concept_head_of_faith$ 无法 [excommunicate|E] 任何跟随 $game_concept_challenger_hof$ 的人：赞助者及其 [vassals|E]。\n\n 所有跟随 $game_concept_challenger_hof$ 的人将其教会请求提交给他们，而不是 $game_concept_mainline_rite$ $game_concept_head_of_faith$，其中包括这些 [interactions|E]：\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nA $game_concept_challenger_hof$ 或其赞助者可以使用 [pam_challenge_hof_cb|E] [casus_belli|E] 对抗合法的 $game_concept_head_of_faith$。\n\n 同一 [faith|E] 的对手 [kings|E] 或以上级别的可以改用 [pam_antiking_cb|E] 对抗赞助者，废黜对手的要求者。"
 game_concept_chancellor: "外交大臣"
 game_concept_chancellor_desc: "$game_concept_chancellor$ 是负责外交事务的 [councillor|E]，无论是在国外还是与其他 [realm|E] 的关系。"
 game_concept_chancellors: "外交大臣"
 game_concept_church_authority_desc: "$game_concept_church_authority$ 代表了 [theocratic|E] [ruler|E] 对其 [clergy|E] 和 [vassals|E] 所掌握的权力。\n\n 有四个 $game_concept_church_authority$ 等级；$church_authority_0$、$church_authority_1$、$church_authority_2$ 和 $church_authority_3$。提高 $game_concept_church_authority$ 需要根据等级和统治者的 [learning_skill|E] 支付一定数量的 [piety|E] 和 [prestige|E]。\n\n#weak 后座议员不喜欢较高等级的 $game_concept_church_authority$，而降低它是 [Concept( 'liberty_faction', 'Liberty Factions' )|E] 的主要目标。#!"
 game_concept_claimant_desc: "$game_concept_claimant$是指拥有一个或多个[claims|E]可被 [titles|E] 的人。[ruler|E] 宣称者可以通过宣称[casus_belli|E]来宣布[wars|E]。\n\n这个 Casus Belli 也可以用来按[vassals|E]甚至[unlanded|E]你[realm|E]中角色的宣称。\n\nlaimants 也可以领导[factions|E]——即使他们不在你的队伍中。"
 game_concept_claimant_faction_desc: "$game_concept_claimant_faction$ 试图将特定的 [claimant|E] 安置在其 [liege|E] 所持有的 [title|E] 王位上。如果成功，党领袖将不得不将头衔交给申索者，并相应更新 [vassal|E] 结构。所有 [faction|E] 成员都将对申索者获得 [hook|E]。"
 game_concept_clan_desc: "部族是一个 [government_form|E]，其中 [vassals|E] 给 [liege|E] 的 [levies|E] 和 [taxes|E] 数量取决于该党领导人 [tax_collector|E] 的 [aptitude|E]。部族还利用 [house_unity|E]。"
 game_concept_clergy: "党官员"
 game_concept_clergy_desc: "[court_chaplains|E]、[realm_priests|E]、[theocratic|E] 统治者，以及任何拥有 [GetTrait('devoted').GetName( GetNullCharacter )] 特质的人都被视为党务官员成员。\n\n [doctrines|E] 的 [faith|E] 决定谁可以成为党务官员成员，以及党务官员成员是否可以结婚、继承土地等。"
 game_concept_clergy_opinion: "党官员的意见"
 game_concept_clerical_puppet: "党牧师傀儡"
 game_concept_clerical_puppets: "党牧师傀儡们"
 game_concept_clerical_region_desc: "一块教区区域是属于 [clerical_title|E] 管辖的地理区域。该区域内的任何政党官员都将对与该区域相关的 [title|E] 的持有者成为 [subordinate|E]。\n\nA [ruler|E] 属于含有其 [capital|E] [county|E] 的教区区域，而一个新区域则建立在其创始人 [primary_title|E] 的 [capital|E] 上。该区域可能覆盖多个 [realms|E]，并拥有属于不同政党的下属。\n\nA $game_concept_ruler$ 每次只能持有一个 $game_concept_clerical_region$。如果授予新区域，统治者将放弃他们在前一区域内持有的所有土地。"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$ 是 [ecclesiastical|E] [title|E] 的 [clergy|E]，管理 [clerical_region|E] 内的 [faith|E]。在 [christian|E] 意识形态中，这是一个 [archdiocese|E]。\n\n持有者是该地区 [clergy|E] 的 [religious_superior|E]，通常由 [head_of_faith|E] 任命。"
 game_concept_commander_trait_desc: "$game_concept_commander_traits$是特殊的[traits|E]，作为[army|E] [commanders|E]角色时能获得有用的天赋。\n\nommander 特质通常由使用安全[education_focus|E]抚养的孩子获得，但也可以通过[martial_lifestyle|E]及其他方式获得。"
 game_concept_complete_control_desc: "当目标头衔的所有后座议员[de_jure|E] [titles|E]由[ruler|E]或其[vassals|E]持有，且其选区未被敌对[armies|E] [occupied|E]控制时，即满足此条件。"
 game_concept_complete_control_region_desc: "当目标[region|E]的所有[counties|E]均由统治者或其[vassals|E]控制，且其选区无被敌对军队占领时，即满足此条件。"
 game_concept_confederation_desc: "一种关系，将 [tribal|E] 或 [nomadic|E] [rulers|E] 绑定在互相防卫中，类似于一个 [alliance|E]。通过 #high $call_for_confederation_decision$#! [decision|E] 形成，联盟要求其成员加入彼此的防御 [wars|E]。联盟在魅力标签中可见。\n\n 同伴 [confederates|E] 也可能不会互相攻击或 [raid|E]。它们被限制在高等级的 [tribal_authority|E] 和 [nomadic_authority|E]，并且不能创建新的 [titles|E]。\n\n[confederates|E] 可以使用 #high $leave_confederation_decision$#! [decision|E] 或 [migrate|E] 成为 [independent|E]。如果一个联盟只剩下一个成员，它将被销毁。"
 game_concept_contestant_desc: "为了参加 [GetActivityType( 'activity_tournament' ).GetName] [contests|E]，您必须满足其要求。桌面游戏允许所有角色参赛，而其他项目，如摔跤，则取决于安全规则。\n\n不参赛的角色将被 [spectators|E]，而潜在的 [contestants|E] 如果希望观赛，可选择不参加。\n\n参加比赛的资格由性别和健康状况决定，基于主持人的 [culture|E] 和 [religion|E]。"
 game_concept_convert_county_desc: "A [councillor_task|E] performed by the [court_chaplain|E] which targets a [county|E] of a different [faith|E] — or one of the same Ideology but a different [rite|E] — than the [liege|E].\nProgress increases each month, and at 100% the majority of the Target Constituency adopts the Leader of the House's Ideology. The new [rite|E] follows the [liege|E] whenever the resulting Ideology matches the Party Leader's — otherwise it is the Chaplain's own Ideology.\n\nConversion speed is affected by many factors, including the [councillor|E]'s [learning_skill|E] and the [fervor|E] of the involved Ideologies. A Chaplain whose [rite|E] differs from the [liege|E]'s converts more slowly.\nOn a [rite|E]-only shift, [fervor|E] favours the mainline Ideology above #V 50%#! and non-mainline (including breakaway) Ideologies below it."
 game_concept_convince_dejure_desc: "A [councillor_task|E] performed by the [steward|E]. It targets a [de_jure|E] [county|E] of the minister's [liege|E] that is owned by an [independent|E] [ruler|E]. When the constituency is persuaded, they will ask their [ruler|E] to release them to their [de_jure|E] [liege|E]."
 game_concept_coronation_anointment_desc: "膏是[coronation|E]的一种，[ruler|E]会主动寻求[head_of_faith|E]，或者在没有[head_of_rite|E]时党内官员，祈福他们登基。在某些意识形态中，这对被视为真正统治其土地的[legitimate|E]统治者是必要的。\n\n为了获得该权威的支持，[host|E]可以使用[anointment_request|E] [interaction|E]。"
 game_concept_council: "内阁"
 game_concept_council_desc: "$game_concept_council$ 是领导者的 [councillors|E] 的顶尖团队，每个人都管理一个部门。他们可以被赋予重要的 [councillor_tasks|E]。"
 game_concept_councillor: "部长"
 game_concept_councillor_desc: "大臣是任何[ruler|E]的主要助理，并组成[council|E]。内阁中有六个职位：[chancellor|E]，[marshal|E]，[steward|E]，[spymaster|E]，[court_chaplain|E]（或[realm_priest|E]），最后是你的[spouse|E]。\n\n每个大臣负责一个部门，该部门可以被分配不同的[councillor_tasks|E]去执行。\n\n[powerful_vassals|E]如果没有被任命到这些职位之一，会感到不满，这意味着你经常需要在安抚一个强大的后座议员或任命一个实际上有能力的人之间做出选择。\n\n担任你的[liege|E]的大臣会给你一个奖励，该奖励会随着党首的[rank|E]增加而增加。"
 game_concept_councillor_task: "部长任务"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ 是可以分配给你的 [councillors|E] 的重要任务。这些任务可以是一般性的，也可以特别针对 [county|E] 或 [court|E]。\n\n如果你有 [relation|E] 拥有部长，带完成时间的任务可能需要更多或更少的时间。\n\n#weak 注意部长不会实际执行这些任务，仅仅负责领导工作。#!"
 game_concept_councillor_task_possible_side_effects_desc: "[councillor_task|E] 随时间可能产生意想不到的后果。这些后果可能是好的或坏的，正面效果更可能出现在部长相关 [skill|E] 较高时，而负面效果更可能出现在相关技能较低时。"
 game_concept_councillor_tasks: "部长任务"
 game_concept_councillors: "部长"
 game_concept_counties: "选区"
 game_concept_county: "选区"
 game_concept_county_capital: "选区首府"
 game_concept_county_capital_desc: "$game_concept_county_capital$是[county|E]的主要主体[holding|E]。该控股权永远无法被摧毁或[leased|E]，始终归持有选区[title|E]的[ruler|E]所有。\n\n选区首府允许建造一个额外的[building|E]，相较于较小的控股区。"
 game_concept_county_capitals: "选区首府"
 game_concept_county_control: "选区控制"
 game_concept_county_control_desc: "$game_concept_county_control$ 衡量政府对 [county|E] 人口的控制。这在收集来自 [holdings|E] 的 [taxes|E] 时尤其重要.\n\n当选区通过 [war|E] 易手时，控制力会急剧下降，这也是改为附庸化当前 [holder|E] 的一个好理由（如果 [casus_belli|E] 允许的话）。选区控制力也可能受到 [sieges|E] 和 [Concept( 'peasant_faction', 'Peasant Uprisings' )|E] 的损害。\n\n控制力低可能导致 [county_corruption|E]，而增加控制力的主要方法是让 [councillor_task|E] 对你的 [marshal|E] 可用。"
 game_concept_county_corruption: "选区腐败"
 game_concept_county_corruption_desc: "当 [county|E] 的 [control|E] 低或其 [holder|E] 处于 [debt|E] 时，选区可能获得 $game_concept_county_corruption$。这些是各种类型的负面 [county_modifiers|E]。\n\n$game_concept_county_corruption$ 会随着时间消退，但如果根本原因仍存在（[debt|E] 或 [control|E] 低），则可能再次出现。\n\n $councillor_marshal$ 的 $task_increase_control$ $game_concept_councillor_task$ 可能会更快清除 $game_concept_county_corruption$。"
 game_concept_county_fertility: "选区生育率"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$存在于[the_great_steppe|E]内的[counties|E]，[GetGovernment( 'nomad_government' ).GetName] [rulers|E]可以放牧以增加[herd|E]。\n\nA选区的肥沃度代表其牧场的质量。\n\n在[fertility_equilibrium|E]周围稳定稳定，使拥有大范围[domain_limit|E]的游牧统治者能够维持其畜群增长。肥沃度受此影响，[steppe_seasons|E]影响，并由[herders|E]缓慢补充。\n\n当[realm|E]生育率低时，是[migrate|E]的信号。\n\n[county_control|E]会使生育率增长速度减缓，比例等于当前对照组。"
 game_concept_county_modifier: "选区修饰符"
 game_concept_county_modifiers: "选区修饰语"
 game_concept_county_opinion_desc: "每个[county|E]的普通民众都有[opinion|E]的[character|E]掌握他们的$game_concept_county$。如果人口不满，他们可能会发起或加入[peasant_faction|E]或[popular_faction|E]，这两者都可能很快蔓延到整个[realm|E]。\n\n 控制$game_concept_county_opinion$的最简单方法是确保$game_concept_county$ [holder|E]与人口的[culture|E]和[faith|E]相同。\n\n$game_concept_county_opinion$ 防止不同[faith|E]的情况由选区的[faith_hostility|E]及其[fervor|E]共同修改，在0到100 $game_concept_fervor$之间线性调整。"
 game_concept_court: "办公室"
 game_concept_court_amenities: "办公设施"
 game_concept_court_amenity: "办公设施"
 game_concept_court_artifact: "办公艺术品"
 game_concept_court_artifact_desc: "办公文物是一种[artifact|E]，展示在[ruler|E]的[royal_court|E]中，例如挂毯或精美插图的书籍。\n\n办公文物是决定私人办公室[court_grandeur|E]的一个因素。\n\n角色可以拥有任意数量的文物，但只有展示在其类型对应位置的文物才会产生效果。\n\n您可以从[inspired|E] [characters|E]、通过委任文物决策，或者选择[reforge|E] [inventory_artifact|E]来创建新的办公文物。"
 game_concept_court_artifacts: "办公艺术品"
 game_concept_court_chaplain: "下议院领袖"
 game_concept_court_chaplain_desc: "$game_concept_court_chaplain$ 是负责 [faiths|E] 宗教和精神事务的 [councillor|E]，具有 [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E].\n\n 在 [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] 政策立场下的意识形态拥有更强大（且更麻烦）的 [realm_priest|E]，而不是 $game_concept_court_chaplain$。"
 game_concept_court_chaplain_possessive: "下议院领袖的"
 game_concept_court_chaplains: "下议院党团领袖"
 game_concept_court_chaplains_possessive: "下议院党团领袖的"
 game_concept_court_desc: "每个政治家都有$game_concept_court$：为他们工作的[unlanded|E]人。\n\n这些[courtiers|E]是他们的家人、顾问、研究人员和跟班。"
 game_concept_court_event: "办公活动"
 game_concept_court_events: "办公活动"
 game_concept_court_grandeur: "办公宏伟"
 game_concept_court_grandeur_desc: "[royal_court|E]的$game_concept_court_grandeur_value$显示了该职务的声望，并随着增加解锁新的[court_grandeur_levels|E]。\n\n数值范围从0到100，随着时间推移将稳定在基线值。基线受[dynasty_perks|E]、你在[court_amenities|E]上的支出以及是否拥有任何宏伟的[court_artifacts|E]等因素影响。\n\n在[succession|E]时会损失一部分威望。"
 game_concept_court_grandeur_expectation: "办公宏伟预期"
 game_concept_court_grandeur_expectations: "办公宏伟预期"
 game_concept_court_grandeur_level: "办公宏伟等级"
 game_concept_court_grandeur_level_desc: "一个 [royal_court|E] 的宏伟等级会给予其所有者奖励，并会随着办公室的 [court_grandeur_value|E] 增加而解锁。\n\n 除了每个等级的效果外，大型 [realms|E] 预计已经达到了更高的宏伟等级。这被称为 [court_grandeur_expectations|E]。"
 game_concept_court_grandeur_levels: "办公宏伟等级"
 game_concept_court_grandeur_value: "办公宏伟价值"
 game_concept_court_guest: "办公宾客"
 game_concept_court_host: "办公主人"
 game_concept_court_host_desc: "$game_concept_court_host$是指一个角色不是队伍领袖，但仍在[court]中的一个[ruler|E]。\n\n这种情况可能有几种原因，比如[wanderers|E]拜访统治者，或者[wards|E]与[guardian|E]在同一办公室。"
 game_concept_court_language: "办公语言"
 game_concept_court_language_desc: "办公语言是[royal_court|E]的官方[language|E]，由贵族使用并被官僚体系采用。\n\n每个[realm|E] [county|E]使用该语言、每个使用相同办公语言的私人办公室，以及如果它是[ruler|E]的母语，则[court_grandeur|E]基线值会增加。"
 game_concept_court_languages: "办公语言"
 game_concept_court_position: "任命"
 game_concept_court_position_task: "任命任务"
 game_concept_court_position_tasks: "任命任务"
 game_concept_court_positions: "任职"
 game_concept_court_type: "办公类型"
 game_concept_court_type_desc: "作为其[royal_court|E]的一部分，[rulers|E]可以拥有指定的$game_concept_court_type$。\n\n 每个$game_concept_court_type$根据[court_grandeur_level|E]为统治者和[court|E]提供自己的加成。 \n\n 统治者的[culture|E]的[ethos|E]决定他们可以拥有的职务类型。\n\n 不同的职务类型为：\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "办公类型特性"
 game_concept_court_type_trait_desc: "在[EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0]年在[royal_court|E]服役后，[courtier|E]获得了[trait|E]，以反映该法院的[court_type|E]。\n\n这种特质的质量取决于[character|E]在办公室担任职员的时间长度。"
 game_concept_court_types: "办公类型"
 game_concept_courtier: "员工"
 game_concept_courtier_desc: "$game_concept_courtier$ 是 [unlanded|E] 的角色，为其 [court|E] 中的 [ruler|E] 服务。\n\n工作人员可以：\n$BULLET_WITH_TAB$担任 [councillors|E]\n$BULLET_WITH_TAB$职位 在 [court_positions|E]\n$BULLET_WITH_TAB$担任 [armies|E] 中的 [commanders|E] 或 [knights|E]\n$BULLET_WITH_TAB$如果获得 [title|E]，可成为其统治者的 [vassal|E]\n$BULLET_WITH_TAB$允许其统治者在 [war|E] 中盖上其 [claims|E]\n\n#WEAK [adventurers|E] 拥有 [followers|E] 而不是 $game_concept_courtiers$ — 它们承担相同角色，但通常更脏、更泥泞。#!"
 game_concept_courtiers: "员工"
 game_concept_courts: "办公室"
 game_concept_criminal_task_contract_desc: "A $game_concept_criminal_task_contract$ 通常涉及肮脏的合同，可能有利可图，但会授予你 @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\n提升 $trait_gallowsbait$ [trait|E] 会让大部分人更讨厌你，对你的尊重也会减少，并最终导致 [followers|E] 中不赞同你掠夺行为的人戏剧性地离开你的雇佣。\n\n#WEAK $trait_gallowsbait$ 是一个高度负面的 $game_concept_trait$，意味着某个角色是最低级别的小罪犯——至少办公室里的谋杀还有某种 #EMP 等级#!。\n\n它可以通过 [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E] 被彻底清除。#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ 代表 [ruler|E] 对其 [vassals|E] 所施加的一般权力。\n\n $game_concept_crown_authority$ 有四个等级：[autonomous_vassals|E]、[limited|E]、[high|E] 和 [absolute|E]。提升 $game_concept_crown_authority$ 需要一定数量的 [prestige|E]，具体取决于等级和统治者的 [learning_skill|E]。\n\n#weak 后座议员不喜欢更高等级的 $game_concept_crown_authority$，降低它是 [Concept( 'liberty_faction', 'Liberty Factions' )|E] 的主要目标。#!"
 game_concept_culture_head_desc: "'$game_concept_culture_head$' 是对自己 [culture|E] 拥有最大影响力的 [ruler|E]。\n\n具体而言，总数最多同文化 [counties|E] 的统治者将在其 [realm|E] 内成为 $game_concept_cultural_head$，无论其 [domain|E] 位于何处或可能拥有其他文化选区。 [AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\n$game_concept_cultural_head$ 可以通过设置 [cultural_fascination|E] 来影响哪些 [innovation|E] 应该优先被发现。\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "[title|E] 的 [de_jure|E] [liege|E] 可以改变的缓慢过程。当 [duchy|E] 或 [kingdom|E] 完全被一个不持有该领土法定党领导称号的 [ruler|E] 控制时，自然发生。\n\n 通过将你的 [chancellor|E] 分配给适当的 [councillor_task|E] #weak ($task_integrate_title$)#!，可以加快此过程。地区只能 $game_concept_de_jure_drift$ 成为国家，国家只能漂移为 [empires|E]。\n\n 让头衔法定漂移到你的 [primary_title|E] 是摆脱 [rightful_liege|E] 惩罚的好方法。"
 game_concept_de_jure_drift_desc_part_2: "#weak 示例: $d_northumberland$ 地区在法理上属于 $k_england$，但该地区领土完全位于 $k_scotland$ 内。由于 $k_scotland$ 国王不同时持有 $k_england$，该地区将开始 $game_concept_de_jure_drift$ 以成为 $k_scotland$ 的一部分。#!"
 game_concept_death_religion: "政治阵营"
 game_concept_death_religion_desc: "被对手带入下一个世界，以及对你凡人之躯的亵渎性处置——殉难、十字架刑——始终忠于你的理念至最后，还有比这更真实的传承方式吗？"
 game_concept_debt_desc: "债务是指负[gold_i][gold|E]状态。这通常发生在战争[ruler|E]雇佣[mercenaries|E]却没有足够资金覆盖全部费用，或者战争时间过长。\n\n债务期间不能宣布新[wars|E]，[men_at_arms|E]不会增援，敌人在战斗中会对你有优势[advantage|E]。债务越深，惩罚越多——[levies|E]减少，[county_opinion|E]减少，[vassals|E]对你不喜欢。\n\n除此之外，还可能发生一些其他轻微的不稳定事件，比如[domain|E] [counties|E] [county_corruption|E]。\n\n#help 通常建议在敌人负债时攻击他们，因为他们战斗时会减少[advantage|E]！#!"
 game_concept_demand_conversion_desc: "[rulers|E] 若其拥有另一 [faith|E] 的子民，可以通过要求转换来将其子民的意识形态更改为自身的意识形态。统治者的 [learning|E] 技能以及子民对其政党领导者的 [opinion|E] 是决定子民是否接受该要求或拒绝 [Concept('refuse_conversion_crime','refuses')|E] 的主要因素。"
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$决定了[diarch|E]实现其[liege|E]设定的每个 [mandate|E] 的表现。\n\noth [skills|E] 和 [personality_traits|E] 起着作用。例如，负责“$fill_coffers_mandate$”授权的[GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$可能不会向党魁发送那么多[gold|E]。\n\n#WEAK [diarchs|E]在拥有约40+的$game_concept_aptitude$时，非常适合一个$game_concept_mandate$。#!"
 game_concept_diarch_power_desc: "活跃[power_sharing|E]中的[diarch|E]拥有特殊$game_concept_diarch_powers$。\n\nZ这些是模仿其[liege|E]拥有的特殊[character_interaction|E]s，或是其他滥用权力的行为。例如来自同[vassals|E] [revoking|E] [titles|E]，或从党魁那里抽取[gold|E]。\n\n任何给党魁机会[veto|E]他们的机会$game_concept_diarch_powers$。"
 game_concept_diplomacy: "魅力"
 game_concept_diplomacy_lifestyle: "魅力生活方式"
 game_concept_diplomacy_skill: "魅力技能"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ 是用于魅力、说服力和促成交易的 [skill|E]：在房间里活跃，赢得同事的支持，并促成交易的达成。\n\n它直接影响其他角色对你的 [opinions|E]，并推进魅力 [schemes|E]。\n\n相应的 [lifestyle|E] 是 [diplomacy_lifestyle|E]。"
 game_concept_diplomacy_task_contract: "魅力合约"
 game_concept_diplomacy_task_contract_possessive: "魅力合约"
 game_concept_diplomacy_task_contracts: "魅力合约"
 game_concept_diplomacy_task_contracts_possessive: "魅力合同"
 game_concept_direct_vassal: "直接后座议员"
 game_concept_direct_vassals: "直接后座议员们"
 game_concept_directed_great_holy_war_desc: "$game_concept_directed_great_holy_war$ 由 $doctrine_temporal_head_name$ [head_of_faith|E] 宣布，目的是将 [kingdom|E] 纳入其统治范围。\n\n[rulers|E] 其 [faith|E] 可能会选择协助运动领导者，并可能因此获得奖励。奖励包括 [piety|E]，并可能使他们的 [dynasty|E] 成为被征服国家的 [landed|E]。\n\n目标 [religion|E] 的统治者可能会选择在无需 [alliance|E] 的情况下防御这场战争。"
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ 是 [tribal_authority|E] 的最低级别。在这个级别，[vassals|E] 对其 [liege|E] 没有 [opinion|E] 惩罚，党派领导者对他们除了能够要求 [levies|E] 和 [taxes|E] 外，没有其他权力。"
 game_concept_dissolution_faction_desc: "[dissolution_faction|E] 试图摧毁他们 [liege|E] 的 [realm|E]。如果他们成功，党内所有的后座议员将变为 [independent|E]，而他们的党领袖将失去 [primary_title|E]。"
 game_concept_doctrine: "政策立场"
 game_concept_doctrine_knowledge: "政策立场知识"
 game_concept_doctrines: "政策立场"
 game_concept_doctrines_desc: "政策立场代表了 [faith|E] 的主张：税收和支出、所有权、移民、欧洲、联盟和公民自由。与议员政策立场冲突的法案更有可能引发叛乱。"
 game_concept_domain: "投资组合"
 game_concept_domain_desc: "一位政治家的$game_concept_domain$就是他们个人拥有的一切：他们的席位及其辖区。\n\n该[domain_limit|E]意味着领导者必须依赖[vassals|E]来领导超过少数几个席位。"
 game_concept_domain_fertility: "投资组合收益率"
 game_concept_domain_fertility_desc: "投资组合收益率是你持有的所有[counties|E]的总[county_fertility|E]。"
 game_concept_domain_income: "投资组合收入"
 game_concept_domain_limit: "投资组合上限"
 game_concept_domain_size: "投资组合规模"
 game_concept_domain_taxes: "投资组合税收"
 game_concept_domains: "投资组合（复数）"
 game_concept_dominant_family_desc: "A $game_concept_dominant_family$ 是一个 [powerful_family|E]，他们的控制力已经扩展得非常广泛。他们被认为是 [realm|E] 内最有影响力的 [house|E]。\n\n 一个 $game_concept_dominant_family$ 的成员在 [political_schemes|E] 上甚至更擅长，并且在与其他 [characters|E] [interacting|E] 时更有可能得到他们想要的东西。\n\n 一个 $game_concept_house$ 必须至少控制 [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] 的党派才能成为主导者。"
 game_concept_dread: "影响力"
 game_concept_dread_desc: "$game_concept_dread$ 是指 [ruler|E] 被恐惧的程度：能够毫不犹豫开除部长的领袖，从不忘记叛乱的党鞭。\n\n 政治家通过残酷行为获得 $game_concept_dread$：解雇、清洗以及树立叛逆者或 [prisoners|E] 的警示。\n\n 权势使得像 [tyrant|E] 一样领导成为可能，因为不守规矩的 [vassals|E] 可能成为 [intimidated|E] 或 [cowed|E]，从而使他们害怕反对你。\n\n 角色的权势值可从 0 到 100，除了 [nomads|E]，可以达到 150。随着时间推移，他们的权势值会趋向于他们的自然权势值，该值由他们的 [personality_traits|E] 决定。\n\n#high 一个强大的 [ruler] 可以获得以下好处：#!\n$BULLET_WITH_TAB$[vassals] 不鼓励加入 [factions|E]\n$BULLET_WITH_TAB$[vassals] 不鼓励 [scheming|E]\n$BULLET_WITH_TAB$ 提高 [vassal] 接受 #weak 的概率（例如：撤销头衔）#!\n$BULLET_WITH_TAB$ 提高 [offer_vassalization|E] 接受度\n$BULLET_WITH_TAB$ 增加 [electors|E] 按照你投票的可能性\n$BULLET_WITH_TAB$ 使后座议员不太可能反对 [law|E] 的变动\n\n#weak 注意，勇敢和大胆的 [vassals] 受权势影响较小！#!"
 game_concept_dreaded: "威严"
 game_concept_dreadful: "威严"
 game_concept_dreams_desc: "信奉占卜理念的角色偶尔会经历梦境。这些梦境可以由神秘者占卜，结果可能多样，既有好有坏。"
 game_concept_duchies: "区域"
 game_concept_duchy: "区域"
 game_concept_duchy_building: "区域建筑"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ 是只能在 [de_jure_capital|E] 的 [duchy|E] 中建造的强大 [buildings|E]。每个区域只能建造一种类型。\n\n$game_concept_duchy_buildings$ 仅当拥有者也持有关联的区域 [title|E] 时才会激活。\n\n许多 $game_concept_duchy_buildings$ 拥有影响该区域所有 [holdings|E] 的修正，使其成为专门化 [domain|E] 的强大工具。"
 game_concept_duchy_buildings: "区域建筑物"
 game_concept_duchy_desc: "一个 $game_concept_duchy$ 是一个 [title|E]，位于 [title_tier|E] 下面 [kingdom|E]，以及 [county|E] 之上的一个。\n\n一个 [holder|E] 的 $game_concept_duchy$ 拥有其组成 $game_concept_counties$ 的 [de_jure|E] 权利，并且可以有 [counts|E] 作为 [vassals|E]。\n\n区域可能处于休眠状态，没有当前持有者。这类 $game_concept_title_succession$ 可以由控制其至少一半 $game_concept_counties$ 的 [ruler|E] 创建。"
 game_concept_dynasty_perks: "党的遗产"
 game_concept_dynasty_prestige: "党品牌"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$ 是党派整体的声望：选民认为其名称代表的意义，以及为成员打开的门。\n\nA [dynasty|E] 从其在世成员、担任公职的成员以及与其他公职成员结婚的成员那里获得 $game_concept_dynasty_prestige$。\n\n 它计入党派的 [dynasty_prestige_level|E]，党派领导可以将其用于 [dynasty_perks|E]。"
 game_concept_dynasty_prestige_level: "党品牌等级"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\n这是最高的党派品牌等级。"
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ 是衡量 [dynasty|E] 知名度的标准。每当你的王朝获得 [dynasty_prestige|E] 时，等级会提升。角色在出生时根据他们的 $game_concept_dynasty_prestige_level$ 获得一定数量的初始 [prestige|E]。同样，[spouses|E] 在 [marry|E] 时会从彼此的王朝获得一些声望。\n\n 等级如下：\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[interaction|E] 通过 [ecclesiastical|E] [rulers|E] 使同一 [faith|E] 的世俗统治者对敌对意识形态的统治者宣布 [holy_war|E]。"
 game_concept_ecumenical_councils: "普世教会内阁"
 game_concept_eminent_holy_site: "显赫的心脏地带"
 game_concept_eminent_holy_site_desc: "一个$game_concept_eminent_holy_site$ 是对[holy_site|E] 高度重要的[faith|E]。每个意识形态只能指定少数$game_concept_holy_sites$为杰出。\n\n只有杰出的核心地区提供影响所有意识形态追随者的修正值。"
 game_concept_eminent_holy_sites: "显赫心脏地带"
 game_concept_empire: "英国"
 game_concept_empires: "工会"
 game_concept_enshrined_desc: "在 [holy_site|E] 中供奉的 [holy_relic|E] 会触发内陆奖励并提升其提供的奖励，奖励提升根据所有供奉的神器总 [rarity|E] 等级缩放.\n\n被供奉的神器不再属于某个角色，但可以由心地的 [holder|E]、[top_liege|E] 或 [clerical_region|E] 持有者进行互动。神器将不再衰减。你只能为自己的 [faith|E] 供奉神圣遗物；其他意识形态的供奉神圣遗物将不会提供任何收益.\n\n供奉或移除供奉的神器可能会产生奖励或成本。"
 game_concept_entrenched_regency_desc: "如果[regency|E]持续时间过长，可能会变得固守，[regent|E]比[liege|E]更强大。\n\n [regent|E]从[scales_of_power|E]中获得的好处会变得更强大。\n\n要结束$game_concept_entrenched_regency$，摄政王必须接受党魁的礼物，或者党魁必须倾向于自己。"
 game_concept_escalated_peasant_factions: "升级的抗议运动们"
 game_concept_expected_legitimacy: "预期任期"
 game_concept_expected_legitimacy_desc: "[vassals|E] 对其 [ruler|E] 的 [legitimacy_level|E] 预期，是基于他们的历史关系。一些降低预期的因素包括：\n$BULLET_WITH_TAB$ 是后座议员的 [de_jure|E] [liege|E]\n$BULLET_WITH_TAB$ 属于后座议员的 [close_family|E]\n$BULLET_WITH_TAB$ 是后座议员的 [preferred_heir|E]\n$BULLET_WITH_TAB$ 与后座议员曾服务超过 #color_white 50#! 年的相同 [dynasty|E]\n$BULLET_WITH_TAB$ 后座议员不是 [powerful_vassal|E]\n\n 如果实际等级低于他们的预期，他们可能会变得不守规矩：他们的 [opinion|E] 会降低，并且他们可能加入 [factions|E] 对抗他们的 [liege|E].\n\n 预期会随着其 [primary_title|E] 的等级以及 [era|E] 的增加而提高。"
 game_concept_external_clerical_puppet_desc: "[clergy|E]中一个强大的成员——一个[archbishop|E]甚至[head_of_faith|E]——已成为另一个[ruler|E]的[puppet|E]。\n\n牧师越强大，影响力越大：受操控的运动领袖可以[excommunicate|E]你的敌人，任命[cardinals|E]，授予[pressed_claim|E]，或代表你煽动[holy_war|E]。"
 game_concept_faction_desc: "$game_concept_faction$是一群有共同政治利益的[vassals|E]。当地[counties|E]居民也可以加入某些类型的派系，如抗议运动。\n\nF派系一旦[faction_discontent|E]达到一定程度，将变得危险，届时将发出最后通牒。\n\n如果[liege|E]不服从，派系将发动叛乱，引发[civil_war|E]。如果派系在战争结束前解散，党魁必须至少有足够的[GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E]才能赢得战争。"
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$ 是衡量 [faction|E] 相对于其目标的总体军事力量的指标。\n\n 每个派系成员在留在派系中时，其全部力量都会计入派系。如果派系的目标是某个成员的 [liege|E]，该成员的力量也会从党派领导的相对力量中扣除。"
 game_concept_faith: "意识形态"
 game_concept_faith_astray: "偏离的"
 game_concept_faith_astray_desc: "这个 [rite|E] 在你的政治阵营内或邻近阵营：首页你们在细节上存在分歧。\n\n#S 影响：\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "$game_concept_faith$ 是政治家的政治信条，位于更大的 [religion|E] 内。每个角色和 [county|E] 都有一个：选区的意识形态是其选民的倾向，并会向其议员的倾向靠拢。\n\n 一个意识形态的 [doctrines|E] 是其政策立场，其 [core_tenets|E] 是其标志性事业。其 [fervor|E] 表示激活者的热情程度。\n\n 不同意识形态的政治家之间互相喜欢得越少，他们阵营之间的差距越大。任何人都可以改变想法（决定“改变你的政治”），但需付出一定代价。"
 game_concept_faith_evil: "不可调和"
 game_concept_faith_evil_desc: "这个 [rite|E] 希望相反的宪政未来：民族主义者反对联合主义者。\n\n#S 影响：\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "反对"
 game_concept_faith_hostile_desc: "这个 [rite|E] 跨越主要政治分野，左翼对阵右翼。\n\n#S 影响：\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "意识形态距离"
 game_concept_faith_hostility_desc: "所有 [faiths|E] 之间的关系取决于他们政治立场的远近。\n\n相同或相邻的 [religion|E] 的意识形态在细节上存在分歧；左派与右派对立；民族主义者与联合主义者不可调和。\n\n存在以下关系： [faith_righteous|L]， [faith_astray|L]， [faith_hostile|L]， 和 [faith_evil|L]。"
 game_concept_faith_righteous: "志同道合"
 game_concept_faith_righteous_desc: "这个 [rite|E] 与你的政治立场相同。\n\n#S 影响：\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "意识形态的"
 game_concept_faiths: "意识形态"
 game_concept_feast_desc: "一个 [activity|E]，统治者和派对中的工作人员聚集庆祝……这事那事。\n\n参与者将失去 [stress|E] 并增加他们对主人的 [opinion|E]。将这么多人聚集在一起还可能产生其他许多后果。\n\n一位 [ruler|E] 会邀请他们的 [liege|E] 和他们的 [vassals|E]（以及各种 [courtiers|E]）参加一场 $activity_feast$。"
 game_concept_fervor: "定罪"
 game_concept_fervor_desc: "[faith|E]的$game_concept_fervor$范围从#V 0#!到#V 100%#!。它衡量了活动家和选民的热情：投票率、志愿者和噪音。\n\nHigh $game_concept_fervor$让意识形态的选区更关心议员的政治立场。"
 game_concept_feudal_desc: "在封建[government_form|E]下，一个[liege|E]将其[vassals|E] [land|E]用于治理，以换取[levies|E]和[taxes|E]，由不同的[vassal_contract|E]在后座议员和党魁之间进行调控。"
 game_concept_flowery_war_desc: "这是一种特殊类型的 [war|E]，由一个其 [faith|E] 实践人祭的 [ruler|E] 发起。$game_concept_flowery_warring$ 的主要目标是战斗并捕获 [prisoners|E] 以进行祭祀，任何一方都可以通过战斗获得足够的 [war_score|E] 而获胜，而无需 [siege|E]。\n\n 在 $game_concept_war$ 结束时，如果胜利者（包括防守方）遵循一个实践人祭的 $game_concept_faith$，那么他们将从失败者的 [court|E] 中取得若干 $game_concept_prisoners$。如果 $game_concept_flowery_war$ 中的两个主要作战方都遵循相同的意识形态，那么战争被视为神圣的，这意味着即使失败者败北，也仍然会获得（减少的）[piety|E]。\n\n 如果你在 [dungeon|E] 中通过赢得 $game_concept_flowery_war$ 获得了任何 $game_concept_prisoners$，你将无法进行或继续 $game_concept_flowery_war$。"
 game_concept_foreign_affairs_desc: "由 [councillor_task|E] 执行的 [chancellor|E].\n 对于 [independent|E] [ruler|E]，它会提高其他独立统治者对他们的好感度。对于一个后座议员，它会提高同一个 [liege|E] 的其他后座议员对他们的好感度。"
 game_concept_fp3_demand_submission_interaction_desc: "通过使用政治资本、狡诈或威胁，要求[character_possessive|E]以[hook|E]的形式表现忠诚。"
 game_concept_gender_doctrines: "性别政策立场"
 game_concept_gender_doctrines_desc: "这些 [doctrines|E] 决定了 [faith|E] 角色可以使用哪些 [gender_laws|E]。\n\n 它还决定某些附加规则，例如哪些 [claims|E] 可以继承，谁可以成为 [commanders|E] 和 [knights|E]，以及一个 [bastard|E] 将属于他们父母的哪些 [house|E]。\n\n 性别政策立场包括：\n$BULLET_WITH_TAB$ 男性主导 \n$BULLET_WITH_TAB$ 平等 \n$BULLET_WITH_TAB$ 女性主导"
 game_concept_gift_desc: "送礼物给另一个角色会增加他们对你的[opinion|E]，以换取[gold|E][gold_i].\n\n收礼越贪婪，你需要送出的资金就越多，你获得的好感也会越高。\n\n你[diplomacy|E]越高，你获得的好感也会越多。"
 game_concept_glory_desc: "一个[accolade_possessive|E] 荣誉增加其[accolade_rank|E].\n\n荣誉通过[acclaimed_knight|E] 获胜[battles|E]、击败战士、参加[GetActivityType( 'activity_tournament' ).GetName] [contests|E]比赛以及出席[activities|E]获得。\n\n然而，当明星组织者参与失败的战斗时，其荣耀会降低，并且如果明星组织者在战斗、决斗或其他荣耀方式中没有死亡，荣耀也可能会在[accolade_succession|E]减少。"
 game_concept_gold: "资金"
 game_concept_gold_desc: "资金是政治家的钱：捐款、会员费和竞选战斗基金。它们用于支付员工、办公室、传单和活动。"
 game_concept_goliardic_shenanigans_desc: "[GetActivityType('activity_adult_education').GetName]中的角色在享受学生生活时可能会搞出各种恶作剧。他们冒险的后果不可预测，包括[skill|E]点数、生活方式和压力[traits|E]、生活方式经验、疾病和伤痕。"
 game_concept_government_authority_desc: "$game_concept_government_authority$ 代表 [ruler|E] 对其 [vassals|E] 所施加的一般权力。\n\n 不同的 [governments|E] 拥有不同形式的 $game_concept_government_authority$。例如，[feudal|E] [realms|E] 使用 [crown_authority|E]，[clans|E] 使用 [tribal_authority|E]，[administrative|E] 使用 [imperial_bureaucracy|E]。提升 $game_concept_government_authority$ 需要一定数量的 [prestige|E]，具体取决于等级和统治者的 [learning_skill|E]。\n\n#weak 后座议员不喜欢更高等级的 $game_concept_government_authority$，降低它是 [Concept( 'liberty_faction', 'Liberty Factions' )|E] 的主要目标。#!\n\n 并非所有 [governments|E] 都有 $game_concept_government_authority$。"
 game_concept_governor_desc: "$game_concept_governor$ 是具有 [government_bureaucratic_gov|E] 的 [liege|E] 的主要后座议员。他们由党派领导任命，负责管理 [realm|E] 内的领地，并利用他们的 [governor_efficiency|E].\n\nA $game_concept_governor$ 的 [title|E]，以及其包含的 [counties|E]，被称为 [province|E]。[governance_issues|E] 可能出现在省内，$game_concept_governor$ 必须解决。\n\n$game_concept_governors$ 可以积累 [influence|E] 并操控其他 $game_concept_governorships$ 的 [succession|E]。"
 game_concept_great_holy_war_desc: "一个 $game_concept_great_holy_war$ 是一种特殊类型的 [war|E]，只有某些 [faiths|E] 的 [head_of_faith|E] 才能宣告，其目标是将整个 [kingdom|E] 纳入其意识形态的统治之下。\n\n$game_concept_great_holy_wars$ 以选择的 [kingdom|E] 为目标攻击另一个 [religion|E] 的所有 [rulers|E]，迫使他们一起防御。如果获胜，目标国家内的所有 [titles|E] 将被夺取并在攻击者之间分配。\n\n根据其 [doctrines|E]，意识形态可能拥有访问 [directed_great_holy_wars|E]、[undirected_great_holy_wars|E] 或根本没有 $game_concept_great_holy_wars$ 的权限：\n$EFFECT_LIST_BULLET$访问大圣战通常需要 [GetTenetType('tenet_armed_pilgrimages').GetBaseName]、[GetTenetType('tenet_struggle_submission').GetBaseName] 或 [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E]\n$EFFECT_LIST_BULLET$只有拥有 [GetDoctrineType('doctrine_temporal_head').GetBaseName] 领导者的意识形态才能访问定向大圣战\n$EFFECT_LIST_BULLET$只有拥有 [GetDoctrineType('doctrine_spiritual_head').GetBaseName] 领导者的意识形态才能访问非定向大圣战\n$EFFECT_LIST_BULLET$没有运动领导人的意识形态不能宣告任何大圣战，即使它们通常有资格\n\n某些意识形态的大圣战有特殊名称，如“十字军东征”或“圣战”。这些大圣战仅在名称上不同，功能与其他大圣战相同。"
 game_concept_great_project_desc: "伟大工程是动用[realm|E]所有资源的庞大工程。\n\n有些伟大工程涉及建设[great_building|E]，另一些则涉及从[natural_disaster|E]中恢复。\n\n尽管党[ruler|E]监督伟大工程的发展，[subjects|E]可以提供[great_project_contributions|E]以协助其进展。"
 game_concept_head_of_faith: "运动领袖"
 game_concept_head_of_faith_desc: "$game_concept_head_of_faith$ 是 [faith|E] 的正式领导者。$game_concept_head_of_faith$ 的权力和性质取决于意识形态的 [doctrines|E].\n\n 一些意识形态有 [spiritual_head_of_faith|E] #weak（例如教皇）#!，一些有 [temporal_head_of_faith|E] #weak（例如哈里发）#!，还有一些根本没有 $game_concept_head_of_faith$。"
 game_concept_head_of_faith_possessive: "运动领袖的"
 game_concept_head_of_rite: "主要声音"
 game_concept_head_of_rite_desc: "[rite|E]的主导者[character|E]：领导其[counties|E]最多的政治家。"
 game_concept_heads_of_faith: "运动领袖们"
 game_concept_herder_desc: "牧民党派被剥夺了统治的所有方面。他们不指挥[armies|E]，不拥有[buildings|E]，不创建[alliances|E]，也不宣[wars|E]。当牧民[nomads|E] [migrate|E] [holding|E]时，他们会凭借较小的羊群慢慢补充当地[county_fertility|E]。\n\n他们害怕正当[nomad|E] [rulers|E]，一旦受到挑战就会立即交出土地。"
 game_concept_heresies: "分裂团体"
 game_concept_heresy: "分裂"
 game_concept_heresy_desc: "当一个 [faith|E] 的 [fervor|E] 极度下降时，可能会爆发分裂现象。分裂现象有三种愈加严重的形式：\n#indent_newline：7 $BULLET_WITH_TAB$现有的 [rite|E] 变得更加 [rite_divergent|E] 并向更远地区扩散。#!\n#indent_newline：7 $BULLET_WITH_TAB$出現一個顯著地 [rite_divergent|E] 新的 [rite|E]，並席捲各地。#!\n#indent_newline：7 $BULLET_WITH_TAB$ 对于基督教 [faiths|E]，出现像博戈米尔教或加泰派这样的历史性分裂。#!\n\n只有当 [mainline_rite|E] 至少达到 #V 100#! [counties|E] 时，一个 [faith|E] 才真正面临分裂风险。低于此值，更严重的两种形式完全无法爆发，即使是最轻微的情况也非常罕见。\n\n每一次分裂现象最终都会以 $game_concept_fervor$ 的统一性激增结束。"
 game_concept_heretical: "脱离"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ 是第二高的级别。[vassals|E] 对他们的 [liege|E] 有 #N -20#! [opinion|E] 的处罚。\n\n 在这个级别——除了党领袖在 [limited_crown_authority|E] 拥有的权力之外——同一党派领袖下的后座议员不再能互相战争，统治者可以在所有可用的 [succession_laws|E] 之间更换，并且后座议员的 [titles|E] 不能被党领袖的 [realm|E] 以外的统治者继承。\n\n 最后，即使党领袖缺乏足够理由，拒绝获得 [revocation|E] 称号或成为后座议员 [retraction|E] 也被视为 [crime|E]。"
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ 是 [nomadic_authority|E] 的中级水平。在这个级别，[migration|E] 可以针对 [the_great_steppe|E] 内的 [de_jure|E] [kingdom|E] [titles|E]，而党派领导者可以 [retract|E] [vassal|E] 的后座议员。"
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ 是 [tribal_authority|E] 的第二高级别。[vassals|E] 对他们的 [liege|E] 有 #N -20#! [opinion|E] 的处罚。\n\n 在这个级别，不仅可以 [imprison|E] [characters|E]，党领袖还可以 [revoke|E] [titles|E] 并 [retract|E] 一个后座议员的后座议员。"
 game_concept_hold_court_desc: "一个 [activity|E]，[vassals|E] 和 [courtiers|E] 在 [realm|E] 中聚集于 [royal_court|E]，以向他们的 [liege|E] 请愿并表达他们的不满。\n\n党首将被召唤裁决的情况可以从琐碎的争执和误解到全境性的灾难不等。大多数问题都会有一个有利的解决方案——即使对相关方不利，至少对党首有利。"
 game_concept_holder_desc: "[title|E]的$game_concept_holder$是拥有该头衔的角色。[barony|E]和[county|E]头衔一旦确定，$game_concept_holders$将永远存在，而[duchy|E]、[kingdom|E]和[empire|E]头衔可能尚未创建。此外，高级头衔的$game_concept_holder$可能实际上并不控制该头衔[de_jure|E]区域内的任何领土。\n\n持有更高级别的头衔允许你拥有更高级别的[vassals|E]。例如，公爵可以拥有伯爵作为后备成员，国王可以拥有公爵。"
 game_concept_holding_court: "举办手术"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$ 是对 [faith|E] 具有宗教意义的 [artifact|E]。$game_concept_holy_relic$ 可以在该意识形态的 [holy_site|E] 中被 [enshrined|E]，以获得好处。\n\n某些神器本身对某种意识形态是神圣的，但神器也可以被 [sanctified|E] 来成为圣物。"
 game_concept_holy_site: "关键地区"
 game_concept_holy_site_desc: "$game_concept_holy_site$ 是包含对 [faith|E] 有宗教意义的地方的 [county|E]。由具有正确意识形态的角色持有的 $game_concept_holy_sites$ 将为该意识形态的所有人提供效果，同时也可以允许创建 [special_buildings|E] 或 [holy_orders|E]。每个意识形态都有不同的 $game_concept_holy_sites$。\n\n 普通的 $game_concept_holy_site$ 不提供全球意识形态的好处，只提供局部好处。一个意识形态最受尊敬的地点则被指定为 [eminent_holy_sites|E]。每个意识形态只能拥有有限数量的每个 ZZKEEP。"
 game_concept_holy_sites: "关键地区"
 game_concept_holy_war_desc: "一个 $game_concept_holy_war$ 是由一个 [faith|E] 的 [ruler|E] 针对不同意识形态的统治者发起的 [war|E] 的特殊类型。\n\n$game_concept_holy_war$ 通常相当具有破坏性，圣战的胜利者通常会占领目标地区的所有 [counties|E]。然而，如果攻击者的意识形态是 [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName]，或者防御者在目标地区有攻击者自身意识形态的 [vassals|E]，目标地区的一些或所有守备统治者可能会直接转交给攻击者。\n\n与其他战争不同，与目标具有相同意识形态的统治者可以选择加入防御，而无需 [alliance|E]。\n\n圣战可能根据不同的 [religious_families|E] 被允许或限制。"
 game_concept_home_court: "内政部"
 game_concept_home_courts: "总部"
 game_concept_home_courts_possessive: "内政部"
 game_concept_hungarian_invasion_casus_belli_desc: "一个强大的[casus_belli|E]，在整个竞选期间可能仅使用一次，用来征服潘诺尼亚境内目标所有的领土。\n\n胜利时，攻击者的[realm|E]中所有的$mogyer_collective_noun$将随他们迁往潘诺尼亚，[counties|E] #EMP 和 #! [vassals|E]，取代$avar$ $game_concept_counties$。潘诺尼亚之外的其他平庸议员将被遗弃，而$game_concept_counties$以前被$mogyer_collective_noun$占领或持有的地方，将留给地方小诸侯和敌对草原部落。"
 game_concept_hybrid_culture_desc_DLC: "$game_concept_hybrid_culture$ 是由 [ruler|E] 创建的 [culture|E]，作为两个现有文化的组合。\n\n $game_concept_hybrid_culture$ 是两个原始文化的 [traditions|E]、[culture_pillars|E] 和审美的混合。\n\n 只有具有不同 [heritage|E] 的文化才能形成混合文化，并且形成混合文化的 [prestige|E] 成本取决于它们彼此的 [cultural_acceptance|E]。\n\n 文化接受度越高，形成混合文化时会转换的 [counties|E] 越多。混合文化的统治者在其母文化的选区中 [promote_culture|E] 得更快，为 #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! 年。\n\n 新文化也可以作为 [divergent_culture|E] 出现。"
 game_concept_iberian_reclamation_desc: "这是[war|E]的一种特殊类型，可供[struggle_involved|E] [rulers|E]的[iberian_struggle|E].\n\n使用。攻击者的目标是征服包含任何由[struggle_interloper|E]或[struggle_uninvolved|E] [ruler|E]持有的[struggle_involved|E] [counties|E]的[duchy|E]，或者如果他们在该地区之外没有土地，则将[vassalize|E]他们征服。"
 game_concept_initial_legitimacy: "初始授权"
 game_concept_intrigue: "公关操作"
 game_concept_intrigue_lifestyle: "公关生活方式"
 game_concept_intrigue_skill: "公关技能"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ 是用于媒体运作和洞察人心的 [skill|E]：简报、泄密、故事投放在友好媒体上、保持计划低调。\n\n它主要用于推动并防御 Spin [schemes|E]。\n\n相应的 [lifestyle|E] 是 [intrigue_lifestyle|E]。"
 game_concept_intrigue_task_contract: "公关合同"
 game_concept_intrigue_task_contract_possessive: "公关合同的"
 game_concept_intrigue_task_contracts: "公关合同"
 game_concept_intrigue_task_contracts_possessive: "公关合同的"
 game_concept_kingdom: "国家"
 game_concept_kingdoms: "各国"
 game_concept_knight: "组织者"
 game_concept_knight_army_modifier: "组织者军队修饰器"
 game_concept_knight_army_modifier_desc: "对任何 [army|e] 施加的效果，如果 #high 包含 #! 相关的 [acclaimed_knight|e]。\n\n[knight|e] 需要 #high 并不 #! 必须是其军队的 [commander|e]，以使其组织者军队修正生效。"
 game_concept_knight_army_modifiers: "组织者军队修饰器们"
 game_concept_knight_desc: "$game_concept_knight$是直接在你[army|E]作战的[vassal|E]、[courtier|E]或[follower|E]。\n\n [battles|E]，$game_concept_knights$利用[prowess_skill|E]更有效地战斗。高$game_concept_prowess$意味着他们能对敌人造成更大伤害，更有可能幸存甚至毫发无损地从$game_concept_battle$中出来。\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak 组织者根据[culture]或[faith]有不同名称。例如，$knight_champion_no_tooltip_plural$、$knight_faris_no_tooltip_plural$或$knight_baghatur_no_tooltip_plural$。\n\nrganisers既代表角色，也代表其随从部队。#!"
 game_concept_knight_desc_ACCOLADE_DLC: "被授予 [accolade|E] 的组织者将成为 [acclaimed_knights|E].\n\n"
 game_concept_knight_effectiveness: "组织者效率"
 game_concept_knight_effectiveness_desc: "[ruler|E]的组织者效能决定了他们在[battle|E]中[knights|E]的战斗表现。\n\n在100%时，组织者正常作战，但在200%时，他们的[prowess|E]战斗力就像加倍一样。"
 game_concept_knights: "组织者们"
 game_concept_knights_possessive: "组织者的"
 game_concept_kurultai_desc: "库鲁尔泰取代了 [council|E] 的 [nomadic_government|E]。库鲁尔泰成员属于党的精英，应该得到安抚，或被迫进入 [obedience|E]，以确保 [succession|E] 顺利进行。\n\n在混乱继承事件之后，他们可能会窃取一些 [herd|E]，放弃他们的新 [liege|E]，他们将在 [title|E] 上获得 [claim|E] 对 [realm|E] 的影响力。"
 game_concept_law_desc: "[realm_possessive|E]法律决定了该党派的结构。\n\n其中最基本的是党的[government_authority|E]，这些法律决定了[lieges|E]和[vassals|E]的日常互动。\n\n尽管对党内[rulers|E]的日常生活影响较小，但[succession_laws|E]和[title_laws|E]仍然非常重要，需要在[succession|E]时考虑。"
 game_concept_learning: "政策"
 game_concept_learning_lifestyle: "政策生活方式"
 game_concept_learning_skill: "政策技能"
 game_concept_learning_skill_desc: "$game_concept_learning$ 是用于想法和细节的 [skill|E]：阅读简报，起草法案，成功应对特别委员会。它每月还会带来 [piety|E]。\n\n相应的 [lifestyle|E] 是 [learning_lifestyle|E]。"
 game_concept_learning_task_contract: "保单合同"
 game_concept_learning_task_contract_possessive: "保单合同"
 game_concept_learning_task_contracts: "保单合同"
 game_concept_learning_task_contracts_possessive: "保单合同"
 game_concept_leasing_desc: "次要[baronies|E]可以租给[holy_orders|E]、[monastic_holy_orders|E]或[clergy|E]。租赁的选区为[lessee|E]提供[taxes|E]和[levies|E]，而不是[holder|E]。\n\n军事团体可以租赁[castle_holdings|E]和[city_holdings|E]，而修道院团体和党派官员可以租赁[temple_holdings|E]。租赁可能有[lease_contract|E]。\n\n租赁的[holdings|E]仍然被视为租赁者的[realm|E]的一部分。[county_capitals|E]不能被租赁。"
 game_concept_legitimacy: "使命"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ 是领导者根据党和国家的眼光统治的权利：赢得选举、获得领导权竞选胜利、赢得议会信任。没有 [ruler|E] 的领导者是在借用时间活着。[vassals|E] 还会生成 [legitimacy_expectations|E]，[liege|E] 应该满足这些要求。\n\n 只有 [rulers|E] 拥有 $game_concept_legitimacy$，这在他们成为统治者的那一刻计算，并且决定他们的 [initial_legitimacy|E]。一部分前任统治者的 $game_concept_legitimacy$ 也会被他们的 [heir|E] 继承。\n\n$game_concept_legitimacy$ 影响游戏中许多系统，使 [marriage|E] 提案、[vassalization|E] 和 [alliances|E] 更可能被接受，同时 [claims|E] 更便宜，并影响 [scales_of_power|E] 在 [regency|E] 的变化。\n\n$game_concept_legitimacy$ 通常有 5 个 [legitimacy_levels|E] 和 1 个 #weak 非法 #! 底层。[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "使命期望"
 game_concept_legitimacy_gain: "授权获得"
 game_concept_legitimacy_level: "授权级别"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] 统治者通过赢得战争获得#V 50%#!的额外授权，但失败时也会损失双倍。他们还会通过[single_combat_duel_plural|E]以及与平等或更高[dominance|E]血统的贵族成员结婚获得授权。[courtiers|E]"
 game_concept_legitimacy_levels: "授权级别"
 game_concept_levies: "志愿者"
 game_concept_levy: "志愿者"
 game_concept_liege: "党领袖"
 game_concept_liege_desc: "A $game_concept_liege$ 是一名政治家，至少有一个 [vassal|E] 向他们汇报。党派领导人本身向首相汇报。"
 game_concept_liege_possessive: "党领袖的"
 game_concept_liege_taxes: "党领袖征税"
 game_concept_liege_taxes_desc: "你的$game_concept_liege_taxes$是你必须向[liege|E]缴纳的[taxes|E]，作为你[obligations|E]的一部分。如果你[independent|E]，你无需支付任何$game_concept_liege_taxes$。\n\n从你的党魁角度看，这些税款被称为[vassal_taxes|E]，以区别于他们可能对自己$game_concept_liege$纳的任何税款。"
 game_concept_lieges: "党领袖"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' 是 [crown_authority|E] 的次低等级。[vassals|E] 对他们的 [liege|E] 有 #N -10#! [opinion|E] 惩罚，党领袖可以 [revoke|E] [titles|E] 并 [retract|E] 一个后座议员的后座议员。[ruler|E] 可以在可用的 Partition [succession_laws|E] 之间更改。"
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ 是 [nomadic_authority|E] 的第二低级别。[migration|E] 可以以 [de_jure|E] [duchy|E] [titles|E] 为目标在 [the_great_steppe|E] 内，[titles|E] 可以被撤销，并且队伍领导现在可以在他们的 [realm|E] 中 [imprison|E] [characters|E]。\n\n 可以使用 #V $step_away_from_the_steppe_decision$#! [decision|E]"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ 是 [tribal_authority|E] 的第二低级别。[vassals|E] 对其 [liege|E] 有 #N -10#! [opinion|E] 的惩罚，并且队伍领导现在可以在他们的 [realm|E] 中 [imprison|E] [characters|E]。"
 game_concept_long_reign_desc: "'长久统治' 是一个不断增加的 [opinion|E] 奖励，所有位于 [realm|E] 的角色在长期被 [liege|E] 统治时会获得该奖励。\n\n 同样，臣民在面对新的政党领袖时会有递减的 [short_reign|E] 意见惩罚。"
 game_concept_mainline_rite: "意识形态"
 game_concept_mainline_rites: "意识形态"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ 是由 [marshal|E] 执行的 [councillor_task|E]。\n\n它增加 [knight_effectiveness|E] 并降低 [hostile_scheme|E] [success_chance|E] 对部长的 [liege|E]。"
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ 是 [mandala|E] [ruler|E] 所规定的三项法令——由 [prosperity_decree|E]、[expansion_decree|E] 和 [reverence_decree|E] 标示。\n\n一般来说，曼陀罗党有非常集中的权力，[subjects|E] 和 [laws|E] 的权力掌握在相关的统治者手中，他们可以根据需要改变规则，而居民几乎没有反对意见。"
 game_concept_mandala_desc: "在$game_concept_mandala$的[government_form|E]下，[domain_limit|E]和[direct_vassals|E]的数量是有限的。相反，[liege|E]和[suzerain|E]依赖[tributaries|E]来扩大其党派。\n\nA 曼荼罗[ruler|E]可以希望被视为神王，或称德瓦拉雅，然后依赖[mandala_radiance|E]来获取和保持$game_concept_tributaries$。\n\nA $game_concept_ruler$必须维持[opinion|E]并与其$game_concept_tributaries$发展关系以保持长期稳定。继任时，$game_concept_tributaries$可能会分散，除非$game_concept_ruler$是值得的[mandala_succesor|E]。"
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ 是一种特殊类型的 [legitimacy|E]，仅向 [son_of_heaven|E] 提供。它代表君主统治的权利，以及谁被视为天下的最高统治者。\n\n 君权与 [dynastic_cycle|E] 密切相关。循环会影响在位君主如何获得君权，并可能根据君主的君权水平改变 [situation_dynastic_cycle_phase|E]。"
 game_concept_marshal: "内政大臣"
 game_concept_marshal_desc: "$game_concept_marshal$ 是负责安全事务的 [councillor|E]：警察、边境和维持秩序。"
 game_concept_marshals: "任内政大臣"
 game_concept_martial: "安全"
 game_concept_martial_lifestyle: "安全生活方式"
 game_concept_martial_skill: "安全技能"
 game_concept_martial_skill_desc: "$game_concept_martial$ 是用于法律和秩序、防御和危机管理的 [skill|E]：保持街道和国家的安全。\n\n相应的 [lifestyle|E] 是 [martial_lifestyle|E]。"
 game_concept_master_assassin_desc: "$game_concept_master_assassin$ 是由 [faiths|E] 启用并具备 [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E] 的 [court_position|E]。$game_concept_master_assassin$ 是一名危险的极端分子，他与较低级的刺客合作，以杀害其认为是该意识形态敌人的目标。"
 game_concept_maximum_piety_level: "最大政治资本等级"
 game_concept_men_at_arms: "活动家们"
 game_concept_men_at_arms_counter: "活动家反制"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$专业[soldiers|E]优于[levies|E]。\n\n玩家可以直接控制其激进分子[regiments|E]的组成和规模。\n\n不同类型的激进分子在不同类型的[terrain|E]中表现优劣。每种类型还[counters|E]另一种类型。\n\n活动家可以[stationed|E]以[holdings|E]以提高其效能。"
 game_concept_mental_break_desc: "当[stress|e]让角色不堪重负时，他们会经历精神崩溃——一种个人危机，他们觉得无论付出多大代价都必须采取措施降低压力。\n\n经历精神崩溃的参与者会有多种应对方式，尽管许多方式会带来负面后果。\n\n虽然后果[stress_levels|E]低，但这些后果较轻且易于管理。然而，随着压力等级的增加，这些后果也会增加，最终导致精神失常甚至死亡。"
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$ 是最高级别的 [minister|E]，负责外交事务。他们通常被指派为 [grand_secretariat_director|E]。\n\n 外务大臣可以是指定的 [grand_secretariat_director|E]，这取决于 #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]。\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$ 是 [realm|E] 中最高级的指挥官，指挥一支 [army|E] 的 [title_men_at_arms|E]。\n\n 内务大臣可以是指定的 [grand_secretariat_director|E]，这取决于 #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]。\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ 是一套独特的 [vassal_obligations|E]，仅适用于 [ministers|E]。\n\n 所有民政部长都有特定的选项组作为默认项，而 [minister_grand_marshal|E] 则有一个独特选项，为内政大臣提供 [title_men_at_arms|E]。\n\n 这些义务不可更改。"
 game_concept_natural_prowess: "天然耐力"
 game_concept_noble_family_desc: "$game_concept_noble_families$ 是在 [government_bureaucratic_type|E] [realm|E] 中强大的 [houses|E]。他们拥有一个由 [house_head|E] 控制和管理的 [estate|E]，并始终是党的重要组成部分，因为他们会尝试收集 [influence|E] 并为自己争取 [provinces|E]。\n\n有影响力的 $game_concept_noble_family$ 可能会成为 [powerful_family|E] 或 [dominant_family|E]。"
 game_concept_obedience_desc: "在 [GetGovernment( 'nomad_government' ).GetName] [realms|E] 中，服从决定 [character|E] 对其 [liege|E]、[suzerain|E] 或 [court|E] 所有者的忠诚。角色一次只能对一个 [ruler|E] 服从。\n\n 服从的角色不太可能参与 [hostile_schemes|E]，加入 [wars|E] 或反对其党派领袖的 [factions|E]。在 [succession|E] 中，他们总是支持党派领袖的偏好，不会将他们的 [claims|E] 强加于领袖。非服从的 [tributaries|E] 可能会试图挣脱束缚。\n\n 当角色的分数超过 [obedience_threshold|E] 时，他们便会服从。"
 game_concept_offer_vassalization_desc: "一种互动，向 [independent|E] [ruler|E] 的低 [title_rank|E] 提供 [vassalage|E]，和平地将他们加入团队。"
 game_concept_organize_levies_desc: "A [councillor_task|E] 由 [marshal|E] 执行。它增加 [garrison|E] 大小和 [levy|E] 强化速率，在部长的 [liege|E] 的 [realm|E] 中。"
 game_concept_organized_desc: "有组织的[faith|E]拥有宗教层级。崇拜和宗教实践更为有序，经典文献更加规范化。\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] 意识形态可以通过改革而变得有组织，而其他意识形态则始终被视为有组织。"
 game_concept_pam_challenge_hof_cb: "挑战运动领导者"
 game_concept_papal_recipient_desc: "如果[great_holy_war|E]的主要目标已被侵略者意识形态成员持有或声称，除非主[Concept( 'war_contribution', 'Contributor' )|E]决定优先考虑其[beneficiary|E]，否则该目标将被视为争夺头衔的合法继承人。"
 game_concept_peasant_faction_desc: "$game_concept_peasant_faction$ 由 [counties|E] 填充，这些人拥有低 [county_opinion|E]。与其他 [factions|E] 不同，这类人即使 [faction_military_power|E] 很低也会始终反抗，因为农民通常既乐观又不识字……成功的抗议运动将显著降低你在 [realm|E] 的控制力。"
 game_concept_peasant_factions: "抗议运动（复数）"
 game_concept_perk_desc: "特权是可解锁的好处，提供许多有用且有趣的效果。它们通过在 [focus|E] 内选择 [lifestyle|E] 并花费相关形式的 [experience|E] #weak（例如，如果你希望解锁 $game_concept_intrigue_lifestyle$ $game_concept_perk$，则旋转 $game_concept_experience$）来解锁。#!"
 game_concept_personal_tenet: "个人事业"
 game_concept_personal_tenets: "个人事业"
 game_concept_petition_antipope_gold_interaction: "反教皇申请资金"
 game_concept_piety: "政治资本"
 game_concept_piety_desc: "$game_concept_piety$ 是政治家在其党派和建制中的信誉：表现出的忠诚、完成的恩惠、支持的正当事业。\n\n 它用于向党派和建制 requesting 事项，取决于 [government_form|E]。\n\n 每当角色获得政治资本时，也会进展到下一个 [piety_level|E]。"
 game_concept_piety_experience: "忠诚"
 game_concept_piety_experience_desc: "角色获得的每点忠诚度都会增加其向下一个[piety_level|E]的进度。当角色获得[piety|E]时，他们也会获得同等数量的忠诚度。"
 game_concept_piety_level: "政治资本等级"
 game_concept_piety_level_desc: "一个角色的 $game_concept_piety_level$ 是衡量他们在政党和政府机构中积累信誉的程度，以及他们在其他 [faith|E] 成员中的地位。\n\n每当一个角色获得 [piety|E]，他们也会向下一个政治资本等级进阶。\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\n等级如下：\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "政治资本等级影响"
 game_concept_piety_level_impact_desc: "政治资本等级影响会增加或减少你当前 [piety_level|E] 获得的 [modifiers|E]。"
 game_concept_piety_levels: "政治资本等级"
 game_concept_playdate_desc: "一个 [activity|E]，统治者和年龄低于 [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] 的工作人员聚集来玩耍并忘却一天的乏味。\n\n参与者将失去 [stress|E] 并增加他们对主人的 [opinion|E]。将这么多孩子聚集在一起还可能产生其他许多后果。\n\n一位 [ruler|E] 会邀请他们的 [liege|E] 和他们的 [vassals|E]（以及各种 [courtiers|E]）参加一场 $activity_playdate$。"
 game_concept_player_heir_desc: "$game_concept_player_heir$ 是 [heir|E]，玩家将在 [succession|E] 上继续扮演的角色。\n\n $game_concept_player_heir$ 通常与 [primary_heir|E] 相同，但如果 [succession_law|E] 的 [primary_title|E] 决定它应该分配给 [dynasty|E] 之外的角色，您将改为继续扮演继承您第二高等级头衔（或第三、第四等）的王朝继承人。\n\n 这种情况在您的 $game_concept_player_heir$ 根据选举继承法被罢免时很常见。如果您是 [house_head|E] 在 [noble_family|E] 的 [administrative|E] [realm|E] 中，您可能会将政党失去给 [house|E] 之外的主要继承人，但保留您的贵族家族头衔。\n\n 如果您是 [ecclesiastical|e]，您的 $game_concept_player_heir$ 是将继承您 [primary_title|e] 的角色，通常是 [archdiocese|e]。"
 game_concept_popular_faction_desc: "$game_concept_popular_faction$ 由 [counties|E] 填充，这些人拥有低 [county_opinion|E]，共享某种共同元素，例如 [culture|E] 或 [faith|E]。他们寻求摆脱束缚，并根据他们的文化或意识形态选择新的 [ruler|E]。这种类型的起义通常非常危险。"
 game_concept_popular_factions: "民粹主义运动（复数）"
 game_concept_powerful_family_desc: "一个 $game_concept_powerful_family$ 代表了 [houses|E] 和 [noble_families|E] 中最有影响力的人物之一，在 [government_bureaucratic_type|E] [realm|E].\n\n $game_concept_powerful_family$ 的成员在 [political_schemes|E] 上更为擅长，并且在与其他 [characters|E] 进行 [interacting|E] 时更有可能获得他们想要的东西.\n\n 任何时候 $game_concept_powerful_families$ 的数量都是有限的，而被认为强大的 $game_concept_noble_families$ 是根据他们的 [powerful_family_rating_short|E] 进行评价的。[top_liege|E] 家族是一个例外，它永远被认为是强大的.\n\n 控制党派土地的重要部分的家族可以成为 [dominant_family|E]。"
 game_concept_powerful_vassal: "强势后座议员"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' 是少数拥有最多 [soldiers|E] 和最高 [income|E] 的 [vassals|E]。你需要特别注意这些后座议员，因为他们期望在你的 [council|E] 中拥有一个席位，如果没有，他们对你的 [opinion|E] 将显著降低。\n\n更换 [succession_law|E] 需要所有 $game_concept_powerful_vassals$ 要么对你有正面的 [opinion|E]，要么被你 [cowed|E]，或者被 [imprisoned|E]。"
 game_concept_powerful_vassal_possessive: "强势后座议员的"
 game_concept_powerful_vassals: "强势后座议员们"
 game_concept_prestige: "个人资料"
 game_concept_prestige_desc: "$game_concept_prestige$ 是政治家的公众声望：知名度、专栏篇幅和播出时间。\n\n 它用于公众动作，取决于 [government_form|E]。\n\n 每当角色获得公众声望时，也会朝着下一个 [prestige_level|E] 进展。"
 game_concept_prestige_experience: "名声"
 game_concept_prestige_level: "个人资料等级"
 game_concept_prestige_level_impact: "个人资料等级影响"
 game_concept_prestige_level_impact_desc: "个人资料等级影响会增加或减少你当前 [prestige_level|E] 获得的 [modifiers|E]。"
 game_concept_prestige_levels: "个人资料等级"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$是#V 7#!的[electors|E]，他们与皇帝一起在[SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )]使用的[GetLaw('princely_elective_succession_law').GetName] [succession_law|E]下选择一个[title_heir|E]。#V 7#!的首选[titles|E] \n\n[holders|E]被优先$game_concept_prince_electors$。这些头衔是在帝国创建时选出的。\n\n如果$game_concept_prince_elector$头衔被销毁，未被[de_jure|E]帝国[vassal|E]持有，或由其他$game_concept_prince_elector$持有，或持有者的[religion|E]与皇帝不同，则将根据以下标准选出另一名法定头衔，[independent_ruler|E]将根据以下标准选择：皇帝[faith|E]和[culture|E]的\n$EFFECT_LIST_BULLET$[rulers|E] \n$EFFECT_LIST_BULLET$[theocratic|E]，统治者[feudal|E]favored\n\n#help 首选头衔列于选举视图#!"
 game_concept_promote_other_culture_development_decision_desc: "一个 [decision|E]，使你能够提升 [development|E]、[control|E]、[building|E] 费用，以及在 [counties|E] 中来自不同 [cultures|E] 的防御 [advantage|E]，前提是 [cultural_acceptance|E] 达到 #V 75%#! 或更高。\n\n 采取该决策还将增加你的 [prestige|E] [prestige_i] 和 [levies|E]。\n\n [realm|E] 中的所有选区都会受到影响。[gold|E] 成本会随着受影响选区数量的增加而增加。"
 game_concept_prowess: "体力"
 game_concept_prowess_skill: "体力技能"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ 是一种 [skill|E]，反映了角色的身体和精神耐力：十八小时的工作日、整夜的会议和竞选旅程。\n\n 高体力技能意味着他们更有可能在 [battles|E] 和 [single_combat_duel_plural|E] 中作为 [knights|E] 生存并表现良好。\n\n 每一点体力都给予组织者：\n$BULLET_WITH_TAB$[damage|E]：#V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]：#V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E]可以从[rally_points|E]中作为$game_concept_raiders$组建。$game_concept_raiders$可以进入邻近土地掠夺[gold|E]。\n\n为了$game_concept_raid$，袭击军必须停留在外国[ruler|E]拥有的[holding|E]并选择开始袭击——一旦这样做，他们将被困在一段时间内，之后获得资金并掠夺领地。\n\n的地块将存储在军队中，只有回到家乡才会加入国库。如果你击败携带资金的掠夺军队，你将夺取资金，他们将暂时无法袭击你。\n\n只有部分统治者被允许$game_concept_raid$，最显著的是[tribal|E]和[GetGovernment( 'nomad_government' ).GetName]统治者。\n\n特殊可设置的[raid_intents|E]以获得不同奖励。"
 game_concept_rally_point_desc: "$game_concept_rally_point$是你指挥下的[levies|E]和[men_at_arms|E]的集结地。\n\n在[war|E]有时候，你可以在集结点召集你的[soldiers|E]，召集一个[army|E]。\n\n被分配到集结点的志愿者必须来自你自己的[domain|E]或你的[vassals|E]。集结点可以根据需要重新组织、拆分和合并。"
 game_concept_realm: "党"
 game_concept_realm_capital: "基地"
 game_concept_realm_capital_desc: "$game_concept_realm_capital$ 是 [holding|E]，[ruler|E] 及其 [court|E] 所居住的地方。这个领地有 [tax|E] 奖励，并且总是由 [primary_heir|E] 继承。\n\n[occupying|E] 在战争中占据敌人的基地会提供大量 [war_score|E]，有时还能让您 [imprison|E] 敌人家族的成员。"
 game_concept_realm_capital_possessive: "基地"
 game_concept_realm_capitals: "主基地"
 game_concept_realm_desc: "$game_concept_realm$ 是一名政治家领导的所有人和一切事务，无论是直接还是通过他们的 [vassals|E]（不同于 [domain|E]，仅指他们自己掌控的东西）。"
 game_concept_realm_heir: "党继承人"
 game_concept_realm_heir_desc: "政党继承人是 [heirs|E] 的一员 [realm|E]，在该统治者去世时，将获得该政党 [ruler|E] 持有的全部或部分 [titles|E]。\n\nA 政党可能根据其 [succession_law|E] 拥有一个或多个政党继承人。"
 game_concept_realm_heirs: "党继承人"
 game_concept_realm_law: "党法"
 game_concept_realm_law_desc: "适用于该角色党派的法律，例如[crown_authority|E]或[tribal_authority|E]的级别。"
 game_concept_realm_possessive: "党的"
 game_concept_realm_priest: "党牧师"
 game_concept_realm_priest_desc: "$game_concept_realm_priest$是负责宗教和精神事务的一[councillor|E]，[faiths|E]与[GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E]。\n\nU与其[GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName]对应机构（[court_chaplains|E]）不同，$game_concept_realm_priests$自动[lease|E] [ruler|E] [domain|E]中的所有[temple_holdings|E]，并从[vassal|E] $game_concept_realm_priests$获得部分[taxes|E]和[levies|E]。如果[liege|E]对有正面评价，\n\n$game_concept_realm_priests$会提供志愿者和税收。[liege|E] [opinion|E]越高，提供越多。\n\n$game_concept_realm_priests$对党魁评价较低，则不会提供任何税收或志愿者，可能会带来问题。"
 game_concept_realm_priest_possessive: "党牧师的"
 game_concept_realm_priests: "党牧师们"
 game_concept_realm_size: "党规模"
 game_concept_realms: "政党"
 game_concept_regency_desc: "摄政是一种特殊形式的[diarchy|E]，当[ruler|E]无法独自统治其[realm|E]时使用。\n\n通常发生在统治者是[child|E]、[imprisoned|E]、[GetTrait('incapable').GetName( GetNullCharacter )]，或在党派之外参加[activity|E]时。\n\n持续时间过长的$game_concept_regency$可能会变成[entrenched_regency|E]。"
 game_concept_religion: "政治阵营"
 game_concept_religion_desc: "$game_concept_religion$ [faiths|E]相关团体：左派、中间派、右派、民族主义者和联盟主义者。同一阵营或邻近阵营的意识形态为分歧;左派和右派为对立派;民族主义者与统一派不可调和。"
 game_concept_religions: "政治阵营"
 game_concept_religious_families: "政治家族"
 game_concept_religious_family: "政治家族"
 game_concept_religious_family_desc: "$game_concept_religious_family$是一群[religions|E]。$game_concept_religious_family$影响各个政治阵营及其[faiths|E]彼此的看法。\n\n [GetReligionFamily('rf_abrahamic').GetName]家族容忍对所有人#weak（包括其他亚伯拉罕诸人）[holy_wars|E] #!。政治阵营容易受到[heresy|E]影响。\n\n [GetReligionFamily('rf_eastern').GetName]家族只允许针对其他政治家族的圣战。\n\n家族[GetReligionFamily('rf_pagan').GetName]支持针对所有人的圣战，但政治阵营内的意识形态必须改革才能接触到这些战争。"
 game_concept_religious_head_succession_law: "运动领袖继任法"
 game_concept_religious_head_succession_law_desc: "同时也是 [heads_of_faith|E] 的 [rulers|E] 还拥有附加的政党 [succession|E] 法律，要求其 [heir|E] 必须与其具有相同的 [faith|E]。此条款永远无法更改，$game_concept_head_of_faith$ [titles|E] 不能拥有单独的 [title_succession|E]。消除此类政党法律的唯一方法是外部力量摧毁 [head_of_faith|E] $game_concept_title$。"
 game_concept_religious_head_succession_law_short: "运动领袖法"
 game_concept_religious_head_succession_laws: "运动领袖继任法"
 game_concept_religious_head_succession_laws_short: "运动领袖法规"
 game_concept_religious_superior_desc: "宗教上级是一个 [character|E]，在分层宗教结构中对一个或多个 [subordinate|E] 宗教党的官员拥有宗教管辖权。"
 game_concept_retinue_maa: "随从活动家"
 game_concept_retract_desc: "在 [limited_crown_authority|E] 或更高时，[rulers|E] 可以 $game_concept_retract$ 后座议员的 [vassal|E]，但除非后者 [imprisoned|E]，否则这是有风险的，因为后座议员可能拒绝并起义反叛。\n\n 后座议员撤回被认为是 [tyrannical|E]，除非目标犯有相当严重的 [crime|E]。"
 game_concept_revoke_desc: "当 [limited_crown_authority|E] 或更高时，[rulers|E] 可以 $game_concept_revoke$ 他们 [vassals|E] 的 [titles|E]，但除非普通议员是 [imprisoned|E]，否则这是一个有风险的提议，因为普通议员可能会拒绝并起义反抗。\n\n头衔撤销通常被认为是 [tyrannical|E]，除非普通议员犯了相当严重的 [crime|E]。"
 game_concept_rightful_liege: "合法党魁"
 game_concept_rightful_liege_desc_part2: "#weak 示例: $c_dunbar$ 伯爵是 $k_england$ 国王的直接附从。由于国王既不是 $d_lothian$ 公爵，也不是 $k_scotland$ 国王，亦不是 $e_britannia$ 皇帝，$c_dunbar$ 伯爵只贡献极少量的税收和志愿者。\n\n $c_norfolk$ 伯爵也是 $k_england$ 国王的直接附从。国王并不持有 $d_norfolk$ 地区，因此伯爵同样贡献较少的税收和志愿者。然而，因为 $k_england$ 是 $c_norfolk$ 的法定国家，$c_norfolk$ 伯爵向国王贡献的税收和志愿者仍明显多于 $c_dunbar$ 伯爵。#!"
 game_concept_rite: "意识形态"
 game_concept_rite_desc: "在西敏寺，每个 [faith|E] 都有一个同名的 $game_concept_rite$：即意识形态本身，以及它的 [core_tenets|E] 和 [doctrines|E]。它们是固定的：政治家会改变想法，但不会改变他们的意识形态。"
 game_concept_rite_divergence_desc: "偏离度衡量 [rite_possessive|E] [core_tenets|E] 与 [doctrines|E] 相对于母体 [faith|E] 的偏离程度。采用 [prohibited_tenet_status|E] 事件作为 [core_tenet_status|E] 的意识形态更具有偏离性。\n\n较高的偏离度会削弱母体意识形态的 [fervor|E]，使 [heresy|E] 的爆发更为常见。偏离度达到 #V 100#! 的意识形态将自动被宣布为分裂，并成为新的 [faith|E]。"
 game_concept_rite_knowledge: "意识形态知识"
 game_concept_rite_possessive: "意识形态的"
 game_concept_rites: "意识形态"
 game_concept_rites_possessive: "意识形态的"
 game_concept_royal_court: "私人办公室"
 game_concept_royal_court_desc: "杰出的 [rulers|E] 知名度足以维持一个私人办公室，这可以让他们获得各种奖励和机会。\n\n当 [GetGovernment( 'feudal_government' ).GetName]、[GetGovernment( 'clan_government' ).GetName] 或 [GetGovernment( 'tribal_government' ).GetName] [ruler|E] 成为 [king|E] 或 [emperor|E] 时，他们可以使用私人办公室。\n\n每个私人办公室都有一个 [court_grandeur_level|E]，根据私人办公室的知名度及其 [court_type|E]，可获得相应的好处。\n\n请愿者、[vassals|E] 和 [courtiers|E] 可以出现在你的私人办公室，或者你可以 [hold_court|E] 邀请 [realm|E] 中的任何人来表达他们的不满。\n\n私人办公室还允许统治者展示 [court_artifacts|E]，并且 [inspired|E] [guests|E] 可能出现在私人办公室，提供创建新的 [artifacts|E] 的机会。\n\n当你去世时，你的 [player_heir|E] 将继承你的私人办公室。"
 game_concept_royal_courts: "私人办公室们"
 game_concept_sanctified_desc: "圣化一个[artifact|E]使其成为[faith|E]的一个[holy_relic|E]。一件神器可以被多种意识形态神圣化。"
 game_concept_scales_of_power_desc: "在[power_sharing|E]期间，[liege|E]与其[diarch|E]之间的权力平衡会以$game_concept_scales_of_power$为单位进行衡量。\n\nA将$game_concept_scales_of_power_scales$尖端指向$game_concept_diarch$，他们会解锁[diarch_powers|E]，并可能增加党魁的[diarch_affected_actions|E]成本。\n\nA如果他们倾斜到$game_concept_liege$，反而让党魁更容易结束[diarchy|E]。\n\n $game_concept_scales_of_power_scales$可以被：\n$EFFECT_LIST_BULLET$U对对方$swing_scales_currency_interaction$ [character_interaction|E] \n$EFFECT_LIST_BULLET$这$game_concept_diarch$，在[mandate|E]事件中为你的$game_concept_liege$服务（尽管玩世不恭）"
 game_concept_seasonal_prediction_desc: "技艺高超的 $court_position_court_astrologer$ 能预测一个地区的下一个 [steppe_season|E]，为其党领导人提供有用信息，以规划下一步行动。"
 game_concept_seize_peripheral_duchy: "夺取边缘区域"
 game_concept_settlement_issue_desc: "定居问题是指在完成[migration|E]后分配给[nomad|E] [ruler|E]的新土地任务。这提供了处理冲突和增加新[domain|E]当地[county_control|E]的机会。\n\n只要选区控制力低，这些问题将在统治者迁移后的最初几年继续发生。"
 game_concept_short_reign_desc: "'短暂统治' 是一个递减的 [opinion|E] 惩罚，所有位于 [realm|E] 的角色在面对新的 [liege|E] 时会获得该惩罚。\n\n 同样，臣民在长期被政党领袖统治后会获得递增的 [long_reign|E] 意见奖励。"
 game_concept_shunned_desc: "许多 [rites|E] 拥有 [doctrines|E]，这些标记将某些行为指定为被排斥的。根据具体的政策立场，这些行为也可能被视为 [criminal|E].\n\n被抓到实践其意识形态排斥的行为的角色会失去 [piety_level|E]，并获得相应的 [fame_trait|E]；这个特质会被所有认为该行为为被排斥或犯罪的意识形态的人不喜欢.\n\n被排斥行为的示例包括：\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "每个 [rite|E] 都认为某些 [traits|E] 是有罪的。拥有这些特征的角色会受到所有认为这些特征有罪的角色的 [opinion|E] 处罚，即使他们不持有相同的意识形态。此外，拥有他们自己的意识形态认为有罪的特征的角色，每个月也将失去 [piety|E]。\n\n到底哪些特征被认为是罪恶，因意识形态而异，但通常由该意识形态的 [core_tenets|E] 和该意识形态所属的 [religion|E] 的组合决定。"
 game_concept_spiritual_fulfillment: "个人信念"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ 是指 [character|E] 对自身政治的舒适程度。这取决于他们的 [traits|E] 以及他们的行为。"
 game_concept_spiritual_fulfillment_level: "定罪等级"
 game_concept_spiritual_fulfillment_level_desc: "一个[character_possessive|E]的[spiritual_fulfillment|E]分为多个$game_concept_spiritual_fulfillment_levels$，每个都有其自身效果。"
 game_concept_spiritual_fulfillment_levels: "定罪等级"
 game_concept_spiritual_head_of_faith: "精神运动领袖"
 game_concept_spymaster: "首席党鞭"
 game_concept_spymaster_desc: "$game_concept_spymaster$ 是保持政党秩序并知道每个人秘密的 [councillor|E]。提防不忠的党鞭：他们很容易隐藏或加入针对您的阴谋。"
 game_concept_state_rite: "国家意识形态"
 game_concept_state_rite_desc: "$game_concept_state_rite$ 是由 [administrative_government|E] 支持和认可的 [rite|E]。这种意识形态附属于 [title|E]，而不属于任何一个具体的 [character|E]。在 [realm|E] 中将角色转为国家意识形态比较容易，而将其转离则非常困难。\n\n只有行政党派的 [ruler|E] 才能改变国家意识形态，但 [governors|E] 可以自由转换为该意识形态。"
 game_concept_stationed_regiment_desc: "一个[men_at_arms|E]的[regiment|E]通过驻扎在[holding|E]可以获得效能加成。\n\n[buildings|E]可以进一步增加这些加成——有时适用于任何类型的激进分子，但最常见的是针对一两种。例如，[GetBuilding('stables_01').GetName]为驻扎的[light_cavalry|E]和[heavy_cavalry|E]提供加成。\n\n你可以在任何时间驻扎，除了[war|E]期间，或者如果持有地是[occupied|E]。如果失去持有地，任何驻扎的激进分子将被取消驻扎。"
 game_concept_steward: "财政大臣"
 game_concept_steward_desc: "$game_concept_steward$ 是负责经济和 [domain|E] 的 [councillor|E]：[taxation|E]、支出和 [development|E]。"
 game_concept_stewards: "财政大臣们"
 game_concept_stewardship: "经济"
 game_concept_stewardship_lifestyle: "经济生活方式"
 game_concept_stewardship_skill: "经济技能"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$ 是负责预算、经济和事务运行的 [skill|E]。它直接增加 [taxation|E]，因此每个领导者都想要它。\n\n 对应的 [lifestyle|E] 是 [stewardship_lifestyle|E]。"
 game_concept_stewardship_task_contract: "经济合同"
 game_concept_stewardship_task_contract_possessive: "经济合同"
 game_concept_stewardship_task_contracts: "经济合同"
 game_concept_stewardship_task_contracts_possessive: "经济合约"
 game_concept_story_content_el_cid_desc: "#tooltip_heading 故事情节风格：轻松#!\n\n作为埃尔·西德，你将被你的团队领袖错误地排挤。在流放中，你可以选择保持忠诚或寻找自己的道路，最终以返回宫廷#EMP 或#!获得终极奖品——瓦伦西亚。\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading 故事情节风格：中等#!\n\n作为哈桑，你将被引导走上一条宗教狂热的道路，选择一个地方传播真正理念的光芒，并将[counties|E]从他们的[rulers|E]下转化。\n\n最终，你的故事将以针对你选择的敌人的重大宗教起义达到高潮。\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading 故事情节风格：轻松#!\n\n作为铁木真，你将向囚禁你配偶的敌对部族复仇，并测试你最亲密的支持者和朋友——者札木合的忠诚。\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "压力"
 game_concept_stress_desc: "角色在违背自己[personality_traits|E]时会受到$game_concept_stress$惩罚：忠诚的后座议员投票反对党鞭，诚实的部长被制造来维护错误立场。\n\n在压力下，角色会获得一个[stress_level|E]，其健康影响会持续到他们再次降低为止。\n\n离开威斯敏斯特，缓解[activities|E]。"
 game_concept_stress_level: "压力水平"
 game_concept_stress_level_desc: "每累积 100 [stress|E] 的角色，也会导致他们获得一个压力等级。压力等级范围从 0 到 3，每个等级会对角色的 [fertility|E] 和 [health|E] 施加越来越大的惩罚。\n\n此外，只要角色至少有 1 个压力等级，他们就容易受到 [mental_breaks|E] 的影响。"
 game_concept_stress_levels: "压力等级"
 game_concept_stress_loss: "压力损失"
 game_concept_stressed: "压力之下"
 game_concept_strong_vassal: "强有力的后座议员"
 game_concept_strong_vassal_desc: "$game_concept_strong_vassal$是指接近或超越其权力的权力[liege|E]，从而受到[opinion|E]惩罚的 [vassal|E]。#weak 他们认为党魁软弱且不适合统治党派。#!"
 game_concept_strong_vassals: "强有力的后座议员"
 game_concept_struggle_involved_faith: "涉及的意识形态"
 game_concept_struggle_involved_faiths: "涉及的意识形态"
 game_concept_struggle_persia_phase_unrest_desc: "在叛乱和阴谋的困扰下，哈里发国崩溃。雄心勃勃的军阀和狡猾的总督争夺可以篡夺的权力，不断争执。\n\n随着时间的推移，除非通过[ending_phase|E]解决局势，否则政党将进入[struggle_persia_phase_stabilisation|E]阶段，绝望的支持者试图夺回哈里发的权威。"
 game_concept_struggle_phase_desc: "$game_concept_struggle_phase_phase$是[struggle_region|E]中[struggle_involved|E] [characters|E]和 [counties|E]中常见的一种普遍情绪。它代表了短期的社会趋势和风俗，暂时主导了[struggle|E]的对话。\n\n#weak 例如：在某$game_concept_struggle_phase_phase$中，一个$game_concept_struggle_region_region$的人们可能认为宗教宽容至关重要，即使他们的其他意识形态不同意。#!"
 game_concept_supply_limit_desc: "$game_concept_supply_limit$ 决定了你在 [barony|E] 中可以拥有多少 [soldiers|E]，由 Ward 的 [terrain|E] 和 [development|E] 决定。\n\n 如果你的总 [army|E] 规模超过 $game_concept_supply_limit$，你的 $game_concept_armies$ 将失去 [supply|E] 并最终遭受 [attrition|E]。"
 game_concept_temporal_head_of_faith: "时间运动领袖"
 game_concept_tenet: "原因"
 game_concept_tenet_desc: "虽然 [doctrines|E] 代表 [rite|E] 必须表明立场的问题，$game_concept_tenets$ 代表该意识形态独特的怪癖和实践。"
 game_concept_tenet_knowledge: "政策知识"
 game_concept_tenet_knowledge_desc: "政治家并不了解每个意识形态的详细思路。\n\n了解 $game_concept_core_tenets$ 和 $game_concept_doctrines$ 的所有信息使你更容易改变对 $game_concept_rite$ 的看法。\n\n你自己的 [faith|E] 的所有 [core_tenets|E] 和 [doctrines|E] 都是已知的。更多信息可以从 [spouses|E]、[friends|E] 和 [activities|E] 学习。"
 game_concept_tenet_popularity: "受欢迎的原因"
 game_concept_tenet_popularity_desc: "随着[personal_tenets|E]在[faith|E]中传播，他们的做法变得更加普遍。$game_concept_tenet_popularity$追踪[core_tenet|E]的普及程度，并影响其作为[ecumenical_council|E]辩论主题或[papal_bull|E]目标的可能性。\n\n $game_concept_tenet_popularity$越高，当某个议题在[ecumenical_council|E]中被辩论时，[clergy|E]越多会支持该议题。一旦某个议题达到#high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$，[head_of_faith|E]很可能会将其宣布为[permitted_tenet_status|E]，无论他们自身信念如何。"
 game_concept_tenet_status: "原因状态"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ 是对 [core_tenet|E] 或 [doctrine|E] 的 [rite_possessive|E] 立场。有五种可能的立场：\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — $game_concept_rite$ 从未听说过此 $game_concept_core_tenet$ 或 $game_concept_doctrine$。\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — $game_concept_rite$ 已了解，但尚未对其实践做出裁定。\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — $game_concept_rite$ 认可此实践。\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — $game_concept_rite$ 禁止此实践。\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — $game_concept_rite$ 既允许又积极推动 $game_concept_core_tenet$。\n\n意识形态的立场决定在撰写或偏离 $game_concept_rite$ 时能否选择 $game_concept_core_tenet$ 或 $game_concept_doctrine$，并决定哪些实践会造成 [followers|E] 精神惩罚。\n\n原因状态不同于 [character_possessive|E] [tenet_knowledge|E]，这代表个人认知，而非整体 $game_concept_rite$ 的立场。"
 game_concept_tenets: "原因"
 game_concept_the_christian_church_desc: "基督教会是监督和引导耶稣基督追随者的教会机构，表现为通过一系列[the_christian_church_chapters_short|E]推进的[situation|E]。\n\n其边界涵盖世界上的每一个[archdiocese|E];在总教区内，所有[christian|E] [ruler|E] [county|E]级及以上、隶属于其[realm|E]的任何部分的成员，无论是党内官员还是世俗人士，都是成员。"
 game_concept_theocratic_vassal: "神权党后座议员"
 game_concept_theocratic_vassal_desc: "拥有 [theocratic_government|E] 形式的后座议员.\n\n他们的运作方式由 [faithpossessive|E] [doctrines|E] 决定。"
 game_concept_theocratic_vassals: "神权党后座议员们"
 game_concept_title_allegiance_desc: "[vassals|E]可以效忠于特定[title|E]，而非其[liege|E]之人。这只有在该头衔有自身的[succession_law|E]时才能实现。[succession|E]，这些后座议员将成为新首相[holder|E]的后座议员。"
 game_concept_title_desc: "$game_concept_title$ 本质上是土地所有权的证书。\n\n地图上最小的土地单位是 [barony|E]。区域被组织成称为 [counties|E] 的更大区域。选区 [de_jure|E] 属于 [duchy|E]，地区属于 [kingdom|E]，国家属于 [empire|E]。\n\n地区、国家和帝国不一定都有 [holder|E]，但它们是可以由控制相应领土足够多的统治者 [created|E] 的称号。"
 game_concept_title_men_at_arms: "产权活动家"
 game_concept_top_liege: "首相"
 game_concept_top_liege_possessive: "首相的"
 game_concept_top_lieges: "首相们"
 game_concept_top_realm: "顶级政党"
 game_concept_torture_desc: "[imprisoned|E] 角色可以被 $game_concept_tortured$，损害他们的 [health|E]，甚至以不同方式致残。\n\n 拷打可以缓解 [stress|E] 对 [GetTrait('callous').GetName( GetNullCharacter )] 和 [GetTrait('sadistic').GetName( GetNullCharacter )] 角色的压力，但会对同类性格的角色造成压力。\n\n 拷打 [rulers|E] 还可以增加你的 [dread|E]。"
 game_concept_tour_stop_desc: "一个[activity_phase|E] 在[royal_tour|E]期间，队长可以选择：出席[hosted_dinner|E]、[tour_the_grounds|E]他们的[vassal|E]，或享受[cultural_festival|E]。"
 game_concept_transfer_desc: "[rulers|E] 可以将他们的 [vassals|E] 的一个 $game_concept_transfer$ 转移给另一个后座议员，只要前者的等级低于后者。这是提升后座议员 [opinion|E] 的好方法，特别是如果被转移的后座议员 [de_jure|E] 是他们 [realm|E] 的一部分。"
 game_concept_treasury_vassal_development: "后座议员发展"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ 代表了 [tribal|E] [ruler|E] 对其 [vassals|E] 所施加的一般影响力。与 [crown_authority|E] 相比，它提供的权力更少，而且在较后阶段才显现。\n\n $game_concept_tribal_authority$ 有四个等级：[disparate_tribes|E]、[limited_tribal|E]、[high_tribal|E] 和 [absolute_tribal|E]。提升 $game_concept_tribal_authority$ 需要一定数量的 [prestige|E]，具体取决于等级和统治者的 [learning_skill|E]，但通常比提高王权权威更昂贵。\n\n#weak 后座议员不喜欢更高等级的 $game_concept_tribal_authority$，降低它是任何 [liberty_faction|E] 的主要目标。#!"
 game_concept_tribal_desc: "部落政党具有受限的选民 [development|E]，无法超越部落时代 [innovations|E]，无法建造新的 [holdings|E]，而且通常无法更改其 [succession_law|E].\n\n 但是，他们可以使用 [prestige|E] 而不是 [gold|E] 来建设他们的政党并雇佣 [men_at_arms|E]，并且相比 [feudal|E] 政党可以获得更多 [casus_belli|E]。非部落军队在敌对部落领地中会受到 [supply_limit|E] 惩罚。"
 game_concept_unassigned_vassal: "未纳税的后座议员"
 game_concept_unassigned_vassals: "未纳税的后座议员"
 game_concept_undirected_great_holy_war_desc: "$game_concept_undirected_great_holy_war$ 由 $doctrine_spiritual_head_name$ [head_of_faith|E] 宣布，目的是将 [kingdom|E] 纳入其 [faith|E] 的统治之下。\n\n$game_concept_undirected_great_holy_wars$ 不会立即爆发，而是进入 [preparation_phase|E]。\n\n 在战争前和战争期间，攻击方意识形态的统治者可以选择向 [war_chest|E] 捐赠 [gold|E]。\n\n 如果获胜，目标国家将被夺取并交给攻击方意识形态的角色。攻击方的奖励包括 [piety|E]，并可能使他们的 [dynasty|E] 在被征服国家中成为 [landed|E]。"
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] 在 [counties|E] 中获得一 [battle|E] [advantage|E] 来自其意识形态的人。"
 game_concept_usurp_title_desc: "外国[ruler|E]持有的[title|E]通常可以在超过#V 50%的40%内#!其[de_jure|E] [counties|E]在你[realm|E]内时被篡夺。这个过程会把[title|E]交给你，这对于确保你是[vassals|E]的[rightful_liege|E]尤其重要。\n\n如果当前持有者的[faith|E]与你敌对，剥夺会更困难;在这种情况下，只有当持有者在其党内不再拥有任何其[de_jure|E] [counties|E]权力时，篡夺才可能。"
 game_concept_varangian_adventure_desc: "这是一种特殊类型的 [war|E]，在这种情况下，攻击者打算将他们的 [realm|E] 整体移至 [war_target|E]。\n\n 如果他们获胜，他们将立即吞并相应的 [counties|E] 并将他们的 [capital|E] 移动到那里。他们的旧后排议员将独立，他们的旧 $game_concept_counties$ 将交给新兴的地方军阀。$game_concept_varangian_adventures$ 仅对 #EMP ONLY#! 可用 [duke|E] 和 $game_concept_count$-[title_tier|E] [rulers|E]，并且每次成功的 $game_concept_varangian_adventure_adventure$ 之后变得越来越昂贵。\n\n 这种 [casus_belli|E] 在 #EMP NEVER#! 之后永远不可用 $culture_era_tribal$ [era|E]，并且不能用于可以 $game_concept_varangian_adventure_adventure$ 的其他 [cultures|E] 或邻近的 $game_concept_rulers$。\n\n$north_germanic_group_collective_noun$ 发动第一次 $game_concept_varangian_adventure$ 的单位可获得最多 [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] 的奖金 [special_troops|E]，每控制 [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName] 内相同 [faith|E] 相同 [culture|E] 选区的数量越多，奖金越高。"
 game_concept_vassal: "后座议员"
 game_concept_vassal_contract: "后座议员合同"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$决定[vassal|E]与其[liege|E]之间的间的权[obligations|E]。\n\n [feudal|E]、[clan|E]、[administrative|E]和[nomadic|E] $game_concept_government_forms$的普通议员可获得不同的[obligations|E]，这些由每位后座议员单独协商。\n\n所有后座议员根据[obligations|E]向党魁缴纳其总[taxes|E]和[levies|E]的一定比例。#EMP 这些[modifier_contributions|E]又可以通过“细则”选项如[GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )]进行修改。#!\n\n 部分特殊合同仅限特定等级：\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V]和[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]：[duke|E]及以上 \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]：[count|E]及以上 \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]：仅[count|E] \n\n#weak Note，[governor|E] [obligations|E]也称为[province_administrations|E]。#!"
 game_concept_vassal_contracts: "后座议员合同"
 game_concept_vassal_desc: "$game_concept_vassal$是指向他人负责的政治家：对其[liege|E]为议员，对总理为党魁。\n\n议员向党魁提供[levies|E]和[taxes|E]——他们的[obligations|E]——以换取党鞭和支持。\n\n如果$game_concept_vassal$对其党魁的[opinion|E]较低，他们可能会加入[factions|E]，或是转[scheme|E]替代。"
 game_concept_vassal_directive: "后座议员指令"
 game_concept_vassal_directive_desc: "作为[liege|E]，您可以向您的[vassals|E]发布指令，影响他们的[councillor_tasks|E]以及他们建造的[buildings|E]。\n\n 要发布指令，您需要启用它，例如通过让#P 达到50#!或更多的[opinion|E]与后座议员。高级[government_forms|E]不需要此条件。"
 game_concept_vassal_directives: "后座议员指令"
 game_concept_vassal_limit: "后座议员限制"
 game_concept_vassal_limit_desc: "$game_concept_vassal_limit$ 决定了你可以合法拥有多少 [direct_vassals|E]（不包括 [barony|E] 级别的后座议员）。\n\n 虽然你可以超过你的 $game_concept_vassal_limit$，但这样做会降低 [taxes|E] 和 [levies|E] 你的后座议员提供的价值，你可能更好地 [transferring|E] 一些后座议员以保持在限额以下。"
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$定义[subject|E]为其[suzerain|E]提供多少[tax|E]和多少[levies|E]。主体的 [government_form|E]决定其$game_concept_obligations$如何被修改。\n\n#weak 例如，[GetGovernment('feudal_government').GetName]和[GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$取决于他们的[vassal_contract|E]，[GetGovernment('administrative_government').GetName]后座议员依赖于[province_administration|E]，而[tributary_possessive|E]则依赖于他们的[tributary_contract|E]。"
 game_concept_vassal_possessive: "后座议员的"
 game_concept_vassal_stance: "后座议员立场"
 game_concept_vassal_stance_desc: "每个 [vassal|E] 都有一个下席议员立场，这会影响他们作为你的 [liege|E] 对你的 [opinion|E]，以及他们偏好的 [heir|E] 接替 [realm|E]。\n\n处于相同立场的下席议员喜欢和不喜欢的事物相同。例如；所有 [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] 下席议员都不喜欢你失去 [wars|E]。\n\n每个下席议员立场偏好一个特定的继承人。在继承时，每个偏好的继承人与该立场的下席议员的 [legitimacy_expectations|E] 会较低。\n\n#low 下席议员立场包括：#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "后座议员立场"
 game_concept_vassal_taxes: "后座议员税"
 game_concept_vassal_taxes_desc: "你的$game_concept_vassal_taxes$包括你从[vassals|E]收到的[taxes|E]。金额取决于每位后座议员的[obligations|E]。\n\n从你的后座议员角度看，这些税被称为[liege_taxes|E]，是为了区别他们从自己$game_concept_vassals$征收的任何$game_concept_vassal_taxes$。"
 game_concept_vassals: "后座议员们"
 game_concept_vassals_possessive: "后座议员的"
 game_concept_victory_desc: "$game_concept_victory$ 是三种可能的 [peace_offers|E] 之一。[war|E] 中胜利的确切结果取决于 [casus_belli|E].\n\n对于进攻方来说，通常涉及在 [war_target|E] 区域内夺取 [titles|E]。\n\n对于防守方来说，胜利通常意味着进攻方必须支付巨额的战争赔款。"
 game_concept_virtue_desc: "每个 [rite|E] 都认为某些 [traits|E] 是美德。拥有这些特征的角色会从所有认为这些特征是美德的角色那里获得 [opinion|E] 的加成，即使他们不持有相同的意识形态。此外，拥有他们自己的意识形态认为是美德的特征的角色，每个月也将获得 [piety|E] 的额外加成。\n\n到底哪些特征被认为是美德，因意识形态而异，但通常由该意识形态的 [core_tenets|E] 和该意识形态所属的 [religion|E] 的组合决定。"
 game_concept_virtue_weight_desc: "特征可以具有相关的[sin|E]或[virtue|E]权重，由[core_tenets|E]和[doctrines|E]的[rite|E]以及它所属的[religion|E]决定。\n\n在意识形态中具有最高罪恶或美德权重的特征成为该意识形态的[sins|E]和[virtues|E]。"
 game_concept_wanderer_desc: "不属于任何[court|E]或拥有任何[titles|e]的角色被称为流浪者。他们环游世界，途中访问办公室，作为[guests|E]。流浪者可能成为[mercenary|E]队长、[holy_orders|E]领袖、[clergy|E]成员或[city|E]持有者。"
 game_concept_wanua_desc: "$wanua_government_adjective$ [government|E] 与 [GetGovernment('tribal_government').GetNameWithIcon] [government|E] 共享弱点，但 [domain_limit|E] 和 [vassal_limit|E] 较低。虽然他们使用 [gold|E] 来建造 [buildings|E] 并招募 [men_at_arms|E]，但从建筑物中获得的资金非常少。\n\n但是，他们可以 [barter_goods_i][barter|E]、[raid|E]，并且随着成为 [tributary|E] 获得 [legitimacy|E]，与 [GetGovernment('mandala_government').GetName] 政府存在协同效应。"
 game_concept_war_chest_desc: "$game_concept_war_chest$ 是 [gold|E]、[piety|E] 和 [prestige|E] 的集合。其内容主要用于成功赢得 [undirected_great_holy_wars|E] 的奖励，在此过程中根据参与 [war|E] 的情况分配给攻击方。\n\n $game_concept_war_chest$ 中的一定部分在开战时也会在攻击者之间分配。\n\n 如果 [undirected_great_holy_war|E] 被击败，防御方将分配 $game_concept_war_chest$ 中的政治资本和声望部分给他们 #weak（资金将丢失）。#!"
 game_concept_winter_desc: "冬季会随着时间逐渐消耗[supply|E]，使军队在受冬季影响的地区失去补给。补给惩罚会随严重程度增加。冬季有三种不同的严重程度：[Concept( 'winter_severity_mild', 'Mild' )|E]、[Concept( 'winter_severity_normal', 'Normal' )|E]和[Concept( 'winter_severity_harsh', 'Harsh' )|E]。"
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ 是对 $game_concept_yurt$.\n\n 的独特改进。从机械上讲，它们是 [domicile_buildings|E]——尽管许多代表社会习俗或仅仅是 $game_concept_nomad$ 部落关注的领域，而不是字面上的结构。\n\n 它们可以带来的加成包括：\n$EFFECT_LIST_BULLET$ 解锁 [court_positions|E] 和游牧 [decisions|E] 以及 [character_interaction|E]s\n$EFFECT_LIST_BULLET$ 对 [herd|E] 和 [county_fertility|E] 的各种加成，包括 [terrain|E] 专长\n$EFFECT_LIST_BULLET$ 解锁和提升游牧 [men_at_arms|E] 并增强 [horde|E] 的力量\n$EFFECT_LIST_BULLET$ 独特的游牧 [culture_tradition|E] 加成\n$EFFECT_LIST_BULLET$ 管理 [vassals|E] 和 [tributaries|E] 的方法，以及在您的办公室影响 [characters|E]。\n$EFFECT_LIST_BULLET$ [kurultai|E] 和 [obedience|E] 的加成。"
 maximum_piety_level_mandala: "\n\n然而，当一位 [mandala|E] [ruler|E] 以其 [aspect|E] 可接受的方式去世后，在达到 [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] 后，该统治者的 [heir|E] 将获得晋升到下一个政治资本等级的能力，直到达到 [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]。"
