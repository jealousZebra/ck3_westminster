 supply_tent_sutler_domicile_building: "大宗采购供应商"
 supply_tent_sutler_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('supply_tent_01').GetName]）#! 一家如果你礼貌询问并按时付款就给 A5 好价格的批发商。"
 witness_camp_officer: "背书官"
 witness_camp_officer_desc: "$witness_camp_officer$ 收集每一封支持信，并确保每个人都知道它们。"
