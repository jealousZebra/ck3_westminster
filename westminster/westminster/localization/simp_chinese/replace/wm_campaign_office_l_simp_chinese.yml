 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$提供各种工作，没有比任何一种更多\n$EFFECT_LIST_BULLET$可以更换为任何其他 $camp_purpose$ 无需花费 [prestige|E]\n\n#WEAK 一口袋传单，一口袋会员卡，还不知道这一切会通向何方。#!"
