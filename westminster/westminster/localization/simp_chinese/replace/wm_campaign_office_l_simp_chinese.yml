 huntperson_camp_officer_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] 随 [aptitude|E]\n$BULLET$ 增加 提升 [martial|E] [education|E] 对你 [children|E] 中所有 [camp|E]\n$BULLET$ 的结果可能 帮助筹集活动资金 [decisions|E]"
 kennelperson_camp_officer: "志愿者协调员"
