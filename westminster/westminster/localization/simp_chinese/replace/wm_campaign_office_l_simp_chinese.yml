 mess_tent_bakers_domicile_building: "培根卷"
 mess_tent_bakers_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('mess_tent_01').GetName]）#!\n周六早晨，门口活动之前。没人会错过它。"
 mess_tent_brewers_domicile_building: "咖啡机"
