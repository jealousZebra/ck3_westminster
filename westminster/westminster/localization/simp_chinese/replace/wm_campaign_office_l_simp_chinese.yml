 mess_tent_cooks_domicile_building: "志愿厨师"
 mess_tent_cooks_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('mess_tent_01').GetName]）#!\n不能拉票但能在预算内喂饱三十人的成员。"
 mess_tent_curers_domicile_building: "批量烹饪"
 mess_tent_curers_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('mess_tent_01').GetName]）#!\n为短期竞选的漫长夜晚准备满满一冰箱的辣椒。"
 mess_tent_herbalists_domicile_building: "健康零食"
 mess_tent_herbalists_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('mess_tent_01').GetName]）#!\n水果和饼干。一场小革命。"
 person_haggler_camp_officer: "交易经纪人"
