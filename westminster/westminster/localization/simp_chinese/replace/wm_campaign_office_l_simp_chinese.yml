 proving_grounds_camel_run_domicile_building: "乡村路线"
 proving_grounds_camel_run_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n没有街道名称的村庄、农场和小路：一项针对乡村的宣传计划。"
 proving_grounds_elephantry_reserve_domicile_building: "名人支持者"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n一名演员、一名足球运动员和一名电视厨师，他们会为摄像机出现。"
 proving_grounds_horse_run_domicile_building: "骑行拉票"
 proving_grounds_horse_run_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n长途骑行的自行车，以及小巴无法到达的园区。"
 proving_grounds_life_in_the_saddle_domicile_building: "公路上的生活"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n有些人只有在每天换一个城市时才会活跃起来。"
 proving_grounds_lockwagon_domicile_building: "共享资金"
 proving_grounds_lockwagon_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n每一笔捐款都汇入一个资金池，而资金池支付所有开支。大多数情况。"
 proving_grounds_martial_study_domicile_building: "活动案例研究"
 proving_grounds_martial_study_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n每一次选举之前都曾被争取过。阅读它是如何获胜的。"
 proving_grounds_mock_battle_drills_domicile_building: "模拟投票日"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n完整排演投票日的流程，从第一次叫醒到投票结束。"
 proving_grounds_nightly_barding_drills_domicile_building: "战斗巴士演习"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n装载、驾驶、卸货、拉票、重复，直到运作如钟表般精准。"
 proving_grounds_personal_bouts_domicile_building: "辩论练习"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n模拟竞选辩论，由工作人员扮演你最讨厌的对手。"
 proving_grounds_the_stick_game_domicile_building: "办公抽奖"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n关注结果、投票率以及哪个候选人最先哭。"
 proving_grounds_the_stump_domicile_building: "讲台"
 proving_grounds_the_stump_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n市场广场上的一个木箱，以及接受起哄的充分练习。"
 proving_grounds_training_circle_domicile_building: "角色扮演圈"
 proving_grounds_training_circle_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('proving_grounds_01').GetName]）#!\n愤怒的选民、担忧的选民、想谈垃圾桶的选民：每个人练习一切。"
 quartermaster_camp_officer: "办公经理"
 quartermaster_camp_officer_desc: "$quartermaster_camp_officer$负责管理竞选资金、文具柜和排班表。"
 second_camp_officer: "副竞选经理"
 second_camp_officer_desc: "$second_camp_officer$ 在候选人外出拜访时负责管理办公室，并让其他人保持工作状态。"
 stooge_camp_officer: "实习生"
 stooge_camp_officer_desc: "$stooge_camp_officer$ 负责复印、送咖啡以及所有别人不愿意做的工作。这会提高其他人的士气。"
 supply_tent_01_domicile_building: "印刷室"
 supply_tent_01_domicile_building_desc: "传单、海报、信封以及每个人都抱怨的那台打印机。竞选依靠纸质材料进行。"
 supply_tent_arsenal_domicile_building: "传单储备"
 supply_tent_arsenal_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('supply_tent_01').GetName]）#! 所有竞选活动曾设计过的传单盒，随时准备在一小时内分发给街头。"
 supply_tent_climbing_gear_domicile_building: "梯子与扎带"
 supply_tent_climbing_gear_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('supply_tent_01').GetName]）#!在选区的每一根路灯柱都是海报点，如果你能够到的话。"
 supply_tent_mender_domicile_building: "二手套件"
 supply_tent_mender_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('supply_tent_01').GetName]）#!捐赠的笔记本电脑和翻新的手机：不漂亮，但能用。"
 supply_tent_reserve_provisions_domicile_building: "储备基金"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('supply_tent_01').GetName]）#!为过去的两周预留的资金，每一英镑都算双倍。"
 supply_tent_reserve_water_domicile_building: "紧急花车"
 supply_tent_reserve_water_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('supply_tent_01').GetName]）#! 一罐小额备用金，用于那些没人预算到的开销。"
 supply_tent_smithy_domicile_building: "内部打印机"
 supply_tent_smithy_domicile_building_desc: "#weak（需要 [GetDomicileBuilding('supply_tent_01').GetName]）#! 后室的正规印刷机：不再等待一周才能出印刷品。"
 supply_tent_subdued_gear_domicile_building: "便衣"
