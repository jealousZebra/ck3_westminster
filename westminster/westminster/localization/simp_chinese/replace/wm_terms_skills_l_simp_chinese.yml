 ep3_governor_yearly.3040.a.flavor: "这样的孝道政治资本只会让我们双方都更强大。"
 ep3_governor_yearly.3040.desc: "我已经开始努力回忆——[emperor.GetPrimaryTitle.GetName]在高贵的[emperor.GetTitledFirstName]执掌[emperor.GetHerHis]权杖之前，真的只是彻底的黑暗与混乱吗？\n\n社交名流们难道只梦想与[emperor.GetHouse.GetName]共度时光吗？我们的士兵会喊出一些丑陋、杂乱陌生人的名字吗？我们的巨头们——他们会屈尊去亲吻不是由[ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip]完美之肉组成的脚吗？\n\n我其实无需记忆。如此质问我的君主毫无错误的使命是徒劳的。"
 ep3_governor_yearly.8070.desc: "荣誉、形象、权力。成为[ROOT.Char.GetTitleAsNameNoTooltip]或许能获得这些，但#! #EMP 代价......\n\n无数个[ROOT.Char.Custom('GetWritingMaterial')]蜷缩着，等待我的印章或浏览，而无尽的官僚们争夺轮到我耳边充斥着令人麻木的细节。\n\n没有人告诉我会有相当多#EMP #!的工作——而且这些工作最终似乎自己完成了。"
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "几十年来，我走在知识分子的脚步上，反对着男人们的愤怒。我的诗歌在党派品牌中不可避免地成长，然而......\n\n缺少了什么。如今我的暮年将至，也许是时候离开[cordoba.GetName]，开阔世界视野了？\n\n我内心另一部分不可分割的部分依然牵动着我，想留下。我在这里建立了生活，不仅为自己，也为多年来在这里受训的众多学徒。\n\n无论是因为穿梭于街头的学者，还是因为熟悉的墙#EMP 壁，#!让我与这座城市——我的家——紧紧相连。"
