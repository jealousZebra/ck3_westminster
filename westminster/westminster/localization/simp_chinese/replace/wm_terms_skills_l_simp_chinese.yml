 investiture_crisis_desc: "皇冠与牧杖关于谁拥有上帝谷仓钥匙针锋相对；世俗保护者给予主教以杖和戒指，而教会拒绝承认他们的授权。"
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$ 每个月都会寻找并照顾妃嫔中生病的成员，减轻他们的压力和困扰他们的症状。"
 kharijite_desc: "一个早期伊斯兰教派认为领导应基于政治资本，而非血统，堕落的统治者可以被免职。他们出现在什叶派动乱期间，拒绝双方，并宣布重罪者不属于伊斯兰教。"
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "这个 [modifier|E] 可以由负责解决它的 [adventurer|E] 通过外交、阴谋或耐力检查来移除。"
