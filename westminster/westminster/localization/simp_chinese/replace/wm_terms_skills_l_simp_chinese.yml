 mongol_invasion.1004.desc: "随着强大的[old_mongol_emperor.GetFirstName]——统治蒙古征服土地的主宰——的死去，几位继承者争相取代[old_mongol_emperor.GetHerHis]成为大汗。没有人会承认其他人的命令。\n\n因此，这标志着蒙古作为统一帝国的终结。\n\n这些第一位伟大征服者的后裔仍然保留一定实力。他们呼唤战争。但没有一个人，无论是[successor_1.GetName]，还是[successor_2.GetName]，能凌驾于其他人之上成为宇宙的统治者。"
