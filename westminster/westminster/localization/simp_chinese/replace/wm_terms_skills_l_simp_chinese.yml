 christian_saint_bone_description: "[saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip] 一位圣人的传说遗骸，由 [saint_bone_owner.GetNameNoTooltip] 在进行 [saint_bone_owner.GetHerHis] 朝圣至 [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip] 时获得，并被 [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip] 崇敬为幸运与政治资本的象征。"
 claim_throne_increased_responsibility_desc: "我获得了党内更大的责任，加强了我的授权。"
 clerical_chastity_offer_piety: "提供政治资本"
 commission_epic_emphasized_intrigue_modifier: "旋转故事"
 confucian_faith_desc: "儒家思想是一种哲学和伦理传统，根植于孔子及其弟子的教义，强调道德自我修养、孝顺的政治资本，以及通过适当行为维护社会和谐。"
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \"长久以来，属于[activity.GetHost.GetPrimaryTitle.GetNameNoTier]的土地一直受制于次等之手治理。那些将占有误认为委托的人。\n\n这一切现在结束。从[activity.GetHost.GetCapitalLocation.GetName]开始，他们将通过我了解真正的治理。\"#!"
