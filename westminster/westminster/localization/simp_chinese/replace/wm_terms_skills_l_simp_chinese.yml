 coronation_legitimacy_memory_desc_third_perspective: "[owner.GetTitledFirstName] 参加了 [host.GetTitledFirstNamePossessive] 的加冕，并获得了 [owner.GetHerHis] 的授权被 [host.GetTitleAsNameNoTooltip] 承认。"
 court_brahmin_court_position_desc: "婆罗门是一位在印度教和佛教法庭中都能找到的尊敬祭司，负责主持仪式、监督仪式并弘扬统治者的命令。"
