 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] 亲自下令通过皇帝诏书立即任命我。没有人可以挑战我在 [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] 中的新身份的命令。"
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip]军队无法匹敌我强大的武器，这证明了我作为[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]守护者更伟大的使命。"
 ep3_decisions_event.0007.desc: "就这样，[Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] 再次被安抚。我的力量和权力的授权已得到再次确认.\n\n"
 ep3_decisions_event.9010.desc: "我深吸一口气，然后呼气，将鱼线抛入水中。钩子轻轻‘扑通’落下，世界静了下来。\n\n 我的视线沿着海岸线游移，有片刻独处来整理思绪。作为一个冒险者的生活并不那么糟，但没有哪种生活是没有压力的。我闭上眼睛休息片刻，却突然被什么东西拉走鱼竿惊醒。"
