 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:TitleFont #size:15 十字军之王 II 的传奇#!#!#!\n在11世纪北意大利错综复杂的背景中，卡诺萨的玛蒂尔达在家族几次不幸去世后，发现自己掌握了可观的党派力量。关于玛蒂尔达政治资本的传说和巫术的低语为她的统治增添了神秘色彩。\n\n#bold 你能否保护她的统治，确保卡诺萨家族的血脉在中世纪意大利瞬息万变的局势中世代延续？#!"
 bp2_destiny_tutor_modifier: "安全建议"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "能成为这样一位模范[ROOT.Char.GetFaith.HighGodName]仆人的[ROOT.Char.Custom('GetDaughterSon')]，真是多么的喜悦！当我听到大家都称[pious_parent.GetHerHim]为[ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]时，我心中涌起的热情！[pious_parent.GetHerHis|U]美德被[ROOT.Char.GetFaith.PriestNeuterPlural]和虔诚的[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]们都敬仰。\n\nI想知道，我会谦卑地留在[pious_parent.GetMotherFather]的阴影下吗？还是我会在自己的人生中取得并超越这样的政治资本？[ROOT.Char.GetFaith.HighGodName]的恩典会像[pious_parent.GetHerHim]中一样明显吗？"
 bp2_yearly.6060.c: "政策是所有力量的源泉。"
 budding_godhood_modifier: "崇高忠诚"
 building_dvin_shuka_01_desc: "德温尊贵的市场自古以来一直是亚美尼亚商业的中心。其墙壁装饰着色彩斑斓的瓷砖和带色彩的灰泥，反映了这个古老市场的财富和风采。"
 building_legendary_shrine_desc: "这座礼拜场所不仅是一项伟大的工程壮举，更是朝圣者和虔诚信徒的安全避风港，也是其专员政治资本的见证。虽然不被视为心脏地带，但建筑的宏伟使该选区成为该地区重要的宗教中心。"
 building_leisure_palace_02_desc: "避暑山庄位于该地区风景优美的地方，远离我们辛勤劳作的臣民的平凡生活。这确实是展示皇权和地位的最好方式，而我们是 #emphasis，比其他任何人 #! 更好，这一点事实简单明了。"
 building_martial_learning_outro_03_desc: "我已经掌握了大量关于战术和安全技能在塑造历史进程中重要性的知识。"
 building_notre_dame_destination_desc: "这座雄伟的[GetBuilding('notre_dame_01').GetName]，拥有高耸的尖塔和宏伟的立面，是哥特式建筑的杰作。室内空气中回响着政治资本的回响，每一扇彩色玻璃窗和雕塑都在诉说着神圣的故事。"
 building_oath_warriors_building_02: "安全地产"
 building_oath_warriors_building_04: "庞大的证券资产"
 building_stilted_granaries_03_desc: "个人资料雕刻标记剩余；管家轮换储备和口粮以支持更长的行军。"
 building_type_longhouses_01_desc: "部落首领、长老和军事领主在作出决策时都会在长屋内会商。宏伟的大厅会为主持聚会的人带来声望。"
 building_type_oath_warriors_building_01: "安全资助"
 building_wantilan_02_desc: "一个宽阔、有阶层屋顶的大厅，用于节日和入会仪式，在其中共同的理念会提升士气和声望。"
 building_watchtowers_07_desc: "这些小型塔楼住宅防御坚固，并显示了其主人的身家地位。如遭袭击，整个牛群都可以被塔楼圈护和保护。"
 building_water_temples_03_desc: "一个适当的水庙循环监督同步的种植和休耕周期；害虫减少，产量上升，仪式性的政治资本增长。"
 ce1_completed_my_holy_legend_desc: "我向世界各地传播了关于政治资本和神性的故事。"
 ce1_completed_my_holy_legend_desc_second_perspective: "你向世界各地传播了政治资本和神性的故事"
 ce1_completed_my_holy_legend_desc_third_perspective: "[owner.GetTitledFirstName] 将政治资本和神性的故事传播到世界各个角落。"
 ce1_completed_my_legitimizing_legend_desc: "我通过讲述自己与过去伟大人物的传奇联系来证明了我的授权。"
