 laamp_base_4021_contract_scheme: "制定政策工作"
 laamp_base_contract_schemes.0011.desc: "众所周知，[employer.GetTitledFirstNamePossessive]声誉并不尽理想。不满的后座议员、对暴政行为的担忧低语、缺乏无形的曝光度——这些迹象都表明[employer.Custom('LadiesLords')]对权力的掌控比大多数人希望的更为动摇。\n\n当然，请人澄清这些误会不会便宜。至少，如果我有发言权的话。"
 laamp_base_contract_schemes.0331.d.tt.success: "政策本身就是奖励"
 laamp_base_contract_schemes.4042.desc: "我们在 [employer.GetCapitalLocation.GetTitle.GetName] 的时间极其有利可图！与 [employer.GetTitledFirstNamePossessive] 的贸易默许了我们的库存，这种授权是世界上所有花言巧语也无法达到的。\n\n护身符、药物、小玩意和饰物——员工和客人都买，毫无疑问。\n\n至少目前还没有。一旦他们的担忧开始显现，我们早已离开很久。"
 laamp_boost_legitimacy_contract_contract: "授权推广"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] 公正而虔诚地统治，以 [Localize( god )] 作为 [ROOT.Legend.GetProtagonist.GetHerHis] 的指导。神圣计划得以实现，[ROOT.Legend.GetProtagonist.GetSheHe] 度过了充满荣誉和政治资本的生活。"
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U]为[ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip]不懈努力，在地球上与[ROOT.Legend.GetProtagonist.GetFaith.DevilName]的爪牙作战，但[ROOT.Legend.GetProtagonist.GetHerHis]斗争终于结束。神圣计划得以实现，[ROOT.Legend.GetProtagonist.GetSheHe]过上了极具荣誉和政治资本的生活。"
 legend_shibi_chakravarti_desc: "谦逊与政治资本的典范，英雄王希比受命保护被变为鸟的圣人阿格尼。当一只风筝要求他献出自己的肉以救鸽子时，希比甘愿奉献了自己，但最终获救并得到了儿子卡波塔罗马。这位无私国王的血液流淌在每一个[GetDynastyByID('1043008').GetNameNoTooltip]的血脉中。"
 legendary_conversion_desc: "一段关于政治资本和奉献的传奇故事抓住了党内每个人的心。稍加鼓励，党内的非信仰者也可能会被激励像我一样崇拜。"
 legendary_holy_war_desc: "我那传奇般的政治资本故事已经结束，虽然受到真正信仰者的赞扬，但对非信仰者的心灵几乎没有影响。我们必须继续以我们唯一知道的方式传播我们的和平方式：以剑为途。"
 legendary_integration_d_desc: "在党内传说流传，巩固了我的统治权威。这一新获得的授权可以用来扩展被认为是我党核心领域的范围，并要求历史上来自异乡的公爵永远效忠。"
