 tradition_tgp_fortified_strongholds_desc: "这种文化以大型防御城市为特征，这些城市承担着宗教、军事和政府的职能。保护这些文化堡垒至关重要，后续城市的建立也极具影响力。"
 tradition_tgp_warrior_monks_desc: "对道德生活的忠诚不应排除使用武力，尤其是在需要保护宗教社区免受对立教派和腐败官员侵害，或保护贫困者时。"
