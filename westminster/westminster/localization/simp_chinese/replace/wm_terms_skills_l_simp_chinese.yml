 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ 从多种本地动物中选择猎物\n$EFFECT_LIST_BULLET$ 增加$trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$更高的[hunt_danger_no_prefix|E]奖励 更多[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$安全性别可以积极参与\n$EFFECT_LIST_BULLET$ 非武猎性别可以观战\n#weak 骄傲狡猾的野兽在荒野中游荡;智胜和克服它们考验勇气并磨练技能。#!"
