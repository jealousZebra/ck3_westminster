 tenet_adoptionism_historical_desc: "采纳论教导耶稣是以普通人的身份出生，后来在受洗时圣灵降临于他时通常被“采纳”为上帝之子。早期形式出现在2世纪，由拜占庭的特奥多图斯提出，他的动态一元论强调上帝的统一性。\n\n该教义在8世纪西班牙重新出现，由托莱多大主教埃利潘杜斯和乌尔赫尔主教费利克斯推行，他们认为基督的神性是永恒生成的，而人性是被采纳的。法兰克福内阁在公元794年谴责西班牙采纳论为分裂主义，但采纳主义思想仍对后来的反三位一体运动产生影响。"
 tenet_apostolic_succession_episcopate_modifier_desc: "这个角色的意识形态通过一条不间断的早期主教血脉按立了每位主教：这是尊贵使命的历史来源。"
 tenet_filial_piety_desc: "孝顺的政治资本和对长辈的服从是人性善良实现的基础。当我们的父母在世时，我们礼貌地侍奉他们，用自己的能力支持他们，向他们学习；当他们去世时，我们礼貌地安葬他们，然后礼貌地祭拜他们。"
 tenet_miles_christi_historical_desc: "“基督士兵”（Miles Christi）的概念在基督教传统中有着深厚的根源，起源于圣保罗的书信，他用军事比喻来描述灵性生活。在中世纪，这一概念被应用于字面和精神上的战争。\n\n 军事团体如圣殿骑士团和医院骑士团体现了这一理想，将修道纪律与武力结合起来。克莱尔沃伯的伯纳德在《新军赞》中称赞这些武士僧侣是基督教美德的典范，他们战斗不是为了世俗利益，而是为了捍卫基督教世界。"
 tenet_philanthropia_historical_desc: "在拜占庭基督教中，philanthrōpia 既指普遍的爱的美德，也指由皇帝、主教和信徒支持的具体机构——医院、招待所、孤儿院和施舍。凯撒利亚的巴西尔、约翰·金口和后来的皇帝如查士丁尼等将关爱贫困者与皇权命令联系起来。教会并不将战争视为通向圣洁的途径，但它确实坚持财富和权力在一定程度上通过服务贫穷而获得正当性。"
 tenet_vows_of_poverty_desc: "金钱腐蚀人的心灵，把人们推离真正的理念。如果我们要专注于真正重要的事情，就必须摒弃对物质财富的追求，选择谦逊的活动，并在完成这些活动中获得政治资本。"
