 game_rule.1101.desc.combat.locale.southwark: "英格兰最富有的城市如此接近，一切都值得奋争。不论是房屋还是赃物，荣耀还是政治资本，双方的军队一次又一次地冲撞在一起。\n\n泰晤士河南岸因我们的鲜血而泡沫翻腾，但我不会放弃，我将#EMP 不会#!退缩。\n\n英格兰已经属于我，这场战斗将证明这一点，而这只需最后一次#EMP 冲刺#!来证明——"
 generic_rite_focus_tenet_cranial_trophies: "这种意识形态将敌人的遗骸视为胜利的神圣证据和可怕的象征。"
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] 将敌人的遗骸视为胜利的神圣证明和恐怖的象征。"
 glory_hound_desc: "$glory_hound$ [vassals|E] 关心地位和声望，并向世界展示他们所属党派的实力。大胆或冷酷的后座议员通常采用这种 [vassal_stance|E].\n\n#low $glory_hound$ 后座议员喜欢当他们的党派领导:#!\n$EFFECT_LIST_BULLET$拥有任何分区 [succession_law|E]\n$EFFECT_LIST_BULLET$实现 [victory|E] 在进攻 [wars|E]\n$EFFECT_LIST_BULLET$邀请他们参加 [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ 后座议员不喜欢当他们的党派领导:#!\n$EFFECT_LIST_BULLET$拥有高 [crown_authority|E]\n$EFFECT_LIST_BULLET$签署 [defeat|E] 或 [white_peace|E] 在战争中\n$EFFECT_LIST_BULLET$[marries|E] 一个 [lowborn|E] 角色作为 [primary_spouse|E]\n\n他们更喜欢大胆勇敢 [heirs|E] 并且拥有高 [martial_i][martial|E] 技能。"
 grand_ambitions.0180.desc: "我站在 [hof.GetTitleAsName] 面前，他是我族的精神领袖。空气中弥漫着沉香的香味和数世纪的厚重。\n\n赢得 [hof.GetHerHis] 的青睐不仅会为我对 [target_title.GetName] 的主张赋予权威，还可能影响帝国内信徒的心。[hof.GetSheHe|U] 必须加冕我。\n\n[hof.GetTitleAsNameNoTooltip] 不是普通的精神人物；[hof.GetSheHe] 清楚地意识到 [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] 世俗的权谋。"
