 iberia_north_africa.0111.desc: "花了多年时间建立政治和精神团结，召集这次选举会议，但我终于拉拢了足够多的农民和党内官员，从而有意义地否定了虚假的[pope.GetTitledFirstName]。\n\n 现在，[religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier]的通道和客房里挤满了争辩的神职人员和激情的主教;每一个受害的修士和罗马曾经冷落过的琐碎的修士和小[religious_leader.GetFaith.PriestNeuter]都堵满了我的殿堂。\n\n 这场辩论对授权至关重要，但最终，作为最高[religious_leader.GetFaith.GetAdjective]统治者，#EMP my#!这个词将成为最终决定性投票。"
 iberia_north_africa.0112.desc.righteous: "收回 [religious_leader.GetSheHe] 所认为的已经感染大量 [religious_leader.GetFaith.GetReligion.GetName] 的罪恶暴力。\n\n 根据 [religious_leader.GetHerHim] 的说法，[religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] 应该关注过上好日子的政治资本，而不是试图以对手的血铺路通向 [religious_leader.GetFaith.PositiveAfterLife]。"
