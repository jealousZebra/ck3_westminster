 historical_character.mibu_tadamine: "尽管出身卑微，$Tadamine$在参加比赛后因其和歌诗作而获得了巨大党派品牌，并获得了皇室委任和藤原家的赞助。与他的儿子$Tadami$一起，他被列为日本三十六位不朽诗人之一，约有八十一首诗被认为收入了皇室选集。"
 historical_character.namdev: "纳姆德夫是13世纪的马拉地教派圣人和诗人，以献给维托巴的虔诚信歌而闻名，同时也是马哈拉施特拉俾克蒂运动的重要人物。他的作品深受普通百姓喜爱，也极大地提高了马拉地语作为诗歌和政治阵地语言的传播与知名度。"
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ 寻找在该地区出现的神秘动物\n$EFFECT_LIST_BULLET$ 增加 $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ 更高的 [hunt_danger_no_prefix|E] 提供更多 [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ 安全性别可参与\n$EFFECT_LIST_BULLET$ 非战斗性别可旁观\n#weak 学者通常将神秘生物视为传说，但森林中可能仍隐藏着许多奥秘。#!"
