 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "终于！[faction_target.GetName]不过是个小丑在扮演[faction_target.GetTitleAsNameNoTooltip], 我相信党派会支持我的事业。那些帮助我的人将不会被遗忘。"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] 占据了本应属于你的王位！我愿意用言辞和武力支持你的主张，我相信党内其他人也会支持这个正当的事业。你所需要做的就是接受。"
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "终于！[faction_target.GetName]不过是个小丑在扮演[faction_target.GetTitleAsNameNoTooltip], 我相信党派会支持我的事业。那些帮助我的人将不会被遗忘。"
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] 占据了本应属于你的王位！我愿意用言辞和武力支持你的主张，我相信党内其他人也会支持这个正当的事业。你所需要做的就是接受。"
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "终于！[faction_target.GetName]不过是一个扮演[faction_target.GetTitleAsNameNoTooltip]的小丑，我相信党派会响应我的事业。\n\n由于我目前卑微的地位，我无法帮助你。但请记住——#emphasis 当#!你获得胜利时，我一定会让你得到丰厚的奖励！"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "虽然我很高兴看到党派反对虚假的 [faction_target.GetTitledFirstName]，但我目前的困境阻止我加入你们的正义行动。如果你们成功，我将对你们感激不尽。"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "我很清楚，你宁可看到党被烧毁也不愿放弃这个愚蠢的冒险。为了党的利益，我必须接受你的要求，但请记住，今天这里发生了一件巨大的不公。这是不能容忍的！"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "我很清楚，你们宁愿看到党派燃烧，也不会放弃这个愚蠢的计划。为了[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]的利益，我必须接受你们的要求，但要知道，今天这里发生了一场巨大的不公。这不能容忍！"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n 我们错误的要求只会削弱我们所有人。无论如何，为了避免党无谓流血，我不得不接受你们的独立请求。"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "我很清楚，你们宁愿看到党派燃烧，也不会放弃这个愚蠢的计划。为了[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]的利益，我必须接受你们的要求，但要知道，今天这里发生了一场巨大的不公。这不能容忍！"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n 党的忠诚臣民已经忍受你们错误的政策太久了。[faction.GetName]要求你们同意[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]的新方向，否则我们将强行给你们！"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "时刻已经到来！所有支持废除[faction_target.GetTitledFirstNamePossessive]误导性政策的人现在将团结一致，确保党派走向新的方向。我们将看到它实现，如果必须，我们就用剑与火！"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n 我们错误的要求只会削弱我们所有人。无论如何，为了避免党无谓流血，我不得不接受你们的独立请求。"
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n 你自私的“自由”观念会削弱整个党。不过，为了避免不必要的流血，我会接受你们的要求。"
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n 现在是你承认你后座议员的古老且不可剥夺权利的时候了！接受[faction.GetName]的要求，否则在战场上面对我们的剑！"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "好吧！我的党派没有你们这些不洗洁羊群的地方。"
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "我们将不再容忍你对骄傲的 [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] 的卑劣压迫。生来自由行走在这片广阔天空下，我们拒绝你的暴政——我们的时刻已经到来！\n\n 我们将永远摆脱你和你的党派领导人 [faction_target.GetTitledFirstName] 的统治！！"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "我们不会允许你们的 [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] 统治再继续压迫我们。[peasant_leader.GetRite.GetName|U] 必须被公认为 [ROOT.Char.GetPrimaryTitle.GetName] 中最杰出的 [rite|E]！\n\n 给我们的意识形态以应得的地位，否则准备面对我们众多信徒的愤怒！"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "我们不再容忍你对善良 [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] 的卑劣压迫。我们的时刻已经到来！\n\n 我们将从你的统治以及你党派领导人 [faction_target.GetTitledFirstName] 的暴政中解放自己！"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "我们不再容忍对 [peasant_leader.GetCulture.GetName] 传统的外来压迫。我们的时刻已经到来！\n\n 我们只会接受从你的党派领导人 [faction_target.GetTitledFirstName] 那里获得完全自由！"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "我们不再容忍你对忠诚 [peasant_leader.GetFaith.GetAdherentNamePlural] 的卑劣压迫。我们的时刻已经到来！\n\n 在 [peasant_leader.GetFaith.WarGodName] 的引导下，我们将起来摆脱你党派领导人 [faction_target.GetTitledFirstName] 的统治！"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N 如果你的党领袖向他们的要求投降，你的党将失去一部分！#!"
