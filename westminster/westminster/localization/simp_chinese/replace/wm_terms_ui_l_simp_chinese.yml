 action_grant_vassal_to_rightful_liege: "@vassal_icon! 可将后座议员授予合法党派领导人"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] 当你不是合法党派领导者时，给予你较少资源，并且你的[opinion|E]会减少。有时最好将这些后座议员归还给他们合法的党派领导者，前提是他们也是你的后座议员。\n\n 有时将后座议员归还给他们合法的党派领导者意味着你获得的收益较少，但通常仍值得归还——因为他们合法的党派领导者会因你占有他们认为是自己的人而对你产生很大的意见惩罚。\n\n 保持良好的后座议员结构是党派稳定的关键。#!"
