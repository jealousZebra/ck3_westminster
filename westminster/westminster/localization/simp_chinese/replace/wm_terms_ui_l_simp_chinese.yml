 action_in_debt_desc: "你拥有的 [gold_i|E]#V 0#! [gold|E] 以下，因此你处于 [debt|E] 状态！\n\n负债的影响如下：\n$BULLET_WITH_TAB$无法宣布 [war|E]\n$BULLET_WITH_TAB$无法增强需要 [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] 的 [men_at_arms|E]，你的 [domain|E]\n$BULLET_WITH_TAB$[vassals|E] 中的传播更可能加入 [factions|E]\n\n。负债越深，你面临的惩罚就越严厉。你当前的负债等级还会产生以下额外影响：\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help 如果你每个月没有获得资金，考虑减少开支，例如：\n$BULLET_WITH_TAB$解散你的 [armies|E]\n$BULLET_WITH_TAB$缩减或销毁你的 [men_at_arms|E]\n$BULLET_WITH_TAB$增加 [control|E] 使用你的 [marshal|E]\n$BULLET_WITH_TAB$撤销 [court_positions|E]#!"
 action_in_debt_landless_desc: "你拥有的 [gold_i|E]#V 0#! [gold|E] 以下，因此你处于 [debt|E] 状态！\n\n负债的影响如下：\n$BULLET_WITH_TAB$无法宣布 [war|E]\n$BULLET_WITH_TAB$无法使用 [gold_i|E][gold|E]\n\n 来增强 [men_at_arms|E]。负债越深，你面临的惩罚就越严厉。你当前的负债等级还会产生以下额外影响：\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help 考虑采取 [task_contract|E] 来赚取一些资金#!"
