 special_doctrine_ecumenical_miaphysite_desc: "尽管有单独的等级结构，密利理派教会仍保持完全共融，相互承认对方的圣礼和党务官员。"
 special_doctrine_full_tolerance_desc: "每个人都可以自由选择自己的意识形态。我们的差异不会分裂我们，反而让我们更强大。"
 special_doctrine_is_christian_faith_desc: "世界上有些人遵循耶稣的教导，但不承认他的神性。虽然这是亵渎，但我们仍应对这些迷失的灵魂表示同情，因为他们有一天可能会成为真正意识形态的信徒。"
 special_doctrine_is_eastern_faith_desc: "我们在一起并非被单一意识形态所束缚，而是被构成我们社会宗教结构的多种意识形态所联系。尽管我们可能称自己为不同的名字，走不同的道路，但一些来自我们自身信仰体系之外的人已经学会在我们的社会中共存，仿佛他们是我们的一部分。"
 special_doctrine_not_allowed_to_hof_desc: "这种意识形态的高级祭司职务已经被完全拆除。任何试图任命高级祭司的行为，首先都需要对传统教会结构进行彻底重建。"
