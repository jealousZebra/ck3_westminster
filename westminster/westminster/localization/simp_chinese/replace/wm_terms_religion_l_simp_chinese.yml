 doctrine_family_rites_name: "家庭理念"
 doctrine_head_of_faith_name: "运动领袖"
 doctrine_monasticism_accepted_desc: "修道生活是被允许的，但不是意识形态的核心。虔诚者可以发誓并退隐到宗教场所，但传统并不强调修道主义为理想之路。"
 doctrine_monasticism_forbidden_desc: "这种意识形态明确反对修道生活。禁止宣誓入教，并且那些拥有修道特质的人在该意识形态眼中被视为罪犯。"
 doctrine_mythic_literary_desc: "这种意识形态通过神灵行为的故事传播和延续，其中许多被收集在文学作品中。"
 doctrine_no_head_descriptive_name: "无运动领袖"
