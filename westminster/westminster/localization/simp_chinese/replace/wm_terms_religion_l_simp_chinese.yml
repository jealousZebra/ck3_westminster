 doctrine_parameter_spiritual_head_of_faith: "[head_of_faith|E] 的职位被授予一位显赫的党内官员成员。"
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "如果意识形态已[great_holy_wars|E]，运动领袖可以指挥战争并选择战争目标"
 doctrine_pilgrimage_encouraged_desc: "这种意识形态鼓励其成员前往被视为具有精神意义的世俗地点，以此向[ROOT.Faith.PantheonTerm]表示敬意。"
 doctrine_pilgrimage_forbidden_desc: "[ROOT.Faith.HighGodName] 的存在无处不在，而且某些地方比其他地方更加神圣的观念简直令人分裂。"
 doctrine_pilgrimage_local_rites_desc: "这种意识形态的信徒更喜欢在地方神殿中遵循日常意识形态所带来的舒适与稳定，而不是长途朝圣所带来的危险和压力。"
 doctrine_pilgrimage_local_rites_name: "地方意识形态"
 doctrine_pluralism_fundamentalist_desc: "我们的意识形态是真正的意识形态，我们的话是真正的话。任何偏离 [ROOT.Faith.ReligiousText] 的行为本质上都是亵渎。"
 doctrine_sacraments_absent_desc: "这一传统不强调圣礼或正式的神圣意识形态体系。宗教生活并不以党官的仪式管理或特定仪式的重要性为中心。"
 doctrine_sacraments_general_desc: "这种意识形态赋予圣礼和神圣意识形态核心重要性。仪式不仅仅是象征性的，而是唤起神圣的存在。党官员进行管理，信徒可能会被逐出教会。"
 doctrine_spiritual_head_desc: "物质世界与精神世界不同。我们必须确保精神世界拥有自己的领导者，以引导我们，并保护我们的意识形态不被物质欲望亵渎。"
 doctrine_status_mainline: "主要政策立场"
 doctrine_status_rite: "意识形态政策立场"
 doctrine_status_rite_mainline: "主要政策立场"
 doctrine_temporal_head_desc: "精神与肉体本质上是紧密相连、完整且不可分割的。让一个政党有两个不同的领导者是愚蠢的。"
