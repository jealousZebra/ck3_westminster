 doctrine_clerical_succession_conditional_desc: "更换神职头衔持有者的权利尚未确定。这种有争议的安排不可避免地将意识形态引向 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]。"
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U]最终是党的仆人，因此应该可以被党魁聘用和解雇，只有很小的限制。"
 doctrine_deviancy_virtuous_desc: "肉体的欢愉将我们带向神圣，因此那些不受传统欲望束缚的人是我们意识形态中至高的美德。"
