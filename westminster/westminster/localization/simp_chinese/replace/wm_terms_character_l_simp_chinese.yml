 claimant_faction_member_opinion: "登基的党派领导人"
 convert_to_religion_interaction: "采用意识形态"
 council_interaction.0001.desc.accept: "我将立即开始履行我的新职责，并将在下次内阁会议上见到你！"
 county_capital_province_modifier: "选区首府"
 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "我们一定站在那里讨论适当的修饰和外表的法律好几个小时，激烈地向对方挥手，引用办公室里很少有人知道的古老法律。当喧嚣的烟雾消散后，"
 court_amenities_interactions.0002.desc_lost: "我震惊地发现我实际上违反了法律！\n\n 我尴尬地站着，[debate_locale.GetNameNoTierNoTooltip] 的城堡守卫和造型师将我脱至内衣，然后继续脱光！暴露在办公室，我夹着尊严逃离现场。"
 court_amenities_interactions.0002.desc_won: "看起来我赢了！\n\n 因此，[recipient.GetName] 被迫脱至 [recipient.GetHerHis] 内衣！办公室里所有在场的人都看到了 [recipient.GetHerHim]，正如 [ROOT.Char.GetFaith.CreatorName] 创造 [recipient.GetHerHim] 的样子！"
 court_amenities_interactions.0003.desc_won: "看起来我赢了！\n\n 因此，[actor.GetName] 被迫脱至 [actor.GetHerHis] 内衣！办公室里所有在场的人都看到了 [actor.GetHerHim]，正如 [ROOT.Char.GetFaith.CreatorName] 创造 [actor.GetHerHim] 的样子！"
 courtly_friends_opinion: "办公友谊"
