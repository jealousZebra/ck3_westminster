 backwater_county_modifier_desc: "他们越大，跌得越惨。这个选区，曾经是不可一世的希拉斯统治者的领地，可惜如今已陷入耻辱之中。虽然目前只是昔日辉煌的影子，这个选区很可能再次崛起，重现伟大。\n\n#X @warning_icon! 此修饰符可通过 [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] 一旦 [development|E] 的 [county|E] 达到 #V 50#! 或以上时移除！#!\n\n"
