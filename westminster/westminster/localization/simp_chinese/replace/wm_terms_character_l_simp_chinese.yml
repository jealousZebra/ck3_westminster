 celestial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 统治者可以在所有可用的 [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline 之间切换:3 所有拒绝撤销头衔或撤回后座议员的后座议员都被视为 [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! 成本降低"
 char_interaction.0001.desc: "我接受你宽厚的附庸提议。我的党领袖！"
 char_interaction.0002.desc: "我不需要你的保护，更愿意将我党的赏金留给自己。"
 char_interaction.0010.a: "我的政党领袖！"
 char_interaction.0090.from_ward.desc: "我担心在你办公室的教育已经不再适合我的需要。我将立即返回 [capital.GetNameNoTierNoTooltip]。"
 char_interaction.0090.one_ward.desc: "我担心 [ward.GetTitledFirstName] 在你办公室的教育已经不再适合我们的需求。[ward.GetSheHe|U] 特此被召回我们照看。"
 char_interaction.0090.two_wards.desc: "我担心 [ward.GetTitledFirstName] 和 [ward_2.GetTitledFirstName] 在你办公室的教育已经不再适合我们的需求。他们特此被召回我们照看。"
 char_interaction.0180.desc: "作为你的议会领袖，我已决定你必须接受 [puppet_or_actor.GetFaith.GetName]，唯一正确的意识形态。我担心你在此事上没有选择。"
 char_interaction.0180.desc.liege: "作为你的党魁，我要求你放弃你错误的意识形态，立即加入我成为同样的 [puppet_or_actor.GetFaith.GetAdherentName]。"
 char_interaction.0181.desc: "好吧，我会接受[puppet_or_actor.GetFaith.GetAdjective]意识形态，尽管放弃这么多熟悉的东西会让人觉得奇怪。"
 char_interaction.0182.desc: "我永远不会放弃我的思想，反而会创立我自己的家族！"
 char_interaction.0190.desc: "好吧，我会接受[puppet_or_actor.GetFaith.GetAdjective]意识形态，尽管放弃这么多熟悉的东西会让人觉得奇怪。"
 char_interaction.0191.desc: "我的意识形态是我存在的核心——我永远不会放弃它。"
 char_interaction.0200.desc: "我得出结论，你无法被委以 [landed_title.GetName] 的尊严和责任。因此，为了党的更大利益，我从此剥夺你的这一头衔。"
 char_interaction.0211.desc: "我非常感谢你慷慨地邀请 [secondary_recipient.GetShortUIName] 成为我的后座议员，但恐怕我必须拒绝。"
 char_interaction.0220.desc: "我接受你收回对我的党籍成员 [secondary_recipient.GetShortUIName] 的指控，尽管我认为这是不公的。"
 char_interaction.0221.desc: "我不能背叛 [secondary_recipient.GetShortUIName] 的效忠誓言。我会保护我的党籍成员，即使这意味着违反我对你的誓言。"
 char_interaction.0232.liege: "我不会袖手旁观，让我们的党领滥用 [actor.GetHerHis] 忠诚的后座议员。我敦促你加入我，参与推翻这位暴君的斗争。"
 char_interaction.0232.regent: "我不会袖手旁观，让 [actor.GetSheHe] 滥用 [ceremonial_liege.GetTitledFirstNamePossessive] 忠诚的后座议员。我敦促你加入我，参与推翻这位暴君的斗争。"
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n我一直是你的好后座议员，但你肯定也明白我也有自己的臣民！\n\n我目前的合同非常严格，你肯定能理解放宽它的明智之处吧？\n\n而且，你 #emphasis 确实欠我！#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n为了表彰我们的奉献及对 [recipient.GetPrimaryTitle.GetNameNoTooltip] 的尊敬，我请求你通过授予 [SCOPE.Custom('CelestialTributaryRequest')] 来尊重这种忠诚。\n\n愿此恩惠加强你王位与我们卑微党派之间的和谐。"
 char_interaction.0271.desc: "根据 [intermediary.GetTitledFirstName] 授予我的办公室权限，我正在纠正党界一些微不足道的不一致。\n\n 你被命令将 [intermediary.GetTitledFirstName] 的附庸权交给 [intermediary.GetHerHis] 正当的党派领导者。也就是我。"
 char_interaction.0272.desc: "你越权了，但我无法抗拒我的[intermediary.GetTitleAsName]职，即使只有你#!在行使#EMP。\n\nI接受你对我后座议员的撤回。"
 char_interaction.0273.desc: "我发誓要保护我的后座议员，这也包括免受 #EMP 你#! 等人的掠夺。\n\n你可以在战斗中夺取 [intermediary.GetTitledFirstName] 和 [intermediary.GetHerHis] 的土地，或者你可以逃回你所在的 [recipient.GetFaith.random_GoodGodNames] 之地。"
 char_interaction.0282.desc: "与我的行为不同，你的要求是犯罪的。\n\n为了党的利益，我会遵守，但请记住，我不会忘记这次轻视。"
 char_interaction.0291.a: "我相信我的党领袖最了解情况。"
 char_interaction.0291.desc.negative: "#!你就不能做点#EMP 事吗？连最慢的傻瓜都能看出[recipient.GetTitledFirstName]不是你该关注的。别再欺负更好的后座议员了，做好你的工作。"
 char_interaction.0370.a.herder: "我本应让我的党保持团结。"
 church_authority_0: "自主党务官员"
 church_authority_0_effects_not_in_prev: "#weak 文书后座议员提供[levies|E]和[taxes|E]，但保持广泛的自治权。#!"
 church_authority_2_effects: "$EFFECT_LIST_BULLET$统治者可以建立神权统治 [dynasty|E]\n$EFFECT_LIST_BULLET$[vassals|E] 不能对其他后座议员发动 [war|E]，除非他们在其 [hook|E] 上使用 [liege|E]\n$EFFECT_LIST_BULLET$。后座议员的 [titles|E] 不能被非 [realm|E]\n$EFFECT_LIST_BULLET$ 的角色继承。所有拒绝撤销头衔或撤回后座议员身份的后座议员被视为 [criminals|E]\n$EFFECT_LIST_BULLET$A [christian|E] [head_of_faith|E] 可以使用 [GetDecision('enact_a_bull_decision').GetName] [decision|E] 宣布 [great_holy_war|E]\n$EFFECT_LIST_BULLET$。可以使用 [GetDecision('pam_establish_theocratic_dynasty_decision').GetName] [decision|E]\n$EFFECT_LIST_BULLET$[subordinates|E]，世俗 [rulers|E] 更容易 [puppet|E]。"
