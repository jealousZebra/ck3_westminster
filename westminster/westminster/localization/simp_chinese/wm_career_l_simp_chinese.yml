l_simp_chinese:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "党工作"
 wm_job_canvassing_contract: "拉票活动"
 wm_job_canvassing_desc_title: "招募上门拜访人员"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] 这个周末需要在门口的志愿者：剪贴板、宣传单和宽厚的心态。党派会注意谁在雨中到场。"
 wm_job_canvassing_request: "花三周逐户拜访。成功取决于你的[diplomacy|E]。"
 wm_job_fundraising_contract: "筹款晚宴"
 wm_job_fundraising_desc_title: "帮忙把桌子填满"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] 正在举办筹款晚宴，需要有人来出售桌位、追踪捐赠者并保持抽奖的公平。"
 wm_job_fundraising_request: "在三周内组织晚宴。成功取决于你的 [stewardship|E]。"
 wm_job_speechwriting_contract: "演讲稿撰写"
 wm_job_speechwriting_desc_title: "一场成功的演讲"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName]即将有一场重要演讲，而目前的草案，正如他们办公室所说，是“一段人质视频”。"
 wm_job_speechwriting_request: "演讲稿要用三周时间完成。成功取决于你的能力[learning|E]。"
 wm_job_research_contract: "反对派研究"
 wm_job_research_desc_title: "调查对方"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] 想要获得关于对手的简报：投票记录、旧推文、失信承诺。所有信息都是公开的，都有用。"
 wm_job_research_request: "在三周内编写档案。成功取决于你的[intrigue|E]。"
 wm_job_phonebank_contract: "电话中心"
 wm_job_phonebank_desc_title: "一个晚上的电话"
 wm_job_phonebank_desc: "[TaskContract.GetEmployer.GetName] 的办公室有一份四百名未续会成员的名单，一间借来的电话室和一份没人排练过的剧本。"
 wm_job_phonebank_request: "在三周内完成电话名单的跟进。成功取决于你的[diplomacy|E]。"
 wm_job_policy_paper_contract: "政策文件"
 wm_job_policy_paper_desc_title: "十页，全成本"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] 想对当地公交发表一些不仅仅是口号的话：证据、数据，以及部长可以签署的建议。"
 wm_job_policy_paper_request: "论文写三周时间。成功取决于你的[learning|E]。"
 wm_job_media_round_contract: "媒体采访"
 wm_job_media_round_desc_title: "早餐前六个录音室"
 wm_job_media_round_desc: "地方电台、地区电视台和两个播客都希望[TaskContract.GetEmployer.GetName]一方的人上台为这条线辩护。没有其他人自愿。"
 wm_job_media_round_request: "准备台词并在三周内进行采访。成功取决于你的[intrigue|E]。"
 wm_job_gotv_contract: "让更多人投票"
 wm_job_gotv_desc_title: "让他们怀孕，把他们带出来"
 wm_job_gotv_desc: "[TaskContract.GetEmployer.GetName] 的团队需要为理事会补选找跑腿：投票卡、计票员号码，以及许多塔楼中的很多楼梯。"
 wm_job_gotv_request: "在三周内进行投票动员行动。成功取决于你的[prowess|E]。"
 wm_job_budget_contract: "承诺费用"
 wm_job_budget_desc_title: "资金从哪里来？"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName] 承诺了昂贵的事情，而另一方不断询问如何支付。急需一个电子表格。"
 wm_job_budget_request: "承诺者需花费三周时间。成功取决于你的[stewardship|E]。"
 wm_selection_contract: "候选人评估"
 wm_selection_contract_contract: "候选人评估"
 wm_selection_contract_desc_title: "党派批准的名单。"
 wm_selection_contract_desc: "在任何人能代表政党参选之前，他们必须通过评估日：模拟面试、政策测试以及与愤怒“选民”的角色扮演。"
 wm_selection_contract_request: "通过评估以加入批准候选人名单。成功取决于你的 [diplomacy|E]。"

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "[wm_sel_seat.GetName]年开放申请"
 wm_career.20.desc: "地方[wm_sel_party.GetName]议会正在选[wm_sel_seat.GetName]候选人。选区主席的邮件很简短：申请将在几周后截止，社区中心将举行竞选演讲。\n\nP参加此类选区的议员将成为议员。"
 wm_career.20.a: "提名自己。"
 wm_career.20.b: "不是这个。"
 wm_career.21.t: "[wm_sel_seat.GetName] 的竞选活动"
 wm_career.21.desc: "塑料椅子、茶甕和六十名听过所有提案的党员。每位申请者有十分钟时间，并从现场提问。我该如何赢得他们的认可？"
 wm_career.21.a: "聊聊该地区：它的主要街道、公交、民众。"
 wm_career.21.b: "制定一项逐项有成本计划的政策。"
 wm_career.21.c: "温和地提醒他们其他申请人过去说过的话。"
 wm_career.21.success: "房间对你变得温暖。"
 wm_career.21.failure: "房间保持寒冷。"

 wm_career_selected_toast: "入选[wm_sel_seat.GetName]"
 wm_career_selected_toast_desc: "地方[wm_sel_party.GetName]选你为候选人。在下一次选举或补选中赢得该席位，你就是议员。"
 wm_career_not_selected_toast: "未被选中[wm_sel_seat.GetName]"
 wm_career_not_selected_toast_desc: "成员们选了[wm_sel_winner.GetName]。下次你会更出名的。"
 wm_career_elected_toast: "当选议员"
 wm_career_elected_toast_desc: "计票结束，席位已属于你。竞选团队已解散；你所在党的组织者会联系你。"

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "申请选拔"
 wm_career_apply_decision_desc: "提名自己成为本党在某个选区的候选人，该选区由当地党员选出。党派状态：[GetPlayer.MakeScope.Var('wm_standing').GetValue|0]。"
 wm_career_apply_decision_tooltip: "申请成为该党的候选人"
 wm_career_apply_decision_free_tt: "尚未申请席位或被选为候选人"
 wm_career_apply_decision_standing_tt: "在党的批准候选人名单上，或党的地位至少为 30"
 wm_career_apply_decision_open_tt: "党派正在某地选择候选人。"
 wm_career_apply_decision_effect_tt: "你申请党内开放的候选人之一，最好是在你所在国家，并在竞选会议上发言。"
 wm_career_return_decision: "重返竞选之路"
 wm_career_return_decision_desc: "选民已经表达了意见，他们也可以改变主意。组建一个竞选团队并寻找一个席位。"
 wm_career_return_decision_tooltip: "失去席位后再次寻求选拔"
 wm_career_return_decision_effect_tt: "您得到了一支竞选团队，加入党的批准候选人名单，并可以申请选拔。"

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "为我做了好工作"
 wm_career_poor_work_opinion: "让我失望"
 wm_career_apply_decision_confirm: "提交我的申请"
 wm_career_return_decision_confirm: "回到逐门拜访"
