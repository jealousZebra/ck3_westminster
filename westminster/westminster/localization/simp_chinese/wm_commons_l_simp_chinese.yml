l_simp_chinese:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "提出法案"
 wm_commons_introduce_bill_decision_desc: "将一项政府法案提交下议院。党鞭将清点人数，后座议员会抱怨，一周后下议院将分裂投票。"
 wm_commons_introduce_bill_decision_tooltip: "将一项政府法案提交下议院表决"
 wm_commons_introduce_bill_decision_effect_tt: "选择一项法案。众议院一周后对此进行投票。"
 wm_commons_no_confidence_decision: "提出不信任动议"
 wm_commons_no_confidence_decision_desc: "作为反对党领袖，提出动议，称本院对陛下政府不信任。如果政府失败，必须举行大选。"
 wm_commons_no_confidence_decision_tooltip: "试图推翻政府"
 wm_commons_no_confidence_decision_effect_tt: "下议院将在一周内对动议进行表决。如果获通过，必须举行 #bold 大选#!。如果未通过，你会丢面子，首相也不会忘记此事。"
 wm_commons_house_free_desc: "没有其他法案或动议正在下议院等待表决"
 wm_commons_no_election_pending_desc: "政府尚未被迫举行大选"
 wm_commons_leader_of_opposition_desc: "你领导着政府外最大的政党"

 # Bills
 wm_commons_bill_1_name: "#bold 财政法案#!"
 wm_commons_bill_2_name: "#bold 公共服务法案#!"
 wm_commons_bill_3_name: "#bold 公共服务改革法案#!"
 wm_commons_bill_4_name: "#bold 紧急权力法案#!"
 wm_commons_bill_5_name: "#bold 对陛下政府的不信任动议#!"
 wm_commons_bill_1_desc: "\n\n #bold 财政法案 #! 提高税收以平衡账目。党的右翼讨厌它；左翼可以接受。"
 wm_commons_bill_2_desc: "\n\n #bold 公共服务法案 #! 向学校和医院投入更多资金。它很受欢迎，左翼喜欢它；右翼担心成本。"
 wm_commons_bill_3_desc: "\n\n #bold 公共服务改革法案 #! 改变了公共服务的运作方式。右翼多年来一直希望如此。左翼称其为背叛，有些人威胁要投反对票。"
 wm_commons_bill_4_desc: "\n\n#bold 紧急权力法案#! 赋予部长们处理危机的广泛权力。虽然没人太喜欢，但在危机中，国家期望议会采取行动。"
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName]，作为反对派领袖，已经提出了一项#bold 对政府的不信任动议#!。如果动议通过，必须举行大选。"

 wm_commons.1.t: "立法计划"
 wm_commons.1.desc: "下议院领袖想知道政府接下来将向议会提出什么事项。公务员已起草了几项法案，每项法案在我们自己的席位上都有支持者和反对者。"
 wm_commons.1.a: "一项财政法案：税收必须增加。"
 wm_commons.1.a.tt: "如果通过：政府资金和加税，但民调不会喜欢。该党右翼#bold #!可能会反叛。"
 wm_commons.1.b: "一项公共服务法案：为学校和医院提供更多资金。"
 wm_commons.1.b.tt: "如果通过：受欢迎，对民调有利，但需要多年资金。党内右翼#bold #!可能会抱怨。"
 wm_commons.1.c: "一项公共服务改革法案：是时候进行真正的改变了。"
 wm_commons.1.c.tt: "如果通过：授权与改革者的声誉。#bold 有争议的#!：该党#bold 左翼#!可能会大规模反抗。"
 wm_commons.1.d: "紧急权力法案：国家需要它。"
 wm_commons.1.d.tt: "如果通过：曝光和授权。反对派很可能会支持。"
 wm_commons.1.e: "暂时没什么。"

 # The whips
 wm_commons.2.t: "首席党鞭报告"
 wm_commons.2.t_confidence: "一项不信任动议"
 wm_commons.2.desc_bill: "党鞭一直在茶室数人头。"
 wm_commons.2.desc_confidence: "反对派已提出动议推翻政府，首席党鞭已在我的办公室。"
 wm_commons.2.numbers: "\n\n我们有#bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#!议员；对面还有[EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0]。首席党鞭估计大约#bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#!我们的人可能叛变或缺席。"
 wm_commons.2.opposition_backs: "反对派前排表示将支持我们。"
 wm_commons.2.no_opposition_help: "反对派将投票反对。"
 wm_commons.2.a: "交给党鞭"
 wm_commons.2.b: "下达三行鞭令。我的权威岌岌可危。"
 wm_commons.2.c: "一个一个地召集犹豫不决的人。每个选区都需要一些东西。"
 wm_commons.2.d: "提供优惠。"
 wm_commons.2.d.tt: "叛变的议员减少，但一项法案被#bold 稀释#!：如果通过，它只实现大约一半的效果。"
 wm_commons.2.e: "在法案被否决前撤回。"

 # The result
 wm_commons_headline_government_falls: "政府倒台"
 wm_commons_headline_pm_survives: "首相在信任投票中存活"
 wm_commons_headline_humiliation: "10号的羞辱"
 wm_commons_headline_defeated: "政府落败"
 wm_commons_headline_knife_edge: "千钧一发：政府勉强获胜"
 wm_commons_headline_revolt: "尽管后座议员反对，法案仍然通过"
 wm_commons_headline_comfortable: "轻松多数"
 wm_commons_headline_passed: "法案通过"

 wm_commons.4.lobbies: "\n\n 分票大厅： #bold 赞成票 [EmptyScope.ScriptValue('wm_commons_ayes_value')|0]，反对票 [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!。 [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] 国会议员未投票。"
 wm_commons.4.rebels: "#bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! 政府议员违抗了党鞭。"
 wm_commons.4.no_rebels: "没有一名政府议员违抗党鞭。"
 wm_commons.4.outcome_government_falls: "\n\n下议院对 [wm_commons_pm.GetName] 的政府没有信任。必须举行 #bold 大选#!。"
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] [EmptyScope.ScriptValue('wm_commons_majority_value')|0] 通过投票存活，而反对派则颜面尽失。"
 wm_commons.4.outcome_defeated: "\n\n 法案未能通过，被 [EmptyScope.ScriptValue('wm_commons_majority_value')|0] 票数击败。 [wm_commons_pm.GetName] 已失去对下议院的控制。"
 wm_commons.4.outcome_passed_watered_down: "\n\n 法案以 [EmptyScope.ScriptValue('wm_commons_majority_value')|0] 多数票通过，但几乎在所有方面政府都作出让步之后。"
 wm_commons.4.outcome_passed: "\n\n 法案以 [EmptyScope.ScriptValue('wm_commons_majority_value')|0] 多数票通过。"
 wm_commons.4.a: "秩序，秩序！"
 wm_commons.4.a_pm: "继续下一个。"

 # The division bell
 wm_commons.5.t: "分区钟"
 wm_commons.5.desc: "分组表决铃响遍整个西敏宫。几分钟后，议会将进行投票。"
 wm_commons.5.whip_none: "\n\n没有党鞭限制，我可以随意投票。"
 wm_commons.5.whip_abstain: "\n\n我的党派不在威斯敏斯特就座。我将不投票。"
 wm_commons.5.whip_government: "\n\n 党鞭希望我们每个人都在大厅 #bold 随政府一起投票 #!。叛变者将被记住。"
 wm_commons.5.whip_opposition_backs: "\n\n我们的前排席位在这一问题上支持政府，党鞭也希望我跟随。"
 wm_commons.5.whip_opposition: "\n\n我们的党鞭希望我在走廊 #bold 反对政府#!。"
 wm_commons.5.wing_left: "我在我的政党中坐在 #bold 左翼#!。"
 wm_commons.5.wing_right: "我在我的政党中坐在 #bold 右翼#!。"
 wm_commons.5.wing_centre: "我在我的政党中坐在 #bold 中间#!。"
 wm_commons.5.a: "与政府一起投票。"
 wm_commons.5.b: "投票反对政府。"
 wm_commons.5.c: "远离并戒绝。"

 wm_commons_whip_withdrawn_toast: "鞭笞撤回"
 wm_commons_whip_withdrawn_toast_desc: "在反叛过多次之后，[wm_commons_whipless.GetName]已失去党鞭，现在以独立议员身份就座。"

 # Modifiers
 wm_commons_tax_rise_modifier: "税收增加"
 wm_commons_tax_rise_modifier_desc: "财政法案提高了税收。资金正在流入，选民们也注意到了。"
 wm_commons_public_services_modifier: "公共服务支出"
 wm_commons_public_services_modifier_desc: "更多资金用于学校和医院：受欢迎，但成本高。"
 wm_commons_reformer_modifier: "改革者"
 wm_commons_reformer_modifier_desc: "在下议院通过了一项有争议的改革。"
 wm_commons_emergency_powers_modifier: "紧急权力"
 wm_commons_emergency_powers_modifier_desc: "议会授予政府应对危机的广泛权力。"
 wm_commons_defeated_in_commons_modifier: "在下议院被否决"
 wm_commons_defeated_in_commons_modifier_desc: "国会下议院否决了一项政府法案。"
 wm_commons_lost_confidence_modifier: "失去了议会的信任"
 wm_commons_lost_confidence_modifier_desc: "下议院投票表示对本届政府不信任。"

 # Opinions
 wm_commons_defied_whip_opinion: "反抗鞭子"
 wm_commons_whip_withdrawn_opinion: "从我这里收回了鞭子"
 wm_commons_tabled_no_confidence_opinion: "试图推翻我的政府"
 wm_commons_introduce_bill_decision_confirm: "提交给议会"
 wm_commons_no_confidence_decision_confirm: "提出动议"
