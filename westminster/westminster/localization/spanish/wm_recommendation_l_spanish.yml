 wm_recommendation.1.t: "¿Estás disfrutando de Westminster?"
 wm_recommendation.1.desc: "Si Westminster se ha ganado un lugar en tu colección de mods, una valoración positiva en Steam Workshop ayudará a que más jugadores de CK3 lo descubran. Gracias por jugar y apoyar el crecimiento del mod."
 wm_recommendation.1.a: "Dejaré una valoración en Steam."
 wm_recommendation.1.b: "Volver a Westminster."
