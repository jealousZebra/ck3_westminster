l_spanish:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "Un Concurso de Liderazgo"
 wm_leadership.1.desc_vacancy: "El [wm_lead_party.GetNameNoTier] necesita un nuevo líder. [wm_lead_party_holder.GetName] está cuidando la tienda por ahora, pero el partido elegirá por sí mismo.\n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] está renunciando como líder del [wm_lead_party.GetNameNoTier], y la carrera para sucederlo ha comenzado.\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] enfrenta un desafío por el liderazgo del [wm_lead_party.GetNameNoTier]. Cualquiera que crea tener oportunidad puede unirse.\n\n"
 wm_leadership.1.rules: "#bold Las reglas:#! Las nominaciones de los diputados del partido cierran en diez días. Un candidato necesita el 15% de ellos (un retador 20%) para avanzar, y los dos mejor respaldados van a una votación de los miembros, tres semanas después. Los miembros buscan un comunicador, un historial, capital político en el partido y el apoyo de los diputados."
 wm_leadership.1.a: "Me presento a la pelea."
 wm_leadership.1.a.tt: "Te postulas para la jefatura. Tus colegas decidirán si nominarte."
 wm_leadership.1.b: "No esta vez."
 wm_leadership.2.t: "Un Desafío"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName] ha anunciado un desafío a tu liderazgo del [wm_lead_party.GetNameNoTier]. Si encuentran suficientes nominaciones, los miembros elegirán entre ustedes."
 wm_leadership.2.a: "Lúchenlos, y ganen."
 wm_leadership.2.a.tt: "Usted está en la papeleta en este momento. El retador necesita una quinta parte de los diputados del partido para nominarlo."
 wm_leadership.2.b: "Retírate con dignidad."
 wm_leadership.2.b.tt: "No te presentas. El concurso continúa sin ti, y lideras hasta que haya un ganador."
 wm_leadership.3.t: "La Votación de los Miembros"
 wm_leadership.3.desc: "Ha sido preseleccionado para la dirección del [wm_lead_party.GetNameNoTier], frente a [wm_lead_rival.GetName]. Le esperan tres semanas de mítines, llamadas telefónicas y entrevistas. Los miembros decidirán."
 wm_leadership.3.a: "Recorrer los partidos de la circunscripción."
 wm_leadership.3.a.tt: "Una campaña de apretones de manos y mítines: aprovecha tu #bold carisma#!."
 wm_leadership.3.b: "Presentó un programa serio."
 wm_leadership.3.b.tt: "Una plataforma política: juega a tu #bold economía#! y #bold política#!."
 wm_leadership.3.c: "Contratar lo mejor que el dinero de la campaña pueda comprar."
 wm_leadership.3.c.tt: "Videos elegantes y un juego de base implacable. Caro, pero funciona."
 wm_leadership.3.d: "Deja que mi historial hable por sí mismo."
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] GANA [wm_lead_news_party.GetAdjective|U] LIDERAZGO"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] CORONADO SIN OPOSICIÓN"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] REPITE DESAFÍO"
 wm_leadership.4.t_failed: "DESAFÍO DE LIDERAZGO SE DESVANECE"
 wm_leadership.4.desc_ballot: "#italic El [wm_lead_news_party.GetNameNoTier]#!\n\nLos miembros han hablado: [wm_lead_news_winner.GetName] obtiene [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% de los votos contra [wm_lead_news_second.GetName] y es el nuevo líder del [wm_lead_news_party.GetNameNoTier]. [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] de los [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] diputados del partido lo habían nominado."
 wm_leadership.4.desc_ballot_alone: "#italic El [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName] es el nuevo líder del [wm_lead_news_party.GetNameNoTier], con [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% de los votos de los miembros."
 wm_leadership.4.desc_survives: "#italic El [wm_lead_news_party.GetNameNoTier]#!\n\nLos miembros han respaldado a su líder: [wm_lead_news_winner.GetName] gana [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% de los votos contra [wm_lead_news_second.GetName], cuya carrera podría no recuperarse."
 wm_leadership.4.desc_unopposed: "#italic El [wm_lead_news_party.GetNameNoTier]#!\n\nSolo [wm_lead_news_winner.GetName] alcanzó las nominaciones necesarias para la votación, con [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] de los [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] diputados del partido, y es elegido líder del [wm_lead_news_party.GetNameNoTier] sin oposición. Los miembros nunca tuvieron un voto."
 wm_leadership.4.desc_failed: "#italic El [wm_lead_news_party.GetNameNoTier]#!\n\nEl desafío a [wm_lead_news_winner.GetName] ha fracasado antes de comenzar: ningún retador encontró las nominaciones necesarias para forzar una votación. El líder está seguro, por ahora."
 wm_leadership.4.a_won: "Ahora comienza el verdadero trabajo."
 wm_leadership.4.a: "El partido ha elegido."
 wm_leadership.5.t: "Después del Recuento"
 wm_leadership.5.desc: "Las elecciones generales han ido mal para [wm_lead_party.GetNameNoTier]. Los periódicos ya están escribiendo tu obituario político, y algunos colegas no están devolviendo llamadas.\n\nPodrías seguir luchando, o anunciar que te retirarás una vez que el partido haya elegido a un sucesor."
 wm_leadership.5.a: "No voy a ninguna parte."
 wm_leadership.5.b: "Es tiempo de que alguien más."
 wm_leadership.5.b.tt: "Comienza un concurso de liderazgo. No se presenta, y lidera hasta que termine."
 wm_leadership_contest_toast: "Concurso de Liderazgo: [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "El [wm_lead_party.GetNameNoTier] está eligiendo un líder: nominaciones de sus Diputados, luego una votación de los miembros."
 wm_leadership_result_toast: "Nuevo Líder: [wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] lidera el [wm_lead_party.GetNameNoTier]."
 wm_leadership_challenge_decision: "Desafío por el Liderazgo"
 wm_leadership_challenge_decision_desc: "Tu partido merece algo mejor, y tú sabes quién. Declara un desafío: si una quinta parte de los diputados del partido te nomina, los miembros elegirán entre tú y el líder."
 wm_leadership_challenge_decision_tooltip: "Desafía al líder de tu partido."
 wm_leadership_challenge_decision_confirm: "Declarar el desafío"
 wm_leadership_challenge_decision_effect_tt: "Un concurso de liderazgo de #bold#! comienza: diez días de nominaciones de los diputados del partido, luego una votación de los miembros. Si pierdes, el líder no lo olvidará."
 wm_leadership_no_contest_tt: "No hay un concurso de liderazgo en curso"
 wm_leadership_parliament_sitting_tt: "No hay una elección general en curso"
 wm_leadership_challenged_opinion: "Me desafió por el liderazgo"
 wm_leadership_deposed_opinion: "Me quitaron mi partido"
 wm_leadership_gracious_opinion: "Un ganador con gracia."
