l_spanish:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "Trabajo del Partido"
 wm_job_canvassing_contract: "Hacer canvassing (promoción de campaña)"
 wm_job_canvassing_desc_title: "Se buscan tocadores de puertas"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] necesita voluntarios en la puerta este fin de semana: portapapeles, folletos y piel gruesa. El partido nota quién aparece bajo la lluvia."
 wm_job_canvassing_request: "Pasar tres semanas tocando puertas. El éxito depende de su [diplomacy|E]."
 wm_job_fundraising_contract: "Cena de recaudación de fondos"
 wm_job_fundraising_desc_title: "Ayuda a llenar las mesas"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] está organizando una cena de recaudación de fondos y necesita a alguien para vender las mesas, perseguir a los donantes y mantener la rifa honesta."
 wm_job_fundraising_request: "Organiza la cena durante tres semanas. El éxito depende de tu [stewardship|E]."
 wm_job_speechwriting_contract: "Redacción de discursos"
 wm_job_speechwriting_desc_title: "Un discurso que impacta"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName] tiene un gran discurso próximo y el borrador actual es, en palabras de su oficina, 'un video de rehenes'."
 wm_job_speechwriting_request: "Escribe el discurso en tres semanas. El éxito depende de tu [learning|E]."
 wm_job_research_contract: "Investigación de la Oposición"
 wm_job_research_desc_title: "Investigar el otro lado"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] quiere un informe sobre sus oponentes: registros de votación, tuits antiguos, promesas incumplidas. Todo público, todo útil."
 wm_job_research_request: "Compila el dossier durante tres semanas. El éxito depende de tu [intrigue|E]."
 wm_job_phonebank_contract: "Banco telefónico"
 wm_job_phonebank_desc_title: "Una tarde al teléfono"
 wm_job_phonebank_desc: "La oficina de [TaskContract.GetEmployer.GetName] tiene una lista de cuatrocientos miembros que no han renovado, una sala con teléfonos prestados y un guion que nadie ha ensayado."
 wm_job_phonebank_request: "Trabaja la lista de llamadas durante tres semanas. El éxito depende de tu [diplomacy|E]."
 wm_job_policy_paper_contract: "Documento de Políticas"
 wm_job_policy_paper_desc_title: "Diez páginas, totalmente presupuestadas"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] quiere algo que decir sobre los autobuses locales que no sea un eslogan: evidencia, cifras y una recomendación que un ministro pueda firmar."
 wm_job_policy_paper_request: "Redacta el trabajo en tres semanas. El éxito depende de tu [learning|E]."
 wm_job_media_round_contract: "Ronda de Medios"
 wm_job_media_round_desc_title: "Seis estudios antes del desayuno"
 wm_job_media_round_desc: "la radio local, la televisión regional y dos podcasts quieren a alguien del lado de [TaskContract.GetEmployer.GetName] que salga a defender la línea. Nadie más se ofreció voluntario."
 wm_job_media_round_request: "Prepare las líneas y haga las entrevistas durante tres semanas. El éxito depende de su [intrigue|E]."
 wm_job_gotv_contract: "Movilizar el Voto"
 wm_job_gotv_desc_title: "Hazlos embarazados, sácalos"
 wm_job_gotv_desc: "El equipo de [TaskContract.GetEmployer.GetName] necesita personas para la elección parcial del consejo: tarjetas de votación, números de interventores y muchas escaleras en muchos bloques de torres."
 wm_job_gotv_request: "Ejecuta la operación de movilización de votantes durante tres semanas. El éxito depende de tu [prowess|E]."
 wm_job_budget_contract: "Coste de un compromiso"
 wm_job_budget_desc_title: "¿De dónde viene el dinero?"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName] ha prometido algo costoso y la otra parte sigue preguntando cómo se pagará. Se necesita una hoja de cálculo, con urgencia."
 wm_job_budget_request: "Coste del compromiso durante tres semanas. El éxito depende de tu [stewardship|E]."
 wm_selection_contract: "Evaluación de candidato"
 wm_selection_contract_contract: "Evaluación de candidato"
 wm_selection_contract_desc_title: "La lista aprobada del partido"
 wm_selection_contract_desc: "Antes de que alguien pueda postularse por el partido, debe aprobar un día de evaluación: una entrevista simulada, un test de políticas y un juego de rol con un 'constituyente' enojado."
 wm_selection_contract_request: "Pasa la evaluación para unirte a la lista de candidatos aprobados. El éxito depende de tu [diplomacy|E]."

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "Solicitudes abiertas en [wm_sel_seat.GetName]"
 wm_career.20.desc: "La [wm_sel_party.GetName] local está eligiendo a su candidato para [wm_sel_seat.GetName]. El correo electrónico del presidente de la circunscripción es breve: las solicitudes cierran en pocas semanas, y habrá reuniones populares en el centro comunitario.\n\nLas personas que se presentan en escaños como este se convierten en diputados."
 wm_career.20.a: "Presentar mi nombre."
 wm_career.20.b: "No este."
 wm_career.21.t: "Hustings en [wm_sel_seat.GetName]"
 wm_career.21.desc: "Sillas de plástico, una tetera y sesenta miembros del partido que han escuchado cada argumento antes. Cada solicitante tiene diez minutos y preguntas desde el público. ¿Cómo los conquisto?"
 wm_career.21.a: "Hablar sobre la zona: su calle principal, sus autobuses, su gente."
 wm_career.21.b: "Presentó un plan con costos, política por política."
 wm_career.21.c: "Recuérdeles suavemente lo que los otros candidatos han dicho en el pasado."
 wm_career.21.success: "La habitación se calentó contigo"
 wm_career.21.failure: "La habitación permaneció fría"

 wm_career_selected_toast: "Seleccionado para [wm_sel_seat.GetName]"
 wm_career_selected_toast_desc: "La [wm_sel_party.GetName] local te ha elegido como su candidato. Gana el escaño en las próximas elecciones o elecciones parciales y serás diputado."
 wm_career_not_selected_toast: "No seleccionado en [wm_sel_seat.GetName]"
 wm_career_not_selected_toast_desc: "Los miembros eligieron a [wm_sel_winner.GetName]. Serás más conocido la próxima vez."
 wm_career_elected_toast: "Elegido para el Parlamento"
 wm_career_elected_toast_desc: "El recuento ha terminado y el escaño es tuyo. El equipo de campaña está agotado; los látigos de tu partido se pondrán en contacto."

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "Solicitar selección"
 wm_career_apply_decision_desc: "Presentar mi nombre para ser el candidato de mi partido en un escaño donde los miembros locales están eligiendo uno. Posición en el partido: [GetPlayer.MakeScope.Var('wm_standing').GetValue|0]."
 wm_career_apply_decision_tooltip: "Presentarse como candidato del partido para un escaño"
 wm_career_apply_decision_free_tt: "No solicitando ya un escaño o seleccionado como candidato"
 wm_career_apply_decision_standing_tt: "En la lista de candidatos aprobados del partido, o con una posición de al menos 30 en el partido"
 wm_career_apply_decision_open_tt: "El partido está eligiendo un candidato en alguna parte"
 wm_career_apply_decision_effect_tt: "Solicitas una de las selecciones que el partido tiene abiertas, preferiblemente en tu propio país, y hablas en sus parlamentos."
 wm_career_return_decision: "De nuevo en la campaña electoral"
 wm_career_return_decision_desc: "Los votantes han hablado y pueden cambiar de opinión. Formad un equipo de campaña y buscad un escaño."
 wm_career_return_decision_tooltip: "Buscar selección de nuevo tras perder tu escaño"
 wm_career_return_decision_effect_tt: "Consigues un equipo de campaña, te unes a la lista de candidatos aprobados del partido y puedes postularte para las selecciones."

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "Hizo Buen Trabajo para Mí"
 wm_career_poor_work_opinion: "Déjame caer"
 wm_career_apply_decision_confirm: "Enviar Mi Solicitud"
 wm_career_return_decision_confirm: "De vuelta a las puertas"
