l_spanish:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "Introducir un Proyecto de Ley"
 wm_commons_introduce_bill_decision_desc: "Presentar un proyecto de ley del gobierno ante la Cámara de los Comunes. Los 'whips' contarán cabezas, los miembros de banca trasera refunfuñarán, y en una semana la Cámara se dividirá."
 wm_commons_introduce_bill_decision_tooltip: "Someter un proyecto de ley del gobierno a votación en los Comunes"
 wm_commons_introduce_bill_decision_effect_tt: "Elige un proyecto de ley. La Cámara vota sobre él una semana después."
 wm_commons_no_confidence_decision: "Presentar una moción de censura"
 wm_commons_no_confidence_decision_desc: "Como Líder de la Oposición, presenta una moción de que esta Cámara no tiene confianza en el Gobierno de Su Majestad. Si el gobierno pierde, debe haber elecciones generales."
 wm_commons_no_confidence_decision_tooltip: "Intentar derrocar al gobierno"
 wm_commons_no_confidence_decision_effect_tt: "La Cámara vota la moción dentro de la semana. Si se aprueba, debe celebrarse una #bold elección general#!. Si falla, pierdes prestigio y el Primer Ministro no lo olvidará."
 wm_commons_house_free_desc: "Ningún otro proyecto de ley o moción está esperando votación en los Comunes"
 wm_commons_no_election_pending_desc: "No se ha forzado una elección general al gobierno ya"
 wm_commons_leader_of_opposition_desc: "Lideras el partido más grande fuera del gobierno"

 # Bills
 wm_commons_bill_1_name: "#bold La Ley de Finanzas#!"
 wm_commons_bill_2_name: "#bold La Ley de Servicios Públicos#!"
 wm_commons_bill_3_name: "#bold La Ley de Reforma del Servicio Público#!"
 wm_commons_bill_4_name: "#bold La Ley de Poderes de Emergencia#!"
 wm_commons_bill_5_name: "#bold La moción de no confianza en el Gobierno de Su Majestad#!"
 wm_commons_bill_1_desc: "\n\nEl #bold Proyecto de Ley de Finanzas#! aumenta los impuestos para equilibrar las cuentas. La derecha del partido lo odia; la izquierda puede vivir con ello."
 wm_commons_bill_2_desc: "\n\nEl #bold Proyecto de Ley de Servicios Públicos#! aumenta el dinero destinado a escuelas y hospitales. Es popular, y la izquierda lo ama; la derecha se preocupa por el costo."
 wm_commons_bill_3_desc: "\n\nEl #bold Proyecto de Ley de Reforma del Servicio Público#! sacude la manera en que se administran los servicios públicos. La derecha lo ha querido durante años. La izquierda lo llama una traición, y algunos de ellos amenazan con votar en contra."
 wm_commons_bill_4_desc: "\n\nEl #bold Proyecto de Ley de Poderes de Emergencia#! otorga a los ministros amplios poderes para enfrentar la crisis. A nadie le gusta mucho, pero en una crisis el país espera que el Parlamento actúe."
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName], como Líder de la Oposición, ha presentado una #bold moción de no confianza#! en el gobierno. Si es aprobada, debe haber una elección general."

 wm_commons.1.t: "El Programa Legislativo"
 wm_commons.1.desc: "El Líder de la Cámara quiere saber qué está presentando el gobierno ante los Comunes a continuación. Los funcionarios públicos han redactado varios proyectos de ley, cada uno con sus amigos y enemigos en nuestros propios bancos."
 wm_commons.1.a: "Una Ley de Finanzas: los impuestos deben subir."
 wm_commons.1.a.tt: "Si se aprueba: dinero para el gobierno y un aumento de impuestos, pero las encuestas no lo aprobarán. La #bold ala derecha#! del partido puede rebelarse."
 wm_commons.1.b: "Un Proyecto de Ley de Servicios Públicos: más dinero para escuelas y hospitales."
 wm_commons.1.b.tt: "Si se aprueba: popular y bueno para las encuestas, pero cuesta dinero durante años. La #bold ala derecha#! del partido puede quejarse."
 wm_commons.1.c: "Un Proyecto de Reforma del Servicio Público: tiempo para un cambio real."
 wm_commons.1.c.tt: "Si se aprueba: mandato y reputación de un reformador. #bold Controversial#!: la #bold ala izquierda#! del partido puede rebelarse en números."
 wm_commons.1.d: "Un Proyecto de Ley de Poderes de Emergencia: el país lo necesita."
 wm_commons.1.d.tt: "Si se aprueba: perfil y mandato. La oposición probablemente lo apoyará."
 wm_commons.1.e: "Nada por ahora."

 # The whips
 wm_commons.2.t: "Informe del Líder de Grupo"
 wm_commons.2.t_confidence: "Una Moción de Censura"
 wm_commons.2.desc_bill: "El Líder de Grupo ha estado contando cabezas en la sala de té."
 wm_commons.2.desc_confidence: "La Oposición ha presentado una moción para derribar al gobierno, y el Jefe de Diputados ya está en mi oficina."
 wm_commons.2.numbers: "\n\nTenemos #bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#! diputados; hay [EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0] en los otros escaños. El Líder de la bancada calcula que alrededor de #bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#! de los nuestros podrían rebelarse o ausentarse."
 wm_commons.2.opposition_backs: "El banco principal de la Oposición ha dicho que nos apoyará."
 wm_commons.2.no_opposition_help: "La Oposición votará en contra."
 wm_commons.2.a: "Déjaselo a los 'whips'."
 wm_commons.2.b: "Emitir una orden de asistencia obligatoria en tres líneas. Mi autoridad está en juego."
 wm_commons.2.c: "Llamar a los indecisos, uno por uno. Cada circunscripción necesita algo."
 wm_commons.2.d: "Ofrecer concesiones."
 wm_commons.2.d.tt: "Menos diputados se rebelan, pero un proyecto de ley está #bold diluido#!: hace aproximadamente la mitad si se aprueba."
 wm_commons.2.e: "Retira el proyecto de ley antes de que sea derrotado."

 # The result
 wm_commons_headline_government_falls: "GOBIERNO CAE"
 wm_commons_headline_pm_survives: "EL PRIMER MINISTRO SOBREVIVE VOTO DE CONFIANZA"
 wm_commons_headline_humiliation: "HUMILLACIÓN PARA NÚMERO 10"
 wm_commons_headline_defeated: "GOBIERNO DERROTADO"
 wm_commons_headline_knife_edge: "AL FILO DEL CUCHILLO: EL GOBIERNO SE SALVA POR POCO"
 wm_commons_headline_revolt: "EL PROYECTO DE LEY APROBADO A PESAR DE LA REVUELTA DE LOS DIPUTADOS RASOS"
 wm_commons_headline_comfortable: "MAYORÍA CÓMODA"
 wm_commons_headline_passed: "EL PROYECTO DE LEY APROBADO"

 wm_commons.4.lobbies: "\n\nLas votaciones en la cámara: #bold A favor [EmptyScope.ScriptValue('wm_commons_ayes_value')|0], En contra [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!. [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] Diputados no votaron."
 wm_commons.4.rebels: "#bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! los diputados del gobierno desoyeron la disciplina de voto."
 wm_commons.4.no_rebels: "Ningún parlamentario del gobierno desobedeció la disciplina del partido."
 wm_commons.4.outcome_government_falls: "\n\nLa Cámara no tiene confianza en el gobierno de [wm_commons_pm.GetName]. Debe haber unas #bold elecciones generales#!."
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] sobrevive por [EmptyScope.ScriptValue('wm_commons_majority_value')|0] votos, y la Oposición queda en ridículo."
 wm_commons.4.outcome_defeated: "\n\nEl proyecto de ley cae, derrotado por [EmptyScope.ScriptValue('wm_commons_majority_value')|0] votos. [wm_commons_pm.GetName] ha perdido el control de la Cámara."
 wm_commons.4.outcome_passed_watered_down: "\n\nEl proyecto de ley se aprueba con una mayoría de [EmptyScope.ScriptValue('wm_commons_majority_value')|0], pero solo después de que el gobierno cediera en casi todo."
 wm_commons.4.outcome_passed: "\n\nEl proyecto de ley se aprueba con una mayoría de [EmptyScope.ScriptValue('wm_commons_majority_value')|0]."
 wm_commons.4.a: "¡Orden, orden!"
 wm_commons.4.a_pm: "Pasemos al siguiente."

 # The division bell
 wm_commons.5.t: "La Campana de División"
 wm_commons.5.desc: "La campana de división está sonando por todo el Palacio de Westminster. En unos minutos la Cámara vota."
 wm_commons.5.whip_none: "\n\nSin disciplina de partido, puedo votar como quiera."
 wm_commons.5.whip_abstain: "\n\nMi partido no ocupa sus escaños en Westminster. No votaré."
 wm_commons.5.whip_government: "\n\nLos encargados de disciplina quieren a cada uno de nosotros en el salón #bold con el gobierno#!. Los rebeldes serán recordados."
 wm_commons.5.whip_opposition_backs: "\n\nNuestro grupo parlamentario respalda al gobierno en este asunto, y los 'whips' esperan que yo siga."
 wm_commons.5.whip_opposition: "\n\nNuestros 'whips' quieren que esté en el vestíbulo #bold contra el gobierno#!."
 wm_commons.5.wing_left: "Me ubico en el #bold izquierda#! de mi partido."
 wm_commons.5.wing_right: "Me ubico en el #bold derecha#! de mi partido."
 wm_commons.5.wing_centre: "Me ubico en el #bold centro#! de mi partido."
 wm_commons.5.a: "Votar con el gobierno."
 wm_commons.5.b: "Votar en contra del gobierno."
 wm_commons.5.c: "Mantente alejado y abstente."

 wm_commons_whip_withdrawn_toast: "Retirada del látigo"
 wm_commons_whip_withdrawn_toast_desc: "Después de rebelarse una vez demasiado, [wm_commons_whipless.GetName] ha perdido el apoyo del partido y ahora se sienta como independiente."

 # Modifiers
 wm_commons_tax_rise_modifier: "Aumento de impuestos"
 wm_commons_tax_rise_modifier_desc: "El Proyecto de Ley de Finanzas aumentó los impuestos. El dinero está entrando, y los votantes lo han notado."
 wm_commons_public_services_modifier: "Gasto en servicios públicos"
 wm_commons_public_services_modifier_desc: "Más dinero para escuelas y hospitales: popular y caro."
 wm_commons_reformer_modifier: "Reformador"
 wm_commons_reformer_modifier_desc: "Logré aprobar una reforma controvertida en la Cámara de los Comunes."
 wm_commons_emergency_powers_modifier: "Poderes de Emergencia"
 wm_commons_emergency_powers_modifier_desc: "El Parlamento otorgó al gobierno amplios poderes para enfrentar una crisis."
 wm_commons_defeated_in_commons_modifier: "Derrotado en los Comunes"
 wm_commons_defeated_in_commons_modifier_desc: "Un proyecto de ley del gobierno fue rechazado por la Cámara de los Comunes."
 wm_commons_lost_confidence_modifier: "Perdió la confianza de la Cámara"
 wm_commons_lost_confidence_modifier_desc: "La Cámara de los Comunes votó que no tiene confianza en este gobierno."

 # Opinions
 wm_commons_defied_whip_opinion: "Desafió al látigo"
 wm_commons_whip_withdrawn_opinion: "Retiró el látigo de mí"
 wm_commons_tabled_no_confidence_opinion: "Intenté derribar a mi gobierno"
 wm_commons_introduce_bill_decision_confirm: "Someterlo a la Cámara"
 wm_commons_no_confidence_decision_confirm: "Presentar la moción"
