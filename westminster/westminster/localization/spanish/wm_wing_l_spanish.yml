l_spanish:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "Izquierda laborista"
 wm_wing_badge_1_desc: "Un miembro de la izquierda socialista del partido: propiedad pública, derechos sindicales y gasto público. (La tendencia de un diputado real en este juego es aleatoria, no una declaración de sus opiniones.)"
 wm_wing_badge_2: "Izquierda Suave"
 wm_wing_badge_2_desc: "Un miembro de la izquierda moderada del partido: amigos críticos del liderazgo, interesados en los servicios públicos. (La tendencia de un diputado real en este juego es aleatoria, no una declaración de sus opiniones.)"
 wm_wing_badge_3: "Centristas laboristas"
 wm_wing_badge_3_desc: "Un miembro de los centristas del partido: cautela fiscal, reforma de los servicios públicos, primacía de la electabilidad. (La tendencia de un diputado real en este juego es aleatoria, no una declaración de sus opiniones.)"
 wm_wing_badge_4: "Una Nación"
 wm_wing_badge_4_desc: "Un miembro de los moderados de One Nation del partido: pragmático, a favor de los servicios públicos. (El ala de un diputado real en este juego es aleatoria, no una declaración de sus opiniones)."
 wm_wing_badge_5: "Defensores del mercado libre"
 wm_wing_badge_5_desc: "Un miembro de los defensores del libre mercado del partido: impuestos más bajos, un estado más pequeño, desregulación. (La tendencia de un diputado real en este juego es aleatoria, no una declaración de sus opiniones.)"
 wm_wing_badge_6: "Tradicionalistas"
 wm_wing_badge_6_desc: "Un miembro de los tradicionalistas del partido: ley y orden, instituciones, identidad nacional. (La tendencia de un diputado real en este juego es aleatoria, no una declaración de sus opiniones.)"
 wm_wing_court_decision: "Cortejar un ala del partido"
 wm_wing_court_decision_desc_labour: "Cómo se sienten las alas del Partido Laborista Parlamentario respecto a su líder (de 100):\n#bold Izquierda Laborista#! ([EmptyScope.ScriptValue('wm_ui_wing_size_1')|0] MPs): aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold Izquierda Moderada#! ([EmptyScope.ScriptValue('wm_ui_wing_size_2')|0] MPs): aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold Centristas Laboristas#! ([EmptyScope.ScriptValue('wm_ui_wing_size_3')|0] MPs): aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\n Cortejar a un ala cuesta #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! perfil: gana 15 de aprobación, las otras pierden 4. Un ala sin un puesto en tu Gabinete (o gabinete en la sombra) pierde aprobación cada mes; una bajo 30 se queja y se rebela en los Comunes, y una bajo 15 durante tres meses lanza un desafío de liderazgo."
 wm_wing_court_decision_desc_conservative: "Cómo se sienten las alas conservadoras respecto a su líder (de 100):\n#bold One Nation#! ([EmptyScope.ScriptValue('wm_ui_wing_size_4')|0] MPs): aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold Liberales del mercado#! ([EmptyScope.ScriptValue('wm_ui_wing_size_5')|0] MPs): aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold Tradicionalistas#! ([EmptyScope.ScriptValue('wm_ui_wing_size_6')|0] MPs): aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\n Cortejar a un ala cuesta #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! perfil: gana 15 de aprobación, las otras pierden 4. Un ala sin un puesto en tu Gabinete (o gabinete en la sombra) pierde aprobación cada mes; una bajo 30 se queja y se rebela en los Comunes, y una bajo 15 durante tres meses lanza un desafío de liderazgo."
 wm_wing_court_decision_tooltip: "Mantener las alas del partido a favor."
 wm_wing_court_decision_confirm: "Elige un Ala"
 wm_wing_court_decision_effect_tt: "Elige un ala: su aprobación hacia ti sube #P 15#!, la de cada otra ala cae #N 4#!."
 wm_wing.1.t: "Manteniendo el Partido Unido"
 wm_wing.1.desc: "Un discurso magistral, un guiño a la política, una promesa de promociones futuras. ¿Qué sector del partido necesita atención?"
 wm_wing.1.w1: "Contactar a la Izquierda Laborista (aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0])."
 wm_wing.1.w2: "Contactar a la Izquierda Suave (aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])."
 wm_wing.1.w3: "Contactar a los Centristas Laboristas (aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0])."
 wm_wing.1.w4: "Contactar a One Nation (aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0])."
 wm_wing.1.w5: "Contactar a los Free-marketeers (aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0])."
 wm_wing.1.w6: "Contactar a los Tradicionalistas (aprobación [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0])."
 wm_wing.10.t: "Un Desafío de Liderazgo"
 wm_wing.10.desc: "Las cartas han llegado. Un ala del partido parlamentario ha perdido la paciencia y ha presentado [wm_wing_challenger.GetName] para desafiarte por el liderazgo. Los periódicos están contando nombres, los medios de comunicación tienen sus gráficos listos, y tu teléfono no deja de sonar.\n\nPuedes dar a los rebeldes lo que quieren, o enfrentarlos."
 wm_wing.10.a: "Dales lo que quieren."
 wm_wing.10.a.tt: "Pierdes #N 300#! de perfil; la aprobación del ala rebelde aumenta en #P 30#!, la de las otras alas disminuye en #N 4#!."
 wm_wing.10.b: "Enfréntalos."
 wm_wing.10.b.tt: "Un #bold carisma#! concurso contra [wm_wing_challenger.GetName]. Gana y la rebelión se disipa; pierde y ellos toman el liderazgo (y Downing Street, si eres Primer Ministro)."
 wm_wing_challenge_toast: "DESAFÍO DE LIDERAZGO"
 wm_wing_challenge_toast_desc_1: "La Izquierda Laborista se ha movido contra [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] está desafiando la dirección del [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_2: "La Izquierda Suave se ha movido contra [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] está desafiando el liderazgo de [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_3: "Los Centro-izquierdistas Laboristas se han movido contra [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] está desafiando la dirección del [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_4: "La Nación Unida se ha movido contra [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] está desafiando el liderazgo de [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_5: "Los defensores del libre mercado se han movido contra [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] está desafiando por el liderazgo del [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_6: "Los Tradicionalistas se han movido contra [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] está desafiando el liderazgo de [wm_wing_party.GetNameNoTier]."
