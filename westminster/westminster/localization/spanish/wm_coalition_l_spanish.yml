l_spanish:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "COALICIÓN ACORDADA"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] y [wm_coal_leader.GetName] se han estrechado la mano en los escalones del número 10. El [wm_coal_party.GetNameNoTier] ([wm_coal_party_seats|0] escaños) se une a la [wm_coal_senior.GetNameNoTier] ([wm_coal_senior_seats|0]) en el gobierno, y [wm_coal_leader.GetFirstName] se convierte en Viceprimer Ministro."
 wm_coalition_headline_supply: "TRATO HECHO: GOBIERNO REFLEJADO"
 wm_coalition_headline_supply_desc: "El [wm_coal_party.GetNameNoTier] ha acordado un acuerdo de confianza y suministro con el gobierno de [wm_coal_pm.GetName]. Sus [wm_coal_party_seats|0] diputados apoyarán al gobierno en las votaciones de confianza y en el Presupuesto, y su líder ha conseguido fondos para sus prioridades. En todo lo demás, cada voto es para sí mismo."
 wm_coalition_headline_minority: "GOBIERNO MINORITARIO"
 wm_coalition_headline_minority_desc: "Las conversaciones no han llegado a nada. [wm_coal_pm.GetName] liderará un gobierno minoritario [wm_coal_senior.GetNameNoTier] con [wm_coal_senior_seats|0] escaños, y tendrá que ganar cada votación en la Cámara de los Comunes de la manera difícil."
 wm_coalition_headline_collapse: "COALICIÓN COLAPSADA"
 wm_coalition_headline_collapse_desc: "El [wm_coal_party.GetNameNoTier] ha abandonado el gobierno de [wm_coal_pm.GetName]. Sin sus votos, el gobierno no tiene mayoría y Westminster se prepara para una moción de censura o una elección."

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "Parlamento colgado"
 wm_coalition.1.desc: "El país ha hablado, y nadie sabe muy bien lo que dijo. El [wm_coal_senior.GetNameNoTier] es el partido más grande con #bold [wm_coal_senior_seats|0]#! escaños, a falta de los [wm_coal_majority|0] necesarios para ganar votos en la Cámara de los Comunes por nuestra cuenta.\n\nEl Secretario del Gabinete tiene listas las salas de negociación de la función pública. Los líderes de los otros partidos están esperando junto a sus teléfonos, y la prensa está acampada afuera del Número 10. ¿A quién llamamos?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] escaños"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] escaños"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] escaños"
 wm_coalition.1.a: "Conversaciones abiertas con el [wm_coal_choice_1.GetNameNoTier]."
 wm_coalition.1.b: "Conversaciones abiertas con el [wm_coal_choice_2.GetNameNoTier]."
 wm_coalition.1.c: "Conversaciones abiertas con el [wm_coal_choice_3.GetNameNoTier]."
 wm_coalition.1.d: "Gobernaremos solos y los desafiamos a derribarnos."
 wm_coalition.1.d.tt: "Lideras un gobierno minoritario de #bold#!: cada proyecto de ley y cada voto de confianza deben encontrar sus votos el mismo día."

 # The terms
 wm_coalition.2.t: "La Mesa de Negociación"
 wm_coalition.2.desc: "El equipo [wm_coal_talks.GetNameNoTier], dirigido por [wm_coal_talks_leader.GetName], ha llegado a la Oficina del Gabinete con una larga lista de demandas. Tienen #bold [wm_coal_talks_seats|0]#! diputados; con los nuestros, eso hace [wm_coal_combined_seats|0]."
 wm_coalition.2.majority: "Juntos tendríamos mayoría."
 wm_coalition.2.no_majority: "Incluso juntos no alcanzaríamos la mayoría, pero es el mejor acuerdo disponible."
 wm_coalition.2.mood_warm: "\n\nEl ambiente es cálido. Sus negociadores están de acuerdo con gran parte de nuestro manifiesto y quieren estar en el gobierno."
 wm_coalition.2.mood_cool: "\n\nEl ambiente es profesional. Querían mucho a cambio, y sus activistas desconfían de ser culpados por nuestros errores."
 wm_coalition.2.mood_cold: "\n\nEl ambiente es frío. Nuestros partidos están muy separados, y sus diputados preferirían estar en la oposición que sostenernos a bajo costo."
 wm_coalition.2.a: "Ofrecer una coalición: Viceprimer Ministro y un puesto en el Gabinete."
 wm_coalition.2.a.tt: "Su líder se convierte en #bold Viceprimer Ministro #! y uno de sus diputados se une al Gabinete. Sus diputados reciben el látigo del gobierno en cada votación."
 wm_coalition.2.b: "Ofrecer una coalición, y adoptar una de sus políticas emblemáticas."
 wm_coalition.2.b.tt: "Como se mencionó, y su política de mascotas se incorpora al programa del gobierno. A nuestros propios diputados no les gustará: #bold Compromiso de la Coalición#! por cinco años."
 wm_coalition.2.c: "Ofrecer una coalición con dos puestos en el Gabinete y una de sus políticas."
 wm_coalition.2.c.tt: "Su líder se convierte en #bold Viceprimer Ministro #!, dos de sus diputados se incorporan al gabinete y su política favorita se incorpora al programa de gobierno."
 wm_coalition.2.d: "Ofrecer confianza y suministro: sus votos sobre la confianza y el Presupuesto, a cambio de dinero."
 wm_coalition.2.d.tt: "Permanecen fuera del gobierno pero nos apoyan en #bold mociones de censura#! y en el #bold Proyecto de Ley de Finanzas#!. A cambio financiamos sus prioridades: nos cuesta dinero y se lo pagamos a su líder."
 wm_coalition.2.e: "Probemos con otro partido."
 wm_coalition_signals_yes_tt: "Sus negociadores están señalando que podrían firmar esto."
 wm_coalition_signals_no_tt: "Sus negociadores señalan que esto no será suficiente."

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "Una Oferta de Coalición"
 wm_coalition.3.t_supply: "Una Oferta de Confianza y Suministro"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName] ha llamado. La [wm_coal_senior.GetNameNoTier] tiene [wm_coal_senior_seats|0] escaños, menos de la mayoría, y quiere que estemos en el gobierno: tú como #bold Viceprimer Ministro#! y [wm_coal_offer_seats|0] de nuestros diputados alrededor de la mesa del Gabinete. A cambio, nuestros diputados votarían con el gobierno en todo."
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName] ha llamado. La [wm_coal_senior.GetNameNoTier] tiene [wm_coal_senior_seats|0] escaños, menos de la mayoría, y quiere que estemos en el gobierno: tú como #bold Viceprimer Ministro#!, [wm_coal_offer_seats|0] de nuestros diputados alrededor de la mesa del Gabinete, y una de nuestras políticas emblemáticas en el programa de gobierno. A cambio, nuestros diputados votarían con el gobierno en todo."
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName] ha llamado. La [wm_coal_senior.GetNameNoTier] tiene [wm_coal_senior_seats|0] escaños, menos de la mayoría, y quiere un acuerdo de confianza y suministro: nuestros diputados respaldan al gobierno en votaciones de confianza y en el Presupuesto, y a cambio el gobierno financia nuestras prioridades. En todo lo demás seríamos libres de votar como queramos."
 wm_coalition.3.a: "Tenemos un trato."
 wm_coalition.3.a.tt: "El trato está firmado, y [wm_coal_pm.GetFirstName] te deberá un favor."
 wm_coalition.3.b: "Gracias, pero no."
 wm_coalition.3.b.tt: "Nuestros diputados permanecen en la oposición, libres para votar en contra del gobierno."

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "Un Trato Está Hecho"
 wm_coalition.4.t_refused: "Las conversaciones se rompen"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName] ha estado de acuerdo. El [wm_coal_party.GetNameNoTier] se une al gobierno, [wm_coal_leader.GetFirstName] se convierte en Viceprimer Ministro, y la prensa ya lo llama un matrimonio de conveniencia. Sus diputados seguirán nuestra disciplina."
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName] ha aceptado. La [wm_coal_party.GetNameNoTier] nos respaldará en votaciones de confianza y en el Proyecto de Ley de Finanzas, por un precio. En todo lo demás, los jefes de bancada tendrán que convencer a sus diputados uno a uno."
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName] nos ha rechazado. [wm_coal_talks.GetNameNoTier] dice que nuestra oferta está muy por debajo de lo que sus miembros aceptarían."
 wm_coalition.4.a: "Un nuevo capítulo para el país."
 wm_coalition.4.b: "Endulzar la oferta."
 wm_coalition.4.c: "Prueba con otra fiesta."
 wm_coalition.4.d: "Entonces gobernamos solos."

 # Breakdown
 wm_coalition.20.t: "hora de irse?"
 wm_coalition.20.desc_coalition: "Nuestros diputados están inquietos. Cada decisión impopular que toma el gobierno se nos atribuye, y el [wm_coal_senior.GetNameNoTier] se lleva el crédito por cualquier cosa que salga bien. Algunos quieren que salgamos de la coalición hoy."
 wm_coalition.20.desc_supply: "Nuestros diputados están inquietos. Sostener el gobierno de [wm_coal_pm.GetName] nos está costando, y el dinero para nuestras prioridades no ha comprado la gratitud que esperábamos. Algunos quieren romper el acuerdo hoy."
 wm_coalition.20.polls_bad: "\n\nLas encuestas son sombrías: hemos bajado mucho desde que hicimos el acuerdo."
 wm_coalition.20.polls_ok: "\n\nLas encuestas se mantienen, por ahora."
 wm_coalition.20.a: "Nos vamos. Que el gobierno se defienda solo."
 wm_coalition.20.a.tt: "El trato termina. El gobierno pierde los votos de tus diputados y puede enfrentarse a una moción de censura o a unas elecciones. El Primer Ministro no te perdonará."
 wm_coalition.20.b: "Dimos nuestra palabra. Nos quedamos."
 wm_coalition.21.t: "Nuestros socios se retiran"
 wm_coalition.21.desc: "Nuestros socios se han retirado, y con ellos nuestra mayoría. La Oposición huele sangre, la prensa quiere saber si podemos sobrevivir, y el Jefe de Mayores ya está contando voces."
 wm_coalition.21.a: "Continuamos como un gobierno minoritario."
 wm_coalition.21.a.tt: "Cada voto en la Cámara de los Comunes será una lucha."
 wm_coalition.21.b: "Encontrar nuevos socios."
 wm_coalition.21.c: "Deja que el país decida: convoca elecciones generales."
 wm_coalition.21.c.tt: "El Parlamento está disuelto y se celebran elecciones generales #bold en cinco semanas#!."

 # Decision
 wm_coalition_leave_decision: "Salir del acuerdo gubernamental"
 wm_coalition_leave_decision_desc: "Retira a tu partido de su acuerdo con el gobierno. Tus diputados serán libres de votar como quieran, el gobierno perderá su mayoría y el Primer Ministro nunca te lo perdonará."
 wm_coalition_leave_decision_tooltip: "Termina tu coalición o acuerdo de confianza y suministro"
 wm_coalition_leave_decision_confirm: "Sal"
 wm_coalition_leave_decision_effect_tt: "El trato termina. El gobierno pierde los votos de tus diputados y puede enfrentarse a una moción de censura o a unas elecciones."
 wm_coalition_leave_no_election_desc: "No se ha convocado una elección general"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "Viceprimer Ministro"
 wm_coalition_deputy_pm_modifier_desc: "Segundo en el gobierno y líder del socio junior de la coalición."
 wm_coalition_compromise_modifier: "Compromiso de coalición"
 wm_coalition_compromise_modifier_desc: "Una de las políticas emblemáticas del socio de la coalición está en el programa de gobierno, y nuestros propios diputados de base están quejando."
 wm_coalition_supply_deal_modifier: "Acuerdo de Confianza y Suministro"
 wm_coalition_supply_deal_modifier_desc: "Apoya al gobierno en votos de confianza y el presupuesto, y tiene dinero para sus prioridades como prueba."
 wm_coalition_partner_opinion: "Socio de coalición"
 wm_coalition_walked_out_opinion: "Abandonó nuestro Gobierno"
 wm_coalition_deputyship_diarchy_type: "Coalición"
 wm_coalition_deputyship_diarch_title: "Viceprimer Ministro"
