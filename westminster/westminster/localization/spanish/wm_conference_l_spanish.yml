l_spanish:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "Conferencia: El discurso del líder"
 wm_conference.1.desc: "Es temporada de conferencias, y el [wm_conference_party.GetNameNoTier] ha tomado un centro de conferencias junto al mar durante cuatro días de reuniones paralelas, acreditaciones y café tibio. Mañana es el gran día: mi discurso ante el auditorio, transmitido en vivo en todos los canales de noticias. Los redactores del discurso han producido el borrador número diecinueve. Las pastillas están en mi bolsillo. El conjunto tiene un lema en letras de cuatro pies de alto, y alguien ha comprobado que ninguna está suelta. Probablemente."
 wm_conference.1.a: "Entregar el discurso tal como está escrito."
 wm_conference.1.b: "Romper el guion y hablar desde el corazón."
 wm_conference.1.c: "Revelar un anuncio de política planificada."

 wm_conference_headline_triumph: "DISCURSO TRIUNFAL PONE A LA SALA DE PIE"
 wm_conference_headline_solid: ": 'BIEN', DICEN LOS DELEGADOS"
 wm_conference_headline_disaster: "DESASTRE PLAGADO DE TOS A MEDIDA QUE EL GABINETE SE DESMORONA"
 wm_conference_headline_policy_hit: "PROMESA AUDACIOSA ROBA EL SHOW"
 wm_conference_headline_policy_flop: "LA POLÍTICA EMBLEMÁTICA SE HUNDE A LA HORA DEL ALMUERZO"
 wm_conference.2.desc_triumph: "Once ovaciones de pie, una de ellas durante una pausa para respirar. Los escritores de sketches están luchando por ser groseros, las encuestas nocturnas están en alza, y el partido parlamentario de repente tiene mucho interés en ser visto conmigo en el bar."
 wm_conference.2.desc_solid: "Sin ovaciones de pie, sin desastres y sin letras cayéndose del fondo. Los periódicos lo llaman \" laborioso\", lo cual de ellos es prácticamente una carta de amor."
 wm_conference.2.desc_disaster: "Comenzó con un cosquilleo en la garganta y terminó con un salón lleno de delegados pasando pastillas al estrado mientras el eslogan detrás de mí perdía dos de sus letras. Un protestante llegó hasta el atril. Los escritores de los sketches no han tenido un día como este en años, y en el bar mis colegas hablan en voz baja."
 wm_conference.2.desc_policy_hit: "La política no fue probada, no se filtró, y encabeza todos los boletines. Los partidos rivales se apresuran a decir que ellos lo pensaron primero. El salón coreó mi nombre, lo cual fue agradable, aunque un poco inquietante."
 wm_conference.2.desc_policy_flop: "Para cuando me había retirado del escenario, un grupo de expertos había encontrado un agujero de cuarenta mil millones de libras en los presupuestos y dos de mis propios miembros de la bancada habían dicho en la radio que nunca habían oído hablar de ello."
 wm_conference.2.a: "Siempre queda el año que viene."

 wm_conference.10.t: "Conferencia: Cordones y Franjas"
 wm_conference.10.desc: "La conferencia [wm_conference_party.GetNameNoTier] está en pleno apogeo: cuatro días de reuniones paralelas en salas laterales sobrecalentadas, recepciones patrocinadas por asociaciones comerciales de las que nadie ha oído hablar y el bar del hotel, donde se realizan los negocios reales después de la medianoche. [wm_conference_leader.GetName] habla mañana. ¿Cómo paso mi conferencia?"
 wm_conference.10.a: "Hablar en una reunión alternativa."
 wm_conference.10.b: "Trama en el bar del hotel."
 wm_conference.10.c: "Trabaja las recepciones y haz contactos."
 wm_conference.10.d: "Sentarse en el salón y aplaudir al líder, de manera fuerte y visible."
 wm_conference_fringe_good: "Fringe: Una sala llena y una buena crítica"
 wm_conference_fringe_off_message: "Fringe: Comentarios 'Se desvían del mensaje'"
 wm_conference_plot_found_out: "Trama: escuchada por los 'whips'"

 wm_conference.20.t: "Rumores sobre el Liderazgo"
 wm_conference.20.desc: "conferencia ha terminado y la conversación no es sobre mi discurso. Colegas anónimos están diciendo a los periódicos dominicales que la [wm_conference_party.GetNameNoTier] necesita \"un nuevo comienzo\", una frase que nunca significa un nuevo logo. Los látigos tienen nombres. La cuestión es qué hago yo al respecto."
 wm_conference.20.a: "Enfréntate a los conspiradores."
 wm_conference.20.b: "Promesa de escuchar al partido parlamentario."
 wm_conference.20.c: "Descartarlo como charlas de la burbuja de Westminster."
 wm_conference_faced_down: "Murmullos: Los conspiradores retroceden"
 wm_conference_not_faced_down: "Murmullos: La historia se prolonga y se prolonga"

 wm_conference_triumph_modifier: "Triunfo en la Conferencia"
 wm_conference_triumph_modifier_desc: "Dio un discurso en la conferencia que la gente seguirá citando el próximo año, por las razones correctas."
 wm_conference_disaster_modifier: "Desastre de la conferencia"
 wm_conference_disaster_modifier_desc: "Dio un discurso en la conferencia que la gente seguirá citando el próximo año, por las razones incorrectas."

 wm_conference_triumph_opinion: "Discurso triunfal en la conferencia"
 wm_conference_disaster_opinion: "Discurso de conferencia desastroso"
 wm_conference_listened_opinion: "Prometido escuchar al partido"
 wm_conference_contacts_opinion: "Se encontraron en la conferencia"
 wm_conference_fellow_plotter_opinion: "Tramaron juntos en el bar del hotel"
 wm_conference_caught_plotting_opinion: "Sorprendido conspirando contra mí"
 wm_conference_loyal_applause_opinion: "Aplaudió mi discurso con más fuerza"
 wm_conference_off_message_opinion: "Se desvió del mensaje en una reunión secundaria"
