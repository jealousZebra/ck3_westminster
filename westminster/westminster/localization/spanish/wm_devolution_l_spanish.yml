l_spanish:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "Leer el Informe de Devolución"
 wm_devolution_briefing_decision_desc: "Nota semanal de la Oficina del Gabinete sobre el estado de la Unión:\n\n#bold Escocia:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% a favor de la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10\n#bold Gales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% a favor de la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10\n#bold Irlanda del Norte:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% a favor de una Irlanda unida; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10; estabilidad de reparto de poder [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100\n\n#bold Confianza pública en la política:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] de 100."
 wm_devolution_briefing_decision_tooltip: "Dónde se encuentra la Unión y cuánto confía el público en sus políticos."
 wm_devolution_briefing_decision_confirm: "Léelo"
 wm_devolution.30.t: "El Estado de la Unión"
 wm_devolution.30.desc: "#italic Oficina del Gabinete, para circulación#!\n\n#bold Escocia:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% apoya la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10\n#bold Gales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% apoya la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10\n#bold Irlanda del Norte:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% apoya una Irlanda unida; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10; estabilidad de reparto de poderes [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100\n\nEl apoyo a la salida varía con la confianza del público en Westminster, con poderes arrebatados o entregados, y con quién dirige cada gobierno descentralizado. Una vez que supera la mitad, un gobierno liderado por nacionalistas puede solicitar formalmente un referéndum.\n\n#bold Confianza pública en la política:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] de 100; participación esperada en unas elecciones generales [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%."
 wm_devolution.30.suspended: "\n\n#N La Asamblea de Irlanda del Norte está suspendida:#! el poder compartido se ha colapsado, y solo las conversaciones (o el tiempo) lo traerán de vuelta."
 wm_devolution.30.sitting: "\n\nLa Asamblea de Irlanda del Norte está reunida, y se mantiene el poder compartido."
 wm_devolution.30.a: "Tomado en cuenta."
 wm_devolution_devolve_decision: "Involverse un poder"
 wm_devolution_devolve_decision_desc: "Darle otro poder a Edimburgo, Cardiff o Belfast. Más poderes quitan presión del caso para irse y agradan al gobierno descentralizado.\n\n#bold Escocia:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% a favor de la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10\n#bold Gales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% a favor de la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10\n#bold Irlanda del Norte:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% a favor de una Irlanda unida; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10; estabilidad en el poder compartido [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100"
 wm_devolution_devolve_decision_tooltip: "Dar más poderes a un gobierno descentralizado."
 wm_devolution_devolve_decision_confirm: "Elige una Nación"
 wm_devolution_devolve_decision_effect_tt: "Elige una nación: sus poderes aumentan en 1, el apoyo a la salida cae #P 3#! puntos (y se asienta más bajo), su Primer Ministro está complacido, y la confianza pública aumenta en 1."
 wm_devolution_claw_back_decision: "Recuperar un poder"
 wm_devolution_claw_back_decision_desc: "Recuperar un poder para Westminster. Los periódicos unionistas aplaudirán; el gobierno descentralizado y sus votantes no. \n\n#bold Escocia:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% a favor de la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10\n#bold Gales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% a favor de la independencia; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10\n#bold Irlanda del Norte:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% a favor de una Irlanda unida; poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10; estabilidad en el reparto de poderes [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100"
 wm_devolution_claw_back_decision_tooltip: "Devolver un poder descentralizado a Westminster."
 wm_devolution_claw_back_decision_confirm: "Elige una Nación"
 wm_devolution_claw_back_decision_effect_tt: "Elige una nación: sus poderes disminuyen en 1, el apoyo a la salida salta #N 3#! puntos (y se asienta más alto), su Primer Ministro está furioso, la confianza pública cae en 2, y obtienes un poco de perfil."
 wm_devolution_stormont_talks_decision: "Convocar conversaciones de Stormont"
 wm_devolution_stormont_talks_decision_desc: "La compartición del poder en Irlanda del Norte se ha derrumbado. Lleve a las partes a la mesa para conversaciones intensivas: un acuerdo restaura la Asamblea. Su oportunidad mejora con su carisma y con la estabilidad de la compartición del poder (ahora [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] de 100)."
 wm_devolution_stormont_talks_decision_tooltip: "Intentar restablecer el reparto de energía en Stormont."
 wm_devolution_stormont_talks_decision_confirm: "Convocar las conversaciones"
 wm_devolution_stormont_talks_decision_effect_tt: "El éxito restaura la Asamblea, aumenta la confianza pública en 2 y te gana perfil. El fracaso aún acerca a los partidos (+5 estabilidad)."
 wm_devolution.1.t: "Una Solicitud de Referéndum"
 wm_devolution.1.desc: "El [wm_dev_gov.GetNameNoTier] ha solicitado formalmente a Westminster el poder de llevar a cabo un referéndum sobre la salida del Reino Unido. Sus propias encuestas sitúan el apoyo en [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%, y dice que el mandato es claro.\n\n Los bancos unionistas quieren un no rotundo. Sus asesores están menos seguros."
 wm_devolution.1.a: "Acordar un referéndum."
 wm_devolution.1.a.tt: "Día de las elecciones en seis meses. El resultado depende del apoyo entonces, más o menos algunos puntos. Un Sí sería un desastre para ti."
 wm_devolution.1.b: "Ahora no es el momento."
 wm_devolution.1.b.tt: "El apoyo para salir aumenta en #N 4#! puntos y el Primer Ministro te resiente. Pueden preguntar de nuevo en tres años."
 wm_devolution.1.c: "Ofrecer más poderes en su lugar."
 wm_devolution.1.c.tt: "La nación gana un poder y el apoyo cae en #P 3#! puntos, a un pequeño costo en perfil. Pueden preguntar de nuevo en tres años."
 wm_devolution.20.t: "Transferencia de Poder"
 wm_devolution.20.desc: "¿Qué gobierno descentralizado obtiene los nuevos poderes?"
 wm_devolution.20.scotland: "Devolucionar a Escocia (poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10)."
 wm_devolution.20.wales: "Transferencia a Gales (poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10)."
 wm_devolution.20.northern_ireland: "Transferida a Irlanda del Norte (poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10)."
 wm_devolution.20.none: "Pensándolo bien, ahora no."
 wm_devolution.21.t: "Retomar el control"
 wm_devolution.21.desc: "¿Qué gobierno descentralizado pierde un poder ante Westminster?"
 wm_devolution.21.scotland: "Recuperar de Escocia (poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] de 10)."
 wm_devolution.21.wales: "Recuperar de Gales (poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] de 10)."
 wm_devolution.21.northern_ireland: "Recuperar de Irlanda del Norte (poderes [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] de 10)."
 wm_devolution.21.none: "Pensándolo bien, ahora no."
 wm_dev_referendum_agreed_toast: "REFERÉNDUM ACEPTADO"
 wm_dev_referendum_agreed_toast_desc: "Westminster ha aceptado la solicitud de [wm_dev_gov.GetNameNoTier]: se celebrará un referéndum sobre la salida del Reino Unido en seis meses."
 wm_dev_referendum_refused_toast: "REFERÉNDUM RECHAZADO"
 wm_dev_referendum_refused_toast_desc: "Westminster ha rechazado la solicitud de [wm_dev_gov.GetNameNoTier] para un referéndum. Aumenta el apoyo a la salida."
 wm_dev_referendum_powers_toast: "MÁS PODERES EN SU LUGAR"
 wm_dev_referendum_powers_toast_desc: "Westminster ha respondido a la solicitud de [wm_dev_gov.GetNameNoTier] para un referéndum con una oferta de nuevos poderes."
 wm_dev_stormont_collapse_toast: "STORMONT COLAPSA"
 wm_dev_stormont_collapse_toast_desc: "La compartición de poder en Irlanda del Norte se ha colapsado y la Asamblea está suspendida. La confianza pública se ve afectada."
 wm_dev_stormont_restored_toast: "STORMONT RESTAURADO"
 wm_dev_stormont_restored_toast_desc: "Se ha alcanzado un acuerdo y el poder compartido regresa a Irlanda del Norte."
 wm_dev_stormont_talks_failed_toast: "FALLAN LAS NEGOCIACIONES DE STORMONT"
 wm_dev_stormont_talks_failed_toast_desc: "Las conversaciones se rompieron sin acuerdo, aunque las partes están más cerca que antes."
 wm_dev_referendum_yes_toast_scotland: "ESCOCIA VOTA SÍ"
 wm_dev_referendum_yes_toast_scotland_desc: "Escocia ha votado por la independencia escocesa, por un [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Comienzan las negociaciones para salir del Reino Unido y la autoridad del Primer Ministro se ve destrozada."
 wm_dev_referendum_no_toast_scotland: "ESCOCIA VOTA NO"
 wm_dev_referendum_no_toast_scotland_desc: "Escocia ha rechazado la independencia escocesa: solo el [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% votó Sí. La cuestión está resuelta durante una generación, o eso espera Westminster."
 wm_dev_referendum_yes_toast_wales: "GALES VOTA SÍ"
 wm_dev_referendum_yes_toast_wales_desc: "Gales ha votado por la independencia de Gales, por un [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Comienzan las negociaciones para salir del Reino Unido y la autoridad del Primer Ministro se ve destrozada."
 wm_dev_referendum_no_toast_wales: "GALES VOTA NO"
 wm_dev_referendum_no_toast_wales_desc: "Gales ha rechazado la independencia galesa: solo el [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% votó Sí. La cuestión está resuelta durante una generación, o eso espera Westminster."
 wm_dev_referendum_yes_toast_northern_ireland: "IRLANDA DEL NORTE VOTA SÍ"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "Irlanda del Norte ha votado por una Irlanda unida, por [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Comienzan las negociaciones para salir del Reino Unido, y la autoridad del Primer Ministro queda destrozada."
 wm_dev_referendum_no_toast_northern_ireland: "IRLANDA DEL NORTE VOTA NO"
 wm_dev_referendum_no_toast_northern_ireland_desc: "Irlanda del Norte ha rechazado una Irlanda unida: solo [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% votó Sí. La cuestión está resuelta por una generación, o eso espera Westminster."
 wm_dev_assembly_suspended_modifier: "Asamblea Suspendida"
 wm_dev_assembly_suspended_modifier_desc: "La compartición de poder se ha colapsado y la Asamblea de Irlanda del Norte está suspendida."
