 # Change Your Politics (common/decisions/wm_ideo_decisions.txt)
 wm_ideo_change_decision: "Cambia tu Política"
 wm_ideo_change_decision_desc: "Los argumentos cambian, y la gente también. Adopta una nueva perspectiva política: los colegas lo llamarán un giro de 180 grados, los admiradores una conversión."
 wm_ideo_change_decision_tooltip: "Adoptar una ideología diferente"
 wm_ideo_change_decision_confirm: "Cambiar de opinión"
 wm_ideo_change_decision_choose: "Elige una ideología"
 wm_ideo_change_decision_effect_tt: "Su [faith|E] se convierte en el que eligió. Un diputado Laborista o Conservador se mueve a la ala de su partido."
 wm_ideo_pick_socialist_desc: "Conviértete en Socialista. Propiedad pública, derechos de los trabajadores y fin a la desigualdad: la izquierda socialista democrática."
 wm_ideo_pick_social_democrat_desc: "Conviértete en Socialdemócrata. Un país más justo a través de servicios públicos bien financiados y una economía mixta: el centro-izquierda convencional."
 wm_ideo_pick_green_desc: "Conviértete en Verde. La emergencia climática primero, con justicia social y una democracia más justa."
 wm_ideo_pick_liberal_desc: "Conviértete en Liberal. Libertad personal, votos justos y una relación cercana con Europa: la tradición liberal."
 wm_ideo_pick_centrist_desc: "Conviértete en Centrista. Competencia sobre ideología: moderado, proempresarial y pragmático."
 wm_ideo_pick_cross_community_desc: "Conviértete en Comunitario Cruzado. Ni unionista ni nacionalista: un futuro compartido para las comunidades de Irlanda del Norte."
 wm_ideo_pick_one_nation_desc: "Conviértete en Conservador Una Nación. Conservadurismo moderado y paternalista: responsabilidad social, instituciones estables y la Unión."
 wm_ideo_pick_free_market_desc: "Conviértete en Defensor del Libre Mercado. Impuestos más bajos, desregulación y un estado más pequeño para impulsar el crecimiento."
 wm_ideo_pick_national_conservative_desc: "Conviértete en Conservador Nacional. Familia, nación y tradición, con una inmigración mucho más baja."
 wm_ideo_pick_populist_right_desc: "Conviértete en Populista. Contra el establecimiento de Westminster: control fronterizo, soberanía e impuestos más bajos."
 wm_ideo_pick_scottish_nationalist_desc: "Conviértete en Nacionalista Escocés. Una Escocia independiente en Europa, con un programa socialdemócrata en casa."
 wm_ideo_pick_welsh_nationalist_desc: "Conviértete en Nacionalista Galés. Autogobierno para Gales y protección del idioma galés."
 wm_ideo_pick_irish_republican_desc: "Conviértete en Republicano Irlandés. Una Irlanda unida y fin de la partición, con un programa de izquierda."
 wm_ideo_pick_irish_nationalist_desc: "Conviértete en Nacionalista Irlandés. Nacionalismo constitucional: unidad irlandesa por consentimiento, reparto de poder y socialdemocracia."
 wm_ideo_pick_unionist_desc: "Conviértete en Unionista. El lugar de Irlanda del Norte en el Reino Unido, defendido sobre todo lo demás."
