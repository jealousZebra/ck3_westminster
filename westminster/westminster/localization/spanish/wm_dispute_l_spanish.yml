l_spanish:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "El Conteo"
 wm_dispute.1.desc: "#italic Declaración del oficial electoral#!\n\n[wm_dispute_mp.GetName] ha sido declarado ganador en [wm_dispute_seat.GetNameNoTier] por un margen de [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] puntos."
 wm_dispute.1.close: "Está lo suficientemente cerca como para que los agentes ya estén murmurando sobre lotes de papeletas contadas dos veces y una caja que llegó tarde. Un recuento (una semana, [EmptyScope.ScriptValue('wm_dispute_recount_cost')|0] en tarifas) podría cambiarlo, quizá con una probabilidad del [EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0] %; una petición electoral (cuatro meses y [EmptyScope.ScriptValue('wm_dispute_court_cost')|0]) podría ver el resultado declarado nulo y la silla disputada de nuevo, quizá con una probabilidad del [EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0] %."
 wm_dispute.1.clear: "No está cerca. Un recuento ([EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]) muy probablemente no cambiaría nada, y al público no le gusta un mal perdedor: disputarlo te costará perfil y capital político."
 wm_dispute.1.bad: "Ni siquiera estuvo cerca: una derrota aplastante. Cuestionarlo te haría objeto de burlas y podría llevar a que seguidores enfadados salgan a las calles."
 wm_dispute.1.a: "Felicita al ganador."
 wm_dispute.1.b: "Exigir un recuento."
 wm_dispute.1.b.tt: "Cada papeleta se cuenta de nuevo. Cuesta dinero; si el resultado no estuvo cerca, también te cuesta perfil y capital político."
 wm_dispute.1.c: "Petición al tribunal electoral."
 wm_dispute.1.c.tt: "Los jueces examinan la conducta de la elección. Es lento y caro; pueden declarar la elección nula y ordenar una nueva elección parcial, o imponer los costos en su contra."
 wm_dispute_recount_toast: "Recuento en [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName] ha exigido un recuento en [wm_dispute_seat.GetNameNoTier]. El personal de conteo ha regresado a sus mesas."
 wm_dispute_court_toast: "Petición Electoral: [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName] ha presentado una petición al tribunal electoral sobre el resultado en [wm_dispute_seat.GetNameNoTier]. Los jueces informarán en unos meses."
 wm_dispute_overturned_toast: "EL RECUENTO ANULA EL RESULTADO"
 wm_dispute_overturned_toast_desc: "Después de un recuento, [wm_dispute_mp.GetName] es declarado miembro del parlamento por [wm_dispute_seat.GetNameNoTier] por un puñado de votos."
 wm_dispute_upheld_toast: "El Recuento Confirma el Resultado"
 wm_dispute_upheld_toast_desc: "El recuento en [wm_dispute_seat.GetNameNoTier] confirma a [wm_dispute_mp.GetName] como su parlamentario."
 wm_dispute_void_toast: "ELECCIÓN DECLARADA NULA"
 wm_dispute_void_toast_desc: "El tribunal electoral ha declarado nulo el resultado en [wm_dispute_seat.GetNameNoTier]. Habrá una nueva elección parcial."
 wm_dispute_dismissed_toast: "Petición Electoral Desestimada"
 wm_dispute_dismissed_toast_desc: "El tribunal electoral ha desestimado la petición sobre [wm_dispute_seat.GetNameNoTier] y ha impuesto las costas contra el peticionario. [wm_dispute_mp.GetName] se mantiene."
 wm_dispute_national_toast: "SE NIEGA A CONCEDER"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] no aceptará el resultado de las elecciones generales. Nada cambiará, pero los seguidores se están reuniendo en las calles y los periódicos son implacables."
 wm_dispute_seat_decision: "Desafía el Conteo"
 wm_dispute_seat_decision_desc: "Perdiste tu escaño, pero ¿fue correcto el recuento? Solicita un nuevo recuento o presenta una petición ante el tribunal electoral para declarar nula la elección. Si no fue reñido, el público te verá como mal perdedor."
 wm_dispute_seat_decision_tooltip: "Impugnar el resultado en el escaño que perdiste."
 wm_dispute_seat_decision_confirm: "Piénsalo"
 wm_dispute_seat_decision_effect_tt: "Decides si aceptar el resultado, exigir un recuento de #bold#! o apelar al tribunal electoral #bold#!."
 wm_dispute_not_disputed_tt: "El resultado aún no ha sido disputado"
 wm_dispute_no_byelection_tt: "El escaño no está esperando una elección parcial"
 wm_dispute_national_decision: "Negarse a Conceder"
 wm_dispute_national_decision_desc: "Los votantes te han echado de Downing Street. Podrías negarte a aceptarlo: cuestionar el recuento, los votos postales, las cadenas. No cambiará nada, te costará caro y traerá a tus seguidores más enfadados a las calles."
 wm_dispute_national_decision_tooltip: "Negarse a aceptar el resultado de las elecciones generales."
 wm_dispute_national_decision_confirm: "Negarse a conceder"
 wm_dispute_national_decision_effect_tt: "Pierdes gran parte del perfil de #bold y del capital político#!, tu partido cae en las encuestas, el nuevo Primer Ministro lo resiente, y pueden estallar disturbios #bold#!."
 wm_dispute_sore_loser_modifier: "Mal Perdedor"
 wm_dispute_sore_loser_modifier_desc: "Se negó a aceptar el resultado de una elección general."
 wm_dispute_bad_loser_modifier: "Mal perdedor"
 wm_dispute_bad_loser_modifier_desc: "Impugnó un resultado que claramente había perdido."
 wm_dispute_sore_loser_opinion: "Se negó a conceder"
