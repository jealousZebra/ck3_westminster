l_spanish:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "Alborotadores en [wm_riot_seat.GetName]"
 wm_riot_gathering_toast_desc: "Multitudes enfadadas se han reunido en [wm_riot_seat.GetName]. [wm_riot_organiser.GetName] está organizando una marcha de protesta en Westminster."
 wm_riot_marching_toast: "Marcha de protesta desde [wm_riot_seat.GetName]"
 wm_riot_marching_toast_desc: "La marcha de protesta desde [wm_riot_seat.GetName] se ha puesto en marcha hacia Westminster, liderada por [wm_riot_organiser.GetName]. Llegará dentro del mes con sus demandas."

 wm_riot_demand_1_desc: "\n\nQuieren ayuda con el #bold costo de vida#!: las facturas, los alquileres y los precios de los alimentos se han disparado, y dicen que al gobierno no le importa."
 wm_riot_demand_2_desc: "\n\nQuieren la #bold renuncia de un ministro#!: alguien en el Gabinete tiene que asumir la culpa, y quieren una cabeza."
 wm_riot_demand_3_desc: "\n\nQuieren unas #bold elecciones generales#!: el gobierno no tiene un mandato para lo que está haciendo, dicen, y el país debería decidir."
 wm_riot_demand_4_desc: "\n\nQuieren un #bold giro de 180 grados#!: una política que odian eliminada, ahora, sin peros ni condiciones."

 wm_riot.10.t: "Problemas en [wm_riot_seat.GetName]"
 wm_riot.10.desc: "El teléfono de mi oficina de circunscripción no ha dejado de sonar. Cientos de personas están en las calles de [wm_riot_seat.GetName], las tiendas tienen sus persianas bajadas, y un activista local, [wm_riot_organiser.GetName], está diciendo a las cámaras que la multitud marchará hacia Westminster a menos que alguien escuche."
 wm_riot.10.a: "Sal y habla con ellos."
 wm_riot.10.a.success: "La multitud escucha y se va a casa"
 wm_riot.10.a.failure: "Abucheado en la calle"
 wm_riot.10.b: "Decir públicamente que tienen razón."
 wm_riot.10.c: "Mantener la cabeza baja y dejar que el Número 10 se encargue de ello."

 wm_riot.20.t: "La Marcha Llega a Westminster"
 wm_riot.20.desc: "La plaza del Parlamento está llena de pancartas."
 wm_riot.20.desc_first: "La marcha de protesta de [wm_riot_seat.GetName] ha llegado, y su organizador, [wm_riot_organiser.GetName], ha pedido reunirse conmigo con una lista de demandas."
 wm_riot.20.desc_bigger: "La marcha desde [wm_riot_seat.GetName] ha vuelto, más grande y más enfadada que antes. [wm_riot_organiser.GetName] dice que no habrá más conversaciones."
 wm_riot.20.desc_gone: "\n\nPara cuando he leído el informe, la multitud se ha ido a casa."
 wm_riot.20.a: "Dales lo que quieren."
 wm_riot.20.b: "Invitar a los organizadores a hablar."
 wm_riot.20.b.success: "Se acuerda un compromiso"
 wm_riot.20.b.failure: "Las conversaciones colapsan"
 wm_riot.20.c: "Dile a la policía que despeje la plaza."
 wm_riot.20.c.dispersed: "La policía despeja la plaza."
 wm_riot.20.c.violence: "Escenas de violencia en las noticias de la noche"
 wm_riot.20.d: "Bien."

 wm_riot_county_modifier: "Disturbios"
 wm_riot_county_modifier_desc: "Multitudes enfadadas están en las calles y una marcha de protesta está en curso."
 wm_riot_demands_met_county_modifier: "Demandas cumplidas"
 wm_riot_demands_met_county_modifier_desc: "El gobierno dio a los manifestantes lo que querían."
 wm_riot_compromise_county_modifier: "Un Compromiso"
 wm_riot_compromise_county_modifier_desc: "Los manifestantes se fueron a casa con un acuerdo."
 wm_riot_policed_county_modifier: "Protesta disuelta"
 wm_riot_policed_county_modifier_desc: "La policía dispersó la marcha de protesta, y la gente aquí no lo ha olvidado."
 wm_riot_crackdown_county_modifier: "Violencia policial"
 wm_riot_crackdown_county_modifier_desc: "Las fotos de la policía cargando contra la marcha de protesta todavía se están compartiendo."
 wm_mp_backed_protesters_county_modifier: "Diputado respaldó la protesta"
 wm_mp_backed_protesters_county_modifier_desc: "El diputado local se puso del lado de los manifestantes."
 wm_cost_of_living_package_modifier: "Paquete de costo de vida"
 wm_cost_of_living_package_modifier_desc: "Ayuda con las facturas, pagadas por el gobierno."
 wm_u_turn_modifier: "U-Turn"
 wm_u_turn_modifier_desc: "Obligado a dar una humillante vuelta en U por una marcha de protesta."
 wm_heavy_handed_modifier: "Pesado"
 wm_heavy_handed_modifier_desc: "Envió a la policía contra una marcha de protesta."
 wm_crackdown_modifier: "Culpado de violencia policial"
 wm_crackdown_modifier_desc: "Patrullar una marcha de protesta que se volvió violenta, y la culpa recayó aquí."

 wm_forced_to_resign_opinion: "Me obligaron a renunciar"
 wm_backed_protesters_opinion: "Se puso del lado de los manifestantes"
 wm_policed_my_constituents_opinion: "Envió a la policía contra mis constituyentes"
