l_spanish:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "En la Campaña Electoral: Semana [EmptyScope.ScriptValue('wm_campaign_week_value')|0]"
 wm_campaign.1.desc: "El Parlamento se disuelve y el autobús de campaña está en marcha afuera. La programación tiene un espacio que llenar esta semana, mi teléfono tiene 140 mensajes no leídos, y alguien me ha puesto una roseta sin preguntar."
 wm_campaign.1.desc_leader: "\n\nComo líder del [wm_campaign_party.GetNameNoTier], cada movimiento que hago es noticia nacional. Los broadcasters quieren un enfrentamiento directo con [wm_campaign_rival.GetName], y la unidad de política tiene un lanzamiento listo. En casa, mi agente en [wm_campaign_seat.GetNameNoTier] quisiera verme al menos una vez antes del día de la votación."
 wm_campaign.1.desc_leader_no_rival: "\n\nComo líder del [wm_campaign_party.GetNameNoTier], cada movimiento que hago es noticia nacional, y la unidad de política tiene un lanzamiento listo."
 wm_campaign.1.desc_mp: "\n\nLa campaña nacional no tiene idea de quién soy, lo cual es un alivio. Lo que importa es [wm_campaign_seat.GetNameNoTier]: los folletos, las visitas puerta a puerta, y si el periódico local imprime mi foto correctamente."
 wm_campaign.1.a: "Realizar un gran mitin."
 wm_campaign.1.b: "Enfrentarse a [wm_campaign_rival.GetFirstName] en el debate televisivo."
 wm_campaign.1.c: "Haz el debate de TV, y entierra [wm_campaign_rival.GetFirstName] en estadísticas."
 wm_campaign.1.d: "Lanzar una política insignia."
 wm_campaign.1.e: "Ve a tocar puertas en [wm_campaign_seat.GetNameNoTier]."
 wm_campaign.1.f: "Una semana tranquila en la sede de campaña, aprobando folletos."

 wm_campaign_rally_success: "Concentración: Recepción Entusiasta"
 wm_campaign_rally_flat: "Concentración: Aplauso Cortés"
 wm_campaign_rally_flop: "Concentración: Salón Medio Vacío"
 wm_campaign_debate_won: "Debate: Encuestas Instantáneas Deciden Por Ti"
 wm_campaign_debate_lost: "Debate: Flotó Bajo las Luces"
 wm_campaign_debate_wonk_won: "Debate: Muerte por Hoja de Cálculo (De Ellos)"
 wm_campaign_debate_wonk_lost: "Debate: Perdiendo a la Audiencia en 'Margen Fiscal'"
 wm_campaign_policy_success: "Lanzamiento de Política: Va Directo al Punto"
 wm_campaign_policy_flop: "Lanzamiento de Política: Costos Revelados en la Radio del Desayuno"
 wm_campaign_door_knock: "Tocando puertas: Acercamientos Ganados"

 wm_campaign.2.t: "¡Metedura de pata!"
 wm_campaign.2.desc: "Mi oficial de prensa tiene el rostro de alguien que acaba de ver las portadas de mañana."
 wm_campaign_gaffe_1: "Un fotógrafo me atrapó comiendo un sándwich de tocino en una parada de café, y el resultado se está describiendo en línea como \" una situación de rehenes con un desayuno\". Ya es un meme, una taza y un tono de llamada."
 wm_campaign_gaffe_2: "Olvidé que mi micrófono todavía estaba encendido después de una visita a la fábrica, y todo el país ahora me ha oído llamar a un votante \"un poco excesivo, francamente\". Ella ha dado cuatro entrevistas desde el almuerzo."
 wm_campaign_gaffe_3: "Preguntado en radio en vivo cuánto cuesta una pinta de leche, respondí \" ¿unos once libras?\" con verdadera confianza. El presentador dejó que el silencio durara nueve segundos."
 wm_campaign_gaffe_4: "En una sesión de fotos, entré confiadamente por la puerta equivocada, en un armario, y las cámaras esperaron a que volviera a salir. Lo hice, finalmente, sosteniendo un trapeador."
 wm_campaign_gaffe_5: "Fui filmado sosteniendo uno de nuestros folletos al revés durante todo un discurso, bajo un banner que mal escribía el nombre de la circunscripción. También el nombre de nuestro propio candidato."
 wm_campaign.2.a: "Ríete de ello. Todos tienen un mal día de sándwich."
 wm_campaign.2.b: "Culpar a un miembro junior del personal."
 wm_campaign.2.c: "Apóyalo: hazlo de nuevo, a propósito, para las cámaras."
 wm_campaign_gaffe_shrugged: "Metedura de pata: El público lo encuentra bastante entrañable"
 wm_campaign_gaffe_stuck: "Metedura de pata: Encabeza todos los boletines"
 wm_campaign_gaffe_viral: "Metedura de pata: La auto-mofa se vuelve viral (de manera positiva)"
 wm_campaign_gaffe_doubled: "Metedura de pata: \"Insistir\" no fue la respuesta"

 wm_campaign_doorstep_county_modifier: "Conocieron a su Diputado en la Puerta"
 wm_campaign_doorstep_county_modifier_desc: "Su diputado llamó a las puertas aquí durante la campaña y recordó limpiarse los pies."
 wm_campaign_viral_gaffe_modifier: "Error viral"
 wm_campaign_viral_gaffe_modifier_desc: "Un error de campaña que Internet no dejará pasar."

 wm_campaign_debate_humiliated_opinion: "Gáname en el debate de televisión"
