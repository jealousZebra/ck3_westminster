l_spanish:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "Los beneficios eclesiásticos eran propiedades locales o remotas, oficinas o ingresos papales compartidos que un miembro de los funcionarios del partido podía recibir #i in commendam#! (en fideicomiso). Generaban un ingreso, usualmente sin responsabilidades administrativas directas."
 additional_mandala_government_piety_levels: "El [mandala|E] [government|E] puede desbloquear niveles adicionales de Capital Político después de [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] hasta, e incluyendo, [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]. Para alcanzar ese grado de divinidad, su Lealtad debe demostrarse a lo largo de generaciones."
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ es el nivel más alto de [crown_authority|E]. [vassals|E] tienen una penalización #N -30#! [opinion|E] hacia su [liege|E].\n\nEn este nivel — además de los efectos de [high|E] y [limited|E] Autoridad de la Corona — el gobernante puede elegir un [designated_heir|E] a un costo de [prestige|E].\n\nAdemás, los parlamentarios no pueden declarar la guerra ni siquiera contra gobernantes extranjeros."
 game_concept_acclaimed_knight: "Organizador Estrella"
 game_concept_acclaimed_knight_desc: "El [knight|E] que sostiene un [accolade|E].\n\n Para ser un Organizador Estrella, un Organizador debe ser [unlanded|E] o un [baron|E], con al menos [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] o más [prowess|E]. Un Organizador Estrella debe ser elegible para al menos un [accolade_type|E] que no sea ya poseído por otro de los Organizadores Estrella de su [liege|e].\n\n Los Organizadores Estrella tienen menos probabilidades de ser muertos o capturados en batalla. Pueden mejorar su [glory|E] principalmente luchando contra [wars|E] y asistiendo a [activities|E] como el [GetActivityType( 'activity_tournament' ).GetName].\n\n Los organizadores aclamados pueden ocasionalmente obtener [skills|E] y [traits|E] relacionados con los Atributos de su G Premio."
 game_concept_acclaimed_knight_possessive: "Del Organizador Estrella"
 game_concept_acclaimed_knights: "Organizadores Estrella"
 game_concept_accolade_desc: "Las Distinciones son honores otorgados a [knights|E] por su [liege|E].\n\nEl Organizador que posee una Distinción se convierte en un [acclaimed_knight|E].\n\nA medida que el Organizador Estrella gana [glory|E], su Aptitud [accolade_squires|E] aumenta (mejorando [accolade_succession|E]) y se puede ganar [accolade_ranks|E]. Estos permiten desbloquear más [accolade_types|E], ofreciendo bonificaciones más fuertes.\n\nCuando un Organizador Estrella muere, se realiza [accolade_succession|E] y el organizador es reemplazado inmediatamente con un sucesor cuyas habilidades se modifican por la Aptitud [accolade_squires|E].\n\n[innovations|e] y [title_tiers|e] más altos permiten que [rulers|E] tenga más Distinciones simultáneamente."
 game_concept_accolade_squires_desc: "Cada [accolade|E] tiene una métrica de Aptitud de Escuderos, que modifica el [traits|E] y [skills|E] (principalmente, [prowess_skill|E], [martial_skill|E] y [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]) de su siguiente [acclaimed_knight|E].\n\nHay 5 niveles de Aptitud para Escuderos:\n$EFFECT_LIST_BULLET$Logrado\n$EFFECT_LIST_BULLET$Capaz\n$EFFECT_LIST_BULLET$Inexperto\n$EFFECT_LIST_BULLET$Ineficaz\n$EFFECT_LIST_BULLET$Patético\n\nTener una Aptitud de Inexperto o superior hará que el Organizador Estelar influya esporádicamente en el [traits|E] y el [skills|E] de los [courtiers|E] jóvenes de género marcial, dándoles prioridad para asumir el Premio tras [accolade_succession|E]\n\nLos Escuderos se mejoran principalmente con la ganancia de [glory|E], pero también:\n$EFFECT_LIST_BULLET$El [prowess_skill|E] del Organizador EstelarZZ\n$EFFECT_LIST_BULLET$El [martial_skill|E] del Organizador Estelar'\n$EFFECT_LIST_BULLET$El Organizador Estelar ganando [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$El Organizador Estelar ganando [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$El [martial_skill|E] del Premio [liege|E]\n$EFFECT_LIST_BULLET$El [prowess_skill|E] del Premio [liege|E]\n\nCada [accolade_succession|E] reinicia los Escuderos del Premio."
 game_concept_accolade_succession_desc: "La Sucesión de la Distinción ocurre cuando un [accolade_possessive|E] [acclaimed_knight|e] muere o se vuelve inválido.\n\nEl anterior Organizador Estrella es reemplazado inmediatamente. Los jóvenes [courtiers|E] y [knights|E] entrenados debido a la Aptitud [accolade_squires|E] de la Distinción son los primeros favorecidos como Sucesores; luego otros organizadores, otro personal, vagabundos, y finalmente nuevos [characters|E]. Basado en la Aptitud [accolade_squires|E] de la Distinción, el nuevo Organizador recibirá aumentos en [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E], y posiblemente otros [skills|E].\n\nDespués de la Sucesión de la Distinción, puede perderse una pequeña cantidad de [glory|E] y la Aptitud de Escuderos de la Distinción se reinicia para reflejar ahora las habilidades y experiencia de su nuevo Organizador Estrella\n\nEl Organizador Estrella que muera en batalla, en un duelo u otra manera honorable negará la pérdida de Gloria y mejorará los Escuderos de la Distinción."
 game_concept_accolade_type_desc: "Un [accolade|E] puede tener hasta #value 3#! Atributos, los cuales proporcionan bonificaciones de escalado a medida que se desbloquean niveles más altos. Cada Atributo tiene #value 3#! Niveles. Cuando un Galardón aumenta su [accolade_rank|E], su propietario puede aumentar el nivel de un Atributo existente o agregar un nuevo Atributo al Galardón. El [acclaimed_knight|E], sin embargo, debe cumplir con los requisitos de cualquier nuevo Atributo.\n\nCada [knight|E] solo es elegible para ciertos Atributos, que pueden basarse en [traits|E], [skills|E] o desbloqueos experienciales mientras se sirve como Organizador.\n\nCada Galardón debe tener Atributos únicos: un Líder de Partido #high no puede#! duplicar Atributos entre Galardones. Cada Galardón también puede especializarse únicamente en #value 1#! Atributo de tipo [men_at_arms|E]."
 game_concept_ai_economical_boom_personality_desc: "Un $game_concept_ai_economical_boom_personality$ quiere invertir todo su [gold|E] en el [realm|E]. Vaciarán su tesorería para financiar [buildings|E] y [men_at_arms|E], y a menudo construyen más [economic_buildings|E] y [holdings|E]. Solo ahorran fondos si están directamente amenazados, como por un [faction|E] fuerte.\n\n$game_concept_ai_economical_boom_personality$ Los gobernantes son un poco menos propensos a crear y promover [legends|E].\n\n Los Gobernantes Audaces con propensión a construir y sin inclinación particular por [war|E] tienden a ser $game_concept_ai_economical_boom_personality$s.\n Los Rasgos Comunes incluyen [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )] y [GetTrait('profligate').GetName( GetNullCharacter )]. Los gobernantes con el [GetFocus('stewardship_domain_focus').GetName] también tienden a ser $game_concept_ai_economical_boom_personality$s."
 game_concept_ai_pious_builder_personality_desc: "Un $game_concept_ai_pious_builder_personality$ quiere invertir todo su [gold|E] en aumentar su [piety|E].\n\n Gastarán su tesorería para financiar [buildings|E], [great_projects|E], [activities|E] y [decisions|E] religiosas y ceremoniales, y a menudo construyen más [pious_buildings|E] y [temple|E], o [temple_citadel|E] [holdings|E]. Solo ahorran fondos si están directamente amenazados, como por un [faction|E] fuerte.\n\n$game_concept_ai_pious_builder_personality$ son más propensos a crear y promover santos [legends|E].\n\n Los [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] celosos con una inclinación por [virtue|E] y sin inclinación particular por [war|E], tienden a ser $game_concept_ai_pious_builder_personality$s.\n Los Rasgos Comunes incluyen [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )] y [GetTrait('generous').GetName( GetNullCharacter )]. Los gobernantes con el [GetFocus('learning_theology_focus').GetName] también tienden a ser $game_concept_ai_pious_builder_personality$s."
 game_concept_ai_warlike_personality_desc: "Un $game_concept_ai_warlike_personality$ [ruler|E] quiere estar listo para declarar [war|E], siempre. Guardarán [gold|E] para [war|E] antes de invertirlo en desarrollar su [realm|E]. Si un Gobernante $game_concept_ai_warlike_personality$ está en paz por un período prolongado, utilizará los Fondos en su tesoro de guerra para construir [buildings|E].\n\n$game_concept_ai_warlike_personality$ los gobernantes son más propensos a crear y promover [legends|E] heroicos.\n\n gobernantes audaces y codiciosos tienden a ser Belicosos.\nRasgos Comunes incluyen [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )], y [GetTrait('zealous').GetName( GetNullCharacter )]."
 game_concept_alliance_desc: "Un $game_concept_alliance$ es una relación diplomática entre dos [rulers|E]. Los [independent|E] pueden llamar a los $game_concept_allies$ para unirse a los [wars|E] del otro. \n\nLas alianzas se crean y se mantienen a través de un [marriage|E] o [betrothal|E], siempre que los dos personajes que están casados estén lo suficientemente relacionados con los dos gobernantes. Por ejemplo, si un [king|E] casa a su hija con el hijo de otro rey, los dos reyes se convierten en $game_concept_allies$.\n\n[lieges|E] también pueden crear $game_concept_alliances$ con sus [vassals|E]. El líder del partido no puede llamar al miembro de base a la guerra, pero le impide unirse a [factions|E]."
 game_concept_anointment_request_desc: "La Unción de Solicitud [character_interaction|E] es una interacción especial que puede ser usada por un [ruler|E] de [empire|E] [title_tier|E] o superior en su [head_of_faith|E], o los funcionarios del partido [head_of_rite|E] cuando no haya ninguno, para asegurar su apoyo en un [anointment|E]."
 game_concept_archdiocese_desc: "Una Arquidiócesis es la [christian|E] forma de una [clerical_region|E], un portafolio eclesiástico mantenido por un [archbishop|E] a través de su [clerical_title|E] y establecido en una capital [county|E], donde se puede levantar un [grand_cathedral|E].\n\nA [christian|E] [ruler|E] responde en asuntos espirituales al [archbishop|E] de la Arquidiócesis que contiene su [capital|E] [county|E], y el territorio sujeto a las Arquidiócesis constituye colectivamente [the_christian_church|E] [situation|E]."
 game_concept_aspect_of_serenity_desc: "Un partido pacífico es un partido próspero — el Aspecto de la Serenidad valora la tranquilidad y los tratos diplomáticos, otorgando bonificaciones a quienes se alinean con su causa.\n$EFFECT_LIST_BULLET$Se enfoca en [diplomacy|E]\n$EFFECT_LIST_BULLET$Evitando [wars|E] ofensivos es presentado por [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L] pilas\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] y [GetScheme('befriend').GetTypeName] [schemes|E] tienen más éxito\n$EFFECT_LIST_BULLET$También puede #high $request_great_project_contribution_interaction$s#! de [allies|E]\n$EFFECT_LIST_BULLET$Solo puede morir por [death_natural_cause|E] o [death_religious|E] [character_death_deaths|E]"
 game_concept_at_peace_opinion_desc: "Los personajes que tienen la [GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E] como parte de su [faith|E] tendrán el '$game_concept_at_peace_opinion$' en lugar de la penalización [offensive_war_opinion|E].\n\nSi estás en paz por demasiado tiempo, tu [vassals|E] pensará menos de ti #weak (si comparten tu Ideología).#!"
 game_concept_autonomous_vassals: "Backbenchers autónomos"
 game_concept_autonomous_vassals_crown_authority: "Backbenchers autónomos Autoridad de la Corona"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' es el nivel más bajo de [crown_authority|E]. En este nivel, los [vassals|E] no tienen penalización [opinion|E] hacia su [liege|E], y el líder del partido solo tiene poder básico sobre ellos."
 game_concept_available_spouse_desc: "Para servir en el [council|E] de un gobernante, un [spouse|E] debe estar disponible para llevar a cabo las responsabilidades de ese rol.\n\nVarias circunstancias pueden impedir que un $game_concept_spouse$ cumpla con estas responsabilidades, pero algunas de las más comunes incluyen:\n$BULLET_WITH_TAB$Ser el [ruler|E] de su propio [realm|E]\n$BULLET_WITH_TAB$Residir en el [court|E] de otro gobernante\n$BULLET_WITH_TAB$[imprisoned|E]Estar \n, ya sea en casa o en el extranjero$BULLET_WITH_TAB$[GetTrait('incapable').GetName( GetNullCharacter )]Tener el [trait|E] \n\nSi un cónyuge no disponible vuelve a estar disponible, automáticamente reanudará sus deberes en el gabinete.\n\nLos cónyuges que sean gobernantes por derecho propio aún pueden servir en el gabinete si son tu [direct_vassals|E], pero de lo contrario nunca se considerarán disponibles."
 game_concept_baronies: "Distritos"
 game_concept_barony: "Ward"
 game_concept_beneficiary_desc: "Cada participante en un [great_holy_war|E] puede seleccionar un $game_concept_beneficiary$ de su [dynasty|E]. Tras la victoria, el $game_concept_beneficiary$ recibirá tierras en el partido objetivo proporcional al [war_contribution|E] de su gobernante patrón.\n\nEl mayor contribuyente puede obligar a su Beneficiario a recibir el título principal en disputa."
 game_concept_buy_claim_desc: "Una Interacción que permite a un personaje comprar [unpressed_claims|E] a cambio de [piety|E].\n\n$EFFECT_LIST_BULLET$A [vassal|E] no puede comprar un reclamo sobre el [liege|E] de ningún [title|E], y un Líder de Partido no puede comprar un reclamo sobre el Título\n$EFFECT_LIST_BULLET$A [king|E] o [emperor|E] de un Parlamentario de Base, y los Emperadores no pueden comprar reclamos sobre otros Imperios\n$EFFECT_LIST_BULLET$ Nadie puede comprar un reclamo sobre su [head_of_faith|E]"
 game_concept_canonized_desc: "Un [character|E] que ha sido declarado santo, o equivalente de otra ideología, como un Wali o un ancestro venerado después de su muerte, ganando el [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\n Una vida virtuosa puede terminar en $game_concept_canonization$: se solicita mediante un [decision|E], puede requerir la bendición del [head_of_faith|E] y se sella consagrando el lugar de enterramiento del santo. Su lugar de descanso posteriormente atrae viajeros piadosos, y sus restos pueden producir [holy_relics|E]."
 game_concept_capital_duchy: "Región Capital"
 game_concept_capital_duchy_desc: "El modificador $game_concept_capital_duchy$ aumenta la cantidad de [levies|E] que obtienes de todos los [holdings|E] que posees dentro del mismo [de_jure|E] [duchy|E] que tu [capital|E]. También proporciona un bono a todos los [stationed|E] [men_at_arms|E]. Para que este modificador esté activo, necesitas poseer personalmente la Región asociada.\n\nEste modificador no se acumula con el bono de Base de Inicio."
 game_concept_ceremonial_claimant_faction_desc: "El $game_concept_claimant_faction$ busca instalar un [claimant|E] particular como [ceremonial_liege|E]. Si tiene éxito, el Líder Ceremonial del Partido en el cargo tendrá que ceder su [title|E] al Reclamante. Todos los miembros [faction|E] obtendrán un [hook|E] sobre el Reclamante."
 game_concept_ceremonial_liege_desc: "En ciertos [realms|E] (como Japón) un burócrata o comandante poderoso puede haber tomado el verdadero poder como [ceremonial_regent|E], dejando al $game_concept_ceremonial_liege$ nominalmente reinante solo como un portavoz y [vassal|E] en la práctica. Todos los miembros de un $game_concept_ceremonial_liege_possessive$ [house|E] se consideran parte del [ceremonial_house|E].\n\nA pesar de no gobernar directamente, el $game_concept_ceremonial_house$ es la línea de sangre más estimada en un partido, y otros [houses|E] obtendrán más [prestige|E] por matrimonios con ellos, con tales conexiones influyendo fuertemente en la sucesión del $game_concept_ceremonial_regent$.\n\nEl $game_concept_ceremonial_liege$ puede recuperar el verdadero poder si de alguna manera recupera el [primary_title|E] del partido, por ejemplo, por [faction|E] o compitiendo por el $game_concept_ceremonial_regent$ [title|E] utilizando [influence|E]."
 game_concept_challenger_hof: "Líder del Movimiento Desafiante"
 game_concept_challenger_hof_desc: "Un $game_concept_challenger_hof$ es un [head_of_faith|E] rival levantado contra el [mainline_rite|E] $game_concept_head_of_faith$.\n\nA [ruler|E] puede patrocinar a un miembro de su [clergy|E] como $game_concept_challenger_hof$. Un [clergy|E] [ruler|E] o un gobernante de un [faith|E] con un Líder de Movimiento Temporal puede declararse a sí mismo como Retador en su lugar.\n\nA $game_concept_challenger_hof$ patrocinado asume el [rite|E] de su patrocinador, se convierte en [external_clerical_puppet|E] de ese patrocinador y le debe un [weak_hook|E].\n\nEl $game_concept_mainline_rite$ $game_concept_head_of_faith$ no puede [excommunicate|E] a nadie que siga un $game_concept_challenger_hof$: el patrocinador y su [vassals|E].\n\nTodos los que sigan a un $game_concept_challenger_hof$ llevan sus solicitudes clericales a ellos en lugar de al $game_concept_mainline_rite$ $game_concept_head_of_faith$, entre ellos estos [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nA $game_concept_challenger_hof$ o su patrocinador pueden usar el [pam_challenge_hof_cb|E] [casus_belli|E] contra el $game_concept_head_of_faith$ legítimo.\n\nEl [kings|E] rival o superior del mismo [faith|E] puede en su lugar usar el [pam_antiking_cb|E] contra un patrocinador, depuesto al reclamante rival."
 game_concept_chancellor: "Ministro de Asuntos Exteriores"
 game_concept_chancellor_desc: "El $game_concept_chancellor$ es el [councillor|E] a cargo de la diplomacia, en el extranjero y con el resto del [realm|E]."
 game_concept_chancellors: "Ministros de Asuntos Exteriores"
 game_concept_church_authority_desc: "$game_concept_church_authority$ representa el poder que un [theocratic|E] [ruler|E] ejerce sobre sus [clergy|E] y [vassals|E].\n\nHay cuatro niveles de $game_concept_church_authority$; $church_authority_0$, $church_authority_1$, $church_authority_2$ y $church_authority_3$. Aumentar $game_concept_church_authority$ cuesta una cantidad de [piety|E] y [prestige|E] dependiendo del nivel y de [learning_skill|E] del gobernante.\n\n#weak Los miembros de banca trasera desaprueban niveles más altos de $game_concept_church_authority$, y reducirlo es el objetivo principal de [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_claimant_desc: "Un $game_concept_claimant$ es una persona con uno o más [claims|E] a [titles|E]. Los reclamantes [ruler|E] pueden ejercerlos utilizando el Reclamar [casus_belli|E] para declarar [wars|E].\n\nEste Casus Belli también puede usarse para ejercer las reclamaciones de [vassals|E] e incluso de personajes [unlanded|E] de tu [realm|E].\n\nLos reclamantes también pueden liderar [factions|E] — incluso si no residen en tu Partido."
 game_concept_claimant_faction_desc: "El $game_concept_claimant_faction$ busca instalar un [claimant|E] particular en el trono de un [title|E] mantenido por su [liege|E]. Si tiene éxito, el Líder del Partido tendrá que ceder el Título al Reclamante y la estructura [vassal|E] se actualizará en consecuencia. Todos los miembros [faction|E] obtendrán un [hook|E] sobre el Reclamante."
 game_concept_clan_desc: "Los clanes son un [government_form|E] en los cuales la cantidad de [levies|E] y [taxes|E] otorgada a un [liege|E] por su [vassals|E] está determinada por el [aptitude|E] del [tax_collector|E] de dicho líder del partido. Los clanes también hacen uso de [house_unity|E]."
 game_concept_clergy: "Funcionarios del Partido"
 game_concept_clergy_desc: "[court_chaplains|E], [realm_priests|E], [theocratic|E] Líderes, y cualquier persona con la característica [GetTrait('devoted').GetName( GetNullCharacter )] son considerados miembros de los Funcionarios del Partido.\n\nLos [doctrines|E] de los [faith|E] determinan quién puede ser miembro de los Funcionarios del Partido y si los miembros de los Funcionarios del Partido pueden casarse, heredar tierras, etc."
 game_concept_clergy_opinion: "Opinión de los Funcionarios del Partido"
 game_concept_clerical_puppet: "Marioneta del Sacerdote del Partido"
 game_concept_clerical_puppets: "Marionetas del Sacerdote del Partido"
 game_concept_clerical_region_desc: "Una Región Clerical es una región geográfica que se encuentra bajo la jurisdicción de un [clerical_title|E]. Cualquier miembro de los funcionarios del partido dentro de la región será un [subordinate|E] ante el titular del [title|E] asociado con la región.\n\nUn [ruler|E] pertenece a la Región Clerical que contiene su [capital|E] [county|E], y se funda una nueva región sobre el [capital|E] del [primary_title|E] de su fundador. La región puede cubrir múltiples [realms|E] y tener subordinados que están en diferentes partidos.\n\nUn $game_concept_ruler$ solo puede tener un $game_concept_clerical_region$ a la vez. Si se le concede una nueva Región, el Gobernante pierde todas sus tierras dentro de la anterior."
 game_concept_clerical_title_desc: "Un $game_concept_clerical_title$ es un [ecclesiastical|E] [title|E] del [clergy|E] que gobierna un [clerical_region|E] dentro de un [faith|E]. Entre las ideologías [christian|E], esto es un [archdiocese|E].\n\nEl titular es el [religious_superior|E] del [clergy|E] en esa región, y generalmente es nombrado por el [head_of_faith|E]."
 game_concept_commander_trait_desc: "$game_concept_commander_traits$ son [traits|E] especiales que otorgan ventajas útiles a los personajes cuando actúan como [army|E] [commanders|E].\n\nLos Rasgos de Comandante se adquieren típicamente por niños criados con la Seguridad [education_focus|E], pero también se pueden obtener a través de [martial_lifestyle|E] y otros medios."
 game_concept_complete_control_desc: "Esta condición se cumple cuando todos los [de_jure|E] diputados [titles|E] del título objetivo están en manos de los [ruler|E] o de sus [vassals|E] y ninguna de sus Circunscripciones está [occupied|E] por [armies|E] hostiles."
 game_concept_complete_control_region_desc: "Esta condición se cumple cuando todos los [counties|E] en el [region|E] objetivo están en manos del gobernante o de sus [vassals|E] y ninguna de sus Circunscripciones está ocupada por ejércitos hostiles."
 game_concept_confederation_desc: "Una relación que une a [tribal|E] o [nomadic|E] [rulers|E] en defensa mutua, similar a un [alliance|E]. Formada a través del #high $call_for_confederation_decision$#! [decision|E], una confederación requiere que sus miembros se unan a la Defensa [wars|E] de los demás. Las confederaciones son visibles en la pestaña de Carisma.\n\nLos [confederates|E] compañeros tampoco pueden atacarse ni [raid|E] entre sí. Están restringidos de altos niveles de [tribal_authority|E] y [nomadic_authority|E], y no pueden crear nuevos [titles|E].\n\n[confederates|E] pueden usar el #high $leave_confederation_decision$#! [decision|E] o [migrate|E] para convertirse en [independent|E]. Si una confederación queda con un solo miembro, se destruye."
 game_concept_contestant_desc: "Para competir en [GetActivityType( 'activity_tournament' ).GetName] [contests|E], debes cumplir con sus requisitos. Los juegos de mesa permiten que todos los personajes compitan, mientras que otros, como la lucha libre, dependen de las normas de seguridad.\n\nLos personajes que no compitan serán [spectators|E], y los posibles [contestants|E] pueden optar por no participar si desean observar.\n\nLa elegibilidad para ingresar a concursos se determina por género y salud, según [culture|E] y [religion|E] del anfitrión."
 game_concept_convert_county_desc: "Un [councillor_task|E] realizado por el [court_chaplain|E] que apunta a un [county|E] de un [faith|E] diferente — o uno de la misma Ideología pero un [rite|E] diferente — que el [liege|E].\nEl progreso aumenta cada mes, y al 100% la mayoría de la Constitución Objetivo adopta la Ideología del Líder de la Cámara. El nuevo [rite|E] sigue al [liege|E] siempre que la Ideología resultante coincida con la del Líder del Partido; de lo contrario, es la propia Ideología del Capellán.\n\nLa velocidad de conversión se ve afectada por muchos factores, incluidos el [councillor|E] [learning_skill|E] y el [fervor|E] de las ideologías involucradas. Un Capellán cuya [rite|E] difiere de la del [liege|E] se convierte más lentamente.\nEn un cambio exclusivo de [rite|E], [fervor|E] favorece la ideología principal por encima del #V 50%#! y las ideologías no principales (incluyendo las separatistas) por debajo de ella."
 game_concept_convince_dejure_desc: "Un [councillor_task|E] realizado por el [steward|E]. Apunta a un [de_jure|E] [county|E] del [liege|E] del ministro que pertenece a un [independent|E] [ruler|E]. Cuando la constitución es persuadida, ellos pedirán a su [ruler|E] que los libere a su [de_jure|E] [liege|E]."
 game_concept_coronation_anointment_desc: "La unción es un tipo de [coronation|E], donde el [ruler|E] buscará a su [head_of_faith|E], o a los funcionarios del partido [head_of_rite|E] cuando no haya ninguno, para bendecir su ascensión al trono. En ciertas ideologías, esto es necesario para ser verdaderamente considerado un gobernante [legitimate|E] de sus tierras.\n\nPara asegurar el apoyo de esa autoridad, el [host|E] puede usar el [anointment_request|E] [interaction|E]."
 game_concept_council: "Gabinete"
 game_concept_council_desc: "El $game_concept_council$ es el equipo principal de [councillors|E] del líder, cada uno dirigiendo un departamento. Pueden recibir importantes [councillor_tasks|E]."
 game_concept_councillor: "Ministro"
 game_concept_councillor_desc: "Los ministros son los asistentes principales de cualquier [ruler|E] y conforman el [council|E]. Hay seis posiciones en el gabinete: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (o [realm_priest|E]), y finalmente su [spouse|E].\n\nCada uno está a cargo de un departamento al que se le pueden asignar diferentes [councillor_tasks|E] para realizar.\n\n[powerful_vassals|E] se molestará si no se le nombra a una de estas posiciones, lo que significa que a menudo tiene que elegir entre aplacar a un diputado poderoso o nombrar a alguien que realmente sea competente.\n\nServir como Ministro de su [liege|E] le da un bono, que aumenta con el [rank|E] del Líder del Partido."
 game_concept_councillor_task: "Tarea Ministerial"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ son tareas importantes que pueden asignarse a tu [councillors|E]. Estas tareas pueden ser generales o dirigidas específicamente a un [county|E] o [court|E]. \n\nIsi tienes un [relation|E] con un Ministro, las tareas con tiempo de finalización pueden llevar más o menos tiempo. \n\n#weak Ten en cuenta que los ministros no están presentes físicamente para realizar estas tareas, sino que simplemente lideran los esfuerzos. #!"
 game_concept_councillor_task_possible_side_effects_desc: "Un [councillor_task|E] puede tener consecuencias inesperadas con el tiempo. Estas pueden ser buenas o malas, siendo los efectos positivos más probables cuanto mayor sea el [skill|E] relevante del Ministro, y los efectos negativos más probables cuanto menor sea la Habilidad relevante."
 game_concept_councillor_tasks: "Tareas Ministeriales"
 game_concept_councillors: "Ministros"
 game_concept_counties: "Circunscripciones"
 game_concept_county: "Circunscripción"
 game_concept_county_capital: "Capital de la circunscripción"
 game_concept_county_capital_desc: "El $game_concept_county_capital$ es el principal [holding|E] de un [county|E]. Esta tenencia nunca puede ser destruida o [leased|E] y siempre es propiedad del [ruler|E] que posee la [title|E] de la Circunscripción.\n\nLas Capitales de la Circunscripción permiten la construcción de un [building|E] adicional en comparación con una tenencia menor."
 game_concept_county_capitals: "Capitales de circunscripciones"
 game_concept_county_control: "Control de circunscripciones"
 game_concept_county_control_desc: "$game_concept_county_control$ mide el control que el gobierno tiene sobre la población de un [county|E]. Es crucial especialmente para recolectar [taxes|E] del [holdings|E].\n\nCuando una Circunscripción cambia de manos mediante [war|E], el Control disminuye drásticamente, lo que es una buena razón para vasallar al [holder|E] actual en su lugar (si el [casus_belli|E] lo permite). El Control de la circunscripción también puede ser dañado por [sieges|E] y [Concept( 'peasant_faction', 'Peasant Uprisings' )|E].\n\nEl Bajo Control puede llevar a [county_corruption|E], y la manera principal de aumentar el Control es un [councillor_task|E] disponible para tu [marshal|E]."
 game_concept_county_corruption: "Corrupción en la circunscripción"
 game_concept_county_corruption_desc: "Mientras un [county|E] tenga bajo [control|E] o su [holder|E] esté en [debt|E], la Circunscripción podría adquirir $game_concept_county_corruption$. Estos son varios tipos de [county_modifiers|E] negativos.\n\n$game_concept_county_corruption$ desaparecerán con el tiempo, pero si la causa raíz persiste ([debt|E] o bajo [control|E]), puede reaparecer.\n\nEl $councillor_marshal$'s $task_increase_control$ $game_concept_councillor_task$ puede eliminar $game_concept_county_corruption$ más rápido."
 game_concept_county_fertility: "Fertilidad del distrito electoral"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ existe en [counties|E] ubicado dentro de [the_great_steppe|E], y puede ser pastado por [GetGovernment( 'nomad_government' ).GetName] [rulers|E] para aumentar su [herd|E].\n\n La fertilidad de una circunscripción representa la calidad de sus pastos.\n\n La fertilidad se estabiliza alrededor de [fertility_equilibrium|E], permitiendo a los gobernantes nómadas con un gran [domain_limit|E] sostener el crecimiento de su rebaño. La fertilidad se ve afectada por [steppe_seasons|E] y se repone lentamente por [herders|E].\n\n Cuando la fertilidad de un [realm|E] es baja, es una señal para [migrate|E].\n\n[county_control|E] reduce la tasa a la que crece la fertilidad en un porcentaje igual al control actual."
 game_concept_county_modifier: "Modificador del distrito electoral"
 game_concept_county_modifiers: "Modificadores del distrito electoral"
 game_concept_county_opinion_desc: "La población general de cada [county|E] tiene un [opinion|E] del [character|E] que sostiene su $game_concept_county$. Si la población está descontenta, podrían iniciar o unirse a un [peasant_faction|E] o [popular_faction|E], cualquiera de los cuales puede pronto propagarse a través de todo un [realm|E].\n\nLa manera más fácil de controlar $game_concept_county_opinion$ es asegurarse de que el $game_concept_county$ [holder|E] sea del mismo [culture|E] y [faith|E] que la población.\n\n$game_concept_county_opinion$ de tener un [faith|E] diferente es modificado tanto por el [faith_hostility|E] de la circunscripción como por su [fervor|E], escalando linealmente entre 0 y 100 $game_concept_fervor$."
 game_concept_court: "Oficina"
 game_concept_court_amenities: "Comodidades de la oficina"
 game_concept_court_amenity: "Comodidad de la oficina"
 game_concept_court_artifact: "Artefacto de oficina"
 game_concept_court_artifact_desc: "Un Artefacto de Oficina es un [artifact|E] que se exhibe en el [ruler|E] de un [royal_court|E], como tapices o libros bellamente ilustrados.\n\n Los Artefactos de Oficina son un factor que determina el [court_grandeur|E] de una Oficina Privada.\n\n No hay límite en la cantidad de Artefactos que un Personaje puede tener, pero solo aquellos exhibidos en una ranura de su tipo tienen algún efecto.\n\n Puedes crear nuevos Artefactos de Oficina a partir de [inspired|E] [characters|E], desde la Decisión de Artefacto de Comisión, o eligiendo [reforge|E] un [inventory_artifact|E]"
 game_concept_court_artifacts: "Artefactos de oficina"
 game_concept_court_chaplain: "Líder de la Cámara"
 game_concept_court_chaplain_desc: "El $game_concept_court_chaplain$ es el [councillor|E] a cargo de los asuntos religiosos y espirituales en [faiths|E] con el [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E].\n\nLas ideologías con la Posición de Política [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] tienen el [realm_priest|E] mucho más poderoso (y problemático) en lugar de un $game_concept_court_chaplain$."
 game_concept_court_chaplain_possessive: "Del líder de la Cámara"
 game_concept_court_chaplains: "Líderes de la Cámara"
 game_concept_court_chaplains_possessive: "Líderes de la Cámara (posesivo)"
 game_concept_court_desc: "Cada político tiene un $game_concept_court$: las [unlanded|E] personas que trabajan para ellos.\n\nEstas [courtiers|E] son su familia, asesores, investigadores y acompañantes."
 game_concept_court_event: "Evento de oficina"
 game_concept_court_events: "Eventos de oficina"
 game_concept_court_grandeur: "Grandeza de oficina"
 game_concept_court_grandeur_desc: "El $game_concept_court_grandeur_value$ de un [royal_court|E] muestra qué tan famoso es el Oficio y desbloquea nuevos [court_grandeur_levels|E] a medida que aumenta.\n\nEl valor varía de 0 a 100 y con el tiempo se estabilizará en su valor de Referencia. La Referencia se ve afectada por cosas como [dynasty_perks|E], cuánto estás gastando en [court_amenities|E], y si tienes algún [court_artifacts|E] magnífico.\n\nUna porción de Grandeza se pierde al [succession|E]."
 game_concept_court_grandeur_expectation: "Expectativa de grandeza de oficina"
 game_concept_court_grandeur_expectations: "Expectativas de grandeza de oficina"
 game_concept_court_grandeur_level: "Nivel de grandeza de oficina"
 game_concept_court_grandeur_level_desc: "El Nivel de Grandeza de un [royal_court|E] otorga bonos a su propietario y se desbloquea a medida que aumenta el [court_grandeur_value|E] de la Oficina.\n\n Además de los efectos de cada nivel, se espera que los grandes [realms|E] hayan alcanzado niveles de Grandeza más altos. Esto se conoce como [court_grandeur_expectations|E]."
 game_concept_court_grandeur_levels: "Niveles de grandeza de oficina"
 game_concept_court_grandeur_value: "Valor de grandeza de oficina"
 game_concept_court_guest: "Invitado de oficina"
 game_concept_court_host: "Anfitrión de oficina"
 game_concept_court_host_desc: "Un $game_concept_court_host$ es un [ruler|E] que no es el líder del partido de un personaje, pero aún así lo tiene en su [court].\n\nHay varias razones posibles por las que esto puede ocurrir, como [wanderers|E] visitar a un Gobernante o [wards|E] permanecer en la misma Oficina que su [guardian|E]."
 game_concept_court_language: "Idioma de oficina"
 game_concept_court_language_desc: "Un Idioma de Oficina es el [language|E] oficial de un [royal_court|E], hablado por la nobleza y usado por la burocracia.\n\n El [court_grandeur|E] Baseline aumenta por cada [realm|E] [county|E] que comparta el Idioma, por cada Oficina Privada que hable el mismo Idioma de Oficina, y si es el Idioma nativo del [ruler|E]."
 game_concept_court_languages: "Idiomas de oficina"
 game_concept_court_position: "Nombramiento"
 game_concept_court_position_task: "Tarea de nombramiento"
 game_concept_court_position_tasks: "Tareas de nombramiento"
 game_concept_court_positions: "Nombramientos"
 game_concept_court_type: "Tipo de oficina"
 game_concept_court_type_desc: "Como parte de su [royal_court|E], [rulers|E] puede tener un $game_concept_court_type$ designado.\n\nCada $game_concept_court_type$ proporciona al Gobernante y al [court|E] su propio conjunto de bonificaciones, dependiendo de [court_grandeur_level|E].\n\nEl [ethos|E] del [culture|E] de un Gobernante decide qué Tipos de Oficina pueden tener.\n\nLos diferentes Tipos de Oficina son:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "Rasgo del tipo de oficina"
 game_concept_court_type_trait_desc: "Después de servir [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] años en un [royal_court|E], un [courtier|E] recibe un [trait|E] reflejando el [court_type|E] de ese tribunal.\n\nLa calidad de este Rasgo se decide por cuánto tiempo el [character|E] ha servido como Personal en la Oficina."
 game_concept_court_types: "Tipos de oficina"
 game_concept_courtier: "Miembro del personal"
 game_concept_courtier_desc: "Un $game_concept_courtier$ es un personaje [unlanded|E] que sirve a un [ruler|E] en su [court|E].\n\nEl personal puede:\n$BULLET_WITH_TAB$Servir como [councillors|E]\n$BULLET_WITH_TAB$Servir en [court_positions|E]\n$BULLET_WITH_TAB$Servir en [armies|E] como [commanders|E] o [knights|E]\n$BULLET_WITH_TAB$Convertirse en [vassal|E] de su Gobernante si se les concede un [title|E]\n$BULLET_WITH_TAB$Permitir que su Gobernante presione su [claims|E] en [war|E]\n\n#WEAK [adventurers|E] tenga [followers|E] en lugar de $game_concept_courtiers$ — cumplen el mismo rol, aunque generalmente huelen peor y con más lodo.#!"
 game_concept_courtiers: "Personal"
 game_concept_courts: "Oficinas"
 game_concept_criminal_task_contract_desc: "Un $game_concept_criminal_task_contract$ típicamente implica contratos turbios que pueden ser lucrativos, pero te otorgarán @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\nNivelar el $trait_gallowsbait$ [trait|E] hará que la mayor parte del mundo te odie más y te respete menos, y eventualmente causará que [followers|E] de los que desaprueban tu bandolerismo abandonen dramáticamente tu empleo.\n\n#WEAK $trait_gallowsbait$ es un $game_concept_trait$ altamente negativo, lo que significa que un personaje es un criminal mezquino del más bajo orden — al menos un asesinato en la oficina tiene algún tipo de #EMP clase#!.\n\nSe puede limpiar completamente con el [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E].#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ representa el poder general que un [ruler|E] ejerce sobre su [vassals|E].\n\nHay cuatro niveles de $game_concept_crown_authority$; [autonomous_vassals|E], [limited|E], [high|E] y [absolute|E]. Aumentar $game_concept_crown_authority$ cuesta una cantidad de [prestige|E] dependiendo del nivel y del [learning_skill|E] del gobernante.\n\n#weak A los legisladores de base no les gustan los niveles más altos de $game_concept_crown_authority$, y disminuirlo es el objetivo principal de [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_culture_head_desc: "Un '$game_concept_culture_head$' es el [ruler|E] que tiene más influencia sobre su propio [culture|E].\n\nEspecíficamente, el gobernante con el mayor número total de [counties|E] de la misma cultura dentro de su [realm|E] se convertirá en el $game_concept_cultural_head$, sin importar dónde esté su [domain|E] o qué [AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )] de otra cultura pueda poseer.\n\nEl $game_concept_cultural_head$ puede influir en qué [innovation|E] se debe priorizar para el descubrimiento estableciendo el [cultural_fascination|E].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "Un proceso lento por el cual los [de_jure|E] [liege|E] de un [title|E] pueden cambiar. Ocurre naturalmente cuando un [duchy|E] o [kingdom|E] está completamente controlado por un [ruler|E] que no posee el título de líder de partido de jure del territorio.\n\nEste proceso puede acelerarse asignando su [chancellor|E] al [councillor_task|E] #weak apropiado ($task_integrate_title$)#!. Las regiones solo pueden $game_concept_de_jure_drift$ en Naciones, y las Naciones solo pueden Dejarse llevar a [empires|E].\n\nPermitir que los títulos De Jure se Dejen llevar a su [primary_title|E] es una buena manera de eliminar la penalización [rightful_liege|E]."
 game_concept_de_jure_drift_desc_part_2: "#weak Ejemplo: La Región de $d_northumberland$ es de jure parte de $k_england$, pero el territorio de la región está completamente dentro de $k_scotland$. Dado que el Rey de $k_scotland$ no posee también $k_england$, la región comenzará a $game_concept_de_jure_drift$ hacia convertirse en parte de $k_scotland$.#!"
 game_concept_death_religion: "Campo Político"
 game_concept_death_religion_desc: "Ser llevado al otro mundo por oponentes y la dispatchación sacrílega de tu existencia mortal — martirio, crucifixión — permaneciendo fiel a tu ideología hasta el final, ¿qué manera más genuina hay de pasar?"
 game_concept_debt_desc: "La deuda es el estado de tener una cantidad negativa de [gold_i][gold|E]. Esto ocurre típicamente cuando un [ruler|E] en guerra contrata [mercenaries|E] sin tener suficientes Fondos para cubrir el costo total, o cuando están en guerra por demasiado tiempo.\n\n Mientras se esté en Deuda no se pueden declarar nuevos [wars|E], tus [men_at_arms|E] no se refuerzan, y tus enemigos tendrán una [advantage|E] sobre ti en batalla. Cuanto más profunda sea la deuda en la que caes, más penalizaciones recibirás — menos [levies|E], reducción de [county_opinion|E], y tus [vassals|E] te gustarán menos.\n\nAdemás, pueden ocurrir varios otros eventos menores desestabilizadores, como ganar [county_corruption|E] en tu [domain|E] [counties|E]. \n\n#help Generalmente es una buena idea atacar a tus enemigos mientras están en Deuda, ¡ya que lucharán con [advantage|E] reducidos!#!"
 game_concept_demand_conversion_desc: "[rulers|E] que tienen un súbdito de otro [faith|E] pueden Exigir Conversión para cambiar la ideología de su súbdito a la suya. La habilidad [learning|E] del gobernante y la [opinion|E] del súbdito hacia su líder del partido son factores importantes para determinar si el súbdito acepta la demanda o [Concept('refuse_conversion_crime','refuses')|E]."
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$ gobierna qué tan bien un [diarch|E] logra cada [mandate|E] establecido por su [liege|E].\n\n Tanto [skills|E] como [personality_traits|E] juegan un papel. Por ejemplo, un [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$ encargado del Mandato '$fill_coffers_mandate$' puede no enviar tanto [gold|E] a su líder del partido.\n\n#WEAK Los [diarchs|E] son adecuados para un $game_concept_mandate$ cuando tienen alrededor de 40+ $game_concept_aptitude$ para ello.#!"
 game_concept_diarch_power_desc: "Un [diarch|E] en un [power_sharing|E] activo tiene acceso a $game_concept_diarch_powers$ especiales.\n\nEstos son [character_interaction|E]s especiales que imitan los que tienen sus [liege|E], u otros abusos de poder. Ejemplos incluyen [revoking|E] [titles|E] de compañeros [vassals|E], o desviar [gold|E] de su Líder del Partido.\n\nMuchos $game_concept_diarch_powers$ dan al Líder del Partido una oportunidad de [veto|E] ellos."
 game_concept_diplomacy: "Carisma"
 game_concept_diplomacy_lifestyle: "Estilo de vida Carisma"
 game_concept_diplomacy_skill: "Habilidad de Carisma"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ es un [skill|E] para el encanto, la persuasión y la negociación: manejar una sala, ganarse a los colegas y cerrar un trato.\n\nAfecta directamente la [opinions|E] que otros personajes tienen de ti, y fortalece la Carisma [schemes|E].\n\nEl [lifestyle|E] correspondiente es el [diplomacy_lifestyle|E]."
 game_concept_diplomacy_task_contract: "Contrato de Carisma"
 game_concept_diplomacy_task_contract_possessive: "Del Contrato de Carisma"
 game_concept_diplomacy_task_contracts: "Contratos de Carisma"
 game_concept_diplomacy_task_contracts_possessive: "De los Contratos de Carisma"
 game_concept_direct_vassal: "Diputado Directo"
 game_concept_direct_vassals: "Diputados Directos"
 game_concept_directed_great_holy_war_desc: "Un $game_concept_directed_great_holy_war$ es declarado por un $doctrine_temporal_head_name$ [head_of_faith|E] con la intención de llevar un [kingdom|E] bajo su propio gobierno.\n\n[rulers|E] de su [faith|E] pueden elegir ayudar al Líder del Movimiento, y pueden recibir recompensas por hacerlo. Las recompensas incluyen [piety|E] y potencialmente hacer que su [dynasty|E] se convierta en [landed|E] dentro de la Nación conquistada.\n\nLos gobernantes del [religion|E] objetivo pueden optar por defenderse de esta guerra sin la necesidad de un [alliance|E]."
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ es el nivel más bajo de [tribal_authority|E]. En este nivel, [vassals|E] no tienen penalización [opinion|E] hacia su [liege|E], y el líder del partido carece de cualquier poder sobre ellos aparte de la capacidad de exigir [levies|E] y [taxes|E]."
 game_concept_dissolution_faction_desc: "El [dissolution_faction|E] busca destruir el [realm|E] de su [liege|E]. Si tienen éxito, todos los parlamentarios de menor rango en el partido se convierten en [independent|E], y el líder de su partido pierde su [primary_title|E]."
 game_concept_doctrine: "Posición de Políticas"
 game_concept_doctrine_knowledge: "Conocimiento de la Posición de Políticas"
 game_concept_doctrines: "Posiciones de Políticas"
 game_concept_doctrines_desc: "Las posiciones de política son lo que un [faith|E] representa: impuestos y gastos, propiedad, inmigración, Europa, la Unión y libertades civiles. Los proyectos de ley que chocan con las posiciones políticas de un diputado hacen que la rebelión sea más probable."
 game_concept_domain: "Cartera"
 game_concept_domain_desc: "El $game_concept_domain$ de un político es todo lo que poseen personalmente: su escaño y sus circunscripciones.\n\nEl [domain_limit|E] significa que un líder tiene que depender de [vassals|E] para liderar más que unos pocos escaños."
 game_concept_domain_fertility: "Fertilidad de la Cartera"
 game_concept_domain_fertility_desc: "La Fertilidad de la Cartera es el total [county_fertility|E] de todos tus [counties|E] mantenidos."
 game_concept_domain_income: "Ingresos de la Cartera"
 game_concept_domain_limit: "Límite de la Cartera"
 game_concept_domain_size: "Tamaño de la Cartera"
 game_concept_domain_taxes: "Impuestos de la Cartera"
 game_concept_domains: "Carteras"
 game_concept_dominant_family_desc: "Un $game_concept_dominant_family$ es un [powerful_family|E] que ha extendido su control de manera amplia. Son considerados los [house|E] más influyentes dentro de un [realm|E].\n\nUn miembro de un $game_concept_dominant_family$ es aún mejor en [political_schemes|E] y tiene aún más probabilidades de obtener lo que desea cuando [interacting|E] con otros [characters|E].\n\nUn $game_concept_house$ debe controlar al menos [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] del Partido para convertirse en Dominante."
 game_concept_dread: "Influencia"
 game_concept_dread_desc: "$game_concept_dread$ es cuánto se teme a un [ruler|E]: el líder que despide ministros sin pestañear, el látigo que nunca olvida una rebelión.\n\nLos políticos ganan $game_concept_dread$ mediante actos despiadados: despidos, purgas y dando ejemplo de rebeldes o [prisoners|E].\n\nEl poder hace posible liderar como un [tyrant|E], porque [vassals|E] indisciplinados pueden convertirse en [intimidated|E] o [cowed|E], haciendo que tengan demasiado miedo de oponerse a ti.\n\nEl poder de un personaje puede variar de 0 a 100, excepto para [nomads|E], que puede alcanzar 150. Con el tiempo, su poder tenderá hacia su Poder Natural, que está definido por su [personality_traits|E].\n\n#high Un [ruler] Formidable obtiene los siguientes beneficios:#!\n$BULLET_WITH_TAB$[vassals] se desanima que se unan [factions|E]\n$BULLET_WITH_TAB$[vassals] se desanima [scheming|E]\n$BULLET_WITH_TAB$Aumenta la aceptación de [vassal] #weak (Ej. Revocación de Título)#!\n$BULLET_WITH_TAB$Aumenta la aceptación de [offer_vassalization|E]\n$BULLET_WITH_TAB$Hace que [electors|E] tenga más probabilidades de votar como tú\n$BULLET_WITH_TAB$Hace que diputados de banca trasera sean poco propensos a oponerse a los cambios de [law|E]\n\n#weak ¡Ten en cuenta que los [vassals] valientes y audaces se ven menos afectados por el poder!#!"
 game_concept_dreaded: "Formidable"
 game_concept_dreadful: "Formidable"
 game_concept_dreams_desc: "Los personajes que siguen una ideología con la causa de la adivinación pueden experimentar sueños ocasionalmente. Estos sueños pueden ser luego adivinados por un místico, lo que puede tener una variedad de resultados, tanto buenos como malos."
 game_concept_duchies: "Regiones"
 game_concept_duchy: "Región"
 game_concept_duchy_building: "Edificio de Región"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ son [buildings|E] potentes que solo pueden construirse en el [de_jure_capital|E] de una [duchy|E]. Solo se puede construir un tipo en cada Región. \n\n$game_concept_duchy_buildings$ solo están activas si el propietario también posee la [title|E] de Región asociada. \n\nM $game_concept_duchy_buildings$ tener modificadores que afectan a todos los [holdings|E] de la Región, convirtiéndolos en herramientas poderosas para especializar tu [domain|E]."
 game_concept_duchy_buildings: "Edificios de Región"
 game_concept_duchy_desc: "Un $game_concept_duchy$ es un [title|E] uno [title_tier|E] por debajo de un [kingdom|E] y uno por encima de un [county|E].\n\nLos [holder|E] de un $game_concept_duchy$ tienen [de_jure|E] derechos sobre sus $game_concept_counties$ constituyentes y pueden tener [counts|E] como [vassals|E].\n\nLas regiones pueden estar inactivas y no tener un Titular actual. Dicho $game_concept_title_succession$ puede ser creado por un [ruler|E] que controle al menos la mitad de su $game_concept_counties$."
 game_concept_dynasty_perks: "Legados del Partido"
 game_concept_dynasty_prestige: "Marca de Partido"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$ es la reputación de un partido en su conjunto: lo que los votantes piensan que representa su nombre y las puertas que abre para sus miembros.\n\nA [dynasty|E] obtiene $game_concept_dynasty_prestige$ de sus miembros vivos, de los miembros que ocupan cargos, y de los miembros casados con otros titulares de cargos.\n\nCuenta para el [dynasty_prestige_level|E] del partido, y el líder del partido puede gastarlo en [dynasty_perks|E]."
 game_concept_dynasty_prestige_level: "Nivel de Marca de Partido"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\nZZKEEP00006ZZ\nSe es el nivel más alto de marca de fiesta."
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ es una medida de qué tan famoso es un [dynasty|E]. El progreso de nivel se hace siempre que tu Dinastía gane [dynasty_prestige|E]. Los personajes reciben una cantidad de [prestige|E] inicial cuando nacen dependiendo de su $game_concept_dynasty_prestige_level$. De manera similar, [spouses|E] ganan algo de Perfil de la Dinastía de los demás cuando [marry|E].\n\nLos niveles son:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "Un [interaction|E] a través del cual [ecclesiastical|E] [rulers|E] puede hacer que los mismos gobernantes seculares [faith|E] declaren [holy_war|E] sobre los gobernantes de ideología hostil."
 game_concept_ecumenical_councils: "Gabinetes Ecuménicos"
 game_concept_eminent_holy_site: "Eminent Heartland"
 game_concept_eminent_holy_site_desc: "Un $game_concept_eminent_holy_site$ es un [holy_site|E] de gran importancia para un [faith|E]. Cada Ideología puede designar solo a algunos de sus $game_concept_holy_sites$ como Eminentes.\n\nSolo las Heartlands Eminentes contribuyen con modificadores que afectan a todos los seguidores de una Ideología."
 game_concept_eminent_holy_sites: "Eminent Heartlands"
 game_concept_empire: "Reino Unido"
 game_concept_empires: "Sindicatos"
 game_concept_enshrined_desc: "Un [holy_relic|E] consagrado en un [holy_site|E] activa bonificaciones de la región central y mejora las bonificaciones que otorga, escaladas según los niveles totales de [rarity|E] de todos los artefactos consagrados.\n\nUn artefacto consagrado ya no es propiedad de un personaje, pero puede ser interactuado por el poseedor de [holder|E], [top_liege|E] o [clerical_region|E] de la región central. El artefacto ya no se deteriorará. Solo puedes consagrar reliquias sagradas para tu propio [faith|E]; las reliquias sagradas consagradas de otras ideologías no proporcionarán beneficios.\n\nPuede haber recompensas o costos asociados con consagrar o remover un artefacto consagrado."
 game_concept_entrenched_regency_desc: "Si un [regency|E] dura demasiado, puede volverse Enraizado, y el [regent|E] se vuelve aún más poderoso en comparación con su [liege|E].\n\nLos beneficios que el [regent|E] obtiene del [scales_of_power|E] se vuelven mucho más poderosos.\n\nPara terminar un $game_concept_entrenched_regency$, el Regente debe aceptar un regalo de su Líder de Partido, o el Líder de Partido debe inclinar la Balanza a su favor."
 game_concept_escalated_peasant_factions: "Movimientos de Protesta Escalados"
 game_concept_expected_legitimacy: "Mandato Esperado"
 game_concept_expected_legitimacy_desc: "El [legitimacy_level|E] que [vassals|E] esperan de su [ruler|E], basado en su relación histórica. Algunos factores que disminuyen las Expectativas son:\n$BULLET_WITH_TAB$Ser el [de_jure|E] [liege|E] del parlamentario de menor rango\n$BULLET_WITH_TAB$Ser parte del [close_family|E] del parlamentario de menor rango\n$BULLET_WITH_TAB$Ser el [preferred_heir|E] del parlamentario de menor rango\n$BULLET_WITH_TAB$Ser el mismo [dynasty|E] que el parlamentario de menor rango ha servido por más de #color_white 50#! años\n$BULLET_WITH_TAB$El parlamentario de menor rango no ser un [powerful_vassal|E]\n\nSi el Nivel real está por debajo de sus Expectativas, pueden volverse desobedientes: su [opinion|E] será menor y pueden unirse a [factions|E] contra su [liege|E].\n\nLas expectativas aumentan con el nivel de su [primary_title|E], así como con el [era|E]."
 game_concept_external_clerical_puppet_desc: "Un miembro poderoso de los [clergy|E] — un [archbishop|E] o incluso el [head_of_faith|E] — que se ha convertido en el [puppet|E] de otro [ruler|E].\n\nCuanto más poderoso es el clérigo, mayor es el alcance: un Líder de Movimiento marioneta puede [excommunicate|E] a tus enemigos, nombrar [cardinals|E], conceder un [pressed_claim|E] o incitar a un [holy_war|E] en tu nombre."
 game_concept_faction_desc: "Un $game_concept_faction$ es un grupo de [vassals|E] con intereses políticos comunes. La población local de [counties|E] también puede unirse a ciertos tipos de Facciones, como el Movimiento de Protesta.\n\nLas Facciones se vuelven peligrosas una vez que su [faction_discontent|E] alcanza cierto punto, momento en el que emitirán un ultimátum.\n\nSi el [liege|E] no cumple, la Facción se levantará en rebelión, provocando una [civil_war|E]. Si la Facción se disuelve antes de que termine la Guerra, el Líder del Partido debe tener al menos [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E] para ganar la Guerra."
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$ es una medida de la fuerza militar total de un [faction|E] en relación con su objetivo.\n\nCada miembro individual de la facción añade toda su fuerza a la Facción mientras permanezca en ella. Si el objetivo de la facción es el [liege|E] de un miembro, la fuerza del miembro también se resta del poder relativo del líder del partido."
 game_concept_faith: "Ideología"
 game_concept_faith_astray: "Divergente"
 game_concept_faith_astray_desc: "Este [rite|E] está en tu campo político o en uno vecino: no están de acuerdo en detalles.\n\n#S Efectos:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "Un $game_concept_faith$ es la ideología política de un político, dentro de un [religion|E] más grande. Cada personaje y [county|E] tiene una: la ideología de una circunscripción es la inclinación de sus votantes y se mueve hacia la de su diputado. \n\nLas [doctrines|E] de una ideología son sus posiciones políticas y sus [core_tenets|E] sus causas principales. Su [fervor|E] es cuán entusiasmados están sus activistas. \n\nA los políticos de diferentes ideologías les agradan menos entre sí, cuanto más alejados estén sus campos. Cualquiera puede cambiar de opinión (la decisión Cambiar tu política), a un costo."
 game_concept_faith_evil: "Irreconciliable"
 game_concept_faith_evil_desc: "Este [rite|E] quiere el futuro constitucional opuesto: nacionalista contra unionista.\n\n#S Efectos:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "En contra"
 game_concept_faith_hostile_desc: "Este [rite|E] está al otro lado de la división política principal, izquierda contra derecha.\n\n#S Efectos:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "Distancia ideológica"
 game_concept_faith_hostility_desc: "Todos [faiths|E] tienen una relación entre sí que está determinada por lo distante que están sus políticas.\n\nLas ideologías del mismo o de un [religion|E] vecino discrepan en detalles; izquierda y derecha están en oposición; nacionalistas y unionistas son irreconciliables.\n\nExisten las siguientes relaciones: [faith_righteous|L], [faith_astray|L], [faith_hostile|L] y [faith_evil|L]."
 game_concept_faith_righteous: "Afines"
 game_concept_faith_righteous_desc: "Este [rite|E] comparte tu política.\n\n#S Efectos:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "Ideologías"
 game_concept_faiths: "Ideologías"
 game_concept_feast_desc: "Un [activity|E] donde los gobernantes y el personal de una fiesta se reúnen para celebrar... una cosa u otra. \n\nParticipantes perderán [stress|E] y aumentarán su [opinion|E] sobre el anfitrión. También puede haber muchas otras consecuencias al reunir a tanta gente. \n\nA [ruler|E] invitarán a su [liege|E] y a su [vassals|E] (junto con varios [courtiers|E]) a un $activity_feast$."
 game_concept_fervor: "Convicción"
 game_concept_fervor_desc: "El $game_concept_fervor$ de un [faith|E] varía desde #V 0#! hasta #V 100%#!. Mide lo entusiasmados que están sus activistas y votantes: participación, voluntarios y ruido.\n\nUn alto $game_concept_fervor$ hace que las circunscripciones de la Ideología se preocupen más por la política de su parlamentario."
 game_concept_feudal_desc: "Bajo el [government_form|E] Feudal, un [liege|E] da a su [vassals|E] [land|E] para gobernar a cambio de [levies|E] y [taxes|E], regulado por [vassal_contract|E] individual entre Diputado de Base y Líder del Partido."
 game_concept_flowery_war_desc: "Este es un tipo especial de [war|E], iniciado por un [ruler|E] cuyo [faith|E] practica el sacrificio humano. El objetivo principal de $game_concept_flowery_warring$ es luchar y capturar [prisoners|E] para el sacrificio, con cualquiera de los bandos capaz de obtener suficientes [war_score|E] a través del combate para ganar sin tener que [siege|E].\n\nAl final del $game_concept_war$, si el vencedor (incluido el defensor) sigue un $game_concept_faith$ que practica el sacrificio humano, entonces tomarán varios $game_concept_prisoners$ del [court|E] del perdedor. Si ambos combatientes principales en un $game_concept_flowery_war$ siguen la misma ideología, entonces la guerra se considera sagrada, lo que significa que el perdedor todavía recibe (reducción de) [piety|E] incluso en la derrota.\n\nNo puedes conducir o continuar un $game_concept_flowery_war$ si tienes algún $game_concept_prisoners$ obtenido a través de ganar un $game_concept_flowery_war$ en tu [dungeon|E]."
 game_concept_foreign_affairs_desc: "Un [councillor_task|E] realizado por el [chancellor|E].\nPara un [independent|E] [ruler|E], aumenta la opinión que otros gobernantes independientes tienen de ellos. Para un parlamentario de base, aumenta la opinión que otros parlamentarios de base del mismo [liege|E] tienen de ellos."
 game_concept_fp3_demand_submission_interaction_desc: "Exigir una lealtad [character_possessive|E] en forma de [hook|E] usando capital político, astucia o intimidación."
 game_concept_gender_doctrines: "Posiciones de Política de Género"
 game_concept_gender_doctrines_desc: "Estos [doctrines|E] determinan qué [gender_laws|E] están disponibles para los personajes de la [faith|E].\n\nTambién determina ciertas reglas adicionales, como qué [claims|E] se puede heredar, quién puede ser [commanders|E] y [knights|E], y a cuáles de los [house|E] de sus padres pertenecerá un [bastard|E].\n\nLas Posiciones de la Política de Género son:\n$BULLET_WITH_TAB$Dominado por Hombres\n$BULLET_WITH_TAB$Igual\n$BULLET_WITH_TAB$Dominado por Mujeres"
 game_concept_gift_desc: "Enviar un regalo a otro personaje aumentará su [opinion|E] hacia ti a cambio de [gold|E][gold_i].\n\n Cuanto más codicioso sea el destinatario, más Fondos tendrás que enviar y más Opinión recibirás. \n\n Cuanto mayor sea tu [diplomacy|E], más Opinión recibirás."
 game_concept_glory_desc: "Un [accolade_possessive|E] La Gloria aumenta su [accolade_rank|E].\n\nLa Gloria se gana al [acclaimed_knight|E] ganar [battles|E], derrotar guerreros, competir en [GetActivityType( 'activity_tournament' ).GetName] [contests|E], y asistir a [activities|E].\n\nSin embargo, la Gloria del Reconocimiento se reduce cuando el Organizador Estrella está involucrado en batallas perdidas, y también puede disminuir en [accolade_succession|E] si el Organizador Estrella no murió en batalla, en un duelo, o de alguna otra manera honorable."
 game_concept_gold: "Fondos"
 game_concept_gold_desc: "Los fondos son el dinero de un político: donaciones, suscripciones de miembros y cofre de campaña. Pagan para el personal, oficinas, folletos y campañas."
 game_concept_goliardic_shenanigans_desc: "Un personaje en [GetActivityType('activity_adult_education').GetName] puede meterse en todo tipo de travesuras al abrazar la vida estudiantil. Las consecuencias de sus aventuras son impredecibles e incluyen puntos [skill|E], estilo de vida y presión [traits|E], experiencia de estilo de vida, enfermedades y heridas."
 game_concept_government_authority_desc: "$game_concept_government_authority$ representa el poder general que un [ruler|E] ejerce sobre su [vassals|E].\n\nDiferentes [governments|E] tienen diferentes formas de $game_concept_government_authority$. Por ejemplo, [feudal|E] [realms|E] usan [crown_authority|E], [clans|E] usan [tribal_authority|E], y [administrative|E] usan [imperial_bureaucracy|E]. Aumentar $game_concept_government_authority$ cuesta una cantidad de [prestige|E] dependiendo del nivel y del [learning_skill|E] del gobernante.\n\n#weak A los legisladores de base no les gustan los niveles más altos de $game_concept_government_authority$, y disminuirlo es el objetivo principal de [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!\n\nNo todos los [governments|E] tienen $game_concept_government_authority$."
 game_concept_governor_desc: "Un $game_concept_governor$ es el parlamentario principal de respaldo de un [liege|E] con un [government_bureaucratic_gov|E]. Son nombrados por su líder de partido para presidir sobre las tierras dentro del [realm|E], utilizando su [governor_efficiency|E].\n\n El $game_concept_governor$ de un [title|E], así como el [counties|E] que incluye, se denomina [province|E]. [governance_issues|E] puede aparecer dentro de una Provincia, que el $game_concept_governor$ tiene que resolver.\n\n$game_concept_governors$ puede acumular [influence|E] y manipular el [succession|E] de otros $game_concept_governorships$."
 game_concept_great_holy_war_desc: "Un $game_concept_great_holy_war$ es un tipo especial de [war|E] que solo pueden declarar los [head_of_faith|E] de ciertos [faiths|E], con el objetivo de poner a todo un [kingdom|E] bajo la regla de su Ideología.\n\n$game_concept_great_holy_wars$ apuntan a todos los [rulers|E] de otra [religion|E] dentro de un [kingdom|E] elegido, obligándolos a defenderse juntos. Si se sale victorioso, todos los [titles|E] dentro de la Nación objetivo serán confiscados y divididos entre los atacantes.\n\nDependiendo de su [doctrines|E], una Ideología podría tener acceso a [directed_great_holy_wars|E], [undirected_great_holy_wars|E] o ningún $game_concept_great_holy_wars$ en absoluto:\n$EFFECT_LIST_BULLET$Los [GetTenetType('tenet_armed_pilgrimages').GetBaseName], [GetTenetType('tenet_struggle_submission').GetBaseName], o [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E] son necesarios para tener acceso a Grandes Guerras Santas en general\n$EFFECT_LIST_BULLET$Las ideologías con un [GetDoctrineType('doctrine_temporal_head').GetBaseName] Jefe solo tienen acceso a Grandes Guerras Santas Dirigidas\n$EFFECT_LIST_BULLET$Las ideologías con un [GetDoctrineType('doctrine_spiritual_head').GetBaseName] Jefe solo tienen acceso a Grandes Guerras Santas No Dirigidas\n$EFFECT_LIST_BULLET$Las ideologías sin un Líder de Movimiento no pueden declarar ninguna Gran Guerra Santa, incluso si normalmente serían elegibles\n\nAlgunas ideologías tienen nombres especiales para sus Grandes Guerras Santas como 'Cruzada' o 'Yihad'. Estas Grandes Guerras Santas difieren solo en nombre y funcionan como cualquier otra Gran Guerra Santa."
 game_concept_great_project_desc: "Los Grandes Proyectos son emprendimientos masivos que llaman a todos los recursos del [realm|E].\n\nAlgunos Grandes Proyectos implican la construcción de un [great_building|E], mientras que otros implican recuperarse de un [natural_disaster|E].\n\nMientras el [ruler|E] del Partido supervisa el desarrollo del Gran Proyecto, [subjects|E] puede ofrecer [great_project_contributions|E] para ayudar en su progreso."
 game_concept_head_of_faith: "Líder del movimiento"
 game_concept_head_of_faith_desc: "Un $game_concept_head_of_faith$ es el líder formal de un [faith|E]. Los poderes y la naturaleza del $game_concept_head_of_faith$ dependen del [doctrines|E] de la Ideología.\n\n Algunas ideologías tienen un [spiritual_head_of_faith|E] #weak (por ejemplo, el Papa)#!, algunas un [temporal_head_of_faith|E] #weak (por ejemplo, un Califa)#!, y algunas no tienen un $game_concept_head_of_faith$ en absoluto."
 game_concept_head_of_faith_possessive: "Del líder del movimiento"
 game_concept_head_of_rite: "Voz principal"
 game_concept_head_of_rite_desc: "El [character|E] líder de un [rite|E]: el político que lidera la mayor parte de su [counties|E]."
 game_concept_heads_of_faith: "Líderes del movimiento"
 game_concept_herder_desc: "Los pastores son eliminados de todos los aspectos del gobierno. No mandan [armies|E], no poseen [buildings|E], no crean [alliances|E], ni declaran [wars|E]. Cuando [nomads|E] [migrate|E] un [holding|E], los pastores repondrán lentamente el [county_fertility|E] local debido a su rebaño más pequeño.\n\nSe sienten intimidados por un correcto [nomad|E] [rulers|E] y entregarán inmediatamente sus tierras cuando se les desafíe."
 game_concept_heresies: "Grupos disidentes"
 game_concept_heresy: "Fragmentación"
 game_concept_heresy_desc: "Cuando la [fervor|E] de un [faith|E] cae críticamente baja, puede surgir un brote de Fragmentación. Los brotes se presentan en tres formas cada vez más severas:\n#indent_newline:7 $BULLET_WITH_TAB$Un [rite|E] existente se vuelve más [rite_divergent|E] y se propaga más lejos.#!\n#indent_newline:7 $BULLET_WITH_TAB$Aparece un [rite|E] nuevo significativamente [rite_divergent|E] y se extiende por las tierras.#!\n#indent_newline:7 $BULLET_WITH_TAB$Para los [faiths|E] cristianos, aparece una fragmentación histórica como el Bogomilismo o el Catarismo.#!\n\nUn [faith|E] está en verdadero riesgo de Fragmentación solo una vez que su [mainline_rite|E] esté al menos en #V 100#! [counties|E]. Por debajo de eso, las dos formas más severas no pueden surgir en absoluto, e incluso la forma más leve es mucho más rara.\n\nCada brote termina en un aumento unificador de $game_concept_fervor$."
 game_concept_heretical: "Secesión"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ es el segundo nivel más alto. [vassals|E] tiene un #N -20#! [opinion|E] penalización hacia su [liege|E].\n\n En este nivel — además de los poderes que el líder del partido recibe en [limited_crown_authority|E] — los diputados de base bajo el mismo líder del partido ya no pueden guerrear entre ellos, el gobernante puede cambiar entre todos los [succession_laws|E] disponibles, y los [titles|E] de los diputados de base no pueden ser heredados por gobernantes fuera de los [realm|E] del líder del partido.\n\n Por último, rechazar el título [revocation|E] o al diputado de base [retraction|E] se considera un [crime|E] incluso si el líder del partido carece de justificación suficiente."
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ es el nivel medio de [nomadic_authority|E]. En este nivel [migration|E] pueden apuntar a [de_jure|E] [kingdom|E] [titles|E] dentro del [the_great_steppe|E] y el líder del partido puede [retract|E] a los parlamentarios [vassal|E]."
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ es el segundo nivel más alto de [tribal_authority|E]. [vassals|E] tiene un #N -20#! [opinion|E] penalización hacia su [liege|E].\n\n En este nivel, así como la capacidad de [imprison|E] [characters|E], el líder del partido puede [revoke|E] [titles|E] y [retract|E] los diputados de base de un diputado de base."
 game_concept_hold_court_desc: "Un [activity|E] donde [vassals|E] y [courtiers|E] en un [realm|E] se reúnen en [royal_court|E] para presentar sus [liege|E] y expresar sus quejas. \n\nSituaciones sobre las que el líder del partido será llamado a juzgar pueden ir desde disputas y malentendidos insignificantes hasta catástrofes a nivel de reino. La mayoría de los asuntos tendrán una solución beneficiosa, si no para las partes implicadas, al menos para el líder del partido."
 game_concept_holder_desc: "El $game_concept_holder$ de un [title|E] es el personaje que posee el título. Los títulos [barony|E] y [county|E] siempre tendrán $game_concept_holders$ una vez establecidos, mientras que los títulos [duchy|E], [kingdom|E] y [empire|E] podrían no haber sido creados todavía. Como otra advertencia, el $game_concept_holder$ de un Título de alto nivel podría no controlar realmente ningún territorio dentro del área [de_jure|E] del Título.\n\nPoseer Títulos de nivel superior permite tener [vassals|E] de nivel superior. Por ejemplo, los Duques pueden tener Condes como Subordinados, y los Reyes pueden tener Duques."
 game_concept_holding_court: "Esperando una cirugía"
 game_concept_holy_relic_desc: "Un $game_concept_holy_relic$ es un [artifact|E] que tiene significado religioso para un [faith|E]. Un $game_concept_holy_relic$ puede ser [enshrined|E] en un [holy_site|E] de esa ideología para obtener beneficios.\n\nAlgunos artefactos son inherentemente sagrados para una ideología, pero los artefactos también pueden ser [sanctified|E] para convertirse en una reliquia sagrada."
 game_concept_holy_site: "Corazón del País"
 game_concept_holy_site_desc: "Un $game_concept_holy_site$ es un [county|E] que contiene un lugar de importancia religiosa para un [faith|E]. $game_concept_holy_sites$ sostenido por un Personaje de la Ideología correcta proporcionará un efecto a todos los de esa Ideología, y también puede permitir la creación de [special_buildings|E] o [holy_orders|E]. Cada Ideología tiene un conjunto diferente de $game_concept_holy_sites$.\n\nUn $game_concept_holy_site$ ordinario no da beneficios ideológicos globales, solo locales. Los sitios más venerados de una Ideología, en cambio, se designan como [eminent_holy_sites|E]. Una Ideología solo puede tener un número limitado de cada uno."
 game_concept_holy_sites: "Corazones del País"
 game_concept_holy_war_desc: "Un $game_concept_holy_war$ es un tipo especial de [war|E] librado por un [ruler|E] de una [faith|E] contra un Gobernante de una Ideología diferente.\n\n$game_concept_holy_war$ suelen ser bastante destructivas, con el ganador de una Guerra Santa típicamente confiscando todos los [counties|E] en el área objetivo para sí mismo. Sin embargo, si la Ideología del atacante es [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName] o el defensor tiene [vassals|E] de la propia Ideología del atacante en el área objetivo, algunos o todos los Gobernantes Secundarios en el área objetivo pueden simplemente ser transferidos al atacante en su lugar.\n\nA diferencia de otras guerras, los Gobernantes de la misma ideología que el objetivo pueden elegir unirse en su defensa sin necesidad de un [alliance|E].\n\nLas Guerras Santas pueden ser permitidas o restringidas dependiendo de las diferentes [religious_families|E]"
 game_concept_home_court: "Oficina de Interior"
 game_concept_home_courts: "Oficinas de Interior"
 game_concept_home_courts_possessive: "De la Oficina de Interior"
 game_concept_hungarian_invasion_casus_belli_desc: "Un [casus_belli|E] poderoso que solo puede usarse una vez por campaña, en total, para conquistar todos los territorios del objetivo dentro de Panonia.\n\nEn la victoria, todos los $mogyer_collective_noun$ en el [realm|E] del atacante se moverán con ellos a Panonia, [counties|E] #EMP y#! [vassals|E], desplazando $avar$ $game_concept_counties$. Otros legisladores fuera de Panonia son abandonados, mientras que $game_concept_counties$ anteriormente ocupados o poseídos por $mogyer_collective_noun$ quedan a los señores de la guerra locales y a tribus rivales de la estepa."
 game_concept_hybrid_culture_desc_DLC: "Un $game_concept_hybrid_culture$ es un [culture|E] que fue creado por un [ruler|E] como la combinación de dos Culturas existentes.\n\nEl $game_concept_hybrid_culture$ es una mezcla de los [traditions|E], [culture_pillars|E] y la Estética de las dos Culturas originales.\n\nSolo las Culturas de diferente [heritage|E] pueden formar un Híbrido, y el costo [prestige|E] para hacerlo se basa en su [cultural_acceptance|E] mutuo.\n\nCuanto mayor sea la Aceptación Cultural, más [counties|E] se convertirán cuando se forme un Híbrido. Los gobernantes de una cultura Híbrida [promote_culture|E] mucho más rápido en las Circunscripciones de sus culturas parentales durante #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! años después de formarse.\n\nTambién pueden aparecer Nuevas Culturas como un [divergent_culture|E]."
 game_concept_iberian_reclamation_desc: "Este es un tipo especial de [war|E] disponible para [struggle_involved|E] [rulers|E] del [iberian_struggle|E].\n\nEl atacante apunta a conquistar un [duchy|E] que contenga cualquier [struggle_involved|E] [counties|E] sostenido por un [struggle_interloper|E] o [struggle_uninvolved|E] [ruler|E], o [vassalize|E] si no poseen tierras fuera de esa Región."
 game_concept_initial_legitimacy: "Mandato Inicial"
 game_concept_intrigue: "Manejar opiniones"
 game_concept_intrigue_lifestyle: "Manipular estilo de vida"
 game_concept_intrigue_skill: "Habilidad de manipulación"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ es un [skill|E] para trabajar con los medios y leer a las personas: el informe, la filtración, la historia colocada en un periódico amigo, la trama mantenida en secreto.\n\nSe utiliza principalmente para promover y defenderse contra el Spin [schemes|E].\n\nEl [lifestyle|E] correspondiente es el [intrigue_lifestyle|E]."
 game_concept_intrigue_task_contract: "Contrato de imagen"
 game_concept_intrigue_task_contract_possessive: "Del contrato de imagen"
 game_concept_intrigue_task_contracts: "Contratos de imagen"
 game_concept_intrigue_task_contracts_possessive: "De los contratos de imagen"
 game_concept_kingdom: "Nación"
 game_concept_kingdoms: "Naciones"
 game_concept_knight: "Organizador"
 game_concept_knight_army_modifier: "Modificador de Ejército Organizador"
 game_concept_knight_army_modifier_desc: "Un efecto aplicado a cualquier [army|e] que #high contenga#! el [acclaimed_knight|e] pertinente. \n\nTa [knight|e] necesita #high not#! sea la [commander|e] de su Ejército para que su Modificador de Ejército Organizador se aplique."
 game_concept_knight_army_modifiers: "Modificadores del Ejército Organizador"
 game_concept_knight_desc: "Un $game_concept_knight$ es un [vassal|E], [courtier|E], o [follower|E] que lucha directamente en tu [army|E].\n\nDurante [battles|E], $game_concept_knights$ usan su [prowess_skill|E] para luchar más eficazmente. Un alto $game_concept_prowess$ significa que podrán infligir más daño al enemigo y tienen más probabilidades de sobrevivir o incluso salir ilesos de $game_concept_battle$.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Los Organizadores pueden ser conocidos por diferentes nombres según [culture] o [faith]. Por ejemplo, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ o $knight_baghatur_no_tooltip_plural$.\n\nLos Organizadores representan tanto al personaje como a su séquito de tropas.#!"
 game_concept_knight_desc_ACCOLADE_DLC: "Organizadores a los que se les da un [accolade|E] se convierten en [acclaimed_knights|E].\n\n"
 game_concept_knight_effectiveness: "Efectividad del organizador"
 game_concept_knight_effectiveness_desc: "La Efectividad del Organizador de un [ruler|E] determina qué tan bien lucha su [knights|E] en [battle|E].\n\nAl 100%, los Organizadores luchan normalmente, pero al 200% luchan como si su [prowess|E] se hubiera duplicado."
 game_concept_knights: "Organizadores"
 game_concept_knights_possessive: "Organizadores"
 game_concept_kurultai_desc: "El Kurultai reemplaza al [council|E] para el [nomadic_government|E]. Los miembros del Kurultai están entre la élite del partido, y deben ser apaciguados o forzados a [obedience|E] para asegurar un [succession|E] sin problemas.\n\nDespués del evento de una sucesión caótica, pueden robar algunos [herd|E], abandonar su nuevo [liege|E], ganarán un [claim|E] sobre el [realm|E] [title|E]."
 game_concept_law_desc: "Las Leyes de [realm_possessive|E] son lo que determina cómo se estructura ese Partido.\n\nLa más fundamental de estas es la [government_authority|E] del Partido, ya que esas Leyes determinan cómo interactúan [lieges|E] y [vassals|E] de manera regular.\n\nAunque menos impactantes en la vida diaria de [rulers|E] en un Partido, [succession_laws|E] y [title_laws|E] siguen siendo muy importantes a considerar para [succession|E]."
 game_concept_learning: "Política"
 game_concept_learning_lifestyle: "Estilo de Vida de Políticas"
 game_concept_learning_skill: "Habilidad de Políticas"
 game_concept_learning_skill_desc: "$game_concept_learning$ es un [skill|E] para ideas y detalles: informes leídos, proyectos de ley redactados, comités selectos sobrevividos. También trae [piety|E] cada mes.\n\nEl [lifestyle|E] correspondiente es el [learning_lifestyle|E]."
 game_concept_learning_task_contract: "Contrato de política"
 game_concept_learning_task_contract_possessive: "Del contrato de política"
 game_concept_learning_task_contracts: "Contratos de política"
 game_concept_learning_task_contracts_possessive: "De los contratos de política"
 game_concept_leasing_desc: "Los [baronies|E] menores pueden ser arrendados a [holy_orders|E], [monastic_holy_orders|E] o [clergy|E]. Los distritos arrendados proporcionan [taxes|E] y [levies|E] al [lessee|E] en lugar del [holder|E].\n\nLas Órdenes Militares pueden arrendar [castle_holdings|E] y [city_holdings|E], mientras que las Órdenes Monásticas y los funcionarios del partido pueden arrendar [temple_holdings|E]. Un arrendamiento puede tener un [lease_contract|E].\n\nLos [holdings|E] arrendados todavía se consideran parte del [realm|E] del titular. [county_capitals|E] no puede ser arrendado."
 game_concept_legitimacy: "Mandato"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ es el derecho de un líder a gobernar a los ojos del partido y del país: la elección ganada, el concurso de liderazgo llevado a cabo, la confianza de la Cámara. Un [ruler|E] sin uno está viviendo con tiempo prestado. [vassals|E] también generan [legitimacy_expectations|E] que el [liege|E] se supone que deben cumplir.\n\nSolo [rulers|E] tienen $game_concept_legitimacy$, que se calcula en el momento en que se convierten en gobernantes y resulta en su [initial_legitimacy|E]. Una fracción del $game_concept_legitimacy$ del gobernante anterior también es heredada por su [heir|E].\n\n$game_concept_legitimacy$ afecta muchos de los sistemas del juego, haciendo que las propuestas [marriage|E], [vassalization|E] y [alliances|E] tengan más probabilidades de ser aceptadas, y [claims|E] más baratas, además de inclinar el [scales_of_power|E] en un [regency|E].\n\n$game_concept_legitimacy$ típicamente tiene 5 [legitimacy_levels|E] y un #weak Ilegítimo#! a nivel inferior.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "Expectativas de Mandato"
 game_concept_legitimacy_gain: "Ganancia de Mandato"
 game_concept_legitimacy_level: "Nivel de Mandato"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] los gobernantes ganan #V 50%#! más Mandato por ganar guerras, pero también pierden el doble al ser derrotados. También ganarán Mandato de [single_combat_duel_plural|E] y al casarse con [courtiers|E] de nacimiento noble de alguien con Igual o mayor [dominance|E]."
 game_concept_legitimacy_levels: "Niveles de Mandato"
 game_concept_levies: "Voluntarios"
 game_concept_levy: "Voluntario"
 game_concept_liege: "Líder del Partido"
 game_concept_liege_desc: "Un $game_concept_liege$ es un político con al menos un [vassal|E] que responde a él. Los líderes del partido mismos responden al Primer Ministro."
 game_concept_liege_possessive: "Del Líder del Partido"
 game_concept_liege_taxes: "Líder del Partido Impone Impuestos"
 game_concept_liege_taxes_desc: "Sus $game_concept_liege_taxes$ son los [taxes|E] que debe pagar a su [liege|E] como parte de su [obligations|E]. No paga ningún $game_concept_liege_taxes$ si está [independent|E].\n\nDesde el punto de vista de su Líder de Partido, estos mismos impuestos se llaman en su lugar [vassal_taxes|E] para distinguirlos de cualquier impuesto que puedan deber a su propio $game_concept_liege$."
 game_concept_lieges: "Líderes del Partido"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' es el segundo nivel más bajo de [crown_authority|E]. Los [vassals|E] tienen una penalización #N -10#! [opinion|E] hacia su [liege|E], y el líder del partido puede [revoke|E] [titles|E] y [retract|E] los rezagados de un rezagado. El [ruler|E] puede cambiar entre las [succession_laws|E] de Partición disponibles."
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ es el segundo nivel más bajo de [nomadic_authority|E]. [migration|E] pueden apuntar a [de_jure|E] [duchy|E] [titles|E] dentro del [the_great_steppe|E], [titles|E] puede ser revocado y el líder del partido ahora puede [imprison|E] [characters|E] en su [realm|E].\n\n Puede usar el #V $step_away_from_the_steppe_decision$#! [decision|E]"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ es el segundo nivel más bajo de [tribal_authority|E]. [vassals|E] tiene un #N -10#! [opinion|E] penalización hacia su [liege|E], y el líder del partido ahora puede [imprison|E] [characters|E] en su [realm|E]."
 game_concept_long_reign_desc: "'Largo Reinado' es un bono [opinion|E] creciente que todos los personajes en un [realm|E] reciben con un [liege|E] que ha gobernado sobre ellos durante mucho tiempo.\n\nDe manera similar, los súbditos tienen una penalización [short_reign|E] de Opinión decreciente con los nuevos Líderes del Partido."
 game_concept_mainline_rite: "Ideología"
 game_concept_mainline_rites: "Ideologías"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ es un [councillor_task|E] realizado por el [marshal|E].\n\nAumenta [knight_effectiveness|E] y reduce [hostile_scheme|E] [success_chance|E] contra el [liege|E] del ministro."
 game_concept_mandala_decree_desc: "Los $game_concept_mandala_decrees$ son los tres Decretos mandatados por el [mandala|E] [ruler|E] — señalados por [prosperity_decree|E], [expansion_decree|E] y [reverence_decree|E].\n\nGeneralmente, el partido Mandala tiene una autoridad muy centralizada, donde el poder sobre [subjects|E] y [laws|E] reside en el Gobernante asociado, quien puede cambiarlos según sea necesario con poca o ninguna objeción de sus habitantes."
 game_concept_mandala_desc: "Bajo el $game_concept_mandala$ [government_form|E], el [domain_limit|E] y la cantidad de [direct_vassals|E] están limitados. En cambio, el [liege|E] y [suzerain|E] dependen de [tributaries|E] para expandir su partido. \n\nA Mandala [ruler|E] puede aspirar a ser visto como un Rey Dios, o Devaraja, y luego depende de [mandala_radiance|E] para adquirir y mantener $game_concept_tributaries$.\n\nA $game_concept_ruler$ debe mantener [opinion|E] y crecer en relaciones con su $game_concept_tributaries$ para mantenerlos a largo plazo. A la sucesión, $game_concept_tributaries$ puede dispersarse a menos que el $game_concept_ruler$ sea un [mandala_succesor|E] digno."
 game_concept_mandate_of_heaven_desc: "El $game_concept_mandate_of_heaven$ es un tipo especial de [legitimacy|E] disponible solo para [son_of_heaven|E]. Representa el derecho del monarca a gobernar y quién es considerado el gobernante supremo bajo todo el cielo.\n\nEl Mandato está estrechamente relacionado con el [dynastic_cycle|E]. El Ciclo afecta cómo el monarca reinante obtiene el Mandato y también puede cambiar [situation_dynastic_cycle_phase|E] según el nivel de Mandato del monarca."
 game_concept_marshal: "Secretario de Interior"
 game_concept_marshal_desc: "El $game_concept_marshal$ es el [councillor|E] a cargo de la seguridad: la policía, las fronteras y el mantenimiento del orden."
 game_concept_marshals: "Secretarios de Interior"
 game_concept_martial: "Seguridad"
 game_concept_martial_lifestyle: "Estilo de vida de seguridad"
 game_concept_martial_skill: "Habilidad de seguridad"
 game_concept_martial_skill_desc: "$game_concept_martial$ es un [skill|E] para la ley y el orden, defensa y gestión de crisis: mantener las calles y el país seguros.\n\nEl [lifestyle|E] correspondiente es el [martial_lifestyle|E]."
 game_concept_master_assassin_desc: "El $game_concept_master_assassin$ es un [court_position|E] habilitado por [faiths|E] con el [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]. El $game_concept_master_assassin$ es un fanático peligroso que trabaja junto con asesinos menores para matar a los enemigos percibidos de la ideología."
 game_concept_maximum_piety_level: "Nivel Máximo de Capital Político"
 game_concept_men_at_arms: "Activistas"
 game_concept_men_at_arms_counter: "Contra Activistas"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$ son [soldiers|E] profesionales superiores a [levies|E].\n\nEl jugador tiene control directo sobre la composición y el tamaño de sus Activistas [regiments|E].\n\nDiferentes tipos de Activistas son buenos o malos en distintos tipos de [terrain|E]. Cada tipo también [counters|E] a otro tipo.\n\nLos Activistas pueden ser [stationed|E] en [holdings|E] para aumentar su efectividad."
 game_concept_mental_break_desc: "Cuando [stress|e] abruma a un personaje, este experimentará una Ruptura Mental — una crisis personal en la que siente que debe hacer algo para disminuir su Presión, sin importar el costo.\n\nLos personajes que sufren una Ruptura Mental tendrán varias formas de manejar la situación, aunque muchas de ellas tendrán consecuencias negativas.\n\nA bajos [stress_levels|E] estas consecuencias son menores y fácilmente manejables. Sin embargo, a medida que el Nivel de Presión aumenta, también lo hacen estas consecuencias, llevando eventualmente a la locura e incluso a la muerte."
 game_concept_minister_grand_chancellor_desc: "El $game_concept_minister_grand_chancellor$ es el [minister|E] de más alto rango y está a cargo de los asuntos diplomáticos. Normalmente se le asigna el puesto de [grand_secretariat_director|E].\n\nEl Secretario de Asuntos Exteriores puede ser el [grand_secretariat_director|E] designado, dependiendo del #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "El $game_concept_minister_grand_marshal$ es el comandante de más alto rango en el [realm|E] y comanda un [army|E] de [title_men_at_arms|E].\n\nEl Secretario de Interior puede ser el [grand_secretariat_director|E] designado, dependiendo del #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ es un conjunto único de [vassal_obligations|E] disponible solo para [ministers|E].\n\nTodos los ministros civiles tienen un conjunto específico de opciones como predeterminado, mientras que el [minister_grand_marshal|E] tiene una opción única que proporciona al Secretario del Interior [title_men_at_arms|E].\n\nEstas obligaciones no se pueden cambiar."
 game_concept_natural_prowess: "Resistencia Natural"
 game_concept_noble_family_desc: "$game_concept_noble_families$ son [houses|E] poderosas en un [government_bureaucratic_type|E] [realm|E]. Poseen un [estate|E], controlado y gestionado por el [house_head|E], y permanecen como parte integral del Partido en todo momento, ya que intentarán reunir [influence|E] y asegurar [provinces|E] para sí mismos. \n\nANn $game_concept_noble_family$ influyente puede convertirse en un [powerful_family|E] o un [dominant_family|E]."
 game_concept_obedience_desc: "En [GetGovernment( 'nomad_government' ).GetName] [realms|E], la obediencia determina la lealtad de un [character|E] hacia su [liege|E], [suzerain|E] o dueño de su [court|E]. Los personajes solo pueden ser obedientes a un [ruler|E] a la vez.\n\nLos personajes obedientes son menos propensos a participar en [hostile_schemes|E], unirse a [wars|E] o sumarse a [factions|E] contra su líder de partido. Siempre apoyarán las preferencias de su líder de partido durante [succession|E] y no presionarán sus [claims|E] sobre él. Los [tributaries|E] no obedientes pueden intentar liberarse.\n\nCuando la puntuación de un personaje supera el [obedience_threshold|E] se vuelve obediente."
 game_concept_offer_vassalization_desc: "Una interacción que ofrece [vassalage|E] a un [independent|E] [ruler|E] de menor [title_rank|E], agregándolos pacíficamente al partido."
 game_concept_organize_levies_desc: "Un [councillor_task|E] realizado por el [marshal|E]. Aumenta el Tamaño de [garrison|E] y la Tasa de Refuerzo de [levy|E] en la [realm|E] del [liege|E] del ministro."
 game_concept_organized_desc: "Un [faith|E] Organizado tiene una jerarquía religiosa. El culto y las prácticas están más organizados y las escrituras son formalizadas.\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] Las Ideologías pueden convertirse en Organizadass reformándose, mientras que otras Ideologías siempre se consideran Organizadas."
 game_concept_pam_challenge_hof_cb: "Líder Movimiento de Desafío"
 game_concept_papal_recipient_desc: "Si el objetivo principal del [great_holy_war|E] ya está ocupado o reclamado por un miembro de la ideología agresora, se le considerará el destinatario legítimo del título en disputa, a menos que el principal [Concept( 'war_contribution', 'Contributor' )|E] decida dar preferencia a su [beneficiary|E]."
 game_concept_peasant_faction_desc: "El $game_concept_peasant_faction$ está compuesto por [counties|E] con bajo [county_opinion|E]. A diferencia de otros [factions|E], este siempre se rebelará incluso si [faction_military_power|E] es bajo, ya que los campesinos generalmente son optimistas e iletrados... Los Movimientos de Protesta exitosos reducirán significativamente el Control en tu [realm|E]."
 game_concept_peasant_factions: "Movimientos de protesta"
 game_concept_perk_desc: "Los beneficios especiales son ventajas desbloqueables que proporcionan muchos efectos útiles e interesantes. Se desbloquean seleccionando un [focus|E] dentro de un [lifestyle|E] y gastando la forma asociada de [experience|E] #weak (por ejemplo, Gire $game_concept_experience$ si desea desbloquear un $game_concept_intrigue_lifestyle$ $game_concept_perk$.)#!"
 game_concept_personal_tenet: "Causa personal"
 game_concept_personal_tenets: "Causas personales"
 game_concept_petition_antipope_gold_interaction: "Petición al antipapa de fondos"
 game_concept_piety: "Capital Político"
 game_concept_piety_desc: "$game_concept_piety$ es el crédito de un político con su partido y el establecimiento: lealtad demostrada, favores realizados, las causas correctas apoyadas.\n\nSe gasta en pedir cosas al partido y al establecimiento, dependiendo del [government_form|E].\n\nCada vez que un Personaje gana Capital Político, también progresa hacia el siguiente [piety_level|E]."
 game_concept_piety_experience: "Lealtad"
 game_concept_piety_experience_desc: "Cada punto de Lealtad que un personaje obtiene aumenta su progreso hacia el siguiente [piety_level|E]. Cuando un personaje gana [piety|E] también gana una cantidad igual de Lealtad."
 game_concept_piety_level: "Nivel de Capital Político"
 game_concept_piety_level_desc: "El $game_concept_piety_level$ de un Personaje es una medida de cuánto crédito han acumulado con su partido y la institución, y de su posición con otros de su [faith|E].\n\nCada vez que un Personaje gana [piety|E], también progresa hacia el siguiente Nivel de Capital Político.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nLos Niveles son:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "Impacto del Nivel de Capital Político"
 game_concept_piety_level_impact_desc: "El Impacto del Nivel de Capital Político aumenta o disminuye el [modifiers|E] obtenido de tu actual [piety_level|E]."
 game_concept_piety_levels: "Nivel(es) de Capital Político"
 game_concept_playdate_desc: "Un [activity|E] donde los gobernantes y el personal menores de [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] años se reúnen para jugar y olvidar la monotonía del día. \n\nParticipantes perderán [stress|E] y aumentarán su [opinion|E] del anfitrión. También puede haber muchas otras consecuencias al reunir a tantos niños. \n\nA [ruler|E] invitarán a su [liege|E] y a su [vassals|E] (junto con varios [courtiers|E]) a un $activity_playdate$."
 game_concept_player_heir_desc: "El $game_concept_player_heir$ es el [heir|E] que un jugador seguirá usando en [succession|E].\n\nEl $game_concept_player_heir$ suele ser el mismo que el [primary_heir|E], pero si el [succession_law|E] de tu [primary_title|E] indica que debería ir a un personaje fuera de tu [dynasty|E], en su lugar seguirás jugando como el heredero dinástico de tu título de nivel más alto secundario (o tercero, cuarto, etc.).\n\nEsta situación es común cuando tu $game_concept_player_heir$ es destituido bajo una Ley de Sucesión Electiva. Si eres [house_head|E] de un [noble_family|E] en un [administrative|E] [realm|E] podrías perder tu Partido a los Herederos Primarios fuera de tu [house|E] pero conservar tu Título de Familia Noble.\n\nSi eres [ecclesiastical|e], tu $game_concept_player_heir$ es el personaje que está destinado a heredar tu [primary_title|e], usualmente un [archdiocese|e]."
 game_concept_popular_faction_desc: "El $game_concept_popular_faction$ está compuesto por [counties|E] con bajo [county_opinion|E] que comparten un elemento común, como [culture|E] o [faith|E]. Buscan liberarse y eligen un nuevo [ruler|E] según su Cultura o Ideología. Este tipo de levantamiento generalmente es muy peligroso."
 game_concept_popular_factions: "Movimientos Populistas"
 game_concept_powerful_family_desc: "Un $game_concept_powerful_family$ representa a uno de los [houses|E] y [noble_families|E] más influyentes en un [government_bureaucratic_type|E] [realm|E].\n\nUn miembro de un $game_concept_powerful_family$ es mejor en [political_schemes|E] y es más probable que consiga lo que quiere cuando [interacting|E] con otros [characters|E].\n\nSolo puede haber un número limitado de $game_concept_powerful_families$ en cualquier momento, y son los $game_concept_noble_families$ mejor clasificados los que se consideran poderosos basados en su [powerful_family_rating_short|E]. La Cámara de los [top_liege|E] es una excepción, que siempre se considera poderosa.\n\nUna Familia que controla una parte significativa de la tierra de un Partido puede convertirse en un [dominant_family|E]."
 game_concept_powerful_vassal: "Diputado influyente"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' son el puñado de [vassals|E] con más [soldiers|E] y la mayor [income|E]. Necesitas prestar atención cuidadosa a estos rezagados, porque esperan mantener un asiento en tu [council|E] y tendrán [opinion|E] significativamente más bajos hacia ti si no lo hacen.\n\nCambiar un [succession_law|E] requiere que todos los $game_concept_powerful_vassals$ tengan ya sea un [opinion|E] positivo hacia ti, sean [cowed|E] por ti, o sean [imprisoned|E]."
 game_concept_powerful_vassal_possessive: "Del diputado influyente"
 game_concept_powerful_vassals: "Diputados influyentes"
 game_concept_prestige: "Perfil"
 game_concept_prestige_desc: "$game_concept_prestige$ es la fama pública de un político: reconocimiento de nombre, espacio en columnas y tiempo en antena.\n\nSe gasta en movimientos públicos, dependiendo del [government_form|E].\n\nCada vez que un Personaje gana Perfil, también progresa hacia el siguiente [prestige_level|E]."
 game_concept_prestige_experience: "Fama"
 game_concept_prestige_level: "Nivel de perfil"
 game_concept_prestige_level_impact: "Impacto del nivel de perfil"
 game_concept_prestige_level_impact_desc: "El impacto del nivel de perfil aumenta o disminuye el [modifiers|E] obtenido de tu [prestige_level|E] actual."
 game_concept_prestige_levels: "Niveles de perfil"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$ son los #V 7#! [electors|E] que seleccionan un [title_heir|E] junto con el Emperador bajo el [GetLaw('princely_elective_succession_law').GetName] [succession_law|E] utilizado por [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )].\n\n[holders|E] de #V 7#! preferidos [titles|E] son priorizados como $game_concept_prince_electors$. Estos Títulos se seleccionan cuando se crea el Imperio.\n\nSi un $game_concept_prince_elector$ Título es destruido, no es sostenido por un [de_jure|E] Imperial [vassal|E], es sostenido por otro $game_concept_prince_elector$, o el [religion|E] del Titular difiere del del Emperador, otro Título de Jure sostenido por un integrante Imperial directo o [independent_ruler|E] será seleccionado basado en estos criterios:\n$EFFECT_LIST_BULLET$[rulers|E] del [faith|E] y [culture|E] del Emperador son favorecidos\n$EFFECT_LIST_BULLET$[theocratic|E] y [feudal|E] Gobernantes son favorecidos\n\n#help Los Títulos Preferidos se listan en la vista de Elección#!"
 game_concept_promote_other_culture_development_decision_desc: "UN [decision|E] que te permite mejorar [development|E], [control|E], [building|E] costos y defensiva [advantage|E] en [counties|E] de diferentes [cultures|E] con un [cultural_acceptance|E] de #V 75%#! o más.\n\nTomar la Decisión también aumentará tu [prestige|E] [prestige_i] y [levies|E].\n\nTodas las Circunscripciones en el [realm|E] se ven afectadas. El costo [gold|E] escala con el número de Circunscripciones afectadas."
 game_concept_prowess: "Resistencia"
 game_concept_prowess_skill: "Habilidad de Resistencia"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ es un [skill|E] que refleja la resistencia física y mental de un personaje: días de dieciocho horas, sesiones toda la noche y la ruta de campaña.\n\nUna alta habilidad de Resistencia significa que es más probable que sobrevivan y se desempeñen bien tanto como [knights|E] en [battles|E] como en [single_combat_duel_plural|E].\n\nCada punto de Resistencia otorga un Organizador:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E] puede ser levantado como $game_concept_raiders$ desde [rally_points|E]. $game_concept_raiders$ puede moverse a tierras vecinas y saquearlas para obtener [gold|E].\n\nPara $game_concept_raid$, un Ejército de Incursión debe detenerse en un [holding|E] perteneciente a un [ruler|E] extranjero y elegir comenzar la Incursión; al hacerlo, quedarán atrapados saqueando por algún tiempo, tras lo cual obtendrán Fondos y saquearán la Tenencia.\n\nLos fondos se almacenarán en el Ejército y solo se añadirán a la tesorería cuando lleguen a casa. Si derrotas a un Ejército de Incursión que lleva Fondos, los tomarás, y ellos no podrán saquearte por algún tiempo.\n\nSolo algunos Gobernantes tienen permitido $game_concept_raid$, especialmente los Gobernantes [tribal|E] y [GetGovernment( 'nomad_government' ).GetName].\n\nSe pueden establecer [raid_intents|E] específicos para obtener diferentes recompensas."
 game_concept_rally_point_desc: "Un $game_concept_rally_point$ es un terreno de concentración para los [levies|E] y [men_at_arms|E] bajo tu mando. \n\nEn tiempos de [war|E], puedes convocar a tus [soldiers|E] en un Punto de Reunión para reunir un [army|E].\n\nLos Voluntarios asignados a un Punto de Reunión deben provenir de tu propio [domain|E] o de tu [vassals|E]. Los Puntos de Reunión pueden reorganizarse, dividirse y fusionarse según lo consideres conveniente."
 game_concept_realm: "Partido"
 game_concept_realm_capital: "Base principal"
 game_concept_realm_capital_desc: "El $game_concept_realm_capital$ es el [holding|E] donde reside un [ruler|E] y su [court|E]. Esta Tenencia tiene un bono de [tax|E] y siempre es heredada por el [primary_heir|E].\n\n[occupying|E] la Base Principal de un enemigo en una guerra proporciona una cantidad significativa de [war_score|E] y a veces permite [imprison|E] miembros de la familia del enemigo."
 game_concept_realm_capital_possessive: "De la base principal"
 game_concept_realm_capitals: "Bases principales"
 game_concept_realm_desc: "Un $game_concept_realm$ es todo el mundo y todo lo que un político dirige, directamente o a través de su [vassals|E] (a diferencia de un [domain|E], que es solo lo que ellos mismos poseen)."
 game_concept_realm_heir: "Heredero del Partido"
 game_concept_realm_heir_desc: "Un Heredero del Partido es uno de los [heirs|E] de un [realm|E], y recibirá todo o parte del [titles|E] en poder del [ruler|E] de ese Partido cuando ese Gobernante muera.\n\nUn Partido puede tener uno o más Herederos del Partido dependiendo de su [succession_law|E]."
 game_concept_realm_heirs: "Herederos del Partido"
 game_concept_realm_law: "Ley de Partido"
 game_concept_realm_law_desc: "Leyes que se aplican al partido de este personaje, como el nivel de [crown_authority|E] o [tribal_authority|E]."
 game_concept_realm_possessive: "del Partido"
 game_concept_realm_priest: "Sacerdote del Partido"
 game_concept_realm_priest_desc: "Un $game_concept_realm_priest$ es un [councillor|E] a cargo de los asuntos religiosos y espirituales en [faiths|E] con el [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E].\n\nA diferencia de su equivalente [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] ([court_chaplains|E]), $game_concept_realm_priests$ automáticamente [lease|E] todos los [temple_holdings|E] en un [ruler|E] de [domain|E], y también reciben una porción de [taxes|E] y [levies|E] de [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ proporcionan a sus [liege|E] Voluntarios y Impuestos si tienen una Opinión positiva de ellos. Cuanto mayor sea el [opinion|E] de su [liege|E], más proporcionarán.\n\n$game_concept_realm_priests$ con una Opinión baja de su Líder del Partido no les proporcionará Impuestos ni Voluntarios, y podría causar problemas."
 game_concept_realm_priest_possessive: "del Sacerdote del Partido"
 game_concept_realm_priests: "Sacerdotes del Partido"
 game_concept_realm_size: "Tamaño del Partido"
 game_concept_realms: "Partidos"
 game_concept_regency_desc: "Una Regencia es una forma especial de [diarchy|E] para cuando el [ruler|E] no puede gobernar su [realm|E] por sí mismo.\n\nGeneralmente ocurre si el Gobernante es un [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )], o está asistiendo a un [activity|E] fuera de su Partido.\n\nA $game_concept_regency$ que persiste demasiado tiempo puede convertirse en un [entrenched_regency|E]."
 game_concept_religion: "Campo Político"
 game_concept_religion_desc: "Un $game_concept_religion$ grupos relacionados [faiths|E]: la Izquierda, el Centro, la Derecha, los Nacionalistas y los Unionistas. Las ideologías del mismo o de un campo vecino son Divergentes; izquierda y derecha están Opuestas; nacionalistas y unionistas son Irreconciliables."
 game_concept_religions: "Campos Políticos"
 game_concept_religious_families: "Familias Políticas"
 game_concept_religious_family: "Familia Política"
 game_concept_religious_family_desc: "Un $game_concept_religious_family$ es un grupo de [religions|E]. El $game_concept_religious_family$ afecta cómo se ven entre sí los distintos Campos Políticos y los [faiths|E] que hay en ellos.\n\nLa familia [GetReligionFamily('rf_abrahamic').GetName] aprueba [holy_wars|E] contra todos #weak (incluyendo a otros abrahámicos)#!. Los Campos Políticos son susceptibles a [heresy|E].\n\nLa familia [GetReligionFamily('rf_eastern').GetName] solo aprueba Guerras Santas contra otras Familias Políticas.\n\nLa familia [GetReligionFamily('rf_pagan').GetName] aprueba Guerras Santas contra todos, pero las Ideologías dentro de los Campos Políticos deben reformarse para poder acceder a ellas."
 game_concept_religious_head_succession_law: "Ley de sucesión del líder del movimiento"
 game_concept_religious_head_succession_law_desc: "[rulers|E] que también son [heads_of_faith|E] tienen una ley de partido adicional [succession|E], que requiere que sus [heir|E] sean del mismo [faith|E] que ellos. Esto nunca puede ser cambiado, y $game_concept_head_of_faith$ [titles|E] no puede tener [title_succession|E] aparte. La única manera de eliminar este tipo de ley de partido es que una fuerza externa destruya los [head_of_faith|E] $game_concept_title$."
 game_concept_religious_head_succession_law_short: "Ley del líder del movimiento"
 game_concept_religious_head_succession_laws: "Ley de sucesión del líder del movimiento"
 game_concept_religious_head_succession_laws_short: "Leyes del líder del movimiento"
 game_concept_religious_superior_desc: "Un Superior religioso es un [character|E] que posee jurisdicción religiosa sobre uno o más [subordinate|E] funcionarios de partido religioso en una estructura religiosa jerárquica."
 game_concept_retinue_maa: "Activistas de la Comitiva"
 game_concept_retract_desc: "A [limited_crown_authority|E] o más, [rulers|E] puede $game_concept_retract$ el [vassal|E] de un Diputado, pero a menos que este último sea [imprisoned|E] esto es arriesgado, pues el Diputado puede negarse y rebelarse.\n\nLa Retracción del Diputado se considera [tyrannical|E] a menos que el objetivo sea culpable de un [crime|E] bastante grave."
 game_concept_revoke_desc: "En [limited_crown_authority|E] o superior, [rulers|E] puede $game_concept_revoke$ el [titles|E] de su [vassals|E], pero a menos que el Backbencher esté [imprisoned|E], esta es una propuesta arriesgada, ya que el Backbencher puede negarse y levantarse en rebelión.\n\nLa revocación del título se considera [tyrannical|E] a menos que el Backbencher sea culpable de un [crime|E] bastante grave."
 game_concept_rightful_liege: "Líder legítimo del partido"
 game_concept_rightful_liege_desc_part2: "#weak Ejemplo: El Conde de $c_dunbar$ es un diputado directo del Rey de $k_england$. Dado que el Rey no es ni Duque de $d_lothian$, ni Rey de $k_scotland$, ni Emperador de $e_britannia$, el Conde de $c_dunbar$ solo contribuye con una pequeña parte de sus impuestos y voluntarios.\n\nEl Conde de $c_norfolk$ también es un diputado directo del Rey de $k_england$. El Rey no posee la Región de $d_norfolk$, por lo que el Conde también contribuye con impuestos y voluntarios reducidos. Sin embargo, dado que el $k_england$ es la Nación De Jure de $c_norfolk$, el Conde de $c_norfolk$ aún contribuye con impuestos y voluntarios significativamente más al Rey que el Conde de $c_dunbar$.#!"
 game_concept_rite: "Ideología"
 game_concept_rite_desc: "En Westminster, cada [faith|E] tiene un único $game_concept_rite$ con el mismo nombre: la ideología en sí, con sus [core_tenets|E] y [doctrines|E]. Son fijos: los políticos cambian de opinión, no la ideología."
 game_concept_rite_divergence_desc: "La divergencia mide qué tan lejos un [rite_possessive|E] [core_tenets|E] y [doctrines|E] se han alejado del [faith|E] principal. Una ideología que adopta [prohibited_tenet_status|E] Causas como [core_tenet_status|E] es más divergente.\n\nUna alta divergencia debilita el [fervor|E] de la ideología principal, haciendo que los brotes de [heresy|E] sean más comunes. Una ideología que alcanza #V 100#! de divergencia será automáticamente declarada como escindida y se convertirá en un nuevo [faith|E]."
 game_concept_rite_knowledge: "Conocimiento ideológico"
 game_concept_rite_possessive: "Ideologías"
 game_concept_rites: "Ideologías"
 game_concept_rites_possessive: "Ideologías"
 game_concept_royal_court: "Oficina privada"
 game_concept_royal_court_desc: "Los distinguidos [rulers|E] son lo suficientemente famosos como para mantener una Oficina Privada, lo que da acceso a una variedad de bonos y oportunidades.\n\nCuando un [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] o [GetGovernment( 'tribal_government' ).GetName] [ruler|E] se convierte en [king|E] o [emperor|E], obtienen acceso a su Oficina Privada.\n\nCada Oficina Privada tiene un [court_grandeur_level|E], que brinda beneficios según cuán famoso sea la Oficina Privada, y según [court_type|E] la Oficina Privada es.\n\nLos peticionarios, [vassals|E] y [courtiers|E] pueden aparecer en su Oficina Privada, o puede [hold_court|E] para invitar a cualquiera en el [realm|E] a presentar sus quejas.\n\nUna Oficina Privada también permite al Gobernante exhibir [court_artifacts|E], y [inspired|E] [guests|E] pueden aparecer en la Oficina Privada, ofreciendo crear nuevos [artifacts|E].\n\nCuando muere, su [player_heir|E] heredará su Oficina Privada."
 game_concept_royal_courts: "Oficinas privadas"
 game_concept_sanctified_desc: "Santificar un [artifact|E] lo convierte en un [holy_relic|E] para un [faith|E]. Un artefacto puede ser santificado por múltiples ideologías."
 game_concept_scales_of_power_desc: "Durante [power_sharing|E], el equilibrio de poder entre los [liege|E] y sus [diarch|E] se mide en el $game_concept_scales_of_power$.\n\nA medida que los $game_concept_scales_of_power_scales$ se inclinan hacia los $game_concept_diarch$, desbloquean [diarch_powers|E] y pueden añadir costos al [diarch_affected_actions|E] del Líder del Partido.\n\nA medida que se inclinan hacia los $game_concept_liege$, en cambio facilita que el Líder del Partido termine el [diarchy|E].\n\nEl $game_concept_scales_of_power_scales$ puede ser inclinado mediante:\n$EFFECT_LIST_BULLET$Usando el $swing_scales_currency_interaction$ [character_interaction|E] contra el partido opositor\n$EFFECT_LIST_BULLET$A medida que el $game_concept_diarch$, sirviendo bien a tu $game_concept_liege$ (sin importar qué tan cínico) en los eventos [mandate|E]"
 game_concept_seasonal_prediction_desc: "Un $court_position_court_astrologer$ hábil puede predecir el próximo [steppe_season|E] en una región, ofreciendo información útil a su líder de partido para planear sus próximos movimientos."
 game_concept_seize_peripheral_duchy: "Tomar la Región Periférica"
 game_concept_settlement_issue_desc: "Los Asuntos de Asentamiento son tareas asignadas a un [nomad|E] [ruler|E] después de completar un [migration|E] en nuevas tierras. Brindan la oportunidad de manejar conflictos y aumentar el [county_control|E] local en el nuevo [domain|E]. \n\n Estos asuntos continuarán ocurriendo durante los primeros años después de que un gobernante haya migrado, mientras la circunscripción tenga bajo control de constituyentes."
 game_concept_short_reign_desc: "'Corto Reinado' es una penalización [opinion|E] decreciente que todos los personajes en un [realm|E] reciben con un nuevo [liege|E].\n\nDe manera similar, los súbditos obtienen un bono [long_reign|E] de Opinión creciente con los Líderes del Partido que han gobernado sobre ellos durante mucho tiempo."
 game_concept_shunned_desc: "Muchos [rites|E] tienen [doctrines|E] que designan ciertos comportamientos como Rechazados. Dependiendo de la Posición Política específica, estos comportamientos también pueden considerarse [criminal|E]. \n\nCharacters que son sorprendidos practicando conductas que son rechazados por su Ideología pierden un [piety_level|E] y ganan un [fame_trait|E] correspondiente; este Rasgo será rechazado por todos cuya ideología considere ese comportamiento como Rechazado o Criminal.\n\nEEjemplos de comportamientos Rechazados incluyen:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "Cada [rite|E] considera ciertos [traits|E] como Pecaminosos. Los personajes con estos Rasgos reciben penalizaciones [opinion|E] de todos los personajes que consideran esos rasgos Pecaminosos, incluso si no comparten la misma Ideología. Además, los personajes que tienen Rasgos que su propia Ideología considera Pecaminosos perderán [piety|E] cada mes.\n\nExactamente qué rasgos se consideran Pecados varía de una Ideología a otra, pero generalmente se determina por una combinación del [core_tenets|E] de esa Ideología y del [religion|E] al que pertenece la Ideología."
 game_concept_spiritual_fulfillment: "Convicción personal"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ es lo cómodo que está un [character|E] con su propia política. Sube y baja con su [traits|E] y con cómo actúa."
 game_concept_spiritual_fulfillment_level: "Nivel de convicción"
 game_concept_spiritual_fulfillment_level_desc: "Un [character_possessive|E] [spiritual_fulfillment|E] se divide en $game_concept_spiritual_fulfillment_levels$, cada uno con sus propios efectos."
 game_concept_spiritual_fulfillment_levels: "Niveles de convicción"
 game_concept_spiritual_head_of_faith: "Líder de movimiento espiritual"
 game_concept_spymaster: "Líder de Grupo"
 game_concept_spymaster_desc: "El $game_concept_spymaster$ es el [councillor|E] que mantiene al partido en línea y conoce los secretos de todos. Cuidado con un Líder de Mayoría desleal: pueden fácilmente ocultar o unirse a un complot en tu contra."
 game_concept_state_rite: "Ideología del Estado"
 game_concept_state_rite_desc: "$game_concept_state_rite$ es el [rite|E] apoyado y aprobado por un [administrative_government|E]. Esta ideología está vinculada al [title|E] y no a ninguna [character|E] específica. Es más fácil convertir a los personajes en el [realm|E] a la ideología del estado y muy difícil alejarlos de ella.\n\nSolo el [ruler|E] de un Partido Administrativo puede cambiar la Ideología del Estado, pero [governors|E] puede convertirse libremente a ella."
 game_concept_stationed_regiment_desc: "Un [men_at_arms|E] [regiment|E] recibe bonificaciones a su efectividad al estar Estacionado en un [holding|E].\n\n[buildings|E] pueden aumentar aún más estas bonificaciones — a veces para cualquier tipo de Activistas, pero más comúnmente para uno o dos. Por ejemplo, [GetBuilding('stables_01').GetName] proporciona una bonificación a [light_cavalry|E] y [heavy_cavalry|E] Estacionados.\n\nPuedes Estacionarte en cualquier momento excepto durante [war|E], o si la Tenencia es [occupied|E]. Si se pierde una Tenencia, cualquier Activista Estacionado será desestacionado."
 game_concept_steward: "Canciller de Hacienda"
 game_concept_steward_desc: "El $game_concept_steward$ es el [councillor|E] a cargo de la economía y el [domain|E]: [taxation|E], gastos y [development|E]."
 game_concept_stewards: "Cancilleres de Hacienda"
 game_concept_stewardship: "Economía"
 game_concept_stewardship_lifestyle: "Estilo de vida de Economía"
 game_concept_stewardship_skill: "Habilidad Económica"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$ es un [skill|E] para presupuestos, la economía y la gestión de las cosas. Aumenta directamente los [taxation|E], por lo que todo líder lo desea.\n\nEl [lifestyle|E] correspondiente es el [stewardship_lifestyle|E]."
 game_concept_stewardship_task_contract: "Contrato de Economía"
 game_concept_stewardship_task_contract_possessive: "Del Contrato de Economía"
 game_concept_stewardship_task_contracts: "Contratos de Economía"
 game_concept_stewardship_task_contracts_possessive: "De los Contratos de Economía"
 game_concept_story_content_el_cid_desc: "#tooltip_heading Estilo de Historia: Ligero#!\n\nComo El Cid, serás injustamente apartado por el líder de tu grupo. En el exilio, puedes optar por mantener la lealtad o encontrar tu propio camino, culminando eventualmente con un regreso a la corte #EMP o#! el premio supremo — Valencia.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading Estilo de Historia: Moderado#!\n\nComo Hasan, serás guiado por un camino de fanatismo religioso, eligiendo un lugar para llevar la luz de la Verdadera Ideología y convirtiendo [counties|E] de su [rulers|E].\n\nEventualmente, tu historia culminará con un gran levantamiento religioso contra tu enemigo elegido.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading Estilo de Historia: Ligero#!\n\nComo Temüjin, buscarás venganza contra una tribu rival que había encarcelado a tu cónyuge, y pondrás a prueba la lealtad de tu amigo más cercano y de confianza — Jamukha.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "Presión"
 game_concept_stress_desc: "Los personajes caen bajo $game_concept_stress$ cuando actúan en contra de su [personality_traits|E]: el diputado leal que vota en contra de la disciplina del partido, el ministro honesto obligado a defender una mala línea.\n\nLos personajes bajo suficiente presión obtienen un [stress_level|E], con efectos sobre su salud que duran hasta que lo reducen de nuevo.\n\nEl tiempo lejos de Westminster y [activities|E] lo alivia."
 game_concept_stress_level: "Nivel de presión"
 game_concept_stress_level_desc: "Cada 100 [stress|E] que un personaje acumula también hace que gane un Nivel de Presión. Los Niveles de Presión varían de 0 a 3, con cada nivel imponiendo penalizaciones crecientes a [fertility|E] y [health|E] de un personaje.\n\nAdemás, mientras un personaje tenga al menos 1 Nivel de Presión, es vulnerable a [mental_breaks|E]."
 game_concept_stress_levels: "Niveles de presión"
 game_concept_stress_loss: "Pérdida de presión"
 game_concept_stressed: "Bajo Presión"
 game_concept_strong_vassal: "Fuerte diputado de base"
 game_concept_strong_vassal_desc: "Un $game_concept_strong_vassal$ es un [vassal|E] que se acerca o supera su [liege|E] en poder, incurriendo en una penalización de [opinion|E]. #weak Ven a su líder de partido como débil e inapropiado para gobernar el partido.#!"
 game_concept_strong_vassals: "Miembros de base fuertes"
 game_concept_struggle_involved_faith: "Ideología involucrada"
 game_concept_struggle_involved_faiths: "Ideologías involucradas"
 game_concept_struggle_persia_phase_unrest_desc: "Asediado por rebeliones e intrigas, el Califato se desmorona. Señores de la guerra ambiciosos y gobernadores astutos por igual se aferran a cualquier poder que puedan usurpar, discutiendo constantemente.\n\nCon el tiempo, a menos que la situación sea resuelta por un [ending_phase|E], el partido entrará en una fase de [struggle_persia_phase_stabilisation|E] mientras los seguidores desesperados recuperan la autoridad califal."
 game_concept_struggle_phase_desc: "Un $game_concept_struggle_phase_phase$ es un estado de ánimo general común entre [struggle_involved|E], [characters|E] y [counties|E] dentro de un [struggle_region|E]. Representa tendencias sociales a corto plazo y normas que dominan temporalmente el diálogo del [struggle|E].\n\n#weak Ejemplo: en un $game_concept_struggle_phase_phase$, la gente de un $game_concept_struggle_region_region$ puede pensar que la tolerancia religiosa es primordial, incluso si el resto de su ideología no está de acuerdo.#!"
 game_concept_supply_limit_desc: "El $game_concept_supply_limit$ determina la cantidad de [soldiers|E] que puedes tener en un [barony|E], según el [terrain|E] y el [development|E] del Ward. \n\nSui el tamaño total de tu [army|E] supera el $game_concept_supply_limit$, tu $game_concept_armies$ perderá [supply|E] y eventualmente sufrirá [attrition|E]."
 game_concept_temporal_head_of_faith: "Líder de Movimiento Temporal"
 game_concept_tenet: "Causa"
 game_concept_tenet_desc: "Mientras los [doctrines|E] representan cuestiones sobre las que un [rite|E] debe tomar una postura, los $game_concept_tenets$ representan las peculiaridades y prácticas únicas de la Ideología."
 game_concept_tenet_knowledge: "Conocimiento de Políticas"
 game_concept_tenet_knowledge_desc: "Los políticos no conocen en detalle el pensamiento de cada otra ideología.\n\nSaber todos los $game_concept_core_tenets$ y $game_concept_doctrines$ de un $game_concept_rite$ hace que sea más fácil cambiar tu opinión hacia él.\n\nTodos los [core_tenets|E] y [doctrines|E] de tu propio [faith|E] te son conocidos. Más se puede aprender de [spouses|E], [friends|E] y [activities|E]."
 game_concept_tenet_popularity: "Popularidad de la causa"
 game_concept_tenet_popularity_desc: "A medida que [personal_tenets|E] se difunde dentro de un [faith|E], su práctica se vuelve más común. $game_concept_tenet_popularity$ rastrea cuán extendido está un [core_tenet|E] y afecta qué tan probable es que sea elegido como tema de debate en un [ecumenical_council|E] o como objetivo de un [papal_bull|E].\n\nCuanto mayor sea el $game_concept_tenet_popularity$, más el [clergy|E] se alineará con una causa cuando se debata en un [ecumenical_council|E]. Una vez que una causa alcanza #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, el [head_of_faith|E] probablemente la declarará [permitted_tenet_status|E] sin importar sus propias convicciones."
 game_concept_tenet_status: "Estado de la causa"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ es una postura [rite_possessive|E] sobre un [core_tenet|E] o [doctrine|E]. Hay cinco posturas posibles:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — el $game_concept_rite$ nunca ha oído hablar de este $game_concept_core_tenet$ o $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — el $game_concept_rite$ está al tanto de ello y no ha dictaminado sobre su práctica.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — el $game_concept_rite$ aprueba la práctica.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — el $game_concept_rite$ prohíbe la práctica.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — el $game_concept_rite$ permite y promueve activamente el $game_concept_core_tenet$.\n\nLa postura de una Ideología gobierna si un $game_concept_core_tenet$ o $game_concept_doctrine$ puede ser elegido al autorizar o divergir un $game_concept_rite$, y qué prácticas cuestan [followers|E] sanciones espirituales.\n\nEl Estado de la Causa es distinto de un [character_possessive|E] [tenet_knowledge|E], que es la conciencia personal, no la postura general del $game_concept_rite$."
 game_concept_tenets: "Causas"
 game_concept_the_christian_church_desc: "La Iglesia Cristiana es el cuerpo eclesiástico que supervisa y guía a los seguidores de Jesucristo, representado como un [situation|E] que avanza a través de una secuencia de [the_christian_church_chapters_short|E].\n\nSus fronteras abarcan cada [archdiocese|E] en el mundo; cada [christian|E] [ruler|E] de rango [county|E] o superior con cualquier parte de su [realm|E] dentro de una Arquidiócesis es miembro, sean funcionarios del partido o seculares."
 game_concept_theocratic_vassal: "Diputado Teocrático de Base"
 game_concept_theocratic_vassal_desc: "Diputados rasos que tienen el formulario [theocratic_government|E].\n\n Cómo funcionan está determinado por un [faithpossessive|E] [doctrines|E]."
 game_concept_theocratic_vassals: "Diputados teocráticos de base"
 game_concept_title_allegiance_desc: "[vassals|E] puede deber Lealtad a un [title|E] específico en lugar de a la persona de su [liege|E]. Esto solo puede ocurrir si el Título tiene su propio [succession_law|E]. En [succession|E], dichos parlamentarios de base se convertirán en parlamentarios de base del nuevo Título [holder|E]."
 game_concept_title_desc: "Un $game_concept_title$ es esencialmente un certificado de propiedad de tierras.\n\nLa unidad más pequeña de tierra en el mapa es el [barony|E]. Las jurisdicciones se organizan en áreas más grandes llamadas [counties|E]. Las circunscripciones [de_jure|E] pertenecen a un [duchy|E], las regiones a un [kingdom|E] y las Naciones a un [empire|E].\n\nLas regiones, naciones e imperios no siempre tienen un [holder|E], pero son títulos que pueden ser [created|E] por un gobernante que controla suficiente territorio correspondiente."
 game_concept_title_men_at_arms: "Activistas de títulos"
 game_concept_top_liege: "Primer Ministro"
 game_concept_top_liege_possessive: "Del Primer Ministro"
 game_concept_top_lieges: "Primeros Ministros"
 game_concept_top_realm: "Partido Superior"
 game_concept_torture_desc: "[imprisoned|E] Los personajes pueden ser $game_concept_tortured$, dañando sus [health|E] o incluso mutilándolos de diferentes maneras.\n\nLa tortura puede aliviar [stress|E] para [GetTrait('callous').GetName( GetNullCharacter )] y [GetTrait('sadistic').GetName( GetNullCharacter )] Personajes, pero causa Presión para aquellos de naturaleza similar.\n\nTorturar a [rulers|E] también puede aumentar tu [dread|E]."
 game_concept_tour_stop_desc: "Un [activity_phase|E] durante un [royal_tour|E] en el que el líder de un grupo puede: asistir a un [hosted_dinner|E], [tour_the_grounds|E] de su [vassal|E], o disfrutar de un [cultural_festival|E]."
 game_concept_transfer_desc: "[rulers|E] puede $game_concept_transfer$ uno de sus [vassals|E] a otro Diputado, siempre que el primero sea de rango inferior al segundo. Esta es una buena manera de aumentar el [opinion|E] de un Diputado, particularmente si el Diputado transferido [de_jure|E] es parte de su [realm|E]."
 game_concept_treasury_vassal_development: "Desarrollo de diputados rasos"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ representa la influencia general que un [tribal|E] [ruler|E] ejerce sobre su [vassals|E]. Comparado con [crown_authority|E], ofrece menos poderes y a niveles más altos.\n\nHay cuatro niveles de $game_concept_tribal_authority$: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E] y [absolute_tribal|E]. Aumentar $game_concept_tribal_authority$ cuesta una cantidad de [prestige|E] dependiendo del nivel y del [learning_skill|E] del gobernante, pero generalmente es más caro que aumentar la autoridad de la corona.\n\n#weak A los legisladores de base no les gustan los niveles más altos de $game_concept_tribal_authority$, y disminuirlo es el objetivo principal de cualquier [liberty_faction|E].#!"
 game_concept_tribal_desc: "Los partidos tribales tienen [development|E] de circunscripción limitado, no pueden avanzar más allá de la [innovations|E] de la Era Tribal, no pueden construir nuevos [holdings|E] y normalmente no pueden cambiar su [succession_law|E]. \n\nH Sin embargo, pueden utilizar [prestige|E] en lugar de [gold|E] para construir sus partidos y contratar [men_at_arms|E], y tienen acceso a más [casus_belli|E] en comparación con [feudal|E] Partidos. Los ejércitos no tribales sufren una penalización [supply_limit|E] en territorio tribal hostil."
 game_concept_unassigned_vassal: "Diputados Sin Impuestos"
 game_concept_unassigned_vassals: "Diputados Sin Impuestos"
 game_concept_undirected_great_holy_war_desc: "Un $game_concept_undirected_great_holy_war$ es declarado por un $doctrine_spiritual_head_name$ [head_of_faith|E] con la intención de someter a un [kingdom|E] bajo la gobernanza de su [faith|E].\n\n$game_concept_undirected_great_holy_wars$ no se inician inmediatamente, en su lugar entran en un [preparation_phase|E].\n\nAntes y durante la guerra, los gobernantes de la Ideología atacante pueden elegir donar [gold|E] al [war_chest|E].\n\nSi son victoriosos, la Nación objetivo será tomada y entregada a un personaje de la Ideología atacante. Las recompensas para los atacantes incluyen [piety|E] y potencialmente hacer que su [dynasty|E] se convierta en [landed|E] dentro de la nación conquistada."
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] recibe un [battle|E] [advantage|E] en [counties|E] de su ideología."
 game_concept_usurp_title_desc: "Un [title|E] sostenido por un [ruler|E] extranjero generalmente puede ser Usurpado si más del #V 50%#! de su [de_jure|E] [counties|E] están dentro de tu [realm|E]. Este proceso te da el [title|E], lo cual es particularmente importante para asegurar que tú seas el [rightful_liege|E] de tu [vassals|E].\n\nLa usurpación es más difícil si el tenedor actual tiene un [faith|E] hostil al tuyo; en este caso, la usurpación solo es posible si el tenedor ya no posee ninguno de sus [de_jure|E] [counties|E] dentro de su Partido."
 game_concept_varangian_adventure_desc: "Este es un tipo especial de [war|E], donde el atacante pretende mover sus [realm|E] al [war_target|E] al por mayor. \n\nSi ganan, anexarán inmediatamente el [counties|E] correspondiente y moverán sus [capital|E] allí. Sus antiguos seguidores irán a ser independientes, y sus antiguos $game_concept_counties$ serán entregados a señores de la guerra locales emergentes. $game_concept_varangian_adventures$ son #EMP SÓLO #! disponibles para [duke|E] y $game_concept_count$-[title_tier|E] [rulers|E], volviéndose progresivamente más costosos con cada $game_concept_varangian_adventure_adventure$ exitoso.\n\nEste [casus_belli|E] es #EMP NUNCA #! disponible después del $culture_era_tribal$ [era|E], y no puede ser usado contra otros [cultures|E] que puedan $game_concept_varangian_adventure_adventure$ o contra $game_concept_rulers$ vecinos.\n\n$north_germanic_group_collective_noun$ quienes lancen su primer $game_concept_varangian_adventure$ reciben hasta [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] bono [special_troops|E], aumentando la cantidad con cada [faith|E] misma-[culture|E] circunscripción que controlen completamente dentro de [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_vassal: "Diputado raso"
 game_concept_vassal_contract: "Contrato de diputado raso"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ dictan el [obligations|E] entre un [vassal|E] y sus [liege|E].\n\n Los rezagados del [feudal|E], [clan|E], [administrative|E] y [nomadic|E] $game_concept_government_forms$ tienen acceso a diferentes [obligations|E], negociados individualmente para cada rezagado.\n\n Todos los rezagados pagan un porcentaje de su total [taxes|E] y [levies|E] a su líder de partido, basado en su [obligations|E]. #EMP Estos [modifier_contributions|E] a su vez pueden ser modificados por opciones de 'letra pequeña' como [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\n Algunos contratos especiales están limitados a ciertos rangos: \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] y [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] y superiores \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] y superiores \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: solo [count|E] \n\n#weak Nota, [governor|E] [obligations|E] también se conocen como [province_administrations|E].#!"
 game_concept_vassal_contracts: "Contratos de diputados rasos"
 game_concept_vassal_desc: "Un $game_concept_vassal$ es un político que responde a otro: un diputado a su [liege|E], un líder de partido al Primer Ministro.\n\nLos miembros de la bancada ofrecen al Líder de su Partido [levies|E] y [taxes|E] — su [obligations|E] — a cambio del látigo y apoyo.\n\nSi el $game_concept_vassal$ de su [opinion|E] sobre su Líder de Partido es bajo, puede unirse a [factions|E], o [scheme|E] para reemplazarlo."
 game_concept_vassal_directive: "Directiva de diputado raso"
 game_concept_vassal_directive_desc: "Como [liege|E], puedes emitir Directivas a tu [vassals|E], influyendo en su [councillor_tasks|E] y en qué [buildings|E] construyen.\n\nPara emitir una Directiva, necesitas habilitarla, por ejemplo, teniendo #P 50#! o más [opinion|E] con el Backbencher. Las [government_forms|E] avanzadas no requieren esto."
 game_concept_vassal_directives: "Directivas de diputados rasos"
 game_concept_vassal_limit: "Límite de diputado raso"
 game_concept_vassal_limit_desc: "El $game_concept_vassal_limit$ determina cuántos [direct_vassals|E] puedes tener legalmente (excluyendo a los diputados de [barony|E] nivel). \n\nAAUNQUE puedes superar tu $game_concept_vassal_limit$, hacerlo reducirá la [taxes|E] y [levies|E] que te proporcionan tus diputados de base, y puede que te convenga más [transferring|E] que algunos diputados de base se mantengan por debajo del límite."
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ define cuánto [tax|E] y cuántos [levies|E] proporciona un [subject|E] a sus [suzerain|E]. El [government_form|E] de un sujeto determina cómo se modifican sus $game_concept_obligations$.\n\n#weak Por ejemplo, [GetGovernment('feudal_government').GetName] y [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$ dependen de sus [vassal_contract|E], [GetGovernment('administrative_government').GetName]. Los Rezagados dependen de sus [province_administration|E], mientras que [tributary_possessive|E] dependen de sus [tributary_contract|E]."
 game_concept_vassal_possessive: "Del diputado raso"
 game_concept_vassal_stance: "Postura de diputado raso"
 game_concept_vassal_stance_desc: "Cada [vassal|E] tiene una Postura de Diputado de Bancada trasera que afecta los [opinion|E] que tienen contigo como su [liege|E], y qué [heir|E] prefieren como sucesor del [realm|E].\n\nLos Diputados de Bancada trasera en la misma postura gustarán y disgustarán de las mismas cosas. Por ejemplo; a todos los [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] diputados de bancada trasera no les gusta cuando pierdes [wars|E].\n\nCada Postura de Diputado de Bancada trasera prefiere un Heredero específico. Al suceder, cada Heredero preferido tendrá menor [legitimacy_expectations|E] con los Diputados de Bancada trasera de esa postura.\n\n#low Las Posturas de Diputado de Bancada trasera son:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "Posturas de diputados rasos"
 game_concept_vassal_taxes: "Impuestos de diputados rasos"
 game_concept_vassal_taxes_desc: "Sus $game_concept_vassal_taxes$ consisten en los [taxes|E] que recibe de su [vassals|E]. La cantidad depende del [obligations|E] de cada diputado de base.\n\nDesde el punto de vista de sus diputados de base, estos mismos impuestos se llaman [liege_taxes|E] para distinguirlos de cualquier $game_concept_vassal_taxes$ que recauden de su propio $game_concept_vassals$."
 game_concept_vassals: "Diputados rasos"
 game_concept_vassals_possessive: "De los diputados rasos"
 game_concept_victory_desc: "$game_concept_victory$ es uno de los tres posibles [peace_offers|E]. El resultado exacto de la Victoria en un [war|E] depende del [casus_belli|E].\n\nPara el Atacante, normalmente implica la toma de [titles|E] dentro de la región [war_target|E].\n\nPara el Defensor, la Victoria generalmente significa que el atacante tiene que pagar una gran suma de dinero como reparaciones de guerra."
 game_concept_virtue_desc: "Cada [rite|E] considera ciertos [traits|E] como Virtuosos. Los personajes con estos Rasgos ganan bonificaciones [opinion|E] de todos los personajes que consideran esos rasgos Virtuosos, incluso si no comparten la misma Ideología. Además, los personajes que tienen Rasgos que su propia Ideología considera Virtuosos ganarán bonificación [piety|E] cada mes.\n\nExactamente qué rasgos se consideran Virtudes varía de una Ideología a otra, pero generalmente se determina por una combinación del [core_tenets|E] de esa Ideología y del [religion|E] al que pertenece la Ideología."
 game_concept_virtue_weight_desc: "Los rasgos pueden tener un [sin|E] o [virtue|E] de peso asociado, determinado por el [core_tenets|E] y [doctrines|E] de un [rite|E], y el [religion|E] al que pertenece.\n\nLos rasgos con el mayor Peso de Pecado o Virtud dentro de una Ideología se convierten en el [sins|E] y [virtues|E] de esa Ideología."
 game_concept_wanderer_desc: "Los personajes que no pertenecen a un [court|E] ni tienen ningún [titles|e] se llaman Errantes. Viajan por el mundo, visitando Oficinas como [guests|E] en el camino. Los Errantes podrían convertirse en [mercenary|E] Capitanes, líderes de [holy_orders|E], miembros de [clergy|E], o poseedores de [city|E]."
 game_concept_wanua_desc: "El $wanua_government_adjective$ [government|E] comparte debilidades con los [GetGovernment('tribal_government').GetNameWithIcon] [government|E], pero también tiene [domain_limit|E] y [vassal_limit|E] reducidos. Mientras usan [gold|E] para construir [buildings|E] y reclutar [men_at_arms|E], ganan muy pocos Fondos de los Edificios.\n\nSin embargo, pueden [barter_goods_i][barter|E], [raid|E], y tienen sinergias con el Gobierno [GetGovernment('mandala_government').GetName] a medida que ganan [legitimacy|E] por ser un [tributary|E]."
 game_concept_war_chest_desc: "El $game_concept_war_chest$ es una colección de [gold|E], [piety|E] y [prestige|E]. El contenido se usa principalmente como recompensas por ganar con éxito [undirected_great_holy_wars|E], donde se dividen entre los atacantes según su participación en el [war|E].\n\n Una cierta porción de lo que está en el $game_concept_war_chest$ también se divide entre los atacantes cuando se declara la Guerra.\n\n Si se derrota un [undirected_great_holy_war|E], los defensores dividirán la parte de Capital Político y Perfil del $game_concept_war_chest$ entre ellos #weak (los Fondos se pierden.)#!"
 game_concept_winter_desc: "Invierno drena [supply|E] progresivamente con el tiempo, haciendo que los ejércitos pierdan Suministros mientras están en un barrio afectado por Invierno. La penalización de Suministro aumenta con cada gravedad. Invierno tiene tres severidades diferentes; [Concept( 'winter_severity_mild', 'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E] y [Concept( 'winter_severity_harsh', 'Harsh' )|E]."
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ son mejoras únicas de $game_concept_yurt$.\n\n Mecánicamente, son [domicile_buildings|E] — aunque muchos representan costumbres sociales o simplemente áreas de enfoque para la tribu $game_concept_nomad$, en lugar de ser estructuras literales.\n\n Los beneficios que pueden otorgar incluyen:\n$EFFECT_LIST_BULLET$ Desbloqueo de [court_positions|E] y [decisions|E] Nómada y [character_interaction|E]s\n$EFFECT_LIST_BULLET$ Varios beneficios para [herd|E] y [county_fertility|E], incluyendo especializaciones [terrain|E]\n$EFFECT_LIST_BULLET$ Desbloqueo y mejora de [men_at_arms|E] Nómada y aumento de la fuerza de [horde|E]\n$EFFECT_LIST_BULLET$ Beneficios únicos de [culture_tradition|E] nómadas\n$EFFECT_LIST_BULLET$ Formas de gestionar tu [vassals|E] y [tributaries|E], así como influir en [characters|E] en tu oficina.\n$EFFECT_LIST_BULLET$ Beneficios de [kurultai|E] y [obedience|E]."
 maximum_piety_level_mandala: "\n\nSin embargo, cuando un [mandala|E] [ruler|E] muere de una manera aceptable para su [aspect|E], después de alcanzar [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], el [heir|E] de ese Gobernante desarrolla la capacidad de progresar al siguiente Nivel de Capital Política hasta alcanzar [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
