l_spanish:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "¡Finalmente! [faction_target.GetName] no es más que un bufón actuando un [faction_target.GetTitleAsNameNoTooltip], y estoy seguro de que el partido apoyará mi causa. Aquellos que me ayuden no serán olvidados."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] ocupa un trono que de hecho debería ser tuyo! Estoy dispuesto a apoyar tu reclamación con palabra y espada, y estoy seguro de que otros en el partido también defenderán esta causa legítima. Todo lo que necesitas hacer es aceptar."
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "¡Finalmente! [faction_target.GetName] no es más que un bufón actuando un [faction_target.GetTitleAsNameNoTooltip], y estoy seguro de que el partido apoyará mi causa. Aquellos que me ayuden no serán olvidados."
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] ocupa un trono que de hecho debería ser tuyo! Estoy dispuesto a apoyar tu reclamación con palabra y espada, y estoy seguro de que otros en el partido también defenderán esta causa legítima. Todo lo que necesitas hacer es aceptar."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "¡Finalmente! [faction_target.GetName] no es más que un bufón actuando como [faction_target.GetTitleAsNameNoTooltip], y estoy seguro de que el partido se unirá a mi causa.\n\nDebido a mi estatus humilde actual, no puedo ayudarte. ¡Pero guarda esto en mente – #emphasis cuando#! seas victorioso, te veré recompensado generosamente!"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "Aunque me alegra ver al partido levantarse contra el falso [faction_target.GetTitledFirstName], mi situación actual me impide unirme a ustedes en esta justa empresa. Si tienen éxito, les estaré en deuda."
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Me queda claro que preferirías ver arder el partido antes que renunciar a esta empresa absurda. Por el bien del partido debo aceptar tus demandas, pero debes saber que hoy se ha cometido una gran injusticia. ¡Esto no permanecerá así!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "Me queda claro que verías al partido arder antes de renunciar a esta empresa tonta. Por el bien del [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] debo aceptar tus demandas, pero sabe que aquí se cometió una gran injusticia hoy. ¡Esto no se quedará así!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSus demandas equivocadas solo servirán para debilitarnos a todos. Sin embargo, para salvar al partido de un derramamiento de sangre inútil, me veo obligado a aceptar su solicitud de independencia."
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Me queda claro que verías al partido arder antes de renunciar a esta empresa tonta. Por el bien de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] debo aceptar tus demandas, pero sabe que aquí se cometió una gran injusticia hoy. ¡Esto no se quedará así!"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nLos leales súbditos del partido han soportado sus políticas erróneas por demasiado tiempo. El [faction.GetName] le exige que acepte una nueva dirección para [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ¡o nosotros se la impondrimos!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "¡Ha llegado el momento! Todos los que apoyan la abolición de las políticas equivocadas de [faction_target.GetTitledFirstNamePossessive] ahora se unirán como uno solo y se asegurarán de que el partido sea dirigido en una nueva dirección. ¡Lo veremos hecho, por espada y fuego si es necesario!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSus demandas equivocadas solo servirán para debilitarnos a todos. Sin embargo, para salvar al partido de un derramamiento de sangre inútil, me veo obligado a aceptar su solicitud de independencia."
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSus egoístas nociones de 'libertad' debilitarán al Partido en su conjunto. Sin embargo, para evitar derramamiento de sangre innecesario, aceptaré sus demandas."
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n ¡Es hora de que reconozcas los derechos antiguos e inalienables de tus diputados de retaguardia! ¡Acepta las demandas del [faction.GetName] o enfrenta nuestras espadas en el campo de batalla!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "¡Está bien! Mi partido no tiene lugar para tus rebaños sucios."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Ya no toleraremos tu vil opresión del orgulloso [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Nacidos para vagar libres bajo estos cielos abiertos, rechazamos tu tiranía — ¡nuestro momento ha llegado!\n\n¡Arrojaremos tu gobierno y el de tu líder de partido, [faction_target.GetTitledFirstName], de una vez por todas!!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "No permitiremos más opresión de tu regla [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)]. ¡[peasant_leader.GetRite.GetName|U] debe ser reconocida como la [rite|E] predominante del [ROOT.Char.GetPrimaryTitle.GetName]!\n\nDa a nuestra ideología el estatus legítimo que merece, ¡o prepárate para enfrentar la ira de nuestros muchos fieles!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "No toleraremos más tu vil opresión de los buenos [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. ¡Nuestro momento ha llegado!\n\nNos liberaremos de tu gobierno y de la tiranía de tu líder de partido, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "No toleraremos más la opresión extranjera de las tradiciones [peasant_leader.GetCulture.GetName]. ¡Nuestro momento ha llegado!\n\n¡No exigiremos menos que la libertad total de tu líder de partido, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "No toleraremos más tu vil opresión de los fieles [peasant_leader.GetFaith.GetAdherentNamePlural]. ¡Nuestro momento ha llegado!\n\nCon [peasant_leader.GetFaith.WarGodName] guiándonos, nos levantaremos y nos liberaremos del gobierno de tu líder de partido, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N ¡Perderás una parte de tu partido si tu líder entrega a sus demandas!#!"
