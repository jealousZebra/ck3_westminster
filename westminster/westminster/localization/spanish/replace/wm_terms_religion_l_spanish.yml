 unreformed_faith_doctrine_desc: "Una Ideología No Reformada carece de funcionarios de partido organizados y de posiciones de política canónica establecidas; diferentes comunidades pueden nominalmente seguir la misma ideología mientras tienen prácticas y creencias religiosas muy diferentes."
