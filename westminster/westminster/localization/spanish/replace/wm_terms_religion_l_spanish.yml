 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal: "¿Puede #P revocar títulos de tierras#! de $hostility_hostile_tooltippable$ y de los oponentes de $hostility_evil_tooltippable$ sin incurrir en [tyranny|E]?"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy: "#N Peligro aumentado#! por grupos disidentes cuando haya bajo [fervor|E]"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance: "Circunscripciones de otros [faiths|E] #P menos propensas #! a unirse [factions|E]"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals: "Ganar un [holy_war|E] vasallizará a los [rulers|E] oponentes en la zona objetivo en lugar de apoderarse de sus tierras"
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty: "Velocidad de conversión de circunscripción: #N -20%#!"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy: "#P Peligro reducido#! de grupos disidentes cuando es bajo [fervor|E]"
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced: "¿Puede #P revocar títulos de tierras#! de los oponentes de $hostility_evil_tooltippable$ sin incurrir en [tyranny|E]?"
 doctrine_parameter_spiritual_head_of_faith: "La posición de [head_of_faith|E] se otorga a un miembro prominente del partido."
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "Si la Ideología tiene [great_holy_wars|E], se permite que el Líder del Movimiento dirija la guerra y elija quién será el objetivo de la guerra."
 doctrine_pilgrimage_encouraged_desc: "Esta ideología anima a sus miembros a visitar lugares terrenales considerados de importancia espiritual como manera de demostrar reverencia por [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_forbidden_desc: "La presencia de [ROOT.Faith.HighGodName] puede sentirse en todas partes y la noción de que ciertos lugares son más divinos que otros no es más que fragmentación."
 doctrine_pilgrimage_local_rites_desc: "Los seguidores de esta ideología prefieren la comodidad y estabilidad de las ideologías rutinarias en los santuarios locales frente a los riesgos y el esfuerzo de largas peregrinaciones."
 doctrine_pilgrimage_local_rites_name: "Ideologías locales"
 doctrine_pluralism_fundamentalist_desc: "Nuestra ideología es la verdadera ideología, nuestra palabra la verdadera palabra. Cualquier desviación del [ROOT.Faith.ReligiousText] es inherentemente blasfema."
 doctrine_sacraments_absent_desc: "Esta tradición no enfatiza los sacramentos ni un sistema formal de ideologías sagradas. La vida religiosa no se centra en la administración ritual por parte de los funcionarios del partido ni en la importancia de ceremonias específicas."
 doctrine_sacraments_general_desc: "La ideología da una importancia central a los sacramentos y a las ideologías sagradas. Los rituales no son meramente simbólicos sino que invocan la presencia de lo divino. Los funcionarios del partido los administran y los fieles pueden ser excomulgados."
 doctrine_spiritual_head_desc: "El mundo físico y el mundo espiritual no son iguales. Debemos asegurarnos de que el mundo espiritual tenga su propio líder, para guiarnos y proteger nuestra ideología de ser profanada por deseos físicos."
 doctrine_status_mainline: "Posición Política Principal"
 doctrine_status_rite: "Posición de Política Ideológica"
 doctrine_status_rite_mainline: "Posición Política Principal"
 doctrine_temporal_head_desc: "Lo espiritual y lo físico están intrínsecamente ligados, completos e inseparables. Es una tontería tener dos líderes diferentes para un mismo partido."
 doctrine_theocracy_lay_clergy_desc: "Cualquier seguidor devoto es más que capaz de entender, seguir y predicar las posiciones políticas de nuestra ideología."
 doctrine_theocracy_lay_clergy_name: "Oficiales del partido laicos"
 doctrine_theocracy_temporal_desc: "Solo [ROOT.Faith.PriestNeuterPlural] sancionados pueden ser encargados de defender las posiciones políticas de nuestra ideología y, por extensión, de gestionar y cuidar nuestros lugares sagrados."
