 prophecy_of_malachi_desc: "Bajo la posición de política judía tradicional, un nuevo Sumo Sacerdote solo puede ser nombrado con la llegada del Profeta o si se encuentra un descendiente de Aarón apto para servir como sacerdote."
 sinitic_hostility_doctrine_desc: "Los siguientes campos políticos son sìnicos:\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_doctrine_ecumenical_miaphysite_desc: "A pesar de sus jerarquías separadas, las iglesias miafisitas permanecen en plena comunión, reconociendo los sacramentos y los funcionarios del partido de las demás."
 special_doctrine_full_tolerance_desc: "Todos son libres de elegir su propia ideología. Nuestras diferencias no nos dividen, nos hacen más fuertes."
 special_doctrine_is_christian_faith_desc: "Hay quienes en el mundo se adhieren a las enseñanzas de Jesús sin reconocer su divinidad. Aunque sea blasfemo, deberíamos mostrar compasión a estas almas desorientadas, ya que algún día podrían convertirse en conversos a la verdadera ideología."
 special_doctrine_is_eastern_faith_desc: "Juntos estamos unidos no por una sola ideología, sino por las muchas ideologías que conforman el tejido religioso de nuestra sociedad. Aunque podamos llamarnos con diferentes nombres y seguir diferentes caminos, algunos de fuera de nuestro propio sistema de creencias han aprendido a coexistir en nuestra sociedad como si fueran uno de nosotros."
 special_doctrine_not_allowed_to_hof_desc: "El Sumo Sacerdocio de esta ideología ha sido completamente desmantelado. Cualquier intento de nombrar un Sumo Sacerdote requeriría primero una reconstrucción completa de la estructura tradicional de la iglesia."
