 doctrine_clerical_function_recruitment_desc: "Nuestro [ROOT.Faith.PriestNeuterPlural] puede tomar las armas y defender nuestra ideología. La responsabilidad de liderar como ejemplo les otorga fuerza extra en el combate."
 doctrine_clerical_function_recruitment_descriptive_name: "Funciones Militares para los Funcionarios del Partido"
 doctrine_clerical_function_taxation_descriptive_name: "Funciones de control para los funcionarios del partido"
 doctrine_clerical_gender_either_descriptive_name: "Géneros Sin Restricciones para Funcionarios del Partido"
 doctrine_clerical_gender_female_only_desc: "Solo las mujeres son lo suficientemente sabias para interpretar [ROOT.Faith.HighGodNamePossessive] voluntad y servir como [ROOT.Faith.PriestFemalePlural] de nuestra ideología."
 doctrine_clerical_gender_female_only_descriptive_name: "Funcionarios del Partido restringido a mujeres"
 doctrine_clerical_gender_male_only_desc: "Solo los hombres pueden asumir la gran responsabilidad de servir como [ROOT.Faith.PriestMalePlural] de nuestra ideología."
 doctrine_clerical_gender_male_only_descriptive_name: "Funcionarios del Partido Restringidos a Hombres"
 doctrine_clerical_succession_conditional_desc: "El derecho a reemplazar a los titulares de cargos clericales queda sin resolver. Tal arreglo disputado inevitablemente dirige la ideología hacia un [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] son, en última instancia, servidores del partido, y por eso deberían poder ser contratados y despedidos por su líder de partido con solo pequeñas restricciones."
 doctrine_deviancy_virtuous_desc: "Los placeres de la carne nos acercan a lo divino, y por lo tanto aquellos que están liberados de deseos convencionales son la cima de la virtud en nuestra ideología."
 doctrine_family_rites_descriptive_name: "Ideologías de Sepultura Familiar"
 doctrine_family_rites_name: "Ideologías Familiares"
 doctrine_head_of_faith_name: "Líder del movimiento"
 doctrine_monasticism_accepted_desc: "La vida monástica está permitida pero no es central para la ideología. Los devotos pueden hacer votos y retirarse a casas religiosas, sin embargo, la tradición no enfatiza el monacato como el camino ideal."
 doctrine_monasticism_forbidden_desc: "Esta ideología rechaza explícitamente la vida monástica. Tomar los votos está prohibido, y aquellos que poseen el rasgo monástico son considerados criminales a los ojos de la ideología."
 doctrine_mythic_literary_desc: "La ideología se difunde y persiste a través de historias de obras divinas, muchas de las cuales se recopilan en obras literarias."
 doctrine_no_head_descriptive_name: "Sin líder del movimiento"
 doctrine_parameter_block_from_create_hof_parameter: "Esta ideología no puede recrear su [head_of_faith|E] en circunstancias normales."
 doctrine_parameter_clerical_appointment_head_of_faith: "[realm_priests|E] o [court_chaplains|E] serán seleccionados entre los funcionarios del partido y asignados a [rulers|E] según sea necesario"
 doctrine_parameter_divorce_approval: "Los personajes pueden [divorce|E] su [spouse|E] si su [head_of_faith|E] Espiritual lo aprueba (o [house_head|E] si no existe un Líder de Movimiento Espiritual)"
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "Los [faiths|E] no orientales que apoyan la $tenet_eastern_syncretism_name$ causa se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_evil_tooltippable$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "No sinítico [faiths|E] con la causa $tenet_sinitic_syncretism_name$ son considerados [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_evil_tooltippable$"
 doctrine_parameter_minimum_fervor: "La convicción no puede bajar de #V $VALUE|0$%#!"
