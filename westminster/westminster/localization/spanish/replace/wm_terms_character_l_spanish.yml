 council_interaction.0001.desc.accept: "Comenzaré a trabajar para cumplir con mis nuevas responsabilidades de inmediato y te veré en la próxima reunión del gabinete."
 county_capital_province_modifier: "Capital de la circunscripción"
 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "Debemos haber estado debatiendo las leyes del aseo y la apariencia apropiada durante horas, gesticulando violentamente el uno al otro de un lado a otro, citando leyes antiguas que pocos en la oficina parecían conocer. A medida que el humo del espectáculo se despejaba,"
 court_amenities_interactions.0002.desc_lost: "¡Estoy sorprendido de descubrir que en realidad estoy violando la ley!\n\n Me encuentro avergonzado mientras los guardias y estilistas del castillo [debate_locale.GetNameNoTierNoTooltip] me despojan hasta quedarme en ropa interior y luego continúan desnudándome! Expuesto a la oficina, huyo de la escena con mi orgullo entre mis piernas."
 court_amenities_interactions.0002.desc_won: "parece que gané. \n\n Por eso, [recipient.GetName] obligó a desnudarse hasta quedar [recipient.GetHerHis] ropa interior. Todos los presentes en la oficina [recipient.GetHerHim] vieron exactamente como [ROOT.Char.GetFaith.CreatorName] creado [recipient.GetHerHim]!"
 court_amenities_interactions.0003.desc_won: "parece que gané. \n\n Por eso, [actor.GetName] obligó a desnudarse hasta quedar [actor.GetHerHis] ropa interior. Todos los presentes en la oficina [actor.GetHerHim] vieron exactamente como [ROOT.Char.GetFaith.CreatorName] creado [actor.GetHerHim]!"
