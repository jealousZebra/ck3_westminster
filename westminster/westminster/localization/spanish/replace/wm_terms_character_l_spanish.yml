 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U] no ha estado defendiendo bien los valores de nuestra ideología, y los [puppet_or_actor.GetFaith.GetAdherentNamePlural] en [target.GetNameNoTier] sufren por ello. ¿Me darías tu bendición para liberar esas tierras del gobierno equivocado de [secondary_recipient.GetHerHis]?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "Aunque el celo sea envidiable, también debemos ser pragmáticos si queremos que nuestra ideología sea triunfal. ¿No sería más sensato hacer de [target.GetNameNoTier] el objetivo de nuestra guerra santa?"
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "He visto el error de mis caminos y, habiendo arrepentido de mis malas acciones, te suplico que levantes mi excomunión para que pueda reunirme de nuevo con mis hermanos y hermanas de la ideología."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "\nIntento ser un buen [puppet_or_actor.GetFaith.GetAdherentName], pero no soy más perfecto que cualquier otro [actor.GetWomanMan]. Para compensar mis tropiezos y fallas, deseo donar esta suma de fondos a la Iglesia.\n\nAdemás, juraré abstenerme de todo pecado."
 RETRACT_VASSAL_PROPOSAL: "He llegado a la conclusión de que, para el bien mayor de [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip], [recipient.GetFullName] debe ser colocado como diputado raso bajo mi autoridad directa."
