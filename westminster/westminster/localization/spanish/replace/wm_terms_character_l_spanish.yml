 backwater_county_modifier_desc: "Cuanto más grandes son, más duro caen. Esta circunscripción, antaño territorio de implacables gobernantes de Hellas, tristemente ha caído en la ignominia. Aunque actualmente es una sombra de lo que fue, esta circunscripción bien podría volver a la grandeza una vez más.\n\n#X @warning_icon! Este modificador puede ser eliminado usando el [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] una vez que [development|E] de este [county|E] sea #V 50#! o más!#!\n\n"
