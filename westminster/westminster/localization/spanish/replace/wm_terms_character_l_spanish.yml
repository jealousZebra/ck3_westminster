 char_interaction.0001.desc: "Acepto su amable oferta de vasallaje. ¡Mi líder de partido!"
 char_interaction.0002.desc: "No necesito su protección y prefiero conservar la recompensa de mi Partido para mí mismo."
 char_interaction.0010.a: "¡Mi líder del partido!"
 char_interaction.0090.from_ward.desc: "Temo que mi educación en su oficina ya no satisfaga mis necesidades. Regresaré a [capital.GetNameNoTierNoTooltip] inmediatamente."
 char_interaction.0090.one_ward.desc: "Temo que la educación de [ward.GetTitledFirstName] en su oficina ya no satisfaga nuestras necesidades. [ward.GetSheHe|U] es por la presente recordado a nuestro cuidado."
 char_interaction.0090.two_wards.desc: "Temo que la educación de [ward.GetTitledFirstName] y [ward_2.GetTitledFirstName] en su oficina ya no satisfaga nuestras necesidades. Por la presente se les recuerda a nuestro cuidado."
 char_interaction.0180.desc: "Como jefe de su Cámara, he decidido que deben abrazar [puppet_or_actor.GetFaith.GetName], la única verdadera Ideología. Me temo que no tienen elección en este asunto."
 char_interaction.0180.desc.liege: "Como líder de su partido, exijo que abandonen su ideología falsa y se unan a mí como compañeros [puppet_or_actor.GetFaith.GetAdherentName], de inmediato."
 char_interaction.0181.desc: "Muy bien, abrazaré la Ideología [puppet_or_actor.GetFaith.GetAdjective] aunque se sentirá extraño abandonar tanto de lo que es familiar."
 char_interaction.0182.desc: "Nunca abandonaré mi Ideología y, en cambio, ¡fundaré mi propia Casa!"
 char_interaction.0190.desc: "Muy bien, abrazaré la Ideología [puppet_or_actor.GetFaith.GetAdjective] aunque se sentirá extraño abandonar tanto de lo que es familiar."
 char_interaction.0191.desc: "Mi ideología está en el núcleo de mi ser — nunca la abandonaré."
 char_interaction.0200.desc: "He llegado a la conclusión de que no se te puede confiar la dignidad y responsabilidad del [landed_title.GetName]. Por lo tanto, a partir de ahora te despojo de este título por el bien mayor del Partido."
 char_interaction.0211.desc: "Realmente aprecio su generosa oferta de hacer de [secondary_recipient.GetShortUIName] mi diputado de base, pero temo que debo rechazarla."
 char_interaction.0220.desc: "Acepto su retractación de mi diputado de base, [secondary_recipient.GetShortUIName], aunque creo que es injusta."
 char_interaction.0221.desc: "No puedo traicionar el juramento de fidelidad de [secondary_recipient.GetShortUIName]. Protegeré a mi diputado de base, incluso si eso significa romper el juramento que tengo hacia usted."
 char_interaction.0232.liege: "No permaneceré de brazos cruzados mientras nuestro líder del partido abusa de los leales diputados de base de [actor.GetHerHis]. Te insto a que te unas a mí en la lucha para destronar a este tirano."
 char_interaction.0232.regent: "No permaneceré de brazos cruzados mientras [actor.GetSheHe] abusa de los leales diputados de base de [ceremonial_liege.GetTitledFirstNamePossessive]. Te insto a que te unas a mí en la lucha para destronar a este tirano."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nHe sido un buen parlamentario para ti, ¡pero seguramente entiendes que yo también tengo sujetos propios!\n\nMi contrato actual es muy restrictivo, ¿seguramente verías la sabiduría de hacerlo más flexible?\n\nY, además, ¡me debes #emphasis!#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nEn reconocimiento a nuestras ofrendas y respeto a [recipient.GetPrimaryTitle.GetNameNoTooltip], te pido que honres esa devoción concediendo [SCOPE.Custom('CelestialTributaryRequest')].\n\nQue este favor refuerce la armonía entre tu trono y nuestro humilde partido."
 char_interaction.0271.desc: "Por la autoridad del cargo que me ha sido otorgado por [intermediary.GetTitledFirstName], estoy corrigiendo algunas inconsistencias triviales en las fronteras del partido.\n\n Se le ordena entregar la vasallaje de [intermediary.GetTitledFirstName] al legítimo líder del partido [intermediary.GetHerHis]. Yo."
 char_interaction.0272.desc: "Excedes los límites de tu autoridad, pero no puedo resistirme al cargo de mi [intermediary.GetTitleAsName], incluso cuando solo seas #EMP tú#! ejerciéndolo.\n\nAcepto tu retractación de mi diputado trasero."
 char_interaction.0273.desc: "Juré un juramento de proteger a mis diputados de base, e eso incluye de las depredaciones de individuos como #EMP tú#!.\n\nPuedes arrebatarme las tierras de [intermediary.GetTitledFirstName] y [intermediary.GetHerHis] en batalla o puedes regresar corriendo a cualquier agujero abandonado por [recipient.GetFaith.random_GoodGodNames] en el que te escondas."
 char_interaction.0282.desc: "A diferencia de mis acciones, tus demandas son criminales.\n\nPor el bien del partido, cumpliré, pero sabe que no olvidaré este desaire."
 char_interaction.0291.a: "Estoy seguro de que mi líder de partido sabe lo que es mejor."
 char_interaction.0291.desc.negative: "¿No puedes hacer #EMP nada#! bien? El más lento simple de la tierra podría ver que [recipient.GetTitledFirstName] no es en lo que deberías enfocarte. Deja de intimidar a los mejores diputados de fila trasera y haz tu trabajo."
 char_interaction.0370.a.herder: "Debería haber mantenido unido a mi partido."
 church_authority_0: "Funcionarios del partido autónomos"
 church_authority_0_effects_not_in_prev: "#weak Los diputados administrativos de base proporcionan [levies|E] y [taxes|E], pero mantienen una amplia autonomía. #!"
 church_authority_2_effects: "$EFFECT_LIST_BULLET$Los gobernantes pueden establecer un teocrático [dynasty|E]\n$EFFECT_LIST_BULLET$[vassals|E] no puede hacer [war|E] contra otros parlamentarios a menos que usen un [hook|E] en su [liege|E]\n$EFFECT_LIST_BULLET$Los [titles|E] de los parlamentarios no pueden ser heredados por personajes fuera del [realm|E]\n$EFFECT_LIST_BULLET$Todos los parlamentarios que se nieguen a la revocación del título o a la retracción del parlamentario se consideran [criminals|E]\n$EFFECT_LIST_BULLET$A [christian|E] [head_of_faith|E] puede usar el [GetDecision('enact_a_bull_decision').GetName] [decision|E] para declarar un [great_holy_war|E]\n$EFFECT_LIST_BULLET$Puede usar el [GetDecision('pam_establish_theocratic_dynasty_decision').GetName] [decision|E]\n$EFFECT_LIST_BULLET$[subordinates|E] y el [rulers|E] secular son más fáciles de [puppet|E]"
