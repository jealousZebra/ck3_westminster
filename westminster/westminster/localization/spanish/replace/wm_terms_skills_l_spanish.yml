 efg_contested_wrath_desc: "Usar nuestros organizadores para proselitizar nuestro mandato imperial contra un emperador rival alimenta a nuestros guerreros y gana el respeto de las masas."
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] ordenó personalmente mi nombramiento inmediato mediante un decreto imperial. Nadie puede desafiar el mandato de mi nuevo estatus en el [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip] las fuerzas no fueron rival para mis armas superiores, demostrando mi mayor mandato como defensor de la provincia en nombre del [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_decisions_event.0007.desc: "Y con eso, los [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] han sido apaciguados una vez más. Mi poder y el mandato de mi autoridad han sido reafirmados.\n\n"
 ep3_decisions_event.9010.desc: "Inhalo profundamente, y exhalo mientras lanzo mi caña al agua. El anzuelo cae con un suave 'plop' y el mundo se queda en silencio. \n\nMi vista se desplaza a lo largo de la orilla, teniendo un momento a solas para procesar mis pensamientos. La vida como aventurero no es tan mala, pero ninguna vida está sin presión. Cierro los ojos por un momento para descansar cuando de repente alguien tira de la caña fuera de mis manos."
