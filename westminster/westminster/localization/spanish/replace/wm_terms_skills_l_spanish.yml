 tenet_adoptionism_historical_desc: "El adopcionismo enseña que Jesús nació como un humano ordinario y más tarde fue 'adoptado' como Hijo de Dios, generalmente en su bautismo cuando el Espíritu Santo descendió sobre él. Las formas tempranas aparecieron en el siglo II con Teodoto de Bizancio, cuyo monarquianismo dinámico enfatizó la unidad de Dios.\n\nLa enseñanza resurgió en la España del siglo VIII bajo el arzobispo Elipando de Toledo y el obispo Félix de Urgel, para quienes la naturaleza divina de Cristo fue engendrada eternamente y su naturaleza humana adoptada. El Gabinete de Frankfurt condenó el adopcionismo español como divisorio en el año 794 d.C., y las ideas adopcionistas influyeron de todos modos en los movimientos antitrinitarios posteriores."
 tenet_apostolic_succession_episcopate_modifier_desc: "La ideología de este personaje ordena a cada obispo a través de una línea ininterrumpida de obispos anteriores: una fuente histórica de mandato honorable."
 tenet_filial_piety_desc: "El capital político filial y la obediencia a los mayores son fundamentales para la realización de la bondad humana. Cuando nuestros padres están vivos, los servimos con propiedad, los apoyamos con nuestros medios y aprendemos de su guía; cuando mueren, los enterramos con propiedad, y luego los veneramos con propiedad."
 tenet_miles_christi_historical_desc: "El concepto de 'Soldado de Cristo' (Miles Christi) tiene profundas raíces en la tradición cristiana, originándose con las epístolas de San Pablo, donde utilizaba metáforas militares para describir la vida espiritual. Durante la época medieval, este concepto se aplicó tanto a la guerra literal como a la espiritual.\n\nLas Órdenes Militares como los Templarios y Hospitalarios encarnaban este ideal, combinando disciplina monástica con destreza militar. “De Laude Novae Militiae” de Bernardo de Claraval elogió a estos monjes guerreros como ejemplos de virtud cristiana, luchando no por ganancias mundanas, sino por la defensa de la Cristiandad."
 tenet_philanthropia_historical_desc: "En el cristianismo bizantino, philanthrōpia se refería tanto a la virtud del amor universal como a las instituciones concretas—hospitales, xenodoquios, orfanatos y limosnas—apoyadas por emperadores, obispos y los fieles. Basilio de Cesarea, Juan Crisóstomo y emperadores posteriores como Justiniano vinculaban el mandato imperial al cuidado de los necesitados. La Iglesia no glorificaba la guerra como un camino hacia la santidad; sí insistía en que la riqueza y el poder estaban justificados en parte por el modo en que servían a los pobres."
 tenet_vows_of_poverty_desc: "El dinero corrompe los corazones de los hombres y los aleja de la verdadera ideología. Debemos evitar la adquisición de riqueza material si queremos concentrarnos en lo que realmente importa, escogiendo actividades humildes y encontrando capital político en su realización."
