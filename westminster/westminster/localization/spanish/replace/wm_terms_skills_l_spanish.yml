 court_brahmin_court_position_desc: "Un venerable sacerdote que se encuentra tanto en las cortes hindúes como budistas, el Brahmán del Oficio es responsable de realizar rituales, supervisar ceremonias y promover el mandato del gobernante."
 court_diplomatic_desc: "#low Carisma es clave para ganarse el respeto de nuestros compañeros y mantener la paz del partido. Un diputado satisfecho es un diputado leal. \n\nStaff adquiere los rasgos [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )]. #!"
