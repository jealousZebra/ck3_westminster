 laamp_base_4021_contract_scheme: "Crear Obra de Política"
 laamp_base_contract_schemes.0011.desc: "No es un secreto que la reputación de [employer.GetTitledFirstNamePossessive] no es todo lo que podría ser. Parlamentarios descontentos, murmullos preocupantes sobre comportamiento tiránico, una escasez de perfil intangible, todos signos que pueden señalar un control más débil del poder de lo que la mayoría de [employer.Custom('LadiesLords')] quisiera.\n\nPagarle a alguien para aclarar tales malentendidos no saldrá barato, por supuesto. Al menos, no si tengo algo que decir al respecto."
 laamp_base_contract_schemes.0331.d.tt.success: "La política es su propia recompensa"
 laamp_base_contract_schemes.4042.desc: "¡Nuestro tiempo en el [employer.GetCapitalLocation.GetTitle.GetName] es inmensamente rentable! Comerciar con [employer.GetTitledFirstNamePossessive] sello tácito de aprobación otorga un mandato a nuestro stock que todo el hablar rápido del mundo no podría lograr.\n\nTalismanes, medicinas, baratijas y cachivaches: el personal y los invitados los compran todos, sin hacer preguntas.\n\nAl menos, todavía no. Ya nos habremos ido mucho antes de que comiencen a surgir sus preocupaciones."
 laamp_boost_legitimacy_contract_contract: "Promoción de Mandato"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] gobernó de manera justa y piadosa, con [Localize( god )] como guía [ROOT.Legend.GetProtagonist.GetHerHis]. Cumplido el plan divino, [ROOT.Legend.GetProtagonist.GetSheHe] vivió una vida de gran honor y capital político."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] había trabajado incansablemente por todo [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] y luchado contra los esbirros de [ROOT.Legend.GetProtagonist.GetFaith.DevilName] aquí en la Tierra, pero al fin los [ROOT.Legend.GetProtagonist.GetHerHis] luchas llegaron a su fin. Plan divino cumplido, [ROOT.Legend.GetProtagonist.GetSheHe] vivió una vida de gran honor y capital político."
 legend_shibi_chakravarti_desc: "Un modelo de humildad y capital político, el heroico Rey Shibi fue encargado de proteger al sabio Agni que había sido transformado en un pájaro. Cuando un milano exigió que sacrificara su propia carne para salvar a la paloma, Shibi dio completamente de sí mismo voluntariamente, pero fue perdonado y recompensado con su hijo Kapotaroma. Es la sangre de este rey desinteresado la que corre por las venas de cada [GetDynastyByID('1043008').GetNameNoTooltip]."
 legendary_conversion_desc: "Un relato legendario de capital político y devoción ha capturado los corazones de todos en el partido. Con un poco de estímulo, los no creyentes del partido podrían ser alentados a adorar de la manera que yo lo hago."
 legendary_holy_war_desc: "Mi legendaria historia de capital político ha llegado a su fin, y aunque es elogiada por los creyentes, ha hecho poco para influir en los corazones de los no creyentes. Debemos continuar difundiendo nuestras formas pacíficas de la única manera que sabemos: con la espada."
 legendary_integration_d_desc: "Se cuentan leyendas en todo el partido que consolidan la autoridad de mi mandato. Este mandato recién descubierto podría aprovecharse para expandir lo que se considera el territorio central de mi partido y exigir lealtad perpetua de un duque históricamente extranjero."
