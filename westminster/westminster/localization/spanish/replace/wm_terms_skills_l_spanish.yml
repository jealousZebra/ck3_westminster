 investiture_crisis_desc: "Corona y báculo se enfrentan cara a cara sobre quién posee las llaves de los graneros de Dios; los patrones seculares invisten a los prelados con bastón y anillo mientras la Iglesia se niega a reconocer su mandato."
 keeper_of_the_harem_attend_to_wellness.tt: "El $keeper_of_the_harem_court_position$ buscará y cuidará a un miembro enfermo del harén cada mes, aliviando su presión y los síntomas que lo aquejan."
 kharijite_desc: "Un grupo islámico temprano creía que el liderazgo debía basarse en el capital político, no en el linaje, y que los gobernantes pecadores podían ser removidos. Surgieron durante los levantamientos chiíes, rechazaron ambos bandos y declararon pecadores graves fuera del Islam."
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "Este [modifier|E] puede ser retirado por el [adventurer|E] encargado de resolverlo mediante diplomacia, intriga o controles de resistencia."
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier_desc: "Este [modifier|E] puede ser retirado por el [adventurer|E] encargado de resolverlo mediante diplomacia, aprendizaje, o controles de resistencia."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc: "Este [modifier|E] puede ser eliminado por el [adventurer|E] encargado de resolverlo mediante comprobaciones de diplomacia, marcial o resistencia."
