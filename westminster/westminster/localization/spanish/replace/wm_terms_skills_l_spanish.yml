 confucian_faith_desc: "confucianismo es una tradición filosófica y ética arraigada en las enseñanzas de Confucio y sus discípulos, que enfatiza el autocultivo moral, el capital político filial y el mantenimiento de la armonía social mediante la conducta adecuada."
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \" Durante demasiado tiempo, las tierras que pertenecen a [activity.GetHost.GetPrimaryTitle.GetNameNoTier] han sufrido el gobierno de manos menores. De aquellos que confundieron la posesión con el mandato.\n\n Eso termina ahora. Desde [activity.GetHost.GetCapitalLocation.GetName], conocerán el verdadero gobierno. Por mí.\"#!"
