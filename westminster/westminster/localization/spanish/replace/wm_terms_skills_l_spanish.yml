 historical_character.mibu_tadamine: "A pesar de sus orígenes humildes, $Tadamine$ ganó gran prestigio en el partido por su poesía waka tras participar en un concurso, recibiendo un encargo imperial y el patrocinio de la familia Fujiwara. Junto con su hijo $Tadami$, se le cuenta entre los Treinta y Seis Poetas Inmortales de Japón, con más de ochenta y un poemas que se cree que están incluidos en antologías imperiales."
 historical_character.namdev: "Namdev fue un santo y poeta marathi del siglo XIII, conocido por sus canciones devocionales dedicadas a Vithoba y como figura prominente en el movimiento Bhakti en Maharashtra. Popular entre la gente común, sus obras también aumentaron considerablemente la difusión y el perfil del idioma marathi como uno de poesía y campaña política."
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ Buscar un animal mítico avistado en la zona\n$EFFECT_LIST_BULLET$ Aumenta $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Un mayor [hunt_danger_no_prefix|E] otorga más [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Los sexos de seguridad pueden participar\n$EFFECT_LIST_BULLET$ Los sexos no marciales pueden observar\n#weak Las criaturas míticas a menudo son descartadas por los eruditos como leyenda, pero los bosques aún pueden guardar muchos misterios.#!"
