 chariot_race.0200.h.flavor: "¿No está asegurada la victoria contra [foe.GetPrimaryTitle.GetNameNoTooltip], si puedo estar aquí celebrando festines ociosos? ¡Regocijémonos en el inminente perfil del triunfo!"
 christian_saint_bone_description: "Los supuestos restos de un santo de [saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip], adquiridos por [saint_bone_owner.GetNameNoTooltip] mientras realizaba la peregrinación [saint_bone_owner.GetHerHis] a [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip], y venerados como símbolo de suerte y capital político por [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip]."
