 ep3_governor_yearly.3040.desc: "he empezado a tener dificultades para recordar — ¿fue [emperor.GetPrimaryTitle.GetName] verdadera pura oscuridad y desorden antes de que los nobles [emperor.GetTitledFirstName] empuñaran [emperor.GetHerHis] cetro? \n\nD¿Los socialités sueñan con cualquier cosa que no sea compartir [emperor.GetHouse.GetName] compañía? ¿Nuestros soldados coreaban el nombre feo y confuso de algún extraño? Nuestros magnates — ¿se dignaban a besar pies que no estaban hechos de la carne perfecta de [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip]? \n\nI no hace falta que lo recuerden, en realidad. Cuestionar así el mandato infalible de mi soberano sería inútil."
 ep3_governor_yearly.8070.desc: "Honores, perfil, poder. Ser un [ROOT.Char.GetTitleAsNameNoTooltip] puede otorgar estas cosas, pero hay#EMP costes#!...\n\nMontañas de [ROOT.Char.Custom('GetWritingMaterial')] se sientan enrolladas, esperando mi sello o revisión, mientras burocratas sin fin compiten por su turno para llenar mis oídos con detalles aturdidores.\n\nNadie me dijo que habría tanto #EMP trabajo#! — y trabajo que, en última instancia, parece hacerse solo."
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "Durante décadas he caminado siguiendo los pasos de los intelectuales y me he enfrentado a la ira de los hombres. Mi poesía ha crecido inexorablemente en la marca del partido, y sin embargo...\n\nAlgo falta. Ahora que mis años crepusculares se acercan, tal vez sea hora de dejar [cordoba.GetName] y darme una amplia visión del mundo?\n\nOtra parte inextricable de mí aún tira de mi corazón para quedarme. He construido una vida aquí no solo para mí, sino también para los muchos aprendices que han sido formados aquí a lo largo de los años.\n\nYa sea por los eruditos que recorren sus calles o la pátina familiar de sus paredes, #EMP algo#! me mantiene atado a esta ciudad, mi hogar."
