 iberia_north_africa.0111.desc: "Han pasado años construyendo la unidad política y espiritual necesaria para reunir este concilio, pero finalmente he traído suficientes tanto del campesinado como de los funcionarios del partido a mis banderas para repudiar de manera significativa al falso-[pope.GetTitledFirstName].\n\nIncluso ahora, los pasillos y habitaciones de invitados de [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] se llenan de clérigos argumentativos y obispos apasionados; cada fraile agraviado y pequeño [religious_leader.GetFaith.PriestNeuter] que Roma alguna vez ha desdeñado obstruyendo mis salones.\n\nTodo este debate es crucial para el mandato, pero en última instancia, como el gobernante predominante [religious_leader.GetFaith.GetAdjective], #EMP mi#! palabra será el voto decisivo final."
 iberia_north_africa.0112.desc.righteous: "retrocediendo lo que [religious_leader.GetSheHe] ve como la violencia pecaminosa que ha infectado a gran parte de [religious_leader.GetFaith.GetReligion.GetName]. \n\nArde-[religious_leader.GetHerHim], [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] debería centrarse en el capital político de simplemente vivir una buena vida en lugar de intentar allanar el camino hacia [religious_leader.GetFaith.PositiveAfterLife] con la sangre de sus opositores."
