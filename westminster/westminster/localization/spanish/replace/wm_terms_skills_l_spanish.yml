 ce1_completed_my_legitimizing_legend_desc: "Probé mi mandato contando mi conexión legendaria con las grandes figuras del pasado."
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "demostraste tu mandato contando tu legendaria conexión con las grandes figuras del pasado"
 ce1_completed_my_legitimizing_legend_desc_third_perspective: "[owner.GetTitledFirstName] demostró el mandato de [owner.GetHerHis] contando la conexión legendaria de [owner.GetHerHis] con las grandes figuras del pasado"
