 tradition_chivalry_desc: "Esta cultura ha adoptado la caballería y los códigos caballerescos como un método social de regulación del comportamiento. La destreza en seguridad, el deber, el honor y la moralidad son valorados, al igual que la mala poesía y la literatura romántica."
