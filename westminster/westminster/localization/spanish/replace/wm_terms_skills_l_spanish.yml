 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ Elige una presa entre una variedad de animales locales\n$EFFECT_LIST_BULLET$ Aumenta $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Más [hunt_danger_no_prefix|E] otorga más [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Los sexos de seguridad pueden participar activamente\n$EFFECT_LIST_BULLET$ Los sexos no marciales pueden ser espectadores\n#weak Bestias orgullosas y astutas acechan la naturaleza; Superar y superar a ellos pone a prueba el valor y perfecciona las habilidades. #!"
