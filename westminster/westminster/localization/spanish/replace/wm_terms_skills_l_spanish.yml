 dlc_015_desc: "Trae nuevo contenido a varios sistemas queridos: viajes, actividades y estilos de vida. Envía a tu gobernante en emocionantes viajes, ya sea en busca de riqueza, prestigio o crecimiento personal. No los dejes quedarse inactivos: ¡la aventura espera en cada esquina!"
 doctrine_imperial_anointment_desc: "Para gobernar como Emperador más allá de toda duda, hay que arrodillarse — pues solo la máxima autoridad de su iglesia puede otorgar ese mandato final e incuestionable."
