 game_rule.1101.desc.combat.locale.southwark: "Con la ciudad más rica de Inglaterra tan cerca, hay todo por lo que luchar. Ya sean casas o botín, gloria o capital político, ambos ejércitos se enfrentan una y otra vez.\n\nLa orilla sur del Támesis espuma y se agita con nuestra sangre, pero no me rendiré, no#EMP cederé#!.\n\nInglaterra ya es mía, esta batalla lo demostrará, y todo lo que se requiere es un último #EMP empujón#! para demostrar que—"
 generic_rite_focus_tenet_cranial_trophies: "Esta ideología trata los restos de los enemigos como prueba sagrada de triunfo y perfil aterrador."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] trata los restos de los enemigos como prueba sagrada de triunfo y perfil aterrador."
 glory_hound_desc: "$glory_hound$ [vassals|E] preocuparse por el estatus y el perfil, y mostrar al mundo la fuerza del partido al que pertenecen. Los parlamentarios de base audaces o sin compasión a menudo adoptan este [vassal_stance|E].\n\n#low $glory_hound$ A los parlamentarios de base les gusta cuando su líder de partido:#!\n$EFFECT_LIST_BULLET$Tiene alguna Partición [succession_law|E]\n$EFFECT_LIST_BULLET$Achieve [victory|E] en ofensiva [wars|E]\n$EFFECT_LIST_BULLET$Los invita a [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ A los parlamentarios de base no les gusta cuando su líder de partido:#!\n$EFFECT_LIST_BULLET$Tiene alto [crown_authority|E]\n$EFFECT_LIST_BULLET$Firma [defeat|E] o [white_peace|E] en Guerras\n$EFFECT_LIST_BULLET$[marries|E] un personaje [lowborn|E] como [primary_spouse|E]\n\nPrefieren [heirs|E] audaces y valientes con un alto [martial_i][martial|E] habilidad."
 grand_ambitions.0180.desc: "Estoy ante el [hof.GetTitleAsName], el líder espiritual de mi pueblo. El aire está cargado de incienso y del peso de los siglos.\n\nAsegurar el favor de [hof.GetHerHis] no solo otorgaría mandato a mi reclamo sobre [target_title.GetName], sino que podría mover los corazones de los fieles en todo el imperio. [hof.GetSheHe|U] debe coronarme.\n\nEl [hof.GetTitleAsNameNoTooltip] no es una mera figura espiritual; [hof.GetSheHe] es profundamente consciente de las maquinaciones temporales de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]."
