 mongol_invasion.1004.desc: "Con la muerte del poderoso [old_mongol_emperor.GetFirstName] — maestro de todas las tierras subyugadas por los mongoles — varios sucesores claman por tomar [old_mongol_emperor.GetHerHis] lugar como Gran Kan. Ninguno reconocerá el mandato de los otros.\n\nAsí que este es el fin de los mongoles como un imperio unificado.\n\nEstos descendientes del primer gran conquistador aún se aferran a cierta fuerza. Llaman a la guerra. Pero ninguno de ellos, ni [successor_1.GetName], ni [successor_2.GetName], se sitúa por encima del resto como gobernante de todo el universo."
