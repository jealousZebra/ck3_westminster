 tradition_tgp_fortified_strongholds_desc: "Esta cultura se caracteriza por grandes ciudades fortificadas que cumplen funciones religiosas, militares y gubernamentales. La protección de esos bastiones culturales es crítica y la fundación de otras ciudades es un asunto de gran relevancia."
 tradition_tgp_warrior_monks_desc: "La lealtad a vivir moralmente no debe excluir el uso de la fuerza, especialmente cuando hay necesidad de proteger a la comunidad religiosa de sectas rivales y funcionarios corruptos, o de defender a los necesitados."
