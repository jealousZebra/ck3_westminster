 pam_interactions_events.0034.desc_method_legitimacy: "Una amenaza grave contra mi mandato. Una fea disputa pública sobre [target.GetNameNoTierNoTooltip], un escándalo que nos hace el hazmerreír a ambos..."
 pam_interactions_events.0034.desc_method_piety: "La amenaza de que mi relación ya precaria con la ideología caiga en ruina total. Esto también perjudicaría a [actor.GetTitledFirstNameNoTooltip], pero el capital político de [actor.GetHerHis] está mejor establecido que el mío."
