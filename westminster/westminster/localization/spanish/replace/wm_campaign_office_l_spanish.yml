 game_concept_adventurer: "Campañista"
 game_concept_adventurer_camp: "Oficina de campaña"
 game_concept_adventurer_camps: "Oficinas de campaña"
 game_concept_adventurer_desc: "A $game_concept_adventurer$ is a politician without a seat: an activist, a candidate or a former MP, leading a [camp|E].

They have no constituency and no income of their own: they take [task_contracts|E] from their party's MPs to earn money, profile and Party Standing, and call in favours from their [contact_list|E].

A $game_concept_adventurer$ can move their office anywhere. The goal is a seat: get on the approved list, win a selection, then win the election."
 game_concept_adventurer_possessive: "Del campañista"
 game_concept_adventurer_siege_replenishment_desc: "Cuando un [adventurer|E] exitosamente [sieges|E] un [holding|E], una porción de su [men_at_arms|E] será restaurada.\n\nTodos los Activistas [regiments|E] en el [army|E] serán restaurados por #V x2#! veces el valor de [loot|E] de la Tenencia.\n\n#weak El aumento se compone de nuevos reclutas, el reclutamiento forzado de locales, y simplemente pagando a aquellos que se habían ido durante el asedio.#!"
 game_concept_adventurers: "Campañistas"
 game_concept_adventurers_possessive: "De los campañistas"
 game_concept_camp: "Oficina de campaña"
 game_concept_camp_building: "Instalación de oficina"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$ are improvements to a [camp|E]: rooms, equipment, people and habits.

Mechanically, they are [domicile_buildings|E]. They can:
$EFFECT_LIST_BULLET$ Unlock new [officers|E]
$EFFECT_LIST_BULLET$ Give bonuses to the campaigner and the team
$EFFECT_LIST_BULLET$ Improve [task_contract|E] rewards"
 game_concept_camp_buildings: "Instalaciones de oficina"
 game_concept_camp_desc: "A $game_concept_camp$ is a campaigner's base: a rented room, a shopfront or a regional headquarters, its staff and volunteers, and the battle bus that takes it from town to town.

Every [GetGovernment( 'landless_adventurer_government' ).GetName] has a $game_concept_camp$ [domicile|E] that moves across the map with them.

[camp_buildings|E] can be added, which give the $game_concept_camp$ and its campaigner lasting bonuses."
 game_concept_camp_purpose: "Enfoque Político"
 game_concept_camp_purpose_desc: "A $game_concept_camp_purpose$ is what a campaigner is known for: the kind of politician they are becoming.

It decides which [task_contracts|E] their party offers them most, gives a bonus of its own, and unlocks some [camp_buildings|E]. A $game_concept_camp_purpose_purpose$ can be changed, but changing from one to another costs [prestige|E]; a Party Activist may pick any for free."
 game_concept_camp_purpose_purpose: "Enfoque"
 game_concept_camp_purpose_purposes: "Enfoques"
 game_concept_camp_purposes: "Enfoques Políticos"
 game_concept_camp_temperament: "Moral del equipo"
 game_concept_camps: "Oficinas de campaña"
 game_concept_contract_scheme: "Esquema de trabajo"
 game_concept_contract_scheme_contract: "Trabajo"
 game_concept_contract_scheme_possessive: "Del esquema de trabajo"
 game_concept_contract_schemes: "Esquemas de trabajo"
 game_concept_contract_schemes_possessive: "De los esquemas de trabajo"
 game_concept_contractor: "Empleador"
 game_concept_contractor_desc: "El $game_concept_contractor$ es el Diputado o líder del partido que ofrece un [task_contract|E]. Ellos pagan por ello y recuerdan qué tan bien se hizo."
 game_concept_contractor_possessive: "Del empleador"
 game_concept_contractors: "Empleadores"
 game_concept_contractors_possessive: "De los empleadores"
 game_concept_domicile: "Base"
 game_concept_domicile_building: "Edificio Base"
 game_concept_domicile_buildings: "Edificios Base"
 game_concept_domiciles: "Bases"
 game_concept_follower: "Miembro del equipo"
 game_concept_follower_desc: "A $game_concept_follower$ is a volunteer or staffer who works for a [adventurer|E] without a seat.

Mechanically, they are like [courtiers|E], but they owe less and leave sooner if they dislike their boss.

The collective [opinion|E] of the $game_concept_followers$ sets the [camp_temperament|E]."
 game_concept_followers: "Miembros del equipo"
 game_concept_officer: "Miembro del Personal Senior"
 game_concept_officer_desc: "$game_concept_officers$ are the jobs [followers|E] can be given to run the [camp|E]: office manager, field director, treasurer and so on.

They work like [court_positions|E]: what they bring depends on the holder's [aptitude|E] for the job."
 game_concept_officers: "Personal Senior"
 game_concept_provision: "Fondo de Campaña"
 game_concept_provisions: "Fondos de Campaña"
 game_concept_provisions_desc: "$game_concept_provisions$ are the office's running budget: rent, fuel, print and food for the volunteers.

A [camp|E] spends $game_concept_provisions$ while it moves to a new [location|E]; how much depends on the size of the team, the distance and the [officers|E] it has.

Running out means unpaid bills and an unhappy team. Jobs done well, and some [camp_buildings|E], bring more in."
 game_concept_task_contract: "Trabajo"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ are work a [adventurer|E] does for the party's MPs: canvassing, fundraising, speechwriting, research, phone banks, policy papers and media rounds.

Each takes three weeks and is settled by a skill check. Doing it well earns [gold|E], [prestige|E], [provisions|E], Party Standing and the MP as a contact; doing it badly costs a little standing.

The party's candidate assessment is a $game_concept_task_contract$ too: pass it to join the approved candidates list."
 game_concept_task_contract_possessive: "Del trabajo"
 game_concept_task_contract_tier: "Grado de trabajo"
 game_concept_task_contracts: "Trabajos"
 game_concept_task_contracts_possessive: "Empleos"
 head_groom_camp_officer: "Responsable de Transporte"
 head_groom_camp_officer_desc: "El $head_groom_camp_officer$ cuida de los minibuses, las tarjetas de combustible y las multas de estacionamiento."
 head_porter_camp_officer: "Coordinador de Logística"
 head_porter_camp_officer_desc: "El $head_porter_camp_officer$ consigue la oficina, las cajas y la gente para llegar al siguiente pueblo enteros."
 heavy_cavalry_captain_camp_officer: "Capitán del Autobús de Batalla"
 heavy_cavalry_captain_camp_officer_desc: "El $heavy_cavalry_captain_camp_officer$ dirige los tours en autobús: grandes visitas, grandes multitudes, grandes fotos."
 heavy_infantry_captain_camp_officer: "Líder de equipo de puerta a puerta"
 heavy_infantry_captain_camp_officer_desc: "El $heavy_infantry_captain_camp_officer$ dirige las grandes sesiones de campaña del sábado."
 horse_archer_captain_camp_officer: "Liderazgo en la distribución de folletos"
 horse_archer_captain_camp_officer_desc: "El $horse_archer_captain_camp_officer$ organiza las rondas de entrega rápidas, calle por calle."
 huntperson_camp_officer: "Organizador de difusión"
 huntperson_camp_officer_desc: "El $huntperson_camp_officer$ planifica los días de salida: puestos callejeros, eventos comunitarios y visitas."
 huntperson_camp_officer_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] aumenta con [aptitude|E]\n$BULLET$ Mejora [martial|E] [education|E] resultados para todos [children|E] en tu [camp|E]\n$BULLET$ Puede ayudar en Reunir Fondos para Campaña [decisions|E]"
 kennelperson_camp_officer: "Coordinador de voluntarios"
 kennelperson_camp_officer_desc: "El $kennelperson_camp_officer$ mantiene a los voluntarios alimentados, agradecidos y orientados en la dirección correcta."
 landless_adventurer_government: "Campañista"
 landless_adventurer_government_adjective: "Campaña"
 landless_adventurer_government_realm: "Oficina de campaña"
 laureate_camp_officer: "Redactor"
 laureate_camp_officer_desc: "El $laureate_camp_officer$ escribe las líneas que la gente recuerda, y las que te citan de vuelta."
 light_cavalry_captain_camp_officer: "Líder de Respuesta Rápida"
 light_cavalry_captain_camp_officer_desc: "El $light_cavalry_captain_camp_officer$ consigue un equipo en cualquier parte de la zona en menos de una hora."
 light_infantry_captain_camp_officer: "Líder de puesto callejero"
 light_infantry_captain_camp_officer_desc: "El $light_infantry_captain_camp_officer$ dirige los puestos en la plaza del mercado y fuera de la estación."
 master_bard_camp_officer: "Creador de contenido"
 master_bard_camp_officer_desc: "El $master_bard_camp_officer$ convierte un día en la puerta de entrada en un video, un post y, de vez en cuando, en un momento viral."
 master_of_arms_camp_officer: "Director de Campo"
 master_of_arms_camp_officer_desc: "El $master_of_arms_camp_officer$ dirige los equipos de campaña: quién llama dónde, y cuándo."
 master_of_spoils_camp_officer: "Tesorero"
 master_of_spoils_camp_officer_desc: "El $master_of_spoils_camp_officer$ mantiene las cuentas, firma los cheques y presenta las declaraciones ante la Comisión Electoral."
 master_thief_camp_officer: "Investigador de la Oposición"
 master_thief_camp_officer_desc: "El $master_thief_camp_officer$ sabe lo que dijo el otro lado en 2011, y dónde fue escrito."
 mess_tent_01_domicile_building: "Cocina de oficina"
 mess_tent_01_domicile_building_desc: "Una urna de té, un refrigerador lleno de leche y el pastel de cumpleaños de alguien: la campaña avanza con el estómago."
 mess_tent_bakers_domicile_building: "Bollos de tocino"
 mess_tent_bakers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('mess_tent_01').GetName])#!\nSábado por la mañana, antes de la sesión en la puerta. Nadie lo pierde."
 mess_tent_brewers_domicile_building: "Máquina de café"
 mess_tent_brewers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('mess_tent_01').GetName])#!\nUna verdadera, con frijoles. La asistencia al recorrido de la mañana se duplica."
 mess_tent_cooks_domicile_building: "Cocineros voluntarios"
 mess_tent_cooks_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('mess_tent_01').GetName])#!\nMiembros que no pueden hacer campaña pero pueden alimentar a treinta personas con un presupuesto."
 mess_tent_curers_domicile_building: "Cocina por Lotes"
 mess_tent_curers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('mess_tent_01').GetName])#!\nUn congelador lleno de chile para las largas noches de la corta campaña."
 mess_tent_herbalists_domicile_building: "Bocadillos Saludables"
 mess_tent_herbalists_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('mess_tent_01').GetName])#!\nFruta además de galletas. Una pequeña revolución."
 person_haggler_camp_officer: "Corredor de Trato"
 person_haggler_camp_officer_desc: "El $person_haggler_camp_officer$ se encarga de los visitantes incómodos y saca las mejores condiciones de cada favor."
 pike_captain_camp_officer: "Líder del banco telefónico"
 pike_captain_camp_officer_desc: "El $pike_captain_camp_officer$ dirige los centros de llamadas nocturnos: guiones, listas y una línea constante de llamadas."
 proving_grounds_01_domicile_building: "Sala de Entrenamiento"
 proving_grounds_01_domicile_building_desc: "Guiones de puerta a puerta, juegos de rol y cómo responder la pregunta que no te hicieron."
 proving_grounds_bodyguard_drills_domicile_building: "Ejercicios de protección cercana"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUn candidato en público necesita a alguien observando a la multitud."
 proving_grounds_camel_run_domicile_building: "Rutas Rurales"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nPueblos, granjas y caminos sin nombres de calles: un plan de prospección para el campo."
 proving_grounds_elephantry_reserve_domicile_building: "Seguidores Famosos"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUn actor, un futbolista y un cocinero de televisión que aparecerán frente a las cámaras."
 proving_grounds_horse_run_domicile_building: "Campaña en bicicleta"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nBicicletas para las carreteras largas y los barrios a los que la furgoneta no puede llegar."
 proving_grounds_life_in_the_saddle_domicile_building: "Vida en la Carretera"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAlgunas personas solo cobran vida en una ciudad diferente cada día."
 proving_grounds_lockwagon_domicile_building: "Gato Compartido"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCada donación va a un solo fondo, y el fondo paga todo. Mayormente."
 proving_grounds_martial_study_domicile_building: "Estudios de Caso de Campaña"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCada elección se ha luchado antes. Lee cómo se ganó."
 proving_grounds_mock_battle_drills_domicile_building: "Días de Votación Simulados"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUn ensayo completo del día de la votación, desde la primera llamada hasta el cierre de la urna."
 proving_grounds_nightly_barding_drills_domicile_building: "Ejercicios del Autobús de Batalla"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCargar, conducir, descargar, hacer campaña, repetir, hasta que funcione como un reloj."
 proving_grounds_personal_bouts_domicile_building: "Práctica de Debate"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSimulacros de debates con un asistente interpretando a tu oponente más desagradable."
 proving_grounds_the_stick_game_domicile_building: "Concurso de oficina"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSobre el resultado, la participación y qué candidato llora primero."
 proving_grounds_the_stump_domicile_building: "La Tribuna"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nUna caja en la plaza del mercado y mucha práctica siendo abucheado."
 proving_grounds_training_circle_domicile_building: "Círculo de Juego de Roles"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('proving_grounds_01').GetName])#!\nVotante enfadado, votante preocupado, votante que quiere hablar sobre los cubos de basura: todos practican todo."
 quartermaster_camp_officer: "Gerente de oficina"
 quartermaster_camp_officer_desc: "El $quartermaster_camp_officer$ mantiene los fondos de campaña, el armario de papelería y la programación en orden."
 second_camp_officer: "Subdirector de Campaña"
 second_camp_officer_desc: "El $second_camp_officer$ dirige la oficina cuando el candidato está en la puerta y mantiene a todos los demás enfocados en sus tareas."
 stooge_camp_officer: "Pasante"
 stooge_camp_officer_desc: "El $stooge_camp_officer$ hace las fotocopias, la compra del café y todos los trabajos que nadie más quiere. La moral mejora, para los demás."
 supply_tent_01_domicile_building: "Sala de impresión"
 supply_tent_01_domicile_building_desc: "Folletos, carteles, sobres y la única impresora que todos maldicen. La campaña funciona en papel."
 supply_tent_arsenal_domicile_building: "Acumulación de folletos"
 supply_tent_arsenal_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!Boxes de todos los folletos que la campaña ha diseñado, listos para cualquier calle con una hora de aviso."
 supply_tent_climbing_gear_domicile_building: "Escaleras y bridas"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!Cada poste de luz en la circunscripción es un sitio para carteles si puedes alcanzarlo."
 supply_tent_mender_domicile_building: "Kit de segunda mano"
 supply_tent_mender_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!Portátiles donados y teléfonos reacondicionados: no son bonitos, pero funcionan."
 supply_tent_reserve_provisions_domicile_building: "Fondo de Reserva"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!Dinero apartado para los últimos quince días, cuando cada libra cuenta doble."
 supply_tent_reserve_water_domicile_building: "Flotador de Emergencia"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!A caja de galletas con caja pequeña para las cosas que nadie presupuestaba."
 supply_tent_smithy_domicile_building: "Impresora Interna"
 supply_tent_smithy_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!A prensa adecuada en la sala trasera: no más esperar una semana para las impresoras."
 supply_tent_subdued_gear_domicile_building: "Ropa de civil"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!Sin rosetas, sin cordones: algunos trabajos se hacen mejor sin los colores puestos."
 supply_tent_sutler_domicile_building: "Proveedores de Compra al por Mayor"
 supply_tent_sutler_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('supply_tent_01').GetName])#!A mayorista que ofrece un buen precio en A5 si pides amablemente y pagas a tiempo."
 witness_camp_officer: "Oficial de Endosos"
 witness_camp_officer_desc: "El $witness_camp_officer$ recopila cada carta de apoyo y se asegura de que todos se enteren de ellas."
