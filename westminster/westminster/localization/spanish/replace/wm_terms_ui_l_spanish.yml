 action_can_choose_dynasty_perk_desc: "Tienes suficientes [dynasty_prestige|E] para desbloquear un [dynasty_perk|E] para tu [dynasty|E].\n\n#help Como el [dynast|E] puedes gastar Marca de Partido en acciones sobre tus compañeros Miembros de la Dinastía, pero los Legados son bonificaciones a largo plazo para toda tu Dinastía.#!"
 action_can_claim_liege_title: "@titles_icon! Puede reclamar el Título de su Líder de Partido"
 action_can_claim_liege_title_desc: "Controlas la mayoría de los [counties|E] que están [de_jure|E] a uno de tus [liege_possessive|E] [titles|E]. ¡Esto significa que puedes gastar [prestige|E] para obtener un [unpressed_claim|E] en él!\n\n#help Tener una Reclamación No Presionada sobre un Título de mayor nivel te da la oportunidad de aumentar tu rango. Puedes usarla para iniciar un [claimant_faction|E] o simplemente declarar [war|E] directamente sobre tu Líder de Partido para ello.#!"
 action_can_claim_liege_title_label: "@titles_icon! Puede reclamar el Título de su Líder de Partido"
 action_can_create_head_of_faith_title_click: "#I Haz clic para ver Ideología#!"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help Al crear el título de líder del movimiento, ¡usted también se convierte en el [temporal_head_of_faith|E]!#!"
 action_can_demand_payment_desc: "Puede gastar el [hook|E] que tiene en [recipient.GetUIName] para exigir que le paguen [gold|E].\n\n[recipient.GetSheHe|U] actualmente tiene @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! de los Fondos que puede exigir.$action_can_demand_payment_HELP$"
 action_can_find_secrets_HELP: "\n\n#help Solo se muestran los miembros [vassals|E] que son los titulares de los 10 [title_tier|E] [titles|E] más altos, ya que son los objetivos más importantes, pero eres libre de apuntar a cualquier trasero de tu [liege|E].#!"
 action_can_make_clerical_puppet: "@theological_agent_puppet_icon! Sacerdote del Partido puede ser Manipulado"
 action_can_ransom_desc: "Puede rescatar a su [prisoner|E], [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUIName], por [gold|E].\n\n[recipient.GetSheHe|U] actualmente tiene @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! de los Fondos que puede exigir.$action_can_ransom_HELP$"
 action_can_request_preach_legitimacy: "@legitimacy_icon! Predicar Mandato"
 action_can_request_preach_legitimacy_combined_group_label: "@legitimacy_icon! Predicar Mandato"
 action_can_request_preach_legitimacy_help_desc: "\n\n#help El [legitimacy|E] de [rulers|E] depende de la aprobación de [actor.GetFaith.HighGodNamePossessive], y solo a través de los funcionarios del partido se puede conocer la aprobación de [actor.GetFaith.HighGodNamePossessive].#!"
 action_can_request_preach_legitimacy_label: "@legitimacy_icon!Tu mandato puede ser mejorado por [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip]"
 action_can_train_knights_contract: "Puede entrenar Organizadores para completar el Contrato"
 action_convert_at_war_interaction_click: "#I Haz clic para adoptar su ideología#!"
 action_convert_at_war_interaction_desc: "Puede convertirse al [faith|E] de [recipient.GetShortUIName] para poner fin a [recipient.GetHerHis] [holy_war|E] en su contra.\n\n#help Aunque terminar una Guerra que se está perdiendo es útil, tenga en cuenta que los miembros de su antigua Ideología perderán [opinion|E] de usted!#!"
 action_convert_at_war_interaction_label: "@religious_icon! Puede convertirse a la Ideología del atacante"
 action_county_in_dangerous_populist_faction: "@faction_icon! Circunscripción en el Movimiento Populista"
 action_county_in_dangerous_populist_faction_click: "#I Haz clic para ver la circunscripción#!"
 action_county_in_dangerous_populist_faction_combined_group_description: "Los campesinos en varias de sus circunscripciones se han unido en un [popular_faction|E] contra el líder de su partido.\n\n¡Aumente el [county_opinion|E] de estas circunscripciones, o arriesgará perderlas por completo cuando presenten sus demandas!"
 action_county_in_dangerous_populist_faction_combined_group_label: "@faction_icon! Circunscripciones en el movimiento populista"
 action_county_in_dangerous_populist_faction_desc: "[landed_title.GetNameNoTooltip] se ha unido a una [popular_faction|E] contra tu líder de partido.\n\nIncrementa el [county_opinion|E] de esta circunscripción, o arriesga perderla cuando la facción presente sus demandas!"
 action_county_in_dangerous_populist_faction_label: "@faction_icon! [landed_title.GetNameNoTooltip] en Movimiento Populista"
 action_empty_accolade_slot_click: "#I Haz clic para ver tus organizadores#!"
 action_empty_accolade_slot_unimportant: "@warning_icon! #X El Organizador también puede ser un Sucesor válido para un Reconocimiento existente"
 action_ep3_can_ask_hof_for_influence: "@influence_icon! Puede solicitar a su Líder de Movimiento Influencia"
 action_ghw_participation_alert_desc: "No ha donado ni [gold|E] ni prometido su [armies|E] para el próximo [actor.GetFaith.GHWName].\n\n#help Si no proporciona ni Fondos ni Soldados para el esfuerzo de guerra, su [head_of_faith|E] lo condenará y perderá [piety|E].#!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon! Puede conceder a Parlamentario de Base al Líder de Partido correspondiente"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] quienes no son el Líder del Partido Legítimo de te dan menos recursos y tienen una [opinion|E] reducida de ti. A veces es mejor otorgar estos Diputados de Retaguardia a su Líder de Partido Legítimo, presumiendo que ellos también son tu Diputado de Retaguardia.\n\n A veces, otorgar un Diputado de Retaguardia a su Líder de Partido Legítimo significa que ganas menos, pero generalmente vale la pena otorgárselos de todos modos: su Líder de Partido Legítimo tendrá una fuerte penalización de Opinión hacia ti por retener un Diputado de Retaguardia que consideran suyo.\n\n Mantener una buena estructura de diputados de retaguardia es la clave para un partido estable.#!"
 action_grant_vassal_to_rightful_liege_click: "#I Haz clic para conceder a un diputado de base#!"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! Puede conceder parlamentaristas de base al Líder de Partido correspondiente"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Los diputados de base pueden ser entregados a su Líder de Partido Legítimo"
 action_has_any_display_cb_on_HELP: "\n\n#help Si tu ejército y [allies|E] son más fuertes que los de tu enemigo, la guerra puede ser muy beneficiosa. Puedes tomar [titles|E], expandir tu [realm|E] y ganar [prestige_experience|E].\n\nSin embargo, las guerras son costosas, especialmente si tienes que admitir [defeat|E]. Los vecinos ambiciosos pueden aprovecharse de tu partido debilitado.#!"
 action_has_courtier_or_guest_with_inspiration_desc: "Uno de tus empleados o invitados tiene un [inspiration|E] y puede ser patrocinado para crear un [artifact|E]"
 action_has_courtier_or_guest_with_inspiration_label: "Uno de tus empleados o invitados tiene un [inspiration|E]"
 action_has_open_court_event: "Evento de la Oficina de Currículums"
 action_has_open_court_event_label: "Tienes un Evento de Oficina sin terminar."
 action_has_unopened_court_event: "Evento de oficina disponible"
 action_has_unopened_court_event_label: "Tienes un Nuevo Evento de Oficina."
 action_in_debt_desc: "Tiene menos de [gold_i|E]#V 0#! [gold|E] y, por lo tanto, está en [debt|E]!\n\nEstar en Deuda tiene los siguientes efectos:\n$BULLET_WITH_TAB$No puede Declarar [war|E]\n$BULLET_WITH_TAB$No puede reforzar [men_at_arms|E] que requieren [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] las propagaciones en su [domain|E]\n$BULLET_WITH_TAB$[vassals|E] tienen más probabilidades de unirse a [factions|E]\n\nCuanto más profunda es la Deuda en la que se encuentra, más severas serán las sanciones que enfrentará. Su nivel actual de Deuda tiene los siguientes efectos adicionales:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Si no está obteniendo Fondos cada mes, considere reducir sus gastos, por ejemplo mediante:\n$BULLET_WITH_TAB$Disolviendo su [armies|E]\n$BULLET_WITH_TAB$Reduciendo el Tamaño de — o destruyendo — su [men_at_arms|E]\n$BULLET_WITH_TAB$Aumentando [control|E] usando su [marshal|E]\n$BULLET_WITH_TAB$Revocando [court_positions|E]#!"
 action_in_debt_landless_desc: "Tiene menos de [gold_i|E]#V 0#! [gold|E] y, por lo tanto, está en [debt|E]!\n\nEstar en Deuda tiene los siguientes efectos:\n$BULLET_WITH_TAB$No puede Declarar [war|E]\n$BULLET_WITH_TAB$No puede reforzar [men_at_arms|E] usando [gold_i|E][gold|E]\n\nCuanto más profunda es la Deuda en la que se encuentra, más severas serán las sanciones que enfrentará. Su nivel actual de Deuda tiene los siguientes efectos adicionales:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Considere tomar un [task_contract|E] para obtener algunos fondos#!"
 action_landless_admin_escape_to_realm: "Escapar a Otro Partido"
 action_landless_admin_escape_to_realm_desc: "Eres un [noble_family|E] sin tierra [title|E] [holder|E] bajo un [liege|E] con un [government|E] diferente\n\n#help Puedes pedir a otros [independent_rulers|E] con tu [government|E] que se conviertan en tu nuevo líder del partido y mover tu [domicile|E] a su [capital|E]#!"
 action_legal_meddling: "Adquirir Reclamaciones dentro del Partido del Líder de Partido como [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_combined_group_label: "@unpressed_claim! Puede forjar reclamaciones dentro del partido de su líder de partido como [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_label: "@unpressed_claim! Puede reclamar distritos mantenidos por su [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, como [actor.GetLiege.GetDiarchTitle]"
 action_low_control_in_county: "@control_icon! Bajo control de la circunscripción en [landed_title.GetNameNoTierNoTooltip] #low ([landed_title.GetCountyData.GetControl|0]/100)#!"
 action_low_control_in_county_HELP: "\n\n#help Puedes asignar tu [marshal|E] a la tarea de [increase_control|E] para aumentar el Control de la Circunscripción.#!"
 action_low_control_in_county_combined_group_label: "@control_icon! Bajo control en las circunscripciones"
 action_no_mandala_decree_desc: "No ha seleccionado un [mandala_decree|E]\n\n#help Deje que su Decreto ayude a guiar su [subjects|E] y, por extensión, a su Partido, en la dirección adecuada.#!"
 action_not_rightful_liege: "No es el líder legítimo del partido de [recipient.GetShortUINameNoTooltip]"
 action_not_rightful_liege_combined_group_description: "No eres el [rightful_liege|E] de varios de tus miembros de banca trasera.\n\nRevisa si puedes [create|E] o [usurp|E] títulos que te hagan su [de_jure|E] [liege|E]; hacerlo mejorará su [opinion|E] hacia ti además de aumentar el [taxes|E] y [levies|E] que recibes de ellos.\n\nSi eso no es posible, puede que desees considerar [transferring|E] asignarlos a otro de tus miembros de banca trasera, especialmente si ese miembro sería su [rightful_liege|E]."
 action_not_rightful_liege_combined_group_label: "No es el líder legítimo del partido de los diputados de base"
 action_not_rightful_liege_desc: "Usted no es el [rightful_liege|E] de su [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nDebería comprobar si puede [create|E] o [usurp|E] un título que lo haga [recipient.GetHerHis] [de_jure|E] [liege|E]; hacerlo mejorará [recipient.GetHerHis] [opinion|E] de usted así como aumentará el [taxes|E] y [levies|E] que recibe de [recipient.GetHerHim].\n\nSi eso no es posible, puede considerar [transferring|E]lo a otro de sus miembros de banca trasera, especialmente si ese miembro de banca trasera sería su [rightful_liege|E]."
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! Diputado posterior poderoso espera una [GetPlayer.Custom( 'GetCouncilConcept' )] Posición"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help Deberías considerar dar a los Diputados Poderosos una posición de [GetPlayer.Custom( 'GetCouncillorConcept' )|E]. De lo contrario, su [opinion|E] se reducirá, y podrían unirse a un [faction|E] en tu contra.\n\n Sin embargo, no todos tienen un [skills|E] lo suficientemente alto para ser útiles, y si tu [rank|E] es lo suficientemente alto, simplemente podría haber más Diputados Poderosos que asientos disponibles en el [GetPlayer.Custom( 'GetCouncilConcept' )|E].#!"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! Diputados posteriores poderosos esperan [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )] Posiciones"
 action_powerful_vassal_not_on_council_label: "@powerful_vassal_icon! Tu Poderoso Diputado, [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip], espera un Puesto [GetPlayer.Custom( 'GetCouncilConcept' )|E] ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_promote_foreign_legend_desc: "Podrías promover el [legend|E] de otra persona.\n\n#help Los [legends|E] son útiles para obtener [legitimacy|E], [dynasty_prestige|E], [prestige|E], [piety|E], [traits|E] y [claims|E]. Un [legend|E] se ha expandido en tu partido, obtén recompensas apoyándolo."
 action_regent_retract: "Retirar al diputado de base como [actor.GetLiege.GetDiarchTitle]"
 action_regent_retract_combined_group_label: "@vassal_icon! Tienes diputados que puedes retirar como [actor.GetLiege.GetDiarchTitle]"
 action_regent_retract_label: "@vassal_icon! Puede retirar a los diputados rasos de su [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, como [actor.GetLiege.GetDiarchTitle]"
 action_shift_privileges: "Robar Fondos a Compañeros de Bancada como [actor.GetLiege.GetDiarchTitle]"
