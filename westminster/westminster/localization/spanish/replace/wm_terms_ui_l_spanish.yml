 action_station_men_at_arms: "@stationed_regiment_icon! Los activistas pueden ser Destinados"
 action_station_men_at_arms_HELP: "\n\n#help Deberías estacionar a tus [men_at_arms|E] más poderosos en [holdings|E] con [buildings|E] que aumenten su efectividad.\n\n Especializar una o dos de tus Propiedades para aumentar significativamente el poder de tipos específicos de Activistas puede ayudarte en [wars|E].#!"
