 action_too_many_held_duchies_combined_group_description: "Posees más de dos [duchies|E] como [king|E] o [emperor|E], disminuyendo el [opinion|E] de tus [vassals|E].\n\n#help Cuantos más $game_concept_duchies$ tengas por encima de los dos primeros, más envidiosos se volverán tus diputados traseros. Aunque puedas ignorar sus quejas, considera regalar algunos de tus $game_concept_duchy$ [titles|E].\n\nDebes mantener $game_concept_duchies$ donde tienes muchos $game_concept_counties$, especialmente tu [realm_capital|E].#!"
