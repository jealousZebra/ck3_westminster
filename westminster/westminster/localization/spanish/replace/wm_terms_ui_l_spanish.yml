 action_title_lost_from_realm_by_vassal_war_HELP: "#help [vassals|E] que logren un [title|E] de un [title_tier|E] o superior al [rank|E] de su [liege|E] se convertirán en [independent|E], o parlamentarios de base del próximo [realm|E] Líder de Partido en la jerarquía que los supera.\n\nDebe considerar usar la interacción $stop_attacker_vassal_war_interaction$, o encontrar alguna otra manera de asegurar que la Guerra vaya en contra de su parlamentario de base.#!"
