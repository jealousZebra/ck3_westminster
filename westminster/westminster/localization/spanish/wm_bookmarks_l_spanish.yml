 bm_2024_starmer: "2024: Un Cambio de Gobierno"
 bm_2024_starmer_desc: "Labour ha ganado las elecciones generales del 4 de julio de 2024 con 411 escaños, una mayoría de 174. Keir Starmer es el Primer Ministro; los conservadores, reducidos a 121 escaños, deben elegir un nuevo líder; los Liberal Demócratas tienen su mejor resultado en un siglo; y Reform UK, los Verdes y un grupo de independientes han entrado en la Cámara de los Comunes.\n\n#bold Cada uno de los 650 diputados es jugable.#!"
 bm_group_2024: "2024"
 bookmark_2024_keir_starmer: "Keir Starmer"
 bookmark_2024_keir_starmer_subheading: "Primer Ministro"
 bookmark_2024_keir_starmer_desc: "Primer Ministro con una victoria contundente detrás de él y una bandeja de entrada llena frente a él."
 bookmark_2024_rishi_sunak: "Rishi Sunak"
 bookmark_2024_rishi_sunak_subheading: "Líder de la Oposición"
 bookmark_2024_rishi_sunak_desc: "Líder de la Oposición por ahora, tras la peor derrota de los Conservadores. Su partido pronto elegirá a su sucesor."
 bookmark_2024_ed_davey: "Ed Davey"
 bookmark_2024_ed_davey_subheading: "Líder de los Liberal Demócratas"
 bookmark_2024_ed_davey_desc: "Líder de los Demócratas Liberales, de vuelta como el tercer partido con 72 escaños."
 bookmark_2024_sam_carling: "Sam Carling"
 bookmark_2024_sam_carling_subheading: "Diputado por el Noroeste de Cambridgeshire"
 bookmark_2024_sam_carling_desc: "El diputado más joven del nuevo Parlamento, elegido en sus veintitantos. Le espera una larga carrera, si la quiere."
