l_german:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "KOALITION VEREINBART"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] und [wm_coal_leader.GetName] haben auf den Stufen von Nummer 10 die Hände geschüttelt. Das [wm_coal_party.GetNameNoTier] ([wm_coal_party_seats|0] Sitze) tritt der [wm_coal_senior.GetNameNoTier] ([wm_coal_senior_seats|0]) in der Regierung bei, und [wm_coal_leader.GetFirstName] wird stellvertretender Premierminister."
 wm_coalition_headline_supply: "DEAL ABGESCHLOSSEN: REGIERUNG GESTÜTZT"
 wm_coalition_headline_supply_desc: "Die [wm_coal_party.GetNameNoTier] hat mit der Regierung von [wm_coal_pm.GetName] ein Vertrauens- und Versorgungsabkommen vereinbart. Ihre [wm_coal_party_seats|0] Abgeordneten werden die Regierung bei Vertrauensvotum und dem Haushalt unterstützen, und ihr Vorsitzender hat Geld für ihre Prioritäten gesichert. Bei allem anderen ist jede Stimme für sich selbst."
 wm_coalition_headline_minority: "MINISTERSCHAFT DER MINORITÄT"
 wm_coalition_headline_minority_desc: "Die Gespräche sind ergebnislos geblieben. [wm_coal_pm.GetName] wird eine Minderheits-[wm_coal_senior.GetNameNoTier]-Regierung mit [wm_coal_senior_seats|0] Sitzen führen und muss jede Abstimmung im Unterhaus auf die harte Tour gewinnen."
 wm_coalition_headline_collapse: "KOALITION BRICHT ZUSAMMEN"
 wm_coalition_headline_collapse_desc: "Die [wm_coal_party.GetNameNoTier] ist aus der Regierung von [wm_coal_pm.GetName] ausgetreten. Ohne ihre Stimmen hat die Regierung keine Mehrheit und Westminster bereitet sich auf ein Misstrauensvotum oder eine Wahl vor."

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "Hängendes Parlament"
 wm_coalition.1.desc: "Das Land hat gesprochen, und niemand weiß so recht, was es gesagt hat. Die [wm_coal_senior.GetNameNoTier] ist die größte Partei mit #bold [wm_coal_senior_seats|0]#! Sitzen, und es fehlen die [wm_coal_majority|0], um die Stimmen im Unterhaus allein zu gewinnen.\n\nDer Kabinettssekretär hat die Verhandlungsräume des öffentlichen Dienstes bereit. Die anderen Parteiführer warten an ihren Telefonen, und die Presse lagert vor der Nummer 10. Wen rufen wir an?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] Sitze"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] Sitze"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] Sitze"
 wm_coalition.1.a: "Offene Gespräche mit dem [wm_coal_choice_1.GetNameNoTier]."
 wm_coalition.1.b: "Offene Gespräche mit dem [wm_coal_choice_2.GetNameNoTier]."
 wm_coalition.1.c: "Offene Gespräche mit dem [wm_coal_choice_3.GetNameNoTier]."
 wm_coalition.1.d: "Wir werden allein regieren und es wagen, dass sie uns stürzen."
 wm_coalition.1.d.tt: "Sie führen eine #bold Minderheitsregierung#!: Jeder Gesetzentwurf und jede Vertrauensabstimmung muss am Tag die Stimmen finden."

 # The terms
 wm_coalition.2.t: "Der Verhandlungstisch"
 wm_coalition.2.desc: "Das [wm_coal_talks.GetNameNoTier]-Team, geleitet von [wm_coal_talks_leader.GetName], ist mit einer langen Liste von Forderungen beim Kabinettsbüro angekommen. Sie haben #bold [wm_coal_talks_seats|0]#! Abgeordnete; mit unseren macht das [wm_coal_combined_seats|0]."
 wm_coalition.2.majority: "Zusammen hätten wir eine Mehrheit."
 wm_coalition.2.no_majority: "Selbst zusammen würden wir die Mehrheit verfehlen, aber es ist das beste angebotene Abkommen."
 wm_coalition.2.mood_warm: "\n\nDie Stimmung ist warm. Ihre Verhandlungsführer stimmen vielen Punkten unseres Manifests zu und wollen in der Regierung sein."
 wm_coalition.2.mood_cool: "\n\nDie Stimmung ist geschäftsmäßig. Sie werden viel im Gegenzug wollen, und ihre Aktivisten sind vorsichtig, für unsere Fehler verantwortlich gemacht zu werden."
 wm_coalition.2.mood_cold: "\n\nDie Stimmung ist frostig. Unsere Parteien liegen weit auseinander, und ihre Abgeordneten sitzen lieber in der Opposition, als uns billig zu stützen."
 wm_coalition.2.a: "Bieten Sie eine Koalition an: stellvertretender Premierminister und einen Kabinettssitz."
 wm_coalition.2.a.tt: "Ihr Anführer wird #bold stellvertretender Premierminister#! und einer ihrer Abgeordneten tritt dem Kabinett bei. Ihre Abgeordneten folgen der Regierungsdisziplin bei jeder Abstimmung."
 wm_coalition.2.b: "Eine Koalition anbieten und eine ihrer Flaggschiff-Politiken übernehmen."
 wm_coalition.2.b.tt: "Wie oben, und ihre Richtlinie für Haustiere geht in das Regierungsprogramm ein. Unsere eigenen Abgeordneten auf der Hinterbank werden es nicht lieben: #bold Koalitionskompromiss#! für fünf Jahre."
 wm_coalition.2.c: "Eine Koalition mit zwei Kabinettssitzen und einer ihrer politischen Positionen anbieten."
 wm_coalition.2.c.tt: "Ihr Anführer wird #bold stellvertretender Premierminister#!, zwei ihrer Abgeordneten treten dem Kabinett bei, und ihre Lieblingsthematik wird in das Regierungsprogramm aufgenommen."
 wm_coalition.2.d: "Biete Vertrauen-und-Unterstützung: ihre Stimmen für Vertrauen und den Haushalt, gegen Geld."
 wm_coalition.2.d.tt: "Sie halten sich aus der Regierung heraus, unterstützen uns jedoch bei #bold Misstrauensanträgen#! und dem #bold Finanzgesetz#!. Im Gegenzug finanzieren wir ihre Prioritäten: es kostet uns Geld und wird an ihren Anführer bezahlt."
 wm_coalition.2.e: "Lass uns eine andere Partei ausprobieren."
 wm_coalition_signals_yes_tt: "Ihre Verhandlungsführer signalisieren, dass sie dies unterzeichnen könnten."
 wm_coalition_signals_no_tt: "Ihre Verhandlungsführer signalisieren, dass dies nicht ausreichen wird."

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "Ein Angebot der Koalition"
 wm_coalition.3.t_supply: "Ein Angebot von Vertrauen-und-Unterstützung"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName] hat angerufen. Die [wm_coal_senior.GetNameNoTier] hat [wm_coal_senior_seats|0] Sitze, verfehlt eine Mehrheit, und will uns in die Regierung: Sie als #bold stellvertretenden Premierminister #! und [wm_coal_offer_seats|0] unserer Abgeordneten am Kabinettstisch. Im Gegenzug würden unsere Abgeordneten in allem mit der Regierung abstimmen."
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName] hat angerufen. Die [wm_coal_senior.GetNameNoTier] hat [wm_coal_senior_seats|0] Sitze, aber keine Mehrheit, und will uns in die Regierung: Sie als #bold stellvertretender Premierminister #!, [wm_coal_offer_seats|0] unserer Abgeordneten am Kabinettstisch und eine unserer Flaggschiff-Politiken im Regierungsprogramm. Im Gegenzug würden unsere Abgeordneten in allem mit der Regierung abstimmen."
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName] hat angerufen. Die [wm_coal_senior.GetNameNoTier] hat [wm_coal_senior_seats|0] Sitze, fehlt eine Mehrheit, und will ein Vertrauens- und Angebotsabkommen: Unsere Abgeordneten unterstützen die Regierung bei Vertrauensvoten und dem Haushalt, und im Gegenzug finanziert die Regierung unsere Prioritäten. Über alles andere könnten wir frei abstimmen, wie wir wollen."
 wm_coalition.3.a: "Wir haben einen Deal."
 wm_coalition.3.a.tt: "Das Abkommen ist unterzeichnet, und [wm_coal_pm.GetFirstName] wird Ihnen verpflichtet sein."
 wm_coalition.3.b: "Vielen Dank, aber nein."
 wm_coalition.3.b.tt: "Unsere Abgeordneten bleiben in der Opposition, frei, gegen die Regierung zu stimmen."

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "Ein Geschäft ist abgeschlossen"
 wm_coalition.4.t_refused: "Gespräche brechen zusammen"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName] hat zugestimmt. Der [wm_coal_party.GetNameNoTier] tritt der Regierung bei, [wm_coal_leader.GetFirstName] wird stellvertretender Premierminister, und die Presse nennt es bereits eine Zweckheirat. Seine Abgeordneten werden unsere Fraktionsdisziplin übernehmen."
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName] hat zugestimmt. Die [wm_coal_party.GetNameNoTier] wird uns bei Vertrauensvotum und dem Finanzgesetz unterstützen, gegen einen Preis. Bei allem anderen müssen die Whips ihre Abgeordneten jeweils mit einer Stimme für sich gewinnen."
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName] hat uns abgelehnt. Die [wm_coal_talks.GetNameNoTier] sagt, unser Angebot liegt weit unter dem, was seine Mitglieder akzeptieren würden."
 wm_coalition.4.a: "Ein neues Kapitel für das Land."
 wm_coalition.4.b: "Das Angebot versüßen."
 wm_coalition.4.c: "Versuche eine andere Partei."
 wm_coalition.4.d: "Dann regieren wir allein."

 # Breakdown
 wm_coalition.20.t: "Zeit, auszusteigen?"
 wm_coalition.20.desc_coalition: "Unsere Abgeordneten sind unruhig. Jede unpopuläre Entscheidung der Regierung wird uns angelastet, und das [wm_coal_senior.GetNameNoTier] erhält das Lob für alles, was gut läuft. Einige wollen uns heute aus der Koalition haben."
 wm_coalition.20.desc_supply: "Unsere Abgeordneten sind unruhig. Die Stützung der Regierung von [wm_coal_pm.GetName] kostet uns, und das Geld für unsere Prioritäten hat uns nicht die erwartete Dankbarkeit eingebracht. Einige wollen den Vertrag heute aufkündigen."
 wm_coalition.20.polls_bad: "\n\nDie Umfragen sind düster: Wir liegen seit dem Abkommen deutlich zurück."
 wm_coalition.20.polls_ok: "\n\nDie Umfragen halten sich, vorerst."
 wm_coalition.20.a: "Wir sind raus. Lassen Sie die Regierung sich selbst versorgen."
 wm_coalition.20.a.tt: "Das Abkommen endet. Die Regierung verliert die Stimmen Ihrer Abgeordneten und könnte mit einem Misstrauensvotum oder einer Wahl konfrontiert werden. Der Premierminister wird Ihnen nicht verzeihen."
 wm_coalition.20.b: "Wir haben unser Wort gegeben. Wir bleiben."
 wm_coalition.21.t: "Unsere Partner gehen hinaus"
 wm_coalition.21.desc: "Unsere Partner sind hinausgegangen, und mit ihnen unsere Mehrheit. Die Opposition wittert Blut, die Presse will wissen, ob wir überleben können, und der Chief Whip zählt bereits Köpfe."
 wm_coalition.21.a: "Wir machen weiter als Minderheitsregierung."
 wm_coalition.21.a.tt: "Jede Abstimmung im Unterhaus wird ein Kampf sein."
 wm_coalition.21.b: "Neue Partner finden."
 wm_coalition.21.c: "Lass das Land entscheiden: rufe eine allgemeine Wahl aus."
 wm_coalition.21.c.tt: "Parlament wird aufgelöst und eine #bold Parlamentswahl #! findet in fünf Wochen statt."

 # Decision
 wm_coalition_leave_decision: "Das Regierungsabkommen verlassen"
 wm_coalition_leave_decision_desc: "Ihre Partei aus dem Abkommen mit der Regierung zurückziehen. Ihre Abgeordneten können frei abstimmen, die Regierung verliert ihre Mehrheit, und der Premierminister wird es Ihnen niemals verzeihen."
 wm_coalition_leave_decision_tooltip: "Beende deine Koalition oder dein Vertrauens- und Versorgungsgeschäft"
 wm_coalition_leave_decision_confirm: "Rausgehen"
 wm_coalition_leave_decision_effect_tt: "Das Abkommen endet. Die Regierung verliert die Stimmen Ihrer Abgeordneten und könnte mit einem Misstrauensvotum oder einer Wahl konfrontiert werden."
 wm_coalition_leave_no_election_desc: "Es wurde keine Parlamentswahl ausgerufen"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "Stellvertretender Premierminister"
 wm_coalition_deputy_pm_modifier_desc: "Zweiter in der Regierung und Führer des kleineren Koalitionspartners."
 wm_coalition_compromise_modifier: "Koalitionskompromiss"
 wm_coalition_compromise_modifier_desc: "Eine der Vorzeigepolitiken des Koalitionspartners ist im Regierungsprogramm, und unsere eigenen Abgeordneten murmeln."
 wm_coalition_supply_deal_modifier: "Vertrauens- und Unterstützungsabkommen"
 wm_coalition_supply_deal_modifier_desc: "Stützt die Regierung bei Vertrauensabstimmungen und dem Haushaltsplan, und hat Geld für ihre Prioritäten vorzuweisen."
 wm_coalition_partner_opinion: "Koalitionspartner"
 wm_coalition_walked_out_opinion: "Aus unserer Regierung ausgetreten"
 wm_coalition_deputyship_diarchy_type: "Koalition"
 wm_coalition_deputyship_diarch_title: "Stellvertretender Premierminister"
