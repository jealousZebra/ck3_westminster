 # Change Your Politics (common/decisions/wm_ideo_decisions.txt)
 wm_ideo_change_decision: "Ändere deine Politik"
 wm_ideo_change_decision_desc: "Argumente ändern sich, und das tun auch Menschen. Nehmen Sie eine neue politische Sichtweise an: Kollegen werden es als Kehrtwende bezeichnen, Bewunderer als Bekehrung."
 wm_ideo_change_decision_tooltip: "Eine andere Ideologie annehmen"
 wm_ideo_change_decision_confirm: "Meine Meinung ändern"
 wm_ideo_change_decision_choose: "Wähle eine Ideologie"
 wm_ideo_change_decision_effect_tt: "Ihre [faith|E] wird die, die Sie gewählt haben. Ein Arbeits- oder konservativer Abgeordneter wechselt in den Fraktionsflügel seiner Partei."
 wm_ideo_pick_socialist_desc: "Ein Sozialist werden. Öffentliches Eigentum, Arbeitnehmerrechte und ein Ende der Ungleichheit: die demokratisch-sozialistische Linke."
 wm_ideo_pick_social_democrat_desc: "Ein Sozialdemokrat werden. Ein gerechteres Land durch gut finanzierte öffentliche Dienstleistungen und eine gemischte Wirtschaft: das mainstream zentristische linke Spektrum."
 wm_ideo_pick_green_desc: "Ein Grüner werden. Die Klimakrise zuerst, mit sozialer Gerechtigkeit und einer gerechteren Demokratie."
 wm_ideo_pick_liberal_desc: "Ein Liberaler werden. Persönliche Freiheit, faire Wahlen und eine enge Beziehung zu Europa: die liberale Tradition."
 wm_ideo_pick_centrist_desc: "Ein Zentrist werden. Kompetenz über Ideologie: moderat, wirtschaftsfreundlich und pragmatisch."
 wm_ideo_pick_cross_community_desc: "Eine gemeinschaftsübergreifende Haltung einnehmen. Weder unionistisch noch nationalistisch: eine gemeinsame Zukunft für die Gemeinschaften Nordirlands."
 wm_ideo_pick_one_nation_desc: "Ein One-Nation-Konservativer werden. Moderater, paternalistischer Konservatismus: soziale Verantwortung, stabile Institutionen und die Union."
 wm_ideo_pick_free_market_desc: "Ein Freimarktwirtschaftler werden. Niedrigere Steuern, Deregulierung und ein kleinerer Staat zur Förderung des Wachstums."
 wm_ideo_pick_national_conservative_desc: "Ein nationalkonservativer werden. Familie, Nation und Tradition, mit deutlich niedrigerer Einwanderung."
 wm_ideo_pick_populist_right_desc: "Ein Populist werden. Gegen das Westminster-Establishment: Grenzkontrolle, Souveränität und niedrigere Steuern."
 wm_ideo_pick_scottish_nationalist_desc: "Ein schottischer Nationalist werden. Ein unabhängiges Schottland in Europa, mit einem sozialdemokratischen Programm im Inland."
 wm_ideo_pick_welsh_nationalist_desc: "Ein walisischer Nationalist werden. Selbstverwaltung für Wales und der Schutz der walisischen Sprache."
 wm_ideo_pick_irish_republican_desc: "Ein irischer Republikaner werden. Ein vereintes Irland und ein Ende der Teilung, mit einem linken Programm."
 wm_ideo_pick_irish_nationalist_desc: "Ein irischer Nationalist werden. Konstitutioneller Nationalismus: irische Einheit durch Zustimmung, Machtteilung und soziale Demokratie."
 wm_ideo_pick_unionist_desc: "Ein Unionist werden. Die Zugehörigkeit Nordirlands zum Vereinigten Königreich, über alles hinweg verteidigt."
