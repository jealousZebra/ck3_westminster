l_german:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "Labour-Linke"
 wm_wing_badge_1_desc: "Ein Mitglied der sozialistischen Linken der Partei: öffentliches Eigentum, Gewerkschaftsrechte und Ausgaben. (Die politische Richtung eines echten Abgeordneten in diesem Spiel ist zufällig und keine Aussage über seine Ansichten.)"
 wm_wing_badge_2: "Sanfte Linke"
 wm_wing_badge_2_desc: "Ein Mitglied der gemäßigten Linken der Partei: kritische Freunde der Führung, engagiert für öffentliche Dienste. (Die politische Richtung eines echten Abgeordneten in diesem Spiel ist zufällig und keine Aussage über seine Ansichten.)"
 wm_wing_badge_3: "Labour-Zentristen"
 wm_wing_badge_3_desc: "Ein Mitglied der Zentristen der Partei: finanzielle Vorsicht, Reform der öffentlichen Dienste, Wählbarkeit zuerst. (Die politische Richtung eines echten Abgeordneten in diesem Spiel ist zufällig und keine Aussage über seine Ansichten.)"
 wm_wing_badge_4: "Eine Nation"
 wm_wing_badge_4_desc: "Ein Mitglied des One-Nation-Flügels der Partei moderiert: pragmatisch, pro öffentliche Dienstleistungen. (In diesem Spiel ist der Flügel eines echten Abgeordneten zufällig und keine Aussage über seine Ansichten.)"
 wm_wing_badge_5: "Freimarktbefürworter"
 wm_wing_badge_5_desc: "Ein Mitglied der Freimarktwirtschaftler der Partei: niedrigere Steuern, ein kleinerer Staat, Deregulierung. (Die politische Richtung eines echten Abgeordneten in diesem Spiel ist zufällig und keine Aussage über seine Ansichten.)"
 wm_wing_badge_6: "Traditionalisten"
 wm_wing_badge_6_desc: "Ein Mitglied der Traditionalisten der Partei: Recht und Ordnung, Institutionen, nationale Identität. (Die politische Richtung eines echten Abgeordneten in diesem Spiel ist zufällig und keine Aussage über seine Ansichten.)"
 wm_wing_court_decision: "Gericht eine Partei-Fraktion"
 wm_wing_court_decision_desc_labour: "Wie die Flügel der parlamentarischen Labour-Partei über ihren Vorsitzenden stehen (von 100): \n#bold Labour Left#! ([EmptyScope.ScriptValue('wm_ui_wing_size_1')|0] Abgeordnete): Zustimmung [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold Soft Left#! ([EmptyScope.ScriptValue('wm_ui_wing_size_2')|0] Abgeordnete): Zustimmung [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold Labour-Zentristen#! ([EmptyScope.ScriptValue('wm_ui_wing_size_3')|0] Abgeordnete): Zustimmung [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\nZe Einen Flügel zu fördern kostet #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! Profil: Er erhält 15 Zustimmungen, die anderen Verliert 4. Ein Flügel ohne Sitz im Kabinett (oder Schattenkabinett) verliert jeden Monat die Zustimmung; einer unter 30 murrt und rebelliert im Unterhaus, und einer unter 15 für drei Monate stellt eine Führungsherausforderung dar."
 wm_wing_court_decision_desc_conservative: "Wie die konservativen Flügel über ihren Führer stehen (von 100):\n#bold One Nation#! ([EmptyScope.ScriptValue('wm_ui_wing_size_4')|0] Abgeordnete): Zustimmung [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold Freimarktführer#! ([EmptyScope.ScriptValue('wm_ui_wing_size_5')|0] Abgeordnete): Zustimmung [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold Traditionalisten#! ([EmptyScope.ScriptValue('wm_ui_wing_size_6')|0] Abgeordnete): Zustimmung [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\nCein Flügel kostet #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! Profil: Es erhält 15 Zustimmungen, die anderen verlieren 4. Ein Flügel ohne Sitz im Kabinett (oder Schattenkabinett) verliert jeden Monat die Zustimmung; einer unter 30 murrt und rebelliert im Unterhaus, und einer unter 15 für drei Monate stellt eine Führungsherausforderung dar."
 wm_wing_court_decision_tooltip: "Die Flügel der Partei auf seiner Seite halten."
 wm_wing_court_decision_confirm: "Wähle einen Flügel"
 wm_wing_court_decision_effect_tt: "Wähle einen Flügel: Seine Zustimmung zu dir steigt um #P 15#!, die aller anderen Flügel sinkt um #N 4#!."
 wm_wing.1.t: "Die Partei zusammenhalten"
 wm_wing.1.desc: "Eine Grundsatzrede, ein Hinweis auf Politik, ein Versprechen zukünftiger Beförderungen. Welcher Flügel der Partei braucht Aufmerksamkeit?"
 wm_wing.1.w1: "Kontakt aufnehmen mit der Labour-Linken (Genehmigung [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0])."
 wm_wing.1.w2: "Kontakt aufnehmen mit der weichen Linken (Genehmigung [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])."
 wm_wing.1.w3: "Kontakt aufnehmen mit den zentristischen Labour-Mitgliedern (Genehmigung [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0])."
 wm_wing.1.w4: "Kontakt aufnehmen mit One Nation (Genehmigung [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0])."
 wm_wing.1.w5: "Kontakt aufnehmen mit den Freimarktwirtschaftlern (Genehmigung [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0])."
 wm_wing.1.w6: "Kontakt aufnehmen mit den Traditionalisten (Genehmigung [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0])."
 wm_wing.10.t: "Eine Führungsherausforderung"
 wm_wing.10.desc: "Die Briefe sind da. Ein Flügel der Fraktion hat die Geduld verloren und [wm_wing_challenger.GetName] aufgestellt, um Sie für die Führung herauszufordern. Die Zeitungen zählen Namen, die Sender haben ihre Grafiken bereit, und Ihr Telefon hat nicht aufgehört zu klingeln.\n\nSie können den Rebellen geben, was sie wollen, oder sich ihnen stellen."
 wm_wing.10.a: "Ihnen geben, was sie wollen."
 wm_wing.10.a.tt: "Sie verlieren #N 300#! Profil; die Zustimmung des rebellischen Flügels steigt um #P 30#!, die der anderen Flügel fällt um #N 4#!."
 wm_wing.10.b: "Ihnen entgegentreten."
 wm_wing.10.b.tt: "Ein #bold Charisma-#!-Wettbewerb gegen [wm_wing_challenger.GetName]. Gewinnen und die Rebellion verpufft; verlieren und sie übernehmen die Führung (und Downing Street, wenn Sie Premierminister sind)."
 wm_wing_challenge_toast: "FÜHRUNGS-HERAUSFORDERUNG"
 wm_wing_challenge_toast_desc_1: "Die Labour-Linken haben sich gegen [wm_wing_leader.GetName] ausgesprochen: [wm_wing_challenger.GetName] fordert die Führung der [wm_wing_party.GetNameNoTier] heraus."
 wm_wing_challenge_toast_desc_2: "Die Sanfte Linke hat gegen [wm_wing_leader.GetName] gehandelt: [wm_wing_challenger.GetName] fordert die Führung der [wm_wing_party.GetNameNoTier] heraus."
 wm_wing_challenge_toast_desc_3: "Die Labour-Zentristen haben sich gegen [wm_wing_leader.GetName] ausgesprochen: [wm_wing_challenger.GetName] fordert die Führung der [wm_wing_party.GetNameNoTier] heraus."
 wm_wing_challenge_toast_desc_4: "Die Einheitsnation hat gegen [wm_wing_leader.GetName] gehandelt: [wm_wing_challenger.GetName] fordert die Führung der [wm_wing_party.GetNameNoTier] heraus."
 wm_wing_challenge_toast_desc_5: "Die Freimarktwirtschaftler haben sich gegen [wm_wing_leader.GetName] gestellt: [wm_wing_challenger.GetName] fordert die Führung der [wm_wing_party.GetNameNoTier] heraus."
 wm_wing_challenge_toast_desc_6: "Die Traditionalisten haben gegen [wm_wing_leader.GetName] gehandelt: [wm_wing_challenger.GetName] fordert die Führung der [wm_wing_party.GetNameNoTier] heraus."
