l_german:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "Lies das Devolutions-Briefing"
 wm_devolution_briefing_decision_desc: "Die wöchentliche Notiz des Kabinettsbüros zum Stand der Union:\n\n#bold Schottland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% unterstützen die Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] von 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% unterstützen die Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] von 10\n#bold Nordirland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% unterstützen ein vereintes Irland; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] von 10; Stabilität der Machtteilung [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] von 100\n\n#bold Öffentliches Vertrauen in die Politik:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] von 100."
 wm_devolution_briefing_decision_tooltip: "Wo die Union steht und wie sehr die Öffentlichkeit ihren Politikern vertraut."
 wm_devolution_briefing_decision_confirm: "Lies es"
 wm_devolution.30.t: "Der Stand der Union"
 wm_devolution.30.desc: "#italic Kabinettsbüro, zur Verteilung#!\n\n#bold Schottland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% für Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] von 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% für Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] von 10\n#bold Nordirland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% für ein vereinigtes Irland; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] von 10; Machtteilung Stabilität [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] von 100\n\nDie Unterstützung für den Austritt schwankt mit dem Vertrauen der Öffentlichkeit in Westminster, je nachdem, welche Befugnisse zurückgeholt oder übertragen werden und wer jede devolvierte Regierung führt. Sobald es die Hälfte übertrifft, kann eine nationalistisch geführte Regierung formell ein Referendum anfragen.\n\n#bold Öffentliches Vertrauen in die Politik:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] von 100; erwartete Wahlbeteiligung bei einer Parlamentswahl [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%."
 wm_devolution.30.suspended: "\n\n#N Die Versammlung Nordirlands ist ausgesetzt:#! die Machtteilung ist zusammengebrochen, und nur Gespräche (oder Zeit) werden sie zurückbringen."
 wm_devolution.30.sitting: "\n\nDie Versammlung Nordirlands tagt, und die Machtteilung bleibt bestehen."
 wm_devolution.30.a: "Notiert."
 wm_devolution_devolve_decision: "Eine Macht übertragen"
 wm_devolution_devolve_decision_desc: "Geben Sie eine weitere Macht an Edinburgh, Cardiff oder Belfast. Mehr Mächte nehmen den Druck auf den Austritt und gefallen der dezentralen Regierung. \n\n#bold Schottland: #! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0] % für Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] von 10\n#bold Wales: #! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% für Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] von 10\n#bold Nordirland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% für ein vereintes Irland; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] von 10; Stabilität der Machtteilung [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] von 100"
 wm_devolution_devolve_decision_tooltip: "Einer devolvierten Regierung mehr Befugnisse geben."
 wm_devolution_devolve_decision_confirm: "Wähle eine Nation"
 wm_devolution_devolve_decision_effect_tt: "Wähle eine Nation: Ihre Befugnisse steigen um 1, die Unterstützung für den Austritt sinkt um #P 3#! Punkte (und sinkt niedriger), ihr Erster Minister ist zufrieden und das öffentliche Vertrauen steigt um 1."
 wm_devolution_claw_back_decision: "Eine Macht zurückfordern"
 wm_devolution_claw_back_decision_desc: "Macht zurück nach Westminster nehmen. Die unionistischen Zeitungen werden jubeln; die devolvierten Regierungen und ihre Wähler werden es nicht tun. \n\n#bold Schottland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% für Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] von 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% für Unabhängigkeit; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] von 10\n#bold Nordirland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% für ein vereintes Irland; Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] von 10; Machtteilung Stabilität [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] von 100"
 wm_devolution_claw_back_decision_tooltip: "Eine devolvierte Macht nach Westminster zurückgeben."
 wm_devolution_claw_back_decision_confirm: "Wähle eine Nation"
 wm_devolution_claw_back_decision_effect_tt: "Wähle eine Nation: Ihre Befugnisse sinken um 1, die Unterstützung für das Verlassen steigt #N 3#! Punkte (und setzt sich höher), ihr Erster Minister ist wütend, das öffentliche Vertrauen sinkt um 2, und Sie gewinnen ein wenig Profil."
 wm_devolution_stormont_talks_decision: "Stormont-Gespräche einberufen"
 wm_devolution_stormont_talks_decision_desc: "Die Machtteilung in Nordirland ist zusammengebrochen. Bringen Sie die Parteien an den Verhandlungstisch für intensive Gespräche: Ein Abkommen stellt die Versammlung wieder her. Ihre Chancen verbessern sich mit Ihrem Charisma und der Stabilität der Machtteilung (jetzt [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] von 100)."
 wm_devolution_stormont_talks_decision_tooltip: "Versuche, die Machtteilung in Stormont wiederherzustellen."
 wm_devolution_stormont_talks_decision_confirm: "Die Gespräche einberufen"
 wm_devolution_stormont_talks_decision_effect_tt: "Erfolg stellt die Versammlung wieder her, erhöht das öffentliche Vertrauen um 2 und verschafft Ihnen Profil. Misserfolg bringt die Parteien trotzdem näher (+5 Stabilität)."
 wm_devolution.1.t: "Eine Anfrage für ein Referendum"
 wm_devolution.1.desc: "Die [wm_dev_gov.GetNameNoTier] hat formell Westminster um die Befugnis gebeten, ein Referendum über den Austritt aus dem Vereinigten Königreich abzuhalten. Eigene Umfragen zeigen eine Unterstützung von [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%, und sie sagt, das Mandat sei eindeutig.\n\nDie unionistischen Bänke wollen ein klares Nein. Ihre Berater sind hingegen weniger sicher."
 wm_devolution.1.a: "Stimmen Sie einem Referendum zu."
 wm_devolution.1.a.tt: "Wahltag in sechs Monaten. Das Ergebnis hängt dann von der Unterstützung ab, plus/minus ein paar Punkte. Ein Ja wäre für Sie eine Katastrophe."
 wm_devolution.1.b: "Jetzt ist nicht der richtige Zeitpunkt."
 wm_devolution.1.b.tt: "Die Unterstützung für den Austritt steigt um #N 4#! Punkte und der Premierminister ist verärgert über Sie. Sie können in drei Jahren erneut fragen."
 wm_devolution.1.c: "Biete stattdessen mehr Befugnisse."
 wm_devolution.1.c.tt: "Die Nation gewinnt an Macht und die Unterstützung sinkt um #P 3#! Punkte, zu einem geringen Profilverlust. Sie können in drei Jahren erneut fragen."
 wm_devolution.20.t: "Machtübertragung"
 wm_devolution.20.desc: "Welche dezentralisierte Regierung die neuen Befugnisse erhält?"
 wm_devolution.20.scotland: "Auf Schottland übertragen (Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] von 10)."
 wm_devolution.20.wales: "Auf Wales übertragen (Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] von 10)."
 wm_devolution.20.northern_ireland: "Auf Nordirland übertragen (Befugnisse [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] von 10)."
 wm_devolution.20.none: "Bei zweiter Überlegung, jetzt nicht."
 wm_devolution.21.t: "Zurück die Kontrolle gewinnen"
 wm_devolution.21.desc: "Welche dezentralisierte Regierung eine Befugnis an Westminster verliert?"
 wm_devolution.21.scotland: "Von Schottland zurückfordern (Mächte [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] von 10)."
 wm_devolution.21.wales: "Von Wales zurückfordern (Mächte [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] von 10)."
 wm_devolution.21.northern_ireland: "Von Nordirland zurückfordern (Mächte [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] von 10)."
 wm_devolution.21.none: "Bei zweiter Überlegung, jetzt nicht."
 wm_dev_referendum_agreed_toast: "REFERENDUM ANGENOMMEN"
 wm_dev_referendum_agreed_toast_desc: "Westminster hat dem Antrag von [wm_dev_gov.GetNameNoTier] zugestimmt: In sechs Monaten wird ein Referendum über den Austritt aus dem Vereinigten Königreich abgehalten."
 wm_dev_referendum_refused_toast: "REFERENDUM ABGELEHNT"
 wm_dev_referendum_refused_toast_desc: "Westminster hat den Antrag von [wm_dev_gov.GetNameNoTier] auf ein Referendum abgelehnt. Die Unterstützung für den Austritt steigt."
 wm_dev_referendum_powers_toast: "STATT MEHR MACHT"
 wm_dev_referendum_powers_toast_desc: "Westminster hat auf den Antrag von [wm_dev_gov.GetNameNoTier] nach einem Referendum mit einem Angebot neuer Befugnisse geantwortet."
 wm_dev_stormont_collapse_toast: "STORMONT KOLLABIERT"
 wm_dev_stormont_collapse_toast_desc: "Die Machtteilung in Nordirland ist zusammengebrochen und die Versammlung ist ausgesetzt. Das öffentliche Vertrauen erleidet einen Schlag."
 wm_dev_stormont_restored_toast: "STORMONT RESTAURIERT"
 wm_dev_stormont_restored_toast_desc: "Ein Abkommen wurde getroffen und die Machtteilung kehrt nach Nordirland zurück."
 wm_dev_stormont_talks_failed_toast: "STORMONT-GESPRÄCHE SCHEITERN"
 wm_dev_stormont_talks_failed_toast_desc: "Die Gespräche endeten ohne Abkommen, obwohl die Parteien näher beieinander sind als zuvor."
 wm_dev_referendum_yes_toast_scotland: "SCHOTTLAND STIMMT MIT JA"
 wm_dev_referendum_yes_toast_scotland_desc: "Schottland hat für die schottische Unabhängigkeit gestimmt, mit [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Die Verhandlungen über den Austritt aus dem Vereinigten Königreich beginnen, und die Autorität des Premierministers ist erschüttert."
 wm_dev_referendum_no_toast_scotland: "SCHOTTLAND STIMMT MIT NEIN"
 wm_dev_referendum_no_toast_scotland_desc: "Schottland hat die schottische Unabhängigkeit abgelehnt: nur [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% haben mit Ja gestimmt. Die Frage ist damit für eine Generation geklärt, so hofft Westminster."
 wm_dev_referendum_yes_toast_wales: "WALES STIMMT MIT JA"
 wm_dev_referendum_yes_toast_wales_desc: "Wales hat für die walisische Unabhängigkeit gestimmt, mit [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Verhandlungen über den Austritt aus dem Vereinigten Königreich beginnen, und die Autorität des Premierministers ist erschüttert."
 wm_dev_referendum_no_toast_wales: "WALES STIMMT NEIN"
 wm_dev_referendum_no_toast_wales_desc: "Wales hat die walisische Unabhängigkeit abgelehnt: nur [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% haben mit Ja gestimmt. Die Frage ist für eine Generation entschieden, oder so hofft Westminster."
 wm_dev_referendum_yes_toast_northern_ireland: "NORDIRLAND STIMMT JA"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "Nordirland hat mit [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0] % für ein vereintes Irland gestimmt. Verhandlungen über den Austritt aus dem Vereinigten Königreich beginnen, und die Autorität des Premierministers ist zerstört."
 wm_dev_referendum_no_toast_northern_ireland: "NORDIRLAND STIMMT NEIN"
 wm_dev_referendum_no_toast_northern_ireland_desc: "Nordirland hat ein vereintes Irland abgelehnt: Nur [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0] % stimmten mit Ja. Die Frage ist für eine Generation geklärt, so hofft Westminster."
 wm_dev_assembly_suspended_modifier: "Versammlung ausgesetzt"
 wm_dev_assembly_suspended_modifier_desc: "Die Machtteilung ist zusammengebrochen und die Nordirland-Versammlung ist ausgesetzt."
