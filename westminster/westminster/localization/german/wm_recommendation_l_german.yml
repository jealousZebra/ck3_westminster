 wm_recommendation.1.t: "Gefällt dir Westminster?"
 wm_recommendation.1.desc: "Wenn Westminster einen Platz in deiner Mod-Liste verdient hat, hilft eine positive Bewertung im Steam Workshop weiteren CK3-Spielern, den Mod zu entdecken. Danke fürs Spielen und für deine Unterstützung."
 wm_recommendation.1.a: "Ich werde eine Bewertung auf Steam abgeben."
 wm_recommendation.1.b: "Zurück nach Westminster."
