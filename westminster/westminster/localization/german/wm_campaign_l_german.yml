l_german:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "Auf dem Wahlkampffeld: Woche [EmptyScope.ScriptValue('wm_campaign_week_value')|0]"
 wm_campaign.1.desc: "Parlament ist aufgelöst und der Battle Bus steht draußen im Leerlauf. Das Raster hat diese Woche einen Platz zu füllen, mein Handy hat 140 ungelesene Nachrichten, und jemand hat mir ohne zu fragen eine Rosette angelegt."
 wm_campaign.1.desc_leader: "\n\nAls Führer der [wm_campaign_party.GetNameNoTier] sind alle meine Schritte nationale Nachrichten. Die Sender wollen ein Kopf-an-Kopf-Duell mit [wm_campaign_rival.GetName], und die Politikabteilung hat einen Start bereit. Zuhause möchte mein Agent in [wm_campaign_seat.GetNameNoTier] mich mindestens einmal vor dem Wahltag sehen."
 wm_campaign.1.desc_leader_no_rival: "\n\nAls Führer der [wm_campaign_party.GetNameNoTier] sind alle meine Schritte nationale Nachrichten, und die Politikabteilung hat einen Start bereit."
 wm_campaign.1.desc_mp: "\n\nDie nationale Kampagne hat keine Ahnung, wer ich bin, was eine Erleichterung ist. Wichtig ist [wm_campaign_seat.GetNameNoTier]: die Flugblätter, die Haustüraktionen und ob die Lokalzeitung mein Foto richtig herum druckt."
 wm_campaign.1.a: "Eine große Kundgebung abhalten."
 wm_campaign.1.b: "Gegen [wm_campaign_rival.GetFirstName] in der Fernsehdebatte antreten."
 wm_campaign.1.c: "Mach die TV-Debatte und begrabe [wm_campaign_rival.GetFirstName] in Statistiken."
 wm_campaign.1.d: "Eine Flaggschiffpolitik starten."
 wm_campaign.1.e: "Geh [wm_campaign_seat.GetNameNoTier] an die Tür klopfen."
 wm_campaign.1.f: "Eine ruhige Woche in der Kampagnenzentrale, in der Flugblätter genehmigt werden."

 wm_campaign_rally_success: "Kundgebung: Begeisterter Empfang"
 wm_campaign_rally_flat: "Rally: Höflicher Applaus"
 wm_campaign_rally_flop: "Kundgebung: Halbleere Halle"
