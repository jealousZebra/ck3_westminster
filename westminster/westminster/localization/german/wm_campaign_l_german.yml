 wm_campaign_debate_wonk_won: "Debatte: Tod durch Tabellenkalkulation (ihre)"
 wm_campaign_debate_wonk_lost: "Debatte: Das Publikum beim 'Fiscal Headroom' verloren"
 wm_campaign_policy_success: "Politikeinführung: Es durchschneidet"
 wm_campaign_policy_flop: "Politikeinführung: Kostenaufstellung im Frühstücksradio enthüllt"
