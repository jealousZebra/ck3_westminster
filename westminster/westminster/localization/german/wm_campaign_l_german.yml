 wm_campaign.2.t: "Patzer!"
 wm_campaign.2.desc: "Mein Pressesprecher hat das Gesicht von jemandem, der gerade die Titelseiten von morgen gesehen hat."
 wm_campaign_gaffe_1: "Ein Fotograf hat mich dabei erwischt, wie ich an einem Café-Stopp ein Bacon-Sandwich gegessen habe, und das Ergebnis wird online als \" Geiselsituation mit Frühstück\" beschrieben. Es ist bereits ein Meme, eine Tasse und ein Klingelton."
 wm_campaign_gaffe_2: "Ich habe vergessen, dass mein Mikrofon nach einem Werksbesuch noch eingeschaltet war, und das ganze Land hat nun gehört, wie ich eine Wählerin \"etwas zu viel, um ehrlich zu sein\" nannte. Sie hat seit dem Mittagessen vier Interviews gegeben."
 wm_campaign_gaffe_3: "Auf die Frage im Live-Radio, wie viel ein Pint Milch kostet, sagte ich \"Etwa elf Pfund?\" mit voller Überzeugung. Der Moderator ließ die Stille neun Sekunden bestehen."
 wm_campaign_gaffe_4: "Bei einer Fotogelegenheit ging ich selbstbewusst durch die falsche Tür, in einen Schrank, und die Kameras warteten darauf, dass ich wieder herauskam. Ich tat es schließlich, indem ich einen Mopp hielt."
 wm_campaign_gaffe_5: "Ich wurde beim Halten eines unserer Flugblätter verkehrt herum während einer ganzen Rede gefilmt, unter einem Banner, das den Namen des Wahlkreises falsch geschrieben hatte. Auch den Namen unseres eigenen Kandidaten."
 wm_campaign.2.a: "Darüber lachen. Jeder hat einen schlechten Sandwich-Tag."
 wm_campaign.2.b: "Einen jungen Mitarbeiter beschuldigen."
 wm_campaign.2.c: "Drauf einlassen: noch einmal absichtlich, vor den Kameras."
 wm_campaign_gaffe_shrugged: "Patzer: Die Öffentlichkeit findet das ziemlich liebenswert"
 wm_campaign_gaffe_stuck: "Patzer: Er führt jede Sendung an"
 wm_campaign_gaffe_viral: "Patzer: Selbstironie geht viral (auf gute Weise)"
 wm_campaign_gaffe_doubled: "Patzer: \"Doubling down\" war nicht die Antwort"

 wm_campaign_doorstep_county_modifier: "Den Abgeordneten an der Haustür getroffen"
 wm_campaign_doorstep_county_modifier_desc: "Ihr Abgeordneter hat während des Wahlkampfs hier an Türen geklopft und daran gedacht, seine Füße abzuwischen."
 wm_campaign_viral_gaffe_modifier: "Viraler Patzer"
 wm_campaign_viral_gaffe_modifier_desc: "Ein Wahlkampfpatzer, den das Internet nicht vergisst."

 wm_campaign_debate_humiliated_opinion: "Hat mich in der TV-Debatte geschlagen"
