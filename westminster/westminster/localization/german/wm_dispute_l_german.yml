l_german:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "Der Zähler"
 wm_dispute.1.desc: "#italic Erklärung des Wahlleiters#!\n\n[wm_dispute_mp.GetName] ist in [wm_dispute_seat.GetNameNoTier] mit einer Differenz von [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] Punkten als Sieger erklärt worden."
 wm_dispute.1.close: "Es ist so knapp, dass die Agenten bereits über doppelt gezählte Stimmzettelbündel und eine spät eingetroffene Box murmeln. Eine Nachzählung (eine Woche, [EmptyScope.ScriptValue('wm_dispute_recount_cost')|0] an Gebühren) könnte etwas ändern, vielleicht eine [EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0]% Chance; eine Wahlanfechtung (vier Monate und [EmptyScope.ScriptValue('wm_dispute_court_cost')|0]) könnte das Ergebnis für ungültig erklären und die Stelle erneut umkämpft sehen, vielleicht eine [EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0]% Chance."
 wm_dispute.1.clear: "Es ist nicht knapp. Eine Nachzählung ([EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]) würde sehr wahrscheinlich nichts ändern, und die Öffentlichkeit mag keinen schlechten Verlierer: eine Anfechtung wird dir Ansehen und politisches Kapital kosten."
 wm_dispute.1.bad: "Es war nicht einmal knapp: eine herbe Niederlage. Eine Anfechtung würde dich zum Gespött machen und könnte wütende Anhänger auf die Straßen bringen."
 wm_dispute.1.a: "Gratuliere dem Gewinner."
 wm_dispute.1.b: "Fordern Sie eine Nachzählung."
 wm_dispute.1.b.tt: "Jeder Stimmzettel wird erneut gezählt. Es kostet Geld; wenn das Ergebnis nicht knapp war, kostet es auch Profil und politisches Kapital."
 wm_dispute.1.c: "Petitionieren Sie das Wahlsgericht."
 wm_dispute.1.c.tt: "Richter prüfen das Verhalten der Wahl. Es ist langwierig und teuer; sie können die Wahl für ungültig erklären und eine neue Nachwahl anordnen oder Ihnen die Kosten auferlegen."
 wm_dispute_recount_toast: "Nachzählung in [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName] hat eine Nachzählung in [wm_dispute_seat.GetNameNoTier] verlangt. Das Zählpersonal sitzt wieder an seinen Tischen."
 wm_dispute_court_toast: "Wahlbeschwerde: [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName] hat beim Wahlausschuss gegen das Ergebnis in [wm_dispute_seat.GetNameNoTier] Einspruch eingelegt. Die Richter werden in ein paar Monaten berichten."
 wm_dispute_overturned_toast: "RÜCKZÄHLUNGSÜBERGRIFFSERGEBNIS"
 wm_dispute_overturned_toast_desc: "Nach einer Nachzählung wird [wm_dispute_mp.GetName] mit wenigen Stimmen zum Abgeordneten für [wm_dispute_seat.GetNameNoTier] erklärt."
 wm_dispute_upheld_toast: "Nachzählung bestätigt Ergebnis"
 wm_dispute_upheld_toast_desc: "Die Nachzählung in [wm_dispute_seat.GetNameNoTier] bestätigt [wm_dispute_mp.GetName] als seinen Abgeordneten."
 wm_dispute_void_toast: "WAHL FÜR NICHTIG ERKLÄRT"
 wm_dispute_void_toast_desc: "Das Wahlgericht hat das Ergebnis in [wm_dispute_seat.GetNameNoTier] für ungültig erklärt. Es wird eine neue Nachwahl geben."
 wm_dispute_dismissed_toast: "Wahlbeschwerde abgewiesen"
 wm_dispute_dismissed_toast_desc: "Das Wahlgericht hat die Petition über [wm_dispute_seat.GetNameNoTier] abgewiesen und die Kosten gegen den Petenten zugesprochen. [wm_dispute_mp.GetName] bleibt."
 wm_dispute_national_toast: "WEIGERT SICH, ZUZUGEBEN"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] wird das Ergebnis der Parlamentswahl nicht akzeptieren. Nichts wird sich ändern, aber Anhänger versammeln sich auf den Straßen und die Zeitungen sind unerbittlich."
 wm_dispute_seat_decision: "Hinterfrage den Grafen"
 wm_dispute_seat_decision_desc: "Sie haben Ihren Sitz verloren, aber war die Auszählung korrekt? Fordern Sie eine Nachzählung oder beantragen Sie beim Wahlgericht, die Wahl für ungültig zu erklären. Wenn es nicht knapp war, wird die Öffentlichkeit Sie als schlechten Verlierer sehen."
 wm_dispute_seat_decision_tooltip: "Das Ergebnis in dem Sitz, den Sie verloren haben, bestreiten."
 wm_dispute_seat_decision_confirm: "Betrachten Sie es"
 wm_dispute_seat_decision_effect_tt: "Sie entscheiden, ob Sie das Ergebnis akzeptieren, eine #bold-Neuauszählung fordern#! oder das #bold-Wahlgericht#! petitionieren."
 wm_dispute_not_disputed_tt: "Das Ergebnis wurde bisher nicht angefochten."
 wm_dispute_no_byelection_tt: "Der Sitz wartet nicht auf eine Nachwahl."
 wm_dispute_national_decision: "Weigerung, nachzugeben"
 wm_dispute_national_decision_desc: "Die Wähler haben Sie aus der Downing Street geworfen. Sie könnten sich weigern, dies zu akzeptieren: überprüfen Sie die Stimmenzählung, die Briefwahl und die Rundfunkanstalten. Es wird nichts ändern, Sie teuer zu stehen kommen lassen und Ihre wütendsten Anhänger auf die Straßen bringen."
 wm_dispute_national_decision_tooltip: "Weigerung, das Ergebnis der Parlamentswahl zu akzeptieren."
 wm_dispute_national_decision_confirm: "Weigerung nachzugeben"
 wm_dispute_national_decision_effect_tt: "Sie verlieren eine große Menge an #bold Profil und politischem Kapital#!, Ihre Partei fällt in den Umfragen, der neue Premierminister ist verärgert, und #bold Unruhen#! können ausbrechen."
 wm_dispute_sore_loser_modifier: "Schlechter Verlierer"
 wm_dispute_sore_loser_modifier_desc: "Weigerte sich, das Ergebnis einer Parlamentswahl zu akzeptieren."
 wm_dispute_bad_loser_modifier: "Bad Loser"
 wm_dispute_bad_loser_modifier_desc: "Ein Ergebnis, das sie eindeutig verloren hatten, angefochten."
 wm_dispute_sore_loser_opinion: "Weigerte sich nachzugeben"
