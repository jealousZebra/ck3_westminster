l_german:
 bm_2024_starmer: "2024: Ein Regierungswechsel"
 bm_2024_starmer_desc: "Labour hat die Parlamentswahl am 4. Juli 2024 mit 411 Sitzen gewonnen, eine Mehrheit von 174. Keir Starmer ist Premierminister; die Konservativen, die auf 121 Sitze reduziert wurden, müssen einen neuen Führer wählen; die Liberal Democrats haben ihr bestes Ergebnis seit einem Jahrhundert erzielt; und Reform UK, die Grünen und eine Gruppe von Unabhängigen haben Einzug ins Unterhaus gehalten.\n\n#bold Jeder der 650 Abgeordneten ist spielbar.#!"
 bm_group_2024: "2024"
 bookmark_2024_keir_starmer: "Keir Starmer"
 bookmark_2024_keir_starmer_subheading: "Premierminister"
 bookmark_2024_keir_starmer_desc: "Premierminister mit einem Erdrutsch hinter sich und einem vollen In-Tray vor sich."
 bookmark_2024_rishi_sunak: "Rishi Sunak"
 bookmark_2024_rishi_sunak_subheading: "Führer der Opposition"
 bookmark_2024_rishi_sunak_desc: "Führer der Opposition vorerst, nach der schlimmsten Niederlage der Konservativen. Seine Partei wird bald seinen Nachfolger wählen."
 bookmark_2024_ed_davey: "Ed Davey"
 bookmark_2024_ed_davey_subheading: "Vorsitzende der Liberal Democrats"
 bookmark_2024_ed_davey_desc: "Führer der Liberaldemokraten, zurück als dritte Partei mit 72 Sitzen."
 bookmark_2024_sam_carling: "Sam Carling"
 bookmark_2024_sam_carling_subheading: "Abgeordneter für Nordwest-Cambridgeshire"
 bookmark_2024_sam_carling_desc: "Der jüngste Abgeordnete im neuen Parlament, Anfang zwanzig gewählt. Eine lange Karriere liegt vor ihm, wenn er sie möchte."
