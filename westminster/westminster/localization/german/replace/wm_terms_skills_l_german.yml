 historical_character.mibu_tadamine: "Trotz bescheidener Herkunft erlangte $Tadamine$ großen Parteiruf für seine Waka-Dichtung, nachdem er an einem Wettbewerb teilgenommen hatte, eine kaiserliche Kommission erhielt und die Schirmherrschaft der Familie Fujiwara genoss. Zusammen mit seinem Sohn, $Tadami$, wird er zu den Dreiunddreißig Unsterblichen Dichtern Japans gezählt, wobei über einundachtzig Gedichte wahrscheinlich in kaiserlichen Anthologien enthalten sind."
 historical_character.namdev: "Namdev war ein Marathischer Heiliger und Dichter des 13. Jahrhunderts, bekannt für seine Hingabe-Lieder, die Vithoba gewidmet sind, und als prominente Figur der Bhakti-Bewegung in Maharashtra. Beliebt bei den einfachen Leuten, trugen seine Werke auch stark zur Verbreitung und zum Profil der Marathi-Sprache als eines Mittels der Dichtung und politischen Kampagne bei."
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ Suche nach einem mythischen Tier, das in der Gegend gesichtet wurde\n$EFFECT_LIST_BULLET$ Erhöht $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Höhere [hunt_danger_no_prefix|E] gewährt mehr [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Sicherheitssomes dürfen teilnehmen\n$EFFECT_LIST_BULLET$ Nicht-kämpfende Geschlechter dürfen zuschauen\n#weak Mythische Kreaturen werden oft von Gelehrten als Legende abgetan, aber die Wälder könnten noch viel Geheimnis bergen.#!"
