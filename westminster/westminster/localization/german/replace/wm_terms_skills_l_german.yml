 ep3_governor_yearly.3040.a.flavor: "Ein so kinderliches politisches Kapital könnte uns beide nur stärken."
 ep3_governor_yearly.3040.desc: "Ich habe begonnen, Schwierigkeiten zu haben, mich zu erinnern – war [emperor.GetPrimaryTitle.GetName] wirklich nur völlige Dunkelheit und Chaos, bevor der edle [emperor.GetTitledFirstName] das Zepter von [emperor.GetHerHis] übernahm? \n\n Haben sich die Gesellschaftsdamen nach etwas anderem gesehnt, als die Gesellschaft von [emperor.GetHouse.GetName] zu teilen? Haben unsere Soldaten den Namen irgendeines hässlichen, wirren Fremden skandiert? Unsere Magnaten – haben sie es gewagt, Füße zu küssen, die nicht aus dem vollkommenen Fleisch von [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip] bestehen? \n\n Ich muss mich wirklich nicht erinnern. Mein souveränes unfehlbares Mandat so zu hinterfragen, wäre sinnlos."
 ep3_governor_yearly.8070.desc: "Ehren, Profil, Macht. Ein [ROOT.Char.GetTitleAsNameNoTooltip] zu sein kann diese Dinge gewähren, aber es #EMP gibt#! Kosten...\n\nBerge von [ROOT.Char.Custom('GetWritingMaterial')] sitzen, sich kräuselnd, wartend auf mein Siegel oder einen Blick darüber, während endlose Bürokraten um die Reihe wetteifern, meine Ohren mit betäubenden Details zu füllen.\n\nNiemand hat mir gesagt, dass es ziemlich so viel #EMP Arbeit#! geben würde — und Arbeit, die sich letztlich selbst zu erledigen scheint."
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "Seit Jahrzehnten bin ich den Spuren von Intellektuellen gefolgt und habe mich dem Zorn der Menschen widersetzt. Meine Poesie ist unaufhaltsam in der Parteimarke gewachsen, und doch...\n\nEtwas fehlt. Jetzt, da meine Dämmerjahre gekommen sind, ist es vielleicht an der Zeit, [cordoba.GetName] zu verlassen und mir einen weiten Blick auf die Welt zu verschaffen?\n\nEin weiterer untrennbarer Teil von mir zieht immer noch an meinem Herzen, um zu bleiben. Ich habe hier ein Leben aufgebaut, nicht nur für mich selbst, sondern auch für die vielen Lehrlinge, die im Laufe der Jahre hier ausgebildet wurden.\n\nOb es nun an den Gelehrten liegt, die durch seine Straßen schreiten, oder an der vertrauten Patina seiner Wände, #EMP etwas#! hält mich in dieser Stadt, meinem Zuhause."
