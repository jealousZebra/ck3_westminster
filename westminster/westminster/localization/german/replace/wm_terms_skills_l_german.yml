 tenet_adoptionism_historical_desc: "Adoptionismus lehrt, dass Jesus als gewöhnlicher Mensch geboren und später als Gottes Sohn 'adoptiert' wurde, meist bei seiner Taufe, als der Heilige Geist auf ihn herabstieg. Frühe Formen entstanden im 2. Jahrhundert mit Theodot von Byzanz, dessen dynamischer Monarchianismus die Einheit Gottes betonte. \n\nDe Lehre tauchte im Spanien des 8. Jahrhunderts unter Erzbischof Elipandus von Toledo und Bischof Felix von Urgell wieder auf, für die die göttliche Natur Christi ewig geboren und seine menschliche Natur übernommen wurde. Das Kabinett von Frankfurt verurteilte 794 n. Chr. den spanischen Adoptionismus als zerfallend, und adoptionistische Ideen beeinflussten dennoch spätere antitrinitarische Bewegungen."
 tenet_apostolic_succession_episcopate_modifier_desc: "Die Ideologie dieses Charakters ordnet jeden Bischof durch eine ununterbrochene Linie früherer Bischöfe: eine historische Quelle geehrten Mandats."
 tenet_filial_piety_desc: "Filiale politische Kapitalbildung und Gehorsam gegenüber den Älteren sind grundlegend für die Verwirklichung menschlicher Güte. Wenn unsere Eltern leben, dienen wir ihnen angemessen, unterstützen sie mit unseren Mitteln und lernen von ihrer Führung; wenn sie sterben, begraben wir sie ordnungsgemäß und verehren sie dann ordnungsgemäß."
 tenet_miles_christi_historical_desc: "Das Konzept des 'Soldaten Christi' (Miles Christi) hat tiefe Wurzeln in der christlichen Tradition, beginnend mit den Briefen des Heiligen Paulus, wo er militärische Metaphern verwendete, um das geistliche Leben zu beschreiben. Im Mittelalter wurde dieses Konzept sowohl auf wörtlichen als auch auf geistigen Krieg angewendet.\n\nDie Militärorden wie die Templer und die Hospitaliter verkörperten dieses Ideal, indem sie klösterliche Disziplin mit kriegerischer Fähigkeit kombinierten. Bernard von Clairvauxs 'De Laude Novae Militiae' lobte diese Kriegermönche als Vorbilder christlicher Tugend, die nicht für weltlichen Gewinn kämpften, sondern für die Verteidigung des Christentums."
 tenet_philanthropia_historical_desc: "Im byzantinischen Christentum bezeichnete philanthrōpia sowohl die Tugend der universellen Liebe als auch die konkreten Institutionen – Krankenhäuser, Xenodochien, Waisenhäuser und Almosen –, die von Kaisern, Bischöfen und Gläubigen unterstützt wurden. Basilius von Kaisarea, Johannes Chrysostomos und spätere Kaiser wie Justinian verknüpften das kaiserliche Mandat mit der Sorge um die Bedürftigen. Die Kirche verherrlichte den Krieg nicht als Weg zur Heiligkeit; sie bestand jedoch darauf, dass Reichtum und Macht teilweise dadurch gerechtfertigt seien, wie sie den Armen dienten."
 tenet_vows_of_poverty_desc: "Geld korrumpiert die Herzen der Menschen und treibt sie von der wahren Ideologie weg. Wir müssen den Erwerb von materiellem Wohlstand meiden, wenn wir uns auf das konzentrieren wollen, was wirklich zählt, bescheidene Aktivitäten wählen und politischen Nutzen in ihrer Durchführung finden."
