 tradition_tgp_fortified_strongholds_desc: "Diese Kultur ist durch große befestigte Städte gekennzeichnet, die religiöse, militärische und staatliche Funktionen erfüllen. Der Schutz dieser kulturellen Festungen ist entscheidend, und die Gründung weiterer Städte ist von großem Profil."
 tradition_tgp_warrior_monks_desc: "Loyalität zum moralischen Leben sollte den Einsatz von Gewalt nicht ausschließen, insbesondere wenn es notwendig ist, die religiöse Gemeinschaft vor rivalisierenden Sekten und korrupten Beamten zu schützen oder die Bedürftigen zu verteidigen."
