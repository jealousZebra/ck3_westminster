 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ Wähle eine Beute aus einer Vielzahl lokaler Tiere\n$EFFECT_LIST_BULLET$ Steigert $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Höhere [hunt_danger_no_prefix|E] gewährt mehr [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Sicherheitsgeschlechter können aktiv teilnehmen\n$EFFECT_LIST_BULLET$ZZ Nicht-martiale Geschlechter dürfen zuschauen\n#weak ZZ Stolze und listige Bestien durchstreifen die Wildnis; sie auszutricksen und zu überwinden stellt Tapferkeit auf die Probe und schärft ihre Fähigkeiten. #!"
 hunt_type_stress: "$BULLET_WITH_TAB$@stress_icon! Druckverlust"
 iberia_north_africa.0111.desc: "Es hat Jahre gedauert, die politische und spirituelle Einheit aufzubauen, um dieses Konklave zu versammeln, aber ich habe endlich genug von sowohl der Bauernschaft als auch von den Parteifunktionären unter meine Banner gebracht, um die falschen [pope.GetTitledFirstName].\nZZ\nEnu wimmeln die Gänge und Gästezimmer [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] von streitlustigen Geistlichen und leidenschaftlichen Bischöfen; jedem verärgerten Mönch und jedem kleinen [religious_leader.GetFaith.PriestNeuter], die Rom je ignoriert hat, verstopfen meine Hallen. \n\nA Diese Debatte ist entscheidend für das Mandat, aber letztlich wird als vorrangiger [religious_leader.GetFaith.GetAdjective] Herrscher #EMP my#!-Wort die endgültige entscheidende Stimme sein."
 iberia_north_africa.0112.desc.righteous: "zieht zurück, was [religious_leader.GetSheHe] als die sündhafte Gewalt ansieht, die so viel von [religious_leader.GetFaith.GetReligion.GetName] infiziert hat.\n\n Laut [religious_leader.GetHerHim] sollte [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] sich auf das politische Kapital konzentrieren, einfach ein gutes Leben zu führen, anstatt den Weg zu [religious_leader.GetFaith.PositiveAfterLife] mit dem Blut der Gegner zu pflastern."
