 dlc_015_desc: "Bringt neue Inhalte zu mehreren beliebten Systemen: Reisen, Aktivitäten und Lebensstile. Schicken Sie Ihren Herrscher auf spannende Reisen, sei es im Streben nach Reichtum, Ansehen oder persönlichem Wachstum. Lassen Sie ihn nicht untätig bleiben – Abenteuer warten an jeder Ecke!"
 doctrine_imperial_anointment_desc: "Um zweifellos als Kaiser zu herrschen, muss man knien – denn nur die höchste Autorität ihrer Kirche kann dieses endgültige, unbestreitbare Mandat verleihen."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Anhänger verdienen politisches Kapital für das erfolgreiche Abschließen von [intrigue|E] [schemes|E]"
 dread_least: "$least_sort$ Formidabel"
 dread_most: "$most_sort$ Formidabel"
 dreaded_beauty: "Beeindruckende Schönheit"
 dreadful_nerge_intent: "Beeindruckend"
 dreadful_perk_name: "Beeindruckend"
 eat_cheese_effect_tt: "Je länger der Käse gereift ist, desto weniger Druck werden Sie beim Essen verspüren."
 efg_contested_wrath_desc: "Die Nutzung unserer Organisatoren, um unser kaiserliches Mandat gegen einen rivalisierenden Kaiser zu fördern, nährt unsere Krieger und gewinnt den Respekt der Massen."
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] persönlich meine sofortige Ernennung durch kaiserlichen Erlass angeordnet. Niemand kann das Mandat meines neuen Status in der [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] anfechten."
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip] Kräfte waren keine Gegner für meine überlegenen Waffen und bewiesen mein größeres Mandat als Verteidiger der Provinz im Namen von [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_decisions_event.0007.desc: "Und damit wurden die [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] erneut besänftigt. Meine Macht und das Mandat meiner Macht wurden bestätigt. \n\n"
 ep3_decisions_event.9010.desc: "Ich atme tief ein und aus, während ich meine Angelschnur ins Wasser werfe. Der Haken landet mit einem leisen 'Plopp' und die Welt wird still. \n\nMein Blick wandert entlang der Küste, einen Moment allein, um meine Gedanken zu ordnen. Das Leben als Abenteurer ist nicht so schlecht, aber kein Leben ist ohne Druck. Ich schließe für einen Moment die Augen, um zu ruhen, als ich plötzlich von etwas aus dem Schlaf gerissen werde, das mir die Angel aus der Hand zieht."
