 court_warlike_desc: "#low Eine Machtdemonstration ist der einzige Weg, Ehrfurcht und Respekt zu erzwingen! Unsere Organisatoren und Soldaten sind berühmt für ihre Fähigkeiten. \n\nStaff erhält die [GetTrait('warlike_court_1').GetName( GetNullCharacter )] Eigenschaften. #!"
