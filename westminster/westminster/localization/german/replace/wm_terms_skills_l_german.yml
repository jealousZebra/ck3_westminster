 game_rule.1101.desc.combat.locale.southwark: "Mit Englands wohlhabendster Stadt so nahe, gibt es alles, wofür man kämpfen kann. Sei es um Häuser oder Beute, Ruhm oder politisches Kapital, beide Armeen prallen immer wieder aufeinander.\n\nDas Südufer der Themse schäumt und kocht vor unserem Blut, aber ich werde nicht aufgeben, ich werde #EMP nicht#! nachgeben.\n\nEngland gehört mir bereits, diese Schlacht wird es beweisen, und alles, was es braucht, ist ein letzter #EMP Stoß#!, um zu beweisen, dass—"
 generic_rite_focus_tenet_cranial_trophies: "Diese Ideologie behandelt die Überreste von Feinden als heiligen Beweis des Triumphs und erschreckendes Profil."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] behandelt die Überreste von Feinden als heiligen Beweis des Sieges und furchterregenden Profils."
 glory_hound_desc: "$glory_hound$ [vassals|E] kümmern sich um Ansehen und Profil und darum, der Welt die Stärke der Partei zu zeigen, der sie angehören. Kühne oder unbarmherzige Hinterbänkler übernehmen oft diese [vassal_stance|E].\n\n#low $glory_hound$ Hinterbänkler mögen es, wenn ihr Parteiführer:#!\n$EFFECT_LIST_BULLET$Hat irgendeine Teilung [succession_law|E]\n$EFFECT_LIST_BULLET$Erreicht [victory|E] im Angriff [wars|E]\n$EFFECT_LIST_BULLET$Lädt sie zu [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ Hinterbänkler mögen es nicht, wenn ihr Parteiführer:#!\n$EFFECT_LIST_BULLET$Hat hohe [crown_authority|E]\n$EFFECT_LIST_BULLET$Unterschreibt [defeat|E] oder [white_peace|E] in Kriegen\n$EFFECT_LIST_BULLET$[marries|E] einen [lowborn|E] Charakter als [primary_spouse|E]\n\nSie bevorzugen kühne und mutige [heirs|E] mit hoher [martial_i][martial|E] Fähigkeit."
 grand_ambitions.0180.desc: "Ich stehe vor dem [hof.GetTitleAsName], dem spirituellen Führer meines Volkes. Die Luft ist schwer von Weihrauch und dem Gewicht der Jahrhunderte.\n\nDie Gunst von [hof.GetHerHis] zu sichern würde meinem Anspruch auf [target_title.GetName] nicht nur Autorität verleihen, sondern könnte auch die Herzen der Gläubigen im ganzen Reich beeinflussen. [hof.GetSheHe|U] muss mich krönen.\n\nDer [hof.GetTitleAsNameNoTooltip] ist keine bloße spirituelle Figur; [hof.GetSheHe] ist sich der [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] weltlichen Machenschaften bewusst."
