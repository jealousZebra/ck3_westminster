 mpo_nerge.1030.desc: "A ways from the main hunting cohort, [master_of_hunt.GetFirstName] tells me of a beautiful white [ROOT.Char.Custom('GetRegionalDeerType')] that has been spotted. "It was unlike anything I have ever seen," [master_of_hunt.GetSheHe] says, [master_of_hunt.GetHerHis] eyes wide. "It was not alone, however. There were smaller ones with it, all as white as snow."\n\nI have hunted wolves, deer, and wild cats, but to slay such a creature might bring me great party brand."
