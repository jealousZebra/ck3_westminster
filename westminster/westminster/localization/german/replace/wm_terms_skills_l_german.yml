 depose_desc: "Ich werde eine Reihe von Manövern orchestrieren, um die Autorität und das Mandat von [SCHEME.GetTargetCharacter.GetShortUIName] zu untergraben, mit dem Ziel, [SCHEME.GetTargetCharacter.GetHerHim] vom Thron unseres Reiches zu entfernen."
 deqhan_special_rights_tax_collector_flavor_desc: "persischen Magnaten innerhalb eines alten, dezentralen Steuererhebungssystems verwalten die Deqhans ihr Land eng, um die Produktivität – und ihr eigenes Profil – zu fördern."
