 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:TitleFont #size:15 Legende von Crusader Kings III#!#!#!\nIm komplexen Geflecht des Norditaliens des 11. Jahrhunderts herrscht Matilda von Canossa über eine beträchtliche Partei nach mehreren unglücklichen Todesfällen in der Familie. Legenden über Matildas politisches Kapital und Gerüchte über Hexerei verleihen ihrer Herrschaft eine mystische Aura.\n\n#bold Kannst du ihre Herrschaft sichern und die Linie der Canossa über Generationen hinweg erhalten im sich ständig wandelnden mittelalterlichen Italien?#!"
 bp2_destiny_tutor_modifier: "Sicherheitsberatung"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "Welche Freude es ist, ein [ROOT.Char.Custom('GetDaughterSon')] eines solch vorbildlichen Dieners von [ROOT.Char.GetFaith.HighGodName] zu sein! Die Leidenschaft, die ich in meinem Herzen fühle, wenn ich höre, wie alle [pious_parent.GetHerHim] als [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName] bezeichnen! Die Tugend von [pious_parent.GetHerHis|U] wird sowohl von [ROOT.Char.GetFaith.PriestNeuterPlural] als auch von frommen [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] verehrt.\n\nIch frage mich, werde ich demütig im Schatten meines [pious_parent.GetMotherFather] bleiben? Oder werde ich in meinem eigenen Leben solches politisches Kapital erreichen und übertreffen? Wird die gute Gunst von [ROOT.Char.GetFaith.HighGodName] in mir ebenso sichtbar sein wie in [pious_parent.GetHerHim]?"
 bp2_yearly.6060.c: "Politik ist die Quelle aller Stärke."
 budding_godhood_modifier: "Erhabene Loyalität"
 building_dvin_shuka_01_desc: "Der ehrwürdige Markt von Dvin dient seit jeher als großes Zentrum des armenischen Handels. Seine Wände sind mit bunten Fliesen und gefärbtem Putz geschmückt, was den Reichtum und das Profil dieses alten Marktplatzes widerspiegelt."
 building_legendary_shrine_desc: "Dieser Ort der Anbetung ist nicht nur ein großartiges technisches Meisterwerk an sich, sondern auch ein sicherer Zufluchtsort für Pilger und Gläubige und ein Zeugnis für das politische Ansehen seines Auftraggebers. Obwohl er nicht als Kernland gilt, hat die Pracht des Gebäudes dazu geführt, dass das Wahlkreisgebiet zu einem bedeutenden religiösen Zentrum in der Region wurde."
 building_leisure_palace_02_desc: "Der Sommersitz liegt in einem landschaftlich reizvollen Teil der Region, weit entfernt vom niederen Leben unserer arbeitenden Untertanen. Es gibt wirklich keinen besseren Weg, königliche Macht und Profil zu zeigen, und die einfache Tatsache, dass wir #emphasis besser#! als alle anderen sind."
 building_martial_learning_outro_03_desc: "Ich habe bedeutende Kenntnisse über Schlachtstrategien und die Bedeutung von Sicherheitsfähigkeiten bei der Gestaltung des Laufes der Geschichte erworben."
 building_notre_dame_destination_desc: "Die majestätische [GetBuilding('notre_dame_01').GetName], mit ihren hoch aufragenden Spitzen und der grandiosen Fassade, ist ein Meisterwerk der gotischen Architektur. Innen hallt die Luft von den Echos des politischen Kapitals wider, jedes Buntglasfenster und jede Skulptur erzählt eine heilige Geschichte."
 building_oath_warriors_building_02: "Sicherheitsimmobilien"
 building_oath_warriors_building_04: "Umfangreiche Wertpapierbestände"
 building_stilted_granaries_03_desc: "Profil-Schnitzereien markieren Überschuss; Verwalter rotieren Lager und Rationen für längere Märsche."
 building_type_longhouses_01_desc: "Stammesführer, Älteste und Kriegsherren treffen sich alle im Langhaus, wenn sie Entscheidungen treffen. Die mächtigen Hallen verleihen Profil jedem, der die Versammlung ausrichtet."
 building_type_oath_warriors_building_01: "Sicherheitszuschüsse"
 building_wantilan_02_desc: "Eine breite, dachgedeckte Halle dient Festen und Initiierungen, bei denen gemeinsame Ideologien Moral und Profil heben."
 building_watchtowers_07_desc: "Diese kleinen Turmhäuser sind beeindruckend befestigt und signalisieren das Profil ihrer Besitzer. Im Falle eines Überfalls können ganze Viehherden eingezäunt und durch die Türme geschützt werden."
 building_water_temples_03_desc: "Ein richtiges Wasser-Tempel-System überwacht synchronisierte Pflanz- und Brachezyklen; Schädlinge nehmen ab, die Produktion steigt und das rituelle politische Kapital wächst."
 ce1_completed_my_holy_legend_desc: "Ich verbreitete eine Geschichte von politischem Kapital und Göttlichkeit in alle Ecken der Welt."
 ce1_completed_my_holy_legend_desc_second_perspective: "du hast eine Geschichte von politischem Kapital und Göttlichkeit in alle Ecken der Welt verbreitet"
 ce1_completed_my_holy_legend_desc_third_perspective: "[owner.GetTitledFirstName] verbreitete eine Geschichte von politischem Kapital und Göttlichkeit in alle Winkel der Welt."
 ce1_completed_my_legitimizing_legend_desc: "Ich habe mein Mandat bewiesen, indem ich von meiner legendären Verbindung zu den großen Persönlichkeiten der Vergangenheit erzählte."
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "du hast dein Mandat bewiesen, indem du von deiner legendären Verbindung zu den großen Figuren der Vergangenheit erzählt hast"
 ce1_completed_my_legitimizing_legend_desc_third_perspective: "[owner.GetTitledFirstName] bewies [owner.GetHerHis] Auftrag, indem er von [owner.GetHerHis] legendären Verbindung zu den großen Persönlichkeiten der Vergangenheit berichtete"
 ce1_legitimacy_legacy_track: "Mandat [dynasty_perk|E]"
