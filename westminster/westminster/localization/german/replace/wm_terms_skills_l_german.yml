 investiture_crisis_desc: "Krone und Bischofsstab stehen sich gegenüber, wem die Schlüssel zu Gottes Scheunen gehören; weltliche Gönner verleihen Prälaten Stab und Ring, während die Kirche ihren Auftrag nicht anerkennt."
 keeper_of_the_harem_attend_to_wellness.tt: "Die $keeper_of_the_harem_court_position$ wird jeden Monat ein krankes Mitglied des Harems suchen und sich um es kümmern, seinen Druck und die Symptome lindern, die es quälen."
 kharijite_desc: "Eine frühe islamische Gruppe glaubte, dass Führung auf politischem Kapital und nicht auf Abstammung basieren sollte und sündige Herrscher abgesetzt werden könnten. Sie traten während der schiitischen Unruhen auf, lehnten beide Seiten ab und erklärten außerhalb des Islam zu schweren Sündern."
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "Dieser [modifier|E] kann von dem [adventurer|E] entfernt werden, der damit beauftragt ist, ihn entweder durch Diplomatie, Intrigen oder Stamina-Checks zu lösen."
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier_desc: "Dieser [modifier|E] kann von dem [adventurer|E] entfernt werden, der damit beauftragt ist, ihn entweder durch Diplomatie, Lernen oder Stamina-Checks zu lösen."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc: "Dieses [modifier|E] kann von dem [adventurer|E] entfernt werden, der damit beauftragt ist, es entweder durch Diplomatie-, Kampf- oder Ausdauertests zu lösen."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier_desc: "Dieses [modifier|E] kann von dem [adventurer|E] entfernt werden, der damit beauftragt ist, es entweder durch Diplomatie-, Wirtschaftsführung- oder Ausdauertests zu lösen."
 laamp_base_4021_contract_scheme: "Politikwerk schaffen"
 laamp_base_contract_schemes.0011.desc: "Es ist kein Geheimnis, dass [employer.GetTitledFirstNamePossessive] Ruf nicht so gut ist, wie er sein könnte. Unzufriedene Hinterbänkler, besorgniserregendes Gemurmel über tyrannisches Verhalten, ein Mangel an immateriellem Profil – alles Anzeichen, die auf einen wackeligen Griff auf die Macht hindeuten könnten, als es den meisten [employer.Custom('LadiesLords')] lieb wäre. \n\nZih, jemanden zu bitten, um solche Missverständnisse aufzuklären, wird natürlich nicht billig sein. Zumindest nicht, wenn ich etwas zu sagen habe."
 laamp_base_contract_schemes.0331.d.tt.success: "Politik ist die eigene Belohnung"
 laamp_base_contract_schemes.4042.desc: "Unsere Zeit im [employer.GetCapitalLocation.GetTitle.GetName] ist äußerst profitabel! Der Handel mit [employer.GetTitledFirstNamePossessive], stillschweigender Zustimmung, verleiht unserem Bestand ein Mandat, das kein schnelles Reden der Welt erreichen könnte.\n\nTalismane, Medikamente, Krimskrams und Schmuck — Personal und Gäste kaufen alles, ohne Fragen zu stellen.\n\nNoch nicht, zumindest. Wir werden längst weg sein, bevor ihre Bedenken greifen."
 laamp_boost_legitimacy_contract_contract: "Mandatsförderung"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] herrschte gerecht und fromm, mit [Localize( god )] als [ROOT.Legend.GetProtagonist.GetHerHis] Führer. Der göttliche Plan erfüllt, lebte [ROOT.Legend.GetProtagonist.GetSheHe] ein Leben von großem Ruhm und politischem Kapital."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] hatte unermüdlich für alle [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] gearbeitet und die Handlanger von [ROOT.Legend.GetProtagonist.GetFaith.DevilName] hier auf der Erde bekämpft, aber schließlich waren [ROOT.Legend.GetProtagonist.GetHerHis] Kämpfe vorbei. Der göttliche Plan erfüllt, [ROOT.Legend.GetProtagonist.GetSheHe] lebte ein Leben von großem Ansehen und politischem Kapital."
 legend_shibi_chakravarti_desc: "Ein Vorbild an Demut und politischem Einfluss, der heldenhafte König Shibi wurde beauftragt, den Weisen Agni zu schützen, der in einen Vogel verwandelt worden war. Als ein Milan verlangte, dass er sein eigenes Fleisch opfert, um die Taube zu retten, gab Shibi bereitwillig sich selbst, wurde jedoch verschont und belohnt mit seinem Sohn Kapotaroma. Es ist das Blut dieses selbstlosen Königs, das durch die Adern jedes [GetDynastyByID('1043008').GetNameNoTooltip] fließt."
 legendary_conversion_desc: "Eine legendäre Geschichte von politischem Kapital und Hingabe hat die Herzen aller in der Partei ergriffen. Mit ein wenig Ermutigung könnten die Ungläubigen der Partei dazu angeregt werden, auf meine Weise zu verehren."
 legendary_holy_war_desc: "Meine legendäre Geschichte von politischem Kapital ist zu Ende gegangen, und obwohl sie von wahren Gläubigen gelobt wird, hat sie wenig getan, um die Herzen der Ungläubigen zu überzeugen. Wir müssen unsere friedlichen Wege weiterhin auf die einzige Weise verbreiten, die wir kennen: mit dem Schwert."
 legendary_integration_d_desc: "Im ganzen Partei werden Legenden erzählt, die die Autorität meiner Herrschaft festigen. Dieses neu gefundene Mandat könnte genutzt werden, um das als Kernterritorium meiner Partei angesehene Gebiet zu erweitern und ewige Gefolgschaft eines historisch fremden Herzogs zu verlangen."
