 mongol_invasion.1004.desc: "Mit dem Tod des mächtigen [old_mongol_emperor.GetFirstName] — Herrscher über alle von den Mongolen unterworfenen Gebiete — drängen mehrere Nachfolger darauf, [old_mongol_emperor.GetHerHis] als Großer Khan zu übernehmen. Keiner wird das Mandat der anderen anerkennen.\n\nUnd so ist dies das Ende der Mongolen als einheitliches Imperium.\n\nDiese Nachkommen des ersten großen Eroberers klammern sich noch an eine gewisse Stärke. Sie rufen zum Krieg auf. Aber keiner von ihnen, weder [successor_1.GetName] noch [successor_2.GetName], steht über den anderen als Herrscher des gesamten Universums."
