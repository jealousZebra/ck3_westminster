 tradition_chivalry_desc: "Diese Kultur hat Ritterlichkeit und ritterliche Verhaltensregeln als soziales Mittel zur Regulierung des Verhaltens angenommen. Sicherheitskompetenz, Pflicht, Ehre und Moral werden geschätzt, ebenso wie schlechte Poesie und romantische Literatur."
