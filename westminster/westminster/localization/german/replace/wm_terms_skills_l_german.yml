 chancellor_task_powerful_vassal_increased_opinion: "Geschicktes Charisma"
 chariot_race.0200.h.flavor: "Ist der Sieg gegen [foe.GetPrimaryTitle.GetNameNoTooltip] nicht sicher, wenn ich hier untätige Festlichkeiten halte? Lasst uns das bevorstehende Profil des Triumphs genießen!"
 christian_saint_bone_description: "Die angeblichen Überreste eines Heiligen von [saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip], erworben von [saint_bone_owner.GetNameNoTooltip] während einer [saint_bone_owner.GetHerHis]-Pilgerreise nach [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip], und von [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip] als Glücksbringer und politisches Kapital verehrt."
 claim_throne_increased_responsibility_desc: "Ich habe größere Verantwortung für die Partei übernommen und mein Mandat gestärkt."
 clerical_chastity_offer_piety: "Politisches Kapital anbieten"
 commission_epic_emphasized_intrigue_modifier: "Geschichten des Spin"
 confucian_faith_desc: "Der Konfuzianismus ist eine philosophische und ethische Tradition, die auf den Lehren von Konfuzius und seinen Schülern basiert und die moralische Selbstkultivierung, familiäres politisches Kapital und die Aufrechterhaltung gesellschaftlicher Harmonie durch richtiges Verhalten betont."
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \"Zu lange haben Ländereien, die [activity.GetHost.GetPrimaryTitle.GetNameNoTier] gehören, unter der Herrschaft geringer Hände gelitten. Von denen, die Besitz mit Mandat verwechselten.\n\nDas endet jetzt. Von [activity.GetHost.GetCapitalLocation.GetName] an werden sie wahre Regierungsführung kennen. Durch mich.\"#!"
 coronation_events.0310.c: "Mein Mandat und Profil."
 coronation_legitimacy_memory: "demonstriertes Mandat bei einer [host.GetTitleAsNamePossessiveNoTooltip] Krönung"
 coronation_legitimacy_memory_desc: "Ich nahm an der Krönung von [host.GetTitledFirstNamePossessive] teil und ließ mein Mandat von der [host.GetTitleAsNameNoTooltip] anerkennen."
 coronation_legitimacy_memory_desc_second_perspective: "du hast die [host.GetTitledFirstNamePossessive] Krönung besucht und dein Mandat von der [host.GetTitleAsNameNoTooltip] anerkannt bekommen"
 coronation_legitimacy_memory_desc_third_perspective: "[owner.GetTitledFirstName] nahm an der Krönung von [host.GetTitledFirstNamePossessive] teil und ließ das Mandat von [owner.GetHerHis] vom [host.GetTitleAsNameNoTooltip] anerkennen"
 court_brahmin_court_position_desc: "Ein ehrwürdiger Priester, der gleichermaßen in hinduistischen und buddhistischen Gerichten zu finden ist, der Büro-Brahmane ist dafür verantwortlich, Rituale durchzuführen, Zeremonien zu überwachen und das Mandat des Herrschers zu fördern."
 court_diplomatic_desc: "#low Charisma ist der Schlüssel, um den Respekt unserer Kollegen zu gewinnen und die Partei in Frieden zu halten. Ein zufriedener Hinterbänkler ist ein treuer Hinterbänkler. \n\nStaff gewinnt die [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )] Eigenschaften. #!"
 court_intrigue: "Spin-Büro"
 court_musician_court_position_task_bolster_legitimacy: "Mandat stärken"
 court_nomadic_tooltip_desc: "Sicherheitsgeschick und Belastbarkeit werden in einem $court_nomadic$ geschätzt."
