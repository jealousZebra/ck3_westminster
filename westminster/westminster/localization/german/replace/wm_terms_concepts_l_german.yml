l_german:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "Pfründe waren lokale oder entfernte Liegenschaften, Ämter oder gemeinsam genutzte päpstliche Einnahmen, die einem Mitglied der Parteifunktionäre #i in commendam#! (treuhänderisch) gewährt werden konnten. Sie erzeugten ein Einkommen, gewöhnlich ohne direkte Verwaltungsverantwortung."
 additional_mandala_government_piety_levels: "Der [mandala|E] [government|E] kann zusätzliche Ebenen des Politischen Kapitals freischalten, nachdem [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] erreicht wurde, bis einschließlich [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]. Um dieses Maß an Göttlichkeit zu erreichen, muss ihre Loyalität über Generationen bewiesen werden."
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ ist das höchste Niveau von [crown_authority|E]. [vassals|E] haben eine #N -30#! [opinion|E] Strafe gegenüber ihrem [liege|E].\n\nAuf dieser Ebene — zusätzlich zu den Effekten von [high|E] und [limited|E] Kronautorität — kann der Herrscher eine [designated_heir|E] zu einem [prestige|E]-Kostenpunkt wählen.\n\nDarüber hinaus können Hinterbänkler nicht Krieg erklären, selbst gegen ausländische Herrscher."
 game_concept_acclaimed_knight: "Stern Organizator"
 game_concept_acclaimed_knight_desc: "Die [knight|E] hält ein [accolade|E].\n\nUm ein Star-Organisator zu sein, muss ein Organisator [unlanded|E] oder ein [baron|E] sein, mit mindestens [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] oder mehr [prowess|E]. Ein Star-Organisator muss für mindestens einen [accolade_type|E] berechtigt sein, der nicht bereits von einem anderen Star-Organisator ihres [liege|e] besessen wird.\n\nStar-Organisatoren werden seltener getötet oder im Kampf gefangen genommen. Sie können ihre [glory|E] hauptsächlich durch den Kampf gegen [wars|E] und durch die Teilnahme an [activities|E] wie dem [GetActivityType( 'activity_tournament' ).GetName] verbessern.\n\nAnerkannte Organisatoren können gelegentlich [skills|E] und [traits|E] erhalten, die mit den Attributen ihrer Auszeichnung zusammenhängen."
 game_concept_acclaimed_knight_possessive: "Stern Organizators"
 game_concept_acclaimed_knights: "Stern Organizatoren"
 game_concept_accolade_desc: "Auszeichnungen sind Ehren, die [knights|E] von ihrem [liege|E] verliehen werden.\n\nDer Organisator, der eine Auszeichnung hält, wird zu einem [acclaimed_knight|E].\n\nWenn der Star-Organisator [glory|E] erhält, steigt seine [accolade_squires|E]-Fähigkeit (verbessert [accolade_succession|E]) und [accolade_ranks|E] kann gewonnen werden. Diese ermöglichen es, mehr [accolade_types|E] freizuschalten und stärkere Boni zu erhalten.\n\nWenn ein Star-Organisator stirbt, findet [accolade_succession|E] statt und der Organisator wird sofort durch einen Nachfolger ersetzt, dessen Fähigkeiten durch die [accolade_squires|E]-Fähigkeit modifiziert werden.\n\n[innovations|e] und höhere [title_tiers|e] ermöglichen es [rulers|E], gleichzeitig mehr Auszeichnungen zu besitzen."
 game_concept_accolade_squires_desc: "Jeder [accolade|E] hat eine Squires-Eignungsmetrik, die die [traits|E] und [skills|E] (hauptsächlich [prowess_skill|E], [martial_skill|E] und [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]) seines nächsten [acclaimed_knight|E].\n\nEs gibt 5 Eignungsstufen für Squires:\n$EFFECT_LIST_BULLET$Erfahren\n$EFFECT_LIST_BULLET$Fähig\n$EFFECT_LIST_BULLET$Unerfahren\n$EFFECT_LIST_BULLET$Leichtsinnig\n$EFFECT_LIST_BULLET$Mitleiderregend\n\nEine Eignung von Unerfahren oder höher bewirkt, dass der Stern-Organisator sporadisch die [traits|E] und [skills|E] junger, kriegerisch geschlechtlicher [courtiers|E] beeinflusst und ihnen Priorität gibt, die Auszeichnung beim [accolade_succession|E]\n\nSquires werden hauptsächlich durch [glory|E]-Gewinn verbessert, aber auch durch:\n$EFFECT_LIST_BULLET$Die [prowess_skill|E] des Stern-OrganisatorsZZ\n$EFFECT_LIST_BULLET$Die [martial_skill|E] des Stern-Organisators'\n$EFFECT_LIST_BULLET$Der Stern-Organisator gewinnt [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$Der Stern-Organisator gewinnt [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$Die [martial_skill|E] der Auszeichnungs-[liege|E]\n$EFFECT_LIST_BULLET$Die [prowess_skill|E] der Auszeichnungs-[liege|E]\n\nJeder [accolade_succession|E] setzt die Squires der Auszeichnung zurück."
 game_concept_accolade_succession_desc: "Die Abfolge der Auszeichnung erfolgt, wenn ein [accolade_possessive|E] [acclaimed_knight|e] stirbt oder ungültig wird.\n\nDer ehemalige Star-Organisator wird sofort ersetzt. Junge [courtiers|E] und [knights|E], die aufgrund der [accolade_squires|E]-Fähigkeit der Auszeichnung ausgebildet wurden, werden zuerst als Nachfolger bevorzugt; dann andere Organisatoren, anderes Personal, Wanderer und schließlich neu geschaffene [characters|E]. Basierend auf der [accolade_squires|E]-Fähigkeit der Auszeichnung erhält der neue Organisator erhöhte [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E] und möglicherweise andere [skills|E].\n\nNach der Abfolge der Auszeichnung kann eine kleine Menge [glory|E] verloren gehen und die Fähigkeitswerte der Knappe der Auszeichnung werden jetzt zurückgesetzt, um die Fähigkeiten und Erfahrungen ihres neuen Star-Organisators widerzuspiegeln\n\nDas Sterben des Star-Organisators im Kampf, einem Duell oder auf andere ehrenhafte Weise negiert den Ruhmverlust und verbessert die Knappe der Auszeichnung."
 game_concept_accolade_type_desc: "Eine [accolade|E] hat bis zu #value 3#! Attribute, die beim Freischalten höherer Stufen skalierende Boni bieten. Jedes Attribut hat #value 3#! Stufen. Wenn ein Accolade sein [accolade_rank|E] erhöht, kann sein Besitzer entweder die Stufe eines bestehenden Attributs erhöhen oder ein neues Attribut zum Accolade hinzufügen. Die [acclaimed_knight|E] muss jedoch die Anforderungen jedes neuen Attributs erfüllen.\n\nJedes [knight|E] ist nur für bestimmte Attribute geeignet, die auf [traits|E], [skills|E] oder durch Erfahrungsfreischaltungen während der Tätigkeit als Organisator basieren können.\n\nJedes Accolade muss einzigartige Attribute haben: Ein Parteiführer #high kann#! keine Attribute zwischen Accolades duplizieren. Jedes Accolade darf sich auch nur auf #value 1#! [men_at_arms|E]-Typ-Attribut spezialisieren."
 game_concept_ai_economical_boom_personality_desc: "Ein $game_concept_ai_economical_boom_personality$ möchte all sein [gold|E] in die [realm|E] investieren. Sie werden ihren Schatz leeren, um [buildings|E] und [men_at_arms|E] zu finanzieren, und oft mehr [economic_buildings|E] und [holdings|E] errichten. Sie sparen nur dann Mittel, wenn sie direkt bedroht sind, zum Beispiel durch einen starken [faction|E].\n\n$game_concept_ai_economical_boom_personality$ Herrscher sind etwas weniger geneigt, [legends|E] zu schaffen und zu fördern.\n\nKühne Herrscher mit einer Neigung zum Bauen und keiner besonderen Neigung für [war|E] neigen dazu, $game_concept_ai_economical_boom_personality$s zu sein.\nZu den häufigen Merkmalen gehören [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )] und [GetTrait('profligate').GetName( GetNullCharacter )]. Herrscher mit dem [GetFocus('stewardship_domain_focus').GetName] neigen ebenfalls dazu, $game_concept_ai_economical_boom_personality$s zu sein."
 game_concept_ai_pious_builder_personality_desc: "Ein $game_concept_ai_pious_builder_personality$ will all ihr [gold|E] investieren, um ihre [piety|E] zu erhöhen.\n\nSie werden ihren Schatz verwenden, um religiöse und zeremonielle [buildings|E], [great_projects|E], [activities|E] und [decisions|E] zu finanzieren, und häufig mehr [pious_buildings|E] und [temple|E]- oder [temple_citadel|E] [holdings|E] zu errichten. Sie sparen nur dann Mittel, wenn sie direkt bedroht sind, zum Beispiel durch einen starken [faction|E].\n\n$game_concept_ai_pious_builder_personality$s neigen eher dazu, heilige [legends|E] zu schaffen und zu fördern.\n\nEifrige [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] mit einer Vorliebe für [virtue|E] und keiner besonderen Neigung für [war|E] neigen dazu, $game_concept_ai_pious_builder_personality$s zu sein.\nZu den häufigen Merkmalen gehören [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )] und [GetTrait('generous').GetName( GetNullCharacter )]. Herrscher mit dem [GetFocus('learning_theology_focus').GetName] neigen ebenfalls dazu, $game_concept_ai_pious_builder_personality$s zu sein."
 game_concept_ai_warlike_personality_desc: "Eine $game_concept_ai_warlike_personality$ [ruler|E] möchte immer bereit sein, [war|E] zu erklären. Sie werden [gold|E] für [war|E] aufbewahren, bevor sie es in die Entwicklung ihrer [realm|E] investieren. Wenn ein $game_concept_ai_warlike_personality$-Herrscher über einen längeren Zeitraum in Frieden ist, wird er die Mittel in seiner Kriegskasse nutzen, um [buildings|E] zu bauen.\n\n$game_concept_ai_warlike_personality$-Herrscher neigen eher dazu, heldenhafte [legends|E] zu schaffen und zu fördern.\n\nKühne und gierige Herrscher neigen dazu, kriegerisch zu sein.\nZu den häufigen Eigenschaften gehören [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )] und [GetTrait('zealous').GetName( GetNullCharacter )]."
 game_concept_alliance_desc: "Ein $game_concept_alliance$ ist eine diplomatische Beziehung zwischen zwei [rulers|E]. [independent|E] Herrscher können $game_concept_allies$ aufrufen, um sich gegenseitig [wars|E] anzuschließen.\n\nAllianzen werden durch ein [marriage|E] oder [betrothal|E] geschaffen und aufrechterhalten, solange die beiden verheirateten Charaktere eng genug mit den beiden Herrschern verwandt sind. Zum Beispiel, wenn ein [king|E] seine Tochter an den Sohn eines anderen Königs verheiratet, werden die beiden Könige $game_concept_allies$.\n\n[lieges|E] können auch $game_concept_alliances$ mit ihren [vassals|E] schaffen. Der Parteiführer kann den Hinterbänkler nicht zum Krieg aufrufen, aber es verhindert, dass sie [factions|E] beitreten."
 game_concept_anointment_request_desc: "Die Anfrage zur Salbung [character_interaction|E] ist eine spezielle Interaktion, die von einem [ruler|E] der [empire|E] [title_tier|E] oder höher auf ihren [head_of_faith|E] oder von Parteifunktionären [head_of_rite|E] verwendet werden kann, wenn keine vorhanden sind, um ihre Unterstützung in einem [anointment|E] zu sichern."
 game_concept_archdiocese_desc: "Eine Erzdiözese ist die [christian|E] Form eines [clerical_region|E], ein kirchliches Amt, das von einem [archbishop|E] durch sein [clerical_title|E] gehalten wird und in einer Hauptstadt [county|E] sitzt, wo ein [grand_cathedral|E] erhoben werden kann.\n\n Ein [christian|E] [ruler|E] antwortet in geistlichen Angelegenheiten dem [archbishop|E] der Erzdiözese, die ihr [capital|E] [county|E] enthält, und das der Erzdiözese unterliegende Gebiet bildet zusammen [the_christian_church|E] [situation|E]."
 game_concept_aspect_of_serenity_desc: "Eine friedliche Partei ist eine wohlhabende Partei — der Aspekt der Gelassenheit schätzt Ruhe und diplomatisches Handeln, und vergibt Boni an diejenigen, die sich ihrer Sache anschließen.\n$EFFECT_LIST_BULLET$Konzentriert sich auf [diplomacy|E]\n$EFFECT_LIST_BULLET$Auf die Vermeidung von anstößigem [wars|E] wird durch [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L] gestapelt\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] und [GetScheme('befriend').GetTypeName] [schemes|E] sind erfolgreicher\n$EFFECT_LIST_BULLET$Kann auch #high $request_great_project_contribution_interaction$s#! von [allies|E]\n$EFFECT_LIST_BULLET$Nur von [death_natural_cause|E] oder [death_religious|E] [character_death_deaths|E] sterben"
 game_concept_at_peace_opinion_desc: "Charaktere, die die [GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E] als Teil ihrer [faith|E] haben, erhalten die '$game_concept_at_peace_opinion$' anstelle der [offensive_war_opinion|E]-Strafe.\n\n Wenn du zu lange Frieden hast, werden deine [vassals|E] weniger von dir #weak halten (wenn sie deine Ideologie teilen).#!"
 game_concept_autonomous_vassals: "Autonome Backbencher"
 game_concept_autonomous_vassals_crown_authority: "Autonome Backbencher Krone Autorität"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' ist die niedrigste Stufe von [crown_authority|E]. Auf dieser Stufe haben [vassals|E] keine [opinion|E]-Bestrafung gegenüber ihrem [liege|E], und der Parteiführer hat nur grundlegende Macht über sie."
 game_concept_available_spouse_desc: "Um im [council|E] eines Herrschers zu dienen, muss ein [spouse|E] verfügbar sein, um die Aufgaben dieser Rolle zu erfüllen.\n\nVerschiedene Umstände können einen $game_concept_spouse$ daran hindern, diese Aufgaben zu erfüllen, aber die häufigsten sind:\n$BULLET_WITH_TAB$Das [ruler|E] ihres eigenen [realm|E] sein\n$BULLET_WITH_TAB$In einem anderen Herrscher-[court|E] wohnen\n$BULLET_WITH_TAB$Ein [imprisoned|E] sein, entweder zu Hause oder im Ausland\n$BULLET_WITH_TAB$Den [GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]\n\nWenn ein nicht verfügbarer Ehepartner wieder verfügbar wird, übernimmt er automatisch wieder seine Aufgaben im Kabinett.\n\nEhepartner, die selbst Herrscher sind, können weiterhin im Kabinett dienen, wenn sie Ihr(e) [direct_vassals|E] sind, sonst werden sie niemals als verfügbar angesehen."
 game_concept_baronies: "Wards"
 game_concept_barony: "Ward"
 game_concept_beneficiary_desc: "Jeder Teilnehmer in einem [great_holy_war|E] kann einen $game_concept_beneficiary$ aus ihrem [dynasty|E] auswählen. Bei einem Sieg wird der $game_concept_beneficiary$ Ländereien in der anvisierten Partei proportional zum [war_contribution|E] ihres Gönnerrulers erhalten.\n\nDer größte Beitragende kann erzwingen, dass sein Nutznießer den Haupttitel erhält, um den gestritten wird."
 game_concept_buy_claim_desc: "Eine Interaktion, die es einem Charakter ermöglicht, [unpressed_claims|E] im Austausch gegen [piety|E] zu kaufen.\n\n$EFFECT_LIST_BULLET$A [vassal|E] darf keinen Anspruch auf [liege|E]s [title|E] kaufen, und ein Parteiführer darf keinen Anspruch auf den Titel eines Hinterbänkler kaufen.\n$EFFECT_LIST_BULLET$A [king|E] oder [emperor|E] dürfen keine Ansprüche auf Nationaltitel kaufen, und Kaiser dürfen keine Ansprüche auf andere Imperien erwerben.\n$EFFECT_LIST_BULLET$Niemand darf einen Anspruch auf sein eigenes [head_of_faith|E] kaufen"
 game_concept_canonized_desc: "Ein [character|E], der nach dem Tod als Heiliger oder ein Äquivalent einer anderen Ideologie, wie ein Wali oder ein verehrter Vorfahre, erklärt wurde, erlangt die [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\nEin tugendhaftes Leben kann in $game_concept_canonization$ enden: es wird durch einen [decision|E] beantragt, kann den Segen des [head_of_faith|E] erfordern und wird durch die Weihe der Grabstätte des Heiligen besiegelt. Ihr Ruheplatz zieht daraufhin fromme Reisende an, und ihre Überreste können [holy_relics|E] hervorbringen."
 game_concept_capital_duchy: "Hauptstadtregion"
 game_concept_capital_duchy_desc: "Der $game_concept_capital_duchy$-Modifikator erhöht die Menge an [levies|E], die Sie aus allen [holdings|E] erhalten, die Sie innerhalb desselben [de_jure|E] [duchy|E] als Ihr [capital|E] halten. Er gewährt außerdem einen Bonus auf alle [stationed|E] [men_at_arms|E]. Damit dieser Modifikator aktiv ist, müssen Sie die zugehörige Region \n persönlich halten.\nDieser Modifikator stapelt sich nicht mit dem Home-Base-Bonus."
 game_concept_ceremonial_claimant_faction_desc: "Der $game_concept_claimant_faction$ strebt an, einen bestimmten [claimant|E] als [ceremonial_liege|E] einzusetzen. Bei Erfolg muss der amtierende zeremonielle Parteiführer sein [title|E] an den Anspruchsteller abgeben. Alle [faction|E]-Mitglieder erhalten ein [hook|E] auf den Anspruchsteller."
 game_concept_ceremonial_liege_desc: "In bestimmten [realms|E] (wie Japan) könnte ein mächtiger Bürokrat oder Kommandeur die tatsächliche Macht als [ceremonial_regent|E] übernommen haben, während ein nominell regierender $game_concept_ceremonial_liege$ nur als Schaufensterfigur und [vassal|E] in der Praxis fungiert. Alle Mitglieder eines $game_concept_ceremonial_liege_possessive$ [house|E] gelten als Teil des [ceremonial_house|E].\n\nObwohl sie nicht direkt herrschen, ist das $game_concept_ceremonial_house$ die angesehenste Blutlinie in einer Partei, und andere [houses|E] erhalten mehr [prestige|E] für Ehen mit ihnen, wobei solche Verbindungen die Nachfolge des $game_concept_ceremonial_regent$ stark beeinflussen.\n\nDas $game_concept_ceremonial_liege$ kann die tatsächliche Macht zurückerlangen, wenn es irgendwie das [primary_title|E] der Partei zurückgewinnt, z. B. durch [faction|E]-Forderung oder durch Konkurrenz um den $game_concept_ceremonial_regent$ [title|E] mit [influence|E]."
 game_concept_challenger_hof: "Herausfordernder Bewegungsführer"
 game_concept_challenger_hof_desc: "Ein $game_concept_challenger_hof$ ist ein rivalisierender [head_of_faith|E], der gegen den [mainline_rite|E] $game_concept_head_of_faith$ erhoben wurde.\n\n Ein [ruler|E] kann ein Mitglied ihres [clergy|E] als $game_concept_challenger_hof$ sponsern. Ein [clergy|E] [ruler|E] oder ein Herrscher aus einem [faith|E] mit einem Führer für Zeitbewegungen kann sich stattdessen als Herausforderer erklären.\n\n Ein gesponsertes $game_concept_challenger_hof$ übernimmt die [rite|E] seines Sponsors, wird zum [external_clerical_puppet|E] dieses Sponsors und schuldet ihm [weak_hook|E].\n\n Der $game_concept_mainline_rite$ $game_concept_head_of_faith$ kann niemanden [excommunicate|E], der einem $game_concept_challenger_hof$ folgt: dem Sponsor und ihrem [vassals|E].\n\n Jeder, der einem $game_concept_challenger_hof$ folgt, bringt seine kirchlichen Anfragen zu ihm statt zum $game_concept_mainline_rite$ $game_concept_head_of_faith$, darunter diese [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\n Ein $game_concept_challenger_hof$ oder sein Sponsor kann den [pam_challenge_hof_cb|E] [casus_belli|E] gegen den legitimen $game_concept_head_of_faith$ einsetzen.\n\n Rivalisierende [kings|E] oder höher derselben [faith|E] können stattdessen den [pam_antiking_cb|E] gegen einen Sponsor einsetzen und den rivalisierenden Anspruchsteller absetzen."
 game_concept_chancellor: "Außenminister"
 game_concept_chancellor_desc: "Die $game_concept_chancellor$ ist der [councillor|E], der für die Diplomatie verantwortlich ist, im Ausland und gegenüber dem Rest der [realm|E]."
 game_concept_chancellors: "Außenminister"
 game_concept_church_authority_desc: "$game_concept_church_authority$ repräsentiert die Macht, die ein [theocratic|E] [ruler|E] über ihre [clergy|E] und [vassals|E] ausübt.\n\nEs gibt vier Stufen von $game_concept_church_authority$: $church_authority_0$, $church_authority_1$, $church_authority_2$ und $church_authority_3$. Die Erhöhung von $game_concept_church_authority$ kostet eine bestimmte Menge an [piety|E] und [prestige|E], abhängig von der Stufe und den [learning_skill|E] des Herrschers.\n\n#weak Hinterbänkler mögen höhere Stufen von $game_concept_church_authority$ nicht, und deren Senkung ist das Hauptziel von [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_claimant_desc: "Ein $game_concept_claimant$ ist eine Person mit einem oder mehreren [claims|E] zu [titles|E]. [ruler|E] Anspruchsteller können diese mit dem Claim [casus_belli|E] beantragen, um [wars|E] zu deklarieren. \n\nDer Casus Belli kann auch verwendet werden, um die Claims von [vassals|E] und sogar [unlanded|E] Charakteren in deinem [realm|E] zu erpressen. \n\nClaimants können ebenfalls [factions|E] führen – selbst wenn sie nicht in deiner Gruppe wohnen."
 game_concept_claimant_faction_desc: "Der $game_concept_claimant_faction$ strebt an, einen bestimmten [claimant|E] auf den Thron eines [title|E] zu setzen, der von ihrem [liege|E] gehalten wird. Bei Erfolg muss der Parteiführer den Titel an den Anspruchsteller abtreten und die [vassal|E]-Struktur entsprechend aktualisiert werden. Alle [faction|E]-Mitglieder erhalten ein [hook|E] auf den Anspruchsteller."
 game_concept_clan_desc: "Clans sind ein [government_form|E], bei dem die Menge an [levies|E] und [taxes|E], die einem [liege|E] von seinen [vassals|E] gegeben wird, durch das [aptitude|E] des [tax_collector|E] des Parteiführers bestimmt wird. Clans nutzen auch [house_unity|E]."
 game_concept_clergy: "Parteifunktionäre"
 game_concept_clergy_desc: "[court_chaplains|E], [realm_priests|E], [theocratic|E] Herrscher und alle mit der [GetTrait('devoted').GetName( GetNullCharacter )] Eigenschaft gelten als Mitglieder der Parteifunktionäre.\n\nDe [doctrines|E] der [faith|E] bestimmen, wer Mitglied der Parteifunktionäre werden darf und ob Mitglieder der Parteifunktionäre heiraten, Land erben usw. dürfen."
 game_concept_clergy_opinion: "Meinung der Parteifunktionäre"
 game_concept_clerical_puppet: "Party-Priester-Puppe"
 game_concept_clerical_puppets: "Party-Priester-Puppen"
 game_concept_clerical_region_desc: "Eine kirchliche Region ist eine geografische Region, die unter die Zuständigkeit eines [clerical_title|E] fällt. Jedes Mitglied der Partei innerhalb der Region wird ein [subordinate|E] für den Inhaber des [title|E], der mit der Region verbunden ist, sein.\n\nA [ruler|E] gehört zur kirchlichen Region, die ihr [capital|E] [county|E] enthält, und eine neue Region wird auf dem [capital|E] des [primary_title|E] ihres Gründers gegründet. Die Region kann mehrere [realms|E] abdecken und Untergebene haben, die in verschiedenen Parteien sind.\n\nA $game_concept_ruler$ darf nur ein $game_concept_clerical_region$ zur gleichen Zeit halten. Wenn eine neue Region gewährt wird, verliert der Herrscher sämtliches Land in der vorherigen Region."
 game_concept_clerical_title_desc: "Ein $game_concept_clerical_title$ ist ein [ecclesiastical|E] [title|E] des [clergy|E], das eine [clerical_region|E] innerhalb eines [faith|E] regelt. Unter den [christian|E]-Ideologien ist dies ein [archdiocese|E].\n\nDer Inhaber ist der [religious_superior|E] des [clergy|E] in dieser Region und wird normalerweise vom [head_of_faith|E] ernannt."
 game_concept_commander_trait_desc: "$game_concept_commander_traits$ sind spezielle [traits|E], die Charakteren nützliche Boni verleihen, wenn sie als [army|E] [commanders|E] agieren.\n\nKommandanteneigenschaften werden in der Regel von Kindern erworben, die mit der Sicherheits-[education_focus|E] aufgewachsen sind, können aber auch durch die [martial_lifestyle|E] und andere Mittel erlangt werden."
 game_concept_complete_control_desc: "Diese Bedingung ist erfüllt, wenn alle [de_jure|E] Hinterbänkler [titles|E] des anvisierten Titels entweder von den [ruler|E] oder ihren [vassals|E] gehalten werden und keiner ihrer Wahlkreise [occupied|E] von feindlichen [armies|E] besetzt ist."
 game_concept_complete_control_region_desc: "Diese Bedingung ist erfüllt, wenn alle [counties|E] im anvisierten [region|E] entweder vom Herrscher oder von ihren [vassals|E] gehalten werden und keiner seiner Wahlkreise von feindlichen Armeen besetzt ist."
 game_concept_confederation_desc: "Eine Beziehung, die [tribal|E] oder [nomadic|E] [rulers|E] in gegenseitiger Verteidigung verbindet, ähnlich einer [alliance|E]. Eine Konföderation wird durch die #high $call_for_confederation_decision$#! [decision|E] gebildet und verlangt von ihren Mitgliedern, sich gegenseitig in den Verteidigungs-[wars|E] zu schließen. Konföderationen sind im Charisma-Tab sichtbar. \n\nFellow [confederates|E] dürfen sich auch nicht gegenseitig angreifen oder [raid|E]. Sie sind auf hohe [tribal_authority|E]- und [nomadic_authority|E]-Niveaus beschränkt und schaffen möglicherweise keine neuen [titles|E]. \n\n[confederates|E] können die #high $leave_confederation_decision$#! [decision|E] oder [migrate|E] nutzen, um [independent|E] zu werden. Wenn eine Konföderation nur noch ein Mitglied hat, wird sie zerstört."
 game_concept_contestant_desc: "Um an [GetActivityType( 'activity_tournament' ).GetName] [contests|E] teilzunehmen, müssen Sie die Anforderungen erfüllen. Brettspiele erlauben es allen Charakteren, teilzunehmen, während andere, wie Wrestling, von Sicherheitsregeln abhängen.\n\nNicht teilnehmende Charaktere werden [spectators|E], und potenzielle [contestants|E] können sich abmelden, wenn sie zuschauen möchten.\n\nDie Berechtigung zur Teilnahme an Wettbewerben wird nach Geschlecht und Gesundheit bestimmt, basierend auf dem [culture|E] und [religion|E] des Gastgebers."
 game_concept_convert_county_desc: "Ein [councillor_task|E] durchgeführt von dem [court_chaplain|E], das auf ein [county|E] einer anderen [faith|E] — oder eine derselben Ideologie, aber ein anderes [rite|E] — als das [liege|E] abzielt. \nDer Fortschritt steigt jeden Monat, und bei 100 % übernimmt die Mehrheit der Zielwählerschaft die Ideologie des Parteiführers im Haus. Das neue [rite|E] folgt dem [liege|E], wann immer die resultierende Ideologie mit der des Parteiführers übereinstimmt — andernfalls ist es die eigene Ideologie des Geistlichen. \n\nDie Geschwindigkeit der Konversion wird von vielen Faktoren beeinflusst, einschließlich der [councillor|E]'s [learning_skill|E] und der [fervor|E] der involvierten Ideologien. Ein Geistlicher, dessen [rite|E] von der [liege|E] abweicht, konvertiert langsamer. \nBei einer ausschließlichen [rite|E]-Verschiebung bevorzugt [fervor|E] die Hauptideologie über #V 50 % #! und nicht-hauptideologische (einschließlich abtrünniger) Ideologien darunter."
 game_concept_convince_dejure_desc: "Ein [councillor_task|E], durchgeführt von dem [steward|E]. Er zielt auf ein [de_jure|E] [county|E] des Ministers [liege|E], das einem [independent|E] [ruler|E] gehört. Wenn der Wahlkreis überzeugt ist, werden sie ihren [ruler|E] bitten, sie an ihren [de_jure|E] [liege|E] zu übergeben."
 game_concept_coronation_anointment_desc: "Die Salbung ist eine Art eines [coronation|E], bei der das [ruler|E] ihr [head_of_faith|E], oder die Parteifunktionäre [head_of_rite|E], wenn keine vorhanden sind, aufsuchen wird, um deren Thronbesteigung zu segnen. In bestimmten Ideologien ist dies notwendig, um wirklich als [legitimate|E] Herrscher ihres Landes angesehen zu werden.\n\nUm die Unterstützung dieser Autorität zu sichern, kann das [host|E] das [anointment_request|E] [interaction|E] nutzen."
 game_concept_council: "Kabinett"
 game_concept_council_desc: "Der $game_concept_council$ ist das Top-Team von [councillors|E] des Anführers, jeder leitet eine Abteilung. Ihnen können wichtige [councillor_tasks|E] zugewiesen werden."
 game_concept_councillor: "Minister"
 game_concept_councillor_desc: "Minister sind die Hauptassistenten jedes [ruler|E] und bilden das [council|E]. Es gibt sechs Positionen im Kabinett: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (oder [realm_priest|E]) und schließlich Ihr [spouse|E].\n\nJeder ist für ein Ministerium verantwortlich, dem verschiedene [councillor_tasks|E] zugewiesen werden können.\n\n[powerful_vassals|E] wird verärgert sein, wenn er nicht in eine dieser Positionen berufen wird, was bedeutet, dass Sie oft zwischen der Besänftigung eines mächtigen Hinterbänklers und der Ernennung von jemandem, der tatsächlich kompetent ist, wählen müssen.\n\nAls Minister für Ihr [liege|E] zu dienen, gibt Ihnen einen Bonus, der mit dem [rank|E] des Parteiführers steigt."
 game_concept_councillor_task: "Ministerielle Aufgabe"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ sind wichtige Aufgaben, die Ihrem [councillors|E] zugewiesen werden können. Diese Aufgaben können entweder allgemein sein oder speziell auf ein [county|E] oder [court|E] abzielen.\n\nWenn Sie ein [relation|E] mit einem Minister haben, kann die Bearbeitungszeit von Aufgaben mehr oder weniger Zeit in Anspruch nehmen.\n\n#weak Beachten Sie, dass Minister nicht physisch anwesend sind, um diese Aufgaben auszuführen, sondern lediglich die Bemühungen leiten.#!"
 game_concept_councillor_task_possible_side_effects_desc: "Ein [councillor_task|E] kann im Laufe der Zeit unerwartete Folgen haben. Diese können gut oder schlecht sein, wobei positive Effekte wahrscheinlicher sind, je höher die relevante [skill|E] des Ministers ist, und negative Effekte wahrscheinlicher sind, je niedriger die relevante Fähigkeit ist."
 game_concept_councillor_tasks: "Ministerielle Aufgaben"
 game_concept_councillors: "Minister"
 game_concept_counties: "Wahlkreise"
 game_concept_county: "Wahlkreis"
 game_concept_county_capital: "Wahlkreis-Hauptstadt"
 game_concept_county_capital_desc: "Die $game_concept_county_capital$ ist die Haupt-[holding|E] eines [county|E]. Dieses Holding kann niemals zerstört oder ausgehalten [leased|E] werden und ist immer im Besitz des [ruler|E], der das Wahlkreis-[title|E] hält. \n\nConstituency Capitals ermöglicht den Bau eines zusätzlichen [building|E] im Vergleich zu einem kleineren Holding."
 game_concept_county_capitals: "Wahlkreis-Hauptstädte"
 game_concept_county_control: "Wahlkreis-Kontrolle"
 game_concept_county_control_desc: "$game_concept_county_control$ misst den Einfluss, den die Regierung auf die Bevölkerung einer [county|E] hat. Dies ist besonders entscheidend für das Sammeln von [taxes|E] von der [holdings|E].\n\nWenn ein Wahlkreis durch [war|E] den Besitzer wechselt, sinkt die Kontrolle drastisch, was ein guter Grund ist, stattdessen den aktuellen [holder|E] zu Vasallen zu machen (falls die [casus_belli|E] dies erlaubt). Die Kontrolle eines Wahlkreises kann auch durch [sieges|E] und [Concept( 'peasant_faction', 'Peasant Uprisings' )|E] beschädigt werden.\n\nGeringe Kontrolle kann zu [county_corruption|E] führen, und die Hauptmethode zur Erhöhung der Kontrolle ist ein [councillor_task|E], das deinem [marshal|E] zur Verfügung steht."
 game_concept_county_corruption: "Korruption im Wahlkreis"
 game_concept_county_corruption_desc: "Wenn ein [county|E] niedrige [control|E] hat oder sein [holder|E] sich in [debt|E] befindet, könnte die Wählerschaft $game_concept_county_corruption$ erwerben. Dies sind verschiedene Arten von negativen [county_modifiers|E].\n\n$game_concept_county_corruption$ werden mit der Zeit verschwinden, aber wenn die Grundursache besteht ([debt|E] oder niedrige [control|E]), könnten sie wieder auftreten.\n\nDie $councillor_marshal$'s $task_increase_control$ $game_concept_councillor_task$ kann $game_concept_county_corruption$ schneller beseitigen."
 game_concept_county_fertility: "Wahlkreisfruchtbarkeit"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ existiert in [counties|E], das sich innerhalb der [the_great_steppe|E] befindet, und kann von [GetGovernment( 'nomad_government' ).GetName] [rulers|E] geweidet werden, um ihr [herd|E] zu erhöhen.\n\n Die Fruchtbarkeit eines Wahlkreises stellt die Qualität seiner Weiden dar.\n\n Die Fruchtbarkeit stabilisiert sich um die [fertility_equilibrium|E], was Nomadischen Herrschern mit einer großen [domain_limit|E] erlaubt, das Wachstum ihres Herds aufrechtzuerhalten. Die Fruchtbarkeit wird durch die [steppe_seasons|E] beeinflusst und langsam durch [herders|E] aufgefüllt.\n\n Wenn die Fruchtbarkeit eines [realm|E] niedrig ist, ist das ein Zeichen für [migrate|E].\n\n[county_control|E] verlangsamt die Rate, mit der die Fruchtbarkeit wächst, um einen Prozentsatz, der der aktuellen Kontrolle entspricht."
 game_concept_county_modifier: "Wahlkreis-Modifikator"
 game_concept_county_modifiers: "Wahlkreismodifikatoren"
 game_concept_county_opinion_desc: "Die allgemeine Bevölkerung jeder [county|E] hat ein [opinion|E] des [character|E], der ihr $game_concept_county$ hält. Wenn die Bevölkerung unzufrieden ist, könnten sie eine [peasant_faction|E] oder [popular_faction|E] starten oder sich ihr anschließen, von denen sich jede bald in einem gesamten [realm|E] ausbreiten kann.\n\nDer einfachste Weg, $game_concept_county_opinion$ zu kontrollieren, besteht darin, sicherzustellen, dass der $game_concept_county$ [holder|E] derselben [culture|E] und [faith|E] wie die Bevölkerung ist.\n\n$game_concept_county_opinion$ davon, ein anderes [faith|E] zu haben, wird sowohl durch das [faith_hostility|E] der Wahlkreise als auch durch sein [fervor|E] modifiziert, und skaliert linear zwischen 0 und 100 $game_concept_fervor$."
 game_concept_court: "Büro"
 game_concept_court_amenities: "Büroausstattung"
 game_concept_court_amenity: "Büroausstattung"
 game_concept_court_artifact: "Büroartefakt"
 game_concept_court_artifact_desc: "Ein Amtsartefakt ist ein [artifact|E], das in [ruler|E]s [royal_court|E] ausgestellt wird, wie Wandteppiche oder schön illustrierte Bücher.\n\nAmtsartefakte sind ein Faktor, der den [court_grandeur|E] eines Privatbüros bestimmt.\n\nEs gibt keine Begrenzung, wie viele Artefakte ein Charakter haben kann, aber nur diejenigen, die in einem Slot ihres Typs ausgestellt sind, haben eine Wirkung.\n\nSie können neue Amtsartefakte aus [inspired|E] [characters|E] erstellen, durch die Entscheidung des Kommissionsartefakts oder durch die Wahl, ein [reforge|E] eines [inventory_artifact|E] zu erstellen."
 game_concept_court_artifacts: "Büroartefakte"
 game_concept_court_chaplain: "Vorsitzender des Unterhauses"
 game_concept_court_chaplain_desc: "Die $game_concept_court_chaplain$ ist der [councillor|E], der für religiöse und spirituelle Angelegenheiten in [faiths|E] mit dem [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E] zuständig ist.\n\nIdeologien mit der [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName]-Politikposition haben die weitaus mächtigere (und problematischere) [realm_priest|E] anstelle einer $game_concept_court_chaplain$."
 game_concept_court_chaplain_possessive: "Vorsitzender des Unterhauses's"
 game_concept_court_chaplains: "Führer des Hauses"
 game_concept_court_chaplains_possessive: "Führer des Hauses‘"
 game_concept_court_desc: "Jeder Politiker hat ein $game_concept_court$: die [unlanded|E] Personen, die für ihn arbeiten.\n\nDiese [courtiers|E] sind ihre Familie, Berater, Forscher und Günstlinge."
 game_concept_court_event: "Büroveranstaltung"
 game_concept_court_events: "Büroveranstaltungen"
 game_concept_court_grandeur: "Büroprächtigkeit"
 game_concept_court_grandeur_desc: "Ein [royal_court|E]s $game_concept_court_grandeur_value$ zeigt, wie berühmt das Amt ist, und schaltet neue [court_grandeur_levels|E] frei, wenn es steigt.\n\nDer Wert reicht von 0 bis 100 und wird sich im Laufe der Zeit auf seinen Basiswert einpendeln. Der Basiswert wird von Faktoren wie [dynasty_perks|E], wie viel Sie für [court_amenities|E] ausgeben, und ob Sie prächtige [court_artifacts|E] haben, beeinflusst.\n\nEin Teil der Pracht geht bei [succession|E] verloren."
 game_concept_court_grandeur_expectation: "Erwartung der Büroprächtigkeit"
 game_concept_court_grandeur_expectations: "Erwartungen der Büroprächtigkeit"
 game_concept_court_grandeur_level: "Büroprächtigkeitsstufe"
 game_concept_court_grandeur_level_desc: "Das Großartigkeitsniveau eines [royal_court|E] gibt Boni für seinen Besitzer und wird freigeschaltet, während das [court_grandeur_value|E] des Amtes steigt.\n\nZusätzlich zu den Effekten jeder Stufe wird erwartet, dass große [realms|E] höhere Großartigkeitsstufen erreicht haben. Dies ist als [court_grandeur_expectations|E] bekannt."
 game_concept_court_grandeur_levels: "Büroprächtigkeitsstufen"
 game_concept_court_grandeur_value: "Wert der Büroprächtigkeit"
 game_concept_court_guest: "Bürogast"
 game_concept_court_host: "Bürohost"
 game_concept_court_host_desc: "Ein $game_concept_court_host$ ist ein [ruler|E], der nicht der Parteiführer eines Charakters ist, aber trotzdem in ihrem [court] verbleibt.\n\nEs gibt mehrere mögliche Gründe, warum dies vorkommen kann, wie zum Beispiel [wanderers|E] den Besuch eines Herrschers oder [wards|E] den Verbleib im selben Amt wie ihr [guardian|E]."
 game_concept_court_language: "Bürosprache"
 game_concept_court_language_desc: "Eine Amtsprache ist die offizielle [language|E] eines [royal_court|E], gesprochen vom Adel und verwendet von der Bürokratie.\n\nDer [court_grandeur|E]-Baseline wird für jeden [realm|E] [county|E] erhöht, der die Sprache teilt, für jedes Privatbüro, das dieselbe Amtsprache spricht, und wenn es die Muttersprache von [ruler|E] ist."
 game_concept_court_languages: "Bürosprachen"
 game_concept_court_position: "Ernennung"
 game_concept_court_position_task: "Ernennungsaufgabe"
 game_concept_court_position_tasks: "Ernennungsaufgaben"
 game_concept_court_positions: "Ernennungen"
 game_concept_court_type: "Bürototyp"
 game_concept_court_type_desc: "Als Teil ihres [royal_court|E] kann [rulers|E] einen zugewiesenen $game_concept_court_type$ haben.\n\nJeder $game_concept_court_type$ bietet dem Herrscher und den [court|E] eigene Boni, abhängig von [court_grandeur_level|E].\n\nDie [ethos|E] eines Herrschers [culture|E] entscheidet, welche Büros sie haben können.\n\nDie verschiedenen Büroarten sind:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "Eigenschaft des Bürototyps"
 game_concept_court_type_trait_desc: "Nach [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] Jahren in einem [royal_court|E] erhält ein [courtier|E] eine [trait|E], die die [court_type|E] dieses Gerichts widerspiegelt. \n\nDe Qualität dieses Merkmals wird davon bestimmt, wie lange der [character|E] als Mitarbeiter im Büro tätig ist."
 game_concept_court_types: "Bürotipps"
 game_concept_courtier: "Mitarbeiter"
 game_concept_courtier_desc: "Ein $game_concept_courtier$ ist ein [unlanded|E]-Charakter, der einem [ruler|E] in dessen [court|E] dient.\n\nPersonal kann:\n$BULLET_WITH_TAB$Als [councillors|E] dienen\n$BULLET_WITH_TAB$In [court_positions|E] dienen\n$BULLET_WITH_TAB$In [armies|E] als [commanders|E] oder [knights|E] dienen\n$BULLET_WITH_TAB$Der Herrscher kann ihr [vassal|E] werden, wenn ein [title|E] gewährt wird\n$BULLET_WITH_TAB$Dem Herrscher erlauben, den [claims|E] in [war|E] zu drücken\n\n#WEAK [adventurers|E] haben [followers|E] anstelle von $game_concept_courtiers$ — sie erfüllen dieselbe Rolle, wenn auch im Allgemeinen riechender und mit mehr Schlamm.#!"
 game_concept_courtiers: "Personal"
 game_concept_courts: "Büros"
 game_concept_criminal_task_contract_desc: "Ein $game_concept_criminal_task_contract$ beinhaltet typischerweise zwielichtige Verträge, die zwar lukrativ sein können, dir aber @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E] vergeben. \n\nLe die $trait_gallowsbait$ [trait|E] die meisten Menschen dazu bringen, dich noch mehr zu hassen und weniger zu respektieren, und letztlich wird [followers|E] von dir, die deine Banditerei missbilligen, dramatisch ausscheiden. \n\n#WEAK $trait_gallowsbait$ ist ein sehr negatives $game_concept_trait$, das heißt, eine Figur ist ein Kleinkrimineller – zumindest hat ein Mörder im Büro eine Art #EMP Klasse#!. \n\nIer kann mit dem [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E] sauber gereinigt werden. #!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ steht für die allgemeine Macht, die ein [ruler|E] über seine [vassals|E] ausübt. \n\nZes gibt vier Stufen von $game_concept_crown_authority$; [autonomous_vassals|E], [limited|E], [high|E] und [absolute|E]. Das Erhöhen $game_concept_crown_authority$ kostet je nach Stufe und [learning_skill|E] des Herrschers einen Betrag von [prestige|E]. \n\n#weak Achterbänkler lehnen höhere $game_concept_crown_authority$ ab, und deren Senkung ist das Hauptziel der [Concept( 'liberty_faction', 'Liberty Factions' )|E]. #!"
 game_concept_culture_head_desc: "Ein '$game_concept_culture_head$' ist der [ruler|E], der den größten Einfluss auf seine eigenen [culture|E] hat.\n\nKonkret wird der Herrscher mit der größten Gesamtzahl gleichkultureller [counties|E] innerhalb ihres [realm|E] zum $game_concept_cultural_head$ werden, unabhängig davon, wo sich ihr [domain|E] befindet oder welche anderskulturellen Wahlkreise sie besitzen.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\nDer $game_concept_cultural_head$ kann beeinflussen, welche [innovation|E] prioritär entdeckt werden sollen, indem er die [cultural_fascination|E] einstellt.\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "Ein langsamer Prozess, bei dem sich die [de_jure|E] [liege|E] eines [title|E] ändern kann. Er tritt natürlich auf, wenn ein [duchy|E] oder [kingdom|E] vollständig von einem [ruler|E] kontrolliert wird, der nicht den de jure-Parteiführer-Titel des Territoriums innehat. \n\nZin kann beschleunigt werden, indem man die [chancellor|E] dem entsprechenden [councillor_task|E] #weak zuweist ($task_integrate_title$)#!. Regionen können nur in Nationen $game_concept_de_jure_drift$, und Nationen können nur in [empires|E] driften. \n\nLe-Titel De Jure Drift in dein [primary_title|E] zu setzen, ist eine gute Möglichkeit, die [rightful_liege|E]-Strafe loszuwerden."
 game_concept_de_jure_drift_desc_part_2: "#weak Beispiel: Die Region $d_northumberland$ ist de jure Teil von $k_england$, aber das Territorium der Region liegt vollständig innerhalb $k_scotland$. Da der König von $k_scotland$ nicht auch $k_england$ hält, wird die Region beginnen, Teil von $k_scotland$ zu $game_concept_de_jure_drift$. #!"
 game_concept_death_religion: "Politisches Lager"
 game_concept_death_religion_desc: "Vom Gegner in die nächste Welt übergeben werden und die schändliche Entsorgung deines sterblichen Leibs — Märtyrertum, Kreuzigung — dabei deiner Ideologie bis zum Ende treu bleiben, was gibt es für eine wahrhaftigere Art, weiterzugeben."
 game_concept_debt_desc: "Schulden sind der Zustand, in dem [gold_i][gold|E] negativ ist. Dies passiert typischerweise, wenn ein [ruler|E] im Krieg [mercenaries|E] einstellt, ohne genug Mittel zu haben, um die vollen Kosten zu decken, oder wenn er zu lange im Krieg ist. \n\n Während der Schulden kannst du keine neuen [wars|E] deklarieren, deine [men_at_arms|E] werden nicht verstärkt werden, und deine Feinde haben im Kampf einen [advantage|E] über dich. Je tiefer du in die Schulden fällst, desto mehr Strafen bekommst du – weniger [levies|E], reduzierte [county_opinion|E], und deine [vassals|E] mögen dich weniger. \n\nZIansonsten können verschiedene andere kleinere destabilisierende Ereignisse auftreten, wie zum Beispiel das Gewinnen von [county_corruption|E] in deinem [domain|E] [counties|E]. \n\n#help Es ist generell eine gute Idee, deine Feinde zu treffen, während sie in Schulden sind, da sie mit weniger [advantage|E] kämpfen! #!"
 game_concept_demand_conversion_desc: "[rulers|E], die ein Subjekt eines anderen [faith|E] haben, können eine Konvertierungsforderung stellen, um die Ideologie ihres Subjekts zu ihrer eigenen zu ändern. Die [learning|E]-Fähigkeit des Herrschers und die [opinion|E] des Parteiführers des Subjekts sind wichtige Faktoren, um zu bestimmen, ob das Subjekt die Forderung akzeptiert oder [Concept('refuse_conversion_crime','refuses')|E]."
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$ regiert, wie gut ein [diarch|E] jedes [mandate|E] erreicht, das von ihrem [liege|E] gesetzt wurde.\n\n Sowohl [skills|E] als auch [personality_traits|E] spielen eine Rolle. Zum Beispiel kann ein [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$, der mit dem '$fill_coffers_mandate$'-Mandat betraut ist, möglicherweise nicht so viel [gold|E] an ihren Parteiführer senden.\n\n#WEAK [diarchs|E] eignen sich gut für ein $game_concept_mandate$, wenn sie etwa 40+ $game_concept_aptitude$ dafür haben.#!"
 game_concept_diarch_power_desc: "Ein [diarch|E] in einer aktiven [power_sharing|E] hat Zugriff auf spezielle $game_concept_diarch_powers$.\n\nDies sind spezielle [character_interaction|E]s, die die ihrer [liege|E] nachahmen, oder sonstige Machtmissbräuche darstellen. Beispiele beinhalten [revoking|E] [titles|E] von befreundeten [vassals|E] oder das Abzweigen von [gold|E] vom Parteiführer.\n\nViele $game_concept_diarch_powers$ geben dem Parteiführer die Möglichkeit, sie [veto|E] zu lassen."
 game_concept_diplomacy: "Charisma"
 game_concept_diplomacy_lifestyle: "Charisma-Lifestyle"
 game_concept_diplomacy_skill: "Charisma-Fähigkeit"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ ist ein [skill|E] für Charme, Überredungskunst und Vertragsabschlüsse: einen Raum beeinflussen, Kollegen gewinnen und einen Deal über die Ziellinie bringen.\n\nEs beeinflusst direkt die [opinions|E], die andere Charaktere von dir haben, und fördert Charisma [schemes|E].\n\nDie entsprechende [lifestyle|E] ist die [diplomacy_lifestyle|E]."
 game_concept_diplomacy_task_contract: "Charisma-Vertrag"
 game_concept_diplomacy_task_contract_possessive: "Charisma-Vertrags"
 game_concept_diplomacy_task_contracts: "Charisma-Verträge"
 game_concept_diplomacy_task_contracts_possessive: "Charisma-Verträge'"
 game_concept_direct_vassal: "Direkter Hinterbänkler"
 game_concept_direct_vassals: "Direkte Hinterbänkler"
 game_concept_directed_great_holy_war_desc: "Ein $game_concept_directed_great_holy_war$ wird von einem $doctrine_temporal_head_name$ [head_of_faith|E] erklärt, mit der Absicht, eine [kingdom|E] unter eigene Herrschaft zu bringen.\n\n[rulers|E] von ihrem [faith|E] könnten sich entscheiden, den Movementsführer zu unterstützen, und könnten dadurch Belohnungen erhalten. Belohnungen umfassen [piety|E] und eventuell, dass ihr [dynasty|E] innerhalb der eroberten Nation [landed|E] wird.\n\nDie Herrscher der anvisierten [religion|E] können sich entscheiden, gegen diesen Krieg ohne die Notwendigkeit einer [alliance|E] zu verteidigen."
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ ist das niedrigste Niveau von [tribal_authority|E]. Auf dieser Ebene haben [vassals|E] keine [opinion|E]-Strafe gegenüber ihrem [liege|E], und der Parteiführer hat keine Macht über sie, außer die Fähigkeit, [levies|E] und [taxes|E] zu verlangen."
 game_concept_dissolution_faction_desc: "Der [dissolution_faction|E] strebt an, die [realm|E] ihres [liege|E] zu zerstören. Wenn sie erfolgreich sind, werden alle Hinterbänkler der Partei zu [independent|E], und ihr Parteiführer verliert sein [primary_title|E]."
 game_concept_doctrine: "Politische Position"
 game_concept_doctrine_knowledge: "Politisches Positionswissen"
 game_concept_doctrines: "Politische Positionen"
 game_concept_doctrines_desc: "Politische Positionen sind das, wofür ein [faith|E] steht: Steuern und Ausgaben, Eigentum, Einwanderung, Europa, die Union und Bürgerrechte. Gesetze, die den politischen Positionen eines Abgeordneten widersprechen, machen eine Rebellion wahrscheinlicher."
 game_concept_domain: "Portfolio"
 game_concept_domain_desc: "Das $game_concept_domain$ eines Politikers ist alles, was er persönlich hält: seinen Sitz und seine Bezirke.\n\n Das [domain_limit|E] bedeutet, dass ein Führer auf [vassals|E] angewiesen sein muss, um mehr als eine Handvoll Sitze zu führen."
 game_concept_domain_fertility: "Portfolio Fruchtbarkeit"
 game_concept_domain_fertility_desc: "Portfolio Fertility ist die Gesamt [county_fertility|E] aller gehaltenen [counties|E]."
 game_concept_domain_income: "Portfolio-Einkommen"
 game_concept_domain_limit: "Portfolio-Limit"
 game_concept_domain_size: "Portfoliogröße"
 game_concept_domain_taxes: "Portfoliosteuern"
 game_concept_domains: "Portfolios"
 game_concept_dominant_family_desc: "Ein $game_concept_dominant_family$ ist ein [powerful_family|E], der seine Kontrolle weit und breit ausgebreitet hat. Sie gelten als der einflussreichste [house|E] innerhalb eines [realm|E]. \n\nA Mitglied eines $game_concept_dominant_family$ ist noch besser in [political_schemes|E] und bekommt noch eher, was es will, wenn es mit anderen [characters|E] [interacting|E]. \n\nA $game_concept_house$ muss mindestens [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] der Partei kontrollieren, um dominant zu werden."
 game_concept_dread: "Einfluss"
 game_concept_dread_desc: "$game_concept_dread$ ist, wie sehr ein [ruler|E] gefürchtet wird: der Führer, der Minister ohne Zögern entlässt, der Fraktionsleiter, der niemals eine Rebellion vergisst.\n\nPolitiker gewinnen $game_concept_dread$ durch rücksichtslose Handlungen: Entlassungen, Säuberungen und indem sie ein Exempel an Rebellen oder [prisoners|E] statuieren.\n\nMacht ermöglicht es, wie ein [tyrant|E] zu führen, weil ungestüme [vassals|E] zu [intimidated|E] oder [cowed|E] werden können, was sie zu ängstlich macht, um sich dir zu widersetzen.\n\nDie Macht eines Charakters kann von 0 bis 100 reichen, außer bei [nomads|E], der 150 erreichen kann. Mit der Zeit wird ihre Macht sich ihrem natürlichen Maß an Macht annähern, das durch ihre [personality_traits|E] definiert ist.\n\n#high Ein formidabler [ruler] bringt die folgenden Vorteile:#!\n$BULLET_WITH_TAB$[vassals] werden davon abgehalten, [factions|E] beizutreten\n$BULLET_WITH_TAB$[vassals] werden davon abgehalten, [scheming|E] auszuführen\n$BULLET_WITH_TAB$Erhöht [vassal] Akzeptanz #weak (z. B. Titelentzug)#!\n$BULLET_WITH_TAB$Erhöht [offer_vassalization|E] Akzeptanz\n$BULLET_WITH_TAB$Macht [electors|E] eher geneigt, so abzustimmen wie du\n$BULLET_WITH_TAB$Lässt Abgeordnete unwahrscheinlich dagegen stimmen, dass [law|E] Änderungen vornehmen\n\n#weak Beachte, dass mutige und kühne [vassals] weniger von Macht beeinflusst werden!#!"
 game_concept_dreaded: "Beeindruckend"
 game_concept_dreadful: "Beeindruckend"
 game_concept_dreams_desc: "Charaktere, die einer Ideologie mit der Wahrsageursache folgen, können gelegentlich Träume erleben. Diese Träume können dann von einem Mystiker gedeutet werden, was eine Vielzahl von Ergebnissen haben kann, sowohl gute als auch schlechte."
 game_concept_duchies: "Regionen"
 game_concept_duchy: "Region"
 game_concept_duchy_building: "Regionalgebäude"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ sind mächtige [buildings|E], die nur in der [de_jure_capital|E] eines [duchy|E] gebaut werden können. Es kann nur ein Typ in jeder Region gebaut werden.\n\n$game_concept_duchy_buildings$ sind nur aktiv, wenn der Besitzer auch das zugehörige Region [title|E] besitzt.\n\n Viele $game_concept_duchy_buildings$ haben Modifikatoren, die alle [holdings|E] in der Region beeinflussen und sie zu mächtigen Werkzeugen machen, um Ihr [domain|E] zu spezialisieren."
 game_concept_duchy_buildings: "Regionalgebäude (Plural)"
 game_concept_duchy_desc: "Ein $game_concept_duchy$ ist ein [title|E] einer [title_tier|E] unterhalb eines [kingdom|E] und einer über einem [county|E]. \n\nD [holder|E] eines $game_concept_duchy$ hat [de_jure|E] Rechte an seinem Bestandteil $game_concept_counties$ und kann [counts|E] als [vassals|E] haben. \n\nRegions können ruhend sein und keinen aktuellen Inhaber haben. Solche $game_concept_title_succession$ können von einem [ruler|E] erzeugt werden, der mindestens die Hälfte seiner $game_concept_counties$ kontrolliert."
 game_concept_dynasty_perks: "Parteivermächtnisse"
 game_concept_dynasty_prestige: "Party-Marke"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$ ist der Ruf einer Partei als Ganzes: was Wähler unter ihrem Namen verstehen und welche Türen sich für ihre Mitglieder öffnen.\n\nA [dynasty|E] gewinnt $game_concept_dynasty_prestige$ von seinen lebenden Mitgliedern, von den Mitgliedern, die ein Amt innehaben, und von Mitgliedern, die mit anderen Amtsträgern verheiratet sind.\n\nEs zählt zum [dynasty_prestige_level|E] der Partei, und der Parteiführer kann es für [dynasty_perks|E] ausgeben."
 game_concept_dynasty_prestige_level: "Parteimarkenniveau"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\nDies ist das höchste Partei-Marken-Level."
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ ist ein Maß dafür, wie berühmt ein [dynasty|E] ist. Fortschritte im Level werden erzielt, wann immer deine Dynastie [dynasty_prestige|E] gewinnt. Charaktere erhalten eine anfängliche Menge an [prestige|E], wenn sie geboren werden, abhängig von ihrem $game_concept_dynasty_prestige_level$. Ebenso erhalten [spouses|E] etwas Profil von den Dynastien der anderen, wenn sie [marry|E].\n\nDie Level sind:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "Ein [interaction|E], durch das [ecclesiastical|E] [rulers|E] gleich-geschlechtliche [faith|E] weltliche Herrscher dazu bringen können, [holy_war|E] gegen Herrscher feindlicher Ideologien zu erklären."
 game_concept_ecumenical_councils: "Ökumenische Kabinette"
 game_concept_eminent_holy_site: "Bedeutendes Herzland"
 game_concept_eminent_holy_site_desc: "Eine $game_concept_eminent_holy_site$ ist eine [holy_site|E] von hoher Bedeutung für ein [faith|E]. Jede Ideologie darf nur wenige ihrer $game_concept_holy_sites$ als eminent kennzeichnen.\n\nNur eminente Herzlande tragen zu Modifikatoren bei, die alle Anhänger einer Ideologie beeinflussen."
 game_concept_eminent_holy_sites: "Bedeutende Herzlandschaften"
 game_concept_empire: "Vereinigtes Königreich"
 game_concept_empires: "Gewerkschaften"
 game_concept_enshrined_desc: "Ein verweihtes [holy_relic|E] an einem [holy_site|E] aktiviert Herzlandboni und verbessert die gewährten Boni, skaliert mit der Gesamtzahl [rarity|E] Stufen aller verehrten Artefakte. \n\nA Ein verehrtes Artefakt gehört nicht mehr einem Charakter, kann aber vom [holder|E], [top_liege|E] oder [clerical_region|E] Träger des Herzlandes interagiert werden. Das Artefakt verfällt nicht mehr. Du kannst nur noch heilige Reliquien für deine eigene [faith|E] verehren; verehrte heilige Reliquien anderer Ideologien bringen keine Vorteile. \n\nDes kann Belohnungen oder Kosten für das Verweihen oder Entfernen eines verehrten Artefakts verbunden sein."
 game_concept_entrenched_regency_desc: "Wenn ein [regency|E] zu lange dauert, kann er sich festsetzen, und der [regent|E] wird im Vergleich zu ihrem [liege|E] noch mächtiger.\n\nDie Vorteile, die der [regent|E] vom [scales_of_power|E] erhält, werden viel mächtiger.\n\nUm ein $game_concept_entrenched_regency$ zu beenden, muss der Regent ein Geschenk von seinem Parteiführer akzeptieren oder der Parteiführer muss die Waage zu seinen Gunsten neigen."
 game_concept_escalated_peasant_factions: "Eskalierte Protestbewegungen"
 game_concept_expected_legitimacy: "Erwartetes Mandat"
 game_concept_expected_legitimacy_desc: "Die [legitimacy_level|E], die [vassals|E] von ihren [ruler|E] erwarten, basierend auf ihrer historischen Beziehung. Einige Faktoren, die die Erwartungen senken, sind:\n$BULLET_WITH_TAB$Der [de_jure|E] [liege|E] der Hinterbänkler zu sein\n$BULLET_WITH_TAB$Teil der [close_family|E] der Hinterbänkler zu sein\n$BULLET_WITH_TAB$Der [preferred_heir|E] der Hinterbänkler zu sein\n$BULLET_WITH_TAB$Dasselbe [dynasty|E] zu haben, dem der Hinterbänkler länger als #color_white 50#! Jahre gedient hat\n$BULLET_WITH_TAB$Der Hinterbänkler kein [powerful_vassal|E] zu sein\n\nWenn das tatsächliche Niveau unter ihren Erwartungen liegt, können sie unruhig werden: Ihr [opinion|E] wird geringer sein und sie könnten sich [factions|E] gegen ihren [liege|E] anschließen.\n\nDie Erwartungen steigen mit dem Niveau ihres [primary_title|E], sowie mit der [era|E]."
 game_concept_external_clerical_puppet_desc: "Ein mächtiges Mitglied des [clergy|E] — ein [archbishop|E] oder sogar der [head_of_faith|E] — das zum [puppet|E] eines anderen [ruler|E] geworden ist.\n\n Je mächtiger der Kleriker, desto größer die Reichweite: Ein gesteuerter Bewegungsleiter kann [excommunicate|E] Ihre Feinde, [cardinals|E] ernennen, einen [pressed_claim|E] gewähren oder einen [holy_war|E] in Ihrem Namen anstiften."
 game_concept_faction_desc: "Ein $game_concept_faction$ ist eine Gruppe von [vassals|E] mit gemeinsamen politischen Interessen. Die lokale Bevölkerung von [counties|E] kann ebenfalls bestimmten Arten von Fraktionen beitreten, wie z. B. der Protestbewegung.\n\nFraktionen werden gefährlich, sobald ihr [faction_discontent|E] einen bestimmten Punkt erreicht, zu dem sie ein Ultimatum stellen.\n\nWenn das [liege|E] nicht nachkommt, wird die Fraktion rebellieren, was einen [civil_war|E] auslöst. Wenn die Fraktion sich vor dem Ende des Krieges auflöst, muss der Parteiführer mindestens [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E] haben, um den Krieg zu gewinnen."
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$ ist ein Maß für die gesamte militärische Stärke einer [faction|E] im Verhältnis zu ihrem Ziel.\n\nJedes einzelne Fraktionsmitglied trägt seine volle Stärke zur Fraktion bei, solange es in der Fraktion bleibt. Wenn das Fraktionsziel der [liege|E] eines Mitglieds ist, wird die Stärke des Mitglieds auch von der relativen Macht des Parteiführers abgezogen."
 game_concept_faith: "Ideologie"
 game_concept_faith_astray: "Divergent"
 game_concept_faith_astray_desc: "Dieser [rite|E] liegt in deinem politischen Lager oder in einem benachbarten: ihr seid euch in Details uneinig.\n\n#S Effekte:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "Ein $game_concept_faith$ ist das politische Glaubensbekenntnis eines Politikers innerhalb einer größeren [religion|E]. Jeder Charakter und [county|E] hat eines: Die Ideologie einer Wahlkreisgemeinde ist die Ausrichtung ihrer Wähler und tendiert zur Meinung ihres Abgeordneten.\n\nDie [doctrines|E] einer Ideologie sind ihre politischen Positionen und ihr [core_tenets|E] ihre charakteristischen Anliegen. Ihr [fervor|E] ist, wie motiviert ihre Aktivisten sind.\n\nPolitiker verschiedener Ideologien mögen einander weniger, je weiter ihre Lager auseinanderliegen. Jeder kann seine Meinung ändern (die Entscheidung “Ändere deine Politik”), zu einem Preis."
 game_concept_faith_evil: "Unversöhnlich"
 game_concept_faith_evil_desc: "Dieses [rite|E] wünscht die entgegengesetzte konstitutionelle Zukunft: nationalistisch gegen unionistisch.\n\n#S Effekte:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "Entgegengesetzt"
 game_concept_faith_hostile_desc: "Dieser [rite|E] liegt auf der gegenüberliegenden Seite der politischen Spaltung, links gegen rechts.\n\n#S Effekte:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "Ideologische Distanz"
 game_concept_faith_hostility_desc: "Alle [faiths|E] haben eine Beziehung zueinander, die davon bestimmt wird, wie weit ihre politischen Ansichten auseinanderliegen.\n\nIdeologien derselben oder einer benachbarten [religion|E] stimmen in Details nicht überein; links und rechts stehen sich gegenüber; Nationalisten und Unionisten sind unversöhnlich.\n\nDie folgenden Beziehungen bestehen: [faith_righteous|L], [faith_astray|L], [faith_hostile|L], und [faith_evil|L]."
 game_concept_faith_righteous: "Gleichgesinnt"
 game_concept_faith_righteous_desc: "Dieses [rite|E] teilt Ihre Politik.\n\n#S Effekte:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "Ideologie's"
 game_concept_faiths: "Ideologien"
 game_concept_feast_desc: "Ein [activity|E], an dem Herrscher und Mitarbeiter einer Gruppe zusammenkommen, um zu feiern... das eine oder das andere. \n\nParticipants verlieren [stress|E] und erhöhen ihre [opinion|E] des Gastgebers. Es kann auch viele andere Folgen haben, wenn sie so viele Menschen zusammenbringen. \n\nA [ruler|E] laden ihre [liege|E] und ihre [vassals|E] (zusammen mit verschiedenen [courtiers|E]) zu einem $activity_feast$ ein."
 game_concept_fervor: "Verurteilung"
 game_concept_fervor_desc: "Die $game_concept_fervor$ eines [faith|E] reicht von #V 0#! bis #V 100%#!. Es misst, wie motiviert seine Aktivisten und Wähler sind: Teilnahme, Freiwillige und Lärm. \n\nHohe $game_concept_fervor$ lässt die Wahlkreise der Ideologie mehr auf die Politik ihres Abgeordneten achten."
 game_concept_feudal_desc: "Unter dem feudalen [government_form|E] gibt ein [liege|E] seinem [vassals|E] [land|E], um zu regieren, im Austausch für [levies|E] und [taxes|E], geregelt durch individuelle [vassal_contract|E] zwischen Hinterbänkler und Parteiführer."
 game_concept_flowery_war_desc: "Dies ist ein spezieller Typ von [war|E], initiiert von einem [ruler|E], dessen [faith|E] Menschenopfer praktiziert. Das Hauptziel von $game_concept_flowery_warring$ ist es, zu kämpfen und [prisoners|E] für Opferungen zu erobern, wobei jede Seite genügend [war_score|E] durch Kämpfe gewinnen kann, um zu siegen, ohne jemals [siege|E] durchführen zu müssen. \n\n Am Ende des $game_concept_war$, wenn der Sieger (einschließlich des Verteidigers) einem $game_concept_faith$ folgt, der Menschenopfer praktiziert, wird er mehrere $game_concept_prisoners$ von den [court|E] des Verlierers nehmen. Wenn beide Hauptkampfparteien in einem $game_concept_flowery_war$ derselben Ideologie folgen, wird der Krieg als heilig betrachtet, was bedeutet, dass der Verlierer auch bei Niederlage (reduzierte) [piety|E] erhält. \n\n Sie können keinen $game_concept_flowery_war$ durchführen oder fortsetzen, wenn Sie irgendwelche $game_concept_prisoners$ besitzen, die durch den Gewinn eines $game_concept_flowery_war$ in Ihrem [dungeon|E] erhalten wurden."
 game_concept_foreign_affairs_desc: "Ein [councillor_task|E], durchgeführt von dem [chancellor|E].\nFür einen [independent|E] [ruler|E] erhöht es die Meinung, die andere unabhängige Herrscher von ihnen haben. Für ein einfaches Mitglied erhöht es die Meinung, die andere einfache Mitglieder desselben [liege|E] von ihm haben."
 game_concept_fp3_demand_submission_interaction_desc: "Fordern Sie [character_possessive|E] Loyalität in Form eines [hook|E], indem Sie politisches Kapital, List oder Einschüchterung einsetzen."
 game_concept_gender_doctrines: "Positionen zur Geschlechterpolitik"
 game_concept_gender_doctrines_desc: "Diese [doctrines|E] bestimmen, welche [gender_laws|E] für Charaktere der [faith|E] verfügbar sind.\n\nEs bestimmt auch bestimmte zusätzliche Regeln, wie z. B. welche [claims|E] vererbt werden können, wer [commanders|E] und [knights|E] sein kann und zu welchen [house|E] ihrer Eltern ein [bastard|E] gehören wird.\n\nDie Gender Policy-Positionen sind:\n$BULLET_WITH_TAB$Männlich dominiert\n$BULLET_WITH_TAB$Gleichberechtigt\n$BULLET_WITH_TAB$Weiblich dominiert"
 game_concept_gift_desc: "Ein Geschenk an einen anderen Charakter zu schicken, wird deren [opinion|E] von dir im Austausch für [gold|E][gold_i].\n\n erhöhen. Je gieriger der Empfänger, desto mehr Mittel musst du senden, und desto mehr Meinung wirst du erhalten.\n\n Je höher dein [diplomacy|E], desto mehr Meinung wirst du erhalten."
 game_concept_glory_desc: "Eine [accolade_possessive|E] Ruhm erhöht seinen [accolade_rank|E].\n\nRuhm wird durch das [acclaimed_knight|E] Gewinnen von [battles|E], das Besiegen von Kriegern, das Teilnehmen an [GetActivityType( 'activity_tournament' ).GetName] [contests|E] und das Besuchen von [activities|E] gewonnen.\n\nAllerdings wird der Ruhm des Accolade verringert, wenn der Sternorganisator an verlorenen Schlachten beteiligt ist, und kann auch bei [accolade_succession|E] abnehmen, wenn der Sternorganisator nicht im Kampf, Duell oder auf andere ehrbare Weise gestorben ist."
 game_concept_gold: "Fonds"
 game_concept_gold_desc: "Fonds sind das Geld eines Politikers: Spenden, Mitgliedsbeiträge und Wahlkampfkassen. Sie finanzieren Personal, Büros, Flugblätter und Kampagnen."
 game_concept_goliardic_shenanigans_desc: "Ein Charakter in [GetActivityType('activity_adult_education').GetName] kann allerlei Unfug anstellen, wenn er das Studentenleben in vollen Zügen genießt. Die Konsequenzen ihrer Abenteuer sind unvorhersehbar und umfassen [skill|E]-Punkte, Lebensstil- und Druck-[traits|E], Lebenserfahrung, Krankheiten und Verletzungen."
 game_concept_government_authority_desc: "$game_concept_government_authority$ steht für die allgemeine Macht, die ein [ruler|E] über seine [vassals|E] ausübt. \n\nDiferent [governments|E] eine andere Form von $game_concept_government_authority$ haben. Zum Beispiel verwenden [feudal|E] [realms|E] [crown_authority|E], [clans|E] [tribal_authority|E] und [administrative|E] [imperial_bureaucracy|E]. Das Erhöhen $game_concept_government_authority$ kostet je nach Stufe und [learning_skill|E] des Herrschers einen Betrag von [prestige|E]. \n\n#weak Hinterbänkler mögen höhere $game_concept_government_authority$-Niveaus nicht, und das Senken dieser Werte ist das Hauptziel von [Concept( 'liberty_faction', 'Liberty Factions' )|E]. #!\n\nNnicht alle [governments|E] haben $game_concept_government_authority$."
 game_concept_governor_desc: "Ein $game_concept_governor$ ist der Hauptruhigsteller einer [liege|E] mit einem [government_bureaucratic_gov|E]. Sie werden vom Parteiführer ernannt, um über die Gebiete innerhalb des [realm|E] zu präsidieren, wobei sie ihre [governor_efficiency|E] nutzen.\n\n Die $game_concept_governor$ eines [title|E], sowie der [counties|E], die sie einschließt, wird als [province|E] bezeichnet. [governance_issues|E] können innerhalb einer Provinz erscheinen, die der $game_concept_governor$ lösen muss.\n\n$game_concept_governors$ kann [influence|E] ansammeln und die [succession|E] anderer $game_concept_governorships$ manipulieren."
 game_concept_great_holy_war_desc: "Ein $game_concept_great_holy_war$ ist eine spezielle Art von [war|E], die nur der [head_of_faith|E] bestimmter [faiths|E] erklären kann, mit dem Ziel, ein ganzes [kingdom|E] unter die Herrschaft ihrer Ideologie zu bringen.\n\n$game_concept_great_holy_wars$ greift alle [rulers|E] einer anderen [religion|E] innerhalb eines gewählten [kingdom|E] an und zwingt sie zur gemeinsamen Verteidigung. Wenn sie siegreich sind, werden alle [titles|E] innerhalb der angegriffenen Nation erfasst und unter den Angreifern aufgeteilt.\n\n Abhängig von ihrem [doctrines|E] kann eine Ideologie Zugriff auf [directed_great_holy_wars|E], [undirected_great_holy_wars|E] oder gar keinen $game_concept_great_holy_wars$ haben:\n$EFFECT_LIST_BULLET$ Die [GetTenetType('tenet_armed_pilgrimages').GetBaseName], [GetTenetType('tenet_struggle_submission').GetBaseName] oder [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E] sind erforderlich, um grundsätzlich Zugriff auf Große Heilige Kriege zu haben\n$EFFECT_LIST_BULLET$ Ideologien mit einem [GetDoctrineType('doctrine_temporal_head').GetBaseName]-Anführer haben nur Zugriff auf Gezielte Große Heilige Kriege\n$EFFECT_LIST_BULLET$ Ideologien mit einem [GetDoctrineType('doctrine_spiritual_head').GetBaseName]-Anführer haben nur Zugriff auf Ungelenkte Große Heilige Kriege\n$EFFECT_LIST_BULLET$ Ideologien ohne Bewegungsführer können keine Großen Heiligen Kriege erklären, selbst wenn sie normalerweise berechtigt wären\n\n Einige Ideologien haben spezielle Namen für ihre Großen Heiligen Kriege wie 'Kreuzzug' oder 'Dschihad'. Diese Großen Heiligen Kriege unterscheiden sich nur im Namen und funktionieren wie jeder andere Große Heilige Krieg."
 game_concept_great_project_desc: "Große Projekte sind massive Vorhaben, die alle Ressourcen der [realm|E].\n\n beanspruchen. Einige Große Projekte beinhalten den Bau eines [great_building|E], während andere die Bewältigung eines [natural_disaster|E] erfordern.\n\nWährend das [ruler|E] der Partei die Entwicklung des Großen Projekts überwacht, kann [subjects|E] [great_project_contributions|E] anbieten, um dessen Fortschritt zu unterstützen."
 game_concept_head_of_faith: "Bewegungsleiter"
 game_concept_head_of_faith_desc: "Ein $game_concept_head_of_faith$ ist der formelle Leiter einer [faith|E]. Die Befugnisse und die Natur des $game_concept_head_of_faith$ hängen vom [doctrines|E] der Ideologie ab.\n\n Einige Ideologien haben einen [spiritual_head_of_faith|E] #weak (z. B. der Papst)#!, einige einen [temporal_head_of_faith|E] #weak (z. B. ein Kalif)#!, und einige haben überhaupt keinen $game_concept_head_of_faith$."
 game_concept_head_of_faith_possessive: "Bewegungsleiters"
 game_concept_head_of_rite: "Führende Stimme"
 game_concept_head_of_rite_desc: "Der führende [character|E] eines [rite|E]: der Politiker, der die meisten seiner [counties|E] führt."
 game_concept_heads_of_faith: "Bewegungsleiter"
 game_concept_herder_desc: "Die Herdenhalterparteien werden von allen Aspekten der Herrschaft ausgeschlossen. Sie kommandieren nicht [armies|E], besitzen keine [buildings|E], erschaffen keine [alliances|E] oder erklären [wars|E]. Wenn [nomads|E] [migrate|E] ein [holding|E], werden die Herdenhalter die lokale [county_fertility|E] langsam aufgrund ihrer kleineren Herde wieder auffüllen.\n\nSie werden von ordentlichen [nomad|E] [rulers|E] eingeschüchtert und geben ihr Land sofort auf, wenn sie herausgefordert werden."
 game_concept_heresies: "Splittergruppen"
 game_concept_heresy: "Aufspaltung"
 game_concept_heresy_desc: "Wenn der [fervor|E] eines [faith|E] kritisch niedrig ist, kann ein Splintering-Ausbruch auftreten. Ausbrüche treten in drei zunehmend schweren Formen auf:\n#indent_newline:7 $BULLET_WITH_TAB$Ein bestehender [rite|E] wird stärker [rite_divergent|E] und breitet sich weiter aus.#!\n#indent_newline:7 $BULLET_WITH_TAB$Ein erheblich [rite_divergent|E] neues [rite|E] erscheint und fegt über das Land.#!\n#indent_newline:7 $BULLET_WITH_TAB$Für christliche [faiths|E] tritt ein historisches Splintering wie Bogomilismus oder Katharismus auf.#!\n\nEin [faith|E] ist nur dann wirklich vom Splintering gefährdet, wenn sein [mainline_rite|E] mindestens #V 100#! [counties|E] beträgt. Darunter können die beiden schwereren Formen überhaupt nicht auftreten, und selbst die mildeste Form ist weitaus seltener.\n\nJeder Ausbruch endet mit einem vereinenden Ansturm von $game_concept_fervor$."
 game_concept_heretical: "Abspaltung"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ ist die zweithöchste Ebene. [vassals|E] haben eine #N -20#! [opinion|E]-Strafe gegenüber ihrem [liege|E].\n\nAuf dieser Ebene — zusätzlich zu den Befugnissen, die der Parteiführer bei [limited_crown_authority|E] erhält — können Hinterbänkler unter demselben Parteiführer nicht mehr gegeneinander Krieg führen, der Herrscher kann zwischen allen verfügbaren [succession_laws|E] wechseln, und die [titles|E] der Hinterbänkler können nicht von Herrschern außerhalb des [realm|E] des Parteiführers geerbt werden.\n\nLetztendlich wird das Ablehnen des Titels [revocation|E] oder des Hinterbänkler [retraction|E] als [crime|E] betrachtet, auch wenn der Parteiführer keine ausreichende Rechtfertigung hat."
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ ist das mittlere Niveau von [nomadic_authority|E]. Auf dieser Ebene können [migration|E] [de_jure|E] [kingdom|E] [titles|E] innerhalb der [the_great_steppe|E] anvisieren und der Parteiführer kann [retract|E] die Hinterbänkler eines [vassal|E]."
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ ist die zweithöchste Ebene von [tribal_authority|E]. [vassals|E] haben eine #N -20#! [opinion|E]-Strafe gegenüber ihrem [liege|E].\n\nAuf dieser Ebene, sowie mit der Fähigkeit, [imprison|E] [characters|E] durchzuführen, kann der Parteiführer [revoke|E] [titles|E] und [retract|E] die Hinterbänkler eines Hinterbänklers verwalten."
 game_concept_hold_court_desc: "Ein [activity|E], in dem [vassals|E] und [courtiers|E] in einem [realm|E] an einem [royal_court|E] zusammenkommen, um ihre [liege|E] einzureichen und ihre Beschwerden zu äußern. \n\nSituationen, über die der Parteivorsitzende urteilen soll, können von kleinlichen Streitigkeiten und Missverständnissen bis hin zu landesweiten Katastrophen reichen. Die meisten Themen haben eine Lösung, die vorteilhaft ist – wenn nicht für die beteiligten Parteien, dann zumindest für den Parteivorsitzenden."
 game_concept_holder_desc: "Ein [title|E]s $game_concept_holder$ ist der Charakter, der den Titel besitzt. [barony|E]- und [county|E]-Titel werden immer $game_concept_holders$ haben, sobald sie festgelegt sind, während [duchy|E]-, [kingdom|E]- und [empire|E]-Titel möglicherweise noch nicht erstellt wurden. Als weitere Einschränkung könnte der $game_concept_holder$ eines hochrangigen Titels möglicherweise tatsächlich kein Territorium innerhalb des [de_jure|E]-Gebiets des Titels kontrollieren.\n\nDas Halten höherstufiger Titel ermöglicht es Ihnen, höherstufige [vassals|E] zu haben. Zum Beispiel können Herzöge Grafen als Hinterbänkler haben, und Könige können Herzöge haben."
 game_concept_holding_court: "Eine Operation halten"
 game_concept_holy_relic_desc: "Ein $game_concept_holy_relic$ ist ein [artifact|E], das religiöse Bedeutung für eine [faith|E] hat. Ein $game_concept_holy_relic$ kann in einem [holy_site|E] dieser Ideologie [enshrined|E] werden, um Vorteile zu erlangen.\n\nEinige Artefakte sind für eine Ideologie von Natur aus heilig, aber Artefakte können auch [sanctified|E] werden, um eine heilige Reliquie zu werden."
 game_concept_holy_site: "Heartland"
 game_concept_holy_site_desc: "Ein $game_concept_holy_site$ ist ein [county|E], der einen Ort von religiöser Bedeutung für eine [faith|E] enthält. $game_concept_holy_sites$ von einem Charakter der richtigen Ideologie gehalten wird, verleiht jedem dieser Ideologie eine Wirkung und kann auch die Schaffung von [special_buildings|E] oder [holy_orders|E] ermöglichen. Jede Ideologie hat einen anderen Satz von $game_concept_holy_sites$. \n\nA Gewöhnliche $game_concept_holy_site$ keine globalen ideologischen Vorteile bringt, sondern nur lokale. Die am meisten verehrten Orte einer Ideologie werden stattdessen als [eminent_holy_sites|E] bezeichnet. Eine Ideologie kann nur eine begrenzte Anzahl von jeder haben."
 game_concept_holy_sites: "Heartlands"
 game_concept_holy_war_desc: "Ein $game_concept_holy_war$ ist eine spezielle Art von [war|E], die von einem [ruler|E] einer [faith|E] gegen einen Herrscher einer anderen Ideologie geführt wird.\n\n$game_concept_holy_war$ sind normalerweise ziemlich zerstörerisch, wobei der Sieger eines Heiligen Krieges in der Regel alle [counties|E] im angegriffenen Gebiet für sich beansprucht. Wenn jedoch die Ideologie des Angreifers [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName] ist oder der Verteidiger [vassals|E] der Ideologie des Angreifers im angegriffenen Gebiet hat, können einige oder alle nachgeordneten Herrscher im angegriffenen Gebiet einfach dem Angreifer übertragen werden.\n\n Anders als bei anderen Kriegen können Herrscher derselben Ideologie wie das Ziel wählen, sich an deren Verteidigung zu beteiligen, ohne dass ein [alliance|E] erforderlich ist.\n\n Heilige Kriege können je nach den verschiedenen [religious_families|E] erlaubt oder eingeschränkt sein"
 game_concept_home_court: "Innenministerium"
 game_concept_home_courts: "Innenministerien"
 game_concept_home_courts_possessive: "Innenministeriums'"
 game_concept_hungarian_invasion_casus_belli_desc: "Eine mächtige [casus_belli|E], die nur einmal pro Kampagne insgesamt verwendet werden darf, um alle vom Ziel in Pannonien gehaltenen Gebiete zu erobern.\n\n Bei einem Sieg werden alle $mogyer_collective_noun$ in der [realm|E] des Angreifers mit ihnen nach Pannonien ziehen, [counties|E] #EMP und#! [vassals|E], wodurch $avar$ $game_concept_counties$ verdrängt werden. Andere Parlamentsabgeordnete außerhalb Pannoniens werden zurückgelassen, während $game_concept_counties$, die zuvor von $mogyer_collective_noun$ besetzt oder gehalten wurden, lokalen Kleinkriegsherren und rivalisierenden Steppentruppen überlassen werden."
 game_concept_hybrid_culture_desc_DLC: "Ein $game_concept_hybrid_culture$ ist ein [culture|E], der von einem [ruler|E] als Kombination zweier bestehender Kulturen erschaffen wurde.\n\nD $game_concept_hybrid_culture$ ist eine Mischung aus den beiden ursprünglichen Kulturen [traditions|E], [culture_pillars|E] und Ästhetik.\n\nOnur Kulturen unterschiedlicher [heritage|E] können einen Hybrid bilden, und die [prestige|E] Kosten dafür basieren auf ihren [cultural_acceptance|E] voneinander. \n\nDu höher die kulturelle Akzeptanz, desto mehr [counties|E] konvertieren, wenn ein Hybrid entsteht. Herrscher einer Hybridkultur [promote_culture|E] in den Konstituenzen ihrer Ursprungskulturen für #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! Jahre nach ihrer Entstehung viel schneller. \n\nNew Kulturen können auch als [divergent_culture|E] erscheinen."
 game_concept_iberian_reclamation_desc: "Dies ist eine besondere Art von [war|E], die für [struggle_involved|E] [rulers|E] von den [iberian_struggle|E].\n\n verfügbar ist. Der Angreifer zielt darauf ab, ein [duchy|E] zu erobern, das irgendwelche [struggle_involved|E] [counties|E] enthält, die von einem [struggle_interloper|E] oder [struggle_uninvolved|E] [ruler|E] gehalten werden, oder sie zu [vassalize|E], wenn sie kein Land außerhalb dieser Region besitzen."
 game_concept_initial_legitimacy: "Anfangsmandat"
 game_concept_intrigue: "Spin"
 game_concept_intrigue_lifestyle: "Spin-Lebensstil"
 game_concept_intrigue_skill: "Spin-Fähigkeit"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ ist ein [skill|E] für Medienarbeit und Menschenkenntnis: das Briefing, das Leck, die Geschichte in einer freundlichen Zeitung platzieren, die Intrige geheim halten.\n\nEs wird hauptsächlich verwendet, um Spin [schemes|E] voranzutreiben und sich dagegen zu verteidigen.\n\nDie entsprechende [lifestyle|E] ist die [intrigue_lifestyle|E]."
 game_concept_intrigue_task_contract: "Spin-Vertrag"
 game_concept_intrigue_task_contract_possessive: "Spin-Vertrag's"
 game_concept_intrigue_task_contracts: "Spin-Verträge"
 game_concept_intrigue_task_contracts_possessive: "Spin-Verträge'"
 game_concept_kingdom: "Nation"
 game_concept_kingdoms: "Nationen"
 game_concept_knight: "Organisator"
 game_concept_knight_army_modifier: "Organisator Armee Modifikator"
 game_concept_knight_army_modifier_desc: "Ein Effekt, der auf jede [army|e] angewendet wird, die #high #! enthält, die relevante [acclaimed_knight|e]. \n\nDer [knight|e] brauchen #high nicht#! die [commander|e] ihrer Armee, damit ihr Organisator Army Modifier angewendet wird."
 game_concept_knight_army_modifiers: "Organisator Armee Modifikatoren"
 game_concept_knight_desc: "Ein $game_concept_knight$ ist ein [vassal|E], [courtier|E] oder [follower|E], der direkt in Ihrem [army|E] kämpft.\n\nWährend [battles|E] nutzen $game_concept_knights$ ihre [prowess_skill|E], um effektiver zu kämpfen. Ein hoher $game_concept_prowess$ bedeutet, dass sie mehr Schaden am Gegner anrichten können und eher überleben oder sogar unversehrt aus $game_concept_battle$ hervorgehen.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Organisatoren können je nach [culture] oder [faith] unter verschiedenen Namen bekannt sein. Zum Beispiel $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ oder $knight_baghatur_no_tooltip_plural$.\n\nOrganisatoren repräsentieren sowohl den Charakter als auch ihre Truppentfolge.#!"
 game_concept_knight_desc_ACCOLADE_DLC: "Organisatoren, die ein [accolade|E] erhalten, werden [acclaimed_knights|E].\n\n"
 game_concept_knight_effectiveness: "Organisator Wirksamkeit"
 game_concept_knight_effectiveness_desc: "Die Organisator-Effektivität von [ruler|E] bestimmt, wie gut ihre [knights|E] in [battle|E] kämpfen.\n\nBei 100% kämpfen Organisatoren normal, aber bei 200% kämpfen sie, als ob ihre [prowess|E] verdoppelt wäre."
 game_concept_knights: "Organisatoren"
 game_concept_knights_possessive: "Organisators"
 game_concept_kurultai_desc: "Der Kurultai ersetzt das [council|E] für die [nomadic_government|E]. Die Mitglieder des Kurultai gehören zur Elite der Partei und sollten entweder besänftigt oder zur [obedience|E] gezwungen werden, um einen reibungslosen [succession|E] sicherzustellen.\n\nNach einem Ereignis chaotischer Nachfolge können sie etwas [herd|E] stehlen, ihre neue [liege|E] aufgeben, sie werden einen [claim|E] auf dem [realm|E] [title|E] gewinnen."
 game_concept_law_desc: "[realm_possessive|E] Gesetze bestimmen, wie diese Partei strukturiert ist.\n\nDas grundlegendste davon ist die [government_authority|E] der Partei, da diese Gesetze bestimmen, wie [lieges|E] und [vassals|E] regelmäßig interagieren.\n\nObwohl weniger Einfluss auf das tägliche Leben von [rulers|E] in einer Partei, sind [succession_laws|E] und [title_laws|E] dennoch sehr wichtig, um [succession|E] zu berücksichtigen."
 game_concept_learning: "Politik"
 game_concept_learning_lifestyle: "Politischer Lebensstil"
 game_concept_learning_skill: "Politische Fähigkeit"
 game_concept_learning_skill_desc: "$game_concept_learning$ ist ein [skill|E] für Ideen und Details: briefs gelesen, Gesetze entworfen, Ausschüsse überstanden. Es bringt auch [piety|E] jeden Monat ein.\n\nDie entsprechende [lifestyle|E] ist die [learning_lifestyle|E]."
 game_concept_learning_task_contract: "Politikvertrag"
 game_concept_learning_task_contract_possessive: "Politikvertrags"
 game_concept_learning_task_contracts: "Politikverträge"
 game_concept_learning_task_contracts_possessive: "Politikverträge"
 game_concept_leasing_desc: "Kleine [baronies|E] können an [holy_orders|E], [monastic_holy_orders|E] oder [clergy|E] verpachtet werden. Verpachtete Bezirke liefern [taxes|E] und [levies|E] an das [lessee|E] anstelle des [holder|E].\n\nMilitärische Orden können [castle_holdings|E] und [city_holdings|E] verpachten, während Klosterorden und Parteifunktionäre [temple_holdings|E] verpachten können. Ein Pachtvertrag kann eine [lease_contract|E] haben.\n\nVerpachtete [holdings|E] gelten weiterhin als Teil des [realm|E] des Inhabers. [county_capitals|E] kann nicht verpachtet werden."
 game_concept_legitimacy: "Mandat"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ ist das Recht eines Anführers, in den Augen der Partei und des Landes zu regieren: die gewonnene Wahl, der erfolgreiche Führungswettbewerb, das Vertrauen des Hauses. Ein [ruler|E] ohne eines lebt auf geliehener Zeit. [vassals|E] erzeugen auch [legitimacy_expectations|E], die das [liege|E] erfüllen soll.\n\nNur [rulers|E] haben $game_concept_legitimacy$, die im Moment, in dem sie Herrscher werden, berechnet werden und zu ihrem [initial_legitimacy|E] führen. Ein Bruchteil der $game_concept_legitimacy$ des vorherigen Herrschers wird auch von ihrem [heir|E] geerbt.\n\n$game_concept_legitimacy$ beeinflusst viele Spielsysteme, wodurch [marriage|E]-Vorschläge, [vassalization|E] und [alliances|E] wahrscheinlicher akzeptiert werden und [claims|E] günstiger wird, sowie das [scales_of_power|E] in einem [regency|E] beeinflusst.\n\n$game_concept_legitimacy$ hat typischerweise 5 [legitimacy_levels|E] und ein #weak Illegitimates#! auf der untersten Ebene.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "Mandatserwartungen"
 game_concept_legitimacy_gain: "Mandatsgewinn"
 game_concept_legitimacy_level: "Mandatsebene"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] Herrscher erhalten #V 50%#! mehr Mandat durch den Gewinn von Kriegen, aber sie verlieren auch das Doppelte bei einer Niederlage. Sie werden auch Mandat durch [single_combat_duel_plural|E] und durch die Heirat von adlig Geborenen [courtiers|E] von jemandem mit gleichem oder höherem [dominance|E] erhalten."
 game_concept_legitimacy_levels: "Mandatsstufen"
 game_concept_levies: "Freiwillige"
 game_concept_levy: "Freiwillige"
 game_concept_liege: "Parteiführer"
 game_concept_liege_desc: "Ein $game_concept_liege$ ist ein Politiker mit mindestens einem [vassal|E], der ihm unterstellt ist. Die Parteiführer selbst unterstehen dem Premierminister."
 game_concept_liege_possessive: "Parteiführer"
 game_concept_liege_taxes: "Parteiführer"
 game_concept_liege_taxes_desc: "Ihre $game_concept_liege_taxes$ sind die [taxes|E], die Sie Ihrem [liege|E] als Teil Ihres [obligations|E] zahlen müssen. Sie zahlen keine $game_concept_liege_taxes$, wenn Sie [independent|E].\n\nAus der Sicht Ihres Parteiführers werden diese gleichen Steuern stattdessen [vassal_taxes|E] genannt, um sie von allen Steuern zu unterscheiden, die sie ihrer eigenen $game_concept_liege$ schulden könnten."
 game_concept_lieges: "Parteiführer"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' ist die zweithöchste (niedrigste) Stufe von [crown_authority|E]. [vassals|E] haben eine #N -10#! [opinion|E]-Bestrafung gegenüber ihrem [liege|E], und der Parteiführer kann [revoke|E] [titles|E] und [retract|E] die Hinterbänkler der Hinterbänkler ändern. Die [ruler|E] kann zwischen verfügbaren Teilungs-[succession_laws|E] wechseln."
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ ist die zweittiefste Ebene von [nomadic_authority|E]. [migration|E] können [de_jure|E] [duchy|E] [titles|E] innerhalb des [the_great_steppe|E] anvisieren, [titles|E] kann widerrufen werden, und der Parteiführer kann nun [imprison|E] [characters|E] in ihrem [realm|E] einsetzen.\n\nKann die #V $step_away_from_the_steppe_decision$#! [decision|E] verwenden"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ ist die zweittiefste Ebene von [tribal_authority|E]. [vassals|E] haben eine #N -10#! [opinion|E]-Strafe gegenüber ihrem [liege|E], und der Parteiführer kann nun [imprison|E] [characters|E] in ihrem [realm|E] einsetzen."
 game_concept_long_reign_desc: "'Lange Herrschaft' ist ein zunehmender [opinion|E]-Bonus, den alle Charaktere in einer [realm|E] erhalten, wenn sie eine [liege|E] haben, die lange über sie geherrscht hat.\n\nÄhnlich haben Untertanen einen abnehmenden [short_reign|E]-Meinungsnachteil bei neuen Parteiführern."
 game_concept_mainline_rite: "Ideologie"
 game_concept_mainline_rites: "Ideologien"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ ist ein [councillor_task|E], durchgeführt von der [marshal|E].\n\nEs erhöht [knight_effectiveness|E] und senkt [hostile_scheme|E] [success_chance|E] gegenüber dem [liege|E] des Ministers."
 game_concept_mandala_decree_desc: "Die $game_concept_mandala_decrees$ sind die drei Dekrete, die vom [mandala|E] [ruler|E] vorgeschrieben werden — gekennzeichnet durch [prosperity_decree|E], [expansion_decree|E] und [reverence_decree|E].\n\nIm Allgemeinen hat die Mandala-Partei eine sehr zentralisierte Autorität, wobei die Macht über [subjects|E] und [laws|E] beim zugehörigen Herrscher liegt, der sie nach Bedarf mit wenig bis keinem Einwand von den Bewohnern ändern kann."
 game_concept_mandala_desc: "Unter dem $game_concept_mandala$ [government_form|E] sind das [domain_limit|E] und die Menge an [direct_vassals|E] begrenzt. Stattdessen sind die [liege|E] und [suzerain|E] abhängig von [tributaries|E], um ihre Partei zu erweitern. \n\nA Mandala [ruler|E] kann danach streben, als Gottkönig oder Devaraja angesehen zu werden, und verlässt sich dann auf [mandala_radiance|E], um $game_concept_tributaries$ zu erwerben und zu behalten.\n\nA $game_concept_ruler$ muss [opinion|E] aufrechterhalten und Beziehungen zu ihren $game_concept_tributaries$ ausbauen, um diese langfristig zu behalten. Bei der Nachfolge können $game_concept_tributaries$ verstreut werden, es sei denn, die $game_concept_ruler$ ist ein würdiger [mandala_succesor|E]."
 game_concept_mandate_of_heaven_desc: "Die $game_concept_mandate_of_heaven$ ist eine besondere Art von [legitimacy|E], die nur für [son_of_heaven|E] verfügbar ist. Sie repräsentiert das Recht des Monarchen zu herrschen und wer als oberster Herrscher unter dem gesamten Himmel angesehen wird.\n\nDas Mandat ist eng mit dem [dynastic_cycle|E] verbunden. Der Zyklus beeinflusst, wie der regierende Monarch das Mandat erhält, und kann auch [situation_dynastic_cycle_phase|E] je nach dem Mandatsgrad des Monarchen ändern."
 game_concept_marshal: "Innenminister"
 game_concept_marshal_desc: "Die $game_concept_marshal$ ist der [councillor|E], der für die Sicherheit zuständig ist: die Polizei, die Grenzen und die Aufrechterhaltung der Ordnung."
 game_concept_marshals: "Innenminister"
 game_concept_martial: "Sicherheit"
 game_concept_martial_lifestyle: "Sicherheitslebensstil"
 game_concept_martial_skill: "Sicherheitsfertigkeit"
 game_concept_martial_skill_desc: "$game_concept_martial$ ist ein [skill|E] für Recht und Ordnung, Verteidigung und Krisenmanagement: die Straßen und das Land sicher halten.\n\nDie entsprechende [lifestyle|E] ist die [martial_lifestyle|E]."
 game_concept_master_assassin_desc: "Die $game_concept_master_assassin$ ist ein [court_position|E], ermöglicht durch [faiths|E] mit dem [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]. Die $game_concept_master_assassin$ ist ein gefährlicher Fanatiker, der zusammen mit kleineren Attentätern arbeitet, um wahrgenommene Feinde der Ideologie zu töten."
 game_concept_maximum_piety_level: "Maximales politisches Kapitalniveau"
 game_concept_men_at_arms: "Aktivisten"
 game_concept_men_at_arms_counter: "Gegner der Aktivisten"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$ sind professionelle [soldiers|E], die [levies|E] überlegen sind.\n\nDer Spieler hat direkte Kontrolle über die Zusammensetzung und Größe seiner Aktivisten [regiments|E].\n\nVerschiedene Arten von Aktivisten sind gut oder schlecht in verschiedenen Arten von [terrain|E]. Jede Art [counters|E] eine andere Art.\n\nAktivisten können in [stationed|E] [holdings|E] eingesetzt werden, um ihre Effektivität zu erhöhen."
 game_concept_mental_break_desc: "Wenn [stress|e] einen Charakter überwältigt, wird er eine mentale Krise erleben — eine persönliche Krise, in der er das Gefühl hat, etwas tun zu müssen, um seinen Druck zu senken, egal um welchen Preis.\n\nCharaktere, die unter einer mentalen Krise leiden, haben mehrere Möglichkeiten, mit der Situation umzugehen, wobei viele davon negative Folgen haben werden.\n\nBei niedrigem [stress_levels|E] sind diese Folgen gering und leicht zu bewältigen. Mit zunehmendem Drucklevel jedoch steigen auch diese Folgen, was schließlich zu Wahnsinn und sogar zum Tod führt."
 game_concept_minister_grand_chancellor_desc: "Der $game_concept_minister_grand_chancellor$ ist der ranghöchste [minister|E] und ist für diplomatische Angelegenheiten zuständig. Sie werden typischerweise der Position des [grand_secretariat_director|E] zugewiesen.\n\nDer Außenminister kann der designierte [grand_secretariat_director|E] sein, abhängig von den #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "Der $game_concept_minister_grand_marshal$ ist der ranghöchste Kommandant in dem [realm|E] und befehligt eine [army|E] von [title_men_at_arms|E].\n\nDer Innenminister kann der designierte [grand_secretariat_director|E] sein, abhängig von den #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ ist ein einzigartiges Set von [vassal_obligations|E], das nur für [ministers|E] verfügbar ist.\n\nAlle zivilen Minister haben eine spezifische Option als Standard, während das [minister_grand_marshal|E] eine einzigartige Option hat, die dem Innenminister [title_men_at_arms|E] bietet.\n\nDiese Verpflichtungen können nicht geändert werden."
 game_concept_natural_prowess: "Natürliche Ausdauer"
 game_concept_noble_family_desc: "$game_concept_noble_families$ sind mächtige [houses|E] in einem [government_bureaucratic_type|E] [realm|E]. Sie besitzen ein [estate|E], das vom [house_head|E] kontrolliert und verwaltet wird, und bleiben jederzeit ein integraler Bestandteil der Partei, da sie versuchen werden, [influence|E] zu sammeln und [provinces|E] für sich zu sichern.\n\nEin einflussreicher $game_concept_noble_family$ kann ein [powerful_family|E] oder ein [dominant_family|E] werden."
 game_concept_obedience_desc: "In [GetGovernment( 'nomad_government' ).GetName] [realms|E] bestimmt Gehorsam die Loyalität eines [character|E] gegenüber ihrem [liege|E], [suzerain|E] oder Besitzer ihres [court|E]. Charaktere können zu einem Zeitpunkt nur einem [ruler|E] gehorsam sein.\n\nGehorsame Charaktere sind weniger geneigt, an [hostile_schemes|E] teilzunehmen, [wars|E] beizutreten oder [factions|E] gegen ihren Parteiführer beizutreten. Sie werden während [succession|E] immer die Vorlieben ihres Parteiführers unterstützen und werden ihren [claims|E] nicht aufdrängen. Nicht gehorsame [tributaries|E] können versuchen, sich zu befreien.\n\nWenn der Wert eines Charakters die [obedience_threshold|E] übersteigt, wird er gehorsam."
 game_concept_offer_vassalization_desc: "Eine Interaktion, die einem [independent|E] [ruler|E] niedriger [title_rank|E] [vassalage|E] bietet und sie friedlich zur Gruppe hinzufügt."
 game_concept_organize_levies_desc: "Ein [councillor_task|E] durchgeführt von dem [marshal|E]. Es erhöht die Größe des [garrison|E] und die [levy|E]-Verstärkungsrate im [realm|E] des Ministers [liege|E]."
 game_concept_organized_desc: "Ein organisiertes [faith|E] hat eine religiöse Hierarchie. Anbetung und Praktiken sind organisierter und Schriften formalisiert.\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] Ideologien können organisiert werden, indem sie reformiert werden, während andere Ideologien immer als organisiert gelten."
 game_concept_pam_challenge_hof_cb: "Herausforderung des Bewegungsführers"
 game_concept_papal_recipient_desc: "Wenn das Hauptziel der [great_holy_war|E] bereits von einem Mitglied der Aggressor-Ideologie gehalten oder beansprucht wird, wird er als rechtmäßiger Empfänger des umkämpften Titels angesehen, es sei denn, der Haupt-[Concept( 'war_contribution', 'Contributor' )|E] entscheidet, ihrem [beneficiary|E] Vorrang zu geben."
 game_concept_peasant_faction_desc: "Die $game_concept_peasant_faction$ besteht aus [counties|E] mit niedrigem [county_opinion|E]. Im Unterschied zu anderen [factions|E] wird diese Gruppe immer rebellieren, selbst wenn [faction_military_power|E] niedrig ist, da Bauern im Allgemeinen sowohl optimistisch als auch ungebildet sind... Erfolgreiche Protestbewegungen werden die Kontrolle in Ihrem [realm|E] erheblich senken."
 game_concept_peasant_factions: "Protestbewegungen"
 game_concept_perk_desc: "Perks sind freischaltbare Segnungen, die viele nützliche und interessante Effekte bieten. Sie werden freigeschaltet, indem man ein [focus|E] innerhalb eines [lifestyle|E] auswählt und die zugehörige Form von [experience|E] #weak ausgibt (z. B. Spin $game_concept_experience$, wenn man ein $game_concept_intrigue_lifestyle$ $game_concept_perk$ freischalten möchte). #!"
 game_concept_personal_tenet: "persönliche Sache"
 game_concept_personal_tenets: "Persönliche Anliegen"
 game_concept_petition_antipope_gold_interaction: "Petition an den Gegenpapst um Gelder"
 game_concept_piety: "Politisches Kapital"
 game_concept_piety_desc: "$game_concept_piety$ ist das politische Ansehen eines Politikers bei seiner Partei und dem Establishment: gezeigte Loyalität, erledigte Gefälligkeiten, unterstützte richtige Anliegen.\n\nEs wird ausgegeben, um Dinge bei der Partei und dem Establishment zu erfragen, abhängig vom [government_form|E].\n\nJedes Mal, wenn ein Charakter Politisches Kapital gewinnt, macht er auch Fortschritte in Richtung des nächsten [piety_level|E]."
 game_concept_piety_experience: "Loyalität"
 game_concept_piety_experience_desc: "Jeder Treuepunkt, den ein Charakter erhält, erhöht seinen Fortschritt in Richtung der nächsten [piety_level|E]. Wenn ein Charakter [piety|E] gewinnt, erhält er auch eine gleichwertige Menge an Treue."
 game_concept_piety_level: "Politisches Kapitalniveau"
 game_concept_piety_level_desc: "Der $game_concept_piety_level$ eines Charakters ist ein Maß dafür, wie viel Kredit sie bei ihrer Partei und der Einrichtung angesammelt haben und welchen Stand sie bei anderen ihres [faith|E].\n\nJedes Mal, wenn ein Charakter [piety|E] erhält, macht er auch Fortschritte auf dem Weg zum nächsten politischen Kapitallevel.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nDie Level sind:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "Auswirkung des politischen Kapitalniveaus"
 game_concept_piety_level_impact_desc: "Die Auswirkung des politischen Kapitalniveaus erhöht oder verringert das [modifiers|E], das du aus deinem aktuellen [piety_level|E] erhältst."
 game_concept_piety_levels: "Politisches Kapitalniveau(n)"
 game_concept_playdate_desc: "Ein [activity|E], in dem Herrscher und Mitarbeiter unter [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] Jahren zusammenkommen, um zu spielen und die Trostlosigkeit des Tages zu vergessen. \n\nParticipants verlieren [stress|E] und erhöhen ihre [opinion|E] des Wirts. Es kann auch zahlreiche weitere Folgen haben, wenn sie so viele Kinder zusammenbringen. \n\nA [ruler|E] laden ihre [liege|E] und ihre [vassals|E] (zusammen mit verschiedenen [courtiers|E]) zu einem $activity_playdate$ ein."
 game_concept_player_heir_desc: "Der $game_concept_player_heir$ ist der [heir|E], den ein Spieler weiterhin auf [succession|E] spielt.\n\nDer $game_concept_player_heir$ ist normalerweise derselbe wie der [primary_heir|E], aber wenn der [succession_law|E] deines [primary_title|E] bestimmt, dass er auf einen Charakter außerhalb deines [dynasty|E] gehen sollte, wirst du stattdessen weiterhin als der dynastische Erbe deines zweithöchsten Titels (oder dritten, vierten usw.) spielen.\n\nDiese Situation tritt häufig auf, wenn dein $game_concept_player_heir$ unter einem Wahlnachfolgerecht abgewählt wird. Wenn du [house_head|E] eines [noble_family|E] in einem [administrative|E] [realm|E] bist, kannst du deine Partei an primäre Erben außerhalb deines [house|E] verlieren, aber deinen Adelstitel behalten.\n\nWenn du [ecclesiastical|e] bist, ist dein $game_concept_player_heir$ der Charakter, der dein [primary_title|e] erben wird, normalerweise ein [archdiocese|e]."
 game_concept_popular_faction_desc: "Die $game_concept_popular_faction$ besteht aus [counties|E] mit niedrigem [county_opinion|E], die ein gemeinsames Element teilen, wie [culture|E] oder [faith|E]. Sie versuchen, sich zu befreien, und wählen einen neuen [ruler|E] basierend auf ihrer Kultur oder Ideologie. Diese Art von Aufstand ist typischerweise sehr gefährlich."
 game_concept_popular_factions: "Populistische Bewegungen"
 game_concept_powerful_family_desc: "Ein $game_concept_powerful_family$ repräsentiert einen der einflussreichsten [houses|E] und [noble_families|E] in einem [government_bureaucratic_type|E] [realm|E].\n\nEin Mitglied eines $game_concept_powerful_family$ ist besser im [political_schemes|E] und hat eine höhere Wahrscheinlichkeit, zu bekommen, was es will, wenn [interacting|E] mit anderen [characters|E].\n\nEs kann immer nur eine begrenzte Anzahl von $game_concept_powerful_families$ gleichzeitig geben, und es sind die am höchsten bewerteten $game_concept_noble_families$, die basierend auf ihrem [powerful_family_rating_short|E] als mächtig angesehen werden. Das Haus des [top_liege|E] ist eine Ausnahme, das immer als mächtig betrachtet wird.\n\nEine Familie, die einen erheblichen Teil des Landes einer Partei kontrolliert, kann ein [dominant_family|E] werden."
 game_concept_powerful_vassal: "Mächtiger Hinterbänkler"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' sind die wenigen [vassals|E] mit den meisten [soldiers|E] und der höchsten [income|E]. Sie müssen diesen Hinterbänklern besondere Aufmerksamkeit schenken, weil sie erwarten, einen Sitz in Ihrem [council|E] zu halten und die [opinion|E] von Ihnen deutlich geringer sein wird, wenn sie dies nicht tun.\n\nDie Änderung eines [succession_law|E] erfordert, dass alle $game_concept_powerful_vassals$ entweder eine positive [opinion|E] von Ihnen haben, von Ihnen [cowed|E] sind oder [imprisoned|E] sind."
 game_concept_powerful_vassal_possessive: "Mächtige Hinterbänkler"
 game_concept_powerful_vassals: "Mächtige Achterbänkler"
 game_concept_prestige: "Profil"
 game_concept_prestige_desc: "$game_concept_prestige$ ist der öffentliche Ruhm eines Politikers: Bekanntheit des Namens, Kolumnenplatz und Sendezeit.\n\nEs wird für öffentliche Aktionen ausgegeben, abhängig vom [government_form|E].\n\nJedes Mal, wenn ein Charakter Profil gewinnt, macht er auch Fortschritte in Richtung des nächsten [prestige_level|E]."
 game_concept_prestige_experience: "Ruhm"
 game_concept_prestige_level: "Profilniveau"
 game_concept_prestige_level_impact: "Einfluss auf Profilebene"
 game_concept_prestige_level_impact_desc: "Profil-Level-Auswirkung erhöht oder verringert den [modifiers|E], der von Ihrem aktuellen [prestige_level|E] gewonnen wird."
 game_concept_prestige_levels: "Profil-Level"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$ sind die #V 7#! [electors|E], die zusammen mit dem Kaiser einen [title_heir|E] unter dem [GetLaw('princely_elective_succession_law').GetName] [succession_law|E] auswählen, das von [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )] verwendet wird.\n\n[holders|E] von #V 7#! bevorzugte [titles|E] werden als $game_concept_prince_electors$ priorisiert. Diese Titel werden bei der Gründung des Kaiserreichs ausgewählt.\n\nWenn ein $game_concept_prince_elector$-Titel zerstört wird, nicht von einem [de_jure|E] kaiserlichen [vassal|E] gehalten wird, von einem anderen $game_concept_prince_elector$ gehalten wird oder das [religion|E] des Inhabers vom Kaiser abweicht, wird ein anderer de jure Titel, der von einem direkten kaiserlichen Hinterbänkler oder [independent_ruler|E] gehalten wird, basierend auf diesen Kriterien ausgewählt:\n$EFFECT_LIST_BULLET$[rulers|E] Die [faith|E] und [culture|E] des Kaisers werden bevorzugt\n$EFFECT_LIST_BULLET$[theocratic|E] und [feudal|E] Herrscher werden bevorzugt\n\n#help Bevorzugte Titel werden in der Wahlansicht aufgelistet#!"
 game_concept_promote_other_culture_development_decision_desc: "Eine [decision|E], die es Ihnen ermöglicht, [development|E], [control|E], [building|E] Kosten und defensive [advantage|E] in [counties|E] aus verschiedenen [cultures|E] zu verbessern, mit einem [cultural_acceptance|E] von #V 75 % oder mehr #! \n\nTaking the Decision erhöht außerdem Ihre [prestige|E] [prestige_i] und [levies|E]. \n\nA Alle Wahlkreise im [realm|E] sind betroffen. Die [gold|E] Kosten steigen mit der Anzahl der betroffenen Wahlkreise an."
 game_concept_prowess: "Ausdauer"
 game_concept_prowess_skill: "Ausdauer Fertigkeit"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ ist ein [skill|E], das die körperliche und geistige Ausdauer eines Charakters widerspiegelt: achtzehnstündige Arbeitstage, nächtliche Sitzungen und Wahlkampftouren.\n\nA eine hohe Ausdauer-Fähigkeit bedeutet, dass sie wahrscheinlicher überleben und sowohl als [knights|E] in [battles|E] als auch in [single_combat_duel_plural|E] gut abschneiden.\n\nJeder Punkt Ausdauer gibt einem Organisator:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E] kann als $game_concept_raiders$ von [rally_points|E] aufgestellt werden. $game_concept_raiders$ kann in benachbarte Gebiete ziehen und sie für [gold|E] plündern.\n\nUm $game_concept_raid$ durchzuführen, muss eine Raiding-Armee in einem von einem fremden [ruler|E] besessenen [holding|E] Halt machen und sich entscheiden, das Raiding zu beginnen — sobald dies geschieht, werden sie für eine Weile beim Raiden festgehalten, nach der sie Gelder erhalten und das Gebiet plündern.\n\nGelder werden in der Armee aufbewahrt und nur dann dem Schatz hinzugefügt, wenn sie nach Hause zurückkehren. Wenn Sie eine Raiding-Armee mit Geldern besiegen, nehmen Sie diese und sie werden für eine gewisse Zeit nicht in der Lage sein, Sie zu raiden.\n\nNur einige Herrscher dürfen $game_concept_raid$, insbesondere [tribal|E] und [GetGovernment( 'nomad_government' ).GetName] Herrscher.\n\nBestimmte [raid_intents|E] können so eingestellt werden, dass sie verschiedene Belohnungen erhalten."
 game_concept_rally_point_desc: "Ein $game_concept_rally_point$ ist ein Sammelfeld für die [levies|E] und [men_at_arms|E] unter deinem Kommando. \n\nIn Mal im [war|E] kannst du an einem Sammelpunkt deine [soldiers|E] anrufen, um ein [army|E] zu sammeln. \n\nZDe Freiwilligen, die einem Sammelpunkt zugeteilt werden, müssen entweder aus deinem eigenen [domain|E] oder deinem [vassals|E] stammen. Sammelpunkte können nach Belieben neu organisiert, aufgeteilt und zusammengeführt werden."
 game_concept_realm: "Partei"
 game_concept_realm_capital: "Heimatbasis"
 game_concept_realm_capital_desc: "Der $game_concept_realm_capital$ ist der [holding|E], wo sich ein [ruler|E] und ihr [court|E] befinden. Dieses Anwesen hat einen [tax|E]-Bonus und wird immer vom [primary_heir|E] geerbt.\n\n[occupying|E] die Heimatbasis eines Feindes in einem Krieg gibt eine erhebliche Menge an [war_score|E] und erlaubt manchmal, Mitglieder der Familie des Feindes zu [imprison|E]."
 game_concept_realm_capital_possessive: "Heimatbasis'"
 game_concept_realm_capitals: "Heimatbasen"
 game_concept_realm_desc: "Ein $game_concept_realm$ ist alles und jeder, den ein Politiker direkt oder durch seine [vassals|E] führt (im Gegensatz zu einem [domain|E], das nur das ist, was er selbst hält)."
 game_concept_realm_heir: "Parteierbe"
 game_concept_realm_heir_desc: "Ein Parteierbe ist einer der [heirs|E] einer [realm|E] und erhält entweder alle oder einen Teil der [titles|E], die der [ruler|E] dieser Partei hält, wenn dieser Herrscher stirbt.\n\nJe nach [succession_law|E] kann eine Partei ein oder mehrere Parteierben haben."
 game_concept_realm_heirs: "Parteierben"
 game_concept_realm_law: "Parteirecht"
 game_concept_realm_law_desc: "Gesetze, die auf die Partei dieses Charakters angewendet werden, wie das Niveau von [crown_authority|E] oder [tribal_authority|E]."
 game_concept_realm_possessive: "Partys"
 game_concept_realm_priest: "Parteipriester"
 game_concept_realm_priest_desc: "Ein $game_concept_realm_priest$ ist ein [councillor|E], der in [faiths|E] für religiöse und spirituelle Angelegenheiten zuständig ist mit dem [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E].\n\nAnders als ihr [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName]-Äquivalent ([court_chaplains|E]), $game_concept_realm_priests$ übernimmt automatisch [lease|E] alle [temple_holdings|E] in einer [ruler|E]s [domain|E] und erhält auch einen Teil von [taxes|E] und [levies|E] aus [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ stellen ihren [liege|E] Freiwillige und Steuern zur Verfügung, wenn sie eine positive Meinung von ihnen haben. Je höher das [opinion|E] ihres [liege|E] ist, desto mehr werden sie bereitstellen.\n\n$game_concept_realm_priests$ mit einer niedrigen Meinung über ihren Parteiführer werden ihnen keine Steuern oder Freiwilligen zur Verfügung stellen und könnten Probleme verursachen."
 game_concept_realm_priest_possessive: "Parteipriester"
 game_concept_realm_priests: "Parteipriester"
 game_concept_realm_size: "Gruppengröße"
 game_concept_realms: "Parteien"
 game_concept_regency_desc: "Eine Regentschaft ist eine spezielle Form von [diarchy|E], wenn der [ruler|E] nicht in der Lage ist, über seinen [realm|E] alleine zu herrschen.\n\nSie tritt im Allgemeinen auf, wenn der Herrscher ein [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )] ist oder an einem [activity|E] außerhalb seiner Partei teilnimmt.\n\nEine $game_concept_regency$, die zu lange anhält, kann zu einem [entrenched_regency|E] werden."
 game_concept_religion: "Politisches Lager"
 game_concept_religion_desc: "Eine $game_concept_religion$-Gruppe verwandte [faiths|E]: die Linke, das Zentrum, die Rechte, die Nationalisten und die Unionisten. Ideologien desselben oder eines benachbarten Lagers sind Divergierend; links und rechts sind Gegensätzlich; Nationalisten und Unionisten sind Unversöhnlich."
 game_concept_religions: "Politische Lager"
 game_concept_religious_families: "Politische Familien"
 game_concept_religious_family: "Politische Familie"
 game_concept_religious_family_desc: "Ein $game_concept_religious_family$ ist eine Gruppe von [religions|E]. Die $game_concept_religious_family$ beeinflusst, wie die verschiedenen politischen Lager und [faiths|E] darin einander sehen. \n\nD [GetReligionFamily('rf_abrahamic').GetName] Familie billigt [holy_wars|E] gegen alle #weak (einschließlich anderer Abrahamiten)#!. Politische Lager sind anfällig für [heresy|E]. \n\nDe [GetReligionFamily('rf_eastern').GetName] Familie billigt nur heilige Kriege gegen andere politische Familien.\n\nD [GetReligionFamily('rf_pagan').GetName] Familie billigt heilige Kriege gegen alle, aber Ideologien innerhalb der politischen Lager müssen reformiert werden, um Zugang zu ihnen zu erhalten."
 game_concept_religious_head_succession_law: "Nachfolgeregelung des Bewegungsleiters"
 game_concept_religious_head_succession_law_desc: "[rulers|E], die ebenfalls [heads_of_faith|E] sind, haben ein zusätzliches Partei-[succession|E]-Gesetz, das verlangt, dass ihr [heir|E] derselben [faith|E] wie sie selbst angehört. Dies kann niemals geändert werden, und $game_concept_head_of_faith$ [titles|E] können keine separaten [title_succession|E] haben. Der einzige Weg, dieses Partei-Gesetz zu entfernen, besteht darin, dass eine externe Kraft das [head_of_faith|E] $game_concept_title$ zerstört."
 game_concept_religious_head_succession_law_short: "Gesetz des Bewegungsleiters"
 game_concept_religious_head_succession_laws: "Nachfolgeregelung des Bewegungsleiters"
 game_concept_religious_head_succession_laws_short: "Gesetze der Bewegungsleiter"
 game_concept_religious_superior_desc: "Ein religiöser Oberer ist ein [character|E], der die religiöse Jurisdiktion über einen oder mehrere [subordinate|E] religiösen Parteifunktionären in einer hierarchischen religiösen Struktur innehat."
 game_concept_retinue_maa: "Gefolgsaktivisten"
 game_concept_retract_desc: "Bei [limited_crown_authority|E] oder höher kann [rulers|E] die $game_concept_retract$ eines Hinterbänkler-[vassal|E], aber es sei denn, letzterer ist [imprisoned|E], ist dies riskant, da der Hinterbänkler sich weigern und sich erheben könnte zu einer Rebellion.\n\nHinterbänkler-Rücknahme gilt als [tyrannical|E], sofern das Ziel nicht eines ziemlich schweren [crime|E] schuldig ist."
 game_concept_revoke_desc: "Bei [limited_crown_authority|E] oder höher kann [rulers|E] auf Befehl von $game_concept_revoke$ die [titles|E] ihres [vassals|E] ausüben, aber es sei denn, der Backbencher ist [imprisoned|E], ist dies ein riskantes Unterfangen, da der Backbencher sich weigern und in Rebellion aufstehen könnte.\n\nDie Entziehung des Titels wird als [tyrannical|E] angesehen, es sei denn, der Backbencher ist eines ziemlich schweren [crime|E] schuldig."
 game_concept_rightful_liege: "Rechtmäßiger Parteiführer"
 game_concept_rightful_liege_desc_part2: "#weak Beispiel: Der Graf von $c_dunbar$ ist ein direkter Hinterbänkler des Königs von $k_england$. Da der König weder Herzog von $d_lothian$, König von $k_scotland$ noch Kaiser von $e_britannia$ ist, trägt der Graf von $c_dunbar$ nur einen winzigen Teil seiner Steuern und Freiwilligen bei. \n\nDe Graf von $c_norfolk$ ist auch ein direkter Hinterbänkler des Königs von $k_england$. Der König hält nicht die Region $d_norfolk$, daher trägt der Graf auch reduzierte Steuern und Freiwillige bei. Da der $k_england$ jedoch die De Jure Nation $c_norfolk$ ist, trägt der Graf von $c_norfolk$ dem König immer noch deutlich mehr Steuern und Freiwillige bei als der Graf von $c_dunbar$. #!"
 game_concept_rite: "Ideologie"
 game_concept_rite_desc: "In Westminster hat jedes [faith|E] ein einziges $game_concept_rite$ mit demselben Namen: die Ideologie selbst, mit ihrem [core_tenets|E] und [doctrines|E]. Sie sind festgelegt: Politiker ändern ihre Meinung, nicht die Ideologie."
 game_concept_rite_divergence_desc: "Divergenz misst, wie weit ein [rite_possessive|E] [core_tenets|E] und [doctrines|E] sich von der übergeordneten [faith|E] entfernt haben. Eine Ideologie, die [prohibited_tenet_status|E] Ursachen als [core_tenet_status|E] annimmt, ist divergenter.\n\nHohe Divergenz schwächt das [fervor|E] der Elternideologie, was Ausbrüche von [heresy|E] häufiger macht. Eine Ideologie, die #V 100#! Divergenz erreicht, wird automatisch als Abspaltung erklärt und wird zu einer neuen [faith|E]."
 game_concept_rite_knowledge: "Ideologie Wissen"
 game_concept_rite_possessive: "Ideologie's"
 game_concept_rites: "Ideologien"
 game_concept_rites_possessive: "Ideologien'"
 game_concept_royal_court: "Privatbüro"
 game_concept_royal_court_desc: "Ausgezeichnete [rulers|E] sind berühmt genug, um ein Privates Büro zu unterhalten, das Zugang zu einer Vielzahl von Boni und Möglichkeiten bietet.\n\nWenn ein [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] oder [GetGovernment( 'tribal_government' ).GetName] [ruler|E] wird, [king|E] oder [emperor|E], erhalten sie Zugang zu ihrem Privaten Büro.\n\nJedes Private Büro hat ein [court_grandeur_level|E], das Vorteile basierend darauf bietet, wie berühmt das Private Büro ist und zu welchem [court_type|E] das Private Büro gehört.\n\nPetent:innen, [vassals|E] und [courtiers|E] können in Ihrem Privaten Büro erscheinen, oder Sie können [hold_court|E], um jemanden im [realm|E] einzuladen, seine Beschwerden vorzubringen.\n\nEin Privates Büro ermöglicht es dem Herrscher auch, [court_artifacts|E] anzuzeigen, und [inspired|E] [guests|E] können im Privaten Büro erscheinen und anbieten, neue [artifacts|E] zu erstellen.\n\nWenn Sie sterben, wird Ihr [player_heir|E] Ihr Privates Büro erben."
 game_concept_royal_courts: "Privatbüros"
 game_concept_sanctified_desc: "Die Weihe eines [artifact|E] macht es zu einem [holy_relic|E] für einen [faith|E]. Ein Artefakt kann für mehrere Ideologien geweiht werden."
 game_concept_scales_of_power_desc: "Während [power_sharing|E] wird das Gleichgewicht der Macht zwischen den [liege|E] und ihren [diarch|E] am $game_concept_scales_of_power$ gemessen.\n\nWährend die $game_concept_scales_of_power_scales$ sich zugunsten der $game_concept_diarch$ neigen, schalten sie [diarch_powers|E] frei und können Kosten zur [diarch_affected_actions|E] des Parteiführers hinzufügen.\n\nWenn sie sich zugunsten der $game_concept_liege$ neigen, erleichtert dies stattdessen dem Parteiführer, das [diarchy|E] zu beenden.\n\nDie $game_concept_scales_of_power_scales$ kann geschwungen werden durch:\n$EFFECT_LIST_BULLET$Verwendung der $swing_scales_currency_interaction$ [character_interaction|E] gegen die gegnerische Partei\n$EFFECT_LIST_BULLET$Als die $game_concept_diarch$, die deinem $game_concept_liege$ gut dienen (so zynisch auch immer) bei [mandate|E] Veranstaltungen"
 game_concept_seasonal_prediction_desc: "Ein geschickter $court_position_court_astrologer$ kann das nächste [steppe_season|E] in einer Region vorhersagen und seinem Gruppenführer hilfreiche Informationen geben, um die nächsten Schritte zu planen."
 game_concept_seize_peripheral_duchy: "Periphere Region ergreifen"
 game_concept_settlement_issue_desc: "Siedlungsfragen sind Aufgaben, die einem [nomad|E] [ruler|E] nach Abschluss einer [migration|E] für neue Gebiete gegeben werden. Sie bieten die Möglichkeit, Konflikte zu bewältigen und die lokale [county_control|E] im neuen [domain|E] zu erhöhen.\n\n Diese Fragen werden auch in den ersten Jahren nach einer Migration eines Herrschers weiterhin auftreten, solange die Kontrolle über die Wählerschaft gering ist."
 game_concept_short_reign_desc: "'Kurze Herrschaft' ist ein abnehmender [opinion|E]-Nachteil, den alle Charaktere in einer [realm|E] bei einem neuen [liege|E] erhalten.\n\nAuf ähnliche Weise erhalten Untertanen einen zunehmenden [long_reign|E]-Meinungsbonus bei Parteiführern, die lange über sie geherrscht haben."
 game_concept_shunned_desc: "Viele [rites|E] haben [doctrines|E], die bestimmte Verhaltensweisen als Verabscheuungswürdig kennzeichnen. Abhängig von der spezifischen Richtlinienposition können diese Verhaltensweisen auch als [criminal|E] betrachtet werden.\n\nCharaktere, die beim Ausüben von Verhaltensweisen, die von ihrer Ideologie als verabscheuungswürdig gelten, erwischt werden, verlieren ein [piety_level|E] und erhalten ein entsprechendes [fame_trait|E]; dieses Merkmal wird von allen, deren Ideologie dieses Verhalten entweder als verabscheuungswürdig oder kriminell ansieht, nicht gemocht.\n\nBeispiele für verabscheuungswürdiges Verhalten sind:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "Jeder [rite|E] betrachtet bestimmte [traits|E] als sündig. Charaktere mit diesen Eigenschaften erleiden [opinion|E] Strafen von allen Charakteren, die diese Eigenschaften als sündig ansehen, selbst wenn sie nicht dieselbe Ideologie teilen. Außerdem verlieren Charaktere, die Eigenschaften besitzen, die ihre eigene Ideologie als sündhaft betrachtet, jeden Monat [piety|E]. \n\nEgenau unterscheiden sich die Merkmale, die als Sünden gelten, von Ideologie zu Ideologie, werden aber typischerweise durch eine Kombination aus dem [core_tenets|E] dieser Ideologie und dem [religion|E] der Ideologie bestimmt."
 game_concept_spiritual_fulfillment: "Persönliche Verurteilung"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ ist, wie wohl sich ein [character|E] mit seiner eigenen Politik fühlt. Es steigt und fällt mit ihrem [traits|E] und mit ihrem Verhalten."
 game_concept_spiritual_fulfillment_level: "Verurteilungsniveau"
 game_concept_spiritual_fulfillment_level_desc: "Eine [character_possessive|E] [spiritual_fulfillment|E] ist in $game_concept_spiritual_fulfillment_levels$ unterteilt, jede mit eigenen Effekten."
 game_concept_spiritual_fulfillment_levels: "Verurteilungsniveaus"
 game_concept_spiritual_head_of_faith: "Spiritueller Bewegungsleiter"
 game_concept_spymaster: "Chief Whip"
 game_concept_spymaster_desc: "Der $game_concept_spymaster$ ist der [councillor|E], der die Partei in Schach hält und alle Geheimnisse kennt. Hüte dich vor einem illoyalen Parteiführer: Sie können leicht ein Komplott gegen dich verbergen oder sich ihm anschließen."
 game_concept_state_rite: "Staatsideologie"
 game_concept_state_rite_desc: "$game_concept_state_rite$ ist die [rite|E], die von einem [administrative_government|E] unterstützt und gebilligt wird. Diese Ideologie ist an die [title|E] gebunden und nicht an eine bestimmte [character|E]. Es ist einfacher, Charaktere in der [realm|E] auf die Staatsideologie zu konvertieren und sehr schwierig, sie davon abzubringen.\n\nNur die [ruler|E] einer administrativen Partei können die Staatsideologie ändern, aber [governors|E] können frei zu ihr konvertieren."
 game_concept_stationed_regiment_desc: "Eine [men_at_arms|E] [regiment|E] erhält Boni auf ihre Effektivität, wenn sie in einem [holding|E] stationiert ist.\n\n[buildings|E] können diese Boni weiter erhöhen — manchmal für jede Art von Aktivisten, aber am häufigsten für eine oder zwei. Zum Beispiel bietet [GetBuilding('stables_01').GetName] einen Bonus für stationierte [light_cavalry|E] und [heavy_cavalry|E].\n\nMan kann jederzeit stationieren, außer während [war|E] oder wenn das Anwesen [occupied|E] ist. Wenn ein Anwesen verloren geht, werden alle stationierten Aktivisten abgezogen."
 game_concept_steward: "Kanzler des Exchequers"
 game_concept_steward_desc: "Die $game_concept_steward$ ist der [councillor|E], der für die Wirtschaft und das [domain|E] zuständig ist: [taxation|E], Ausgaben und [development|E]."
 game_concept_stewards: "Kanzler des Exchequers (Plural)"
 game_concept_stewardship: "Wirtschaft"
 game_concept_stewardship_lifestyle: "Wirtschaftslebensstil"
 game_concept_stewardship_skill: "Wirtschaftsfähigkeit"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$ ist ein [skill|E] für Budgets, die Wirtschaft und das Leiten von Dingen. Es erhöht direkt [taxation|E], sodass jeder Führer es will.\n\nDas entsprechende [lifestyle|E] ist der [stewardship_lifestyle|E]."
 game_concept_stewardship_task_contract: "Wirtschaft Vertrag"
 game_concept_stewardship_task_contract_possessive: "Wirtschaft Vertrags"
 game_concept_stewardship_task_contracts: "Wirtschaftsverträge"
 game_concept_stewardship_task_contracts_possessive: "Wirtschaftsverträge'"
 game_concept_story_content_el_cid_desc: "#tooltip_heading Story-Stil: Leicht#!\n\nAls El Cid werden Sie von Ihrem Gruppenleiter zu Unrecht zurückgesetzt. Im Exil können Sie entweder loyal bleiben oder Ihren eigenen Weg finden, der schließlich mit einer Rückkehr an den Hof #EMP oder #! dem ultimativen Preis — Valencia — endet.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading Story-Stil: Mäßig#!\n\nAls Hasan werden Sie auf einen Weg religiösen Fanatismus geführt, wählen einen Ort aus, um das Licht der Wahren Ideologie zu bringen, und konvertieren [counties|E] aus unter ihrer [rulers|E].\n\nSchließlich wird Ihre Geschichte mit einem großen religiösen Aufstand gegen Ihren gewählten Gegner gipfeln.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading Story-Stil: Leicht#!\n\nAls Temüjin werden Sie Rache an einem rivalisierenden Stamm üben, der Ihren Ehepartner gefangen genommen hat, und die Loyalität Ihres engsten Anhängers und Freundes Jamukha prüfen.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "Druck"
 game_concept_stress_desc: "Charaktere fallen unter $game_concept_stress$, wenn sie gegen ihre [personality_traits|E] handeln: der treue Abgeordnete, der gegen die Parteilinie stimmt, der ehrliche Minister, der eine schlechte Linie verteidigen muss.\n\n Charaktere unter genügendem Druck erhalten eine [stress_level|E], mit Auswirkungen auf ihre Gesundheit, die anhalten, bis sie ihn wieder senken.\n\n Zeit weg von Westminster und [activities|E] lindert dies."
 game_concept_stress_level: "Druckniveau"
 game_concept_stress_level_desc: "Für je 100 [stress|E], die ein Charakter ansammelt, führt dies auch dazu, dass er ein Druckniveau erhält. Die Druckniveaus reichen von 0 bis 3, wobei jedes Niveau zunehmende Strafen für die [fertility|E] und [health|E] eines Charakters auferlegt.\n\nDarüber hinaus, solange ein Charakter mindestens 1 Druckniveau hat, ist er anfällig für [mental_breaks|E]."
 game_concept_stress_levels: "Druckniveaus"
 game_concept_stress_loss: "Druckverlust"
 game_concept_stressed: "Unter Druck"
 game_concept_strong_vassal: "Starker Abgeordneter auf der Rückbank"
 game_concept_strong_vassal_desc: "Ein $game_concept_strong_vassal$ ist ein [vassal|E], der sich seiner [liege|E] in Macht nähert oder sie überschreitet und dabei eine [opinion|E]-Strafe riskiert. #weak Sie sehen ihren Parteiführer als schwach und ungeeignet an, die Partei zu führen.#!"
 game_concept_strong_vassals: "Starke Abgeordnete auf der Rückbank"
 game_concept_struggle_involved_faith: "Beteiligte Ideologie"
 game_concept_struggle_involved_faiths: "Beteiligte Ideologien"
 game_concept_struggle_persia_phase_unrest_desc: "Vom Aufruhr und Intrigen befallen, zerfällt das Kalifat. Ehrgeizige Kriegsherren und listige Gouverneure gleichermaßen greifen nach jeder Macht, die sie usurpieren können, und streiten ständig.\n\nMit der Zeit, sofern die Situation nicht durch ein [ending_phase|E] gelöst wird, wird die Partei in eine [struggle_persia_phase_stabilisation|E]-Phase eintreten, während verzweifelte Anhänger versuchen, die kaliphale Autorität zurückzugewinnen."
 game_concept_struggle_phase_desc: "Ein $game_concept_struggle_phase_phase$ ist eine allgemeine Stimmung, die bei [struggle_involved|E] [characters|E] und [counties|E] innerhalb einer [struggle_region|E] verbreitet ist. Sie repräsentiert kurzfristige gesellschaftliche Trends und Sitten, die vorübergehend den Dialog der [struggle|E] dominieren.\n\n#weak Beispiel: In einer $game_concept_struggle_phase_phase$ könnten die Menschen eines $game_concept_struggle_region_region$ denken, dass religiöse Toleranz oberste Priorität hat, auch wenn der Rest ihrer Ideologie widerspricht.#!"
 game_concept_supply_limit_desc: "Die $game_concept_supply_limit$ bestimmt die Menge an [soldiers|E], die du in einem [barony|E] haben darfst, bestimmt durch die [terrain|E] und [development|E] des Wards. \n\nSt deine Gesamtgröße [army|E] die $game_concept_supply_limit$ übersteigt, verliert dein $game_concept_armies$ [supply|E] und leidet schließlich unter [attrition|E]."
 game_concept_temporal_head_of_faith: "Leiter der Zeitbewegung"
 game_concept_tenet: "Ursache"
 game_concept_tenet_desc: "Während [doctrines|E] Fragen darstellen, zu denen ein [rite|E] Stellung beziehen muss, repräsentieren $game_concept_tenets$ die einzigartigen Eigenheiten und Praktiken der Ideologie."
 game_concept_tenet_knowledge: "Politikwissen"
 game_concept_tenet_knowledge_desc: "Politiker kennen nicht jede andere Ideologie im Detail.\n\nDas Wissen über alle $game_concept_core_tenets$ und $game_concept_doctrines$ eines $game_concept_rite$ erleichtert es, die Meinung dazu zu ändern.\n\nAlle [core_tenets|E] und [doctrines|E] deines eigenen [faith|E] sind dir bekannt. Mehr kann man von [spouses|E], [friends|E] und [activities|E] lernen."
 game_concept_tenet_popularity: "Beliebtheit der Ursache"
 game_concept_tenet_popularity_desc: "Wenn sich [personal_tenets|E] innerhalb eines [faith|E] verbreitet, wird ihre Praxis alltäglicher. $game_concept_tenet_popularity$ verfolgt, wie weit verbreitet ein [core_tenet|E] ist, und beeinflusst, wie wahrscheinlich es ist, dass es in einem [ecumenical_council|E] als Debattenthema oder als Ziel eines [papal_bull|E] ausgewählt wird.\n\nJe höher das $game_concept_tenet_popularity$, desto mehr werden die [clergy|E] eine Sache unterstützen, wenn sie in einem [ecumenical_council|E] diskutiert wird. Sobald eine Sache #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$ erreicht, wird die [head_of_faith|E] sie höchstwahrscheinlich als [permitted_tenet_status|E] erklären, unabhängig von ihren eigenen Überzeugungen."
 game_concept_tenet_status: "Status der Ursache"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ ist eine [rite_possessive|E]-Haltung zu einem [core_tenet|E] oder [doctrine|E]. Es gibt fünf mögliche Haltungen:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — der $game_concept_rite$ hat noch nie von diesem $game_concept_core_tenet$ oder $game_concept_doctrine$ gehört.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — der $game_concept_rite$ ist sich dessen bewusst und hat die Praxis nicht bewertet.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — der $game_concept_rite$ billigt die Praxis.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — der $game_concept_rite$ verbietet die Praxis.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — der $game_concept_rite$ erlaubt und fördert aktiv die $game_concept_core_tenet$.\n\nDie Haltung einer Ideologie bestimmt, ob ein $game_concept_core_tenet$ oder $game_concept_doctrine$ ausgewählt werden kann, wenn ein $game_concept_rite$ erstellt oder abgewichen wird, und welche Praktiken [followers|E] spirituelle Strafen kosten.\n\nDer Status einer Ursache unterscheidet sich von einem [character_possessive|E] [tenet_knowledge|E], der persönliches Bewusstsein ist, nicht die gesamte Haltung der $game_concept_rite$."
 game_concept_tenets: "Ursachen"
 game_concept_the_christian_church_desc: "Die christliche Kirche ist der geistliche Körper, der die Anhänger von Jesus Christus überwacht und leitet, dargestellt als eine [situation|E], die sich durch eine Abfolge von [the_christian_church_chapters_short|E] bewegt.\n\nIhre Grenzen umfassen jeden [archdiocese|E] der Welt; jedes [christian|E] [ruler|E] von [county|E] Rang oder höher mit einem Teil ihres [realm|E] innerhalb eines Erzbistums ist Mitglied, seien es Parteifunktionäre oder Laien."
 game_concept_theocratic_vassal: "Theokratischer Hinterbänkler"
 game_concept_theocratic_vassal_desc: "Nebenbencher, die die [theocratic_government|E] Form haben. \n\nHie Funktion wird durch eine [faithpossessive|E] [doctrines|E] bestimmt."
 game_concept_theocratic_vassals: "Theokratische Hinterbänkler"
 game_concept_title_allegiance_desc: "[vassals|E] kann einem bestimmten [title|E] die Treue schulden, anstatt der Person ihres [liege|E]. Dies kann nur geschehen, wenn der Titel seinen eigenen [succession_law|E] hat. Bei [succession|E] werden solche Hinterbänkler zu Hinterbänklern des neuen Titels [holder|E]."
 game_concept_title_desc: "Ein $game_concept_title$ ist im Wesentlichen ein Besitzurkunde für Land.\n\nDie kleinste Landfläche auf der Karte ist das [barony|E]. Wards sind in größere Gebiete namens [counties|E] organisiert. Wahlkreise [de_jure|E] gehören zu einem [duchy|E], Regionen zu einem [kingdom|E] und Nationen zu einem [empire|E].\n\nRegionen, Nationen und Imperien haben nicht immer ein [holder|E], aber es sind Titel, die von einem Herrscher, der genügend des entsprechenden Gebiets kontrolliert, [created|E] werden können."
 game_concept_title_men_at_arms: "Aktivisten nach Titel"
 game_concept_top_liege: "Premierminister"
 game_concept_top_liege_possessive: "Premierminister's"
 game_concept_top_lieges: "Premierminister"
 game_concept_top_realm: "Top-Partei"
 game_concept_torture_desc: "[imprisoned|E] Charaktere können $game_concept_tortured$ werden, wodurch ihr [health|E] beschädigt oder sie auf verschiedene Weisen verstümmelt werden können.\n\n Folter kann [stress|E] für [GetTrait('callous').GetName( GetNullCharacter )] und [GetTrait('sadistic').GetName( GetNullCharacter )] Charaktere lindern, verursacht aber Druck für diejenigen ähnlicher Natur.\n\n Folter von [rulers|E] kann auch Ihren [dread|E] erhöhen."
 game_concept_tour_stop_desc: "Eine [activity_phase|E] während eines [royal_tour|E], in dem ein Parteiführer entweder: an einer [hosted_dinner|E] teilnehmen, [tour_the_grounds|E] ihrer [vassal|E] oder eine [cultural_festival|E] genießen kann."
 game_concept_transfer_desc: "[rulers|E] kann $game_concept_transfer$ einen ihrer [vassals|E] an einen anderen Hinterbänkler übertragen, solange der erste von niederer Rang als der zweite ist. Dies ist eine gute Möglichkeit, den [opinion|E] eines Hinterbänklers zu erhöhen, insbesondere wenn der übertragene Hinterbänkler [de_jure|E] Teil ihres [realm|E] ist."
 game_concept_treasury_vassal_development: "Entwicklung der Hinterbänkler"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ repräsentiert den allgemeinen Einfluss, den ein [tribal|E] [ruler|E] auf seine [vassals|E] ausübt. Im Vergleich zu [crown_authority|E] bietet es weniger Kräfte und auf höheren Stufen. \n\nZZes gibt vier Stufen von $game_concept_tribal_authority$: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E] und [absolute_tribal|E]. Das Erhöhen $game_concept_tribal_authority$ kostet je nach Stufe und [learning_skill|E] des Herrschers einen Betrag von [prestige|E], ist aber im Allgemeinen teurer als die Erhöhung der Kronenautorität. \n\n#weak Offbencher lehnen höhere $game_concept_tribal_authority$ ab, und die Senkung dieses Niveaus ist das Hauptziel jeder [liberty_faction|E]. #!"
 game_concept_tribal_desc: "Stammesparteien haben eine eingeschränkte Wählerschaft [development|E], können nicht über die Stammesära [innovations|E] hinaus fortschreiten, können keine neuen [holdings|E] bauen und sind normalerweise nicht in der Lage, ihre [succession_law|E] zu ändern.\n\n Sie können jedoch [prestige|E] anstelle von [gold|E] nutzen, um ihre Parteien aufzubauen und [men_at_arms|E] einzustellen, und haben Zugang zu mehr [casus_belli|E] im Vergleich zu [feudal|E] Parteien. Nicht-Stammesarmeen erleiden in feindlichem Stammesgebiet einen [supply_limit|E]-Nachteil."
 game_concept_unassigned_vassal: "Unversteuerte Hinterbänkler"
 game_concept_unassigned_vassals: "Unversteuerte Hinterbänkler"
 game_concept_undirected_great_holy_war_desc: "Ein $game_concept_undirected_great_holy_war$ wird von einem $doctrine_spiritual_head_name$ [head_of_faith|E] erklärt mit der Absicht, eine [kingdom|E] unter die Herrschaft ihres [faith|E] zu bringen.\n\n$game_concept_undirected_great_holy_wars$ werden nicht sofort gestartet, sondern treten in ein [preparation_phase|E] ein.\n\nVor und während des Krieges können Herrscher der angreifenden Ideologie wählen, [gold|E] an die [war_chest|E] zu spenden.\n\nWenn sie siegreich sind, wird die angegriffene Nation übernommen und einem Charakter der angreifenden Ideologie gegeben. Belohnungen für die Angreifer umfassen [piety|E] und möglicherweise die Ernennung ihres [dynasty|E] zum [landed|E] innerhalb der eroberten Nation."
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] erhalte eine [battle|E] [advantage|E] in [counties|E] ihrer Ideologie."
 game_concept_usurp_title_desc: "Ein [title|E], der von einem ausländischen [ruler|E] gehalten wird, kann normalerweise Usurpiert werden, wenn mehr als #V 50%#! seiner [de_jure|E] [counties|E] in Ihrem [realm|E] liegen. Dieser Prozess gibt Ihnen das [title|E], was besonders wichtig ist, um sicherzustellen, dass Sie der [rightful_liege|E] Ihres [vassals|E] sind.\n\nUsurpation ist schwieriger, wenn der aktuelle Inhaber von Ihnen [faith|E] feindlich gesinnt ist; in diesem Fall ist Usurpation nur möglich, wenn der Inhaber keine seiner [de_jure|E] [counties|E] mehr innerhalb seiner Partei besitzt."
 game_concept_varangian_adventure_desc: "Dies ist ein spezieller Typ von [war|E], bei dem der Angreifer beabsichtigt, seinen [realm|E] vollständig in die [war_target|E] zu verlegen. \n\n Wenn sie gewinnen, werden sie die entsprechenden [counties|E] sofort annektieren und ihren [capital|E] dorthin verlegen. Ihre alten Hinterbänkler werden unabhängig, und ihre alten $game_concept_counties$ werden aufstrebenden lokalen Kriegsherren übergeben. $game_concept_varangian_adventures$ sind #EMP NUR#! für [duke|E] und $game_concept_count$-[title_tier|E] [rulers|E] verfügbar und werden mit jedem erfolgreich abgeschlossenen $game_concept_varangian_adventure_adventure$ zunehmend teurer. \n\n Dieser [casus_belli|E] ist #EMP NIEMALS#! nach dem $culture_era_tribal$ [era|E] verfügbar und kann nicht gegen andere [cultures|E] verwendet werden, die $game_concept_varangian_adventure_adventure$ können oder gegen benachbarte $game_concept_rulers$. \n\n$north_germanic_group_collective_noun$, die ihren ersten $game_concept_varangian_adventure$ starten, erhalten bis zu [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] Bonus [special_troops|E], wobei die Menge mit jeder gleich-[faith|E] gleich-[culture|E] Wahlkreis, den sie vollständig innerhalb von [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName] kontrollieren, steigt."
 game_concept_vassal: "Offbencher"
 game_concept_vassal_contract: "Vertrag als Hinterbänkler"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ bestimmt die [obligations|E] zwischen einem [vassal|E] und ihrem [liege|E].\n\n Backbencher der [feudal|E], [clan|E], [administrative|E] und [nomadic|E] $game_concept_government_forms$ haben Zugang zu verschiedenen [obligations|E], die individuell für jeden Backbencher ausgehandelt werden.\n\n Alle Backbencher zahlen einen Prozentsatz ihres gesamten [taxes|E] und [levies|E] an ihren Partei-Vorsitzenden, basierend auf ihrem [obligations|E]. #EMP Diese [modifier_contributions|E] können ihrerseits durch “Kleingedrucktes” wie [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )] modifiziert werden.#!\n\n Einige Spezialverträge sind auf bestimmte Ränge beschränkt: \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] und [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] und höher \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] und höher \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: nur [count|E] \n\n#weak Hinweis, [governor|E] [obligations|E] sind auch als [province_administrations|E] bekannt.#!"
 game_concept_vassal_contracts: "Verträge der Hinterbänkler"
 game_concept_vassal_desc: "Ein $game_concept_vassal$ ist ein Politiker, der einem anderen unterstellt ist: einem Abgeordneten seinem [liege|E], einem Parteivorsitzenden dem Premierminister. \n\nBackbencher geben ihrem Parteivorsitzenden [levies|E] und [taxes|E] – ihr [obligations|E] – im Gegenzug für die Peitsche und Unterstützung. \n\nIe [opinion|E] eines $game_concept_vassal$ ihres Parteiführers niedrig ist, kann er [factions|E] beitreten oder [scheme|E], um ihn zu ersetzen."
 game_concept_vassal_directive: "Hinterbänkler-Richtlinie"
 game_concept_vassal_directive_desc: "Als [liege|E] können Sie Direktiven an Ihre [vassals|E] ausgeben, die ihre [councillor_tasks|E] und welche [buildings|E] sie errichten, beeinflussen.\n\nUm eine Direktive auszugeben, müssen Sie sie aktivieren, z. B. indem Sie #P 50#! oder mehr [opinion|E] mit dem Backbencher haben. Fortgeschrittene [government_forms|E] erfordern dies nicht."
 game_concept_vassal_directives: "Hinterbänkler-Richtlinien"
 game_concept_vassal_limit: "Hinterbänkler-Limit"
 game_concept_vassal_limit_desc: "Die $game_concept_vassal_limit$ bestimmt, wie viele [direct_vassals|E] du legal haben darfst (ohne [barony|E] Achterbänkler). \n\nAob du zwar über deinen $game_concept_vassal_limit$ gehen kannst, senkt dadurch die [taxes|E] und [levies|E] deiner Hinterbänkler, und es ist vielleicht besser, [transferring|E] wenn einige Hinterbänkler unter dem Limit bleiben."
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ definiert, wie viel [tax|E] und wie viele [levies|E] ein [subject|E] ihren [suzerain|E] bereitstellt. Das [government_form|E] eines Subjekts bestimmt, wie ihre $game_concept_obligations$ verändert werden.\n\n#weak Zum Beispiel hängen [GetGovernment('feudal_government').GetName] und [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$ von ihrem [vassal_contract|E] ab, [GetGovernment('administrative_government').GetName] Backbencher hängen von ihrem [province_administration|E] ab, während [tributary_possessive|E] von ihrem [tributary_contract|E] abhängig sind."
 game_concept_vassal_possessive: "Hinterbänkler"
 game_concept_vassal_stance: "Hinterbänkler-Haltung"
 game_concept_vassal_stance_desc: "Jeder [vassal|E] hat eine Backbencher-Haltung, die die [opinion|E] beeinflusst, die sie mit dir als [liege|E] haben, und welche [heir|E] sie als Nachfolger der [realm|E] bevorzugen. \n\nBackbencher in derselben Haltung mögen und mögen dieselben Dinge. Zum Beispiel; alle [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] Hinterbänkler mögen es nicht, wenn man [wars|E] verliert. \n\nEsehr Hinterbänkler-Haltung bevorzugt einen bestimmten Erben. Bei der Nachfolge hat jeder bevorzugte Erbe eine geringere [legitimacy_expectations|E] mit den Hinterbänklern dieser Haltung. \n\n#low Die Hinterbänkler-Haltungen sind: #!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "Offbencher-Positionen"
 game_concept_vassal_taxes: "Steuern der Hinterbänkler"
 game_concept_vassal_taxes_desc: "Ihre $game_concept_vassal_taxes$ bestehen aus den [taxes|E], die Sie von Ihrem [vassals|E] erhalten. Die Höhe hängt vom [obligations|E] jedes Hinterbänkler ab.\n\nAus der Sicht Ihrer Hinterbänkler werden diese gleichen Steuern [liege_taxes|E] genannt, um sie von allen $game_concept_vassal_taxes$ zu unterscheiden, die sie von ihren eigenen $game_concept_vassals$ erheben."
 game_concept_vassals: "Nebenbencher"
 game_concept_vassals_possessive: "Backbenchers'"
 game_concept_victory_desc: "$game_concept_victory$ ist eine von drei möglichen [peace_offers|E]. Der genaue Ausgang eines Sieges in einem [war|E] hängt vom [casus_belli|E] ab.\n\nFür den Angreifer bedeutet es typischerweise die Einnahme von [titles|E] innerhalb der [war_target|E]-Region.\n\nFür den Verteidiger bedeutet Sieg normalerweise, dass der Angreifer eine große Summe als Kriegsentschädigung zahlen muss."
 game_concept_virtue_desc: "Jeder [rite|E] betrachtet bestimmte [traits|E] als tugendhaft. Charaktere mit diesen Eigenschaften erhalten [opinion|E] Boni von allen Charakteren, die diese Eigenschaften als tugendhaft ansehen, auch wenn sie nicht dieselbe Ideologie teilen. Außerdem erhalten Charaktere, die Eigenschaften besitzen, die ihre eigene Ideologie als tugendhaft betrachtet, jeden Monat einen Bonus [piety|E]. \n\nEgenau welche Eigenschaften als Tugenden gelten, variieren von Ideologie zu Ideologie, werden aber typischerweise durch eine Kombination aus dem [core_tenets|E] dieser Ideologie und dem [religion|E] der Ideologie bestimmt."
 game_concept_virtue_weight_desc: "Eigenschaften können ein zugeordnetes [sin|E]- oder [virtue|E]-Gewicht haben, bestimmt durch das [core_tenets|E] und [doctrines|E] eines [rite|E], und die [religion|E], zu der sie gehören.\n\nDie Eigenschaften mit dem höchsten Sünden- oder Tugendgewicht innerhalb einer Ideologie werden zu deren [sins|E] und [virtues|E]."
 game_concept_wanderer_desc: "Charaktere, die weder zu einem [court|E] gehören noch irgendein [titles|e] innehaben, werden Wanderer genannt. Sie reisen um die Welt und besuchen auf dem Weg Büros als [guests|E]. Wanderer könnten [mercenary|E]-Kapitäne, Führer von [holy_orders|E], [clergy|E]-Mitglieder oder [city|E]-Inhaber werden."
 game_concept_wanua_desc: "Der $wanua_government_adjective$ [government|E] teilt Schwächen mit dem [GetGovernment('tribal_government').GetNameWithIcon] [government|E], hat aber auch reduzierte [domain_limit|E] und [vassal_limit|E]. Während sie [gold|E] nutzen, um [buildings|E] zu errichten und [men_at_arms|E] zu rekrutieren, verdienen sie nur sehr wenig Gelder durch Gebäude.\n\nSie können jedoch [barter_goods_i][barter|E], [raid|E], und haben Synergien mit der [GetGovernment('mandala_government').GetName]-Regierung, da sie [legitimacy|E] erhalten, wenn sie ein [tributary|E] sind."
 game_concept_war_chest_desc: "Die $game_concept_war_chest$ ist eine Sammlung von [gold|E], [piety|E] und [prestige|E]. Die Inhalte werden hauptsächlich als Belohnungen für erfolgreich gewonnene [undirected_great_holy_wars|E] verwendet, wobei sie unter den Angreifern nach ihrem Anteil im [war|E] aufgeteilt werden.\n\nEin bestimmter Anteil dessen, was sich im $game_concept_war_chest$ befindet, wird ebenfalls unter den Angreifern verteilt, sobald der Krieg erklärt wird.\n\nWenn ein [undirected_great_holy_war|E] besiegt wird, teilen die Verteidiger den politischen Kapital- und Profilanteil des $game_concept_war_chest$ unter sich auf #weak (die Mittel gehen verloren.)#!"
 game_concept_winter_desc: "Winter entleert [supply|E] mit der Zeit stetig, wodurch Armeen Vorräte verlieren, während sie in einem vom Winter betroffenen Schutzgebiet stehen. Die Vorratsstrafe steigt mit jeder Schwere an. Der Winter hat drei verschiedene Schweregraden; [Concept( 'winter_severity_mild', 'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E] und [Concept( 'winter_severity_harsh', 'Harsh' )|E]."
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ sind einzigartige Verbesserungen an der $game_concept_yurt$.\n\nMechanisch sind sie [domicile_buildings|E] — obwohl viele soziale Bräuche darstellen oder einfach Bereiche des Interesses für den Stamm $game_concept_nomad$ sind, anstatt wörtlich Strukturen zu sein.\n\nDie Boni, die sie verleihen können, umfassen:\n$EFFECT_LIST_BULLET$ Freischaltung von [court_positions|E] und Nomadischen [decisions|E] und [character_interaction|E]s\n$EFFECT_LIST_BULLET$ Verschiedene Boni auf [herd|E] und [county_fertility|E], einschließlich [terrain|E]-Spezialisierungen\n$EFFECT_LIST_BULLET$ Freischalten und Verbessern von Nomadischen [men_at_arms|E] und Verstärkung der Stärke von [horde|E]\n$EFFECT_LIST_BULLET$ Einzigartige nomadische [culture_tradition|E]-Boni\n$EFFECT_LIST_BULLET$ Möglichkeiten zur Verwaltung Ihrer [vassals|E] und [tributaries|E] sowie zur Beeinflussung von [characters|E] in Ihrem Büro.\n$EFFECT_LIST_BULLET$ [kurultai|E] und [obedience|E]-Boni."
 maximum_piety_level_mandala: "\n\nJedoch, wenn ein [mandala|E] [ruler|E] auf eine für seinen [aspect|E] akzeptable Weise stirbt, nachdem er [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] erreicht hat, entwickelt der [heir|E] dieses Herrschers die Fähigkeit, zum nächsten politischen Hauptstadt-Level aufzusteigen, bis [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L] erreicht ist."
