 action_can_ask_hof_for_claim: "@hof_icon! Du kannst deinen Bewegungsleiter um einen Anspruch bitten"
 action_can_ask_hof_for_claim_combined_group_label: "@hof_icon! Du kannst deinen Bewegungsleiter um Ansprüche bitten"
 action_can_ask_hof_for_claim_combined_group_name: "@hof_icon! Ihr Bewegungsführer würde Ansprüche gewähren"
 action_can_ask_hof_for_claim_label: "@hof_icon! Ihr Bewegungsführer, [secondary_recipient.GetUINameNoTooltip], würde einen Anspruch auf [target_title.Custom('GetTierIcon')] gewähren[target_title.GetNameNoTooltip]"
 action_can_ask_hof_for_money: "@gold_icon!Sie können Ihren Bewegungsleiter um Mittel bitten"
 action_can_choose_dynasty_perk_desc: "Sie haben genug [dynasty_prestige|E], um ein [dynasty_perk|E] für Ihr [dynasty|E] freizuschalten.\n\n#help Als [dynast|E] können Sie Parteimarken für Handlungen bei Ihren Dynastiemitgliedern ausgeben, aber Vermächtnisse sind langfristige Boni für Ihre gesamte Dynastie.#!"
 action_can_claim_liege_title: "@titles_icon! Du kannst den Titel deines Parteiführers beanspruchen"
 action_can_claim_liege_title_desc: "Sie kontrollieren die Mehrheit der [counties|E], die [de_jure|E] zu einem Ihrer [liege_possessive|E] [titles|E] sind. Das bedeutet, dass Sie [prestige|E] ausgeben können, um ein [unpressed_claim|E] darauf zu erhalten!\n\n#help Einen unbestrittenen Anspruch auf einen höherwertigen Titel zu haben, gibt Ihnen die Möglichkeit, Ihren Rang zu erhöhen. Sie können ihn nutzen, um ein [claimant_faction|E] zu starten oder einfach direkt [war|E] bei Ihrem Parteiführer zu erklären.#!"
 action_can_claim_liege_title_label: "@titles_icon! Du kannst den Titel deines Parteiführers beanspruchen"
 action_can_create_head_of_faith_title_click: "#I Klicken Sie, um Ideology#! anzusehen"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help Durch die Schaffung des Titels Bewegungsführer werden Sie auch zum [temporal_head_of_faith|E]!#!"
 action_can_demand_payment_desc: "Sie können die [hook|E], die Sie haben, für [recipient.GetUIName] ausgeben, um zu verlangen, dass sie Ihnen [gold|E] zahlen.\n\n[recipient.GetSheHe|U] besitzt derzeit @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! der Mittel, die Sie verlangen können.$action_can_demand_payment_HELP$"
 action_can_find_secrets_HELP: "\n\n#help Nur die Kameraden [vassals|E], die Inhaber der 10 höchsten [title_tier|E] [titles|E] sind, werden hier gezeigt, da sie die wichtigsten Ziele sind, aber Sie können jeden Hinterbänkler Ihres [liege|E] anvisieren.#!"
 action_can_make_clerical_puppet: "@theological_agent_puppet_icon! Parteipriester kann gesteuert werden"
 action_can_ransom_desc: "Sie können Ihr [prisoner|E], [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUIName], gegen [gold|E] auslösen.\n\n[recipient.GetSheHe|U] besitzt derzeit @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! der Mittel, die Sie verlangen können.$action_can_ransom_HELP$"
 action_can_request_preach_legitimacy: "@legitimacy_icon! Mandat predigen"
 action_can_request_preach_legitimacy_combined_group_label: "@legitimacy_icon! Mandat predigen"
 action_can_request_preach_legitimacy_help_desc: "\n\n#help Die [legitimacy|E] von [rulers|E] hängt von der Zustimmung [actor.GetFaith.HighGodNamePossessive] ab, und nur durch die Parteifunktionäre kann die Zustimmung [actor.GetFaith.HighGodNamePossessive] bekannt werden.#!"
 action_can_request_preach_legitimacy_label: "@legitimacy_icon!Ihr Mandat kann durch [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip] verbessert werden"
 action_can_train_knights_contract: "Sie können Organisatoren ausbilden, um den Vertrag zu erfüllen"
 action_convert_at_war_interaction_click: "#I Klicken Sie, um ihre Ideology#! zu übernehmen"
 action_convert_at_war_interaction_desc: "Sie können in den [faith|E] von [recipient.GetShortUIName] konvertieren, um [recipient.GetHerHis] [holy_war|E] gegen Sie zu beenden.\n\n#help Während es nützlich ist, einen Krieg zu beenden, den man verliert, seien Sie sich bewusst, dass die Mitglieder Ihrer ehemaligen Ideologie [opinion|E] von Ihnen verlieren werden!#!"
 action_convert_at_war_interaction_label: "@religious_icon! Du kannst auf die Ideologie des Angreifers konvertieren"
 action_county_in_dangerous_populist_faction: "@faction_icon! Wahlkreis in der populistischen Bewegung"
 action_county_in_dangerous_populist_faction_click: "#I Klicken Sie, um den Wahlkreis #! anzusehen"
 action_county_in_dangerous_populist_faction_combined_group_description: "Bauern in mehreren eurer Wahlkreise haben sich zu einem [popular_faction|E] gegen euren Parteivorsitzenden zusammengeschlossen. \n\nIrzergäbe die [county_opinion|E] dieser Wahlkreise, oder riskiere, sie ganz zu verlieren, wenn sie ihre Forderungen stellen!"
 action_county_in_dangerous_populist_faction_combined_group_label: "@faction_icon! Wahlkreise in der populistischen Bewegung"
 action_county_in_dangerous_populist_faction_desc: "[landed_title.GetNameNoTooltip] ist einer [popular_faction|E] gegen Ihren Parteivorsitzenden beigetreten. \n\nInzin erhöhen Sie das [county_opinion|E] dieses Wahlkreises, oder riskieren Sie es, es zu verlieren, wenn die Fraktion ihre Forderungen stellt!"
 action_county_in_dangerous_populist_faction_label: "@faction_icon! [landed_title.GetNameNoTooltip] in der populistischen Bewegung"
 action_empty_accolade_slot_click: "#I Klicken Sie hier, um Ihre Organisatoren anzuzeigen. #!"
 action_empty_accolade_slot_unimportant: "@warning_icon! #X Der Organisator kann auch ein gültiger Nachfolger für eine bestehende Auszeichnung sein"
 action_ep3_can_ask_hof_for_influence: "@influence_icon! Du kannst deinen Bewegungsleiter um Einfluss bitten"
 action_ghw_participation_alert_desc: "Sie haben weder [gold|E] gespendet noch Ihr [armies|E] für die bevorstehende [actor.GetFaith.GHWName] zugesagt.\n\n#help Wenn Sie weder Mittel noch Soldaten für den Kriegseinsatz geben, wird Ihr [head_of_faith|E] Sie verurteilen und Sie werden [piety|E] verlieren.#!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon! Kann Abgeordnete dem rechtmäßigen Parteiführer gewähren"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] wem Sie nicht der rechtmäßige Parteiführer sind, gibt Ihnen weniger Ressourcen und hat eine reduzierte [opinion|E] von Ihnen. Manchmal ist es am besten, diese Hinterbänkler ihrem rechtmäßigen Parteiführer zu überlassen, vorausgesetzt, dass sie auch Ihr Hinterbänkler sind.\n\nManchmal bedeutet die Überlassung eines Hinterbänklers an seinen rechtmäßigen Parteiführer, dass Sie weniger verdienen, aber es lohnt sich normalerweise trotzdem, sie zu überlassen – ihr rechtmäßiger Parteiführer wird eine starke Meinungsstrafe gegenüber Ihnen haben, weil sie einen Hinterbänkler halten, den sie für ihren eigenen halten.\n\nDie Aufrechterhaltung einer guten Hinterbänklerstruktur ist der Schlüssel zu einer stabilen Partei.#!"
 action_grant_vassal_to_rightful_liege_click: "#I Klicken Sie, um Backbencher#! zu gewähren"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! Kann Abgeordneten dem rechtmäßigen Parteiführer gewähren"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Hinterbänkler können ihrem rechtmäßigen Parteivorsitzenden gewährt werden"
 action_has_any_display_cb_on_HELP: "\n\n#help Wenn Ihre militärischen und [allies|E] Kräfte stärker als die Ihres Feindes sind, kann Krieg sehr vorteilhaft sein. Sie können [titles|E] einnehmen, Ihr [realm|E] erweitern und [prestige_experience|E] verdienen.\n\nJedoch sind Kriege kostspielig, besonders wenn Sie [defeat|E] zugeben müssen. Ehrgeizige Nachbarn könnten die Gelegenheit nutzen, Ihre geschwächte Partei auszunutzen.#!"
 action_has_courtier_or_guest_with_inspiration_desc: "Einer Ihrer Mitarbeiter oder Gäste hat ein [inspiration|E] und kann gesponsert werden, um ein [artifact|E] zu erstellen"
 action_has_courtier_or_guest_with_inspiration_label: "Einer Ihrer Mitarbeiter oder Gäste hat ein [inspiration|E]"
 action_has_open_court_event: "Amtserklärungsereignis fortsetzen"
 action_has_open_court_event_label: "Sie haben ein unvollendetes Büroereignis."
 action_has_unopened_court_event: "Büroveranstaltung verfügbar"
 action_has_unopened_court_event_label: "Sie haben ein neues Büroereignis."
 action_in_debt_desc: "Sie haben weniger als [gold_i|E]#V 0#! [gold|E] und befinden sich daher in [debt|E]!\n\nVerschuldung hat die folgenden Auswirkungen:\n$BULLET_WITH_TAB$Kann [war|E] nicht deklarierenZZ\n$BULLET_WITH_TAB$Kann [men_at_arms|E], die [gold_i|E] erfordern, nicht verstärkenZZ[gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] Ausbreitung in Ihrem [domain|E]\n$BULLET_WITH_TAB$[vassals|E] ist eher zu erwarten, dass sie [factions|E]\n\n beitretenDie tiefer Sie verschuldet sind, desto härter werden die Sanktionen sein, denen Sie ausgesetzt sind. Ihr aktuelles Verschuldungsniveau hat folgende zusätzliche Auswirkungen:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Wenn Sie jeden Monat keine Mittel verdienen, sollten Sie überlegen, Ihre Ausgaben zu senken, zum Beispiel durch:\n$BULLET_WITH_TAB$Auflösung Ihres [armies|E]\n$BULLET_WITH_TAB$Verringerung der Größe von — oder Zerstörung — Ihres [men_at_arms|E]\n$BULLET_WITH_TAB$Erhöhung von [control|E] mittels Ihres [marshal|E]\n$BULLET_WITH_TAB$Widerruf von [court_positions|E]#!"
 action_in_debt_landless_desc: "Sie haben weniger als [gold_i|E]#V 0#! [gold|E] und befinden sich daher in [debt|E]!\n\nVerschuldung hat die folgenden Auswirkungen:\n$BULLET_WITH_TAB$Kann [war|E] nicht deklarierenZZ\n$BULLET_WITH_TAB$Kann [men_at_arms|E] nicht mit [gold_i|E] verstärkenZZ[gold|E]\n\nJe tiefer Sie verschuldet sind, desto härter werden die Sanktionen sein, denen Sie ausgesetzt sind. Ihr aktuelles Verschuldungsniveau hat folgende zusätzliche Auswirkungen:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Erwägen Sie, einen [task_contract|E] zu unternehmen, um Mittel zu verdienen#!"
 action_landless_admin_escape_to_realm: "Flucht zu einer anderen Partei"
 action_landless_admin_escape_to_realm_desc: "Sie sind ein landloser [noble_family|E] [title|E] [holder|E] unter einem [liege|E] mit einem anderen [government|E]\n\n#help. Sie können andere [independent_rulers|E] mit Ihrem [government|E] bitten, Ihr neuer Parteiführer zu werden und Ihr [domicile|E] zu ihrem [capital|E]#! zu verschieben."
 action_legal_meddling: "Ansprüche innerhalb der Partei des Parteiführers als [actor.GetLiege.GetDiarchTitle] erwerben"
 action_legal_meddling_combined_group_label: "@unpressed_claim! Du kannst Ansprüche innerhalb der Partei deines Parteiführers als [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_label: "@unpressed_claim! Sie können Wahlkreise beanspruchen, die von Ihren [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip] #low @soldier_icon![recipient.GetMilitaryStrengthText]#! gehalten werden, als [actor.GetLiege.GetDiarchTitle]"
 action_low_control_in_county: "@control_icon! Geringe Kontrolle in der Wählerschaft in [landed_title.GetNameNoTierNoTooltip] #low ([landed_title.GetCountyData.GetControl|0]/100)#!"
 action_low_control_in_county_HELP: "\n\n#help Sie können Ihre [marshal|E] der Aufgabe [increase_control|E] zuweisen, um die Kontrolle über die Wählerschaft zu erhöhen.#!"
 action_low_control_in_county_combined_group_label: "@control_icon! Geringe Kontrolle in Wählerbezirken"
 action_no_mandala_decree_desc: "Sie haben keinen [mandala_decree|E]\n\n#help ausgewählt. Lassen Sie Ihr Dekret die Richtung Ihres [subjects|E] und damit Ihrer Partei lenken.#!"
 action_not_rightful_liege: "Kein rechtmäßiger Parteivorsitzender von [recipient.GetShortUINameNoTooltip]"
 action_not_rightful_liege_combined_group_description: "Sie sind nicht der [rightful_liege|E] mehrerer Ihrer Backbenchers.\n\n Überprüfen Sie, ob Sie [create|E] oder [usurp|E]-Titel vergeben können, die Sie zu ihrem [de_jure|E] [liege|E] machen; dies wird ihre [opinion|E] von Ihnen verbessern sowie die [taxes|E] und [levies|E] erhöhen, die Sie von ihnen erhalten.\n\n Wenn dies nicht möglich ist, sollten Sie in Erwägung ziehen, [transferring|E] an einen anderen Ihrer Backbenchers zu übertragen, insbesondere wenn dieser Backbencher deren [rightful_liege|E] wäre."
 action_not_rightful_liege_combined_group_label: "Kein rechtmäßiger Parteiführer der Hinterbänkler"
 action_not_rightful_liege_desc: "Sie sind nicht der [rightful_liege|E] Ihres [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nSie sollten prüfen, ob Sie einen Titel [create|E] oder [usurp|E] können, der Sie [recipient.GetHerHis] [de_jure|E] [liege|E] machen würde; dies wird die [recipient.GetHerHis] [opinion|E] von Ihnen verbessern sowie die [taxes|E] und [levies|E] erhöhen, die Sie von [recipient.GetHerHim] erhalten.\n\nWenn das nicht möglich ist, sollten Sie in Betracht ziehen, [transferring|E] sie einem Ihrer anderen Hinterbänkler zu übergeben, besonders wenn dieser Hinterbänkler ihr [rightful_liege|E] wäre."
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! Mächtiger Hinterbänkler erwartet eine [GetPlayer.Custom( 'GetCouncilConcept' )]-Position"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help Sie sollten in Betracht ziehen, mächtigen Hinterbänklern eine [GetPlayer.Custom( 'GetCouncillorConcept' )|E]-Position zu geben. Andernfalls wird ihre [opinion|E] gesenkt, und sie könnten sich einem [faction|E] gegen Sie anschließen.\n\n Allerdings hat nicht jeder eine ausreichend hohe [skills|E], um nützlich zu sein, und wenn Ihre [rank|E] hoch genug ist, könnte es einfach mehr mächtige Hinterbänkler geben, als es Sitze im [GetPlayer.Custom( 'GetCouncilConcept' )|E] gibt.#!"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! Mächtige Hinterbänkler erwarten [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )]-Positionen"
 action_powerful_vassal_not_on_council_label: "@powerful_vassal_icon! Ihr mächtiger Abgeordneter, [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip], erwartet eine [GetPlayer.Custom( 'GetCouncilConcept' )|E] Position ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_promote_foreign_legend_desc: "Sie könnten das [legend|E] einer anderen Person fördern.\n\n#help [legends|E] sind nützlich, um [legitimacy|E], [dynasty_prestige|E], [prestige|E], [piety|E], [traits|E] und [claims|E] zu erhalten. Ein [legend|E] hat sich in Ihrer Partei verbreitet; erhalten Sie Belohnungen, indem Sie es unterstützen."
 action_regent_retract: "Hinterbänkler als [actor.GetLiege.GetDiarchTitle] zurückziehen"
 action_regent_retract_combined_group_label: "@vassal_icon! Sie haben Abgeordnete, die Sie zurückziehen können als [actor.GetLiege.GetDiarchTitle]"
 action_regent_retract_label: "@vassal_icon! Du kannst Hinterbänkler aus deinem [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip] #low @soldier_icon![recipient.GetMilitaryStrengthText]#! abziehen, [actor.GetLiege.GetDiarchTitle]"
 action_shift_privileges: "Mittel von Kollegen Abgeordneten stehlen als [actor.GetLiege.GetDiarchTitle]"
 action_shift_privileges_combined_group_label: "[gold_i] Du kannst deinen Mit-Hinterbänklern Geld stehlen [actor.GetLiege.GetDiarchTitle]"
 action_shift_privileges_label: "[gold_i] Du kannst Gelder stehlen, die von deinem [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip] #low @soldier_icon![recipient.GetMilitaryStrengthText]#! gehalten werden, als [actor.GetLiege.GetDiarchTitle]"
 action_station_men_at_arms: "@stationed_regiment_icon! Aktivisten können stationiert werden"
 action_station_men_at_arms_HELP: "\n\n#help Sie sollten Ihre mächtigsten [men_at_arms|E] in [holdings|E] stationieren, mit [buildings|E], die ihre Effektivität steigern.\n\n Die Spezialisierung einer oder zweier Ihrer Holdings, um die Stärke bestimmter Arten von Aktivisten erheblich zu erhöhen, kann Ihnen in [wars|E] helfen.#!"
 action_station_men_at_arms_label: "@stationed_regiment_icon! Du kannst eine Aktivistengruppe aufstellen"
 action_subsidise_liege_authority: "Die Autoritätspartei stärken, der Parteiführer unterstützt Sie"
 action_subsidise_liege_authority_label: "@icon_contract_modification_single! Erhöhe die Autorität deines Gruppenführers, um mehr $game_concept_diarch_powers$ für dich freizuschalten."
 action_syphon_treasury: "Mittel vom Parteiführer stehlen als [actor.GetLiege.GetDiarchTitle]"
 action_syphon_treasury_label: "[gold_i] Du kannst Geld von deinem Parteiführer stehlen [actor.GetLiege.GetDiarchTitle]"
 action_title_lost_from_realm_by_vassal_war: "@bad_icon! Ihre Partei wird Land verlieren, wenn ein Abgeordneter den Krieg gewinnt"
 action_title_lost_from_realm_by_vassal_war_HELP: "#help [vassals|E], die [title|E] von [title_tier|E] oder mehr im [rank|E] ihrer [liege|E] erhalten, werden [independent|E], oder Hinterbänkler des nächsten [realm|E] Parteiführers in der Hierarchie, die sie übertrifft.\n\nSie sollten überlegen, die $stop_attacker_vassal_war_interaction$-Interaktion zu verwenden oder einen anderen Weg zu finden, um sicherzustellen, dass der Krieg gegen Ihren Hinterbänkler geht.#!"
