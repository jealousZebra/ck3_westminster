 action_too_many_held_duchies_combined_group_description: "Sie halten mehr als zwei [duchies|E] als [king|E] oder [emperor|E], wodurch Sie die [vassals|E]' [opinion|E] von Ihnen senken.\n\n#help Je mehr $game_concept_duchies$ Sie über Ihre ersten beiden hinaus halten, desto neidischer werden Ihre Hinterbänkler. Während Sie ihre Beschwerden ignorieren können, sollten Sie in Betracht ziehen, etwas von Ihrem $game_concept_duchy$ [titles|E] wegzugeben.\n\n Sie sollten $game_concept_duchies$ halten, wo Sie viele $game_concept_counties$ haben, insbesondere Ihre [realm_capital|E].#!"
 action_too_many_held_duchies_combined_group_label: "@titles_icon! Zu viele gehaltene Regionen"
 action_vassal_ransom_gives_hook: "@cs_weak_hook_icon! Kann Lösegeld für Abgeordnete für Hook zahlen"
 action_vassal_ransom_gives_hook_HELP: "\n\n#help Einen Einfluss auf einen Abgeordneten zu gewinnen, kann vorteilhaft sein, besonders wenn Sie versuchen, ihren [obligations|E] Ihnen gegenüber zu erhöhen, indem Sie deren [vassal_contract|E] ändern — was in diesem Fall möglich ist!#!"
