 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U] hat die Werte unserer Ideologie nicht gut vertreten, und die [puppet_or_actor.GetFaith.GetAdherentNamePlural] in [target.GetNameNoTier] leiden darunter. Würden Sie mir Ihren Segen geben, diese Länder von [secondary_recipient.GetHerHis]s fehlgeleiteter Herrschaft zu befreien?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "Während Eifer beneidet werden kann, müssen wir auch pragmatisch sein, wenn wir wollen, dass unsere Ideologie triumphiert. Wäre es nicht klüger, [target.GetNameNoTier] zum Ziel unseres heiligen Krieges zu machen?"
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "Ich habe den Irrtum meines Weges erkannt und bitte, nachdem ich für meine Fehltritte Buße getan habe, Sie, meine Exkommunikation aufzuheben, damit ich wieder zu meinen Brüdern und Schwestern der Ideologie zurückkehren kann."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "\nI versuche, ein guter [puppet_or_actor.GetFaith.GetAdherentName] zu sein, aber ich bin nicht vollkommener als jeder andere [actor.GetWomanMan]. Um meine Stolperer und Fehler auszugleichen, möchte ich diese Summe an die Kirche spenden. \n\nI werde außerdem einen Eid schwören, von allen Sünden abzusehen."
 RETRACT_VASSAL_PROPOSAL: "Ich bin zu dem Schluss gekommen, dass, zum Wohle von [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip], [recipient.GetFullName] als Abgeordneter ohne besondere Funktion unter meiner direkten Autorität gestellt werden muss."
