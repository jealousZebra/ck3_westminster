 celestial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Herrscher können zwischen allen verfügbaren [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Alle Abgeordneten, die die Titelaufhebung oder den Rückzug als Abgeordneter verweigern, gelten als [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#!-Kosten werden reduziert"
 char_interaction.0001.desc: "Ich akzeptiere Ihr gnädiges Angebot der Vasallisierung. Mein Parteichef!"
 char_interaction.0002.desc: "Ich benötige keinen Schutz und ziehe es vor, den Gewinn meiner Partei für mich zu behalten."
 char_interaction.0010.a: "Mein Parteichef!"
 char_interaction.0090.from_ward.desc: "Ich fürchte, dass meine Ausbildung in Ihrem Büro meinen Bedürfnissen nicht mehr entspricht. Ich werde sofort nach [capital.GetNameNoTierNoTooltip] zurückkehren."
 char_interaction.0090.one_ward.desc: "Ich fürchte, dass die Ausbildung von [ward.GetTitledFirstName] in Ihrem Büro unseren Bedürfnissen nicht mehr entspricht. [ward.GetSheHe|U] wird hiermit zurück in unsere Obhut gerufen."
 char_interaction.0090.two_wards.desc: "Ich fürchte, dass die Ausbildung von [ward.GetTitledFirstName] und [ward_2.GetTitledFirstName] in Ihrem Büro unseren Bedürfnissen nicht mehr entspricht. Sie werden hiermit zurück in unsere Obhut gerufen."
 char_interaction.0180.desc: "Als Ihr Hausleiter habe ich entschieden, dass Sie [puppet_or_actor.GetFaith.GetName], die eine wahre Ideologie, annehmen müssen. Ich fürchte, Sie haben in dieser Angelegenheit keine Wahl."
 char_interaction.0180.desc.liege: "Als Ihr Parteiführer fordere ich, dass Sie Ihre falsche Ideologie aufgeben und sofort als Mit-[puppet_or_actor.GetFaith.GetAdherentName] zu mir stoßen."
 char_interaction.0181.desc: "Sehr gut, ich werde die [puppet_or_actor.GetFaith.GetAdjective] Ideologie annehmen, auch wenn es sich seltsam anfühlen wird, so vieles Vertrautes aufzugeben."
 char_interaction.0182.desc: "Ich werde meine Ideologie niemals aufgeben und stattdessen mein eigenes Haus gründen!"
 char_interaction.0190.desc: "Sehr gut, ich werde die [puppet_or_actor.GetFaith.GetAdjective] Ideologie annehmen, auch wenn es sich seltsam anfühlen wird, so vieles Vertrautes aufzugeben."
 char_interaction.0191.desc: "Meine Ideologie ist das Herzstück meines Wesens – ich werde sie niemals aufgeben."
 char_interaction.0200.desc: "Ich bin zu dem Schluss gekommen, dass Ihnen die Würde und Verantwortung des [landed_title.GetName] nicht anvertraut werden kann. Daher entziehe ich Ihnen hiermit diesen Titel zum Wohle der Partei."
 char_interaction.0211.desc: "Ich schätze Ihr großzügiges Angebot, [secondary_recipient.GetShortUIName] zu meinem Hinterbänkler zu machen, wirklich, aber ich fürchte, ich muss ablehnen."
 char_interaction.0220.desc: "Ich akzeptiere Ihren Widerruf meines Hinterbänkler, [secondary_recipient.GetShortUIName], obwohl ich ihn für ungerecht halte."
 char_interaction.0221.desc: "Ich kann das Treuegelübde von [secondary_recipient.GetShortUIName] nicht verraten. Ich werde meinen Hinterbänkler beschützen, selbst wenn es bedeutet, das Gelübde, das ich Ihnen gegenüber habe, zu brechen."
 char_interaction.0232.liege: "Ich werde nicht tatenlos zusehen, während unser Parteiführer die loyalen Hinterbänkler von [actor.GetHerHis] missbraucht. Ich fordere Sie auf, sich mir im Kampf zu diesem Tyrannen zu stürzen."
 char_interaction.0232.regent: "Ich werde nicht tatenlos zusehen, während [actor.GetSheHe] die loyalen Hinterbänkler von [ceremonial_liege.GetTitledFirstNamePossessive] missbraucht. Ich fordere Sie auf, sich mir im Kampf zu diesem Tyrannen zu stürzen."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nIch war ein guter einfacher Abgeordneter für Sie, aber sicherlich verstehen Sie, dass ich auch eigene Untertanen habe!\n\nMein aktueller Vertrag ist sehr restriktiv, sicherlich würden Sie die Weisheit erkennen, ihn lockerer zu gestalten?\n\nUnd außerdem, Sie #emphasis schulden mir wirklich!#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nIn Anerkennung unserer Angebote und des Respekts gegenüber [recipient.GetPrimaryTitle.GetNameNoTooltip] bitte ich Sie, diese Hingabe zu ehren, indem Sie [SCOPE.Custom('CelestialTributaryRequest')] gewähren.\n\nMöge dieser Gefallen die Harmonie zwischen Ihrem Thron und unserer bescheidenen Partei stärken."
 char_interaction.0271.desc: "Durch die Autorität des Büros, das mir von [intermediary.GetTitledFirstName] verliehen wurde, behebe ich einige geringfügige Unstimmigkeiten an den Grenzen der Partei.\n\n Es wird befohlen, die Vasallenpflicht von [intermediary.GetTitledFirstName] an den rechtmäßigen Parteiführer von [intermediary.GetHerHis] zu übergeben. An mich."
 char_interaction.0272.desc: "Sie überschreiten die Grenzen Ihrer Befugnis, aber ich kann dem Amt meines [intermediary.GetTitleAsName] nicht widerstehen, selbst wenn nur #EMP Sie#! es ausüben.\n\n Ich akzeptiere Ihren Widerruf meines Hinterbänklerstatus."
 char_interaction.0273.desc: "Ich habe geschworen, meine Hinterbänkler zu schützen, und das schließt vor Ausbeutung durch Leute wie #EMP ein, Sie #!.\n\nSie können mir die Ländereien von [intermediary.GetTitledFirstName] und [intermediary.GetHerHis] im Kampf entreißen oder Sie können in das [recipient.GetFaith.random_GoodGodNames]-verlassene Loch zurückkriechen, in dem Sie hausen."
 char_interaction.0282.desc: "Im Gegensatz zu meinen Handlungen sind Ihre Forderungen kriminell.\n\nZum Wohle der Partei werde ich gehorchen, aber wisse, dass ich diese Kränkung nicht vergessen werde."
 char_interaction.0291.a: "Ich bin sicher, dass mein Parteichef am besten weiß."
 char_interaction.0291.desc.negative: "Kannst du nicht einmal #EMP irgendetwas#! richtig machen? Der dämlichste Mensch des Landes würde sehen, dass [recipient.GetTitledFirstName] nicht das ist, worauf du dich konzentrieren solltest. Hör auf, bessere Hinterbänkler zu schikanieren und mach deinen Job."
 char_interaction.0370.a.herder: "Ich hätte meine Partei zusammenhalten sollen."
 church_authority_0: "Autonome Parteibeamte"
 church_authority_0_effects_not_in_prev: "#weak Clerical-Hinterbänkler bieten [levies|E] und [taxes|E], behalten aber breite Autonomie. #!"
 church_authority_2_effects: "$EFFECT_LIST_BULLET$Herrscher können eine theokratische [dynasty|E]\n$EFFECT_LIST_BULLET$[vassals|E] errichten, können jedoch keinen [war|E] gegen andere Backbencher führen, es sei denn, sie verwenden ein [hook|E] auf ihren [liege|E]\n$EFFECT_LIST_BULLET$Backbenchers. [titles|E] kann nicht von Charakteren außerhalb der [realm|E]\n$EFFECT_LIST_BULLET$ vererbt werden. Alle Backbencher, die die Titelrücknahme oder die Rücknahme durch den Backbencher verweigern, gelten als [criminals|E]\n$EFFECT_LIST_BULLET$A. [christian|E] [head_of_faith|E] kann das [GetDecision('enact_a_bull_decision').GetName] [decision|E] verwenden, um ein [great_holy_war|E]\n$EFFECT_LIST_BULLET$ zu erklären. Kann das [GetDecision('pam_establish_theocratic_dynasty_decision').GetName] [decision|E]\n$EFFECT_LIST_BULLET$[subordinates|E] und weltliche [rulers|E] verwenden, die leichter zu [puppet|E] sind."
 church_claim_de_jure_liege_modifier: "Anspruch auf einen de jure Hinterbänkler-Titel"
 claimant_faction_member_opinion: "Thronender Parteiführer"
 convert_to_religion_interaction: "Ideologie übernehmen"
 council_interaction.0001.desc.accept: "Ich werde sofort mit der Arbeit beginnen, um meine neuen Verantwortlichkeiten zu erfüllen, und sehe Sie beim nächsten Kabinettstreffen!"
 county_capital_province_modifier: "Wahlkreis-Hauptstadt"
 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "Wir müssen stundenlang über die Gesetze der richtigen Körperpflege und des Erscheinungsbildes debattiert haben, uns heftig gegenseitig gestikulierend, antike Gesetze zitierend, von denen nur wenige im Büro scheinbar wussten. Als der Rauch des Spektakels sich geklärt hatte,"
 court_amenities_interactions.0002.desc_lost: "Ich bin schockiert festzustellen, dass ich tatsächlich gegen das Gesetz verstoße!\n\n Ich stehe verlegen da, während die [debate_locale.GetNameNoTierNoTooltip] Burgwachen und Stylisten mich bis auf meine Unterwäsche ausziehen und dann weiter ausziehen! Den Büros ausgesetzt, fliehe ich mit meinem Stolz zwischen meinen Beinen vom Ort des Geschehens."
 court_amenities_interactions.0002.desc_won: "es scheint, dass ich gewonnen habe!\n\n Somit wurde [recipient.GetName] gezwungen, sich bis auf [recipient.GetHerHis] Unterwäsche auszuziehen! Alle Anwesenden im Büro sahen [recipient.GetHerHim] genau so, wie [ROOT.Char.GetFaith.CreatorName] [recipient.GetHerHim] erschaffen hat!"
 court_amenities_interactions.0003.desc_won: "es scheint, dass ich gewonnen habe!\n\n Somit wurde [actor.GetName] gezwungen, sich bis auf [actor.GetHerHis] Unterwäsche auszuziehen! Alle Anwesenden im Büro sahen [actor.GetHerHim] genau so, wie [ROOT.Char.GetFaith.CreatorName] [actor.GetHerHim] erschaffen hat!"
