 piety_level_6_desc: "$piety_level_6$ ist der sechste [piety_level|E]. Die nächste Stufe ist [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L].\n\nWenn ein [mandala|E] [ruler|E] auf eine für seine [aspect|E] akzeptable Weise stirbt, nachdem er [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] erreicht hat, entwickelt die [heir|E] dieses Herrschers die Fähigkeit, zu diesem politischen Hauptstadtlevel aufzusteigen.\n\nEffekte:\n[GetPietyLevelDesc('(int32)6')|=+]"
 piety_level_7_desc: "$piety_level_7$ ist die siebte [piety_level|E]. Die nächste Ebene ist [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L].\n\nWenn ein [mandala|E] [ruler|E] auf eine Weise stirbt, die für ihren [aspect|E] akzeptabel ist, nachdem [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L] erreicht wurde, entwickelt der [heir|E] dieses Herrschers die Fähigkeit, zu diesem Political Capital Level aufzusteigen.\n\nEffekte:\n[GetPietyLevelDesc('(int32)7')|=+]"
 piety_level_8_desc: "$piety_level_8$ ist die achte und höchste mögliche [piety_level|E] für die [mandala|E] [government|E].\n\nWenn ein [mandala|E] [ruler|E] auf eine Weise stirbt, die von ihrem [aspect|E] akzeptiert wird, nachdem sie [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L] erreicht haben, entwickelt der [heir|E] dieses Herrschers die Fähigkeit, zu diesem ultimativen politischen Kapitalniveau fortzuschreiten.\n\nEffekte:\n[GetPietyLevelDesc('(int32)8')|=+]"
