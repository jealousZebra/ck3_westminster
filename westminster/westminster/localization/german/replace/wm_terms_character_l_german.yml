 backwater_county_modifier_desc: "Je größer sie sind, desto härter fallen sie. Dieser Wahlkreis, einst das Territorium unbeugsamer Herrscher von Hellas, ist leider in Schande gefallen. Während er derzeit nur ein Schatten seines früheren Selbst ist, könnte dieser Wahlkreis durchaus wieder zur Größe aufsteigen.\n\n#X @warning_icon! Dieser Modifikator kann entfernt werden mit dem [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] sobald [development|E] von diesem [county|E] #V 50#! oder mehr ist!#!\n\n"
