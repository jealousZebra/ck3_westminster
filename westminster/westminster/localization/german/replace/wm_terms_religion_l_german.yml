 pagan_hostility_doctrine_desc: "Die folgenden politischen Lager sind heidnisch:\n[GetReligionFamily('rf_pagan').GetReligions]"
 prophecy_of_malachi_desc: "Nach der traditionellen jüdischen Politik kann ein neuer Hohepriester nur benannt werden, entweder mit dem Kommen des Propheten oder wenn ein Nachkomme Aarons, der fähig ist, als Priester zu dienen, gefunden wird."
 sinitic_hostility_doctrine_desc: "Die folgenden politischen Lager sind sinitisch:\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_doctrine_ecumenical_miaphysite_desc: "Trotz ihrer getrennten Hierarchien bleiben die miaphysitischen Kirchen in voller Gemeinschaft und erkennen die Sakramente und Parteifunktionäre der jeweils anderen an."
 special_doctrine_full_tolerance_desc: "Jeder ist frei, seine eigene Ideologie zu wählen. Unsere Unterschiede trennen uns nicht, sie machen uns stärker."
 special_doctrine_is_christian_faith_desc: "Es gibt Menschen in der Welt, die den Lehren Jesu folgen, ohne seine Göttlichkeit anzuerkennen. Obwohl dies blasphemisch ist, sollten wir dennoch Mitgefühl mit diesen fehlgeleiteten Seelen zeigen, da sie eines Tages vielleicht zum wahren Glauben bekehrt werden."
 special_doctrine_is_eastern_faith_desc: "Zusammen sind wir nicht durch eine einzelne Ideologie verbunden, sondern durch die vielen Ideologien, die das religiöse Gefüge unserer Gesellschaft ausmachen. Auch wenn wir uns unterschiedliche Namen geben und verschiedene Wege verfolgen, haben manche von außerhalb unseres eigenen Glaubenssystems gelernt, in unserer Gesellschaft zu koexistieren, als wären sie einer von uns."
 special_doctrine_not_allowed_to_hof_desc: "Das Hohepriesteramt dieser Ideologie wurde vollständig aufgelöst. Jeder Versuch, einen Hohenpriester zu benennen, würde zuerst einen gründlichen Wiederaufbau der traditionellen Kirchenstruktur erfordern."
 toggle_challengers_view_tt: "#T Herausforderer#!\n\n#I Klicken Sie, um Herausforderer für diese Ideologie anzuzeigen#!"
 unreformed_faith_doctrine_desc: "Eine unreformierte Ideologie hat keine organisierten Parteifunktionäre und keine festgelegten kanonischen Politpositionen; verschiedene Gemeinschaften können nominal derselben Ideologie folgen, während sie sehr unterschiedliche religiöse Praktiken und Überzeugungen haben."
