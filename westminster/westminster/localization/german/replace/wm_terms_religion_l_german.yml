 doctrine_category_special: "Besondere politische Positionen"
 doctrine_clerical_function_recruitment_desc: "Unser [ROOT.Faith.PriestNeuterPlural] kann die Waffen ergreifen und unsere Ideologie verteidigen. Die Verantwortung, als Vorbild zu führen, verleiht ihnen zusätzliche Stärke im Kampf."
 doctrine_clerical_function_recruitment_descriptive_name: "Militärische Funktionen für die Parteileute"
 doctrine_clerical_function_taxation_descriptive_name: "Kontrollfunktionen für die Parteifunktionäre"
 doctrine_clerical_gender_either_descriptive_name: "Uneingeschränkte Geschlechter für Parteifunktionäre"
 doctrine_clerical_gender_female_only_desc: "Nur Frauen sind weise genug, den Willen von [ROOT.Faith.HighGodNamePossessive] zu interpretieren und als [ROOT.Faith.PriestFemalePlural] unserer Ideologie zu dienen."
 doctrine_clerical_gender_female_only_descriptive_name: "Frauenbeschränkte Parteifunktionäre"
 doctrine_clerical_gender_male_only_desc: "Nur Männer können die große Verantwortung tragen, als [ROOT.Faith.PriestMalePlural] unserer Ideologie zu dienen."
 doctrine_clerical_gender_male_only_descriptive_name: "Nur-männliche Partei-Officials"
 doctrine_clerical_succession_conditional_desc: "Das Recht, geistliche Titelträger zu ersetzen, bleibt ungeklärt. Eine solche umstrittene Regelung treibt die Ideologie unweigerlich in Richtung [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] sind letztlich Diener der Partei und sollten daher vom Parteiführer mit nur geringen Einschränkungen eingestellt und entlassen werden können."
 doctrine_deviancy_virtuous_desc: "Die Freuden des Fleisches bringen uns dem Göttlichen näher, und somit sind diejenigen, die von konventionellen Begierden ungebunden sind, der Höhepunkt der Tugend in unserer Ideologie."
 doctrine_family_rites_descriptive_name: "Familienbestattungs-Ideologien"
 doctrine_family_rites_name: "Familienideologien"
 doctrine_head_of_faith_name: "Bewegungsleiter"
 doctrine_monasticism_accepted_desc: "Klosterleben ist erlaubt, aber nicht zentral für die Ideologie. Die Frommen können Gelübde ablegen und sich in religiöse Häuser zurückziehen, doch die Tradition betont nicht den Mönchstum als idealen Weg."
 doctrine_monasticism_forbidden_desc: "Diese Ideologie lehnt das klösterliche Leben ausdrücklich ab. Das Ablegen von Gelübden ist verboten, und diejenigen, die die klösterliche Eigenschaft tragen, gelten in den Augen der Ideologie als Verbrecher."
 doctrine_mythic_literary_desc: "Die Ideologie verbreitet sich und besteht durch Geschichten über göttliche Werke, von denen viele in literarischen Werken gesammelt sind."
 doctrine_no_head_descriptive_name: "Kein Bewegungsleiter"
 doctrine_parameter_block_from_create_hof_parameter: "Diese Ideologie kann ihr [head_of_faith|E] unter normalen Umständen nicht wiederherstellen."
 doctrine_parameter_clerical_appointment_head_of_faith: "[realm_priests|E] oder [court_chaplains|E] werden aus den Parteibeamten ausgewählt und nach Bedarf [rulers|E] zugewiesen."
 doctrine_parameter_divorce_approval: "Charaktere dürfen [divorce|E] ihre [spouse|E] ändern, wenn ihr spiritueller [head_of_faith|E] zustimmt (oder [house_head|E], wenn kein geistlicher Bewegungsführer existiert)"
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "Nicht-östliche [faiths|E] mit der $tenet_eastern_syncretism_name$ Ursache werden als [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] statt $hostility_evil_tooltippable$ betrachtet"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "nicht-sinitische [faiths|E] mit der $tenet_sinitic_syncretism_name$ Ursache gelten als [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] statt als $hostility_evil_tooltippable$"
 doctrine_parameter_minimum_fervor: "Verurteilung darf nicht unter #V $VALUE|0$ % fallen #!"
 doctrine_parameter_pluralism_fundamentalist_proselytization_bonus: "Geschwindigkeit der Wahlkreis-Konversion: #P +20%#!"
 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal: "Kann #P Landtitel#! von $hostility_hostile_tooltippable$ und $hostility_evil_tooltippable$ Gegnern entziehen, ohne [tyranny|E] zu riskieren"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy: "#N Erhöhtes Risiko#! durch Splittergruppen bei niedrigem [fervor|E]"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance: "Wahlkreise anderer [faiths|E] sind #P weniger wahrscheinlich#! [factions|E] beizutreten"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals: "Der Gewinn eines [holy_war|E] macht den gegnerischen [rulers|E] im Zielgebiet zu einem Vasall, anstatt dessen Land zu erobern"
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty: "Geschwindigkeit der Wahlkreis-Konversion: #N -20%#!"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy: "#P Reduziertes Risiko#! von Splittergruppen bei niedriger [fervor|E]"
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced: "Kann #P Landtitel#! von $hostility_evil_tooltippable$ Gegnern entziehen, ohne [tyranny|E] zu riskieren"
 doctrine_parameter_spiritual_head_of_faith: "Die Position von [head_of_faith|E] wird einem prominenten Parteifunktionär übergeben."
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "Wenn die Ideologie [great_holy_wars|E] hat, darf der Bewegungsleiter den Krieg leiten und entscheiden, wer das Kriegsziel sein wird."
 doctrine_pilgrimage_encouraged_desc: "Diese Ideologie ermutigt ihre Mitglieder, irdische Orte zu besuchen, die als spirituell bedeutend angesehen werden, um ihre Ehrfurcht vor [ROOT.Faith.PantheonTerm] zu zeigen."
 doctrine_pilgrimage_forbidden_desc: "Die Präsenz von [ROOT.Faith.HighGodName] ist überall zu spüren, und die Vorstellung, dass bestimmte Orte göttlicher sind als andere, ist nichts Geringeres als zersplitternd."
 doctrine_pilgrimage_local_rites_desc: "Anhänger dieser Ideologie bevorzugen den Komfort und die Stabilität routinemäßiger Ideologien an lokalen Schreinen gegenüber den Gefahren und Belastungen langer Pilgerfahrten."
 doctrine_pilgrimage_local_rites_name: "Lokale Ideologien"
 doctrine_pluralism_fundamentalist_desc: "Unsere Ideologie ist die einzige wahre Ideologie, unser Wort das einzige wahre Wort. Jede Abweichung vom [ROOT.Faith.ReligiousText] ist von Natur aus blasphemisch."
 doctrine_sacraments_absent_desc: "Diese Tradition legt keinen Schwerpunkt auf Sakramente oder ein formales System heiliger Ideologien. Das religiöse Leben ist nicht auf die rituelle Verwaltung durch Parteifunktionäre oder die Bedeutung bestimmter Zeremonien ausgerichtet."
 doctrine_sacraments_general_desc: "Die Ideologie gibt Sakramente und heilige Ideologien zentrale Bedeutung. Rituale sind nicht nur symbolisch, sondern rufen die Gegenwart des Göttlichen hervor. Die Parteifunktionäre verwalten sie, und die Gläubigen können exkommuniziert werden."
 doctrine_spiritual_head_desc: "Die physische Welt und die geistige Welt sind nicht gleich. Wir müssen sicherstellen, dass die geistige Welt ihren eigenen Führer hat, der uns leitet und unsere Ideologie davor schützt, durch körperliche Begierden entweiht zu werden."
 doctrine_status_mainline: "Hauptpolitik-Position"
 doctrine_status_rite: "Ideologie Politische Position"
 doctrine_status_rite_mainline: "Hauptpolitik-Position"
 doctrine_temporal_head_desc: "Das Spirituelle und das Physische sind untrennbar miteinander verbunden, ganz und unteilbar. Es ist töricht, für eine Partei zwei verschiedene Führer zu haben."
 doctrine_theocracy_lay_clergy_desc: "Jeder treue Anhänger ist mehr als fähig, die politischen Positionen unserer Ideologie zu verstehen, zu folgen und zu predigen."
 doctrine_theocracy_lay_clergy_name: "Laien-Partei-Vertreter"
 doctrine_theocracy_temporal_desc: "Nur zugelassene [ROOT.Faith.PriestNeuterPlural] können mit der Aufrechterhaltung der Politikpositionen unserer Ideologie und damit auch mit der Verwaltung und Pflege unserer heiligen Orte betraut werden."
 doctrine_theocracy_temporal_descriptive_name: "Beamte der theokratischen Partei"
