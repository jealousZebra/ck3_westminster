 FAITH_CREATION_BASIC_UI_DESC: "#weak Ich habe eine einzigartige Gelegenheit, unsere Ideologie für immer neu zu gestalten. Ich muss sorgfältig planen, da das neue Dogma nach seiner Etablierung gegenüber Veränderungen undurchlässig sein wird.\n\nPriester und Gelehrte reisten zu meinem Büro, um alle Arten von Theologie zu besprechen, und versuchten, eine vollständige und solide Neuinterpretation unserer alten mündlichen Traditionen zu kodifizieren, aber ich bin derjenige, der diese Reform möglich gemacht hat.#!\n\nIch habe das letzte Wort über die [core_tenets|E] und [doctrines|E] unserer neuen [faith|E]."
