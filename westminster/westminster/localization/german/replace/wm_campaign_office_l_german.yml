 camp_fire_wandering_poets_domicile_building: "Wortschmiede"
 camp_fire_wandering_poets_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('camp_fire_01').GetName])#!\nMenschen, die einen Flyer zum Singen bringen und einen Slogan haften lassen können."
 camp_main_01_domicile_building: "Kampagnen-Hauptquartier"
