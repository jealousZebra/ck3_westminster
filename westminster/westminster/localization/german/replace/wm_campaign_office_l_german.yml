 proving_grounds_bodyguard_drills_domicile_building: "Personenschutzübungen"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA Kandidat in der Öffentlichkeit braucht jemanden, der die Menge beobachtet."
 proving_grounds_camel_run_domicile_building: "Ländliche Routen"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('proving_grounds_01').GetName])#!\nVillages, Bauernhöfe und Gassen ohne Straßennamen: Ein Canvas-Plan für das Land."
 proving_grounds_elephantry_reserve_domicile_building: "Promi-Unterstützer"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA Schauspieler, Fußballer und TV-Koch, der für die Kameras auftaucht."
 proving_grounds_horse_run_domicile_building: "Zyklus-Canvas"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nFahrräder für die langen Straßen und die Anwesen, die der Kleinbus nicht erreichen kann."
 proving_grounds_life_in_the_saddle_domicile_building: "Leben auf der Straße"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nManche Menschen kommen nur in einer anderen Stadt jeden Tag richtig zur Geltung."
 proving_grounds_lockwagon_domicile_building: "Geteilter Fund"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nJede Spende geht in einen Topf, und der Topf bezahlt für alles. Meistens."
 proving_grounds_martial_study_domicile_building: "Fallstudien zu Wahlkämpfen"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nJede Wahl wurde schon einmal geführt. Lies, wie sie gewonnen wurde."
 proving_grounds_mock_battle_drills_domicile_building: "Probeabstimmungstage"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA vollständige Probe des Wahltags, vom ersten Knock-up bis zum Schluss der Wahl."
 proving_grounds_nightly_barding_drills_domicile_building: "Kampfbus-Übungen"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nLaden, fahren, entladen, werben, wiederholen, bis es wie ein Uhrwerk läuft."
 proving_grounds_personal_bouts_domicile_building: "Debattenpraxis"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nScheinversammlungen mit einem Mitarbeiter, der Ihren übelsten Gegner spielt."
 proving_grounds_the_stick_game_domicile_building: "Büro-Lotterie"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nEs kommt auf das Ergebnis, die Beteiligung und darauf an, welcher Kandidat zuerst weint."
 proving_grounds_the_stump_domicile_building: "Die Tribüne"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA Kiste auf dem Marktplatz und viel Übung darin, ausgebuht zu werden."
 proving_grounds_training_circle_domicile_building: "Rollenspielkreis"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('proving_grounds_01').GetName])#!\nWütender Wähler, besorgter Wähler, Wähler, der über Mülltonnen sprechen möchte: jeder übt alles."
 quartermaster_camp_officer: "Büroleiter"
 quartermaster_camp_officer_desc: "Die $quartermaster_camp_officer$ verwaltet die Kampagnenmittel, den Vorratsschrank für Schreibwaren und die Einsatzpläne."
 second_camp_officer: "Stellvertretender Wahlkampfmanager"
 second_camp_officer_desc: "Der $second_camp_officer$ leitet das Büro, wenn der Kandidat an der Haustür unterwegs ist, und hält alle anderen auf Kurs."
 stooge_camp_officer: "Praktikant"
 stooge_camp_officer_desc: "Die $stooge_camp_officer$ macht das Kopieren, den Kaffeebesuch und jeden Job, den sonst niemand will. Die Moral verbessert sich, für alle anderen."
 supply_tent_01_domicile_building: "Druckerei"
 supply_tent_01_domicile_building_desc: "Flugblätter, Poster, Umschläge und der eine Drucker, den alle verfluchen. Die Kampagne läuft auf Papier."
 supply_tent_arsenal_domicile_building: "Flugblätter auf Vorrat"
 supply_tent_arsenal_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('supply_tent_01').GetName])#!Kisten mit jedem Flugblatt, das die Kampagne je entworfen hat, bereit für jede Straße auf eine Stunde Vorankündigung."
 supply_tent_climbing_gear_domicile_building: "Leitern und Kabelbinder"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('supply_tent_01').GetName])#!Eall der Laternenpfahl im Wahlkreis ist eine Posterseite, wenn man ihn erreichen kann."
 supply_tent_mender_domicile_building: "Gebrauchte Ausrüstung"
 supply_tent_mender_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('supply_tent_01').GetName])#!onierte Laptops und generalüberholte Handys: nicht schön, aber sie funktionieren."
 supply_tent_reserve_provisions_domicile_building: "Rücklagenfonds"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('supply_tent_01').GetName])#!Money für die letzten zwei Wochen beiseitegelegt, wenn jedes Pfund doppelt zählt."
 supply_tent_reserve_water_domicile_building: "Notfallflotte"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('supply_tent_01').GetName])#!Eine Keksdose voller Kleingeld für Dinge, die niemand eingeplant hat."
 supply_tent_smithy_domicile_building: "Hausinterner Drucker"
 supply_tent_smithy_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('supply_tent_01').GetName])#!Eine richtige Presse im Hinterzimmer: kein Warten mehr eine Woche auf die Drucker."
 supply_tent_subdued_gear_domicile_building: "Zivilkleidung"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('supply_tent_01').GetName])#!No-Rosetten, keine Lanyards: manche Arbeiten sind besser ohne Farbe."
 supply_tent_sutler_domicile_building: "Bulk-Buy Lieferanten"
 supply_tent_sutler_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('supply_tent_01').GetName])#!Ein Großhändler, der einen guten Preis für A5 macht, wenn man nett fragt und pünktlich bezahlt."
 witness_camp_officer: "Begünstigungsbeauftragter"
 witness_camp_officer_desc: "Der $witness_camp_officer$ sammelt jeden Unterstützungsbrief und sorgt dafür, dass alle davon hören."
