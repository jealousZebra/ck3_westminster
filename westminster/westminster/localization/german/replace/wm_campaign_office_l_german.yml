 baggage_train_01_domicile_building: "Battle Bus"
 baggage_train_01_domicile_building_desc: "Ein Kleinbus, ein Navigationsgerät und ein Koffer voller Flugblätter: Die Kampagne geht dorthin, wo die Wähler sind."
