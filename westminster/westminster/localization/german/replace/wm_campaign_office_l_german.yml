 baggage_train_ample_steeds_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('baggage_train_01').GetName])#!\nWwenn einer am Bypass ausfällt, ist der andere bereits unterwegs."
 baggage_train_ascetics_domicile_building: "Politische Freiwillige"
 baggage_train_ascetics_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nPensionierte Beamte und ernsthafte Studenten, die das gesamte Weißbuch lesen, damit Sie es nicht tun müssen."
 baggage_train_bartering_grounds_domicile_building: "Verkaufsstand"
 baggage_train_bartering_grounds_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nTassen, Tragetaschen und Anstecknadeln: Unterstützer bezahlen, um Sie zu bewerben."
 baggage_train_kennel_domicile_building: "Bürohund"
 baggage_train_kennel_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nGut für die Moral, besser für Fotogelegenheiten."
 baggage_train_negotiators_domicile_building: "Reputationsmanager"
 baggage_train_negotiators_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('baggage_train_01').GetName])#!\nA schlechte Überschrift ist ein Problem; eine schlechte Überschrift, auf die niemand geantwortet hat, ist eine Krise."
 baggage_train_pleasure_tents_domicile_building: "Privatbüros"
 baggage_train_pleasure_tents_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nA Tür, die sich schließt. Führungskräfte schätzen das mehr als eine Gehaltserhöhung."
 baggage_train_porters_domicile_building: "Umzugswagen"
 baggage_train_porters_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nDas gesamte Büro in eine neue Stadt zu verlegen dauert ein Wochenende, nicht einen Monat."
 baggage_train_proof_of_claims_domicile_building: "Begünstigungsdatei"
 baggage_train_proof_of_claims_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nUnterstützungsschreiben von Ratsmitgliedern, Gewerkschaftsvertretungen und den örtlichen Größen und Honoratioren, bereit zum Winken."
 baggage_train_ransom_cages_domicile_building: "Warteraum"
 baggage_train_ransom_cages_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('baggage_train_01').GetName])#!\nWin warten unangenehme Besucher, während jemand Älteres gefunden wird, um sich um sie zu kümmern."
 baggage_train_scribes_domicile_building: "Pressesprecher"
 baggage_train_scribes_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nPressemitteilungen, Leserbriefe und Stellungnahmen, die verfasst werden, bevor irgendjemand fragt."
 baggage_train_shrine_domicile_building: "Ruheraum"
 baggage_train_shrine_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nEin Ort zum Beten, Nachdenken oder einfach zehn Minuten fern von den Telefonen sein."
 baggage_train_siege_engineers_domicile_building: "Digitalteam"
 baggage_train_siege_engineers_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nGezielte Werbung, E-Mail-Listen und ein Dashboard, das alle zehn Minuten aktualisiert wird."
 baggage_train_trackers_domicile_building: "Wahlwerbungsdaten"
 baggage_train_trackers_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('baggage_train_01').GetName])#!\nJede Tür, an die geklopft wurde, jede Absicht des Wählers: die Kampagne weiß, wohin sie als Nächstes gehen muss."
 barber_tent_01_domicile_building: "Wohlfahrtsraum"
 barber_tent_01_domicile_building_desc: "Ein Sofa, ein Wasserkocher und ein Erste-Hilfe-Kasten: ein Ort, an dem sich Freiwillige von der Haustür erholen können."
