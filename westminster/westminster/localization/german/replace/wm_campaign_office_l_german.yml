 camp_move_desc: "Moving your [camp|E] to another town brings new [task_contracts|E] and new doors to knock on.\n\n#weak Moving far puts you out of reach of your [contact_list_contacts|E], so call in any favours first.#!\n\n#P Click to move your Campaign Office#!"
 camp_perimeter_01_domicile_building: "Rezeption"
 camp_perimeter_01_domicile_building_desc: "Jemand, der die Tür, das Telefon und den verärgerten Wähler beantwortet, in dieser Reihenfolge."
 camp_perimeter_camp_hygiene_domicile_building: "Reinigungsplan"
 camp_perimeter_camp_hygiene_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nDe Kühlschrank wird jeden Freitag geräumt. Das ist gesetzesvor."
 camp_perimeter_ditch_domicile_building: "Poller"
 camp_perimeter_ditch_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nNiemand parkt zweimal einen Lieferwagen vor der Bürotür."
 camp_perimeter_extra_watch_domicile_building: "Türzugangssystem"
 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nA Buzzer, eine Kamera und eine Liste der erwarteten Personen."
 camp_perimeter_fixed_layout_domicile_building: "Hot-Desk-Plan"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nDie gleiche Schreibtische, derselbe Schicht, wo auch immer das Büro hinzieht. Jeder weiß, wo alles ist."
 camp_perimeter_good_siting_domicile_building: "Frontseite der High Street"
 camp_perimeter_good_siting_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nDirekt an der Bushaltestelle und dem Supermarkt: Jeder läuft am Fenster vorbei."
 camp_perimeter_palisade_domicile_building: "Fensterläden"
 camp_perimeter_palisade_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nStahlrollläden nach Einbruch der Dunkelheit: Die Fenster überstehen den Wahltag."
 camp_priest_camp_officer: "Wohlfahrtsbeamter"
 camp_priest_camp_officer_desc: "Die $camp_priest_camp_officer$ kümmert sich um das Team: ein offenes Ohr, ein leises Wort und ein Auge darauf, wer ausbrennt."
 camp_purpose: "Politischer Fokus"
 camp_purpose_brigands: "Medienexperte"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Bietet mehr Medienrunden und Oppositionsrecherche an\n$EFFECT_LIST_BULLET$Jede gut erledigte Aufgabe bringt zusätzliches [prestige|E]: mehr Sendezeit\n$EFFECT_LIST_BULLET$Schaltet frei [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$Kann auf bestimmte spezielle [officers|E] zugreifen:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Freigeschaltet über $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (Freigeschaltet über $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Freigeschaltet über $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Verfügbar für Kommentare, jeder Kanal, jede Stunde, jedes Thema.#!"
 camp_purpose_confirmation_button_text: "Fokus ändern"
 camp_purpose_explorers: "Basisorganisator"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Oerlitt mehr Wahlkampf, Telefonbank- und Wählerjobs\n$EFFECT_LIST_BULLET$Tstürmt schneller zwischen den Haustüren\n$EFFECT_LIST_BULLET$Unlocks geht [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK Jede Straße hat eine Tür, an die noch nicht geklopft wurde. #!"
 camp_purpose_legitimists: "Party-Fixer"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$Bietet mehr interne Aufgaben der Partei an: Redenschreiben und Recherche\n$EFFECT_LIST_BULLET$Jede gut erledigte Aufgabe bringt zusätzliches Parteiansehen\n$EFFECT_LIST_BULLET$Schaltet frei [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$Kann auf bestimmte spezielle [officers|E] zugreifen:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak (Freigeschaltet über $baggage_train_proof_of_claims_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Freigeschaltet über $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Jemand muss die Stimmen vor der Wahl zählen und wissen, wer wem etwas schuldet.#!"
 camp_purpose_mercenaries: "Wahlkampfberater"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Weitere Jobs im Fundraising, Telefonbanking und Kostenermittlung angeboten\n$EFFECT_LIST_BULLET$Jeder gut erledigte Job verdient zusätzlich [gold|E]: die Rechnung\n$EFFECT_LIST_BULLET$Schaltet frei [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$Kann auf bestimmte spezielle [officers|E] zugreifen:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Freigeschaltet über $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Freigeschaltet über $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Strategie, Daten und ein Tagessatz. Ergebnisse sind nicht garantiert; Rechnungen sind es.#!"
 camp_purpose_pass_phrase: "[Law.GetNameNoTooltip] werden"
 camp_purpose_scholars: "Think-Tank-Experte"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Bietet mehr politische Berichte, Redenschreiben und Kostenermittlungsaufgaben an\n$EFFECT_LIST_BULLET$Lernt schneller bei jeder Aufgabe\n$EFFECT_LIST_BULLET$Schaltet frei [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Kann auf bestimmte spezielle [officers|E] zugreifen:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Freigeschaltet über $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK Es gibt eine Fußnote für alles und ein Diagramm für die meisten davon.#!"
 camp_purpose_wanderers: "Parteiaktivist"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Oerlebte jede Art von Job, keinen mehr als einen weiteren\n$EFFECT_LIST_BULLET$Mein Wechsel zu irgendeinem anderen $camp_purpose$, ohne [prestige|E]\n\n#WEAK Flugblätter in der einen Tasche, eine Mitgliedskarte in der anderen zu geben und noch keine Ahnung, wohin das alles führt. #!"
 chief_engineer_camp_officer: "Digitaldirektor/in"
 chief_engineer_camp_officer_desc: "Der $chief_engineer_camp_officer$ betreibt die Daten, die Werbung und die Maschinerie einer modernen Kampagne."
