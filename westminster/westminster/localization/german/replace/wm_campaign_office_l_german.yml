 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('camp_fire_01').GetName])#!\nA Bier für diejenigen, die ihre Sitze verloren haben, und ein Versprechen, sie zurückzugewinnen."
 camp_fire_local_hangers_on_domicile_building: "Lokale Klatschgeschichten"
 camp_fire_local_hangers_on_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('camp_fire_01').GetName])#!\nDer Zeitungshändler, die Schuleltern und der Mann im Pub, der alles weiß."
 camp_fire_nightly_debates_domicile_building: "Spätnacht-Debatten"
