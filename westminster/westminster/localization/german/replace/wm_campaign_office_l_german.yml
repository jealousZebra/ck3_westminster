 camp_fire_juicy_rumors_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('camp_fire_01').GetName])#!\nAlles, was hinter verschlossenen Türen gesagt wird, landet irgendwo. Besser, es landet hier."
