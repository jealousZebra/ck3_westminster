 barber_tent_dentists_tools_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('barber_tent_01').GetName])#!\nA Krankenschwester im Dienst und eine angemessene Pausenregelung. Freiwillige bemerken es."
 barber_tent_morticians_tools_domicile_building: "Obduktionsteam"
 barber_tent_morticians_tools_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('barber_tent_01').GetName])#!\nAnach jeder Wahl muss jemand herausfinden, was schiefgelaufen ist und was man retten kann."
 barber_tent_reference_corpus_domicile_building: "Referenzbibliothek"
 barber_tent_reference_corpus_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('barber_tent_01').GetName])#!\nHansard, alte Wahlprogramme und jeder Ausschussbericht, der es wert ist, auf Regalen und in Akten zu haben."
 barber_tent_surgeons_tools_domicile_building: "Erste-Hilfe-Kasten"
