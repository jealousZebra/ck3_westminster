 mess_tent_bakers_domicile_building: "Bacon Rolls"
 mess_tent_bakers_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('mess_tent_01').GetName])#!\nSamstagmorgen, vor der Haustür-Aktion. Niemand verpasst es."
 mess_tent_brewers_domicile_building: "Kaffeemaschine"
 mess_tent_brewers_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('mess_tent_01').GetName])#!\nA echte, mit Bohnen. Morgens verdoppelt sich die Teilnehmerzahl der Leute."
 mess_tent_cooks_domicile_building: "Freiwillige Köche"
 mess_tent_cooks_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('mess_tent_01').GetName])#!\nMitglieder, die nicht werben können, aber dreißig Personen mit kleinem Budget verpflegen können."
 mess_tent_curers_domicile_building: "Portionszubereitung"
 mess_tent_curers_domicile_building_desc: "#weak (Benötigt [GetDomicileBuilding('mess_tent_01').GetName])#!\nA Gefrierfach voller Chili für die langen Nächte der kurzen Kampagne."
 mess_tent_herbalists_domicile_building: "Gesunde Snacks"
 mess_tent_herbalists_domicile_building_desc: "#weak (Erfordert [GetDomicileBuilding('mess_tent_01').GetName])#!\nObst sowie Kekse. Eine kleine Revolution."
 person_haggler_camp_officer: "Deal Broker"
