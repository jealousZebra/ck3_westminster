 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Endlich! [faction_target.GetName] ist nichts weiter als ein Narr, der eine [faction_target.GetTitleAsNameNoTooltip] spielt, und ich bin sicher, dass die Partei meiner Sache folgen wird. Diejenigen, die mir helfen, werden nicht vergessen."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] sitzt auf einem Thron, der eigentlich dir zusteht! Ich bin bereit, deinen Anspruch mit Wort und Schwert zu unterstützen, und ich bin sicher, dass auch andere in der Partei diese rechtmäßige Sache unterstützen werden. Alles, was du tun musst, ist zustimmen."
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "Endlich! [faction_target.GetName] ist nichts weiter als ein Narr, der eine [faction_target.GetTitleAsNameNoTooltip] spielt, und ich bin sicher, dass die Partei meiner Sache folgen wird. Diejenigen, die mir helfen, werden nicht vergessen."
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] sitzt auf einem Thron, der eigentlich dir zusteht! Ich bin bereit, deinen Anspruch mit Wort und Schwert zu unterstützen, und ich bin sicher, dass auch andere in der Partei diese rechtmäßige Sache unterstützen werden. Alles, was du tun musst, ist zustimmen."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "Endlich! [faction_target.GetName] ist nichts weiter als ein Spaßmacher, der einen [faction_target.GetTitleAsNameNoTooltip] spielt, und ich bin sicher, dass die Partei meine Sache unterstützen wird.\n\nAufgrund meines derzeit niedrigen Status kann ich dir nicht helfen. Aber wisse dies – #emphasis wenn#! du siegreich bist, werde ich dafür sorgen, dass du reich belohnt wirst!"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "Obwohl ich froh bin, die Partei gegen das falsche [faction_target.GetTitledFirstName] aufstehen zu sehen, hindert mich meine derzeitige Lage daran, euch in diesem gerechten Unterfangen zu begleiten. Wenn ihr Erfolg habt, werde ich euch verpflichtet sein."
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Mir ist klar, dass Sie die Partei brennen sehen würden, bevor Sie dieses törichte Unterfangen aufgeben. Zum Wohl der Partei muss ich Ihre Forderungen akzeptieren, aber wissen Sie, dass heute hier ein großes Unrecht begangen wurde. Das wird nicht hingenommen werden!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "Es ist mir klar, dass Sie die Partei brennen sehen würden, bevor Sie dieses törichte Unterfangen aufgeben. Zum Wohl von [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] muss ich Ihre Forderungen akzeptieren, aber wissen Sie, dass heute hier eine große Ungerechtigkeit begangen wurde. Das wird nicht ungeschehen bleiben!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nIhre fehlgeleiteten Forderungen werden uns alle nur schwächen. Dennoch bin ich gezwungen, Ihre Bitte um Unabhängigkeit anzunehmen, um die Partei vor vergeblichem Blutvergießen zu bewahren."
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Es ist mir klar, dass Sie die Partei brennen sehen würden, bevor Sie dieses törichte Unterfangen aufgeben. Zum Wohl von [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] muss ich Ihre Forderungen akzeptieren, aber wissen Sie, dass heute hier eine große Ungerechtigkeit begangen wurde. Das wird nicht ungeschehen bleiben!"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nDie treuen Untertanen der Partei haben Ihre fehlgeleiteten Politiken zu lange ertragen. Die [faction.GetName] verlangt, dass Sie einer neuen Ausrichtung für [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] zustimmen, oder wir werden Ihnen eine aufzwingen!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "Der Moment ist gekommen! Alle, die die Abtreibung [faction_target.GetTitledFirstNamePossessive] fehlgeleiteten Politiken unterstützen, werden nun gemeinsam aufstehen und dafür sorgen, dass die Partei in eine neue Richtung gelenkt wird. Wir werden es erreichen, wenn es sein muss, mit Schwert und Feuer!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nIhre fehlgeleiteten Forderungen werden uns alle nur schwächen. Dennoch bin ich gezwungen, Ihre Bitte um Unabhängigkeit anzunehmen, um die Partei vor vergeblichem Blutvergießen zu bewahren."
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nIhre selbstsüchtigen Vorstellungen von ‚Freiheit‘ werden die Partei als Ganzes schwächen. Trotzdem werde ich, um unnötiges Blutvergießen zu vermeiden, Ihren Forderungen nachkommen."
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n Es ist Zeit, dass Sie die alten und unveräußerlichen Rechte Ihrer Hinterbänkler anerkennen! Akzeptieren Sie die Forderungen des [faction.GetName] oder stellen Sie sich unseren Schwertern auf dem Schlachtfeld!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "In Ordnung! Meine Partei hat keinen Platz für eure ungewaschenen Herden."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Wir werden Ihre abscheuliche Unterdrückung der stolzen [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] nicht länger tolerieren. Geboren, um frei unter diesen offenen Himmeln zu wandern, lehnen wir Ihre Tyrannei ab — unsere Zeit ist gekommen!\n\nWir werden Ihre Herrschaft und die Ihres Parteiführers, [faction_target.GetTitledFirstName], ein für alle Mal abwerfen!!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "Wir werden keine weitere Unterdrückung durch Ihre [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] Herrschaft zulassen. [peasant_leader.GetRite.GetName|U] muss als die herausragende [rite|E] der [ROOT.Char.GetPrimaryTitle.GetName] anerkannt werden!\n\nGeben Sie unserer Ideologie den rechtmäßigen Status, den sie verdient, oder bereiten Sie sich darauf vor, den Zorn unserer vielen Getreuen zu erfahren!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "Wir werden Ihre abscheuliche Unterdrückung guter [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] nicht länger dulden. Unsere Zeit ist jetzt gekommen!\n\nWir werden uns von Ihrer Herrschaft und der Tyrannei Ihres Parteiführers, [faction_target.GetTitledFirstName], befreien!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "Wir werden die fremde Unterdrückung von [peasant_leader.GetCulture.GetName] Traditionen nicht länger dulden. Unsere Zeit ist jetzt gekommen!\n\nWir werden nichts weniger als die totale Freiheit von Ihrem Parteiführer, [faction_target.GetTitledFirstName], verlangen!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "Wir werden Ihre abscheuliche Unterdrückung treuer [peasant_leader.GetFaith.GetAdherentNamePlural] nicht länger dulden. Unsere Zeit ist jetzt gekommen!\n\nMit [peasant_leader.GetFaith.WarGodName] als unserem Führer werden wir aufstehen und uns von der Herrschaft Ihres Parteiführers, [faction_target.GetTitledFirstName], befreien!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N Sie werden einen Teil Ihrer Partei verlieren, wenn Ihr Parteiführer ihren Forderungen nachgibt!#!"
