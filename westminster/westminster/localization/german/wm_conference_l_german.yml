l_german:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "Konferenz: Die Rede des Leiters"
 wm_conference.1.desc: "Es ist Konferenzsaison, und die [wm_conference_party.GetNameNoTier] hat ein Küstenkonferenzzentrum für vier Tage mit Nebenveranstaltungen, Namensschildern und lauwarmem Kaffee übernommen. Morgen ist die große Veranstaltung: meine Rede vor dem Saal, live auf allen Nachrichtensendern. Die Redenschreiber haben Entwurf Nummer neunzehn erstellt. Die Pastillen sind in meiner Tasche. Das Set hat ein Motto in vier Fuß hohen Buchstaben, und jemand hat überprüft, dass keiner davon lose ist. Wahrscheinlich."
 wm_conference.1.a: "Halten Sie die Rede wie geschrieben."
 wm_conference.1.b: "Das Skript zerrreißen und aus dem Herzen sprechen."
 wm_conference.1.c: "Enthülle eine zentrale politische Ankündigung."

 wm_conference_headline_triumph: "TRIUMPHIERENDE REDE BEWEGT DAS HAUS ZU STEHEN"
 wm_conference_headline_solid: "REDE DES FÜHRERS: 'IN ORDNUNG', SAGEN DELEGIERTE"
 wm_conference_headline_disaster: "HUSTENDBETROFFENE KATASTROPHE, ALS DAS SET ZUSAMMENBRICHT"
 wm_conference_headline_policy_hit: "MUTIGES VERSPRECHEN STIEHLT DIE SHOW"
 wm_conference_headline_policy_flop: "Leuchtturmpolitik sinkt bis zum Mittag"
 wm_conference.2.desc_triumph: "Elf stehende Ovationen, eine davon während einer Atempause. Die Sketchautoren kämpfen darum, unhöflich zu sein, die Übernacht-Umfragen sind gestiegen, und die Parlamentspartei ist plötzlich sehr daran interessiert, mit mir an der Bar gesehen zu werden."
 wm_conference.2.desc_solid: "Keine stehenden Ovationen, keine Katastrophen und keine Buchstaben fallen vom Hintergrund. Die Zeitungen nennen es \" arbeitmäßig\", was von ihnen praktisch ein Liebesbrief ist."
 wm_conference.2.desc_disaster: "Es begann mit einem Kribbeln im Hals und endete mit einem Saal voller Delegierter, die Lutscher auf die Bühne reichten, während das hinter mir stehende Motto zwei Buchstaben verlor. Ein Demonstrant schaffte es bis zum Rednerpult. Die Sketch-Autoren hatten seit Jahren keinen solchen Tag mehr, und in der Bar sprechen meine Kollegen in leiser Stimme."
 wm_conference.2.desc_policy_hit: "Die Richtlinie wurde nicht getestet, sie wurde nicht geleakt und führt jedes Bulletin an. Rivalisierende Parteien hetzen, um zu behaupten, sie hätten zuerst daran gedacht. Die Halle rief meinen Namen, was schön war, wenn auch ein wenig beunruhigend."
 wm_conference.2.desc_policy_flop: "Bis ich die Bühne verlassen hatte, hatte ein Think Tank ein Loch von vierzig Milliarden Pfund in den Kostenberechnungen gefunden, und zwei meiner eigenen Hinterbänker hatten im Radio gesagt, dass sie noch nie davon gehört hatten."
 wm_conference.2.a: "Es gibt immer noch das nächste Jahr."

 wm_conference.10.t: "Konferenz: Lanyards und Fringe"
 wm_conference.10.desc: "Die [wm_conference_party.GetNameNoTier]-Konferenz ist in vollem Gange: vier Tage Nebentreffen in überhitzten Nebenräumen, Empfänge, die von Handelsorganisationen gesponsert werden, von denen niemand je gehört hat, und die Hotelbar, in der nach Mitternacht das eigentliche Geschäft stattfindet. [wm_conference_leader.GetName] spricht morgen. Wie verbringe ich meine Konferenz?"
 wm_conference.10.a: "Bei einem Randtreffen sprechen."
 wm_conference.10.b: "Planen in der Hotelbar."
 wm_conference.10.c: "Bearbeiten Sie die Empfänge und knüpfen Sie Kontakte."
 wm_conference.10.d: "Im Saal sitzen und den Führer laut und sichtbar applaudieren."
 wm_conference_fringe_good: "Fringe: Ein vollgepackter Raum und ein guter Bericht"
 wm_conference_fringe_off_message: "Fringe: Bemerkungen “Abweichen von der Botschaft”"
 wm_conference_plot_found_out: "Verschwörung: Von den Whips belauscht"

 wm_conference.20.t: "Führungsgerüchte"
 wm_conference.20.desc: "Die Konferenz ist vorbei, und das Gespräch dreht sich nicht um meine Rede. Anonyme Kollegen berichten den Sonntagszeitungen, dass der [wm_conference_party.GetNameNoTier] \"einen Neuanfang braucht\", ein Ausdruck, der niemals ein neues Logo bedeutet. Die Zuchtmeister haben Namen. Die Frage ist, was ich dagegen unternehme."
 wm_conference.20.a: "Den Verschwörern entgegentreten."
 wm_conference.20.b: "Versprechen, der Parlamentsfraktion zuzuhören."
 wm_conference.20.c: "Als Gerede aus der Westminster-Blase abtun."
 wm_conference_faced_down: "Gerüchte: Verschwörer ziehen sich zurück"
 wm_conference_not_faced_down: "Gerüchte: Die Geschichte läuft und läuft"

 wm_conference_triumph_modifier: "Konferenzerfolg"
 wm_conference_triumph_modifier_desc: "Hat eine Konferenzrede gehalten, die die Leute nächstes Jahr noch zitieren werden, aus den richtigen Gründen."
 wm_conference_disaster_modifier: "Konferenzdesaster"
 wm_conference_disaster_modifier_desc: "Hat eine Konferenzrede gehalten, die die Leute nächstes Jahr noch zitieren werden, aus den falschen Gründen."

 wm_conference_triumph_opinion: "Triumphierende Konferenzrede"
 wm_conference_disaster_opinion: "Katastrophale Konferenzrede"
 wm_conference_listened_opinion: "Versprochen, der Partei zuzuhören"
 wm_conference_contacts_opinion: "Auf der Konferenz getroffen"
 wm_conference_fellow_plotter_opinion: "Gemeinsam in der Hotelbar geplant"
 wm_conference_caught_plotting_opinion: "Beim Planen gegen mich erwischt"
 wm_conference_loyal_applause_opinion: "Habe meine Rede am lautesten bejubelt"
 wm_conference_off_message_opinion: "Ging bei einem Randmeeting vom Thema ab"
