l_german:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "Parteiarbeit"
 wm_job_canvassing_contract: "Wahlwerbung"
 wm_job_canvassing_desc_title: "Tür-werben gesucht"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] braucht an diesem Wochenende Freiwillige an der Haustür: Klemmbretter, Flugblätter und ein dickes Fell. Die Partei merkt sich, wer im Regen erscheint."
 wm_job_canvassing_request: "Drei Wochen an Türen klopfen. Erfolg hängt von Ihrem [diplomacy|E] ab."
 wm_job_fundraising_contract: "Fundraising-Dinner"
 wm_job_fundraising_desc_title: "Hilfe beim Ausfüllen der Tabellen"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] veranstaltet ein Benefizdinner und benötigt jemanden, der die Tische verkauft, die Spender verfolgt und die Tombola ehrlich hält."
 wm_job_fundraising_request: "Organisieren Sie das Abendessen über drei Wochen. Der Erfolg hängt von Ihrem [stewardship|E] ab."
 wm_job_speechwriting_contract: "Redenschreiben"
 wm_job_speechwriting_desc_title: "Eine Rede, die landet"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName] hat eine große Rede bevorstehen, und der aktuelle Entwurf ist, nach den Worten ihres Büros, 'ein Geiselvideo'."
 wm_job_speechwriting_request: "Schreibe die Rede über drei Wochen. Der Erfolg hängt von deinem [learning|E] ab."
 wm_job_research_contract: "Oppositionsforschung"
 wm_job_research_desc_title: "Auf die andere Seite eingehen"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] möchte ein Briefing über ihre Gegner: Wahlaufzeichnungen, alte Tweets, gebrochene Versprechen. Alles öffentlich, alles nützlich."
 wm_job_research_request: "Stellen Sie das Dossier über drei Wochen zusammen. Der Erfolg hängt von Ihrem [intrigue|E] ab."
 wm_job_phonebank_contract: "Telefonbank"
 wm_job_phonebank_desc_title: "Ein Abend am Telefon"
 wm_job_phonebank_desc: "[TaskContract.GetEmployer.GetName]'s Büro hat eine Liste von vierhundert Mitgliedern, die nicht verlängert wurden, einen Raum mit geliehenen Handys und ein Skript, das niemand geprobt hat."
 wm_job_phonebank_request: "Bearbeiten Sie die Anrufliste über drei Wochen. Der Erfolg hängt von Ihrem [diplomacy|E] ab."
 wm_job_policy_paper_contract: "Politikpapier"
 wm_job_policy_paper_desc_title: "Zehn Seiten, vollständig kalkuliert"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] möchte etwas zu lokalen Bussen sagen, das kein Slogan ist: Beweise, Zahlen und eine Empfehlung, die ein Minister unterzeichnen könnte."
 wm_job_policy_paper_request: "Schreibe die Arbeit über drei Wochen. Der Erfolg hängt von deinem [learning|E] ab."
 wm_job_media_round_contract: "Medienrunde"
 wm_job_media_round_desc_title: "Sechs Studios vor dem Frühstück"
 wm_job_media_round_desc: "Lokales Radio, Regionalfernsehen und zwei Podcasts wollen, dass jemand von [TaskContract.GetEmployer.GetName]s Seite hingeht und die Linie verteidigt. Niemand sonst meldete sich freiwillig."
 wm_job_media_round_request: "Bereite die Zeilen vor und führe die Interviews über drei Wochen hinweg. Der Erfolg hängt von deinem [intrigue|E] ab."
 wm_job_gotv_contract: "Stimmenmobilisierung"
 wm_job_gotv_desc_title: "Schlagt sie nieder, bringt sie raus"
 wm_job_gotv_desc: "[TaskContract.GetEmployer.GetName]'s Team braucht Kandidaten für die Nachwahl im Stadtrat: Wahlkarten, Schalterzahlen und viele Treppen in vielen Hochhäusern."
 wm_job_gotv_request: "Führe die Wähler-Mobilisierungsaktion über drei Wochen durch. Der Erfolg hängt von deinem [prowess|E] ab."
 wm_job_budget_contract: "Kosten eines Versprechens"
 wm_job_budget_desc_title: "Woher kommt das Geld?"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName] hat etwas Teures versprochen und die andere Seite fragt immer wieder, wie es bezahlt werden soll. Eine Tabelle wird dringend benötigt."
 wm_job_budget_request: "Kosten für das Gelöbnis über drei Wochen. Der Erfolg hängt von deinem [stewardship|E] ab."
 wm_selection_contract: "Kandidatenbewertung"
 wm_selection_contract_contract: "Kandidatenbewertung"
 wm_selection_contract_desc_title: "Die genehmigte Liste der Partei"
 wm_selection_contract_desc: "Bevor jemand für die Partei antreten kann, muss er einen Assessment-Tag bestehen: ein Probeinterview, einen politischen Test und ein Rollenspiel mit einem wütenden 'Wähler'."
 wm_selection_contract_request: "Bestehen Sie die Prüfung, um auf die Liste der genehmigten Kandidaten aufgenommen zu werden. Der Erfolg hängt von Ihrem [diplomacy|E] ab."

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "Bewerbungen geöffnet in [wm_sel_seat.GetName]"
 wm_career.20.desc: "Die lokale [wm_sel_party.GetName] wählt ihren Kandidaten für [wm_sel_seat.GetName]. Die E-Mail vom Vorsitzenden des Wahlkreises ist kurz: Die Bewerbungen schließen in ein paar Wochen, und es wird eine Kandidatenvorstellung im Gemeindezentrum geben.\n\nWer sich in Sitzen wie diesem aufstellt, wird Abgeordneter."
 wm_career.20.a: "Stellen Sie meinen Namen vor."
 wm_career.20.b: "Nicht dieses hier."
 wm_career.21.t: "Hustings in [wm_sel_seat.GetName]"
 wm_career.21.desc: "Plastikstühle, eine Teekanne und sechzig Parteimitglieder, die jede Präsentation schon einmal gehört haben. Jeder Bewerber bekommt zehn Minuten und Fragen aus dem Publikum. Wie gewinne ich sie für mich?"
 wm_career.21.a: "Über die Gegend sprechen: ihre Hauptstraße, ihre Busse, ihre Menschen."
 wm_career.21.b: "Einen kostengeplanten Plan, Politik für Politik, aufgestellt."
 wm_career.21.c: "Sie sanft daran erinnern, was die anderen Bewerber in der Vergangenheit gesagt haben."
 wm_career.21.success: "Der Raum erwärmte sich dir gegenüber."
 wm_career.21.failure: "Der Raum blieb kalt."

 wm_career_selected_toast: "Für [wm_sel_seat.GetName] ausgewählt"
 wm_career_selected_toast_desc: "Die lokale [wm_sel_party.GetName] hat Sie als ihren Kandidaten gewählt. Gewinnen Sie den Sitz bei der nächsten Wahl oder Nachwahl und Sie sind Abgeordneter."
 wm_career_not_selected_toast: "nicht ausgewählt in [wm_sel_seat.GetName]"
 wm_career_not_selected_toast_desc: "Die Mitglieder wählten [wm_sel_winner.GetName]. Beim nächsten Mal werden Sie bekannter sein."
 wm_career_elected_toast: "Ins Parlament gewählt"
 wm_career_elected_toast_desc: "Die Auszählung ist abgeschlossen und der Sitz gehört Ihnen. Das Kampagnenteam ist aufgelöst; die Fraktionsdisziplinatoren Ihrer Partei werden sich melden."

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "Für Auswahl bewerben"
 wm_career_apply_decision_desc: "Meinen Namen als Kandidat meiner Partei in einem Wahlkreis aufstellen, in dem die lokalen Mitglieder einen auswählen. Parteistand: [GetPlayer.MakeScope.Var('wm_standing').GetValue|0]."
 wm_career_apply_decision_tooltip: "Sich als Kandidat der Partei für einen Sitz bewerben"
 wm_career_apply_decision_free_tt: "Noch nicht für einen Sitz beworben oder als Kandidat ausgewählt"
 wm_career_apply_decision_standing_tt: "Auf der Liste der von der Partei genehmigten Kandidaten oder mit einem Parteistand von mindestens 30"
 wm_career_apply_decision_open_tt: "Die Partei sucht sich irgendwo einen Kandidaten aus"
 wm_career_apply_decision_effect_tt: "Sie bewerben sich für eine der Auswahlen, die die Partei offen hat, vorzugsweise in Ihrem eigenen Land, und sprechen bei deren Wahlveranstaltungen."
 wm_career_return_decision: "Zurück auf dem Wahlkampfweg"
 wm_career_return_decision_desc: "Die Wähler haben gesprochen, und sie können ihre Meinung ändern. Stellen Sie ein Kampagnenteam zusammen und suchen Sie nach einem Sitz."
 wm_career_return_decision_tooltip: "Nach Verlust des Sitzes erneut für die Auswahl bewerben"
 wm_career_return_decision_effect_tt: "Sie erhalten ein Wahlkampfteam, treten in die Liste der genehmigten Kandidaten der Partei ein und können sich für Auswahlen bewerben."

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "Hat gute Arbeit für mich geleistet"
 wm_career_poor_work_opinion: "Lass mich im Stich"
 wm_career_apply_decision_confirm: "Meine Bewerbung einreichen"
 wm_career_return_decision_confirm: "zurück zu den Türschwellen"
