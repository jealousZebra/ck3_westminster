l_german:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "Ein Führungskontest"
 wm_leadership.1.desc_vacancy: "Die [wm_lead_party.GetNameNoTier] braucht einen neuen Leiter. [wm_lead_party_holder.GetName] leitet vorerst das Geschäft, aber die Partei wird selbst wählen. \n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] tritt als Führer der [wm_lead_party.GetNameNoTier] zurück, und das Rennen zu ihrer Nachfolge hat begonnen.\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] steht vor einer Herausforderung für die Führung der [wm_lead_party.GetNameNoTier]. Jeder, der seine Chancen sehen möchte, kann mitmachen.\n\n"
 wm_leadership.1.rules: "#bold Die Regeln: #! Nominierungen der Abgeordneten der Partei schließen in zehn Tagen. Ein Kandidat benötigt 15 % davon (ein Herausforderer mit 20 %), um weiterzukommen, und die beiden am besten unterstützten Kandidaten gehen drei Wochen später zur Abstimmung der Mitglieder. Die Mitglieder suchen nach einem Kommunikator, einer Bilanz, politischem Kapital in der Partei und der Unterstützung der Abgeordneten."
 wm_leadership.1.a: "Meinen Hut in den Ring werfen."
 wm_leadership.1.a.tt: "Du stehst für die Führung. Deine Kollegen entscheiden, ob sie dich nominieren."
 wm_leadership.1.b: "Diesmal nicht."
 wm_leadership.2.t: "Eine Herausforderung"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName] hat eine Herausforderung an Ihre Führung der [wm_lead_party.GetNameNoTier] angekündigt. Wenn sie genügend Nominierungen finden, wählen die Mitglieder zwischen Ihnen."
 wm_leadership.2.a: "Bekämpfe sie und sieg."
 wm_leadership.2.a.tt: "Sie stehen derzeit auf dem Stimmzettel. Der Herausforderer benötigt ein Fünftel der Abgeordneten der Partei, um nominiert zu werden."
 wm_leadership.2.b: "Mit Würde Zurücktreten."
 wm_leadership.2.b.tt: "Sie treten nicht an. Der Wettbewerb geht ohne Sie weiter, und Sie führen, bis ein Gewinner feststeht."
 wm_leadership.3.t: "Die Abstimmung der Mitglieder"
 wm_leadership.3.desc: "Sie haben die engere Auswahl für die Führung der [wm_lead_party.GetNameNoTier] gegen [wm_lead_rival.GetName] erreicht. Drei Wochen Wahlkampf, Telefonaktionen und Interviews liegen vor Ihnen. Die Mitglieder werden entscheiden."
 wm_leadership.3.a: "Die Wahlkreisparteien besuchen."
 wm_leadership.3.a.tt: "Eine Kampagne aus Handschlägen und Wahlveranstaltungen: Sie spielt auf Ihre #bold-Charisma#! an."
 wm_leadership.3.b: "Ein ernsthaftes Programm aufgestellt."
 wm_leadership.3.b.tt: "Eine politische Plattform: sie spricht Ihre #bold Wirtschaft#! und #bold Politik#! an."
 wm_leadership.3.c: "Engagieren Sie die Besten, die Geld in einer Kampagne kaufen kann."
 wm_leadership.3.c.tt: "Glatte Videos und ein kompromissloses Bodenprogramm. Teuer, aber es funktioniert."
 wm_leadership.3.d: "Lass meine Bilanz für sich selbst sprechen."
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] GEWINNE [wm_lead_news_party.GetAdjective|U] FÜHRUNG"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] OHNE Gegenkandidaten GEKRÖNT"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] WEISST HERAUSFORDERUNG AB"
 wm_leadership.4.t_failed: "FÜHRUNGS-HERAUSFORDERUNG FLAUT AB"
 wm_leadership.4.desc_ballot: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nDe Mitglieder haben gesprochen: [wm_lead_news_winner.GetName] erhält [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1] % der Stimmen gegen [wm_lead_news_second.GetName] und ist der neue Vorsitzende der [wm_lead_news_party.GetNameNoTier]. [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] der [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] Abgeordneten der Partei hatten sie nominiert."
 wm_leadership.4.desc_ballot_alone: "#italic Die [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName] ist der neue Vorsitzende der [wm_lead_news_party.GetNameNoTier] mit [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1] % der Stimmen der Mitglieder."
 wm_leadership.4.desc_survives: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nDe Mitglieder haben ihren Anführer unterstützt: [wm_lead_news_winner.GetName] gewinnt [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1] % der Stimmen gegen [wm_lead_news_second.GetName], dessen Karriere sich möglicherweise nicht erholt."
 wm_leadership.4.desc_unopposed: "#italic Die [wm_lead_news_party.GetNameNoTier]#!\n\nOnur [wm_lead_news_winner.GetName] mit [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] der [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] Abgeordneten der Partei die erforderlichen Nominierungen für den Stimmzettel erreicht und wurde ohne Gegenkandidaten zum Vorsitzenden der [wm_lead_news_party.GetNameNoTier] gewählt. Die Mitglieder erhielten nie ein Stimmrecht."
 wm_leadership.4.desc_failed: "#italic Die [wm_lead_news_party.GetNameNoTier]#!\n\nDe Herausforderung an [wm_lead_news_winner.GetName] ist gescheitert, bevor sie begonnen hat: Kein Herausforderer fand die Nominierungen, die nötig sind, um eine Abstimmung zu erzwingen. Der Anführer ist vorerst sicher."
 wm_leadership.4.a_won: "Jetzt beginnt die eigentliche Arbeit."
 wm_leadership.4.a: "Die Partei hat gewählt."
 wm_leadership.5.t: "Nach dem Grafen"
 wm_leadership.5.desc: "Die allgemeinen Wahlen sind für die [wm_lead_party.GetNameNoTier] schlecht gelaufen. Die Zeitungen schreiben bereits deinen politischen Nachruf, und einige Kollegen rufen nicht zurück.\n\nDu könntest weitermachen oder ankündigen, dass du zurücktrittst, sobald die Partei einen Nachfolger gewählt hat."
 wm_leadership.5.a: "Ich gehe nirgendwohin."
 wm_leadership.5.b: "Es ist Zeit für jemand anderen."
 wm_leadership.5.b.tt: "Ein Führungswettbewerb beginnt. Du trittst nicht an und führst, bis er beendet ist."
 wm_leadership_contest_toast: "Führungswettbewerb: [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "Die [wm_lead_party.GetNameNoTier] wählt einen Anführer: Nominierungen durch seine Abgeordneten, dann eine Abstimmung der Mitglieder."
 wm_leadership_result_toast: "Neuer Führer: [wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] führt die [wm_lead_party.GetNameNoTier]."
 wm_leadership_challenge_decision: "Herausforderung für die Führung"
 wm_leadership_challenge_decision_desc: "Deine Partei verdient Besseres, und du weißt, wer. Erkläre eine Herausforderung: Wenn ein Fünftel der Abgeordneten der Partei dich nominiert, werden die Mitglieder zwischen dir und dem Vorsitzenden wählen."
 wm_leadership_challenge_decision_tooltip: "Fordere den Anführer deiner Partei heraus."
 wm_leadership_challenge_decision_confirm: "Erkläre die Herausforderung"
 wm_leadership_challenge_decision_effect_tt: "Ein #bold Führungskampf#! beginnt: zehn Tage Nominierungen von den Abgeordneten der Partei, dann eine Mitgliederabstimmung. Wenn Sie verlieren, wird der Führer es nicht vergessen."
 wm_leadership_no_contest_tt: "Kein Führungswettbewerb läuft bereits"
 wm_leadership_parliament_sitting_tt: "Es läuft keine Parlamentswahl"
 wm_leadership_challenged_opinion: "Hat mich um die Führung herausgefordert"
 wm_leadership_deposed_opinion: "Meine Partei wurde mir weggenommen"
 wm_leadership_gracious_opinion: "Ein gnädiger Sieger"
