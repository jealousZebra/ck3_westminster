l_german:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "Aufwiegler in [wm_riot_seat.GetName]"
 wm_riot_gathering_toast_desc: "Wütende Menschenmengen haben sich in [wm_riot_seat.GetName] versammelt. [wm_riot_organiser.GetName] organisiert einen Protestmarsch auf Westminster."
 wm_riot_marching_toast: "Protestmarsch von [wm_riot_seat.GetName]"
 wm_riot_marching_toast_desc: "Der Protestmarsch von [wm_riot_seat.GetName] hat sich auf den Weg nach Westminster gemacht, angeführt von [wm_riot_organiser.GetName]. Er wird innerhalb des Monats mit seinen Forderungen ankommen."

 wm_riot_demand_1_desc: "\n\nSie wollen Hilfe bei den #bold Lebenshaltungskosten#!: Rechnungen, Mieten und Lebensmittelpreise sind in die Höhe geschossen, und sie sagen, die Regierung kümmert sich nicht."
 wm_riot_demand_2_desc: "\n\nSie wollen einen #bold Rücktritt eines Ministers#!: Jemand im Kabinett muss die Schuld übernehmen, und sie wollen einen Kopf sehen."
 wm_riot_demand_3_desc: "\n\nSie wollen eine #bold Parlamentswahl#!: Die Regierung hat kein Mandat für das, was sie tut, sagen sie, und das Land sollte entscheiden."
 wm_riot_demand_4_desc: "\n\nSie wollen einen #bold Kurswechsel#!: Eine Politik, die sie hassen, soll jetzt, ohne Wenn und Aber, abgeschafft werden."

 wm_riot.10.t: "Probleme in [wm_riot_seat.GetName]"
 wm_riot.10.desc: "Das Telefon in meinem Wahlkreisbüro hört nicht auf zu klingeln. Hunderte von Menschen sind auf den Straßen von [wm_riot_seat.GetName], Geschäfte haben ihre Rollläden unten, und ein lokaler Aktivist, [wm_riot_organiser.GetName], sagt den Kameras, dass die Menge nach Westminster marschieren wird, es sei denn, jemand hört zu."
 wm_riot.10.a: "Geh raus und sprich mit ihnen."
 wm_riot.10.a.success: "Die Menge hört zu und geht nach Hause"
 wm_riot.10.a.failure: "Von der Straße gestört"
 wm_riot.10.b: "Öffentlich sagen, dass sie Recht haben."
 wm_riot.10.c: "Kopf unten halten und Nummer 10 die Sache regeln lassen."

 wm_riot.20.t: "Der Marsch erreicht Westminster"
 wm_riot.20.desc: "Parlamentsplatz ist voller Plakate."
 wm_riot.20.desc_first: "Der Protestmarsch von [wm_riot_seat.GetName] ist angekommen, und sein Organisator, [wm_riot_organiser.GetName], hat darum gebeten, mich mit einer Liste von Forderungen zu treffen."
 wm_riot.20.desc_bigger: "Der Marsch aus [wm_riot_seat.GetName] ist zurück, größer und wütender als zuvor. [wm_riot_organiser.GetName] sagt, dass es keine weiteren Gespräche geben wird."
 wm_riot.20.desc_gone: "\n\nBis ich das Briefing gelesen habe, hat sich die Menge nach Hause verzogen."
 wm_riot.20.a: "Ihnen geben, was sie wollen."
 wm_riot.20.b: "Laden Sie die Organisatoren ein, um zu sprechen."
 wm_riot.20.b.success: "Ein Kompromiss wird vereinbart"
 wm_riot.20.b.failure: "Die Gespräche brechen zusammen."
 wm_riot.20.c: "Sag der Polizei, den Platz zu räumen."
 wm_riot.20.c.dispersed: "Die Polizei räumt den Platz."
 wm_riot.20.c.violence: "Gewaltszenen in den Abendnachrichten"
 wm_riot.20.d: "Gut."

 wm_riot_county_modifier: "Aufstände"
 wm_riot_county_modifier_desc: "Wütende Menschenmengen sind auf den Straßen und ein Protestmarsch ist im Gange."
 wm_riot_demands_met_county_modifier: "Forderungen erfüllt"
 wm_riot_demands_met_county_modifier_desc: "Die Regierung gab den Demonstranten, was sie wollten."
 wm_riot_compromise_county_modifier: "Ein Kompromiss"
 wm_riot_compromise_county_modifier_desc: "Die Demonstranten gingen mit einem Abkommen nach Hause."
 wm_riot_policed_county_modifier: "Protest aufgelöst"
 wm_riot_policed_county_modifier_desc: "Die Polizei hat den Protestmarsch aufgelöst, und die Menschen hier haben es nicht vergessen."
 wm_riot_crackdown_county_modifier: "Polizeigewalt"
 wm_riot_crackdown_county_modifier_desc: "Die Bilder der Polizei, die den Protestmarsch aufgreifen, werden weiterhin geteilt."
 wm_mp_backed_protesters_county_modifier: "Abgeordneter unterstützte den Protest"
 wm_mp_backed_protesters_county_modifier_desc: "Der örtliche Abgeordnete stand auf der Seite der Demonstranten."
 wm_cost_of_living_package_modifier: "Lebenshaltungskostenpaket"
 wm_cost_of_living_package_modifier_desc: "Hilfe bei Rechnungen, die von der Regierung bezahlt werden."
 wm_u_turn_modifier: "Kehrtwende"
 wm_u_turn_modifier_desc: "Zu einer demütigenden Kehrtwende durch einen Protestmarsch gezwungen."
 wm_heavy_handed_modifier: "Schwerfällig"
 wm_heavy_handed_modifier_desc: "Die Polizei gegen einen Protestmarsch geschickt."
 wm_crackdown_modifier: "Für Polizeigewalt verantwortlich gemacht"
 wm_crackdown_modifier_desc: "Eine Protestdemonstration wurde gewaltsam, die Schuld lag hier."

 wm_forced_to_resign_opinion: "Zwang mich zurückzutreten"
 wm_backed_protesters_opinion: "Auf Seiten der Demonstranten"
 wm_policed_my_constituents_opinion: "Die Polizei gegen meine Wähler geschickt"
