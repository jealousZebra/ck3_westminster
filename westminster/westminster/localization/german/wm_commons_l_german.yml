l_german:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "Ein Gesetz einführen"
 wm_commons_introduce_bill_decision_desc: "Legt dem Unterhaus einen Regierungsentwurf vor. Die Peitschen werden Köpfe zählen, die Hinterbänke werden sich beschweren, und in einer Woche spaltet sich das Haus."
 wm_commons_introduce_bill_decision_tooltip: "Ein Regierungsgesetz im Unterhaus zur Abstimmung bringen"
 wm_commons_introduce_bill_decision_effect_tt: "Wähle ein Gesetz. Das Repräsentantenhaus stimmt eine Woche später darüber ab."
 wm_commons_no_confidence_decision: "Einen Misstrauensantrag einbringen"
 wm_commons_no_confidence_decision_desc: "Als Oppositionsführer legen Sie einen Antrag vor, dass dieses Haus kein Vertrauen in die Regierung Seiner Majestät hat. Wenn die Regierung verliert, muss eine allgemeine Wahl stattfinden."
 wm_commons_no_confidence_decision_tooltip: "Versuche, die Regierung zu stürzen"
 wm_commons_no_confidence_decision_effect_tt: "Das Haus stimmt innerhalb der Woche über den Antrag ab. Wird er angenommen, muss eine #bold Neuwahl#! abgehalten werden. Scheitert er, verlieren Sie an Ansehen und der Premierminister wird es nicht vergessen."
 wm_commons_house_free_desc: "Kein anderer Gesetzentwurf oder Antrag wartet auf eine Abstimmung im Unterhaus"
 wm_commons_no_election_pending_desc: "Der Regierung wurde noch keine Parlamentswahl aufgezwungen"
 wm_commons_leader_of_opposition_desc: "Sie führen die größte Partei außerhalb der Regierung"

 # Bills
 wm_commons_bill_1_name: "#bold Das Finanzgesetz#!"
 wm_commons_bill_2_name: "#bold Das Gesetz über öffentliche Dienste#!"
 wm_commons_bill_3_name: "#bold Das Gesetz zur Reform des öffentlichen Dienstes#!"
 wm_commons_bill_4_name: "#bold Das Gesetz über Notstandsbefugnisse#!"
 wm_commons_bill_5_name: "#bold Der Misstrauensantrag gegen die Regierung Seiner Majestät #!"
 wm_commons_bill_1_desc: "\n\nDas #bold Finanzgesetz#! erhöht die Steuern, um die Haushalte auszugleichen. Die rechte Flanke der Partei hasst es; die linke Flanke kann damit leben."
 wm_commons_bill_2_desc: "\n\nDas #bold Gesetz über öffentliche Dienste#! stellt mehr Geld für Schulen und Krankenhäuser bereit. Es ist beliebt, und die linke Flanke liebt es; die rechte Flanke macht sich Sorgen um die Kosten."
 wm_commons_bill_3_desc: "\n\nDas #bold Gesetz zur Reform des öffentlichen Dienstes#! bringt Unruhe in die Verwaltung öffentlicher Dienste. Die rechte Flanke will es seit Jahren. Die linke Flanke nennt es einen Verrat, und einige drohen, dagegen zu stimmen."
 wm_commons_bill_4_desc: "\n\nDas Notstandsgesetz #bold #! gibt Ministern umfassende Befugnisse, um mit der Krise umzugehen. Niemand mag es sehr, aber in einer Krise erwartet das Land, dass das Parlament handelt."
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName], als Oppositionsführer, hat einen #bold Misstrauensantrag#! gegen die Regierung eingebracht. Wenn er angenommen wird, muss eine allgemeine Wahl stattfinden."

 wm_commons.1.t: "Das Gesetzgebungsprogramm"
 wm_commons.1.desc: "Der Hausführer möchte wissen, welche Gesetzentwürfe die Regierung dem Unterhaus als Nächstes vorlegen wird. Die Beamten haben mehrere Gesetzentwürfe ausgearbeitet, jeder mit seinen Freunden und Feinden auf unseren eigenen Bänken."
 wm_commons.1.a: "Ein Finanzgesetz: die Steuern müssen steigen."
 wm_commons.1.a.tt: "Wenn angenommen: Geld für die Regierung und eine Steuererhöhung, aber die Umfragen werden es nicht mögen. Der rechte Flügel der Partei #bold#! könnte rebellieren."
 wm_commons.1.b: "Ein Gesetz für öffentliche Dienste: mehr Geld für Schulen und Krankenhäuser."
 wm_commons.1.b.tt: "Wenn angenommen: beliebt und gut für die Umfragen, aber es kostet jahrelang Geld. Der rechte Flügel der Partei #bold#! könnte murren."
 wm_commons.1.c: "Ein Gesetz zur Reform des öffentlichen Dienstes: Zeit für echte Veränderungen."
 wm_commons.1.c.tt: "Wenn angenommen: Mandat und Ruf eines Reformators. #bold Kontrovers#!: die linke Flügel der Partei #bold#! könnte in Zahlen rebellieren."
 wm_commons.1.d: "Ein Notstandsgesetz: das Land braucht es."
 wm_commons.1.d.tt: "Wenn angenommen: Profil und Mandat. Die Opposition könnte es gutheißen."
 wm_commons.1.e: "Im Moment nichts."

 # The whips
 wm_commons.2.t: "Der Bericht des Chief Whip"
 wm_commons.2.t_confidence: "Ein Misstrauensantrag"
 wm_commons.2.desc_bill: "Der Chief Whip hat im Teeraum Köpfe gezählt."
 wm_commons.2.desc_confidence: "Die Opposition hat einen Antrag zur Absetzung der Regierung eingebracht, und der Chief Whip ist bereits in meinem Büro."
 wm_commons.2.numbers: "\n\nWir haben #bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#! Abgeordnete; auf den anderen Bänken sitzen [EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0]. Der Chief Whip schätzt, dass etwa #bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#! von unseren rebellieren oder fernbleiben könnten."
 wm_commons.2.opposition_backs: "Die Oppositionsvorderbank hat angekündigt, uns zu unterstützen."
 wm_commons.2.no_opposition_help: "Die Opposition wird dagegen stimmen."
 wm_commons.2.a: "Den Whips überlassen."
 wm_commons.2.b: "Erteilen Sie einen Drei-Zeilen-Zwang. Meine Autorität steht auf dem Spiel."
 wm_commons.2.c: "Die Wankelmütigen einzeln hereinrufen. Jeder Wahlkreis braucht etwas."
 wm_commons.2.d: "Zugeständnisse anbieten."
 wm_commons.2.d.tt: "Weniger Abgeordnete rebellieren, aber ein Gesetzentwurf wird #bold verwässert#!: er erreicht etwa die Hälfte, wenn er verabschiedet wird."
 wm_commons.2.e: "Den Gesetzentwurf zurückziehen, bevor er abgelehnt wird."

 # The result
 wm_commons_headline_government_falls: "REGIERUNG FÄLLT"
 wm_commons_headline_pm_survives: "PREMIERMINISTER ÜBERSTEHT DAS VERTRAUENSVOTUM"
 wm_commons_headline_humiliation: "DEMÜTIGUNG FÜR NUMMER 10"
 wm_commons_headline_defeated: "REGIERUNG BESIEGT"
 wm_commons_headline_knife_edge: "KNAPPES ERGEBNIS: REGIERUNG KOMMT GERADE NOCH DURCH"
 wm_commons_headline_revolt: "GESETZENTWURF WIRD TROTZ AUFSTÄNDEN DER HINTERBÄNKLER VERABSCHIEDET"
 wm_commons_headline_comfortable: "BEQUEME MEHRHEIT"
 wm_commons_headline_passed: "BILL WIRD PASSIERT"

 wm_commons.4.lobbies: "\n\nDie Abstimmungsprotokolle: #bold Ja-Stimmen [EmptyScope.ScriptValue('wm_commons_ayes_value')|0], Nein-Stimmen [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!. [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] Abgeordnete haben nicht abgestimmt."
 wm_commons.4.rebels: "#bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! Regierungsabgeordnete widersetzten sich der Parteilinie."
 wm_commons.4.no_rebels: "Kein einzelner Regierungsabgeordneter widersetzte sich der Parteilinie."
 wm_commons.4.outcome_government_falls: "\n\nDas Parlament hat kein Vertrauen in die Regierung von [wm_commons_pm.GetName]. Es muss eine #bold-Volkswahl stattfinden#!."
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] überlebt durch [EmptyScope.ScriptValue('wm_commons_majority_value')|0] Stimmen, und die Opposition steht blamiert da."
 wm_commons.4.outcome_defeated: "\n\nDer Gesetzesentwurf scheitert, besiegt durch [EmptyScope.ScriptValue('wm_commons_majority_value')|0] Stimmen. [wm_commons_pm.GetName] hat die Kontrolle über das Parlament verloren."
 wm_commons.4.outcome_passed_watered_down: "\n\nDer Gesetzesentwurf wird mit einer Mehrheit von [EmptyScope.ScriptValue('wm_commons_majority_value')|0] verabschiedet, aber erst nachdem die Regierung fast überall nachgegeben hat."
 wm_commons.4.outcome_passed: "\n\nDer Gesetzesentwurf wird mit einer Mehrheit von [EmptyScope.ScriptValue('wm_commons_majority_value')|0] verabschiedet."
 wm_commons.4.a: "Ordnung, Ordnung!"
 wm_commons.4.a_pm: "Auf zum nächsten."

 # The division bell
 wm_commons.5.t: "Die Abstimmungsglocke"
 wm_commons.5.desc: "Die Abstimmungsglocke läutet im ganzen Westminster-Palast. In wenigen Minuten stimmt das Unterhaus ab."
 wm_commons.5.whip_none: "\n\nOhne Parteilinie kann ich nach Belieben abstimmen."
 wm_commons.5.whip_abstain: "\n\nMeine Partei nimmt ihre Sitze in Westminster nicht ein. Ich werde nicht abstimmen."
 wm_commons.5.whip_government: "\n\nDie Fraktionsführer wollen, dass jeder von uns in der Lobby #bold mit der Regierung#! ist. Rebellische Stimmen werden nicht vergessen."
 wm_commons.5.whip_opposition_backs: "\n\nUnsere Regierungsbank unterstützt die Regierung bei diesem Thema, und die Fraktionsführer erwarten von mir, dass ich folge."
 wm_commons.5.whip_opposition: "\n\nUnsere Fraktionsführer wollen, dass ich mich in der Lobby #bold gegen die Regierung #! aufhalte."
 wm_commons.5.wing_left: "Ich sitze auf der #bold linken#! Seite meiner Partei."
 wm_commons.5.wing_right: "Ich sitze auf der #bold rechten#! Seite meiner Partei."
 wm_commons.5.wing_centre: "Ich sitze im #bold Zentrum#! meiner Partei."
 wm_commons.5.a: "Stimmen Sie mit der Regierung ab."
 wm_commons.5.b: "Stimmt gegen die Regierung."
 wm_commons.5.c: "Fernbleiben und Enthalten."

 wm_commons_whip_withdrawn_toast: "Peitsche zurückgezogen"
 wm_commons_whip_withdrawn_toast_desc: "Nachdem [wm_commons_whipless.GetName] einmal zu oft rebelliert hat, hat er den Parteiwhip verloren und sitzt nun als Unabhängiger."

 # Modifiers
 wm_commons_tax_rise_modifier: "Steuererhöhung"
 wm_commons_tax_rise_modifier_desc: "Das Finanzgesetz erhöhte die Steuern. Das Geld kommt herein, und die Wähler haben es bemerkt."
 wm_commons_public_services_modifier: "Ausgaben für öffentliche Dienste"
 wm_commons_public_services_modifier_desc: "Mehr Geld für Schulen und Krankenhäuser: beliebt und teuer."
 wm_commons_reformer_modifier: "Reformer"
 wm_commons_reformer_modifier_desc: "Eine umstrittene Reform durch das Unterhaus gebracht."
 wm_commons_emergency_powers_modifier: "Notstandsbefugnisse"
 wm_commons_emergency_powers_modifier_desc: "Parlament gab der Regierung weitreichende Befugnisse, um mit einer Krise umzugehen."
 wm_commons_defeated_in_commons_modifier: "Im Unterhaus besiegt"
 wm_commons_defeated_in_commons_modifier_desc: "Ein Regierungsentwurf wurde vom Unterhaus abgelehnt."
 wm_commons_lost_confidence_modifier: "verlor das Vertrauen des Hauses"
 wm_commons_lost_confidence_modifier_desc: "Das Unterhaus hat abgestimmt, dass es kein Vertrauen in diese Regierung hat."

 # Opinions
 wm_commons_defied_whip_opinion: "Widerstand gegen die Peitsche"
 wm_commons_whip_withdrawn_opinion: "Zog mir die Peitsche weg"
 wm_commons_tabled_no_confidence_opinion: "Versuchte, meine Regierung zu stürzen"
 wm_commons_introduce_bill_decision_confirm: "Dem Haus vorlegen"
 wm_commons_no_confidence_decision_confirm: "Den Antrag einbringen"
