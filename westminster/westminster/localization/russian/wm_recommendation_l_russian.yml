 wm_recommendation.1.t: "Нравится Westminster?"
 wm_recommendation.1.desc: "Если Westminster заслужил место в вашей подборке модов, положительная оценка в Мастерской Steam поможет другим игрокам CK3 его найти. Спасибо за игру и поддержку развития мода."
 wm_recommendation.1.a: "Я оставлю оценку в Steam."
 wm_recommendation.1.b: "Вернуться в Вестминстер."
