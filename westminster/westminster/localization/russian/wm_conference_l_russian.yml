l_russian:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "Конференция: речь лидера"
 wm_conference.1.desc: "Сезон конференций, и [wm_conference_party.GetNameNoTier] захватил прибрежный конференц-центр на четыре дня с побочными встречами, бейджами и теплым кофе. Завтра главное событие: моя речь в зале, в прямом эфире на всех новостных каналах. Редакторы речи подготовили проект номер девятнадцать. Леденцы в моем кармане. На декорации написан лозунг буквами высотой четыре фута, и кто-то проверил, что ни одна буква не шатается. Вероятно."
 wm_conference.1.a: "Произнеси речь как написана."
 wm_conference.1.b: "Порви сценарий и говори от сердца."
 wm_conference.1.c: "Представить официальное объявление о политике."

 wm_conference_headline_triumph: "ТРИУМФАЛЬНАЯ РЕЧЬ ЗАСТАВЛЯЕТ ЗАЛ ВСТАТЬ НА НОГИ"
 wm_conference_headline_solid: "РЕЧЬ ЛИДЕРА: «ХОРОШО», ГОВОРЯТ ДЕЛЕГАТЫ"
 wm_conference_headline_disaster: "КАШЛЕВОЙ КАТАСТРОФИЧЕСКИЙ ИСХОД ПРИ РАСШИРЕНИИ ЗАБОР"
 wm_conference_headline_policy_hit: "СМЕЛОЕ ОБЕЩАНИЕ ПРИВЛЕКАЕТ ВНИМАНИЕ"
 wm_conference_headline_policy_flop: "FLAGSHIP POLICY SINKS BY LUNCHTIME"
 wm_conference.2.desc_triumph: "Одиннадцать стоячих оваций, одна из них во время паузы для перевода дыхания. Сценаристы едва стараются быть грубыми, ночные опросы поднялись, и парламентская партия вдруг очень стремится быть замеченной со мной в баре."
 wm_conference.2.desc_solid: "Ни стоячих оваций, ни катастроф, и никаких букв не падают с задника. Газеты называют это \" добросовестной работой\", что для них практически любовное письмо."
 wm_conference.2.desc_disaster: "Всё началось с щекотки в горле и закончилось тем, что зал делегатов передавал пастилки на сцену, а лозунг позади меня потерял два буквы. Один из протестующих дошёл до кафедры. Сценаристы скетчей не имели такого дня уже много лет, а в баре мои коллеги говорят тихо."
 wm_conference.2.desc_policy_hit: "Политика не была пробной, не была утечкой, и она возглавляет каждую сводку. Соперничающие партии спешат заявить, что они первым об этом подумали. Зал скандировал мое имя, что было приятно, если немного тревожно."
 wm_conference.2.desc_policy_flop: "К тому времени, как я покинул сцену, аналитический центр выявил прореху на сорок миллиардов фунтов в сметах, а двое из моих собственных членов передней скамьи сказали по радио, что никогда о ней не слышали."
 wm_conference.2.a: "Всегда есть следующий год."

 wm_conference.10.t: "Конференция: бейджи и прически"
 wm_conference.10.desc: "Конференция [wm_conference_party.GetNameNoTier] в полном разгаре: четыре дня второстепенных встреч в перегретых боковых комнатах, приемы, организованные торговыми организациями, о которых никто не слышал, и гостиничный бар, где настоящие дела решаются после полуночи. [wm_conference_leader.GetName] выступает завтра. Как мне провести мою конференцию?"
 wm_conference.10.a: "Выступите на маргинальном собрании."
 wm_conference.10.b: "Заговор в баре отеля."
 wm_conference.10.c: "Занимайтесь приёмами и заводите контакты."
 wm_conference.10.d: "Сидеть в зале и громко и заметно аплодировать лидеру."
 wm_conference_fringe_good: "Фриндж: заполненная комната и хороший обзор"
 wm_conference_fringe_off_message: "Фриндж: замечания 'отклоняются от темы'"
 wm_conference_plot_found_out: "Заговор: Подслушано кураторами"

 wm_conference.20.t: "Слухи о лидерстве"
 wm_conference.20.desc: "Конференция окончена, и речь идет не о моей речи. Анонимные коллеги рассказывают воскресным газетам, что [wm_conference_party.GetNameNoTier] нуждается в \"новом старте\", фраза, которая никогда не означает новый логотип. Кнуты имеют имена. Вопрос в том, что я с этим сделаю."
 wm_conference.20.a: "Face down the plotters."
 wm_conference.20.b: "Обещай слушать парламентскую группу."
 wm_conference.20.c: "Игнорировать как разговоры из «вестминстерского пузыря»."
 wm_conference_faced_down: "Гул: заговорщики уступают"
 wm_conference_not_faced_down: "Гул: история продолжается и продолжается"

 wm_conference_triumph_modifier: "Триумф на конференции"
 wm_conference_triumph_modifier_desc: "Произнес речь на конференции, которую будут цитировать и в следующем году, по правильным причинам."
 wm_conference_disaster_modifier: "Катастрофа на конференции"
 wm_conference_disaster_modifier_desc: "Произнес речь на конференции, которую будут цитировать и в следующем году, по неправильным причинам."

 wm_conference_triumph_opinion: "Торжественная конференционная речь"
 wm_conference_disaster_opinion: "Катастрофическая речь на конференции"
 wm_conference_listened_opinion: "Обещал слушать вечеринку"
 wm_conference_contacts_opinion: "Встретились на конференции"
 wm_conference_fellow_plotter_opinion: "Сговорились в баре отеля"
 wm_conference_caught_plotting_opinion: "Пойман за заговором против меня"
 wm_conference_loyal_applause_opinion: "Самым громко аплодировал моей речи"
 wm_conference_off_message_opinion: "Отошла от темы на дополнительной встрече"
