 wm_ideo_change_decision: "Измени свою политику"
 wm_ideo_change_decision_desc: "Аргументы меняются, и люди тоже. Примите новую политическую точку зрения: коллеги назовут это разворотом на 180 градусов, а поклонники — обращением."
 wm_ideo_change_decision_tooltip: "Принять другую идеологию"
 wm_ideo_change_decision_confirm: "Передумай"
 wm_ideo_change_decision_choose: "Выберите идеологию"
 wm_ideo_change_decision_effect_tt: "Ваш [faith|E] становится выбранным вами. Депутат от Лейбористской или Консервативной партии переходит в крыло своей партии."
 wm_ideo_pick_socialist_desc: "Стать социалистом. Государственная собственность, права работников и конец неравенства: демократическая социалистическая левая."
 wm_ideo_pick_social_democrat_desc: "Стать социальным демократом. Более справедливая страна через хорошо финансируемые государственные службы и смешанную экономику: основное направление центр-лево."
 wm_ideo_pick_green_desc: "Стать зелёным. Климатический кризис прежде всего, с социальной справедливостью и более демократичной системой."
 wm_ideo_pick_liberal_desc: "Стать либералом. Личная свобода, честные выборы и тесные отношения с Европой: либеральная традиция."
 wm_ideo_pick_centrist_desc: "Стать центристом. Компетентность важнее идеологии: умеренность, поддержка бизнеса и прагматизм."
 wm_ideo_pick_cross_community_desc: "Стать кросс-коммунаром. Ни союзник, ни националист: общее будущее для сообществ Северной Ирландии."
 wm_ideo_pick_one_nation_desc: "Стать консерватором одной нации. Умеренный, патерналистский консерватизм: социальная ответственность, стабильные институты и Союз."
 wm_ideo_pick_free_market_desc: "Стать сторонником свободного рынка. Меньше налогов, дерегулирование и меньшая роль государства для стимулирования роста."
 wm_ideo_pick_national_conservative_desc: "Стать национальным консерватором. Семья, нация и традиции, при значительно меньшей иммиграции."
 wm_ideo_pick_populist_right_desc: "Стать популистом. Против истеблишмента в Вестминстере: контроль границ, суверенитет и снижение налогов."
 wm_ideo_pick_scottish_nationalist_desc: "Стать шотландским националистом. Независимая Шотландия в Европе, с социально-демократической программой внутри страны."
 wm_ideo_pick_welsh_nationalist_desc: "Стать валлийским националистом. Самоуправление для Уэльса и защита валлийского языка."
 wm_ideo_pick_irish_republican_desc: "Стать ирландским республиканцем. Объединённая Ирландия и конец разделения, с левым крылом программы."
 wm_ideo_pick_irish_nationalist_desc: "Стать ирландским националистом. Конституционный национализм: объединение Ирландии по согласию, разделение власти и социальная демократия."
 wm_ideo_pick_unionist_desc: "Стать союзником. Место Северной Ирландии в Соединённом Королевстве, защищаемое прежде всего."
