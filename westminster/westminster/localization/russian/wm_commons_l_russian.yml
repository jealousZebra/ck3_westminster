l_russian:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "Внести законопроект"
 wm_commons_introduce_bill_decision_desc: "Внести в Палату общин правительственный законопроект. Кнуты будут считать головы, задние скамейки будут ворчать, и через неделю Палата разделится."
 wm_commons_introduce_bill_decision_tooltip: "Вынести правительственный законопроект на голосование в Палате общин"
 wm_commons_introduce_bill_decision_effect_tt: "Выберите законопроект. Палата представителей голосует за него через неделю."
 wm_commons_no_confidence_decision: "Вотум недоверия"
 wm_commons_no_confidence_decision_desc: "В качестве лидера оппозиции внесите предложение о том, что Палата выражает недоверие правительству Его Величества. Если правительство проиграет, должно быть проведено всеобщее голосование."
 wm_commons_no_confidence_decision_tooltip: "Попробуйте свергнуть правительство"
 wm_commons_no_confidence_decision_effect_tt: "Палата голосует по предложению в течение недели. Если оно пройдет, #bold должны быть проведены выборы #!. Если предложение не пройдет, вы теряете лицо, и премьер-министр этого не забудет."
 wm_commons_house_free_desc: "Нет другого законопроекта или предложения, ожидающего голосования в Палате общин"
 wm_commons_no_election_pending_desc: "Всеобщие выборы еще не были навязаны правительству"
 wm_commons_leader_of_opposition_desc: "Вы возглавляете крупнейшую партию вне правительства"

 # Bills
 wm_commons_bill_1_name: "#bold Финансовый законопроект #!"
 wm_commons_bill_2_name: "#bold Законопроект о государственных услугах#!"
 wm_commons_bill_3_name: "#bold Законопроект о реформе государственной службы#!"
 wm_commons_bill_4_name: "#bold Законопроект о чрезвычайных полномочиях#!"
 wm_commons_bill_5_name: "#bold Вотум недоверия Правительству Его Величества#!"
 wm_commons_bill_1_desc: "\n\n #bold Законопроект о финансах #! повышает налоги для уравновешивания бюджета. Правая партийная фракция его ненавидит; левая с этим может смириться."
 wm_commons_bill_2_desc: "\n\n #bold Законопроект о государственных службах #! выделяет больше денег на школы и больницы. Он популярен, и левая фракция его любит; правая фракция переживает из-за расходов."
 wm_commons_bill_3_desc: "\n\n #bold Законопроект о реформе государственной службы #! меняет то, как управляются государственные службы. Правая фракция хотела этого годами. Левая фракция называет это предательством, и некоторые угрожают голосовать против."
 wm_commons_bill_4_desc: "\n\n#bold Законопроект о чрезвычайных полномочиях#! предоставляет министрам широкие полномочия для урегулирования кризиса. Никому это особо не нравится, но в кризисе страна ожидает действий Парламента."
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName], как Лидер оппозиции, внесла #bold предложение о недоверии#! правительству. Если оно будет принято, должна быть проведена всеобщая выборная кампания."

 wm_commons.1.t: "Законодательная программа"
 wm_commons.1.desc: "Лидер Палаты хочет узнать, какие вопросы правительство собирается внести в Палату общин. Государственные служащие подготовили несколько законопроектов, у каждого из которых есть свои друзья и враги на наших скамьях."
 wm_commons.1.a: "Финансовый законопроект: налоги должны быть повышены."
 wm_commons.1.a.tt: "Если принято: деньги для правительства и повышение налогов, но опросы не оценят это. Правое крыло #bold партии #! может восстать."
 wm_commons.1.b: "Законопроект о государственных услугах: больше денег для школ и больниц."
 wm_commons.1.b.tt: "Если принято: популярно и хорошо для опросов, но это стоит денег на годы. Правое крыло #bold партии #! может ворчать."
 wm_commons.1.c: "Законопроект о реформе государственных служб: время для настоящих изменений."
 wm_commons.1.c.tt: "Если принято: мандат и репутация реформатора. #bold Спорный#!: левое крыло #bold партии #! может восстать в численности."
 wm_commons.1.d: "Законопроект о чрезвычайных полномочиях: стране это нужно."
 wm_commons.1.d.tt: "Если принято: профиль и мандат. Оппозиция может поддержать это."
 wm_commons.1.e: "Пока ничего."

 # The whips
 wm_commons.2.t: "Доклад главного организатора"
 wm_commons.2.t_confidence: "Мотивация недоверия"
 wm_commons.2.desc_bill: "Главный кнут считает головы в чайной."
 wm_commons.2.desc_confidence: "Оппозиция внесла предложение о смещении правительства, и главный организатор уже в моем кабинете."
 wm_commons.2.numbers: "\n\nУ нас есть #bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#! членов парламента; есть [EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0] на других скамьях. Главный дисциплинарный офицер считает, что около #bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#! наших могут восстать или не прийти."
 wm_commons.2.opposition_backs: "Передняя линия оппозиции заявила, что поддержит нас."
 wm_commons.2.no_opposition_help: "Оппозиция будет голосовать против."
 wm_commons.2.a: "Оставьте это на усмотрение партийных шептунов."
 wm_commons.2.b: "Выдайте трёхлинейный кнут. Мои полномочия на кону."
 wm_commons.2.c: "Призывайте колеблющихся по одному. Каждый избирательный округ нуждается в чем-то."
 wm_commons.2.d: "Предлагайте уступки."
 wm_commons.2.d.tt: "Меньше депутатов восстают, но законопроект #bold разбавлен#!: он выполняет примерно половину того, что должен, если пройдет."
 wm_commons.2.e: "Снять законопроект, пока он не был отклонён."

 # The result
 wm_commons_headline_government_falls: "ПРАВИТЕЛЬСТВО ПАДАЕТ"
 wm_commons_headline_pm_survives: "ПРЕМЬЕР-МИНИСТР ПЕРЕЖИЛ ВОТУМ ДОВЕРИЯ"
 wm_commons_headline_humiliation: "УНИЖЕНИЕ ДЛЯ НОМЕРА 10"
 wm_commons_headline_defeated: "ПРАВИТЕЛЬСТВО ПОТЕРПЕЛО ПОРАЖЕНИЕ"
 wm_commons_headline_knife_edge: "НА ЛЕЗВИИ НОЖА: ПРАВИТЕЛЬСТВО ЕДВА СПРАВЛЯЕТСЯ"
 wm_commons_headline_revolt: "ЗАКОН ПРИНЯТ, НЕСМОТРЯ НА ВОРОТЫ ЗАДНЕЙ СКАМЬИ"
 wm_commons_headline_comfortable: "УВЕРЕННОЕ БОЛЬШИНСТВО"
 wm_commons_headline_passed: "ЗАКОН ПРИНЯТ"

 wm_commons.4.lobbies: "\n\n Лобби по разделению: #bold «За» [EmptyScope.ScriptValue('wm_commons_ayes_value')|0], «Против» [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!. [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] депутатов не голосовали."
 wm_commons.4.rebels: "#bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! депутаты правительства ослушались партийной дисциплины."
 wm_commons.4.no_rebels: "Ни один депутат от правительства не ослушался партийной дисциплины."
 wm_commons.4.outcome_government_falls: "\n\nПалата не выражает доверия правительству [wm_commons_pm.GetName]. Должны быть проведены #bold всеобщие выборы#!."
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] выживает благодаря [EmptyScope.ScriptValue('wm_commons_majority_value')|0] голосам, а оппозиция оказывается в неловком положении."
 wm_commons.4.outcome_defeated: "\n\n Законопроект провалился, проиграв с [EmptyScope.ScriptValue('wm_commons_majority_value')|0] голосами. [wm_commons_pm.GetName] потеряли контроль над палатой."
 wm_commons.4.outcome_passed_watered_down: "\n\n Законопроект принят большинством [EmptyScope.ScriptValue('wm_commons_majority_value')|0] голосов, но только после того, как правительство уступило почти по всем пунктам."
 wm_commons.4.outcome_passed: "\n\n Законопроект принят большинством [EmptyScope.ScriptValue('wm_commons_majority_value')|0] голосов."
 wm_commons.4.a: "Порядок, порядок!"
 wm_commons.4.a_pm: "Переходим к следующему."

 # The division bell
 wm_commons.5.t: "Колокол дивизиона"
 wm_commons.5.desc: "Звонок для голосования звенит по всему Вестминстерскому дворцу. Через несколько минут Палата будет голосовать."
 wm_commons.5.whip_none: "\n\nБез партийного дисциплинарного указа я могу голосовать так, как хочу."
 wm_commons.5.whip_abstain: "\n\nМоя партия не занимает места в Вестминстере. Я не буду голосовать."
 wm_commons.5.whip_government: "\n\n Партийные вожди хотят, чтобы каждый из нас находился в лобби #bold с правительством #!. Мятежники будут запомнены."
 wm_commons.5.whip_opposition_backs: "\n\nНаша передняя скамья поддерживает правительство в этом вопросе, и партийные диспетчеры ожидают, что я последую за ними."
 wm_commons.5.whip_opposition: "\n\nНаши партийные диспетчеры хотят, чтобы я находился в лобби #bold против правительства#!."
 wm_commons.5.wing_left: "Я сижу в #bold левом крыле#! моей партии."
 wm_commons.5.wing_right: "Я сижу в #bold правом крыле#! моей партии."
 wm_commons.5.wing_centre: "Я сижу в #bold центре#! моей партии."
 wm_commons.5.a: "Голосовать за правительство."
 wm_commons.5.b: "Голосовать против правительства."
 wm_commons.5.c: "Держись подальше и воздерживайся."

 wm_commons_whip_withdrawn_toast: "Кнут снят"
 wm_commons_whip_withdrawn_toast_desc: "После слишком частых восстаний [wm_commons_whipless.GetName] лишен партийной дисциплины и теперь сидит как независимый."

 # Modifiers
 wm_commons_tax_rise_modifier: "Повышение налогов"
 wm_commons_tax_rise_modifier_desc: "Финансовый законопроект ввёл налоги. Деньги поступают, и избиратели это заметили."
 wm_commons_public_services_modifier: "Расходы на государственные услуги"
 wm_commons_public_services_modifier_desc: "Больше денег для школ и больниц: популярно и дорого."
 wm_commons_reformer_modifier: "Реформатор"
 wm_commons_reformer_modifier_desc: "Провёл спорную реформу через Палату общин."
 wm_commons_emergency_powers_modifier: "Аварийные полномочия"
 wm_commons_emergency_powers_modifier_desc: "парламент предоставил правительству широкие полномочия для решения кризиса."
 wm_commons_defeated_in_commons_modifier: "Поражение в Палате общин"
 wm_commons_defeated_in_commons_modifier_desc: "Правительственный законопроект был отклонен Палатой общин."
 wm_commons_lost_confidence_modifier: "Потерял доверие Палаты"
 wm_commons_lost_confidence_modifier_desc: "Палата общин проголосовала против доверия этому правительству."

 # Opinions
 wm_commons_defied_whip_opinion: "Бросил вызов кнуту"
 wm_commons_whip_withdrawn_opinion: "Отнял у меня кнут"
 wm_commons_tabled_no_confidence_opinion: "Пытался свергнуть мое правительство"
 wm_commons_introduce_bill_decision_confirm: "Отнеси это в дом"
 wm_commons_no_confidence_decision_confirm: "Отложить ходатайство"
