 bm_2024_starmer: "2024: Смена правительства"
 bm_2024_starmer_desc: "Лейбористы выиграли всеобщие выборы 4 июля 2024 года, получив 411 мест, что составляет большинство в 174 места. Киир Стармер стал премьер-министром; Консерваторы, уменьшившиеся до 121 места, должны выбрать нового лидера; Либеральные демократы показали лучший результат за столетие; а Reform UK, Зеленые и группа независимых прошли в Палату общин.\n\n#bold Каждый из 650 депутатов доступен для игры.#!"
