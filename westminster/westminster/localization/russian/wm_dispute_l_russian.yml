l_russian:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "Граф"
 wm_dispute.1.desc: "#italic Заявление вернувшегося чиновника#!\n\n[wm_dispute_mp.GetName] объявлен победителем в [wm_dispute_seat.GetNameNoTier] с разницей [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] очков."
 wm_dispute.1.close: "Это близко к тому, что агенты уже бормочут о том, что несколько пакетов бюллетеней были посчитаны дважды и о коробке, которая пришла поздно. Пересчет (неделя, [EmptyScope.ScriptValue('wm_dispute_recount_cost')|0] в гонорарах) может изменить результат, вполне возможно [EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0]% шанс; жалоба на выборы (четыре месяца и [EmptyScope.ScriptValue('wm_dispute_court_cost')|0]) может привести к аннулированию результата и новой борьбе за место, возможно [EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0]% шанс."
 wm_dispute.1.clear: "Это не близко. Пересчет ([EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]) очень вероятно ничего не изменит, а общество не любит плохих проигравших: оспаривание результата обойдется вам в урон политическому имиджу."
 wm_dispute.1.bad: "Это даже не было близко: сокрушительное поражение. Оспаривание превратит вас в посмешище и может вывести разгневанных сторонников на улицы."
 wm_dispute.1.a: "Поздравьте победителя."
 wm_dispute.1.b: "Требуйте пересчета голосов."
 wm_dispute.1.b.tt: "Каждый бюллетень пересчитывается. Это стоит денег; если результат был не близок, это также стоит вам репутации и политического капитала."
 wm_dispute.1.c: "Петиция в избирательный суд."
 wm_dispute.1.c.tt: "Судьи рассматривают проведение выборов. Это медленно и дорого; они могут признать выборы недействительными и назначить новые, либо взыскать с вас расходы."
 wm_dispute_recount_toast: "Пересчёт в [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName] потребовал пересчёта голосов в [wm_dispute_seat.GetNameNoTier]. Сотрудники подсчёта вернулись за свои столы."
 wm_dispute_court_toast: "Избирательное обращение: [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName] подал петицию в избирательный суд по поводу результатов в [wm_dispute_seat.GetNameNoTier]. Судьи отчитались через несколько месяцев."
 wm_dispute_overturned_toast: "ПЕРЕСЧЁТ ОТМЕНЯЕТ РЕЗУЛЬТАТ"
 wm_dispute_overturned_toast_desc: "После пересчета голосов [wm_dispute_mp.GetName] объявляется депутатом от [wm_dispute_seat.GetNameNoTier] с незначительным количеством голосов."
 wm_dispute_upheld_toast: "Пересчёт подтверждает результат"
 wm_dispute_upheld_toast_desc: "Пересчет голосов в [wm_dispute_seat.GetNameNoTier] подтверждает [wm_dispute_mp.GetName] как его депутата."
 wm_dispute_void_toast: "ВЫБОРЫ ПРИЗНАНЫ НЕДЕЙСТВИТЕЛЬНЫМИ"
 wm_dispute_void_toast_desc: "Избирательный суд признал результат в [wm_dispute_seat.GetNameNoTier] недействительным. Будет проведен новый повторный выбор."
 wm_dispute_dismissed_toast: "Избирательное обращение отклонено"
 wm_dispute_dismissed_toast_desc: "Избирательный суд отклонил петицию по поводу [wm_dispute_seat.GetNameNoTier] и присудил расходы против заявителя. [wm_dispute_mp.GetName] остается."
 wm_dispute_national_toast: "ОТКАЗЫВАЕТСЯ УСТУПАТЬ"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] не примет результат всеобщих выборов. Ничего не изменится, но сторонники собираются на улицах, а газеты беспощадны."
 wm_dispute_seat_decision: "Бросить вызов графу"
 wm_dispute_seat_decision_desc: "Вы потеряли место, но правильно ли был подсчет? Потребуйте пересчет или обратитесь в избирательный суд с просьбой признать выборы недействительными. Если это было не близко, общественность увидит плохого проигравшего."
 wm_dispute_seat_decision_tooltip: "Оспорить результат на месте, где вы проиграли."
 wm_dispute_seat_decision_confirm: "Рассмотрите это"
 wm_dispute_seat_decision_effect_tt: "Вы решаете, принять ли результат, потребовать пересчета #bold#! или подать петицию в #bold избирательный суд#!."
 wm_dispute_not_disputed_tt: "Результат еще не оспорен."
 wm_dispute_no_byelection_tt: "Место не ждёт повторных выборов."
 wm_dispute_national_decision: "Отказаться уступить"
 wm_dispute_national_decision_desc: "Избиратели выгнали вас с Даунинг-стрит. Вы могли бы отказаться это принять: поставить под сомнение подсчёт, почтовые голоса, вещателей. Это ничего не изменит, дорого обойдётся и выведет на улицы ваших самых ярых сторонников."
 wm_dispute_national_decision_tooltip: "Отказаться принять результат всеобщих выборов."
 wm_dispute_national_decision_confirm: "Отказаться уступить"
 wm_dispute_national_decision_effect_tt: "Вы теряете значительное количество #bold профиля и политического капитала#!, ваша партия падает в опросах, новый премьер-министр раздражен, и могут начаться #bold бунты#!."
 wm_dispute_sore_loser_modifier: "Обидный проигравший"
 wm_dispute_sore_loser_modifier_desc: "Отказался принять результат всеобщих выборов."
 wm_dispute_bad_loser_modifier: "Плохой проигравший"
 wm_dispute_bad_loser_modifier_desc: "Оспорили результат, который явно проиграли."
 wm_dispute_sore_loser_opinion: "Отказался уступить"
