l_russian:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "КОАЛИЦИЯ СОГЛАСОВАНА"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] и [wm_coal_leader.GetName] пожали руки на ступенях дома №10. [wm_coal_party.GetNameNoTier] ([wm_coal_party_seats|0] мест) присоединяется к [wm_coal_senior.GetNameNoTier] ([wm_coal_senior_seats|0]) в правительстве, а [wm_coal_leader.GetFirstName] становится заместителем премьер-министра."
 wm_coalition_headline_supply: "СОГЛАШЕНИЕ ЗАКЛЮЧЕНО: ПРАВИТЕЛЬСТВО ПОДДЕРЖАНО"
 wm_coalition_headline_supply_desc: "[wm_coal_party.GetNameNoTier] заключила соглашение о доверии и поддержке с правительством [wm_coal_pm.GetName]. Ее [wm_coal_party_seats|0] депутаты будут поддерживать правительство по голосованиям о доверии и бюджету, а лидер добился финансирования для их приоритетов. По всем остальным вопросам каждое голосование — за себя."
 wm_coalition_headline_minority: "МИНОРИТАРНОЕ ПРАВИТЕЛЬСТВО"
 wm_coalition_headline_minority_desc: "Переговоры ни к чему не пришли. [wm_coal_pm.GetName] возглавит правительство меньшинства [wm_coal_senior.GetNameNoTier] [wm_coal_senior_seats|0] мест и будет вынужден выигрывать все голоса в Палате общин на собственном опыте."
 wm_coalition_headline_collapse: "КОАЛИЦИЯ РАСПАДАЕТСЯ"
 wm_coalition_headline_collapse_desc: "[wm_coal_party.GetNameNoTier] вышла из правительства [wm_coal_pm.GetName]. Без её голосов у правительства нет большинства, и Уэстминстер готовится к вотуму недоверия или выборам."

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "Парламент Хунг"
 wm_coalition.1.desc: "Страна высказалась, и никто толком не знает, что именно она сказала. [wm_coal_senior.GetNameNoTier] — крупнейшая партия с #bold [wm_coal_senior_seats|0]#! местами, что меньше [wm_coal_majority|0], необходимых для того, чтобы самостоятельно набрать голоса в Палате общин.\n\nСекретарь кабинета министров подготовил переговорные комнаты государственной службы. Лидеры других партий ждут у телефонов, а прессa дежурит у номеров 10. Кому мы звонем?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] мест"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] мест"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] мест"
 wm_coalition.1.a: "Открытые переговоры с [wm_coal_choice_1.GetNameNoTier]."
 wm_coalition.1.b: "Открытые переговоры с [wm_coal_choice_2.GetNameNoTier]."
 wm_coalition.1.c: "Открытые переговоры с [wm_coal_choice_3.GetNameNoTier]."
 wm_coalition.1.d: "Мы будем управлять в одиночку и бросить им вызов свергнуть нас."
 wm_coalition.1.d.tt: "Вы возглавляете #bold меньшинственное правительство#!: каждый законопроект и любое голосование по довериям должно находить свои голоса в день голосования."

 # The terms
 wm_coalition.2.t: "Переговорный стол"
 wm_coalition.2.desc: "Команда [wm_coal_talks.GetNameNoTier] под руководством [wm_coal_talks_leader.GetName] прибыла в Кабинет министров с длинным списком требований. У них есть #bold [wm_coal_talks_seats|0]#! депутатов; с нашими это составляет [wm_coal_combined_seats|0]."
 wm_coalition.2.majority: "Вместе у нас было бы большинство."
 wm_coalition.2.no_majority: "Даже вместе мы не набрали бы большинства, но это лучшее предложение."
 wm_coalition.2.mood_warm: "\n\n Настроение теплое. Их переговорщики согласны со многим из нашего манифеста и хотят быть у власти."
 wm_coalition.2.mood_cool: "\n\n Настроение деловое. Они захотят многого взамен, а их активисты опасаются быть обвиненными в наших ошибках."
 wm_coalition.2.mood_cold: "\n\n Настроение холодное. Наши партии крайне далеки друг от друга, и их депутаты предпочли бы сидеть в оппозиции, чем поддерживать нас дешево."
 wm_coalition.2.a: "Предложить коалицию: заместитель премьер-министра и одно место в кабинете министров."
 wm_coalition.2.a.tt: "Их лидер становится #bold заместителем премьер-министра#!, а один из их депутатов входит в кабинет министров. Их депутаты получают партийную партию при каждом голосовании."
 wm_coalition.2.b: "Предложить коалицию и принять одну из их флагманских политик."
 wm_coalition.2.b.tt: "Как указано выше, и их политика в отношении домашних животных включается в программу правительства. Нашим собственным рядовым депутатам это не понравится: #bold Коалиционный компромисс#! на пять лет."
 wm_coalition.2.c: "Предложить коалицию с двумя членами кабинета министров и одной из их политик."
 wm_coalition.2.c.tt: "Их лидер становится #bold заместителем премьер-министра#!, двое их депутатов входят в кабинет, а их любимая политика входит в программу управления правительством."
 wm_coalition.2.d: "Предлагать доверие и предложение: их голоса по доверию и бюджету — за деньги."
 wm_coalition.2.d.tt: "Они не участвуют в управлении, но поддерживают нас по #bold вотумам недоверия#! и #bold Закону о финансах#!. Взамен мы финансируем их приоритеты: это стоит нам денег и выплачивается их лидеру."
 wm_coalition.2.e: "Давай попробуем другую вечеринку."
 wm_coalition_signals_yes_tt: "Их переговорщики дают понять, что могут подписать это."
 wm_coalition_signals_no_tt: "Их переговорщики дают понять, что этого будет недостаточно."

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "Предложение о коалиции"
 wm_coalition.3.t_supply: "Предложение о доверии и поддержке"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName] позвонил. У [wm_coal_senior.GetNameNoTier] [wm_coal_senior_seats|0] мест, меньше большинства, и она хочет, чтобы мы были у правительства: вы #bold заместителем премьер-министра#! и [wm_coal_offer_seats|0] наших депутатов за столом кабинета. Взамен наши депутаты будут голосовать вместе с правительством по всем вопросам."
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName] позвонил. У [wm_coal_senior.GetNameNoTier] [wm_coal_senior_seats|0] мест, меньше большинства, и она хочет, чтобы мы были в правительстве: вас как #bold заместителя премьер-министра#!, [wm_coal_offer_seats|0] наших депутатов за столом кабинета и одну из наших главных политик в программе для правительства. Взамен наши депутаты будут голосовать вместе с правительством по всем вопросам."
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName] позвонил. У [wm_coal_senior.GetNameNoTier] [wm_coal_senior_seats|0] мест, меньше большинства, и она хочет соглашения о доверии и предложении: наши депутаты поддерживают правительство по вопросам вотумов доверия и бюджета, а взамен правительство финансирует наши приоритеты. По всем остальным мы могли бы голосовать по своему желанию."
 wm_coalition.3.a: "У нас есть соглашение."
 wm_coalition.3.a.tt: "Сделка подписана, и [wm_coal_pm.GetFirstName] будет вам обязан."
 wm_coalition.3.b: "Спасибо, но нет."
 wm_coalition.3.b.tt: "Наши депутаты остаются в оппозиции, свободные голосовать против правительства."

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "Сделка заключена"
 wm_coalition.4.t_refused: "Talks проваливаются"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName] согласился. [wm_coal_party.GetNameNoTier] присоединяется к правительству, [wm_coal_leader.GetFirstName] становится заместителем премьер-министра, а пресса уже называет это браком по расчету. Его депутаты подчинятся нашему кнуту."
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName] согласился. [wm_coal_party.GetNameNoTier] поддержит нас в вопросах вотумов доверия и финансового законопроекта за определённую цену. Во всём остальном, организаторам придётся завоевать своих депутатов по одному голосу за раз."
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName] отказал нам. [wm_coal_talks.GetNameNoTier] говорит, что наше предложение значительно ниже того, что приняли бы его члены."
 wm_coalition.4.a: "Новая глава для страны."
 wm_coalition.4.b: "Подсластить предложение."
 wm_coalition.4.c: "Попробуйте другую партию."
 wm_coalition.4.d: "Тогда мы будем управлять в одиночку."

 # Breakdown
 wm_coalition.20.t: "время уходить?"
 wm_coalition.20.desc_coalition: "Наши депутаты беспокойны. Каждое непопулярное решение, которое принимает правительство, приписывают нам, а [wm_coal_senior.GetNameNoTier] получает заслугу за всё, что идёт хорошо. Некоторые хотят, чтобы мы вышли из коалиции сегодня."
 wm_coalition.20.desc_supply: "Наши депутаты беспокойны. Поддержка правительства [wm_coal_pm.GetName] обходится нам дорого, а деньги на наши приоритеты не принесли той благодарности, на которую мы рассчитывали. Некоторые хотят разорвать соглашение сегодня."
 wm_coalition.20.polls_bad: "\n\n Опросы мрачные: мы заметно потеряли позиции с момента сделки."
 wm_coalition.20.polls_ok: "\n\n Опросы держатся, на данный момент."
 wm_coalition.20.a: "Мы вышли. Пусть правительство разберётся само."
 wm_coalition.20.a.tt: "Сделка завершается. Правительство теряет голоса ваших депутатов и может столкнуться с вотумом недоверия или выборами. Премьер-министр вам не простит."
 wm_coalition.20.b: "Мы дали слово. Мы остаемся."
 wm_coalition.21.t: "Наши партнёры выходят"
 wm_coalition.21.desc: "Наши партнёры вышли, и вместе с ними наше большинство. Оппозиция чувствует запах крови, прессa хочет знать, сможем ли мы выжить, а главный партийный вождь уже считает головы."
 wm_coalition.21.a: "Мы продолжаем как правительство меньшинства."
 wm_coalition.21.a.tt: "Every vote in the Commons will be a struggle."
 wm_coalition.21.b: "Найти новых партнёров."
 wm_coalition.21.c: "Пусть страна решит: назначить всеобщие выборы."
 wm_coalition.21.c.tt: "Парламент распускается, а #bold года проходят всеобщие выборы#! через пять недель."

 # Decision
 wm_coalition_leave_decision: "Покинуть соглашение с правительством"
 wm_coalition_leave_decision_desc: "Выведите свою партию из сделки с правительством. Ваши депутаты будут свободны голосовать, правительство потеряет большинство, и премьер-министр никогда вас не простит."
 wm_coalition_leave_decision_tooltip: "Прекратите вашу коалицию или соглашение о доверии и поддержке"
 wm_coalition_leave_decision_confirm: "Выйти"
 wm_coalition_leave_decision_effect_tt: "Сделка завершается. Правительство теряет голоса ваших депутатов и может столкнуться с вотумом недоверия или выборами."
 wm_coalition_leave_no_election_desc: "Всеобщие выборы не были назначены"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "Заместитель премьер-министра"
 wm_coalition_deputy_pm_modifier_desc: "Второй в правительстве и лидер младшего коалиционного партнера."
 wm_coalition_compromise_modifier: "Компромисс коалиции"
 wm_coalition_compromise_modifier_desc: "Одна из ключевых политик партнёра по коалиции включена в программу правительства, и наши собственные парламентарии жалуются."
 wm_coalition_supply_deal_modifier: "Сделка о доверии и поддержке"
 wm_coalition_supply_deal_modifier_desc: "поддерживает правительство на вопросах вотумов доверия и бюджета, а также имеет деньги на свои приоритеты."
 wm_coalition_partner_opinion: "Партнер по коалиции"
 wm_coalition_walked_out_opinion: "Вышли из нашего правительства"
 wm_coalition_deputyship_diarchy_type: "Коалиция"
 wm_coalition_deputyship_diarch_title: "Заместитель премьер-министра"
