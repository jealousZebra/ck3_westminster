l_russian:
 # Campaign spending (common/scripted_effects/wm_spend_effects.txt)
 wm_spend_press_decision: "Финансировать пресс-кампанию"
 wm_spend_press_decision_desc: "Покупайте рекламу, спонсируйте отчёты аналитических центров и снабжайте дружелюбных колумнистов историями. Кампания о вашей партии и её политике, оплачиваемая каждый месяц. \n\n Это стоит примерно #bold [GetPlayer.MakeScope.ScriptValue('wm_spend_press_cost')|1]#! В месяц (30% вашего дохода). Кампания лидера партии повышает рейтинг партии примерно на 0,15 пунктов в месяц, стабилизируясь примерно на 3 пункта выше, чем он был бы; кампания рядового члена партии даёт лишь пятую часть этого."
 wm_spend_press_decision_tooltip: "Потратьте деньги, чтобы поднять свою партию в опросах."
 wm_spend_press_decision_confirm: "Подписать чеки"
 wm_spend_press_decision_effect_tt: "Каждый месяц вы платите 30% от своего дохода, и рейтинг вашей партии растет. Кампания длится до года или до тех пор, пока вы её не остановите или деньги не закончатся."
 wm_spend_not_campaigning_tt: "Вы еще не оплачиваете кампанию"
 wm_spend_press_afford_tt: "Вы можете позволить себе первый месяц ([GetPlayer.MakeScope.ScriptValue('wm_spend_press_cost')|1] Средства)"
 wm_spend_smear_afford_tt: "Вы можете позволить себе первый месяц ([GetPlayer.MakeScope.ScriptValue('wm_spend_smear_cost')|1] Средства)"

 wm_spend_smear_decision: "Финансировать кампанию по очернению"
 wm_spend_smear_decision_desc: "Рекламные нападения, подразделения возражений и постоянный поток неблагоприятных историй о рекорде соперничающей партии и её средствах. Никогда о личной жизни кого-либо: целью является партия и её политика.\n\nЭто стоит около #bold [GetPlayer.MakeScope.ScriptValue('wm_spend_smear_cost')|1]#! фондов в месяц (40% вашего дохода). Кампания лидера снижает показатели соперника примерно на 0.2 пункта в месяц, кампания рядового члена - на четверть от этого. Это изматывает общественное доверие, и каждый месяц есть #N [GetPlayer.MakeScope.ScriptValue('wm_spend_backfire_chance')|0]%#! шанс, что это обернётся против вас (меньше для хорошего махинатора): ваша собственная партия теряет пункт, доверие падает, лидер соперника обижен на вас, а пресса продолжает историю."
 wm_spend_smear_decision_tooltip: "Потратить деньги, чтобы свалить соперничающую партию. Это может обернуться против неё."
 wm_spend_smear_decision_confirm: "Выберите цель"
 wm_spend_smear_decision_effect_tt: "Выберите соперничающую партию. Каждый месяц вы платите 40% своего дохода, их рейтинги падают, доверие общества падает, и кампания может обернуться против них."

 wm_spend_stop_decision: "Прекратить расходы на кампании"
 wm_spend_stop_decision_desc: "Отмените рекламу и перестаньте платить за свою кампанию."
 wm_spend_stop_decision_tooltip: "Прекратите вашу пресс- или клеветническую кампанию."
 wm_spend_stop_decision_confirm: "Отменить"
 wm_spend_stop_decision_effect_tt: "Ваша кампания заканчивается, и вы перестаете за нее платить."

 wm_spend_favour_decision: "Воспользоваться услугой"
 wm_spend_favour_decision_desc: "Многолетние тихие сделки между офисами партийных организаторов оставили соперничающую партию вашим должником: выполненное парное соглашение, обменяное место в комитете, голосование доставлено в нужный момент. Потратьте часть своего политического капитала, чтобы их лидер это запомнил."
 wm_spend_favour_decision_tooltip: "Тратить политический капитал на услугу, которую должен лидер соперничающей партии."
 wm_spend_favour_decision_confirm: "Сделать звонок"
 wm_spend_favour_decision_effect_tt: "Выберите лидера соперничающей партии: вы получаете крюк #bold Favor#! на него."
 wm_spend_favour_rival_tt: "У другой партии есть лидер"

 wm_spend.10.t: "Кампания нападения"
 wm_spend.10.desc: "Агентство готово с рекламой, а исследователи прошли через все расходы и каждое нарушенное обещание. За какой партийный результат мы будем бороться?"
 wm_spend.10.a: "[wm_spend_party_1.GetNameNoTier]."
 wm_spend.10.b: "[wm_spend_party_2.GetNameNoTier]."
 wm_spend.10.c: "[wm_spend_party_3.GetNameNoTier]."
 wm_spend.10.d: "При переосмыслении, давайте оставим это чистым."

 wm_spend.20.t: "Оказанная услуга"
 wm_spend.20.desc: "У вашего главного организатора есть список всех услуг, которые другие партии должны нам. Кого из их лидеров следует напомнить?"
 wm_spend.20.a: "[wm_spend_rival_1.GetName] из [wm_spend_party_1.GetNameNoTier]."
 wm_spend.20.b: "[wm_spend_rival_2.GetName] из [wm_spend_party_2.GetNameNoTier]."
 wm_spend.20.c: "[wm_spend_rival_3.GetName] из [wm_spend_party_3.GetNameNoTier]."

 wm_spend_ended_toast: "Кампания завершена"
 wm_spend_ended_toast_desc: "Ваш оплачиваемая кампания закончилась: год истек, деньги закончились, или исчезла ее цель."
 wm_spend_backfire_toast: "ГРЯЗНЫЕ ХИТРОСТИ РАСКРЫТЫ"
 wm_spend_backfire_toast_desc: "Кампания по очернению [wm_spend_target_party.GetNameNoTier] была прослежена до [wm_spend_spender.GetName]. Их партия теряет балл в опросах, а общественное доверие получает очередной удар."

 wm_secret_smear_campaign: "Кампания по дискредитации"
 wm_secret_smear_campaign_type_desc: "Оплатил кампанию по дискредитации"
 wm_secret_smear_campaign_desc: "Оплатил кампанию по дискредитации против соперничающей партии"
 wm_secret_smear_campaign_tooltip_desc: "Этот персонаж оплатил дискредитационную кампанию против соперничающей партии, и пресса это доказывает."
