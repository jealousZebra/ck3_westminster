l_russian:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "Конкурс лидерства"
 wm_leadership.1.desc_vacancy: "[wm_lead_party.GetNameNoTier] нужен новый лидер. [wm_lead_party_holder.GetName] временно заботится о делах, но партия выберет его сама.\n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] отказывается от роли лидера [wm_lead_party.GetNameNoTier], и началась гонка за их преемника.\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] сталкивается с вызовом за лидерство [wm_lead_party.GetNameNoTier]. Любой другой, кто желает испытать свои шансы, может присоединиться.\n\n"
 wm_leadership.1.rules: "#bold Правила:#! номинации от депутатов партии закрываются через десять дней. Кандидату нужно 15% их поддержки (для оппонента — 20%), чтобы продвинуться дальше, и два кандидата с наибольшей поддержкой идут на голосование среди членов партии через три недели. Члены партии ищут коммуникатора, заслуги, политический капитал в партии и поддержку депутатов."
 wm_leadership.1.a: "Бросаю мою шляпу в ринг."
 wm_leadership.1.a.tt: "Вы представляете лидерство. Ваши коллеги решат, выдвигать ли вас."
 wm_leadership.1.b: "Не в этот раз."
 wm_leadership.2.t: "Вызов"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName] объявил о вызове вашему руководству [wm_lead_party.GetNameNoTier]. Если найдут достаточно номинаций, члены выберут между вами."
 wm_leadership.2.a: "Сражайтесь с ними и победите."
 wm_leadership.2.a.tt: "Вы находитесь в бюллетене на данный момент. Испытателю нужно пятая часть депутатов партии, чтобы номинировать его."
 wm_leadership.2.b: "Отступайте с достоинством."
 wm_leadership.2.b.tt: "Вы не участвуете. Конкурс продолжается без вас, и вы лидируете, пока не будет победителя."
 wm_leadership.3.t: "Голосование членов"
 wm_leadership.3.desc: "Вы попали в шорт-лист лидеров [wm_lead_party.GetNameNoTier] против [wm_lead_rival.GetName]. Впереди три недели аутсайдеров, телефонных банков и интервью. Члены будут решать."
 wm_leadership.3.a: "Совершать тур по партийным организациям округа."
 wm_leadership.3.a.tt: "Кампания рукопожатий и агитации: она учитывает ваш #bold харизму#!."
 wm_leadership.3.b: "Разработайте серьёзную программу."
 wm_leadership.3.b.tt: "Политическая платформа: она играет на вашей #bold экономике#! и #bold политике#!."
 wm_leadership.3.c: "Нанимайте лучших, кого только можно купить за деньги кампании."
 wm_leadership.3.c.tt: "Стильные видео и беспощадная работа на местах. Дорого, но работает."
 wm_leadership.3.d: "Пусть моя запись говорит сама за себя."
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] WINS [wm_lead_news_party.GetAdjective|U] ЛИДЕРСТВО"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] КОРОНОВАН БЕЗ СОПЕРНИКОВ"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] ОТВОДИТ ВЫЗОВ"
 wm_leadership.4.t_failed: "ЛИДЕРСКИЙ ВЫЗОВ УГАСАЕТ"
 wm_leadership.4.desc_ballot: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n Члены высказались: [wm_lead_news_winner.GetName] получает [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% голосов против [wm_lead_news_second.GetName] и становится новым лидером [wm_lead_news_party.GetNameNoTier]. [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] депутатов от партии [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] его номинировали."
 wm_leadership.4.desc_ballot_alone: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName] является новым лидером [wm_lead_news_party.GetNameNoTier], получив [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% голосов членов партии."
 wm_leadership.4.desc_survives: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n Члены поддержали своего лидера: [wm_lead_news_winner.GetName] получает [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% голосов против [wm_lead_news_second.GetName], карьера которого может не восстановиться."
 wm_leadership.4.desc_unopposed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n Только [wm_lead_news_winner.GetName] набрал необходимое количество номинаций для участия в голосовании, с [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] депутатами от партии [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0], и избран лидером [wm_lead_news_party.GetNameNoTier] без противостояния. Члены партии так и не проголосовали."
 wm_leadership.4.desc_failed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n Выпыт [wm_lead_news_winner.GetName] не увенчался успехом с самого начала: ни один претендент не набрал необходимое количество номинаций, чтобы вызвать голосование. Лидер в безопасности, на данный момент."
 wm_leadership.4.a_won: "Теперь начинается настоящая работа."
 wm_leadership.4.a: "Партия выбрала."
 wm_leadership.5.t: "После подсчета"
 wm_leadership.5.desc: "Всеобщие выборы прошли плохо для [wm_lead_party.GetNameNoTier]. Газеты уже пишут ваше политическое некролог, а некоторые коллеги не отвечают на звонки.\n\nВы можете продолжать бороться или объявить, что уйдёте с поста, когда партия выберет преемника."
 wm_leadership.5.a: "Я никуда не иду."
 wm_leadership.5.b: "Пора для кого-то другого."
 wm_leadership.5.b.tt: "Начало конкурса на лидерство. Вы не участвуете, но ведете до его завершения."
 wm_leadership_contest_toast: "Конкурс на лидерство: [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "[wm_lead_party.GetNameNoTier] выбирает лидера: кандидатуры от своих депутатов, затем бюллетень членов."
 wm_leadership_result_toast: "Новый лидер: [wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] руководит [wm_lead_party.GetNameNoTier]."
 wm_leadership_challenge_decision: "Вызов для руководства"
 wm_leadership_challenge_decision_desc: "Ваша партия заслуживает лучшего, и вы знаете кто. Объявите вызов: если пятая часть депутатов партии выдвинет вашу кандидатуру, члены выберут между вами и лидером."
 wm_leadership_challenge_decision_tooltip: "Бросить вызов лидеру своей партии."
 wm_leadership_challenge_decision_confirm: "Объявить вызов"
 wm_leadership_challenge_decision_effect_tt: "Конкурс на лидерство #bold#! начинается: десять дней выдвижения кандидатов от депутатов партии, затем голосование членов. Если вы проиграете, лидер этого не забудет."
 wm_leadership_no_contest_tt: "Лидирующий конкурс еще не проводится"
 wm_leadership_parliament_sitting_tt: "Всеобщие выборы не ведутся"
 wm_leadership_challenged_opinion: "Бросил мне вызов за лидерство"
 wm_leadership_deposed_opinion: "Забрали мою партию у меня"
 wm_leadership_gracious_opinion: "Великодушный победитель."
