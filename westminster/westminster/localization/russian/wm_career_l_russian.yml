l_russian:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "Работа на вечеринке"
 wm_job_canvassing_contract: "Агитация"
 wm_job_canvassing_desc_title: "Требуются обходчики дверей"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] нужны волонтёры на пороге в эти выходные: планшеты, листовки и крепкая кожа. Партия замечает, кто приходит под дождём."
 wm_job_canvassing_request: "Проведите три недели, стучась по домам. Успех зависит от вашего [diplomacy|E]."
 wm_job_fundraising_contract: "Благотворительный ужин"
 wm_job_fundraising_desc_title: "Помощь в заполнении таблиц"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] устраивает благотворительный ужин и нуждается в ком-то, кто будет продавать столы, преследовать доноров и следить за честностью лотереи."
 wm_job_fundraising_request: "Организуйте ужин в течение трёх недель. Успех зависит от вашего [stewardship|E]."
 wm_job_speechwriting_contract: "Написание речей"
 wm_job_speechwriting_desc_title: "Речь, которая достигает цели"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName] предстоит большое выступление, а текущий проект, по словам их офиса, является 'видео с заложником'."
 wm_job_speechwriting_request: "Напишите речь за три недели. Успех зависит от вашего [learning|E]."
 wm_job_research_contract: "Исследование оппозиции"
 wm_job_research_desc_title: "Разобраться с другой стороной"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] хочет брифинг о своих противниках: записи голосований, старые твиты, нарушенные обещания. Всё это публично, всё это полезно."
 wm_job_research_request: "Составьте досье за три недели. Успех зависит от вашего [intrigue|E]."
 wm_job_phonebank_contract: "Телефонный банк"
 wm_job_phonebank_desc_title: "Вечер за телефонами"
 wm_job_phonebank_desc: "В офисе [TaskContract.GetEmployer.GetName] есть список из четырёхсот членов, которые не продлили членство, комната с арендованными телефонами и сценарий, который никто не репетировал."
 wm_job_phonebank_request: "Обрабатывайте список звонков в течение трёх недель. Успех зависит от вашего [diplomacy|E]."
 wm_job_policy_paper_contract: "Политический Документ"
 wm_job_policy_paper_desc_title: "Десять страниц, полностью по стоимости"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] хочет что-то сказать о местных автобусах, что не является лозунгом: доказательства, цифры и рекомендация, которую может подписать министр."
 wm_job_policy_paper_request: "Напишите работу за три недели. Успех зависит от вашего [learning|E]."
 wm_job_media_round_contract: "Медиа-обход"
 wm_job_media_round_desc_title: "Шесть студий перед завтраком"
 wm_job_media_round_desc: "Местное радио, региональное телевидение и два подкаста хотят, чтобы кто-то со стороны [TaskContract.GetEmployer.GetName] вышел и защитил линию. Никто другой не вызвался."
 wm_job_media_round_request: "Подготовьте реплики и проведите интервью в течение трёх недель. Успех зависит от вашего [intrigue|E]."
 wm_job_gotv_contract: "Привлечь к голосованию"
 wm_job_gotv_desc_title: "Забеременеть, вытащить"
 wm_job_gotv_desc: "Команде [TaskContract.GetEmployer.GetName] нужны разносчики для выборов в совет: бюллетени, номера счетчиков голосов и много лестниц в многочисленных высотках."
 wm_job_gotv_request: "Проведите операцию по привлечению голосов в течение трёх недель. Успех зависит от вашего [prowess|E]."
 wm_job_budget_contract: "Стоимость обязательства"
 wm_job_budget_desc_title: "Откуда поступают деньги?"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName] пообещал что-то дорогое, и другая сторона продолжает спрашивать, как это будет оплачено. Таблица расчетов необходима срочно."
 wm_job_budget_request: "Обещание стоит за три недели. Успех зависит от вашего [stewardship|E]."
 wm_selection_contract: "Оценка кандидатов"
 wm_selection_contract_contract: "Оценка кандидатов"
 wm_selection_contract_desc_title: "Утвержденный список партии."
 wm_selection_contract_desc: "Прежде чем кто-либо сможет баллотироваться от партии, он должен пройти день оценки: пробное интервью, тест по политике и ролевую игру с рассерженным 'избирателем'."
 wm_selection_contract_request: "Сдайте оценку, чтобы войти в список одобренных кандидатов. Успех зависит от вашего [diplomacy|E]."

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "Открыт приём заявок в [wm_sel_seat.GetName]"
 wm_career.20.desc: "Местный [wm_sel_party.GetName] выбирает кандидата на [wm_sel_seat.GetName]. Письмо от председателя округа короткое: заявки заканчиваются через несколько недель, и в общественном центре начнутся собрания. \n\nПополь, которые баллотируются на такие места, становятся депутатами."
 wm_career.20.a: "Выдвигай моё имя."
 wm_career.20.b: "Не этот."
 wm_career.21.t: "Холстинговые выборы в [wm_sel_seat.GetName]"
 wm_career.21.desc: "Пластиковые стулья, чайный самовар и шестьдесят членов партии, которые уже слышали все презентации. Каждый кандидат получает десять минут и вопросы из зала. Как мне их завоевать?"
 wm_career.21.a: "Расскажите о районе: его главной улице, автобусах, людях."
 wm_career.21.b: "Составьте план с учётом стоимости, полис за полисом."
 wm_career.21.c: "Аккуратно напомнить им, что говорили другие кандидаты в прошлом."
 wm_career.21.success: "Комната теплилась по отношению к вам."
 wm_career.21.failure: "Комната оставалась холодной."

 wm_career_selected_toast: "Выбран для [wm_sel_seat.GetName]"
 wm_career_selected_toast_desc: "Местный [wm_sel_party.GetName] выбрал вас своим кандидатом. Выиграйте место на следующих выборах или дополнительных выборах — и вы станете депутатом."
 wm_career_not_selected_toast: "Не выбраны в [wm_sel_seat.GetName]"
 wm_career_not_selected_toast_desc: "Участники выбрали [wm_sel_winner.GetName]. В следующий раз тебя будут знать больше."
 wm_career_elected_toast: "Избран в парламент"
 wm_career_elected_toast_desc: "Подсчет завершен, и место ваше. Команда кампании закончила работу; партийные дисциплинарные секретари свяжутся с вами."

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "Подать заявку на отбор"
 wm_career_apply_decision_desc: "Выдвинуть моё кандидатство от партии в округе, где выбирают местные депутаты. Партийное выступление: [GetPlayer.MakeScope.Var('wm_standing').GetValue|0]."
 wm_career_apply_decision_tooltip: "Подать заявку на участие в качестве кандидата от партии на место"
 wm_career_apply_decision_free_tt: "Вы ещё не подавали заявку на место и не были выбраны кандидатом"
 wm_career_apply_decision_standing_tt: "В списке одобренных кандидатов партии или с партийным рейтингом не менее 30"
 wm_career_apply_decision_open_tt: "Партия выбирает кандидата где-то."
 wm_career_apply_decision_effect_tt: "Вы подаете заявку на один из открытых партийных выборов, желательно в вашей собственной стране, и выступаете на его предвыборных собраниях."
 wm_career_return_decision: "Снова на предвыборной кампании"
 wm_career_return_decision_desc: "Избиратели высказались, и они могут изменить своё мнение. Соберите команду кампании и ищите место."
 wm_career_return_decision_tooltip: "Снова претендовать на выборы после потери места"
 wm_career_return_decision_effect_tt: "Вы получаете команду кампании, вступаете в список утвержденных кандидатов партии и можете подать заявку на отбор."

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "Сделала для меня хорошую работу"
 wm_career_poor_work_opinion: "Отпусти меня"
 wm_career_apply_decision_confirm: "Подать заявку"
 wm_career_return_decision_confirm: "Снова к дверям"
