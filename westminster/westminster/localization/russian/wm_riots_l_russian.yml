l_russian:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "Бунтари в [wm_riot_seat.GetName]"
 wm_riot_gathering_toast_desc: "Злые толпы собрались в [wm_riot_seat.GetName]. [wm_riot_organiser.GetName] организует марш протеста на Вестминстере."
 wm_riot_marching_toast: "Протестный марш с [wm_riot_seat.GetName] года"
 wm_riot_marching_toast_desc: "Протестное шествие от [wm_riot_seat.GetName] отправилось в Вестминстер под руководством [wm_riot_organiser.GetName]. Оно прибудет в течение месяца со своими требованиями."

 wm_riot_demand_1_desc: "\n\nОни хотят помощи с #bold стоимостью жизни#!: счета, арендная плата и цены на продукты взлетели до небес, и, по их словам, правительство не заботится об этом."
 wm_riot_demand_2_desc: "\n\nОни хотят #bold отставки министра#!: кто-то в Кабинете должен понести ответственность, и они хотят, чтобы кто-то ушёл."
 wm_riot_demand_3_desc: "\n\nОни хотят #bold всеобщие выборы#!: правительство, по их мнению, не имеет мандата на свои действия, и страна должна решить сама."
 wm_riot_demand_4_desc: "\n\n Они хотят #bold резкого разворота #!: политики, которую они ненавидят, отмененной немедленно, без всяких «если» и «но»."

 wm_riot.10.t: "Проблемы в [wm_riot_seat.GetName]"
 wm_riot.10.desc: "Телефон моего офисного округа не перестаёт звонить. Сотни людей находятся на улицах [wm_riot_seat.GetName], магазины закрыли свои ставни, а местный активист, [wm_riot_organiser.GetName], рассказывает камерам, что толпа пойдёт на Вестминстер, если кто-то не услышит."
 wm_riot.10.a: "Выходите на улицу и поговорите с ними."
 wm_riot.10.a.success: "Толпа слушает и расходится по домам"
 wm_riot.10.a.failure: "Снесен с улицы"
 wm_riot.10.b: "Публично заявлять, что у них есть точка зрения."
 wm_riot.10.c: "Держаться тихо и дать Дому номер 10 разобраться с этим."

 wm_riot.20.t: "Марш до Вестминстера"
 wm_riot.20.desc: "Площадь Парламента заполнена плакатами."
 wm_riot.20.desc_first: "Марш протеста от [wm_riot_seat.GetName] прибыл, и его организатор, [wm_riot_organiser.GetName], попросил встретиться со мной с перечнем требований."
 wm_riot.20.desc_bigger: "Марш из [wm_riot_seat.GetName] вернулся, более масштабный и злее, чем раньше. [wm_riot_organiser.GetName] говорит, что больше переговоров не будет."
 wm_riot.20.desc_gone: "\n\nК тому времени, как я прочитал информацию, толпа уже разошлась по домам."
 wm_riot.20.a: "Дать им то, что они хотят."
 wm_riot.20.b: "Пригласить организаторов поговорить."
 wm_riot.20.b.success: "Согласован компромисс"
 wm_riot.20.b.failure: "Переговоры провалились."
 wm_riot.20.c: "Скажи полиции освободить площадь."
 wm_riot.20.c.dispersed: "Полиция очищает площадь"
 wm_riot.20.c.violence: "Сцены насилия в вечерних новостях"
 wm_riot.20.d: "Хорошо."

 wm_riot_county_modifier: "Бунт"
 wm_riot_county_modifier_desc: "На улицах собираются злые толпы, и марш протеста уже начался."
 wm_riot_demands_met_county_modifier: "Требования выполнены"
 wm_riot_demands_met_county_modifier_desc: "Правительство дало протестующим то, чего они хотели."
 wm_riot_compromise_county_modifier: "Компромисс"
 wm_riot_compromise_county_modifier_desc: "Протестующие разошлись по домам с соглашением."
 wm_riot_policed_county_modifier: "Протест разогнан"
 wm_riot_policed_county_modifier_desc: "Полиция разогнала марш протеста, и люди здесь это не забыли."
 wm_riot_crackdown_county_modifier: "Полицейское насилие"
 wm_riot_crackdown_county_modifier_desc: "Фотографии, на которых полиция штурмует марш протеста, продолжают распространяться."
 wm_mp_backed_protesters_county_modifier: "Депутат поддержал протест"
 wm_mp_backed_protesters_county_modifier_desc: "Местный депутат поддержал протестующих."
 wm_cost_of_living_package_modifier: "Пакет по снижению стоимости жизни"
 wm_cost_of_living_package_modifier_desc: "Помощь с оплатой счетов, оплачиваемая государством."
 wm_u_turn_modifier: "Разворот на 180 градусов"
 wm_u_turn_modifier_desc: "Вынужден сделать унизительный разворот из-за протестного марша."
 wm_heavy_handed_modifier: "Жесткий"
 wm_heavy_handed_modifier_desc: "Отправили полицию против протестного марша."
 wm_crackdown_modifier: "Обвинён в полицейском насилии"
 wm_crackdown_modifier_desc: "Охрана протестного марша, который стал насильственным, и вина легла сюда."

 wm_forced_to_resign_opinion: "Вынудили меня уйти в отставку"
 wm_backed_protesters_opinion: "Встал на сторону протестующих"
 wm_policed_my_constituents_opinion: "Отправил полицию против своих избирателей"
