l_russian:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "Лейбористская левая"
 wm_wing_badge_1_desc: "Член социалистического левого крыла партии: государственная собственность, права профсоюзов и расходы. (В этой игре принадлежность действующего депутата к крылу случайна и не отражает его взглядов.)"
 wm_wing_badge_2: "Мягкая левая"
 wm_wing_badge_2_desc: "Член мягкого левого крыла партии: критически настроенные друзья руководства, заинтересованные в государственных услугах. (В этой игре принадлежность действующего депутата к крылу случайна и не отражает его взглядов.)"
 wm_wing_badge_3: "Лейбористские центристы"
 wm_wing_badge_3_desc: "Член партии центристов: финансовая осторожность, реформа государственных служб, прежде всего выборность. (В этой игре принадлежность действующего депутата к крылу случайна и не отражает его взглядов.)"
 wm_wing_badge_4: "Единая нация"
 wm_wing_badge_4_desc: "Член партии One Nation moderates: прагматичный, за общественные службы. (Крыло реального депутата в этой игре случайное, а не отражение их взглядов.)"
 wm_wing_badge_5: "Сторонники свободного рынка"
 wm_wing_badge_5_desc: "Член партии сторонников свободного рынка: снижение налогов, малое государство, дерегулирование. (В этой игре принадлежность действующего депутата к крылу случайна и не отражает его взглядов.)"
 wm_wing_badge_6: "Традиционалисты"
 wm_wing_badge_6_desc: "Член традиционалистского крыла партии: закон и порядок, институты, национальная идентичность. (В этой игре принадлежность действующего депутата к крылу случайна и не отражает его взглядов.)"
 wm_wing_court_decision: "Судебное крыло партии"
 wm_wing_court_decision_desc_labour: "Как крылья Парламентской лейбористской партии относятся к своему лидеру (из 100):\n#bold Лейбористская левая партия#! ([EmptyScope.ScriptValue('wm_ui_wing_size_1')|0] депутатов): одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold мягкой левой#! ([EmptyScope.ScriptValue('wm_ui_wing_size_2')|0] депутатов): одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold Лейбористских центристов#! ([EmptyScope.ScriptValue('wm_ui_wing_size_3')|0] депутатов): одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\nКорансирование крыла стоит #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! профиль: оно получает 15 одобрений, остальные Потерять 4. Крыло без места в вашем кабинете (или теневом кабинете) теряет одобрение каждый месяц; один младше 30 лет ворчит и бунтует в Палате общин, а один младший до 15 лет на три месяца бросает вызов лидерству."
 wm_wing_court_decision_desc_conservative: "Как консервативные крылья относятся к своему лидеру (из 100):\n#bold One Nation#! ([EmptyScope.ScriptValue('wm_ui_wing_size_4')|0] депутатов): одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold сторонников свободного рынка#! ([EmptyScope.ScriptValue('wm_ui_wing_size_5')|0] депутатов): одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold Традиционалистов#! ([EmptyScope.ScriptValue('wm_ui_wing_size_6')|0] депутатов): одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\nКардинг крыла стоит #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! профиль: оно получает 15 одобрений, остальные теряют 4. Крыло без места в вашем кабинете (или теневом кабинете) теряет одобрение каждый месяц; один младше 30 лет ворчит и бунтует в Палате общин, а один младший до 15 лет на три месяца бросает вызов лидерству."
 wm_wing_court_decision_tooltip: "Держать крылья партии на своей стороне."
 wm_wing_court_decision_confirm: "Выберите крыло"
 wm_wing_court_decision_effect_tt: "Выбери крыло: его одобрение тебя растёт #P 15#!, падает на каждое второе крыло на #N 4#!."
 wm_wing.1.t: "Сохранять партию вместе"
 wm_wing.1.desc: "Основная речь, политический знак, обещание будущих продвижений. Какому крылу партии нужно внимание?"
 wm_wing.1.w1: "Связаться с левой частью Лейбористской партии (одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0])."
 wm_wing.1.w2: "Связаться с мягкой левой (одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])."
 wm_wing.1.w3: "Связаться с трудовыми центристами (одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0])."
 wm_wing.1.w4: "Связаться с объединённой нацией (одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0])."
 wm_wing.1.w5: "Связаться с сторонниками свободного рынка (одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0])."
 wm_wing.1.w6: "Связаться с традиционалистами (одобрение [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0])."
 wm_wing.10.t: "Проблема лидерства"
 wm_wing.10.desc: "Письма пришли. Крыло парламентской партии потеряло терпение и [wm_wing_challenger.GetName] бросило вызов тебе за лидерство. Газеты считают имена, вещатели готовы графику, а твой телефон не переставает звонить. \n\nYможешь дать повстанцам то, что они хотят, или сразиться с ними."
 wm_wing.10.a: "Дать им то, что они хотят."
 wm_wing.10.a.tt: "Вы теряете #N 300#! профиля; одобрение мятежного крыла растет на #P 30#!, а одобрение других крыльев падает на #N 4#!."
 wm_wing.10.b: "Face them down."
 wm_wing.10.b.tt: "Харизма #bold контеста #! против [wm_wing_challenger.GetName]. Победа — и восстание гаснет; поражение — и они захватывают руководство (и Даунинг-стрит, если вы премьер-министр)."
 wm_wing_challenge_toast: "ВЫЗОВ ЛИДЕРСТВА"
 wm_wing_challenge_toast_desc_1: "Левые Лейбористы выступили против [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] бросает вызов руководству [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_2: "Мягкая левая партия выступила против [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] оспаривает лидерство в [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_3: "Центристы Лейбористов выступили против [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] бросает вызов руководству [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_4: "Партия Одной Нации выступила против [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] оспаривает лидерство в [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_5: "Сторонники свободного рынка выступили против [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] бросает вызов лидерству [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_6: "Традиционалисты выступили против [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] оспаривает лидерство в [wm_wing_party.GetNameNoTier]."
