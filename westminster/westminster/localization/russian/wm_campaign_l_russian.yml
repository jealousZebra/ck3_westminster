l_russian:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "На предвыборной кампании: Неделя [EmptyScope.ScriptValue('wm_campaign_week_value')|0]"
 wm_campaign.1.desc: "парламент распущен, а боевой автобус стоит на холостом ходу снаружи. На этой неделе в сетке есть слот, на моём телефоне 140 непрочитанных сообщений, и кто-то без спроса надел на меня розетку."
 wm_campaign.1.desc_leader: "\n\nВ качестве лидера [wm_campaign_party.GetNameNoTier], каждое мое действие становится национальной новостью. Телевизионные компании хотят устроить личное противостояние с [wm_campaign_rival.GetName], и у политического отдела готов к запуску план. Дома мой агент в [wm_campaign_seat.GetNameNoTier] хотел бы увидеть меня хотя бы один раз до дня голосования."
 wm_campaign.1.desc_leader_no_rival: "\n\nВ качестве лидера [wm_campaign_party.GetNameNoTier], каждое мое действие становится национальной новостью, и у политического отдела готов к запуску план."
 wm_campaign.1.desc_mp: "\n\n Национальная кампания не знает, кто я, что облегчает. Главным является [wm_campaign_seat.GetNameNoTier]: листовки, обход по домам и то, напечатает ли местная газета мою фотографию правильно."
 wm_campaign.1.a: "Провести большой митинг."
 wm_campaign.1.b: "Обсудите [wm_campaign_rival.GetFirstName] в телевизионных дебатах."
 wm_campaign.1.c: "Примите участие в теледебатах и похороните [wm_campaign_rival.GetFirstName] в статистике."
 wm_campaign.1.d: "Запустить ключевую политику"
 wm_campaign.1.e: "Стучать в двери в [wm_campaign_seat.GetNameNoTier]."
 wm_campaign.1.f: "Спокойная неделя в штабе кампании, утверждение листовок."

 wm_campaign_rally_success: "Rally: восторженный приём"
 wm_campaign_rally_flat: "Митинг: вежливые аплодисменты"
 wm_campaign_rally_flop: "Ралли: Полупустой зал"
 wm_campaign_debate_won: "дебаты: мгновенные опросы говорят за вас"
 wm_campaign_debate_lost: "Дебаты: Запутались под огнями"
 wm_campaign_debate_wonk_won: "Дебаты: Смерть от таблицы (их)"
 wm_campaign_debate_wonk_lost: "дебаты: потеряли аудиторию на «Fiscal Headroom»"
 wm_campaign_policy_success: "Запуск Политики: Это проходит насквозь"
 wm_campaign_policy_flop: "Запуск Политики: Расходы раскрываются на утреннем радио"
 wm_campaign_door_knock: "Обход дверей: завоеванные пороги"

 wm_campaign.2.t: "Оплошность!"
 wm_campaign.2.desc: "У моего пресс-офицера лицо человека, который только что увидел завтрашние первые полосы газет."
 wm_campaign_gaffe_1: "Фотограф поймал меня за едой сэндвича с беконом в кафе, и результат в интернете описывают как \" ситуацию с заложниками с завтраком\". Это уже мем, кружка и рингтон."
 wm_campaign_gaffe_2: "Я забыл, что мой микрофон все еще был включен после визита на фабрику, и теперь вся страна услышала, как я назвал избирателя \"чрезмерно, честно говоря\". С полудня она дала четыре интервью."
 wm_campaign_gaffe_3: "На прямом радио, когда меня спросили, сколько стоит пинта молока, я сказал \"около одиннадцати фунтов?\" с настоящей уверенностью. Ведущий позволил тишине длиться девять секунд."
 wm_campaign_gaffe_4: "На фотосессии я уверенно прошёл через неправильную дверь, в шкаф, а камеры ждали, пока я выйду обратно. Я вышел, в конце концов, держа швабру."
 wm_campaign_gaffe_5: "меня снимали, как я держу одну из наших листовок вверх ногами во время целой речи под баннером с ошибкой в названии избирательного округа. Имя нашего собственного кандидата тоже."
 wm_campaign.2.a: "Посмейтесь над этим. У всех бывают дни с плохим сэндвичем."
 wm_campaign.2.b: "Обвинить младшего сотрудника."
 wm_campaign.2.c: "Поддерживай это: сделай это снова, намеренно, перед камерами."
 wm_campaign_gaffe_shrugged: "Оплошность: Общественность находит это довольно милым"
 wm_campaign_gaffe_stuck: "Оплошность: Идёт в каждом бюллетене"
 wm_campaign_gaffe_viral: "Оплошность: Самоирония становится вирусной (в хорошем смысле)"
 wm_campaign_gaffe_doubled: "Оплошность: \"Удвоение усилий\" не было решением"

 wm_campaign_doorstep_county_modifier: "Встретились с их депутатом на пороге"
 wm_campaign_doorstep_county_modifier_desc: "Их депутат во время кампании стучал здесь по домам и не забывал вытереть ноги."
 wm_campaign_viral_gaffe_modifier: "Вирусная оплошность"
 wm_campaign_viral_gaffe_modifier_desc: "Ошибка в кампании, которую интернет не оставит без внимания."

 wm_campaign_debate_humiliated_opinion: "Победил меня в телевизионных дебатах"
