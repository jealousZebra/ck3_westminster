l_russian:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "Прочитать брифинг по деволюции"
 wm_devolution_briefing_decision_desc: "Еженедельная заметка Кабинета министров о положении страны:\n\n#bold Шотландия:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% за независимость; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold Уэльс:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% за независимость; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold Северная Ирландия:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% поддерживают объединённую Ирландию; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10; [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] разделения власти стабильности 100\n\n#bold Общественное доверие к политике: #! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] из 100."
 wm_devolution_briefing_decision_tooltip: "Где стоит Союз и насколько общество доверяет своим политикам."
 wm_devolution_briefing_decision_confirm: "Прочитать это"
 wm_devolution.30.t: "Состояние союза"
 wm_devolution.30.desc: "#italic Кабинет министров, для распространения#!\n\n#bold Шотландия:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% поддерживают независимость; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0]  из 10\n#bold Уэльс:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% поддерживают независимость; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] из 10\n#bold Северная Ирландия:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% поддерживают объединённую Ирландию; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] из 10; стабильность разделения власти [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] из 100\n\n Поддержка выхода изменяется вместе с доверием общества к Вестминстеру, с возвратом или передачей полномочий и с тем, кто управляет каждым децентрализованным правительством. Как только показатель превышает половину, правительство во главе с националистами может официально запросить проведение референдума.\n\n#bold Доверие общества к политике:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] из 100; ожидаемая явка на всеобщих выборах [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%."
 wm_devolution.30.suspended: "\n\n#N Ассамблея Северной Ирландии приостановлена:#! разделение власти разрушено, и только переговоры (или время) могут восстановить её."
 wm_devolution.30.sitting: "\n\nСобрание Северной Ирландии заседает, и разделение власти сохраняется."
 wm_devolution.30.a: "Принято к сведению."
 wm_devolution_devolve_decision: "Передать власть"
 wm_devolution_devolve_decision_desc: "Дайте другую власть Эдинбургу, Кардиффу или Белфасту. Больше полномочий снимает напряжение по делу о выходе и радует децентрализованное правительство.\n\n#bold Шотландия:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% за независимость; полномочий [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] из 10\n#bold Уэльс:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% за независимость; полномочий [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] из 10\n#bold Северная Ирландия:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% за объединённую Ирландию; полномочий [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] из 10; стабильность распределения власти [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] из 100"
 wm_devolution_devolve_decision_tooltip: "Предоставить более широкие полномочия децентрализованному правительству."
 wm_devolution_devolve_decision_confirm: "Выберите нацию"
 wm_devolution_devolve_decision_effect_tt: "Выберите нацию: её полномочия растут на 1, поддержка выхода падает на #P 3#! пункта (и снижается ниже), её первый министр доволен, а общественное доверие растёт на 1."
 wm_devolution_claw_back_decision: "Отобрать власть"
 wm_devolution_claw_back_decision_desc: "Вернуть власть в Вестминстер. Юнионистские газеты будут радоваться; децентрализованное правительство и его избиратели — нет. \n\n#bold Шотландия: #! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% поддерживают независимость; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold Уэльс: #! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% — независимость; полномочия [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold Северная Ирландия:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% поддерживают объединённую Ирландию; [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10; [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] разделения власти стабильности 100"
 wm_devolution_claw_back_decision_tooltip: "Вернуть делегированные полномочия в Вестминстер."
 wm_devolution_claw_back_decision_confirm: "Выберите нацию"
 wm_devolution_claw_back_decision_effect_tt: "Выберите нацию: её полномочия падают на 1, поддержка выхода #N 3#! (и становится выше), её первый министр в ярости, общественное доверие падает на 2, и вы получаете небольшой профиль."
 wm_devolution_stormont_talks_decision: "Созыв переговоров в Стормонте"
 wm_devolution_stormont_talks_decision_desc: "Разделение власти в Северной Ирландии рухнуло. Садите стороны за стол для интенсивных переговоров: сделка восстанавливает Ассамблею. Ваши шансы повышаются вместе с вашей харизмой и с устойчивостью разделения власти (сейчас [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] из 100)."
 wm_devolution_stormont_talks_decision_tooltip: "Попробуйте восстановить распределение власти в Стормонте."
 wm_devolution_stormont_talks_decision_confirm: "Созыв переговоров"
 wm_devolution_stormont_talks_decision_effect_tt: "Успех восстанавливает Ассамблею, повышает доверие общества на 2 и приносит вам профиль. Неудача всё равно сближает партии (+5 стабильности)."
 wm_devolution.1.t: "Запрос на референдум"
 wm_devolution.1.desc: "[wm_dev_gov.GetNameNoTier] официально попросила Уэстминстер дать ей право провести референдум о выходе из Соединённого Королевства. По собственным опросам, поддержка составляет [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%, и она утверждает, что мандат ясен.\n\nСторонники союза хотят прямого отказа. Ваши советники менее уверены."
 wm_devolution.1.a: "Согласиться на референдум."
 wm_devolution.1.a.tt: "День голосования через шесть месяцев. Результат будет зависеть от поддержки тогда, плюс-минус несколько пунктов. «Да» стало бы для вас катастрофой."
 wm_devolution.1.b: "Сейчас не время."
 wm_devolution.1.b.tt: "Поддержка ухода выросла на #N 4 пункта #!, и Первый министр ненавидит тебя. Они могут спросить снова через три года."
 wm_devolution.1.c: "Предложить больше сил вместо этого."
 wm_devolution.1.c.tt: "Нация получает силу, а поддержка падает на #P 3#! балла, с небольшой потерей профиля. Они могут снова попросить через три года."
 wm_devolution.20.t: "Передача полномочий"
 wm_devolution.20.desc: "Какое децентрализованное правительство получает новые полномочия?"
 wm_devolution.20.scotland: "Передать власть Шотландии (власть [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10)."
 wm_devolution.20.wales: "Передать власть Уэльсу (власть [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10)."
 wm_devolution.20.northern_ireland: "Передать власть Северной Ирландии (власть [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10)."
 wm_devolution.20.none: "По вторым мыслям, не сейчас."
 wm_devolution.21.t: "Возвращение контроля"
 wm_devolution.21.desc: "Какое децентрализованное правительство теряет полномочие в пользу Вестминстера?"
 wm_devolution.21.scotland: "Отобрать у Шотландии (власти [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10)."
 wm_devolution.21.wales: "Отобрать у Уэльса (власти [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10)."
 wm_devolution.21.northern_ireland: "Отобрать у Северной Ирландии (власти [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10)."
 wm_devolution.21.none: "По вторым мыслям, не сейчас."
 wm_dev_referendum_agreed_toast: "РЕФЕРЕНДУМ ПРИНЯТ"
 wm_dev_referendum_agreed_toast_desc: "Вестминстер согласился с просьбой [wm_dev_gov.GetNameNoTier]: референдум о выходе из Соединённого Королевства состоится через шесть месяцев."
 wm_dev_referendum_refused_toast: "РЕФЕРЕНДУМ ОТКЛОНЁН"
 wm_dev_referendum_refused_toast_desc: "Вестминстер отклонил просьбу [wm_dev_gov.GetNameNoTier] о референдуме. Поддержка выхода растёт."
 wm_dev_referendum_powers_toast: "БОЛЬШЕ ПОЛНОМОЧИЙ ВМЕСТО ЭТОГО"
 wm_dev_referendum_powers_toast_desc: "Вестминстер ответил на просьбу [wm_dev_gov.GetNameNoTier] о референдуме предложением новых полномочий."
 wm_dev_stormont_collapse_toast: "STORMONT COLLAPSES"
 wm_dev_stormont_collapse_toast_desc: "Разделение власти в Северной Ирландии рухнуло, и Ассамблея приостановлена. Доверие публики пострадало."
 wm_dev_stormont_restored_toast: "STORMONT RESTORED"
 wm_dev_stormont_restored_toast_desc: "Соглашение заключено, и разделение власти возвращается в Северную Ирландию."
 wm_dev_stormont_talks_failed_toast: "STORMONT TALKS FAIL"
 wm_dev_stormont_talks_failed_toast_desc: "Переговоры закончились без соглашения, хотя стороны приблизились друг к другу."
 wm_dev_referendum_yes_toast_scotland: "SCOTLAND VOTES YES"
 wm_dev_referendum_yes_toast_scotland_desc: "Шотландия проголосовала за шотландскую независимость, с результатом [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Начинаются переговоры о выходе из Соединенного Королевства, и авторитет Премьер-министра подорван."
 wm_dev_referendum_no_toast_scotland: "SCOTLAND VOTES NO"
 wm_dev_referendum_no_toast_scotland_desc: "Шотландия отвергла шотландскую независимость: только [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% проголосовали за. Вопрос решен на поколение, или, по крайней мере, так надеется Вестминстер."
 wm_dev_referendum_yes_toast_wales: "УЭЛЬС ГОЛОСУЕТ ДА"
 wm_dev_referendum_yes_toast_wales_desc: "Уэльс проголосовал за независимость Уэльса, с результатом [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Начинаются переговоры о выходе из Соединенного Королевства, и авторитет Премьер-министра разрушен."
 wm_dev_referendum_no_toast_wales: "УЭЛЬС ГОЛОСУЕТ НЕТ"
 wm_dev_referendum_no_toast_wales_desc: "Уэльс отверг независимость Уэльса: только [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% проголосовали за. Вопрос решен на одно поколение, или, по крайней мере, так надеется Вестминстер."
 wm_dev_referendum_yes_toast_northern_ireland: "СЕВЕРНАЯ ИРЛАНДИЯ ГОЛОСУЕТ «ЗА»"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "Северная Ирландия проголосовала за объединённую Ирландию с перевесом в [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Начинаются переговоры о выходе из Великобритании, и полномочия премьер-министра разрушаются."
 wm_dev_referendum_no_toast_northern_ireland: "СЕВЕРНАЯ ИРЛАНДИЯ ГОЛОСУЕТ «НЕТ»"
 wm_dev_referendum_no_toast_northern_ireland_desc: "Северная Ирландия отвергла объединённую Ирландию: только [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% проголосовали «За». Вопрос решён на целое поколение, или, по крайней мере, так надеется Вестминстер."
 wm_dev_assembly_suspended_modifier: "Заседание приостановлено"
 wm_dev_assembly_suspended_modifier_desc: "Разделение власти рухнуло, и Ассамблея Северной Ирландии приостановлена."
