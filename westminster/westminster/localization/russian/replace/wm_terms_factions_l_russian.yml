 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Наконец! [faction_target.GetName] это не что иное, как шут, играющий роль [faction_target.GetTitleAsNameNoTooltip], и я уверен, что партия поддержит мое дело. Те, кто помогут мне, не будут забыты."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] занимает трон, который по праву должен быть вашим! Я готов поддержать ваше право словом и мечом, и я уверен, что другие в партии также поддержат это справедливое дело. Всё, что вам нужно — принять это."
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "Наконец! [faction_target.GetName] это не что иное, как шут, играющий роль [faction_target.GetTitleAsNameNoTooltip], и я уверен, что партия поддержит мое дело. Те, кто помогут мне, не будут забыты."
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] занимает трон, который по праву должен быть вашим! Я готов поддержать ваше право словом и мечом, и я уверен, что другие в партии также поддержат это справедливое дело. Всё, что вам нужно — принять это."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "Наконец-то! [faction_target.GetName] — не более чем шут, играющий роль [faction_target.GetTitleAsNameNoTooltip], и я уверен, что партия поднимется на мою сторону.\n\nИз-за моего нынешнего низкого статуса я не могу вам помочь. Но знайте одно — #emphasis когда#! вы одержите победу, я посмотрю, чтобы вы были щедро вознаграждены!"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "Хотя я рад видеть, как партия восстает против ложного [faction_target.GetTitledFirstName], мое текущее положение мешает мне присоединиться к вам в этом праведном деле. Если вы преуспеете, я буду вам обязан."
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Мне ясно, что вы бы предпочли видеть партию в огне, чем отказаться от этой глупой затеи. Ради блага партии я должен принять ваши требования, но знайте, что сегодня здесь был совершен великое несправедливость. Это не останется без последствий!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "Мне ясно, что вы хотите увидеть сжигание партии, прежде чем отказаться от этого глупого предприятия. Ради блага [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] я должен принять ваши требования, но знайте, что сегодня здесь была совершена великая несправедливость. Так не будет!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nВаши ошибочные требования только ослабят нас всех. Тем не менее, чтобы избавить партию от бессмысленного кровопролития, я вынужден принять вашу просьбу о независимости."
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Мне ясно, что вы хотите увидеть сжигание партии, прежде чем отказаться от этой глупой попытки. Ради блага [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] я должен принять ваши требования, но знайте, что сегодня здесь была совершена великая несправедливость. Так не будет!"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nВерные подданные партии слишком долго терпели ваши ошибочные политики. [faction.GetName] требует, чтобы вы согласились на новое направление для [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], или мы принудим вас к этому!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "Момент настал! Все, кто поддерживает отказ от заблуждающихся политик [faction_target.GetTitledFirstNamePossessive], теперь поднимутся вместе и обеспечат, чтобы партия была направлена в новом направлении. Мы увидим это сделанным, мечом и огнем, если потребуется!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nВаши ошибочные требования только ослабят нас всех. Тем не менее, чтобы избавить партию от бессмысленного кровопролития, я вынужден принять вашу просьбу о независимости."
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nВаши эгоистичные представления о 'свободе' ослабят Партию в целом. Однако, чтобы избежать ненужного кровопролития, я приму ваши требования."
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n Пришло время вам признать древние и неотъемлемые права ваших задних скамеек! Примите требования [faction.GetName] или столкнитесь с нашими мечами на поле боя!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Отлично! В моей партии нет места для ваших немытых стад."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Мы больше не будем терпеть ваше мерзкое угнетение гордых [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Рождённые, чтобы свободно бродить под этим открытым небом, мы отвергаем вашу тиранию — наше время близко! \n\nWвы раз и навсегда отвергнете своё правление и правление вашего партийного лидера [faction_target.GetTitledFirstName]!!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "Мы не допустим дальнейшего угнетения со стороны вашего [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] правления. [peasant_leader.GetRite.GetName|U] должны быть признаны высшим [rite|E] [ROOT.Char.GetPrimaryTitle.GetName]! \n\nДаберите нашей идеологии заслуженный статус, или готовьтесь встретить гнев наших многочисленных верных!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "Мы больше не будем терпеть ваше мерзкое угнетение добрых [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Наше время уже близко! \n\nВы освободимся от вашего правления и тирании вашего партийного лидера, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "Мы больше не будем терпеть иностранное угнетение [peasant_leader.GetCulture.GetName] традиций. Наше время уже близко! \n\nWвы потребуют от вашего партийного лидера не меньше, чем полной свободы, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "Мы больше не будем терпеть ваше мерзкое угнетение верных [peasant_leader.GetFaith.GetAdherentNamePlural]. Наше время уже близко! \n\nЗВа, [peasant_leader.GetFaith.WarGodName] направляя нас, мы восстанем и освободимся от правления вашего партийного лидера, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N Вы потеряете часть своей партии, если лидер вашей партии уступит их требованиям! #!"
