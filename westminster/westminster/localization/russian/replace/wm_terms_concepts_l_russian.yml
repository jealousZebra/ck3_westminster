l_russian:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "Бенефиции были местными или удалёнными имениями, должностями или разделяемыми папскими доходами, которые члену партии могло быть предоставлено #i в комендаме#! (на доверии). Они приносили доход, обычно без прямых административных обязанностей."
 additional_mandala_government_piety_levels: "[mandala|E] [government|E] может разблокировать дополнительные уровни Политического Капитала после [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] до [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L] включительно. Чтобы достичь такой степени божественности, их Лояльность должна быть доказана на протяжении поколений."
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ — это высший уровень [crown_authority|E]. [vassals|E] имеют штраф #N -30#! [opinion|E] к их [liege|E].\n\nНа этом уровне — кроме эффектов [high|E] и [limited|E] Королевской Власти — правитель может выбрать [designated_heir|E] за [prestige|E] стоимость.\n\nКроме того, рядовые члены не могут объявлять войну даже иностранным правителям."
 game_concept_acclaimed_knight: "Star Organiser"
 game_concept_acclaimed_knight_desc: "[knight|E] проводит [accolade|E].\n\nЧтобы быть Звёздным Организатором, Организатор должен быть [unlanded|E] или [baron|E], с как минимум [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] или более [prowess|E]. Звёздный Организатор должен быть пригоден для как минимум одного [accolade_type|E], который ещё не принадлежит другому Звёздному Организатору его [liege|e].\n\nЗвёздные Организаторы менее подвержены смерти или плену в бою. Они могут улучшать свои [glory|E] в основном, сражаясь с [wars|E] и посещая [activities|E], такие как [GetActivityType( 'activity_tournament' ).GetName].\n\nПризнанные организаторы могут иногда получать [skills|E] и [traits|E], связанные с Атрибутами их Почёта."
 game_concept_acclaimed_knight_possessive: "Star Organiser's"
 game_concept_acclaimed_knights: "Star Organisers"
 game_concept_accolade_desc: "Ордена — это почести, присуждаемые [knights|E] их [liege|E].\n\nОрганизатор, который держит Орден, становится [acclaimed_knight|E].\n\nПо мере того как Главный Организатор получает [glory|E], его [accolade_squires|E] Способность увеличивается (улучшая [accolade_succession|E]) и может быть получен [accolade_ranks|E]. Это позволяет разблокировать больше [accolade_types|E], предлагая более сильные бонусы.\n\nКогда Главный Организатор умирает, происходит [accolade_succession|E], и организатор немедленно заменяется наследником, чьи навыки модифицированы Способностью [accolade_squires|E].\n\n[innovations|e] и более высокие [title_tiers|e] позволяют [rulers|E] иметь больше Орденов одновременно."
 game_concept_accolade_squires_desc: "Каждый [accolade|E] имеет метрику способностей оруженосцев, которая модифицирует [traits|E] и [skills|E] (в основном, [prowess_skill|E], [martial_skill|E] и [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]) их следующего [acclaimed_knight|E].\n\nСуществует 5 уровней способностей у оруженосцев:\n$EFFECT_LIST_BULLET$Опытный\n$EFFECT_LIST_BULLET$Способный\n$EFFECT_LIST_BULLET$Неопытный\n$EFFECT_LIST_BULLET$Безрассудный\n$EFFECT_LIST_BULLET$Плачевный\n\nСпособность Неопытный или выше приведет к тому, что Звездный Организатор время от времени будет влиять на [traits|E] и [skills|E] молодых воинов-мужчин [courtiers|E], предоставляя им приоритет для получения Звания при [accolade_succession|E]\n\nОруженосцы в основном развиваются за счет [glory|E], но также:\n$EFFECT_LIST_BULLET$ZZ Организатор [prowess_skill|E]\n$EFFECT_LIST_BULLET$ZZ Организатор [martial_skill|E]'\n$EFFECT_LIST_BULLET$Организатор, получая [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$Организатор, получая [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$[martial_skill|E] Звания [liege|E]\n$EFFECT_LIST_BULLET$[prowess_skill|E] Звания [liege|E]\n\nКаждый [accolade_succession|E] сбрасывает оруженосцев Звания."
 game_concept_accolade_succession_desc: "Наследование Ордена происходит, когда [accolade_possessive|E] [acclaimed_knight|e] умирает или становится недействительным.\n\nБывший Главный Организатор немедленно заменяется. Молодые [courtiers|E] и [knights|E], обученные благодаря [accolade_squires|E] Способности Ордена, сначала получают предпочтение в качестве Наследников; затем другие организаторы, другой персонал, странники и, наконец, вновь созданные [characters|E]. В зависимости от Способности [accolade_squires|E] Ордена, новый Организатор получит увеличенные [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E] и, возможно, другие [skills|E].\n\nПосле Наследования Ордена может быть потеряно небольшое количество [glory|E], а Способность Подмастерьев Ордена сбрасывается, чтобы теперь отражать навыки и опыт нового Главного Организатора\n\nСмерть Главного Организатора в битве, дуэли или другим почетным способом аннулирует потерю Славы и улучшает Подмастерьев Ордена."
 game_concept_accolade_type_desc: "An [accolade|E] имеет до #value 3#! Атрибутов, которые обеспечивают масштабируемые бонусы по мере открытия их более высоких уровней. Каждый Атрибут имеет #value 3#! Уровня. Когда Звание увеличивает свой [accolade_rank|E], его владелец может либо повысить уровень существующего Атрибута, либо добавить новый Атрибут в Звание. [acclaimed_knight|E], однако, должен соответствовать требованиям любого нового Атрибута.\n\nКаждый [knight|E] подходит только для определенных Атрибутов, которые могут основываться на [traits|E], [skills|E] или открываться на основе опыта при службе Организатором.\n\nКаждое Звание должно иметь уникальные Атрибуты: у Лидера группы #high не может#! быть дубликатов Атрибутов между Званиями. Каждое Звание также может специализироваться только на #value 1#! [men_at_arms|E]-тип Атрибута."
 game_concept_ai_economical_boom_personality_desc: "A $game_concept_ai_economical_boom_personality$ хочет инвестировать все свои [gold|E] в [realm|E]. Они опустошают свою казну, чтобы финансировать [buildings|E] и [men_at_arms|E], и часто строят больше [economic_buildings|E] и [holdings|E]. Они сохраняют средства только в случае прямой угрозы, например, со стороны сильного [faction|E].\n\n$game_concept_ai_economical_boom_personality$ правители чуть менее склонны создавать и продвигать [legends|E].\n\n Смелые правители с наклонностью к строительству и без особого интереса к [war|E], как правило, являются $game_concept_ai_economical_boom_personality$s.\n Общие черты включают [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )] и [GetTrait('profligate').GetName( GetNullCharacter )]. Правители с [GetFocus('stewardship_domain_focus').GetName] также, как правило, являются $game_concept_ai_economical_boom_personality$s."
 game_concept_ai_pious_builder_personality_desc: "A $game_concept_ai_pious_builder_personality$ хочет инвестировать все свои [gold|E] в увеличение их [piety|E].\n\n Они потратят свою казну на финансирование религиозных и церемониальных [buildings|E], [great_projects|E], [activities|E] и [decisions|E] и часто строят больше [pious_buildings|E] и [temple|E] или [temple_citadel|E] [holdings|E]. Они сохраняют средства только в случае прямой угрозы, например, со стороны сильного [faction|E].\n\n$game_concept_ai_pious_builder_personality$ более склонны создавать и продвигать священные [legends|E].\n\n Ревностные [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] с наклонностью к [virtue|E] и без особого интереса к [war|E], как правило, являются $game_concept_ai_pious_builder_personality$s.\n Общие черты включают [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )] и [GetTrait('generous').GetName( GetNullCharacter )]. Правители с [GetFocus('learning_theology_focus').GetName] также, как правило, являются $game_concept_ai_pious_builder_personality$s."
 game_concept_ai_warlike_personality_desc: "$game_concept_ai_warlike_personality$ [ruler|E] хочет быть готовым объявить [war|E] в любое время. Они будут сохранять [gold|E] для [war|E], прежде чем инвестировать их в развитие своих [realm|E]. Если Правитель $game_concept_ai_warlike_personality$ находится в мире длительное время, они используют фонды из своего военного запаса для строительства [buildings|E].\n\n$game_concept_ai_warlike_personality$ правители с большей вероятностью создают и продвигают героические [legends|E].\n\nСмелые и жадные Правители склонны к воинственности.\nОбычные Черты включают [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )] и [GetTrait('zealous').GetName( GetNullCharacter )]."
 game_concept_alliance_desc: "$game_concept_alliance$ – это дипломатические отношения между двумя [rulers|E]. [independent|E] Правители могут призывать $game_concept_allies$ присоединяться к [wars|E] друг друга.\n\n Союзы создаются и поддерживаются через [marriage|E] или [betrothal|E], пока два персонажа, которые женаты, достаточно близко связаны с двумя Правителями. Например, если [king|E] выдаёт свою дочь замуж за сына другого Короля, оба Короля становятся $game_concept_allies$.\n\n[lieges|E] также могут создавать $game_concept_alliances$ со своими [vassals|E]. Лидер партии не может призывать Рядового к войне, но это мешает им присоединяться к [factions|E]."
 game_concept_anointment_request_desc: "Запрос на помазание [character_interaction|E] — это специальное взаимодействие, которое может использовать [ruler|E] [empire|E] [title_tier|E] или выше на своем [head_of_faith|E], или партийные должностные лица [head_of_rite|E], если их нет, чтобы заручиться поддержкой в [anointment|E]."
 game_concept_archdiocese_desc: "Архиепархия — это [christian|E] форма [clerical_region|E], церковного округа, которым управляет [archbishop|E] через свой [clerical_title|E] и расположенного в столице [county|E], где может быть возведен [grand_cathedral|E].\n\nA [christian|E] [ruler|E] отвечает за духовные вопросы перед [archbishop|E] архиепархии, которая содержит их [capital|E] [county|E], а территория подчиненная архиепархиям вместе составляет [the_christian_church|E] [situation|E]."
 game_concept_aspect_of_serenity_desc: "Мирная партия — это процветающая партия — Аспект Спокойствия ценит умиротворение и дипломатические отношения, предоставляя бонусы тем, кто поддерживает её дело. \n$EFFECT_LIST_BULLET$ сосредотачивается на [diplomacy|E]\n$EFFECT_LIST_BULLET$ Избегание оскорблений [wars|E] осуществляется через приоритет [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] и [GetScheme('befriend').GetTypeName] [schemes|E] более успешны \n$EFFECT_LIST_BULLET$ Также может #high $request_great_project_contribution_interaction$s#! из [allies|E]\n$EFFECT_LIST_BULLET$ Может погибнуть только от [death_natural_cause|E] или [death_religious|E] [character_death_deaths|E]"
 game_concept_at_peace_opinion_desc: "Персонажи, у которых [GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E] входит в [faith|E], получат штраф «$game_concept_at_peace_opinion$» вместо [offensive_war_opinion|E]. \n\nПаесли вы слишком долго будете спокойны, ваши [vassals|E] будут думать о вас хуже #weak (если они разделяют вашу идеологию). #!"
 game_concept_autonomous_vassals: "Автономные рядовые члены"
 game_concept_autonomous_vassals_crown_authority: "Автономные рядовые члены Королевская власть"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' — это наинизший уровень [crown_authority|E]. На этом уровне [vassals|E] не имеют штрафа [opinion|E] к своим [liege|E], и лидер партии имеет над ними только базовую власть."
 game_concept_available_spouse_desc: "Чтобы служить в [council|E] правителя, [spouse|E] должен быть доступен для выполнения обязанностей этой роли.\n\nРазличные обстоятельства могут помешать $game_concept_spouse$ выполнять эти обязанности, но наиболее распространенные из них включают:\n$BULLET_WITH_TAB$Быть [ruler|E] собственного [realm|E]\n$BULLET_WITH_TAB$Проживание в другом [court|E] правителя\n$BULLET_WITH_TAB$Быть [imprisoned|E], дома или за границей\n$BULLET_WITH_TAB$Иметь [GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]\n\nЕсли недоступный супруг снова станет доступным, они автоматически возобновят свои обязанности в Кабинете.\n\nСупруги, которые сами являются правителями, все еще могут служить в Кабинете, если они ваш [direct_vassals|E], в противном случае никогда не будут считаться доступными."
 game_concept_baronies: "Уорды"
 game_concept_barony: "Уорд"
 game_concept_beneficiary_desc: "Every participant in a [great_holy_war|E] can select a $game_concept_beneficiary$ from their [dynasty|E]. Upon victory, the $game_concept_beneficiary$ will receive lands in the targeted party proportional to the [war_contribution|E] of their patron ruler.\n\nThe largest contributor can force their Beneficiary to receive the main title being fought over."
 game_concept_buy_claim_desc: "Взаимодействие, которое позволяет персонажу купить [unpressed_claims|E] в обмен на [piety|E].\n\n$EFFECT_LIST_BULLET$A [vassal|E] не может покупать притязания на [liege|E] [title|E] любого персонажа, а Лидер партии не может покупать притязания на титулы любых рядовых членов \n$EFFECT_LIST_BULLET$A [king|E] или [emperor|E] не могут покупать притязания на национальные титулы, а Императоры не могут покупать притязания на другие Империи\n$EFFECT_LIST_BULLET$Никто не может покупать притязания на свой [head_of_faith|E]"
 game_concept_canonized_desc: "[character|E], который после смерти был признан святым или эквивалентом в иной идеологии, такой как Вали или почитаемый предок, приобретает [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\nДобродетельная жизнь может закончиться $game_concept_canonization$: для этого подаётся прошение через [decision|E], может потребоваться благословение [head_of_faith|E] и скрепляется освящением места захоронения святого. Их место упокоения впоследствии привлекает благочестивых путников, а их останки могут приносить [holy_relics|E]."
 game_concept_capital_duchy: "Столичный регион"
 game_concept_capital_duchy_desc: "Модификатор $game_concept_capital_duchy$ увеличивает количество [levies|E], которое вы получаете от всех [holdings|E], находящихся внутри того же [de_jure|E] [duchy|E], что и ваш [capital|E]. Он также дает бонус ко всем [stationed|E] [men_at_arms|E]. Чтобы этот модификатор был активен, вам нужно лично владеть связанной Region.\n\n Этот модификатор не суммируется с бонусом Home Base."
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$ стремится назначить конкретного [claimant|E] на должность [ceremonial_liege|E]. Если успешно, действующему церемониальному лидеру партии придется уступить [title|E] претенденту. Все члены [faction|E] получат [hook|E] на претендента."
 game_concept_ceremonial_liege_desc: "В некоторых [realms|E] (таких как Япония) могущественный бюрократ или командир мог захватить реальную власть в качестве [ceremonial_regent|E], оставив номинально правящего $game_concept_ceremonial_liege$ лишь фигурой и [vassal|E] на практике. Все члены $game_concept_ceremonial_liege_possessive$ [house|E] считаются частью [ceremonial_house|E]. \n\n Несмотря на то, что он не правит напрямую, $game_concept_ceremonial_house$ — самая почитаемая родословная в партии, и другие [houses|E] получат больше [prestige|E] за браки с ними, при этом такие связи сильно влияют на наследование $game_concept_ceremonial_regent$. \n\n $game_concept_ceremonial_liege$ может вернуть истинную власть, если каким-то образом вновь получит [primary_title|E] партии, например по требованию [faction|E] или участвуя в борьбе за $game_concept_ceremonial_regent$ [title|E] с помощью [influence|E]."
 game_concept_challenger_hof: "Лидер движения Challenger"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$ — это соперничающий [head_of_faith|E], поднятый против [mainline_rite|E] $game_concept_head_of_faith$.\n\nA [ruler|E] может спонсировать члена своей [clergy|E] в качестве $game_concept_challenger_hof$. [clergy|E] [ruler|E] или правитель из [faith|E] с лидером Временного Движения может объявить себя Претендентом. \n\nA спонсируемый $game_concept_challenger_hof$ принимает [rite|E] своего спонсора, становится их [external_clerical_puppet|E] и обязан им [weak_hook|E]. \n\n$game_concept_mainline_rite$ $game_concept_head_of_faith$ не может [excommunicate|E] кого-либо, кто следует за $game_concept_challenger_hof$: спонсор и их [vassals|E]. \n\nВсе, кто следует за $game_concept_challenger_hof$, приносят свои духовные просьбы ему, а не $game_concept_mainline_rite$ $game_concept_head_of_faith$, среди них следующие [interactions|E]: \n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nA $game_concept_challenger_hof$ или их спонсор могут использовать [pam_challenge_hof_cb|E] [casus_belli|E] против законного $game_concept_head_of_faith$. \n\nСоперничающий [kings|E] или выше того же [faith|E] вместо этого может использовать [pam_antiking_cb|E] против спонсора, свергнув соперника-претендента."
 game_concept_chancellor: "Министр иностранных дел"
 game_concept_chancellor_desc: "$game_concept_chancellor$ — это [councillor|E], отвечающий за дипломатию как за рубежом, так и с остальными [realm|E]."
 game_concept_chancellors: "Министры иностранных дел"
 game_concept_church_authority_desc: "$game_concept_church_authority$ представляет собой силу, которую [theocratic|E] [ruler|E] обладает над своими [clergy|E] и [vassals|E].\n\nСуществует четыре уровня $game_concept_church_authority$; $church_authority_0$, $church_authority_1$, $church_authority_2$ и $church_authority_3$. Повышение $game_concept_church_authority$ требует определённого количества [piety|E] и [prestige|E] в зависимости от уровня и [learning_skill|E] правителя.\n\n#weak Депутаты с задних рядов не любят повышенные уровни $game_concept_church_authority$, и снижение его является основной целью [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_claimant_desc: "$game_concept_claimant$ — это человек с одним или несколькими [claims|E] [titles|E]. [ruler|E] Заявители могут нажимать на них, используя Claim [casus_belli|E] для объявления [wars|E]. \n\nЗТэтот Casus Belli также может использоваться для нажатия претензий [vassals|E] и даже [unlanded|E] персонажей в вашей [realm|E]. \n\nКлайманты также могут вести [factions|E] — даже если они не находятся в вашей группе."
 game_concept_claimant_faction_desc: "$game_concept_claimant_faction$ стремится посадить конкретного [claimant|E] на трон [title|E], занимаемый их [liege|E]. Если успешно, лидер партии будет вынужден передать титул претенденту, и структура [vassal|E] будет соответствующим образом обновлена. Все члены [faction|E] получат [hook|E] на претендента."
 game_concept_clan_desc: "Кланы — это [government_form|E], в котором количество [levies|E] и [taxes|E], предоставляемое [liege|E] их [vassals|E], определяется [aptitude|E] указанного лидера партии [tax_collector|E]. Кланы также используют [house_unity|E]."
 game_concept_clergy: "партийные чиновники"
 game_concept_clergy_desc: "[court_chaplains|E], [realm_priests|E], [theocratic|E] Правители, и все, кто имеет черту [GetTrait('devoted').GetName( GetNullCharacter )], считаются членами Партийных Чиновников. \n\n Члены [doctrines|E] [faith|E] определяют, кто может быть членом Партийных Чиновников и могут ли члены Партийных Чиновников вступать в брак, наследовать землю и т.д."
 game_concept_clergy_opinion: "Мнение партийных чиновников"
 game_concept_clerical_puppet: "Кукла-священник вечеринки"
 game_concept_clerical_puppets: "Куклы священников вечеринки"
 game_concept_clerical_region_desc: "Духовный регион — это географический регион, который находится под юрисдикцией [clerical_title|E]. Любой член партийных чиновников в регионе будет [subordinate|E] для владельца [title|E], связанного с этим регионом.\n\nA [ruler|E] принадлежит Духовному региону, который содержит их [capital|E] [county|E], а новый регион основан на [capital|E] [primary_title|E] его основателя. Регион может охватывать несколько [realms|E] и иметь подчиненных, которые находятся в разных партиях.\n\nA $game_concept_ruler$ может занимать только один $game_concept_clerical_region$ в одно время. Если ему предоставляют новый регион, правитель теряет все свои земли в предыдущем."
 game_concept_clerical_title_desc: "$game_concept_clerical_title$ — это [ecclesiastical|E] [title|E] [clergy|E], регулирующий [clerical_region|E] в рамках [faith|E]. Среди [christian|E] идеологий это [archdiocese|E].\n\nВладелец является [religious_superior|E] [clergy|E] в этом регионе и обычно назначается [head_of_faith|E]."
 game_concept_commander_trait_desc: "$game_concept_commander_traits$ являются особенными [traits|E], которые предоставляют полезные бонусы персонажам, когда они выступают в качестве [army|E] [commanders|E].\n\nЧерты командиров обычно приобретаются детьми, воспитанными в подразделении безопасности [education_focus|E], но также могут быть получены через [martial_lifestyle|E] и другими способами."
 game_concept_complete_control_desc: "Это условие выполняется, когда все [de_jure|E] рядовые [titles|E] целевого титула принадлежат либо [ruler|E], либо их [vassals|E], и ни один из его избирательных округов не [occupied|E] враждебными [armies|E]."
 game_concept_complete_control_region_desc: "Это условие выполняется, когда все [counties|E] в целевой [region|E] находятся либо у правителя, либо у его [vassals|E], и ни один из его избирательных округов не занят враждебными армиями."
 game_concept_confederation_desc: "Отношение, которое связывает [tribal|E] или [nomadic|E] [rulers|E] в взаимной защите, подобное [alliance|E]. Формируется через #high $call_for_confederation_decision$#! [decision|E], конфедерация требует от своих членов присоединяться к оборонительным [wars|E] друг друга. Конфедерации видны на вкладке Харизма.\n\n Товарищи [confederates|E] также не могут нападать или [raid|E] друг на друга. Им запрещено достигать высоких уровней [tribal_authority|E] и [nomadic_authority|E], а также создавать новые [titles|E].\n\n[confederates|E] могут использовать #high $leave_confederation_decision$#! [decision|E] или [migrate|E], чтобы стать [independent|E]. Если в конфедерации остаётся только один член, она уничтожается."
 game_concept_contestant_desc: "Чтобы участвовать в [GetActivityType( 'activity_tournament' ).GetName] [contests|E], вы должны выполнить его требования. Настольные игры позволяют всем персонажам соревноваться, тогда как другие, такие как борьба, зависят от правил безопасности.\n\nПерсонажи, не участвующие в соревнованиях, будут [spectators|E], и потенциальные [contestants|E] могут отказаться от участия, если захотят наблюдать.\n\nПраво на участие в конкурсах определяется полом и здоровьем, основываясь на [culture|E] и [religion|E] хозяина."
 game_concept_convert_county_desc: "A [councillor_task|E] выполняется [court_chaplain|E], который нацелен на [county|E] другой [faith|E] — или на [rite|E] с той же идеологией, но другой [liege|E].\nПрогресс увеличивается каждый месяц, и при 100% большинство Целевого избирательного контингента принимает идеологию Лидера Палаты. Новый [rite|E] следует [liege|E], если результатирующая идеология совпадает с идеологией Лидера партии — в противном случае это собственная идеология Капеллана.\n\nСкорость обращения зависит от многих факторов, включая [councillor|E] [learning_skill|E] и [fervor|E] вовлеченных идеологий. Капеллан, чья [rite|E] отличается от [liege|E], совершает обращение медленнее.\nПри сдвиге [rite|E] только [fervor|E] отдает предпочтение основной идеологии выше #V 50%#! и второстепенным (включая отколовшиеся) идеологиям ниже нее."
 game_concept_convince_dejure_desc: "[councillor_task|E] выполнено [steward|E]. Оно нацелено на [de_jure|E] [county|E] министра [liege|E], которым владеет [independent|E] [ruler|E]. Когда избиратели будут убеждены, они попросят своего [ruler|E] отпустить их к их [de_jure|E] [liege|E]."
 game_concept_coronation_anointment_desc: "Помазание — это один из видов [coronation|E], когда [ruler|E] будет искать своих [head_of_faith|E], или официальных лиц партии [head_of_rite|E], когда таковых нет, чтобы благословить их восхождение на трон. В некоторых идеологиях это необходимо, чтобы действительно считаться [legitimate|E] правителем своих земель.\n\n Чтобы заручиться поддержкой этой власти, [host|E] может использовать [anointment_request|E] [interaction|E]."
 game_concept_council: "Кабинет"
 game_concept_council_desc: "$game_concept_council$ — это высшая команда лидера [councillors|E], каждый из них управляет своим департаментом. Им могут быть поручены важные [councillor_tasks|E]."
 game_concept_councillor: "Министр"
 game_concept_councillor_desc: "Министры являются основными помощниками любого [ruler|E] и составляют [council|E]. В кабинете шесть должностей: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (или [realm_priest|E]) и, наконец, ваш [spouse|E].\n\nКаждый отвечает за отдел, которому можно поручить разные [councillor_tasks|E]. \n\n[powerful_vassals|E] расстроится, если его не назначат на одну из этих должностей, что часто заставляет делать выбор между удовлетворением влиятельного рядового депутата или назначением кого-то действительно компетентного.\n\nСлужба министром для вашего [liege|E] дает бонус, который увеличивается с [rank|E] лидера партии."
 game_concept_councillor_task: "Министерская задача"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ это важные задачи, которые можно поручить вашим [councillors|E]. Эти задачи могут быть общими или специально направленными на [county|E] или [court|E].\n\n Если у вас есть [relation|E] с министром, задачи с временем выполнения могут занять больше или меньше времени.\n\n#weak Обратите внимание, что министры физически не присутствуют для выполнения этих задач, а только руководят процессом.#!"
 game_concept_councillor_task_possible_side_effects_desc: "[councillor_task|E] со временем может иметь неожиданные последствия. Они могут быть как хорошими, так и плохими, при этом положительные эффекты более вероятны, если соответствующий [skill|E] Министра высок, а отрицательные эффекты — если соответствующий Навык низок."
 game_concept_councillor_tasks: "Министерские задачи"
 game_concept_councillors: "Министры"
 game_concept_counties: "Избирательные округа"
 game_concept_county: "Избирательный округ"
 game_concept_county_capital: "Столица округа"
 game_concept_county_capital_desc: "$game_concept_county_capital$ является основным [holding|E] [county|E]. Это владение никогда не может быть уничтожено или [leased|E] и всегда принадлежит [ruler|E], который держит Constituency [title|E].\n\nСтолицы избирательных округов позволяют построить дополнительный [building|E] по сравнению с меньшим владением."
 game_concept_county_capitals: "Столицы округов"
 game_concept_county_control: "Контроль округа"
 game_concept_county_control_desc: "$game_concept_county_control$ измеряет контроль, который правительство имеет над населением [county|E]. Это особенно важно для сбора [taxes|E] с [holdings|E].\n\nКогда избирательный округ меняет владельца через [war|E], Контроль резко падает, что является хорошей причиной вассализировать текущего [holder|E] вместо этого (если [casus_belli|E] позволяет). Контроль округа также может быть повреждён [sieges|E] и [Concept( 'peasant_faction', 'Peasant Uprisings' )|E].\n\nНизкий Контроль может привести к [county_corruption|E], и основной способ увеличения Контроля — это [councillor_task|E], доступный вашему [marshal|E]."
 game_concept_county_corruption: "Коррупция округа"
 game_concept_county_corruption_desc: "Когда [county|E] имеет низкий [control|E] или его [holder|E] находится в [debt|E], Констуэнция может приобрести $game_concept_county_corruption$. Это различные виды негативного [county_modifiers|E].\n\n$game_concept_county_corruption$ будут со временем исчезать, но если первопричина сохраняется ([debt|E] или низкий [control|E]), они могут появиться снова.\n\n$councillor_marshal$ $task_increase_control$ $game_concept_councillor_task$ может быстрее избавляться от $game_concept_county_corruption$."
 game_concept_county_fertility: "Рождаемость округа"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ находится в [counties|E], расположенном внутри [the_great_steppe|E], и может пастись [GetGovernment( 'nomad_government' ).GetName] [rulers|E], чтобы увеличить свои [herd|E].\n\n Плодородие избирательного округа представляет качество его пастбищ.\n\n Плодородие стабилизируется вокруг [fertility_equilibrium|E], позволяя кочевым правителям с большим [domain_limit|E] поддерживать рост своего стада. Плодородие зависит от [steppe_seasons|E] и постепенно восстанавливается [herders|E].\n\n Когда плодородие [realm|E] низкое, это признак для [migrate|E].\n\n[county_control|E] замедляет скорость, с которой растет плодородие, на процент, равный текущему контролю."
 game_concept_county_modifier: "Модификатор избирательного округа"
 game_concept_county_modifiers: "Модификаторы избирательных округов"
 game_concept_county_opinion_desc: "Население каждого [county|E] имеет [opinion|E] у [character|E], который удерживает их $game_concept_county$. Если население недовольно, оно может начать или присоединиться к [peasant_faction|E] или [popular_faction|E], любое из которых вскоре может распространиться по всей [realm|E].\n\nСамый простой способ контролировать $game_concept_county_opinion$ заключается в том, чтобы $game_concept_county$ [holder|E] имел тот же [culture|E] и [faith|E], что и население.\n\n$game_concept_county_opinion$ предотвращение наличия другого [faith|E] модифицируется как [faith_hostility|E] округа, так и его [fervor|E], линейно масштабируясь от 0 до 100 $game_concept_fervor$."
 game_concept_court: "Офис"
 game_concept_court_amenities: "Офисные помещения"
 game_concept_court_amenity: "Офисные удобства"
 game_concept_court_artifact: "Офисный артефакт"
 game_concept_court_artifact_desc: "Офисный артефакт — это [artifact|E], который выставляется в [ruler|E] [royal_court|E], например, гобелены или красиво иллюстрированные книги.\n\n Офисные артефакты являются одним из факторов, определяющих [court_grandeur|E] Частного офиса.\n\n Нет ограничений на количество артефактов у персонажа, но эффект имеют только те, которые выставлены в слот соответствующего типа.\n\n Вы можете создавать новые офисные артефакты из [inspired|E] [characters|E], через решение о заказе артефакта, или выбрав [reforge|E] [inventory_artifact|E]."
 game_concept_court_artifacts: "Офисные артефакты"
 game_concept_court_chaplain: "Лидер Палаты"
 game_concept_court_chaplain_desc: "$game_concept_court_chaplain$ — это [councillor|E], отвечающий за религиозные и духовные дела в [faiths|E] с [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E]. \n\nДдеологии с позицией [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] имеют гораздо более мощный (и проблемный) [realm_priest|E] вместо $game_concept_court_chaplain$."
 game_concept_court_chaplain_possessive: "Лидер Палаты's"
 game_concept_court_chaplains: "Лидеры Палаты"
 game_concept_court_chaplains_possessive: "Лидеры Палаты (родительный падеж)"
 game_concept_court_desc: "Every politician has an $game_concept_court$: the [unlanded|E] people who work for them.\n\nThese [courtiers|E] are their family, advisers, researchers and hangers-on."
 game_concept_court_event: "Офисное мероприятие"
 game_concept_court_events: "Офисные мероприятия"
 game_concept_court_grandeur: "Офисная грандиозность"
 game_concept_court_grandeur_desc: "$game_concept_court_grandeur_value$ [royal_court|E] показывает, насколько известен этот пост, и открывает новые [court_grandeur_levels|E] по мере роста.\n\nЗначение варьируется от 0 до 100 и со временем стабилизируется на базовом уровне. Базовый уровень зависит от таких факторов, как [dynasty_perks|E], сколько вы тратите на [court_amenities|E] и есть ли у вас какие-либо великолепные [court_artifacts|E].\n\nЧасть Великолепия теряется при [succession|E]."
 game_concept_court_grandeur_expectation: "Ожидания Офисного Величия"
 game_concept_court_grandeur_expectations: "Ожидания офисного величия"
 game_concept_court_grandeur_level: "Office Grandeur Level"
 game_concept_court_grandeur_level_desc: "Уровень Великолепия [royal_court|E] даёт бонусы его владельцу и открывается по мере увеличения [court_grandeur_value|E] Офиса.\n\nВ дополнение к эффектам каждого уровня, ожидается, что крупные [realms|E] достигли более высоких уровней Великолепия. Это известно как [court_grandeur_expectations|E]."
 game_concept_court_grandeur_levels: "Office Grandeur Levels"
 game_concept_court_grandeur_value: "Величественная ценность офиса"
 game_concept_court_guest: "Офисный гость"
 game_concept_court_host: "Office Host"
 game_concept_court_host_desc: "$game_concept_court_host$ — это [ruler|E], который не является партийным лидером персонажа, но все равно имеет его в своём [court].\n\nЕсть несколько возможных причин для этого, например, [wanderers|E] посещает Правителя или [wards|E] находится в том же Должностном месте, что и их [guardian|E]."
 game_concept_court_language: "Office Language"
 game_concept_court_language_desc: "Офисный язык — это официальный [language|E] [royal_court|E], на котором говорят представители знати и который используется бюрократией.\n\n [court_grandeur|E] Базовое значение увеличивается для каждого [realm|E] [county|E], который использует этот язык, для каждого частного офиса, говорящего на том же офисном языке, и если это родной язык [ruler|E]."
 game_concept_court_languages: "Офисные языки"
 game_concept_court_position: "Назначение"
 game_concept_court_position_task: "Задача по назначению"
 game_concept_court_position_tasks: "Задачи по назначению"
 game_concept_court_positions: "Назначения"
 game_concept_court_type: "Тип офиса"
 game_concept_court_type_desc: "В рамках своего [royal_court|E], [rulers|E] может иметь назначенный $game_concept_court_type$.\n\nКаждый $game_concept_court_type$ предоставляет Правителю и [court|E] свой набор бонусов в зависимости от [court_grandeur_level|E].\n\n[ethos|E] [culture|E] Правителя определяет, какие Типы Офисов они могут иметь.\n\nРазличные Типы Офисов следующие:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "Признак типа офиса"
 game_concept_court_type_trait_desc: "После прохождения [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет в [royal_court|E] [courtier|E] получает [trait|E], отражающий [court_type|E] того суда.\n\n Качество этой черты определяется тем, как долго [character|E] работал сотрудником в офисе."
 game_concept_court_types: "Типы офисов"
 game_concept_courtier: "сотрудник"
 game_concept_courtier_desc: "$game_concept_courtier$ — это [unlanded|E] персонаж, который служит [ruler|E] в их [court|E].\n\nПерсонал может:\n$BULLET_WITH_TAB$Служить как [councillors|E]\n$BULLET_WITH_TAB$Служить в [court_positions|E]\n$BULLET_WITH_TAB$Служить в [armies|E] как [commanders|E] или [knights|E]\n$BULLET_WITH_TAB$Стать [vassal|E] своего правителя при условии получения [title|E]\n$BULLET_WITH_TAB$Позволить своему правителю нажимать их [claims|E] в [war|E]\n\n#WEAK [adventurers|E] иметь [followers|E] вместо $game_concept_courtiers$ — они выполняют ту же роль, но обычно более запахные и с большим количеством грязи.#!"
 game_concept_courtiers: "Персонал"
 game_concept_courts: "Офисы"
 game_concept_criminal_task_contract_desc: "$game_concept_criminal_task_contract$ обычно включает сомнительные контракты, которые могут быть прибыльными, но принесут вам @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\nПовышение $trait_gallowsbait$ [trait|E] вызовет у большей части мира больше ненависти к вам и меньше уважения, и со временем приведет к тому, что [followers|E], которые не одобряют ваши грабежи, драматически покинут вашу службу.\n\n#WEAK $trait_gallowsbait$ — это крайне отрицательный $game_concept_trait$, означающий, что персонаж является мелким преступником низшего порядка — хотя бы убийство в офисе имеет какой-то #EMP класс#!.\n\nЭто можно полностью исправить с помощью [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E].#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ представляет собой общую власть, которую [ruler|E] обладает над своими [vassals|E].\n\nСуществует четыре уровня $game_concept_crown_authority$: [autonomous_vassals|E], [limited|E], [high|E] и [absolute|E]. Повышение $game_concept_crown_authority$ требует определенного количества [prestige|E] в зависимости от уровня и [learning_skill|E] правителя.\n\n#weak «Задние скамейки» не любят высокие уровни $game_concept_crown_authority$, и понижение его является основной целью [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_culture_head_desc: "'$game_concept_culture_head$' — это [ruler|E], который имеет наибольшее влияние на свои собственные [culture|E].\n\nВ частности, правитель с наибольшим общим числом [counties|E] той же культуры в своей [realm|E] станет $game_concept_cultural_head$, независимо от того, где находится его [domain|E] или какие Constituencies другой культуры у него есть.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\n$game_concept_cultural_head$ может влиять на то, какие [innovation|E] должны быть приоритетными для открытия, устанавливая [cultural_fascination|E].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "Медленный процесс, при котором [title|E]s [de_jure|E] [liege|E] могут изменяться. Это происходит естественно, когда [duchy|E] или [kingdom|E] полностью контролируются [ruler|E], который не имеет титула де-юре партийного лидера территории.\n\n Этот процесс можно ускорить, назначив вашего [chancellor|E] на соответствующий [councillor_task|E] #weak ($task_integrate_title$)#!. Регионы могут только $game_concept_de_jure_drift$ в Нации, а Нации могут только Drift в [empires|E].\n\n Позволить титулами De Jure дрейфовать в ваш [primary_title|E] — хороший способ избавиться от штрафа [rightful_liege|E]."
 game_concept_de_jure_drift_desc_part_2: "#weak Пример: Регион $d_northumberland$ де-юре является частью $k_england$, но территория региона полностью находится в $k_scotland$. Так как король $k_scotland$ не владеет также $k_england$, регион начнёт $game_concept_de_jure_drift$, чтобы стать частью $k_scotland$.#!"
 game_concept_death_religion: "Политический Лагерь"
 game_concept_death_religion_desc: "Быть переданным в следующий мир противниками и кощунственная отправка вашего смертного тела — мученичество, распятие — оставаясь верным своей идеологии до самого конца, какой более подлинный способ передать это существует."
 game_concept_debt_desc: "Долг — это состояние отрицательного количества [gold_i][gold|E]. Обычно это происходит, когда [ruler|E] в состоянии войны нанимает [mercenaries|E] без достаточного количества средств для полной стоимости или когда они слишком долго находятся в состоянии войны. \n\n Находясь в долгу, вы не можете объявить новые [wars|E], ваши [men_at_arms|E] не укрепляются, и ваши враги будут [advantage|E] над вами в бою. Чем глубже вы погружаетесь в долги, тем больше штрафов вы получите — меньше [levies|E], меньше [county_opinion|E], и ваши [vassals|E] будут вас меньше любить. \n\nКроме того, могут произойти и другие мелкие дестабилизирующие события, например, получить [county_corruption|E] в [domain|E] [counties|E]. \n\n#help Обычно полезно наносить удары по врагам, пока они в долгах, так как они будут сражаться с меньшими [advantage|E]! #!"
 game_concept_demand_conversion_desc: "[rulers|E], которые имеют подопечного из другой [faith|E], могут Требовать Конверсии, чтобы изменить идеологию подопечного на свою собственную. Навык [learning|E] правителя и [opinion|E] подопечного по отношению к лидеру их партии являются важными факторами для определения, примет ли подопечный требование или [Concept('refuse_conversion_crime','refuses')|E] его."
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$ управляет тем, насколько хорошо [diarch|E] выполняет каждый [mandate|E], установленный их [liege|E].\n\nОба [skills|E] и [personality_traits|E] играют роль. Например, [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$, назначенный на мандат '$fill_coffers_mandate$', может не отправлять столько [gold|E] своему лидеру партии.\n\n#WEAK [diarchs|E] хорошо подходят для $game_concept_mandate$, когда у них есть около 40+ $game_concept_aptitude$ для этого.#!"
 game_concept_diarch_power_desc: "[diarch|E] в активной [power_sharing|E] имеет доступ к специальным $game_concept_diarch_powers$.\n\nЭто специальные [character_interaction|E], которые имитируют те, что имеют их [liege|E], или другие злоупотребления властью. Примеры включают [revoking|E] [titles|E] от товарищей по [vassals|E], или присвоение [gold|E] у их Партийного Лидера.\n\nМногие $game_concept_diarch_powers$ дают Партийному Лидеру возможность [veto|E] их."
 game_concept_diplomacy: "Харизма"
 game_concept_diplomacy_lifestyle: "Харизма Лайфстайл"
 game_concept_diplomacy_skill: "Навык харизмы"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ — это [skill|E] для обаяния, убеждения и заключения сделок: умение общаться в компании, завоевывать расположение коллег и доводить сделку до конца.\n\nЭто напрямую влияет на [opinions|E], которое другие персонажи имеют о вас, и способствует развитию Харизмы [schemes|E].\n\nСоответствующий [lifestyle|E] — это [diplomacy_lifestyle|E]."
 game_concept_diplomacy_task_contract: "Контракт Charisma"
 game_concept_diplomacy_task_contract_possessive: "Charisma Contract's"
 game_concept_diplomacy_task_contracts: "Контракты на харизму"
 game_concept_diplomacy_task_contracts_possessive: "Контракты Харизмы"
 game_concept_direct_vassal: "Прямой депутат от тыла"
 game_concept_direct_vassals: "Прямые депутаты от тыла"
 game_concept_directed_great_holy_war_desc: "$game_concept_directed_great_holy_war$ объявляется $doctrine_temporal_head_name$ [head_of_faith|E] с целью подчинить [kingdom|E] своей власти.\n\n[rulers|E] их [faith|E] могут выбрать помощь лидеру движения и могут получить награды за это. Награды включают [piety|E] и потенциально превращение их [dynasty|E] в [landed|E] внутри завоёванной нации.\n\nПравители целевой [religion|E] могут выбрать защиту от этой войны без необходимости [alliance|E]."
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ — это самый низкий уровень [tribal_authority|E]. На этом уровне [vassals|E] не имеют штрафа [opinion|E] к их [liege|E], а лидер партии не имеет никакой власти над ними, кроме возможности требовать [levies|E] и [taxes|E]."
 game_concept_dissolution_faction_desc: "[dissolution_faction|E] стремится разрушить [realm|E] их [liege|E]. Если им удастся, все рядовые члены партии станут [independent|E], а лидер их партии потеряет [primary_title|E]."
 game_concept_doctrine: "Политическая Позиция"
 game_concept_doctrine_knowledge: "Знание Политической Позиции"
 game_concept_doctrines: "Политические Позиции"
 game_concept_doctrines_desc: "Политические позиции — это то, за что стоит [faith|E]: налоги и расходы, владение, иммиграция, Европа, Союз и гражданские свободы. Законы, которые противоречат политическим позициям депутата, делают восстание более вероятным."
 game_concept_domain: "Портфель"
 game_concept_domain_desc: "$game_concept_domain$ политика — это всё, что они лично держат: их место и его округа.\n\n [domain_limit|E] означает, что лидеру приходится полагаться на [vassals|E], чтобы руководить более чем несколькими местами."
 game_concept_domain_fertility: "Доходность портфеля"
 game_concept_domain_fertility_desc: "Доходность портфеля — это общая [county_fertility|E] всех ваших удерживаемых [counties|E]."
 game_concept_domain_income: "Доход портфеля"
 game_concept_domain_limit: "Лимит портфеля"
 game_concept_domain_size: "Размер портфеля"
 game_concept_domain_taxes: "Налоги на портфель"
 game_concept_domains: "Портфели"
 game_concept_dominant_family_desc: "$game_concept_dominant_family$ — это [powerful_family|E], который распространил свой контроль далеко и широко. Они считаются самыми влиятельными [house|E] внутри [realm|E].\n\nЧлен $game_concept_dominant_family$ еще лучше в [political_schemes|E] и с большей вероятностью получит то, что хочет, при [interacting|E] с другими [characters|E].\n\n$game_concept_house$ должен контролировать как минимум [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] Партии, чтобы стать Доминирующим."
 game_concept_dread: "Влияние"
 game_concept_dread_desc: "$game_concept_dread$ показывает, насколько [ruler|E] внушает страх: лидер, который увольняет министров, не моргнув глазом, завхоз, который никогда не забывает восстание.\n\n Политики получают $game_concept_dread$ посредством жестоких действий: увольнений, чисток и наказаний за восстания или [prisoners|E].\n\n Влияние позволяет руководить как [tyrant|E], потому что непокорные [vassals|E] могут стать [intimidated|E] или [cowed|E], и они слишком боятся вам противостоять.\n\n Влияние персонажа может варьироваться от 0 до 100, за исключением [nomads|E], который может достичь 150. Со временем их Влияние будет стремиться к их Естественному Влиянию, которое определяется их [personality_traits|E].\n\n#high Внушительный [ruler] получает следующие преимущества:#!\n$BULLET_WITH_TAB$[vassals] поощрение не присоединяться к [factions|E]\n$BULLET_WITH_TAB$[vassals] отговаривание от [scheming|E]\n$BULLET_WITH_TAB$ Увеличивает принятие [vassal] #weak (например, лишение титула)#!\n$BULLET_WITH_TAB$ Увеличивает принятие [offer_vassalization|E]\n$BULLET_WITH_TAB$ Делает [electors|E] более склонным голосовать так, как вы\n$BULLET_WITH_TAB$ Делает маловероятным противодействие [law|E] изменений со стороны рядовых депутатов\n\n#weak Учтите, что смелые и отважные [vassals] меньше подвержены влиянию!#!"
 game_concept_dreaded: "Грозный"
 game_concept_dreadful: "Грозный"
 game_concept_dreams_desc: "Персонажи, следующие идеологии, связанной с гаданием, иногда могут видеть сны. Эти сны могут быть предсказаны мистиком, что может привести к разным последствиям — как хорошим, так и плохим."
 game_concept_duchies: "Регионы"
 game_concept_duchy: "Регион"
 game_concept_duchy_building: "Региональное здание"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ это могущественные [buildings|E], которые можно строить только в [de_jure_capital|E] [duchy|E]. Только один тип можно построить в каждом регионе.\n\n$game_concept_duchy_buildings$ активны только если владелец также владеет связанной регионом [title|E].\n\n Многие $game_concept_duchy_buildings$ имеют модификаторы, которые влияют на все [holdings|E] в регионе, делая их мощными инструментами для специализации ваших [domain|E]."
 game_concept_duchy_buildings: "Региональные здания"
 game_concept_duchy_desc: "$game_concept_duchy$ — это [title|E], который находится [title_tier|E] ниже [kingdom|E] и выше [county|E].\n\nПраво [holder|E] $game_concept_duchy$ включает [de_jure|E] на его составные $game_concept_counties$ и может иметь [counts|E] в качестве [vassals|E].\n\nРегионы могут быть неактивными и не иметь текущего Владельца. Такие $game_concept_title_succession$ могут быть созданы [ruler|E], который контролирует как минимум половину его $game_concept_counties$."
 game_concept_dynasty_perks: "Наследие партии"
 game_concept_dynasty_prestige: "Party Brand"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$ — это репутация партии в целом: что избиратели думают о значении её имени и какие возможности она открывает для её членов.\n\nA [dynasty|E] получает $game_concept_dynasty_prestige$ от своих живых членов, от членов, занимающих должности, и от членов, состоящих в браке с другими должностными лицами.\n\nЭто учитывается в [dynasty_prestige_level|E] партии, и лидер партии может тратить его на [dynasty_perks|E]."
 game_concept_dynasty_prestige_level: "Уровень бренда партии"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\n Это самый высокий уровень бренда партии."
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ — это мера того, насколько известен [dynasty|E]. Прогресс по уровню достигается всякий раз, когда ваша Династия получает [dynasty_prestige|E]. Персонажи получают некоторое начальное количество [prestige|E] при рождении в зависимости от их $game_concept_dynasty_prestige_level$. Аналогично, [spouses|E] получают некоторый Профиль от Династии друг друга, когда они [marry|E].\n\nУровни следующие:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[interaction|E], через которое [ecclesiastical|E] [rulers|E] могут заставить светских правителей одной [faith|E] объявить [holy_war|E] против правителей враждебной идеологии."
 game_concept_ecumenical_councils: "Экуменические кабинеты"
 game_concept_eminent_holy_site: "Известный центральный регион"
 game_concept_eminent_holy_site_desc: "An $game_concept_eminent_holy_site$ является [holy_site|E] большой важности для [faith|E]. Каждая Идеология может назначить только нескольких своих $game_concept_holy_sites$ как Выдающихся.\n\nТолько Выдающиеся Сердцевины вносят модификаторы, которые влияют на всех последователей Идеологии."
 game_concept_eminent_holy_sites: "Известные центральные регионы"
 game_concept_empire: "Великобритания"
 game_concept_empires: "Профсоюзы"
 game_concept_enshrined_desc: "Посвящённый [holy_relic|E] в [holy_site|E] активирует бонусы сердцевины и улучшает предоставляемые им бонусы, масштабируемые по общей [rarity|E] уровня всех посвящённых артефактов.\n\nПосвящённый артефакт больше не принадлежит персонажу, но с ним могут взаимодействовать держатель сердца [holder|E], [top_liege|E] или [clerical_region|E]. Артефакт больше не будет разрушаться. Вы можете посвящать только святые реликвии для своей собственной [faith|E]; посвящённые святые реликвии других идеологий не будут приносить пользы.\n\nПри посвящении или удалении посвящённого артефакта могут быть награды или затраты."
 game_concept_entrenched_regency_desc: "Если [regency|E] длится слишком долго, он может стать укоренившимся, и [regent|E] становится еще более мощным по сравнению с их [liege|E].\n\nПреимущества, которые [regent|E] получает от [scales_of_power|E], становятся намного сильнее.\n\nЧтобы закончить $game_concept_entrenched_regency$, Регент должен принять подарок от своего лидера партии, или лидер партии должен склонить Весы в свою пользу."
 game_concept_escalated_peasant_factions: "Усиленные протестные движения"
 game_concept_expected_legitimacy: "Expected Mandate"
 game_concept_expected_legitimacy_desc: "[legitimacy_level|E], которого [vassals|E] ожидают от своих [ruler|E], основывается на их исторических отношениях. Некоторые факторы, снижающие ожидания, включают: \n$BULLET_WITH_TAB$ Быть [de_jure|E] [liege|E] рядового депутата \n$BULLET_WITH_TAB$ Быть частью [close_family|E] рядового депутата \n$BULLET_WITH_TAB$ Быть [preferred_heir|E] рядового депутата \n$BULLET_WITH_TAB$ Служить в том же [dynasty|E], в котором рядовой депутат служит более #color_white 50#! лет \n$BULLET_WITH_TAB$ Рядовой депутат не является [powerful_vassal|E]\n\n Если фактический уровень ниже их ожиданий, они могут стать непослушными: их [opinion|E] будет ниже, и они могут присоединиться к [factions|E] против своих [liege|E].\n\n Ожидания возрастают с уровнем их [primary_title|E], а также с [era|E]."
 game_concept_external_clerical_puppet_desc: "Влиятельный член [clergy|E] — [archbishop|E] или даже [head_of_faith|E] — который стал [puppet|E] другого [ruler|E].\n\n Чем могущественнее священнослужитель, тем больше охват: управляемый лидер движения может [excommunicate|E] ваших врагов, назначать [cardinals|E], предоставлять [pressed_claim|E] или провоцировать [holy_war|E] от вашего имени."
 game_concept_faction_desc: "$game_concept_faction$ — это группа [vassals|E] с общими политическими интересами. Местное население [counties|E] также может присоединяться к определённым типам Фракций, таким как Протестное движение.\n\nФракции становятся опасными, когда их [faction_discontent|E] достигает определённой точки, после чего они выдвигают ультиматум.\n\nЕсли [liege|E] не выполняет требования, Фракция восстанет, вызвав [civil_war|E]. Если Фракция распадается до окончания Войны, Лидер партии должен иметь как минимум [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E], чтобы выиграть Войну."
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$ — это мера общей военной мощи [faction|E] по сравнению с их целью.\n\nКаждый отдельный член фракции добавляет всю свою силу к фракции, пока он остаётся в фракции. Если целью фракции является [liege|E] члена, сила этого члена также вычитается из относительной силы лидера партии."
 game_concept_faith: "Идеология"
 game_concept_faith_astray: "Отклоняющийся"
 game_concept_faith_astray_desc: "Этот [rite|E] находится в вашем политическом лагере или соседнем: вы расходитеcь в деталях.\n\n#S Эффекты:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "$game_concept_faith$ – это политический кредо политика в рамках более широкой [religion|E]. У каждого персонажа и [county|E] есть одно: идеология избирателей отражает наклон их голосующих, и она смещается в сторону идеологии их депутата.\n\n Политическая позиция идеологии [doctrines|E] – это её политические позиции, а [core_tenets|E] – её ключевые причины. [fervor|E] показывает, насколько активисты настроены решительно.\n\n Политики с разными идеологиями меньше нравятся друг другу, чем больше различие между их лагерями. Любой может изменить своё мнение (решение Изменить политику), за определённую цену."
 game_concept_faith_evil: "Непримиримый"
 game_concept_faith_evil_desc: "Этот [rite|E] хочет противоположного конституционного будущего: националист против унииониста.\n\n#S Эффекты:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "Против"
 game_concept_faith_hostile_desc: "Этот [rite|E] находится по другую сторону основного политического разлома, левых против правых.\n\n#S Эффекты:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "Идеологическое расстояние"
 game_concept_faith_hostility_desc: "Все [faiths|E] имеют отношение друг к другу, которое определяется тем, насколько далеко их политика друг от друга.\n\nИдеологии одного или соседнего [religion|E] расходятся в деталях; левое и правое противоположны; националисты и юнионисты несовместимы.\n\nСуществуют следующие отношения: [faith_righteous|L], [faith_astray|L], [faith_hostile|L] и [faith_evil|L]."
 game_concept_faith_righteous: "Единомышленники"
 game_concept_faith_righteous_desc: "Этот [rite|E] разделяет вашу политику.\n\n#S Эффекты:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "Идеологии's"
 game_concept_faiths: "Идеологии"
 game_concept_feast_desc: "[activity|E], где правители и персонал на вечеринке собираются отметить... то одно, то другое.\n\nУчастники потеряют [stress|E] и увеличат свой [opinion|E] у хозяина. Также может быть любое количество других последствий от собрания такого количества людей.\n\n [ruler|E] пригласит своих [liege|E] и их [vassals|E] (вместе с различными [courtiers|E]) на $activity_feast$."
 game_concept_fervor: "Осуждение"
 game_concept_fervor_desc: "$game_concept_fervor$ [faith|E] варьируется от #V 0#! до #V 100%#!. Это измеряет, насколько воодушевлены его активисты и избиратели: явка, волонтеры и шум.\n\nВысокий $game_concept_fervor$ заставляет избирательные округа Идеологии больше заботиться о политике их депутата."
 game_concept_feudal_desc: "В рамках феодального [government_form|E] [liege|E] предоставляет [vassals|E] [land|E] для управления в обмен на [levies|E] и [taxes|E], регулируемые индивидуальными [vassal_contract|E] между рядовыми депутатами и лидером партии."
 game_concept_flowery_war_desc: "Это особый тип [war|E], инициированный [ruler|E], чья [faith|E] практикует человеческие жертвоприношения. Основная цель $game_concept_flowery_warring$ — сражаться и захватывать [prisoners|E] для жертвоприношений, при этом любая сторона может получить достаточно [war_score|E] через бой, чтобы победить, не прибегая к [siege|E].\n\nВ конце $game_concept_war$, если победитель (включая защитника) следует $game_concept_faith$, практикующему человеческие жертвоприношения, он заберет несколько $game_concept_prisoners$ у [court|E] проигравшего. Если оба основных участника $game_concept_flowery_war$ придерживаются одной идеологии, война считается священной, что означает, что проигравший все равно получает (сокращенное) [piety|E] даже в поражении.\n\nВы не можете проводить или продолжать $game_concept_flowery_war$, если у вас есть какие-либо $game_concept_prisoners$, полученные в результате выигрыша $game_concept_flowery_war$ в вашем [dungeon|E]."
 game_concept_foreign_affairs_desc: "[councillor_task|E] выполнено [chancellor|E].\n Для [independent|E] [ruler|E] оно повышает мнение, которое другие независимые правители имеют о них. Для рядового парламентария это повышает мнение, которое другие рядовые парламентарии того же [liege|E] имеют о нем."
 game_concept_fp3_demand_submission_interaction_desc: "Требуйте лояльности [character_possessive|E] в форме [hook|E], используя политический капитал, хитрость или запугивание."
 game_concept_gender_doctrines: "Политические позиции по вопросам гендера"
 game_concept_gender_doctrines_desc: "Эти [doctrines|E] определяют, какие [gender_laws|E] доступны персонажам [faith|E].\n\nОни также определяют определенные дополнительные правила, такие как какие [claims|E] могут наследоваться, кто может быть [commanders|E] и [knights|E], и к каким [house|E] родителей будет относиться [bastard|E].\n\nПоложения политики по гендеру:\n$BULLET_WITH_TAB$Мужской доминирующий \n$BULLET_WITH_TAB$Равный \n$BULLET_WITH_TAB$Женский доминирующий"
 game_concept_gift_desc: "Отправка подарка другому персонажу увеличит его [opinion|E] вас в обмен на [gold|E][gold_i]. \n\nЗЗчем жаднее получатель, тем больше Фондов вам придётся отправить и тем больше Мнений вы получите. \n\nЗЧем выше ваш [diplomacy|E], тем больше Мнения вы получите."
 game_concept_glory_desc: "An [accolade_possessive|E] Слава увеличивается за счет [accolade_rank|E].\n\nСлаву получают за [acclaimed_knight|E] победу [battles|E], поражение воинов, участие в [GetActivityType( 'activity_tournament' ).GetName] [contests|E] и посещение [activities|E].\n\nОднако Слава Звания снижается, когда Звездный Организатор участвует в проигрышных сражениях, и может также уменьшаться на [accolade_succession|E], если Звездный Организатор не погиб в бою, дуэли или иной почетной форме."
 game_concept_gold: "Средства"
 game_concept_gold_desc: "Средства — это деньги политика: пожертвования, членские взносы и избирательные фонды. Они платят за персонал, офисы, листовки и кампании."
 game_concept_goliardic_shenanigans_desc: "Персонаж в [GetActivityType('activity_adult_education').GetName] может устраивать всевозможные шалости, наслаждаясь студенческой жизнью. Последствия их приключений непредсказуемы и включают [skill|E] очков, образ жизни и давление [traits|E], жизненный опыт, болезни и ранения."
 game_concept_government_authority_desc: "$game_concept_government_authority$ представляет собой общую власть, которую [ruler|E] обладает над своими [vassals|E].\n\nРазные [governments|E] имеют разную форму $game_concept_government_authority$. Например, [feudal|E] [realms|E] используют [crown_authority|E], [clans|E] используют [tribal_authority|E], а [administrative|E] используют [imperial_bureaucracy|E]. Повышение $game_concept_government_authority$ требует определенного количества [prestige|E] в зависимости от уровня и [learning_skill|E] правителя.\n\n#weak «Задние скамейки» не любят высокие уровни $game_concept_government_authority$, и понижение его является основной целью [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!\n\nНе все [governments|E] имеют $game_concept_government_authority$."
 game_concept_governor_desc: "$game_concept_governor$ — главный задний парламентарий [liege|E] с [government_bureaucratic_gov|E]. Он назначается лидером партии для управления землями в пределах [realm|E], используя свой [governor_efficiency|E].\n\n $game_concept_governor$ [title|E], а также включённые в него [counties|E], называются [province|E]. [governance_issues|E] могут появляться внутри Провинции, которую $game_concept_governor$ должен решить.\n\n$game_concept_governors$ может накапливать [influence|E] и манипулировать [succession|E] других $game_concept_governorships$."
 game_concept_great_holy_war_desc: "$game_concept_great_holy_war$ — это особый тип [war|E], который могут объявлять только [head_of_faith|E] определённых [faiths|E] с целью подчинить целую [kingdom|E] под власть своей Идеологии.\n\n$game_concept_great_holy_wars$ направляет все [rulers|E] другой [religion|E] в выбранной [kingdom|E], заставляя их защищаться вместе. В случае победы все [titles|E] в целевой нации будут захвачены и разделены между нападающими.\n\nВ зависимости от своей [doctrines|E] Идеология может иметь доступ к [directed_great_holy_wars|E], [undirected_great_holy_wars|E] или вообще не иметь $game_concept_great_holy_wars$:\n$EFFECT_LIST_BULLET$[GetTenetType('tenet_armed_pilgrimages').GetBaseName], [GetTenetType('tenet_struggle_submission').GetBaseName] или [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E] необходимы для доступа к Великим Священным Войнам в целом\n$EFFECT_LIST_BULLET$Идеологии с [GetDoctrineType('doctrine_temporal_head').GetBaseName] Главой имеют доступ только к Направленным Великим Священным Войнам\n$EFFECT_LIST_BULLET$Идеологии с [GetDoctrineType('doctrine_spiritual_head').GetBaseName] Главой имеют доступ только к Ненаправленным Великим Священным Войнам\n$EFFECT_LIST_BULLET$Идеологии без Лидера Движения не могут объявлять никакие Великие Священные Войны, даже если они обычно имели бы на это право\n\nНекоторые Идеологии имеют специальные названия для своих Великих Священных Войн, такие как «Крестовый поход» или «Джихад». Эти Великие Священные Войны отличаются только названием и функционируют как любая другая Великая Священная Война."
 game_concept_great_project_desc: "Великие проекты — это масштабные предприятия, которые требуют всех ресурсов [realm|E].\n\nНекоторые Великие проекты включают строительство [great_building|E], в то время как другие связаны с восстановлением после [natural_disaster|E].\n\nВ то время как [ruler|E] партии контролирует разработку Великого проекта, [subjects|E] может предложить [great_project_contributions|E] для содействия его реализации."
 game_concept_head_of_faith: "Лидер движения"
 game_concept_head_of_faith_desc: "$game_concept_head_of_faith$ — формальный лидер [faith|E]. Полномочия и характер $game_concept_head_of_faith$ зависят от [doctrines|E] Идеологии.\n\n Некоторые Идеологии имеют [spiritual_head_of_faith|E] #weak (например, Папа)#!, некоторые — [temporal_head_of_faith|E] #weak (например, халиф)#!, а некоторые не имеют $game_concept_head_of_faith$ вовсе."
 game_concept_head_of_faith_possessive: "Лидер движения's"
 game_concept_head_of_rite: "Ведущий голос"
 game_concept_head_of_rite_desc: "Ведущий [character|E] [rite|E]: политик, который руководит наибольшим числом [counties|E]."
 game_concept_heads_of_faith: "Лидеры движения"
 game_concept_herder_desc: "Пастухи удаляются со всех аспектов управления. Они не командуют [armies|E], не владеют [buildings|E], не создают [alliances|E] и не объявляют [wars|E]. Когда [nomads|E] [migrate|E] [holding|E], пастухи постепенно восполняют местный [county_fertility|E] за счет своей меньшей стаи.\n\n Они запуганы надлежащим [nomad|E] [rulers|E] и немедленно сдадут свою землю, когда их вызовут на то."
 game_concept_heresies: "Отколовшиеся группы"
 game_concept_heresy: "Раскол"
 game_concept_heresy_desc: "Когда [fervor|E] [faith|E] критически снижается, может возникнуть вспышка Сплиттеринга. Вспышки бывают трех все более тяжелых форм: \n#indent_newline:7 $BULLET_WITH_TAB$Существующий [rite|E] становится более [rite_divergent|E] и распространяется на более широкую территорию.#!\n#indent_newline:7 $BULLET_WITH_TAB$Появляется значительно [rite_divergent|E] новая [rite|E] и охватывает земли.#!\n#indent_newline:7 $BULLET_WITH_TAB$Для христианских [faiths|E] возникает исторический сплиттеринг, такой как богомильство или катарство.#!\n\n[faith|E] подвержен реальному риску Сплиттеринга только тогда, когда [mainline_rite|E] достигает как минимум #V 100#! [counties|E]. Ниже этого уровня две более тяжелые формы не могут возникнуть вовсе, а даже самая легкая форма встречается значительно реже.\n\nКаждая вспышка заканчивается объединяющим всплеском $game_concept_fervor$."
 game_concept_heretical: "Разрыв"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ является вторым по высоте уровнем. [vassals|E] имеют штраф #N -20#! [opinion|E] к их [liege|E].\n\nНа этом уровне — помимо полномочий, которые получает лидер партии на [limited_crown_authority|E] — рядовые депутаты под тем же лидером больше не могут воевать друг с другом, правитель может меняться между всеми доступными [succession_laws|E], и [titles|E] рядовых депутатов не могут быть унаследованы правителями за пределами [realm|E] лидера партии.\n\nНаконец, отказ от титула [revocation|E] или должности рядового депутата [retraction|E] считается [crime|E], даже если у лидера партии нет достаточных оснований."
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ — это средний уровень [nomadic_authority|E]. На этом уровне [migration|E] могут нацеливаться на [de_jure|E] [kingdom|E] [titles|E] внутри [the_great_steppe|E], а лидер партии может [retract|E] [vassal|E] рядовых членов."
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ является вторым по высоте уровнем [tribal_authority|E]. [vassals|E] имеют штраф #N -20#! [opinion|E] к их [liege|E].\n\nНа этом уровне, кроме способности [imprison|E] [characters|E], лидер партии может [revoke|E] [titles|E] и [retract|E] рядовым депутатам."
 game_concept_hold_court_desc: "[activity|E], где [vassals|E] и [courtiers|E] в [realm|E] собираются на [royal_court|E], чтобы подать петицию своим [liege|E] и высказать свои жалобы.\n\nСитуации, по которым Лидер Партии будет призван вынести решение, могут варьироваться от мелких споров и недоразумений до катастроф на уровне всего королевства. Большинство проблем будут иметь решение, выгодное – если не для вовлеченных сторон, то хотя бы для лидера партии."
 game_concept_holder_desc: "$game_concept_holder$ [title|E] — это персонаж, который владеет титулом. Титулы [barony|E] и [county|E] всегда будут иметь $game_concept_holders$ после учреждения, тогда как титулы [duchy|E], [kingdom|E] и [empire|E] возможно еще не созданы. Кроме того, $game_concept_holder$ высокоуровневого титула может на самом деле не контролировать никакую территорию в области [de_jure|E] самого титула.\n\nВладение титулами более высокого уровня позволяет иметь [vassals|E] более высокого уровня. Например, герцоги могут иметь графов в качестве младших подчиненных, а короли могут иметь герцогов."
 game_concept_holding_court: "Проведение приема граждан"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$ — это [artifact|E], имеющий религиозное значение для [faith|E]. $game_concept_holy_relic$ можно [enshrined|E] в [holy_site|E] этой идеологии для получения преимуществ.\n\nНекоторые артефакты по сути святы для идеологии, но артефакты также можно [sanctified|E], чтобы стать святой реликвией."
 game_concept_holy_site: "Сердце страны"
 game_concept_holy_site_desc: "$game_concept_holy_site$ — это [county|E], который содержит место религиозного значения для [faith|E]. $game_concept_holy_sites$, удерживаемый Персонажем с правильной Идеологией, будет оказывать эффект на всех её последователей, а также может позволять создание [special_buildings|E] или [holy_orders|E]. Каждая Идеология имеет свой собственный набор $game_concept_holy_sites$.\n\nОбычный $game_concept_holy_site$ не дает глобальных преимуществ идеологии, только местные. Наиболее почитаемые места Идеологии обозначаются как [eminent_holy_sites|E]. Каждая Идеология может иметь только ограниченное количество каждого."
 game_concept_holy_sites: "Сердца страны"
 game_concept_holy_war_desc: "$game_concept_holy_war$ — это особый тип [war|E], ведущейся [ruler|E] одной [faith|E] против Правителя другой Идеологии.\n\n$game_concept_holy_war$ обычно довольно разрушительны, победитель Священной Войны, как правило, захватывает все [counties|E] в целевой области себе. Однако, если Идеология нападающего — [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName] или у защитника есть [vassals|E] Идеологии нападающего в целевой области, некоторые или все Второстепенные Правители в целевой области могут просто быть переданы нападающему.\n\nВ отличие от других войн, Правители той же Идеологии, что и цель, могут выбрать участие в ее защите без необходимости в [alliance|E].\n\nСвященные Войны могут быть разрешены или ограничены в зависимости от разных [religious_families|E]"
 game_concept_home_court: "Министерство внутренних дел"
 game_concept_home_courts: "Министерства внутренних дел (множественное число)"
 game_concept_home_courts_possessive: "Министерства внутренних дел"
 game_concept_hungarian_invasion_casus_belli_desc: "Мощная [casus_belli|E], которую можно использовать только один раз за всю кампанию, чтобы завоевать все территории, удерживаемые целью в Паннонии.\n\n При победе все $mogyer_collective_noun$ в [realm|E] нападающего перемещаются с ними в Паннонию, [counties|E] #EMP и #! [vassals|E], вытесняя $avar$ $game_concept_counties$. Другие депутаты за пределами Паннонии оставляются, в то время как $game_concept_counties$, ранее занимаемые или удерживаемые $mogyer_collective_noun$, оставляются под властью местных мелких военачальников и соперничающих кочевых племен."
 game_concept_hybrid_culture_desc_DLC: "$game_concept_hybrid_culture$ — это [culture|E], созданный [ruler|E] как комбинация двух существующих Культур.\n\n$game_concept_hybrid_culture$ представляет собой смесь [traditions|E], [culture_pillars|E] и Эстетики двух исходных Культур.\n\nТолько Культуры с разными [heritage|E] могут образовать Гибрид, и стоимость [prestige|E] для этого основана на их [cultural_acceptance|E] друг к другу.\n\nЧем выше Культурная Приемлемость, тем больше [counties|E] преобразуется при формировании Гибрида. Правители гибридной культуры [promote_culture|E] значительно быстрее в Constituencies её родительских культур на #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! лет после её формирования.\n\nНовые Культуры также могут появляться как [divergent_culture|E]."
 game_concept_iberian_reclamation_desc: "Это особый тип [war|E], доступный [struggle_involved|E] [rulers|E] [iberian_struggle|E]. \n\nЗЗатакующий стремится захватить [duchy|E], содержащий любые [struggle_involved|E] [counties|E], принадлежащие [struggle_interloper|E] или [struggle_uninvolved|E] [ruler|E], или [vassalize|E] их, если у них нет земель за пределами этого региона."
 game_concept_initial_legitimacy: "Начальный мандат"
 game_concept_intrigue: "Spin"
 game_concept_intrigue_lifestyle: "Спин-образ жизни"
 game_concept_intrigue_skill: "Навык Вращения"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ — это [skill|E] для работы с медиа и чтения людей: брифинг, утечка информации, публикация статьи в дружественной газете, сохранение интриги в тайне.\n\nЭто в основном используется для продвижения и защиты от Спин [schemes|E].\n\nСоответствующий [lifestyle|E] — это [intrigue_lifestyle|E]."
 game_concept_intrigue_task_contract: "Spin Contract"
 game_concept_intrigue_task_contract_possessive: "Spin Contract's"
 game_concept_intrigue_task_contracts: "Спин-контракты"
 game_concept_intrigue_task_contracts_possessive: "Spin Contracts'"
 game_concept_kingdom: "Нация"
 game_concept_kingdoms: "Нации"
 game_concept_knight: "Организатор"
 game_concept_knight_army_modifier: "Модификатор армии организатора"
 game_concept_knight_army_modifier_desc: "Эффект, применяемый к любому [army|e], который #high содержит #! соответствующий [acclaimed_knight|e].\n\n Для применения модификатора армии их Организатора [knight|e] не обязательно быть #high их армией #! [commander|e]."
 game_concept_knight_army_modifiers: "Модификаторы армии организатора"
 game_concept_knight_desc: "$game_concept_knight$ — это [vassal|E], [courtier|E] или [follower|E], которые сражаются напрямую в вашем [army|E].\n\nВо время [battles|E] $game_concept_knights$ используют свои [prowess_skill|E], чтобы сражаться эффективнее. Высокий $game_concept_prowess$ означает, что они смогут нанести больше урона противнику и с большей вероятностью выживут или даже выйдут из $game_concept_battle$ невредимыми.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Организаторы могут называться по-разному в зависимости от [culture] или [faith]. Например, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ или $knight_baghatur_no_tooltip_plural$.\n\nОрганизаторы представляют как персонажа, так и его свиту войск.#!"
 game_concept_knight_desc_ACCOLADE_DLC: "Организаторы, которым присваивается [accolade|E], становятся [acclaimed_knights|E].\n\n"
 game_concept_knight_effectiveness: "Эффективность организатора"
 game_concept_knight_effectiveness_desc: "Эффективность Организатора [ruler|E] определяет, насколько хорошо их [knights|E] сражаются в [battle|E].\n\nПри 100% Организаторы сражаются как обычно, но при 200% они сражаются, словно их [prowess|E] удвоен."
 game_concept_knights: "Организаторы"
 game_concept_knights_possessive: "Организатора"
 game_concept_kurultai_desc: "Курультай заменяет [council|E] на [nomadic_government|E]. Члены Курultая относятся к элите партии и должны либо быть умиротворены, либо принуждены к [obedience|E] для обеспечения гладкого [succession|E].\n\nПосле события хаотической смены они могут украсть некоторые [herd|E], отказаться от своих новых [liege|E], они получат [claim|E] на [realm|E] [title|E]."
 game_concept_law_desc: "Законы [realm_possessive|E] определяют, как устроена эта Партия.\n\nНаиболее фундаментальным из них является [government_authority|E] Партии, так как эти Законы определяют, как [lieges|E] и [vassals|E] взаимодействуют на регулярной основе.\n\nХотя [succession_laws|E] и [title_laws|E] меньше влияют на повседневную жизнь [rulers|E] в Партии, их всё же важно учитывать для [succession|E]."
 game_concept_learning: "Политика"
 game_concept_learning_lifestyle: "Политический Образ жизни"
 game_concept_learning_skill: "Политическое Умение"
 game_concept_learning_skill_desc: "$game_concept_learning$ — это [skill|E] для идей и деталей: чтение брифов, составление счетов, успешное прохождение специализированных комитетов. Также это приносит [piety|E] каждый месяц.\n\nСоответствующий [lifestyle|E] — это [learning_lifestyle|E]."
 game_concept_learning_task_contract: "Политический контракт"
 game_concept_learning_task_contract_possessive: "Политического контракта"
 game_concept_learning_task_contracts: "Политические контракты"
 game_concept_learning_task_contracts_possessive: "Политических контрактов"
 game_concept_leasing_desc: "Незначительные [baronies|E] могут быть переданы в аренду [holy_orders|E], [monastic_holy_orders|E] или [clergy|E]. Арендованные округа обеспечивают [taxes|E] и [levies|E] [lessee|E], а не [holder|E].\n\nВоенные ордены могут сдавать в аренду [castle_holdings|E] и [city_holdings|E], в то время как монастырские ордены и партийные чиновники могут сдавать в аренду [temple_holdings|E]. Аренда может иметь [lease_contract|E].\n\nАрендованные [holdings|E] все еще считаются частью [realm|E] держателя. [county_capitals|E] нельзя сдавать в аренду."
 game_concept_legitimacy: "Мандат"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ — это право лидера управлять в глазах партии и страны: выигранные выборы, победа в конкурсе руководства, доверие Палаты. [ruler|E] без этого живет на заемное время. [vassals|E] также создают [legitimacy_expectations|E], которые [liege|E] должен выполнять.\n\nТолько [rulers|E] имеют $game_concept_legitimacy$, который рассчитывается в момент их становления правителями и приводит к их [initial_legitimacy|E]. Доля $game_concept_legitimacy$ предыдущего правителя также наследуется их [heir|E].\n\n$game_concept_legitimacy$ влияет на многие игровые системы, делая вероятнее принятие [marriage|E] предложений, [vassalization|E] и [alliances|E], а также снижая стоимость [claims|E], и изменяя [scales_of_power|E] в [regency|E].\n\n$game_concept_legitimacy$ обычно имеет 5 [legitimacy_levels|E] и один #weak Нелегитимный#! на нижнем уровне.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "Ожидания мандата"
 game_concept_legitimacy_gain: "Получение мандата"
 game_concept_legitimacy_level: "Уровень мандата"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] правители получают #V на 50%#! больше мандата за победу в войнах, но они также теряют вдвое больше при поражении. Они также будут получать мандат от [single_combat_duel_plural|E] и вступления в брак с дворянскими [courtiers|E] кого-либо равного или более высокого [dominance|E]."
 game_concept_legitimacy_levels: "Уровни мандата"
 game_concept_levies: "Добровольцы"
 game_concept_levy: "Доброволец"
 game_concept_liege: "Лидер партии"
 game_concept_liege_desc: "$game_concept_liege$ — это политик, у которого есть как минимум один [vassal|E], подчиняющийся им. Лидеры партий сами подчиняются Премьер-министру."
 game_concept_liege_possessive: "Лидеры партии"
 game_concept_liege_taxes: "Лидер партии Налоги"
 game_concept_liege_taxes_desc: "Ваши $game_concept_liege_taxes$ это [taxes|E], которые вы должны выплатить своему [liege|E] в рамках [obligations|E]. Вы не платите $game_concept_liege_taxes$, если вы [independent|E].\n\nС точки зрения вашего лидера партии, эти же налоги называются [vassal_taxes|E], чтобы отличать их от любых налогов, которые они могут быть обязаны платить своим $game_concept_liege$."
 game_concept_lieges: "Лидеры партии"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' — это второй по низости уровень [crown_authority|E]. [vassals|E] имеют штраф #N -10#! [opinion|E] к своим [liege|E], и лидер партии может [revoke|E] [titles|E] и [retract|E] закулисья закулисья. [ruler|E] может изменяться между доступными Partition [succession_laws|E]."
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ является вторым по низости уровнем [nomadic_authority|E]. [migration|E] могут нацеливаться на [de_jure|E] [duchy|E] [titles|E] внутри [the_great_steppe|E], [titles|E] могут быть отменены, а лидер партии теперь может [imprison|E] [characters|E] в своем [realm|E].\n\nМожет использовать #V $step_away_from_the_steppe_decision$#! [decision|E]"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ является вторым по низости уровнем [tribal_authority|E]. [vassals|E] имеют штраф #N -10#! [opinion|E] к их [liege|E], а лидер партии теперь может [imprison|E] [characters|E] в своем [realm|E]."
 game_concept_long_reign_desc: "'Долгое правление' — это растущий [opinion|E] бонус, который все персонажи в [realm|E] получают от [liege|E], правившего ими долгое время.\n\nАналогично, подданные получают убывающий [short_reign|E] штраф к Мнению с новыми лидерами партии."
 game_concept_mainline_rite: "Идеология"
 game_concept_mainline_rites: "Идеологии"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ — это [councillor_task|E], выполняемое [marshal|E].\n\nЭто увеличивает [knight_effectiveness|E] и снижает [hostile_scheme|E] [success_chance|E] против [liege|E] министра."
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ — это три Указа, предписанные [mandala|E] [ruler|E] — обозначенные [prosperity_decree|E], [expansion_decree|E] и [reverence_decree|E].\n\n В целом у партии Мандала очень централизованная власть, где контроль над [subjects|E] и [laws|E] принадлежит соответствующему Правителю, который может изменять их по необходимости с минимальными или нулевыми возражениями со стороны жителей."
 game_concept_mandala_desc: "По $game_concept_mandala$ [government_form|E] [domain_limit|E] и количество [direct_vassals|E] ограничены. Вместо этого [liege|E] и [suzerain|E] зависят от [tributaries|E] для расширения своей партии. \n\nA Мандала [ruler|E] может стремиться к тому, чтобы её видели как Бога-царя, или Девараджу, а затем полагаться на [mandala_radiance|E] для приобретения и поддержания $game_concept_tributaries$. \n\nA $game_concept_ruler$ должны поддерживать [opinion|E] и развивать отношения с $game_concept_tributaries$, чтобы сохранить их в долгосрочной перспективе. При наследовании $game_concept_tributaries$ могут рассеяться, если $game_concept_ruler$ не является достойным [mandala_succesor|E]."
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ — это особый тип [legitimacy|E], доступный только [son_of_heaven|E]. Он символизирует право монарха на правление и того, кто считается верховным правителем во всем небе. \n\nЗЗТмандат тесно связан с [dynastic_cycle|E]. Цикл влияет на то, как правящий монарх получает мандат, и может также менять [situation_dynastic_cycle_phase|E] в зависимости от уровня мандата монарха."
 game_concept_marshal: "Министр внутренних дел"
 game_concept_marshal_desc: "$game_concept_marshal$ — это [councillor|E], отвечающий за безопасность: полиция, границы и поддержание порядка."
 game_concept_marshals: "Министры внутренних дел"
 game_concept_martial: "Безопасность"
 game_concept_martial_lifestyle: "Образ жизни в безопасности"
 game_concept_martial_skill: "Навык безопасности"
 game_concept_martial_skill_desc: "$game_concept_martial$ — это [skill|E] для права и порядка, обороны и управления кризисами: обеспечение безопасности улиц и страны.\n\nСоответствующий [lifestyle|E] — это [martial_lifestyle|E]."
 game_concept_master_assassin_desc: "$game_concept_master_assassin$ — это [court_position|E], поддерживаемый [faiths|E] с [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]. $game_concept_master_assassin$ — опасный фанатик, который работает вместе с менее опытными убийцами, чтобы убивать предполагаемых врагов идеологии."
 game_concept_maximum_piety_level: "Максимальный уровень политического капитала"
 game_concept_men_at_arms: "Активисты"
 game_concept_men_at_arms_counter: "Контр-активисты"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$ являются профессиональными [soldiers|E], превосходящими [levies|E].\n\nИгрок имеет прямой контроль над составом и численностью своих активистов [regiments|E].\n\nРазные типы активистов полезны или вредны в различных типах [terrain|E]. Каждый тип также [counters|E] другой тип.\n\nАктивистов можно [stationed|E] в [holdings|E] для увеличения их эффективности."
 game_concept_mental_break_desc: "Когда [stress|e] переполняет персонажа, он испытывает Психический Срыв — личный кризис, в котором он чувствует, что должен что-то сделать, чтобы снизить свое Давление, несмотря ни на что.\n\nПерсонажи, страдающие от Психического Срыва, имеют несколько способов справиться с ситуацией, хотя многие из них принесут негативные последствия.\n\nПри низком [stress_levels|E] эти последствия незначительны и легко управляемы. Однако с увеличением Уровня Давления эти последствия также увеличиваются, в конечном итоге приводя к безумию и даже смерти."
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$ — это высокопоставленный [minister|E] и отвечает за дипломатические вопросы. Как правило, им назначают должность [grand_secretariat_director|E].\n\n Иностранный секретарь может быть назначен [grand_secretariat_director|E], в зависимости от #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$ — это высший командир в [realm|E] и управляет [army|E] [title_men_at_arms|E].\n\n Министр внутренних дел может быть назначен [grand_secretariat_director|E], в зависимости от #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ — это уникальный набор [vassal_obligations|E], доступный только для [ministers|E].\n\nВсе гражданские министры имеют определённый набор опций по умолчанию, тогда как [minister_grand_marshal|E] имеет уникальную опцию, которая предоставляет министру внутренних дел [title_men_at_arms|E].\n\nЭти обязательства нельзя изменить."
 game_concept_natural_prowess: "Природная выносливость"
 game_concept_noble_family_desc: "$game_concept_noble_families$ это влиятельные [houses|E] в [government_bureaucratic_type|E] [realm|E]. Они владеют [estate|E], контролируемыми и управляемыми [house_head|E], и остаются неотъемлемой частью партии в любое время, так как будут пытаться собрать [influence|E] и обеспечить [provinces|E] для себя.\n\n Влиятельный $game_concept_noble_family$ может стать [powerful_family|E] или [dominant_family|E]."
 game_concept_obedience_desc: "В [GetGovernment( 'nomad_government' ).GetName] [realms|E] послушание определяет лояльность [character|E] к их [liege|E], [suzerain|E] или владельцу их [court|E]. Персонажи могут быть послушны только одному [ruler|E] в одно время. \n\n Послушные персонажи с меньшей вероятностью участвуют в [hostile_schemes|E], присоединяются к [wars|E] или к [factions|E] против лидера своей партии. Они всегда будут поддерживать предпочтения лидера партии во время [succession|E] и не будут навязывать им свои [claims|E]. Непослушные [tributaries|E] могут попытаться освободиться. \n\n Когда показатель персонажа превышает [obedience_threshold|E], они становятся послушными."
 game_concept_offer_vassalization_desc: "Взаимодействие, предлагающее [vassalage|E] [independent|E] [ruler|E] более низкого [title_rank|E], мирно добавляя их в партию."
 game_concept_organize_levies_desc: "А [councillor_task|E] выполняется [marshal|E]. Он увеличивает размер [garrison|E] и скорость усиления [levy|E] в [realm|E] министра [liege|E]."
 game_concept_organized_desc: "Организованная [faith|E] имеет религиозную иерархию. Поклонение и обряды более организованы, а священные писания формализованы.\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] Идеологии могут стать организованными через реформу, в то время как другие идеологии всегда считаются организованными."
 game_concept_pam_challenge_hof_cb: "Лидер движения вызовов"
 game_concept_papal_recipient_desc: "Если основная цель [great_holy_war|E] уже удерживается или заявлена членом агрессивной идеологии, он будет считаться законным получателем титула, за который ведется борьба, если только основной [Concept( 'war_contribution', 'Contributor' )|E] не решит предоставить приоритет своему [beneficiary|E]."
 game_concept_peasant_faction_desc: "$game_concept_peasant_faction$ населен [counties|E] с низким [county_opinion|E]. В отличие от других [factions|E], этот всегда будет восставать, даже если [faction_military_power|E] низкий, ведь крестьяне обычно и оптимистичны, и неграмотны... Успешные протестные движения значительно снижают контроль над вашим [realm|E]."
 game_concept_peasant_factions: "Протестные движения"
 game_concept_perk_desc: "Привилегии — это открываемые бонусы, предоставляющие множество полезных и интересных эффектов. Они открываются выбором [focus|E] в [lifestyle|E] и тратой соответствующей формы [experience|E] #weak (например, Spin $game_concept_experience$, если вы хотите открыть $game_concept_intrigue_lifestyle$ $game_concept_perk$.)#!"
 game_concept_personal_tenet: "Личное дело"
 game_concept_personal_tenets: "Личные дела"
 game_concept_petition_antipope_gold_interaction: "Петиция Антипапе о финансах"
 game_concept_piety: "Политический Капитал"
 game_concept_piety_desc: "$game_concept_piety$ — это политический капитал политика в его партии и в государстве: проявленная лояльность, оказанные услуги, поддержка правильных дел.\n\nОн тратится на просьбы к партии и государству, в зависимости от [government_form|E].\n\nКаждый раз, когда персонаж получает политический капитал, он также продвигается к следующему [piety_level|E]."
 game_concept_piety_experience: "Верность"
 game_concept_piety_experience_desc: "Каждое очко Лояльности, которое получает персонаж, увеличивает его прогресс к следующему [piety_level|E]. Когда персонаж получает [piety|E], он также получает равное количество Лояльности."
 game_concept_piety_level: "Уровень Политического Капитала"
 game_concept_piety_level_desc: "$game_concept_piety_level$ персонажа — это мера того, сколько доверия он накопил в своей партии и в правительстве, а также его положение среди других [faith|E].\n\nКаждый раз, когда персонаж получает [piety|E], он также продвигается к следующему уровню политического капитала.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nУровни следующие:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "Влияние Уровня Политического Капитала"
 game_concept_piety_level_impact_desc: "Влияние Уровня Политического Капитала увеличивает или уменьшает [modifiers|E], получаемый от вашего текущего [piety_level|E]."
 game_concept_piety_levels: "Уровень(и) Политического Капитала"
 game_concept_playdate_desc: "[activity|E], где правители и персонал младше [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] собираются, чтобы играть и забыть скуку дня.\n\nУчастники потеряют [stress|E] и увеличат свой [opinion|E] у хозяина. Также может быть любое количество других последствий от собрания такого количества детей.\n\n[ruler|E] пригласит своих [liege|E] и их [vassals|E] (вместе с различными [courtiers|E]) на $activity_playdate$."
 game_concept_player_heir_desc: "$game_concept_player_heir$ — это [heir|E], за которого игрок будет продолжать играть на [succession|E].\n\n $game_concept_player_heir$ обычно совпадает с [primary_heir|E], но если [succession_law|E] вашего [primary_title|E] предписывает, что оно должно перейти к персонажу за пределами вашего [dynasty|E], вы вместо этого продолжите играть за династического наследника вашего второго по рангу титула (или третьего, четвертого и т.д.).\n\n Такая ситуация часто возникает, когда ваш $game_concept_player_heir$ отстраняется от власти по Закону об избираемом наследовании. Если вы [house_head|E] [noble_family|E] в [administrative|E] [realm|E] вы можете потерять свою Партию в пользу главных наследников за пределами вашего [house|E], но сохранить титул дворянской семьи.\n\n Если вы [ecclesiastical|e], ваш $game_concept_player_heir$ — это персонаж, который должен унаследовать ваш [primary_title|e], обычно [archdiocese|e]."
 game_concept_popular_faction_desc: "$game_concept_popular_faction$ населен [counties|E] с низким уровнем [county_opinion|E], которые имеют общий элемент, такие как [culture|E] или [faith|E]. Они стремятся освободиться и выбирают новый [ruler|E], исходя из своей культуры или идеологии. Такой тип восстания обычно очень опасен."
 game_concept_popular_factions: "Популистские движения"
 game_concept_powerful_family_desc: "$game_concept_powerful_family$ представляет одного из самых влиятельных [houses|E] и [noble_families|E] в [government_bureaucratic_type|E] [realm|E].\n\n Член $game_concept_powerful_family$ лучше умеет [political_schemes|E] и с большей вероятностью получает то, чего хочет, когда [interacting|E] с другими [characters|E].\n\n В любой момент времени может быть ограниченное количество $game_concept_powerful_families$, и именно высшие $game_concept_noble_families$ считаются могущественными на основе их [powerful_family_rating_short|E]. Палата [top_liege|E] является исключением и всегда считается могущественной.\n\n Семья, контролирующая значительную часть земель партии, может стать [dominant_family|E]."
 game_concept_powerful_vassal: "Влиятельный рядовой депутат"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' — это небольшая группа [vassals|E] с наибольшим количеством [soldiers|E] и самой высокой [income|E]. Вам нужно уделять особое внимание этим закулисным игрокам, потому что они рассчитывают занять место в вашей [council|E] и будут иметь значительно более низкую [opinion|E] к вам, если этого не произойдет.\n\nИзменение [succession_law|E] требует, чтобы все $game_concept_powerful_vassals$ либо имели положительную [opinion|E] к вам, либо были [cowed|E] вами, либо были [imprisoned|E]."
 game_concept_powerful_vassal_possessive: "Влиятельного рядового депутата"
 game_concept_powerful_vassals: "Влиятельные рядовые депутаты"
 game_concept_prestige: "Профиль"
 game_concept_prestige_desc: "$game_concept_prestige$ — это публичная известность политика: узнаваемость имени, количество материалов в колонках и эфирного времени.\n\nОна тратится на публичные действия, в зависимости от [government_form|E].\n\nКаждый раз, когда персонаж получает репутацию, он также продвигается к следующему [prestige_level|E]."
 game_concept_prestige_experience: "Fame"
 game_concept_prestige_level: "Уровень профиля"
 game_concept_prestige_level_impact: "Влияние уровня профиля"
 game_concept_prestige_level_impact_desc: "Уровень профиля Impact увеличивает или уменьшает [modifiers|E], полученный от вашего текущего [prestige_level|E]."
 game_concept_prestige_levels: "Уровни профиля"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$ являются #V 7#! [electors|E], которые выбирают [title_heir|E] вместе с императором в рамках [GetLaw('princely_elective_succession_law').GetName] [succession_law|E], используемых [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )].\n\n[holders|E] из #V 7#! предпочтительные [titles|E] получают приоритет как $game_concept_prince_electors$. Эти титулы выбираются при создании Империи.\n\nЕсли $game_concept_prince_elector$ титул разрушен, не находится во владении у [de_jure|E] имперского [vassal|E], принадлежит другому $game_concept_prince_elector$ или [religion|E] держателя отличается от титула императора, другой титул De Jure, находящийся в руках прямого имперского депутата или [independent_ruler|E], будет выбран на основе этих критериев:\n$EFFECT_LIST_BULLET$[rulers|E] титулы императора [faith|E] и [culture|E] имеют предпочтение\n$EFFECT_LIST_BULLET$[theocratic|E] и [feudal|E] правители имеют предпочтение\n\n#help Предпочтительные титулы перечислены в представлении выборов#!"
 game_concept_promote_other_culture_development_decision_desc: "[decision|E], который позволяет вам улучшить [development|E], [control|E], [building|E] расходы и оборонительные [advantage|E] в [counties|E] из разных [cultures|E] с [cultural_acceptance|E] #V 75%#! или выше.\n\nПринятие решения также увеличит ваш [prestige|E] [prestige_i] и [levies|E].\n\nВсе округа в [realm|E] затронуты. [gold|E] затраты масштабируются в зависимости от числа затронутых округов."
 game_concept_prowess: "Выносливость"
 game_concept_prowess_skill: "Навык выносливости"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ — это [skill|E], который отражает физическую и психическую выносливость персонажа: восьмнадцатичасовые дни, ночные заседания и предвыборные поездки.\n\nВысокий навык выносливости означает, что они с большей вероятностью выживут и хорошо справятся как [knights|E] в [battles|E], так и в [single_combat_duel_plural|E].\n\nКаждый пункт выносливости дает Организатору:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E] может быть поднят как $game_concept_raiders$ из [rally_points|E]. $game_concept_raiders$ может перемещаться в соседние земли и грабить их на [gold|E].\n\nДля того чтобы $game_concept_raid$, набеговая армия должна остановиться в [holding|E], принадлежащем иностранному [ruler|E], и выбрать начало набега — после этого они будут заняты грабежом в течение некоторого времени, после чего получат средства и разграбят владение.\n\nСредства будут храниться у армии и будут добавлены в казну только по возвращении домой. Если вы победите набеговую армию, несущую средства, вы заберете их, и они не смогут совершать набеги на вас в течение некоторого времени.\n\nТолько некоторые правители могут $game_concept_raid$, особенно правители [tribal|E] и [GetGovernment( 'nomad_government' ).GetName].\n\nКонкретные [raid_intents|E] можно настроить для получения различных наград."
 game_concept_rally_point_desc: "$game_concept_rally_point$ — это место для сбора [levies|E] и [men_at_arms|E] под вашим командованием. \n\nIв [war|E] вы можете вызвать свой [soldiers|E] на точке сбора, чтобы собрать [army|E]. \n\nЗЗЗволонтёры, назначенные на точку сбора, должны приходить либо из вашего [domain|E], либо из вашего [vassals|E]. Точки сбора можно реорганизовать, разделять и объединять по своему усмотрению."
 game_concept_realm: "Вечеринка"
 game_concept_realm_capital: "Домашняя база"
 game_concept_realm_capital_desc: "$game_concept_realm_capital$ — это [holding|E], где проживают [ruler|E] и их [court|E]. Это владение дает бонус [tax|E] и всегда наследуется [primary_heir|E].\n\n[occupying|E] Домашняя база врага во время войны дает значительное количество [war_score|E] и иногда позволяет вам [imprison|E] членов семьи врага."
 game_concept_realm_capital_possessive: "Домашней базы"
 game_concept_realm_capitals: "Домашние базы"
 game_concept_realm_desc: "$game_concept_realm$ — это всё и все, чем руководит политик, напрямую или через свой [vassals|E] (в отличие от [domain|E], к которому относится только то, что они держат сами)."
 game_concept_realm_heir: "Наследник партии"
 game_concept_realm_heir_desc: "Наследник партии — это один из [heirs|E] [realm|E], и получит либо все, либо часть [titles|E], которую держит [ruler|E] этой партии, когда правитель умрет.\n\nУ партии может быть один или несколько наследников, в зависимости от ее [succession_law|E]."
 game_concept_realm_heirs: "Наследники партии"
 game_concept_realm_law: "Партийное право"
 game_concept_realm_law_desc: "Законы, которые применяются к партии этого персонажа, такие как уровень [crown_authority|E] или [tribal_authority|E]."
 game_concept_realm_possessive: "Вечеринки"
 game_concept_realm_priest: "Священник партии"
 game_concept_realm_priest_desc: "$game_concept_realm_priest$ — это [councillor|E], отвечающий за религиозные и духовные дела в [faiths|E] с [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E].\n\nВ отличие от их [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] эквивалента ([court_chaplains|E]), $game_concept_realm_priests$ автоматически [lease|E] все [temple_holdings|E] в [ruler|E] [domain|E], а также получают часть [taxes|E] и [levies|E] от [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ обеспечивают своих [liege|E] Волонтёрами и Налогами, если у них положительное Мнение о них. Чем выше [opinion|E] их [liege|E], тем больше они предоставят.\n\n$game_concept_realm_priests$ с низким Мнением о своём Партийном Лидере не будут предоставлять ни Налогов, ни Волонтёров, и могут вызвать проблемы."
 game_concept_realm_priest_possessive: "Святые священники"
 game_concept_realm_priests: "Священники партии"
 game_concept_realm_size: "Размер партии"
 game_concept_realms: "Вечеринки"
 game_concept_regency_desc: "Регентство — это особая форма [diarchy|E] на случай, если [ruler|E] не в состоянии самостоятельно править своим [realm|E].\n\nОбычно оно возникает, если Правитель является [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )] или присутствует на [activity|E] за пределами своей Партии.\n\nСлишком долгое $game_concept_regency$ может превратиться в [entrenched_regency|E]."
 game_concept_religion: "Политический Лагерь"
 game_concept_religion_desc: "Группы $game_concept_religion$ связаны с [faiths|E]: Левые, Центристские, Правые, Националисты и Союзники. Идеологии одной и той же или соседней группы являются Разными; левые и правые противоположны; националисты и союзники неприемлемы друг для друга."
 game_concept_religions: "Политические Лагеря"
 game_concept_religious_families: "Политические Семьи"
 game_concept_religious_family: "Политическая Семья"
 game_concept_religious_family_desc: "$game_concept_religious_family$ — это группа [religions|E]. Этот $game_concept_religious_family$ влияет на то, как различные политические лагеря и [faiths|E] в них воспринимают друг друга. \n\nЗЗи [GetReligionFamily('rf_abrahamic').GetName] Семья одобряет [holy_wars|E] против всех #weak (включая других авраамиков)#!. Политические лагеря подвержены [heresy|E]. \n\nЗТо [GetReligionFamily('rf_eastern').GetName] Семья одобряет только Священные войны против других политических семей.\n\nЗЗа [GetReligionFamily('rf_pagan').GetName] Семья одобряет Священные войны против всех, но идеологии внутри Политических лагерей должны быть реформированы для доступа к ним."
 game_concept_religious_head_succession_law: "Закон о наследовании лидера движения"
 game_concept_religious_head_succession_law_desc: "[rulers|E], которые также являются [heads_of_faith|E], имеют дополнительный партийный закон [succession|E], требующий, чтобы их [heir|E] были той же [faith|E], что и они. Это никогда не может быть изменено, и $game_concept_head_of_faith$ [titles|E] не могут иметь отдельные [title_succession|E]. Единственный способ отменить этот тип партийного закона — чтобы внешняя сила уничтожила [head_of_faith|E] $game_concept_title$."
 game_concept_religious_head_succession_law_short: "Закон о лидере движения"
 game_concept_religious_head_succession_laws: "Закон о наследовании лидера движения"
 game_concept_religious_head_succession_laws_short: "Законы о лидере движения"
 game_concept_religious_superior_desc: "Религиозный Старший — это [character|E], который обладает религиозной юрисдикцией над одним или несколькими [subordinate|E] религиозными партийными чиновниками в иерархической религиозной структуре."
 game_concept_retinue_maa: "Активисты свиты"
 game_concept_retract_desc: "При [limited_crown_authority|E] или выше, [rulers|E] может $game_concept_retract$ [vassal|E] рядового депутата, но если последний не [imprisoned|E], это рискованно, так как рядовой депутат может отказаться и восстать.\n\nОтзыв рядового депутата считается [tyrannical|E], если только целью не является виновный в довольно серьезном [crime|E]."
 game_concept_revoke_desc: "На [limited_crown_authority|E] или выше, [rulers|E] может $game_concept_revoke$ [titles|E] своих [vassals|E], но если только Backbencher не [imprisoned|E], это рискованное предприятие, так как Backbencher может отказаться и поднять восстание.\n\nЛишение титула считается [tyrannical|E], если только Backbencher не виновен в довольно серьёзном [crime|E]."
 game_concept_rightful_liege: "Законный лидер партии"
 game_concept_rightful_liege_desc_part2: "#weak Пример: Граф $c_dunbar$ является непосредственным подданным короля $k_england$. Так как король не является ни герцогом $d_lothian$, ни королём $k_scotland$, ни императором $e_britannia$, граф $c_dunbar$ вносит лишь небольшую часть своих налогов и добровольцев.\n\nГраф $c_norfolk$ также является непосредственным подданным короля $k_england$. Король не владеет регионом $d_norfolk$, поэтому граф также вносит уменьшенные налоги и добровольцев. Однако, поскольку $k_england$ является де-юре страной $c_norfolk$, граф $c_norfolk$ всё равно вносит значительно больше налогов и добровольцев королю, чем граф $c_dunbar$.#!"
 game_concept_rite: "Идеология"
 game_concept_rite_desc: "В Вестминстере у каждого [faith|E] есть один $game_concept_rite$ с тем же названием: сама идеология со своими [core_tenets|E] и [doctrines|E]. Они фиксированы: политики меняют мнение, а не идеологию."
 game_concept_rite_divergence_desc: "Отклонение измеряет, насколько сильно [rite_possessive|E] [core_tenets|E] и [doctrines|E] отклонились от родительского [faith|E]. Идеология, которая принимает [prohibited_tenet_status|E] причины в качестве [core_tenet_status|E], более отклонена.\n\nВысокое отклонение ослабляет [fervor|E] родительской идеологии, делая вспышки [heresy|E] более частыми. Идеология, которая достигает #V 100#! отклонения, автоматически будет объявлена разветвляющейся и станет новой [faith|E]."
 game_concept_rite_knowledge: "Знания об идеологии"
 game_concept_rite_possessive: "Идеологии's"
 game_concept_rites: "Идеологии"
 game_concept_rites_possessive: "Идеологии'"
 game_concept_royal_court: "Личный офис"
 game_concept_royal_court_desc: "Известные [rulers|E] достаточно известны, чтобы содержать частный офис, который предоставляет доступ к различным бонусам и возможностям.\n\nКогда [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] или [GetGovernment( 'tribal_government' ).GetName] [ruler|E] становится [king|E] или [emperor|E], они получают доступ к своему частному офису.\n\nКаждый частный офис имеет [court_grandeur_level|E], который предоставляет преимущества в зависимости от того, насколько знаменит частный офис и какой [court_type|E] принадлежит этому офису.\n\nЗаявители, [vassals|E] и [courtiers|E] могут появляться в вашем частном офисе, или вы можете [hold_court|E] пригласить любого в [realm|E] для выражения своих жалоб.\n\nЧастный офис также позволяет правителю демонстрировать [court_artifacts|E], и [inspired|E] [guests|E] может появляться в частном офисе, предлагая создать новые [artifacts|E].\n\nКогда вы умрете, ваш [player_heir|E] унаследует ваш частный офис."
 game_concept_royal_courts: "Личные офисы"
 game_concept_sanctified_desc: "Освящение [artifact|E] делает его [holy_relic|E] для [faith|E]. Артефакт может быть освящен для нескольких идеологий."
 game_concept_scales_of_power_desc: "Во время [power_sharing|E] баланс сил между [liege|E] и их [diarch|E] измеряется на $game_concept_scales_of_power$. \n\nAs $game_concept_scales_of_power_scales$ наклоняется к $game_concept_diarch$, они открывают [diarch_powers|E] и могут увеличивать затраты к [diarch_affected_actions|E] Лидера Партии. \n\nAs они склоняются к $game_concept_liege$, но это облегчает Лидеру партии завершение [diarchy|E]. \n\nЗЗТо $game_concept_scales_of_power_scales$ можно замахнуть:\nZZ$EFFECT_LIST_BULLET$Uиграя $swing_scales_currency_interaction$ [character_interaction|E] против противоположной стороны\n$EFFECT_LIST_BULLET$As $game_concept_diarch$, хорошо служа вашему $game_concept_liege$ (пусть и цинично) в [mandate|E] событиях"
 game_concept_seasonal_prediction_desc: "Опытный $court_position_court_astrologer$ может предсказывать следующий [steppe_season|E] в регионе, предоставляя полезную информацию своему партийному лидеру для планирования следующих шагов."
 game_concept_seize_peripheral_duchy: "Захват периферийного региона"
 game_concept_settlement_issue_desc: "Вопросы урегулирования — это задачи, которые [nomad|E] [ruler|E] дают после завершения [migration|E] на новые земли. Они дают возможность решать конфликты и увеличивать местное [county_control|E] в новом [domain|E]. \n\nЗЗЗЗТы будут возникать в первые годы после миграции правителя, пока контроль над округом низкий."
 game_concept_short_reign_desc: "'Краткое правление' — это уменьшающийся [opinion|E] штраф, который все персонажи в [realm|E] получают от нового [liege|E].\n\nПодобным образом, подданные получают увеличивающийся [long_reign|E] бонус к Мнению с лидерами партии, которые правили ими долгое время."
 game_concept_shunned_desc: "Многие [rites|E] имеют [doctrines|E], которые обозначают определенные действия как Отверженные. В зависимости от конкретной Политической Позиции, эти действия могут также считаться [criminal|E].\n\nПерсонажи, пойманные на практике действий, которые их Идеология считает Отверженными, теряют [piety_level|E] и получают соответствующий [fame_trait|E]; эта Черта будет не нравится всем, чья Идеология считает такое поведение Отверженным или Преступным.\n\nПримеры Отверженных действий включают:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "Каждый [rite|E] считает определенные [traits|E] греховными. Персонажи с этими чертами получают [opinion|E] штрафы от всех персонажей, которые считают эти черты греховными, даже если они не разделяют ту же идеологию. Кроме того, персонажи, которые имеют черты, считавшиеся греховными их собственной идеологией, будут терять [piety|E] каждый месяц.\n\nКакие именно черты считаются грехами, варьируется от идеологии к идеологии, но обычно определяется комбинацией [core_tenets|E] этой идеологии и [religion|E], к которой эта идеология принадлежит."
 game_concept_spiritual_fulfillment: "Личное убеждение"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ показывает, насколько комфортно [character|E] с собственной политикой. Это поднимается и падает в зависимости от их [traits|E] и их поведения."
 game_concept_spiritual_fulfillment_level: "Уровень осуждения"
 game_concept_spiritual_fulfillment_level_desc: "[character_possessive|E] [spiritual_fulfillment|E] делится на $game_concept_spiritual_fulfillment_levels$, каждому из которых соответствуют свои эффекты."
 game_concept_spiritual_fulfillment_levels: "Уровни осуждения"
 game_concept_spiritual_head_of_faith: "Лидер духовного движения"
 game_concept_spymaster: "Главный кнут"
 game_concept_spymaster_desc: "$game_concept_spymaster$ — это [councillor|E], который следит за порядком в партии и знает все секреты каждого. Остерегайтесь нелояльного Главного организатора: он легко может скрыться или присоединиться к заговору против вас."
 game_concept_state_rite: "Государственная идеология"
 game_concept_state_rite_desc: "$game_concept_state_rite$ — это [rite|E], поддерживаемая и одобряемая [administrative_government|E]. Эта идеология относится к [title|E], а не к какой-либо конкретной [character|E]. Легче перевести персонажей в [realm|E] на государственную идеологию и очень трудно отвести их от неё.\n\nТолько [ruler|E] административной партии может изменить государственную идеологию, но [governors|E] могут свободно переходить на неё."
 game_concept_stationed_regiment_desc: "[men_at_arms|E] [regiment|E] получает бонусы к своей эффективности, если находится в [holding|E].\n\n[buildings|E] могут дополнительно увеличивать эти бонусы — иногда для любого типа Активистов, но чаще всего для одного или двух. Например, [GetBuilding('stables_01').GetName] даёт бонус для Активистов, находящихся в [light_cavalry|E] и [heavy_cavalry|E].\n\nВы можете размещать их в любое время, кроме как в период [war|E], или если Владение находится в [occupied|E]. Если Владение потеряно, все размещённые Активисты будут демобилизованы."
 game_concept_steward: "Канцлер казначейства"
 game_concept_steward_desc: "$game_concept_steward$ — это [councillor|E], отвечающий за экономику и [domain|E]: [taxation|E], расходы и [development|E]."
 game_concept_stewards: "Канцлеры казначейства"
 game_concept_stewardship: "Экономика"
 game_concept_stewardship_lifestyle: "Экономический образ жизни"
 game_concept_stewardship_skill: "Экономические навыки"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$ является [skill|E] по бюджетам, экономике и управлению делами. Это напрямую увеличивает [taxation|E], поэтому каждый лидер этого хочет.\n\nСоответствующий [lifestyle|E] это [stewardship_lifestyle|E]."
 game_concept_stewardship_task_contract: "Экономический контракт"
 game_concept_stewardship_task_contract_possessive: "Экономический контракт's"
 game_concept_stewardship_task_contracts: "Экономические контракты"
 game_concept_stewardship_task_contracts_possessive: "Экономические контракты'"
 game_concept_story_content_el_cid_desc: "#tooltip_heading Стиль сюжета: Light#!\n\nAs Эль Сид, вас ошибочно отвергнет лидер вашей группы. В изгнании вы можете выбрать остаться верным или найти свой путь, что в итоге завершится возвращением ко двору #EMP или#! высшей наградой — Валенсией.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading Стиль истории: Moderate#!\n\nAХасан будет направляться по пути религиозного фанатизма, выбирая место, чтобы принести свет Истинной Идеологии, и обратить [counties|E] из-под [rulers|E]. \nZZ\nE В конечном итоге ваша история завершится крупным религиозным восстанием против выбранного вами врага. \n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading Стиль сюжета: Light#!ZZ\n\nAs Temüjin вы отомстите враждебному племени, заключившему вашего супруга в тюрьму, и испытаете верность вашего ближайшего депутата и друга — Джамухи.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "Давление"
 game_concept_stress_desc: "Персонажи подвергаются $game_concept_stress$, когда действуют против своих [personality_traits|E]: верный рядовой депутат, голосующий против партийной дисциплины, честный министр, созданный для защиты плохой линии. \n\nКарактеры под достаточным давлением получают [stress_level|E], а последствия для здоровья сохраняются до тех пор, пока они снова не снимут его. \n\nЗТотойди подальше от Вестминстера и [activities|E] облегчить его."
 game_concept_stress_level: "Уровень давления"
 game_concept_stress_level_desc: "Каждые 100 [stress|E], которые накапливает персонаж, также вызывают увеличение уровня давления. Уровни давления варьируются от 0 до 3, при этом каждый уровень накладывает возрастающие штрафы на [fertility|E] и [health|E] персонажа.\n\nКроме того, пока у персонажа есть хотя бы 1 уровень давления, он уязвим к [mental_breaks|E]."
 game_concept_stress_levels: "Уровни давления"
 game_concept_stress_loss: "Потеря давления"
 game_concept_stressed: "Под давлением"
 game_concept_strong_vassal: "Сильный депутат на заднем плане"
 game_concept_strong_vassal_desc: "$game_concept_strong_vassal$ — это [vassal|E], который приближается к своему [liege|E] по силе или превышает его, подвергаясь штрафу [opinion|E]. #weak Они считают своего партийного лидера слабым и неподходящим для управления партией.#!"
 game_concept_strong_vassals: "Сильные рядовые депутаты"
 game_concept_struggle_involved_faith: "Вовлечённая идеология"
 game_concept_struggle_involved_faiths: "Вовлечённые идеологии"
 game_concept_struggle_persia_phase_unrest_desc: "Охваченный восстаниями и интригами, халифат рушится. Амбициозные военачальники и хитрые губернаторы стремятся захватить любую власть, которую могут узурпировать, постоянно ссорясь.\n\nСо временем, если ситуация не будет разрешена [ending_phase|E], партия вступит в фазу [struggle_persia_phase_stabilisation|E], когда отчаянные сторонники будут пытаться восстановить халифскую власть."
 game_concept_struggle_phase_desc: "$game_concept_struggle_phase_phase$ — это общее настроение, характерное для [struggle_involved|E] [characters|E] и [counties|E] внутри [struggle_region|E]. Оно отображает краткосрочные общественные тенденции и условности, временно доминирующие в диалоге [struggle|E].\n\n#weak Пример: в одной $game_concept_struggle_phase_phase$ жители $game_concept_struggle_region_region$ могут считать религиозную терпимость первостепенной, даже если остальная часть их идеологии с этим не согласна.#!"
 game_concept_supply_limit_desc: "$game_concept_supply_limit$ определяет количество [soldiers|E], которые вы можете иметь в [barony|E], как определено [terrain|E] и [development|E] Совета. \n\nЕсли общий размер вашего [army|E] превысит $game_concept_supply_limit$, ваши $game_concept_armies$ потеряют [supply|E] и в конечном итоге будут страдать от [attrition|E]."
 game_concept_temporal_head_of_faith: "Лидер временного движения"
 game_concept_tenet: "Причина"
 game_concept_tenet_desc: "В то время как [doctrines|E] представляют проблемы, по которым [rite|E] должен занять позицию, $game_concept_tenets$ отражают уникальные особенности и практики Идеологии."
 game_concept_tenet_knowledge: "Политические Знания"
 game_concept_tenet_knowledge_desc: "Политики не знают все тонкости мышления каждой другой идеологии.\n\nЗнание всех $game_concept_core_tenets$ и $game_concept_doctrines$ $game_concept_rite$ делает изменение мнения на неё проще.\n\nВсе [core_tenets|E] и [doctrines|E] собственной [faith|E] вам известны. Больше можно узнать от [spouses|E], [friends|E] и [activities|E]."
 game_concept_tenet_popularity: "Популярность причины"
 game_concept_tenet_popularity_desc: "По мере того как [personal_tenets|E] распространяется внутри [faith|E], их практика становится все более распространенной. $game_concept_tenet_popularity$ отслеживает, насколько широко [core_tenet|E] используется и влияет на вероятность того, что оно станет темой обсуждения в [ecumenical_council|E] или целью [papal_bull|E].\n\nЧем выше $game_concept_tenet_popularity$, тем больше [clergy|E] будет поддерживать дело, когда оно обсуждается в [ecumenical_council|E]. Когда дело достигает #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, [head_of_faith|E], скорее всего, объявит его [permitted_tenet_status|E] независимо от своих убеждений."
 game_concept_tenet_status: "Статус причины"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ — это [rite_possessive|E] позиция по [core_tenet|E] или [doctrine|E]. Существует пять возможных позиций:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — $game_concept_rite$ никогда не слышал об этом $game_concept_core_tenet$ или $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — $game_concept_rite$ осведомлен об этом и не вынес решения о его практике.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — $game_concept_rite$ одобряет эту практику.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — $game_concept_rite$ запрещает эту практику.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — $game_concept_rite$ как разрешает, так и активно продвигает $game_concept_core_tenet$.\n\nПозиция Идеологии определяет, можно ли выбрать $game_concept_core_tenet$ или $game_concept_doctrine$ при создании или отклонении $game_concept_rite$, и какие практики влекут духовные штрафы [followers|E].\n\nСтатус Причины отличается от [character_possessive|E] [tenet_knowledge|E], который является личным осознанием, а не общей позицией $game_concept_rite$."
 game_concept_tenets: "Причины"
 game_concept_the_christian_church_desc: "Христианская Церковь — это церковный орган, который наблюдает и направляет последователей Иисуса Христа, представленный как [situation|E], продвигающийся через последовательность [the_christian_church_chapters_short|E]. \n\nIание охватывают все [archdiocese|E] в мире; каждый [christian|E] [ruler|E] [county|E] ранга или выше, с любой частью своего [realm|E] внутри архиепархии, является членом, будь то партийные чиновники или светские."
 game_concept_theocratic_vassal: "Теократический задний рядовой депутат"
 game_concept_theocratic_vassal_desc: "Члены задней скамьи, которые имеют форму [theocratic_government|E].\n\nКак они функционируют определяется [faithpossessive|E] [doctrines|E]."
 game_concept_theocratic_vassals: "Теократические рядовые депутаты"
 game_concept_title_allegiance_desc: "[vassals|E] может быть предан определенному [title|E], а не лицу своего [liege|E]. Это возможно только если у титула есть собственный [succession_law|E]. В [succession|E] такие задние члены станут задними членами нового титула [holder|E]."
 game_concept_title_desc: "$game_concept_title$ по сути является сертификатом права собственности на землю.\n\nНаименьший земельный участок на карте — это [barony|E]. Департаменты организованы в более крупные области, называемые [counties|E]. Избирательные округа [de_jure|E] принадлежат [duchy|E], регионы к [kingdom|E], а нации к [empire|E].\n\nРегионы, нации и империи не всегда имеют [holder|E], но это титулы, которые может [created|E] правитель, контролирующий достаточное количество соответствующей территории."
 game_concept_title_men_at_arms: "Титульные активисты"
 game_concept_top_liege: "Премьер-министр"
 game_concept_top_liege_possessive: "Премьер-министра"
 game_concept_top_lieges: "Премьер-министры"
 game_concept_top_realm: "Лучшая партия"
 game_concept_torture_desc: "[imprisoned|E] Персонажи могут быть $game_concept_tortured$, повреждая их [health|E] или даже калеча их разными способами.\n\nПытки могут облегчить [stress|E] для [GetTrait('callous').GetName( GetNullCharacter )] и [GetTrait('sadistic').GetName( GetNullCharacter )] персонажей, но вызывают давление для персонажей с подобной природой.\n\nПытки [rulers|E] также могут увеличить ваш [dread|E]."
 game_concept_tour_stop_desc: "An [activity_phase|E] во время [royal_tour|E], в котором лидер группы может либо: посетить [hosted_dinner|E], [tour_the_grounds|E] своих [vassal|E], либо насладиться [cultural_festival|E]."
 game_concept_transfer_desc: "[rulers|E] может $game_concept_transfer$ одного из их [vassals|E] другому члену скамьи запасных, если первый имеет более низкий ранг, чем второй. Это хороший способ повышения [opinion|E] у члена скамьи запасных, особенно если переданный член скамьи запасных является [de_jure|E] частью их [realm|E]."
 game_concept_treasury_vassal_development: "Развитие задней скамьи"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ представляет собой общее влияние, которое [tribal|E] [ruler|E] оказывает на своих [vassals|E]. По сравнению с [crown_authority|E], оно обеспечивает меньше полномочий и на более поздних уровнях.\n\nСуществует четыре уровня $game_concept_tribal_authority$: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E] и [absolute_tribal|E]. Повышение $game_concept_tribal_authority$ требует определенного количества [prestige|E] в зависимости от уровня и [learning_skill|E] правителя, но обычно оно дороже, чем повышение королевской власти.\n\n#weak «Задние скамейки» не любят высокие уровни $game_concept_tribal_authority$, и понижение его является основной целью любой [liberty_faction|E].#!"
 game_concept_tribal_desc: "Племенные партии имеют ограниченный электорат [development|E], не могут продвигаться дальше Племенной Эры [innovations|E], не могут строить новые [holdings|E] и обычно не могут изменить свой [succession_law|E].\n\n Однако они могут использовать [prestige|E] вместо [gold|E] для создания своих партий и найма [men_at_arms|E], и имеют доступ к большему количеству [casus_belli|E] по сравнению с партиями [feudal|E]. Армии не племенных партий получают наказание [supply_limit|E] на враждебной племенной территории."
 game_concept_unassigned_vassal: "Неуложенные рядовые скамьи"
 game_concept_unassigned_vassals: "Неуложенные рядовые скамьи"
 game_concept_undirected_great_holy_war_desc: "$game_concept_undirected_great_holy_war$ объявляется $doctrine_spiritual_head_name$ [head_of_faith|E] с намерением подчинить [kingdom|E] правлению их [faith|E].\n\n$game_concept_undirected_great_holy_wars$ войны не начинаются сразу, вместо этого они входят в [preparation_phase|E].\n\n До и во время войны правители атакующей идеологии могут решать пожертвовать [gold|E] [war_chest|E].\n\n В случае победы целевая нация будет захвачена и передана персонажу атакующей идеологии. Награды для атакующих включают [piety|E] и, возможно, превращение их [dynasty|E] в [landed|E] в завоёванной Нации."
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] получите [battle|E] [advantage|E] в [counties|E] их идеологии."
 game_concept_usurp_title_desc: "[title|E], удерживаемый иностранным [ruler|E], обычно может быть Узурпирован, если более #V 50%#! его [de_jure|E] [counties|E] находятся в вашем [realm|E]. Этот процесс передает [title|E] вам, что особенно важно для того, чтобы вы были [rightful_liege|E] вашего [vassals|E].\n\nУзурпация сложнее, если текущий владелец [faith|E] враждебен вашему; в этом случае узурпация возможна только если владелец больше не обладает ни одним из [de_jure|E] [counties|E] внутри своей Партии."
 game_concept_varangian_adventure_desc: "Это особый тип [war|E], когда атакующий намерен переместить свои [realm|E] в [war_target|E] оптом.\n\nЕсли они побеждают, они сразу аннексируют соответствующие [counties|E] и переместят туда свои [capital|E]. Их старые задние банки станут независимыми, а их старые $game_concept_counties$ будут переданы местным восходящим военачальникам. $game_concept_varangian_adventures$ являются #EMP ТОЛЬКО#! доступными для [duke|E] и $game_concept_count$-[title_tier|E] [rulers|E], становясь постепенно более дорогими с каждой успешной $game_concept_varangian_adventure_adventure$.\n\nЭтот [casus_belli|E] #EMP НИКОГДА#! не будет доступен после $culture_era_tribal$ [era|E], и не может использоваться против других [cultures|E], которые могут $game_concept_varangian_adventure_adventure$, или против соседних $game_concept_rulers$.\n\n$north_germanic_group_collective_noun$Запуская свой первый $game_concept_varangian_adventure$, получают до [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] бонусных [special_troops|E], размер которых увеличивается с каждой полностью контролируемой одинаковой [faith|E] одинаковой [culture|E] избирательной единицей в пределах [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_vassal: "Член задней скамьи"
 game_concept_vassal_contract: "Контракт задней скамьи"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ диктует [obligations|E] между [vassal|E] и их [liege|E].\n\n Задние ряды [feudal|E], [clan|E], [administrative|E] и [nomadic|E] $game_concept_government_forms$ имеют доступ к разным [obligations|E], negotiated individually for each Backbencher.\n\n Все задние ряды платят процент от своего общего [taxes|E] и [levies|E] своему Лидеру партии, основываясь на их [obligations|E]. #EMP Эти [modifier_contributions|E] могут, в свою очередь, быть изменены параметрами 'мелкого шрифта', такими как [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\n Некоторые специальные контракты ограничены определенными Рангами:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] и [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] и выше\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] и выше\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: [count|E] только\n\n#weak Примечание, [governor|E] [obligations|E] также известны как [province_administrations|E].#!"
 game_concept_vassal_contracts: "Контракты задней скамьи"
 game_concept_vassal_desc: "$game_concept_vassal$ — это политик, который подчиняется другому: депутат своему [liege|E], лидер партии премьер-министру.\n\nБакбенчеры дают своему партийному лидеру [levies|E] и [taxes|E] — [obligations|E] — в обмен на кнут и поддержку. \n\nПа, [opinion|E] $game_concept_vassal$ лидера партии низкий, он может присоединиться к [factions|E] или [scheme|E] заменить его."
 game_concept_vassal_directive: "Директива задней скамьи"
 game_concept_vassal_directive_desc: "Как [liege|E], вы можете выдавать Директивы своим [vassals|E], влияя на их [councillor_tasks|E] и какие [buildings|E] они создают.\n\nЧтобы выдать Директиву, нужно её активировать, например, имея #P 50#! или более [opinion|E] с Задним скамейщиком. Продвинутые [government_forms|E] этого не требуют."
 game_concept_vassal_directives: "Директивы задней скамьи"
 game_concept_vassal_limit: "Лимит задней скамьи"
 game_concept_vassal_limit_desc: "$game_concept_vassal_limit$ определяет, сколько [direct_vassals|E] вы можете легально иметь (исключая [barony|E]-уровневых рядовых депутатов).\n\nХотя вы можете превысить свой $game_concept_vassal_limit$, это снизит [taxes|E] и [levies|E], которые предоставляют ваши рядовые депутаты, и вам, возможно, будет лучше [transferring|E] некоторых рядовых депутатов, чтобы оставаться в пределах лимита."
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ определяет, сколько [tax|E] и сколько [levies|E] [subject|E] предоставляет своим [suzerain|E]. [government_form|E] субъекта определяет, как изменяются их $game_concept_obligations$.\n\n#weak Например, [GetGovernment('feudal_government').GetName] и [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$ зависят от их [vassal_contract|E], [GetGovernment('administrative_government').GetName] Задние ряды зависят от их [province_administration|E], в то время как [tributary_possessive|E] зависят от их [tributary_contract|E]."
 game_concept_vassal_possessive: "Члена задней скамьи"
 game_concept_vassal_stance: "Позиция задней скамьи"
 game_concept_vassal_stance_desc: "Каждый [vassal|E] имеет позицию рядового члена, которая влияет на [opinion|E], который они имеют с вами как своим [liege|E], и на какой [heir|E] они предпочитают как преемника [realm|E].\n\nРядовые члены с одинаковой позицией будут любить и не любить одни и те же вещи. Например, все [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] рядовые члены не любят, когда вы теряете [wars|E].\n\nКаждая позиция рядового члена предпочитает одного конкретного наследника. После вступления в наследство каждый предпочитаемый наследник будет иметь более низкий [legitimacy_expectations|E] с рядовыми членами этой позиции.\n\n#low Позиции рядового члена следующие:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "Позиции задней скамьи"
 game_concept_vassal_taxes: "Налоги задней скамьи"
 game_concept_vassal_taxes_desc: "Ваши $game_concept_vassal_taxes$ состоят из [taxes|E], которые вы получаете от вашего [vassals|E]. Сумма зависит от [obligations|E] каждого рядового депутата.\n\nС точки зрения ваших рядовых депутатов, эти же налоги называются [liege_taxes|E], чтобы отличать их от любых $game_concept_vassal_taxes$, которые они собирают со своих $game_concept_vassals$."
 game_concept_vassals: "Члены задней скамьи"
 game_concept_vassals_possessive: "Членов задней скамьи"
 game_concept_victory_desc: "$game_concept_victory$ является одним из трёх возможных [peace_offers|E]. Конкретный исход Победы в [war|E] зависит от [casus_belli|E].\n\nДля Нападающего это обычно включает захват [titles|E] в регионе [war_target|E].\n\nДля Защитника Победа обычно означает, что нападающему придётся выплатить крупную сумму денег в качестве военной репарации."
 game_concept_virtue_desc: "Каждый [rite|E] считает определенные [traits|E] добродетельными. Персонажи с этими чертами получают [opinion|E] бонусы от всех персонажей, которые считают эти черты добродетельными, даже если они не разделяют ту же идеологию. Кроме того, персонажи, которые имеют черты, считавшиеся добродетельными их собственной идеологией, будут получать бонусные [piety|E] каждый месяц.\n\nКакие именно черты считаются добродетелями, варьируется от идеологии к идеологии, но обычно определяется комбинацией [core_tenets|E] этой идеологии и [religion|E], к которой эта идеология принадлежит."
 game_concept_virtue_weight_desc: "Характеристики могут иметь связанный [sin|E] или [virtue|E] вес, определяемый [core_tenets|E] и [doctrines|E] [rite|E], и [religion|E], которому они принадлежат.\n\nХарактеристики с наивысшим весом Греха или Добродетели внутри идеологии становятся [sins|E] и [virtues|E] этой идеологии."
 game_concept_wanderer_desc: "Персонажи, не принадлежащие к [court|E] и не имеющие [titles|e], называются Странниками. Они путешествуют по миру, посещая офисы как [guests|E] по пути. Странники могут становиться [mercenary|E] капитанами, лидерами [holy_orders|E], членами [clergy|E] или носителями [city|E]."
 game_concept_wanua_desc: "$wanua_government_adjective$ [government|E] имеет слабости, общие с [GetGovernment('tribal_government').GetNameWithIcon] [government|E], но также обладает сниженным [domain_limit|E] и [vassal_limit|E]. Хотя они используют [gold|E] для строительства [buildings|E] и набора [men_at_arms|E], они зарабатывают очень мало Средств от Зданий.\n\n Однако, они могут [barter_goods_i][barter|E], [raid|E] и имеют синергию с [GetGovernment('mandala_government').GetName] Правительством, так как получают [legitimacy|E] за то, что они являются [tributary|E]."
 game_concept_war_chest_desc: "$game_concept_war_chest$ — это собрание [gold|E], [piety|E] и [prestige|E]. Содержимое в основном используется в качестве награды за успешное завоевание [undirected_great_holy_wars|E], где оно делится между нападающими в зависимости от их участия в [war|E].\n\nЧасть содержимого $game_concept_war_chest$ также делится между нападающими при объявлении войны.\n\nЕсли [undirected_great_holy_war|E] будет побеждена, защитники поделят между собой часть Политического капитала и Профиля $game_concept_war_chest$ #weak (Средства теряются).#!"
 game_concept_winter_desc: "Зима постепенно истощает [supply|E] со временем, из-за чего армии теряют припасы, находясь в защите, затронутом Зимой. Штраф за снабжение увеличивается с каждой степенью тяжести. У зимы три разных степени тяжести; [Concept( 'winter_severity_mild', 'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E] и [Concept( 'winter_severity_harsh', 'Harsh' )|E]."
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ представляют собой уникальные улучшения для $game_concept_yurt$.\n\nМеханически они являются [domicile_buildings|E] — хотя многие представляют собой социальные обычаи или просто сферы внимания племени $game_concept_nomad$, а не буквальные сооружения.\n\nБонусы, которые они могут предоставлять, включают:\n$EFFECT_LIST_BULLET$ Разблокирование [court_positions|E] и кочевых [decisions|E] и [character_interaction|E]s\n$EFFECT_LIST_BULLET$ Различные бонусы к [herd|E] и [county_fertility|E], включая [terrain|E] специальные специализации\n$EFFECT_LIST_BULLET$ Разблокирование и улучшение кочевых [men_at_arms|E] и повышение силы [horde|E]\n$EFFECT_LIST_BULLET$ Уникальные кочевые [culture_tradition|E] бонусы\n$EFFECT_LIST_BULLET$ Способы управления вашими [vassals|E] и [tributaries|E], а также влияния на [characters|E] в вашем офисе.\n$EFFECT_LIST_BULLET$ Бонусы [kurultai|E] и [obedience|E]."
 maximum_piety_level_mandala: "\n\nОднако, когда [mandala|E] [ruler|E] умирает способом, приемлемым для их [aspect|E], после достижения [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], способность [heir|E] этого правителя развиваться до следующего уровня политического капитала сохраняется до достижения [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
