 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "Хотя рвению можно завидовать, мы также должны быть прагматичными, если хотим, чтобы наша идеология победила. Разве не разумнее сделать [target.GetNameNoTier] целью нашей священной войны?"
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "Я увидел ошибки своих поступков и, раскаявшись в своих проступках, прошу вас, пожалуйста, снять со меня церковное отлучение, чтобы я мог вновь присоединиться к своим братьям и сестрам по идеологии."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "\nЯ стараюсь быть хорошим [puppet_or_actor.GetFaith.GetAdherentName], но я не более совершенен, чем любой другой [actor.GetWomanMan]. Чтобы компенсировать мои спотыканья и неудачи, я желаю пожертвовать эту сумму средств Церкви.\n\nКроме того, я дам клятву воздерживаться от любого греха."
 RETRACT_VASSAL_PROPOSAL: "Я пришел к выводу, что ради блага [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip], [recipient.GetFullName] необходимо поставить в качестве рядового под моим прямым руководством."
