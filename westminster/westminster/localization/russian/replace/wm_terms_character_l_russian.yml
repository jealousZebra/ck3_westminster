 piety_level_6_desc: "$piety_level_6$ является шестым [piety_level|E]. Следующий уровень — [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L].\n\nКогда [mandala|E] [ruler|E] умирает способом, приемлемым для их [aspect|E], после достижения [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], [heir|E] этого Правителя получает возможность продвигаться до этого уровня Политической Столицы.\n\nЭффекты:\n[GetPietyLevelDesc('(int32)6')|=+]"
 piety_level_7_desc: "$piety_level_7$ является седьмым [piety_level|E]. Следующий уровень — [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L].\n\nКогда [mandala|E] [ruler|E] умирает приемлемым для их [aspect|E] способом, достигнув [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L], [heir|E] этого Правителя развивается способность продвигаться на этот уровень Политического Капитала.\n\nЭффекты:\n[GetPietyLevelDesc('(int32)7')|=+]"
 piety_level_8_desc: "$piety_level_8$ является восьмой и самой высокой возможной [piety_level|E] для [mandala|E] [government|E].\n\nКогда [mandala|E] [ruler|E] умирает в приемлемой для их [aspect|E] форме, достигнув [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L], [heir|E] этого Правителя разовьёт способность достичь этого окончательного уровня Политического Капитала.\n\nЭффекты:\n[GetPietyLevelDesc('(int32)8')|=+]"
