 celestial_bureaucracy_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Не-[governor|E] [vassals|E] не могут вести [war|E] против других Задних рядов, если они не используют [hook|E] на своем [liege|E]#!"
 celestial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Правители могут переключаться между всеми доступными [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Все Задние ряды, которые отказываются от отзыва титула или отказа от Заднего ряда, считаются [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! стоимость снижена"
 char_interaction.0001.desc: "Я принимаю ваше любезное предложение вассализации. Мой лидер партии!"
 char_interaction.0002.desc: "Мне не нужна ваша защита, и я предпочитаю оставить вознаграждение моей партии при себе."
 char_interaction.0010.a: "Мой лидер партии!"
 char_interaction.0090.from_ward.desc: "Боюсь, что моё образование в вашем офисе больше не соответствует моим потребностям. Я немедленно вернусь в [capital.GetNameNoTierNoTooltip]."
 char_interaction.0090.one_ward.desc: "Боюсь, что образование [ward.GetTitledFirstName] в вашем офисе больше не соответствует нашим потребностям. [ward.GetSheHe|U] немедленно возвращается на наше попечение."
 char_interaction.0090.two_wards.desc: "Боюсь, что образование [ward.GetTitledFirstName] и [ward_2.GetTitledFirstName] в вашем офисе больше не соответствует нашим потребностям. Они немедленно возвращаются на наше попечение."
 char_interaction.0180.desc: "Как глава вашего дома, я решил, что вы должны принять [puppet_or_actor.GetFaith.GetName], единственную истинную идеологию. Боюсь, у вас нет выбора в этом вопросе."
 char_interaction.0180.desc.liege: "Как лидер вашей партии, я требую, чтобы вы отказались от вашей ложной идеологии и присоединились ко мне как коллега- [puppet_or_actor.GetFaith.GetAdherentName], немедленно."
 char_interaction.0181.desc: "Очень хорошо, я приму идеологию [puppet_or_actor.GetFaith.GetAdjective], хотя будет странно оставить столь многое знакомое."
 char_interaction.0182.desc: "я никогда не откажусь от своей идеологии и вместо этого основу свой собственный дом!"
 char_interaction.0190.desc: "Очень хорошо, я приму идеологию [puppet_or_actor.GetFaith.GetAdjective], хотя будет странно оставить столь многое знакомое."
 char_interaction.0191.desc: "Моя идеология находится в основе моего существа — я никогда её не оставлю."
 char_interaction.0200.desc: "Я пришел к выводу, что вам нельзя доверять достоинство и ответственность [landed_title.GetName]. Поэтому я с этого момента лишаю вас этого звания ради блага партии."
 char_interaction.0211.desc: "Я искренне ценю ваше щедрое предложение сделать [secondary_recipient.GetShortUIName] моим рядовым депутатом, но боюсь, что вынужден отказаться."
 char_interaction.0220.desc: "Я принимаю ваше отречение от моего депутата-задворки, [secondary_recipient.GetShortUIName], хотя считаю это несправедливым."
 char_interaction.0221.desc: "Я не могу предать клятву верности [secondary_recipient.GetShortUIName]. Я защищу моего депутата-задворки, даже если это означает нарушение клятвы, данной вам."
 char_interaction.0232.liege: "я не буду стоять сложа руки, пока наш партийный лидер злоупотребляет [actor.GetHerHis] лояльных рядовых депутатов. Я призываю вас присоединиться ко мне в борьбе за свержение этого тирана."
 char_interaction.0232.regent: "я не буду стоять сложа руки, наблюдая, как [actor.GetSheHe] злоупотребляет [ceremonial_liege.GetTitledFirstNamePossessive] верных рядовых депутатов. Я призываю вас присоединиться ко мне в борьбе за свержение этого тирана."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nЯ был хорошим коллегой с задней скамьи для вас, но вы, безусловно, понимаете, что у меня тоже есть свои подданные!\n\nМой текущий контракт очень ограничителен, вы, несомненно, увидите разумность в том, чтобы сделать его более мягким?\n\nИ, к тому же, вы #emphasis действительно должны мне!#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nВ знак признания наших даров и уважения к [recipient.GetPrimaryTitle.GetNameNoTooltip], я прошу вас почтить это преданность, предоставив [SCOPE.Custom('CelestialTributaryRequest')].\n\nПусть эта услуга укрепит гармонию между вашим троном и нашей скромной партией."
 char_interaction.0271.desc: "По полномочиям, предоставленным мне [intermediary.GetTitledFirstName], я исправляю некоторые незначительные несоответствия в границах партии.\n\n Вам приказано передать вассалитет [intermediary.GetTitledFirstName] законному лидеру партии [intermediary.GetHerHis]. Мне."
 char_interaction.0272.desc: "Вы превышаете полномочия, но я не могу устоять перед должностью моего [intermediary.GetTitleAsName], даже если это только #EMP вы#! её исполняете.\n\nЯ принимаю ваше изъятие моего сторонника."
 char_interaction.0273.desc: "я дал клятву защищать своих рядовых депутатов, включая от нападений таких, как #EMP you#!.\n\nYвы можете выигрывать [intermediary.GetTitledFirstName] и [intermediary.GetHerHis] земли у меня в бою или скрыться обратно в какую-то [recipient.GetFaith.random_GoodGodNames] заброшенную дыру, в которую спрятались."
 char_interaction.0282.desc: "В отличие от моих поступков, ваши требования — преступление. \n\nЗФради блага партии я подчинюсь, но знайте, что не забуду это оскорбление."
 char_interaction.0291.a: "Я уверен, что мой лидер партии знает лучше всех."
 char_interaction.0291.desc.negative: "Ты не можешь #EMP ничего сделать? #!? Самый медленный простачок страны может понять, что [recipient.GetTitledFirstName] не то, на чём стоит сосредоточиться. Хватит запугивать лучших рядовых депутатов и делай свою работу."
 char_interaction.0370.a.herder: "Мне следовало сохранить единство моей партии."
 church_authority_0: "Автономные партийные чиновники"
 church_authority_0_effects_not_in_prev: "#weak Духовные рядовые предоставляют [levies|E] и [taxes|E], но сохраняют широкую автономию.#!"
 church_authority_2_effects: "$EFFECT_LIST_BULLET$Правители могут установить теократию [dynasty|E]\n$EFFECT_LIST_BULLET$[vassals|E] не могут вести [war|E] против других парламентских членов, если они не используют [hook|E] на их [liege|E]\n$EFFECT_LIST_BULLET$Парламентских членов [titles|E] нельзя наследовать персонажам за пределами [realm|E]\n$EFFECT_LIST_BULLET$Все парламентские члены, которые отказываются от отзыва титула или отречения, считаются [criminals|E]\n$EFFECT_LIST_BULLET$A [christian|E] [head_of_faith|E] могут использовать [GetDecision('enact_a_bull_decision').GetName] [decision|E] для объявления [great_holy_war|E]\n$EFFECT_LIST_BULLET$Может использовать [GetDecision('pam_establish_theocratic_dynasty_decision').GetName] [decision|E]\n$EFFECT_LIST_BULLET$[subordinates|E] и светские [rulers|E] легче [puppet|E]"
 church_claim_de_jure_liege_modifier: "Претендовал на титул де-юре рядового парламентария"
