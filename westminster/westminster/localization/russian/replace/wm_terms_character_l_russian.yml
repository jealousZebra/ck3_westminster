 ally_at_court_opinion: "Союзник в офисе"
 backwater_county_modifier_desc: "Чем больше они, тем больнее падение. Этот округ, когда-то территория непримиримых правителей Эллады, к сожалению, пал в бесчестие. Современный, лишь тень своего прошлого, этот округ может вновь добиться величия.\n\n#X @warning_icon! Этот модификатор можно удалить, используя [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] после того, как [development|E] этого [county|E] достигнет #V 50#! или более!#!\n\n"
 barons_and_minor_landholders_disapproves_baron_revocations_opinion: "[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName] Не одобряет отзыв опеки"
