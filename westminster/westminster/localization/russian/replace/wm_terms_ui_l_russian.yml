 action_shift_privileges_label: "[gold_i] Вы можете украсть средства, принадлежащие вашим [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, как [actor.GetLiege.GetDiarchTitle]"
 action_station_men_at_arms: "@stationed_regiment_icon! Активистов можно назначать"
 action_station_men_at_arms_HELP: "\n\n#help Вы должны разместить своих самых мощных [men_at_arms|E] в [holdings|E] с [buildings|E], которые повышают их эффективность.\n\n Специализация одной или двух ваших владений для значительного увеличения силы определенных типов активистов может помочь вам в [wars|E].#!"
