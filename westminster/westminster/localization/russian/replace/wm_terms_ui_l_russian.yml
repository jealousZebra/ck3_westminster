 action_above_domain_limit_desc: "Вы находитесь на [actor.GetDomainLimitOverrunWithoutGracePeriod|V] [holdings|E] выше вашего [domain|E] лимита в [actor.GetDomainLimit|V], что уменьшит ваши [taxes|E] и [levies|E].\n\n#help Как [ruler|E], вы можете владеть ограниченным количеством владений. Остальные владения в вашем [realm|E] должны находиться у вашего [vassals|E].\n\n Вы должны передать часть своих [titles|E] с владением другим. [courtiers|E] и [guests|E] — хороший выбор, так как они будут слабы. Существующие рядовые депутаты также могут принимать титулы, но тогда они станут сильнее и могут представлять угрозу в будущем!#!"
 action_above_vassal_limit_click: "#I Нажмите, чтобы показать ваших рядовых #!"
 action_above_vassal_limit_desc: "Вы находитесь на [actor.GetVassalLimitOverrun|V] [direct_vassals|E] выше вашего лимита рядового депутата [actor.GetVassalLimit|V], что уменьшит [taxes|E] и [levies|E], получаемые от вашего [vassals|E].\n#help Каждый [ruler|E] может контролировать только определенное количество прямых рядовых депутатов. Вместо того чтобы иметь их в качестве прямых рядовых депутатов, их следует назначить одним из ваших других рядовых депутатов. Для этого передайте одного из ваших рядовых депутатов другому рядовому депутату.#!"
 action_accolade_can_spend_attribute_click: "#I Нажмите, чтобы просмотреть организаторов#!"
 action_appoint_tax_collector_desc: "Вы не облагаете налогом ваш [clan|E] [vassals|E].\n\n#help [tax_collectors|E] отвечают за сбор [levies|E] и [gold|E] с ваших Клана Backbenchers. Вы должны назначить $game_concept_tax_collector$ и распределить [taxpayers|E] к вашему [tax_jurisdictions|E].#!"
 action_appoint_tax_collector_label: "@tax_collector_icon! Вы не облагаете налогом своих рядовых депутатов"
 action_ask_for_pardon_desc: "В данный момент вы рассматриваетесь как [criminal|E] вашим [top_liege|E], но [recipient.GetSheHe] может предоставить вам помилование.\n\n#help Если вы Преступник, ваш лидер партии может [imprison|E] вас в любое время! Хотя это может стоить вам [hook|E], обычно лучше попытаться получить помилование.#!"
 action_assign_tax_payers_desc: "Вы не облагаете налогом ваш [clan|E] [vassals|E].\n\n#help [tax_jurisdiction|E] с [tax_collector|E], но без [taxpayers|E] не принесет никаких [gold|E] или [levy|E] взносов. Назначьте Клана Backbenchers как $game_concept_taxpayers$ для сбора $game_concept_taxes$ с них.#!"
 action_can_ask_hof_for_claim: "@hof_icon! Вы можете попросить лидера движения о претензии"
 action_can_ask_hof_for_claim_combined_group_label: "@hof_icon! Вы можете попросить лидера движения о претензиях"
 action_can_ask_hof_for_claim_combined_group_name: "@hof_icon! Ваш лидер движения предоставит претензии"
 action_can_ask_hof_for_claim_label: "@hof_icon! Ваш лидер движения, [secondary_recipient.GetUINameNoTooltip], предоставит претензии на [target_title.Custom('GetTierIcon')][target_title.GetNameNoTooltip]"
 action_can_ask_hof_for_money: "@gold_icon!Вы можете попросить Вашего лидера движения о средствах"
 action_can_choose_dynasty_perk_desc: "У вас достаточно [dynasty_prestige|E], чтобы открыть [dynasty_perk|E] для вашего [dynasty|E].\n\n#help Как [dynast|E] вы можете тратить Партийный Бренд на действия в отношении ваших соучастников Династии, но Наследия — это долгосрочные бонусы для всей вашей Династии.#!"
 action_can_claim_liege_title: "@titles_icon! Вы можете претендовать на титул лидера вашей партии"
 action_can_claim_liege_title_desc: "Вы контролируете большинство [counties|E], которые [de_jure|E] одному из ваших [liege_possessive|E] [titles|E]. Это значит, что вы можете потратить [prestige|E], чтобы получить на него [unpressed_claim|E]!\n\n#help Наличие необъявленного претендентства на титул более высокого уровня дает вам возможность повысить свой ранг. Вы можете использовать его, чтобы начать [claimant_faction|E] или просто объявить [war|E] напрямую своему лидеру партии для этого.#!"
 action_can_claim_liege_title_label: "@titles_icon! Вы можете претендовать на титул лидера вашей партии"
 action_can_create_head_of_faith_title_click: "#I Нажмите, чтобы просмотреть идеологию#!"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help Создавая титул лидера движения, вы также становитесь [temporal_head_of_faith|E]!#!"
 action_can_demand_payment_desc: "Вы можете потратить [hook|E], которые у вас есть, на [recipient.GetUIName], чтобы потребовать от них оплату [gold|E].\n\n[recipient.GetSheHe|U] в настоящее время имеет @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! средств, которые вы можете потребовать.$action_can_demand_payment_HELP$"
 action_can_find_secrets_HELP: "\n\n#help Здесь показаны только те [vassals|E], кто является держателями 10 самых высоких [title_tier|E] [titles|E], так как они являются самыми важными целями, но вы можете нацеливаться на любого депутата-заднекамерника вашего [liege|E].#!"
 action_can_make_clerical_puppet: "@theological_agent_puppet_icon! Священник партии может быть управляемым"
 action_can_ransom_desc: "Вы можете выкупить ваш [prisoner|E], [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUIName] за [gold|E].\n\n[recipient.GetSheHe|U] в настоящее время имеет @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! средств, которые вы можете потребовать.$action_can_ransom_HELP$"
 action_can_request_preach_legitimacy: "@legitimacy_icon! Проповедовать мандат"
 action_can_request_preach_legitimacy_combined_group_label: "@legitimacy_icon! Проповедовать мандат"
 action_can_request_preach_legitimacy_help_desc: "\n\n#help [legitimacy|E] [rulers|E] зависит от одобрения [actor.GetFaith.HighGodNamePossessive], и только через партийных руководителей можно узнать одобрение [actor.GetFaith.HighGodNamePossessive].#!"
 action_can_request_preach_legitimacy_label: "@legitimacy_icon!Ваш мандат может быть улучшен с помощью [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip]"
 action_can_train_knights_contract: "Вы можете обучать Организаторов для выполнения Контракта"
 action_convert_at_war_interaction_click: "#I Нажмите, чтобы принять их идеологию#!"
 action_convert_at_war_interaction_desc: "Вы можете конвертироваться в [faith|E] [recipient.GetShortUIName], чтобы прекратить [recipient.GetHerHis] [holy_war|E] против вас.\n\n#help Хотя прекращение проигрывающей войны полезно, имейте в виду, что члены вашей бывшей Идеологии потеряют [opinion|E] по отношению к вам!#!"
 action_convert_at_war_interaction_label: "@religious_icon! Вы можете перейти к идеологии нападателя"
 action_county_in_dangerous_populist_faction: "@faction_icon! Избирательный округ в популистском движении"
 action_county_in_dangerous_populist_faction_click: "#I Нажмите, чтобы просмотреть избирательный округ#!"
 action_county_in_dangerous_populist_faction_combined_group_description: "Крестьяне в нескольких ваших округах объединились в [popular_faction|E] против лидера вашей партии.\n\nУвеличьте [county_opinion|E] этих округов или рискуете полностью их потерять, когда они представят свои требования!"
 action_county_in_dangerous_populist_faction_combined_group_label: "@faction_icon! Избирательные округа в Популистском движении"
 action_county_in_dangerous_populist_faction_desc: "[landed_title.GetNameNoTooltip] присоединился к [popular_faction|E] против лидера вашей партии. \n\nЗКоберни [county_opinion|E] этого округа, иначе рискуй потерять его, когда фракция выдвинет свои требования!"
 action_county_in_dangerous_populist_faction_label: "@faction_icon! [landed_title.GetNameNoTooltip] в Популистском Движении"
 action_empty_accolade_slot_click: "#I Нажмите, чтобы просмотреть ваших организаторов#!"
 action_empty_accolade_slot_unimportant: "@warning_icon! #X Организатор также может быть допустимым преемником для существующей награды"
 action_ep3_can_ask_hof_for_influence: "@influence_icon! Вы можете попросить лидера движения о влиянии"
 action_ghw_participation_alert_desc: "Вы не пожертвовали [gold|E] и не пообещали [armies|E] предстоящему [actor.GetFaith.GHWName]. \n\n#help Если вы не пожертвуете ни средства, ни солдат на военные усилия, ваша [head_of_faith|E] осудит вас, и вы потеряете [piety|E]. #!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon! Может назначить рядового депутата законным лидером партии"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] те, кто не является вашим законным лидером партии, дают вам меньше ресурсов и имеют сниженное [opinion|E] к вам. Иногда лучше предоставить этих задних скамеек их законному лидеру партии, предположив, что они также являются вашей задней скамейкой.\n\nИногда предоставление задней скамейки их законному лидеру партии означает, что вы зарабатываете меньше, но обычно стоит всё равно предоставить их – их законный лидер партии получит серьёзный штраф к вашему отношению за удержание задней скамейки, которую он считает своей.\n\nПоддержание хорошей структуры задней скамейки является ключом к стабильной партии.#!"
 action_grant_vassal_to_rightful_liege_click: "#I Нажмите, чтобы дать рядовому члену #!"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! Может назначать рядовых депутатов законным лидером партии"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Рядовые депутаты могут быть назначены их законному лидеру партии"
 action_has_any_display_cb_on_HELP: "\n\n#help Если ваша армия и [allies|E] сильнее, чем у врага, война может быть очень полезной. Вы можете захватить [titles|E], расширить свои [realm|E] и заработать [prestige_experience|E].\n\n Однако войны дорогостоящие, особенно если вам придется признать [defeat|E]. Амбициозные соседи могут воспользоваться ослабленной Партией.#!"
 action_has_courtier_or_guest_with_inspiration_desc: "Один из ваших сотрудников или гостей имеет [inspiration|E] и может быть спонсирован для создания [artifact|E]"
 action_has_courtier_or_guest_with_inspiration_label: "Один из ваших сотрудников или гостей имеет [inspiration|E]"
 action_has_open_court_event: "Событие возобновления работы"
 action_has_open_court_event_label: "У вас незавершенное событие в офисе."
 action_has_unopened_court_event: "офисное мероприятие доступно"
 action_has_unopened_court_event_label: "У вас новое событие в офисе."
 action_in_debt_desc: "У вас меньше [gold_i|E]#V 0#! [gold|E], поэтому вы в [debt|E]! \n\nБББжи в долгах имеет следующие эффекты:\n$BULLET_WITH_TAB$Каннот Объявить [war|E]\n$BULLET_WITH_TAB$Канноне не усиливать [men_at_arms|E], требующих [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] спредов в вашем [domain|E]\n$BULLET_WITH_TAB$[vassals|E], с большей вероятностью присоединятся к [factions|E]\n\nЗЗчем глубже вы погружаетесь в долги, тем суровее будут наказания, которые вас ждут. Ваш текущий уровень долга имеет следующие дополнительные эффекты:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Если вы не зарабатываете деньги каждый месяц, рассмотрите возможность снижения расходов, например: \n$BULLET_WITH_TAB$До-бэндинг вашего [armies|E]\n$BULLET_WITH_TAB$Па_Обучая размер — или уничтожая — ваш [men_at_arms|E]ZZ\n$BULLET_WITH_TAB$Increasing [control|E] using your [marshal|E]\n$BULLET_WITH_TAB$Росмысление [court_positions|E]#!"
 action_in_debt_landless_desc: "У вас меньше [gold_i|E]#V 0#! [gold|E], поэтому вы в [debt|E]! \n\nБжи в долгах имеет следующие последствия:\n$BULLET_WITH_TAB$Канно не объявить [war|E]\nZZ$BULLET_WITH_TAB$а, не укрепляйте [men_at_arms|E] с помощью [gold_i|E]ZZ[gold|E]ZZ\n\nЗЗКа, чем глубже вы погружаетесь в долги, тем суровее будут наказания. Ваш текущий уровень долгов имеет следующие дополнительные эффекты:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Рассмотрите возможность [task_contract|E] для заработка#!"
 action_landless_admin_escape_to_realm: "Побег в другую партию"
 action_landless_admin_escape_to_realm_desc: "Вы являетесь безземельным [noble_family|E] [title|E] [holder|E] под [liege|E] с другим [government|E]\n\n#help Вы можете попросить других [independent_rulers|E] с вашим [government|E] стать вашим новым лидером партии и переместить ваш [domicile|E] к их [capital|E]#!"
 action_legal_meddling: "Приобретайте притязания внутри Партии Лидера как [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_combined_group_label: "@unpressed_claim! Вы можете подделывать претензии внутри партии вашего лидера как [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_label: "@unpressed_claim! Вы можете претендовать на округа, которыми владеют ваши [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, как [actor.GetLiege.GetDiarchTitle]"
 action_low_control_in_county: "@control_icon! Низкий контроль избирателей в [landed_title.GetNameNoTierNoTooltip] #low ([landed_title.GetCountyData.GetControl|0]/100)#!"
 action_low_control_in_county_HELP: "\n\n#help Вы можете назначить своего [marshal|E] на задание [increase_control|E], чтобы увеличить контроль над округом.#!"
 action_low_control_in_county_combined_group_label: "@control_icon! Низкий контроль в избирательных округах"
 action_no_mandala_decree_desc: "Вы не выбрали [mandala_decree|E]\n\n#help Пусть ваш указ поможет направить вашу [subjects|E], а значит и вашу Партию, в нужном направлении. #!"
 action_not_rightful_liege: "Не является законным лидером партии [recipient.GetShortUINameNoTooltip]"
 action_not_rightful_liege_combined_group_description: "Вы не являетесь [rightful_liege|E] для нескольких ваших Backbenchers.\n\n Проверьте, можете ли вы [create|E] или [usurp|E] титулы, которые сделают вас их [de_jure|E] [liege|E]; это улучшит их [opinion|E] к вам, а также увеличит [taxes|E] и [levies|E], которые вы от них получаете.\n\n Если это невозможно, вы можете рассмотреть возможность [transferring|E] их другому из ваших Backbenchers, особенно если этот Backbencher станет их [rightful_liege|E]."
 action_not_rightful_liege_combined_group_label: "Не является законным лидером партии среди рядовых депутатов"
 action_not_rightful_liege_desc: "Вы не являетесь [rightful_liege|E] вашего [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nВам следует проверить, можете ли вы [create|E] или [usurp|E] титул, который сделает вас [recipient.GetHerHis] [de_jure|E] [liege|E]; это улучшит [recipient.GetHerHis] [opinion|E] относительно вас, а также увеличит [taxes|E] и [levies|E], которые вы получаете от [recipient.GetHerHim].\n\nЕсли это невозможно, вы можете рассмотреть возможность [transferring|E] их другому из ваших задних депутатов, особенно если этот задний депутат будет их [rightful_liege|E]."
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! Влиятельный депутат ожидает позиции [GetPlayer.Custom( 'GetCouncilConcept' )]"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help Вам следует рассмотреть возможность предоставления влиятельным членам заднего ряда позиции [GetPlayer.Custom( 'GetCouncillorConcept' )|E]. В противном случае их [opinion|E] будет снижена, и они могут присоединиться к [faction|E] против вас.\n\n Однако не все обладают достаточным уровнем [skills|E], чтобы быть полезными, а если ваш [rank|E] достаточно высок, может оказаться, что влиятельных членов заднего ряда просто больше, чем мест в [GetPlayer.Custom( 'GetCouncilConcept' )|E].#!"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! Влиятельные депутаты ожидают позиции [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )]"
 action_powerful_vassal_not_on_council_label: "@powerful_vassal_icon! Ваш влиятельный депутат, [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip], ожидает [GetPlayer.Custom( 'GetCouncilConcept' )|E] позицию ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_promote_foreign_legend_desc: "Вы можете продвинуть чужой [legend|E].\n\n#help [legends|E] полезны для получения [legitimacy|E], [dynasty_prestige|E], [prestige|E], [piety|E], [traits|E] и [claims|E]. [legend|E] распространился в вашей партии, получайте награды, поддерживая его."
 action_regent_retract: "Отозвать заднего рядового как [actor.GetLiege.GetDiarchTitle]"
 action_regent_retract_combined_group_label: "@vassal_icon! У вас есть рядовые депутаты, которые можно отступить по мере того, как [actor.GetLiege.GetDiarchTitle]"
 action_regent_retract_label: "@vassal_icon! Вы можете отозвать рядовых депутатов из ваших [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, как [actor.GetLiege.GetDiarchTitle]"
 action_shift_privileges: "Воровать средства у других рядовых депутатов в качестве [actor.GetLiege.GetDiarchTitle]"
