 doctrine_parameter_spiritual_head_of_faith: "Позиция [head_of_faith|E] предоставлена видному члену партии"
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "Если у Идеологии есть [great_holy_wars|E], Лидер Движения имеет право направлять войну и выбирать, кто будет целью войны."
 doctrine_pilgrimage_encouraged_desc: "Эта идеология поощряет своих членов посещать земные места, считающиеся духовно значимыми, чтобы проявить почтение к [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_forbidden_desc: "Присутствие [ROOT.Faith.HighGodName] ощущается повсюду, и мысль о том, что некоторые места более божественны, чем другие, ни что иное, как раскол."
 doctrine_pilgrimage_local_rites_desc: "Сторонники этой идеологии предпочитают комфорт и стабильность привычных ритуалов в местных святилищах опасностям и стрессу длительных паломничеств."
 doctrine_pilgrimage_local_rites_name: "Местные идеологии"
 doctrine_pluralism_fundamentalist_desc: "Наша идеология — единственная истинная идеология, наше слово — единственное истинное слово. Любое отклонение от [ROOT.Faith.ReligiousText] по сути является кощунством."
 doctrine_sacraments_absent_desc: "Эта традиция не делает акцент на таинствах или формальной системе священных идеологий. Религиозная жизнь не строится на ритуальном проведении партийными чиновниками или важности конкретных церемоний."
 doctrine_sacraments_general_desc: "Идеология придаёт центральное значение таинствам и священным идеологиям. Ритуалы не просто символичны, но вызывают присутствие божественного. Они проводятся партийными чиновниками, а верующие могут быть отлучены от церкви."
 doctrine_spiritual_head_desc: "Физический мир и духовный мир не похожи. Мы должны обеспечить духовному миру собственного лидера, чтобы он направлял нас и защищал нашу идеологию от осквернения физическими желаниями."
 doctrine_status_mainline: "Основная политическая позиция"
 doctrine_status_rite: "Политическая позиция идеологии"
 doctrine_status_rite_mainline: "Основная политическая позиция"
 doctrine_temporal_head_desc: "Духовное и физическое неразрывно связаны, цело и неотделимо. Глупо иметь двух разных лидеров для одной партии."
 doctrine_theocracy_lay_clergy_desc: "Любой преданный последователь более чем способен понять, следовать и проповедовать позиции нашей идеологии."
 doctrine_theocracy_lay_clergy_name: "Ложные должностные лица партии"
 doctrine_theocracy_temporal_desc: "Только санкционированным [ROOT.Faith.PriestNeuterPlural] можно доверить соблюдение политических позиций нашей идеологии и, соответственно, управление и заботу о наших святых местах."
 doctrine_theocracy_temporal_descriptive_name: "Теократические партийные чиновники"
