 pagan_hostility_doctrine_desc: "Следующие политические лагеря являются языческими:\n[GetReligionFamily('rf_pagan').GetReligions]"
 prophecy_of_malachi_desc: "Согласно традиционной еврейской политической позиции, новый первосвященник может быть назначен либо с приходом Пророка, либо если найдётся потомок Аарона, способный служить священником."
 sinitic_hostility_doctrine_desc: "Следующие политические лагеря являются синскими:\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_doctrine_ecumenical_miaphysite_desc: "Несмотря на отдельные иерархии, миафизитские церкви остаются в полном общении, признавая таинства и партийных чиновников друг друга."
 special_doctrine_full_tolerance_desc: "Everyone is free to chose their own ideology. Our differences do not divide us, they make us stronger."
 special_doctrine_is_christian_faith_desc: "В мире есть те, кто придерживается учения Иисуса, не признавая его божественности. Хотя это и кощунственно, мы всё равно должны проявлять сострадание к этим заблудшим душам, ведь они могут однажды стать верниками истинной идеологии."
 special_doctrine_is_eastern_faith_desc: "Вместе нас связывает не одна идеология, а множество идеологий, составляющих религиозную ткань нашего общества. Хотя мы можем называть себя разными именами и следовать разным путям, некоторые из людей вне нашей собственной системы верований научились сосуществовать в нашем обществе так, как если бы они были своими."
 special_doctrine_not_allowed_to_hof_desc: "Верховенство этой идеологии полностью разрушено. Любые попытки назвать Верховного Жреца потребуют, прежде всего, тщательной реконструкции традиционной структуры церкви."
 toggle_challengers_view_tt: "#T Претенденты#!\n\n#I Нажмите, чтобы просмотреть претендентов для этой идеологии#!"
 unreformed_faith_doctrine_desc: "Нереформированная идеология лишена организованных партийных чиновников и установленных канонических политических позиций; разные общины могут номинально следовать одной и той же идеологии, имея при этом совершенно разные религиозные практики и верования."
 unreformed_faith_doctrine_descriptive_name: "Нереформированная идеология"
 unreformed_faith_name: "позиция политики"
 witchcraft_illegal_name: "Политическая позиция по уголовному колдовству"
 witchcraft_shunned_name: "Отвергнутая позиция по колдовству"
