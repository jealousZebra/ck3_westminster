 baggage_train_01_domicile_building: "Боевой автобус"
 baggage_train_01_domicile_building_desc: "Минивэн, навигационная система и багажник, полный листовок: кампания идет туда, где находятся избиратели."
 baggage_train_ample_steeds_domicile_building: "Запасные микроавтобусы"
 baggage_train_ample_steeds_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nКогда один ломается на объездной дороге, другой уже в пути."
 baggage_train_ascetics_domicile_building: "Политические Волонтеры"
 baggage_train_ascetics_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nУволенные госслужащие и усердные студенты, которые прочтут весь белый документ, чтобы вам не пришлось."
 baggage_train_bartering_grounds_domicile_building: "Лавка с товарами"
 baggage_train_bartering_grounds_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nКружки, сумки-тоут и значки: сторонники платят за вашу рекламу."
 baggage_train_kennel_domicile_building: "Офисная собака"
 baggage_train_kennel_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('baggage_train_01').GetName])#!\nХорошо для морали, лучше для фотосессий."
 baggage_train_negotiators_domicile_building: "Менеджеры репутации"
 baggage_train_negotiators_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nA плохой заголовок — это проблема; плохой заголовок, на который никто не ответил, — это кризис."
 baggage_train_pleasure_tents_domicile_building: "Личные офисы"
 baggage_train_pleasure_tents_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nA дверь, которая закрывается. Старшие сотрудники ценят это больше, чем повышение зарплаты."
 baggage_train_porters_domicile_building: "Грузовой фургон"
 baggage_train_porters_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('baggage_train_01').GetName])#!\nПеревоз всей офиса в новый город занимает выходные, а не месяц."
 baggage_train_proof_of_claims_domicile_building: "Файл рекомендаций"
 baggage_train_proof_of_claims_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('baggage_train_01').GetName])#!\nПисьма поддержки от советников, профсоюзных отделений и местных влиятельных лиц, готовые к показу."
 baggage_train_ransom_cages_domicile_building: "Комната ожидания"
 baggage_train_ransom_cages_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nГде неловкие посетители ждут, пока кто-то старший придёт, чтобы с ними разобраться."
 baggage_train_scribes_domicile_building: "Пресс-офицеры"
 baggage_train_scribes_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nПресс-релизы, письма в редакцию и заявления, подготовленные ещё до того, как кто-либо запросит."
 baggage_train_shrine_domicile_building: "Тихая комната"
 baggage_train_shrine_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nМесто для молитвы, размышлений или просто чтобы на десять минут отойти от телефонов."
 baggage_train_siege_engineers_domicile_building: "Цифровая команда"
 baggage_train_siege_engineers_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('baggage_train_01').GetName])#!\nЦеленаправленная реклама, списки рассылки и панель мониторинга, которая обновляется каждые десять минут."
 baggage_train_trackers_domicile_building: "Обход данных"
 baggage_train_trackers_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('baggage_train_01').GetName])#!\nКаждая открытка, каждое намерение избирателя: кампания знает, куда идти дальше."
 barber_tent_01_domicile_building: "Комната благополучия"
 barber_tent_01_domicile_building_desc: "Диван, чайник и аптечка: место для добровольцев, чтобы восстановиться после порога."
 barber_tent_dentists_tools_domicile_building: "Охрана труда"
 barber_tent_dentists_tools_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('barber_tent_01').GetName])#!\nA медсестра на вызове и правильная политика по перерывам. Волонтёры замечают."
 barber_tent_morticians_tools_domicile_building: "Команда посмертного анализа"
 barber_tent_morticians_tools_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('barber_tent_01').GetName])#!\nAПосле каждого выбора кто-то должен выяснять, что пошло не так и что можно спасти."
 barber_tent_reference_corpus_domicile_building: "Справочная библиотека"
 barber_tent_reference_corpus_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('barber_tent_01').GetName])#!\nПротоколы заседаний, старые манифесты и каждый отчет по комитету, который стоит иметь, на полках и в файлах."
 barber_tent_surgeons_tools_domicile_building: "Аптечка первой помощи"
 barber_tent_surgeons_tools_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('barber_tent_01').GetName])#!\nПластыри для пальцев, которые застряли в почтовых ящиках, и ледяные пакеты для укусов собак, в полном наличии."
 barber_tent_torturers_tools_domicile_building: "Комната для пробного интервью"
 barber_tent_torturers_tools_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('barber_tent_01').GetName])#!\nОдин стул, одна яркая лампа и сотрудник, который слишком хорошо играет враждебного ведущего."
 camelry_captain_camp_officer: "Rural Team Lead"
 camelry_captain_camp_officer_desc: "$camelry_captain_camp_officer$ проводит кампанию в деревнях и на фермах."
 camp_cook_camp_officer: "Главный чайник"
 camp_cook_camp_officer_desc: "$camp_cook_camp_officer$ поддерживает урну горячей и команду накормленной в длинные вечера."
 camp_domicile_type_possessive: "Избирательный офис"
 camp_fire_01_domicile_building: "Командное собрание"
 camp_fire_01_domicile_building_desc: "Понедельник вечером в задней комнате: кто чем занимается, кто на кого сердится и печенье."
 camp_fire_capering_fools_domicile_building: "Офисные комики"
 camp_fire_capering_fools_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('camp_fire_01').GetName])#!\nКаждой команде нужен кто-то, кто умеет сделать плохие опросы смешными."
 camp_fire_future_dreams_domicile_building: "Сессии Большого Видения"
 camp_fire_future_dreams_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('camp_fire_01').GetName])#!\nВыездные дни с флипчартами о стране, ради которой проводится кампания."
 camp_fire_juicy_rumors_domicile_building: "Сочные слухи"
 camp_fire_juicy_rumors_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('camp_fire_01').GetName])#!\nВсе сказанное за закрытыми дверями в итоге где-то оказывается. Лучше, если это окажется здесь."
 camp_fire_libations_for_the_lost_domicile_building: "Напитки для побеждённых"
 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_fire_01').GetName])#!\nA пинту для тех, кто потерял свои места, и обещание вернуть их обратно."
 camp_fire_local_hangers_on_domicile_building: "Местные сплетни"
 camp_fire_local_hangers_on_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_fire_01').GetName])#!\nЖурналист, родители у школьных ворот и человек в пабе, который всё знает."
 camp_fire_nightly_debates_domicile_building: "Поздние ночные дебаты"
 camp_fire_nightly_debates_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_fire_01').GetName])#!\nДва специалиста, одна политика, пять мнений и время закрытия, которого никто не соблюдает."
 camp_fire_trailing_musicians_domicile_building: "Офисный плейлист"
 camp_fire_trailing_musicians_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_fire_01').GetName])#!\nЧей-то динамик, чей-то плейлист и моральный дух, который держится даже во время запаковки конвертов."
 camp_fire_wandering_poets_domicile_building: "Мастера слова"
 camp_fire_wandering_poets_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_fire_01').GetName])#!\nЛюди, которые могут заставить листовку «петь» и слоган «прилипнуть»."
 camp_main_01_domicile_building: "Штаб кампании"
 camp_main_01_domicile_building_desc: "Сам офис: сначала арендованная комната, затем витрина на главной улице, затем полноценная штаб-квартира с телефоном для каждого стола."
 camp_move_desc: "Moving your [camp|E] to another town brings new [task_contracts|E] and new doors to knock on.

#weak Moving far puts you out of reach of your [contact_list_contacts|E], so call in any favours first.#!

#P Click to move your Campaign Office#!"
 camp_perimeter_01_domicile_building: "Ресепшн"
 camp_perimeter_01_domicile_building_desc: "Кто-то, кто откроет дверь, телефон и разгневанного избирателя, в таком порядке."
 camp_perimeter_camp_hygiene_domicile_building: "График уборки"
 camp_perimeter_camp_hygiene_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nХолодильник очищается каждую пятницу. Это закон."
 camp_perimeter_ditch_domicile_building: "Болларды"
 camp_perimeter_ditch_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nНикто дважды не ставит фургон поперек двери офиса."
 camp_perimeter_extra_watch_domicile_building: "Система входа в дверь"
 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nA зуммер, камера и список тех, кто ожидается."
 camp_perimeter_fixed_layout_domicile_building: "План Hot-Desk"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nТе же столы, тот же график, куда бы ни переехал офис. Все знают, где что находится."
 camp_perimeter_good_siting_domicile_building: "Фасад на главной улице"
 camp_perimeter_good_siting_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nПрямо у автобусной остановки и супермаркета: все проходят мимо окна."
 camp_perimeter_palisade_domicile_building: "Жалюзи"
 camp_perimeter_palisade_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nСтальные ставни после темноты: окна переживают ночь выборов."
 camp_priest_camp_officer: "Социальный работник"
 camp_priest_camp_officer_desc: "$camp_priest_camp_officer$ заботится о команде: выслушивает, тихо разговаривает и следит за тем, кто выгорает."
 camp_purpose: "Политический Фокус"
 camp_purpose_brigands: "Медиа-обозреватель"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Предлагаются дополнительные медийные раунды и исследование оппозиции\n$EFFECT_LIST_BULLET$Каждая хорошо выполненная работа приносит дополнительный [prestige|E]: больше эфирного времени\n$EFFECT_LIST_BULLET$Открывает [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$Может получить доступ к определенным специальным [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Открывается через $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (Открывается через $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Открывается через $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Доступно для комментариев, любой канал, в любое время, на любую тему.#!"
 camp_purpose_confirmation_button_text: "Фокус изменений"
 camp_purpose_explorers: "Организатор на местах"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Предлагалось больше работы с агитацией, телефонных звонков и за участие в голосовании\n$EFFECT_LIST_BULLET$Передвигается быстрее между дверями\n$EFFECT_LIST_BULLET$Разблокирует [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK На каждой улице есть дверь, в которую еще не стучались.#!"
 camp_purpose_legitimists: "Фиксер вечеринки"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$Предлагались дополнительные внутренние задания партии: написание речей и исследовательская работа\n$EFFECT_LIST_BULLET$Каждая хорошо выполненная работа приносит дополнительное партийное признание\n$EFFECT_LIST_BULLET$Открывает [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$Можно получить доступ к определённым специальным [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak (Открывается через $baggage_train_proof_of_claims_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Открывается через $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Кто-то должен подсчитать голоса до голосования и знать, кто кому должен.#!"
 camp_purpose_mercenaries: "Консультант кампании"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Предлагаются дополнительные работы по сбору средств, телефонным звонкам и расчетам стоимости\n$EFFECT_LIST_BULLET$Каждая хорошо выполненная работа приносит дополнительный [gold|E]: счет-фактуру\n$EFFECT_LIST_BULLET$Открывает [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$Может получить доступ к определенным специальным [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Открывается через $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Открывается через $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Стратегия, данные и дневная ставка. Результаты не гарантированы; счета-фактуры обязательно.#!"
 camp_purpose_pass_phrase: "Стать [Law.GetNameNoTooltip]"
 camp_purpose_scholars: "Эксперт аналитического центра"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Предлагались дополнительные задания по подготовке политических документов, написанию речей и расчетам\n$EFFECT_LIST_BULLET$Учится быстрее на каждой работе\n$EFFECT_LIST_BULLET$Открывает [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Можно получить доступ к определённым специальным [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Открывается через $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK Для всего есть сноска и для большинства есть таблица.#!"
 camp_purpose_wanderers: "Партийный активист"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Предлагались все виды работы, ни одна не больше другой\n$EFFECT_LIST_BULLET$Может сменить на любую другую $camp_purpose$ без траты [prestige|E]\n\n#WEAK Листовки в одном кармане, членская карта в другом, и пока нет понимания, куда всё это приведет.#!"
 chief_engineer_camp_officer: "Директор цифровых технологий"
 chief_engineer_camp_officer_desc: "$chief_engineer_camp_officer$ управляет данными, рекламой и механизмами современной кампании."
 chief_forager_camp_officer: "Лид по сбору средств"
 chief_forager_camp_officer_desc: "$chief_forager_camp_officer$ находит деньги: лотереи, ужины, регулярные пожертвования и иногда щедрые доноры."
 chief_forager_camp_officer_employer_custom_effect_description: "$BULLET$Может помогать в сборе средств для кампании [decisions|E]"
 domicile_temperament_high: "Воодушевлённая команда"
 domicile_temperament_low: "Деморализованная команда"
 domicile_temperament_neutral: "Стабильная команда"
 elephantry_captain_camp_officer: "Связь со знаменитостями"
 elephantry_captain_camp_officer_desc: "$elephantry_captain_camp_officer$ заботится о знаменитых сторонниках, их дневниках и эго."
 ep3_can_have_legitimists_camp_purpose_trigger.tt.explanation: "Ваш партийный рейтинг должен быть не ниже 40"
 game_concept_adventurer: "Активист"
 game_concept_adventurer_camp: "Избирательный офис"
 game_concept_adventurer_camps: "Избирательные штабы"
 game_concept_adventurer_desc: "A $game_concept_adventurer$ is a politician without a seat: an activist, a candidate or a former MP, leading a [camp|E].

They have no constituency and no income of their own: they take [task_contracts|E] from their party's MPs to earn money, profile and Party Standing, and call in favours from their [contact_list|E].

A $game_concept_adventurer$ can move their office anywhere. The goal is a seat: get on the approved list, win a selection, then win the election."
 game_concept_adventurer_possessive: "Кампания"
 game_concept_adventurer_siege_replenishment_desc: "Когда [adventurer|E] успешно [sieges|E] [holding|E], часть их [men_at_arms|E] будет восполнена.\n\nВсе Активисты [regiments|E] в [army|E] будут восполнены #V x2#! раз по значению [loot|E] Владения.\n\n#weak Увеличение состоит из новых рекрутов, насильственного вовлечения местных жителей и просто выплаты тем, кто ушел во время осады.#!"
 game_concept_adventurers: "Активисты"
 game_concept_adventurers_possessive: "Активисты"
 game_concept_camp: "Избирательный офис"
 game_concept_camp_building: "офисное помещение"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$ are improvements to a [camp|E]: rooms, equipment, people and habits.

Mechanically, they are [domicile_buildings|E]. They can:
$EFFECT_LIST_BULLET$ Unlock new [officers|E]
$EFFECT_LIST_BULLET$ Give bonuses to the campaigner and the team
$EFFECT_LIST_BULLET$ Improve [task_contract|E] rewards"
 game_concept_camp_buildings: "офисные помещения"
 game_concept_camp_desc: "A $game_concept_camp$ is a campaigner's base: a rented room, a shopfront or a regional headquarters, its staff and volunteers, and the battle bus that takes it from town to town.

Every [GetGovernment( 'landless_adventurer_government' ).GetName] has a $game_concept_camp$ [domicile|E] that moves across the map with them.

[camp_buildings|E] can be added, which give the $game_concept_camp$ and its campaigner lasting bonuses."
 game_concept_camp_purpose: "Политический Фокус"
 game_concept_camp_purpose_desc: "A $game_concept_camp_purpose$ is what a campaigner is known for: the kind of politician they are becoming.

It decides which [task_contracts|E] their party offers them most, gives a bonus of its own, and unlocks some [camp_buildings|E]. A $game_concept_camp_purpose_purpose$ can be changed, but changing from one to another costs [prestige|E]; a Party Activist may pick any for free."
 game_concept_camp_purpose_purpose: "Фокус"
 game_concept_camp_purpose_purposes: "Фокусы"
 game_concept_camp_purposes: "Политические Фокусы"
 game_concept_camp_temperament: "Командный дух"
 game_concept_camps: "Избирательные штабы"
 game_concept_contract_scheme: "Система работы"
 game_concept_contract_scheme_contract: "Работа"
 game_concept_contract_scheme_possessive: "Система работы (притяж.)"
 game_concept_contract_schemes: "Системы работы"
 game_concept_contract_schemes_possessive: "Системы работы (притяж.)"
 game_concept_contractor: "Работодатель"
 game_concept_contractor_desc: "$game_concept_contractor$ — депутат или лидер партии предлагает [task_contract|E]. Они платят за это и помнят, как хорошо это было сделано."
 game_concept_contractor_possessive: "Работодателя"
 game_concept_contractors: "Работодатели"
 game_concept_contractors_possessive: "Работодателей"
 game_concept_domicile: "База"
 game_concept_domicile_building: "Строительство базы"
 game_concept_domicile_buildings: "Здания базы"
 game_concept_domiciles: "Базы"
 game_concept_follower: "Член команды"
 game_concept_follower_desc: "A $game_concept_follower$ is a volunteer or staffer who works for a [adventurer|E] without a seat.

Mechanically, they are like [courtiers|E], but they owe less and leave sooner if they dislike their boss.

The collective [opinion|E] of the $game_concept_followers$ sets the [camp_temperament|E]."
 game_concept_followers: "Члены команды"
 game_concept_officer: "Старший сотрудник"
 game_concept_officer_desc: "$game_concept_officers$ are the jobs [followers|E] can be given to run the [camp|E]: office manager, field director, treasurer and so on.

They work like [court_positions|E]: what they bring depends on the holder's [aptitude|E] for the job."
 game_concept_officers: "Старший персонал"
 game_concept_provision: "Фонд кампании"
 game_concept_provisions: "Средства кампании"
 game_concept_provisions_desc: "$game_concept_provisions$ are the office's running budget: rent, fuel, print and food for the volunteers.

A [camp|E] spends $game_concept_provisions$ while it moves to a new [location|E]; how much depends on the size of the team, the distance and the [officers|E] it has.

Running out means unpaid bills and an unhappy team. Jobs done well, and some [camp_buildings|E], bring more in."
 game_concept_task_contract: "Работа"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ are work a [adventurer|E] does for the party's MPs: canvassing, fundraising, speechwriting, research, phone banks, policy papers and media rounds.

Each takes three weeks and is settled by a skill check. Doing it well earns [gold|E], [prestige|E], [provisions|E], Party Standing and the MP as a contact; doing it badly costs a little standing.

The party's candidate assessment is a $game_concept_task_contract$ too: pass it to join the approved candidates list."
 game_concept_task_contract_possessive: "Работа (притяж.)"
 game_concept_task_contract_tier: "Уровень работы"
 game_concept_task_contracts: "Работы"
 game_concept_task_contracts_possessive: "Джобс"
 head_groom_camp_officer: "Менеджер по транспорту"
 head_groom_camp_officer_desc: "$head_groom_camp_officer$ заботится о микроавтобусах, топливных картах и штрафах за парковку."
 head_porter_camp_officer: "координатор по логистике"
 head_porter_camp_officer_desc: "$head_porter_camp_officer$ доставляет офис, коробки и людей в следующий город целыми."
 heavy_cavalry_captain_camp_officer: "Капитан боевого автобуса"
 heavy_cavalry_captain_camp_officer_desc: "$heavy_cavalry_captain_camp_officer$ проводит автобусные туры: большие визиты, большие толпы, большие фотографии."
 heavy_infantry_captain_camp_officer: "Руководитель команды обхода дверей"
 heavy_infantry_captain_camp_officer_desc: "$heavy_infantry_captain_camp_officer$ возглавляет большие субботние кампании."
 horse_archer_captain_camp_officer: "Ведущее место в распространении листовок"
 horse_archer_captain_camp_officer_desc: "$horse_archer_captain_camp_officer$ организует быструю доставку, улица за улицей."
 huntperson_camp_officer: "Организатор по взаимодействию"
 huntperson_camp_officer_desc: "$huntperson_camp_officer$ планирует выезды: уличные прилавки, общественные мероприятия и визиты."
 huntperson_camp_officer_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] увеличивается с [aptitude|E]ZZ\n$BULLET$ImДоказывает [martial|E] [education|E] результаты для всех [children|E] в вашем [camp|E]ZZ\n$BULLET$Манимация помощи в Gather Campaign Funds [decisions|E]"
 kennelperson_camp_officer: "Координатор добровольцев"
 kennelperson_camp_officer_desc: "$kennelperson_camp_officer$ кормит волонтеров, благодарит их и указывает правильное направление."
 landless_adventurer_government: "Активист"
 landless_adventurer_government_adjective: "Кампания"
 landless_adventurer_government_realm: "Избирательный офис"
 laureate_camp_officer: "Мастер слова"
 laureate_camp_officer_desc: "$laureate_camp_officer$ пишет строки, которые люди запоминают и которые они цитируют обратно вам."
 light_cavalry_captain_camp_officer: "Руководитель по быстрой реакции"
 light_cavalry_captain_camp_officer_desc: "$light_cavalry_captain_camp_officer$ собирает команду в любом месте района в течение часа."
 light_infantry_captain_camp_officer: "Ведущий уличный кабинок"
 light_infantry_captain_camp_officer_desc: "$light_infantry_captain_camp_officer$ управляет лотками на рыночной площади и у станции."
 master_bard_camp_officer: "Создатель контента"
 master_bard_camp_officer_desc: "$master_bard_camp_officer$ превращает день на пороге в видео, пост и, время от времени, вирусный момент."
 master_of_arms_camp_officer: "Полевой директор"
 master_of_arms_camp_officer_desc: "$master_of_arms_camp_officer$ управляет командами кампании: кто и где стучит, и когда."
 master_of_spoils_camp_officer: "Казначей"
 master_of_spoils_camp_officer_desc: "$master_of_spoils_camp_officer$ ведет учет, подписывает чеки и подает отчетность в избирательную комиссию."
 master_thief_camp_officer: "Исследователь оппозиции"
 master_thief_camp_officer_desc: "$master_thief_camp_officer$ знает, что сказала другая сторона в 2011 году, и где это было записано."
 mess_tent_01_domicile_building: "Офисная кухня"
 mess_tent_01_domicile_building_desc: "Чайник, холодильник, полный молока, и чей-то праздничный торт: кампания движется через желудок."
 mess_tent_bakers_domicile_building: "Беконовые рулеты"
 mess_tent_bakers_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('mess_tent_01').GetName])#!\nСубботнее утро, перед приёмом у дверей. Никто это не пропускает."
 mess_tent_brewers_domicile_building: "Кофемашина"
 mess_tent_brewers_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('mess_tent_01').GetName])#!\nA настоящая, с фасолью. Утренний агита удваивает."
 mess_tent_cooks_domicile_building: "Добровольные повара"
 mess_tent_cooks_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('mess_tent_01').GetName])#!\nЧлены, которые не могут агитировать, но могут накормить тридцать человек с ограниченным бюджетом."
 mess_tent_curers_domicile_building: "Готовка в пакетах"
 mess_tent_curers_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('mess_tent_01').GetName])#!\nA морозильник, полный чили для долгих ночей короткой кампании."
 mess_tent_herbalists_domicile_building: "Здоровые перекусы"
 mess_tent_herbalists_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('mess_tent_01').GetName])#!\nФрукты так же, как печенье. Маленькая революция."
 person_haggler_camp_officer: "Брокер сделок"
 person_haggler_camp_officer_desc: "$person_haggler_camp_officer$ справляется с неловкими посетителями и добивается лучших условий за каждое одолжение."
 pike_captain_camp_officer: "Руководитель телефонного банка"
 pike_captain_camp_officer_desc: "$pike_captain_camp_officer$ управляет вечерними телефонными центрами: сценариями, списками и постоянным потоком звонков."
 proving_grounds_01_domicile_building: "Учебная комната"
 proving_grounds_01_domicile_building_desc: "Скрипты обхода дверей, ролевые игры и как ответить на вопрос, который вам не задавали."
 proving_grounds_bodyguard_drills_domicile_building: "Учения по охране"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA кандидату на публике нужен кто-то, кто следит за толпой."
 proving_grounds_camel_run_domicile_building: "Rural Routes"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nДеревни, фермы и дороги без названий улиц: план агитации для сельской местности."
 proving_grounds_elephantry_reserve_domicile_building: "Знаменитые болельщики"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAн актёр, футболист и повар на телевидении, который появится перед камерами."
 proving_grounds_horse_run_domicile_building: "Велосипедная агитация"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('proving_grounds_01').GetName])#!\nВелосипеды для длинных дорог и районов, куда не доезжает микроавтобус."
 proving_grounds_life_in_the_saddle_domicile_building: "Жизнь в дороге"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nНекоторые люди оживают только в другом городе каждый день."
 proving_grounds_lockwagon_domicile_building: "Общий Кот"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('proving_grounds_01').GetName])#!\nКаждое пожертвование идет в один общий фонд, и фонд оплачивает все. В основном."
 proving_grounds_martial_study_domicile_building: "Исследование кейсов кампании"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('proving_grounds_01').GetName])#!\nКаждые выборы уже проводились раньше. Читайте, как их выигрывали."
 proving_grounds_mock_battle_drills_domicile_building: "Дни пробного голосования"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA полный репетиционный день голосования — от первого подбора до окончания голосования."
 proving_grounds_nightly_barding_drills_domicile_building: "Учения на боевом автобусе"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('proving_grounds_01').GetName])#!\nЗагрузить, вести, разгрузить, агитировать, повторять, пока все не станет работать как часы."
 proving_grounds_personal_bouts_domicile_building: "Практика дебатов"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('proving_grounds_01').GetName])#!\nМакетные встречи с сотрудником, играющим вашего злейшего противника."
 proving_grounds_the_stick_game_domicile_building: "Офисный розыгрыш"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nО результате, явке и о том, какой кандидат плачет первым."
 proving_grounds_the_stump_domicile_building: "Трибуна"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA клетку на рыночной площади и много практики в том, чтобы тебя поддразнили."
 proving_grounds_training_circle_domicile_building: "Круг ролевых игр"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('proving_grounds_01').GetName])#!\nСердитый избиратель, обеспокоенный избиратель, избиратель, который хочет поговорить о мусорных баках: все практикуют все."
 quartermaster_camp_officer: "офис-менеджер"
 quartermaster_camp_officer_desc: "$quartermaster_camp_officer$ ведет учет средств кампании, шкаф для канцелярии и график."
 second_camp_officer: "Заместитель менеджера кампании"
 second_camp_officer_desc: "$second_camp_officer$ управляет офисом, когда кандидат находится у двери, и следит за тем, чтобы все остальные выполняли свои задачи."
 stooge_camp_officer: "Стажер"
 stooge_camp_officer_desc: "$stooge_camp_officer$ делает фотокопии, бегает за кофе и выполняет все работы, которые никто другой не хочет делать. Мораль улучшается для всех остальных."
 supply_tent_01_domicile_building: "Печать"
 supply_tent_01_domicile_building_desc: "Листовки, плакаты, конверты и один принтер, на который все ругаются. Кампания работает на бумаге."
 supply_tent_arsenal_domicile_building: "Запас листовок"
 supply_tent_arsenal_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('supply_tent_01').GetName])#! Коробки с каждой листовкой, которую когда-либо создавала кампания, готовые к любой улице за час."
 supply_tent_climbing_gear_domicile_building: "Лестницы и кабельные стяжки"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('supply_tent_01').GetName])#!Every фонарный столб в округе — это сайт для размещения плакатов, если вы можете к нему добраться."
 supply_tent_mender_domicile_building: "Подержанное оборудование"
 supply_tent_mender_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('supply_tent_01').GetName])#!Донированные ноутбуки и восстановленные телефоны: не красиво, но работают."
 supply_tent_reserve_provisions_domicile_building: "Резервный фонд"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('supply_tent_01').GetName])#!Мони, отложенный на последние две недели, когда каждый фунт стоит вдвое."
 supply_tent_reserve_water_domicile_building: "Аварийный поплавок"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('supply_tent_01').GetName])#! Банка с мелкими деньгами для тех вещей, которые никто не заложил в бюджет."
 supply_tent_smithy_domicile_building: "Внутренний принтер"
 supply_tent_smithy_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('supply_tent_01').GetName])#! Настоящая печатная машина в подсобке: больше не нужно ждать неделю, пока напечатают."
 supply_tent_subdued_gear_domicile_building: "Гражданская одежда"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('supply_tent_01').GetName])#!Nотек розеток, без шнурков: часть работы лучше делать без цвета."
 supply_tent_sutler_domicile_building: "Оптовые поставщики"
 supply_tent_sutler_domicile_building_desc: "#weak (Требует [GetDomicileBuilding('supply_tent_01').GetName])#! Оптовик, который делает хорошую цену на A5, если вежливо попросить и заплатить вовремя."
 witness_camp_officer: "Сотрудник по рекомендациям"
 witness_camp_officer_desc: "$witness_camp_officer$ собирает каждое письмо поддержки и следит за тем, чтобы все о них узнали."
