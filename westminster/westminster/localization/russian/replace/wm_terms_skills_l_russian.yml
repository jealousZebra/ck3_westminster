 trait_inappetetic_character_desc: "Независимо от того, истощен ли он давлением или желает воздержания, [ROOT.GetCharacter.GetFirstName] полностью потерял аппетит, пропуская приемы пищи и истощаясь..."
 trait_inappetetic_desc: "Независимо от того, истощен ли он давлением или желает воздержания, этот персонаж полностью потерял аппетит, пропуская приемы пищи и истощаясь..."
