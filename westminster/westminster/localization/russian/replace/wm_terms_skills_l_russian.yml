 scheme_critical_moments.4011.desc: "I take a look at the letter that one of my servants has just put down. The parchment is rich, even perfumed. A letter from the capital, no doubt.\n\n"The [target.GetTitleAsNameNoTooltip], [ROOT.Char.GetHerHis] party leader, is experiencing a most unpleasant situation..."\n\nA smile crosses my face. I don't need to read any more. [target.GetHerHis|U] mandate has been damaged — a perfect chance to attack."
