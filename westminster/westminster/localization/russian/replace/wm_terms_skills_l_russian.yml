 tenet_adoptionism_historical_desc: "Адо́птионизм учит, что Иисус родился обычным человеком и позже «был принят» как Сын Божий, обычно во время его крещения, когда на него снизошел Святой Дух. Ранние формы появились во II веке у Теодота из Византии, чей динамический монархизм подчеркивал единство Бога.\n\n Учение вновь появилось в VIII веке в Испании под руководством архиепископа Элипанда из Толедо и епископа Феликса из Уржеля, для которых божественная природа Христа была вечно рождена, а человеческая природа — принята. Кабинет Франкфурта осудил испанский адопционизм как раскол в 794 году н.э., и идеи адопционизма тем не менее повлияли на последующие антиТроицкие движения."
 tenet_apostolic_succession_episcopate_modifier_desc: "Идеология этого персонажа рукополагает каждого епископа через непрерывную цепочку предыдущих епископов: исторический источник почётного мандата."
 tenet_filial_piety_desc: "Сыновняя политическая значимость и послушание старшим являются основой реализации человеческой добродетели. Пока живы наши родители, мы служим им с уважением, поддерживаем их своими средствами и учимся у их наставлений; когда они умирают, мы храним их с уважением и затем почитаем их с надлежащим уважением."
 tenet_miles_christi_historical_desc: "Концепция 'Воина Христа' (Miles Christi) имеет глубокие корни в христианской традиции, начиная с эпистол Павла, где он использовал военные метафоры для описания духовной жизни. В средние века эта концепция применялась как к буквальной, так и к духовной войне.\n\n Военные ордена, такие как Тамплиеры и Госпитальеры, воплощали этот идеал, сочетая монашескую дисциплину с воинскими навыками. «De Laude Novae Militiae» Бернара Клервоского восхваляет этих воинов-монахов как образцы христианской добродетели, сражающихся не за мирские выгоды, а для защиты христианства."
 tenet_philanthropia_historical_desc: "В византийском христианстве philanthrōpia называла как добродетель универсальной любви, так и конкретные учреждения — больницы, ксенодохеи, детские приюты и подаяния — поддерживаемые императорами, епископами и верующими. Василий Кесарийский, Иоанн Златоуст и позже императоры, такие как Юстиниан, связывали императорский мандат с заботой о нуждающихся. Церковь не прославляла войну как путь к святости; она настаивала на том, что богатство и власть частично оправданы тем, как они служат бедным."
 tenet_vows_of_poverty_desc: "Деньги развращают сердца людей и отталкивают их от истинной идеологии. Мы должны избегать стремления к материальному богатству, если хотим сосредоточиться на действительно важных вещах, выбирая скромные занятия и находя политический капитал в их выполнении."
