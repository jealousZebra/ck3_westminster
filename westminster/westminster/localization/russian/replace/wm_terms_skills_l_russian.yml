 court_brahmin_court_position_desc: "Почтенный священник, встречающийся как в индуистских, так и в буддийских дворах, Офисный брахман отвечает за проведение ритуалов, наблюдение за церемониями и продвижение мандата правителя."
 court_diplomatic_desc: "#low Харизма — ключ к завоеванию уважения наших коллег и поддержанию мира в партии. Довольный рядовой член партии — верный рядовой член партии. \n\nСотрудники получают черты [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )].#!"
