 tournament_public_proselytiser_modifier_desc: "Этот персонаж доказал свою политическую силу, упрекав толпу на турнире."
 tradition_battlefield_looters_desc: "В этой культуре битвы ведутся не ради престижа, а ради прибыли. Кому важно положение, если ты не в состоянии оплатить войну?"
 tradition_chivalry_desc: "Эта культура приняла рыцарство и рыцарские кодексы поведения как социальный способ регулирования поведения. Ценятся способности к безопасности, долг, честь и мораль, как и плохая поэзия и романтическая литература."
 tradition_martial_admiration_name: "Восхищение безопасностью"
 tradition_tgp_fortified_strongholds_desc: "Эта культура характеризуется великими укреплёнными городами, выполняющими религиозные, военные и государственные функции. Защита этих культурных оплотов имеет решающее значение, а основание новых городов имеет большое значение."
 tradition_tgp_warrior_monks_desc: "Верность моральной жизни не должна исключать применение силы, особенно когда необходимо защищать религиозное сообщество от соперничающих сект и коррумпированных чиновников или защищать нуждающихся."
 trait_athletic_character_desc: "Регулярные упражнения помогают [ROOT.GetCharacter.GetFirstNameNoTooltip] сохранять спокойствие и снимать напряжение."
