 investiture_crisis_desc: "Корона и посох спорят друг с другом за то, кто владеет ключами от амбаров Бога; светские покровители наделяют прелатов жезлом и кольцом, в то время как Церковь отказывается признавать их мандат."
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$ каждый месяц будет искать и ухаживать за больным членом гарема, облегчая их стресс и симптомы, которые их беспокоят."
 kharijite_desc: "Ранняя исламская группа считала, что руководство должно основываться на политическом капитале, а не на родословной, и греховных правителей можно было смещать. Они появились во время шиитских волнений, отвергли обе стороны и объявили тяжких грешников вне ислама."
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "Этот [modifier|E] может быть удален [adventurer|E], ответственным за его решение через проверки дипломатии, интриги или выносливости."
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier_desc: "Этот [modifier|E] может быть удален [adventurer|E], ответственным за его решение через проверки дипломатии, обучения или выносливости."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc: "Этот [modifier|E] может быть удален [adventurer|E], которому поручено решить это, с помощью проверок дипломатии, боевых или выносливости."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier_desc: "Этот [modifier|E] может быть удален [adventurer|E], которому поручено решить это, с помощью проверок дипломатии, управления или выносливости."
 laamp_base_4021_contract_scheme: "Создать работу по политике"
 laamp_base_contract_schemes.0011.desc: "Не секрет, что репутация [employer.GetTitledFirstNamePossessive] оставляет желать лучшего. Недовольные задние ряды, тревожные воркования о тираническом поведении, нехватка неосязаемого профиля — все это признаки того, что власть может быть слабее, чем большинству [employer.Custom('LadiesLords')] хотелось бы. \n\nОплата кому-то за устранение таких недоразумений, конечно, будет стоить недешево. По крайней мере, если это зависит от меня."
 laamp_base_contract_schemes.0331.d.tt.success: "Политика — это сама награда"
 laamp_base_contract_schemes.4042.desc: "Наше время в [employer.GetCapitalLocation.GetTitle.GetName] чрезвычайно прибыльно! Торговля с тактическим одобрением [employer.GetTitledFirstNamePossessive] даёт мандат нашему запасу, которого не добьётся никакая болтовня.\n\nТалисманы, лекарства, безделушки и сувениры — персонал и гости покупают всё, без вопросов.\n\nПока ещё нет, по крайней мере. К тому времени, когда их заботы начнут проявляться, нас уже давно не будет."
