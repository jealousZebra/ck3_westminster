 historical_character.mibu_tadamine: "Несмотря на скромное происхождение, $Tadamine$ приобрел большую известность в партии за свою поэзию вака после участия в соревновании, получив императорский заказ и покровительство семьи Фудзивара. Вместе со своим сыном, $Tadami$, он считается одним из Тридцати шести бессмертных поэтов Японии, с более чем восемьюдесятью одной поэмой, предположительно включенной в императорские антологии."
 historical_character.namdev: "Намдев был маратхийским святым и поэтом XIII века, известным своими преданными песнями, посвящёнными Витхобе, а также заметной фигурой движения Бхакти в Махараштре. Популярный среди простых людей, его работы также значительно способствовали распространению и популяризации маратхийского языка как языка поэзии и политической кампании."
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ Искать мифическое животное, замеченное в этом районе\n$EFFECT_LIST_BULLET$ Повышает $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Более высокий [hunt_danger_no_prefix|E] дает больше [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ В безопасности могут участвовать оба пола\n$EFFECT_LIST_BULLET$ Несражающиеся полы могут наблюдать\n#weak Мифические существа часто отвергаются учеными как легенда, но леса все еще могут таить много тайн.#!"
 hunt_type_skill_learning: "$BULLET_WITH_TAB$@skill_learning_icon! Политика"
 hunt_type_skill_prowess: "$BULLET_WITH_TAB$@skill_prowess_icon! Выносливость"
 hunt_type_skill_stewardship: "$BULLET_WITH_TAB$@skill_stewardship_icon! Экономика"
 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ Выберите добычу из разнообразных местных животных\n$EFFECT_LIST_BULLET$ Увеличивает $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Более высокий [hunt_danger_no_prefix|E] даёт больше [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Сексуально активные в охране могут активно участвовать\n$EFFECT_LIST_BULLET$ Несексуальные в защитной роли могут быть наблюдателями\n#weak Гордые и хитрые звери бродят по дикой природе; перехитрить и одолеть их — испытание отваги и закалка навыков.#!"
 hunt_type_stress: "$BULLET_WITH_TAB$@stress_icon! Потеря давления"
 iberia_north_africa.0111.desc: "Потребовались годы, чтобы создать политическое и духовное единство для созыва этой конклавы, но я наконец привел достаточное количество как крестьянства, так и партийных чиновников под свои знамена, чтобы существенно опровергнуть ложное [pope.GetTitledFirstName]. \n\nДаже сейчас коридоры и гостевые комнаты [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] переполнены спорящими священниками и страстными епископами; каждый обиженный монах и мелкий [religious_leader.GetFaith.PriestNeuter], когда-либо униженный Римом, заполняет мои залы. \n\nВсе эти дебаты важны для мандата, но в конце концов, как выдающийся правитель [religious_leader.GetFaith.GetAdjective], #EMP мое #! слово будет окончательным решающим голосом."
 iberia_north_africa.0112.desc.righteous: "отходя от того, что [religious_leader.GetSheHe] считает греховным насилием, которое поразило столь многие аспекты [religious_leader.GetFaith.GetReligion.GetName].\n\nСогласно [religious_leader.GetHerHim], [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] должен сосредоточиться на политическом капитале, который заключается просто в хорошей жизни, а не в попытках проложить дорогу к [religious_leader.GetFaith.PositiveAfterLife] кровью оппонентов."
 influence_child_commander_interaction: "Учение по безопасности Уорда"
