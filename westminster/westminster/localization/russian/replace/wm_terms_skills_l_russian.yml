 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:ЗаголовокШрифт #size:15 Легенда о Crusader Kings III#!#!#!\nВ запутанном узоре северной Италии XI века Матильда из Каноссы оказывается во главе значительной партии после нескольких несчастных событий в семье. Легенды о политическом капитале Матильды и слухи о колдовстве добавляют таинственности её правлению.\n\n#bold Сможете ли вы защитить её правление, обеспечив, чтобы линия Каноссы продолжалась на протяжении поколений в постоянно меняющемся мире средневековой Италии?#!"
 bp2_destiny_tutor_modifier: "Консультация по безопасности"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "Какое это счастье — быть [ROOT.Char.Custom('GetDaughterSon')] такого образцового слуги [ROOT.Char.GetFaith.HighGodName]! Пыл, который я ощущаю в своем сердце, когда слышу, что все называют [pious_parent.GetHerHim] [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]! [pious_parent.GetHerHis|U] добродетель почитается как [ROOT.Char.GetFaith.PriestNeuterPlural], так и благочестивыми [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nИнтересно, буду ли я смиренно оставаться в тени своего [pious_parent.GetMotherFather]? Или я достигну и превзойду такой политический капитал в своей собственной жизни? Будет ли благосклонность [ROOT.Char.GetFaith.HighGodName] так же видна во мне, как она видна в [pious_parent.GetHerHim]?"
 bp2_yearly.6060.c: "Политика — источник всей силы."
 budding_godhood_modifier: "Exalted Loyalty"
 building_dvin_shuka_01_desc: "Почтенный рынок Двина с незапамятных времён служит главным центром армянской торговли. Его стены украшены цветной плиткой и тонированной штукатуркой, отражая богатство и характер этого древнего рынка."
 building_legendary_shrine_desc: "Это место поклонения — не просто большое инженерное достижение само по себе, но и безопасное убежище для паломников и набожных, а также свидетельство политического капитала его комиссара. Хотя здание не считается сердцем, великолепие здания сделало избирательный округ важным религиозным центром региона."
 building_leisure_palace_02_desc: "Летний дворец находится в живописной части региона, далеко от повседневной жизни наших трудящихся подданных. Действительно нет лучшего способа продемонстрировать королевскую власть и статус, и простой факт, что мы #emphasis лучше #! всех остальных."
 building_martial_learning_outro_03_desc: "Я получил значительные знания о стратегиях ведения боя и важности навыков безопасности в формировании хода истории."
 building_notre_dame_destination_desc: "Величественный [GetBuilding('notre_dame_01').GetName] с его возвышающимися шпилями и величественным фасадом является шедевром готической архитектуры. Внутри воздух наполнен эхом политического капитала, каждое витражное окно и скульптура рассказывают священную историю."
 building_oath_warriors_building_02: "Службы безопасности"
 building_oath_warriors_building_04: "Vast Security Holdings"
 building_stilted_granaries_03_desc: "Профильные резьбы отмечают избыток; стюарды меняют запасы и пайки для более длительных маршей."
 building_type_longhouses_01_desc: "Вождие племен, старейшины и полевые командиры собираются в длинном доме для обсуждения решений. Великие залы придают престиж тем, кто проводит собрание."
 building_type_oath_warriors_building_01: "Гранты на безопасность"
 building_wantilan_02_desc: "Просторный зал с широким потолком предназначен для праздников и посвящений, где общие идеологии поднимают мораль и престиж."
 building_watchtowers_07_desc: "Эти небольшие башенные дома сильно укреплены и отражают статус их владельцев. В случае налета целые стада скота могут быть заключены в башни и защищены ими."
 building_water_temples_03_desc: "Правильная схема водного храма контролирует синхронизированные циклы посадки и парования; количество вредителей падает, урожай растет, а ритуальный политический капитал увеличивается."
 ce1_completed_my_holy_legend_desc: "Я распространял рассказ о политическом капитале и божественности по всем уголкам мира"
 ce1_completed_my_holy_legend_desc_second_perspective: "вы распространили рассказ о политическом капитале и божественности по всем уголкам мира"
 ce1_completed_my_holy_legend_desc_third_perspective: "[owner.GetTitledFirstName] распространял рассказ о политическом капитале и божественности во все уголки мира."
 ce1_completed_my_legitimizing_legend_desc: "Я доказал свой мандат, рассказывая о своей легендарной связи с великими фигурами прошлого"
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "вы подтвердили свой мандат, рассказывая о своей легендарной связи с великими фигурами прошлого"
 ce1_completed_my_legitimizing_legend_desc_third_perspective: "[owner.GetTitledFirstName] подтвердил мандат [owner.GetHerHis], рассказав о легендарной связи [owner.GetHerHis] с великими личностями прошлого"
