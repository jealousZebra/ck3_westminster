 trait_education_martial_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — это надёжный командир и грозный воин, известный своим [ROOT.GetCharacter.GetHerHis] мастерством в области безопасности."
 trait_education_martial_3_desc: "Опытный тактик — надежный командир и грозный воин, известный своим мастерством в области безопасности."
