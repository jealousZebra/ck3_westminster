 fp3_honored_by_the_faithful_modifier_desc: "Имя этого персонажа читается во время пятничной молитвы прямо на престоле лидера их идеологии, что приносит ему значительный мандат как правителю."
 fp3_not_puppeteering_kingmaker_modifier_desc: "Этот персонаж не смог сместить недружелюбного правителя в пользу другого, более подходящего их интересам. Теперь под вопросом их собственный мандат."
 friend_bonded_over_exam_jitters: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] сблизились из-за давления при сдаче экзаменов"
 friend_councel_and_aid: "[TARGET_CHARACTER.GetShortUIName|U] предоставил [CHARACTER.GetShortUIName] советы и помощь, снимая давление правления."
