 mongol_invasion.1004.desc: "С смертью могучего [old_mongol_emperor.GetFirstName] — властелина всех земель, подчинённых монголам — несколько наследников стремятся занять [old_mongol_emperor.GetHerHis] место Великого Хана. Никто не признает мандат другого.\n\nИ так это конец монголов как единой империи.\n\nЭти потомки первого великого завоевателя всё ещё удерживают некоторые силы. Они призывают к войне. Но ни один из них, ни [successor_1.GetName], ни [successor_2.GetName], не стоит выше остальных как правитель всей вселенной."
