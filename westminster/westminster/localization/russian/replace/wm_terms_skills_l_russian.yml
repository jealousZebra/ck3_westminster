 tribal_government_desc: "\n$game_concept_tribal_desc$\n\n#F В племени сила означает все. Племенной лидер зависит от уважения и бренда партии, а не от монет, чтобы развивать свою партию и укреплять свои армии.#!"
 tribute_mission_decision_desc_mandala: "Пора отдать наши почести и дань нашему уважаемому [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetOverlord )] [ROOT.Char.GetOverlord.GetTitledFirstName]. Демонстрация нашего близкого положения с [ROOT.Char.GetOverlord.GetTitleAsNameNoTooltip], среди прочего, усилит наш мандат и, возможно, принесет другие преимущества..."
 tribute_mission_decision_hegemony_common: "нависает тяжёло на наших горизонтах, молча требуя от нас проявить уважение. Отправка дани, среди прочего, усилит наш мандат и может принести и другие преимущества..."
