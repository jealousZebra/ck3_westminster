 funeral_unrelenting_devotion: "Неумолимая верность"
 game_rule.1101.desc.combat.locale.southwark: "С самым богатым городом Англии так близко, есть за что бороться. Будь то дома или добыча, слава или политический капитал, обе армии сталкиваются друг с другом снова и снова.\n\n Южный берег Темзы плещется и пенится нашей кровью, но я не сдамся, я #EMP не#! отступлю.\n\nАнглия уже моя, эта битва докажет это, и для этого требуется лишь один последний #EMP рывок#!, чтобы доказать, что—"
 generic_rite_focus_tenet_cranial_trophies: "Эта идеология рассматривает останки врагов как священное доказательство триумфа и пугающий профиль."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] рассматривает останки врагов как священное доказательство триумфа и устрашающий профиль."
 glory_hound_desc: "$glory_hound$ [vassals|E] заботится о положении и профиле, и показывает миру силу партии, частью которой они являются. Смелые или бескомпромиссные рядовые депутаты часто принимают эту [vassal_stance|E].\n\n#low $glory_hound$ Рядовые депутаты любят, когда их партийный лидер:#!\n$EFFECT_LIST_BULLET$Имеет любое разделение [succession_law|E]\n$EFFECT_LIST_BULLET$Добивается [victory|E] в наступлении [wars|E]\n$EFFECT_LIST_BULLET$Приглашает их на [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ Рядовые депутаты не любят, когда их партийный лидер:#!\n$EFFECT_LIST_BULLET$Имеет высокий [crown_authority|E]\n$EFFECT_LIST_BULLET$Подписывает [defeat|E] или [white_peace|E] в войнах\n$EFFECT_LIST_BULLET$[marries|E] персонаж [lowborn|E] как [primary_spouse|E]\n\nОни предпочитают смелых и храбрых [heirs|E] с высоким [martial_i][martial|E] навыком."
 grand_ambitions.0180.desc: "я стою перед [hof.GetTitleAsName], духовным лидером моего народа. Воздух наполнен благовониями и тяжестью веков. \n\nЗЗозаимствовать [hof.GetHerHis] благосклонность не только укрепит мои претензии на [target_title.GetName], но и может повлиять на сердца верующих по всей империи. [hof.GetSheHe|U] должен короновать меня. \n\nЗЗ [hof.GetTitleAsNameNoTooltip] не просто духовная фигура; [hof.GetSheHe] остро осознаёт [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] временные интриги."
