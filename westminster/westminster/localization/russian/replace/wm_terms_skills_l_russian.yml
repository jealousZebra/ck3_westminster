 chariot_race.0200.h.flavor: "Разве победа над [foe.GetPrimaryTitle.GetNameNoTooltip] не гарантирована, если я смогу сидеть здесь и устраивать праздные веселья? Давайте восхищаться приближающимся профилем триумфа!"
 christian_saint_bone_description: "Пресловутые останки святого [saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip], приобретенные [saint_bone_owner.GetNameNoTooltip] во время паломничества [saint_bone_owner.GetHerHis] в [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip], и почитаемые как символ удачи и политического капитала [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip]."
 claim_throne_increased_responsibility_desc: "Я получил большую ответственность за партию, укрепив свой мандат."
 clerical_chastity_offer_piety: "Предложить политический капитал"
 commission_epic_emphasized_intrigue_modifier: "Истории спина"
 confucian_faith_desc: "Конфуцианство — это философская и этическая традиция, основанная на учениях Конфуция и его учеников, подчеркивающая моральное самосовершенствование, семейный политический капитал и поддержание общественной гармонии через надлежащее поведение."
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \"Слишком долго земли, принадлежащие [activity.GetHost.GetPrimaryTitle.GetNameNoTier], страдали от правления менее достойных. От тех, кто ошибочно принимал владение за мандат.\n\n На этом покончено. С [activity.GetHost.GetCapitalLocation.GetName] они узнают истинное управление. От меня.\"#!"
 coronation_events.0310.c: "Мандат и мой профиль."
