 dlc_015_desc: "Вносит новый контент в несколько любимых систем: путешествия, активности и стили жизни. Отправляйте своего правителя в захватывающие путешествия, будь то в погоне за богатством, известностью или личностным ростом. Не позволяйте им бездействовать — приключение ждет на каждом шагу!"
 doctrine_imperial_anointment_desc: "Чтобы править как император вне всяких сомнений, нужно преклонить колени — ведь только высшая власть их церкви может даровать этот окончательный, бесспорный мандат."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Последователи зарабатывают политический капитал за успешное выполнение [intrigue|E] [schemes|E]"
