 trait_track_knight_errant_desc: "Недостаточно заявить о своей праведности, нужно её показывать.\n\n#weak Этот [trait|E] можно получить, выполняя задания Справедливости, Выносливости или Безопасности [task_contracts|E], демонстрирующие честные качества."
