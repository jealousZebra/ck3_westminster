 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] правил справедливо и праведно, с [Localize( god )] в качестве [ROOT.Legend.GetProtagonist.GetHerHis] гида. Божественный план был выполнен, [ROOT.Legend.GetProtagonist.GetSheHe] жил жизнью большой чести и политического капитала."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] усердно работал для всего [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] и сражался с приспешниками [ROOT.Legend.GetProtagonist.GetFaith.DevilName] здесь, на Земле, но, наконец, [ROOT.Legend.GetProtagonist.GetHerHis] страдания закончились. Божественный план был выполнен, [ROOT.Legend.GetProtagonist.GetSheHe] жил жизнью с большим почетом и политическим капиталом."
 legend_shibi_chakravarti_desc: "Воплощение смирения и политического капитала, геройский король Шиби был назначен защищать мудреца Агни, который был превращен в птицу. Когда коршун потребовал, чтобы он принес в жертву собственную плоть, чтобы спасти голубя, Шиби отдал себя целиком добровольно, но был пощажен и награжден своим сыном Капотаромой. В крови этого самоотверженного короля течет кровь каждого [GetDynastyByID('1043008').GetNameNoTooltip]."
 legendary_conversion_desc: "Легендарная история политического капитала и преданности захватила сердца всех в партии. С небольшим поощрением неверующих в партии можно подтолкнуть к поклонению так, как делаю это я."
 legendary_holy_war_desc: "Моя легендарная история политического капитала подошла к концу, и хотя её восхваляют истинные приверженцы, она мало повлияла на сердца неверующих. Мы должны продолжать распространять наши мирные способы единственным образом, который мы знаем: мечом."
 legendary_integration_d_desc: "По всей партии рассказывают легенды, которые укрепляют мою власть. Этот вновь обретенный мандат можно использовать для расширения того, что считается основной территорией моей партии, и требовать вечной верности исторически чужого герцога."
