 eat_cheese_effect_tt: "Чем дольше выдерживается сыр, тем больше давления вы теряете при употреблении."
 efg_contested_wrath_desc: "Использование наших организаторов для проповедования нашего имперского мандата против соперничающего императора питает наших воинов и завоевывает уважение масс."
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] лично приказал мое немедленное назначение императорским указом. Никто не может оспорить мандат моего нового статуса в [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip] силы не были равны моему превосходящему оружию, что доказывает мой больший мандат как защитника провинции от имени [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_decisions_event.0007.desc: "И с этим [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] снова были умиротворены. Моя мощь и мандат моей власти снова подтверждены.\n\n"
 ep3_decisions_event.9010.desc: "Я глубоко вдохнул и выдохнул, забрасывая свою леску в воду. Крючок опускается с тихим 'плюх', и мир замолкает. \n\nМой взгляд бродит вдоль берега, я остаюсь наедине, чтобы обдумать свои мысли. Жизнь авантюриста не так уж плоха, но нет жизни без давления. Я закрываю глаза на мгновение, чтобы отдохнуть, когда внезапно что-то выдергивает удочку из моих рук."
 ep3_dynasty_legacy_add_legitimacy_effect_title: "Сохраненный мандат"
 ep3_famous_connections_modifier_desc: "У этого персонажа есть знаменитые друзья, и он эффективно, но осторожно использует их репутацию партии."
