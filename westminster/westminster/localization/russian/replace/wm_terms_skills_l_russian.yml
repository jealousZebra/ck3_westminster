 ep3_fireside_chat_intrigue: "Беседа у камина: PR"
 ep3_fireside_chat_learning: "Беседа у камина: Политика"
 ep3_fireside_chat_martial: "Беседа у камина: Безопасность"
 ep3_fireside_chat_stewardship: "Беседа у камина: Экономика"
 ep3_governor_yearly.3040.a.flavor: "Такой сыновнический политический капитал мог только укрепить нас обоих."
 ep3_governor_yearly.3040.desc: "Я начал бороться с воспоминаниями — действительно ли [emperor.GetPrimaryTitle.GetName] был всего лишь полной тьмой и хаосом до того, как благородный [emperor.GetTitledFirstName] взял в руки скипетр [emperor.GetHerHis]?\n\n Мечтали ли светские дамы о чем-либо, кроме как разделить компанию [emperor.GetHouse.GetName]? Скандировали ли наши солдаты имя какого-то уродливого, невнятного чужака? Наши магнаты — снисходили ли они целовать ноги, не сотканные из совершенной плоти [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip]?\n\n Мне на самом деле нет нужды вспоминать. Ставить под сомнение непогрешимый мандат моего суверена было бы бесполезно."
 ep3_governor_yearly.8070.desc: "Почести, репутация, власть. Быть [ROOT.Char.GetTitleAsNameNoTooltip] может приносить эти вещи, но #EMP есть#! и издержки...\n\nГоры [ROOT.Char.Custom('GetWritingMaterial')] ждут, свернувшись, моего печати или взгляда, в то время как бесчисленные бюрократы борются за возможность заполнить мои уши ошеломляющими деталями.\n\nНикто не сказал мне, что будет так #EMP много#! работы — и работы, которая в конечном итоге, кажется, делает себя сама."
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "На протяжении десятилетий я шел по стопам интеллектуалов и противостоял гневу людей. Моя поэзия неуклонно росла в партийной марке, и все же... \n\nЧто-то упущено. Теперь, когда на меня надвигаются закатные годы, возможно, пришло время покинуть [cordoba.GetName] и дать себе широкий взгляд на мир? \n\nДругая неразрывная часть меня все еще тянет мое сердце остаться. Я построил здесь жизнь не только для себя, но и для множества учеников, которых обучали здесь на протяжении многих лет. \n\nБудь то благодаря ученым, которые проходят по его улицам, или знакомой патине его стен, #EMP что-то #! держит меня привязанным к этому городу, моему дому."
