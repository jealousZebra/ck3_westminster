 scheme_critical_moments.4001.desc.intro: "Я прикасаюсь [ROOT.Char.Custom('RegionalAlcoholicDrink')] к губам с удовлетворённым выражением лица. Я защитил мой мандат [target.GetTitleAsNamePossessiveNoTooltip]... и взгляд [target.GetHerHis] на меня.\n\n"
