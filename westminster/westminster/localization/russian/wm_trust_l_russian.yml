l_russian:
 # Public trust (common/scripted_effects/wm_trust_effects.txt)
 wm_trust_clean_up_decision: "Обязуюсь очистить политику"
 wm_trust_clean_up_decision_desc: "#bold Общественное доверие к политике: [EmptyScope.ScriptValue('wm_ui_public_trust')|0] из 100#!, при ожидаемой явке на всеобщих выборах около [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%.\n\nНизкое доверие увеличивает вероятность бунтов, повышает рейтинг малых и новых партий и удерживает избирателей дома; высокое доверие помогает правительству. Повороты, невыполненные обещания, бунты и их полиция, скандалы и грязные кампании его разрушают; популярные законы, соблюденные обещания и чистые кампании укрепляют его.\n\nПакет стандартных реформ покажет стране, что Вестминстер слушает."
 wm_trust_clean_up_decision_tooltip: "Общественное доверие: [EmptyScope.ScriptValue('wm_ui_public_trust')|0] из 100."
 wm_trust_clean_up_decision_confirm: "Сделать обещание"
 wm_trust_clean_up_decision_not_pledged_tt: "Вы еще не сделали обязательство по уборке, которое все еще действует"
 wm_trust_clean_up_decision_effect_tt: "Общественное доверие растёт на #P 5#! пунктов. Если в ближайшие три года вспыхнет скандал, обещание нарушается: доверие падает ещё #N 4#! пунктов, и вы теряете лицо."

 wm_trust_promise_broken_toast: "ОБЕЩАНИЕ НАРУШЕНО"
 wm_trust_promise_broken_toast_desc: "Ранние выборы, обещанные протестующим, так и не состоялись. Доверие общественности упало на #N 6#! пунктов."

 wm_trust.10.t_expenses: "Expenses Row Engulfs Westminster"
 wm_trust.10.t_lobbying: "Лоббинг Роу"
 wm_trust.10.t_unity: "Момент национального единства"
 wm_trust.10.t_standards: "Свидетельство о полной здоровье"
 wm_trust.10.desc_expenses: "#italic Первая полоса#!\n\n Запрос на получение информации стал причиной раскрытия расходов депутатов, и газеты публикуют их по одной странице в день: пресс для брюк здесь, тепловая лампа для террасы там, второй дом оказывается первым. Никто не нарушил правила, говорят власти Палаты, в этом и суть.\n\n Ни одна партия не избежала критики, и общественность осталась ими не впечатлена."
 wm_trust.10.desc_lobbying: "#italic Первая полоса#!\n\n Под прикрытием журналисты, притворяясь иностранной консалтинговой компанией, снимали серию бывших министров, предлагающих открыть двери за плату. Правительство утверждает, что правила были соблюдены; оказывается, правила писали бывшие министры.\n\n На правительство выпадает худшее."
 wm_trust.10.desc_unity: "#italic Первая полоса#!\n\n На этот раз вся страна наблюдает за одним и тем же: спортивной победой, героическим спасением, национальным праздником. Политиков всех партий фотографируют вместе, как они ликуют, и несколько дней никто их не освистывает.\n\n Правительство получает долю тепла и похвалы."
 wm_trust.10.desc_standards: "#italic Внутренние страницы#!\n\n Ежегодный отчет Комитета по стандартам признает поведение Вестминстера лучшим за годы: меньше жалоб, быстрее расследования и никто не был снят на видео в неприятной ситуации. Это не сенсационная новость, именно поэтому она полезна."
 wm_trust.10.desc_trust: "\n\n#bold Доверие населения к политике теперь [EmptyScope.ScriptValue('wm_ui_public_trust')|0] из 100.#!"
 wm_trust.10.a: "Публикуйте каждый чек."
 wm_trust.10.b: "Держаться тихо."
 wm_trust.10.c: "Наслаждайся, пока длится."
