l_russian:
 # Electing the Speaker (common/scripted_effects/wm_speaker_effects.txt)
 wm_speaker.1.t: "Кафедра вакантна"
 wm_speaker.1.desc: "Палата общин должна избрать нового спикера: депутата, который поддерживает порядок, предоставляет слово членам и навсегда отказывается от партийной принадлежности. Номинации закрываются через неделю; затем каждый депутат голосует тайным голосованием, раунд за раундом, пока кто-то не получит больше половины голосов.\n\nВы можете выставить свою кандидатуру. Спикер покидает свою партию и больше никогда не занимает должность, но кресло приносит большую престижность."
 wm_speaker.1.a: "Выдвигай моё имя."
 wm_speaker.1.a.tt: "Вы баллотируетесь на пост спикера. Если вы будете избрани, вы покидаете свою партию и садитесь выше неё."
 wm_speaker.1.b: "Не для меня."
 wm_speaker.2.t: "Кресло спикера"
 wm_speaker.2.desc: "Палата выбрала вас своим спикером после [EmptyScope.ScriptValue('wm_speaker_rounds_value')|0] голосований. По традиции вас тащат к креслу, делая вид, что вы не хотите этого. С сегодняшнего дня вы не принадлежите ни к какой партии."
 wm_speaker.2.a: "Порядок! Порядок!"
 wm_speaker_elected_toast: "Избран новый спикер"
 wm_speaker_elected_toast_desc: "[wm_speaker_new.GetName] является новым Спикером Палаты общин, с [EmptyScope.ScriptValue('wm_speaker_last_votes_value')|0] голосами [EmptyScope.ScriptValue('wm_speaker_last_turnout_value')|0] после [EmptyScope.ScriptValue('wm_speaker_rounds_value')|0] бюллетеней."
