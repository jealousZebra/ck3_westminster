l_polish:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "Praca partii"
 wm_job_canvassing_contract: "Akcja wyborcza"
 wm_job_canvassing_desc_title: "Poszukiwani pukający do drzwi"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] potrzebuje wolontariuszy przy drzwiach w ten weekend: arkusze, ulotki i gruba skóra. Partia zauważa, kto przychodzi na deszczu."
 wm_job_canvassing_request: "Spędzić trzy tygodnie, pukając do drzwi. Sukces zależy od twojego [diplomacy|E]."
 wm_job_fundraising_contract: "Kolacja charytatywna"
 wm_job_fundraising_desc_title: "Pomoc w wypełnianiu tabel"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] organizuje kolację charytatywną i potrzebuje kogoś, kto sprzeda stoły, będzie ścigał darczyńców i dopilnuje, aby loteria była uczciwa."
 wm_job_fundraising_request: "Zorganizuj kolację w ciągu trzech tygodni. Sukces zależy od twojego [stewardship|E]."
 wm_job_speechwriting_contract: "Pisanie przemówień"
 wm_job_speechwriting_desc_title: "Przemówienie, które trafia"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName] ma wkrótce wielką przemowę, a obecny szkic jest, według ich biura, “wideo zakładnika”."
 wm_job_speechwriting_request: "Napisz przemówienie przez trzy tygodnie. Sukces zależy od twojej [learning|E]."
 wm_job_research_contract: "Badania Opozycji"
 wm_job_research_desc_title: "Zagłęb się w drugą stronę"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] chce briefingu o swoich przeciwnikach: zapisy głosowań, stare tweety, złamane obietnice. Wszystko publiczne, wszystko użyteczne."
 wm_job_research_request: "Sporządź dossier przez trzy tygodnie. Sukces zależy od twojego [intrigue|E]."
 wm_job_phonebank_contract: "Telefoniczna baza danych"
 wm_job_phonebank_desc_title: "Wieczór przy telefonach"
 wm_job_phonebank_desc: "[TaskContract.GetEmployer.GetName] znajduje się lista czterystu członków, którzy nie przedłużyli kontraktu, pokój z pożyczonymi telefonami i scenariusz, którego nikt nie ćwiczył.  Zespół"
 wm_job_phonebank_request: "Pracuj przez listę telefoniczną przez trzy tygodnie. Sukces zależy od twojego [diplomacy|E]."
 wm_job_policy_paper_contract: "Dokument polityczny"
 wm_job_policy_paper_desc_title: "Dziesięć stron, w pełni wycenionych"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] chce powiedzieć coś o lokalnych autobusach, co nie jest hasłem: dowody, liczby i rekomendacja, którą minister mógłby podepsać."
 wm_job_policy_paper_request: "Pisz pracę przez trzy tygodnie. Sukces zależy od twojej [learning|E]."
 wm_job_media_round_contract: "Runda Medialna"
 wm_job_media_round_desc_title: "Sześć studiów przed śniadaniem"
 wm_job_media_round_desc: "Lokalne radio, telewizja regionalna i dwa podcasty chcą, by ktoś ze strony [TaskContract.GetEmployer.GetName] wyszedł i bronił linii. Nikt inny się nie zgłosił."
 wm_job_media_round_request: "Przygotuj kwestie i przeprowadź rozmowy przez trzy tygodnie. Sukces zależy od twojej [intrigue|E]."
 wm_job_gotv_contract: "Zachęcać do głosowania"
 wm_job_gotv_desc_title: "Uśpij ich, wyciągnij ich stąd"
 wm_job_gotv_desc: "[TaskContract.GetEmployer.GetName] potrzebuje biegaczy na wybory uzupełniające do rady: kart wyborczych, numerów kasjerów i wielu schodów w wielu blokach mieszkalnych."
 wm_job_gotv_request: "Przeprowadź operację mobilizacji wyborców przez trzy tygodnie. Sukces zależy od twojego [prowess|E]."
 wm_job_budget_contract: "Kosztowanie zobowiązania"
 wm_job_budget_desc_title: "Skąd pochodzą pieniądze?"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName] obiecał coś drogiego, a druga strona ciągle pyta, jak to zostanie opłacone. Arkusz kalkulacyjny jest potrzebny, pilnie."
 wm_job_budget_request: "Koszt zobowiązania przez trzy tygodnie. Sukces zależy od twojego [stewardship|E]."
 wm_selection_contract: "Ocena kandydata"
 wm_selection_contract_contract: "Ocena kandydata"
 wm_selection_contract_desc_title: "Zatwierdzona lista partii"
 wm_selection_contract_desc: "Zanim ktokolwiek będzie mógł stanąć z ramienia partii, musi przejść dzień oceny: próbny wywiad, test polityki oraz odgrywanie roli z rozgniewanym “wyborcą”."
 wm_selection_contract_request: "Zdaj ocenę, aby dołączyć do listy zatwierdzonych kandydatów. Sukces zależy od twojego [diplomacy|E]."

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "Aplikacje otwarte w [wm_sel_seat.GetName]"
 wm_career.20.desc: "Lokalny [wm_sel_party.GetName] wybiera swojego kandydata do [wm_sel_seat.GetName]. E-mail od przewodniczącego okręgu jest krótki: zgłoszenia kończą się za kilka tygodni, a spotkania wyborcze odbędą się w centrum społeczności.\n\n Osoby, które startują w takich okręgach, stają się posłami."
 wm_career.20.a: "Zgłoszę swoje nazwisko."
 wm_career.20.b: "Nie ten."
 wm_career.21.t: "Hustings w [wm_sel_seat.GetName]"
 wm_career.21.desc: "Plastikowe krzesła, termos na herbatę i sześćdziesięciu członków partii, którzy słyszeli każdą propozycję wcześniej. Każdy kandydat ma dziesięć minut i pytania z sali. Jak ich przekonać?"
 wm_career.21.a: "Opowiedz o okolicy: głównej ulicy, autobusach, ludziach."
 wm_career.21.b: "Określ plan kosztowy, polisa po polisie."
 wm_career.21.c: "Delikatnie przypomnij im, co inni kandydaci powiedzieli w przeszłości."
 wm_career.21.success: "Pokój ocieplił się dla ciebie."
 wm_career.21.failure: "Pokój pozostał zimny."

 wm_career_selected_toast: "Wybrano do [wm_sel_seat.GetName]"
 wm_career_selected_toast_desc: "Lokalny [wm_sel_party.GetName] wybrał cię jako swojego kandydata. Wygraj mandat w najbliższych wyborach lub wyborach uzupełniających i zostaniesz posłem."
 wm_career_not_selected_toast: "Nie wybrany w [wm_sel_seat.GetName]"
 wm_career_not_selected_toast_desc: "Członkowie wybrali [wm_sel_winner.GetName]. Następnym razem będziesz lepiej znany."
 wm_career_elected_toast: "Wybrany do parlamentu"
 wm_career_elected_toast_desc: "Liczenie padło, a mandat należy do ciebie. Zespół kampanijny jest rozłączony; dyscypliny twojej partii się skontaktują."

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "Aplikuj do wyboru"
 wm_career_apply_decision_desc: "Zgłoszę swoje kandydata na kandydata mojej partii w okręgu, w którym lokalni członkowie wybierają kandydata. Kandydatura partii: [GetPlayer.MakeScope.Var('wm_standing').GetValue|0]."
 wm_career_apply_decision_tooltip: "Ubiegaj się o kandydaturę partii na mandat"
 wm_career_apply_decision_free_tt: "Nie aplikowałem jeszcze na miejsce ani nie został wybrany jako kandydat"
 wm_career_apply_decision_standing_tt: "Na liście zatwierdzonych kandydatów partii lub z Pozycją Partii co najmniej 30"
 wm_career_apply_decision_open_tt: "Partia wybiera kandydata gdzieś"
 wm_career_apply_decision_effect_tt: "Aplikujesz do jednego z otwartych wyborów partii, najlepiej w swoim kraju, i przemawiasz na jej wyborach."
 wm_career_return_decision: "Z powrotem na szlaku kampanii"
 wm_career_return_decision_desc: "Wyborcy się wypowiedzieli i mogą zmienić zdanie. Zgromadź zespół kampanii i szukaj miejsca w parlamencie."
 wm_career_return_decision_tooltip: "Ponownie się ubiegać po utracie miejsca"
 wm_career_return_decision_effect_tt: "Otrzymujesz zespół kampanijny, dołączasz do zatwierdzonej listy kandydatów partii i możesz aplikować o selekcje."

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "Wykonał dla mnie dobrą pracę"
 wm_career_poor_work_opinion: "Zawieś mnie"
 wm_career_apply_decision_confirm: "Złóż moją aplikację"
 wm_career_return_decision_confirm: "Z powrotem na progi"
