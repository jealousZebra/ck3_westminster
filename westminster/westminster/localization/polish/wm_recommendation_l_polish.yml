 wm_recommendation.1.t: "Podoba ci się Westminster?"
 wm_recommendation.1.desc: "Jeśli Westminster zasłużył na miejsce w twoim zestawie modów, pozytywna ocena w Warsztacie Steam pomoże innym graczom CK3 go odkryć. Dziękujemy za grę i wsparcie rozwoju moda."
 wm_recommendation.1.a: "Wystawię ocenę na Steamie."
 wm_recommendation.1.b: "Wracam do Westminsteru."
