l_polish:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "Rioters w [wm_riot_seat.GetName]"
 wm_riot_gathering_toast_desc: "Wściekłe tłumy zgromadziły się w [wm_riot_seat.GetName]. [wm_riot_organiser.GetName] organizuje marsz protestacyjny do Westminsteru."
 wm_riot_marching_toast: "[wm_riot_seat.GetName]"
 wm_riot_marching_toast_desc: "Marsz protestacyjny z [wm_riot_seat.GetName] wyruszył do Westminster, prowadzony przez [wm_riot_organiser.GetName]. Dotrze tam w ciągu miesiąca ze swoimi żądaniami."

 wm_riot_demand_1_desc: "\n\nChcą pomocy w #bold kosztach utrzymania#!: rachunki, czynsze i ceny żywności wzrosły do niebotycznych poziomów i mówią, że rząd się tym nie przejmuje."
 wm_riot_demand_2_desc: "\n\nChcą #bold dymisji ministra#!: ktoś w Gabinecie musi wziąć winę na siebie i chcą głowy."
 wm_riot_demand_3_desc: "\n\nChcą #bold wybory powszechne#!: mówią, że rząd nie ma mandatu na to, co robi, i kraj powinien zdecydować."
 wm_riot_demand_4_desc: "\n\nThey want a #bold U-turn#!: a policy they hate scrapped, now, with no ifs or buts."

 wm_riot.10.t: "Kłopoty w [wm_riot_seat.GetName]"
 wm_riot.10.desc: "Telefon w moim biurze wyborczym nie przestaje dzwonić. Setki ludzi są na ulicach [wm_riot_seat.GetName], sklepy mają opuszczone okiennice, a lokalny aktywista [wm_riot_organiser.GetName] mówi kamerom, że tłum przemaszeruje na Westminster, jeśli ktoś nie posłucha."
 wm_riot.10.a: "Wyjdź i porozmawiaj z nimi."
 wm_riot.10.a.success: "Tłum słucha i wraca do domu"
 wm_riot.10.a.failure: "Zrzucony z ulicy"
 wm_riot.10.b: "Publicznie powiedzieć, że mają rację."
 wm_riot.10.c: "Trzymam głowę nisko i pozwól Numerowi 10 się tym zająć."

 wm_riot.20.t: "Marsz dociera do Westminsteru"
 wm_riot.20.desc: "Parliament Square jest pełen transparentów."
 wm_riot.20.desc_first: "Marsz protestacyjny [wm_riot_seat.GetName] dotarł, a jego organizator, [wm_riot_organiser.GetName], poprosił o spotkanie ze mną z listą żądań."
 wm_riot.20.desc_bigger: "Marsz z [wm_riot_seat.GetName] wrócił, większy i bardziej rozzłoszczony niż wcześniej. [wm_riot_organiser.GetName] mówi, że nie będzie więcej rozmów."
 wm_riot.20.desc_gone: "\n\nW momencie, gdy przeczytałem streszczenie, tłum rozszedł się do domów."
 wm_riot.20.a: "Daj im to, czego chcą."
 wm_riot.20.b: "Zaproś organizatorów do rozmowy."
 wm_riot.20.b.success: "Osiągnięto kompromis"
 wm_riot.20.b.failure: "Rozmowy upadają."
 wm_riot.20.c: "Powiedz policji, aby oczyściła plac."
 wm_riot.20.c.dispersed: "Policja oczyszcza plac"
 wm_riot.20.c.violence: "Sceny przemocy w wieczornych wiadomościach"
 wm_riot.20.d: "Dobrze."

 wm_riot_county_modifier: "Zamieszki"
 wm_riot_county_modifier_desc: "Wściekłe tłumy są na ulicach, a marsz protestacyjny trwa."
 wm_riot_demands_met_county_modifier: "Wymagania spełnione"
 wm_riot_demands_met_county_modifier_desc: "Rząd dał protestującym to, czego chcieli."
 wm_riot_compromise_county_modifier: "Kompromis"
 wm_riot_compromise_county_modifier_desc: "Protestujący wrócili do domu z porozumieniem."
 wm_riot_policed_county_modifier: "Protest rozbity Marsz protestacyjny"
 wm_riot_policed_county_modifier_desc: "Policja rozproszyła marsz protestacyjny, a ludzie tutaj tego nie zapomnieli."
 wm_riot_crackdown_county_modifier: "Przemoc policyjna"
 wm_riot_crackdown_county_modifier_desc: "Zdjęcia policji atakującej marsz protestacyjny są nadal udostępniane."
 wm_mp_backed_protesters_county_modifier: "poseł poparł protest"
 wm_mp_backed_protesters_county_modifier_desc: "Lokalny poseł stanął po stronie protestujących."
 wm_cost_of_living_package_modifier: "Pakiet kosztów utrzymania"
 wm_cost_of_living_package_modifier_desc: "Pomoc w opłatach, pokrywana przez rząd."
 wm_u_turn_modifier: "Ostry zwrot"
 wm_u_turn_modifier_desc: "Zmuszeni do upokarzającego zwrotu przez marsz protestacyjny."
 wm_heavy_handed_modifier: "Brutalna ręka"
 wm_heavy_handed_modifier_desc: "Wysłałem policję przeciwko marszowi protestacyjnemu."
 wm_crackdown_modifier: "obwiniani o przemoc policyjną"
 wm_crackdown_modifier_desc: "Pilnowanie pochodu protestacyjnego, który stał się agresywny, a wina spadła tutaj."

 wm_forced_to_resign_opinion: "Zmusiła mnie do rezygnacji"
 wm_backed_protesters_opinion: "Opowiedział się po stronie protestujących"
 wm_policed_my_constituents_opinion: "Wysłałem policję przeciwko moim wyborcom"
