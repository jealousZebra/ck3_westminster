l_polish:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "KOALICJA UZGODNIONA"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] i [wm_coal_leader.GetName] uścisnęli sobie ręce na schodach numer 10. [wm_coal_party.GetNameNoTier] ([wm_coal_party_seats|0] miejsca) dołącza do [wm_coal_senior.GetNameNoTier] ([wm_coal_senior_seats|0]) w rządzie, a [wm_coal_leader.GetFirstName] zostaje zastępcą premiera."
 wm_coalition_headline_supply: "UMOWA ZAWARTA: RZĄD PODPARTY"
 wm_coalition_headline_supply_desc: "[wm_coal_party.GetNameNoTier] zawarł umowę o zaufaniu i wsparciu z rządem [wm_coal_pm.GetName]. Jego [wm_coal_party_seats|0] posłów popiera rząd w głosowaniach nad wotum zaufania i budżetem, a jego lider zapewnił środki na swoje priorytety. We wszystkich innych sprawach każdy głosuje według własnego uznania."
 wm_coalition_headline_minority: "RZĄD MNIEJSZOŚCIOWY"
 wm_coalition_headline_minority_desc: "Rozmowy nie przyniosły rezultatów. [wm_coal_pm.GetName] poprowadzi rząd [wm_coal_senior.GetNameNoTier] mniejszości z [wm_coal_senior_seats|0] miejscami i będzie musiał wygrać każde głosowanie w Izbie Gmin w trudny sposób."
 wm_coalition_headline_collapse: "KOALICJA ZAŁAMUJE SIĘ"
 wm_coalition_headline_collapse_desc: "[wm_coal_party.GetNameNoTier] opuścił rząd [wm_coal_pm.GetName]. Bez jego głosów rząd nie ma większości, a Westminster przygotowuje się na głosowanie nad wotum nieufności lub wybory."

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "Parlament zawieszony"
 wm_coalition.1.desc: "The country has spoken, and nobody quite knows what it said. The [wm_coal_senior.GetNameNoTier] is the largest party with #bold [wm_coal_senior_seats|0]#! seats, short of the [wm_coal_majority|0] needed to win votes in the Commons on our own.\n\nThe Cabinet Secretary has the civil service's negotiating rooms ready. The other parties' leaders are waiting by their phones, and the press is camped outside Number 10. Who do we call?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] miejsc"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] miejsc"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] miejsc"
 wm_coalition.1.a: "Otwarte rozmowy z [wm_coal_choice_1.GetNameNoTier]."
 wm_coalition.1.b: "Otwarte rozmowy z [wm_coal_choice_2.GetNameNoTier]."
 wm_coalition.1.c: "Otwarte rozmowy z [wm_coal_choice_3.GetNameNoTier]."
 wm_coalition.1.d: "Będziemy rządzić sami i odważymy się, żeby nas obalili."
 wm_coalition.1.d.tt: "Kierujesz #bold mniejszościowym rządem#!: każdy projekt ustawy i każdy głos zaufania musi znaleźć poparcie w dniu głosowania."

 # The terms
 wm_coalition.2.t: "Stół negocjacyjny"
 wm_coalition.2.desc: "Zespół [wm_coal_talks.GetNameNoTier], kierowany przez [wm_coal_talks_leader.GetName], przybył do Gabinetu z długą listą żądań. Mają #bold [wm_coal_talks_seats|0]#! posłów; z naszymi, daje to [wm_coal_combined_seats|0]."
 wm_coalition.2.majority: "Razem mielibyśmy większość."
 wm_coalition.2.no_majority: "Nawet razem nie mielibyśmy większości, ale to najlepsza dostępna oferta."
 wm_coalition.2.mood_warm: "\n\nThe mood is warm. Their negotiators agree with much of our manifesto and want to be in government."
 wm_coalition.2.mood_cool: "\n\nThe mood is businesslike. They will want a lot in return, and their activists are wary of being blamed for our mistakes."
 wm_coalition.2.mood_cold: "\n\nThe mood is frosty. Our parties are far apart, and their MPs would rather sit in opposition than prop us up cheaply."
 wm_coalition.2.a: "Zaproponuj koalicję: wicepremiera i jedno miejsce w gabinecie."
 wm_coalition.2.a.tt: "Ich lider zostaje #bold wicepremierem#! i jeden z ich posłów dołącza do gabinetu. Ich posłowie głosują zgodnie z dyscypliną rządową przy każdym głosowaniu."
 wm_coalition.2.b: "Zaproponuj koalicję i przyjmij jedną z ich flagowych polityk."
 wm_coalition.2.b.tt: "Jak wyżej, ich ulubiona polityka trafia do programu rządowego. Nasi własni posłowie z tylnych ław nie będą z tego zadowoleni: #bold Coalition Compromise#! przez pięć lat."
 wm_coalition.2.c: "Zaproponuj koalicję z dwoma miejscami w rządzie i jedną z ich polityk."
 wm_coalition.2.c.tt: "Ich lider zostaje #bold wicepremierem#!, dwóch z ich posłów dołącza do gabinetu, a ich ulubiona polityka trafia do programu rządowego."
 wm_coalition.2.d: "Oferować zaufanie i zaopatrzenia: swoje głosy na temat zaufania i budżetu, za pieniądze."
 wm_coalition.2.d.tt: "Trzymają się z dala od rządu, ale wspierają nas w #bold aktach wotum zaufania #! i #bold Finance Bill#!. W zamian finansujemy ich priorytety: kosztuje nas to pieniądze i przekazuje je ich liderowi."
 wm_coalition.2.e: "Spróbujmy innej partii."
 wm_coalition_signals_yes_tt: "Ich negocjatorzy sygnalizują, że mogą podpisać to."
 wm_coalition_signals_no_tt: "Ich negocjatorzy sygnalizują, że to nie wystarczy."

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "Oferta koalicji"
 wm_coalition.3.t_supply: "Oferta pewności i poparcia"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName] dzwonił. [wm_coal_senior.GetNameNoTier] ma [wm_coal_senior_seats|0] miejsc, brakuje większości, i chce, żebyśmy byli w rządzie: ty jako #bold wicepremier #! oraz [wm_coal_offer_seats|0] naszych posłów przy stole gabinetu. W zamian nasi posłowie głosowaliby razem z rządem we wszystkim."
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName] wezwał. [wm_coal_senior.GetNameNoTier] ma [wm_coal_senior_seats|0] miejsc, brakuje większości, i chce, żebyśmy byli w rządzie: ty jako #bold wicepremier #!, [wm_coal_offer_seats|0] naszych posłów przy stole gabinetowym oraz jedna z naszych flagowych polityk w programie rządowym. W zamian nasi posłowie głosowaliby z rządem we wszystkim."
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName] wezwał. [wm_coal_senior.GetNameNoTier] ma [wm_coal_senior_seats|0] mandatów, brakuje większości, i chce porozumienia o zaufaniu i finansowaniu: nasi posłowie popierają rząd w głosowaniach nad wotum zaufania i budżecie, a w zamian rząd finansuje nasze priorytety. We wszystkim innym moglibyśmy głosować, jak chcemy."
 wm_coalition.3.a: "Mamy porozumienie."
 wm_coalition.3.a.tt: "Umowa została podpisana i [wm_coal_pm.GetFirstName] będzie ci coś winien."
 wm_coalition.3.b: "Dziękuję, ale nie"
 wm_coalition.3.b.tt: "Nasi posłowie pozostają w opozycji, wolni głosować przeciwko rządowi."

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "Umowa zawarta"
 wm_coalition.4.t_refused: "rozmowy się załamały"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName] się zgodził. [wm_coal_party.GetNameNoTier] dołącza do rządu, [wm_coal_leader.GetFirstName] zostaje Zastępcą Premiera, a prasa już nazywa to małżeństwem z rozsądku. Jej posłowie wezmą nasze bat."
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName] się zgodził. [wm_coal_party.GetNameNoTier] wesprze nas w głosowaniach nad wotum zaufania i ustawie finansowej, za pewną cenę. We wszystkim innym dyscyplinarze będą musieli zdobywać swoich posłów jednym głosem na raz."
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName] odrzucił naszą propozycję. [wm_coal_talks.GetNameNoTier] mówi, że nasza oferta znacznie odbiega od tego, co jego członkowie by zaakceptowali."
 wm_coalition.4.a: "Nowy rozdział dla kraju."
 wm_coalition.4.b: "Słodź ofertę."
 wm_coalition.4.c: "Spróbuj innej partii."
 wm_coalition.4.d: "Wtedy rządzimy sami."

 # Breakdown
 wm_coalition.20.t: "Czas odejść?"
 wm_coalition.20.desc_coalition: "Nasi posłowie są niespokojni. Każda niepopularna decyzja rządu jest przypisana nam, a [wm_coal_senior.GetNameNoTier] przypisuje sobie zasługi za wszystko, co idzie dobrze. Niektórzy chcą, żebyśmy dziś opuścili koalicję."
 wm_coalition.20.desc_supply: "Nasi posłowie są niespokojni. Podtrzymywanie rządu [wm_coal_pm.GetName] nas kosztuje, a pieniądze na nasze priorytety nie przyniosły nam wdzięczności, na którą liczyliśmy. Niektórzy chcą dziś zerwać tę umowę."
 wm_coalition.20.polls_bad: "\n\nThe polls are grim: we are well down since we did the deal."
 wm_coalition.20.polls_ok: "\n\nThe polls are holding up, for now."
 wm_coalition.20.a: "Wychodzimy. Niech rząd radzi sobie sam."
 wm_coalition.20.a.tt: "Umowa się kończy. Rząd traci głosy waszych posłów i może stanąć przed wotum nieufności lub wyborami. Premier wam nie wybaczy."
 wm_coalition.20.b: "Dotrzymaliśmy słowa. Zostajemy."
 wm_coalition.21.t: "nasi partnerzy odchodzą"
 wm_coalition.21.desc: "Nasi partnerzy odeszli, a wraz z nimi nasza większość. Opozycja wyczuwa krew, prasa chce wiedzieć, czy przetrwamy, a główny dyscyplinarz już liczy głowy."
 wm_coalition.21.a: "Kontynuujemy jako rząd mniejszościowy."
 wm_coalition.21.a.tt: "Każdy głos w Izbie Gmin będzie walką."
 wm_coalition.21.b: "Znajdź nowych partnerów."
 wm_coalition.21.c: "Pozwól krajowi zdecydować: zwołaj wybory powszechne."
 wm_coalition.21.c.tt: "Parlament zostaje rozwiązany, a za pięć tygodni od #bold będą się wybory powszechne #!."

 # Decision
 wm_coalition_leave_decision: "Opuścić rządowy układ"
 wm_coalition_leave_decision_desc: "Wycofaj swoją partię z umową z rządem. Twoi posłowie będą mogli głosować, jak chcą, rząd straci większość, a premier nigdy ci tego nie wybaczy."
 wm_coalition_leave_decision_tooltip: "Zakończ swoją koalicję lub umowę o zaufaniu i wsparciu"
 wm_coalition_leave_decision_confirm: "Wychodzić"
 wm_coalition_leave_decision_effect_tt: "Umowa się kończy. Rząd traci głosy waszych posłów i może stanąć przed wotum nieufności lub wyborami."
 wm_coalition_leave_no_election_desc: "Nie ogłoszono wyborów powszechnych"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "Zastępca Premiera"
 wm_coalition_deputy_pm_modifier_desc: "Drugi w rządzie i lider junior partnera koalicyjnego."
 wm_coalition_compromise_modifier: "Kompromis koalicyjny"
 wm_coalition_compromise_modifier_desc: "Jedna z głównych polityk partnera koalicyjnego znajduje się w programie rządu, a nasi własni szeregowi posłowie narzekają."
 wm_coalition_supply_deal_modifier: "Umowa o zaufaniu i dostawie"
 wm_coalition_supply_deal_modifier_desc: "wspiera rząd w kwestiach wotum zaufania i budżetu, a także ma środki na swoje priorytety, które to potwierdzają."
 wm_coalition_partner_opinion: "Partner koalicyjny"
 wm_coalition_walked_out_opinion: "Odeszliśmy z naszego rządu"
 wm_coalition_deputyship_diarchy_type: "Koalicja"
 wm_coalition_deputyship_diarch_title: "Zastępca Premiera"
