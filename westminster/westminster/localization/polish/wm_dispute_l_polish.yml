l_polish:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "Hrabia"
 wm_dispute.1.desc: "#italic Deklaracja urzędnika powrotnego#!\n\n[wm_dispute_mp.GetName] został uznany za zwycięzcę w [wm_dispute_seat.GetNameNoTier] z przewagą [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] punktów."
 wm_dispute.1.close: "Jest na tyle blisko, że agenci już szepczą o paczkach głosów policzonych dwa razy i o pudełku, które dotarło z opóźnieniem. Ponowne przeliczenie głosów (tydzień, [EmptyScope.ScriptValue('wm_dispute_recount_cost')|0] opłat) mogłoby to zmienić, być może z szansą na [EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0]%; petycja wyborcza (cztery miesiące i [EmptyScope.ScriptValue('wm_dispute_court_cost')|0]) mogłaby unieważnić wynik i mandat mógł ponownie walczyć, być może z [EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0]% szans."
 wm_dispute.1.clear: "Nie jest blisko. Ponowne liczenie ([EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]) najprawdopodobniej niczego nie zmieni, a społeczeństwo nie lubi złego przegranego: kwestionowanie tego kosztuje cię rozpoznawalność i kapitał polityczny."
 wm_dispute.1.bad: "To nawet nie było blisko: miażdżąca porażka. Kwestionowanie tego uczyniłoby cię pośmiewiskiem i mogłoby wyciągnąć na ulice rozgniewanych zwolenników."
 wm_dispute.1.a: "Gratulacje dla zwycięzcy."
 wm_dispute.1.b: "Wymagaj ponownego przeliczenia głosów."
 wm_dispute.1.b.tt: "Każda karta do głosowania jest liczona ponownie. Kosztuje to pieniądze; jeśli wynik nie był bliski, kosztuje cię również profil i kapitał polityczny."
 wm_dispute.1.c: "Petycja do sądu wyborczego."
 wm_dispute.1.c.tt: "Sędziowie badają przebieg wyborów. Jest to powolne i kosztowne; mogą uznać wybory za nieważne i zarządzić ponowne wybory uzupełniające, lub obciążyć cię kosztami."
 wm_dispute_recount_toast: "Opowieść w [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName] zażądał ponownego przeliczenia w [wm_dispute_seat.GetNameNoTier]. Personel liczący wrócił do swoich stołów."
 wm_dispute_court_toast: "Wniosek wyborczy: [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName] złożył petycję do sądu wyborczego w sprawie wyniku w [wm_dispute_seat.GetNameNoTier]. Sędziowie przedstawią raport za kilka miesięcy."
 wm_dispute_overturned_toast: "PONOWNE PRZELICZENIE UNIEWAŻNIA WYNIK"
 wm_dispute_overturned_toast_desc: "Po przeliczeniu głosów, [wm_dispute_mp.GetName] zostaje wybrany posłem dla [wm_dispute_seat.GetNameNoTier] różnicą kilku głosów."
 wm_dispute_upheld_toast: "ponowne przeliczenie potwierdza wynik"
 wm_dispute_upheld_toast_desc: "Ponowne przeliczenie w [wm_dispute_seat.GetNameNoTier] potwierdza [wm_dispute_mp.GetName] jako jego posła."
 wm_dispute_void_toast: "WYBORY UZNANE ZA NIEWAŻNE"
 wm_dispute_void_toast_desc: "Sąd wyborczy uznał wynik [wm_dispute_seat.GetNameNoTier] nieważny. Odbędą się nowe wybory uzupełniające."
 wm_dispute_dismissed_toast: "Wniosek wyborczy oddalony"
 wm_dispute_dismissed_toast_desc: "Sąd wyborczy oddalił wniosek w sprawie [wm_dispute_seat.GetNameNoTier] i przyznał odszkodowanie wnioskodawcze. [wm_dispute_mp.GetName] wstrzymanie."
 wm_dispute_national_toast: "ODMAWIA UDANIA"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] nie zaakceptują wyniku wyborów powszechnych. Nic się nie zmieni, ale zwolennicy zbierają się na ulicach, a gazety są bezlitosne."
 wm_dispute_seat_decision: "Wyzwanie dla Hrabiego"
 wm_dispute_seat_decision_desc: "Straciłeś mandat, ale czy liczenie było poprawne? Zażądaj ponownego przeliczenia głosów lub odwołaj się do sądu wyborczego o unieważnienie wyborów. Jeśli nie było blisko, społeczeństwo zobaczy kiepskiego przegranego."
 wm_dispute_seat_decision_tooltip: "Zakwestionuj wynik w okręgu, który przegrałeś."
 wm_dispute_seat_decision_confirm: "Rozważ to"
 wm_dispute_seat_decision_effect_tt: "Decydujesz, czy zaakceptować wynik, żądać przeliczenia #bold#! lub wnieść skargę do sądu wyborczego #bold#!."
 wm_dispute_not_disputed_tt: "Wynik nie został jeszcze zakwestionowany."
 wm_dispute_no_byelection_tt: "Miejsce nie czeka na wybory uzupełniające."
 wm_dispute_national_decision: "Odmowa Ustępstw"
 wm_dispute_national_decision_desc: "Wyborcy wyrzucili cię z Downing Street. Możesz odmówić przyjęcia tego: kwestionować liczenie głosów, głosy pocztowe, nadawców. To niczego nie zmieni, będzie cię kosztować wiele i wyprowadzi twoich najbardziej rozgniewanych zwolenników na ulice."
 wm_dispute_national_decision_tooltip: "Odmowa zaakceptowania wyniku wyborów powszechnych."
 wm_dispute_national_decision_confirm: "Odmowa ustąpienia"
 wm_dispute_national_decision_effect_tt: "Tracisz dużo #bold punktów profilu i kapitału politycznego#!, twoja partia spada w sondażach, nowy Premier ma żal, a #bold zamieszki#! mogą wybuchnąć."
 wm_dispute_sore_loser_modifier: "Przegrany z urazą"
 wm_dispute_sore_loser_modifier_desc: "Odmówiono zaakceptowania wyniku wyborów powszechnych."
 wm_dispute_bad_loser_modifier: "Zły Przegrany"
 wm_dispute_bad_loser_modifier_desc: "Zakwestionował wynik, który jasno przegrał."
 wm_dispute_sore_loser_opinion: "Odmówiono ustąpienia"
