l_polish:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "Na szlaku kampanii: tydzień [EmptyScope.ScriptValue('wm_campaign_week_value')|0]"
 wm_campaign.1.desc: "Parlament zostaje rozwiązany, a autobus kampanijny stoi bezczynnie na zewnątrz. Harmonogram ma do wypełnienia slot w tym tygodniu, mój telefon ma 140 nieprzeczytanych wiadomości, a ktoś przypiął mi rozetę bez pytania."
 wm_campaign.1.desc_leader: "\n\nJako lider [wm_campaign_party.GetNameNoTier] każdy mój ruch jest wiadomością w skali krajowej. Nadawcy chcą pojedynku twarzą w twarz z [wm_campaign_rival.GetName], a jednostka ds. polityki ma gotowe do uruchomienia materiały. W domu mój agent w [wm_campaign_seat.GetNameNoTier] chciałby zobaczyć mnie przynajmniej raz przed dniem głosowania."
 wm_campaign.1.desc_leader_no_rival: "\n\nJako lider [wm_campaign_party.GetNameNoTier] każdy mój ruch jest wiadomością w skali krajowej, a jednostka ds. polityki ma gotowe do uruchomienia materiały."
 wm_campaign.1.desc_mp: "\n\nThe national campaign has no idea who I am, which is a relief. What matters is [wm_campaign_seat.GetNameNoTier]: the leaflets, the doorsteps, and whether the local paper prints my photo the right way up."
 wm_campaign.1.a: "Zorganizuj dużą wiec."
 wm_campaign.1.b: "Zmierz się z [wm_campaign_rival.GetFirstName] w debacie telewizyjnej."
 wm_campaign.1.c: "Weź udział w debacie telewizyjnej i zasyp [wm_campaign_rival.GetFirstName] statystykami."
 wm_campaign.1.d: "Wprowadź flagową politykę."
 wm_campaign.1.e: "Chodź i pukaj do drzwi w [wm_campaign_seat.GetNameNoTier]."
 wm_campaign.1.f: "Spokojny tydzień w sztabie kampanii, zatwierdzanie ulotek."

 wm_campaign_rally_success: "Wiec: Entuzjastyczne przyjęcie"
 wm_campaign_rally_flat: "Wiec: Uprzejme brawa"
 wm_campaign_rally_flop: "Wiec: Półpusta sala"
 wm_campaign_debate_won: "Debata: Natychmiastowe sondaże to dla Ciebie"
 wm_campaign_debate_lost: "Debata: Zamieszany pod światłami"
 wm_campaign_debate_wonk_won: "Debata: Śmierć przez arkusz kalkulacyjny (ich)"
 wm_campaign_debate_wonk_lost: "Debata: Straciliśmy publiczność na 'Fiscal Headroom'"
 wm_campaign_policy_success: "Wprowadzenie polityki: To przebija się"
 wm_campaign_policy_flop: "Wprowadzenie polityki: Koszty ujawnione w radiu śniadaniowym"
 wm_campaign_door_knock: "Pukanie do drzwi: kto zostaje przekonany"

 wm_campaign.2.t: "Gafa!"
 wm_campaign.2.desc: "Mój rzecznik prasowy ma twarz kogoś, kto właśnie zobaczył jutrzejsze pierwsze strony."
 wm_campaign_gaffe_1: "Fotograf złapał mnie na jedzeniu kanapki z boczkiem w czasie przerwy w kawiarni, a efekt jest opisywany w Internecie jako \" sytuacja zakładnicza z śniadaniem \". To już mem, kubek i dzwonek do telefonu."
 wm_campaign_gaffe_2: "Zapomniałem, że mój mikrofon wciąż był włączony po wizycie w fabryce, i cały kraj teraz słyszał, jak nazwałem wyborcę \" trochę za dużo, szczerze mówiąc\". Od lunchu udzieliła czterech wywiadów."
 wm_campaign_gaffe_3: "Zapytano na żywo w radiu, ile kosztuje pinta mleka, powiedziałem: \"około jedenaście funtów? \" z prawdziwą pewnością siebie. Prezenter pozwolił, by cisza trwała dziewięć sekund."
 wm_campaign_gaffe_4: "Podczas okazji do zdjęcia pewnie przeszedłem przez niewłaściwe drzwi, do szafy, a kamery czekały, aż wyjdę z powrotem. W końcu to zrobiłem, trzymając mop."
 wm_campaign_gaffe_5: "Nagrało mnie, jak trzymałem jedną z naszych ulotek do góry nogami przez całe przemówienie, pod banerem, który błędnie pisał nazwę okręgu. Nazwisko naszego własnego kandydata również."
 wm_campaign.2.a: "Śmiej się z tego. Każdy ma zły dzień z kanapką."
 wm_campaign.2.b: "Winę na młodszego pracownika."
 wm_campaign.2.c: "Wykorzystaj to: zrób to ponownie, celowo, przed kamerami."
 wm_campaign_gaffe_shrugged: "Gafa: Publiczność uważa to za dość urocze"
 wm_campaign_gaffe_stuck: "Wpadka: To jest pierwsze miejsce w każdym biuletynie"
 wm_campaign_gaffe_viral: "Wpadka: Autoironia staje się viralem (w pozytywnym sensie)"
 wm_campaign_gaffe_doubled: "Wpadka: \"Dowalanie \" nie było rozwiązaniem"

 wm_campaign_doorstep_county_modifier: "spotkali swojego posła na progu"
 wm_campaign_doorstep_county_modifier_desc: "Ich poseł pukał do drzwi podczas kampanii i pamiętał, żeby wytrzeć stopy."
 wm_campaign_viral_gaffe_modifier: "Wiralna wpadka"
 wm_campaign_viral_gaffe_modifier_desc: "Wpadka w kampanii, którą internet nie pozwoli zapomnieć."

 wm_campaign_debate_humiliated_opinion: "Pokonaj mnie w debacie telewizyjnej"
