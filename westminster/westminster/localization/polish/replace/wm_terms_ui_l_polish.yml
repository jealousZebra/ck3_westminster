 action_ask_for_pardon_desc: "Obecnie jesteś przez [top_liege|E] uważany za [criminal|E], ale [recipient.GetSheHe] może ci ułaskawić. \n\n#help Jeśli jesteś przestępcą, twój lider partii może cię [imprison|E] w każdej chwili! Choć może cię to kosztować [hook|E], zazwyczaj najlepiej jest spróbować zostać ułaskawionym. #!"
 action_assign_tax_payers_desc: "Nie opodatkujesz swojego [clan|E] [vassals|E]. \n\n#help [tax_jurisdiction|E] z [tax_collector|E], ale bez [taxpayers|E] nie przyniesie żadnego [gold|E] ani [levy|E] wkładu. Przydziel członków klanu jako $game_concept_taxpayers$ do ściągania $game_concept_taxes$ od nich. #!"
 action_can_ask_hof_for_claim: "@hof_icon! Możesz poprosić swojego Lidera Ruchu o roszczenie"
 action_can_ask_hof_for_claim_combined_group_label: "@hof_icon! Możesz poprosić swojego lidera ruchu o zgłoszenia roszczeń"
 action_can_ask_hof_for_claim_combined_group_name: "@hof_icon! Twój Lider Ruchu przyznałby Roszczenia"
 action_can_ask_hof_for_claim_label: "@hof_icon! Twój Lider Ruchu, [secondary_recipient.GetUINameNoTooltip], przyznałby Roszczenie do [target_title.Custom('GetTierIcon')][target_title.GetNameNoTooltip]"
 action_can_ask_hof_for_money: "@gold_icon!Możesz poprosić swojego Lidera Ruchu o fundusze"
 action_can_choose_dynasty_perk_desc: "Masz wystarczająco [dynasty_prestige|E], aby odblokować [dynasty_perk|E] dla swojej [dynasty|E].\n\n#help Jako [dynast|E] możesz wydawać Markę Partii na działania wobec innych członków Dynastii, ale Dziedzictwa są długoterminowymi bonusami dla całej twojej Dynastii.#!"
 action_can_claim_liege_title: "@titles_icon! Możesz przyjąć tytuł lidera partii"
 action_can_claim_liege_title_desc: "Kontrolujesz większość [counties|E], które są [de_jure|E] do jednej z twoich [liege_possessive|E] [titles|E]. Oznacza to, że możesz wydać [prestige|E], aby zdobyć [unpressed_claim|E] na tym!\n\n#help Posiadanie Nieprzyjętego Roszczenia do wyższego stopnia Tytułu daje ci okazję do zwiększenia swojej rangi. Możesz go użyć, aby rozpocząć [claimant_faction|E] lub po prostu ogłosić [war|E] bezpośrednio wobec twojego Lidera Partii. #!"
 action_can_claim_liege_title_label: "@titles_icon! Możesz przyjąć tytuł lidera partii"
 action_can_create_head_of_faith_title_click: "#I Kliknij, aby zobaczyć Ideologię#!"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help Tworząc tytuł lidera ruchu, stajesz się także [temporal_head_of_faith|E]!#!"
 action_can_demand_payment_desc: "Możesz wydać [hook|E], które masz, na [recipient.GetUIName], aby zażądać od nich [gold|E].\n\n[recipient.GetSheHe|U] obecnie ma @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! funduszy, które możesz zażądać.$action_can_demand_payment_HELP$"
 action_can_find_secrets_HELP: "\n\n#help Tylko osoby [vassals|E], które są posiadaczami 10 najwyższych [title_tier|E] [titles|E] są tutaj pokazane, ponieważ są najważniejszymi celami, ale możesz celować w dowolnego tylnika swojej [liege|E].#!"
 action_can_make_clerical_puppet: "@theological_agent_puppet_icon! Kapłana Partii można opanować jako marionetkę"
 action_can_ransom_desc: "Możesz wziąć okup za swój [prisoner|E], [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUIName], za [gold|E].\n\n[recipient.GetSheHe|U] obecnie ma @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! funduszy, które możesz zażądać.$action_can_ransom_HELP$"
 action_can_request_preach_legitimacy: "@legitimacy_icon! Mandat kaznodowodzeń"
 action_can_request_preach_legitimacy_combined_group_label: "@legitimacy_icon! Mandat kaznodowodzeń"
 action_can_request_preach_legitimacy_help_desc: "\n\n#help [legitimacy|E] z [rulers|E] zależy od zgody [actor.GetFaith.HighGodNamePossessive], i tylko poprzez urzędników partyjnych zgoda [actor.GetFaith.HighGodNamePossessive] może być znana.#!"
 action_can_request_preach_legitimacy_label: "@legitimacy_icon!Twój Mandat może zostać poprawiony przez [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip]"
 action_can_train_knights_contract: "Możesz szkolić Organizatorów, aby wykonali Kontrakt"
 action_convert_at_war_interaction_click: "#I Kliknij, aby przyjąć ich Ideologię#!"
 action_convert_at_war_interaction_desc: "Możesz przejść na [faith|E] [recipient.GetShortUIName], aby zakończyć [recipient.GetHerHis] [holy_war|E] przeciwko tobie.\n\n#help Chociaż zakończenie wojny, którą przegrywasz, jest przydatne, bądź świadomy, że członkowie twojej byłej ideologii stracą [opinion|E] do ciebie!#!"
 action_convert_at_war_interaction_label: "@religious_icon! Możesz przekonwertować na ideologię atakującego"
 action_county_in_dangerous_populist_faction: "@faction_icon! Okręg Wyborczy w Ruchu Populistycznym"
 action_county_in_dangerous_populist_faction_click: "#I Kliknij, aby zobaczyć Okręg Wyborczy#!"
 action_county_in_dangerous_populist_faction_combined_group_description: "Peasants in several of your constituencies have banded together in a [popular_faction|E] against your party leader.\n\nIncrease the [county_opinion|E] of these constituencies, or risk losing them entirely when they present their demands!"
 action_county_in_dangerous_populist_faction_combined_group_label: "@faction_icon! Okręgi w Ruchu Populistycznym"
 action_county_in_dangerous_populist_faction_desc: "[landed_title.GetNameNoTooltip] has joined a [popular_faction|E] against your party leader.\n\nIncrease the [county_opinion|E] of this constituency, or risk losing it when the faction presents its demands!"
 action_county_in_dangerous_populist_faction_label: "@faction_icon! [landed_title.GetNameNoTooltip] w Ruchu Populistycznym"
 action_empty_accolade_slot_click: "#I Kliknij, aby zobaczyć swoich Organizatorów#!"
 action_empty_accolade_slot_unimportant: "@warning_icon! #X Organizator może również być ważnym sukcesorem dla istniejącego wyróżnienia"
 action_ep3_can_ask_hof_for_influence: "@influence_icon! Możesz poprosić swojego lidera ruchu o wpływ"
 action_ghw_participation_alert_desc: "Nie przekazałeś ani [gold|E], ani nie zadeklarowałeś swojego [armies|E] na nadchodzący [actor.GetFaith.GHWName].\n\n#help Jeśli nie przekażesz ani funduszy, ani żołnierzy na wysiłek wojenny, twój [head_of_faith|E] cię potępi i stracisz [piety|E].#!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon! może przyznać posła z ław poselskich prawowitemu liderowi partii"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] ci, których nie jesteś właściwym liderem partii, dają ci mniej zasobów i mają zmniejszoną [opinion|E] względem ciebie. Czasami najlepiej jest przyznać tych posłów rezerwowych ich właściwemu liderowi partii, zakładając, że są również twoim posłem rezerwowym.\n\n Czasami przyznanie posła rezerwowego jego właściwemu liderowi partii oznacza, że zarobisz mniej, ale zwykle warto i tak ich przyznać – ich właściwy lider partii będzie miał dużą karę opinii wobec ciebie za trzymanie posła rezerwowego, którego uważa za swojego.\n\n Utrzymanie dobrej struktury posłów rezerwowych jest kluczem do stabilnej partii.#!"
 action_grant_vassal_to_rightful_liege_click: "#I Kliknij, aby przyznać Backbencher#!"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! może przyznać posłów z tylnych ław prawowitemu liderowi partii"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Posłowie w ławach tylnego rzędu mogą zostać przydzieleni swojemu prawowitemu liderowi partii"
 action_has_any_display_cb_on_HELP: "\n\n#help Jeśli twoje siły militarne i [allies|E] są silniejsze niż wroga, wojna może być bardzo korzystna. Możesz zdobyć [titles|E], rozszerzyć swoje [realm|E] i zdobyć [prestige_experience|E].\n\n Jednak wojny są kosztowne, zwłaszcza jeśli musisz przyznać [defeat|E]. Ambitni sąsiedzi mogą wykorzystać osłabioną partię.#!"
 action_has_courtier_or_guest_with_inspiration_desc: "Jeden z twoich pracowników lub gości ma [inspiration|E] i może być sponsorowany do stworzenia [artifact|E]"
 action_has_courtier_or_guest_with_inspiration_label: "Jeden z twoich pracowników lub gości ma [inspiration|E]"
 action_has_open_court_event: "Wydarzenie Biura CV"
 action_has_open_court_event_label: "Masz nieukończone Wydarzenie Urzędowe"
 action_has_unopened_court_event: "Dostępne wydarzenie biurowe"
 action_has_unopened_court_event_label: "Masz nowe Wydarzenie Urzędowe"
 action_in_debt_desc: "Masz mniej niż [gold_i|E]#V 0#! [gold|E] i dlatego jesteś w [debt|E]!\n\nBycie w długu ma następujące skutki:\n$BULLET_WITH_TAB$Nie można ogłosić [war|E]\n$BULLET_WITH_TAB$Nie można wzmacniać [men_at_arms|E], które wymagają [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] rozprzestrzenia się w twoim [domain|E]\n$BULLET_WITH_TAB$[vassals|E] są bardziej skłonni do przyłączenia się do [factions|E]\n\nIm głębiej jesteś w długu, tym surowsze będą kary, z którymi się zmierzysz. Twój obecny poziom długu ma następujące dodatkowe skutki:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Jeśli nie zarabiasz funduszy co miesiąc, rozważ zmniejszenie swoich wydatków, na przykład poprzez:\n$BULLET_WITH_TAB$Rozwiązanie twojego [armies|E]\n$BULLET_WITH_TAB$Zmniejszenie rozmiaru — lub zniszczenie — twojego [men_at_arms|E]\n$BULLET_WITH_TAB$Zwiększenie [control|E] przy użyciu twojego [marshal|E]\n$BULLET_WITH_TAB$Cofnięcie [court_positions|E]#!"
 action_in_debt_landless_desc: "Masz mniej niż [gold_i|E]#V 0#! [gold|E] i dlatego jesteś w [debt|E]!\n\nBycie w długu ma następujące skutki:\n$BULLET_WITH_TAB$Nie można ogłosić [war|E]\n$BULLET_WITH_TAB$Nie można wzmacniać [men_at_arms|E] przy użyciu [gold_i|E][gold|E]\n\nIm głębiej jesteś w długu, tym surowsze będą kary, z którymi się zmierzysz. Twój obecny poziom długu ma następujące dodatkowe skutki:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Rozważ podjęcie [task_contract|E], aby zdobyć trochę funduszy#!"
 action_landless_admin_escape_to_realm: "Ucieczka do innej partii"
 action_landless_admin_escape_to_realm_desc: "Jesteś bezziemnym [noble_family|E] [title|E] [holder|E] pod [liege|E] o innej [government|E]\n\n#help Możesz poprosić innych [independent_rulers|E] z twoją [government|E], by zostali twoim nowym liderem partii i przenieśli twoją [domicile|E] do ich [capital|E]#!"
 action_legal_meddling: "Pozyskaj Żądania w ramach Partii Lidera Partii jako [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_combined_group_label: "@unpressed_claim! Możesz fałszować roszczenia w partii lidera swojej partii jako [actor.GetLiege.GetDiarchTitle]"
 action_legal_meddling_label: "@unpressed_claim! Możesz zgłaszać okręgi utrzymywane przez swojego [actor.Custom2('RelationToMe', recipient)], [recipient.GetUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#!, jako [actor.GetLiege.GetDiarchTitle]"
 action_low_control_in_county: "@control_icon! Niska kontrola okręgowa w [landed_title.GetNameNoTierNoTooltip] #low ([landed_title.GetCountyData.GetControl|0]/100)#!"
 action_low_control_in_county_HELP: "\n\n#help Możesz przypisać swojego [marshal|E] do zadania [increase_control|E], aby zwiększyć kontrolę nad okręgiem wyborczym.#!"
 action_low_control_in_county_combined_group_label: "@control_icon! Niska kontrola w okręgach wyborczych"
 action_no_mandala_decree_desc: "Nie wybrałeś [mandala_decree|E]\n\n#help Niech twój Dekret pomoże ukierunkować twój [subjects|E], a przez to twoją Partię, we właściwym kierunku.#!"
 action_not_rightful_liege: "Nie prawowitym liderem partii [recipient.GetShortUINameNoTooltip]"
 action_not_rightful_liege_combined_group_description: "You are not the [rightful_liege|E] of several of your backbenchers.\n\nCheck if you can [create|E] or [usurp|E] titles which will make you their [de_jure|E] [liege|E]; doing so will improve their [opinion|E] of you as well as increasing the [taxes|E] and [levies|E] you receive from them.\n\nIf that is not possible, you may wish to consider [transferring|E] them to another one of your backbenchers, especially if that backbencher would be their [rightful_liege|E]."
 action_not_rightful_liege_combined_group_label: "Nieprawowitym liderem partii wśród posłów z tylnych ław"
 action_not_rightful_liege_desc: "Nie jesteś [rightful_liege|E] swojego [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nPowinieneś sprawdzić, czy możesz [create|E] lub [usurp|E] tytuł, który uczyniłby cię [recipient.GetHerHis] [de_jure|E] [liege|E]; zrobienie tego poprawi [recipient.GetHerHis] [opinion|E] twojej osoby, a także zwiększy [taxes|E] i [levies|E], które otrzymujesz od [recipient.GetHerHim].\n\nJeśli to nie jest możliwe, możesz rozważyć [transferring|E] ich komuś z twoich mniej eksponowanych członków, zwłaszcza jeśli ten członek byłby ich [rightful_liege|E]."
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! Wpływowy poseł z ław zaplecznych oczekuje [GetPlayer.Custom( 'GetCouncilConcept' )] stanowiska"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help Powinieneś rozważyć przyznanie wpływowym posłom z tylnego ławka [GetPlayer.Custom( 'GetCouncillorConcept' )|E]. W przeciwnym razie ich [opinion|E] zostanie obniżona i mogą przyłączyć się do [faction|E] przeciwko Tobie.\n\n Jednak nie wszyscy mają wystarczająco wysokie [skills|E], aby byli użyteczni, a jeśli Twój [rank|E] jest wystarczająco wysoki, może po prostu być więcej wpływowych posłów z tylnego ławka niż miejsc w [GetPlayer.Custom( 'GetCouncilConcept' )|E].#!"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! Wpływowi posłowie z ław poselskich oczekują [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )] stanowisk"
 action_powerful_vassal_not_on_council_label: "@powerful_vassal_icon! Twój potężny poseł z ławy z rzędu, [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip], oczekuje [GetPlayer.Custom( 'GetCouncilConcept' )|E] stanowiska ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_promote_foreign_legend_desc: "Możesz promować czyjś [legend|E].\n\n#help [legends|E] są przydatne do zdobywania [legitimacy|E], [dynasty_prestige|E], [prestige|E], [piety|E], [traits|E] i [claims|E]. [legend|E] rozprzestrzenił się w twojej partii, zdobywaj nagrody, wspierając go."
