 action_station_men_at_arms_HELP: "\n\n#help Powinieneś rozmieszczać swoich najpotężniejszych [men_at_arms|E] w [holdings|E] z [buildings|E], które zwiększają ich skuteczność.\n\n Specjalizacja jednego lub dwóch Twoich posiadłości w celu znaczącego zwiększenia siły określonych typów aktywistów może pomóc Ci w [wars|E].#!"
