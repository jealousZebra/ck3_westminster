 action_title_lost_from_realm_by_vassal_war: "@bad_icon! Twoja partia straci ziemię, jeśli Poseł z ław z ław wygra wojnę"
 action_title_lost_from_realm_by_vassal_war_HELP: "#help [vassals|E], którzy zdobędą [title|E] [title_tier|E] lub wyższy [rank|E] niż ich [liege|E] staną się [independent|E] lub posłami zaplecza następnego [realm|E] lidera partii w hierarchii, który ich przewyższa. \n\nPowinieneś rozważyć użycie interakcji $stop_attacker_vassal_war_interaction$ lub znaleźć inny sposób, aby wojna była przeciwko twojemu posłowi zaplecza. #!"
