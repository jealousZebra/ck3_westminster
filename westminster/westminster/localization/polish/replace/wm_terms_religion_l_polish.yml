 FAITH_CREATION_BASIC_UI_DESC: "#weak \n\nMam wyjątkową okazję, aby na zawsze przekształcić naszą ideologię. Muszę starannie planować, ponieważ nowa doktryna będzie odporna na zmiany, gdy zostanie ustalona.#!\n\nKsięża i uczeni podróżowali do mojego biura, aby omówić wszelkiego rodzaju teologię, próbując skodyfikować pełną i solidną reinterpretację naszych dawnych tradycji ustnych, ale to ja uczyniłem tę reformę możliwą.[core_tenets|E][doctrines|E][faith|E]Mam ostatnie słowo w sprawie ZZKEEP0009ZZ i ZZKEEP0010ZZ naszej nowej ZZKEEP0011ZZ."
