 doctrine_clerical_function_recruitment_desc: "Nasze [ROOT.Faith.PriestNeuterPlural] mogą chwycić za broń i bronić naszej ideologii. Odpowiedzialność za dowodzenie jako przykład daje im dodatkową siłę w walce."
 doctrine_clerical_function_recruitment_descriptive_name: "Funkcje wojskowe dla urzędników partyjnych"
 doctrine_clerical_function_taxation_descriptive_name: "Funkcje kontrolne dla urzędników partyjnych"
 doctrine_clerical_gender_either_descriptive_name: "Nieograniczone płcie dla funkcjonariuszy partyjnych"
 doctrine_clerical_gender_female_only_desc: "Tylko kobiety są wystarczająco mądre, aby interpretować wolę [ROOT.Faith.HighGodNamePossessive] i służyć jako [ROOT.Faith.PriestFemalePlural] naszej ideologii."
 doctrine_clerical_gender_female_only_descriptive_name: "Partyjni urzędnicy wyłącznie dla kobiet"
 doctrine_clerical_gender_male_only_desc: "Tylko mężczyźni mogą wziąć na siebie wielką odpowiedzialność służenia jako [ROOT.Faith.PriestMalePlural] naszej ideologii."
 doctrine_clerical_gender_male_only_descriptive_name: "Funkcjonariusze partyjni ograniczeni wobec mężczyzn Most"
 doctrine_clerical_succession_conditional_desc: "Prawo do zastępowania osób z tytułami duchownymi pozostaje nierozstrzygnięte. Taka sporna sytuacja nieuchronnie kieruje ideologię w stronę [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] ostatecznie są sługami partii, dlatego powinni móc być zatrudniani i zwalniani przez lidera partii z tylko niewielkimi ograniczeniami."
 doctrine_deviancy_virtuous_desc: "Przyjemności cielesne przybliżają nas do boskości, a zatem ci, którzy są uwolnieni od konwencjonalnych pragnień, są szczytem cnót w naszej ideologii."
 doctrine_family_rites_descriptive_name: "Ideologie Rodzinnych Pochówków"
 doctrine_family_rites_name: "Ideologie rodzinne"
 doctrine_head_of_faith_name: "Lider Ruchu"
 doctrine_monasticism_accepted_desc: "Życie monastyczne jest dozwolone, ale nie stanowi centralnego elementu ideologii. Pobożni mogą składać śluby i wycofywać się do domów zakonnych, jednak tradycja nie podkreśla monastycyzmu jako idealnej drogi."
 doctrine_monasticism_forbidden_desc: "Ta ideologia jednoznacznie odrzuca życie zakonne. Składanie ślubów jest zabronione, a osoby posiadające cechę zakonną są uważane za przestępców w oczach tej ideologii."
 doctrine_mythic_literary_desc: "Ideologia rozprzestrzenia się i przetrwa dzięki opowieściom o boskich czynach, wiele z nich jest zbieranych w dziełach literackich."
 doctrine_no_head_descriptive_name: "Brak lidera ruchu"
 doctrine_parameter_block_from_create_hof_parameter: "Ta ideologia nie może odtworzyć swojego [head_of_faith|E] w normalnych okolicznościach."
 doctrine_parameter_clerical_appointment_head_of_faith: "[realm_priests|E] lub [court_chaplains|E] będą wybrani spośród urzędników partyjnych i przypisani do [rulers|E] w razie potrzeby"
 doctrine_parameter_divorce_approval: "Postacie mogą [divorce|E] swoje [spouse|E], jeśli ich Duchowy [head_of_faith|E] zatwierdza (lub [house_head|E] jeśli nie istnieje żaden Duchowy Lider Ruchu)"
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "Nie-wschodni [faiths|E] z $tenet_eastern_syncretism_name$ sprawa są uważani za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] zamiast $hostility_evil_tooltippable$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "Niechińskie [faiths|E] z $tenet_sinitic_syncretism_name$ są uważane za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] zamiast $hostility_evil_tooltippable$"
 doctrine_parameter_minimum_fervor: "Przekonanie nie może spaść poniżej #V $VALUE|0$%#!"
 doctrine_parameter_pluralism_fundamentalist_proselytization_bonus: "Szybkość konwersji okręgów: #P +20%#!"
 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal: "Czy #P może odebrać tytuły ziemskie #! od $hostility_hostile_tooltippable$ i $hostility_evil_tooltippable$ przeciwników bez ponoszenia [tyranny|E]"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy: "#N Zwiększone niebezpieczeństwo#! ze strony grup odłamowych przy niskim [fervor|E]"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance: "Okręgi innych [faiths|E] są #P mniej prawdopodobne, że #! dołączą do [factions|E]"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals: "Wygranie [holy_war|E] sprawi, że przeciwnik [rulers|E] będzie wasalem na obszarze docelowym, zamiast przejmować jego ziemię"
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty: "Szybkość konwersji okręgów: #N -20%#!"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy: "#P Zmniejszone zagrożenie#! ze strony odłamów przy niskim [fervor|E]"
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced: "Czy #P może odebrać tytuły ziemskie #! od $hostility_evil_tooltippable$ przeciwników bez ponoszenia [tyranny|E]"
 doctrine_parameter_spiritual_head_of_faith: "Stanowisko [head_of_faith|E] zostało przyznane prominentnemu członkowi partii"
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "Jeśli Ideologia ma [great_holy_wars|E], Lider Ruchu ma prawo kierować wojną i wybierać, kto będzie celem wojny"
 doctrine_pilgrimage_encouraged_desc: "Ta ideologia zachęca swoich członków do odwiedzania ziemskich miejsc uznawanych za duchowo ważne, jako sposób okazania szacunku dla [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_forbidden_desc: "Obecność [ROOT.Faith.HighGodName] jest odczuwalna wszędzie, a przekonanie, że niektóre miejsca są bardziej boskie niż inne, jest niczym innym jak rozłamem."
 doctrine_pilgrimage_local_rites_desc: "Zwolennicy tej ideologii preferują wygodę i stabilność rutynowych wierzeń w lokalnych sanktuariach zamiast zagrożeń i wysiłku związanych z długimi pielgrzymkami."
 doctrine_pilgrimage_local_rites_name: "Lokalne ideologie"
 doctrine_pluralism_fundamentalist_desc: "Nasza ideologia to jedyna prawdziwa ideologia, nasze słowo jedyne prawdziwe słowo. Każde odejście od [ROOT.Faith.ReligiousText] jest z natury bluźnierctwo."
 doctrine_sacraments_absent_desc: "Ta tradycja nie kładzie nacisku na sakramenty ani formalny system ideologii religijnych. Życie religijne nie koncentruje się na administrowaniu rytuałami przez partyjnych urzędników ani na znaczeniu konkretnych ceremonii."
 doctrine_sacraments_general_desc: "Ideologia nadaje sakramentom i świętym ideologiom centralne znaczenie. Rytuały nie są tylko symboliczne, ale przywołują obecność boskości. Funkcjonariusze partii je sprawują, a wierni mogą być ekskomunikowani."
 doctrine_spiritual_head_desc: "Świat fizyczny i świat duchowy nie są podobne. Musimy zapewnić, że świat duchowy ma własnego przywódcę, który nas poprowadzi i ochroni naszą ideologię przed profanacją przez pragnienia fizyczne."
