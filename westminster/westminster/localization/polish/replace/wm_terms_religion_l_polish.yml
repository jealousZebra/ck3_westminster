 pagan_hostility_doctrine_desc: "Poniższe obozy polityczne są pogańskie:\n[GetReligionFamily('rf_pagan').GetReligions]"
 prophecy_of_malachi_desc: "W tradycyjnej polityce żydowskiej nowy arcykapłan może zostać wyznaczony tylko wraz z przyjściem Proroka lub jeśli zostanie znaleziony potomek Aarona zdolny do pełnienia funkcji kapłana."
 sinitic_hostility_doctrine_desc: "Następujące obozy polityczne są sinityckie:\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_doctrine_ecumenical_miaphysite_desc: "Pomimo odrębnych hierarchii, kościoły miafizyckie pozostają w pełnej komunii, uznając nawzajem swoje sakramenty i urzędników partyjnych."
 special_doctrine_full_tolerance_desc: "Każdy jest wolny w wyborze własnej ideologii. Nasze różnice nas nie dzielą, one nas wzmacniają."
 special_doctrine_is_christian_faith_desc: "Są ludzie na świecie, którzy przestrzegają nauk Jezusa, nie uznając jego boskości. Chociaż bluźniercze, powinniśmy okazać współczucie tym zgubionym duszom, ponieważ mogą pewnego dnia stać się nawróconymi na prawdziwą ideologię."
 special_doctrine_is_eastern_faith_desc: "Razem jesteśmy związani nie jedną ideologią, lecz wieloma ideologiami, które tworzą religijną strukturę naszego społeczeństwa. Choć możemy nazywać siebie różnymi imionami i podążać różnymi ścieżkami, niektórzy spoza naszego systemu wierzeń nauczyli się współistnieć w naszym społeczeństwie, jakby byli jednym z nas."
 special_doctrine_not_allowed_to_hof_desc: "Najwyższe kapłaństwo tej ideologii zostało całkowicie rozmontowane. Każda próba nadania nazwiska arcykapłanowi wymagałaby najpierw gruntownej rekonstrukcji tradycyjnej struktury kościelnej."
 toggle_challengers_view_tt: "#T Challengers#!\n\n#I Click to view Challengers for this Ideology#!"
 unreformed_faith_doctrine_desc: "Nieprzeformowana Ideologia nie posiada zorganizowanych urzędników partyjnych ani ustalonych kanonicznych stanowisk politycznych; różne społeczności mogą nominalnie wyznawać tę samą ideologię, mając przy tym zupełnie odmienne praktyki religijne i wierzenia."
