l_polish:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "beneficjum były lokalnymi lub odległymi nieruchomościami, urzędami lub wspólnymi dochodami papieskimi, które członek partii mógł otrzymać #i commendam#! (w funduszu powierniczym). Generowały dochody, zazwyczaj bez bezpośrednich obowiązków administracyjnych."
 additional_mandala_government_piety_levels: "[mandala|E] [government|E] może odblokować dodatkowe Poziomy Kapitału Politycznego po [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] do, i włącznie, z [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]. Aby osiągnąć ten stopień boskości, ich Lojalność musi być udowodniona przez pokolenia."
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ jest najwyższym poziomem [crown_authority|E]. [vassals|E] mają karę #N -30#! [opinion|E] wobec ich [liege|E].\n\nNa tym poziomie — oprócz efektów [high|E] oraz [limited|E] Zwierzchnictwa Koronnego — władca może wybrać [designated_heir|E] przy koszcie [prestige|E].\n\nCo więcej, członkowie zaplecza nie mogą wypowiedzieć wojny, nawet wobec obcych władców."
 game_concept_acclaimed_knight: "Gwiazda Organizatora"
 game_concept_acclaimed_knight_desc: "[knight|E] przeprowadza [accolade|E].\n\nAby zostać Gwiazdowym Organizatorem, Organizator musi być [unlanded|E] lub [baron|E], z co najmniej [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] lub więcej [prowess|E]. Gwiazdowy Organizator musi być uprawniony do co najmniej jednego [accolade_type|E], który nie jest już posiadany przez innego Gwiazdowego Organizatora ich [liege|e].\n\nGwiazdowi Organizatorzy są mniej narażeni na śmierć lub wzięcie do niewoli w walce. Mogą poprawiać swoje [glory|E] głównie poprzez walkę z [wars|E] i uczestnictwo w [activities|E], takich jak [GetActivityType( 'activity_tournament' ).GetName].\n\nUznani organizatorzy mogą czasami zdobywać [skills|E] i [traits|E] związane z Atrybutami ich Wyróżnienia."
 game_concept_acclaimed_knight_possessive: "Organizatora Gwiazdy"
 game_concept_acclaimed_knights: "Gwiazdy Organizatorów"
 game_concept_accolade_desc: "Odznaczenia to wyróżnienia nadawane [knights|E] przez ich [liege|E].\n\nOrganizator, który posiada Odznaczenie, staje się [acclaimed_knight|E].\n\nW miarę zdobywania [glory|E] przez Głównego Organizatora, jego Zdolności [accolade_squires|E] rosną (poprawiając [accolade_succession|E]) i można zdobyć [accolade_ranks|E]. Pozwala to odblokować więcej [accolade_types|E], oferujących silniejsze bonusy.\n\nGdy Główny Organizator umrze, następuje [accolade_succession|E], a organizator jest natychmiast zastępowany sukcesorem, którego umiejętności zostają zmodyfikowane przez [accolade_squires|E] Zdolności.\n\n[innovations|e] i wyższe [title_tiers|e] pozwalają [rulers|E] posiadać więcej Odznaczeń jednocześnie."
 game_concept_accolade_squires_desc: "Każdy [accolade|E] ma wskaźnik zdolności Giermka, który modyfikuje [traits|E] i [skills|E] (głównie [prowess_skill|E], [martial_skill|E] i [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]) jego następnego [acclaimed_knight|E].\n\nIstnieje 5 poziomów zdolności dla Giermków:\n$EFFECT_LIST_BULLET$Znany w Fachu\n$EFFECT_LIST_BULLET$Zdolny\n$EFFECT_LIST_BULLET$Niedoświadczony\n$EFFECT_LIST_BULLET$Nieudolny\n$EFFECT_LIST_BULLET$Żałosny\n\nPosiadanie zdolności Niedoświadczony lub wyższej spowoduje, że Organizator Gwiazd sporadycznie będzie wpływał na [traits|E] i [skills|E] młodych, płciowo bojowych [courtiers|E], dając im pierwszeństwo do przyjęcia Wyróżnienia po [accolade_succession|E]\n\nGiermkowie są głównie ulepszani przez zdobywanie [glory|E], ale także:\n$EFFECT_LIST_BULLET$ZZKK Organizatora Gwiazd [prowess_skill|E]\n$EFFECT_LIST_BULLET$ZZ Organizatora Gwiazd [martial_skill|E]'\n$EFFECT_LIST_BULLET$ZZ Organizator zdobywa [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ZZ Organizator zdobywa [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ [martial_skill|E] Wyróżnienia [liege|E]\n$EFFECT_LIST_BULLET$ [prowess_skill|E] Wyróżnienia [liege|E]\n\n Każdy [accolade_succession|E] resetuje Giermków Wyróżnienia."
 game_concept_accolade_succession_desc: "Sukcesja Odznaczenia następuje, gdy [accolade_possessive|E] [acclaimed_knight|e] umrze lub stanie się nieważny.\n\nByły Główny Organizator jest natychmiast zastępowany. Młodzi [courtiers|E] i [knights|E] szkoleni z powodu [accolade_squires|E] Zdolności Odznaczenia są jako pierwsi faworyzowani jako Sukcesorzy; następnie inni organizatorzy, inni pracownicy, wędrowcy, a na końcu nowo utworzeni [characters|E]. W oparciu o Zdolności [accolade_squires|E] Odznaczenia, nowy Organizator otrzyma zwiększone [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E] oraz możliwie inne [skills|E].\n\nPo Sukcesji Odznaczenia może zostać utracona niewielka ilość [glory|E], a Zdolności Giermków Odznaczenia zostają zresetowane, aby odzwierciedlać umiejętności i doświadczenie nowego Głównego Organizatora\n\nŚmierć Głównego Organizatora w bitwie, pojedynku lub w inny honorowy sposób spowoduje brak utraty Chwały i poprawi Zdolności Giermków Odznaczenia."
 game_concept_accolade_type_desc: "An [accolade|E] ma do #value 3#! Atrybuty, które zapewniają rosnące bonusy wraz z odblokowywaniem wyższych poziomów. Każdy Atrybut ma #value 3#! Poziomy. Gdy Odznaczenie zwiększa swoje [accolade_rank|E], jego właściciel może albo zwiększyć poziom istniejącego Atrybutu, albo dodać nowy Atrybut do Odznaczenia. [acclaimed_knight|E], jednak, musi spełniać wymagania nowego Atrybutu.\n\nKażdy [knight|E] kwalifikuje się tylko do określonych Atrybutów, które mogą być oparte na [traits|E], [skills|E] lub odblokowaniach zdobywanych podczas służby jako Organizator.\n\nKażde Odznaczenie musi mieć unikalne Atrybuty: lider grupy #high nie może#! powielać Atrybutów między Odznaczeniami. Każde Odznaczenie może także specjalizować się w tylko #value 1#! [men_at_arms|E]-typu Atrybucie."
 game_concept_ai_economical_boom_personality_desc: "A $game_concept_ai_economical_boom_personality$ wants to invest all of their [gold|E] into the [realm|E]. They will empty their treasury to fund [buildings|E] and [men_at_arms|E], and often construct more [economic_buildings|E] and [holdings|E]. They only save up funds if directly threatened, such as by a strong [faction|E].\n\n$game_concept_ai_economical_boom_personality$ rulers are slightly less likely to create and promote [legends|E].\n\nBold Rulers with a propensity for building and no particular inclination for [war|E] tend to be $game_concept_ai_economical_boom_personality$s.\nCommon Traits include [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], and [GetTrait('profligate').GetName( GetNullCharacter )]. Rulers with the [GetFocus('stewardship_domain_focus').GetName] also tend to be $game_concept_ai_economical_boom_personality$s."
 game_concept_ai_pious_builder_personality_desc: "A $game_concept_ai_pious_builder_personality$ wants to invest all of their [gold|E] into increasing their [piety|E].\n\nThey will spend their treasury to fund religious and ceremonial [buildings|E], [great_projects|E], [activities|E] and [decisions|E], and often construct more [pious_buildings|E] and [temple|E]- or [temple_citadel|E] [holdings|E]. They only save up funds if directly threatened, such as by a strong [faction|E].\n\n$game_concept_ai_pious_builder_personality$s are more likely to create and promote holy [legends|E].\n\nZealous [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] with a penchant for [virtue|E] and no particular inclination for [war|E], tend to be $game_concept_ai_pious_builder_personality$s.\nCommon Traits include [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], and [GetTrait('generous').GetName( GetNullCharacter )]. Rulers with the [GetFocus('learning_theology_focus').GetName] also tend to be $game_concept_ai_pious_builder_personality$s."
 game_concept_ai_warlike_personality_desc: "$game_concept_ai_warlike_personality$ [ruler|E] chce być zawsze gotowy do ogłoszenia [war|E]. Zawsze będą oszczędzać [gold|E] na [war|E], zanim zainwestują je w rozwój swojego [realm|E]. Jeśli $game_concept_ai_warlike_personality$ Władca pozostaje w pokoju przez dłuższy okres, wykorzysta Fundusze w swoim skarbcu wojennym do budowy [buildings|E].\n\n$game_concept_ai_warlike_personality$ władcy częściej tworzą i promują heroiczne [legends|E].\n\nOdważni i chciwi Władcy mają tendencję do bycia wojowniczymi.\nPowszechne cechy to [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )] i [GetTrait('zealous').GetName( GetNullCharacter )]."
 game_concept_alliance_desc: "$game_concept_alliance$ to relacja dyplomatyczna między dwoma [rulers|E]. [independent|E] Władcy mogą wzywać $game_concept_allies$ do przyłączenia się do swoich [wars|E]. \n\n Sojusze są tworzone i utrzymywane poprzez [marriage|E] lub [betrothal|E], o ile dwie postacie będące w związku są dostatecznie blisko spokrewnione z dwoma Władcami. Na przykład, jeśli [king|E] wydaje za mąż swoją córkę za innego syna króla, dwaj królowie stają się $game_concept_allies$. \n\n[lieges|E] mogą również tworzyć $game_concept_alliances$ ze swoimi [vassals|E]. Lider Partii nie może wzywać Posłańca do Wojny, ale zapobiega to dołączeniu ich do [factions|E]."
 game_concept_anointment_request_desc: "Prośba o Namaszczenie [character_interaction|E] to specjalna interakcja, którą może wykorzystać [ruler|E] [empire|E] [title_tier|E] lub wyżej wobec swojego [head_of_faith|E], lub urzędnicy partii [head_of_rite|E], gdy nie ma żadnego, aby zapewnić sobie ich wsparcie w [anointment|E]."
 game_concept_archdiocese_desc: "Archidiecezja jest [christian|E] formą [clerical_region|E], portfolio kościelnym posiadanym przez [archbishop|E] poprzez jego [clerical_title|E] i mającym siedzibę w stolicy [county|E], gdzie może być podniesiony [grand_cathedral|E].\n\n [christian|E] [ruler|E] odpowiada w sprawach duchowych przed [archbishop|E] Archidiecezji, która zawiera ich [capital|E] [county|E], a terytorium podległe archidiecezjom w całości tworzy [the_christian_church|E] [situation|E]."
 game_concept_aspect_of_serenity_desc: "Pokojowa partia to prosperująca partia — Aspekt Spokoju ceni spokój i działania dyplomatyczne, przyznając bonusy tym, którzy wspierają jej sprawę.\n$EFFECT_LIST_BULLET$ Koncentruje się na [diplomacy|E]\n$EFFECT_LIST_BULLET$ Unikanie obraźliwych [wars|E] jest wprowadzane przez stosy [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] i [GetScheme('befriend').GetTypeName] [schemes|E] osiągają większy sukces\n$EFFECT_LIST_BULLET$ Może również #high $request_great_project_contribution_interaction$s#! z [allies|E]\n$EFFECT_LIST_BULLET$ Może umrzeć tylko od [death_natural_cause|E] lub [death_religious|E] [character_death_deaths|E]"
 game_concept_at_peace_opinion_desc: "Postacie posiadające [GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E] jako część swojego [faith|E] będą miały '$game_concept_at_peace_opinion$' zamiast kary [offensive_war_opinion|E].\n\nJeśli zbyt długo panuje pokój, twoi [vassals|E] pomyślą o tobie gorzej #weak (jeśli podzielają twoją ideologię).#!"
 game_concept_autonomous_vassals: "Autonomiczni Backbencherzy"
 game_concept_autonomous_vassals_crown_authority: "Autonomiczni Backbencherzy Władza Korony"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' to najniższy poziom [crown_authority|E]. Na tym poziomie, [vassals|E] nie mają kary [opinion|E] wobec swojej [liege|E], a lider partii ma nad nimi jedynie podstawową władzę."
 game_concept_available_spouse_desc: "Aby służyć w [council|E] władcy, [spouse|E] musi być dostępny, aby wypełniać obowiązki związane z tą rolą.\n\nRóżne okoliczności mogą uniemożliwić $game_concept_spouse$ wykonywanie tych obowiązków, ale do najczęstszych należą:\n$BULLET_WITH_TAB$Bycie [ruler|E] własnego [realm|E]\n$BULLET_WITH_TAB$Mieszkanie w innym [court|E] władcy\n$BULLET_WITH_TAB$Bycie [imprisoned|E], zarówno w kraju, jak i za granicą\n$BULLET_WITH_TAB$Posiadanie [GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]\n\nJeśli niedostępny małżonek stanie się ponownie dostępny, automatycznie wznowi swoje obowiązki w gabinecie \n\nMałżonkowie będący władcami sami w sobie nadal mogą służyć w gabinecie, jeśli są twoim [direct_vassals|E], w przeciwnym razie nigdy nie będą uważani za dostępnych."
 game_concept_baronies: "Wards"
 game_concept_barony: "Ward"
 game_concept_beneficiary_desc: "Każdy uczestnik w [great_holy_war|E] może wybrać $game_concept_beneficiary$ ze swojego [dynasty|E]. Po zwycięstwie, $game_concept_beneficiary$ otrzyma ziemie w docelowej partii proporcjonalnie do [war_contribution|E] ich patrona władcy.\n\n Największy darczyńca może zmusić swojego Beneficjenta do otrzymania głównego tytułu, o który toczy się walka."
 game_concept_buy_claim_desc: "Interakcja, która pozwala postaci kupić [unpressed_claims|E] w zamian za [piety|E].\n\n$EFFECT_LIST_BULLET$A [vassal|E] nie może kupować roszczenia do [liege|E]'s [title|E], a Lider Partii nie może kupować roszczenia do tytułu \n$EFFECT_LIST_BULLET$A [king|E] ani [emperor|E] nie mogą kupować roszczeń do tytułów narodowych, a Cesarze nie mogą kupować roszczeń do innych Cesarstw\n$EFFECT_LIST_BULLET$Nikt nie może kupić roszczenia do swojego [head_of_faith|E]"
 game_concept_canonized_desc: "[character|E], który po śmierci został ogłoszony świętym lub odpowiednikiem innej ideologii, takim jak Wali lub czczony przodek, zyskuje [GetTrait('saint').GetName( GetNullCharacter )] [trait|E]. \n\nA cnotliwe życie może zakończyć się $game_concept_canonization$: jest składane przez [decision|E], może wymagać błogosławieństwa [head_of_faith|E] i jest przypieczętowane przez poświęcenie miejsca pochówku świętego. Ich miejsce spoczynku przyciąga pobożnych podróżnych, a ich szczątki mogą przynieść [holy_relics|E]."
 game_concept_capital_duchy: "Region stołeczny"
 game_concept_capital_duchy_desc: "Modyfikator $game_concept_capital_duchy$ zwiększa ilość [levies|E], którą otrzymujesz ze wszystkich [holdings|E], które posiadasz w tej samej [de_jure|E] [duchy|E] co twój [capital|E]. Daje również bonus do wszystkich [stationed|E] [men_at_arms|E]. Aby ten modyfikator był aktywny, musisz osobiście posiadać powiązany Region.\n\nTen modyfikator nie sumuje się z bonusem Bazy Głównej."
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$ dąży do obsadzenia konkretnego [claimant|E] jako [ceremonial_liege|E]. Jeśli się powiedzie, urzędujący Ceremonialny Lider Partii będzie musiał przekazać swój [title|E] Pretendentowi. Wszyscy członkowie [faction|E] zyskają [hook|E] na Pretendentem."
 game_concept_ceremonial_liege_desc: "W niektórych [realms|E] (takich jak Japonia) potężny urzędnik lub dowódca mógł przejąć prawdziwą władzę jako [ceremonial_regent|E], pozostawiając nominalnie panującego $game_concept_ceremonial_liege$ jako zwykłą figurę i [vassal|E] w praktyce. Wszyscy członkowie $game_concept_ceremonial_liege_possessive$ [house|E] są uważani za część [ceremonial_house|E]. \n\n Pomimo że nie rządzą bezpośrednio, $game_concept_ceremonial_house$ jest najbardziej cenioną linią krwi w partii, a inne [houses|E] zyskują więcej [prestige|E] poprzez małżeństwa z nimi, przy czym takie powiązania silnie wpływają na sukcesję $game_concept_ceremonial_regent$. \n\n $game_concept_ceremonial_liege$ może odzyskać prawdziwą władzę, jeśli w jakiś sposób odzyska [primary_title|E] partii, na przykład poprzez [faction|E] wymóg lub rywalizując o $game_concept_ceremonial_regent$ [title|E] przy użyciu [influence|E]."
 game_concept_challenger_hof: "Przywódca Ruchu Wyzwania"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$ jest rywalem [head_of_faith|E] wysuniętym przeciwko [mainline_rite|E] $game_concept_head_of_faith$. \n \n [ruler|E] może sponsorować członka swojego [clergy|E] jako $game_concept_challenger_hof$. [clergy|E] [ruler|E] lub władca z [faith|E] z liderem Ruchu Czasowego może ogłosić siebie jako Wyzwanie. \n \n Sponsorem $game_concept_challenger_hof$ przydzielonym [rite|E] zostaje [external_clerical_puppet|E] swojego sponsora i jest mu dłużny [weak_hook|E]. \n \n $game_concept_mainline_rite$ $game_concept_head_of_faith$ nie może [excommunicate|E] nikogo, kto podąża za $game_concept_challenger_hof$: sponsora i ich [vassals|E]. \n \n Każdy podążający za $game_concept_challenger_hof$ przynosi swoje prośby duchowne do nich zamiast do $game_concept_mainline_rite$ $game_concept_head_of_faith$, wśród nich te [interactions|E]: \n $EFFECT_LIST_BULLET$ [petition_antipope_indulgences_interaction|E] \n $EFFECT_LIST_BULLET$ [petition_antipope_gold_interaction|E] \n \n $game_concept_challenger_hof$ lub ich sponsor może użyć [pam_challenge_hof_cb|E] [casus_belli|E] przeciwko prawowitemu $game_concept_head_of_faith$. \n \n Rywal [kings|E] lub wyżej z tej samej [faith|E] może zamiast tego użyć [pam_antiking_cb|E] przeciw sponsorowi, obalając rywalizującego pretendenta."
 game_concept_chancellor: "Minister Spraw Zagranicznych"
 game_concept_chancellor_desc: "$game_concept_chancellor$ jest [councillor|E] odpowiedzialnym za dyplomację, zarówno za granicą, jak i z resztą [realm|E]."
 game_concept_chancellors: "Sekretarze ds. zagranicznych"
 game_concept_church_authority_desc: "$game_concept_church_authority$ represents the power that a [theocratic|E] [ruler|E] wields over their [clergy|E] and [vassals|E].\n\nThere are four levels of $game_concept_church_authority$; $church_authority_0$, $church_authority_1$, $church_authority_2$, and $church_authority_3$. Increasing $game_concept_church_authority$ costs an amount of [piety|E] and [prestige|E] depending on the level and the ruler's [learning_skill|E].\n\n#weak Backbenchers dislike higher levels of $game_concept_church_authority$, and lowering it is the primary goal of [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_claimant_desc: "A $game_concept_claimant$ is a person with one or more [claims|E] to [titles|E]. [ruler|E] Claimants can press these by using the Claim [casus_belli|E] to declare [wars|E].\n\nThis Casus Belli can also be used to press the Claims of [vassals|E] and even [unlanded|E] characters in your [realm|E].\n\nClaimants can also lead [factions|E] — even if they do not reside in your Party."
 game_concept_claimant_faction_desc: "$game_concept_claimant_faction$ dąży do obsadzenia konkretnego [claimant|E] na tronie [title|E] zajmowanym przez ich [liege|E]. Jeśli się powiedzie, Lider Partii będzie musiał przekazać Tytuł Pretendentowi, a struktura [vassal|E] zostanie zaktualizowana zgodnie z tym. Wszyscy członkowie [faction|E] zyskają [hook|E] na Pretendentem."
 game_concept_clan_desc: "Klany to [government_form|E], w którym ilość [levies|E] i [taxes|E] przekazywanych [liege|E] przez [vassals|E] jest ustalana przez [aptitude|E] [tax_collector|E] tego Przywódcy Partii. Klany również korzystają z [house_unity|E]."
 game_concept_clergy: "Funkcjonariusze partii"
 game_concept_clergy_desc: "[court_chaplains|E], [realm_priests|E], [theocratic|E] Rulers, and anyone with the [GetTrait('devoted').GetName( GetNullCharacter )] trait are considered members of the Party Officials.\n\nThe [doctrines|E] of the [faith|E] determine who can be a member of the Party Officials, and whether members of the Party Officials can marry, inherit land, etc."
 game_concept_clergy_opinion: "Opinie funkcjonariuszy partii"
 game_concept_clerical_puppet: "Marionetka kapłana partii"
 game_concept_clerical_puppets: "Marionetki kapłana partii"
 game_concept_clerical_region_desc: "Region Klericalny to obszar geograficzny, który podlega jurysdykcji [clerical_title|E]. Każdy członek władz partyjnych w regionie będzie [subordinate|E] dla posiadacza [title|E] związanego z regionem.\n\nA [ruler|E] należy do Regionu Klerikalnego, który zawiera jego [capital|E] [county|E], a nowy region jest zakładany na podstawie [capital|E] [primary_title|E] założyciela. Region może obejmować wiele [realms|E] i mieć podwładnych należących do różnych partii.\n\nA $game_concept_ruler$ może posiadać tylko jeden $game_concept_clerical_region$ naraz. Jeśli zostanie przyznany nowy region, Władca traci wszystkie posiadane ziemie w poprzednim."
 game_concept_clerical_title_desc: "$game_concept_clerical_title$ to [ecclesiastical|E] [title|E] [clergy|E] regulujący [clerical_region|E] w ramach [faith|E]. Wśród ideologii [christian|E] jest to [archdiocese|E].\n\nPosiadacz jest [religious_superior|E] [clergy|E] w tym regionie i zazwyczaj jest mianowany przez [head_of_faith|E]."
 game_concept_commander_trait_desc: "$game_concept_commander_traits$ są specjalnymi [traits|E], które zapewniają postaciom przydatne bonusy podczas działania jako [army|E] [commanders|E].\n\nCechy Dowódcy są zazwyczaj zdobywane przez dzieci wychowane w Bezpieczeństwie [education_focus|E], ale można je również uzyskać poprzez [martial_lifestyle|E] i inne środki."
 game_concept_complete_control_desc: "Ten warunek jest spełniony, gdy wszyscy [de_jure|E] posłowie zza kulis [titles|E] danego tytułu są zajęci przez [ruler|E] lub przez ich [vassals|E] i żadne z jego Okręgów Wyborczych nie są [occupied|E] przez wrogie [armies|E]."
 game_concept_complete_control_region_desc: "Ten warunek jest spełniony, gdy wszyscy [counties|E] w docelowym [region|E] są zajęci przez władcę lub przez jego [vassals|E] i żadne z jego Okręgów Wyborczych nie są zajęte przez wrogie armie."
 game_concept_confederation_desc: "A relation that binds [tribal|E] or [nomadic|E] [rulers|E] in mutual defense, similar to an [alliance|E]. Formed through the #high $call_for_confederation_decision$#! [decision|E], a confederation requires its members to join each other's Defensive [wars|E]. Confederations are visible in the Charisma tab.\n\nFellow [confederates|E] also may not attack or [raid|E] one another. They are restricted from high levels of [tribal_authority|E] and [nomadic_authority|E], and may not create new [titles|E].\n\n[confederates|E] may use the #high $leave_confederation_decision$#! [decision|E] or [migrate|E] to become [independent|E]. If a confederation is left with only one member, it is destroyed."
 game_concept_contestant_desc: "Aby rywalizować w [GetActivityType( 'activity_tournament' ).GetName] [contests|E], musisz spełnić jego wymagania. Gry planszowe pozwalają wszystkim postaciom brać udział w rywalizacji, podczas gdy inne, jak Wrestling, zależą od zasad bezpieczeństwa.\n\nPostacie nie uczestniczące w rywalizacji będą [spectators|E], a potencjalne [contestants|E] mogą zrezygnować z udziału, jeśli chcą obserwować.\n\nUprawnienie do udziału w konkursach określa płeć i zdrowie, w oparciu o [culture|E] i [religion|E] organizatora."
 game_concept_convert_county_desc: "[councillor_task|E] wykonywana przez [court_chaplain|E], która celuje w [county|E] innej [faith|E] — lub jednej o tej samej ideologii, ale innej [rite|E] — niż [liege|E].\nPostęp wzrasta co miesiąc, a przy 100% większość docelowego elektoratu przyjmuje ideologię lidera Izby. Nowy [rite|E] podąża za [liege|E], gdy wynikowa ideologia odpowiada liderowi partii — w przeciwnym razie jest to własna ideologia kapelana.\n\nSzybkość konwersji zależy od wielu czynników, w tym od [councillor|E]s [learning_skill|E] i [fervor|E] zaangażowanych ideologii. Kapelan, którego [rite|E] różni się od [liege|E], konwertuje wolniej.\nW przypadku przesunięcia ograniczonego do [rite|E], [fervor|E] faworyzuje główną ideologię powyżej #V 50%#!, a ideologie niegłówne (w tym odszczepione) poniżej niej."
 game_concept_convince_dejure_desc: "[councillor_task|E] wykonywana przez [steward|E]. Celuje w [de_jure|E] [county|E] ministra [liege|E], który jest własnością [independent|E] [ruler|E]. Gdy elektorat zostanie przekonany, poprosi swoich [ruler|E] o przeniesienie ich do [de_jure|E] [liege|E]."
 game_concept_coronation_anointment_desc: "Anointment is one type of a [coronation|E], where the [ruler|E] will seek out their [head_of_faith|E], or party officials [head_of_rite|E] when there is none, to bless their ascension to the throne. In certain ideologies this is necessary to truly be considered a [legitimate|E] ruler of their lands.\n\nTo secure that authority's support, the [host|E] can use the [anointment_request|E] [interaction|E]."
 game_concept_council: "Gabinet"
 game_concept_council_desc: "$game_concept_council$ to najwyższy zespół lidera złożony z [councillors|E], z których każdy kieruje własnym działem. Mogą otrzymać ważne [councillor_tasks|E]."
 game_concept_councillor: "Minister"
 game_concept_councillor_desc: "Ministrowie są głównymi asystentami każdego [ruler|E] i tworzą [council|E]. W skład gabinetu wchodzi sześć stanowisk: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (lub [realm_priest|E]), a na końcu Twój [spouse|E].\n\nKażdy z nich odpowiada za departament, któremu można powierzyć różne [councillor_tasks|E] do wykonania.\n\n[powerful_vassals|E] będzie niezadowolony, jeśli nie zostanie powołany na jedno z tych stanowisk, co oznacza, że często musisz wybierać między zadowoleniem wpływowego posła zaplecza a powołaniem kogoś faktycznie kompetentnego.\n\nPełnienie funkcji Ministra dla Twojego [liege|E] daje bonus, który rośnie wraz z [rank|E] Lidera Partii."
 game_concept_councillor_task: "Zadanie ministerialne"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ to ważne zadania, które można przydzielić swojemu [councillors|E]. Te zadania mogą być ogólne lub skierowane konkretnie do [county|E] lub [court|E].\n\nJeśli masz [relation|E] z Ministrem, zadania z czasem wykonania mogą zająć więcej lub mniej czasu.\n\n#weak Należy zauważyć, że ministrowie nie wykonują tych zadań fizycznie, lecz jedynie kierują ich realizacją.#!"
 game_concept_councillor_task_possible_side_effects_desc: "[councillor_task|E] może z czasem mieć nieoczekiwane konsekwencje. Mogą być dobre lub złe, przy czym pozytywne efekty są bardziej prawdopodobne im wyższy jest odpowiedni [skill|E] ministra, a negatywne efekty są bardziej prawdopodobne, gdy odpowiednia umiejętność jest niższa."
 game_concept_councillor_tasks: "Zadania ministerialne"
 game_concept_councillors: "Ministrowie"
 game_concept_counties: "Okręgi wyborcze"
 game_concept_county: "Okręg wyborczy"
 game_concept_county_capital: "Kapitał okręgu wyborczego"
 game_concept_county_capital_desc: "$game_concept_county_capital$ jest głównym [holding|E] [county|E]. Ten Holding nigdy nie może zostać zniszczony ani [leased|E] i zawsze należy do [ruler|E], który posiada okręg [title|E]. \n\nConstituency Capitals pozwala na budowę dodatkowego [building|E] w porównaniu do mniejszego Holdingu."
 game_concept_county_capitals: "Stolice okręgów wyborczych"
 game_concept_county_control: "Kontrola okręgów wyborczych"
 game_concept_county_control_desc: "$game_concept_county_control$ mierzy uchwyt, jaki rząd ma nad populacją [county|E]. Jest to szczególnie istotne przy pobieraniu [taxes|E] z [holdings|E].\n\nGdy Okręg wyborczy zmienia właściciela poprzez [war|E], Kontrola spada drastycznie, co jest dobrym powodem, aby zamiast tego wasalizować obecnego [holder|E] (jeśli [casus_belli|E] na to pozwala). Kontrola Okręgu może być również osłabiona przez [sieges|E] i [Concept( 'peasant_faction', 'Peasant Uprisings' )|E].\n\nNiska kontrola może prowadzić do [county_corruption|E], a głównym sposobem zwiększenia Kontroli jest [councillor_task|E] dostępny twojemu [marshal|E]."
 game_concept_county_corruption: "Korupcja w okręgach wyborczych"
 game_concept_county_corruption_desc: "Gdy [county|E] ma niski [control|E] lub jego [holder|E] jest w [debt|E], Okręg może zdobyć $game_concept_county_corruption$. Są to różne rodzaje negatywnego [county_modifiers|E].\n\n$game_concept_county_corruption$ z czasem zaniknie, ale jeśli przyczyna źródłowa będzie się utrzymywać ([debt|E] lub niski [control|E]), może ponownie wystąpić.\n\n $councillor_marshal$'s $task_increase_control$ $game_concept_councillor_task$ może szybciej oczyścić $game_concept_county_corruption$."
 game_concept_county_fertility: "Płodność w okręgu wyborczym"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ istnieje w [counties|E] znajdującym się w [the_great_steppe|E], i może być wypasany przez [GetGovernment( 'nomad_government' ).GetName] [rulers|E] w celu zwiększenia ich [herd|E].\n\n Płodność Okręgu wyborczego reprezentuje jakość jego pastwisk.\n\n Płodność stabilizuje się w okolicach [fertility_equilibrium|E], umożliwiając Władzom Koczowniczym z dużym [domain_limit|E] utrzymanie wzrostu Swojego Stada. Płodność jest wpływana przez [steppe_seasons|E] i powoli odnawiana przez [herders|E].\n\n Kiedy płodność [realm|E] jest niska, jest to znak dla [migrate|E].\n\n[county_control|E] spowalnia tempo wzrostu Płodności o procent równy obecnej kontroli."
 game_concept_county_modifier: "Modyfikator okręgu wyborczego"
 game_concept_county_modifiers: "Modyfikatory okręgu wyborczego"
 game_concept_county_opinion_desc: "Ogół ludności każdej [county|E] ma [opinion|E] [character|E], który sprawuje ich $game_concept_county$. Jeśli ludność jest niezadowolona, może rozpocząć lub dołączyć do [peasant_faction|E] albo [popular_faction|E], z których którykolwiek może szybko rozprzestrzenić się na całe [realm|E]. \n\n Najprostszym sposobem kontrolowania $game_concept_county_opinion$ jest upewnienie się, że $game_concept_county$ [holder|E] ma tę samą [culture|E] i [faith|E] co populacja. \n\n$game_concept_county_opinion$ przed posiadaniem innej [faith|E] jest modyfikowane zarówno przez [faith_hostility|E] okręgu, jak i jego [fervor|E], skalując liniowo od 0 do 100 $game_concept_fervor$."
 game_concept_court: "Biuro"
 game_concept_court_amenities: "Udogodnienia biura"
 game_concept_court_amenity: "Udogodnienia biura"
 game_concept_court_artifact: "Artefakt biura"
 game_concept_court_artifact_desc: "Artefakt Biura to [artifact|E], który jest eksponowany w [ruler|E] [royal_court|E], taki jak gobeliny lub pięknie ilustrowane książki.\n\nArtefakty Biura są jednym z czynników determinujących [court_grandeur|E] Prywatnego Biura.\n\nNie ma ograniczenia, ile Artefaktów Postać może posiadać, ale tylko te eksponowane w slocie swojego typu mają jakikolwiek efekt.\n\nMożna tworzyć nowe Artefakty Biura z [inspired|E] [characters|E], z Decyzji o Komisarzu Artefaktów lub wybierając [reforge|E] [inventory_artifact|E]."
 game_concept_court_artifacts: "Artefakty biurowe"
 game_concept_court_chaplain: "Lider Izby"
 game_concept_court_chaplain_desc: "$game_concept_court_chaplain$ jest [councillor|E] odpowiedzialnym za sprawy religijne i duchowe w [faiths|E] wraz z [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E].\n\nIdeologie z [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] Stanowisko Polityczne mają znacznie potężniejszy (i kłopotliwszy) [realm_priest|E] zamiast $game_concept_court_chaplain$."
 game_concept_court_chaplain_possessive: "Lider Izby (dopełniacz)"
 game_concept_court_chaplains: "Liderzy Izby"
 game_concept_court_chaplains_possessive: "Liderzy Izby (w dopełniaczu)"
 game_concept_court_desc: "Każdy polityk ma $game_concept_court$: [unlanded|E] ludzi, którzy dla niego pracują.\n\n Ci [courtiers|E] to ich rodzina, doradcy, badacze i poplecznicy."
 game_concept_court_event: "Office"
 game_concept_court_events: "Wydarzenia biurowe"
 game_concept_court_grandeur: "Biurowa Wielkość"
 game_concept_court_grandeur_desc: "$game_concept_court_grandeur_value$ [royal_court|E] pokazuje, jak sławne jest Urządzenie, i odblokowuje nowe [court_grandeur_levels|E] w miarę wzrostu.\n\nWartość mieści się w zakresie od 0 do 100, i z czasem ustali się na swojej wartości podstawowej. Wartość podstawowa jest wpływana przez takie rzeczy jak [dynasty_perks|E], ile wydajesz na [court_amenities|E] oraz czy masz jakieś wspaniałe [court_artifacts|E].\n\nCzęść Wielkości zostaje utracona przy [succession|E]."
 game_concept_court_grandeur_expectation: "Oczekiwania na wielkość biura"
 game_concept_court_grandeur_expectations: "Oczekiwania dotyczące wielkości biura"
 game_concept_court_grandeur_level: "Poziom Wielkości Biura"
 game_concept_court_grandeur_level_desc: "A [royal_court|E]'s Grandeur Level gives bonuses to its owner, and is unlocked as the Office's [court_grandeur_value|E] increases.\n\nIn addition to each level's effects, large [realms|E] are expected to have reached higher Grandeur Levels. This is known as [court_grandeur_expectations|E]."
 game_concept_court_grandeur_levels: "Poziomy przepychu biurowego"
 game_concept_court_grandeur_value: "Wartość biura"
 game_concept_court_guest: "Gość w biurze"
 game_concept_court_host: "Gospodarz biura"
 game_concept_court_host_desc: "$game_concept_court_host$ to [ruler|E], który nie jest liderem partii danej postaci, a mimo to ma ją w swojej [court].\n\n Może się to zdarzyć z różnych powodów, takich jak [wanderers|E] odwiedzanie Władcy lub [wards|E] przebywanie w tym samym Urzędzie co ich [guardian|E]."
 game_concept_court_language: "Język biurowy"
 game_concept_court_language_desc: "Język Biura jest oficjalnym [language|E] [royal_court|E], używanym przez szlachtę i stosowanym przez biurokrację.\n\nPodstawowy [court_grandeur|E] wzrasta dla każdego [realm|E] [county|E], który posługuje się tym Językiem, dla każdego Prywatnego Biura używającego tego samego Języka Biura oraz jeśli jest to język ojczysty [ruler|E]."
 game_concept_court_languages: "Języki biurowe"
 game_concept_court_position: "Stanowisko"
 game_concept_court_position_task: "Zadanie mianowania"
 game_concept_court_position_tasks: "Zadania dotyczące mianowania"
 game_concept_court_positions: "Stanowiska"
 game_concept_court_type: "Typ biura"
 game_concept_court_type_desc: "As a part of their [royal_court|E], [rulers|E] can have a designated $game_concept_court_type$.\n\nEach $game_concept_court_type$ provides the Ruler and the [court|E] with their own set of bonuses, depending on [court_grandeur_level|E].\n\nThe [ethos|E] of a Ruler's [culture|E] decides which Office Types they can have.\n\nThe different Office Types are:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "Cecha typu biurowego"
 game_concept_court_type_trait_desc: "Po odbyciu [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] lat w [royal_court|E], [courtier|E] otrzymuje [trait|E] odzwierciedlający [court_type|E] tego sądu.\n\nJakość tej cechy zależy od tego, jak długo [character|E] pracował jako współpracownik w biurze."
 game_concept_court_types: "Typy biur"
 game_concept_courtier: "Pracownik"
 game_concept_courtier_desc: "$game_concept_courtier$ to [unlanded|E] postać, która służy [ruler|E] w swoim [court|E].\n\nPersonel może:\n$BULLET_WITH_TAB$Pełnić funkcję [councillors|E]\n$BULLET_WITH_TAB$Służyć w [court_positions|E]\n$BULLET_WITH_TAB$Służyć w [armies|E] jako [commanders|E] lub [knights|E]\n$BULLET_WITH_TAB$Zostać [vassal|E] swojego Władcy, jeśli zostanie przyznany [title|E]\n$BULLET_WITH_TAB$Pozwolić swojemu Władcy nacisnąć [claims|E] w [war|E]\n\n#WEAK [adventurers|E] mieć [followers|E] zamiast $game_concept_courtiers$ — pełnią tę samą rolę, choć zazwyczaj są bardziej śmierdzące i pokryte błotem.#!"
 game_concept_courtiers: "Personel"
 game_concept_courts: "Biura"
 game_concept_criminal_task_contract_desc: "$game_concept_criminal_task_contract$ zazwyczaj obejmuje podejrzane kontrakty, które mogą być lukratywne, ale przyznają Ci @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\nPodnoszenie poziomu $trait_gallowsbait$ [trait|E] sprawi, że większość świata będzie Cię bardziej nienawidzić i mniej szanować, a ostatecznie spowoduje, że [followers|E], którzy nie aprobowali Twojego bandytyzmu, dramatycznie opuszczą Twój zatrudnienie.\n\n#WEAK $trait_gallowsbait$ jest wysoce negatywnym $game_concept_trait$, co oznacza, że postać jest drobnym przestępcą najniższego szczebla — przynajmniej morderstwo w biurze ma jakiś rodzaj #EMP klasy#!.\n\nMożna to całkowicie oczyścić dzięki [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E].#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ represents the general power that a [ruler|E] wields over their [vassals|E].\n\nThere are four levels of $game_concept_crown_authority$; [autonomous_vassals|E], [limited|E], [high|E], and [absolute|E]. Increasing $game_concept_crown_authority$ costs an amount of [prestige|E] depending on the level and the ruler's [learning_skill|E].\n\n#weak Backbenchers dislike higher levels of $game_concept_crown_authority$, and lowering it is the primary goal of [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_culture_head_desc: "'$game_concept_culture_head$' to [ruler|E], który ma największy wpływ na swoją własną [culture|E].\n\nSzczególnie, władca z łączną największą liczbą [counties|E] tej samej kultury w swoim [realm|E] stanie się $game_concept_cultural_head$, bez względu na to, gdzie jest jego [domain|E] lub jakie okręgi innej kultury posiada.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\n$game_concept_cultural_head$ może wpływać na to, które [innovation|E] powinny być priorytetowo odkrywane przez ustawienie [cultural_fascination|E].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "A slow process by which a [title|E]'s [de_jure|E] [liege|E] can change. It occurs naturally when a [duchy|E] or [kingdom|E] is completely controlled by a [ruler|E] who does not hold the territory's de jure party leader title.\n\nThis process can be sped up by assigning your [chancellor|E] to the appropriate [councillor_task|E] #weak ($task_integrate_title$)#!. Regions can only $game_concept_de_jure_drift$ into Nations, and Nations can only Drift into [empires|E].\n\nLetting titles De Jure Drift into your [primary_title|E] is a good way to get rid of the [rightful_liege|E] penalty."
 game_concept_de_jure_drift_desc_part_2: "#weak Przykład: Region $d_northumberland$ jest de jure częścią $k_england$, ale terytorium regionu znajduje się całkowicie w $k_scotland$. Ponieważ Król $k_scotland$ nie posiada także $k_england$, region zacznie $game_concept_de_jure_drift$ zmierzać do stania się częścią $k_scotland$.#!"
 game_concept_death_religion: "Obóz polityczny"
 game_concept_death_religion_desc: "Bycie przekazanym do następnego świata przez przeciwników i świętokradzkim pokonaniem twojego śmiertelnego kręgu — męczeństwa, ukrzyżowania — pozostając wiernym swojej ideologii aż do samego końca, czy jest bardziej autentyczny sposób, by przekazać dalej."
 game_concept_debt_desc: "Debt is the state of having a negative amount of [gold_i][gold|E]. This typically happens when a [ruler|E] at war hires [mercenaries|E] without having enough Funds to cover the full cost, or when they are at war for too long.\n\n While in Debt you cannot declare new [wars|E], your [men_at_arms|E] do not reinforce, and your enemies will have an [advantage|E] over you in battle. The deeper into debt you fall, the more penalties you will get — fewer [levies|E], reduced [county_opinion|E], and your [vassals|E] will like you less.\n\nIn addition to this, various other minor destabilizing events may occur, such as gaining [county_corruption|E] in your [domain|E] [counties|E]. \n\n#help It is generally a good idea to strike your enemies while they are in Debt, as they will fight with reduced [advantage|E]!#!"
 game_concept_demand_conversion_desc: "[rulers|E], którzy mają poddanych innego [faith|E], mogą zażądać konwersji, aby zmienić ideologię swojego poddanego na własną. Umiejętności [learning|E] władcy oraz [opinion|E] lidera partii są kluczowymi czynnikami decydującymi, czy poddany zaakceptuje żądanie, czy [Concept('refuse_conversion_crime','refuses')|E] je."
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$ zarządza, jak dobrze [diarch|E] osiąga każdy [mandate|E] ustalony przez ich [liege|E].\n\n Zarówno [skills|E], jak i [personality_traits|E] odgrywają rolę. Na przykład, [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$ przypisany do “$fill_coffers_mandate$” Mandatu może nie wysyłać tyle [gold|E] do swojego lidera partii.\n\n#WEAK [diarchs|E] nadają się dobrze do $game_concept_mandate$, gdy mają około 40+ $game_concept_aptitude$ do tego.#!"
 game_concept_diarch_power_desc: "[diarch|E] w aktywnym [power_sharing|E] ma dostęp do specjalnych $game_concept_diarch_powers$.\n\nSą to specjalne [character_interaction|E], które naśladują te, jakie mają ich [liege|E], lub są innymi nadużyciami władzy. Przykłady obejmują [revoking|E] [titles|E] od współpracujących [vassals|E], lub odprowadzanie [gold|E] od swojego Lidera Partii.\n\nWiele $game_concept_diarch_powers$ daje Liderowi Partii możliwość [veto|E] ich."
 game_concept_diplomacy: "Charyzma"
 game_concept_diplomacy_lifestyle: "Styl życia Charyzmy"
 game_concept_diplomacy_skill: "Umiejętność Charyzmy"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ jest [skill|E] dla uroku, perswazji i zawierania umów: radzenie sobie w towarzystwie, zdobywanie przychylności współpracowników i doprowadzanie transakcji do końca.\n\nBezpośrednio wpływa na [opinions|E], jakie inni bohaterowie mają w stosunku do ciebie, i zwiększa Charyzmę [schemes|E].\n\nOdpowiednikiem [lifestyle|E] jest [diplomacy_lifestyle|E]."
 game_concept_diplomacy_task_contract: "Kontrakt Charyzmy"
 game_concept_diplomacy_task_contract_possessive: "Kontraktu Charyzmy"
 game_concept_diplomacy_task_contracts: "Kontrakty Charyzmy"
 game_concept_diplomacy_task_contracts_possessive: "Kontraktów Charyzmy"
 game_concept_direct_vassal: "Bezpośredni poseł tylnych ław"
 game_concept_direct_vassals: "Bezpośredni posłowie tylnych ław"
 game_concept_directed_great_holy_war_desc: "$game_concept_directed_great_holy_war$ jest ogłaszany przez $doctrine_temporal_head_name$ [head_of_faith|E] z zamiarem podporządkowania [kingdom|E] swojej władzy.\n\n[rulers|E] ich [faith|E] mogą wybrać, aby wspomóc Lidera Ruchu i mogą otrzymać za to nagrody. Nagrody obejmują [piety|E] i potencjalnie sprawienie, że ich [dynasty|E] stanie się [landed|E] w podbitym Państwie.\n\nWładcy atakowanego [religion|E] mogą zdecydować się na obronę przeciwko tej wojnie bez potrzeby [alliance|E]."
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ jest najniższym poziomem [tribal_authority|E]. Na tym poziomie [vassals|E] nie mają kary [opinion|E] wobec ich [liege|E], a lider partii nie ma nad nimi żadnej władzy poza możliwością żądania [levies|E] i [taxes|E]."
 game_concept_dissolution_faction_desc: "[dissolution_faction|E] dąży do zniszczenia [realm|E] ich [liege|E]. Jeśli się powiedzie, wszyscy szeregowi członkowie partii stają się [independent|E], a lider partii traci swój [primary_title|E]."
 game_concept_doctrine: "Stanowisko polityczne"
 game_concept_doctrine_knowledge: "Wiedza o stanowisku politycznym"
 game_concept_doctrines: "Stanowiska polityczne"
 game_concept_doctrines_desc: "Stanowiska polityczne to to, w co wierzy [faith|E]: podatki i wydatki, własność, imigracja, Europa, Unia i wolności obywatelskie. Projekty ustaw, które kolidują ze stanowiskami politycznymi posła, zwiększają prawdopodobieństwo rebelii."
 game_concept_domain: "Portfel"
 game_concept_domain_desc: "$game_concept_domain$ polityka to wszystko, co osobiście posiada: ich miejsce i jego okręgi.\n\n [domain_limit|E] oznacza, że lider musi polegać na [vassals|E], aby prowadzić więcej niż kilka miejsc."
 game_concept_domain_fertility: "Płodność Portfela"
 game_concept_domain_fertility_desc: "Płodność Portfela to całkowita [county_fertility|E] wszystkich posiadanych przez ciebie [counties|E]."
 game_concept_domain_income: "Dochód z Portfela"
 game_concept_domain_limit: "Limit Portfela"
 game_concept_domain_size: "Rozmiar Portfela"
 game_concept_domain_taxes: "Podatki Portfela"
 game_concept_domains: "Portfele"
 game_concept_dominant_family_desc: "$game_concept_dominant_family$ to [powerful_family|E], który rozprzestrzenił swoją kontrolę szeroko i daleko. Jest uważany za najbardziej wpływowego [house|E] w ramach [realm|E].\n\n Członek $game_concept_dominant_family$ jest jeszcze lepszy w [political_schemes|E] i jeszcze bardziej prawdopodobne, że osiągnie to, czego chce, gdy [interacting|E] z innymi [characters|E].\n\n $game_concept_house$ musi kontrolować co najmniej [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] Partii, aby stać się Dominantem."
 game_concept_dread: "Wpływy"
 game_concept_dread_desc: "$game_concept_dread$ oznacza, jak bardzo [ruler|E] jest budzący strach: lider, który bez mrugnięcia zwalnia ministrów, bicz, który nigdy nie zapomina buntu.\n\nPolitycy zdobywają $game_concept_dread$ dzięki bezwzględnym działaniom: zwolnienia, czystki i dawanie przykładu buntownikom lub [prisoners|E].\n\nWpływ umożliwia prowadzenie jak [tyrant|E], ponieważ nieposłuszni [vassals|E] mogą stać się [intimidated|E] lub [cowed|E], co sprawia, że boją się sprzeciwić.\n\nWpływ postaci może wahać się od 0 do 100, z wyjątkiem [nomads|E], który może osiągnąć 150. Z czasem ich wpływ będzie dążył do ich Naturalnego Wpływu, który jest określany przez ich [personality_traits|E].\n\n#high Potężny [ruler] przynosi następujące korzyści:#!\n$BULLET_WITH_TAB$[vassals] zniechęca się do przystępowania do [factions|E]\n$BULLET_WITH_TAB$[vassals] zniechęca się do [scheming|E]\n$BULLET_WITH_TAB$Zwiększa akceptację [vassal] #weak (np. odebranie tytułu)#!\n$BULLET_WITH_TAB$Zwiększa akceptację [offer_vassalization|E]\n$BULLET_WITH_TAB$Sprawia, że [electors|E] jest bardziej skłonny głosować tak jak ty\n$BULLET_WITH_TAB$Zniechęca posłów tylnych ław do sprzeciwiania się zmianom [law|E]\n\n#weak Zauważ, że odważni i śmiali [vassals] są mniej podatni na wpływ!#!"
 game_concept_dreaded: "Impuicable"
 game_concept_dreadful: "Impuicable"
 game_concept_dreams_desc: "Postacie, które podążają za ideologią związaną z wróżbiarstwem, mogą czasami doświadczać snów. Te sny mogą być następnie interpretowane przez mistyka, co może mieć różne skutki, zarówno dobre, jak i złe."
 game_concept_duchies: "Regiony"
 game_concept_duchy: "Region"
 game_concept_duchy_building: "Budynek Regionu"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ są potężnymi [buildings|E], które można zbudować tylko w [de_jure_capital|E] [duchy|E]. Tylko jeden typ może być zbudowany w każdym Regionie.\n\n$game_concept_duchy_buildings$ są aktywne tylko wtedy, gdy właściciel posiada również powiązany Region [title|E].\n\nWielu $game_concept_duchy_buildings$ ma modyfikatory, które wpływają na wszystkie [holdings|E] w Regionie, czyniąc je potężnymi narzędziami do specjalizacji swojego [domain|E]."
 game_concept_duchy_buildings: "Budynki Regionu"
 game_concept_duchy_desc: "$game_concept_duchy$ to [title|E] jeden [title_tier|E] poniżej [kingdom|E] i jeden powyżej [county|E].\n\n [holder|E] $game_concept_duchy$ ma [de_jure|E] prawa do swoich składników $game_concept_counties$ i może mieć [counts|E] jako [vassals|E].\n\n Regiony mogą być uśpione i nie mieć obecnego Posiadacza. Takie $game_concept_title_succession$ mogą być stworzone przez [ruler|E], który kontroluje co najmniej połowę jego $game_concept_counties$."
 game_concept_dynasty_perks: "Dziedzictwa partii"
 game_concept_dynasty_prestige: "Marka partii"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$ to reputacja partii jako całości: to, co wyborcy uważają za jej nazwę i jakie drzwi otwiera jej członkom. \n\nA [dynasty|E] zyskuje $game_concept_dynasty_prestige$ od żyjących członków, od członków pełniących funkcje oraz od osób zamężnych z innymi funkcjonariuszami. \n\nIlicza się do [dynasty_prestige_level|E] partii, a lider partii może go wydać na [dynasty_perks|E]."
 game_concept_dynasty_prestige_level: "Poziom marki partii"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\nTo jest najwyższy poziom marki partyjnej."
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ is a measure of how famous a [dynasty|E] is. Level progress is made whenever your Dynasty gains [dynasty_prestige|E]. Characters get an amount of initial [prestige|E] when they are born depending on their $game_concept_dynasty_prestige_level$. Similarly, [spouses|E] gain some Profile from each other's Dynasty when they [marry|E].\n\nThe levels are:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[interaction|E], przez który [ecclesiastical|E] [rulers|E] mogą sprawić, że świeccy władcy tego samego [faith|E] ogłoszą [holy_war|E] na władców wrogiej ideologii."
 game_concept_ecumenical_councils: "Gabinetów Ekumenicznych"
 game_concept_eminent_holy_site: "Wybitny Heartland"
 game_concept_eminent_holy_site_desc: "An $game_concept_eminent_holy_site$ jest [holy_site|E] o dużym znaczeniu dla [faith|E]. Każda Ideologia może wyznaczyć tylko niewielką liczbę swoich $game_concept_holy_sites$ jako Wybitne.\n\nTylko Wybitne Sercowe Krainy przyczyniają się do modyfikatorów, które wpływają na wszystkich wyznawców Ideologii."
 game_concept_eminent_holy_sites: "Wybitne Heartlands"
 game_concept_empire: "Wielka Brytania"
 game_concept_empires: "Związki zawodowe"
 game_concept_enshrined_desc: "Uroczyste [holy_relic|E] w [holy_site|E] aktywuje bonusy serca i poprawia przyznawane przez nie bonusy, skalowane według całkowitych poziomów [rarity|E] wszystkich uroczyście umieszczonych artefaktów.\n\nUroczysty artefakt nie należy już do postaci, ale może być z nim wchodzona w interakcję przez [holder|E], [top_liege|E] lub [clerical_region|E] posiadacza serca. Artefakt nie ulegnie już rozkładowi. Możesz uroczyście umieszczać tylko święte relikwie dla własnego [faith|E]; uroczyście umieszczone święte relikwie innych ideologii nie przyniosą żadnych korzyści.\n\nMogą istnieć nagrody lub koszty związane z uroczyście umieszczaniem lub usuwaniem uroczystego artefaktu."
 game_concept_entrenched_regency_desc: "Jeśli [regency|E] trwa zbyt długo, może stać się Utwierdzona, a [regent|E] staje się jeszcze potężniejsza w porównaniu do ich [liege|E].\n\nKorzyści, które [regent|E] otrzymuje z [scales_of_power|E] stają się o wiele potężniejsze.\n\nAby zakończyć $game_concept_entrenched_regency$, Regent musi przyjąć dar od swojego Lidera Partii, lub Lider Partii musi przechylić Szale na swoją korzyść."
 game_concept_escalated_peasant_factions: "Eskalowane ruchy protestacyjne"
 game_concept_expected_legitimacy: "Oczekiwany Mandat"
 game_concept_expected_legitimacy_desc: "[legitimacy_level|E], które [vassals|E] oczekują od swojego [ruler|E], w oparciu o ich historyczne relacje. Niektóre czynniki obniżające oczekiwania to: \n$BULLET_WITH_TAB$ Bycie [de_jure|E] [liege|E] szeregowca \n$BULLET_WITH_TAB$ Bycie częścią [close_family|E] szeregowca \n$BULLET_WITH_TAB$ Bycie [preferred_heir|E] szeregowca \n$BULLET_WITH_TAB$ Bycie tym samym [dynasty|E], któremu szeregowiec służył dłużej niż #color_white 50#! lat \n$BULLET_WITH_TAB$ Szeregowiec nie będący [powerful_vassal|E] \n\n Jeśli rzeczywisty poziom jest poniżej ich oczekiwań, mogą stać się niesforni: ich [opinion|E] będzie niższe i mogą dołączyć do [factions|E] przeciwko swojemu [liege|E]. \n\n Oczekiwania rosną wraz z poziomem ich [primary_title|E], a także z [era|E]."
 game_concept_external_clerical_puppet_desc: "Potężny członek [clergy|E] — [archbishop|E] lub nawet [head_of_faith|E] — który stał się [puppet|E] innego [ruler|E].\n\n Im potężniejszy duchowny, tym większy zasięg: sterowany Lider Ruchu może [excommunicate|E] twoich wrogów, mianować [cardinals|E], przyznać [pressed_claim|E] lub podżegać [holy_war|E] w twoim imieniu."
 game_concept_faction_desc: "$game_concept_faction$ to grupa [vassals|E] mających wspólne interesy polityczne. Ludność lokalna [counties|E] również może dołączyć do pewnych typów Frakcji, takich jak Ruch Protestacyjny.\n\n Frakcje stają się niebezpieczne, gdy ich [faction_discontent|E] osiągnie określony poziom, wówczas wydają ultimatum.\n\n Jeśli [liege|E] nie zastosuje się, Frakcja powstaje w obronie, wywołując [civil_war|E]. Jeśli Frakcja rozpadnie się przed zakończeniem Wojny, Lider Partii musi mieć przynajmniej [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E], aby wygrać Wojnę."
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$ is a measure of the total military strength of a [faction|E] relative to their target.\n\nEach individual faction member adds their full strength to the Faction as long as they remain in the Faction. If the faction target is the [liege|E] of a member, the strength of the member is also subtracted from the relative power of the party leader."
 game_concept_faith: "Ideologia"
 game_concept_faith_astray: "Dywergentny"
 game_concept_faith_astray_desc: "Ten [rite|E] należy do twojego obozu politycznego lub sąsiedniego: nie zgadzasz się co do szczegółów. \n\n#S Skutki:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "$game_concept_faith$ to polityczna wiara polityka, w ramach większego [religion|E]. Każda postać i [county|E] ją posiada: ideologia okręgu wyborczego to skłonność jego wyborców, a ona przesuwa się w stronę swojego posła. \n\n [doctrines|E] Idealogii to jej stanowiska polityczne, a jej [core_tenets|E] to charakterystyczne sprawy. Jej [fervor|E] to stopień zaangażowania aktywistów. \n\n Politycy o różnych ideologiach lubią się nawzajem mniej, tym bardziej im dalsze są ich obozowiska. Każdy może zmienić zdanie (decyzja Zmień Swoją Politykę), za określoną cenę."
 game_concept_faith_evil: "Nie do pogodzenia"
 game_concept_faith_evil_desc: "Ten [rite|E] chce przeciwnej konstytucyjnej przyszłości: nacjonalistycznej przeciwko związkowi. \n\n#S Skutki:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "Przeciwny"
 game_concept_faith_hostile_desc: "Ten [rite|E] przechodzi przez główny podział polityczny – lewica kontra prawica. \n\n#S Skutki:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "Odległość ideologiczna"
 game_concept_faith_hostility_desc: "Wszystkie [faiths|E] mają względem siebie relację, która jest określana przez to, jak bardzo różnią się ich poglądy polityczne.\n\nIdeologie tej samej lub sąsiedniej [religion|E] różnią się szczegółami; lewica i prawica są przeciwstawne; nacjonaliści i zwolennicy unii są nie do pogodzenia.\n\nIstnieją następujące relacje: [faith_righteous|L], [faith_astray|L], [faith_hostile|L] i [faith_evil|L]."
 game_concept_faith_righteous: "O podobnych poglądach"
 game_concept_faith_righteous_desc: "Ten [rite|E] podziela twoje poglądy polityczne. \n\n#S Skutki:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "Ideologia's"
 game_concept_faiths: "Ideologie"
 game_concept_feast_desc: "[activity|E], gdzie władcy i personel zbierają się na przyjęciu, aby świętować… coś tam.\n\n Uczestnicy stracą [stress|E] i zwiększą swoją [opinion|E] gospodarza. Mogą również wystąpić różne inne konsekwencje wynikające z zebrania tylu osób razem.\n\n [ruler|E] zaprosi swoich [liege|E] i ich [vassals|E] (wraz z różnymi [courtiers|E]) na $activity_feast$."
 game_concept_fervor: "Przekonanie"
 game_concept_fervor_desc: "The $game_concept_fervor$ of an [faith|E] ranges from #V 0#! to #V 100%#!. It measures how fired up its activists and voters are: turnout, volunteers and noise.\n\nHigh $game_concept_fervor$ makes constituencies of the Ideology care more about their MP's politics."
 game_concept_feudal_desc: "W [government_form|E] feudalnym [liege|E] przekazuje [vassals|E] [land|E] rządzenia w zamian za [levies|E] i [taxes|E], regulowane przez indywidualne [vassal_contract|E] między posłami a liderem partii."
 game_concept_flowery_war_desc: "This is a special type of [war|E], started by a [ruler|E] whose [faith|E] practices human sacrifice. The primary goal of $game_concept_flowery_warring$ is to do battle and capture [prisoners|E] for sacrifice, with either side able to get enough [war_score|E] through combat to win without ever having to [siege|E].\n\nAt the end of the $game_concept_war$, if the victor (including the defender) follows a $game_concept_faith$ practicing human sacrifice, then they will take several $game_concept_prisoners$ from the [court|E] of the loser. If both main combatants in a $game_concept_flowery_war$ follow the same ideology, then the war is considered sacred, meaning that the loser still receives (reduced) [piety|E] even in defeat.\n\nYou cannot conduct or continue a $game_concept_flowery_war$ if you have any $game_concept_prisoners$ obtained through winning a $game_concept_flowery_war$ in your [dungeon|E]."
 game_concept_foreign_affairs_desc: "[councillor_task|E] wykonywana przez [chancellor|E].\nDla [independent|E] [ruler|E] zwiększa opinię, jaką inni niezależni władcy mają o nim. Dla posła szeregowego zwiększa opinię, jaką inni szeregowi posłowie tej samej [liege|E] mają o nim."
 game_concept_fp3_demand_submission_interaction_desc: "Wymagaj lojalności [character_possessive|E] w formie [hook|E], używając kapitału politycznego, przebiegłości lub zastraszania."
 game_concept_gender_doctrines: "Stanowiska w sprawie polityki dotyczącej płci"
 game_concept_gender_doctrines_desc: "These [doctrines|E] determine which [gender_laws|E] are available to characters of the [faith|E].\n\nIt also determines certain additional rules, such as what [claims|E] can be inherited, who can be [commanders|E] and [knights|E], and to which of their parents' [house|E] a [bastard|E] will belong.\n\nThe Gender Policy Positions are:\n$BULLET_WITH_TAB$Male Dominated\n$BULLET_WITH_TAB$Equal\n$BULLET_WITH_TAB$Female Dominated"
 game_concept_gift_desc: "Sending a Gift to another character will increase their [opinion|E] of you in exchange for [gold|E][gold_i].\n\nThe greedier the recipient, the more Funds you will have to send, and the more Opinion you will get.\n\nThe higher your [diplomacy|E], the more Opinion you will get."
 game_concept_glory_desc: "An [accolade_possessive|E] Chwała wzrasta dzięki [accolade_rank|E].\n\nChwałę zdobywa się poprzez [acclaimed_knight|E] wygrywanie [battles|E], pokonywanie wojowników, uczestnictwo w [GetActivityType( 'activity_tournament' ).GetName] [contests|E] oraz udział w [activities|E].\n\nJednakże chwała Odznaczenia maleje, gdy Główny Organizator uczestniczy w przegranych bitwach, i może także zmniejszyć się przy [accolade_succession|E], jeśli Główny Organizator nie zginął w bitwie, pojedynku ani w inny honorowy sposób."
 game_concept_gold: "Fundusze"
 game_concept_gold_desc: "Fundusze to pieniądze polityka: darowizny, subskrypcje członkowskie i fundusze kampanijne. Finansują personel, biura, ulotki i kampanie."
 game_concept_goliardic_shenanigans_desc: "Postać w [GetActivityType('activity_adult_education').GetName] może wdawać się we wszelkiego rodzaju psoty, gdy przyjmuje życie studenta. Konsekwencje ich przygód są nieprzewidywalne i obejmują punkty [skill|E], styl życia i presję [traits|E], doświadczenie w stylu życia, choroby i rany."
 game_concept_government_authority_desc: "$game_concept_government_authority$ represents the general power that a [ruler|E] wields over their [vassals|E].\n\nDifferent [governments|E] have different form of $game_concept_government_authority$. For example, [feudal|E] [realms|E] use [crown_authority|E], [clans|E] use [tribal_authority|E], and [administrative|E] use [imperial_bureaucracy|E]. Increasing $game_concept_government_authority$ costs an amount of [prestige|E] depending on the level and the ruler's [learning_skill|E].\n\n#weak Backbenchers dislike higher levels of $game_concept_government_authority$, and lowering it is the primary goal of [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!\n\nNot all [governments|E] have $game_concept_government_authority$."
 game_concept_governor_desc: "$game_concept_governor$ to główny członek zaplecza [liege|E] z [government_bureaucratic_gov|E]. Są mianowani przez swojego lidera partii do zarządzania terenami w ramach [realm|E], wykorzystując swoje [governor_efficiency|E].\n\n $game_concept_governor$'s [title|E], jak również [counties|E], które obejmuje, nazywa się [province|E]. [governance_issues|E] mogą pojawić się wewnątrz prowincji, co $game_concept_governor$ musi rozwiązać.\n\n$game_concept_governors$ może gromadzić [influence|E] i manipulować [succession|E] innych $game_concept_governorships$."
 game_concept_great_holy_war_desc: "A $game_concept_great_holy_war$ jest specjalnym rodzajem [war|E], który może zadeklarować tylko [head_of_faith|E] określonych [faiths|E], w celu podporządkowania całego [kingdom|E] pod rządy ich Ideologii.\n\n$game_concept_great_holy_wars$ celuje we wszystkie [rulers|E] innego [religion|E] w wybranym [kingdom|E], zmuszając je do wspólnej obrony. Jeśli zwyciężą, wszystkie [titles|E] w docelowym Państwie zostaną przejęte i podzielone między atakujących.\n\n W zależności od jego [doctrines|E], Ideologia może mieć dostęp do [directed_great_holy_wars|E], [undirected_great_holy_wars|E] lub wcale nie mieć $game_concept_great_holy_wars$:\n$EFFECT_LIST_BULLET$ [GetTenetType('tenet_armed_pilgrimages').GetBaseName], [GetTenetType('tenet_struggle_submission').GetBaseName] lub [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E] są wymagane do dostępu do Wielkich Wojen Świętych w ogóle\n$EFFECT_LIST_BULLET$ Ideologie z [GetDoctrineType('doctrine_temporal_head').GetBaseName] Głową mają dostęp jedynie do Ukierunkowanych Wielkich Wojen Świętych\n$EFFECT_LIST_BULLET$ Ideologie z [GetDoctrineType('doctrine_spiritual_head').GetBaseName] Głową mają dostęp jedynie do Nieukierunkowanych Wielkich Wojen Świętych\n$EFFECT_LIST_BULLET$ Ideologie bez Lidera Ruchu nie mogą zadeklarować żadnych Wielkich Wojen Świętych, nawet jeśli normalnie byłyby uprawnione\n\n Niektóre Ideologie mają specjalne nazwy dla swoich Wielkich Wojen Świętych, takie jak 'Krucjata' lub 'Dżihad'. Te Wielkie Wojny Święte różnią się tylko nazwą i funkcjonują jak każda inna Wielka Wojna Święta."
 game_concept_great_project_desc: "Great Projects are massive undertakings that call on all the resources of the [realm|E].\n\nSome Great Projects involve constructing a [great_building|E], while others involve recovering from a [natural_disaster|E].\n\nWhile the Party's [ruler|E] oversees the development of the Great Project, [subjects|E] can offer [great_project_contributions|E] to assist its progress."
 game_concept_head_of_faith: "Lider Ruchu"
 game_concept_head_of_faith_desc: "$game_concept_head_of_faith$ to formalny przywódca [faith|E]. Uprawnienia i charakter $game_concept_head_of_faith$ zależą od [doctrines|E] ideologii.\n\n Niektóre ideologie mają [spiritual_head_of_faith|E] #weak (np. papież)#!, inne [temporal_head_of_faith|E] #weak (np. kalif)#!, a niektóre nie mają wcale $game_concept_head_of_faith$."
 game_concept_head_of_faith_possessive: "Liderzy Ruchu"
 game_concept_head_of_rite: "Wiodący Głos"
 game_concept_head_of_rite_desc: "Wiodący [character|E] z [rite|E]: polityk, który prowadzi większość jego [counties|E]."
 game_concept_heads_of_faith: "Liderzy Ruchu"
 game_concept_herder_desc: "Pasterze są wyłączeni ze wszystkich aspektów rządzenia. Nie dowodzą [armies|E], nie posiadają [buildings|E], nie tworzą [alliances|E] ani nie ogłaszają [wars|E]. Kiedy [nomads|E] [migrate|E] [holding|E], pasterze powoli uzupełniają lokalne [county_fertility|E] dzięki swojej mniejszej trzodzie.\n\n Są zastraszani przez odpowiednie [nomad|E] [rulers|E] i natychmiast poddają swoją ziemię, gdy zostaną wyzwani."
 game_concept_heresies: "Grupy odłamowe"
 game_concept_heresy: "Rozłamy"
 game_concept_heresy_desc: "Gdy [fervor|E] [faith|E] spada krytycznie nisko, może wybuchnąć epidemia Rozszczepienia. Epidemie występują w trzech coraz poważniejszych formach:\n#indent_newline:7 $BULLET_WITH_TAB$Istniejący [rite|E] staje się bardziej [rite_divergent|E] i rozprzestrzenia się dalej.#!\n#indent_newline:7 $BULLET_WITH_TAB$Pojawia się znacznie [rite_divergent|E] nowy [rite|E] i ogarnia całe krainy.#!\n#indent_newline:7 $BULLET_WITH_TAB$Dla chrześcijańskich [faiths|E] pojawia się historyczne rozszczepienie, takie jak bogomilizm lub katarzyzm.#!\n\n [faith|E] jest w prawdziwym niebezpieczeństwie Rozszczepienia tylko wtedy, gdy jego [mainline_rite|E] wynosi co najmniej #V 100#! [counties|E]. Poniżej tego, dwie poważniejsze formy nie mogą w ogóle wystąpić, a nawet najłagodniejsza jest znacznie rzadsza.\n\nKażda epidemia kończy się jednoczącym wybuchem $game_concept_fervor$."
 game_concept_heretical: "Breakaway"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ jest na drugim najwyższym poziomie. [vassals|E] mają karę #N -20#! [opinion|E] wobec ich [liege|E].\n\n Na tym poziomie — oprócz uprawnień, które lider partii otrzymuje na [limited_crown_authority|E] — posłowie z tylnego ławka pod tym samym liderem partii nie mogą już prowadzić wojny między sobą, władca może zmieniać się między wszystkimi dostępnymi [succession_laws|E], a [titles|E] posłów z tylnego ławka nie mogą być dziedziczone przez władców spoza [realm|E] lidera partii.\n\n Na koniec, odmowa tytułu [revocation|E] lub posła z tylnego ławka [retraction|E] jest uważana za [crime|E] nawet jeśli lider partii nie ma wystarczających podstaw."
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ jest średnim poziomem [nomadic_authority|E]. Na tym poziomie [migration|E] mogą celować w [de_jure|E] [kingdom|E] [titles|E] w obrębie [the_great_steppe|E], a lider partii może [retract|E] zaplecze [vassal|E]."
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ jest drugim najwyższym poziomem [tribal_authority|E]. [vassals|E] mają karę #N -20#! [opinion|E] wobec ich [liege|E].\n\n Na tym poziomie, oprócz możliwości [imprison|E] [characters|E], lider partii może [revoke|E] [titles|E] i [retract|E] posła z tylnego ławka."
 game_concept_hold_court_desc: "[activity|E], gdzie [vassals|E] i [courtiers|E] w [realm|E] zbierają się w [royal_court|E], aby prosić swoich [liege|E] i wyrazić swoje skargi.\n\n Sytuacje, w których przywódca partii zostanie wezwany do wydania wyroku, mogą obejmować drobne spory i nieporozumienia oraz katastrofy na skalę całego królestwa. Większość problemów będzie miała rozwiązanie korzystne – jeśli nie dla zaangażowanych stron, to przynajmniej dla przywódcy partii."
 game_concept_holder_desc: "$game_concept_holder$ [title|E] to postać, która posiada tytuł. Tytuły [barony|E] i [county|E] zawsze będą miały $game_concept_holders$ po ustatkowaniu się, podczas gdy tytuły [duchy|E], [kingdom|E] i [empire|E] mogą jeszcze nie zostać utworzone. Jako dodatkowe zastrzeżenie, $game_concept_holder$ wysokopoziomowego Tytułu może faktycznie nie kontrolować żadnego terytorium w obszarze [de_jure|E] tego Tytułu.\n\nPosiadanie tytułów wyższej rangi pozwala mieć [vassals|E] wyższej rangi. Na przykład, Książęta mogą mieć Hrabiów jako Backbencherów, a Królowie mogą mieć Książąt."
 game_concept_holding_court: "Przeprowadzanie konsultacji"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$ to [artifact|E], który ma znaczenie religijne dla [faith|E]. $game_concept_holy_relic$ może być [enshrined|E] w [holy_site|E] tej ideologii, aby uzyskać korzyści.\n\nNiektóre artefakty są z natury święte dla danej ideologii, ale artefakty mogą również być [sanctified|E], aby stały się świętym reliktem."
 game_concept_holy_site: "Heartland"
 game_concept_holy_site_desc: "$game_concept_holy_site$ to [county|E], który zawiera miejsce religijnego znaczenia dla [faith|E]. $game_concept_holy_sites$ posiadane przez Postać o właściwej Ideologii zapewni efekt wszystkim tej Ideologii, a także może umożliwić tworzenie [special_buildings|E] albo [holy_orders|E]. Każda Ideologia ma inny zestaw $game_concept_holy_sites$.\n\n Zwykły $game_concept_holy_site$ nie daje globalnych korzyści ideologicznych, tylko lokalne. Najbardziej czczone miejsca Ideologii są zamiast tego oznaczone jako [eminent_holy_sites|E]. Ideologia może mieć tylko ograniczoną liczbę każdego."
 game_concept_holy_sites: "Heartlands"
 game_concept_holy_war_desc: "A $game_concept_holy_war$ jest specjalnym rodzajem [war|E] prowadzoną przez [ruler|E] jednego [faith|E] przeciwko Władcy innej Ideologii.\n\n$game_concept_holy_war$ zwykle są dość niszczycielskie, a zwycięzca Wojny Świętej zazwyczaj przejmuje dla siebie wszystkie [counties|E] w docelowym obszarze. Jednakże, jeśli Ideologia atakującego jest [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName] lub obrońca ma [vassals|E] ideologii atakującego w docelowym obszarze, niektórzy lub wszyscy Władcy Tylnych Ław w docelowym obszarze mogą zostać po prostu przekazani atakującemu.\n\n W przeciwieństwie do innych wojen, Władcy tej samej Ideologii co cel mogą wybrać udział w jego obronie bez potrzeby [alliance|E].\n\n Wojny Święte mogą być dozwolone lub ograniczone w zależności od różnych [religious_families|E]"
 game_concept_home_court: "Ministerstwo Spraw Wewnętrznych"
 game_concept_home_courts: "Ministerstwa Spraw Wewnętrznych"
 game_concept_home_courts_possessive: "Ministerstwo Spraw Wewnętrznych"
 game_concept_hungarian_invasion_casus_belli_desc: "Potężny [casus_belli|E], który można użyć tylko raz na całą kampanię, aby zdobyć wszystkie terytoria zajmowane przez cel w Panonii.\n\n W przypadku zwycięstwa, wszystkie $mogyer_collective_noun$ w [realm|E] atakującego przeniosą się z nimi do Panonii, [counties|E] #EMP i #! [vassals|E], wypierając $avar$ $game_concept_counties$. Inni posłowie spoza Panonii zostają porzuceni, podczas gdy $game_concept_counties$ wcześniej zajmowane lub posiadane przez $mogyer_collective_noun$ pozostają lokalnym drobnym watażkom i rywalizującym plemionom stepowym."
 game_concept_hybrid_culture_desc_DLC: "$game_concept_hybrid_culture$ to [culture|E], który został stworzony przez [ruler|E] jako połączenie dwóch istniejących Kultur.\n\n $game_concept_hybrid_culture$ jest mieszanką [traditions|E], [culture_pillars|E] i Estetyki dwóch oryginalnych Kultur.\n\n Tylko Kultury o różnym [heritage|E] mogą tworzyć Hybrydę, a koszt [prestige|E] zależy od ich [cultural_acceptance|E] względem siebie.\n\n Im wyższa Akceptacja Kulturowa, tym więcej [counties|E] zostanie przekształcone, gdy powstaje Hybryda. Władcy kultury Hybrydowej [promote_culture|E] znacznie szybciej w Okręgach jej kultur rodzicielskich dla #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! lat po jej powstaniu.\n\n Nowe Kultury mogą również pojawić się jako [divergent_culture|E]."
 game_concept_iberian_reclamation_desc: "Jest to specjalny typ [war|E] dostępny dla [struggle_involved|E] [rulers|E] z [iberian_struggle|E].\n\nAtakujący dąży do zdobycia [duchy|E], który zawiera jakiekolwiek [struggle_involved|E] [counties|E] będące własnością [struggle_interloper|E] lub [struggle_uninvolved|E] [ruler|E], lub [vassalize|E] ich, jeśli nie posiadają ziemi poza tym Regionem."
 game_concept_initial_legitimacy: "Pierwotny mandat"
 game_concept_intrigue: "Propaganda"
 game_concept_intrigue_lifestyle: "Spin Styl życia"
 game_concept_intrigue_skill: "Spin Umiejętność"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ jest [skill|E] dla pracy z mediami i czytania ludzi: briefing, przeciek, artykuł umieszczony w przyjaznej gazecie, plotka utrzymana w tajemnicy.\n\nJest głównie używane do rozwijania i obrony przed Spin [schemes|E].\n\nOdpowiednikiem [lifestyle|E] jest [intrigue_lifestyle|E]."
 game_concept_intrigue_task_contract: "Umowa dotycząca propagandy"
 game_concept_intrigue_task_contract_possessive: "Umowy dotyczące propagandy"
 game_concept_intrigue_task_contracts: "Umowy dotyczące propagandy (liczba mnoga)"
 game_concept_intrigue_task_contracts_possessive: "Umów dotyczących propagandy"
 game_concept_kingdom: "Naród"
 game_concept_kingdoms: "Narody"
 game_concept_knight: "Organizator"
 game_concept_knight_army_modifier: "Modyfikator Armii Organizatora"
 game_concept_knight_army_modifier_desc: "Efekt zastosowany do dowolnego [army|e], który #high zawiera#! odpowiedni [acclaimed_knight|e].\n\n [knight|e] nie potrzebuje #high nie#! być [commander|e] swojej armii, aby zastosować Modyfikator Armii Organizatora."
 game_concept_knight_army_modifiers: "Modyfikatory Armii Organizatora"
 game_concept_knight_desc: "$game_concept_knight$ to [vassal|E], [courtier|E] lub [follower|E], który walczy bezpośrednio w twojej [army|E].\n\n Podczas [battles|E], $game_concept_knights$ używają swojej [prowess_skill|E], aby skuteczniej walczyć. Wysoka $game_concept_prowess$ oznacza, że będą mogli zadawać więcej obrażeń wrogowi i są bardziej prawdopodobne, że przeżyją lub nawet wyjdą z $game_concept_battle$ bez szwanku.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Organizatorzy mogą być znani pod różnymi nazwami w zależności od [culture] lub [faith]. Na przykład $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ lub $knight_baghatur_no_tooltip_plural$.\n\n Organizatorzy reprezentują zarówno postać, jak i jej orszak wojskowy.#!"
 game_concept_knight_desc_ACCOLADE_DLC: "Organizatorzy, którym przydzielono [accolade|E] zostają [acclaimed_knights|E]. \n\n"
 game_concept_knight_effectiveness: "Skuteczność Organizatora"
 game_concept_knight_effectiveness_desc: "Skuteczność Organizatora [ruler|E] określa, jak dobrze walczą ich [knights|E] w [battle|E].\n\nPrzy 100% Organizatorzy walczą normalnie, ale przy 200% walczą tak, jakby ich [prowess|E] zostało podwojone."
 game_concept_knights: "Organizatorzy"
 game_concept_knights_possessive: "Organizatora"
 game_concept_kurultai_desc: "The Kurultai replaces the [council|E] for the [nomadic_government|E]. The Kurultai members are among the elite of the party, and should either be appeased or forced into [obedience|E] to assure a smooth [succession|E].\n\nAfter the event of a chaotic succession, they may steal some [herd|E], abandon their new [liege|E], they will gain a [claim|E] on the [realm|E] [title|E]."
 game_concept_law_desc: "[realm_possessive|E] Prawa określają, jak struktura tej partii jest zorganizowana.\n\nNajbardziej podstawowym z nich jest [government_authority|E] partii, ponieważ te prawa określają, jak [lieges|E] i [vassals|E] regularnie wchodzą ze sobą w interakcje.\n\nChoć mają mniejszy wpływ na codzienne życie [rulers|E] w partii, [succession_laws|E] i [title_laws|E] nadal są bardzo ważne do rozważenia dla [succession|E]."
 game_concept_learning: "Polityka"
 game_concept_learning_lifestyle: "Styl życia polityki"
 game_concept_learning_skill: "Umiejętność polityczna"
 game_concept_learning_skill_desc: "$game_concept_learning$ jest [skill|E] dla pomysłów i szczegółów: przeczytane briefy, sporządzone rachunki, przetrwałe wybrane komisje. Przynosi również [piety|E] co miesiąc.\n\nOdpowiednikiem [lifestyle|E] jest [learning_lifestyle|E]."
 game_concept_learning_task_contract: "Umowa polityczna"
 game_concept_learning_task_contract_possessive: "Umowy politycznej"
 game_concept_learning_task_contracts: "Umowy polityczne"
 game_concept_learning_task_contracts_possessive: "Umów politycznych"
 game_concept_leasing_desc: "Pomniejsze [baronies|E] mogą być dzierżawione [holy_orders|E], [monastic_holy_orders|E] lub [clergy|E]. Wynajmowane okręgi zapewniają [taxes|E] i [levies|E] dla [lessee|E] zamiast [holder|E].\n\nZamówienia wojskowe mogą dzierżawić [castle_holdings|E] i [city_holdings|E], podczas gdy zakony monastyczne i urzędnicy partyjni mogą dzierżawić [temple_holdings|E]. Dzierżawa może mieć [lease_contract|E].\n\nWynajmowane [holdings|E] nadal są uważane za część [realm|E] posiadacza. [county_capitals|E] nie mogą być dzierżawione."
 game_concept_legitimacy: "Mandat"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ jest prawo lidera do rządzenia w oczach partii i kraju: wygrane wybory, zwycięstwo w konkursie na lidera, zaufanie Izby. [ruler|E] bez niego żyje na pożyczonym czasie. [vassals|E] także generować [legitimacy_expectations|E], które [liege|E] ma spełnić. \n\nyn [rulers|E] mają $game_concept_legitimacy$, które są obliczane w momencie objęcia władzy i skutkują ich [initial_legitimacy|E]. Część $game_concept_legitimacy$ poprzedniego władcy również dziedziczy ich [heir|E]. \n\n$game_concept_legitimacy$ wpływa na wiele systemów gier, sprawiając, że [marriage|E] propozycje, [vassalization|E] i [alliances|E] są bardziej prawdopodobne do przyjęcia, [claims|E] tańsze, a także przesuwa [scales_of_power|E] w [regency|E]. \n\n$game_concept_legitimacy$ zazwyczaj ma 5 [legitimacy_levels|E] i jeden #weak dolnym poziomie Illegitimate#!. [AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "Oczekiwania dotyczące mandatu"
 game_concept_legitimacy_gain: "Zysk mandatu"
 game_concept_legitimacy_level: "Poziom mandatu"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] władcy zyskują #V 50%#! więcej Mandatu z wygranych wojen, ale również tracą podwójnie przy przegranej. Otrzymają również Mandat z [single_combat_duel_plural|E] i poślubienia szlachcica [courtiers|E] kogoś o równym lub wyższym [dominance|E]."
 game_concept_legitimacy_levels: "Poziomy mandatu"
 game_concept_levies: "Wolontariusze"
 game_concept_levy: "Wolontariusz"
 game_concept_liege: "Lider partii"
 game_concept_liege_desc: "$game_concept_liege$ jest politykiem z co najmniej jednym [vassal|E] odpowiadającym przed nimi. Liderzy partii sami odpowiadają przed Premierem."
 game_concept_liege_possessive: "Lider partii's"
 game_concept_liege_taxes: "Lider partii pobiera podatki"
 game_concept_liege_taxes_desc: "Twoje $game_concept_liege_taxes$ to [taxes|E], które musisz zapłacić swojemu [liege|E] w ramach swojego [obligations|E]. Nie płacisz żadnych $game_concept_liege_taxes$, jeśli jesteś [independent|E].\n\nZ punktu widzenia Twojego Lidera Partii, te same podatki nazywane są [vassal_taxes|E], aby odróżnić je od wszelkich podatków, które mogą być należne ich własnemu $game_concept_liege$."
 game_concept_lieges: "Liderzy partii"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' to drugi najniższy poziom [crown_authority|E]. [vassals|E] mają karę #N -10#! [opinion|E] wobec swojej [liege|E], a lider partii może [revoke|E] [titles|E] i [retract|E] zaplecza posła tylnej ławki. [ruler|E] może zmieniać się między dostępnymi Partition [succession_laws|E]."
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ jest drugim najniższym poziomem [nomadic_authority|E]. [migration|E] mogą celować [de_jure|E] [duchy|E] [titles|E] w ramach [the_great_steppe|E], [titles|E] może zostać cofnięty, a lider partii może teraz [imprison|E] [characters|E] w swoim [realm|E].\n\n Może używać #V $step_away_from_the_steppe_decision$#! [decision|E]"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ jest drugim najniższym poziomem [tribal_authority|E]. [vassals|E] mają karę #N -10#! [opinion|E] wobec ich [liege|E], a lider partii może teraz [imprison|E] [characters|E] w swoim [realm|E]."
 game_concept_long_reign_desc: "'Długie panowanie' to rosnąca [opinion|E] premia, którą wszyscy bohaterowie w [realm|E] otrzymują przy [liege|E], który panował nad nimi przez długi czas.\n\n Podobnie, poddani mają malejącą [short_reign|E] karę Opinii wobec nowych przywódców partii."
 game_concept_mainline_rite: "Ideologia"
 game_concept_mainline_rites: "Ideologie"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ jest [councillor_task|E] wykonywane przez [marshal|E].\n\nZwiększa [knight_effectiveness|E] i obniża [hostile_scheme|E] [success_chance|E] wobec [liege|E] ministra."
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ to trzy Dekrety narzucone przez [mandala|E] [ruler|E] — oznaczone przez [prosperity_decree|E], [expansion_decree|E] i [reverence_decree|E].\n\nOgólnie partia Mandala ma bardzo scentralizowaną władzę, gdzie władzę nad [subjects|E] i [laws|E] sprawuje powiązany Władca, który może je zmieniać według potrzeb, przy minimalnym lub żadnym sprzeciwie jego mieszkańców."
 game_concept_mandala_desc: "Pod $game_concept_mandala$ [government_form|E] [domain_limit|E] i liczba [direct_vassals|E] są ograniczone. Zamiast tego [liege|E] i [suzerain|E] polegają na [tributaries|E] w celu rozbudowy swojej drużyny. \n\nA Mandala [ruler|E] może aspirować do bycia postrzeganym jako Król Bóg lub Devaraja, a potem polegać na [mandala_radiance|E], by zdobywać i utrzymywać $game_concept_tributaries$. \n\nA $game_concept_ruler$ muszą utrzymywać [opinion|E] i rozwijać relacje ze swoimi $game_concept_tributaries$, aby utrzymać je na dłuższą metę. Po sukcesji $game_concept_tributaries$ mogą się rozproszyć, chyba że $game_concept_ruler$ jest godnym [mandala_succesor|E]."
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ jest specjalnym rodzajem [legitimacy|E] dostępnym wyłącznie dla [son_of_heaven|E]. Reprezentuje prawo monarchy do rządzenia oraz to, kto jest uznawany za najwyższego władcę pod niebem.\n\nMandat jest ściśle powiązany z [dynastic_cycle|E]. Cykl wpływa na to, jak panujący monarcha zyskuje Mandat i może również zmieniać [situation_dynastic_cycle_phase|E] w zależności od poziomu Mandatu monarchy."
 game_concept_marshal: "Sekretarz Spraw Wewnętrznych"
 game_concept_marshal_desc: "$game_concept_marshal$ jest [councillor|E] odpowiedzialnym za bezpieczeństwo: policję, granice i utrzymanie porządku."
 game_concept_marshals: "Sekretarze Spraw Wewnętrznych"
 game_concept_martial: "Bezpieczeństwo"
 game_concept_martial_lifestyle: "Styl życia związany z bezpieczeństwem"
 game_concept_martial_skill: "Umiejętności w zakresie bezpieczeństwa"
 game_concept_martial_skill_desc: "$game_concept_martial$ jest [skill|E] dla prawa i porządku, obrony i zarządzania kryzysowego: utrzymanie bezpieczeństwa ulic i kraju.\n\nOdpowiednikiem [lifestyle|E] jest [martial_lifestyle|E]."
 game_concept_master_assassin_desc: "$game_concept_master_assassin$ to [court_position|E] umożliwiony przez [faiths|E] z [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]. $game_concept_master_assassin$ jest niebezpiecznym fanatykiem, który współpracuje z mniejszymi zabójcami, aby zlikwidować postrzeganych wrogów ideologii."
 game_concept_maximum_piety_level: "Maksymalny Poziom Kapitału Politycznego"
 game_concept_men_at_arms: "Aktywiści"
 game_concept_men_at_arms_counter: "Kontr-aktywiści"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$ są profesjonalnymi [soldiers|E] przewyższającymi [levies|E].\n\nGracz ma bezpośrednią kontrolę nad składem i liczebnością swoich Aktywistów [regiments|E].\n\nRóżne typy Aktywistów są dobre lub złe w różnych typach [terrain|E]. Każdy typ również [counters|E] inny typ.\n\nAktywiści mogą być [stationed|E] w [holdings|E], aby zwiększyć ich skuteczność."
 game_concept_mental_break_desc: "When [stress|e] overwhelms a character they will experience a Mental Break — a personal crisis in which they feel that they must do something to lower their Pressure, no matter the cost.\n\nCharacters suffering from a Mental Break will have several ways that they can deal with the situation, though many of them will have negative consequences.\n\nAt low [stress_levels|E] these consequences are minor and easily managed. As Pressure Level increases however, so do these consequences, eventually leading to insanity and even death."
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$ jest najwyższym rangą [minister|E] i odpowiada za sprawy dyplomatyczne. Zazwyczaj jest mu przydzielany [grand_secretariat_director|E]. \n\nTa sekretarz spraw zagranicznych może być wyznaczonym [grand_secretariat_director|E], w zależności od #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]. \n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$ jest najwyższym rangą dowódcą w [realm|E] i dowodzi [army|E] [title_men_at_arms|E]. \n\nToma Minister Spraw Wewnętrznych może być wyznaczony [grand_secretariat_director|E], w zależności od #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]. \n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ is a unique set of [vassal_obligations|E] only available for [ministers|E].\n\nAll civil ministers have a specific option set as their default, while the [minister_grand_marshal|E] has a unique option that provides the Home Secretary with [title_men_at_arms|E].\n\nThese obligations cannot be changed."
 game_concept_natural_prowess: "Naturalna wytrzymałość"
 game_concept_noble_family_desc: "$game_concept_noble_families$ są potężnymi [houses|E] w [government_bureaucratic_type|E] [realm|E]. Posiadają [estate|E], kontrolowane i zarządzane przez [house_head|E], i pozostają integralną częścią partii przez cały czas, gdy starają się zgromadzić [influence|E] i zdobyć [provinces|E] dla siebie.\n\nWpływowy $game_concept_noble_family$ może stać się [powerful_family|E] lub [dominant_family|E]."
 game_concept_obedience_desc: "W [GetGovernment( 'nomad_government' ).GetName] [realms|E], posłuszeństwo określa lojalność [character|E] wobec ich [liege|E], [suzerain|E] lub właściciela ich [court|E]. Postacie mogą być posłuszne tylko jednemu [ruler|E] naraz. \n\n Postacie posłuszne rzadziej uczestniczą w [hostile_schemes|E], dołączają do [wars|E] lub do [factions|E] przeciwko przywódcy swojej partii. Zawsze będą wspierać preferencje swojego przywódcy podczas [succession|E] i nie będą naciskać na niego swoim [claims|E]. Nieposłuszne [tributaries|E] mogą próbować się uwolnić. \n\n Gdy wynik postaci przekroczy [obedience_threshold|E], staje się ona posłuszna."
 game_concept_offer_vassalization_desc: "Interakcja oferująca [vassalage|E] dla [independent|E] [ruler|E] niższego [title_rank|E], pokojowo dodając je do partii."
 game_concept_organize_levies_desc: "[councillor_task|E] wykonywana przez [marshal|E]. Zwiększa [garrison|E] Rozmiar i [levy|E] Wskaźnik Wzmocnień w [realm|E] ministra [liege|E]."
 game_concept_organized_desc: "Zorganizowany [faith|E] posiada hierarchię religijną. Kult i praktyki są bardziej zorganizowane, a pisma uformalizowane.\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] Ideologie [GetReligionFamily('rf_pagan').GetName] mogą stać się Zorganizowane poprzez reformę, podczas gdy inne Ideologie są zawsze uważane za Zorganizowane."
 game_concept_pam_challenge_hof_cb: "Przywódca Ruchu Wyzwól"
 game_concept_papal_recipient_desc: "Jeśli główny cel [great_holy_war|E] jest już posiadany lub zajęty przez członka ideologii agresora, zostanie uznany za prawowitego odbiorcę tytułu, o który toczy się walka, chyba że główny [Concept( 'war_contribution', 'Contributor' )|E] zdecyduje się nadać pierwszeństwo swojemu [beneficiary|E]."
 game_concept_peasant_faction_desc: "$game_concept_peasant_faction$ jest zasiedlany przez [counties|E] o niskim [county_opinion|E]. W przeciwieństwie do innych [factions|E], ten zawsze się buntuje, nawet jeśli [faction_military_power|E] jest niski, ponieważ chłopi są zazwyczaj zarówno optymistyczni, jak i niepiśmienni... Udane ruchy protestacyjne znacząco obniżą Kontrolę w twoim [realm|E]."
 game_concept_peasant_factions: "Ruchy protestacyjne"
 game_concept_perk_desc: "Perki to odblokowywane błogosławieństwa, które zapewniają wiele użytecznych i interesujących efektów. Odblokowuje się je, wybierając [focus|E] w obrębie [lifestyle|E] i wydając odpowiednią formę [experience|E] #weak (np. Spin $game_concept_experience$, jeśli chcesz odblokować $game_concept_intrigue_lifestyle$ $game_concept_perk$). #!"
 game_concept_personal_tenet: "Sprawa osobista"
 game_concept_personal_tenets: "Sprawy osobiste"
 game_concept_petition_antipope_gold_interaction: "Petycja do Antypapieża o środki finansowe"
 game_concept_piety: "Kapitał polityczny"
 game_concept_piety_desc: "$game_concept_piety$ is a politician's credit with their party and the establishment: loyalty shown, favours done, the right causes backed.\n\nIt is spent on asking things of the party and the establishment, depending on the [government_form|E].\n\nEach time a Character gains Political Capital, they also progress towards the next [piety_level|E]."
 game_concept_piety_experience: "Wierność"
 game_concept_piety_experience_desc: "Każdy punkt Lojalności zdobyty przez postać zwiększa jej postęp w kierunku następnego [piety_level|E]. Gdy postać zdobywa [piety|E], zyskuje również równą ilość Lojalności."
 game_concept_piety_level: "Poziom kapitału politycznego"
 game_concept_piety_level_desc: "$game_concept_piety_level$ postaci jest miarą tego, ile kredytu zgromadziła ona w swojej partii i instytucji oraz jej pozycji w oczach innych [faith|E].\n\nZa każdym razem, gdy postać zdobywa [piety|E], posuwa się również w kierunku następnego Poziomu Kapitału Politycznego.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nPoziomy są następujące:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "Wpływ poziomu kapitału politycznego"
 game_concept_piety_level_impact_desc: "Wpływ poziomu kapitału politycznego zwiększa lub zmniejsza [modifiers|E] zdobywane z twojego obecnego [piety_level|E]."
 game_concept_piety_levels: "Poziom(y) kapitału politycznego"
 game_concept_playdate_desc: "[activity|E], gdzie władcy i personel poniżej wieku [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] zbierają się, aby się bawić i zapomnieć o codziennej monotonii.\n\n Uczestnicy stracą [stress|E] i zwiększą swoją [opinion|E] gospodarza. Mogą również wystąpić różne inne konsekwencje wynikające z zebrania tylu dzieci razem.\n\n [ruler|E] zaprosi swoich [liege|E] i ich [vassals|E] (wraz z różnymi [courtiers|E]) na $activity_playdate$."
 game_concept_player_heir_desc: "The $game_concept_player_heir$ is the [heir|E] that a player will keep playing as on [succession|E].\n\nThe $game_concept_player_heir$ is usually the same as the [primary_heir|E], but if the [succession_law|E] of your [primary_title|E] dictates that it should go to a character outside of your [dynasty|E], you will instead keep playing as the dynastic heir to your second highest-tier title (or third, fourth, etc.).\n\nThis situation is common when your $game_concept_player_heir$ is voted out under an Elective Succession Law. If you are [house_head|E] of a [noble_family|E] in an [administrative|E] [realm|E] you may lose your Party to Primary Heirs outside of your [house|E] but retain your Noble Family Title.\n\nIf you are [ecclesiastical|e], your $game_concept_player_heir$ is the character who is set to inherit your [primary_title|e], usually an [archdiocese|e]."
 game_concept_popular_faction_desc: "$game_concept_popular_faction$ jest zasiedlany przez [counties|E] o niskim [county_opinion|E], którzy dzielą wspólny element, taki jak [culture|E] lub [faith|E]. Starają się uwolnić i wybierają nowy [ruler|E] na podstawie swojej Kultury lub Ideologii. Ten typ powstania jest zazwyczaj bardzo niebezpieczny."
 game_concept_popular_factions: "Ruchy Populistyczne"
 game_concept_powerful_family_desc: "$game_concept_powerful_family$ reprezentuje jednego z najbardziej wpływowych [houses|E] i [noble_families|E] w [government_bureaucratic_type|E] [realm|E].\n\nCzłonek $game_concept_powerful_family$ jest lepszy w [political_schemes|E] i ma większe prawdopodobieństwo uzyskania tego, czego chce podczas [interacting|E] z innymi [characters|E].\n\nW danym momencie może istnieć tylko ograniczona liczba $game_concept_powerful_families$, a potężnymi są uważani najlepsi oceniani $game_concept_noble_families$ na podstawie ich [powerful_family_rating_short|E]. Izba [top_liege|E] jest wyjątkiem, która jest zawsze uważana za Potężną.\n\nRodzina kontrolująca znaczną część ziem partii może stać się [dominant_family|E]."
 game_concept_powerful_vassal: "Wpływowy poseł z ław poselskich"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' to garstka [vassals|E] z największą [soldiers|E] i najwyższą [income|E]. Musisz zwracać szczególną uwagę na tych posłów tylnego ławki, ponieważ oczekują utrzymania miejsca w swojej [council|E] i będą miały znacznie niższe [opinion|E] wobec ciebie, jeśli im się to nie powiedzie.\n\nZmiana [succession_law|E] wymaga, aby wszystkie $game_concept_powerful_vassals$ albo miały pozytywne [opinion|E] wobec ciebie, były [cowed|E] przez ciebie, albo były [imprisoned|E]."
 game_concept_powerful_vassal_possessive: "Wpływowi posłowie z ław poselskich"
 game_concept_powerful_vassals: "Wpływowi posłowie z ław poselskich"
 game_concept_prestige: "Profil"
 game_concept_prestige_desc: "$game_concept_prestige$ is a politician's public fame: name recognition, column inches and airtime.\n\nIt is spent on public moves, depending on the [government_form|E].\n\nEvery time a Character gains Profile, they also progress toward the next [prestige_level|E]."
 game_concept_prestige_experience: "Sława"
 game_concept_prestige_level: "Poziom profilu"
 game_concept_prestige_level_impact: "Wpływ na poziom profilu"
 game_concept_prestige_level_impact_desc: "Wpływ na poziom profilu zwiększa lub zmniejsza [modifiers|E] uzyskany z obecnego [prestige_level|E]."
 game_concept_prestige_levels: "Poziomy profilu"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$ są #V 7#! [electors|E], które wybierają [title_heir|E] wraz z Cesarzem w ramach [GetLaw('princely_elective_succession_law').GetName] [succession_law|E] używanych przez [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )].\n\n[holders|E] z #V 7#! preferowane [titles|E] są priorytetowo traktowane jako $game_concept_prince_electors$. Te Tytuły są wybierane podczas tworzenia Imperium.\n\nJeśli $game_concept_prince_elector$ Tytuł zostanie zniszczony, nie jest posiadany przez [de_jure|E] Imperialnego [vassal|E], jest posiadany przez innego $game_concept_prince_elector$ lub [religion|E] Właściciela różni się od Cesarza, zostanie wybrany inny Tytuł De Jure posiadany przez bezpośredniego Imperialnego Członka lub [independent_ruler|E] na podstawie tych kryteriów:\n$EFFECT_LIST_BULLET$[rulers|E] Cesarza [faith|E] oraz [culture|E] są faworyzowane\n$EFFECT_LIST_BULLET$[theocratic|E] oraz [feudal|E] Władcy są faworyzowani\n\n#help Preferowane Tytuły są wyświetlane w widoku Wyborów#!"
 game_concept_promote_other_culture_development_decision_desc: "[decision|E], który pozwala Ci poprawić [development|E], [control|E], [building|E] koszty i obronną [advantage|E] w [counties|E] z różnych [cultures|E] przy [cultural_acceptance|E] #V 75%#! lub więcej.\n\nPodjęcie decyzji zwiększy również Twój [prestige|E] [prestige_i] i [levies|E].\n\nWszystkie okręgi w [realm|E] są objęte wpływem. Koszt [gold|E] rośnie wraz z liczbą dotkniętych okręgów."
 game_concept_prowess: "Wytrzymałość"
 game_concept_prowess_skill: "Umiejętność Wytrzymałości"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ is a [skill|E] that reflects a Character's physical and mental endurance: eighteen-hour days, all-night sittings and the campaign trail.\n\nA high Stamina Skill means they are more likely to survive and perform well both as [knights|E] in [battles|E] and in [single_combat_duel_plural|E].\n\nEach point of Stamina gives an Organiser:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E] może być podniesiony jako $game_concept_raiders$ z [rally_points|E]. $game_concept_raiders$ może przemieszczać się do sąsiednich ziem i plądrować je dla [gold|E].\n\nAby $game_concept_raid$, Armia Najazdowa musi zatrzymać się w [holding|E] należącym do zagranicznego [ruler|E] i wybrać rozpoczęcie Najazdu — po tym będą zmuszeni do prowadzenia Najazdu przez pewien czas, po którym otrzymają Fundusze i splądrują Własność.\n\nFundusze będą przechowywane w Armii i zostaną dodane do skarbca dopiero po powrocie do domu. Jeśli pokonasz Armię Najazdową niosącą Fundusze, je przejmiesz, a oni nie będą mogli Cię napadać przez pewien czas.\n\nTylko niektórzy Władcy mogą $game_concept_raid$, w szczególności Władcy [tribal|E] i [GetGovernment( 'nomad_government' ).GetName].\n\nSpecyficzne [raid_intents|E] mogą być ustawione, aby uzyskać różne nagrody."
 game_concept_rally_point_desc: "A $game_concept_rally_point$ is a mustering ground for the [levies|E] and [men_at_arms|E] under your command.\n\nIn times of [war|E], you can call up your [soldiers|E] at a Rally Point to gather an [army|E].\n\nThe Volunteers assigned to a Rally Point must come from either your own [domain|E] or your [vassals|E]. Rally Points can be reorganized, split and merged as you see fit."
 game_concept_realm: "Partia"
 game_concept_realm_capital: "Baza domowa"
 game_concept_realm_capital_desc: "$game_concept_realm_capital$ to [holding|E], w którym przebywa [ruler|E] i jego [court|E]. To posiadłość ma premię [tax|E] i zawsze dziedziczą ją [primary_heir|E]. \n\n[occupying|E] baza macierzysta wroga w wojnie daje znaczącą ilość [war_score|E] i czasem pozwala [imprison|E] członków rodziny wroga."
 game_concept_realm_capital_possessive: "Bazowy domowy"
 game_concept_realm_capitals: "Bazy domowe"
 game_concept_realm_desc: "$game_concept_realm$ to wszyscy i wszystko, czym kieruje polityk, bezpośrednio lub za pośrednictwem swojego [vassals|E] (w przeciwieństwie do [domain|E], który obejmuje tylko to, co on sam posiada)."
 game_concept_realm_heir: "Spadkobierca partii"
 game_concept_realm_heir_desc: "Spadkobierca partii jest jednym z [heirs|E] [realm|E] i otrzyma cały lub część [titles|E] posiadanego przez [ruler|E] tej partii, gdy Władca umrze.\n\nPartia może mieć jednego lub więcej Spadkobierców w zależności od jej [succession_law|E]."
 game_concept_realm_heirs: "Spadkobiercy partii"
 game_concept_realm_law: "Prawo partii"
 game_concept_realm_law_desc: "Prawa stosowane wobec partii tej postaci, takie jak poziom [crown_authority|E] lub [tribal_authority|E]."
 game_concept_realm_possessive: "Partii"
 game_concept_realm_priest: "Kapłan partii"
 game_concept_realm_priest_desc: "$game_concept_realm_priest$ jest [councillor|E] odpowiedzialnym za sprawy religijne i duchowe w [faiths|E] z [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E].\n\nW przeciwieństwie do swojego [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] odpowiednika ([court_chaplains|E]), $game_concept_realm_priests$ automatycznie [lease|E] wszystkie [temple_holdings|E] w [ruler|E] [domain|E], a także otrzymują część [taxes|E] i [levies|E] od [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ zapewniają swoim [liege|E] ochotników i podatki, jeśli mają pozytywną opinię o nich. Im wyższa [opinion|E] ich [liege|E], tym więcej będą dostarczać.\n\n$game_concept_realm_priests$ z niską opinią o swoim Liderze Partii nie będą dostarczać żadnych podatków ani ochotników, i mogą powodować problemy."
 game_concept_realm_priest_possessive: "Kapłan partii"
 game_concept_realm_priests: "Kapłani partii"
 game_concept_realm_size: "Wielkość partii"
 game_concept_realms: "Partie"
 game_concept_regency_desc: "Regency to specjalna forma [diarchy|E], stosowana, gdy [ruler|E] nie jest w stanie rządzić swoim [realm|E] samodzielnie.\n\nZwykle występuje, jeśli Władca jest [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )], lub uczestniczy w [activity|E] poza swoją partią.\n\nZbyt długotrwała $game_concept_regency$ może stać się [entrenched_regency|E]."
 game_concept_religion: "Obóz polityczny"
 game_concept_religion_desc: "$game_concept_religion$ grupy powiązane z [faiths|E]: Lewica, Centrum, Prawica, Nacjonaliści i Unioniści. Ideologie z tego samego lub sąsiedniego obozu są Rozbieżne; lewica i prawica są Przeciwne; nacjonaliści i unioniści są Niezgodne."
 game_concept_religions: "Obozy polityczne"
 game_concept_religious_families: "Rodziny polityczne"
 game_concept_religious_family: "Rodzina polityczna"
 game_concept_religious_family_desc: "A $game_concept_religious_family$ is a group of [religions|E]. The $game_concept_religious_family$ affects how the various Political Camps, and [faiths|E] therein, view each other.\n\nThe [GetReligionFamily('rf_abrahamic').GetName] Family condones [holy_wars|E] against everyone #weak (including other Abrahamics)#!. Political Camps are susceptible to [heresy|E].\n\nThe [GetReligionFamily('rf_eastern').GetName] Family only condones Holy Wars against other Political Families.\n\nThe [GetReligionFamily('rf_pagan').GetName] Family condones Holy Wars against everyone, but Ideologies within the Political Camps must be reformed to access them."
 game_concept_religious_head_succession_law: "Prawo sukcesji liderów ruchu"
 game_concept_religious_head_succession_law_desc: "[rulers|E], które są również [heads_of_faith|E], mają dodatkową stronę [succession|E] prawie, wymagającą, by ich [heir|E] były tej samej [faith|E] co oni. Tego nigdy nie można zmienić i $game_concept_head_of_faith$ [titles|E] nie mogą mieć oddzielnych [title_succession|E]. Jedynym sposobem na usunięcie tego typu prawa partyjnego jest zewnętrzna siła zniszczenia [head_of_faith|E] $game_concept_title$."
 game_concept_religious_head_succession_law_short: "Prawo Lidera Ruchu"
 game_concept_religious_head_succession_laws: "Prawo sukcesji liderów ruchu"
 game_concept_religious_head_succession_laws_short: "Prawa dotyczące liderów ruchu"
 game_concept_religious_superior_desc: "Przełożony religijny to [character|E], który sprawuje jurysdykcję religijną nad jednym lub więcej [subordinate|E] działaczy partyjnych w hierarchicznej strukturze religijnej."
 game_concept_retinue_maa: "Aktywiści Świty"
 game_concept_retract_desc: "Przy [limited_crown_authority|E] lub wyższym [rulers|E] może $game_concept_retract$ [vassal|E] posła z ław pozacyjnych, ale jeśli ten nie jest [imprisoned|E] jest to ryzykowne, ponieważ poseł może odmówić i zbuntować się. \n\nBackbencher Retrakcja jest uważana za [tyrannical|E], chyba że cel popełnił dość poważne [crime|E]."
 game_concept_revoke_desc: "Przy [limited_crown_authority|E] lub wyższym, [rulers|E] może $game_concept_revoke$ [titles|E] ich [vassals|E], ale chyba że Backbencher jest [imprisoned|E], jest to ryzykowna propozycja, ponieważ Backbencher może odmówić i wystąpić w rebelii.\n\nOdbiór tytułu uważa się za [tyrannical|E] chyba że Backbencher jest winny dość poważnego [crime|E]."
 game_concept_rightful_liege: "Prawowity Lider Partii"
 game_concept_rightful_liege_desc_part2: "#weak Przykład: Hrabia $c_dunbar$ jest bezpośrednim zapleczem Króla $k_england$. Ponieważ Król nie jest ani Dukiem $d_lothian$, ani Królem $k_scotland$, ani Cesarzem $e_britannia$, Hrabia $c_dunbar$ wnosi tylko niewielką część swoich podatków i ochotników.\n\nHrabia $c_norfolk$ jest także bezpośrednim zapleczem Króla $k_england$. Król nie posiada Regionu $d_norfolk$, więc Hrabia również wnosi zmniejszone podatki i ochotników. Jednakże, ponieważ $k_england$ jest de jure Narodem $c_norfolk$, Hrabia $c_norfolk$ nadal wnosi znacznie więcej podatków i ochotników do Króla niż Hrabia $c_dunbar$.#!"
 game_concept_rite: "Ideologia"
 game_concept_rite_desc: "W Westminsterze każdy [faith|E] ma jeden $game_concept_rite$ o tej samej nazwie: samą ideologię, ze swoimi [core_tenets|E] i [doctrines|E]. Są one stałe: politycy zmieniają zdanie, nie ideologię."
 game_concept_rite_divergence_desc: "Dywergencja mierzy, jak bardzo [rite_possessive|E] [core_tenets|E] i [doctrines|E] oddaliły się od nadrzędnego [faith|E]. Ideologia, która przyjmuje [prohibited_tenet_status|E] Przyczyny jako [core_tenet_status|E], jest bardziej Dywergentna.\n\nWysoka Dywergencja osłabia [fervor|E] nadrzędnej ideologii, co powoduje częstsze występowanie [heresy|E]. Ideologia, która osiągnie #V 100#! Dywergencji, zostanie automatycznie ogłoszona odłamkiem i stanie się nowym [faith|E]."
 game_concept_rite_knowledge: "Wiedza o ideologii"
 game_concept_rite_possessive: "Ideologia's"
 game_concept_rites: "Ideologie"
 game_concept_rites_possessive: "Ideologie'"
 game_concept_royal_court: "Prywatne biuro"
 game_concept_royal_court_desc: "Wybitni [rulers|E] są wystarczająco znani, aby utrzymywać Prywatne Biuro, które daje dostęp do różnych bonusów i możliwości.\n\nKiedy [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] lub [GetGovernment( 'tribal_government' ).GetName] [ruler|E] staje się [king|E] lub [emperor|E], zyskuje dostęp do swojego Prywatnego Biura.\n\nKażde Prywatne Biuro ma [court_grandeur_level|E], który daje korzyści w zależności od tego, jak znane jest Prywatne Biuro i kto [court_type|E] Prywatne Biuro.\n\nWnioskodawcy, [vassals|E] i [courtiers|E] mogą pojawić się w Twoim Prywatnym Biurze, lub możesz [hold_court|E], aby zaprosić kogokolwiek w [realm|E], aby wyrazić swoje skargi.\n\nPrywatne Biuro pozwala również Władcy wyświetlać [court_artifacts|E], a [inspired|E] [guests|E] mogą pojawić się w Prywatnym Biurze, oferując stworzenie nowych [artifacts|E].\n\nKiedy umierasz, Twój [player_heir|E] odziedziczy Twoje Prywatne Biuro."
 game_concept_royal_courts: "Biura prywatne"
 game_concept_sanctified_desc: "Uświęcenie [artifact|E] sprawia, że staje się on [holy_relic|E] dla [faith|E]. Artefakt może być uświęcony dla wielu ideologii."
 game_concept_scales_of_power_desc: "During [power_sharing|E], the balance of power between the [liege|E] and their [diarch|E] is measured on the $game_concept_scales_of_power$.\n\nAs the $game_concept_scales_of_power_scales$ tip towards the $game_concept_diarch$, they unlock [diarch_powers|E] and may add costs to the Party Leader's [diarch_affected_actions|E].\n\nAs they tip towards the $game_concept_liege$, it instead makes it easier for the Party Leader to end the [diarchy|E].\n\nThe $game_concept_scales_of_power_scales$ can be swung by:\n$EFFECT_LIST_BULLET$Using the $swing_scales_currency_interaction$ [character_interaction|E] against the opposing party\n$EFFECT_LIST_BULLET$As the $game_concept_diarch$, serving your $game_concept_liege$ well (however cynically) in [mandate|E] events"
 game_concept_seasonal_prediction_desc: "Zręczny $court_position_court_astrologer$ potrafi przewidzieć kolejne [steppe_season|E] w regionie, oferując liderowi drużyny przydatne informacje do planowania kolejnych ruchów."
 game_concept_seize_peripheral_duchy: "Przejąć region peryferyjny"
 game_concept_settlement_issue_desc: "Settlement Issues are tasks given to a [nomad|E] [ruler|E] after finishing a [migration|E] to new lands. They give the opportunity to handle conflicts and increase the local [county_control|E] in the new [domain|E].\n\nThese issues will continue to happen for the first years after a ruler has migrated, as long as the constituency has low constituency control."
 game_concept_short_reign_desc: "'Krótkie panowanie' to malejąca [opinion|E] kara, którą wszyscy bohaterowie w [realm|E] otrzymują od nowego [liege|E].\n\n W podobny sposób poddani otrzymują rosnącą [long_reign|E] premię Opinii wobec przywódców partii, którzy panowali nad nimi przez długi czas."
 game_concept_shunned_desc: "Wiele [rites|E] posiada [doctrines|E], które określają pewne zachowania jako Nielubiane. W zależności od konkretnej Polityki, te zachowania mogą być również uważane za [criminal|E].\n\nPostacie, które zostaną przyłapane na wykonywaniu zachowań, które ich Ideologia uważa za Nielubiane, tracą [piety_level|E] i zyskują odpowiadające [fame_trait|E]; ta Cecha będzie niechętnie odbierana przez wszystkich, których Ideologia uważa to zachowanie za Nielubiane lub Karaalne.\n\nPrzykłady Nielubianych zachowań obejmują:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "Każdy [rite|E] uznaje pewne [traits|E] za grzeszne. Postacie posiadające te cechy ponoszą kary [opinion|E] od wszystkich postaci, które uważają te cechy za grzeszne, nawet jeśli nie wyznają tej samej ideologii. Dodatkowo, postacie posiadające cechy, które ich własna ideologia uznaje za grzeszne, będą tracić [piety|E] co miesiąc.\n\nDokładnie jakie cechy są uznawane za grzechy różni się w zależności od ideologii, ale zazwyczaj jest określane przez kombinację [core_tenets|E] tej ideologii i [religion|E], do której ideologia należy."
 game_concept_spiritual_fulfillment: "Osobiste przekonanie"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ oznacza, jak bardzo [character|E] czuje się pewnie w własnej polityce. Wzrost i spadek zależy od ich [traits|E] oraz od ich zachowania."
 game_concept_spiritual_fulfillment_level: "Poziom przekonania"
 game_concept_spiritual_fulfillment_level_desc: "[character_possessive|E] [spiritual_fulfillment|E] dzieli się na $game_concept_spiritual_fulfillment_levels$, z których każdy ma własne efekty."
 game_concept_spiritual_fulfillment_levels: "Poziomy przekonania"
 game_concept_spiritual_head_of_faith: "Lider Ruchu Duchowego"
 game_concept_spymaster: "Główny Whip"
 game_concept_spymaster_desc: "$game_concept_spymaster$ to [councillor|E], który trzyma partię w ryzach i zna wszystkie sekrety. Uważaj na nielojalnego Naczelnego Whipa: łatwo może się ukryć lub dołączyć do spisku przeciwko tobie."
 game_concept_state_rite: "Ideologia Państwowa"
 game_concept_state_rite_desc: "$game_concept_state_rite$ jest [rite|E] wspieranym i aprobującym przez [administrative_government|E]. Ta ideologia jest związana z [title|E], a nie z żadnym konkretnym [character|E]. Łatwiej jest przekonać postacie w [realm|E] do ideologii państwowej i bardzo trudno jest je od niej odciągnąć.\n\nTylko [ruler|E] w Partii Administracyjnej może zmienić Ideologię Państwa, ale [governors|E] mogą swobodnie do niej przechodzić."
 game_concept_stationed_regiment_desc: "[men_at_arms|E] [regiment|E] otrzymuje bonusy do swojej skuteczności dzięki stacjonowaniu w [holding|E].\n\n[buildings|E] mogą dodatkowo zwiększać te bonusy — czasami dla dowolnego rodzaju Aktywistów, ale najczęściej dla jednego lub dwóch. Na przykład, [GetBuilding('stables_01').GetName] daje bonus do stacjonujących [light_cavalry|E] i [heavy_cavalry|E].\n\nMożna stacjonować w dowolnym momencie, z wyjątkiem okresu [war|E], lub jeśli posiadłość jest [occupied|E]. Jeśli posiadłość zostanie utracona, wszyscy stacjonujący Aktywiści zostaną odsunięci."
 game_concept_steward: "Kanclerz Skarbu"
 game_concept_steward_desc: "$game_concept_steward$ jest [councillor|E] odpowiedzialnym za gospodarkę i [domain|E]: [taxation|E], wydatki i [development|E]."
 game_concept_stewards: "Kanclerze Skarbu"
 game_concept_stewardship: "Gospodarka"
 game_concept_stewardship_lifestyle: "Gospodarka Styl życia"
 game_concept_stewardship_skill: "Umiejętność Ekonomii"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$ jest [skill|E] od budżetów, gospodarki i zarządzania. Bezpośrednio zwiększa [taxation|E], więc każdy przywódca tego chce.\n\nOdpowiadający [lifestyle|E] to [stewardship_lifestyle|E]."
 game_concept_stewardship_task_contract: "Kontrakt gospodarczy"
 game_concept_stewardship_task_contract_possessive: "Kontrakty gospodarcze"
 game_concept_stewardship_task_contracts: "Kontrakty gospodarcze"
 game_concept_stewardship_task_contracts_possessive: "Kontrakty gospodarcze'"
 game_concept_story_content_el_cid_desc: "#tooltip_heading Styl Opowieści: Lekki#!\n\nJako El Cid, zostaniesz niesłusznie odrzucony przez lidera swojej drużyny. Na wygnaniu możesz pozostać lojalny lub znaleźć własną drogę, co ostatecznie zakończy się powrotem na dwór #EMP lub#! ostateczną nagrodą — Walencję.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading Styl Opowieści: Umiarkowany#!\n\nJako Hasan, zostaniesz poprowadzony ścieżką religijnego fanatyzmu, wybierając miejsce, aby przynieść światło Prawdziwej Ideologii i nawracając [counties|E] spod ich [rulers|E].\n\nOstatecznie twoja historia zakończy się wielkim religijnym powstaniem przeciwko wybranemu wrogowi.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading Styl Opowieści: Lekki#!\n\nJako Temüjin będziesz szukał zemsty na wrogim plemieniu, które uwięziło twojego współmałżonka, i przetestujesz lojalność swojego najbliższego współtowarzysza i przyjaciela — Jamukhy.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "Ciśnienie"
 game_concept_stress_desc: "Postacie podlegają $game_concept_stress$, gdy działają przeciwko swoim [personality_traits|E]: lojalny poseł głosujący przeciwko dyscyplinie partyjnej, uczciwy minister zmuszony do obrony złej decyzji.\n\nPostaci pod dużą presją zyskują [stress_level|E], co wpływa na ich zdrowie, dopóki ponownie tego nie obniżą.\n\nCzas spędzony z dala od Westminster i [activities|E] przynosi ulgę."
 game_concept_stress_level: "Poziom ciśnienia"
 game_concept_stress_level_desc: "Co każde 100 [stress|E], postać gromadzi także poziom presji. Poziomy presji mieszczą się w zakresie od 0 do 3, przy czym każdy poziom nakłada rosnące kary na [fertility|E] i [health|E] postaci.\n\nPonadto, dopóki postać ma co najmniej 1 poziom presji, jest podatna na [mental_breaks|E]."
 game_concept_stress_levels: "Poziomy ciśnienia"
 game_concept_stress_loss: "Straty ciśnienia"
 game_concept_stressed: "Pod presją"
 game_concept_strong_vassal: "Silny Backbencher"
 game_concept_strong_vassal_desc: "$game_concept_strong_vassal$ to [vassal|E], który zbliża się do swojej [liege|E] w sile lub ją przekracza, ponosząc karę [opinion|E]. #weak Uważają swojego lidera partii za słabego i nieodpowiedniego do rządzenia partią.#!"
 game_concept_strong_vassals: "Silni Backbenchers"
 game_concept_struggle_involved_faith: "Zaangażowana ideologia"
 game_concept_struggle_involved_faiths: "Zaangażowane ideologie"
 game_concept_struggle_persia_phase_unrest_desc: "Beset by rebellions and intrigues, the Caliphate crumbles. Ambitious warlords and cunning governors alike grasp at whatever power they can usurp, squabbling constantly.\n\nOver time, unless the situation is resolved by an [ending_phase|E], the party will enter a [struggle_persia_phase_stabilisation|E] phase as desperate supporters claw back caliphal authority."
 game_concept_struggle_phase_desc: "$game_concept_struggle_phase_phase$ to ogólny nastrój, wspólny dla [struggle_involved|E], [characters|E] i [counties|E] w ramach [struggle_region|E]. Reprezentuje krótkoterminowe trendy społeczne i obyczaje tymczasowo dominujące w dialogu [struggle|E].\n\n#weak Przykład: w jednym $game_concept_struggle_phase_phase$, ludzie z $game_concept_struggle_region_region$ mogą uważać, że tolerancja religijna jest najważniejsza, nawet jeśli reszta ich ideologii jest innego zdania.#!"
 game_concept_supply_limit_desc: "$game_concept_supply_limit$ dyktuje liczbę [soldiers|E], jakie możesz mieć w [barony|E], zgodnie z [terrain|E] i [development|E] Warda.\n\nJeśli całkowita wielkość [army|E] przekroczy $game_concept_supply_limit$, twoje $game_concept_armies$ stracą [supply|E] i w końcu ucierpią z powodu [attrition|E]."
 game_concept_temporal_head_of_faith: "Lider Ruchu Czasowego"
 game_concept_tenet: "Przyczyna"
 game_concept_tenet_desc: "Podczas gdy [doctrines|E] reprezentują kwestie, w których [rite|E] musi zająć stanowisko, $game_concept_tenets$ reprezentują unikalne dziwactwa i praktyki Ideologii."
 game_concept_tenet_knowledge: "Wiedza o polityce"
 game_concept_tenet_knowledge_desc: "Politycy nie znają myślenia każdej innej ideologii szczegółowo.\n\nZnajomość wszystkich $game_concept_core_tenets$ i $game_concept_doctrines$ $game_concept_rite$ ułatwia zmianę zdania co do niej.\n\nWszystkie [core_tenets|E] i [doctrines|E] twojego własnego [faith|E] są ci znane. Więcej można się nauczyć z [spouses|E], [friends|E] i [activities|E]."
 game_concept_tenet_popularity: "Popularność przyczyny"
 game_concept_tenet_popularity_desc: "As [personal_tenets|E] spread within a [faith|E] their practice becomes more common. $game_concept_tenet_popularity$ tracks how widespread a [core_tenet|E] is and affects how likely it is to be picked as debate topic in an [ecumenical_council|E] or as a target of a [papal_bull|E].\n\nThe higher the $game_concept_tenet_popularity$, the more the [clergy|E] will side with a cause when it is debated in an [ecumenical_council|E]. Once a cause reaches #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, the [head_of_faith|E] will most likely declare it [permitted_tenet_status|E] no matter their own convictions."
 game_concept_tenet_status: "Status przyczyny"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ jest [rite_possessive|E] stanowiskiem wobec [core_tenet|E] lub [doctrine|E]. Istnieje pięć możliwych stanowisk:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — $game_concept_rite$ nigdy nie słyszał o tym $game_concept_core_tenet$ lub $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — $game_concept_rite$ jest tego świadomy i nie wydał decyzji na temat praktyki.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — $game_concept_rite$ aprobuje tę praktykę.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — $game_concept_rite$ zabrania tej praktyki.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — $game_concept_rite$ zarówno pozwala na praktykę, jak i aktywnie ją promuje $game_concept_core_tenet$.\n\nStanowisko Ideologii decyduje, czy $game_concept_core_tenet$ lub $game_concept_doctrine$ mogą być wybrane podczas tworzenia lub rozwidlania $game_concept_rite$ i które praktyki generują [followers|E] kary duchowe.\n\nStatus Sprawy różni się od [character_possessive|E] [tenet_knowledge|E], który jest osobistą świadomością, a nie ogólnym stanowiskiem $game_concept_rite$."
 game_concept_tenets: "Przyczyny"
 game_concept_the_christian_church_desc: "Kościół chrześcijański jest ciałem kościelnym, które nadzoruje i kieruje wyznawcami Jezusa Chrystusa, przedstawionymi jako [situation|E], które przechodzi przez sekwencję [the_christian_church_chapters_short|E].\n\nJego granice obejmują każdy [archdiocese|E] na świecie; każdy [christian|E] [ruler|E] rangi [county|E] lub wyższej z którąkolwiek częścią swojego [realm|E] w Archidiecezji jest członkiem, czy to urzędnicy partyjni, czy świeccy."
 game_concept_theocratic_vassal: "Teokratyczny poseł zaplecza"
 game_concept_theocratic_vassal_desc: "Backbenchers who have the [theocratic_government|E] form.\n\nHow they function is determined by a [faithpossessive|E] [doctrines|E]."
 game_concept_theocratic_vassals: "Teokratyczni posłowie zaplecza"
 game_concept_title_allegiance_desc: "[vassals|E] może być wiernością wobec konkretnego [title|E], a nie osoby swojego [liege|E]. Może się to zdarzyć tylko wtedy, gdy Tytuł ma własny [succession_law|E]. W dniu [succession|E] tacy Posłowie tylnego ławki staną się posłami tylnego ławki nowego tytułu [holder|E]."
 game_concept_title_desc: "$game_concept_title$ jest zasadniczo certyfikatem własności ziemi.\n\nNajmniejszą jednostką ziemi na mapie jest [barony|E]. Wards są zorganizowane w większe obszary zwane [counties|E]. Okręgi wyborcze [de_jure|E] należą do [duchy|E], regiony do [kingdom|E], a Państwa do [empire|E].\n\nRegiony, Państwa i Cesarstwa nie zawsze mają [holder|E], ale są to Tytuły, które mogą być [created|E] przez władcę kontrolującego wystarczającą część odpowiadającego terytorium."
 game_concept_title_men_at_arms: "Aktywiści tytułów"
 game_concept_top_liege: "Premier"
 game_concept_top_liege_possessive: "Premier"
 game_concept_top_lieges: "Premierzy"
 game_concept_top_realm: "Najwyższa Partia"
 game_concept_torture_desc: "[imprisoned|E] Characters can be $game_concept_tortured$, damaging their [health|E] or even maiming them in different ways.\n\nTorture can relieve [stress|E] for [GetTrait('callous').GetName( GetNullCharacter )] and [GetTrait('sadistic').GetName( GetNullCharacter )] Characters, but causes Pressure for those of a kind nature.\n\nTorturing [rulers|E] can also increase your [dread|E]."
 game_concept_tour_stop_desc: "An [activity_phase|E] podczas [royal_tour|E], w którym lider grupy może albo: uczestniczyć w [hosted_dinner|E], [tour_the_grounds|E] swojego [vassal|E], albo cieszyć się [cultural_festival|E]."
 game_concept_transfer_desc: "[rulers|E] może $game_concept_transfer$ jednego ze swoich [vassals|E] do innego posła zaplecza, o ile pierwszy jest niższej rangi niż drugi. To dobry sposób na zwiększenie [opinion|E] posła zaplecza, szczególnie jeśli przeniesiony poseł zaplecza jest [de_jure|E] częścią ich [realm|E]."
 game_concept_treasury_vassal_development: "Rozwój posłów z tylnych ław"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ represents the general influence that a [tribal|E] [ruler|E] wields over their [vassals|E]. Compared to [crown_authority|E], it offers fewer powers and at later levels.\n\nThere are four levels of $game_concept_tribal_authority$: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E], and [absolute_tribal|E]. Increasing $game_concept_tribal_authority$ costs an amount of [prestige|E] depending on the level and the ruler's [learning_skill|E], but is generally more expensive than increasing crown authority.\n\n#weak Backbenchers dislike higher levels of $game_concept_tribal_authority$, and lowering it is the primary goal of any [liberty_faction|E].#!"
 game_concept_tribal_desc: "Partie plemienne mają ograniczoną bazę wyborców [development|E], nie mogą przejść dalej niż Era Plemienna [innovations|E], nie mogą budować nowych [holdings|E] i zwykle nie mogą zmieniać swojego [succession_law|E].\n\n Mogą jednak korzystać z [prestige|E] zamiast [gold|E], aby budować swoje partie i zatrudniać [men_at_arms|E], i mają dostęp do większej liczby [casus_belli|E] w porównaniu z partiami [feudal|E]. Armie nieplemienne cierpią na karę [supply_limit|E] na wrogim terytorium plemiennym."
 game_concept_unassigned_vassal: "Nieopodatkowani posłowie z ław zaplecznych"
 game_concept_unassigned_vassals: "Nieopodatkowani posłowie z ław zaplecznych"
 game_concept_undirected_great_holy_war_desc: "$game_concept_undirected_great_holy_war$ jest ogłaszane przez $doctrine_spiritual_head_name$ [head_of_faith|E] z intencją podporządkowania [kingdom|E] swojej [faith|E]. \n\n $game_concept_undirected_great_holy_wars$ nie rozpoczynają się od razu, zamiast tego wchodzą w [preparation_phase|E]. \n\n Przed i w trakcie wojny, władcy atakującej ideologii mogą wybrać przekazanie [gold|E] [war_chest|E]. \n\n Jeśli zostaną zwycięzcy, docelowy Naród zostanie przejęty i przekazany postaci o atakującej ideologii. Nagrody dla napastników obejmują [piety|E] i potencjalnie sprawienie, że ich [dynasty|E] stanie się [landed|E] w zdobytym Narodzie."
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] otrzymaj [battle|E] [advantage|E] w [counties|E] ich ideologii."
 game_concept_usurp_title_desc: "[title|E] posiadany przez obcy [ruler|E] można zwykle Usurpować, jeśli więcej niż #V 50%#! jego [de_jure|E] [counties|E] znajduje się w twoim [realm|E]. Ten proces daje [title|E] tobie, co jest szczególnie ważne, aby zapewnić, że jesteś [rightful_liege|E] swojego [vassals|E].\n\nUsurpacja jest trudniejsza, jeśli obecny posiadacz [faith|E] jest wrogi wobec twojego; w tym przypadku usurpacja jest możliwa tylko wtedy, gdy posiadacz nie posiada już żadnych swoich [de_jure|E] [counties|E] wewnątrz swojej Partii."
 game_concept_varangian_adventure_desc: "This is a special type of [war|E], where the attacker intends to move their [realm|E] to the [war_target|E] wholesale.\n\nIf they win, they will immediately annex the appropriate [counties|E] and move their [capital|E] there. Their old backbenchers will go independent, and their old $game_concept_counties$ will be given to upstart local warlords. $game_concept_varangian_adventures$ are #EMP ONLY#! available to [duke|E] and $game_concept_count$-[title_tier|E] [rulers|E], becoming progressively more expensive with each successful $game_concept_varangian_adventure_adventure$.\n\nThis [casus_belli|E] is #EMP NEVER#! available after the $culture_era_tribal$ [era|E], and cannot be used against other [cultures|E] that can $game_concept_varangian_adventure_adventure$ or against neighboring $game_concept_rulers$.\n\n$north_germanic_group_collective_noun$ launching their first $game_concept_varangian_adventure$ receive up to [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] bonus [special_troops|E], the amount going up with every same-[faith|E] same-[culture|E] constituency they completely control within [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_vassal: "Posłanek z tylnych ław"
 game_concept_vassal_contract: "Kontrakt z posłami z tylnych ław"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ dyktuje [obligations|E] między [vassal|E] a ich [liege|E].\n\n Wiceposłowie [feudal|E], [clan|E], [administrative|E] i [nomadic|E] $game_concept_government_forms$ mają dostęp do różnych [obligations|E], negocjowanych indywidualnie dla każdego Wiceposła. \n\n Wszyscy Wiceposłowie płacą procent swojej całkowitej [taxes|E] i [levies|E] swojemu Liderowi Partii, na podstawie ich [obligations|E]. #EMP Te [modifier_contributions|E] mogą z kolei być modyfikowane przez opcje 'drobnego druku', takie jak [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\n Niektóre Specjalne Kontrakty są ograniczone do określonych Rang: \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] i [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] i wyżej \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] i wyżej \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: tylko [count|E] \n\n#weak Uwaga, [governor|E] [obligations|E] są również znane jako [province_administrations|E].#!"
 game_concept_vassal_contracts: "Kontrakty z posłami z tylnych ław"
 game_concept_vassal_desc: "A $game_concept_vassal$ is a politician who answers to another: an MP to their [liege|E], a party leader to the Prime Minister.\n\nBackbenchers give their Party Leader [levies|E] and [taxes|E] — their [obligations|E] — in return for the whip and support.\n\nIf a $game_concept_vassal$'s [opinion|E] of their Party Leader is low, they may join [factions|E], or [scheme|E] to replace them."
 game_concept_vassal_directive: "Dyrektywa posłów z ław poselskich"
 game_concept_vassal_directive_desc: "As a [liege|E], you can issue Directives to your [vassals|E], influencing their [councillor_tasks|E] and which [buildings|E] they construct.\n\nTo issue a Directive, you need to enable it, such as by having #P 50#! or more [opinion|E] with the Backbencher. Advanced [government_forms|E] do not require this."
 game_concept_vassal_directives: "Dyrektywy posłów z tylnych ław"
 game_concept_vassal_limit: "Limit posłów z tylnych ław"
 game_concept_vassal_limit_desc: "$game_concept_vassal_limit$ określa, ile [direct_vassals|E] możesz legalnie posiadać (z wyłączeniem [barony|E]-tier osób z tylnego siedzenia).\n\nChociaż możesz przekroczyć swój $game_concept_vassal_limit$, zrobienie tego obniży [taxes|E] i [levies|E], które zapewniają osoby z tylnego siedzenia, i możesz być lepiej, [transferring|E] niektóre osoby z tylnego siedzenia, aby pozostać poniżej limitu."
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ określa, ile [tax|E] i ile [levies|E] [subject|E] zapewnia swoim [suzerain|E]. [government_form|E] Podmiotu określa, jak zmieniają się jego $game_concept_obligations$.\n\n#weak Na przykład, [GetGovernment('feudal_government').GetName] i [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$ zależą od ich [vassal_contract|E], [GetGovernment('administrative_government').GetName] Wiceposłowie zależą od ich [province_administration|E], podczas gdy [tributary_possessive|E] zależą od ich [tributary_contract|E]."
 game_concept_vassal_possessive: "Posłanki z tylnych ław"
 game_concept_vassal_stance: "Stanowisko posłów z tylnych ław"
 game_concept_vassal_stance_desc: "Każdy [vassal|E] ma postawę Backbenchera, która wpływa na [opinion|E], jakie mają wobec ciebie jako swojego [liege|E], oraz na [heir|E], którym wolą jako następcę [realm|E].\n\nBackbencherzy o tej samej postawie lubią i nie lubią tych samych rzeczy. Na przykład; wszyscy [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] Backbencherzy nie lubią, gdy tracisz [wars|E].\n\nKażda postawa Backbenchera preferuje jednego konkretnego dziedzica. Po sukcesji każdy preferowany dziedzic będzie miał niższe [legitimacy_expectations|E] wobec Backbancherów o tej postawie.\n\n#low Postawy Backbenchera to:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "Stanowiska posłów z tylnych ław"
 game_concept_vassal_taxes: "Podatki posłow z ław poselskich"
 game_concept_vassal_taxes_desc: "Twoje $game_concept_vassal_taxes$ składa się z [taxes|E], które otrzymujesz od swojego [vassals|E]. Kwota zależy od [obligations|E] każdego posła zaplecza.\n\nZ punktu widzenia Twoich posłów zaplecza, te same podatki nazywane są [liege_taxes|E], aby odróżnić je od wszelkich $game_concept_vassal_taxes$, które pobierają od swojego własnego $game_concept_vassals$."
 game_concept_vassals: "Posłanci z tylnych ław"
 game_concept_vassals_possessive: "Posłancy z tylnych ław"
 game_concept_victory_desc: "$game_concept_victory$ jest jednym z trzech możliwych [peace_offers|E]. Dokładny wynik Zwycięstwa w [war|E] zależy od [casus_belli|E].\n\nDla Atakującego zazwyczaj wiąże się to z zajęciem [titles|E] w regionie [war_target|E].\n\nDla Obrońcy Zwycięstwo zwykle oznacza, że atakujący musi zapłacić dużą sumę funduszy jako reparacje wojenne."
 game_concept_virtue_desc: "Każdy [rite|E] uznaje pewne [traits|E] za cnotliwe. Postacie posiadające te cechy zyskują bonusy [opinion|E] od wszystkich postaci, które uważają te cechy za cnotliwe, nawet jeśli nie wyznają tej samej ideologii. Dodatkowo, postacie posiadające cechy, które ich własna ideologia uznaje za cnotliwe, będą zyskiwać bonus [piety|E] co miesiąc.\n\nDokładnie jakie cechy są uznawane za cnoty różni się w zależności od ideologii, ale zazwyczaj jest określane przez kombinację [core_tenets|E] tej ideologii i [religion|E], do której ideologia należy."
 game_concept_virtue_weight_desc: "Cechy mogą mieć przypisaną [sin|E] lub [virtue|E] Wagę, określoną przez [core_tenets|E] i [doctrines|E] [rite|E], oraz do których [religion|E] należą.\n\nCechy o najwyższej Sin lub Virtue Wadze w obrębie Ideologii stają się [sins|E] i [virtues|E] tej Ideologii."
 game_concept_wanderer_desc: "Postacie, które nie należą do [court|E] ani nie pełnią żadnej [titles|e], nazywane są Wędrowcami. Podróżują po świecie, odwiedzając Biura jako [guests|E] po drodze. Wędrowcy mogą zostać [mercenary|E] Kapitanami, liderami [holy_orders|E], członkami [clergy|E] lub posiadaczami [city|E]."
 game_concept_wanua_desc: "$wanua_government_adjective$ [government|E] dzieli słabości z [GetGovernment('tribal_government').GetNameWithIcon] [government|E], ale mają również zmniejszone [domain_limit|E] i [vassal_limit|E]. Podczas gdy używają [gold|E] do budowy [buildings|E] i rekrutowania [men_at_arms|E], zarabiają bardzo mało Funduszy z Budynków.\n\nMimo to mogą [barter_goods_i][barter|E], [raid|E] i mają synergie z rządem [GetGovernment('mandala_government').GetName], ponieważ zdobywają [legitimacy|E] będąc [tributary|E]."
 game_concept_war_chest_desc: "$game_concept_war_chest$ to zbiór [gold|E], [piety|E] i [prestige|E]. Zawartość jest w głównej mierze wykorzystywana jako nagrody za skuteczne wygranie [undirected_great_holy_wars|E], gdzie są podzielone między atakujących na podstawie ich uczestnictwa w [war|E].\n\nPewna część tego, co znajduje się w $game_concept_war_chest$, jest również dzielona między atakujących, gdy Wojna zostaje ogłoszona.\n\nJeśli [undirected_great_holy_war|E] zostanie pokonany, obrońcy podzielą między siebie część $game_concept_war_chest$ w Postaci Kapitału Politycznego i Profilu #weak (Fundusze zostają utracone).#!"
 game_concept_winter_desc: "Zima stopniowo wyczerpuje [supply|E] z czasem, powodując, że armie tracą Zaopatrzenie, gdy stoją w strefie zaatakowanej przez Zimę. Kara za Zaopatrzenie rośnie z każdą powagą. Zima ma trzy różne surowości; [Concept( 'winter_severity_mild', 'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E] i [Concept( 'winter_severity_harsh', 'Harsh' )|E]."
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ to unikalne ulepszenia dla $game_concept_yurt$.\n\nMechanicznie są one [domicile_buildings|E] — chociaż wiele z nich reprezentuje zwyczaje społeczne lub po prostu obszary zainteresowania plemienia $game_concept_nomad$, zamiast być dosłownymi strukturami.\n\nBonusy, które mogą przyznawać, obejmują:\n$EFFECT_LIST_BULLET$ Odblokowanie [court_positions|E] i koczowniczych [decisions|E] oraz [character_interaction|E]s\n$EFFECT_LIST_BULLET$ Różne bonusy do [herd|E] i [county_fertility|E], w tym specjalizacje [terrain|E]\n$EFFECT_LIST_BULLET$ Odblokowanie i ulepszenie koczowniczych [men_at_arms|E] oraz zwiększenie siły [horde|E]\n$EFFECT_LIST_BULLET$ Unikalne koczownicze bonusy [culture_tradition|E]\n$EFFECT_LIST_BULLET$ Sposoby zarządzania [vassals|E] i [tributaries|E], a także wpływania na [characters|E] w swoim urzędzie.\n$EFFECT_LIST_BULLET$ Bonusy [kurultai|E] i [obedience|E]."
 maximum_piety_level_mandala: "\n\nHowever, when a [mandala|E] [ruler|E] dies in a manner acceptable to their [aspect|E], after reaching [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], that Ruler's [heir|E] develops the ability to progress to the next Political Capital Level until reaching [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
