l_polish:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Wreszcie! [faction_target.GetName] to nic więcej niż błazen udający [faction_target.GetTitleAsNameNoTooltip], i jestem pewien, że partia stanie po mojej stronie. Ci, którzy mi pomogą, nie zostaną zapomniani."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] zajmuje tron, który należy właściwie do ciebie! Jestem gotów wspierać twoje roszczenie słowem i mieczem, i jestem przekonany, że inni w partii również poprowadzą tę słuszną sprawę. Wystarczy, że ją zaakceptujesz."
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "Wreszcie! [faction_target.GetName] to nic więcej niż błazen udający [faction_target.GetTitleAsNameNoTooltip], i jestem pewien, że partia stanie po mojej stronie. Ci, którzy mi pomogą, nie zostaną zapomniani."
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] zajmuje tron, który należy właściwie do ciebie! Jestem gotów wspierać twoje roszczenie słowem i mieczem, i jestem przekonany, że inni w partii również poprowadzą tę słuszną sprawę. Wystarczy, że ją zaakceptujesz."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "W końcu! [faction_target.GetName] to nic innego jak błazen udający [faction_target.GetTitleAsNameNoTooltip], i jestem pewien, że partia przyłączy się do mojej sprawy.\n\n Z powodu mojego obecnego niskiego statusu nie mogę ci pomóc. Ale wiedz jedno – #emphasis kiedy#! zwyciężysz, upewnię się, że zostaniesz hojnie nagrodzony!"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "Chociaż cieszę się widząc, że partia powstała przeciw fałszywemu [faction_target.GetTitledFirstName], moja obecna sytuacja uniemożliwia mi dołączenie do was w tym sprawiedliwym przedsięwzięciu. Jeśli się wam powiedzie, będę wam dłużny."
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Jest dla mnie jasne, że wolelibyście zobaczyć, jak partia płonie, niż porzucicie to głupie przedsięwzięcie. Dla dobra partii muszę przyjąć wasze żądania, ale wiedzcie, że dziś wyrządzono tu wielką niesprawiedliwość. To nie zostanie przyjęte!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "Jest dla mnie jasne, że wolałbyś widzieć, jak partia płonie, niż zrezygnować z tego głupiego przedsięwzięcia. Dla dobra [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] muszę przyjąć twoje żądania, ale wiedz, że dziś dokonano wielkiej niesprawiedliwości. Tego nie można zostawić!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nWasze błędne żądania tylko osłabią nas wszystkich. Niemniej jednak, aby uchronić partię przed niepotrzebnym rozlewem krwi, jestem zmuszony przyjąć waszą prośbę o niepodległość."
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Jest dla mnie jasne, że wolałbyś widzieć, jak partia płonie, niż zrezygnować z tego głupiego przedsięwzięcia. Dla dobra [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] muszę przyjąć twoje żądania, ale wiedz, że dziś dokonano wielkiej niesprawiedliwości. Tego nie można zostawić!"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nLojalni poddani partii wytrzymali zbyt długo wasze błędne polityki. [faction.GetName] żąda, abyście zgodzili się na nowy kierunek dla [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], albo my narzucimy wam jeden!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "Nadszedł czas! Wszyscy, którzy wspierają odrzucenie mylnych polityk [faction_target.GetTitledFirstNamePossessive], teraz powstaną jako jedność i upewnią się, że partia zostanie skierowana nowym kierunku. Zobaczymy to zrealizowane, mieczem i ogniem, jeśli zajdzie potrzeba!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nWasze błędne żądania tylko osłabią nas wszystkich. Niemniej jednak, aby uchronić partię przed niepotrzebnym rozlewem krwi, jestem zmuszony przyjąć waszą prośbę o niepodległość."
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nWasze samolubne pojęcia 'wolności' osłabią Partię jako całość. Jednak, aby uniknąć niepotrzebnego rozlewu krwi, przyjmę wasze żądania."
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n Nadszedł czas, abyś uznał starożytne i niezbywalne prawa swoich posłów rezerwowych! Zaakceptuj żądania [faction.GetName] lub staw czoła naszym mieczom na polu bitwy!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Dobrze! Moja partia nie ma miejsca dla twoich nieumytych tłumów."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Nie będziemy dłużej tolerować twojego ohydnego zniewolenia dumnego [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Urodziliśmy się, by wędrować swobodnie pod tymi otwartymi niebami, odrzucamy twoją tyranię — nasz czas nadszedł!\n\nZrzucimy twoje rządy i twojego przywódcę partii, [faction_target.GetTitledFirstName], raz na zawsze!!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "Nie pozwolimy na dalsze zniewolenie przez twoje [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] rządy. [peasant_leader.GetRite.GetName|U] musi być uznany za najwybitniejszego [rite|E] [ROOT.Char.GetPrimaryTitle.GetName]!\n\nNadaj naszej ideologii należny jej status, albo przygotuj się na gniew naszych wielu wiernych!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "Nie będziemy dłużej znosić twojego ohydnego ucisku dobrych [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Nasz czas nadszedł!\n\nUwolnimy się spod twoich rządów i tyranii twojego przywódcy partii, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "Nie będziemy dłużej znosić obcego ucisku tradycji [peasant_leader.GetCulture.GetName]. Nasz czas nadszedł!\n\nBędziemy domagać się niczego mniej niż całkowitej wolności od twojego przywódcy partii, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "Nie będziemy dłużej znosić twojego ohydnego ucisku wiernych [peasant_leader.GetFaith.GetAdherentNamePlural]. Nasz czas nadszedł!\n\nZ [peasant_leader.GetFaith.WarGodName] jako nasz przewodnik powstaniemy i uwolnimy się spod rządów twojego przywódcy partii, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N Stracisz część swojej partii, jeśli twój lider partii ulegnie ich żądaniom! #!"
