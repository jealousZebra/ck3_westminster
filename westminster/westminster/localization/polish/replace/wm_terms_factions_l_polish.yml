 nation_fracturing_faction_desc: "Members of the $nation_fracturing_faction$ [faction|E] seek to destroy the party of their [liege|E].\n\n#S Ultimatum#!\nAll Faction Members become [independent|E]\n[liege|E] loses their [primary_title|E] and other [titles|E] of the same [title_tier|E]"
