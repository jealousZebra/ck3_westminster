 camp_perimeter_01_domicile_building: "Recepcja"
 camp_perimeter_01_domicile_building_desc: "Ktoś, kto odbierze drzwi, telefon i gniewnego wyborcę, w tej kolejności."
 camp_perimeter_camp_hygiene_domicile_building: "Grafik sprzątania"
 camp_perimeter_camp_hygiene_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nLodówka jest opróżniana w każdy piątek. To prawo."
 camp_perimeter_ditch_domicile_building: "Bollards"
 camp_perimeter_ditch_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nNikt nie parkuje vana przed drzwiami biura dwa razy."
 camp_perimeter_extra_watch_domicile_building: "System Wejścia do Drzwi"
 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nBuzzer, kamera i lista osób, które się spodziewają."
 camp_perimeter_fixed_layout_domicile_building: "Hot-Desk Plan"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nTe same biurka, ten sam grafik, gdziekolwiek przeniesie się biuro. Wszyscy wiedzą, gdzie co jest."
 camp_perimeter_good_siting_domicile_building: "Front ulicy głównej"
 camp_perimeter_good_siting_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nTuż przy przystanku autobusowym i supermarkecie: wszyscy przechodzą obok okna."
 camp_perimeter_palisade_domicile_building: "Okiennice"
 camp_perimeter_palisade_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nStalowe rolety po zmroku: okna przetrwają noc wyborczą."
 camp_priest_camp_officer: "Pracownik opieki społecznej"
 camp_priest_camp_officer_desc: "$camp_priest_camp_officer$ opiekuje się zespołem: słucha ucho, mówi cicho i ma oko na tych, którzy się wypalają."
 camp_purpose: "Skupienie polityczne"
 camp_purpose_brigands: "Media Expert."
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Oferowano więcej rund medialnych i badań opozycji\n$EFFECT_LIST_BULLET$Każda dobrze wykonana praca zarabia dodatkowo [prestige|E]: więcej czasu antenowego\n$EFFECT_LIST_BULLET$Odblokowuje [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$Może uzyskać dostęp do niektórych specjalnych [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Odblokowane przez $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (Odblokowane przez $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Odblokowane przez $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Dostępny do komentarza, na dowolnym kanale, o każdej godzinie, na każdy temat.#!"
 camp_purpose_confirmation_button_text: "Zmień fokus"
 camp_purpose_explorers: "Organizator oddolny"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Oferowano więcej pracy w terenie, w call center i przy mobilizacji wyborców\n$EFFECT_LIST_BULLET$Porusza się szybciej między drzwiami \n$EFFECT_LIST_BULLET$Odblokowuje [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK Każda ulica ma drzwi, do których jeszcze nie zapukano.#!"
 camp_purpose_legitimists: "Naprawiacz partii"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$Offered more of the party's inside jobs: speechwriting and research\n$EFFECT_LIST_BULLET$Every job done well earns extra Party Standing\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$Can access certain special [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak (Unlocked via $baggage_train_proof_of_claims_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Unlocked via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Somebody has to count the votes before the vote, and know who owes whom.#!"
 camp_purpose_mercenaries: "Konsultant kampanii"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Oferowano więcej pracy przy zbiórkach funduszy, banku telefonicznym i kosztorysach\n$EFFECT_LIST_BULLET$Każda dobrze wykonana praca zarabia dodatkowo [gold|E]: fakturę\n$EFFECT_LIST_BULLET$Odblokowuje [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$Może uzyskać dostęp do niektórych specjalnych [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Odblokowane przez $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Odblokowane przez $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Strategia, dane i dzienna stawka. Wyniki nie gwarantowane; faktury są.#!"
 camp_purpose_pass_phrase: "Zostań [Law.GetNameNoTooltip]"
 camp_purpose_scholars: "Think-Tank Wonk"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Offered more policy papers, speechwriting and costing jobs\n$EFFECT_LIST_BULLET$Learns faster from every job\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Can access certain special [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Unlocked via $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK There is a footnote for everything, and a chart for most of it.#!"
 camp_purpose_wanderers: "Aktywista partyjny"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Oferowano wszystkie rodzaje pracy, żadna nie była bardziej niż inna\n$EFFECT_LIST_BULLET$Może zmienić na jakikolwiek inny $camp_purpose$ bez wydawania [prestige|E]\n\n#WEAK Ulotki w jednej kieszeni, karta członkowska w drugiej, a jeszcze nie wiem, dokąd to wszystko prowadzi.#!"
 chief_engineer_camp_officer: "Dyrektor cyfrowy"
 chief_engineer_camp_officer_desc: "$chief_engineer_camp_officer$ prowadzi dane, reklamy i machinerię nowoczesnej kampanii."
 chief_forager_camp_officer: "Lider ds. pozyskiwania funduszy"
 chief_forager_camp_officer_desc: "$chief_forager_camp_officer$ znajduje pieniądze: loterie, kolacje, stałe zlecenia i okazjonalnego hojnego darczyńcę."
 chief_forager_camp_officer_employer_custom_effect_description: "$BULLET$Może pomagać w Zbiórce Funduszy Kampanii [decisions|E]"
 domicile_temperament_high: "Rozpalony zespół"
 domicile_temperament_low: "Zdemoralizowany zespół"
 domicile_temperament_neutral: "Stały Zespół"
 elephantry_captain_camp_officer: "Łącznik dla celebrytów"
 elephantry_captain_camp_officer_desc: "$elephantry_captain_camp_officer$ opiekuje się słynnymi kibicami, ich dziennikami i ego."
 ep3_can_have_legitimists_camp_purpose_trigger.tt.explanation: "Musisz mieć status Partii co najmniej 40"
 game_concept_adventurer: "Kampanier"
 game_concept_adventurer_camp: "Biuro kampanii"
 game_concept_adventurer_camps: "Biura kampanii"
 game_concept_adventurer_desc: "A $game_concept_adventurer$ is a politician without a seat: an activist, a candidate or a former MP, leading a [camp|E].

They have no constituency and no income of their own: they take [task_contracts|E] from their party's MPs to earn money, profile and Party Standing, and call in favours from their [contact_list|E].

A $game_concept_adventurer$ can move their office anywhere. The goal is a seat: get on the approved list, win a selection, then win the election."
 game_concept_adventurer_possessive: "Kampaniera - do"
 game_concept_adventurer_siege_replenishment_desc: "When an [adventurer|E] successfully [sieges|E] a [holding|E], a portion of their [men_at_arms|E] will be replenished.\n\nAll Activists [regiments|E] in the [army|E] will be replenished by #V x2#! times the Holding's [loot|E] value.\n\n#weak The increase is made up of new recruits, the press-ganging of locals, and simply paying those who wandered off during the siege.#!"
 game_concept_adventurers: "Kampanierzy"
 game_concept_adventurers_possessive: "Kampanierów - do"
 game_concept_camp: "Biuro kampanii"
 game_concept_camp_building: "Biuro"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$ are improvements to a [camp|E]: rooms, equipment, people and habits.

Mechanically, they are [domicile_buildings|E]. They can:
$EFFECT_LIST_BULLET$ Unlock new [officers|E]
$EFFECT_LIST_BULLET$ Give bonuses to the campaigner and the team
$EFFECT_LIST_BULLET$ Improve [task_contract|E] rewards"
 game_concept_camp_buildings: "Obiekty biurowe"
 game_concept_camp_desc: "A $game_concept_camp$ is a campaigner's base: a rented room, a shopfront or a regional headquarters, its staff and volunteers, and the battle bus that takes it from town to town.

Every [GetGovernment( 'landless_adventurer_government' ).GetName] has a $game_concept_camp$ [domicile|E] that moves across the map with them.

[camp_buildings|E] can be added, which give the $game_concept_camp$ and its campaigner lasting bonuses."
 game_concept_camp_purpose: "Skupienie polityczne"
 game_concept_camp_purpose_desc: "A $game_concept_camp_purpose$ is what a campaigner is known for: the kind of politician they are becoming.

It decides which [task_contracts|E] their party offers them most, gives a bonus of its own, and unlocks some [camp_buildings|E]. A $game_concept_camp_purpose_purpose$ can be changed, but changing from one to another costs [prestige|E]; a Party Activist may pick any for free."
 game_concept_camp_purpose_purpose: "Skupienie"
 game_concept_camp_purpose_purposes: "Skupienia"
 game_concept_camp_purposes: "Skupienia polityczne"
 game_concept_camp_temperament: "Morale zespołu"
 game_concept_camps: "Biura kampanii"
 game_concept_contract_scheme: "Schemat pracy"
 game_concept_contract_scheme_contract: "Praca"
 game_concept_contract_scheme_possessive: "Schemat pracy (dopełniające)"
 game_concept_contract_schemes: "Schematy pracy"
 game_concept_contract_schemes_possessive: "Schematy pracy (dopełniające)"
 game_concept_contractor: "Pracodawca"
 game_concept_contractor_desc: "$game_concept_contractor$ jest posłem lub liderem partii oferującym [task_contract|E]. Oni za to płacą i pamiętają, jak dobrze zostało wykonane."
 game_concept_contractor_possessive: "Pracodawcy"
 game_concept_contractors: "Pracodawcy"
 game_concept_contractors_possessive: "Pracodawców"
 game_concept_domicile: "Baza"
 game_concept_domicile_building: "Budynek bazy"
 game_concept_domicile_buildings: "Budynki bazy"
 game_concept_domiciles: "Bazy"
 game_concept_follower: "Członek zespołu"
 game_concept_follower_desc: "A $game_concept_follower$ is a volunteer or staffer who works for a [adventurer|E] without a seat.

Mechanically, they are like [courtiers|E], but they owe less and leave sooner if they dislike their boss.

The collective [opinion|E] of the $game_concept_followers$ sets the [camp_temperament|E]."
 game_concept_followers: "Członkowie zespołu"
 game_concept_officer: "Starszy pracownik"
 game_concept_officer_desc: "$game_concept_officers$ are the jobs [followers|E] can be given to run the [camp|E]: office manager, field director, treasurer and so on.

They work like [court_positions|E]: what they bring depends on the holder's [aptitude|E] for the job."
 game_concept_officers: "Starszy personel"
 game_concept_provision: "Fundusz kampanii"
 game_concept_provisions: "Fundusze kampanii"
 game_concept_provisions_desc: "$game_concept_provisions$ are the office's running budget: rent, fuel, print and food for the volunteers.

A [camp|E] spends $game_concept_provisions$ while it moves to a new [location|E]; how much depends on the size of the team, the distance and the [officers|E] it has.

Running out means unpaid bills and an unhappy team. Jobs done well, and some [camp_buildings|E], bring more in."
 game_concept_task_contract: "Praca"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ are work a [adventurer|E] does for the party's MPs: canvassing, fundraising, speechwriting, research, phone banks, policy papers and media rounds.

Each takes three weeks and is settled by a skill check. Doing it well earns [gold|E], [prestige|E], [provisions|E], Party Standing and the MP as a contact; doing it badly costs a little standing.

The party's candidate assessment is a $game_concept_task_contract$ too: pass it to join the approved candidates list."
 game_concept_task_contract_possessive: "Pracy (dopełniające)"
 game_concept_task_contract_tier: "Stopień pracy"
 game_concept_task_contracts: "Prace"
 game_concept_task_contracts_possessive: "Jobs'"
 head_groom_camp_officer: "Kierownik transportu"
 head_groom_camp_officer_desc: "$head_groom_camp_officer$ zajmuje się minibusami, kartami paliwowymi i mandatami za parkowanie."
 head_porter_camp_officer: "Koordynator Logistyki"
 head_porter_camp_officer_desc: "$head_porter_camp_officer$ transportuje biuro, pudła i ludzi do następnego miasta w jednym kawałku."
 heavy_cavalry_captain_camp_officer: "Kapitan autobusu bojowego"
 heavy_cavalry_captain_camp_officer_desc: "$heavy_cavalry_captain_camp_officer$ organizuje wycieczki autobusowe: duże wizyty, duże tłumy, wielkie zdjęcia."
 heavy_infantry_captain_camp_officer: "Lider zespołu przy drzwiach"
 heavy_infantry_captain_camp_officer_desc: "The $heavy_infantry_captain_camp_officer$ prowadzi duże sobotnie sesje ankietowe."
 horse_archer_captain_camp_officer: "Prowadzenie akcji ulotkowej"
 horse_archer_captain_camp_officer_desc: "$horse_archer_captain_camp_officer$ organizuje szybkie rundy dostaw, ulica po ulicy."
 huntperson_camp_officer: "Organizator działań informacyjnych"
 huntperson_camp_officer_desc: "$huntperson_camp_officer$ planuje dni wyjścia: stragany uliczne z ulic, wydarzenia społeczne i wizyty."
 huntperson_camp_officer_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] wzrasta wraz z [aptitude|E]\n$BULLET$ Poprawia [martial|E] [education|E] wyniki dla wszystkich [children|E] w twoim [camp|E]\n$BULLET$ Może pomóc w zbieraniu funduszy na kampanię [decisions|E]"
 kennelperson_camp_officer: "Koordynator wolontariuszy"
 kennelperson_camp_officer_desc: "$kennelperson_camp_officer$ utrzymuje ochotników w stanie najeść, podziękować i wskazać właściwy kierunek."
 landless_adventurer_government: "Kampanier"
 landless_adventurer_government_adjective: "Prowadzenie kampanii"
 landless_adventurer_government_realm: "Biuro kampanii"
 laureate_camp_officer: "Twórca słów"
 laureate_camp_officer_desc: "$laureate_camp_officer$ pisze linie, które ludzie zapamiętują i które cytują wracając do ciebie."
 light_cavalry_captain_camp_officer: "Lider Rapid Response"
 light_cavalry_captain_camp_officer_desc: "$light_cavalry_captain_camp_officer$ zwozi drużynę w dowolne miejsce w okolicy w ciągu godziny."
 light_infantry_captain_camp_officer: "Street Stall Lead"
 light_infantry_captain_camp_officer_desc: "$light_infantry_captain_camp_officer$ prowadzi stoiska na rynku i przed stacją."
 master_bard_camp_officer: "Twórca treści"
 master_bard_camp_officer_desc: "$master_bard_camp_officer$ przemienia dzień spędzony na progu wideo, w post i od czasu do czasu w wiralowy moment."
 master_of_arms_camp_officer: "Dyrektor polowy"
 master_of_arms_camp_officer_desc: "$master_of_arms_camp_officer$ prowadzi zespoły ankietowe: kto gdzie i kiedy puka."
 master_of_spoils_camp_officer: "Skarbnik"
 master_of_spoils_camp_officer_desc: "$master_of_spoils_camp_officer$ prowadzi księgowość, podpisuje czeki i składa zeznania do Komisji Wyborczej."
 master_thief_camp_officer: "Badacz Opozycji"
 master_thief_camp_officer_desc: "$master_thief_camp_officer$ wie, co druga strona powiedziała w 2011 roku i gdzie to zostało zapisane."
 mess_tent_01_domicile_building: "Kuchnia biurowa"
 mess_tent_01_domicile_building_desc: "Dzbanka z herbatą, lodówka pełna mleka i czyjś tort urodzinowy: kampania maszeruje na żołądku."
 mess_tent_bakers_domicile_building: "Boczkowe Rolki"
 mess_tent_bakers_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('mess_tent_01').GetName])#!\nSobotni poranek, przed sesją przy drzwiach. Nikt jej nie opuszcza."
 mess_tent_brewers_domicile_building: "ekspres do kawy"
 mess_tent_brewers_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('mess_tent_01').GetName])#!\nnaprawdę, z fasolą. Poranna frekwencja w canvassingu się podwaja."
 mess_tent_cooks_domicile_building: "Wolontariusze kucharze"
 mess_tent_cooks_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nMembers who can't canvass but can feed thirty people on a budget."
 mess_tent_curers_domicile_building: "Gotowanie porcjami"
 mess_tent_curers_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('mess_tent_01').GetName])#!\nZamrażarka pełna chilli na długie noce krótkiej kampanii."
 mess_tent_herbalists_domicile_building: "Zdrowe przekąski"
 mess_tent_herbalists_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nFruit as well as biscuits. A small revolution."
 person_haggler_camp_officer: "Deal Broker"
 person_haggler_camp_officer_desc: "$person_haggler_camp_officer$ zajmuje się niezręcznymi gośćmi i wyciąga najlepsze warunki z każdej przysługi."
 pike_captain_camp_officer: "Lead Telefonicznej Bazy Danych"
 pike_captain_camp_officer_desc: "$pike_captain_camp_officer$ prowadzi wieczorne banki telefoniczne: scenariusze, listy i ciągłą linię połączeń."
 proving_grounds_01_domicile_building: "Sala szkoleniowa"
 proving_grounds_01_domicile_building_desc: "Skrypty przy drzwiach, odgrywanie ról i jak odpowiadać na pytania, które nie zostały zadane."
 proving_grounds_bodyguard_drills_domicile_building: "Ćwiczenia Ochrony Bliskiej"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nKandydat publiczny potrzebuje kogoś, kto obserwuje tłum."
 proving_grounds_camel_run_domicile_building: "Trasy wiejskie"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nWioski, farmy i drogi bez nazw: plan zbierania głosów na wsi."
 proving_grounds_elephantry_reserve_domicile_building: "Zwolennicy celebrytów"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAktor, piłkarz i kucharz telewizyjny, którzy pojawią się przed kamerami."
 proving_grounds_horse_run_domicile_building: "Płótno Cycle"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nBikes for the long roads and the estates the minibus can't reach."
 proving_grounds_life_in_the_saddle_domicile_building: "Życie w trasie"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nNiektórzy ludzie ożywają tylko w innym mieście każdego dnia."
 proving_grounds_lockwagon_domicile_building: "Wspólne Kotki"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nEvery donation goes into one pot, and the pot pays for everything. Mostly."
 proving_grounds_martial_study_domicile_building: "Studium przypadków kampanii"
 proving_grounds_martial_study_domicile_building_desc: "#weak (wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nE Każde wybory były już prowadzone. Przeczytaj, jak zostały wygrane."
 proving_grounds_mock_battle_drills_domicile_building: "Dni próbnych głosowań"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nPełna próba dnia wyborczego, od pierwszego budzenia do zamknięcia głosowania."
 proving_grounds_nightly_barding_drills_domicile_building: "Ćwiczenia autobusu bojowego"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nLoad, drive, unload, canvass, repeat, until it runs like clockwork."
 proving_grounds_personal_bouts_domicile_building: "Praktyka debat"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nMock hustings with a staffer playing your nastiest opponent."
 proving_grounds_the_stick_game_domicile_building: "Konkurs biurowy"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nO wyniku, frekwencji i który kandydat pierwszy zapłacze."
 proving_grounds_the_stump_domicile_building: "Pulpit"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSkrzynka na rynku i dużo ćwiczeń w byciu wygwizdanym."
 proving_grounds_training_circle_domicile_building: "Koło odgrywania ról"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAngry voter, worried voter, voter who wants to talk about bins: everyone practises everything."
 quartermaster_camp_officer: "Kierownik biura"
 quartermaster_camp_officer_desc: "$quartermaster_camp_officer$ dba o porządek funduszy kampanii, szafki na artykuły papiernicze i grafik."
 second_camp_officer: "Zastępca kierownika kampanii"
 second_camp_officer_desc: "$second_camp_officer$ prowadzi biuro, gdy kandydat jest na progu, i utrzymuje wszystkich innych przy zadaniach."
 stooge_camp_officer: "Stażysta"
 stooge_camp_officer_desc: "$stooge_camp_officer$ zajmuje się kopiowaniem, biegiem po kawę i każdym zadaniem, którego nikt inny nie chce. Morale poprawia się dla wszystkich pozostałych."
 supply_tent_01_domicile_building: "Drukarnia"
 supply_tent_01_domicile_building_desc: "Ulotki, plakaty, koperty i jedna drukarka, na którą wszyscy narzekają. Kampania opiera się na papierze."
 supply_tent_arsenal_domicile_building: "Zapas ulotek"
 supply_tent_arsenal_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#! Pudła z każdą ulotką, jaką kiedykolwiek zaprojektowała kampania, gotowe na każdą ulicę w godzinę."
 supply_tent_climbing_gear_domicile_building: "Drabiny i opaski kablowe"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#!Każdy słup lampowy w okręgu wyborczym jest miejscem na plakat, jeśli można go osiągnąć."
 supply_tent_mender_domicile_building: "Sprzęt z drugiej ręki"
 supply_tent_mender_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#!Podarowane laptopy i odnowione telefony: nie wyglądają dobrze, ale działają."
 supply_tent_reserve_provisions_domicile_building: "Fundusz Rezerwowy"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#!Pieniądze odłożone na ostatnie dwa tygodnie, kiedy każda funt liczy się podwójnie."
 supply_tent_reserve_water_domicile_building: "Awaryjna płynność"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#! Puszka z drobnymi pieniędzmi na rzeczy, których nikt nie przewidział w budżecie."
 supply_tent_smithy_domicile_building: "Drukarka wewnętrzna"
 supply_tent_smithy_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#! Porządna maszyna drukarska w tylnej części pomieszczenia: koniec z czekaniem tygodnia na drukarzy."
 supply_tent_subdued_gear_domicile_building: "Cywilni"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#!Brak rozety, brak smyczy: niektóre prace lepiej wykonywać bez symboli."
 supply_tent_sutler_domicile_building: "Dostawcy hurtowi"
 supply_tent_sutler_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('supply_tent_01').GetName])#! Hurtownik, który oferuje dobrą cenę na A5, jeśli poprosisz grzecznie i zapłacisz na czas."
 witness_camp_officer: "Oficer ds. poparcia"
 witness_camp_officer_desc: "$witness_camp_officer$ zbiera każdy list poparcia i upewnia się, że wszyscy o nim słyszą."
