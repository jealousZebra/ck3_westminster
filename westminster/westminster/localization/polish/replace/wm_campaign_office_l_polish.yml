 camp_fire_trailing_musicians_domicile_building_desc: "#weak (Wymaga [GetDomicileBuilding('camp_fire_01').GetName])#!\nCzyjś głośnik, czyjaś playlista i morale, które wytrzymuje przy pakowaniu kopert."
 camp_fire_wandering_poets_domicile_building: "Twórcy słów"
