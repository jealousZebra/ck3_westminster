 piety_level_8_desc: "$piety_level_8$ jest ósmym i najwyższym możliwym [piety_level|E] dla [mandala|E] [government|E].\n\nKiedy [mandala|E] [ruler|E] umiera w sposób akceptowalny dla ich [aspect|E], po osiągnięciu [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L], [heir|E] tego Władcy rozwija zdolność do przejścia na ten najwyższy Poziom Kapitału Politycznego.\n\nEfekty:\n[GetPietyLevelDesc('(int32)8')|=+]"
