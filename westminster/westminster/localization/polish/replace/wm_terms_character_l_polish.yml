 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U] nie przestrzega dobrze wartości naszej ideologii, a [puppet_or_actor.GetFaith.GetAdherentNamePlural] w [target.GetNameNoTier] cierpią z tego powodu. Czy udzielisz mi swojego błogosławieństwa, aby wyzwolić te ziemie spod błędnego rządzenia [secondary_recipient.GetHerHis]?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "Choć zapału można zazdrościć, musimy być też pragmatyczni, jeśli chcemy, by nasza ideologia odniosła triumf. Czy nie byłoby mądrzejsze, by uczynić [target.GetNameNoTier] celem naszej świętej wojny?"
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "Zauważyłem błąd w moich postępkach i, pokutując za moje przewinienia, proszę Cię o uchylenie mojej ekskomuniki, abym mógł ponownie dołączyć do moich braci i sióstr ideologii."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "\nStaram się być dobrym [puppet_or_actor.GetFaith.GetAdherentName], ale nie jestem bardziej doskonały niż jakikolwiek inny [actor.GetWomanMan]. Aby zrekompensować moje potknięcia i niedociągnięcia, chcę przekazać tę kwotę na rzecz Kościoła.\n\nDodatkowo złożę przysięgę, że powstrzymam się od wszelkiego grzechu."
 RETRACT_VASSAL_PROPOSAL: "Doszedłem do wniosku, że dla większego dobra [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip], [recipient.GetFullName] musi zostać umieszczony na dalszym miejscu pod moją bezpośrednią władzą."
 WASTREL_ACCOLADE_BONUS: "Twoje [acclaimed_knight|E] sprawia, że życie w biurze wydaje się atrakcyjne: $VALUE|=+0$"
 accumulated_wealth_reason: "@gold_icon! Fundusze posiadane przez [recipient.GetShortUINamePossessiveNoTooltip]: $VALUE|=+0$"
 ally_at_court_opinion: "Sprzymierzeniec w Biurze"
 backwater_county_modifier_desc: "Im większy, tym cięższy upadek. Ten okręg wyborczy, niegdyś terytorium nieugiętych władców Hellady, niestety popadł w hańbę. Choć obecnie jest cieniem samego siebie, ten okręg może znów wznieść się do wielkości.\n\n#X @warning_icon! Ten modyfikator może zostać usunięty przy użyciu [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] gdy [development|E] tego [county|E] będzie #V 50#! lub więcej!#!\n\n"
 barons_and_minor_landholders_disapproves_baron_revocations_opinion: "[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName] Nie popiera cofania opieki"
 celestial_bureaucracy_0_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 [titles|E] członków tylnych rzędów nie można odziedziczyć przez postacie spoza [realm|E]#!"
 celestial_bureaucracy_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 [governor|E] [vassals|E] nie mogą prowadzić [war|E] przeciwko innym posłom tylnym, chyba że użyją [hook|E] na swoim [liege|E]#!"
 celestial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Rządzący mogą zmieniać między wszystkimi dostępnymi [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Wszyscy posłowie tylni, którzy odmawiają cofnięcia tytułu lub rezygnacji z posła tylnego, są uważani za [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! koszty są zmniejszone"
 char_interaction.0001.desc: "Akceptuję twoją łaskawą propozycję wasalizacji. Mój lider partii!"
 char_interaction.0002.desc: "Nie potrzebuję twojej ochrony i wolę zatrzymać łupy mojej Partii dla siebie."
 char_interaction.0010.a: "Mój lider partii!"
 char_interaction.0090.from_ward.desc: "Obawiam się, że moja edukacja w twoim biurze już nie odpowiada moim potrzebom. Niezwłocznie wrócę do [capital.GetNameNoTierNoTooltip]."
 char_interaction.0090.one_ward.desc: "Obawiam się, że edukacja [ward.GetTitledFirstName] w twoim biurze już nie odpowiada naszym potrzebom. [ward.GetSheHe|U] zostaje niniejszym wezwany do naszej opieki."
 char_interaction.0090.two_wards.desc: "Obawiam się, że edukacja [ward.GetTitledFirstName] i [ward_2.GetTitledFirstName] w twoim biurze już nie odpowiada naszym potrzebom. Zostają niniejszym wezwani do naszej opieki."
 char_interaction.0180.desc: "Jako wasz Głowa Domu zdecydowałem, że musicie przyjąć [puppet_or_actor.GetFaith.GetName], jedyną prawdziwą Ideologię. Obawiam się, że nie macie w tej sprawie wyboru."
 char_interaction.0180.desc.liege: "Jako lider twojej partii żądam, byś natychmiast porzucił swoją fałszywą ideologię i dołączył do mnie jako współ [puppet_or_actor.GetFaith.GetAdherentName]."
 char_interaction.0181.desc: "Bardzo dobrze, przyjmę ideologię [puppet_or_actor.GetFaith.GetAdjective], choć będzie dziwnie porzucić tak wiele znanego."
 char_interaction.0182.desc: "Nigdy nie porzucę mojej ideologii i zamiast tego założę własny Dom!"
 char_interaction.0190.desc: "Bardzo dobrze, przyjmę ideologię [puppet_or_actor.GetFaith.GetAdjective], choć będzie dziwnie porzucić tak wiele znanego."
 char_interaction.0191.desc: "Moja Ideologia jest w centrum mojego istnienia — nigdy jej nie porzucę."
 char_interaction.0200.desc: "Doszedłem do wniosku, że nie można Ci powierzyć godności i odpowiedzialności [landed_title.GetName]. Dlatego od tego momentu pozbawiam Cię tego tytułu dla większego dobra Partii."
 char_interaction.0211.desc: "Naprawdę doceniam twoją hojną ofertę uczynienia [secondary_recipient.GetShortUIName] moim posłem zaplecza, ale obawiam się, że muszę odmówić."
 char_interaction.0220.desc: "Akceptuję twoje wycofanie mojej osoby z zaplecza, [secondary_recipient.GetShortUIName], choć uważam to za niesprawiedliwe."
 char_interaction.0221.desc: "Nie mogę zdradzić przysięgi wierności [secondary_recipient.GetShortUIName]. Będę chronić moje zaplecze, nawet jeśli oznacza to złamanie przysięgi wobec ciebie."
 char_interaction.0232.liege: "Nie będę stał bezczynnie, podczas gdy nasz lider partii nadużywa lojalnych posłów zaplecza [actor.GetHerHis]. Zachęcam cię do przyłączenia się do mnie w walce o obalenie tego tyrana."
 char_interaction.0232.regent: "Nie będę stał bezczynnie, podczas gdy [actor.GetSheHe] nadużywa lojalnych posłów zaplecza [ceremonial_liege.GetTitledFirstNamePossessive]. Zachęcam cię do przyłączenia się do mnie w walce o obalenie tego tyrana."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nI have been a good backbencher to you, but surely you understand that I have subjects of my own, too!\n\nMy current contract is very restrictive, surely you would see the wisdom in making it more lenient?\n\nAnd, besides, you #emphasis do owe me!#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nIn recognition of our offerings and respect to [recipient.GetPrimaryTitle.GetNameNoTooltip], I ask that you honor that devotion by granting [SCOPE.Custom('CelestialTributaryRequest')].\n\nMay this favor reinforce the harmony between your throne and our humble party."
 char_interaction.0271.desc: "Na mocy uprawnień przyznanych mi przez [intermediary.GetTitledFirstName], poprawiam pewne drobne nieścisłości w granicach partii.\n\n Nakazano wam poddać wasalstwo [intermediary.GetTitledFirstName] prawowitemu liderowi partii [intermediary.GetHerHis]. Mnie."
 char_interaction.0272.desc: "Przekraczasz granice swoich uprawnień, ale nie mogę oprzeć się urzędowi mojego [intermediary.GetTitleAsName], nawet gdy to tylko #EMP ty#! go wykonujesz.\n\n Akceptuję twoje wycofanie mojej decyzji posła tylnego."
 char_interaction.0273.desc: "Złożyłem przysięgę ochrony moich posłów zaplecza, i to obejmuje ochronę przed depredacjami takich jak #EMP you#!.\n\nMożesz zdobyć [intermediary.GetTitledFirstName] i [intermediary.GetHerHis] ziemie ode mnie w walce albo możesz uciec z powrotem do jakiejkolwiek [recipient.GetFaith.random_GoodGodNames]-zapomnianej dziury, w której się ukrywasz."
 char_interaction.0282.desc: "Unlike my actions, your demands are criminal.\n\nFor the good of the party, I will comply, but know that I will not forget this slight."
 char_interaction.0291.a: "Jestem pewien, że mój lider partii wie najlepiej."
 char_interaction.0291.desc.negative: "Czy nie potrafisz #EMP niczego#! zrobić dobrze? Najwolniejszy prostak w kraju mógłby zobaczyć, że [recipient.GetTitledFirstName] nie jest tym, na czym powinieneś się skupiać. Przestań prześladować lepszych posłów zaplecza i wykonuj swoją pracę."
 char_interaction.0370.a.herder: "Powinienem był utrzymać moją partię razem."
 church_authority_0: "Autonomiczni Urzędnicy Partii"
 church_authority_0_effects_not_in_prev: "#weak Klerzy z tylnego rzędu zapewniają [levies|E] i [taxes|E], ale zachowują szeroką autonomię.#!"
 church_authority_2_effects: "$EFFECT_LIST_BULLET$Rządy mogą ustanowić teokratyczny [dynasty|E]\n$EFFECT_LIST_BULLET$[vassals|E] nie mogą prowadzić [war|E] przeciwko innym Posłom, chyba że użyją [hook|E] na ich [liege|E]\n$EFFECT_LIST_BULLET$Posłów' [titles|E] nie można dziedziczyć przez postacie spoza [realm|E]\n$EFFECT_LIST_BULLET$Wszyscy Posłowie, którzy odmawiają odebrania tytułu lub wycofania się z funkcji Posła, są uważani za [criminals|E]\n$EFFECT_LIST_BULLET$[christian|E] [head_of_faith|E] mogą użyć [GetDecision('enact_a_bull_decision').GetName] [decision|E] do ogłoszenia [great_holy_war|E]\n$EFFECT_LIST_BULLET$Mogą używać [GetDecision('pam_establish_theocratic_dynasty_decision').GetName] [decision|E]\n$EFFECT_LIST_BULLET$[subordinates|E] i świeckie [rulers|E] są łatwiejsze do [puppet|E]"
 church_claim_de_jure_liege_modifier: "Twierdzono, że posiada tytuł De Jure Backbencher"
 claimant_faction_member_opinion: "Usadowiony lider partii"
 convert_to_religion_interaction: "Przyjąć ideologię"
 council_interaction.0001.desc.accept: "Rozpocznę pracę nad wypełnieniem moich nowych obowiązków natychmiast i zobaczę się z tobą na następnym posiedzeniu gabinetu!"
 county_capital_province_modifier: "Kapitał okręgu wyborczego"
 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "Musieliśmy stać, debatując o zasadach właściwej pielęgnacji i wyglądu przez godziny, gwałtownie gestykulując do siebie nawzajem, przywołując starożytne prawo, o którym wydawało się, że niewielu w biurze wiedziało. Gdy dym spektaklu się rozwiał,"
 court_amenities_interactions.0002.desc_lost: "Jestem w szoku, że w rzeczywistości naruszam prawo! \n\n Stoję zawstydzony, gdy strażnicy zamku [debate_locale.GetNameNoTierNoTooltip] i styliści rozbierają mnie do bielizny, a następnie kontynuują rozbieraną! Odsłonięty w biurze, uciekam z miejsca z dumą między nogami."
