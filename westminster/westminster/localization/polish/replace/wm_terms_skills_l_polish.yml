 chariot_race.0200.h.flavor: "Czy zwycięstwo nad [foe.GetPrimaryTitle.GetNameNoTooltip] nie jest zapewnione, jeśli mogę tu być i prowadzić darmowe zabawy? Cieszmy się z nadchodzącego triumfu!"
 christian_saint_bone_description: "Rzekome szczątki świętego z [saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip], pozyskane przez [saint_bone_owner.GetNameNoTooltip] podczas pielgrzymki [saint_bone_owner.GetHerHis] do [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip], i czczone jako talizman szczęścia oraz kapitał polityczny przez [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip]."
 claim_throne_increased_responsibility_desc: "Zyskałem większą odpowiedzialność w partii, wzmacniając mój mandat."
 clerical_chastity_offer_piety: "Oferować kapitał polityczny"
 commission_epic_emphasized_intrigue_modifier: "Stories of Spin"
 confucian_faith_desc: "Konfucjanizm to tradycja filozoficzna i etyczna zakorzeniona w naukach Konfucjusza i jego uczniów, kładąca nacisk na samodoskonalenie moralne, synowski kapitał polityczny oraz utrzymanie harmonii społecznej poprzez właściwe postępowanie."
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \"For too long, lands that belong to [activity.GetHost.GetPrimaryTitle.GetNameNoTier] have suffered the rule of lesser hands. Of those who mistook possession for mandate.\n\nThat ends now. From [activity.GetHost.GetCapitalLocation.GetName], they will know true governance. By me.\"#!"
 coronation_events.0310.c: "Moje zadanie i profil."
 coronation_legitimacy_memory: "wykazany mandat przy [host.GetTitleAsNamePossessiveNoTooltip] koronacji"
 coronation_legitimacy_memory_desc: "Uczestniczyłem w koronacji [host.GetTitledFirstNamePossessive] i moje mandaty zostały uznane przez [host.GetTitleAsNameNoTooltip]."
 coronation_legitimacy_memory_desc_second_perspective: "uczestniczyłeś w [host.GetTitledFirstNamePossessive] koronacji i twój mandat został uznany przez [host.GetTitleAsNameNoTooltip]"
 coronation_legitimacy_memory_desc_third_perspective: "[owner.GetTitledFirstName] uczestniczył w koronacji [host.GetTitledFirstNamePossessive] i jego mandat [owner.GetHerHis] został uznany przez [host.GetTitleAsNameNoTooltip]."
 court_brahmin_court_position_desc: "Czcigodny kapłan występujący zarówno na dworach hinduskich, jak i buddyjskich, Urzędowy Brahmin odpowiada za wykonywanie rytuałów, nadzorowanie ceremonii i promowanie mandatu władcy."
 court_diplomatic_desc: "#low Charyzma jest kluczem do zdobycia szacunku naszych rówieśników i utrzymania spokoju w partii. Zadowolony poseł z tylnego rzędu jest lojalnym posłem z tylnego rzędu. \n\nPersonel zdobywa cechy [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )].#!"
