 historical_character.mibu_tadamine: "Pomimo skromnego pochodzenia, $Tadamine$ zdobył dużą markę partyjną za swoją poezję waka po występie w konkursie, otrzymaniu cesarskiego zlecenia i patronatu od rodziny Fujiwara. Razem ze swoim synem, $Tadami$, jest zaliczany do Trzydziestu Sześciu Nieśmiertelnych Poetów Japonii, z ponad osiemdziesięcioma jeden wierszami uznawanymi za część cesarskich antologii."
 historical_character.namdev: "Namdev był świętym i poetą marackim z XIII wieku, znanym z pieśni religijnych poświęconych Vithobie oraz jako wybitna postać ruchu Bhakti w Maharasztrze. Popularny wśród zwykłych ludzi, jego dzieła znacznie zwiększyły rozpowszechnienie i rozpoznawalność języka marackiego jako języka poetyckiego i politycznego."
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ Poszukaj mitycznego zwierzęcia widzianego w okolicy\n$EFFECT_LIST_BULLET$ Zwiększa $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Wyższy [hunt_danger_no_prefix|E] zapewnia więcej [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Płcie zajmujące się bezpieczeństwem mogą uczestniczyć\n$EFFECT_LIST_BULLET$ Płcie niewojownicze mogą obserwować\n#weak Mityczne stworzenia są często uważane przez uczonych za legendę, ale lasy mogą jeszcze skrywać wiele tajemnic.#!"
