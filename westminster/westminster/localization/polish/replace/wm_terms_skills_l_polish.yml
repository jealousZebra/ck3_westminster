 tradition_chivalry_desc: "Ta kultura przyjęła rycerskość i rycerskie kodeksy postępowania jako społeczny sposób regulowania zachowania. Ceni się biegłość militarną, obowiązek, honor i moralność, podobnie jak złą poezję i literaturę romantyczną."
