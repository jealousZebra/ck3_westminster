 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ Wybierz zwierzynę z różnych lokalnych zwierząt\n$EFFECT_LIST_BULLET$ Zwiększa $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Wyższy [hunt_danger_no_prefix|E] zapewnia więcej [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Osoby z umiejętnościami ochrony mogą aktywnie uczestniczyć\n$EFFECT_LIST_BULLET$ Osoby bez umiejętności walki mogą obserwować\n#weak Dumnie i przebiegle zwierzęta czają się na dziczy; przechytrzenie i pokonanie ich testuje odwagę i doskonali umiejętności.#!"
 hunt_type_stress: "$BULLET_WITH_TAB$@stress_icon! Utrata ciśnienia"
 iberia_north_africa.0111.desc: "Budowanie politycznej i duchowej jedności potrzebnej do zgromadzenia tego konklawe zajęło lata, ale w końcu udało mi się zgromadzić wystarczająco zarówno chłopstwa, jak i urzędników partyjnych pod moje sztandary, aby znacząco odrzucić fałszywego-[pope.GetTitledFirstName].\n\nNawet teraz korytarze i pokoje gościnne [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] są pełne kłócących się duchownych i namiętnych biskupów; każdy obrażony brat zakonny i drobny [religious_leader.GetFaith.PriestNeuter], którego Rzym kiedykolwiek zlekceważył, zapełnia moje hale.\n\nWszystkie te debaty są kluczowe dla mandatu, ale ostatecznie, jako wybitny władca [religious_leader.GetFaith.GetAdjective], #EMP moje#! słowo będzie ostatecznym głosem decydującym."
 iberia_north_africa.0112.desc.righteous: "wycofując się z tego, co [religious_leader.GetSheHe] uważa za grzeszną przemoc, która zainfekowała tak wielką część [religious_leader.GetFaith.GetReligion.GetName].\n\nWedług [religious_leader.GetHerHim], [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] powinien skoncentrować się na kapitale politycznym po prostu żyjąc dobrym życiem, zamiast próbować torować drogę do [religious_leader.GetFaith.PositiveAfterLife] krwią przeciwników."
 influence_child_commander_interaction: "Ćwiczenia bezpieczeństwa Warda"
