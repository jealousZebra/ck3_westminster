 fp3_demand_submission_interaction_desc: "Żądaj [recipient.GetShortUINamePossessiveNoTooltip] lojalności w formie [hook|E] poprzez wykorzystanie kapitału politycznego, podstępu lub zastraszania."
 fp3_honored_by_the_faithful_modifier_desc: "Imię tej postaci jest odczytywane podczas piątkowej modlitwy w samym miejscu przywódcy ich ideologii, zdobywając dla niej znaczący mandat jako władcy."
 fp3_not_puppeteering_kingmaker_modifier_desc: "Ta postać nie zdołała obalić nieprzyjaznego władcy z takim, który bardziej odpowiadał jej interesom. Teraz ich własny mandat jest zagrożony."
 friend_bonded_over_exam_jitters: "[CHARACTER.GetShortUIName|U] i [TARGET_CHARACTER.GetShortUIName] zbliżyli się do siebie pod presją zdawania egzaminów"
 friend_councel_and_aid: "[TARGET_CHARACTER.GetShortUIName|U] udzielił [CHARACTER.GetShortUIName] porad i pomocy, zmniejszając presję wynikającą z rządzenia."
