 dlc_015_desc: "Wprowadza nowe treści do kilku ukochanych systemów: podróże, aktywności i style życia. Wyślij swojego władcę na ekscytujące podróże, niezależnie od tego, czy w pogoni za bogactwem, prestiżem czy rozwojem osobistym. Nie pozwól, aby siedział bezczynnie — przygoda czeka na każdym kroku!"
 doctrine_imperial_anointment_desc: "Aby rządzić jako cesarz bez wątpliwości, należy uklęknąć — bo tylko najwyższy autorytet ich kościoła może nadać ostateczny, niekwestionowany mandat."
