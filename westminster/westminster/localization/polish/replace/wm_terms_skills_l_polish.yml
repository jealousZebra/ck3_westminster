 tradition_tgp_fortified_strongholds_desc: "Ta kultura charakteryzuje się wielkimi umocnionymi miastami, które pełnią funkcje religijne, militarne i rządowe. Ochrona tych kulturowych twierdz jest krytyczna, a założenie kolejnych miast jest sprawą o wysokim znaczeniu."
