 eat_cheese_effect_tt: "Im dłużej ser dojrzewał, tym mniej nacisku stracisz przy jedzeniu."
 efg_contested_wrath_desc: "Korzystanie z naszych organizatorów w celu szerzenia naszego imperialnego mandatu przeciwko rywalowi cesarzowi wzmacnia naszych wojowników i zdobywa szacunek mas."
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] osobiście nakazał moje natychmiastowe mianowanie dekretem cesarskim. Nikt nie może zakwestionować mandatu mojego nowego statusu w [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip] siły były bez szans wobec mojej przewagi w uzbrojeniu, udowadniając mój większy mandat jako obrońcy prowincji w imieniu [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_decisions_event.0007.desc: "I tym samym [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] zostały ponownie ułagodzone. Moja potęga i mandat mojej władzy zostały potwierdzone.\n\n"
 ep3_decisions_event.9010.desc: "Wdycham głęboko, i wydycham, rzucając wędkę do wody. Hak ląduje z cichym 'plusk' i świat staje się cichy. \n\n Mój wzrok wędruje wzdłuż brzegu, mając chwilę samotności, aby przemyśleć swoje myśli. Życie jako awanturnik nie jest takie złe, ale żadne życie nie jest wolne od presji. Zamykam na moment oczy, by odpocząć, gdy nagle coś wyrywa mi wędkę z rąk."
 ep3_dynasty_legacy_add_legitimacy_effect_title: "Mandat zrealizowany"
 ep3_famous_connections_modifier_desc: "Ta postać ma sławnych przyjaciół i efektywnie, ale ostrożnie wykorzystuje markę swojej drużyny."
 ep3_fireside_chat_diplomacy: "Rozmowa przy kominku: Charyzma"
 ep3_fireside_chat_intrigue: "Rozmowa przy kominku: Public Relations"
 ep3_fireside_chat_learning: "Rozmowa przy kominku: Polityka"
 ep3_fireside_chat_martial: "Rozmowa przy kominku: Bezpieczeństwo"
 ep3_fireside_chat_stewardship: "Rozmowa przy kominku: Gospodarka"
 ep3_governor_yearly.3040.a.flavor: "Taki synowski kapitał polityczny mógłby nas oboje tylko wzmocnić."
 ep3_governor_yearly.3040.desc: "Zaczynam mieć trudności z przypomnieniem sobie — czy naprawdę [emperor.GetPrimaryTitle.GetName] było tylko czystą ciemnością i chaosem zanim szlachetny [emperor.GetTitledFirstName] objął berło [emperor.GetHerHis]? \n\n Czy społecznicy marzyli o czymś innym niż dzieleniu się towarzystwem [emperor.GetHouse.GetName]? Czy nasi żołnierze wykrzykiwali jakieś brzydkie, zniekształcone imię obcego? Nasi magnaci — czy zniżyli się do całowania stóp nie stworzonych z doskonałego ciała [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip]? \n\n Naprawdę nie muszę pamiętać. Podważanie w ten sposób niezawodnego mandatu mojego suwerena byłoby daremne."
 ep3_governor_yearly.8070.desc: "Honory, profil, władza. Bycie [ROOT.Char.GetTitleAsNameNoTooltip] może przynieść te rzeczy, ale #EMP są#! koszty... \n\nGóry [ROOT.Char.Custom('GetWritingMaterial')] leżą zwinięte, czekając na mój pieczęć lub przejrzenie, podczas gdy nieskończona liczba biurokratów walczy o możliwość napełnienia moich uszu ogłupiającymi szczegółami.\n\nNikt mi nie powiedział, że będzie aż tak #EMP dużo#! pracy — a praca, która ostatecznie wydaje się robić sama siebie."
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "For decades I have walked in the footsteps of intellectuals, and have stood against the ire of men. My poetry has grown inexorably in party brand, and yet...\n\nSomething is missing. Now that my twilight years are upon me, perhaps it is time to leave [cordoba.GetName] and provide myself with a wide view of the world?\n\nAnother inextricable part of me still tugs at my heart to stay. I have built a life here for not only myself, but also the many apprentices that have been trained here over the years.\n\nWhether it's due to the scholars that stride its streets or the familiar patina of its walls, #EMP something#! keeps me tied to this city, my home."
