 investiture_crisis_desc: "Korona i pastorał stoją twarzą w twarz o to, kto jest właścicielem kluczy do Bożych stodoł; świeccy patroni obdarzają prelatów laskami i pierścieniami, podczas gdy Kościół odmawia uznania ich mandatu."
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$ co miesiąc będzie szukać chorego członka haremu i troszczyć się o niego, łagodząc jego napięcie i objawy, które go dręczą."
 kharijite_desc: "Wczesna grupa islamska wierzyła, że przywództwo powinno opierać się na kapitale politycznym, a nie pochodzeniu, i że grzeszni władcy mogą być usuwani. Pojawili się podczas powstań szyickich, odrzucili obie strony i uznali poważnych grzeszników za osoby spoza islamu."
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "Ten [modifier|E] może zostać usunięty przez [adventurer|E] odpowiedzialnego za jego rozwiązanie poprzez dyplomację, intrygę lub testy wytrzymałości."
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier_desc: "Ten [modifier|E] może zostać usunięty przez [adventurer|E] odpowiedzialnego za jego rozwiązanie poprzez dyplomację, naukę lub testy wytrzymałości."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc: "Ten [modifier|E] może zostać usunięty przez [adventurer|E] odpowiedzialnego za jego rozwiązanie za pomocą dyplomacji, walki lub testów wytrzymałości."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier_desc: "Ten [modifier|E] może zostać usunięty przez [adventurer|E] odpowiedzialnego za rozwiązanie go poprzez dyplomację, zarządzanie lub testy wytrzymałości."
 laamp_base_4021_contract_scheme: "Utwórz dzieło polityki"
 laamp_base_contract_schemes.0011.desc: "Nie jest tajemnicą, że reputacja [employer.GetTitledFirstNamePossessive] nie jest tak dobra, jak mogłaby być. Niezadowoleni posłowie z ław tylnych, niepokojące pomruki o tyranicznym zachowaniu, brak niematerialnego wizerunku — wszystkie te oznaki mogą wskazywać na słabszą kontrolę nad władzą, niż większość [employer.Custom('LadiesLords')] by chciała.\n\nOczywiście, opłacenie kogoś, kto wyjaśni takie nieporozumienia, nie będzie tanie. Przynajmniej nie, jeśli mam w tej sprawie coś do powiedzenia."
 laamp_base_contract_schemes.0331.d.tt.success: "Polityka sama w sobie jest nagrodą"
 laamp_base_contract_schemes.4042.desc: "Our time in the [employer.GetCapitalLocation.GetTitle.GetName] is immensely profitable! Trading with [employer.GetTitledFirstNamePossessive] tacit seal of approval lends a mandate to our stock that all the fast-talking in the world couldn't achieve.\n\nTalismans, medicines, baubles, and gewgaws — staff and guests buy them all, no questions asked.\n\nNot yet, at least. We'll be long gone by the time their concerns start setting in."
 laamp_boost_legitimacy_contract_contract: "Awans na Mandat"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] rządził sprawiedliwie i pobożnie, z [Localize( god )] jako [ROOT.Legend.GetProtagonist.GetHerHis] przewodnikiem. Boski plan się spełnił, [ROOT.Legend.GetProtagonist.GetSheHe] żył życiem wielkiego honoru i kapitału politycznego."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] pracował niestrudzenie dla całego [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] i walczył z poplecznikami [ROOT.Legend.GetProtagonist.GetFaith.DevilName] tutaj, na Ziemi, ale w końcu [ROOT.Legend.GetProtagonist.GetHerHis] kłopoty dobiegły końca. Boski plan został spełniony, [ROOT.Legend.GetProtagonist.GetSheHe] prowadził życie pełne wielkiej czci i kapitału politycznego."
 legend_shibi_chakravarti_desc: "Wzor pokory i kapitału politycznego, bohaterski król Shibi został zobowiązany do ochrony mędrca Agniego, który został przemieniony w ptaka. Kiedy krogulcowi nakazano poświęcić własne ciało, by ocalić gołębia, Shibi oddał całego siebie dobrowolnie, ale został oszczędzony i nagrodzony swoim synem Kapotaromą. To krew tego bezinteresownego króla płynie w żyłach każdego [GetDynastyByID('1043008').GetNameNoTooltip]."
 legendary_conversion_desc: "Legendarna opowieść o kapitale politycznym i oddaniu ogarnęła serca wszystkich w partii. Przy odrobinie zachęty, niewierzący w partii mogliby być zachęceni do czczenia w taki sposób, jak ja."
 legendary_holy_war_desc: "Moja legendarna opowieść o politycznym kapitale dobiegła końca, i choć jest chwalona przez wiernych, niewiele zrobiła, by przekonać niewierzących. Musimy nadal szerzyć nasze pokojowe drogi w jedyny znany nam sposób: mieczem."
 legendary_integration_d_desc: "W całej partii opowiadane są legendy, które umacniają moją władzę. Ten nowo zdobyty mandat może zostać wykorzystany do rozszerzenia tego, co uważa się za podstawowe terytorium mojej partii i wymagać wiecznej lojalności historycznie obcego księcia."
