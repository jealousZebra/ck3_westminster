 court_warlike_desc: "#low Okazanie siły jest jedynym sposobem, aby budzić podziw i szacunek! Nasi organizatorzy i żołnierze są znani ze swoich zdolności. \n\nPracownicy zdobywają cechy [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
