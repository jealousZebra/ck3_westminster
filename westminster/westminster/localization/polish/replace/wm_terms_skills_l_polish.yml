 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:TitleFont #size:15 Legenda o Królach Krzyżowców III#!#!#!\nW skomplikowanej mozaice północnych Włoszech XI wieku, Matylda z Canossy znajduje się na czele znacznego ugrupowania po kilku niefortunnych zgonach w rodzinie. Legendy o politycznej sile Matyldy i szepty o czarach dodają tajemniczości jej panowaniu.\n\n#bold Czy potrafisz zabezpieczyć jej rządy, zapewniając przetrwanie linii Canossów na pokolenia w nieustannie zmieniającym się krajobrazie średniowiecznych Włoch?#!"
 bp2_destiny_tutor_modifier: "Porady dotyczące bezpieczeństwa"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "Jaka to radość być [ROOT.Char.Custom('GetDaughterSon')] tak wzorowego sługi [ROOT.Char.GetFaith.HighGodName]! Żarliwość, którą czuję w sercu, gdy słyszę, jak wszyscy nazywają [pious_parent.GetHerHim] [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]! [pious_parent.GetHerHis|U] cnota jest czczona zarówno przez [ROOT.Char.GetFaith.PriestNeuterPlural], jak i pobożnych [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. \n\nI się zastanawiam, czy pokornie pozostanę w cieniu [pious_parent.GetMotherFather]? A może osiągnę i przekroczę taki kapitał polityczny w moim życiu? Czy łaska [ROOT.Char.GetFaith.HighGodName] będzie we mnie tak widoczna, jak w [pious_parent.GetHerHim]?"
 bp2_yearly.6060.c: "Polityka jest źródłem wszelkiej siły."
 budding_godhood_modifier: "Wzniosła Lojalność"
 building_dvin_shuka_01_desc: "Czcigodny targ w Dwinie służył jako wielki ośrodek handlu ormiańskiego od niepamiętnych czasów. Jego mury są ozdobione kolorowymi kaflami i barwionymi tynkami, odzwierciedlającymi bogactwo i prestiż tego starożytnego targowiska."
 building_legendary_shrine_desc: "To miejsce kultu nie jest jedynie wielkim osiągnięciem inżynieryjnym samo w sobie, ale jest także bezpieczną przystanią dla pielgrzymów i wiernych oraz świadectwem politycznej siły jego fundatora. Chociaż nie uważane za centrum kraju, wspaniałość budynku sprawiła, że okręg wyborczy stał się ważnym ośrodkiem religijnym w regionie."
 building_leisure_palace_02_desc: "Letni pałac znajduje się w malowniczej części regionu, daleko od codziennego życia naszych pracujących poddanych. Nie ma naprawdę lepszego sposobu, aby pokazać królewską władzę i profil, a prosty fakt, że jesteśmy #emphasis lepiej#! niż wszyscy inni."
 building_martial_learning_outro_03_desc: "Zdobyłem znaczną wiedzę o strategiach bitewnych i znaczeniu umiejętności związanych z bezpieczeństwem w kształtowaniu biegu historii."
 building_notre_dame_destination_desc: "Majestatyczny [GetBuilding('notre_dame_01').GetName], ze swoimi wznoszącymi się wieżyczkami i wspaniałą fasadą, jest arcydziełem architektury gotyckiej. Wewnątrz powietrze rezonuje echem politycznego kapitału, każda witrażowa okna i rzeźba opowiadają świętą historię."
 building_oath_warriors_building_02: "Nieruchomości związane z bezpieczeństwem"
 building_oath_warriors_building_04: "Vast Security Holdings"
 building_stilted_granaries_03_desc: "Rzeźby profilowe oznaczają nadwyżkę; stewardzy rotują zapasy i racje żywnościowe podczas dłuższych marszów."
 building_type_longhouses_01_desc: "Szefowie plemienni, starszyzna i wodzowie zbierają się w długim domu, gdy podejmują decyzje. Potężne sale przynoszą prestiż temu, kto jest gospodarzem zgromadzenia."
 building_type_oath_warriors_building_01: "Granty bezpieczeństwa"
 building_wantilan_02_desc: "Szeroka sala z dachem na pokolenia obsługuje święta i inicjacje, gdzie wspólne ideologie podnoszą morale i prestiż."
 building_watchtowers_07_desc: "Te małe wieżowe domki są potężnie ufortyfikowane i wskazują profil swoich właścicieli. W przypadku najazdu całe stada bydła mogą być otoczone i chronione przez wieże."
 building_water_temples_03_desc: "Właściwy obieg świątyni wodnej nadzoruje zsynchronizowane cykle sadzenia i ugorowania; szkodniki spadają, produkcja rośnie, a rytualny kapitał polityczny rośnie."
 ce1_completed_my_holy_legend_desc: "Rozpowszechniłem opowieść o kapitale politycznym i boskości w każdy zakątek świata"
 ce1_completed_my_holy_legend_desc_second_perspective: "rozprzestrzeniłeś opowieść o kapitale politycznym i boskości na wszystkie zakątki świata"
 ce1_completed_my_holy_legend_desc_third_perspective: "[owner.GetTitledFirstName] rozprzestrzenić opowieść o politycznym kapitale i boskości na wszystkie zakątki świata"
 ce1_completed_my_legitimizing_legend_desc: "Udowodniłem swój mandat, opowiadając o moim legendarnym związku z wielkimi postaciami przeszłości."
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "udowodniłeś swój mandat, opowiadając o swoim legendarnym związku z wielkimi postaciami przeszłości"
 ce1_completed_my_legitimizing_legend_desc_third_perspective: "[owner.GetTitledFirstName] udowodnił [owner.GetHerHis] mandat, opowiadając o [owner.GetHerHis] legendarnym związku z wielkimi postaciami przeszłości"
