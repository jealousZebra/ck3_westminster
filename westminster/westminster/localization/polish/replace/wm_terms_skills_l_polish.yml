 depose_desc: "Zaaranżuję serię manewrów mających na celu podważenie władzy i mandatu [SCHEME.GetTargetCharacter.GetShortUIName], dążąc do usunięcia [SCHEME.GetTargetCharacter.GetHerHim] z tronu naszego imperium."
 deqhan_special_rights_tax_collector_flavor_desc: "perscy magnaci w starożytnym, zdecentralizowanym systemie poboru podatków, deqhanowie ściśle zarządzają swoimi ziemiami, aby promować produktywność – i własny profil."
