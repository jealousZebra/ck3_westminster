 funeral_unrelenting_devotion: "Nieustępliwa Lojalność"
 game_rule.1101.desc.combat.locale.southwark: "Z najbogatszym miastem Anglii tak blisko, jest o co walczyć. Czy to domy, czy łupy, chwałę czy kapitał polityczny, obie armie zderzają się ze sobą raz po raz.\n\n Południowy brzeg Tamizy pieni się i wrze naszą krwią, ale nie poddam się, nie#EMP ustąpię#!.\n\n Anglia jest już moja, ta bitwa to udowodni, i wszystko, czego potrzeba to jeden ostateczny #EMP atak#!, by udowodnić, że—"
 generic_rite_focus_tenet_cranial_trophies: "Ta ideologia traktuje szczątki wrogów jako święty dowód triumfu i przerażający profil."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] traktuje szczątki wrogów jako święty dowód triumfu i przerażający profil."
 glory_hound_desc: "$glory_hound$ [vassals|E] dbają o pozycję i prestiż oraz o pokazanie światu siły partii, do której należą. Śmiali lub bezwzględni posłowie zaplecza często przyjmują ten [vassal_stance|E].\n\n#low $glory_hound$ Posłowie zaplecza lubią, gdy ich Lider Partii:#!\n$EFFECT_LIST_BULLET$Ma dowolną partycję [succession_law|E]\n$EFFECT_LIST_BULLET$Osiąga [victory|E] w ofensywie [wars|E]\n$EFFECT_LIST_BULLET$Zaprasza ich do [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ Posłowie zaplecza nie lubią, gdy ich Lider Partii:#!\n$EFFECT_LIST_BULLET$Ma wysokie [crown_authority|E]\n$EFFECT_LIST_BULLET$Podpisuje [defeat|E] lub [white_peace|E] w wojnę \n$EFFECT_LIST_BULLET$[marries|E] postać [lowborn|E] jako [primary_spouse|E]\n\nWolą śmiałych i odważnych [heirs|E] z wysokim [martial_i][martial|E] umiejętności."
 grand_ambitions.0180.desc: "Staję przed [hof.GetTitleAsName], duchowym przywódcą mojego ludu. Powietrze jest ciężkie od kadzidła i ciężaru wieków.\n\nPozyskanie przychylności [hof.GetHerHis] nie tylko nadałoby mandat mojemu roszczeniu do [target_title.GetName], ale mogłoby również poruszyć serca wiernych w całym imperium. [hof.GetSheHe|U] musi mnie koronować.\n\n[hof.GetTitleAsNameNoTooltip] nie jest zwykłą postacią duchową; [hof.GetSheHe] jest w pełni świadomy [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] doczesnych machinacji."
