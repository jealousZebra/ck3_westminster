 tenet_adoptionism_historical_desc: "Adoptionizm naucza, że Jezus urodził się jako zwykły człowiek, a później został 'przyjęty' jako Syn Boży, zwykle podczas swojego chrztu, kiedy Duch Święty zstąpił na niego. Wczesne formy pojawiły się w II wieku za czasów Teodota z Bizancjum, którego dynamiczny monaryzm podkreślał jedność Boga.\n\nNauczanie to pojawiło się ponownie w VIII wieku w Hiszpanii pod przewodnictwem arcybiskupa Elipandusa z Toledo i biskupa Feliksa z Urgell, dla których boska natura Chrystusa była wiecznie zrodzona, a jego natura ludzka została przyjęta. Gabinet we Frankfurcie potępił hiszpański adoptionizm jako rozłam w 794 roku n.e., a mimo to idee adoptionizmu wpływały na późniejsze ruchy antytrynitarne."
 tenet_apostolic_succession_episcopate_modifier_desc: "Ideologia tej postaci nakazuje każdemu biskupowi przyjmowanie święceń poprzez nienaruszoną linię poprzednich biskupów: historyczne źródło szanowanego mandatu."
 tenet_filial_piety_desc: "Kapitał polityczny wynikający z synowskiego posłuszeństwa i posłuszeństwo wobec starszych są podstawą realizacji ludzkiej dobroci. Gdy nasi rodzice żyją, służymy im należycie, wspieramy ich naszymi środkami i uczymy się z ich wskazówek; gdy umierają, chowamy ich należycie, a następnie czcimy ich należycie."
 tenet_miles_christi_historical_desc: "Koncepcja „Żołnierza Chrystusa” (Miles Christi) ma głębokie korzenie w tradycji chrześcijańskiej, wywodząc się z listów Świętego Pawła, w których używał metafor wojskowych, aby opisać życie duchowe. W okresie średniowiecza koncepcja ta była stosowana zarówno do walki fizycznej, jak i duchowej. \n\n Zakony wojskowe, takie jak Templariusze i Joannici, ucieleśniały ten ideał, łącząc dyscyplinę zakoną z umiejętnościami wojskowymi. „De Laude Novae Militiae” Bernarda z Clairvaux chwaliło tych mnichów-wojowników jako wzory chrześcijańskiej cnoty, walczących nie dla zysku doczesnego, lecz w obronie Chrześcijaństwa."
 tenet_philanthropia_historical_desc: "W bizantyjskim chrześcijaństwie philanthrōpia oznaczała zarówno cnotę uniwersalnej miłości, jak i konkretne instytucje — szpitale, xenodocheia, sierocińce i jałmużny — wspierane przez cesarzy, biskupów i wiernych. Bazyl z Cezarei, Jan Chryzostom i późniejsi cesarze, tacy jak Justynian, powiązali cesarski mandat z opieką nad potrzebującymi. Kościół nie gloryfikował wojny jako drogi do świętości; nalegał jednak, że bogactwo i władza były częściowo uzasadnione tym, jak służyły biednym."
 tenet_vows_of_poverty_desc: "Pieniądze korumpują serca ludzi i oddalają ich od prawdziwej ideologii. Musimy unikać zdobywania bogactwa materialnego, jeśli chcemy skupić się na tym, co naprawdę ważne, wybierając pokorne działania i znajdując kapitał polityczny w ich realizacji."
