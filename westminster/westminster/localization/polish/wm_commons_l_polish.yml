l_polish:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "Wprowadzić ustawę"
 wm_commons_introduce_bill_decision_desc: "Przedstawić rządowy projekt ustawy Izbie Gmin. Szefowie będą liczyć głowy, posłowie z tylnych ław będą narzekać, a za tydzień Izba się podzieli."
 wm_commons_introduce_bill_decision_tooltip: "Poddać rządowy projekt ustawy pod głosowanie w Izbie Gmin"
 wm_commons_introduce_bill_decision_effect_tt: "Wybierz ustawę. Izba głosuje nad nią tydzień później."
 wm_commons_no_confidence_decision: "wniosek o wotum nieufności"
 wm_commons_no_confidence_decision_desc: "Jako lider opozycji złóż wniosek, że ta Izba nie ma zaufania do rządu Jego Królewskiej Mości. Jeśli rząd przegra, muszą odbyć się wybory powszechne."
 wm_commons_no_confidence_decision_tooltip: "Spróbuj obalić rząd"
 wm_commons_no_confidence_decision_effect_tt: "Izba głosuje nad wnioskiem w ciągu tygodnia. Jeśli zostanie przyjęty, muszą się odbyć #bold wybory powszechne #!. Jeśli nie przejdą, stracisz twarz, a premier tego nie zapomni."
 wm_commons_house_free_desc: "Żaden inny projekt ustawy ani wniosek nie oczekuje na głosowanie w Izbie Gmin"
 wm_commons_no_election_pending_desc: "Rząd nie został jeszcze zmuszony do przeprowadzenia wyborów powszechnych"
 wm_commons_leader_of_opposition_desc: "Kierujesz największą partią spoza rządu"

 # Bills
 wm_commons_bill_1_name: "#bold Ustawa Finansowa#!"
 wm_commons_bill_2_name: "#bold Ustawa o Usługach Publicznych#!"
 wm_commons_bill_3_name: "#bold Ustawa o Reformie Służby Publicznej#!"
 wm_commons_bill_4_name: "#bold Ustawa o Nadzwyczajnych Pełnomocnictwach#!"
 wm_commons_bill_5_name: "#bold Wniosek o wotum nieufności wobec rządu Jego Królewskiej Mości #!"
 wm_commons_bill_1_desc: "\n\nThe #bold Finance Bill#! puts up taxes to balance the books. The party's right wing hates it; the left can live with it."
 wm_commons_bill_2_desc: "\n\nThe #bold Public Services Bill#! puts more money into schools and hospitals. It is popular, and the left wing loves it; the right wing worries about the cost."
 wm_commons_bill_3_desc: "\n\nThe #bold Public Service Reform Bill#! shakes up how public services are run. The right wing has wanted it for years. The left wing calls it a betrayal, and some of them are threatening to vote against."
 wm_commons_bill_4_desc: "\n\nThe #bold Emergency Powers Bill#! gives ministers sweeping powers to deal with the crisis. Nobody likes it much, but in a crisis the country expects Parliament to act."
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName], jako lider opozycji, zgłosił #bold wotum nieufności#! wobec rządu. Jeśli zostanie przyjęte, musi odbyć się wybory powszechne."

 wm_commons.1.t: "Program Legislacyjny"
 wm_commons.1.desc: "Lider Izby chce wiedzieć, co rząd przedstawi Izbie Gmin jako następne. Urzędnicy państwowi przygotowali kilka ustaw, z których każda ma swoich przyjaciół i wrogów na naszych ławach."
 wm_commons.1.a: "Projekt ustawy finansowej: podatki muszą wzrosnąć."
 wm_commons.1.a.tt: "Jeśli uchwalono: pieniądze dla rządu i podwyżka podatków, ale sondaże tego nie polubią. Prawa strona #bold partii#! może zbuntować się."
 wm_commons.1.b: "Projekt ustawy o usługach publicznych: więcej pieniędzy na szkoły i szpitale."
 wm_commons.1.b.tt: "Jeśli uchwalono: popularny, i korzystny dla sondaży, ale kosztuje pieniądze przez lata. Prawa strona #bold partii#! może narzekać."
 wm_commons.1.c: "Reforma służby publicznej: czas na prawdziwe zmiany."
 wm_commons.1.c.tt: "Jeśli uchwalono: mandat i reputacja reformatora. #bold Kontrowersyjny#!: lewica #bold partii#! może zbuntować się liczebnie."
 wm_commons.1.d: "Ustawa o Nadzwyczajnych Uprawnieniach: kraj jej potrzebuje."
 wm_commons.1.d.tt: "Jeśli uchwalono: profil i mandat. Opozycja może go wesprzeć."
 wm_commons.1.e: "Na razie nic."

 # The whips
 wm_commons.2.t: "Raport Głównego dyscyplinującego"
 wm_commons.2.t_confidence: "Wniosek o wotum nieufności"
 wm_commons.2.desc_bill: "Główny dyscyplinujący liczył głosy w pokoju herbacianym."
 wm_commons.2.desc_confidence: "Opozycja wniosła wniosek o odsunięcie rządu, a Główny Dyscyplinariusz jest już w moim biurze."
 wm_commons.2.numbers: "\n\nMamy #bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#! posłów; na innych ławach jest [EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0]. Główny Dyscyplinator szacuje, że około #bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#! naszych może zbuntować się lub nie być obecnych."
 wm_commons.2.opposition_backs: "Ławka kierownicza opozycji powiedziała, że nas poprze."
 wm_commons.2.no_opposition_help: "Opozycja będzie głosować przeciw."
 wm_commons.2.a: "Zostaw to w rękach szpicli partyjnych."
 wm_commons.2.b: "Wydać trzylinijkowy nakaz. Moja władza jest zagrożona."
 wm_commons.2.c: "Wezwij niezdecydowanych, jednego po drugim. Każdy okręg potrzebuje czegoś."
 wm_commons.2.d: "Oferuj ustępstwa."
 wm_commons.2.d.tt: "Mniej posłów buntuje się, ale ustawa jest #bold rozwodniona#!: robi tylko około połowy, jeśli zostanie uchwalona."
 wm_commons.2.e: "Wycofaj ustawę, zanim zostanie odrzucona."

 # The result
 wm_commons_headline_government_falls: "UPADEK RZĄDU"
 wm_commons_headline_pm_survives: "PREMIER PRZETRWAŁ GŁOSOWANIE NAD WOTUM ZAUFANIA"
 wm_commons_headline_humiliation: "UPOKORZENIE DLA NUMERU 10"
 wm_commons_headline_defeated: "RZĄD POKONANY"
 wm_commons_headline_knife_edge: "NA KRAWĘDZI: RZĄD Z TRUDNOŚCIĄ UTRZYMUJE WIĘKSZOŚĆ"
 wm_commons_headline_revolt: "USTAWA ZOSTAŁA PRZYJĘTA MIMO BUNTU POSŁÓW Z TYLNYCH ŁAW"
 wm_commons_headline_comfortable: "KONFORTOWA WIĘKSZOŚĆ"
 wm_commons_headline_passed: "USTAWA ZOSTAŁA PRZYJĘTA"

 wm_commons.4.lobbies: "\n\nThe division lobbies: #bold Ayes [EmptyScope.ScriptValue('wm_commons_ayes_value')|0], Noes [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!. [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] MPs did not vote."
 wm_commons.4.rebels: "#bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! rządowi posłowie zignorowali dyscyplinę partyjną."
 wm_commons.4.no_rebels: "Żaden rządowy poseł nie zignorował dyscypliny partyjnej."
 wm_commons.4.outcome_government_falls: "\n\nThe House has no confidence in [wm_commons_pm.GetName]'s government. There must be a #bold general election#!."
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] przeżywa dzięki [EmptyScope.ScriptValue('wm_commons_majority_value')|0] głosom, a opozycja jest zawstydzona."
 wm_commons.4.outcome_defeated: "\n\nThe bill falls, defeated by [EmptyScope.ScriptValue('wm_commons_majority_value')|0] votes. [wm_commons_pm.GetName] has lost control of the House."
 wm_commons.4.outcome_passed_watered_down: "\n\nThe bill passes with a majority of [EmptyScope.ScriptValue('wm_commons_majority_value')|0], but only after the government gave ground on almost everything."
 wm_commons.4.outcome_passed: "\n\nThe bill passes with a majority of [EmptyScope.ScriptValue('wm_commons_majority_value')|0]."
 wm_commons.4.a: "Porządek, porządek!"
 wm_commons.4.a_pm: "Przejdźmy do następnego."

 # The division bell
 wm_commons.5.t: "Dzwon podziału"
 wm_commons.5.desc: "Dzwon dywizji rozbrzmiewa w całym Pałacu Westminsterskim. Za kilka minut Izba głosuje."
 wm_commons.5.whip_none: "\n\nBez dyscypliny partyjnej mogę głosować, jak chcę."
 wm_commons.5.whip_abstain: "\n\nMy party doesn't take its seats at Westminster. I won't be voting."
 wm_commons.5.whip_government: "\n\nThe whips want every one of us in the lobby #bold with the government#!. Rebels will be remembered."
 wm_commons.5.whip_opposition_backs: "\n\nOur front bench is backing the government on this one, and the whips expect me to follow."
 wm_commons.5.whip_opposition: "\n\nOur whips want me in the lobby #bold against the government#!."
 wm_commons.5.wing_left: "Siedzę w #bold lewicy#! mojej partii."
 wm_commons.5.wing_right: "Siedzę w #bold prawicy#! mojej partii."
 wm_commons.5.wing_centre: "Siedzę w #bold centrum#! mojej partii."
 wm_commons.5.a: "Głosuj z rządem."
 wm_commons.5.b: "Głosuj przeciwko rządowi."
 wm_commons.5.c: "Trzymaj się z daleka i powstrzymaj się."

 wm_commons_whip_withdrawn_toast: "Wycofanie bata"
 wm_commons_whip_withdrawn_toast_desc: "Po zbyt częstym buntowaniu się, [wm_commons_whipless.GetName] stracił dyscyplinę partyjną i obecnie zasiada jako niezależny."

 # Modifiers
 wm_commons_tax_rise_modifier: "Podwyżka podatków"
 wm_commons_tax_rise_modifier_desc: "Ustawa Finansowa podniosła podatki. Pieniądze napływają i wyborcy to zauważyli."
 wm_commons_public_services_modifier: "Wydatki na usługi publiczne"
 wm_commons_public_services_modifier_desc: "Więcej pieniędzy na szkoły i szpitale: popularne i drogie."
 wm_commons_reformer_modifier: "Reformator"
 wm_commons_reformer_modifier_desc: "Przeprowadził kontrowersyjną reformę przez Izbę Gmin."
 wm_commons_emergency_powers_modifier: "Uprawnienia nadzwyczajne"
 wm_commons_emergency_powers_modifier_desc: "Parlament przyznał rządowi szerokie uprawnienia do radzenia sobie z kryzysem."
 wm_commons_defeated_in_commons_modifier: "Pokonany w Izbie Gmin"
 wm_commons_defeated_in_commons_modifier_desc: "Projekt ustawy rządowej został odrzucony przez Izbę Gmin."
 wm_commons_lost_confidence_modifier: "Stracił zaufanie Izby"
 wm_commons_lost_confidence_modifier_desc: "Izba Gmin zagłosowała, że nie ma zaufania do tego rządu."

 # Opinions
 wm_commons_defied_whip_opinion: "Sprzeciwiłem się bicowi"
 wm_commons_whip_withdrawn_opinion: "Cofnął ze mnie bat"
 wm_commons_tabled_no_confidence_opinion: "Próbował obalić mój rząd"
 wm_commons_introduce_bill_decision_confirm: "Złóż to do Domu"
 wm_commons_no_confidence_decision_confirm: "Złóż wniosek"
