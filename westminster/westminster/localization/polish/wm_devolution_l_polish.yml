l_polish:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "Przeczytaj briefing dotyczący decentralizacji"
 wm_devolution_briefing_decision_desc: "Cotygodniowa nota Biura Gabinetu na temat stanu Unii:\n\n#bold Szkocja:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% popiera niepodległość; uprawnienia [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] z 10\n#bold Walia:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% popiera niepodległość; uprawnienia [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] z 10\n#bold Irlandia Północna:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% popiera zjednoczoną Irlandię; uprawnienia [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] z 10; stabilność podziału władzy [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] z 100\n\n#bold Zaufanie publiczne do polityki:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] z 100."
 wm_devolution_briefing_decision_tooltip: "Gdzie stoi Związek i na ile publiczność ufa jego politykom."
 wm_devolution_briefing_decision_confirm: "Przeczytaj"
 wm_devolution.30.t: "Stan Unii"
 wm_devolution.30.desc: "#italic Cabinet Office, for circulation#!\n\n#bold Scotland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10\n#bold Northern Ireland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% back a united Ireland; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10; power-sharing stability [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] of 100\n\nSupport for leaving drifts with the public's trust in Westminster, with powers clawed back or handed over, and with who runs each devolved government. Once it passes half, a nationalist-led government can formally ask for a referendum.\n\n#bold Public trust in politics:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] of 100; expected turnout at a general election [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%."
 wm_devolution.30.suspended: "\n\n#N Zawieszono Zgromadzenie Irlandii Północnej:#! podział władzy upadł, a tylko rozmowy (lub czas) mogą go przywrócić."
 wm_devolution.30.sitting: "\n\nThe Northern Ireland Assembly is sitting, and power-sharing holds."
 wm_devolution.30.a: "Zanotowane."
 wm_devolution_devolve_decision: "Przekazać władzę"
 wm_devolution_devolve_decision_desc: "Przekaż inną władzę do Edynburga, Cardiff lub Belfastu. Więcej uprawnień odbiera napięcie sprawie dotyczącej wyjścia i zadowala rząd zdecentralizowany.\n\n#bold Szkocja:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% popiera niepodległość; uprawnienia [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] z 10\n#bold Walia:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% popiera niepodległość; uprawnienia [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] z 10\n#bold Irlandia Północna:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% popiera zjednoczoną Irlandię; uprawnienia [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] z 10; stabilność współdzielenia władzy [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] ze 100"
 wm_devolution_devolve_decision_tooltip: "Nadać zdecentralizowanemu rządowi więcej uprawnień."
 wm_devolution_devolve_decision_confirm: "Wybierz naród"
 wm_devolution_devolve_decision_effect_tt: "Wybierz naród: jego uprawnienia wzrastają o 1, poparcie dla wyjścia spada o #P 3#! (i osiada niżej), jego Pierwszy Minister jest zadowolony, a zaufanie społeczne rośnie o 1."
 wm_devolution_claw_back_decision: "odzyskać moc"
 wm_devolution_claw_back_decision_desc: "Take a power back to Westminster. The unionist papers will cheer; the devolved government and its voters will not.\n\n#bold Scotland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10\n#bold Northern Ireland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% back a united Ireland; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10; power-sharing stability [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] of 100"
 wm_devolution_claw_back_decision_tooltip: "Zwrócić władzę zdecentralizowaną do Westminsteru."
 wm_devolution_claw_back_decision_confirm: "Wybierz naród"
 wm_devolution_claw_back_decision_effect_tt: "Wybierz naród: jego uprawnienia spadają o 1, poparcie dla odejścia rośnie #N 3#! (i osiada wyżej), jego Pierwszy Minister jest wściekły, zaufanie społeczne spada o 2, a ty zyskujesz trochę rozpoznawalności."
 wm_devolution_stormont_talks_decision: "Zwołaj rozmowy w Stormont"
 wm_devolution_stormont_talks_decision_desc: "Podział władzy w Irlandii Północnej upadł. Zbierz strony do stołu intensywnych rozmów: umowa przywraca Zgromadzenie. Twoje szanse wzrastają dzięki twojej charyzmie i stabilności podziału władzy (obecnie [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100)."
 wm_devolution_stormont_talks_decision_tooltip: "Spróbuj przywrócić podział sił w Stormont."
 wm_devolution_stormont_talks_decision_confirm: "Zwołać rozmowy"
 wm_devolution_stormont_talks_decision_effect_tt: "Sukces przywraca Zgromadzenie, podnosi zaufanie społeczne o 2 i zapewnia ci rozpoznawalność. Porażka nadal zbliża strony (+5 stabilności)."
 wm_devolution.1.t: "Wniosek o Referendum"
 wm_devolution.1.desc: "[wm_dev_gov.GetNameNoTier] formalnie zwrócił się do Westminster o uprawnienie do przeprowadzenia referendum w sprawie opuszczenia Zjednoczonego Królestwa. Własne sondaże wskazują wsparcie na poziomie [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%, a partia twierdzi, że mandat jest jasny.\n\nŁawice unionistów chcą zdecydowanego „nie”. Twoi doradcy nie są tego tacy pewni."
 wm_devolution.1.a: "Zgodzić się na referendum."
 wm_devolution.1.a.tt: "Dzień wyborów za sześć miesięcy. Wynik zależy od poparcia wtedy, plus minus kilka punktów. Tak byłoby katastrofą dla ciebie."
 wm_devolution.1.b: "Teraz nie jest na to czas."
 wm_devolution.1.b.tt: "Poparcie dla odejścia rośnie o #N 4 punkty #!, a Premier ma do ciebie urazę. Mogą poprosić ponownie za trzy lata."
 wm_devolution.1.c: "Zamiast tego zaproponować więcej mocy."
 wm_devolution.1.c.tt: "Naród zyskuje moc, a poparcie spada o #P 3#! punktów, przy niewielkim koszcie w profilu. Mogą ponownie pytać za trzy lata."
 wm_devolution.20.t: "Przekazywanie władzy"
 wm_devolution.20.desc: "Który rząd zdecentralizowany otrzymuje nowe uprawnienia?"
 wm_devolution.20.scotland: "Przekazać władzę Szkocji (władze [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] na poziomie 10)."
 wm_devolution.20.wales: "Przekazać władzę Walii (władze [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] na poziomie 10)."
 wm_devolution.20.northern_ireland: "Przekazać władzę Irlandii Północnej (władze [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] na poziomie 10)."
 wm_devolution.20.none: "Po przemyśleniu, nie teraz."
 wm_devolution.21.t: "Odzyskanie kontroli"
 wm_devolution.21.desc: "Który rząd zdecentralizowany traci uprawnienie na rzecz Westminsteru?"
 wm_devolution.21.scotland: "Odzyskać Szury ze Szkocji (moce [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10)."
 wm_devolution.21.wales: "Claw back od Walii (moce [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10)."
 wm_devolution.21.northern_ireland: "Odzyskać z Irlandii Północnej (moce [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10)."
 wm_devolution.21.none: "Po przemyśleniu, nie teraz."
 wm_dev_referendum_agreed_toast: "REFERENDUM UZGODNIONO"
 wm_dev_referendum_agreed_toast_desc: "Westminster zgodził się na prośbę [wm_dev_gov.GetNameNoTier]: referendum w sprawie opuszczenia Zjednoczonego Królestwa odbędzie się za sześć miesięcy."
 wm_dev_referendum_refused_toast: "REFERENDUM ODRZUCONE"
 wm_dev_referendum_refused_toast_desc: "Westminster odrzucił prośbę [wm_dev_gov.GetNameNoTier] o referendum. Wzrost poparcia dla opuszczenia."
 wm_dev_referendum_powers_toast: "WIĘCEJ MOCY ZAMIAST TEGO"
 wm_dev_referendum_powers_toast_desc: "Westminster odpowiedział na prośbę [wm_dev_gov.GetNameNoTier] o referendum ofertą nowych uprawnień."
 wm_dev_stormont_collapse_toast: "UPADK STORMONTU"
 wm_dev_stormont_collapse_toast_desc: "Dzielenie się władzą w Irlandii Północnej upadło i Zgromadzenie jest zawieszone. Zaufanie publiczne doznało uszczerbku."
 wm_dev_stormont_restored_toast: "PRZYWRÓCENIE STORMONTU"
 wm_dev_stormont_restored_toast_desc: "Zawarcie umowy i powrót podziału władzy do Irlandii Północnej."
 wm_dev_stormont_talks_failed_toast: "NIEPOWODZENIE ROZMÓW W STORMONCIE"
 wm_dev_stormont_talks_failed_toast_desc: "Rozmowy przerwano bez porozumienia, choć strony są bliżej niż były wcześniej."
 wm_dev_referendum_yes_toast_scotland: "SZKOCJA GŁOSUJE TAK"
 wm_dev_referendum_yes_toast_scotland_desc: "Szkocja zagłosowała za niepodległością, z wynikiem [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Rozpoczynają się negocjacje dotyczące odejścia z Zjednoczonego Królestwa, a autorytet Premiera zostaje zniszczony."
 wm_dev_referendum_no_toast_scotland: "SZKOCJA GŁOSUJE NIE"
 wm_dev_referendum_no_toast_scotland_desc: "Szkocja odrzuciła niepodległość: tylko [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% głosowało na tak. Sprawa jest rozstrzygnięta na jedno pokolenie, przynajmniej tak ma nadzieję Westminster."
 wm_dev_referendum_yes_toast_wales: "WALIA GŁOSUJE TAK"
 wm_dev_referendum_yes_toast_wales_desc: "Walia zagłosowała za niepodległością Walii, z wynikiem [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Rozpoczynają się negocjacje dotyczące opuszczenia Zjednoczonego Królestwa, a autorytet Premiera zostaje zniszczony."
 wm_dev_referendum_no_toast_wales: "WALIA GŁOSUJE NIE"
 wm_dev_referendum_no_toast_wales_desc: "Walia odrzuciła niepodległość Walii: tylko [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% zagłosowało 'Tak'. Pytanie jest rozstrzygnięte na pokolenie, przynajmniej na takiej nadziei opiera się Westminster."
 wm_dev_referendum_yes_toast_northern_ireland: "IRLANDIA PÓŁNOCNA GŁOSUJE NA TAK"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "Irlandia Północna zagłosowała za zjednoczoną Irlandią, wynikiem [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Rozpoczynają się negocjacje dotyczące opuszczenia Zjednoczonego Królestwa, a autorytet Premiera zostaje zniszczony."
 wm_dev_referendum_no_toast_northern_ireland: "IRLANDIA PÓŁNOCNA GŁOSUJE PRZECIWKO"
 wm_dev_referendum_no_toast_northern_ireland_desc: "Irlandia Północna odrzuciła zjednoczoną Irlandię: tylko [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% zagłosowało Tak. Kwestia ta jest rozstrzygnięta na pokolenie, przynajmniej na to liczy Westminster."
 wm_dev_assembly_suspended_modifier: "Zawieszenie Zgromadzenia"
 wm_dev_assembly_suspended_modifier_desc: "Dzielenie się władzą upadło i Zgromadzenie Irlandii Północnej jest zawieszone."
