l_polish:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "Lewica Partii Pracy"
 wm_wing_badge_1_desc: "Członek socjalistycznego lewicy partii: własność publiczna, prawa związków zawodowych i wydatki. (Skrzydło prawdziwego posła w tej grze jest losowe, nie jest wyrazem jego poglądów.)"
 wm_wing_badge_2: "Lewica umiarkowana"
 wm_wing_badge_2_desc: "Członek miękkiej lewicy partii: krytyczni przyjaciele przywództwa, z zapałem do usług publicznych. (Skrzydło prawdziwego posła w tej grze jest losowe, nie jest wyrazem jego poglądów.)"
 wm_wing_badge_3: "Centryści Partii Pracy"
 wm_wing_badge_3_desc: "Członek centrowego skrzydła partii: ostrożność fiskalna, reforma usług publicznych, przede wszystkim zdolność do wyborów. (Skrzydło prawdziwego posła w tej grze jest losowe, nie jest wyrazem jego poglądów.)"
 wm_wing_badge_4: "Jeden Naród"
 wm_wing_badge_4_desc: "Członek partii reprezentujący One Nation: pragmatyczny, pro-usług publicznych. (Skrzydło prawdziwego posła w tej grze jest losowe, nie stanowi wyrażenia jego poglądów.)"
 wm_wing_badge_5: "zwolennicy wolnorynkowego rynku"
 wm_wing_badge_5_desc: "Członek wolnorynkowego skrzydła partii: niższe podatki, mniejszy państwo, deregulacja. (Skrzydło prawdziwego posła w tej grze jest losowe, nie jest wyrazem jego poglądów.)"
 wm_wing_badge_6: "Tradycjonaliści"
 wm_wing_badge_6_desc: "Członek tradycjonalistycznego skrzydła partii: prawo i porządek, instytucje, tożsamość narodowa. (Skrzydło prawdziwego posła w tej grze jest losowe, nie jest wyrazem jego poglądów.)"
 wm_wing_court_decision: "Sąd skrzydło partyjne"
 wm_wing_court_decision_desc_labour: "How the Parliamentary Labour Party's wings feel about their leader (out of 100):\n#bold Labour Left#! ([EmptyScope.ScriptValue('wm_ui_wing_size_1')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold Soft Left#! ([EmptyScope.ScriptValue('wm_ui_wing_size_2')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold Labour Centrists#! ([EmptyScope.ScriptValue('wm_ui_wing_size_3')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\nCourting a wing costs #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! profile: it gains 15 approval, the others lose 4. A wing without a seat in your Cabinet (or shadow cabinet) loses approval every month; one under 30 grumbles and rebels in the Commons, and one under 15 for three months mounts a leadership challenge."
 wm_wing_court_decision_desc_conservative: "How the Conservative wings feel about their leader (out of 100):\n#bold One Nation#! ([EmptyScope.ScriptValue('wm_ui_wing_size_4')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold Free-marketeers#! ([EmptyScope.ScriptValue('wm_ui_wing_size_5')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold Traditionalists#! ([EmptyScope.ScriptValue('wm_ui_wing_size_6')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\nCourting a wing costs #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! profile: it gains 15 approval, the others lose 4. A wing without a seat in your Cabinet (or shadow cabinet) loses approval every month; one under 30 grumbles and rebels in the Commons, and one under 15 for three months mounts a leadership challenge."
 wm_wing_court_decision_tooltip: "Trzymaj skrzydła drużyny na boku."
 wm_wing_court_decision_confirm: "Wybierz skrzydło"
 wm_wing_court_decision_effect_tt: "Wybierz skrzydło: jego aprobata wzrasta o #P 15#!, a co inne skrzydło spada o #N 4#!."
 wm_wing.1.t: "Trzymanie partii razem"
 wm_wing.1.desc: "Przemówienie inauguracyjne, polityczne potwierdzenie, obietnica przyszłych awansów. Które skrzydło partii wymaga uwagi?"
 wm_wing.1.w1: "Zwrócić się do lewicy Partii Pracy ([EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0] poparcie)."
 wm_wing.1.w2: "Sięgnąć do Soft Left (aprobata [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])."
 wm_wing.1.w3: "Skontaktuj się z centrowymi Partiami Pracy ([EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0] zatwierdzenie)."
 wm_wing.1.w4: "Skontaktuj się z One Nation ([EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0] zatwierdzenie)."
 wm_wing.1.w5: "Skontaktuj się z zwolennikami wolnego rynku ([EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0] zatwierdzenia)."
 wm_wing.1.w6: "Zwrócić się do tradycjonalistów ([EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0] aprobata)."
 wm_wing.10.t: "Wyzwanie przywódcze"
 wm_wing.10.desc: "Listy nadeszły. Frakcja partyjna straciła cierpliwość i postawiła [wm_wing_challenger.GetName], aby rzucić ci wyzwanie w kwestii przywództwa. Gazety liczą nazwiska, nadawcy przygotowali swoje grafiki, a twój telefon nie przestaje dzwonić.\n\n Możesz dać buntownikom to, czego chcą, albo stawić im czoła."
 wm_wing.10.a: "Daj im to, czego chcą."
 wm_wing.10.a.tt: "Tracisz #N 300#! punktów profilu; aprobaty skrzydła buntowników wzrastają o #P 30#!, a innych skrzydeł spada o #N 4#!."
 wm_wing.10.b: "Spróbuj ich spacyfikować."
 wm_wing.10.b.tt: "#bold Charyzmatyczny #! konkurs przeciwko [wm_wing_challenger.GetName]. Wygrana powoduje wygaszenie buntu; przegrana oznacza, że przejmują przywództwo (i Downing Street, jeśli jesteś Premierem)."
 wm_wing_challenge_toast: "WYZWANIE PRZYWÓDZTWA"
 wm_wing_challenge_toast_desc_1: "Lewica Partii Pracy podjęła działania przeciwko [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] rywalizuje o przywództwo [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_2: "Miękka Lewica podjęła działania przeciwko [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] ubiega się o przywództwo [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_3: "Centrowi Partii Pracy podjęli działania przeciwko [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] rywalizuje o przywództwo [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_4: "Partia One Nation podjęła działania przeciwko [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] ubiega się o przywództwo [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_5: "Zwolennicy wolnego rynku zwrócili się przeciw [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] ubiega się o przywództwo [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_6: "Tradycjonaliści podjęli działania przeciwko [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] ubiega się o przywództwo [wm_wing_party.GetNameNoTier]."
