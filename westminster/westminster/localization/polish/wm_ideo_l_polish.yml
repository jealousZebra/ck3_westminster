 wm_ideo_pick_cross_community_desc: "stać się wspólnotą międzyspołecznościową. Ani unionistą, ani nacjonalistą: wspólna przyszłość dla społeczności Irlandii Północnej."
 wm_ideo_pick_one_nation_desc: "zostać konserwatystą One Nation. Umiarkowany, paternalistyczny konserwatyzm: odpowiedzialność społeczna, stabilne instytucje i Unia."
 wm_ideo_pick_free_market_desc: "Zostać zwolennikiem wolnego rynku. Niższe podatki, deregulacja i mniejsze państwo, które napędzają wzrost."
 wm_ideo_pick_national_conservative_desc: "Zostać Konserwatystą Narodowym. Rodzina, naród i tradycja, przy znacznie niższej imigracji."
 wm_ideo_pick_populist_right_desc: "stać się populistą. Przeciwko establishmentowi westminsterskiemu: kontrola granic, suwerenność i niższe podatki."
 wm_ideo_pick_scottish_nationalist_desc: "Zostać szkockim nacjonalistą. Niepodległa Szkocja w Europie, z programem socjaldemokratycznym w kraju."
 wm_ideo_pick_welsh_nationalist_desc: "zostać walijskim nacjonalistą. Samorządność Walii i ochrona języka walijskiego."
 wm_ideo_pick_irish_republican_desc: "Zostać irlandzkim republikaninem. Zjednoczona Irlandia i koniec podziału, z lewicowym programem."
 wm_ideo_pick_irish_nationalist_desc: "Zostać irlandzkim nacjonalistą. Nacjonalizm konstytucyjny: jedność Irlandii za zgodą, podział władzy i socjaldemokracja."
 wm_ideo_pick_unionist_desc: "zostać unionistą. Miejsce Irlandii Północnej w Zjednoczonym Królestwie, bronione ponad wszystko."
