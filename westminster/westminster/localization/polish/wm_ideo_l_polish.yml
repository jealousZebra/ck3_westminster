 wm_ideo_pick_green_desc: "Zostań Zielonym. Najpierw kryzys klimatyczny, ze sprawiedliwością społeczną i sprawiedliwszą demokracją."
 wm_ideo_pick_liberal_desc: "zostać liberałem. Wolność osobista, uczciwe głosy i bliskie relacje z Europą: tradycja liberalna."
