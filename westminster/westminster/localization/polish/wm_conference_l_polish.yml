l_polish:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "Konferencja: Przemówienie lidera"
 wm_conference.1.desc: "To sezon konferencyjny, a [wm_conference_party.GetNameNoTier] przejął nadmorskie centrum konferencyjne na cztery dni spotkań towarzyszących, smyczy i letniej kawy. Jutro jest ten wielki dzień: moje przemówienie do sali sali, na żywo na wszystkich kanałach informacyjnych. Autorzy przemówień przygotowali szkic numer dziewiętnaście. Pastylki mam w kieszeni. Na zestawie jest hasło napisane literami o wysokości czterech stóp, a ktoś sprawdził, czy żaden z nich nie jest luźny. Prawdopodobnie."
 wm_conference.1.a: "Wygłosić przemówienie tak, jak zostało napisane."
 wm_conference.1.b: "Rozdarć scenariusz i mów prosto z serca."
 wm_conference.1.c: "Ogłoszenie o ustalonych zasadach."

 wm_conference_headline_triumph: "TRIUMFALNE PRZEMÓWIENIE STAWIA HALLA NA NOGI"
 wm_conference_headline_solid: "PRZEMÓWIENIE LIDERA: “DOBRZE”, MÓWIĄ DELEGACI"
 wm_conference_headline_disaster: "KATASTROFA PEŁNA KASZLU, GDY SCENARIUSZ SIĘ ROZPADA"
 wm_conference_headline_policy_hit: "ODWAŻNA DEKLARACJA KRADNIE SHOW"
 wm_conference_headline_policy_flop: "FLAGOWA POLITYKA TONIE DO LUNCHU"
 wm_conference.2.desc_triumph: "Jedenaście owacji na stojąco, jedna z nich podczas przerwy na oddech. Scenarzyści szkiców starają się być nieuprzejmi, nocne sondaże rosną, a partia parlamentarna nagle bardzo chce być ze mną widziana w barze."
 wm_conference.2.desc_solid: "Brak owacji na stojąco, brak katastrof i brak liter spadających z tła. Gazety nazywają to \" fachowością\", co od nich jest praktycznie listem miłosnym."
 wm_conference.2.desc_disaster: "Zaczęło się od łaskotania w gardle, a skończyło na sali pełnej delegatów rozdających pastylki na scenie, podczas gdy hasło za mną straciło dwie litery. Protestujący dotarł aż do mównicy. Scenarzyści nie mieli takiego dnia od lat, a w barze moi koledzy rozmawiają cicho."
 wm_conference.2.desc_policy_hit: "Polityka nie była testowana, nie wyciekła i przewodzi każdemu biuletynowi. Partie rywalizujące próbują powiedzieć, że to one wpadły na to pierwsze. Sala skandowała moje imię, co było miłe, choć trochę niepokojące."
 wm_conference.2.desc_policy_flop: "W chwili, gdy opuściłem scenę, think tank wykrył czterdziestomiliardową dziurę w kosztorysach, a dwóch moich własnych członków rządu w pierwszym szeregu powiedziało w radiu, że o tym nigdy nie słyszeli."
 wm_conference.2.a: "Zawsze jest następny rok."

 wm_conference.10.t: "Konferencja: Smycze i frędzle"
 wm_conference.10.desc: "Konferencja [wm_conference_party.GetNameNoTier] jest w pełnym toku: cztery dni spotkań pobocznych w przegrzanych pokojach bocznych, przyjęć sponsorowanych przez organizacje handlowe, o których nikt nie słyszał, oraz hotelowego baru, gdzie prawdziwy biznes dzieje się po północy. [wm_conference_leader.GetName] przemawia jutro. Jak spędzę moją konferencję?"
 wm_conference.10.a: "Wystąpić na spotkaniu bocznym."
 wm_conference.10.b: "Spisek w barze hotelowym."
 wm_conference.10.c: "Pracuj na przyjęciach i nawiązuj kontakty."
 wm_conference.10.d: "Usiądź na korytarzu i głośno i widocznie oklaskuj lidera."
 wm_conference_fringe_good: "Fringe: Wypełniona sala i dobry artykuł"
 wm_conference_fringe_off_message: "Fringe: Uwagi 'Zbiegają z przesłaniem'"
 wm_conference_plot_found_out: "Spiskowanie: podsłuchane przez partyjnych dyscyplinatorów"

 wm_conference.20.t: "Pogłoski o przywództwie"
 wm_conference.20.desc: "Konferencja się skończyła, a przemówienie nie dotyczy mojego przemówienia. Anonimowi koledzy mówią niedzielnym gazetom, że [wm_conference_party.GetNameNoTier] potrzebuje \"nowego początku\", frazy, która nigdy nie oznacza nowego logo. Dyscypliny mają nazwy. Pytanie brzmi, co z tym zrobię."
 wm_conference.20.a: "Zmierz się z spiskowcami."
 wm_conference.20.b: "Obiecuję, że będziesz słuchać partii parlamentarnej."
 wm_conference.20.c: "Odrzuć to jako plotki z bańki Westminsterskiej."
 wm_conference_faced_down: "Burczenie: Spiskowcy wycofują się"
 wm_conference_not_faced_down: "Burczenie: Historia trwa i trwa"

 wm_conference_triumph_modifier: "Triumf w konferencji"
 wm_conference_triumph_modifier_desc: "Wygłosił przemówienie na konferencji, które ludzie będą cytować jeszcze w przyszłym roku, z właściwych powodów."
 wm_conference_disaster_modifier: ""
 wm_conference_disaster_modifier_desc: "Wygłosił przemówienie na konferencji, które ludzie będą cytować jeszcze w przyszłym roku, z niewłaściwych powodów."

 wm_conference_triumph_opinion: "Triumfalne przemówienie konferencyjne"
 wm_conference_disaster_opinion: "Katastrofalne przemówienie na konferencji"
 wm_conference_listened_opinion: "Obiecał słuchać imprezy"
 wm_conference_contacts_opinion: "Spotkali się na konferencji"
 wm_conference_fellow_plotter_opinion: "Spiskowali razem w barze hotelowym"
 wm_conference_caught_plotting_opinion: "Przyłapany na spiskowaniu przeciwko mnie"
 wm_conference_loyal_applause_opinion: "Najgłośniej oklaskiwał moją przemowę"
 wm_conference_off_message_opinion: "Zeszła z tematu podczas spotkania marginesowego"
