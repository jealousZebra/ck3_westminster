l_polish:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "Konkurs przywódczy"
 wm_leadership.1.desc_vacancy: "[wm_lead_party.GetNameNoTier] potrzebuje nowego przywódcy. [wm_lead_party_holder.GetName] na razie pilnuje sklepu, ale partia sama wybierze. \n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] ustępuje ze stanowiska lidera [wm_lead_party.GetNameNoTier], a wyścig o jego następcę się rozpoczął.\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] stoi przed wyzwaniem o przywództwo [wm_lead_party.GetNameNoTier]. Każdy, kto widzi swoje szanse, może dołączyć. \n\n"
 wm_leadership.1.rules: "#bold Zasady: #! nominacje posłów partii zamykają się w ciągu dziesięciu dni. Kandydat potrzebuje 15% z nich (pretendent 20%), aby przejść dalej, a dwaj najlepiej wspierani kandydatury idą do głosowania członków trzy tygodnie później. Członkowie szukają komunikatora, rekordów, kapitału politycznego w partii i poparcia posłów."
 wm_leadership.1.a: "Rzucam swoje kapelusz do gry."
 wm_leadership.1.a.tt: "Reprezentujesz przywództwo. Twoi koledzy zdecydują, czy cię nominować."
 wm_leadership.1.b: "Tym razem nie."
 wm_leadership.2.t: "Wyzwanie"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName] ogłosił wyzwanie wobec twojego przywództwa [wm_lead_party.GetNameNoTier]. Jeśli znajdą wystarczająco dużo nominacji, członkowie wybiorą między tobą."
 wm_leadership.2.a: "Walcz z nimi i wygraj."
 wm_leadership.2.a.tt: "Jesteś obecnie na liście wyborczej. Wyzwanie wymaga, aby piątka posłów partii ich nominowała."
 wm_leadership.2.b: "Odsuń się z godnością."
 wm_leadership.2.b.tt: "Nie kandydować. Konkurs trwa bez ciebie, a ty prowadzisz, dopóki nie będzie zwycięzcy."
 wm_leadership.3.t: "Karta do głosowania członków"
 wm_leadership.3.desc: "Znalazłeś się na krótkiej liście kandydatów na przywództwo w [wm_lead_party.GetNameNoTier], przeciwko [wm_lead_rival.GetName]. Przed tobą trzy tygodnie kampanii, banki telefoniczne i wywiady. Członkowie zdecydują."
 wm_leadership.3.a: "Zwiedzaj partie wyborcze."
 wm_leadership.3.a.tt: "Kampania podawania rąk i zebrań: wykorzystuje twoją charyzmę #bold#!."
 wm_leadership.3.b: "Ustalić poważny program."
 wm_leadership.3.b.tt: "Platforma polityczna: trafia w twoją #bold gospodarkę #! i #bold politykę #!."
 wm_leadership.3.c: "Zatrudnij najlepszych, na jakich pozwala kampanijne pieniądze."
 wm_leadership.3.c.tt: "Świetne filmy i bezwzględna gra w parterze. Drogie, ale działa."
 wm_leadership.3.d: "Niech mój rekord mówi sam za siebie."
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] ZWYCIĘSTWA [wm_lead_news_party.GetAdjective|U] PRZYWÓDZTWA"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] KORONOWANY BEZ OPOZYCJI"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] ODPARTA KWESTIA"
 wm_leadership.4.t_failed: "WYZWANIE PRZYWÓDZTWA GAŚNIE"
 wm_leadership.4.desc_ballot: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nThe members have spoken: [wm_lead_news_winner.GetName] takes [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% of the vote against [wm_lead_news_second.GetName] and is the new leader of the [wm_lead_news_party.GetNameNoTier]. [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] of the party's [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] MPs had nominated them."
 wm_leadership.4.desc_ballot_alone: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName] jest nowym liderem [wm_lead_news_party.GetNameNoTier], z [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% głosów członków."
 wm_leadership.4.desc_survives: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nThe members have backed their leader: [wm_lead_news_winner.GetName] wins [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% of the vote against [wm_lead_news_second.GetName], whose career may not recover."
 wm_leadership.4.desc_unopposed: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nOnly [wm_lead_news_winner.GetName] reached the nominations needed for the ballot, with [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] of the party's [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] MPs, and is elected leader of the [wm_lead_news_party.GetNameNoTier] unopposed. The members never got a vote."
 wm_leadership.4.desc_failed: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nThe challenge to [wm_lead_news_winner.GetName] has failed before it began: no challenger found the nominations needed to force a ballot. The leader is safe, for now."
 wm_leadership.4.a_won: "Teraz zaczyna się prawdziwa praca."
 wm_leadership.4.a: "Partia dokonała wyboru."
 wm_leadership.5.t: "Po przeliczeniu"
 wm_leadership.5.desc: "Wybory powszechne wypadły źle dla [wm_lead_party.GetNameNoTier]. Gazety już piszą Twój polityczny nekrolog, a niektórzy koledzy nie oddzwaniają. \n\n Możesz walczyć dalej lub ogłosić, że ustąpisz, gdy partia wybierze następcę."
 wm_leadership.5.a: "Nigdzie nie idę."
 wm_leadership.5.b: "Czas na kogoś innego."
 wm_leadership.5.b.tt: "Rozpoczyna się konkurs przywódczy. Nie startujesz, a prowadzisz, dopóki się nie zakończy."
 wm_leadership_contest_toast: "Konkurs przywództwa: [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "[wm_lead_party.GetNameNoTier] wybiera przywódcę: poprzez nominacje swoich posłów, a następnie głosowanie członków."
 wm_leadership_result_toast: "Nowy lider: [wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] kieruje [wm_lead_party.GetNameNoTier]."
 wm_leadership_challenge_decision: "Wyzwanie o Przywództwo"
 wm_leadership_challenge_decision_desc: "Twoja partia zasługuje na więcej, i wiesz kto. Ogłoś wyzwanie: jeśli jedna piąta posłów partii cię nominowałaby, członkowie wybiorą między tobą a liderem."
 wm_leadership_challenge_decision_tooltip: "Kwestionuj lidera swojej partii."
 wm_leadership_challenge_decision_confirm: "Ogłoszić wyzwanie"
 wm_leadership_challenge_decision_effect_tt: "Konkurs przywództwa #bold #! rozpoczyna się: dziesięć dni nominacji od posłów partii, a następnie głosowanie członków. Jeśli przegrasz, lider tego nie zapomni."
 wm_leadership_no_contest_tt: "Konkurs na przywództwo nie jest jeszcze w toku"
 wm_leadership_parliament_sitting_tt: "Wybory powszechne nie są w toku"
 wm_leadership_challenged_opinion: "Zakwestionował mnie o przywództwo"
 wm_leadership_deposed_opinion: "Zabrano mi moją partię"
 wm_leadership_gracious_opinion: "Wspaniałomyślny zwycięzca."
