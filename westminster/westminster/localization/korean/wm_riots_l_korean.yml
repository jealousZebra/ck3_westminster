l_korean:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "[wm_riot_seat.GetName]의 폭도"
 wm_riot_gathering_toast_desc: "화난 군중이 [wm_riot_seat.GetName]에 모였습니다. [wm_riot_organiser.GetName]는 웨스트민스터에서 시위 행진을 조직하고 있습니다."
 wm_riot_marching_toast: "[wm_riot_seat.GetName]로부터의 시위 행진"
 wm_riot_marching_toast_desc: "[wm_riot_seat.GetName]에서 시작된 시위 행진이 [wm_riot_organiser.GetName]의 지휘 아래 웨스트민스터로 출발했습니다. 요구 사항과 함께 이달 내에 도착할 예정입니다."

 wm_riot_demand_1_desc: "\n\n그들은 #bold 생활비 #! 지원을 원합니다: 청구서, 임대료, 식품 가격이 급등했으며, 정부는 신경 쓰지 않는다고 말합니다."
 wm_riot_demand_2_desc: "\n\n그들은 #bold 장관 사임 #!을 원합니다: 내각의 누군가는 책임을 져야 하며, 그들은 보스를 원합니다."
 wm_riot_demand_3_desc: "\n\n그들은 #bold 총선 #!을 원합니다: 정부가 하고 있는 일에는 어떤 권한도 없다고 말하며, 나라가 결정해야 한다고 합니다."
 wm_riot_demand_4_desc: "\n\n그들은 #bold U턴 정책을 원한다 #!: 그들은 지금 아무런 조건 없이 폐기된 정책을 싫어한다."

 wm_riot.10.t: "[wm_riot_seat.GetName]에서 문제 발생"
 wm_riot.10.desc: "제 지역구 사무실 전화가 계속 울리고 있습니다. 수백 명이 [wm_riot_seat.GetName] 거리로 나와 있고, 상점들은 문을 닫았으며, 지역 활동가 [wm_riot_organiser.GetName]는 누군가 듣지 않으면 군중이 웨스트민스터로 행진할 것이라고 카메라에 말하고 있습니다."
 wm_riot.10.a: "나가서 그들과 이야기하세요."
 wm_riot.10.a.success: "군중은 듣고 집으로 돌아갑니다"
 wm_riot.10.a.failure: "길거리에서 성가시게 함"
 wm_riot.10.b: "그들이 맞다고 공개적으로 말하다."
 wm_riot.10.c: "조용히 있고 10번지가 처리하게 놔둬."

 wm_riot.20.t: "3월, 웨스트민스터 도착"
 wm_riot.20.desc: "의회 광장은 플래카드로 가득 차 있습니다."
 wm_riot.20.desc_first: "[wm_riot_seat.GetName]의 시위 행진이 도착했고, 조직자 [wm_riot_organiser.GetName]가 요구 사항 목록과 함께 저를 만나고자 요청했습니다."
 wm_riot.20.desc_bigger: "[wm_riot_seat.GetName]에서의 행진이 다시 돌아왔다, 이전보다 더 크고 분노에 찬 모습으로. [wm_riot_organiser.GetName] 더 이상 대화는 없을 거라고 말한다."
 wm_riot.20.desc_gone: "\n\n브리핑을 다 읽을 무렵, 군중은 집으로 흩어졌습니다."
 wm_riot.20.a: "그들이 원하는 것을 제공한다."
 wm_riot.20.b: "주최자들을 초대하여 이야기하게 하다."
 wm_riot.20.b.success: "타협이 합의되었습니다."
 wm_riot.20.b.failure: "회담이 결렬됩니다."
 wm_riot.20.c: "경찰에게 광장을 비우라고 말하라."
 wm_riot.20.c.dispersed: "경찰이 광장을 정리합니다."
 wm_riot.20.c.violence: "저녁 뉴스에서의 폭력 장면"
 wm_riot.20.d: "좋습니다."

 wm_riot_county_modifier: "폭동"
 wm_riot_county_modifier_desc: "화난 군중이 거리로 나왔고 시위 행진이 진행 중입니다."
 wm_riot_demands_met_county_modifier: "요구사항 충족"
 wm_riot_demands_met_county_modifier_desc: "정부는 시위자들이 원하는 것을 주었다."
 wm_riot_compromise_county_modifier: "타협"
 wm_riot_compromise_county_modifier_desc: "시위대는 협상과 함께 집으로 돌아갔습니다."
 wm_riot_policed_county_modifier: "시위 해산됨"
 wm_riot_policed_county_modifier_desc: "경찰이 시위 행진을 해산시켰고, 이곳 사람들은 그것을 잊지 않았습니다."
 wm_riot_crackdown_county_modifier: "경찰 폭력"
 wm_riot_crackdown_county_modifier_desc: "시위 행진을 경찰이 진압하는 장면의 사진이 여전히 공유되고 있습니다."
 wm_mp_backed_protesters_county_modifier: "시위를 지지한 국회의원"
 wm_mp_backed_protesters_county_modifier_desc: "지역 국회의원은 시위대와 함께 섰다."
 wm_cost_of_living_package_modifier: "생계비 패키지"
 wm_cost_of_living_package_modifier_desc: "정부 지원으로 청구서 지원"
 wm_u_turn_modifier: "180도 회전"
 wm_u_turn_modifier_desc: "시위 행진으로 굴욕적인 유턴을 강요받았다."
 wm_heavy_handed_modifier: "강압적"
 wm_heavy_handed_modifier_desc: "시위 행진에 경찰을 보냈어."
 wm_crackdown_modifier: "경찰 폭력으로 비난받음"
 wm_crackdown_modifier_desc: "시위 행진이 폭력으로 변하는 것을 경찰이 통제, 그리고 책임이 여기에 있음"

 wm_forced_to_resign_opinion: "사임을 강요받았다"
 wm_backed_protesters_opinion: "시위대 편에 섰다"
 wm_policed_my_constituents_opinion: "내 유권자들을 위해 경찰을 보냈어"
