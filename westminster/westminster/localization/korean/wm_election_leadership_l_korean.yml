l_korean:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "리더십 경쟁"
 wm_leadership.1.desc_vacancy: "[wm_lead_party.GetNameNoTier]은 새로운 리더가 필요합니다. [wm_lead_party_holder.GetName]이 당분간 관리를 하고 있지만, 정당은 스스로 선택할 것입니다. \n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName]는 [wm_lead_party.GetNameNoTier]의 리더직에서 물러나고 있으며, 그 뒤를 잇기 위한 경쟁이 시작되었습니다.\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] [wm_lead_party.GetNameNoTier]의 리더십을 놓고 도전에 직면해 있습니다. 기회를 가진 다른 누구든 참여할 수 있습니다. \n\n"
 wm_leadership.1.rules: "#bold 규칙: #! 당 의원들의 후보 지명은 10일 후에 마감됩니다. 후보자는 15%의 후보(도전자 20%)를 받아야 진출할 수 있으며, 가장 지지를 받는 두 명은 3주 후 당원 투표에 부칩니다. 당원들은 소통자, 기록, 정치적 자본, 그리고 국회의원들의 지지를 찾습니다."
 wm_leadership.1.a: "나도 도전해볼게."
 wm_leadership.1.a.tt: "당신은 당 지도부에 출마합니다. 동료들이 당신을 추천할지 결정할 것입니다."
 wm_leadership.1.b: "이번에는 아닙니다."
 wm_leadership.2.t: "도전"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName]가 [wm_lead_party.GetNameNoTier]의 당신의 지도력에 도전장을 내겠다고 발표했습니다. 충분한 추천을 받으면, 회원들이 당신과 대결자를 선택할 것입니다."
 wm_leadership.2.a: "그들과 싸워서 이기라."
 wm_leadership.2.a.tt: "현재 당신은 투표용지에 올라 있습니다. 도전자는 당 의원의 5분의 1이 지명해야 합니다."
 wm_leadership.2.b: "품위 있게 물러서라."
 wm_leadership.2.b.tt: "당신은 출마하지 않습니다. 경쟁은 당신 없이 계속되며, 승자가 나올 때까지 당신은 리더를 유지합니다."
 wm_leadership.3.t: "의원 투표"
 wm_leadership.3.desc: "당신은 [wm_lead_party.GetNameNoTier]의 지도자 후보 리스트에 올랐습니다, [wm_lead_rival.GetName]를 상대로. 앞으로 3주간의 유세, 전화 캠페인 및 인터뷰가 예정되어 있습니다. 당원들이 결정할 것입니다."
 wm_leadership.3.a: "선거구 파티를 둘러보세요."
 wm_leadership.3.a.tt: "악수와 집회로 이루어진 캠페인: 이는 당신의 #bold 카리스마#!에 맞춰 진행됩니다."
 wm_leadership.3.b: "진지한 프로그램을 제시했습니다."
 wm_leadership.3.b.tt: "정책 플랫폼: 이는 당신의 #bold 경제#!와 #bold 정책#!에 어필합니다."
 wm_leadership.3.c: "최고의 캠페인 자금을 동원해 채용합니다."
 wm_leadership.3.c.tt: "세련된 영상과 무자비한 지상 게임. 비싸지만 효과가 있습니다."
 wm_leadership.3.d: "제 기록이 스스로 말해주길 바랍니다."
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] WINS [wm_lead_news_party.GetAdjective|U] 리더십"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] 무대적 없음으로 왕관 수여"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] 도전을 물리침"
 wm_leadership.4.t_failed: "사그라들다"
 wm_leadership.4.desc_ballot: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n 당원들이 밝혔다: [wm_lead_news_winner.GetName] [wm_lead_news_second.GetName] 반대표 [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%를 얻으며 [wm_lead_news_party.GetNameNoTier]의 새 지도자이다. 당의 [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] 의원 [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0]명이 그들을 지명했다."
 wm_leadership.4.desc_ballot_alone: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName]은 [wm_lead_news_party.GetNameNoTier]의 새로운 대표로, [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%의 의원 투표를 얻는다."
 wm_leadership.4.desc_survives: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n회원들은 지도자를 지지해왔다: [wm_lead_news_winner.GetName]는 [wm_lead_news_second.GetName]를 상대로 [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]%의 득표율을 기록했으며, 의 경력이 회복되지 못할 수도 있다."
 wm_leadership.4.desc_unopposed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n [wm_lead_news_winner.GetName] 겨우 투표에 필요한 지명을 받았고, 당 [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] 의원 중 [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0]명을 얻어 무투표로 [wm_lead_news_party.GetNameNoTier] 대표로 선출되었다. 당원들은 투표권을 얻지 못했다."
 wm_leadership.4.desc_failed: "#italic [wm_lead_news_party.GetNameNoTier]#!\n\n [wm_lead_news_winner.GetName]에 대한 도전은 시작도 전에 실패했다: 어떤 도전자도 투표를 강제할 지명을 찾지 못했다. 당분간 리더는 안전하다."
 wm_leadership.4.a_won: "이제 진짜 일이 시작됩니다."
 wm_leadership.4.a: "정당이 선택되었습니다."
 wm_leadership.5.t: "백작 이후"
 wm_leadership.5.desc: "총선은 [wm_lead_party.GetNameNoTier]에게 좋지 않게 끝났다. 신문들은 이미 당신의 정치적 부고를 쓰고 있으며, 일부 동료들은 전화를 받지 않고 있다.\n\n 당신은 계속 싸울 수도 있고, 당에서 후임을 선택한 후 사임을 발표할 수도 있다."
 wm_leadership.5.a: "나는 아무 데도 가지 않습니다."
 wm_leadership.5.b: "이제는 다른 사람의 차례입니다."
 wm_leadership.5.b.tt: "리더십 경선이 시작됩니다. 당신은 일어서지 않고 끝날 때까지 이끕니다."
 wm_leadership_contest_toast: "지도부 경선: [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "[wm_lead_party.GetNameNoTier]은 지도자를 선택하는 것입니다: 의원들의 지명 후, 구성원 투표가 진행됩니다."
 wm_leadership_result_toast: "새로운 지도자: [wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName]는 [wm_lead_party.GetNameNoTier]을 이끕니다."
 wm_leadership_challenge_decision: "지도력 도전"
 wm_leadership_challenge_decision_desc: "당신의 정당은 더 나은 것을 받을 자격이 있으며, 당신은 누구인지 알고 있습니다. 도전을 선언하세요: 정당 의원의 5분의 1이 당신을 지명하면, 구성원들은 당신과 당 지도자 중에서 선택할 것입니다."
 wm_leadership_challenge_decision_tooltip: "당신의 당 지도자에게 도전하세요."
 wm_leadership_challenge_decision_confirm: "도전을 선언"
 wm_leadership_challenge_decision_effect_tt: "#bold 리더십 경선 #!이 시작됩니다: 당내 의원들의 10일간 후보 지명 후, 당원 투표가 이어집니다. 패배하면, 리더는 그것을 잊지 않을 것입니다."
 wm_leadership_no_contest_tt: "이미 지도부 경선이 진행 중이지 않습니다"
 wm_leadership_parliament_sitting_tt: "총선은 진행 중이 아닙니다"
 wm_leadership_challenged_opinion: "나에게 지도력을 도전"
 wm_leadership_deposed_opinion: "내 파티를 빼앗았어"
 wm_leadership_gracious_opinion: "우아한 승자"
