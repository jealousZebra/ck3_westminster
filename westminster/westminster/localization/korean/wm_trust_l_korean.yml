l_korean:
 # Public trust (common/scripted_effects/wm_trust_effects.txt)
 wm_trust_clean_up_decision: "정치 정화 약속"
 wm_trust_clean_up_decision_desc: "#bold 정치에 대한 대중 신뢰: [EmptyScope.ScriptValue('wm_ui_public_trust')|0] / 100#!, 총선에서 예상 투표율 약 [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%. \n\n 낮은 신뢰는 폭동 가능성을 높이고, 소규모 및 신생 정당의 여론조사 지지를 증가시키며, 유권자를 집에 머물게 합니다; 높은 신뢰는 정부를 지원합니다. 방향 전환, 약속 불이행, 폭동 및 그에 대한 치안 유지, 스캔들 및 불법 캠페인이 신뢰를 떨어뜨립니다; 인기 법안, 지켜진 약속 및 청렴한 캠페인이 신뢰를 높입니다. \n\n 일련의 기준 개혁 패키지는 웨스트민스터가 국민의 의견을 듣고 있음을 보여줍니다."
 wm_trust_clean_up_decision_tooltip: "공공 신뢰: 100점 중 [EmptyScope.ScriptValue('wm_ui_public_trust')|0]"
 wm_trust_clean_up_decision_confirm: "서약하다"
 wm_trust_clean_up_decision_not_pledged_tt: "당신은 아직 유효한 청소 약속을 한 적이 없습니다."
 wm_trust_clean_up_decision_effect_tt: "공공 신뢰가 #P 5#! 포인트 상승함. 향후 3년 안에 스캔들이 발생하면 약속은 깨짐: 신뢰가 추가로 #N 4#! 포인트 하락하고 체면을 잃음"

 wm_trust_promise_broken_toast: "약속 파기"
 wm_trust_promise_broken_toast_desc: "시위자들에게 약속된 조기 총선은 이루어지지 않았습니다. 공공 신뢰는 #N 6#! 포인트 하락했습니다."

 wm_trust.10.t_expenses: "웨스트민스터를 휩쓸고 있는 비용 행정"
 wm_trust.10.t_lobbying: "로비잉 로우"
 wm_trust.10.t_unity: "국가적 단결의 순간"
 wm_trust.10.t_standards: "건강 기록서"
 wm_trust.10.desc_expenses: "#italic 1면#!\n\n정보 공개 요청이 국회의원들의 경비 청구서를 열어봤고, 신문들은 하루에 한 페이지씩 이를 보도하고 있습니다: 여기 바지 프레스, 저기 파티오 히터, 첫 번째 주택으로 밝혀진 두 번째 주택. 하원 당국은 아무도 규칙을 어기지 않았다고 말하며, 이것이 바로 요점입니다.\n\n어느 한 정당도 예외가 없으며, 대중은 모두에게 감명을 받지 않았습니다."
 wm_trust.10.desc_lobbying: "#italic 앞표지#!\n\n 외국 컨설팅 회사로 위장한 잠입 기자들이 여러 전직 장관들이 돈을 받고 문을 열어주겠다고 제안하는 장면을 촬영했다. 정부는 규칙이 준수되었다고 주장한다; 그런데 그 규칙은 전직 장관들에 의해 작성된 것으로 드러났다.\n\n정부가 그중 가장 큰 피해를 본다."
 wm_trust.10.desc_unity: "#italic 1면#!\n\n이번에는 전국이 같은 것을 보고 있습니다: 스포츠에서의 승리, 영웅적인 구조, 국가적 축하 행사. 각 정당의 정치인들이 함께 응원하는 모습이 사진으로 찍혔고, 며칠 동안 아무도 그들을 야유하지 않습니다.\n\n정부도 따뜻한 분위기의 일부를 공유합니다."
 wm_trust.10.desc_standards: "#italic 내부 페이지#!\n\n위원회 연례 보고서에 따르면 웨스트민스터의 행태는 수년 만에 가장 우수하다고 평가합니다: 불만이 적고, 조사가 더 빨라졌으며, 후회스러운 행동을 하는 장면이 촬영되지 않았습니다. 이 이야기는 헤드라인을 장식하는 이야기가 아니기 때문에 도움이 됩니다."
 wm_trust.10.desc_trust: "\n\n#bold 정치에 대한 공공의 신뢰는 이제 [EmptyScope.ScriptValue('wm_ui_public_trust')|0] /100입니다.#!"
 wm_trust.10.a: "모든 영수증 공개"
 wm_trust.10.b: "고개 숙여."
 wm_trust.10.c: "지속되는 동안 즐기세요."
