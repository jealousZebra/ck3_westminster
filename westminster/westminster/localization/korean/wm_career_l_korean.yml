l_korean:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "당 업무"
 wm_job_canvassing_contract: "유세"
 wm_job_canvassing_desc_title: "도어녹커 모집"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName]는 이번 주말 발코니에서 자원봉사자가 필요합니다: 클립보드, 전단지와 강인한 정신. 당은 비 속에서 나타난 사람들을 주목합니다."
 wm_job_canvassing_request: "3주 동안 문을 두드리세요. 성공은 당신의 [diplomacy|E]에 달려 있습니다."
 wm_job_fundraising_contract: "기금 모금 만찬"
 wm_job_fundraising_desc_title: "표 채우기 도움"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] 모금 만찬을 주최하는데, 테이블을 팔고, 기부자들을 쫓아가며, 추첨을 정직하게 진행할 사람이 필요해요."
 wm_job_fundraising_request: "저녁 식사를 3주에 걸쳐 조직하세요. 성공은 귀하의 [stewardship|E]에 달려 있습니다."
 wm_job_speechwriting_contract: "연설문 작성"
 wm_job_speechwriting_desc_title: "효과를 내는 연설"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName]는 큰 연설을 앞두고 있으며, 사무실 측 표현에 따르면 현재 초안은 '인질 영상'과 같다."
 wm_job_speechwriting_request: "3주에 걸쳐 연설문을 작성하세요. 성공은 당신의 [learning|E]에 달려 있습니다."
 wm_job_research_contract: "야당 조사"
 wm_job_research_desc_title: "상대측을 파고들다"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName]는 그들의 상대에 대한 브리핑을 원합니다: 투표 기록, 과거 트윗, 지켜지지 않은 약속들. 모든 것이 공개적이며, 모두 유용합니다."
 wm_job_research_request: "서류를 3주 동안 작성하십시오. 성공은 당신의 [intrigue|E]에 달려 있습니다."
 wm_job_phonebank_contract: "전화 은행"
 wm_job_phonebank_desc_title: "전화로 보내는 저녁"
 wm_job_phonebank_desc: "[TaskContract.GetEmployer.GetName] 사무실에는 갱신하지 않은 400명의 회원 명단, 빌린 전화기들이 가득한 방, 그리고 아무도 리허설하지 않은 대본이 있다."
 wm_job_phonebank_request: "세 주 동안 전화 목록을 처리하세요. 성공은 당신의 [diplomacy|E]에 달려 있습니다."
 wm_job_policy_paper_contract: "정책 보고서"
 wm_job_policy_paper_desc_title: "10페이지, 전체 비용 포함"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName]는 표어가 아닌 지역 버스에 대한 뭔가를 말하고 싶어 합니다: 증거, 숫자, 그리고 장관이 승인할 수 있는 권고."
 wm_job_policy_paper_request: "논문을 3주 동안 작성하세요. 성공은 당신의 [learning|E]에 달려 있습니다."
 wm_job_media_round_contract: "미디어 라운드"
 wm_job_media_round_desc_title: "아침 식사 전 여섯 개의 스튜디오"
 wm_job_media_round_desc: "지역 라디오, 지역 텔레비전 및 두 개의 팟캐스트는 [TaskContract.GetEmployer.GetName] 측 사람에게 나와서 입장을 옹호해 달라고 요청했습니다. 다른 누구도 자원하지 않았습니다."
 wm_job_media_round_request: "대본을 준비하고 3주 동안 인터뷰를 진행하세요. 성공은 당신의 [intrigue|E]에 달려 있습니다."
 wm_job_gotv_contract: "투표 참여 촉구"
 wm_job_gotv_desc_title: "임신시키고, 내보내세요"
 wm_job_gotv_desc: "[TaskContract.GetEmployer.GetName] 팀은 시의회 보궐선거를 위해 주자들이 필요하다: 투표 카드, 창구 번호, 그리고 많은 고층 건물의 많은 계단들."
 wm_job_gotv_request: "3주간 투표 독려 작전을 진행하세요. 성공은 당신의 [prowess|E]에 달려 있습니다."
 wm_job_budget_contract: "서약 비용"
 wm_job_budget_desc_title: "돈은 어디서 나오는 거야?"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName]는 비싼 것을 약속했고, 상대편은 계속해서 그것이 어떻게 지불될 것인지 묻고 있습니다. 급히 스프레드시트가 필요합니다."
 wm_job_budget_request: "3주 동안 서약 비용 발생. 성공 여부는 당신의 [stewardship|E]에 달려 있음."
 wm_selection_contract: "후보자 평가"
 wm_selection_contract_contract: "후보자 평가"
 wm_selection_contract_desc_title: "정당이 승인한 명단"
 wm_selection_contract_desc: "당을 위해 출마하기 전에, 누구든 평가일을 통과해야 합니다: 모의 면접, 정책 시험, 화난 '유권자'와의 롤플레이."
 wm_selection_contract_request: "인증된 후보자 목록에 가입하기 위해 평가를 통과하세요. 성공 여부는 귀하의 [diplomacy|E]에 달려 있습니다."

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "[wm_sel_seat.GetName] 지원 공개"
 wm_career.20.desc: "지역 [wm_sel_party.GetName]이 [wm_sel_seat.GetName] 후보를 선출하고 있습니다. 선거구 의장의 이메일은 짧습니다: 지원서 마감 몇 주 후, 커뮤니티 센터에서 유세 토론이 있을 예정입니다. \n\n이런 지역구에 출마한 사람들이 국회의원이 됩니다."
 wm_career.20.a: "내 이름을 내줘."
 wm_career.20.b: "이것은 아닙니다."
 wm_career.21.t: "[wm_sel_seat.GetName]에서의 허스팅스"
 wm_career.21.desc: "플라스틱 의자, 찻주전자, 그리고 모든 피치를 이미 들어본 60명의 당원들. 각 신청자는 10분간 발표하고 질의응답 진행. 그들을 어떻게 설득할까?"
 wm_career.21.a: "이 지역에 대해 이야기해 주세요: 번화가, 버스, 사람들."
 wm_career.21.b: "정책별로 비용 산정 계획을 세우세요."
 wm_career.21.c: "다른 지원자들이 과거에 말한 것을 부드럽게 상기시킨다."
 wm_career.21.success: "방은 당신에게 따뜻하게 변했습니다."
 wm_career.21.failure: "방은 차갑게 유지되었습니다."

 wm_career_selected_toast: "[wm_sel_seat.GetName] 위해 선택됨"
 wm_career_selected_toast_desc: "지역 [wm_sel_party.GetName]이 당신을 후보로 선출했습니다. 다음 선거나 보궐선거에서 당선되면 국회의원이 됩니다."
 wm_career_not_selected_toast: "[wm_sel_seat.GetName]에서 선택되지 않음"
 wm_career_not_selected_toast_desc: "멤버들이 [wm_sel_winner.GetName]를 선택했어. 다음엔 더 잘 알려질 거야."
 wm_career_elected_toast: "국회 선출됨"
 wm_career_elected_toast_desc: "개표가 완료되었고 의석은 당신 것입니다. 선거 캠페인 팀은 해산되었으며, 당신 당의 의원 단속관들이 연락을 취할 것입니다."

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "선발 신청"
 wm_career_apply_decision_desc: "지역 당원들이 선출하는 지역구에서 제 당의 후보로 제 이름을 내세요. 정당 순위: [GetPlayer.MakeScope.Var('wm_standing').GetValue|0]."
 wm_career_apply_decision_tooltip: "당 후보로 출마 신청하세요"
 wm_career_apply_decision_free_tt: "이미 의석을 신청하거나 후보로 선정되지 않음"
 wm_career_apply_decision_standing_tt: "당의 승인된 후보자 명단에 있거나 당 지위가 최소 30 이상"
 wm_career_apply_decision_open_tt: "정당이 어디선가 후보를 선택하고 있습니다."
 wm_career_apply_decision_effect_tt: "당이 개설한 선발 중 하나, 가능하면 본인 나라에서 지원하고, 그 선거 토론에서 연설합니다."
 wm_career_return_decision: "캠페인 현장으로 복귀"
 wm_career_return_decision_desc: "유권자들이 의사를 밝혔고, 그들은 마음을 바꿀 수도 있습니다. 선거 운동팀을 구성하고 의석을 찾아보십시오."
 wm_career_return_decision_tooltip: "의석을 잃은 후 다시 선거에 도전"
 wm_career_return_decision_effect_tt: "당신은 선거운동 팀을 얻고, 파티의 승인 후보 목록에 합류하여 선발에 지원할 수 있습니다."

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "나를 위해 좋은 일을 했다"
 wm_career_poor_work_opinion: "나를 실망시켜줘"
 wm_career_apply_decision_confirm: "내 지원서 제출"
 wm_career_return_decision_confirm: "문앞으로 돌아가기"
