l_korean:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "법안 제출"
 wm_commons_introduce_bill_decision_desc: "정부 법안을 하원에 상정하세요. 원내총무들은 인원을 세고, 백벤치들은 불평하며, 일주일 후 하원이 분열됩니다."
 wm_commons_introduce_bill_decision_tooltip: "정부 법안을 하원에서 표결에 부쳐"
 wm_commons_introduce_bill_decision_effect_tt: "법안을 선택하세요. 하원은 일주일 후에 표결합니다."
 wm_commons_no_confidence_decision: "불신임 동의안을 제출"
 wm_commons_no_confidence_decision_desc: "야당 대표로서 이 의회가 폐하 정부에 신임을 갖지 않는다는 결의안을 제출하십시오. 정부가 패배하면 총선을 치러야 합니다."
 wm_commons_no_confidence_decision_tooltip: "정부를 무너뜨리려 시도합니다"
 wm_commons_no_confidence_decision_effect_tt: "하원은 일주일 내에 그 동의안에 대해 투표합니다. 만약 통과하면 #bold 총선거#!가 실시되어야 합니다. 실패하면, 체면을 잃고 총리는 그것을 잊지 않을 것입니다."
 wm_commons_house_free_desc: "하원에서 표결을 기다리는 다른 법안이나 동의안은 없습니다"
 wm_commons_no_election_pending_desc: "정부에 강제로 총선을 치르지 않았다"
 wm_commons_leader_of_opposition_desc: "당신은 정부 외의 가장 큰 당을 이끕니다."

 # Bills
 wm_commons_bill_1_name: "#bold 재정 법안#!"
 wm_commons_bill_2_name: "#bold 공공 서비스 법안#!"
 wm_commons_bill_3_name: "#bold 공무원 개혁 법안#!"
 wm_commons_bill_4_name: "#bold 비상 권한 법안#!"
 wm_commons_bill_5_name: "#bold 폐하 정부에 대한 불신임안안#!"
 wm_commons_bill_1_desc: "\n\n #bold 재정 빌리다#!는 재정 균형을 맞추기 위해 세금을 부과한다. 당의 우파는 이를 싫어한다; 좌파는 이를 받아들일 수 있다."
 wm_commons_bill_2_desc: "\n\n #bold 공공 서비스 Bill#!는 학교와 병원에 더 많은 자금을 투입합니다. 이 프로그램은 인기가 많고, 좌파는 이를 좋아합니다; 하지만 우파는 비용에 대해 걱정합니다."
 wm_commons_bill_3_desc: "\n\n #bold 공공 서비스 개혁 Bill#!는 공공 서비스 운영 방식을 뒤흔듭니다. 우파는 수년간 이를 원해왔습니다. 좌파는 이를 배신이라고 부르며, 일부는 반대표를 던지겠다고 위협하고 있습니다."
 wm_commons_bill_4_desc: "\n\n#bold 긴급 권한법안#!은 장관들에게 위기 대응을 위한 광범위한 권한을 부여합니다. 아무도 이를 크게 좋아하지 않지만, 위기 상황에서는 국가가 의회의 행동을 기대합니다."
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName], 야당 대표로서 #bold 정부에 대한 불신임 동의안을 제출했습니다#!. 통과되면 총선거가 진행되어야 합니다."

 wm_commons.1.t: "입법 프로그램"
 wm_commons.1.desc: "하원 지도자는 정부가 하원에 다음으로 무엇을 제출할지 알고자 합니다. 공무원들은 몇 가지 법안을 초안했고, 각 법안에는 우리 벤치 내의 지지자와 반대자가 있습니다."
 wm_commons.1.a: "재정 법안: 세금은 인상되어야 합니다."
 wm_commons.1.a.tt: "통과되면: 정부에 자금과 세금 인상, 하지만 여론조사는 좋아하지 않습니다. 당의 #bold 우익#!가 반란을 일으킬 수 있습니다."
 wm_commons.1.b: "공공 서비스 법안: 학교와 병원에 더 많은 자금."
 wm_commons.1.b.tt: "통과되면: 인기 있고, 여론조사에도 긍정적이지만, 몇 년간 비용이 듭니다. 당의 #bold 우익#!가 투덜거릴 수 있습니다."
 wm_commons.1.c: "공공 서비스 개혁 법안: 진정한 변화를 위한 시간."
 wm_commons.1.c.tt: "통과되면: 명령과 개혁가의 명성. #bold 논쟁적#!: 당의 #bold 좌익#!가 숫자로 반란을 일으킬 수 있습니다."
 wm_commons.1.d: "비상 권한 법안: 국가가 필요로 합니다."
 wm_commons.1.d.tt: "통과되면: 프로필과 명령. 야당은 이를 지지할 수도 있습니다."
 wm_commons.1.e: "지금은 아무것도 없음."

 # The whips
 wm_commons.2.t: "수석 휘프 보고서"
 wm_commons.2.t_confidence: "신임 결의"
 wm_commons.2.desc_bill: "수석 휘프가 티룸에서 표를 세고 있었습니다."
 wm_commons.2.desc_confidence: "야당이 정부를 무너뜨리기 위한 결의안을 제출했으며, 당 총무는 이미 제 사무실에 있습니다."
 wm_commons.2.numbers: "\n\n우리는 #bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#! 의원이 있습니다; 다른 벤치에는 [EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0]이 있습니다. 최고 간부는 우리 #bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#!이 반발하거나 결석할 수 있다고 생각합니다."
 wm_commons.2.opposition_backs: "야당의 전면 벤치는 우리를 지지하겠다고 밝혔습니다."
 wm_commons.2.no_opposition_help: "야당은 반대표를 던질 것입니다."
 wm_commons.2.a: "휩에게 맡겨라."
 wm_commons.2.b: "세 줄 채찍 지침을 내리다. 내 권위가 위태롭다."
 wm_commons.2.c: "흔들리는 사람들을 한 명씩 호출. 모든 선거구는 무언가가 필요하다."
 wm_commons.2.d: "양보 제안."
 wm_commons.2.d.tt: "반역하는 하원의원은 적지만, 법안은 #bold 약화된 #! 상태로 통과된다: 통과되면 효과가 절반 정도이다."
 wm_commons.2.e: "법안이 부결되기 전에 철회"

 # The result
 wm_commons_headline_government_falls: "정부 붕괴"
 wm_commons_headline_pm_survives: "총리, 신임투표 생존"
 wm_commons_headline_humiliation: "10번지의 굴욕"
 wm_commons_headline_defeated: "정부 패배"
 wm_commons_headline_knife_edge: "아슬아슬: 정부가 간신히 승리하다"
 wm_commons_headline_revolt: "백벤커 반발에도 불구하고 법안 통과"
 wm_commons_headline_comfortable: "편안한 과반수"
 wm_commons_headline_passed: "법안 통과"

 wm_commons.4.lobbies: "\n\n 분파 로비: #bold 아이스 [EmptyScope.ScriptValue('wm_commons_ayes_value')|0], 노에스 [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!. [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] 의원들은 투표하지 않았다."
 wm_commons.4.rebels: "#bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! 정부 의원들이 당론을 거스렀습니다."
 wm_commons.4.no_rebels: "단 한 명의 정부 의원도 당론을 거스르지 않았습니다."
 wm_commons.4.outcome_government_falls: "\n\n하원은 [wm_commons_pm.GetName] 정부에 신임을 주지 않습니다. #bold 조기 총선이 있어야 합니다#!."
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] [EmptyScope.ScriptValue('wm_commons_majority_value')|0] 표를 얻어 생존하며, 야당은 얼굴이 상합니다."
 wm_commons.4.outcome_defeated: "\n\n 법안은 [EmptyScope.ScriptValue('wm_commons_majority_value')|0]표 차이로 부결되었습니다. [wm_commons_pm.GetName] 하원 통제권을 잃었습니다."
 wm_commons.4.outcome_passed_watered_down: "\n\n이 법안은 정부가 거의 모든 사안에 대해 양보한 후에야 다수 [EmptyScope.ScriptValue('wm_commons_majority_value')|0] 통과된다."
 wm_commons.4.outcome_passed: "\n\n이 법안은 다수 [EmptyScope.ScriptValue('wm_commons_majority_value')|0]으로 통과되었습니다."
 wm_commons.4.a: "질서, 질서!"
 wm_commons.4.a_pm: "다음 것으로 넘어갑니다."

 # The division bell
 wm_commons.5.t: "분할 종"
 wm_commons.5.desc: "웨스트민스터 궁 전체에서 분할 종이 울리고 있습니다. 몇 분 안에 하원이 표결을 진행합니다."
 wm_commons.5.whip_none: "\n\n당 지침이 없으므로, 나는 원하는 대로 투표할 수 있습니다."
 wm_commons.5.whip_abstain: "\n\n우리 당은 웨스트민스터에서 의석을 차지하지 않습니다. 나는 투표하지 않을 것입니다."
 wm_commons.5.whip_government: "\n\n 당직자들은 우리 모두가 로비에 있는 모두가 정부와 #bold 하길 원합니다 #!. 반란군은 기억될 것입니다."
 wm_commons.5.whip_opposition_backs: "\n\n우리의 전열 의원들은 이번 사안에서 정부를 지지하고 있으며, 당내 원내총무들은 내가 따르기를 기대합니다."
 wm_commons.5.whip_opposition: "\n\n우리의 원내총무들은 내가 정부에 반대하여 로비에 있을 것을 원합니다#bold #!."
 wm_commons.5.wing_left: "나는 내 당의 #bold 좌측#!에 앉아 있습니다."
 wm_commons.5.wing_right: "나는 내 당의 #bold 우측#!에 앉아 있습니다."
 wm_commons.5.wing_centre: "나는 내 당의 #bold 중도#!에 앉아 있습니다."
 wm_commons.5.a: "정부와 함께 투표하세요.  웨일스"
 wm_commons.5.b: "정부에 반대하는 투표를 하세요."
 wm_commons.5.c: "멀리 떨어져 있고 자제하세요."

 wm_commons_whip_withdrawn_toast: "채찍 철수"
 wm_commons_whip_withdrawn_toast_desc: "너무 자주 반란을 일으킨 후 [wm_commons_whipless.GetName]는 당 당의 당직을 잃고 현재는 무소속으로 자리 잡고 있다."

 # Modifiers
 wm_commons_tax_rise_modifier: "세금 인상"
 wm_commons_tax_rise_modifier_desc: "재정 법안이 세금을 올렸습니다. 자금이 들어오고 있으며, 유권자들이 이를 주목했습니다."
 wm_commons_public_services_modifier: "공공 서비스 지출"
 wm_commons_public_services_modifier_desc: "학교와 병원을 위한 더 많은 자금: 인기가 있고 비용이 많이 듭니다."
 wm_commons_reformer_modifier: "개혁자"
 wm_commons_reformer_modifier_desc: "하원에서 논란이 되는 개혁을 통과시켰습니다."
 wm_commons_emergency_powers_modifier: "긴급 권한"
 wm_commons_emergency_powers_modifier_desc: "의회는 위기 대응을 위해 정부에 광범위한 권한을 부여했습니다."
 wm_commons_defeated_in_commons_modifier: "하원에서 패배"
 wm_commons_defeated_in_commons_modifier_desc: "정부 법안이 하원에서 부결되었습니다."
 wm_commons_lost_confidence_modifier: "하원의 신임을 잃음"
 wm_commons_lost_confidence_modifier_desc: "하원은 이 정부를 신임하지 않는다고 투표했습니다."

 # Opinions
 wm_commons_defied_whip_opinion: "당직 위반"
 wm_commons_whip_withdrawn_opinion: "내게서 채찍을 거두다"
 wm_commons_tabled_no_confidence_opinion: "내 정부를 무너뜨리려 했다"
 wm_commons_introduce_bill_decision_confirm: "하원에 제출"
 wm_commons_no_confidence_decision_confirm: "동의안 제출"
