l_korean:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "분권 브리핑을 읽어보세요"
 wm_devolution_briefing_decision_desc: "내각 사무국의 주간 연례 보고서:\n\n#bold 스코틀랜드:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]%가 독립 지지; 권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold 웨일스:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]%가 독립 지지; 권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold 북아일랜드:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]%가 통합 아일랜드 지지; 권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10; 권력 공유 안정 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100\n\n#bold 정치에 대한 공공 신뢰:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] 100."
 wm_devolution_briefing_decision_tooltip: "연방이 어디에 서 있는지, 그리고 대중이 정치인들을 얼마나 신뢰하는지."
 wm_devolution_briefing_decision_confirm: "읽어보세요"
 wm_devolution.30.t: "연방의 상태(State of the Union)"
 wm_devolution.30.desc: "#italic 내각 사무국, 배포 기준#!\n\n#bold 스코틀랜드:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% 독립 지지; 권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10\n#bold 웨일스: #! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% 독립 지지; 권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10\n#bold 북아일랜드: #! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% 통일 아일랜드 지지; 권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10; 권력 공유 안정성 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100\n\nS웨스트민스터 내 국민 신뢰 편차, 권한 회수, 이양, 각 권한 이양 정부 운영 권한을 남기는 데 긍정적입니다. 절반을 넘으면 민족주의 주도 정부는 공식적으로 국민투표를 요청할 수 있습니다. \n\n#bold 정치에 대한 국민 신뢰: 100 중 #! [EmptyScope.ScriptValue('wm_ui_public_trust')|0]; 총선 예상 투표율 [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%."
 wm_devolution.30.suspended: "\n\n#N 북아일랜드 의회가 중단됨:#! 권력 공유가 붕괴되었으며, 오직 대화(또는 시간)만이 이를 되돌릴 수 있습니다."
 wm_devolution.30.sitting: "\n\n북아일랜드 의회가 회의 중이며, 권력 공유가 유지됩니다."
 wm_devolution.30.a: "알겠습니다."
 wm_devolution_devolve_decision: "권한을 이양합니다"
 wm_devolution_devolve_decision_desc: "에든버러, 카디프 또는 벨파스트에 또 다른 권한을 넘겨주세요. 더 많은 권한이 탈퇴 주장의 부담을 줄이고 자치 정부를 만족시킬 것입니다. \n\n#bold 스코틀랜드: 독립 지지 #! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]%; 10\n#bold [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 웨일스:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% 독립 지지; 10\n#bold 북아일랜드 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10% 지지 #! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% 통합 아일랜드; [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10% 권한; 권력 분점 안정성 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100"
 wm_devolution_devolve_decision_tooltip: "분권 정부에 더 많은 권한을 부여한다."
 wm_devolution_devolve_decision_confirm: "국가 선택"
 wm_devolution_devolve_decision_effect_tt: "국가를 선택하세요: 국가의 권한은 1점 증가하고, 탈퇴 지지는 3#! 포인트 #P 감소하며(그리고 더 낮아집니다), 수상은 만족하고, 국민 신뢰도는 1점씩 상승합니다."
 wm_devolution_claw_back_decision: "힘을 되찾으려 한다"
 wm_devolution_claw_back_decision_desc: "권력을 웨스트민스터로 되돌려라. 연합주의 신문들은 환호할 것이고; 권한 이양 정부와 그 유권자들은 그렇지 않을 것이다. \n\n#bold 스코틀랜드: #! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% 독립을 지지; 10\n#bold [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 웨일스: #! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% 독립을 지지; 10\n#bold 북아일랜드 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 권력: #! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% 통일 아일랜드를 지지; 힘 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10; 권력 분점 안정성 [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] 100"
 wm_devolution_claw_back_decision_tooltip: "권한을 웨스트민스터로 반환"
 wm_devolution_claw_back_decision_confirm: "국가 선택"
 wm_devolution_claw_back_decision_effect_tt: "국가를 선택하세요: 권한은 1 감소하고, 탈퇴 지지율은 3#! 포인트#N 급등하며(그리고 더 높게 정착), 수상은 분노하고, 대중 신뢰도는 2 감소하며, 약간의 프로필이 생깁니다."
 wm_devolution_stormont_talks_decision: "스톰몬트 회담 소집"
 wm_devolution_stormont_talks_decision_desc: "북아일랜드의 권력 공유가 붕괴되었습니다. 당사자들을 테이블로 불러 집중 회담을 진행하세요: 합의는 의회를 복원합니다. 당신의 기회는 당신의 카리스마와 권력 공유 안정성([EmptyScope.ScriptValue('wm_ui_dev_stability')|0]/100)에 따라 향상됩니다."
 wm_devolution_stormont_talks_decision_tooltip: "스톰몬트에서 권한 공유를 복원하려고 시도합니다."
 wm_devolution_stormont_talks_decision_confirm: "회담 소집"
 wm_devolution_stormont_talks_decision_effect_tt: "성공하면 의회를 복원하고, 대중 신뢰를 2만큼 올리며, 프로필을 얻습니다. 실패해도 정당들의 관계는 조금 가까워집니다 (+5 안정성)."
 wm_devolution.1.t: "국민투표 요청"
 wm_devolution.1.desc: "[wm_dev_gov.GetNameNoTier]은 공식적으로 웨스트민스터에 영국 탈퇴 국민투표를 개최할 권한을 요청했습니다. 자체 여론조사에서는 지지율이 [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%로 나타났으며, 명백한 위임권이 있다고 말합니다.\n\n연합주의자 의석들은 단호한 반대를 원합니다. 당신의 고문들은 확신하지 못합니다."
 wm_devolution.1.a: "국민투표에 동의하라."
 wm_devolution.1.a.tt: "6개월 후 투표일입니다. 결과는 지지에 따라 달라지고, 몇 포인트 차이가 있을 수 있습니다. 찬성은 당신에게 재앙일 것입니다."
 wm_devolution.1.b: "지금은 그 때가 아닙니다."
 wm_devolution.1.b.tt: "탈퇴 지지율이 #N 4#! 포인트 상승하며, 수상은 이를 불쾌하게 생각합니다. 그들은 3년 후에 다시 요청할 수 있습니다."
 wm_devolution.1.c: "대신에 더 많은 권한 제공."
 wm_devolution.1.c.tt: "국가가 권력을 얻고, 지지율은 #P 3#! 포인트 하락하며, 프로필에는 약간의 비용이 듭니다. 그들은 3년 후 다시 요청할 수 있습니다."
 wm_devolution.20.t: "권한 위임"
 wm_devolution.20.desc: "새로운 권한을 가진 분권 정부는 어디인가요?"
 wm_devolution.20.scotland: "스코틀랜드로 이양 (권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10)"
 wm_devolution.20.wales: "웨일스로 이양 (권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10)"
 wm_devolution.20.northern_ireland: "북아일랜드로 이양 (권한 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 10)"
 wm_devolution.20.none: "다시 생각해 보니, 지금은 아니에요."
 wm_devolution.21.t: "다시 통제권을 되찾다"
 wm_devolution.21.desc: "어떤 분권 정부가 웨스트민스터에 권한을 넘기는가?"
 wm_devolution.21.scotland: "스코틀랜드에서 다시 돌아오는 힘 (힘 [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] 10개)."
 wm_devolution.21.wales: "웨일스에서 클로우 백(파워 [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] 10)."
 wm_devolution.21.northern_ireland: "북아일랜드에서 다시 찾아왔다(10개 중 [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] 힘)."
 wm_devolution.21.none: "다시 생각해 보니, 지금은 아니에요."
 wm_dev_referendum_agreed_toast: "동의했다 국민투표"
 wm_dev_referendum_agreed_toast_desc: "웨스트민스터가 [wm_dev_gov.GetNameNoTier]의 요청에 동의했습니다: 영국을 탈퇴하는 국민투표가 6개월 안에 열릴 예정입니다."
 wm_dev_referendum_refused_toast: "거부됨"
 wm_dev_referendum_refused_toast_desc: "웨스트민스터가 [wm_dev_gov.GetNameNoTier]의 국민투표 요청을 거부했습니다. 탈퇴 지지율 상승."
 wm_dev_referendum_powers_toast: "대신 더 많은 권한"
 wm_dev_referendum_powers_toast_desc: "웨스트민스터가 [wm_dev_gov.GetNameNoTier]의 국민투표 요청에 새로운 권한 제안으로 답했습니다."
 wm_dev_stormont_collapse_toast: "스톰몬트 붕괴"
 wm_dev_stormont_collapse_toast_desc: "이 붕괴되었고 의회는 중단되었다. 국민의 신뢰가 타격을 입었다."
 wm_dev_stormont_restored_toast: "스톰몬트 복원"
 wm_dev_stormont_restored_toast_desc: "거래가 성사되었고 권력 공유가 북아일랜드로 돌아갑니다."
 wm_dev_stormont_talks_failed_toast: "스톰몬트 협상 실패"
 wm_dev_stormont_talks_failed_toast_desc: "회담은 합의 없이 종료되었지만, 당사자들은 이전보다 가까워졌습니다."
 wm_dev_referendum_yes_toast_scotland: "스코틀랜드, 예에 투표"
 wm_dev_referendum_yes_toast_scotland_desc: "스코틀랜드는 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%의 찬성으로 스코틀랜드 독립에 투표했습니다. 영국을 떠나는 협상이 시작되며 총리의 권위는 흔들립니다."
 wm_dev_referendum_no_toast_scotland: "스코틀랜드, 아니에 투표"
 wm_dev_referendum_no_toast_scotland_desc: "스코틀랜드는 스코틀랜드 독립을 거부했습니다: [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%만 찬성 투표를 했습니다. 이 문제는 한 세대 동안 해결된 것으로 간주되며, 웨스트민스터가 그렇게 희망합니다."
 wm_dev_referendum_yes_toast_wales: "찬성 투표"
 wm_dev_referendum_yes_toast_wales_desc: "웨일스는 웨일스 독립을 찬성했습니다, 찬성은 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%입니다. 영국 탈퇴 협상이 시작되며, 총리의 권위는 무너집니다."
 wm_dev_referendum_no_toast_wales: "반대 투표 웨일스"
 wm_dev_referendum_no_toast_wales_desc: "웨일스는 웨일스 독립을 거부했습니다: 찬성은 단 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%에 불과했습니다. 웨스트민스터는 이 문제가 한 세대 동안 해결되기를 바랍니다."
 wm_dev_referendum_yes_toast_northern_ireland: "북아일랜드 찬성 투표"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "[wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% 차이로 통일 아일랜드에 투표했다. 영국 탈퇴 협상이 시작되고 총리의 권위는 무너진다."
 wm_dev_referendum_no_toast_northern_ireland: "북아일랜드 반대표"
 wm_dev_referendum_no_toast_northern_ireland_desc: "통일된 아일랜드를 거부했다: 찬성표를 던진 비율은 [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%뿐이다. 이 문제는 한 세대 동안 해결될 예정이며, 웨스트민스터는 그렇게 되길 바란다.  북아일랜드"
 wm_dev_assembly_suspended_modifier: "의회 정지"
 wm_dev_assembly_suspended_modifier_desc: "이 붕괴되었고 북아일랜드 의회는 정지되었다.  북아일랜드의 권력 분"
