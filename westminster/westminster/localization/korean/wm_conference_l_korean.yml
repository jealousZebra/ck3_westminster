l_korean:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "회의: 지도자의 연설"
 wm_conference.1.desc: "컨퍼런스 시즌이 다가왔고, [wm_conference_party.GetNameNoTier]는 4일 동안 주변 회의, 명찰, 미지근한 커피를 위해 해변 근처 컨퍼런스 센터를 차지했습니다. 내일은 중요한 날입니다: 내가 전회장에서 연설을 하며 모든 뉴스 채널에서 생중계됩니다. 연설문 작성자들이 19번째 초안을 만들었습니다. 로젠지는 내 주머니에 있습니다. 세트에는 높이 4피트의 글자로 된 슬로건이 있으며, 누군가가 글자가 느슨하지 않은지 확인했습니다. 아마도요."
 wm_conference.1.a: "작성된 대로 연설을 전달"
 wm_conference.1.b: "대본을 찢고 진심으로 말해라."
 wm_conference.1.c: "세트피스 정책 발표 공개"

 wm_conference_headline_triumph: "승리 연설로 회장을 기립시킴"
 wm_conference_headline_solid: "대표 연설: '좋아'라고 대의원들은 말한다"
 wm_conference_headline_disaster: "기침 난독 재앙으로 세트 붕괴"
 wm_conference_headline_policy_hit: "대담한 약속이 관심 집중"
 wm_conference_headline_policy_flop: "대표 정책이 점심시간까지 무너진다"
 wm_conference.2.desc_triumph: "11번의 기립 박수, 그중 하나는 숨을 고르는 잠깐의 시간 동안. 스케치 작가들은 무례하게 굴려고 애쓰고 있으며, 야간 여론조사가 상승했으며, 하원 정당은 갑자기 나와 함께 술집에 있는 모습을 보이길 매우 원한다."
 wm_conference.2.desc_solid: "기립박수도 없고, 재난도 없으며, 편지가 배경에서 떨어지지 않습니다. 신문에서는 이를 \"작업자처럼 \"라고 부르는데, 그들에게는 사실상 사랑 편지와 같습니다."
 wm_conference.2.desc_disaster: "목에 간질거림으로 시작해 무대 뒤 구호의 글자 두 개가 떨어지는 동안 위원들이 사탕을 무대에 전달하며 끝났다. 시위자가 연단까지 갔다. 스케치 작가들은 수년 만에 이런 날을 겪었고, 바에서는 동료들이 낮은 목소리로 이야기하고 있다."
 wm_conference.2.desc_policy_hit: "정책은 공개되지 않았고, 유출되지 않았으며, 모든 공지의 앞에 서 있습니다. 경쟁 당들은 자신들이 먼저 생각했다고 주장하기 위해 급급합니다. 홀에서는 제 이름을 외쳤는데, 기분 좋았지만 약간 불안하기도 했습니다."
 wm_conference.2.desc_policy_flop: "내가 무대를 떠날 때쯤, 싱크탱크는 비용 계산에서 400억 파운드의 구멍을 발견했고 나의 두 명의 전방 의원은 라디오에서 그것을 전혀 들어본 적이 없다고 말했다."
 wm_conference.2.a: "내년에도 항상 기회는 있습니다."

 wm_conference.10.t: "회의: 목걸이와 주변부"
 wm_conference.10.desc: "[wm_conference_party.GetNameNoTier] 회의는 한창이다: 과열된 측면 회의실에서 4일간의 주변 회의, 아무도 들어본 적 없는 무역 단체가 후원하는 리셉션, 그리고 실제 비즈니스가 자정 이후에 벌어지는 호텔 바. [wm_conference_leader.GetName]는 내일 연설한다. 나는 회의를 어떻게 보내야 할까?"
 wm_conference.10.a: "주변 모임에서 연설하세요."
 wm_conference.10.b: "호텔 바에서 음모"
 wm_conference.10.c: "리셉션에서 일하고 인맥을 쌓으세요."
 wm_conference.10.d: "홀에 앉아 리더를 크게, 그리고 눈에 띄게 박수치세요."
 wm_conference_fringe_good: "프린지: 가득 찬 방과 좋은 평가"
 wm_conference_fringe_off_message: "프린지: 발언이 '메시지를 벗어나다'"
 wm_conference_plot_found_out: "음모 계획: 휩들이 엿듣음"

 wm_conference.20.t: "지도부 움직임"
 wm_conference.20.desc: "회의가 끝났고, 이야기의 주제는 내 연설이 아니다. 익명의 동료들이 일요일 신문에 [wm_conference_party.GetNameNoTier]에 \"새로운 출발\"이 필요하다고 말하고 있는데, 이 문구는 결코 새로운 로고를 의미하지 않는다. 당근은 이름이 있다. 문제는 내가 그것에 대해 무엇을 할 것인가이다."
 wm_conference.20.a: "음모자들과 맞서라."
 wm_conference.20.b: "의회 당의 말을 듣겠다는 약속"
 wm_conference.20.c: "웨스트민스터 거품 속 이야기로 일축하다."
 wm_conference_faced_down: "소동: 음모자들의 물러서다"
 wm_conference_not_faced_down: "소동: 이야기는 계속 이어진다"

 wm_conference_triumph_modifier: "회의 성공"
 wm_conference_triumph_modifier_desc: "사람들이 내년에도 제대로 된 이유로 인용할 회의 연설을 했다."
 wm_conference_disaster_modifier: "회의 재앙"
 wm_conference_disaster_modifier_desc: "사람들이 내년에도 잘못된 이유로 인용할 회의 연설을 했다."

 wm_conference_triumph_opinion: "승리의 회의 연설"
 wm_conference_disaster_opinion: "참담한 회의 연설"
 wm_conference_listened_opinion: "당의 말을 듣기로 약속함"
 wm_conference_contacts_opinion: "회의에서 만남"
 wm_conference_fellow_plotter_opinion: "호텔 바에서 함께 계획"
 wm_conference_caught_plotting_opinion: "나를 음모로 공격하다 걸림"
 wm_conference_loyal_applause_opinion: "제 연설에 가장 크게 박수를 보냈습니다"
 wm_conference_off_message_opinion: "부수 모임에서 메시지에서 벗어남"
