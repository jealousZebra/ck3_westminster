l_korean:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "노동당 좌파"
 wm_wing_badge_1_desc: "당내 사회주의 좌파 구성원: 공공 소유, 노조 권리 및 지출. (이 게임에서 실제 의원의 성향은 무작위이며, 그들의 견해를 나타내는 것이 아닙니다.)"
 wm_wing_badge_2: "소프트 레프트"
 wm_wing_badge_2_desc: "당내 온건 좌파 구성원: 지도부의 비판적인 친구, 공공 서비스에 열정적. (이 게임에서 실제 의원의 성향은 무작위이며, 그들의 견해를 나타내는 것이 아닙니다.)"
 wm_wing_badge_3: "노동당 중도파"
 wm_wing_badge_3_desc: "당내 중도파 구성원: 재정 신중, 공공 서비스 개혁, 우선 선거 가능성. (이 게임에서 실제 의원의 성향은 무작위이며, 그들의 견해를 나타내는 것이 아닙니다.)"
 wm_wing_badge_4: "하나의 국가"
 wm_wing_badge_4_desc: "당 내 원 네이션(One Nation) 소속 온건파: 실용적이고 공공 서비스를 지지하는 인물. (이 게임에서 실제 국회의원 파벌은 무작위이며, 그들의 견해를 밝히는 것이 아니다.)"
 wm_wing_badge_5: "자유시장주의자들"
 wm_wing_badge_5_desc: "당내 자유시장파 구성원: 낮은 세금, 작은 국가, 규제 완화. (이 게임에서 실제 의원의 성향은 무작위이며, 그들의 견해를 나타내는 것이 아닙니다.)"
 wm_wing_badge_6: "전통주의자들"
 wm_wing_badge_6_desc: "당내 전통주의자 구성원: 법과 질서, 제도, 국가 정체성. (이 게임에서 실제 의원의 성향은 무작위이며, 그들의 견해를 나타내는 것이 아닙니다.)"
 wm_wing_court_decision: "코트 당 조직"
 wm_wing_court_decision_desc_labour: "의회 노동당 진파가 그들의 지도자에 대해 느끼는 감정 (100명 만점): \n#bold 노동당 좌파#! ([EmptyScope.ScriptValue('wm_ui_wing_size_1')|0]명의 의원): 소프트 레[EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold #! ([EmptyScope.ScriptValue('wm_ui_wing_size_2')|0]명의 의원): 노동당 중도파 [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold #! ([EmptyScope.ScriptValue('wm_ui_wing_size_3')|0]명의 의원): 지지율 [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\n #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! 지지 15명, 나머지는 4 손실. 내각(또는 그림자 내각)에 의석이 없는 파벌은 매달 승인을 잃고; 하원에서 30세 미만의 불평과 반항을 일으키는 파벌, 그리고 3개월 동안 15세 미만의 파벌은 리더십 도전을 제기합니다."
 wm_wing_court_decision_desc_conservative: "보수당 진영이 그들의 지도자에 대해 느끼는 감정 (100명 만점): \n#bold 원 네이션#! ([EmptyScope.ScriptValue('wm_ui_wing_size_4')|0]명의 의원): 자유시장주의자들[EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold 지지 #! ([EmptyScope.ScriptValue('wm_ui_wing_size_5')|0]명의 의원): 전통주의자 [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold #! ([EmptyScope.ScriptValue('wm_ui_wing_size_6')|0]명의 의원): 지지율 [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\nZ #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! 영향력 증가: 15명의 지지를 얻고 나머지는 4 감소한다. 내각(또는 그림자 내각)에 의석이 없는 파벌은 매달 승인을 잃고; 하원에서 30세 미만의 불평과 반항을 일으키는 파벌, 그리고 3개월 동안 15세 미만의 파벌은 리더십 도전을 제기합니다."
 wm_wing_court_decision_tooltip: "당의 편을 유지하세요."
 wm_wing_court_decision_confirm: "윙 선택"
 wm_wing_court_decision_effect_tt: "한 윙을 선택하세요: 그 윙의 당신에 대한 호감도는 15#! #P 상승하고, 다른 윙은 4#!까지 #N 하락합니다."
 wm_wing.1.t: "당을 하나로 묶기"
 wm_wing.1.desc: "기조연설, 정책 고백, 곧 있을 승진 약속. 당의 어느 쪽에 주목이 필요할까요?"
 wm_wing.1.w1: "노동당 좌파에 손을 내밀어 보세요 (승인 [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0])."
 wm_wing.1.w2: "소프트 레프트(승인 [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])에 연락하세요."
 wm_wing.1.w3: "노동당 중도파에게 손을 내밀어 보세요 (승인 [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0])."
 wm_wing.1.w4: "원 네이션에 연락하세요 (승인 [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0])."
 wm_wing.1.w5: "자유시장주의자들에게 연락하세요(승인 [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0])."
 wm_wing.1.w6: "전통주의자들에게 연락하세요 (승인 [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0])."
 wm_wing.10.t: "리더십 도전"
 wm_wing.10.desc: "편지가 들어왔어. 의회 당의 한 파벌이 인내심을 잃고 당신에게 당대표 도전을 [wm_wing_challenger.GetName]했어. 신문들은 이름을 세고 있고, 방송사들은 그래픽을 준비했으며, 네 전화는 계속 울리고 있어. \n\n반란군에게 원하는 걸 줄 수도 있고, 맞서 싸울 수도 있어."
 wm_wing.10.a: "그들이 원하는 것을 제공한다."
 wm_wing.10.a.tt: "당신은 #N 300#! 지지도를 잃습니다; 반란파의 승인율은 #P 30#!, 다른 파의 지지율은 #N 4#! 감소합니다."
 wm_wing.10.b: "맞서라."
 wm_wing.10.b.tt: "A #bold 카리스마 #! [wm_wing_challenger.GetName]와의 경쟁. 이기면 반란은 사그라들고, 지면 그들이 지도권을 장악한다(총리라면 다우닝가도 포함된다)."
 wm_wing_challenge_toast: "리더십 도전 리더십 도전"
 wm_wing_challenge_toast_desc_1: "노동당 좌파가 [wm_wing_leader.GetName]에 반대하여 움직였습니다: [wm_wing_challenger.GetName]가 [wm_wing_party.GetNameNoTier] 지휘권에 도전하고 있습니다."
 wm_wing_challenge_toast_desc_2: "부드러운 좌파(Soft Left)가 [wm_wing_leader.GetName]에 맞서 움직였습니다: [wm_wing_challenger.GetName]이 [wm_wing_party.GetNameNoTier]의 지도자직에 도전하고 있습니다."
 wm_wing_challenge_toast_desc_3: "노동당 중도파가 [wm_wing_leader.GetName]에 반대하여 움직였습니다: [wm_wing_challenger.GetName]가 [wm_wing_party.GetNameNoTier] 지휘권에 도전하고 있습니다."
 wm_wing_challenge_toast_desc_4: "원 네이션(The One Nation)이 [wm_wing_leader.GetName]에 맞서 움직였습니다: [wm_wing_challenger.GetName]이 [wm_wing_party.GetNameNoTier]의 지도자직에 도전하고 있습니다."
 wm_wing_challenge_toast_desc_5: "자유시장주의자들이 [wm_wing_leader.GetName]에 대해 움직였습니다: [wm_wing_challenger.GetName]가 [wm_wing_party.GetNameNoTier]의 리더십에 도전하고 있습니다."
 wm_wing_challenge_toast_desc_6: "전통주의자들이 [wm_wing_leader.GetName]에 맞서 움직였습니다: [wm_wing_challenger.GetName]이 [wm_wing_party.GetNameNoTier]의 지도자직에 도전하고 있습니다."
