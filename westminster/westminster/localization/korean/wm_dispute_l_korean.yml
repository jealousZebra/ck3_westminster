l_korean:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "카운트"
 wm_dispute.1.desc: "#italic Returning officer의 선언#!\n\n[wm_dispute_mp.GetName] [wm_dispute_seat.GetNameNoTier]에서 [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] 포인트 차이로 승자로 선언되었습니다."
 wm_dispute.1.close: "이미 요원들이 투표용지가 두 번 계산되었고 늦게 도착한 상자에 대해 중얼거리고 있을 정도로 상황은 가까워졌습니다. 재검표(일주일, [EmptyScope.ScriptValue('wm_dispute_recount_cost')|0] 비용)는 결과를 바꿀 수 있으며, 아마도 [EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0]%의 확률이 있습니다; 선거 청원(4개월 및 [EmptyScope.ScriptValue('wm_dispute_court_cost')|0])은 결과를 무효로 선언하고 의석을 다시 싸우게 할 수 있으며, 아마도 [EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0]%의 확률이 있습니다."
 wm_dispute.1.clear: "격차가 크지 않습니다. 재검표([EmptyScope.ScriptValue('wm_dispute_recount_cost')|0])는 거의 아무것도 바꾸지 않을 가능성이 높으며, 대중은 패배를 못 받아들이는 사람을 싫어합니다: 이에 도전하는 것은 당신의 프로필과 정치적 자본을 잃게 할 것입니다."
 wm_dispute.1.bad: "격차는 전혀 크지 않았습니다: 엄청난 패배였습니다. 이에 도전하는 것은 당신을 웃음거리로 만들고 화가 난 지지자들을 거리로 나오게 할 수 있습니다."
 wm_dispute.1.a: "승자를 축하하십시오."
 wm_dispute.1.b: "재검표를 요구합니다."
 wm_dispute.1.b.tt: "모든 투표용지는 다시 집계됩니다. 비용이 듭니다; 결과가 근소하지 않으면 프로필과 정치적 자본도 잃게 됩니다."
 wm_dispute.1.c: "선거 법원에 청원"
 wm_dispute.1.c.tt: "판사들은 선거의 진행을 검토합니다. 이는 느리고 비용이 많이 듭니다; 그들은 선거를 무효로 선언하고 새 보궐선거를 명령할 수 있으며, 또는 당신에게 비용을 청구할 수도 있습니다."
 wm_dispute_recount_toast: "[wm_dispute_seat.GetNameNoTier]에서의 재검표"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName]가 [wm_dispute_seat.GetNameNoTier]에서 재검표를 요구했습니다. 개표 직원들이 다시 자리로 돌아갔습니다."
 wm_dispute_court_toast: "선거 청원: [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName]는 [wm_dispute_seat.GetNameNoTier]의 결과에 대해 선거 법원에 청원을 제출했습니다. 판사들은 몇 달 내로 보고할 것입니다."
 wm_dispute_overturned_toast: "재검표 결과 뒤집음 국민투표"
 wm_dispute_overturned_toast_desc: "재검표 후 [wm_dispute_mp.GetName]가 [wm_dispute_seat.GetNameNoTier] 지역구 의원으로 몇 표 차이로 선언된다."
 wm_dispute_upheld_toast: "재검표, 결과 확인"
 wm_dispute_upheld_toast_desc: "[wm_dispute_seat.GetNameNoTier]에서의 재검표 결과 [wm_dispute_mp.GetName]가 국회의원으로 확정되었습니다."
 wm_dispute_void_toast: "선거가 무효로 선언됨"
 wm_dispute_void_toast_desc: "선거 법원이 [wm_dispute_seat.GetNameNoTier]의 결과를 무효로 선언했습니다. 새로운 보궐선거가 있을 것입니다."
 wm_dispute_dismissed_toast: "선거 청원 기각됨"
 wm_dispute_dismissed_toast_desc: "선거 법원은 [wm_dispute_seat.GetNameNoTier] 관련 청원을 기각하고, 청원자에게 비용을 부과했습니다. [wm_dispute_mp.GetName]은 그대로 유지됩니다."
 wm_dispute_national_toast: "항복을 거부한다"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName]는 총선 결과를 받아들이지 않을 것입니다. 아무것도 변하지 않지만, 지지자들이 거리로 모이고 신문들은 무자비합니다."
 wm_dispute_seat_decision: "카운트에 도전"
 wm_dispute_seat_decision_desc: "당신은 의석을 잃었지만, 개표가 정확했나요? 재검표를 요구하거나 선거 법원에 선거 무효를 청원하십시오. 근소한 차이가 아니었다면, 공중은 패배자를 나쁘게 볼 것입니다."
 wm_dispute_seat_decision_tooltip: "잃은 의석의 결과를 문제 삼다."
 wm_dispute_seat_decision_confirm: "고려해 보십시오"
 wm_dispute_seat_decision_effect_tt: "귀하는 결과를 수락할지, #bold 재집계#!를 요구할지 또는 #bold 선거 법원#!에 청원할지를 결정합니다."
 wm_dispute_not_disputed_tt: "결과는 아직 논쟁이 되지 않았습니다."
 wm_dispute_no_byelection_tt: "그 의석은 보궐선거를 기다리지 않습니다."
 wm_dispute_national_decision: "양보 거부"
 wm_dispute_national_decision_desc: "유권자들이 당신을 다우닝가에서 몰아냈습니다. 이를 받아들이지 않을 수도 있습니다: 개표, 우편 투표, 방송사를 문제 삼으십시오. 그러나 아무것도 바뀌지 않으며, 큰 비용이 들고, 가장 분노한 지지자들이 거리로 나올 것입니다."
 wm_dispute_national_decision_tooltip: "총선 결과를 받아들이지 않습니다."
 wm_dispute_national_decision_confirm: "양보 거부"
 wm_dispute_national_decision_effect_tt: "당신은 상당한 #bold 지지와 정치적 자본#!을 잃고, 당신의 당은 여론에서 하락하며, 새로운 총리는 불쾌해하고, #bold 폭동#!이 발생할 수 있습니다."
 wm_dispute_sore_loser_modifier: "패배를 불쾌하게 만드는 사람"
 wm_dispute_sore_loser_modifier_desc: "총선 결과를 받아들이지 않았습니다."
 wm_dispute_bad_loser_modifier: "패배를 잘 받아들이지 못하는 사람"
 wm_dispute_bad_loser_modifier_desc: "명백히 패배한 결과를 문제 삼다."
 wm_dispute_sore_loser_opinion: "양보를 거부했습니다."
