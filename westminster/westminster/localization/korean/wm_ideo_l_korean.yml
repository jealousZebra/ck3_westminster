 # Change Your Politics (common/decisions/wm_ideo_decisions.txt)
 wm_ideo_change_decision: "당신의 정치를 변경"
 wm_ideo_change_decision_desc: "논증은 변하고, 사람들도 변한다. 새로운 정치적 관점을 채택하라: 동료들은 이를 유턴(U턴)이라 부르고, 찬사는 전환을 받아들인다."
 wm_ideo_change_decision_tooltip: "다른 이념을 채택하라."
 wm_ideo_change_decision_confirm: "내 마음을 바꾸다"
 wm_ideo_change_decision_choose: "이념을 선택하세요"
 wm_ideo_change_decision_effect_tt: "당신의 [faith|E]는 당신이 선택한 것이 됩니다. 노동당 또는 보수당의 국회의원은 해당 당의 파벌로 이동합니다."
 wm_ideo_pick_socialist_desc: "사회주의자가 되세요. 공공 소유, 노동자 권리와 불평등 종식: 민주적 사회주의 좌파."
 wm_ideo_pick_social_democrat_desc: "사회민주주의자가 되세요. 충분히 자금이 지원되는 공공 서비스와 혼합 경제를 통한 공정한 국가: 주류 중도좌파."
 wm_ideo_pick_green_desc: "환경주의자가 되세요. 기후 비상 사태 우선, 사회 정의와 공정한 민주주의와 함께."
 wm_ideo_pick_liberal_desc: "자유주의자가 되세요. 개인의 자유, 공정한 투표, 유럽과의 밀접한 관계: 자유주의 전통."
 wm_ideo_pick_centrist_desc: "중도파가 되세요. 이념보다 능력: 온건하고, 친기업적이며 실용적."
 wm_ideo_pick_cross_community_desc: "교차 커뮤니티가 되세요. 연합주의자도 민족주의자도 아님: 북아일랜드 공동체를 위한 공유된 미래."
 wm_ideo_pick_one_nation_desc: "원 네이션 보수주의자가 되세요. 온건하고 부권주의적인 보수주의: 사회적 책임, 안정된 제도, 연합."
 wm_ideo_pick_free_market_desc: "자유시장주의자가 되세요. 성장 촉진을 위한 세금 인하, 규제 완화, 작은 정부."
 wm_ideo_pick_national_conservative_desc: "국가 보수주의자가 되세요. 가족, 국가, 전통, 훨씬 낮은 이민."
 wm_ideo_pick_populist_right_desc: "포퓰리스트가 되세요. 웨스트민스터 기득권에 반대: 국경 통제, 주권, 세금 인하."
 wm_ideo_pick_scottish_nationalist_desc: "스코틀랜드 민족주의자가 되세요. 유럽 속 독립 스코틀랜드, 국내 사회민주적 프로그램."
 wm_ideo_pick_welsh_nationalist_desc: "웨일스 민족주의자가 되세요. 웨일스 자치와 웨일스어 보호."
 wm_ideo_pick_irish_republican_desc: "아일랜드 공화주의자가 되세요. 통일 아일랜드와 분단 종식, 좌파 프로그램과 함께."
 wm_ideo_pick_irish_nationalist_desc: "아일랜드 민족주의자가 되세요. 헌법적 민족주의: 합의에 의한 아일랜드 통일, 권력 공유, 사회민주주의."
 wm_ideo_pick_unionist_desc: "연합주의자가 되세요. 북아일랜드의 영국 내 위치를 무엇보다도 수호."
