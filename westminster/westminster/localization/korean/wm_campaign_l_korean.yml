l_korean:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "선거 유세 중: 1주차 [EmptyScope.ScriptValue('wm_campaign_week_value')|0]"
 wm_campaign.1.desc: "국회가 해산되고 전투용 버스가 외부에서 대기 중입니다. 이번 주에 채워야 할 슬롯이 있고, 제 전화에는 읽지 않은 메시지 140개가 있으며, 누군가 허락 없이 제게 로제트를 달았습니다."
 wm_campaign.1.desc_leader: "\n\n[wm_campaign_party.GetNameNoTier]의 지도자로서, 내가 하는 모든 움직임은 국가적 뉴스입니다. 방송사들은 [wm_campaign_rival.GetName]와의 맞대결을 원하며, 정책 부서는 출시 준비가 되어 있습니다. 고향에서는 [wm_campaign_seat.GetNameNoTier]의 내 에이전트가 선거일 전에 적어도 한 번 만나고 싶어합니다."
 wm_campaign.1.desc_leader_no_rival: "\n\n[wm_campaign_party.GetNameNoTier]의 지도자로서, 내가 하는 모든 움직임은 국가적 뉴스이며, 정책 부서는 출시 준비가 되어 있습니다."
 wm_campaign.1.desc_mp: "\n\n 전국 캠페인은 제가 누군지 전혀 모릅니다. 그게 다행입니다. 중요한 것은 [wm_campaign_seat.GetNameNoTier]입니다: 전단지, 문간, 그리고 지역 신문이 제 사진을 올바르게 인쇄했는지."
 wm_campaign.1.a: "큰 집회를 엽니다."
 wm_campaign.1.b: "TV 토론에서 [wm_campaign_rival.GetFirstName]에 맞서세요."
 wm_campaign.1.c: "TV 토론을 진행하고, 통계를 통해 [wm_campaign_rival.GetFirstName]를 묻으십시오."
 wm_campaign.1.d: "주요 정책을 발표하라."
 wm_campaign.1.e: "[wm_campaign_seat.GetNameNoTier]에서 초인종을 두드리며 방문하세요."
 wm_campaign.1.f: "캠페인 본부에서 조용한 한 주, 전단지 승인."

 wm_campaign_rally_success: "집회: 열광적인 반응"
 wm_campaign_rally_flat: "집회: 정중한 박수"
 wm_campaign_rally_flop: "집회: 반쯤 비어 있는 홀"
 wm_campaign_debate_won: "토론: 즉시 투표가 당신을 위해 결정"
 wm_campaign_debate_lost: "토론: 조명 아래서 좌초되다"
 wm_campaign_debate_wonk_won: "토론: 스프레드시트로 죽다(그들)"
 wm_campaign_debate_wonk_lost: "토론: '재정 여유'에서 관객을 잃다"
 wm_campaign_policy_success: "정책 발표: 영향력 있는"
 wm_campaign_policy_flop: "정책 발표: 비용 분석이 아침 라디오에서 공개됨"
 wm_campaign_door_knock: "도어스텝: 문전에서 승리"

 wm_campaign.2.t: "실수!"
 wm_campaign.2.desc: "내 홍보 담당자는 내일 1면을 본 사람 같은 얼굴이야."
 wm_campaign_gaffe_1: "한 사진작가가 내가 카페에서 베이컨 샌드위치를 먹고 있는 모습을 찍었는데, 그 결과가 온라인에서는 \"아침 식사와 함께한 인질 상황\"으로 묘사되고 있습니다. 이미 밈, 머그컵, 벨소리가 되었습니다."
 wm_campaign_gaffe_2: "공장 방문 후 마이크가 켜져 있는 것을 잊어버려서, 전국에 제가 유권자를 \"라고 부르는 소리가 들렸습니다. 솔직히 좀 지나친 것 같습니다\". 그녀는 점심 이후로 네 번의 인터뷰를 했습니다."
 wm_campaign_gaffe_3: "라이브 라디오에서 우유 한 파인트 가격이 얼마냐고 물었을 때, 저는 \"라고 대답했습니다. 약 11파운드쯤 됩니다. \" 진짜 자신감 있게 말했습니다. 진행자는 9초간 침묵을 지켰습니다."
 wm_campaign_gaffe_4: "사진 찍을 기회에 자신 있게 잘못된 문으로 들어와 찬장 안으로 들어갔고, 카메라들이 내가 다시 나오길 기다렸다. 결국 나는 걸레를 들고 나왔다."
 wm_campaign_gaffe_5: "나는 우리의 전단지 중 하나를 전체 연설 동안 거꾸로 들고 있었으며, 명칭을 잘못 쓴 현수막 아래에서 촬영되었다. 우리 후보자의 이름도 마찬가지였다."
 wm_campaign.2.a: "웃어넘겨. 누구나 나쁜 샌드위치 날이 있어."
 wm_campaign.2.b: "주니어 직원에게 책임을 돌리다."
 wm_campaign.2.c: "적극적으로 하라: 카메라 앞에서 일부러 다시 해라."
 wm_campaign_gaffe_shrugged: "실수: 대중이 다소 친근하게 느끼다"
 wm_campaign_gaffe_stuck: "실수: 모든 뉴스에서 선두"
 wm_campaign_gaffe_viral: "실수: 자기 조롱이 입소문을 타다 (좋은 의미로)"
 wm_campaign_gaffe_doubled: "실수: \"강경 대응\"은 답이 아니었다"

 wm_campaign_doorstep_county_modifier: "문 앞에서 그들의 국회의원을 만남"
 wm_campaign_doorstep_county_modifier_desc: "그들의 국회의원은 선거 운동 동안 이곳에서 집집마다 초인했고, 발을 닦는 것을 잊지 않았습니다."
 wm_campaign_viral_gaffe_modifier: "바이러스 실수"
 wm_campaign_viral_gaffe_modifier_desc: "인터넷이 잊지 못할 캠페인 실수."

 wm_campaign_debate_humiliated_opinion: "TV 토론에서 나를 이겼다"
