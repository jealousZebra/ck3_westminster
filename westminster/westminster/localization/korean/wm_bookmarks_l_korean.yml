l_korean:
 bm_2024_starmer: "2024: 정부 교체"
 bm_2024_starmer_desc: "2024년 7월 4일 총선에서 411석, 174석 차이로 승리했습니다. 키어 스타머가 총리입니다; 보수당은 121석으로 줄었으며 새 지도자를 선출해야 합니다; 자유민주당은 100년 만에 최고의 성적을 거두었고; 개혁당, 녹색당, 그리고 무소속 그룹이 하원에 진출했습니다. \n\n#bold 650명의 의원 모두가 플레이 가능합니다. #!"
 bm_group_2024: "2024"
 bookmark_2024_keir_starmer: "키어 스타머"
 bookmark_2024_keir_starmer_subheading: "총리"
 bookmark_2024_keir_starmer_desc: "대승으로 권력을 가진 총리와 앞에 꽉 찬 업무 수첩."
 bookmark_2024_rishi_sunak: "리시 수낙"
 bookmark_2024_rishi_sunak_subheading: "야당 대표"
 bookmark_2024_rishi_sunak_desc: "현재는 야당 대표, 보수당의 최악의 패배 이후. 그의 당은 곧 후임을 선출할 것이다."
 bookmark_2024_ed_davey: "에드 데이비"
 bookmark_2024_ed_davey_subheading: "자유민주당 대표"
 bookmark_2024_ed_davey_desc: "자유민주당 대표, 72석으로 제3당 복귀."
 bookmark_2024_sam_carling: "샘 칼링"
 bookmark_2024_sam_carling_subheading: "노스웨스트 케임브리지셔 국회의원"
 bookmark_2024_sam_carling_desc: "새 의회에서 가장 젊은 국회의원으로, 20대 초반에 선출되었습니다. 원한다면 긴 경력이 앞으로 기다리고 있습니다."
