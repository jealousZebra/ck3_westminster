 efg_contested_wrath_desc: "경쟁 황제에 맞서 우리의 제국 위임을 옹호하는 조직자들을 이용하는 것은 전사들을 불태우고 대중의 존경을 얻습니다."
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] 직접 황제의 칙령으로 즉시 임명하셨습니다. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]에서 제 새로운 지위의 위임에 도전할 자는 없습니다."
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip] 군대는 나의 뛰어난 군사력과 맞설 수 없었으며, 이로써 [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]의 이름으로 이 지역을 수호하는 더 큰 권한을 증명했다."
 ep3_decisions_event.0007.desc: "그와 함께 [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )]가 다시 달래졌습니다. 나의 힘과 권위의 명령이 재확인되었습니다.\n\n"
 ep3_decisions_event.9010.desc: "저는 깊게 숨을 들이마시고 내쉬며 낚싯줄을 물 속으로 던집니다. 낚시 바늘은 조용히 '툭' 소리와 함께 물에 떨어지고 세상은 정적에 잠깁니다. \n\n제 시선이 해안을 따라 방황하며 혼자 생각할 시간을 갖습니다. 모험가로서의 삶이 나쁘지는 않지만, 어느 삶에도 압박은 존재합니다. 잠시 눈을 감고 쉬려는데 갑자기 낚싯대가 제 손에서 잡아당겨져 깜짝 놀라 깨어납니다."
