 tenet_adoptionism_historical_desc: "예수 평범한 인간으로 태어나 보통 세례 때 성령이 내림했을 때 하나님의 아들로 '입양'되었다고 가르친다. 초기 형태는 2세기 비잔티움의 테오도토스와 함께 등장했으며, 그의 역동적인 군주주의는 하나님의 통일성을 강조했다. \n\n이 가르침은 8세기 스페인에서 톨레도 대주교 엘리판두스와 우르헬의 펠릭스 주교 아래 다시 등장했으며, 이들에게는 그리스도의 신성한 본성과 그의 인간적 본성이 영원히 받아들여졌다. 프랑크푸르트 내각은 서기 794년에 스페인 입양주의가 분열되었다고 규탄했으며, 채택주의 사상은 이후 반삼위일체 운동에도 영향을 미쳤다."
 tenet_apostolic_succession_episcopate_modifier_desc: "이 인물의 이념은 모든 주교를 이전 주교들의 끊어지지 않은 계보를 통해 임명하도록 규정합니다: 존경받는 권위의 역사적 출처입니다."
 tenet_filial_piety_desc: "효 정치적 자본과 연장자에 대한 복종은 인간 선함의 실현에 근본적이다. 부모가 살아 계실 때는 예의로 섬기고, 재산으로 부양하며, 그들의 지도를 배운다; 죽으면 예의로 장례를 치르고, 그 후 예의로 숭배한다."
 tenet_miles_christi_historical_desc: "'그리스도의 병사'(Miles Christi) 개념은 기독교 전통에서 깊은 뿌리를 가지고 있으며, 사도 바울의 서신에서 군사적 비유를 사용해 영적 삶을 설명한 데서 유래합니다. 중세 시대에는 이 개념이 문자적 전쟁과 영적 전쟁 모두에 적용되었습니다. \n\n 군사 기사단인 템플러 및 성엘마 기사단은 이 이상을 구현하여 수도원의 훈련과 무술 능력을 결합했습니다. 클레르보의 베르나르의 'De Laude Novae Militiae'는 이 전사 수도사들을 기독교 미덕의 모범으로 칭송했으며, 세속적 이익을 위해서가 아니라 그리스도교를 방어하기 위해 싸웠다고 했습니다."
 tenet_philanthropia_historical_desc: "비잔틴 기독교에서 philanthrōpia는 보편적 사랑의 미덕과 황제, 주교, 신자들이 지원한 구체적인 기관—병원, xenodocheia, 고아원, 자선—을 모두 지칭했습니다. 카이사리아의 바실리우스, 요한 크리소스토무스, 그리고 후대의 황제들(예: 유스티니아누스)은 제국의 명령을 가난한 자를 돌보는 것과 연결시켰습니다. 교회는 전쟁을 거룩함으로 가는 길로 찬미하지 않았지만, 부와 권력은 결국 가난한 자를 돕는 방식으로 정당화된다는 점을 강조했습니다."
 tenet_vows_of_poverty_desc: "돈은 인간의 마음을 타락시키고 그들을 진정한 이데올로기에서 멀어지게 합니다. 우리가 진정으로 중요한 것에 집중하려면 물질적 부를 추구하는 것을 피하고, 겸손한 활동을 선택하며 그 완성에서 정치적 자본을 찾아야 합니다."
 tgp_sea_legacy_3_name: "봉사와 충성심"
 tgp_sharing_power_modifier_desc: "이 캐릭터는 압박을 완화하기 위해 권력을 공유하고 있습니다."
