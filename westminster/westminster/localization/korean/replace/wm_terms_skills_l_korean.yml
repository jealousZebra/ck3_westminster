 mongol_invasion.1004.desc: "강력한 [old_mongol_emperor.GetFirstName] — 몽골에 정복된 모든 지역의 주인 — 의 죽음으로 여러 후계자가 [old_mongol_emperor.GetHerHis]의 자리를 차지하기 위해 경쟁합니다. 누구도 다른 이의 권위를 인정하지 않을 것입니다.\n\n그래서 이것이 몽골 제국이 통일된 제국으로서의 끝입니다.\n\n이 첫 번째 위대한 정복자의 후손들은 여전히 일부 힘에 집착합니다. 그들은 전쟁을 외칩니다. 그러나 그들 중 누구도, [successor_1.GetName]이나 [successor_2.GetName]도, 우주 전체의 지배자로서 다른 이들보다 뛰어나지 않습니다."
