 game_rule.1101.desc.combat.locale.southwark: "잉글랜드에서 가장 부유한 도시가 이렇게 가까이에 있어 싸울 것이 많습니다. 집이든 전리품이든, 영광이든 정치적 자본이든, 양군은 반복해서 서로 충돌합니다.\n\n템즈강 남쪽 해안은 우리의 피로 거품을 일으키지만, 나는 포기하지 않을 것입니다, 나는 #EMP 결코 #! 물러서지 않을 것입니다.\n\n잉글랜드는 이미 내 것이며, 이 싸움이 그것을 증명할 것입니다. 필요한 것은 단 하나의 마지막 #EMP 추진#!만으로 그것을 증명하는 것입니다—"
 generic_rite_focus_tenet_cranial_trophies: "이 이데올로기는 적의 유해를 승리의 신성한 증거이자 두려운 상징으로 취급합니다."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )]는 적의 유해를 승리의 신성한 증거이자 두려운 위상으로 취급합니다."
 glory_hound_desc: "$glory_hound$ [vassals|E] 지위와 프로필에 신경 쓰며, 자신이 속한 당의 힘을 세상에 보여줌. 대담하거나 무정한 일반 의원은 종종 이 [vassal_stance|E].\n\n#low $glory_hound$ 일반 의원은 다음과 같은 경우를 좋아함:#!\n$EFFECT_LIST_BULLET$ 당 지도자가 어떤 분할 [succession_law|E]\n$EFFECT_LIST_BULLET$ 공격 [victory|E] 달성 시 [wars|E]\n$EFFECT_LIST_BULLET$ 초대할 때 [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ 일반 의원은 다음과 같은 경우를 싫어함:#!\n$EFFECT_LIST_BULLET$ 당 지도자가 높은 [crown_authority|E]\n$EFFECT_LIST_BULLET$ 서명하거나 [defeat|E] 또는 [white_peace|E] 전쟁 참여 시 \n$EFFECT_LIST_BULLET$[marries|E] [lowborn|E] 캐릭터로 [primary_spouse|E]\n\n 일반 의원은 대담하고 용감한 [heirs|E]로 높은 [martial_i][martial|E] 기술을 가진 것을 선호함."
 grand_ambitions.0180.desc: "나는 내 민족의 영적 지도자 [hof.GetTitleAsName] 앞에 서 있다. 공기는 향기와 수세기의 무게로 무겁다.\n\n[hof.GetHerHis]의 은총을 확보하는 것은 [target_title.GetName]에 대한 나의 권위뿐만 아니라 제국 전역의 신실한 사람들의 마음을 움직일 수 있다. [hof.GetSheHe|U]는 반드시 나를 왕관으로 씌워야 한다.\n\n[hof.GetTitleAsNameNoTooltip]는 단순한 영적 인물이 아니다; [hof.GetSheHe]는 [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]의 세속적 책략을 날카롭게 알고 있다."
