 master_of_hunt_court_position_task_dangerous_game_desc: "당신의 $master_of_hunt_court_position$는 추적하면 많은 프로필을 제공할 위험한 사냥감, 예를 들어 늑대 또는 곰을 찾을 것입니다."
 master_of_hunt_court_position_task_legendary_game_desc: "당신의 $master_of_hunt_court_position$는 추적하면 엄청난 프로필을 제공할 전설의 야수를 찾으려 시도할 것입니다."
 master_of_hunt_court_position_task_regular_game_desc: "당신의 $master_of_hunt_court_position$는 추적하면 평균적인 프로필을 제공할 일반 사냥감, 예를 들어 여우 또는 사슴을 찾을 것입니다."
