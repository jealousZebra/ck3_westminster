 intrigue_student: "#D 학생 돌리기 (숨김)#!"
 investiture_crisis_desc: ""
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$는 매달 환멸을 겪고 있는 하렘의 일원을 찾아 돌보며, 그들이 받는 압박과 고통을 완화합니다."
 kharijite_desc: "초기 이슬람 집단은 지도자가 혈통이 아닌 정치적 자본에 근거해야 하며, 죄 많은 통치자는 제거될 수 있다고 믿었다. 그들은 시아파 혼란기 동안 등장했으며, 양쪽 모두를 거부하고 중대한 죄인은 이슬람 밖에 있다고 선언했다."
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc: "이 [modifier|E]은 외교, 음모, 또는 지구력 체크를 통해 해결하도록 책임이 있는 [adventurer|E]에 의해 제거될 수 있습니다."
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier_desc: "이 [modifier|E]은 외교, 학습, 또는 지구력 체크를 통해 해결하도록 책임이 있는 [adventurer|E]에 의해 제거될 수 있습니다."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc: "이 [modifier|E]는 외교, 무력 또는 체력 체크를 통해 해결하도록 책임이 있는 [adventurer|E]에 의해 제거될 수 있습니다."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier_desc: "이 [modifier|E]는 외교, 관리 또는 체력 체크를 통해 해결하도록 책임이 있는 [adventurer|E]에 의해 제거될 수 있습니다."
 laamp_base_4021_contract_scheme: "정책 작업 창조"
 laamp_base_contract_schemes.0011.desc: "[employer.GetTitledFirstNamePossessive] 명성이 그리 좋지 않다는 것은 비밀이 아니다. 불만을 품은 백벤처, 폭군적 행동에 대한 걱정스러운 중얼거림, 무형의 프로필 부족 — 이 모든 징후들은 대부분의 [employer.Custom('LadiesLords')]들이 원하지 않는 것보다 권력 장악이 불안정해질 수 있음을 시사한다. \n\n이런 오해를 해소해 달라고 누군가에게 요청하는 것은 물론 결코 만만치 않을 것이다. 적어도 내가 말할 수 있는 한 말이다."
 laamp_base_contract_schemes.0331.d.tt.success: "정책 자체가 보상입니다."
 laamp_base_contract_schemes.4042.desc: "[employer.GetCapitalLocation.GetTitle.GetName]에서의 우리의 시간은 매우 수익성이 높습니다! [employer.GetTitledFirstNamePossessive]와의 거래는 묵인된 승인이며, 세상의 모든 재빠른 설득으로는 얻을 수 없는 우리 재고에 대한 권한을 부여합니다.\n\n부적, 약, 장식품 및 장신구 — 직원과 손님이 모두 질문 없이 삽니다.\n\n아직은 아닙니다. 그들의 우려가 나타나기 시작할 때쯤이면 우리는 오래 떠나 있을 것입니다."
 laamp_boost_legitimacy_contract_contract: "위임 승진"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U]는 [Localize( god )]를 [ROOT.Legend.GetProtagonist.GetHerHis]의 안내자로 삼아 공정하고 경건하게 통치했습니다. 신성한 계획이 완수되자, [ROOT.Legend.GetProtagonist.GetSheHe]는 큰 존경과 정치적 자본을 가진 삶을 살았습니다."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U]는 모든 [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip]를 위해 끊임없이 노력했고, 지구의 [ROOT.Legend.GetProtagonist.GetFaith.DevilName] 부하들과 싸웠지만, 마침내 [ROOT.Legend.GetProtagonist.GetHerHis]의 어려움은 끝났다. 신성한 계획이 성취되고, [ROOT.Legend.GetProtagonist.GetSheHe]는 큰 명예와 정치적 자본을 가진 삶을 살았다."
 legend_shibi_chakravarti_desc: "겸손과 정치적 영향력의 모범인 영웅적 왕 시비는 새로 변한 현자 아그니를 보호하는 임무를 맡았다. 연이 요구하자 비둘기를 구하기 위해 자신의 살을 바치도록, 시비는 기꺼이 자신의 전부를 내주었지만 목숨을 구하고 아들 카포타로마를 상으로 받았다. 이 이타적인 왕의 피가 모든 [GetDynastyByID('1043008').GetNameNoTooltip]의 혈관 속을 흐르고 있다."
 legendary_conversion_desc: "정치적 자본과 헌신에 관한 전설적인 이야기가 당 내 모든 이들의 마음을 사로잡았습니다. 조금만 격려한다면, 당의 비신자들도 저처럼 예배하도록 격려할 수 있을 것입니다."
 legendary_holy_war_desc: "나의 전설적인 정치 자본 이야기는 끝났고, 진정한 신자들에게는 찬사를 받지만, 비신자들의 마음을 흔들기에는 거의 도움이 되지 않았다. 우리는 우리가 아는 유일한 방법으로 평화로운 길을 계속 전파해야 한다: 칼로."
 legendary_integration_d_desc: "내 통치의 권위를 확립하는 전설들이 당 내에서 전해진다. 이 새로운 권한은 내 당의 핵심 영역으로 여겨지는 것을 확장하고 역사적으로 외국 공작의 지속적인 충성을 요구하는 데 활용될 수 있다."
