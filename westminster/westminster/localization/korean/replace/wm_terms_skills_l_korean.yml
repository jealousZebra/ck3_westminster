 dlc_015_desc: "여러 인기 시스템에 새로운 콘텐츠를 추가한다: 여행, 활동, 라이프스타일. 통치자를 흥미진진한 모험에 보내라, 부, 명성, 혹은 개인적 성장을 추구하든지 간에. 그들을 가만히 두지 마라 — 매 순간 모험이 기다리고 있다!"
 doctrine_imperial_anointment_desc: "의심할 여지 없이 황제로서 통치하려면 무릎을 꿇어야 한다 — 오직 교회의 최고 권위만이 그 최종적이고 의심 없는 명령을 내릴 수 있기 때문이다."
