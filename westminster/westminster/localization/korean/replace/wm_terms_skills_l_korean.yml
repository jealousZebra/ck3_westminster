 roaming_intro_second_half_winter: "저는 이것이 법원의 압박에서 벗어나 쉬는 순간이 되길 바랐지만... 생각보다 더 추웠습니다."
 roaming_outro_snippet_stress_loss_strong_3: "한때 압도적이었던 압박감이 이제는 멀리 있는 것처럼 느껴집니다, 마치 태양에 의해 갈라진 검은 구름처럼."
 roaming_outro_snippet_stress_loss_very_strong_2: "압박감이 사라졌고, 저는 인생에서 새로운 의미를 찾은 것 같습니다."
