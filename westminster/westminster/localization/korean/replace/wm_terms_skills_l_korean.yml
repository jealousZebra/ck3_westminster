 historical_character.mibu_tadamine: "겸손한 출신에도 불구하고, $Tadamine$는 대회에 출전하여 황실 위촉과 후지와라 가문으로부터 후원을 받으면서 그의 와카 시로 큰 당 브랜드를 얻었습니다. 아들 $Tadami$와 함께 그는 일본의 삼십육 명시 중 한 사람으로 꼽히며, 81편 이상의 시가 황실 선집에 포함된 것으로 여겨집니다."
 historical_character.namdev: "남데브는 13세기 마라티의 성인이자 시인으로, 비토바에게 바쳐진 신앙가로 잘 알려져 있으며 마하라슈트라의 박티 운동에서 중요한 인물로 알려져 있다. 평민들에게 인기가 있었던 그의 작품은 마라티어가 시와 정치적 진영의 한 장으로 확산되고 위상을 크게 높였다."
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ 해당 지역에서 목격된 신화 속 동물 찾기\n$EFFECT_LIST_BULLET$ $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E] 증가\n$EFFECT_LIST_BULLET$ 높은 [hunt_danger_no_prefix|E]은 더 많은 [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ 보안 성별이 참여할 수 있음\n$EFFECT_LIST_BULLET$ 비무술 성별은 구경 가능\n#weak 신화 속 생물은 종종 학자들에 의해 전설로 치부되지만, 숲에는 여전히 많은 신비가 존재할 수 있습니다.#!"
 hunt_type_skill_learning: "$BULLET_WITH_TAB$@skill_learning_icon! 정책"
 hunt_type_skill_prowess: "$BULLET_WITH_TAB$@skill_prowess_icon! 체력"
 hunt_type_skill_stewardship: "$BULLET_WITH_TAB$@skill_stewardship_icon! 경제"
 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ 다양한 지역 동물 중에서 사냥감을 선택\n$EFFECT_LIST_BULLET$ 증가 $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ 높은 [hunt_danger_no_prefix|E] 부여 더 많은 [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ 보안은 성별도 적극적으로 참여할 수 있습니다 \n$EFFECT_LIST_BULLET$ 비군사 성별은 관전할 수 있습니다\n#weak 자존심 강하고 교활한 짐승들이 야생을 배회합니다; 그들을 능가하고 극복하는 것은 용맹과 기술을 시험합니다. #!"
 hunt_type_stress: "$BULLET_WITH_TAB$@stress_icon! 압력 손실"
 iberia_north_africa.0111.desc: "이 콘클라베를 소집할 정치적·영적 단합을 쌓는 데 수년이 걸렸지만, 마침내 농민과 당 간부들을 충분히 내 깃발로 끌어들여 거짓 [pope.GetTitledFirstName]을 의미 있게 부인할 수 있게 되었다. \n\n지금도 [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier]의 복도와 손님방은 논쟁적인 성직자들과 열정적인 주교들로 가득 차 있다; 로마가 무시했던 모든 불만을 품은 수도사와 하찮은 [religious_leader.GetFaith.PriestNeuter]들이 내 홀을 막고 있다. \n\n 이 모든 논쟁은 의석 결정에 매우 중요하지만, 궁극적으로 최고의 [religious_leader.GetFaith.GetAdjective] 통치자로서 #EMP my#!라는 단어가 최종 결정적인 표가 될 것입니다."
 iberia_north_africa.0112.desc.righteous: "[religious_leader.GetSheHe]가 매우 부정적으로 보는, [religious_leader.GetFaith.GetReligion.GetName]에 만연한 죄악적인 폭력을 철회하며.\n\n [religious_leader.GetHerHim]에 따르면, [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip]는 단순히 좋은 삶을 사는 것의 정치적 자본에 집중해야 하며, 상대방의 피로 [religious_leader.GetFaith.PositiveAfterLife]로 가는 길을 포장하려고 시도하지 말아야 합니다."
 influence_child_commander_interaction: "워드의 보안 훈련"
