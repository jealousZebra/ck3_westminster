 pam_dulia_relic_learning_per_piety_modifier: "계몽된 충성심"
 pam_great_projects_events.0003.a: "[ROOT.Char.GetDynastyNameNoTooltip]의 명령을 지키는 제시의 나무."
 pam_interactions_events.0034.desc_method_legitimacy: "내 명령에 대한 심각한 위협이야. [target.GetNameNoTierNoTooltip]를 둘러싼 끔찍한 공개 다툼, 우리 둘 다 웃음거리가 되는 스캔들..."
 pam_interactions_events.0034.desc_method_piety: "이미 미약한 저의 이념과의 관계가 완전히 붕괴될 위협. 이는 [actor.GetTitledFirstNameNoTooltip]에게도 명예를 훼손하지만, [actor.GetHerHis]의 정치적 자본은 저보다 더 확립되어 있습니다."
 pam_interactions_events.0050.a: "[recipient.GetFaith.PositiveAfterLife]으로 가는 길? 사랑. 충성."
 pam_measured_devotion_modifier: "측정된 충성심"
 pam_praise_the_gods_quiet_log_title: "조용한 충성 속에서 기도함"
 pam_saint_relic_tzitzit_desc: "[relic_creator_saint.GetShortUINamePossessiveNotMy] 치치트의 신성한 가닥으로, [relic_creator_saint.GetHerHis] 정치적 자본을 보여줍니다."
 pam_sf_church_builder_modifier_desc: "처음으로 예배당을 세운 후, 이 캐릭터는 교회를 조금 더 저렴하게 건설하며 정치 자본을 꾸준히 얻는다."
 pam_sf_devotion_modifier: "번영에 대한 충성"
 pam_sf_devotion_modifier_desc: "이 캐릭터는 개인적인 헌신을 quietly 수행했으며, 정치적 자본과 금전으로 조용히 보상받았습니다."
