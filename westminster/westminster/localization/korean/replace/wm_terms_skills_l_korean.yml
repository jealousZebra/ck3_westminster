 tooltip_pam_papal_populist_intrigue: "스핀"
 tooltip_pam_papal_populist_propagated_piety: "그들의 정치 자본의 말을 전파함"
 tooltip_pam_papal_powerful_stewardship_education: "경제 교육"
 tournament_public_proselytiser_modifier_desc: "이 인물은 토너먼트에서 군중을 호통치며 정치적 영향력을 입증했습니다."
 tradition_battlefield_looters_desc: "이 문화에서는 전투가 명성을 위한 것이 아니라 이익을 위한 것입니다. 전쟁 비용을 지불할 수 없다면 그 사람의 지위가 무슨 소용이 있을까요?"
 tradition_chivalry_desc: "이 문화는 기사도와 기사적 행동 규범을 사회적 규제 수단으로 받아들였습니다. 보안 능력, 의무, 명예, 도덕성이 중시되며, 형편없는 시와 낭만적 문학도 중요하게 여겨집니다."
 tradition_martial_admiration_name: "보안 감탄"
 tradition_tgp_fortified_strongholds_desc: "이 문화는 종교, 군사 및 정부 기능을 수행하는 대규모 요새화 도시가 특징입니다. 이러한 문화적 거점의 보호는 필수적이며, 추가 도시의 건립은 큰 중요성을 지닙니다."
 tradition_tgp_warrior_monks_desc: "도덕적으로 사는 것에 대한 충성이 무력을 사용하는 것을 배제해서는 안 되며, 특히 종교 공동체를 경쟁 종파나 부패한 관리로부터 보호하거나, 도움이 필요한 사람을 방어해야 할 때 그렇다."
 trait_athletic_character_desc: "정기적인 운동은 [ROOT.GetCharacter.GetFirstNameNoTooltip]가 침착함을 유지하고 압박을 해소하는 데 도움이 됩니다."
 trait_athletic_desc: "정기적인 운동은 이 캐릭터가 침착함을 유지하고 압박을 해소하는 데 도움이 됩니다."
 trait_education_diplomacy: "카리스마 학생들"
 trait_education_intrigue: "스핀의 학생들"
 trait_education_martial_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]는 믿을 수 있는 지휘관이자 두려운 전사로, [ROOT.GetCharacter.GetHerHis] 보안 기술로 유명합니다."
 trait_education_martial_3_desc: "숙련된 전략가는 신뢰할 수 있는 지휘관이자 두려운 전사로, 보안 기술로 유명합니다."
 trait_education_stewardship: "경제학 학생들"
 trait_hashishiyah_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]는 일상 생활의 압박을 다루기 위해 해시시 섭취에 의존합니다."
 trait_hashishiyah_desc: "이 캐릭터는 일상 생활의 압박을 다루기 위해 하시시(hashish)를 소비하는 것에 의존합니다."
 trait_inappetetic_character_desc: "압박에 지치거나 육체를 거부하려 하든, [ROOT.GetCharacter.GetFirstName] 식욕을 잃고 식사를 거르며 쇠약해졌다..."
 trait_inappetetic_desc: "압박에 지치거나 육체를 부정하려 하든, 이 캐릭터는 식욕을 잃고 식사를 거르며 쇠약해졌다..."
 trait_intrigue_court: "스핀 스태프"
 trait_intrigue_court_1: "스핀 스태퍼"
 trait_intrigue_court_2: "소중한 스핀 스태퍼"
 trait_irritable_character_desc: "압력으로 인해 [ROOT.GetCharacter.GetFirstNameNoTooltip]는 잦은 분노 폭발과 짜증을 부리기 쉬워졌습니다."
 trait_irritable_desc: "압력으로 인해 이 캐릭터는 잦은 분노 폭발과 짜증을 부리기 쉬워졌습니다."
 trait_track_knight_errant_desc: "의로움을 주장하는 것만으로는 충분하지 않으며, 보여주어야 합니다.\n\n#weak 이 [trait|E]는 명예로운 자질을 보여주는 Justicar, Stamina 또는 Security [task_contracts|E]를 완료함으로써 달성할 수 있습니다."
 travel_city_history_intrigue: "스핀 수업"
 tribal_government_desc: "\n$game_concept_tribal_desc$\n\n#F 부족에서는 힘이 모든 것을 의미합니다. 부족 지도자는 당을 발전시키고 군대를 강화하기 위해 금전보다 존경과 당 브랜드에 의존합니다.#!"
 tribute_mission_decision_desc_mandala: "이제 우리는 존경하는 [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetOverlord )] [ROOT.Char.GetOverlord.GetTitledFirstName]에 대한 경의와 헌사를 표할 시간입니다. [ROOT.Char.GetOverlord.GetTitleAsNameNoTooltip]와의 긴밀한 관계를 보여주는 것은, 다른 것들 중에서도, 우리의 위임을 강화하고 다른 이익도 가져올 수 있습니다..."
 tribute_mission_decision_hegemony_common: "우리 지평선에 무겁게 드리워져 있으며, 조용히 우리가 경의를 표시하도록 요구합니다. 조공을 보내는 것은 다른 것들 중에서도 우리의 권한을 강화하고 다른 혜택도 가져올 수 있습니다..."
 unity_competitive_spies_modifier: "스핀 네트워크"
 unity_establish_network_decision: "스핀 네트워크 시행"
 viz_extravagance.t4.charity.bridges: "이 캐릭터는 당 내에서 새로운 다리를 건설하고 유지하는 데 쓰는 돈으로 명성을 얻었으며, 이는 모든 공무원에게 최고의 프로필 지표입니다."
