 stress_loss_hashishiyah_decision_desc: "몇 입만 먹어도, 압력이 내 몸에서 흘러나가는 것 같습니다. 내 정신은 흐려지고, 평화롭고 편안한 감각이 나를 압도합니다. 좋은 해시시만큼 편안한 것은 없습니다!"
