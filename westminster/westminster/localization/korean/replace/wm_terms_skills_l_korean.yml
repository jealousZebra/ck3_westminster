 setting_default_casus_belli_costs_desc: "Casus Bellis는 프로필 또는 정치적 자본과 같은 선언 비용이 드는 자원입니다."
 setting_easy_difficulty_desc: "질병, 적대적 계획 및 압력의 영향을 줄이는 등 보너스를 받게 됩니다. 파벌을 다루기도 더 쉬워집니다."
 setting_hard_difficulty_desc: "AI 통치자는 압박이 적고 파티가 더 안정적인 등의 보너스를 받게 된다. @alert_icon! #alert_trial 이는 AI 파티를 훨씬 더 안정적이고 부유하게 만들어, 게임의 밸런스를 떨어뜨릴 수 있다. #!"
 setting_very_easy_difficulty_desc: "질병, 적대적 계획 및 압력의 영향을 줄이는 등의 큰 보너스를 받게 됩니다. 파벌을 다루는 것이 훨씬 더 쉬워집니다."
 setting_very_hard_difficulty_desc: "AI 통치자는 압박이 적고 파티가 더 안정적인 등의 상당한 보너스를 받게 된다. @warning_icon! #X 이는 AI 파티를 매우 안정적이고 부유하게 만들어, 게임의 밸런스를 떨어뜨릴 수 있다. #!"
