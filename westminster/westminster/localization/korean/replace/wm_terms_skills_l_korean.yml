 ep3_governor_yearly.3040.a.flavor: "이러한 효심 가득한 정치적 자본은 우리 둘 모두를 강화시킬 수 있습니다."
 ep3_governor_yearly.3040.desc: "나는 기억하려고 애쓰고 있지만 — [emperor.GetPrimaryTitle.GetName]는 정말로 고귀한 [emperor.GetTitledFirstName]가 [emperor.GetHerHis]의 홀을 잡기 전에는 순수한 어둠과 혼란이었는가?\n\n사교계 사람들은 [emperor.GetHouse.GetName]와 함께하는 것 외에 다른 꿈을 꾸었는가? 우리 군인들은 어떤 추하고 얼룩진 낯선 이의 이름을 외쳤는가? 우리 재벌들은 — [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip]의 완벽한 육체로 만들어지지 않은 발을 입맞춤할 멸사한 적이 있는가?\n\n나는 사실 기억할 필요가 없다. 내 군주의 무오류 명령에 질문하는 것은 헛된 일이다."
 ep3_governor_yearly.8070.desc: "명예, 프로필, 권력. [ROOT.Char.GetTitleAsNameNoTooltip]가 되면 이 모든 것을 얻을 수 있지만, #EMP 비용이 #! 있습니다... \n\n숫자의 [ROOT.Char.Custom('GetWritingMaterial')]이 쌓여 내 도장이나 검토를 기다리며 앉아 있고, 끝없는 관료들이 돌아가며 내 귀를 무의미한 세부사항으로 채웁니다.\n\n아무도 이렇게 #EMP 많은 #! 일이 있을 것이라고 말하지 않았습니다 — 결국 저절로 되는 일임에도 말입니다."
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "수십 년 동안 나는 지식인들의 발자취를 따라 걸었고, 남자들의 분노에 맞서 서 있었다. 나의 시는 당의 브랜드 속에서 끊임없이 성장했지만, 여전히...\n\n무언가가 부족하다. 이제 나의 황혼기가 다가온 지금, 아마도 [cordoba.GetName]를 떠나 세상을 넓게 바라볼 때인지 모른다?\n\n여전히 내 마음 속 한 부분이 남아서 머물고 싶어한다. 나는 나 자신뿐만 아니라, 수년간 여기에 훈련받은 많은 제자들을 위해서도 이곳에서 삶을 쌓아왔다.\n\n학자들이 거리를 활보하거나 벽의 친숙한 고색찬연함 때문인지, #EMP 무언가#!가 나를 이 도시, 내 집에 묶어 놓는다."
