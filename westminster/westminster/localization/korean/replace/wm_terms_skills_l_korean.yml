 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:제목 글꼴 #size:15 십자군 왕들의 전설 III#!#!#!\n11세기 북부 이탈리아의 복잡한 태피스트리 속에서, 카노사의 마틸다는 가족 내에서 여러 불행한 죽음 이후 상당한 정당을 다스리고 있다. 마틸다의 정치적 수도에 대한 전설과 마법에 대한 속삭임은 그녀의 통치에 신비로움을 더한다. \n\n#bold 그녀의 통치를 지켜서 카노사 가문이 중세 이탈리아의 끊임없이 변하는 풍경 속에서 대대로 이어지도록 할 수 있겠는가? #!"
 bp2_destiny_tutor_modifier: "보안 조언"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "[ROOT.Char.Custom('GetDaughterSon')]와 같은 모범적인 [ROOT.Char.GetFaith.HighGodName]의 하인이 된다는 것은 정말 기쁜 일입니다! 모든 사람이 [pious_parent.GetHerHim]를 [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]라고 부를 때 내 마음속에서 느끼는 열정은 말로 표현할 수 없습니다! [pious_parent.GetHerHis|U]의 덕은 [ROOT.Char.GetFaith.PriestNeuterPlural]와 독실한 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] 모두에게 존경받습니다. \n\n 나는 과연 내 [pious_parent.GetMotherFather]의 그림자 속에 겸손하게 머물게 될까요? 아니면 내 삶에서 그런 정치적 영향력을 이루고 능가하게 될까요? [ROOT.Char.GetFaith.HighGodName]의 은총이 [pious_parent.GetHerHim]에게 나타나는 것처럼 내게도 드러날까요?"
 bp2_yearly.6060.c: "정책은 모든 힘의 근원입니다."
 budding_godhood_modifier: "고귀한 충성심"
 building_dvin_shuka_01_desc: "드빈의 고귀한 시장은 태고부터 아르메니아 상업의 중심지로 기능해 왔습니다. 그 벽들은 다채로운 타일과 착색된 회반죽으로 장식되어, 이 고대 시장의 부와 위상을 반영합니다."
 building_legendary_shrine_desc: "이 예배 장소는 단순한 공학적 업적일 뿐만 아니라 순례자와 신앙심 깊은 이들에게 안전한 피난처이며, 위원의 정치적 자본을 증명하는 장소이기도 합니다. 비록 중심지로 간주되지는 않지만, 이 건물의 웅장함 덕분에 이 지역구는 이 지역에서 큰 종교 중심지가 되었습니다."
 building_leisure_palace_02_desc: "여름 궁전은 우리 고된 백성들의 평범한 삶과는 떨어진, 경치 좋은 지역에 위치해 있습니다. 왕권과 명성을 과시할 수 있는 더 나은 방법은 없으며, 단순히 우리가 #emphasis 이 더 #! 뛰어나다는 사실 자체가 그렇습니다."
 building_martial_learning_outro_03_desc: "나는 전투 전략과 역사적 결과를 형성하는 데 있어 보안 기술의 중요성에 대한 상당한 지식을 얻었다."
 building_notre_dame_destination_desc: "웅장한 [GetBuilding('notre_dame_01').GetName]은 우뚝 솟은 첨탑과 웅장한 외관으로 고딕 건축의 걸작이다. 내부는 정치적 자본의 메아리로 공기가 울려 퍼지며, 각 스테인드글라스 창문과 조각품이 신성한 이야기를 전한다."
 building_oath_warriors_building_02: "보안 부동산"
 building_oath_warriors_building_04: "방대한 보안 자산"
 building_stilted_granaries_03_desc: "프로필 조각은 잉여를 표시합니다; 집사들은 더 긴 행군을 위해 저장고와 배급을 회전시킵니다."
 building_type_longhouses_01_desc: "부족의 추장, 원로 및 군 지도자들은 결정할 때 장롱에서 모두 회의를 한다. 웅장한 홀은 모임을 주최하는 사람에게 명성을 가져온다."
 building_type_oath_warriors_building_01: "보안 보조금"
 building_wantilan_02_desc: "넓고 층이 있는 강당은 축제와 입회식을 처리하며, 공유된 이념이 사기와 위상을 높입니다."
 building_watchtowers_07_desc: "이 작은 탑집들은 매우 견고하게 요새화되어 있으며, 소유자의 프로필을 나타냅니다. 습격이 있을 경우, 전체 가축 떼가 탑에 의해 둘러싸이고 보호될 수 있습니다."
 building_water_temples_03_desc: "적절한 물 신전 회로는 동기화된 식재 및 휴지기를 감독합니다; 해충은 줄고, 생산량은 증가하며, 의례적 정치 자본은 성장합니다."
 ce1_completed_my_holy_legend_desc: "저는 정치적 자본과 신성을 세계 구석구석에 퍼뜨렸습니다."
 ce1_completed_my_holy_legend_desc_second_perspective: "정치적 자본과 신성을 모든 세계 구석구석에 전파했습니다"
 ce1_completed_my_holy_legend_desc_third_perspective: "[owner.GetTitledFirstName]는 정치적 자본과 신성함의 이야기를 세계의 모든 구석에 퍼뜨렸습니다."
 ce1_completed_my_legitimizing_legend_desc: "저는 과거의 위대한 인물들과의 전설적인 연관성을 이야기하며 제 권한을 증명했습니다."
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "위대한 과거 인물들과의 전설적인 연결을 이야기하며 권한을 증명했습니다"
 ce1_completed_my_legitimizing_legend_desc_third_perspective: "[owner.GetTitledFirstName] 과거 위대한 인물들과의 전설적인 연관성을 이야기하며 [owner.GetHerHis] 임무를 입증했다[owner.GetHerHis]"
 ce1_legitimacy_legacy_track: "[dynasty_perk|E] 위임"
 ce1_legitimacy_legacy_track_name: "위임"
 chancellor_task_neighbor_increased_opinion: "능숙한 카리스마"
 chancellor_task_powerful_vassal_increased_opinion: "능숙한 카리스마"
 chariot_race.0200.h.flavor: "내가 여기서 한가롭게 잔치를 벌이고 있다면 [foe.GetPrimaryTitle.GetNameNoTooltip]에 대한 승리가 확실하지 않은 것인가? 다가오는 승리의 순간에 흥분하자!"
 christian_saint_bone_description: "[christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip]로의 [saint_bone_owner.GetHerHis] 순례 중 [saint_bone_owner.GetNameNoTooltip]가 획득한 [saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip] 성인의 명성이 있는 유골은 [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip]가 행운과 정치적 자본의 상징으로 숭배합니다."
 claim_throne_increased_responsibility_desc: "저는 당에 대한 더 큰 책임을 맡게 되었고, 제 권한을 강화했습니다."
 clerical_chastity_offer_piety: "정치적 자본 제공"
 commission_epic_emphasized_intrigue_modifier: "스핀의 이야기"
 confucian_faith_desc: "유교는 공자와 그의 제자들의 가르침에 뿌리를 둔 철학적 및 윤리적 전통으로, 도덕적 자기 수양, 효(孝) 정치 자본, 그리고 올바른 행동을 통한 사회적 화합 유지를 강조한다."
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \" 오랫동안 [activity.GetHost.GetPrimaryTitle.GetNameNoTier]에 속한 땅은 더 낮은 자들의 지배를 받았다. 권리를 가진 것으로 착각한 자들에 의해.\n\n 이제 그것은 끝난다. [activity.GetHost.GetCapitalLocation.GetName]부터 그들은 진정한 통치를 알게 될 것이다. 나에 의해.\"#!"
 coronation_events.0310.c: "제 임무와 프로필입니다."
 coronation_legitimacy_memory: "[host.GetTitleAsNamePossessiveNoTooltip] 대관식에서 입증된 권한"
 coronation_legitimacy_memory_desc: "나는 [host.GetTitledFirstNamePossessive]의 즉위식에 참석했고 [host.GetTitleAsNameNoTooltip]에게서 나의 위임을 인정받았습니다."
 coronation_legitimacy_memory_desc_second_perspective: "[host.GetTitledFirstNamePossessive] 대관식에 참석하고 [host.GetTitleAsNameNoTooltip]로부터 권한을 인정받았습니다"
 coronation_legitimacy_memory_desc_third_perspective: "[owner.GetTitledFirstName]는 [host.GetTitledFirstNamePossessive] 대관식에 참석했고 [host.GetTitleAsNameNoTooltip]에서 [owner.GetHerHis] 명령을 인정받았습니다."
 court_brahmin_court_position_desc: "힌두교와 불교 법정 모두에서 존경받는 사제로 여겨지는 사무 브라흐민은 의식을 수행하고, 행사들을 감독하며, 통치자의 명령을 전파하는 책임이 있다."
