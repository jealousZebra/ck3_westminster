l_korean:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "베네피스는 당원 구성원이 신탁(commendam#!)으로 수여받을 수 있는 지역적이거나 외딴 재산, 관직, 또는 교황의 공동 수입을 #i 말했다. 이들은 보통 직접적인 행정 책임 없이 수입을 창출했다."
 additional_mandala_government_piety_levels: "[mandala|E] [government|E]는 [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] 후, [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]을 포함하여 추가 정치 자본(Political Capital) 레벨을 잠금 해제할 수 있습니다. 그 정도의 신성을 달성하려면 그들의 충성심이 여러 세대에 걸쳐 증명되어야 합니다."
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$는 [crown_authority|E]의 최고 수준입니다. [vassals|E]는 [liege|E]에 대해 #N -30#! [opinion|E] 패널티를 가집니다.\n\n이 수준에서 — [high|E]와 [limited|E] 왕권 효과와 더불어 — 통치자는 [prestige|E] 비용으로 [designated_heir|E]를 선택할 수 있습니다.\n\n또한, 후배 의원들은 외국 통치자에게조차 전쟁을 선포할 수 없습니다."
 game_concept_acclaimed_knight: "스타 주최자"
 game_concept_acclaimed_knight_desc: "[knight|E]가 [accolade|E].\n\n를 보유하고 있습니다. 스타 주최자가 되려면, 주최자는 [unlanded|E] 또는 [baron|E]이어야 하고, 최소 [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] 이상의 [prowess|E]를 가져야 합니다. 스타 주최자는 그들의 [liege|e]의 다른 스타 주최자가 이미 가지고 있지 않은 최소 하나의 [accolade_type|E]를 가질 자격이 있어야 합니다.\n\n스타 주최자는 전투에서 죽거나 포로가 될 가능성이 적습니다. 그들은 주로 [wars|E]와 싸우고 [GetActivityType( 'activity_tournament' ).GetName]와 같은 [activities|E]에 참석함으로써 [glory|E]를 향상시킬 수 있습니다.\n\n인정받는 주최자는 때때로 그들의 찬사의 속성과 관련된 [skills|E]와 [traits|E]를 얻을 수 있습니다."
 game_concept_acclaimed_knight_possessive: "스타 주최자"
 game_concept_acclaimed_knights: "스타 주최자"
 game_concept_accolade_desc: "업적은 [liege|E]에게 [knights|E]가 부여받는 명예입니다.\n\n업적을 소유한 조직자는 [acclaimed_knight|E]가 됩니다.\n\n스타 조직자가 [glory|E]를 얻으면, 그들의 [accolade_squires|E] 적성이 증가하여 ([accolade_succession|E]을 개선) [accolade_ranks|E]을 얻을 수 있습니다. 이는 더 많은 [accolade_types|E]을 잠금 해제할 수 있게 하여 더 강력한 보너스를 제공합니다.\n\n스타 조직자가 사망하면 [accolade_succession|E]가 발생하며, 조직자는 [accolade_squires|E] 적성에 의해 기술이 조정된 계승자가 즉시 교체됩니다.\n\n[innovations|e] 및 더 높은 [title_tiers|e]를 통해 [rulers|E]가 동시에 더 많은 업적을 가질 수 있습니다."
 game_concept_accolade_squires_desc: "각 [accolade|E]에는 Squires Aptitude 지표가 있으며, 이는 다음 [acclaimed_knight|E]의 [traits|E] 및 [skills|E](주로 [prowess_skill|E], [martial_skill|E] 및 [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E])을 수정합니다.\n\nSquires의 Aptitude는 5단계가 있습니다:\n$EFFECT_LIST_BULLET$Accomplished\n$EFFECT_LIST_BULLET$Capable\n$EFFECT_LIST_BULLET$Inexperienced\n$EFFECT_LIST_BULLET$Feckless\n$EFFECT_LIST_BULLET$Pathetic\n\nInexperienced 이상의 Aptitude를 가지면 Star Organiser가 젊고 무술 성별 [courtiers|E]의 [traits|E] 및 [skills|E]에 간헐적으로 영향을 미쳐, 그들이 [accolade_succession|E] 시 Accolade를 우선적으로 받을 수 있게 합니다.\n\nSquires는 주로 [glory|E] 획득으로 향상되지만, 또한:\n$EFFECT_LIST_BULLET$Star Organiser의 [prowess_skill|E]\n$EFFECT_LIST_BULLET$Star Organiser의 [martial_skill|E]'\n$EFFECT_LIST_BULLET$Star Organiser가 [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$Star Organiser가 [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$Accolade의 [martial_skill|E]의 [liege|E]\n$EFFECT_LIST_BULLET$Accolade의 [prowess_skill|E]의 [liege|E]\n\n각 [accolade_succession|E]는 Accolade의 Squires를 초기화합니다."
 game_concept_accolade_succession_desc: "업적 계승은 [accolade_possessive|E] [acclaimed_knight|e]이 사망하거나 무효가 될 때 발생합니다.\n\n이전 스타 조직자는 즉시 교체됩니다. 업적의 [accolade_squires|E] 적성으로 인해 훈련받은 젊은 [courtiers|E] 및 [knights|E]가 우선적으로 계승자로 선호되며, 그 다음에는 다른 조직자, 다른 직원, 방랑자, 마지막으로 새로 생성된 [characters|E]이 선호됩니다. 업적의 [accolade_squires|E] 적성을 기반으로 새로운 조직자는 [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E] 및 경우에 따라 다른 [skills|E]가 증가합니다.\n\n업적 계승 후 소량의 [glory|E]가 손실될 수 있으며, 업적의 견습생 적성은 새로운 스타 조직자의 기술과 경험을 반영하도록 초기화됩니다\n\n스타 조직자가 전투, 결투 또는 다른 명예로운 방식으로 사망하면 명예 손실이 무효화되고 업적의 견습생이 개선됩니다."
 game_concept_accolade_type_desc: "[accolade|E]는 최대 #value 3#! 속성을 가질 수 있으며, 속성의 높은 레벨이 잠금 해제될수록 스케일링 보너스를 제공합니다. 각 속성은 #value 3#! 레벨을 가지고 있습니다. 공로가 [accolade_rank|E]를 증가시키면, 소유자는 기존 속성의 레벨을 올리거나 새로운 속성을 공로에 추가할 수 있습니다. 그러나 [acclaimed_knight|E]는 새로운 속성의 요구 조건을 충족해야 합니다.\n\n각 [knight|E]는 특정 속성에만 적합하며, 이는 [traits|E], [skills|E] 또는 조직자로 활동하는 동안 경험적인 잠금 해제를 기반으로 할 수 있습니다.\n\n모든 공로는 고유한 속성을 가져야 합니다: 파티 리더 #high 는 #! 공로 간에 속성을 중복할 수 없습니다. 각 공로는 또한 #value 1#! [men_at_arms|E] 유형 속성에만 특화될 수 있습니다."
 game_concept_ai_economical_boom_personality_desc: "$game_concept_ai_economical_boom_personality$는 모든 [gold|E]을 [realm|E]에 투자하고 싶어합니다. 그들은 재정을 비워 [buildings|E]와 [men_at_arms|E]을 자금 지원하고, 종종 더 많은 [economic_buildings|E] 및 [holdings|E]를 건설합니다. 그들은 강력한 [faction|E]과 같이 직접적인 위협을 받는 경우에만 자금을 비축합니다.\n\n$game_concept_ai_economical_boom_personality$ 통치자는 [legends|E]를 창조하고 홍보할 가능성이 약간 낮습니다.\n\n건축 성향이 있으며 [war|E]에 특별한 성향이 없는 대담한 통치자는 일반적으로 $game_concept_ai_economical_boom_personality$입니다.\n일반적인 특징에는 [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], 그리고 [GetTrait('profligate').GetName( GetNullCharacter )]가 포함됩니다. [GetFocus('stewardship_domain_focus').GetName]를 가진 통치자들도 $game_concept_ai_economical_boom_personality$인 경향이 있습니다."
 game_concept_ai_pious_builder_personality_desc: "$game_concept_ai_pious_builder_personality$는 모든 [gold|E]을 [piety|E] 증대에 투자하고 싶어합니다.\n\n그들은 재정을 사용하여 종교적 및 의식적 [buildings|E], [great_projects|E], [activities|E] 및 [decisions|E]을 자금 지원하고, 종종 더 많은 [pious_buildings|E] 및 [temple|E]- 또는 [temple_citadel|E] [holdings|E]를 건설합니다. 그들은 강력한 [faction|E]과 같이 직접적인 위협을 받는 경우에만 자금을 비축합니다.\n\n$game_concept_ai_pious_builder_personality$는 신성한 [legends|E]를 창조하고 홍보할 가능성이 더 높습니다.\n\n열정적인 [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E]로써 [virtue|E]에 대한 성향은 있으나 [war|E]에 대한 특정한 기질은 없는 경우, 일반적으로 $game_concept_ai_pious_builder_personality$입니다.\n일반적인 특징에는 [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], 그리고 [GetTrait('generous').GetName( GetNullCharacter )]가 포함됩니다. [GetFocus('learning_theology_focus').GetName]를 가진 통치자들도 $game_concept_ai_pious_builder_personality$인 경향이 있습니다."
 game_concept_ai_warlike_personality_desc: "$game_concept_ai_warlike_personality$ [ruler|E]는 항상 [war|E]을 선언할 준비가 되어 있기를 원합니다. [gold|E]를 [war|E]에 쓰기 전에 [realm|E]을 개발하는 데 투자하지 않고 저장합니다. $game_concept_ai_warlike_personality$ 통치자가 장기간 평화 상태에 있다면, 그들은 전쟁 기금(Funds)을 사용하여 [buildings|E]를 건설할 것입니다.\n\n$game_concept_ai_warlike_personality$ 통치자는 영웅적인 [legends|E]를 창조하고 홍보할 가능성이 더 높습니다.\n\n대담하고 탐욕스러운 통치자는 전쟁을 일으키는 경향이 있습니다.\n일반적인 특성에는 [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )], [GetTrait('zealous').GetName( GetNullCharacter )]가 포함됩니다."
 game_concept_alliance_desc: "$game_concept_alliance$는 두 [rulers|E] 간의 외교 관계입니다. [independent|E] 군주는 서로의 [wars|E]에 참여하라고 $game_concept_allies$를 호출할 수 있습니다.\n\n동맹은 [marriage|E] 또는 [betrothal|E]를 통해 생성되고 유지됩니다. 단, 결혼한 두 캐릭터가 두 군주와 충분히 가까운 친척 관계여야 합니다. 예를 들어, [king|E]이 딸을 다른 왕의 아들에게 시집보내면, 두 왕은 $game_concept_allies$가 됩니다.\n\n[lieges|E]는 그들의 [vassals|E]와도 $game_concept_alliances$를 생성할 수 있습니다. 당 대표는 후방 멤버를 전쟁에 호출할 수 없지만, 그들이 [factions|E]에 참여하는 것을 막습니다."
 game_concept_anointment_request_desc: "요청 임명(Request Anointment) [character_interaction|E]는 [empire|E] [title_tier|E] 이상의 [ruler|E]가 자신의 [head_of_faith|E]에 사용하거나, 당 관리 [head_of_rite|E]가 없을 때 [anointment|E]에서 지지를 확보하기 위해 사용할 수 있는 특별한 상호작용입니다."
 game_concept_archdiocese_desc: "대교구는 [clerical_region|E]의 [christian|E] 형태로, [archbishop|E]가 [clerical_title|E]을 통해 보유하고 수도 [county|E]에 위치한 교회 포트폴리오로, [grand_cathedral|E]을 세울 수 있습니다. \n\nA [christian|E] [ruler|E] 영적 사안에서 대[capital|E] [county|E]교구의 [archbishop|E]에 응답하며, 대교구에 속한 영토는 합쳐 [the_christian_church|E] [situation|E]을 구성합니다."
 game_concept_aspect_of_serenity_desc: "평화로운 정당은 번영하는 정당입니다 — 평정 측면은 평온과 외교적 거래를 소중히 여기며, 이에 동조하는 사람들에게 보너스를 부여합니다.\n$EFFECT_LIST_BULLET$은 [diplomacy|E]\n$EFFECT_LIST_BULLET$에 중점을 둡니다.[wars|E] 회피는 [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L] 스택\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName]와 [GetScheme('befriend').GetTypeName] [schemes|E]에서 처음 소개됩니다.\n$EFFECT_LIST_BULLET$ 또한 #high 할 수 있습니다.$request_great_project_contribution_interaction$s#!은 [allies|E]\n$EFFECT_LIST_BULLET$에서 제공됩니다. [death_natural_cause|E] 또는 [death_religious|E]에서만 사망할 수 있습니다. [character_death_deaths|E]"
 game_concept_at_peace_opinion_desc: "[GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E]을 [faith|E]의 일부로 가진 캐릭터는 [offensive_war_opinion|E] 페널티 대신 '$game_concept_at_peace_opinion$'를 가지게 됩니다.\n\n 너무 오랫동안 평온하면, [vassals|E]는 당신을 #weak 덜 존중할 것입니다 (만약 그들이 당신과 같은 이념을 공유한다면).#!"
 game_concept_autonomous_vassals: "자율 백벤처 의원"
 game_concept_autonomous_vassals_crown_authority: "자율 백벤처 크라운 당국"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$'는 [crown_authority|E]의 가장 낮은 수준입니다. 이 수준에서, [vassals|E]은 [liege|E]에 대한 [opinion|E] 페널티가 없으며, 당 대표는 그들에 대해 기본적인 권한만 가집니다."
 game_concept_available_spouse_desc: "통치자의 [council|E]에서 봉사하기 위해서는, [spouse|E]가 그 역할의 책임을 수행할 수 있어야 합니다.\n\n여러 상황이 $game_concept_spouse$가 이러한 책임을 수행하는 것을 막을 수 있지만, 가장 일반적인 경우는 다음과 같습니다:\n$BULLET_WITH_TAB$자신의 [realm|E]의 [ruler|E]인 경우\n$BULLET_WITH_TAB$다른 통치자의 [court|E]에 거주하는 경우\n$BULLET_WITH_TAB$[imprisoned|E]국내외 어디에 있든 \n인 경우$BULLET_WITH_TAB$[GetTrait('incapable').GetName( GetNullCharacter )][trait|E]\n\n사용 불가능한 배우자가 다시 가능하게 되면, 자동으로 장관직에서 임무를 재개합니다.\n\n자체적으로 통치자인 배우자가 당신의 [direct_vassals|E]인 경우에도 장관직에서 봉사할 수 있지만, 그렇지 않은 경우에는 절대 가능하지 않습니다."
 game_concept_baronies: "병동"
 game_concept_barony: "워드"
 game_concept_beneficiary_desc: "[great_holy_war|E]의 모든 참가자는 자신의 [dynasty|E]에서 $game_concept_beneficiary$을 선택할 수 있습니다. 승리하면 $game_concept_beneficiary$은 후원자 통치자의 [war_contribution|E]에 비례하여 대상 정당의 토지를 받게 됩니다. \n\n가장 큰 기여자는 자신의 수혜자에게 싸움 중인 주요 작위를 강제로 받을 수 있습니다."
 game_concept_buy_claim_desc: "캐릭터가 [unpressed_claims|E]를 [piety|E]와 교환하여 구매할 수 있는 상호작용입니다.\n\n$EFFECT_LIST_BULLET$A [vassal|E]는 어떤 [liege|E]의 [title|E]에 대한 청구권을 구매할 수 없으며, 파티 리더는 어떤 하원의원(Backbencher)의 타이틀에도 청구권을 구매할 수 없습니다.\n$EFFECT_LIST_BULLET$A [king|E] 또는 [emperor|E]는 국가 타이틀에 대한 청구권을 구매할 수 없으며, 황제(Emperors)는 다른 제국(Empires)에 대한 청구권을 구매할 수 없습니다.\n$EFFECT_LIST_BULLET$ 누구도 자신의 [head_of_faith|E]에 대한 청구권을 구매할 수 없습니다."
 game_concept_canonized_desc: "사후에 성인이나 Wali 또는 존경받는 조상과 같은 다른 이데올로기상 동등한 존재로 선언된 [character|E]는 [GetTrait('saint').GetName( GetNullCharacter )] [trait|E]를 얻습니다.\n\n덕행한 삶은 $game_concept_canonization$로 끝날 수 있습니다: 이는 [decision|E]를 통해 청원되며, [head_of_faith|E]의 축복이 필요할 수 있고, 성인의 묘지를 봉헌함으로써 봉인됩니다. 이후 그들의 안식처는 경건한 여행자를 끌어들이며, 그들의 유해는 [holy_relics|E]를 가져올 수 있습니다."
 game_concept_capital_duchy: "수도권"
 game_concept_capital_duchy_desc: "$game_concept_capital_duchy$ 수정자는 동일한 [de_jure|E] [duchy|E] 안에서 당신의 [capital|E]로부터 보유하고 있는 모든 [holdings|E]에서 얻는 [levies|E]의 양을 증가시킵니다. 또한 모든 [stationed|E] [men_at_arms|E]에 보너스를 제공합니다. 이 수정을 활성화하려면 관련 지역을 직접 보유하고 있어야 합니다. \n\n 이 수정자는 본거지(Home Base) 보너스와 중첩되지 않습니다."
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$는 특정 [claimant|E]를 [ceremonial_liege|E]로 임명하려고 한다. 만약 성공하면, 현직 의례적 당 대표는 청구인에게 [title|E]를 양도해야 한다. 모든 [faction|E] 구성원들은 청구인에 대해 [hook|E]를 얻게 된다."
 game_concept_ceremonial_liege_desc: "특정 [realms|E](예: 일본)에서는 강력한 관료나 지휘관이 [ceremonial_regent|E]로서 진정한 권력을 차지하고, 명목상의 $game_concept_ceremonial_liege$는 단순한 상징이자 [vassal|E] 역할만 수행했을 수 있습니다. $game_concept_ceremonial_liege_possessive$ [house|E]의 모든 구성원은 [ceremonial_house|E]의 일부로 간주됩니다.\n\n직접 통치하지 않더라도 $game_concept_ceremonial_house$은 당에서 가장 존경받는 혈통이며, 다른 [houses|E]는 이들과 결혼하면 [prestige|E]를 더 얻고, 이러한 연결은 $game_concept_ceremonial_regent$의 계승에 강한 영향을 미칩니다.\n\n$game_concept_ceremonial_liege$는 [primary_title|E]를 다시 획득함으로써 진정한 권력을 되찾을 수 있습니다. 예를 들어 [faction|E] 요구나 $game_concept_ceremonial_regent$ [title|E] 경쟁을 [influence|E]를 사용하여 수행할 수 있습니다."
 game_concept_challenger_hof: "도전자 운동 지도자"
 game_concept_challenger_hof_desc: "A $game_concept_challenger_hof$는 [mainline_rite|E] $game_concept_head_of_faith$에 대항해 제기된 경쟁 [head_of_faith|E]입니다.\n\n A [ruler|E]는 자신의 [clergy|E] 구성원을 $game_concept_challenger_hof$로 후원할 수 있습니다. [clergy|E] [ruler|E] 또는 Temporal Movement Leader를 가진 [faith|E]의 통치자가 대신 챌린저를 자처할 수 있습니다.\n\n 후원된 $game_concept_challenger_hof$은 후원자의 [rite|E]를 맡고, 그 후원자의 [external_clerical_puppet|E]가 되며 [weak_hook|E]를 갚아야 합니다.\n\n $game_concept_mainline_rite$ $game_concept_head_of_faith$는 $game_concept_challenger_hof$를 따르는 누구에게도 [excommunicate|E]할 수 없습니다: 후원자와 그들의 [vassals|E] 포함됩니다.\n\n $game_concept_challenger_hof$를 따르는 모든 사람은 $game_concept_mainline_rite$ $game_concept_head_of_faith$에게가 아닌 그들에게 서류 요청을 가져옵니다. 그들 중에는 이러한 [interactions|E]가 포함됩니다:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\n Z$game_concept_challenger_hof$ 또는 그들의 후원자는 [pam_challenge_hof_cb|E] [casus_belli|E]를 합법적인 $game_concept_head_of_faith$에 대해 사용할 수 있습니다.\n\n 같은 [faith|E]의 경쟁 [kings|E] 이상은 대신 후원자에 대해 [pam_antiking_cb|E]를 사용하여 경쟁 청구자를 폐위시킬 수 있습니다."
 game_concept_chancellor: "외무장관"
 game_concept_chancellor_desc: "$game_concept_chancellor$은 외교를 담당하는 [councillor|E]입니다, 해외와 나머지 [realm|E]와의 관계를 포함하여."
 game_concept_chancellors: "외무장관들"
 game_concept_church_authority_desc: "$game_concept_church_authority$는 [theocratic|E] [ruler|E]가 그들의 [clergy|E]와 [vassals|E]에 대해 행사하는 권력을 나타냅니다.\n\n $game_concept_church_authority$에는 네 가지 수준이 있습니다; $church_authority_0$, $church_authority_1$, $church_authority_2$, 그리고 $church_authority_3$. $game_concept_church_authority$를 증가시키는 데에는 수준과 통치자의 [learning_skill|E]에 따라 [piety|E]와 [prestige|E]의 비용이 듭니다.\n\n#weak 후방 의원들은 $game_concept_church_authority$의 높은 수준을 싫어하며, 이를 낮추는 것이 [Concept( 'liberty_faction', 'Liberty Factions' )|E]의 주요 목표입니다.#!"
 game_concept_claimant_desc: "$game_concept_claimant$는 하나 이상의 [claims|E] [titles|E] 있는 사람을 말합니다. [ruler|E] 청구인들은 청구 [casus_belli|E]을 사용해 [wars|E]을 선언함으로써 이를 누를 수 있습니다. \n\n이 명예 명제는 [vassals|E]의 청구권을 누르는 데도 사용할 수 있으며, 심지어 [realm|E] 내 [unlanded|E] 캐릭터의 청구도 할 수 있습니다. \n\n계명자들은 당에 거주하지 않더라도 [factions|E]을 이끌 수 있습니다."
 game_concept_claimant_faction_desc: "$game_concept_claimant_faction$는 특정 [claimant|E]를 그들의 [liege|E]가 보유한 [title|E]의 왕좌에 올리려고 한다. 만약 성공하면, 당 대표는 칭호를 청구인에게 양도해야 하며 [vassal|E] 구조가 그에 따라 업데이트된다. 모든 [faction|E] 구성원들은 청구인에 대해 [hook|E]를 얻게 된다."
 game_concept_clan_desc: "클랜은 [vassals|E]가 [liege|E]에게 주는 [levies|E]와 [taxes|E]의 양이 해당 당 지도자의 [tax_collector|E] [aptitude|E]에 의해 결정되는 [government_form|E]입니다. 클랜도 [house_unity|E]를 사용합니다."
 game_concept_clergy: "당 관리"
 game_concept_clergy_desc: "[court_chaplains|E], [realm_priests|E], [theocratic|E] 통치자, 그리고 [GetTrait('devoted').GetName( GetNullCharacter )] 특성을 가진 모든 사람은 당 간부로 간주됩니다. \n\n [faith|E] [doctrines|E]가 당 간부가 될 수 있는 사람과 결혼, 토지 상속 등을 결정합니다."
 game_concept_clergy_opinion: "당 관리 의견"
 game_concept_clerical_puppet: "당 사제 꼭두각시"
 game_concept_clerical_puppets: "당 사제 꼭두각시들"
 game_concept_clerical_region_desc: "성직 지역은 [clerical_title|E]의 관할에 속하는 지리적 지역입니다. 지역 내 당 관리의 모든 구성원은 지역과 관련된 [title|E]의 홀더에게 [subordinate|E]가 됩니다.\n\n[ruler|E] 성직자는 자신의 [capital|E] [county|E]가 포함된 성직 지역에 속하며, 새로운 지역은 창립자의 [primary_title|E] [capital|E]에 의해 설립됩니다. 이 지역은 여러 [realms|E]를 포함할 수 있으며, 다른 당에 속한 하위 인물이 있을 수 있습니다.\n\n$game_concept_ruler$ 성직자는 한 번에 하나의 $game_concept_clerical_region$만 가질 수 있습니다. 새로운 지역이 부여되면, 통치자는 이전 지역 내에서 보유한 모든 땅을 포기합니다."
 game_concept_clerical_title_desc: "$game_concept_clerical_title$는 [ecclesiastical|E] [title|E]의 [clergy|E]으로, [clerical_region|E] 내 [faith|E]를 관리합니다. [christian|E] 이념 중에서 이는 [archdiocese|E]입니다. \n\n 보유자는 그 지역에서 [religious_superior|E]의 [clergy|E]이며, 일반적으로 [head_of_faith|E]에 의해 임명됩니다."
 game_concept_commander_trait_desc: "$game_concept_commander_traits$은 특수 [traits|E]으로 [army|E] [commanders|E]로 행동할 때 캐릭터에게 유용한 특전을 부여합니다.\n\n지휘관 특성은 일반적으로 보안 [education_focus|E]과 함께 자란 아이들이 얻지만, [martial_lifestyle|E]과 기타 방법을 통해서도 얻을 수 있습니다."
 game_concept_complete_control_desc: "이 조건은 목표 직위의 모든 [de_jure|E] 후방 의원 [titles|E]이 [ruler|E] 또는 그들의 [vassals|E]이 보유하고 있으며, 그 지역구가 적대적 [armies|E]에 의해 [occupied|E]되지 않은 경우 충족됩니다."
 game_concept_complete_control_region_desc: "이 조건은 목표 [region|E]의 모든 [counties|E]이 통치자 또는 그들의 [vassals|E]에 의해 보유되고 있으며, 그 지역구가 적대 군대에 의해 점령되지 않은 경우 충족됩니다."
 game_concept_confederation_desc: "[tribal|E] 또는 [nomadic|E] [rulers|E]를 상호 방어 목적으로 묶는 관계로, [alliance|E]와 유사합니다. #high $call_for_confederation_decision$#! [decision|E]를 통해 형성되며, 연합체는 구성원들이 서로의 방어 [wars|E]에 참여하도록 요구합니다. 연합체는 카리스마 탭에서 확인할 수 있습니다.\n\n 다른 [confederates|E]도 서로를 공격하거나 [raid|E]할 수 없습니다. 그들은 높은 수준의 [tribal_authority|E]와 [nomadic_authority|E]가 제한되며, 새로운 [titles|E]를 만들 수 없습니다.\n\n[confederates|E]는 #high $leave_confederation_decision$#! [decision|E] 또는 [migrate|E]를 사용하여 [independent|E]가 될 수 있습니다. 연합체에 단 한 명의 구성원만 남으면, 그것은 파괴됩니다."
 game_concept_contestant_desc: "[GetActivityType( 'activity_tournament' ).GetName] [contests|E]에서 경쟁하기 위해서는 그 요구 사항을 충족해야 합니다. 보드 게임은 모든 캐릭터가 경쟁할 수 있도록 허용하지만, 레슬링과 같은 다른 게임은 보안 규칙에 따라 달라집니다.\n\n경쟁하지 않는 캐릭터는 [spectators|E]되며, 잠재적인 [contestants|E]는 관람을 원할 경우 참여를 선택하지 않을 수 있습니다.\n\n대회 참가 자격은 주최자의 [culture|E] 및 [religion|E]를 기준으로 성별과 건강 상태에 따라 결정됩니다."
 game_concept_convert_county_desc: "[court_chaplain|E]가 수행하는 [councillor_task|E]로, [liege|E]과는 다른 [faith|E] 또는 같은 이념이지만 다른 [rite|E] 중 하나를 겨냥한 [county|E]. \n 프로그레스는 매달 증가하며, 100% 기준 선거구 대다수가 하원 대표의 이념을 채택합니다. 새로운 [rite|E]은 결과된 이데올로기가 당 지도자의 것과 일치할 때 [liege|E]을 따릅니다 — 그렇지 않으면 목사의 이념이 됩니다. \n\n변환 속도는 [councillor|E]의 [learning_skill|E]과 관련된 이념의 [fervor|E] 등 여러 요인에 의해 영향을 받습니다. [liege|E]의 개종자들과 [rite|E]이 더 느리게 다른 채플린. \n [rite|E] 변화 중 [fervor|E] 위쪽 50%#V 주류 이데올로기#! 그 아래쪽은 비주류 이념(분리 포함) 이념을 지지합니다."
 game_concept_convince_dejure_desc: "[steward|E]가 수행하는 [councillor_task|E]. 이는 [independent|E] [ruler|E]가 소유한 장관의 [liege|E] [de_jure|E] [county|E]을 겨냥합니다. 지역구가 설득되면 [ruler|E]에게 [de_jure|E] [liege|E]에 넘겨달라고 요청합니다."
 game_concept_coronation_anointment_desc: "기름부음은 [coronation|E]의 한 종류로, [ruler|E]가 [head_of_faith|E]이나 [head_of_rite|E] 없을 때 당 간부를 찾아가 왕위에 오르는 것을 축복합니다. 어떤 이념에서는 진정한 [legitimate|E] 통치자로 간주되기 위해 이것이 필요합니다. \n\n그 권위의 지지를 확보하기 위해 [host|E]은 [anointment_request|E] [interaction|E]을 사용할 수 있습니다."
 game_concept_council: "내각"
 game_concept_council_desc: "$game_concept_council$은 리더의 최고 [councillors|E] 팀으로, 각 부서를 운영합니다. 중요한 [councillor_tasks|E]을 받을 수 있습니다."
 game_concept_councillor: "장관"
 game_concept_councillor_desc: "장관은 모든 [ruler|E]의 주요 보좌자이며, [council|E]를 구성합니다. 내각에는 여섯 개의 직위가 있습니다: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E](또는 [realm_priest|E]), 마지막으로 [spouse|E]입니다.\n\n각자는 서로 다른 [councillor_tasks|E]를 수행할 수 있는 부서를 담당합니다.\n\n[powerful_vassals|E]이 직위 중 하나에 임명되지 않으면 화가 날 수 있으므로, 종종 강력한 후방 멤버를 달래는 것과 실제로 유능한 사람을 임명하는 것 사이에서 선택해야 합니다.\n\n[liege|E]의 장관으로 근무하면 보너스를 얻을 수 있으며, 이는 당 지도자의 [rank|E]에 따라 증가합니다."
 game_concept_councillor_task: "장관 임무"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ 는 [councillors|E] 에게 부여할 수 있는 중요한 임무입니다. 이 작업은 일반적이거나 특정 [county|E] 또는 [court|E] 를 대상으로 할 수 있습니다.\n\n장관과 함께 [relation|E]가 있는 경우, 완료 시간이 있는 작업은 더 오래 걸리거나 더 빨리 완료될 수 있습니다.\n\n#weak 주의: 장관들은 직접 작업을 수행하지 않고 단지 노력을 이끄는 역할만 합니다.#!"
 game_concept_councillor_task_possible_side_effects_desc: "[councillor_task|E]는 시간이 지나면서 예상치 못한 결과를 초래할 수 있습니다. 이러한 결과는 좋거나 나쁠 수 있으며, 긍정적인 효과는 관련 [skill|E]가 높을수록 더 가능성이 높고, 부정적인 효과는 관련 기술이 낮을수록 더 가능성이 높습니다."
 game_concept_councillor_tasks: "장관 임무"
 game_concept_councillors: "장관"
 game_concept_counties: "선거구"
 game_concept_county: "선거구"
 game_concept_county_capital: "선거구 자본"
 game_concept_county_capital_desc: "$game_concept_county_capital$은 [county|E]의 주요 [holding|E]입니다. 이 홀딩은 절대 파괴되거나 [leased|E]될 수 없으며, 항상 Constituency [title|E]를 소유한 [ruler|E]가 소유합니다. \n\nConstituency Capitals는 일반 홀딩보다 추가 [building|E] 건설을 허용합니다."
 game_concept_county_capitals: "선거구 수도"
 game_concept_county_control: "선거구 통제"
 game_concept_county_control_desc: "$game_concept_county_control$는 [county|E]의 인구에 대한 정부의 통제력을 측정합니다. 이는 특히 [taxes|E]를 [holdings|E]에서 수집할 때 매우 중요합니다.\n\n선거구가 [war|E]를 통해 소유권이 바뀌면, 통제력이 급격히 떨어지며, 이는 현재 [holder|E]을 제후로 만들 이유가 됩니다(만약 [casus_belli|E]가 허락한다면). 선거구 통제력은 또한 [sieges|E]와 [Concept( 'peasant_faction', 'Peasant Uprisings' )|E]로 인해 손상될 수 있습니다.\n\n통제력이 낮으면 [county_corruption|E]가 발생할 수 있으며, 통제력을 높이는 주요 방법은 [councillor_task|E]을 당신의 [marshal|E]에서 사용하는 것입니다."
 game_concept_county_corruption: "선거구 부패"
 game_concept_county_corruption_desc: "[county|E]가 [control|E]가 낮거나 [holder|E]가 [debt|E] 때, 선거구는 $game_concept_county_corruption$ 획득할 수 있습니다. 이들은 다양한 부정적 [county_modifiers|E]입니다. \n\n$game_concept_county_corruption$ 시간이 지나면서 사라지지만, 근본 원인이 지속된다면([debt|E] 또는 낮은 [control|E]) 다시 나타날 수 있습니다. \n\n $councillor_marshal$의 $task_increase_control$ $game_concept_councillor_task$이 더 빨리 사라질 수 $game_concept_county_corruption$ 있습니다."
 game_concept_county_fertility: "선거구 출산율"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ [the_great_steppe|E] 내에 위치한 [counties|E]에 존재하며, [GetGovernment( 'nomad_government' ).GetName] [rulers|E]가 방목하여 [herd|E]을 늘릴 수 있습니다. \n\nA 선거구의 비옥도는 목초지의 질을 나타냅니다. \n\n [fertility_equilibrium|E] 주변에서 정상 유지성이 안정되어, [domain_limit|E]가 큰 유목민 통치자들이 가축 성장을 유지할 수 있게 합니다. 비옥도는 [steppe_seasons|E]에 의해 영향을 받고 [herders|E]에 의해 천천히 보충됩니다. \n\n [realm|E]의 출산율이 낮을 때, 이는 [migrate|E] 신호입니다. \n\n[county_control|E] 현재 대조군과 같은 비율로 가임력 성장률을 늦춥니다."
 game_concept_county_modifier: "선거구 수정자"
 game_concept_county_modifiers: "선거구 수정자들"
 game_concept_county_opinion_desc: "각 [county|E]의 일반 주민들은 그들의 $game_concept_county$을 가진 [character|E]의 [opinion|E]을 가지고 있다. 만약 주민들이 불만이면 [peasant_faction|E] 또는 [popular_faction|E]를 시작하거나 참여할 수 있으며, 어느 쪽이든 곧 전체 [realm|E]로 퍼질 수 있다.\n\n $game_concept_county_opinion$를 통제하는 가장 쉬운 방법은 $game_concept_county$ [holder|E]가 인구와 같은 [culture|E] 및 [faith|E]를 가지도록 하는 것이다.\n\n$game_concept_county_opinion$ 서로 다른 [faith|E]를 갖는 것을 방지하는 것은 선거구의 [faith_hostility|E]와 [fervor|E]에 의해 수정되며, 0에서 100 $game_concept_fervor$ 사이로 선형적으로 조정된다."
 game_concept_court: "사무실"
 game_concept_court_amenities: "사무실 편의 시설"
 game_concept_court_amenity: "사무실 편의 시설"
 game_concept_court_artifact: "사무실 유물"
 game_concept_court_artifact_desc: "사무실 유물은 [artifact|E]로, [ruler|E]의 [royal_court|E]에 전시되는 것으로, 태피스트리나 아름답게 삽화가 들어간 책과 같이 전시됩니다.\n\n 사무실 유물은 개인 사무실의 [court_grandeur|E]를 결정하는 한 요소입니다.\n\n 캐릭터가 소유할 수 있는 유물의 수에는 제한이 없지만, 해당 유형의 슬롯에 전시된 유물만 효과가 있습니다.\n\n [inspired|E] [characters|E], 위임 유물 결정에서, 또는 [reforge|E] [inventory_artifact|E]을 선택하여 새로운 사무실 유물을 만들 수 있습니다."
 game_concept_court_artifacts: "사무실 유물들"
 game_concept_court_chaplain: "하원 대표"
 game_concept_court_chaplain_desc: "$game_concept_court_chaplain$은 [faiths|E] 내에서 종교 및 영적 사무를 담당하는 [councillor|E]입니다, [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E]와 함께입니다.\n\n [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] 정책 입장을 가진 이념들은 $game_concept_court_chaplain$ 대신 훨씬 더 강력하고 (문제가 많은) [realm_priest|E]를 갖습니다."
 game_concept_court_chaplain_possessive: "하원 대표"
 game_concept_court_chaplains: "하원의 지도자들"
 game_concept_court_chaplains_possessive: "하원의 지도자의"
 game_concept_court_desc: "모든 정치인에게는 $game_concept_court$가 있습니다: 그들을 위해 일하는 [unlanded|E] 사람들. \n\n이[courtiers|E] 가족, 조언자, 연구원, 그리고 주변인들입니다."
 game_concept_court_event: "사무실 이벤트"
 game_concept_court_events: "사무실 이벤트들"
 game_concept_court_grandeur: "사무실 웅장함"
 game_concept_court_grandeur_desc: "한 [royal_court|E]의 $game_concept_court_grandeur_value$는 사무실의 명성을 보여주며, 증가함에 따라 새로운 [court_grandeur_levels|E]를 잠금 해제합니다.\n\n값은 0에서 100 사이이며, 시간 경과에 따라 기준값에 정착합니다. 이 기준값은 [dynasty_perks|E], [court_amenities|E] 사용량, 장대한 [court_artifacts|E] 여부 등에 의해 영향을 받습니다.\n\n장엄함의 일부는 [succession|E] 시 손실됩니다."
 game_concept_court_grandeur_expectation: "사무실 웅장함 기대"
 game_concept_court_grandeur_expectations: "사무실 웅장함 기대들"
 game_concept_court_grandeur_level: "사무실 웅장함 수준"
 game_concept_court_grandeur_level_desc: "[royal_court|E]의 장엄함 수준은 소유자에게 보너스를 제공하며, 사무소의 [court_grandeur_value|E]가 증가함에 따라 해제됩니다.\n\n각 수준의 효과 외에도, 큰 [realms|E]는 더 높은 장엄함 수준에 도달했을 것으로 예상됩니다. 이를 [court_grandeur_expectations|E]라고 합니다."
 game_concept_court_grandeur_levels: "사무실 웅장함 수준들"
 game_concept_court_grandeur_value: "사무실 웅장함 가치"
 game_concept_court_guest: "사무실 손님"
 game_concept_court_host: "사무실 주인"
 game_concept_court_host_desc: "$game_concept_court_host$은 캐릭터의 파티 리더는 아니지만 여전히 [court]에 그들을 두고 있는 [ruler|E]입니다.\n\n 이는 Ruler를 방문하거나 [wards|E]이 자신의 [guardian|E]와 같은 사무실에 머무는 등 여러 가지 이유로 발생할 수 있습니다.[wanderers|E]"
 game_concept_court_language: "사무실 언어"
 game_concept_court_language_desc: "사무실 언어는 [royal_court|E]의 공식 [language|E]으로, 귀족들이 사용하고 관료주의에서 사용됩니다.\n\n [court_grandeur|E] 기준치는, 같은 언어를 사용하는 각 [realm|E] [county|E], 같은 사무실 언어를 사용하는 각 개인 사무실, 그리고 그 [ruler|E]의 모국어일 경우 증가합니다."
 game_concept_court_languages: "사무실 언어들"
 game_concept_court_position: "임명"
 game_concept_court_position_task: "임명 과제"
 game_concept_court_position_tasks: "임명 업무"
 game_concept_court_positions: "임명"
 game_concept_court_type: "사무실 유형"
 game_concept_court_type_desc: "[royal_court|E]의 일부로, [rulers|E]는 지정된 $game_concept_court_type$을 가질 수 있습니다. \n\nach $game_concept_court_type$ 통치자와 [court|E]에게 [court_grandeur_level|E]에 따라 각자의 보너스 세트를 제공합니다. \n\n통치자의 [culture|E] [ethos|E]가 어떤 직무 유형을 가질 수 있는지를 결정합니다. \n\nThe different Office Types는 다음과 같습니다:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "사무실 유형 특성"
 game_concept_court_type_trait_desc: "[royal_court|E]에서 [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0]년간 근무한 [courtier|E]은 그 법원의 [court_type|E]을 반영하는 [trait|E]을 받습니다. \n\n이 특성의 질은 [character|E]가 사무실에서 직원으로 근무한 기간에 따라 결정됩니다."
 game_concept_court_types: "사무실 유형들"
 game_concept_courtier: "직원"
 game_concept_courtier_desc: "$game_concept_courtier$는 자신의 [court|E]에서 [ruler|E]를 수행하는 [unlanded|E] 캐릭터입니다. \n\n 직원은: \n$BULLET_WITH_TAB$ [councillors|E]\n$BULLET_WITH_TAB$로서 근무할 수 있습니다 [court_positions|E]\n$BULLET_WITH_TAB$ [armies|E]에서 [commanders|E] 또는 [knights|E]로 근무할 수 있습니다 \n$BULLET_WITH_TAB$ [title|E]가 주어지면 그들의 Ruler의 [vassal|E]가 될 수 있습니다 \n$BULLET_WITH_TAB$ [claims|E]를 [war|E]에서 그들의 Ruler가 누르게 할 수 있습니다 \n\n#WEAK [adventurers|E]가 $game_concept_courtiers$ 대신 [followers|E]를 가질 수 있습니다 — 그들은 일반적으로 더 냄새 나고 진흙투성이이긴 하지만 같은 역할을 수행합니다. #!"
 game_concept_courtiers: "직원"
 game_concept_courts: "사무실들"
 game_concept_criminal_task_contract_desc: "$game_concept_criminal_task_contract$는 일반적으로 유리할 수 있는 음습한 계약을 포함하지만 @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E]를 부여한다.\n\n $trait_gallowsbait$ [trait|E]의 레벨을 올리면 대부분의 세계가 당신을 더 미워하고 존경은 줄어들며, 결국 당신의 약탈을 반대하는 [followers|E]가 극적으로 당신의 고용을 떠나게 된다.\n\n#WEAK $trait_gallowsbait$는 매우 부정적인 $game_concept_trait$로, 캐릭터가 최하위 등급의 소액 범죄자임을 의미한다 — 최소한 사무실에서의 살인은 어느 정도 #EMP 클래스#!를 가진다.\n\n [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E]로 완전히 청소할 수 있다.#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ [ruler|E]이 자신의 [vassals|E]에 대해 휘두르는 일반적인 권력을 나타냅니다. \n\n $game_concept_crown_authority$은 네 단계로 나뉩니다; [autonomous_vassals|E], [limited|E], [high|E], [absolute|E]. $game_concept_crown_authority$을 올리려면 레벨과 통치자의 [learning_skill|E]에 따라 [prestige|E]가 듭니다. \n\n#weak 백벤처들은 높은 $game_concept_crown_authority$ 수준을 싫어하며, [Concept( 'liberty_faction', 'Liberty Factions' )|E]의 주요 목표는 이를 낮추는 것입니다. #!"
 game_concept_culture_head_desc: "'$game_concept_culture_head$'는 자기 자신의 [culture|E]에 가장 많은 영향을 미치는 [ruler|E]입니다.\n\n 구체적으로, 동일 문화 [counties|E] 총수가 가장 많은 통치자가 자신의 [realm|E] 내에서 [domain|E] 위치나 다른 문화 구역 의석을 소유하고 있는지와 상관없이 $game_concept_cultural_head$가 됩니다.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\n $game_concept_cultural_head$는 [innovation|E]가 우선적으로 탐색되어야 하는지를 [cultural_fascination|E] 설정을 통해 영향력을 행사할 수 있습니다.\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "[title|E]의 [de_jure|E] [liege|E]가 변화할 수 있는 느린 과정입니다. 이는 [duchy|E] 또는 [kingdom|E]가 그 영토의 정식 당 지도자 직함을 보유하지 않은 [ruler|E]에 의해 완전히 통제될 때 자연스럽게 발생합니다.\n\n 이 과정은 [chancellor|E]을 적절한 [councillor_task|E] #weak($task_integrate_title$)#!에 배치하면 가속화할 수 있습니다. 지역은 오직 $game_concept_de_jure_drift$로만 이동할 수 있으며, [empires|E]로 떠돌 수 있는 것은 국가뿐입니다.\n\n De Jure 타이틀을 [primary_title|E]로 떠돌게 하는 것은 [rightful_liege|E] 패널티를 제거하는 좋은 방법입니다."
 game_concept_de_jure_drift_desc_part_2: "#weak 예시: $d_northumberland$ 지역은 명목상 $k_england$ 소속이지만, 해당 지역의 영토는 완전히 $k_scotland$ 안에 있습니다. $k_scotland$ 국왕이 $k_england$를 역시 보유하지 않으므로, 해당 지역은 $game_concept_de_jure_drift$을 목표로 $k_scotland$의 일부가 되기 시작합니다.#!"
 game_concept_death_religion: "정치 진영"
 game_concept_death_religion_desc: "적들에게 저승으로 넘어가고, 순교, 십자가형이라는 신성모독적인 죽음을 당하는 것, 마지막까지 이념에 충실하다면, 이보다 더 진실한 방식으로 전해줄 수 있는 방법이 있을까."
 game_concept_debt_desc: "부채는 [gold_i][gold|E]의 음수 상태를 가지는 상태입니다. 이는 일반적으로 [ruler|E]가 전쟁 중일 때 [mercenaries|E]를 고용하지만 전체 비용을 충당할 자금이 충분하지 않거나 너무 오랫동안 전쟁을 수행할 때 발생합니다.\n\n 부채 상태에서는 새로운 [wars|E]를 선언할 수 없으며, [men_at_arms|E]는 증원되지 않고, 적군은 전투에서 [advantage|E]를 가지게 됩니다. 부채가 깊어질수록 더 많은 처벌을 받게 됩니다 — [levies|E] 감소, [county_opinion|E] 감소, [vassals|E]의 호감도 감소.\n\n 또한, [domain|E] [counties|E]에서 [county_corruption|E]를 얻는 등 다양한 작은 불안정 사건이 발생할 수 있습니다. \n\n#help 일반적으로 적이 부채 상태일 때 공격하는 것이 좋습니다. 왜냐하면 그들은 [advantage|E]가 감소된 상태로 싸우게 되기 때문입니다!#!"
 game_concept_demand_conversion_desc: "[rulers|E]가 다른 [faith|E]의 주제를 가지고 있는 경우, 주제의 이념을 자신의 것으로 바꾸기 위해 전환 요구(Demand Conversion)를 할 수 있습니다. 주권자의 [learning|E] 기술과 주제의 당 지도자에 대한 [opinion|E]는 주제가 요구를 수용할지, 또는 [Concept('refuse_conversion_crime','refuses')|E]할지를 결정하는 주요 요인입니다."
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$는 [diarch|E]가 [liege|E]로부터 정해진 [mandate|E]마다 얼마나 잘 달성하는지를 관리한다.\n\n [skills|E]와 [personality_traits|E]가 역할을 한다. 예를 들어, '$fill_coffers_mandate$' 명령을 받은 [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$는 그들의 당 지도자에게 많은 [gold|E]를 보내지 않을 수 있다.\n\n#WEAK [diarchs|E]는 약 40+ $game_concept_aptitude$를 보유하고 있을 때 $game_concept_mandate$에 적합하다.#!"
 game_concept_diarch_power_desc: "활동 중인 [power_sharing|E] [diarch|E]은 특별한 $game_concept_diarch_powers$에 접근할 수 있습니다. \n\n이들은 [liege|E]이 가진 것을 모방하거나 권력 남용을 하는 특별한 [character_interaction|E]입니다. 예시로는 동료 [vassals|E]의 [revoking|E] [titles|E], 또는 당 대표로부터 [gold|E]을 빼앗는 경우가 있습니다. \n\nM당 대표에게 [veto|E] 기회를 줄 $game_concept_diarch_powers$ 있습니다."
 game_concept_diplomacy: "카리스마"
 game_concept_diplomacy_lifestyle: "카리스마 라이프스타일"
 game_concept_diplomacy_skill: "카리스마 기술"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ 매력, 설득, 거래를 위한 [skill|E]입니다: 방 안을 이끌어내고, 동료들의 마음을 설득하며, 거래를 성사시키는 것입니다. \n\n이 다른 캐릭터들이 당신에 대해 갖는 [opinions|E]에 직접적으로 영향을 미치고, 카리스마 [schemes|E]을 더욱 높여줍니다. \n\n대응하는 [lifestyle|E]가 바로 [diplomacy_lifestyle|E]입니다."
 game_concept_diplomacy_task_contract: "카리스마 계약"
 game_concept_diplomacy_task_contract_possessive: "카리스마 계약의"
 game_concept_diplomacy_task_contracts: "카리스마 계약들"
 game_concept_diplomacy_task_contracts_possessive: "카리스마 계약들의"
 game_concept_direct_vassal: "직속 일반 의원"
 game_concept_direct_vassals: "직속 일반 의원들"
 game_concept_directed_great_holy_war_desc: "$game_concept_directed_great_holy_war$은 자신의 지배하에 [kingdom|E]을 두려는 의도를 가진 $doctrine_temporal_head_name$ [head_of_faith|E]에 의해 선언됩니다. [faith|E]의 \n\n[rulers|E] 일부는 운동 지도자를 도울 것을 선택할 수 있으며, 그렇게 함으로써 보상을 받을 수 있습니다. 보상에는 [piety|E]와 잠재적으로 정복된 국가 내에서 [dynasty|E]이 [landed|E]이 되는 것이 포함됩니다. \n\n 목표로 한 [religion|E]의 지배자들은 [alliance|E] 없이도 이 전쟁에 맞서 방어할 수 있습니다."
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$는 [tribal_authority|E]의 최하위 수준입니다. 이 수준에서 [vassals|E]는 [liege|E]에 대해 [opinion|E] 패널티가 없으며, 당 지도자의 권한은 [levies|E]와 [taxes|E]를 요구할 수 있는 능력 외에는 없습니다."
 game_concept_dissolution_faction_desc: "[dissolution_faction|E]는 그들의 [liege|E]의 [realm|E]을 파괴하려고 한다. 만약 성공한다면, 당의 모든 평의원들은 [independent|E]가 되고, 그들의 당 대표는 [primary_title|E]를 잃게 된다."
 game_concept_doctrine: "정책 입장"
 game_concept_doctrine_knowledge: "정책 입장 지식"
 game_concept_doctrines: "정책 입장들"
 game_concept_doctrines_desc: "정책 입장은 [faith|E]이 추구하는 것의 핵심입니다: 세금과 지출, 소유권, 이민, 유럽, 연합 및 시민 자유. 국회의원의 정책 입장과 충돌하는 법안은 반란 가능성을 높입니다."
 game_concept_domain: "포트폴리오"
 game_concept_domain_desc: "정치인의 $game_concept_domain$는 그들이 개인적으로 소유한 모든 것을 의미합니다: 그들의 의석과 그 구역들.\n\n[domain_limit|E]이 의미하는 바는 지도자가 소수 이상의 의석을 이끌기 위해 [vassals|E]에 의존해야 한다는 것입니다."
 game_concept_domain_fertility: "포트폴리오 출산력 포트폴리오 가산"
 game_concept_domain_fertility_desc: "보유한 모든 [counties|E]의 총[county_fertility|E]입니다."
 game_concept_domain_income: "포트폴리오 소득"
 game_concept_domain_limit: "포트폴리오 한도"
 game_concept_domain_size: "포트폴리오 규모"
 game_concept_domain_taxes: "포트폴리오 세금"
 game_concept_domains: "포트폴리오"
 game_concept_dominant_family_desc: "$game_concept_dominant_family$는 [powerful_family|E]이며, 그들의 통제를 널리 퍼뜨렸습니다. 그들은 [realm|E] 내에서 가장 영향력 있는 [house|E]로 간주됩니다.\n\n $game_concept_dominant_family$의 구성원은 [political_schemes|E]에 더 능숙하며, [interacting|E] 다른 [characters|E]와 함께할 때 원하는 바를 얻을 가능성이 더 높습니다.\n\n $game_concept_house$는 지배적이 되기 위해 파티의 적어도 [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%]를 통제해야 합니다."
 game_concept_dread: "영향력"
 game_concept_dread_desc: "$game_concept_dread$ [ruler|E]가 얼마나 두려워하는지입니다: 장관을 눈 깜짝 없이 해임하는 지도자, 반란을 절대 잊지 않는 채찍. \n\n정치주의자들은 무자비한 행위로 $game_concept_dread$을 얻습니다: 해임, 숙청, 반역자나 [prisoners|E]의 본보기를 만드는 것. \n\nClout는 [tyrant|E]처럼 이끌 수 있게 해줍니다. 왜냐하면 무질서한 [vassals|E]이 [intimidated|E]하거나 [cowed|E] 변해 그들이 당신에게 반대하기를 두려워하게 만들기 때문입니다. \n\nA 캐릭터의 영향력은 0에서 100까지 다양하며, [nomads|E]만은 150을 달성할 수 있습니다. 시간이 지나면서 그들의 영향력은 자연스러운 영향력(Natural Clout)에 가깝게 변하며, 이는 [personality_traits|E]에 의해 정의됩니다. \n\n#high 포르미다블 [ruler]은 다음과 같은 혜택을 누립니다:#!\n$BULLET_WITH_TAB$[vassals] 가입을 권장하지 않음 [factions|E]\n$BULLET_WITH_TAB$[vassals] 가입을 권장하지 않음 [scheming|E]\n$BULLET_WITH_TAB$승인 #weak [vassal] 인케어스(예: 타이틀 취소)[electors|E] 더 투표할 가능성이 높습니다. #!\n$BULLET_WITH_TAB$승인 [offer_vassalization|E] 인크리스레이즈 \n$BULLET_WITH_TAB$Makes는 투표할 가능성이 더 높 여러분 do\n$BULLET_WITH_TAB$Z여러분 [law|E] 변화에 반대할 가능성은 낮은 백벤처들 \n\n#weak 용감하고 대담한 [vassals]들은 영향력에 덜 영향을 받는다는 점을 유의하세요! #!"
 game_concept_dreaded: "강력한"
 game_concept_dreadful: "강력한"
 game_concept_dreams_desc: "점술 원인을 따르는 이념을 가진 캐릭터는 가끔 꿈을 꿀 수 있습니다. 이러한 꿈은 신비술사에 의해 점쳐질 수 있으며, 결과는 좋거나 나쁠 수 있습니다."
 game_concept_duchies: "지역들"
 game_concept_duchy: "지역"
 game_concept_duchy_building: "지역 건물"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ 는 강력한 [buildings|E] 로 [duchy|E] 의 [de_jure_capital|E] 에서만 건설할 수 있습니다. 각 지역에는 한 가지 유형만 건설할 수 있습니다.\n\n$game_concept_duchy_buildings$ 소유자가 관련된 지역 [title|E] 도 소유한 경우에만 활성화됩니다.\n\n 많은 $game_concept_duchy_buildings$ 는 지역 내 모든 [holdings|E] 에 영향을 미치는 조정자를 가지고 있어 [domain|E] 를 특화하는 강력한 도구가 됩니다."
 game_concept_duchy_buildings: "지역 건물들"
 game_concept_duchy_desc: "$game_concept_duchy$는 [title|E]이며, 아래에 [kingdom|E]가 있고 위에 [county|E]가 있는 [title_tier|E]입니다.\n\n[holder|E] $game_concept_duchy$의 [de_jure|E] 권리를 가지며 구성 요소 $game_concept_counties$에 대해 [counts|E]를 가질 수 있습니다.[vassals|E].\n\n지역은 휴면 상태이며 현재 소유자가 없을 수 있습니다. 그러한 $game_concept_title_succession$는 [ruler|E]가 그 $game_concept_counties$의 적어도 절반을 통제할 때 생성될 수 있습니다."
 game_concept_dynasty_perks: "당 유산"
 game_concept_dynasty_prestige: "정당 브랜드"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$는 당 전체의 평판입니다: 유권자들이 그 이름을 어떻게 인식하는지, 멤버들에게 어떤 문을 열어주는지.\n\nA [dynasty|E]는 살아있는 구성원, 공직에 있는 구성원, 다른 공직자와 결혼한 구성원으로부터 $game_concept_dynasty_prestige$를 얻습니다.\n\n그것은 당의 [dynasty_prestige_level|E]에 기여하며, 당 지도자는 [dynasty_perks|E]에 그것을 사용할 수 있습니다."
 game_concept_dynasty_prestige_level: "정당 브랜드 레벨"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\n 이것은 가장 높은 당 브랜드 수준입니다."
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$는 [dynasty|E]의 유명도를 측정하는 지표입니다. 왕조가 [dynasty_prestige|E]을 얻을 때마다 레벨 진행이 이루어집니다. 캐릭터는 태어날 때 $game_concept_dynasty_prestige_level$에 따라 초기 [prestige|E] 양을 받습니다. 마찬가지로, [spouses|E] [marry|E] 때 서로의 왕조에서 프로필을 일부 얻습니다. \n\n레벨은 다음과 같습니다:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[interaction|E]를 통해 [ecclesiastical|E] [rulers|E]는 동일 [faith|E] 세속 군주가 적대적 이데올로기 군주에게 [holy_war|E]를 선언하게 만들 수 있습니다."
 game_concept_ecumenical_councils: "에큐메니컬 내각"
 game_concept_eminent_holy_site: "저명한 중심지"
 game_concept_eminent_holy_site_desc: "$game_concept_eminent_holy_site$는 [holy_site|E]에게 매우 중요한 [faith|E]입니다. 각 이데올로기는 그 $game_concept_holy_sites$ 중 일부만을 저명하게 지정할 수 있습니다.\n\n저명한 심장지는 이데올로기의 모든 추종자에게 영향을 미치는 수정치를 제공할 수 있습니다."
 game_concept_eminent_holy_sites: "저명한 중심지들"
 game_concept_empire: "영국"
 game_concept_empires: "노동조합"
 game_concept_enshrined_desc: "[holy_relic|E]가 [holy_site|E]에 모셔지면 심장 지대 보너스를 활성화하고 모든 봉헌된 유물의 총 [rarity|E] 수준에 따라 제공하는 보너스를 향상시킵니다.\n\n봉헌된 유물은 더 이상 캐릭터가 소유하지 않지만 심장 지대의 [holder|E], [top_liege|E] 또는 [clerical_region|E] 소유자가 상호작용할 수 있습니다. 유물은 더 이상 부패하지 않습니다. 자신의 [faith|E]를 위해서는 신성 유물만 봉헌할 수 있으며, 다른 이념의 봉헌된 신성 유물은 어떠한 혜택도 제공하지 않습니다.\n\n봉헌하거나 봉헌된 유물을 제거하는 데 보상이나 비용이 따를 수 있습니다."
 game_concept_entrenched_regency_desc: "[regency|E]이 너무 오래 지속되면, 그것은 고착될 수 있으며, [regent|E]는 [liege|E]에 비해 더욱 강력해집니다.\n\n[regent|E]가 [scales_of_power|E]로부터 얻는 혜택이 훨씬 강력해집니다.\n\n$game_concept_entrenched_regency$을 끝내기 위해, 섭정은 그들의 당 대표로부터 선물을 받아야 하거나, 당 대표가 그들에게 유리하게 판세를 조정해야 합니다."
 game_concept_escalated_peasant_factions: "고조된 시위 운동"
 game_concept_expected_legitimacy: "예상 임기"
 game_concept_expected_legitimacy_desc: "[vassals|E]이 그들의 [ruler|E]에게 기대하는 [legitimacy_level|E]는 역사적 관계를 기반으로 한다. 기대치를 낮추는 몇 가지 요인은 다음과 같다: \n$BULLET_WITH_TAB$ 평의원의 [de_jure|E] [liege|E]임 \n$BULLET_WITH_TAB$ 평의원의 [close_family|E] 일부임 \n$BULLET_WITH_TAB$ 평의원의 [preferred_heir|E]임 \n$BULLET_WITH_TAB$ 평의원이 오랫동안 복무한 동일한 [dynasty|E]임 #color_white 50#! 년 이상 \n$BULLET_WITH_TAB$ 평의원이 [powerful_vassal|E]가 아님 \n\n 실제 수준이 기대치보다 낮으면 그들은 제멋대로 행동할 수 있음: 그들의 [opinion|E]가 낮아지고 [factions|E]에 합류하여 그들의 [liege|E]에 맞설 수 있음 \n\n 기대치는 그들의 [primary_title|E] 수준과 [era|E]에 따라 증가함."
 game_concept_external_clerical_puppet_desc: "[clergy|E]의 강력한 구성원 — [archbishop|E]나 심지어 [head_of_faith|E] — 이 다른 [ruler|E]의 [puppet|E]가 된 경우.\n\n성직자가 강할수록 영향력도 커집니다: 꼭두각시 운동 지도자는 [excommunicate|E] 당신의 적, [cardinals|E]를 임명하고, [pressed_claim|E]를 부여하거나, [holy_war|E]을 당신을 대신해 선동할 수 있습니다."
 game_concept_faction_desc: "$game_concept_faction$는 공통의 정치적 이익을 가진 [vassals|E]의 집단입니다. [counties|E]의 지역 주민들도 시위 운동과 같은 특정 유형의 파벌에 참여할 수 있습니다.\n\n 파벌은 [faction_discontent|E]가 일정 수준에 도달하면 위험해지고, 그때 최후통첩을 발령합니다.\n\n 만약 [liege|E]가 이에 따르지 않으면, 파벌은 반란을 일으켜 [civil_war|E]를 촉발합니다. 전쟁이 끝나기 전에 파벌이 해산되면, 전쟁에서 승리하기 위해 당 지도자는 적어도 [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E]를 가져야 합니다."
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$는 [faction|E]가 목표에 대해 가진 전체 군사력의 척도입니다.\n\n개별 파벌 구성원 각각은 파벌에 남아 있는 한 자신의 전체 강점을 파벌에 더합니다. 만약 파벌의 목표가 구성원의 [liege|E]라면, 구성원의 강점은 파티 리더의 상대적 힘에서도 차감됩니다."
 game_concept_faith: "이념"
 game_concept_faith_astray: "분파된"
 game_concept_faith_astray_desc: "이 [rite|E]은 당신의 정치 진영 또는 인접 진영에 있으며: 세부 사항에 동의하지 않습니다.\n\n#S 효과:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "$game_concept_faith$는 더 큰 [religion|E] 내에서 정치인의 정치적 신조입니다. 모든 캐릭터와 [county|E]는 하나를 가지고 있습니다: 선거구의 이데올로기는 유권자의 성향이며, 의원의 성향으로 이동합니다.\n\n이데올로기의 [doctrines|E]는 그 정책적 입장이고, [core_tenets|E]는 그 대표적 원인들입니다. [fervor|E]는 활동가들의 열정 정도입니다.\n\n서로 다른 이데올로기를 가진 정치인들은 서로 덜 좋아하며, 진영이 멀수록 그 정도가 커집니다. 누구든지 마음을 바꿀 수 있습니다 (결정: 당신의 정치 바꾸기), 단 비용이 있습니다."
 game_concept_faith_evil: "화해할 수 없는"
 game_concept_faith_evil_desc: "이 [rite|E]는 정반대의 헌법적 미래를 원합니다: 민족주의자는 연합주의자에 반대합니다.\n\n#S 효과:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "반대됨"
 game_concept_faith_hostile_desc: "이 [rite|E]은 주요 정치적 분열, 좌대우대에 걸쳐 있습니다.\n\n#S 효과:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "이념적 거리"
 game_concept_faith_hostility_desc: "모든 [faiths|E] 정치적 차이에 따라 서로 관계가 형성된다. \n\n같은 신론이나 인접한 [religion|E] 세부 사항에 대해 의견이 다르다; 좌우는 대립한다; 민족주의자와 연합주의자는 화해할 수 없다. \n\n다음과 같은 관계가 존재한다: [faith_righteous|L], [faith_astray|L], [faith_hostile|L], [faith_evil|L]."
 game_concept_faith_righteous: "같은 생각을 가진 사람"
 game_concept_faith_righteous_desc: "이 [rite|E]는 귀하의 정치 성향을 공유합니다.\n\n#S 효과:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "이념의"
 game_concept_faiths: "이념"
 game_concept_feast_desc: "[activity|E]에서 통치자와 직원들이 모여 어떤 일이든 축하합니다.\n\n참가자들은 [stress|E]를 잃고 주최자에 대한 [opinion|E]가 증가합니다. 또한 그렇게 많은 사람들을 모으는 것에서 비롯된 다양한 다른 결과가 있을 수 있습니다.\n\n [ruler|E]는 그들의 [liege|E]와 [vassals|E](다양한 [courtiers|E]와 함께)를 $activity_feast$로 초대할 것입니다."
 game_concept_fervor: "확신"
 game_concept_fervor_desc: "$game_concept_fervor$의 [faith|E] 범위는 #V 0#!에서 #V 100%#!까지 달합니다. 이는 활동가와 유권자의 열정 정도를 측정합니다: 투표율, 자원봉사자 수, 소음. \n\n높은 $game_concept_fervor$는 이념적 지역구가 국회의원의 정치에 더 관심을 가지게 만듭니다."
 game_concept_feudal_desc: "봉건 [government_form|E] 아래에서, [liege|E]은 [vassals|E]에게 통치를 위해 [land|E]을 제공하고 그 대가로 [levies|E]과 [taxes|E]를 받으며, 이는 하원의원과 당대표 사이의 개별 [vassal_contract|E]에 의해 규제된다."
 game_concept_flowery_war_desc: "이것은 [war|E]의 특별한 유형으로, [ruler|E]가 시작했으며, 그 [faith|E]는 인간 희생을 행합니다. $game_concept_flowery_warring$의 주요 목표는 전투를 벌이고 [prisoners|E]를 희생을 위해 포획하는 것이며, 어느 쪽이든 전투를 통해 충분한 [war_score|E]를 확보하여 [siege|E] 없이 승리할 수 있습니다.\n\n$game_concept_war$ 종료 시, 승자가 (수비자를 포함하여) 인간 희생을 행하는 $game_concept_faith$를 따른다면, 패자의 [court|E]에서 여러 $game_concept_prisoners$를 가져갑니다. $game_concept_flowery_war$에서 두 주요 전투자가 같은 이념을 따른다면, 전쟁은 신성한 것으로 간주되며, 패자도 승리하지 못하더라도 (일부) [piety|E]를 받습니다.\n\n$game_concept_flowery_war$를 수행하거나 계속할 수 없는 경우는, [dungeon|E]에서 $game_concept_flowery_war$에 승리하여 얻은 $game_concept_prisoners$가 있을 때입니다."
 game_concept_foreign_affairs_desc: "[chancellor|E]가 수행하는 [councillor_task|E]. \n [independent|E] [ruler|E] 또는  다른 독립 통치자들의 평가를 높입니다. 백벤처에게는 같은 [liege|E]의 다른 백벤처들이 자신에 대해 갖는 평가를 높입니다."
 game_concept_fp3_demand_submission_interaction_desc: "정치적 자본, 책략 또는 위협을 사용하여 [character_possessive|E] 형태의 [hook|E] 충성심을 요구합니다."
 game_concept_gender_doctrines: "성별 정책 입장"
 game_concept_gender_doctrines_desc: "이 [doctrines|E]은 [faith|E]의 캐릭터가 사용할 수 있는 [gender_laws|E]을 결정합니다.\n\n또한 어떤 [claims|E]이 상속될 수 있는지, 누가 [commanders|E] 및 [knights|E]이 될 수 있는지, 그리고 [bastard|E]가 그들의 부모 [house|E] 중 어느 것에 속하게 될지를 포함한 추가 규칙을 결정합니다.\n\n성별 정책 포지션은 다음과 같습니다:\n$BULLET_WITH_TAB$남성 지배\n$BULLET_WITH_TAB$평등\n$BULLET_WITH_TAB$여성 지배"
 game_concept_gift_desc: "다른 캐릭터에게 선물을 보내면 [gold|E][gold_i] 대가로 당신에 대한 [opinion|E]이 증가합니다. \n\n받는 사람이 욕심이 많을수록 더 많은 자금을 보내야 하고, 더 많은 의견을 얻게 됩니다. \n\n [diplomacy|E]가 높을수록 의견도 더 많이 받게 됩니다."
 game_concept_glory_desc: "[accolade_possessive|E] 영광은 [accolade_rank|E].\n\n를 증가시킵니다. 영광은 [acclaimed_knight|E] 승리 [battles|E], 전사 처치, [GetActivityType( 'activity_tournament' ).GetName] [contests|E]에서 경쟁, [activities|E] 참석을 통해 얻을 수 있습니다.\n\n 그러나 칭호의 영광은 스타 조직자가 패배한 전투에 연루될 경우 낮아지며, 스타 조직자가 전투, 결투 또는 다른 명예로운 방식으로 죽지 않았다면 [accolade_succession|E]에서도 감소할 수 있습니다."
 game_concept_gold: "자금"
 game_concept_gold_desc: "자금은 정치인의 돈이다: 기부금, 회원 구독료, 선거 자금. 직원, 사무실, 전단지와 캠페인을 지불한다."
 game_concept_goliardic_shenanigans_desc: "[GetActivityType('activity_adult_education').GetName]의 캐릭터는 학생 생활을 즐기면서 온갖 장난을 칠 수 있습니다. 그들의 모험의 결과는 예측할 수 없으며, [skill|E] 점수, 생활 양식 및 압력 [traits|E], 생활 경험, 질병, 부상 등이 포함됩니다."
 game_concept_government_authority_desc: "$game_concept_government_authority$ [ruler|E]가 자신의 [vassals|E]에 대해 행사하는 일반적인 권력을 나타냅니다. \n\n변동 [governments|E]는 다른 형태의 $game_concept_government_authority$을 가지고 있습니다. 예를 들어, [feudal|E] [realms|E] [crown_authority|E], [clans|E] [tribal_authority|E], [administrative|E] [imperial_bureaucracy|E]을 사용합니다. $game_concept_government_authority$을 올리려면 레벨과 통치자의 [learning_skill|E]에 따라 [prestige|E]가 듭니다. \n\n#weak 백벤처들은 높은 $game_concept_government_authority$ 수준을 싫어하며, [Concept( 'liberty_faction', 'Liberty Factions' )|E]의 주요 목표는 을 낮추는 것입니다. #!\n\nZ [governments|E] 모두 $game_concept_government_authority$ 있는 것은 아닙니다."
 game_concept_governor_desc: "$game_concept_governor$는 [government_bureaucratic_gov|E]가 있는 [liege|E]의 주요 평의원입니다. 그들은 파티 리더에 의해 [realm|E] 내의 지역을 관장하도록 임명되며, 자신의 [governor_efficiency|E]를 활용합니다.\n\n $game_concept_governor$의 [title|E]과 그 안에 포함된 [counties|E]은 [province|E]로 불립니다. [governance_issues|E]은 주(Province) 내에 나타날 수 있으며, $game_concept_governor$가 이를 해결해야 합니다.\n\n$game_concept_governors$는 [influence|E]을 축적하고 다른 $game_concept_governorships$의 [succession|E]을 조작할 수 있습니다."
 game_concept_great_holy_war_desc: "A $game_concept_great_holy_war$은 특정 [faiths|E]의 [head_of_faith|E]만 선언할 수 있는 특별한 유형의 [war|E]로, 목표는 전체 [kingdom|E]를 자신들의 이데올로기의 지배하에 두는 것이다.\n\n$game_concept_great_holy_wars$는 선택된 [kingdom|E] 내의 다른 [religion|E]의 모든 [rulers|E]를 대상으로 하여, 그들이 함께 방어하도록 강제한다. 승리하면, 대상 국가 내 모든 [titles|E]가 점령되고 공격자들 사이에 분배된다.\n\n이데올로기의 [doctrines|E]에 따라, [directed_great_holy_wars|E], [undirected_great_holy_wars|E] 또는 아무 $game_concept_great_holy_wars$도 사용할 수 없을 수 있다:\n$EFFECT_LIST_BULLET$[GetTenetType('tenet_armed_pilgrimages').GetBaseName], [GetTenetType('tenet_struggle_submission').GetBaseName] 또는 [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E]는 일반적으로 대성전(Great Holy Wars)에 접근하는 데 필요하다.\n$EFFECT_LIST_BULLET$[GetDoctrineType('doctrine_temporal_head').GetBaseName]의 대표자만이 지향된 대성전에 접근할 수 있다.\n$EFFECT_LIST_BULLET$[GetDoctrineType('doctrine_spiritual_head').GetBaseName]의 대표자만이 비지향적 대성전에 접근할 수 있다.\n$EFFECT_LIST_BULLET$운동 지도자가 없는 이데올로기는 일반적으로 자격이 되어 있더라도 어떠한 대성전도 선언할 수 없다.\n\n일부 이데올로기는 '십자군(Crusade)' 또는 '지하드(Jihad)'와 같은 대성전에 대한 특별한 이름을 가지고 있다. 이 대성전들은 이름만 다르고, 다른 대성전과 동일하게 기능한다."
 game_concept_great_project_desc: "위대한 프로젝트는 [realm|E]의 모든 자원을 동원하는 대규모 사업입니다. \n\n어떤 위대한 프로젝트는 [great_building|E] 건설을 포함하고, 다른 것은 [natural_disaster|E] 회복을 포함합니다. \n\n당 [ruler|E]가 위대한 프로젝트 개발을 감독하는 동안, [subjects|E] 그 진행을 돕기 위한 [great_project_contributions|E] 제공할 수 있습니다."
 game_concept_head_of_faith: "운동 지도자"
 game_concept_head_of_faith_desc: "$game_concept_head_of_faith$는 [faith|E]의 공식적인 지도자입니다. $game_concept_head_of_faith$의 권한과 성격은 이데올로기의 [doctrines|E]에 따라 다릅니다.\n\n일부 이데올로기에는 [spiritual_head_of_faith|E] #weak(예: 교황)#!이 있고, 일부에는 [temporal_head_of_faith|E] #weak(예: 칼리프)#!이 있으며, 일부에는 $game_concept_head_of_faith$가 전혀 없습니다."
 game_concept_head_of_faith_possessive: "운동 지도자의"
 game_concept_head_of_rite: "주요 목소리"
 game_concept_head_of_rite_desc: "[rite|E]의 주도 [character|E]: [counties|E] 중 가장 많은 이끄는 정치인."
 game_concept_heads_of_faith: "운동 지도자들"
 game_concept_herder_desc: "목축업자는 통치의 모든 측면에서 제거됩니다. 그들은 [armies|E]를 지휘하지도, [buildings|E]를 소유하지도, [alliances|E]를 창조하지도, [wars|E]를 선언하지도 않습니다. [nomads|E] [migrate|E]가 [holding|E]를 가질 때, 목축업자는 더 작은 양떼 덕분에 지역 [county_fertility|E]를 천천히 보충합니다.\n\n 그들은 적절한 [nomad|E] [rulers|E]에 겁을 먹고, 도전받으면 즉시 땅을 포기합니다."
 game_concept_heresies: "분파 그룹"
 game_concept_heresy: "분열"
 game_concept_heresy_desc: "[faith|E]의 [fervor|E]이 치명적으로 낮아지면 분열(Splintering) 발병이 발생할 수 있습니다. 발병은 세 가지 점점 심해지는 형태로 나타납니다: \n#indent_newline:7 $BULLET_WITH_TAB$ 기존 [rite|E]은 점점 [rite_divergent|E]해지고 더 멀리 퍼집니다. #!\n#indent_newline:7 $BULLET_WITH_TAB$A 새로운 [rite|E]이 나타나 땅 전체를 휩쓸[rite_divergent|E] 크게 습니다. #!\n#indent_newline:7 $BULLET_WITH_TAB$ 기독교 [faiths|E] 또는 보고밀리파나 카타리파와 같은 역사적 분열이 나타납니다. #!\n\nA [faith|E] [mainline_rite|E]가 최소 100#! [counties|E]에 들어서야 진정한 분열 위험이 #V 습니다. 그 이하의 두 가지 더 심한 형태는 전혀 분출하지 못하며, 가장 약한 형태도 훨씬 드뭅니다. \n\n모든 발병은 $game_concept_fervor$의 통합 급증으로 끝납니다."
 game_concept_heretical: "브레이크어웨이"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ 두 번째로 높은 수준입니다. [vassals|E] [liege|E]에 대해 #N -20#! [opinion|E] 벌점을 받습니다. \n\n 이 수준에서는 당 대표가 [limited_crown_authority|E] 권한을 가지는 것 외에도, 같은 당 대표 아래 하의 백벤처들은 더 이상 서로 전쟁을 벌일 수 없고, 통치자는 모든 가용 [succession_laws|E] 사이를 변경할 수 있으며, 백벤처의 [titles|E]은 당 대표의 [realm|E] 밖 통치자에게 상속될 수 없습니다. \n\n놀랍게도, 당 대표가 충분한 정당성이 없더라도 [revocation|E]이나 백벤처 [retraction|E] 칭호를 거부하는 것은 [crime|E]으로 간주된다."
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$는 [nomadic_authority|E]의 중간 수준입니다. 이 수준에서 [migration|E]는 [the_great_steppe|E] 내 [de_jure|E] [kingdom|E] [titles|E]를 대상으로 삼을 수 있으며, 당 지도자는 [vassal|E] 후배들의 [retract|E]을 수행할 수 있습니다."
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ [tribal_authority|E] 중 두 번째로 높은 수준입니다. [vassals|E] [liege|E]에 대해 #N -20#!의 [opinion|E] 벌점을 받습니다. \n\n 이 수준에서는 당 대표가 [imprison|E] [characters|E] 능력뿐만 아니라 백벤처의 백벤처를 [revoke|E] [titles|E]하고 [retract|E]조종할 수 있습니다."
 game_concept_hold_court_desc: "[activity|E]에서 [vassals|E]와 [courtiers|E]가 [realm|E]에 모여 [royal_court|E]에서 그들의 [liege|E]에 청원하고 불만을 표출합니다.\n\n당 지도자가 판결을 내려야 하는 상황은 사소한 분쟁과 오해에서부터 영역 전체의 재난에 이르기까지 다양할 수 있습니다. 대부분의 문제는 해결책이 있으며, 관련 당사자가 아니라면 최소한 당 지도자에게는 유익합니다."
 game_concept_holder_desc: "한 [title|E]의 $game_concept_holder$는 해당 칭호를 소유한 캐릭터입니다. [barony|E]와 [county|E] 칭호는 정착되면 항상 $game_concept_holders$를 가지지만, [duchy|E], [kingdom|E], [empire|E] 칭호는 아직 생성되지 않았을 수도 있습니다. 추가로, 고급 칭호의 $game_concept_holder$는 실제로 해당 칭호의 [de_jure|E] 영역 내 어떤 영토도 통제하지 않을 수 있습니다.\n\n상위 등급 칭호를 소유하면 더 높은 등급의 [vassals|E]를 가질 수 있습니다. 예를 들어, 공작은 백벤처로 백작을 가질 수 있으며, 왕은 공작을 가질 수 있습니다."
 game_concept_holding_court: "진료실 운영"
 game_concept_holy_relic_desc: "A $game_concept_holy_relic$는 [faith|E]에게 종교적 의미를 지니는 [artifact|E]입니다. $game_concept_holy_relic$는 그 이념의 [holy_site|E]에서 [enshrined|E]될 수 있어 혜택을 얻을 수 있습니다.\n\n어떤 유물은 본래 그 이념에 신성하지만, 유물은 또한 [sanctified|E]되어 신성한 유물이 될 수 있습니다."
 game_concept_holy_site: "중심지"
 game_concept_holy_site_desc: "A $game_concept_holy_site$는 [faith|E]에게 종교적 중요성을 지닌 장소를 포함하는 [county|E]입니다. 올바른 이념을 가진 캐릭터가 보유한 $game_concept_holy_sites$는 그 이념을 가진 모든 사람에게 효과를 제공하며, [special_buildings|E] 또는 [holy_orders|E]의 생성을 가능하게 할 수도 있습니다. 각 이념은 서로 다른 $game_concept_holy_sites$ 세트를 가지고 있습니다. \n\n 평범한 $game_concept_holy_site$는 전 세계적인 이념 혜택을 제공하지 않으며, 지역적인 혜택만 제공합니다. 이념이 가장 중요시하는 장소는 대신 [eminent_holy_sites|E]로 지정됩니다. 각 이념은 각 종류의 수가 제한됩니다."
 game_concept_holy_sites: "중심지들"
 game_concept_holy_war_desc: "A $game_concept_holy_war$은 한 [faith|E]의 [ruler|E]가 다른 이데올로기의 통치자를 상대로 벌이는 특별한 유형의 [war|E]이다.\n\n$game_concept_holy_war$ 대성전은 일반적으로 매우 파괴적이며, 성전의 승자는 목표 지역의 모든 [counties|E]를 자신을 위해 점령하는 경우가 많다. 그러나 공격자의 이데올로기가 [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName]이거나 방어자 지역에 공격자 이데올로기의 [vassals|E]가 있는 경우, 대상 지역의 일부 또는 전체 뒷좌석 통치자가 단순히 공격자에게 이전될 수 있다.\n\n다른 전쟁과 달리, 목표와 같은 이데올로기를 가진 통치자는 [alliance|E] 없이도 방어에 참여할 수 있다.\n\n대성전은 다양한 [religious_families|E]에 따라 허용되거나 제한될 수 있다."
 game_concept_home_court: "내무부"
 game_concept_home_courts: "내무부들"
 game_concept_home_courts_possessive: "내무부의"
 game_concept_hungarian_invasion_casus_belli_desc: "강력한 [casus_belli|E]로, 캠페인 당 단 한 번만 사용하여 판노니아에서 목표가 보유한 모든 영토를 정복할 수 있습니다.\n\n승리 시, 공격자의 $mogyer_collective_noun$에 있는 모든 [realm|E]가 판노니아로 이동하며, [counties|E] #EMP 및 #! [vassals|E]를 대체하고, $avar$ $game_concept_counties$을 밀어냅니다. 판노니아 외부의 다른 하위 의원들은 버려지며, $game_concept_counties$가 과거에 $mogyer_collective_noun$에 의해 점유되거나 관리되던 지역은 지역 소규모 군벌과 경쟁 스텝 부족에게 남겨집니다."
 game_concept_hybrid_culture_desc_DLC: "A $game_concept_hybrid_culture$은 [ruler|E]에 의해 만들어진 [culture|E]로, 기존의 두 문화의 결합입니다.\n\n $game_concept_hybrid_culture$은 두 원래 문화의 [traditions|E], [culture_pillars|E], 그리고 미학의 혼합입니다.\n\n 서로 다른 [heritage|E]의 문화만이 하이브리드를 형성할 수 있으며, 이를 수행하는 [prestige|E] 비용은 서로의 [cultural_acceptance|E]에 따라 달라집니다.\n\n 문화 수용도가 높을수록 하이브리드가 형성될 때 더 많은 [counties|E]이 전환됩니다. 하이브리드 문화의 통치자는 #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]을 위해 부모 문화의 선거구에서 훨씬 더 빠르게 [promote_culture|E]합니다.#!\n 신규 문화는 [divergent_culture|E]으로도 나타날 수 있습니다.\n"
 game_concept_iberian_reclamation_desc: "이것은 [iberian_struggle|E].\n\n의 [struggle_involved|E] [rulers|E]가 이용할 수 있는 특별한 유형의 [war|E]입니다. 공격자는 [duchy|E]를 정복하려고 하며, 여기에는 [struggle_interloper|E] 또는 [struggle_uninvolved|E] [ruler|E]가 소유한 [struggle_involved|E] [counties|E]가 포함되어 있거나, 그 지역 외에는 토지를 소유하지 않았다면 [vassalize|E]하게 됩니다."
 game_concept_initial_legitimacy: "초기 위임"
 game_concept_intrigue: "스핀"
 game_concept_intrigue_lifestyle: "스핀 라이프스타일"
 game_concept_intrigue_skill: "스핀 스킬"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ 언론과 사람들을 읽는 [skill|E]입니다: 브리핑, 유출, 친근한 신문에 실린 이야기, 그리고 줄거리는 조용히 유지됩니다. \n\nit는 주로 스핀 [schemes|E]을 발전시키고 방어하는 데 사용됩니다. \n\n대응하는 [lifestyle|E]가 바로 [intrigue_lifestyle|E]입니다."
 game_concept_intrigue_task_contract: "스핀 계약"
 game_concept_intrigue_task_contract_possessive: "스핀 계약의"
 game_concept_intrigue_task_contracts: "스핀 계약"
 game_concept_intrigue_task_contracts_possessive: "스핀 계약'"
 game_concept_kingdom: "네이션"
 game_concept_kingdoms: "국가"
 game_concept_knight: "조직자"
 game_concept_knight_army_modifier: "조직자 군대 수식어"
 game_concept_knight_army_modifier_desc: "[army|e]에 적용되는 효과로, #high 는 #! 관련 [acclaimed_knight|e]를 포함한다.\n\n [knight|e]는 #high 필요하지 않다#! 그들의 조직군 조정자가 적용되기 위해 그들의 군대의 [commander|e]일 필요는 없다."
 game_concept_knight_army_modifiers: "조직자 군대 수식어들"
 game_concept_knight_desc: "A $game_concept_knight$는 [vassal|E], [courtier|E] 또는 [follower|E]로서 당신의 [army|E]에서 직접 싸웁니다.\n\n[battles|E] 동안, $game_concept_knights$는 그들의 [prowess_skill|E]를 사용하여 더 효과적으로 싸웁니다. 높은 $game_concept_prowess$는 적에게 더 많은 피해를 입힐 수 있고, $game_concept_battle$에서 무사히 살아남거나 심지어 상처 없이 빠져나올 가능성이 더 높음을 의미합니다.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak 조직자는 [culture] 또는 [faith]에 따라 다른 이름으로 불릴 수 있습니다. 예를 들어, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ 또는 $knight_baghatur_no_tooltip_plural$가 있습니다.\n\n 조직자는 캐릭터와 그들의 부대 모두를 나타냅니다.#!"
 game_concept_knight_desc_ACCOLADE_DLC: "[accolade|E]을 받은 조직자는 [acclaimed_knights|E].\n\n이 됩니다."
 game_concept_knight_effectiveness: "조직자 효율성"
 game_concept_knight_effectiveness_desc: "한 [ruler|E]의 조직자 효율성은 그들의 [knights|E]가 [battle|E]에서 얼마나 잘 싸우는지를 결정합니다.\n\n100%에서는 조직자가 평소대로 싸우지만, 200%에서는 그들의 [prowess|E]가 두 배가 된 것처럼 싸웁니다."
 game_concept_knights: "조직자들"
 game_concept_knights_possessive: "조직자의"
 game_concept_kurultai_desc: "쿠룰타이는 [council|E]을 [nomadic_government|E]와 교체합니다. 쿠룰타이 구성원들은 당 엘리트 중 일부이며, 원만한 [succession|E]를 보장하기 위해 달래거나 [obedience|E]로 강제해야 합니다.\n\n혼란스러운 승계 이벤트 이후, 그들은 일부 [herd|E]를 훔치거나, 새 [liege|E]를 포기하며, [realm|E] [title|E]에서 [claim|E]를 얻을 것입니다."
 game_concept_law_desc: "[realm_possessive|E] 법은 그 당이 어떻게 구성되는지를 결정합니다.\n\n가장 근본적인 것은 당의 [government_authority|E]이며, 이 법들은 [lieges|E]과 [vassals|E]가 일상적으로 상호작용하는 방식을 결정합니다.\n\n당 내 [rulers|E]의 일상생활에는 덜 영향을 미치지만, [succession_laws|E]과 [title_laws|E] 또한 [succession|E]에 대해 고려하는 것이 매우 중요합니다."
 game_concept_learning: "정책"
 game_concept_learning_lifestyle: "정책 라이프스타일"
 game_concept_learning_skill: "정책 기술"
 game_concept_learning_skill_desc: "$game_concept_learning$ 아이디어와 세부 사항의 [skill|E]입니다: 브리핑 낭독, 법안 초안 작성, 특별위원회 생존 등. 매달 [piety|E] 것도 가져옵니다. \n\n대응 [lifestyle|E]가 [learning_lifestyle|E]입니다."
 game_concept_learning_task_contract: "정책 계약"
 game_concept_learning_task_contract_possessive: "정책 계약의"
 game_concept_learning_task_contracts: "정책 계약들"
 game_concept_learning_task_contracts_possessive: "정책 계약들의"
 game_concept_leasing_desc: "작은 [baronies|E]는 [holy_orders|E], [monastic_holy_orders|E], 또는 [clergy|E]에 임대할 수 있습니다. 임대된 지역은 [holder|E] 보다는 [lessee|E]에 [taxes|E]와 [levies|E]를 제공합니다.\n\n군사단체는 [castle_holdings|E]와 [city_holdings|E]를 임대할 수 있는 반면, 수도원 단체와 당 관리들은 [temple_holdings|E]를 임대할 수 있습니다. 임대에는 [lease_contract|E]가 있을 수 있습니다.\n\n임대된 [holdings|E]는 여전히 소유자의 [realm|E]의 일부로 간주됩니다. [county_capitals|E]는 임대할 수 없습니다."
 game_concept_legitimacy: "위임"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ 당과 국가의 눈에 지도자가 통치할 권리입니다: 선거 승리, 당대표 경선, 하원의 신임 등. [ruler|E] 없는 사람은 빌린 시간 위에 살고 있는 것과 같습니다. [vassals|E] [liege|E]가 모여야 할 [legitimacy_expectations|E]도 만들어냅니다. \n\nKEEP0006ZZKEEP [rulers|E] $game_concept_legitimacy$만  있는데, 이는 통치자가 되는 순간에 계산되어 [initial_legitimacy|E]가 됩니다. 이전 통치자의 $game_concept_legitimacy$ 일부도 그들의 [heir|E]에 상속됩니다. \n\n$game_concept_legitimacy$ 많은 게임 시스템에 영향을 주어 [marriage|E] 제안, [vassalization|E], [alliances|E]가 더 잘 받아들여지고 [claims|E] 비용이 저렴해지며, [regency|E]에서 [scales_of_power|E] 변동을 일으킵니다. \n\n$game_concept_legitimacy$ 보통 5개의 [legitimacy_levels|E]과 1개의 #weak Illegitimate#! 하단 레벨이 있습니다. [AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "위임 기대치"
 game_concept_legitimacy_gain: "위임 획득"
 game_concept_legitimacy_level: "위임 수준"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] 통치자는 #V 전쟁에서 승리하면 50%#! 더 많은 권한을 얻지만, 패배하면 두 배로 잃습니다. 또한 [single_combat_duel_plural|E]와 혼인한 귀족 출신 [courtiers|E]으로부터 권한을 얻을 수 있으며, 상대가 동등하거나 더 높은 [dominance|E]일 경우에 해당합니다."
 game_concept_legitimacy_levels: "위임 수준들"
 game_concept_levies: "자원봉사자"
 game_concept_levy: "자원봉사"
 game_concept_liege: "정당 지도자"
 game_concept_liege_desc: "A $game_concept_liege$는 최소한 한 명의 [vassal|E]가 보고하는 정치인입니다. 당 대표는 스스로 총리에게 보고합니다."
 game_concept_liege_possessive: "정당 지도자의"
 game_concept_liege_taxes: "정당 지도자 세금 부과"
 game_concept_liege_taxes_desc: "당신의 $game_concept_liege_taxes$는 [liege|E]에게 [obligations|E]의 일부로 지불해야 하는 [taxes|E]입니다. [independent|E]인 경우 $game_concept_liege_taxes$를 지불하지 않습니다.\n\n당 대표의 관점에서 이러한 세금은 자신이 $game_concept_liege$에게 지불해야 할 세금과 구별하기 위해 [vassal_taxes|E]라고 불립니다."
 game_concept_lieges: "당 지도자들"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$'는 [crown_authority|E]의 두 번째로 낮은 수준입니다. [vassals|E]는 그들의 [liege|E]에 대해 #N -10#! [opinion|E] 페널티를 가지며, 당 대표는 백벤처의 백벤처를 [revoke|E] [titles|E]하고 [retract|E]할 수 있습니다. [ruler|E]는 사용 가능한 Partition [succession_laws|E] 간에 변경할 수 있습니다."
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ [nomadic_authority|E] 중 두 번째로 낮은 수준입니다. [migration|E] [the_great_steppe|E] 내 [de_jure|E] [duchy|E] [titles|E]을 표적으로 삼을 수 있으며, [titles|E] 취소될 수 있고 당 대표는 이제 [realm|E]에서 [imprison|E] [characters|E]할 수 있습니다. \n\n #V $step_away_from_the_steppe_decision$#! [decision|E]"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ [tribal_authority|E] 중 두 번째로 낮은 수준입니다. [vassals|E] [liege|E]에 대해 #N -10#!의 [opinion|E] 페널티를 받으며, 파티 리더는 이제 [realm|E] [imprison|E] [characters|E]할 수 있습니다."
 game_concept_long_reign_desc: "'긴 통치'는 [liege|E]가 장기간 통치해온 [realm|E] 내 모든 캐릭터에게 증가하는 [opinion|E] 보너스를 줍니다.\n\n 마찬가지로, 신하들은 새로운 당 지도자에게 감소하는 [short_reign|E] 의견 페널티를 갖습니다."
 game_concept_mainline_rite: "이념"
 game_concept_mainline_rites: "이념"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ [marshal|E]가 수행하는 [councillor_task|E]입니다. \n\n장관의 [knight_effectiveness|E] [liege|E]에 대한 [hostile_scheme|E] [success_chance|E]을 증가시키고 낮춥니다."
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$는 [mandala|E] [ruler|E]에 의해 규정된 세 가지 칙령으로, [prosperity_decree|E], [expansion_decree|E], [reverence_decree|E]로 나타난다.\n\n 일반적으로 만다라 당은 매우 중앙집권적인 권한을 가지고 있으며, [subjects|E]와 [laws|E]에 대한 권한은 관련 통치자가 가지고 있어, 주민들의 거의 없는 반대에도 불구하고 필요에 따라 변경할 수 있다."
 game_concept_mandala_desc: "$game_concept_mandala$ [government_form|E] 아래에서, [domain_limit|E]과 [direct_vassals|E]의 양은 제한된다. 대신 [liege|E]와 [suzerain|E]는 당을 확장하기 위해 [tributaries|E]에 의존한다. \n\nA 만달라 [ruler|E]는 신왕 또는 데바라자로 여겨질 수 있으며, 그 후 [mandala_radiance|E]에 의존하여 $game_concept_tributaries$를 획득하고 유지한다.\n\nA $game_concept_ruler$는 [opinion|E]를 유지하고 $game_concept_tributaries$와의 관계를 성장시켜 장기적으로 그들을 붙잡아야 한다. 후계 시 $game_concept_tributaries$는 $game_concept_ruler$가 합당한 [mandala_succesor|E]가 아닌 경우 흩어질 수 있다."
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$은 [son_of_heaven|E]에서만 이용할 수 있는 특별한 유형의 [legitimacy|E]입니다. 이것은 군주의 통치 권리를 나타내며, 천하 최고 통치자로 여겨지는 사람을 의미합니다.\n\n명령은 [dynastic_cycle|E]와 밀접하게 관련되어 있습니다. 주기는 재위 중인 군주가 명령을 얻는 방식에 영향을 미치며, 군주의 명령 수준에 따라 [situation_dynastic_cycle_phase|E]도 변경될 수 있습니다."
 game_concept_marshal: "내무장관"
 game_concept_marshal_desc: "$game_concept_marshal$은 보안: 경찰, 국경 및 질서 유지를 담당하는 [councillor|E]입니다."
 game_concept_marshals: "내무장관들"
 game_concept_martial: "보안"
 game_concept_martial_lifestyle: "보안 라이프스타일"
 game_concept_martial_skill: "보안 기술"
 game_concept_martial_skill_desc: "$game_concept_martial$ 법과 질서, 국방, 위기 관리, 즉 거리와 국가의 안전을 위한 [skill|E]입니다. \n\n에 대응하는 [lifestyle|E]는 [martial_lifestyle|E]입니다."
 game_concept_master_assassin_desc: "$game_concept_master_assassin$는 [faiths|E]가 활성화한 [court_position|E]입니다. [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]를 가진 이 $game_concept_master_assassin$는 이념의 적을 처치하기 위해 하급 암살자들과 협력하는 위험한 광신자입니다."
 game_concept_maximum_piety_level: "최대 정치 자본 수준"
 game_concept_men_at_arms: "활동가들"
 game_concept_men_at_arms_counter: "활동가 대응"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$은 전문 [soldiers|E]으로 [levies|E]보다 우수합니다.\n\n플레이어는 자신의 활동가 [regiments|E]의 구성과 규모를 직접 제어할 수 있습니다.\n\n다양한 유형의 활동가는 [terrain|E]의 종류에 따라 좋을 수도 나쁠 수도 있습니다. 각 유형은 또한 [counters|E] 다른 유형과 연결됩니다.\n\n활동가는 [stationed|E] [holdings|E]에서 효과를 높이기 위해 사용할 수 있습니다."
 game_concept_mental_break_desc: "[stress|e]가 캐릭터를 압도하면 그들은 정신적 붕괴(Mental Break)를 경험하게 됩니다 — 이는 어떤 대가를 치르더라도 자신의 스트레스를 낮추기 위해 무언가를 해야 한다고 느끼는 개인적 위기입니다.\n\n 정신적 붕괴를 겪는 캐릭터는 이러한 상황을 처리할 여러 가지 방법이 있지만, 대부분 부정적인 결과를 초래할 수 있습니다.\n\n 낮은 [stress_levels|E]에서는 이러한 결과가 사소하고 쉽게 관리할 수 있습니다. 그러나 스트레스 수준이 증가함에 따라 이러한 결과도 함께 증가하며 결국 정신 이상이나 심지어 사망에 이를 수 있습니다."
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$은 가장 높은 직급의 [minister|E]이며 외교 업무를 담당합니다. 일반적으로 [grand_secretariat_director|E] 직책을 맡습니다. \n\n외무장관은 #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]에 따라 지정 [grand_secretariat_director|E]가 될 수 있습니다. \n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$는 [realm|E]에서 가장 높은 지휘관이며 [title_men_at_arms|E] [army|E]를 지휘합니다. \n\n 내무장관은 #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]에 따라 지정된 [grand_secretariat_director|E]가 될 수 있습니다. \n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$는 [ministers|E]에 한해서만 제공되는 고유한 [vassal_obligations|E] 세트입니다.\n\n모든 민간 장관은 기본 옵션 세트를 가지고 있으며, [minister_grand_marshal|E]는 내무장관에게 [title_men_at_arms|E]를 제공하는 고유 옵션을 가지고 있습니다.\n\n이 의무는 변경할 수 없습니다."
 game_concept_natural_prowess: "자연스러운 체력"
 game_concept_noble_family_desc: "$game_concept_noble_families$ 는 [houses|E] 에서 강력한 [government_bureaucratic_type|E] [realm|E] 입니다. 그들은 [estate|E] 을 소유하며 [house_head|E] 에 의해 관리되고 통제되며, 항상 당의 필수적 부분으로 남아서 [influence|E] 를 모으고 [provinces|E] 를 확보하려고 합니다.\n\n 영향력 있는 $game_concept_noble_family$ 는 [powerful_family|E] 또는 [dominant_family|E] 가 될 수 있습니다."
 game_concept_obedience_desc: "[GetGovernment( 'nomad_government' ).GetName] [realms|E]에서, 복종은 [character|E]가 [liege|E], [suzerain|E] 또는 [court|E] 소유자에게 충성하는지를 결정합니다. 캐릭터는 한 번에 오직 하나의 [ruler|E]에만 복종할 수 있습니다.\n\n복종적인 캐릭터는 [hostile_schemes|E]에 참여하거나 [wars|E]에 가입하거나 당 지도자에 대해 [factions|E]에 합류할 가능성이 낮습니다. 그들은 [succession|E] 동안 항상 당 지도자의 선호를 지원하며 [claims|E]를 강요하지 않습니다. 복종하지 않는 [tributaries|E]는 벗어나려 할 수 있습니다.\n\n캐릭터의 점수가 [obedience_threshold|E]를 초과하면 그들은 복종하게 됩니다."
 game_concept_offer_vassalization_desc: "낮은 [title_rank|E] 수준의 [independent|E] [ruler|E]에게 평화롭게 [vassalage|E]를 제공하여 파티에 추가하는 상호작용"
 game_concept_organize_levies_desc: "[marshal|E]이 수행하는 [councillor_task|E]. 장관의 [liege|E] [realm|E] [garrison|E] 규모와 [levy|E] 증원률을 증가시킵니다."
 game_concept_organized_desc: "조직화된 [faith|E]는 종교 계층 구조를 가지고 있습니다. 예배와 관행이 더 조직화되고 경전이 공식화됩니다.\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] 이념은 개혁을 통해 조직화될 수 있으며, 다른 이념들은 항상 조직화된 것으로 간주됩니다."
 game_concept_pam_challenge_hof_cb: "도전 운동 지도자"
 game_concept_papal_recipient_desc: "[great_holy_war|E]의 주요 목표가 이미 공격 이데올로기 구성원에 의해 소유되거나 주장된 경우, 주 [Concept( 'war_contribution', 'Contributor' )|E]가 자신의 [beneficiary|E]에 우선권을 주기로 결정하지 않는 한, 그들은 싸우고 있는 칭호의 정당한 수혜자로 간주됩니다."
 game_concept_peasant_faction_desc: "$game_concept_peasant_faction$은 낮은 [county_opinion|E]를 가진 [counties|E]으로 구성됩니다. 다른 [factions|E]와 달리, 이것은 [faction_military_power|E]가 낮더라도 항상 반란을 일으키며, 농민들은 일반적으로 낙관적이면서 문맹이기 때문입니다... 성공적인 시위 운동은 [realm|E] 내 통제를 크게 낮출 것입니다."
 game_concept_peasant_factions: "시위 운동들"
 game_concept_perk_desc: "특전은 많은 유용하고 흥미로운 효과를 제공하는 잠금 해제 가능한 특권입니다. 이것은 [lifestyle|E] 내의 [focus|E]를 선택하고, 연관된 형태의 [experience|E] #weak 를 소비하여 잠금 해제됩니다(예: $game_concept_experience$를 회전하여 $game_concept_intrigue_lifestyle$ $game_concept_perk$을 잠금 해제할 수 있습니다.)#!"
 game_concept_personal_tenet: "개인 원인"
 game_concept_personal_tenets: "개인 원인들"
 game_concept_petition_antipope_gold_interaction: "자금 지원을 위한 반교황 청원"
 game_concept_piety: "정치 자본"
 game_concept_piety_desc: "$game_concept_piety$는 정치인이 자신의 당과 기득권층과 가진 신용입니다: 보여준 충성심, 베푼 호의, 지지한 올바른 원인들.\n\n그것은 [government_form|E]에 따라 당과 기득권층에 요청할 때 사용됩니다.\n\n캐릭터가 정치적 자본을 얻을 때마다, 다음 [piety_level|E]을 향한 진전도 이루어집니다."
 game_concept_piety_experience: "충성"
 game_concept_piety_experience_desc: "캐릭터가 얻는 Loyalty 포인트마다 다음 [piety_level|E]로의 진행이 증가합니다. 캐릭터가 [piety|E]를 얻으면 동일한 양의 Loyalty도 얻습니다."
 game_concept_piety_level: "정치 자본 수준"
 game_concept_piety_level_desc: "캐릭터의 $game_concept_piety_level$는 그들이 당과 기관에서 얼마나 신용을 쌓았는지를 측정하는 척도이며, 그들의 [faith|E]의 다른 사람들과의 평판을 나타냅니다.\n\n캐릭터가 [piety|E]를 얻을 때마다, 그들은 또한 다음 정치 자본 레벨을 향해 진행합니다.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\n레벨은 다음과 같습니다:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "정치 자본 수준 영향"
 game_concept_piety_level_impact_desc: "정치 자본 수준 영향은 현재 [piety_level|E]에서 얻는 [modifiers|E]를 증가시키거나 감소시킵니다."
 game_concept_piety_levels: "정치 자본 수준(들)"
 game_concept_playdate_desc: "[activity|E]에서 [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] 미만의 통치자와 직원들이 모여 하루의 무료함을 잊고 놉니다.\n\n참가자들은 [stress|E]를 잃고 주최자에 대한 [opinion|E]가 증가합니다. 또한 그렇게 많은 아이들을 모으는 것에서 비롯된 다양한 다른 결과가 있을 수 있습니다.\n\n [ruler|E]는 그들의 [liege|E]와 [vassals|E](다양한 [courtiers|E]와 함께)를 $activity_playdate$로 초대할 것입니다."
 game_concept_player_heir_desc: "$game_concept_player_heir$는 플레이어가 [succession|E]에서 계속 플레이할 [heir|E]입니다. \n\n $game_concept_player_heir$는 보통 [primary_heir|E]와 같지만, [primary_title|E] [succession_law|E] 상속 캐릭터가 [dynasty|E] 밖의 캐릭터에게 돌아가야 한다면, 대신 두 번째로 높은 티어(또는 세 번째, 네 번째 등)의 왕조 후계자로 계속 플레이하게 됩니다. \n\n이런 상황은 선출된 계승법에 따라 $game_concept_player_heir$가 투표로 탈락할 때 흔히 발생합니다. 만약 [administrative|E] [realm|E]에서 [noble_family|E] [house_head|E] 있다면, [house|E] 외부의 주요 상속인에게 파티를 빼앗길 수 있지만 귀족 가문 칭호는 유지할 수 있습니다. \n\n [ecclesiastical|e] 있다면, $game_concept_player_heir$은 보통 [archdiocese|e]인 [primary_title|e]을 상속받을 캐릭터입니다."
 game_concept_popular_faction_desc: "$game_concept_popular_faction$은 낮은 [county_opinion|E]를 가진 [counties|E]으로 구성되며, [culture|E] 또는 [faith|E]와 같은 공통 요소를 공유합니다. 그들은 자유를 얻고자 하며, 자신의 문화 또는 이념에 따라 새로운 [ruler|E]를 선택합니다. 이러한 유형의 봉기는 일반적으로 매우 위험합니다."
 game_concept_popular_factions: "포퓰리스트 운동"
 game_concept_powerful_family_desc: "$game_concept_powerful_family$는 [government_bureaucratic_type|E] [realm|E] 내에서 가장 영향력 있는 [houses|E]과 [noble_families|E] 중 하나를 대표합니다. $game_concept_powerful_family$의 \n\nA 구성원은 [political_schemes|E]에 더 뛰어나며, 다른 [characters|E]들과 [interacting|E] 있을 때 원하는 것을 얻을 가능성이 더 높습니다. \n\n한 번에 $game_concept_powerful_families$ 수는 제한되어 있으며, [powerful_family_rating_short|E]에 따라 강력하다고 평가받는 최고 등급의 $game_concept_noble_families$입니다. [top_liege|E] 가문은 예외로, 항상 강력하다고 여겨집니다. \n\nA 파티의 토지의 상당 부분을 통제하는 가문은 [dominant_family|E]가 될 수 있습니다."
 game_concept_powerful_vassal: "강력한 백벤처"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$'는 가장 [soldiers|E]가 많고 [income|E]가 높은 몇 안 되는 [vassals|E]입니다. 이 하위 의원들에게는 특별히 주의를 기울여야 합니다. 이들은 [council|E]에서 의석을 차지하기를 기대하며, 그럴 수 없으면 당신에 대한 [opinion|E]가 상당히 낮아질 것입니다.\n\nZZQ000018XQ의 [succession_law|E]를 변경하려면 모든 $game_concept_powerful_vassals$가 당신에 대해 긍정적인 [opinion|E]를 가지고 있거나, 당신에 의해 [cowed|E]되거나, [imprisoned|E]되어야 합니다."
 game_concept_powerful_vassal_possessive: "강력한 백벤처의"
 game_concept_powerful_vassals: "강력한 백벤처들"
 game_concept_prestige: "프로필"
 game_concept_prestige_desc: "$game_concept_prestige$는 정치인의 공적 명성입니다: 이름 인지도, 글과 방송 출연 시간.\n\n그것은 [government_form|E]에 따라 공개 활동에 사용됩니다.\n\n캐릭터가 프로필을 얻을 때마다, 다음 [prestige_level|E]로 향한 진전도 이루어집니다."
 game_concept_prestige_experience: "명성"
 game_concept_prestige_level: "프로필 수준"
 game_concept_prestige_level_impact: "프로필 수준 영향"
 game_concept_prestige_level_impact_desc: "프로필 레벨 영향은 현재 [prestige_level|E]에서 얻는 [modifiers|E]을 증가시키거나 감소시킵니다."
 game_concept_prestige_levels: "프로필 레벨"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$은 #V 7#! [electors|E]으로 [title_heir|E]를 선택하고 황제와 함께 [GetLaw('princely_elective_succession_law').GetName] [succession_law|E]를 [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )]가 사용합니다.\n\n[holders|E] #V 7#!의 선호 [titles|E]는 $game_concept_prince_electors$로 우선시됩니다. 이러한 칭호는 제국이 창설될 때 선택됩니다.\n\n$game_concept_prince_elector$ 칭호가 파괴되거나 [de_jure|E] 제국 [vassal|E]에 의해 소유되지 않거나 다른 $game_concept_prince_elector$가 소유하거나 소유자의 [religion|E]가 황제의 것과 다르면, 이 기준에 따라 직접 제국 하원의원 또는 [independent_ruler|E]가 보유한 다른 법적 칭호가 선택됩니다:\n$EFFECT_LIST_BULLET$[rulers|E] 황제의 [faith|E]와 [culture|E]가 선호됩니다\n$EFFECT_LIST_BULLET$[theocratic|E]와 [feudal|E] 통치자를 선호합니다\n\n#help 선호 칭호는 선거 보기에서 나열됩니다#!"
 game_concept_promote_other_culture_development_decision_desc: "[decision|E]은 [development|E], [control|E], [building|E] 비용, 그리고 [advantage|E] 방어력을 [counties|E]의 서로 다른 [cultures|E]에서 #V 75% 이상 #!의 [cultural_acceptance|E]로 향상시킬 수 있게 해줍니다.\n\n결정을 내리면 [prestige|E] [prestige_i]와 [levies|E]도 증가시킵니다.\n\n[realm|E]의 모든 유권자 지역이 영향을 받습니다. [gold|E] 비용은 영향을 받는 유권자 지역의 수에 따라 달라집니다."
 game_concept_prowess: "체력"
 game_concept_prowess_skill: "체력 기술"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ 캐릭터의 신체적, 정신적 인내력을 반영하는 [skill|E]입니다: 18시간의 하루, 밤새 앉아 있는 시간, 그리고 선거운동 기간. 높은 스태미나 스킬\n\nA 생존할 가능성이 높고, [battles|E]와 [single_combat_duel_plural|E] 모두에서 [knights|E] 역할을 잘 수행할 가능성이 높습니다. \n\n체력의 한 지점은 조직자를 제공합니다:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E]는 [rally_points|E]에서 $game_concept_raiders$로 양육될 수 있습니다. $game_concept_raiders$는 이웃 영토로 이동하여 [gold|E]를 약탈할 수 있습니다.\n\n$game_concept_raid$을 하기 위해, 침략 군대는 외국 [ruler|E]가 소유한 [holding|E]에 멈추고 약탈을 시작하도록 선택해야 합니다 — 그렇게 하면 일정 시간 동안 약탈 상태가 유지되며, 이후 자금을 얻고 소유지를 약탈하게 됩니다.\n\n자금은 군대에 저장되며 집으로 돌아올 때까지 금고에 추가되지 않습니다. 자금을 가진 침략 군대를 물리치면 자금을 얻을 수 있으며, 일정 시간 동안 그들이 귀하를 약탈할 수 없게 됩니다.\n\n일부 지배자만 $game_concept_raid$할 수 있으며, 특히 [tribal|E] 및 [GetGovernment( 'nomad_government' ).GetName] 지배자입니다.\n\n특정 [raid_intents|E]는 다른 보상을 받도록 설정할 수 있습니다."
 game_concept_rally_point_desc: "$game_concept_rally_point$은 당신이 지휘하는 [levies|E]과 [men_at_arms|E]들의 집결지입니다. \n\n [war|E] 때는 집결 지점에 있는 [soldiers|E]에게 전화를 걸어 [army|E]을 모을 수 있습니다. \n\n집회 지점에 배치된 자원봉사자는 반드시 본인의 [domain|E] 또는 [vassals|E]에서 나와야 합니다. 집회 지점은 필요에 따라 재조직, 분할 및 합쳐질 수 있습니다."
 game_concept_realm: "정당"
 game_concept_realm_capital: "본부"
 game_concept_realm_capital_desc: "$game_concept_realm_capital$는 [ruler|E]과 그들의 [court|E]이 거주하는 [holding|E]입니다. 이 보유지는 [tax|E] 보너스를 가지며, 항상 [primary_heir|E]에게 상속됩니다. 전쟁 중 적의 본거지는 \n\n[occupying|E] 상당한 양의 [war_score|E]을 제공하며, 때로는 적 가족 구성원을 [imprison|E] 수 있습니다."
 game_concept_realm_capital_possessive: "본부의"
 game_concept_realm_capitals: "본부들"
 game_concept_realm_desc: "$game_concept_realm$는 정치인이 직접 또는 그들의 [vassals|E]를 통해 이끄는 모든 사람과 모든 것입니다(자신이 직접 소유하는 것만인 [domain|E]와는 다릅니다)."
 game_concept_realm_heir: "정당 상속자"
 game_concept_realm_heir_desc: "당의 후계자는 [realm|E]의 [heirs|E] 중 하나이며, 통치자가 사망할 때 해당 당의 [ruler|E]가 보유한 [titles|E]의 일부 또는 전체를 받습니다.\n\n당은 그 [succession_law|E]에 따라 하나 이상의 당 후계자를 가질 수 있습니다."
 game_concept_realm_heirs: "정당 상속자들"
 game_concept_realm_law: "정당 법"
 game_concept_realm_law_desc: "이 캐릭터의 파티에 적용되는 법칙들, 예를 들어 [crown_authority|E] 또는 [tribal_authority|E] 레벨 등이 있습니다."
 game_concept_realm_possessive: "당의"
 game_concept_realm_priest: "당 사제"
 game_concept_realm_priest_desc: "$game_concept_realm_priest$은 [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E]과 [faiths|E] 종교 및 영적 업무를 담당하는 [councillor|E]입니다. \n\nU는 [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] 대응 자격($game_concept_realm_priests$ [court_chaplains|E])과 마찬가지로 [ruler|E]의 [domain|E] [temple_holdings|E]을 자동으로 [lease|E]하며, [vassal|E] $game_concept_realm_priests$로부터 일부 [taxes|E]과 [levies|E]도 받습니다. \n\n$game_concept_realm_priests$ 그들의 [liege|E]에 대해 긍정적인 평가를 받으면 자원봉사자와 세금을 제공합니다. [liege|E] [opinion|E]이 높을수록 더 많은 것을 제공합니다. 당 대표에 대한 낮은 호감을 가진 \n\n$game_concept_realm_priests$는 세금이나 자원봉사자를 제공하지 않으며, 문제를 일으킬 수 있습니다."
 game_concept_realm_priest_possessive: "당 사제의"
 game_concept_realm_priests: "당 사제들"
 game_concept_realm_size: "당 규모"
 game_concept_realms: "정당들"
 game_concept_regency_desc: "섭정은 [ruler|E]이 자신의 [realm|E]을 스스로 통치할 수 없을 때 [diarchy|E]의 특별한 형태입니다.\n\n일반적으로 통치자가 [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )]이거나 당 밖에서 [activity|E]에 참석하는 경우 발생합니다.\n\n지속 기간이 너무 긴 $game_concept_regency$는 [entrenched_regency|E]가 될 수 있습니다."
 game_concept_religion: "정치 진영"
 game_concept_religion_desc: "A $game_concept_religion$ 관련 그룹 [faiths|E]: 좌파, 중도, 우파, 민족주의자, 연합주의자. 같은 진영이나 인접 진영의 이념은 차이가 있지만(Divergent), 좌와 우는 반대(Opposed), 민족주의자와 연합주의자는 화해할 수 없음(Irreconcilable)."
 game_concept_religions: "정치 진영들"
 game_concept_religious_families: "정치 가문"
 game_concept_religious_family: "정치 가문"
 game_concept_religious_family_desc: "$game_concept_religious_family$는 [religions|E]들의 집단이다. $game_concept_religious_family$은 다양한 정치 진영과 그 안의 [faiths|E]들이 서로를 어떻게 바라보는지에 영향을 준다. \n\n [GetReligionFamily('rf_abrahamic').GetName] 가족은 모든 #weak(다른 아브라함계 교도 포함)에 대한 [holy_wars|E]을 용인한다#!. 정치 진영은 [heresy|E]에 취약하다. \n\n [GetReligionFamily('rf_eastern').GetName] 가문은 다른 정치 가문에 대한 성전만을 용인합니다.\n\n [GetReligionFamily('rf_pagan').GetName] 가문은 모두에 대한 성전을 용인하지만, 정치 진영 내 이념은 이를 접근하기 위해 개혁되어야 합니다."
 game_concept_religious_head_succession_law: "운동 지도자 승계법"
 game_concept_religious_head_succession_law_desc: "[rulers|E]는 또한 [heads_of_faith|E]이며 추가로 [succession|E] 법이 있어서, 그들의 [heir|E]는 그들과 같은 [faith|E]여야 합니다. 이것은 절대 변경될 수 없으며, $game_concept_head_of_faith$ [titles|E]는 별도의 [title_succession|E]를 가질 수 없습니다. 이러한 유형의 당 법을 제거할 수 있는 유일한 방법은 외부 세력이 [head_of_faith|E] $game_concept_title$를 파괴하는 것입니다."
 game_concept_religious_head_succession_law_short: "운동 지도자 법"
 game_concept_religious_head_succession_laws: "운동 지도자 승계법"
 game_concept_religious_head_succession_laws_short: "운동 지도자 법률"
 game_concept_religious_superior_desc: "종교적 상급자는 위계적 종교 구조에서 하나 이상의 [subordinate|E] 종교 당직자에 대한 종교적 관할권을 가진 [character|E]입니다."
 game_concept_retinue_maa: "수행원 활동가"
 game_concept_retract_desc: "[limited_crown_authority|E] [rulers|E]이상에서는 백벤처의 [vassal|E]을 $game_concept_retract$할 수 있지만, 후자가 [imprisoned|E]하지 않는 한 위험합니다. 백벤처는 거부하거나 반란을 일으킬 수 있기 때문입니다. \n\nB백벤처 철회는 대상이 꽤 심각한 [crime|E]을 저지르지 않는 한 [tyrannical|E] 간주됩니다."
 game_concept_revoke_desc: "[limited_crown_authority|E] 이상에서는 [rulers|E] [vassals|E]의 [titles|E]을 $game_concept_revoke$할 수 있지만, 백벤처가 [imprisoned|E]하지 않는 한 이는 위험한 제안입니다. 백벤처는 거부하거나 반란을 일으킬 수 있습니다. \n\nitle Walkocation은 백벤처가 꽤 심각한 [crime|E]을 저지르지 않는 한 [tyrannical|E] 간주됩니다."
 game_concept_rightful_liege: "정당의 정당한 지도자"
 game_concept_rightful_liege_desc_part2: "#weak 예시: $c_dunbar$ 백작은 $k_england$ 국왕의 직속 후원자입니다. 국왕은 $d_lothian$ 공작, $k_scotland$ 국왕, 또는 $e_britannia$ 황제가 아니므로 $c_dunbar$ 백작은 세금과 지원병을 소량만 제공합니다.\n\n $c_norfolk$ 백작 역시 $k_england$ 국왕의 직속 후원자입니다. 국왕이 $d_norfolk$ 지역을 가지고 있지 않으므로, 백작도 세금과 지원 병력이 줄어듭니다. 그러나 $k_england$가 $c_norfolk$의 명목상 국가이므로, $c_norfolk$ 백작은 $c_dunbar$ 백작보다 국왕에게 훨씬 더 많은 세금과 지원병을 제공합니다.#!"
 game_concept_rite: "이념"
 game_concept_rite_desc: "웨스트민스터에서 모든 [faith|E]에는 동일한 이름을 가진 단일 $game_concept_rite$이 있습니다: 그것은 이데올로기 자체이며, [core_tenets|E]와 [doctrines|E]를 포함합니다. 이들은 고정되어 있습니다: 정치인들은 마음을 바꿀 수 있지만, 이데올로기는 바꾸지 않습니다."
 game_concept_rite_divergence_desc: "분파도는 [rite_possessive|E] [core_tenets|E]와 [doctrines|E]가 모체 [faith|E]로부터 얼마나 멀리 떨어졌는지 측정합니다. [prohibited_tenet_status|E] 원인을 [core_tenet_status|E]로 채택한 이데올로기는 더 높은 분파도를 가집니다.\n\n높은 분파도는 모체 이데올로기의 [fervor|E]를 약화시키며, [heresy|E]의 발병이 더 흔해집니다. 분파도가 #V 100#!에 도달하면, 자동으로 분리 선언되어 새로운 [faith|E]가 됩니다."
 game_concept_rite_knowledge: "이념 지식"
 game_concept_rite_possessive: "이념의"
 game_concept_rites: "이념"
 game_concept_rites_possessive: "이념의"
 game_concept_royal_court: "비서실"
 game_concept_royal_court_desc: "저명한 [rulers|E]는 사무실을 유지할 만큼의 명성을 가지고 있으며, 이를 통해 다양한 보너스와 기회에 접근할 수 있습니다.\n\n[GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] 또는 [GetGovernment( 'tribal_government' ).GetName]가 [ruler|E]가 [king|E] 또는 [emperor|E]가 되면, 그들은 자신의 사무실에 접근할 수 있습니다.\n\n각 사무실에는 [court_grandeur_level|E]가 있으며, 이는 사무실의 명성 및 [court_type|E]에 따라 혜택을 제공합니다.\n\n청원자, [vassals|E] 및 [courtiers|E]가 사무실에 등장할 수 있으며, 또는 [hold_court|E]하여 [realm|E]의 누구든지 불만을 제기하도록 초대할 수 있습니다.\n\n사무실은 또한 통치자가 [court_artifacts|E]를 표시하도록 허용하며, [inspired|E] [guests|E]는 사무실에 나타나 새로운 [artifacts|E]를 만들기를 제안할 수 있습니다.\n\n당신이 사망하면, 당신의 [player_heir|E]가 사무실을 상속받습니다."
 game_concept_royal_courts: "비서실들"
 game_concept_sanctified_desc: "[artifact|E]를 신성하게 만들면 [faith|E]를 위한 [holy_relic|E]가 됩니다. 유물은 여러 이념을 위해 신성하게 만들 수 있습니다."
 game_concept_scales_of_power_desc: "[power_sharing|E] 동안, [liege|E]와 그들의 [diarch|E] 사이의 권력 균형은 $game_concept_scales_of_power$.\n\n에서 측정됩니다. $game_concept_scales_of_power_scales$이 $game_concept_diarch$ 쪽으로 기울면, [diarch_powers|E]이 풀리며 당 지도자의 [diarch_affected_actions|E]에 비용을 추가할 수 있습니다.\n\n 그들이 $game_concept_liege$ 쪽으로 기울면, 대신 당 지도자가 [diarchy|E]를 끝내기 쉽게 만듭니다.\n\n $game_concept_scales_of_power_scales$는 다음으로 조종될 수 있습니다: \n$EFFECT_LIST_BULLET$ 반대당에 대한 $swing_scales_currency_interaction$ [character_interaction|E] 사용 \n$EFFECT_LIST_BULLET$ $game_concept_diarch$으로, [mandate|E] 행사에서 당신의 $game_concept_liege$을 잘 (아무리 냉소적으로라도) 봉사함"
 game_concept_seasonal_prediction_desc: "숙련된 $court_position_court_astrologer$는 지역에서 다음 [steppe_season|E]를 예측할 수 있어, 당 지도자가 다음 움직임을 계획하는 데 유용한 정보를 제공합니다."
 game_concept_seize_peripheral_duchy: "주변 지역 점령"
 game_concept_settlement_issue_desc: "정착 문제(Settlement Issues)는 새로운 영토로 [migration|E]을 마친 후 [nomad|E] [ruler|E]에게 부여되는 임무입니다. 이들은 분쟁을 처리하고 새로운 [domain|E]에서 지역 [county_control|E]을 높일 기회를 제공합니다. \n\n 이러한 문제들은 통치자가 이주한 후 선거구가 낮은 선거구 통제권을 가진 첫 몇 년간 계속 발생합니다."
 game_concept_short_reign_desc: "'단기 통치'는 새로운 [liege|E]와 [realm|E] 내 모든 캐릭터에게 감소하는 [opinion|E] 페널티를 줍니다.\n\n 유사하게, 신하들은 장기간 통치해온 당 지도자에게 증가하는 [long_reign|E] 의견 보너스를 받습니다."
 game_concept_shunned_desc: "많은 [rites|E]에는 특정 행동을 배척된 것으로 지정하는 [doctrines|E]이 있습니다. 특정 정책 입장에 따라 이러한 행동은 [criminal|E]로 간주될 수도 있습니다.\n\n이데올로기에 의해 배척되는 행동을 하는 것이 적발된 캐릭터는 [piety_level|E]을 잃고 해당하는 [fame_trait|E]을 얻습니다. 이 특성은 그 행동을 배척되었거나 범죄로 간주하는 모든 사람에게 싫어지게 됩니다.\n\n배척된 행동의 예는 다음과 같습니다:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "모든 [rite|E] 특정 [traits|E]을 죄악으로 간주합니다. 이러한 특성을 가진 캐릭터는 같은 이념을 공유하지 않더라도 그 특성을 죄악으로 여기는 모든 캐릭터로부터 [opinion|E] 페널티를 받습니다. 또한, 자신의 이념이 죄악으로 간주하는 특성을 가진 캐릭터는 매달 [piety|E] 손실됩니다. \n\n죄로 간주되는 특성은 이념마다 다르지만, 일반적으로 해당 이데올로기의 [core_tenets|E]과 그 이데올로기가 속한 [religion|E]의 조합으로 결정됩니다."
 game_concept_spiritual_fulfillment: "개인 신념"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ [character|E]가 자신의 정치에 얼마나 편안함을 느끼느냐에 달려 있다. 그것은 그들의 [traits|E]과 행동에 따라 오르내린다."
 game_concept_spiritual_fulfillment_level: "확신 수준"
 game_concept_spiritual_fulfillment_level_desc: "[character_possessive|E] [spiritual_fulfillment|E]는 $game_concept_spiritual_fulfillment_levels$로 나뉘며, 각 구역에는 자체적인 효과가 있습니다."
 game_concept_spiritual_fulfillment_levels: "확신 수준들"
 game_concept_spiritual_head_of_faith: "영적 운동 지도자"
 game_concept_spymaster: "수석 휘프"
 game_concept_spymaster_desc: "$game_concept_spymaster$은 파티를 통제하고 모두의 비밀을 아는 [councillor|E]입니다. 불충한 수석 휘프를 조심하세요: 그들은 쉽게 숨기거나 당신에 대한 음모에 가담할 수 있습니다."
 game_concept_state_rite: "국가 이념"
 game_concept_state_rite_desc: "$game_concept_state_rite$는 [administrative_government|E]가 지원하고 용인하는 [rite|E]입니다. 이 이데올로기는 특정 [character|E]가 아닌 [title|E]와 연결되어 있습니다. [realm|E] 내의 캐릭터를 국가 이데올로기로 전환하는 것은 비교적 쉽지만, 이를 바꾸는 것은 매우 어렵습니다.\n\n국가 이데올로기는 행정당의 [ruler|E]만 변경할 수 있지만, [governors|E]는 자유롭게 전환할 수 있습니다."
 game_concept_stationed_regiment_desc: "[men_at_arms|E] [regiment|E]는 [holding|E]에 배치될 때 효율성에 대한 보너스를 받습니다.\n\n[buildings|E]는 이 보너스를 더 증가시킬 수 있으며 — 때때로 모든 유형의 활동가에게 적용되기도 하지만 대부분은 한두 유형에 적용됩니다. 예를 들어, [GetBuilding('stables_01').GetName]는 배치된 [light_cavalry|E]와 [heavy_cavalry|E]에 보너스를 제공합니다.\n\n[war|E]기간 동안이나 소유지가 [occupied|E]인 경우를 제외하고 언제든지 배치할 수 있습니다. 소유지를 잃으면 배치된 활동가는 배치 해제됩니다."
 game_concept_steward: "재무장관"
 game_concept_steward_desc: "$game_concept_steward$은 경제 및 [domain|E]: [taxation|E], 지출 및 [development|E]를 담당하는 [councillor|E]입니다."
 game_concept_stewards: "재무장관들"
 game_concept_stewardship: "경제"
 game_concept_stewardship_lifestyle: "경제 라이프스타일"
 game_concept_stewardship_skill: "경제 기술"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$는 예산, 경제 및 운영을 담당하는 [skill|E]입니다. 이는 [taxation|E]를 직접 증가시키므로 모든 지도자가 원합니다. \n\n 해당 [lifestyle|E]는 [stewardship_lifestyle|E]입니다."
 game_concept_stewardship_task_contract: "경제 계약"
 game_concept_stewardship_task_contract_possessive: "경제 계약의"
 game_concept_stewardship_task_contracts: "경제 계약들"
 game_concept_stewardship_task_contracts_possessive: "경제 계약들의"
 game_concept_story_content_el_cid_desc: "#tooltip_heading 스토리 스타일: 라이트#!\n\n엘 시드로서, 당신은 파티 리더에 의해 부당하게 내쫓길 것입니다. 유배 중에 당신은 충성을 유지할지, 혹은 자신의 길을 찾을지를 선택할 수 있으며, 결국 법정으로 돌아가 #EMP 또는 #! 최종 보상 — 발렌시아에 도달하게 됩니다.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading 스토리 스타일: 보통#!\n\n하산으로서, 당신은 종교적인 광신으로 인도받아 진정한 이념의 빛을 전할 장소를 선택하고, [counties|E] 그들의 [rulers|E] 아래에서 개종시키게 됩니다.\n\n결국, 당신의 이야기는 선택한 적에 대한 대규모 종교적 봉기로 절정에 달할 것입니다.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading 스토리 스타일: 라이트#!\n\n테무진으로서, 당신은 배우자를 감금한 적대 부족에게 복수하며, 가장 가까운 동료이자 친구인 자무카의 충성을 시험하게 됩니다.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "압력"
 game_concept_stress_desc: "캐릭터는 자신의 [personality_traits|E]에 반하는 행동을 할 때 $game_concept_stress$에 속하게 됩니다: 채찍 투표에 반대한 충성스러운 백벤처, 나쁜 정책을 변호하게 된 정직한 장관.\n\n 충분한 압박을 받은 캐릭터는 [stress_level|E]을 얻게 되며, 이는 다시 줄일 때까지 건강에 영향을 미칩니다.\n\n 웨스트민스터와 [activities|E]에서 떨어져 있는 시간이 이를 완화합니다."
 game_concept_stress_level: "압력 수준"
 game_concept_stress_level_desc: "캐릭터가 100 [stress|E] 쌓을 때마다 압력 레벨이 올라갑니다. 압력 레벨은 0에서 3까지 다양하며, 레벨이 올라갈수록 캐릭터의 [fertility|E]과 [health|E]에 점점 더 큰 페널티가 적용됩니다. \n\n추가로, 캐릭터가 최소 1 이상의 압력 레벨을 가진 한 [mental_breaks|E]에 취약합니다."
 game_concept_stress_levels: "압력 수준들"
 game_concept_stress_loss: "압력 손실"
 game_concept_stressed: "압박 속에서"
 game_concept_strong_vassal: "강한 백벤처"
 game_concept_strong_vassal_desc: "$game_concept_strong_vassal$은 자신의 [liege|E]에 접근하거나 이를 초과하는 힘을 가진 [vassal|E]로, [opinion|E] 패널티를 받습니다. #weak 그들은 파티 리더를 약하고 파티를 이끌기에 적합하지 않다고 봅니다.#!"
 game_concept_strong_vassals: "강력한 백벤처"
 game_concept_struggle_involved_faith: "관련 이데올로기"
 game_concept_struggle_involved_faiths: "관련 이데올로기"
 game_concept_struggle_persia_phase_unrest_desc: "칼리프국은 붕괴한다. 야심 찬 군벌과 교활한 총독들은 자신들이 찬탈할 수 있는 모든 권력을 붙잡으며 끊임없이 다투고 있다. \n\n언제든, [ending_phase|E]로 상황이 해결되지 않는 한, 당은 절박한 지지자들이 칼리프 권위를 되찾는 [struggle_persia_phase_stabilisation|E] 단계에 들어설 것이다."
 game_concept_struggle_phase_desc: "$game_concept_struggle_phase_phase$는 [struggle_involved|E], [characters|E], [counties|E]가 [struggle_region|E] 내에서 흔히 경험하는 일반적인 분위기입니다. 이것은 [struggle|E]의 대화를 일시적으로 지배하는 단기적인 사회적 경향과 풍속을 나타냅니다.\n\n#weak 예: 한 $game_concept_struggle_phase_phase$에서 $game_concept_struggle_region_region$의 사람들은 나머지 이념과 다르더라도 종교적 관용이 가장 중요하다고 생각할 수 있습니다.#!"
 game_concept_supply_limit_desc: "$game_concept_supply_limit$은 워드의 [terrain|E]과 [development|E]에 따라 한 [barony|E] 동안 가질 수 있는 [soldiers|E]의 양을 결정합니다. \n\n당신의 총 [army|E] 크기가 $game_concept_supply_limit$을 넘으면 $game_concept_armies$ [supply|E] 감소하고 결국 [attrition|E] 피해를 입게 됩니다."
 game_concept_temporal_head_of_faith: "시간 이동 지도자"
 game_concept_tenet: "원인"
 game_concept_tenet_desc: "[doctrines|E] [rite|E]가 입장을 취해야 하는 문제를 나타내지만, $game_concept_tenets$ 이데올로기의 독특한 특성과 관행을 대표합니다."
 game_concept_tenet_knowledge: "정책 지식"
 game_concept_tenet_knowledge_desc: "정치인은 다른 모든 이념이 어떻게 생각하는지 세부적으로 알지 못합니다.\n\n어떤 $game_concept_rite$의 모든 $game_concept_core_tenets$와 $game_concept_doctrines$를 아는 것은 그 이념으로 마음을 바꾸는 것을 쉽게 만듭니다.\n\n자신의 [faith|E]에 대한 모든 [core_tenets|E]와 [doctrines|E]는 이미 알고 있습니다. [spouses|E], [friends|E] 및 [activities|E]에서 더 많은 것을 배울 수 있습니다."
 game_concept_tenet_popularity: "인기 원인"
 game_concept_tenet_popularity_desc: "[faith|E] 내에서 [personal_tenets|E] 퍼질수록 그 관행이 더 흔해집니다. $game_concept_tenet_popularity$ [core_tenet|E]의 널리 퍼져 있는지를 추적하며, [ecumenical_council|E]에서 토론 주제로 선택되거나 [papal_bull|E]의 대상이 될 가능성에 영향을 미칩니다. \n\n $game_concept_tenet_popularity$가 높을수록 [clergy|E] [ecumenical_council|E] 토론 시 더 많은 주장을 지지합니다. 일단 사의가 #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$에 도달하면, [head_of_faith|E]은 자신의 신념과 상관없이 대부분 [permitted_tenet_status|E] 선언할 것입니다."
 game_concept_tenet_status: "상태 원인"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ [core_tenet|E] 또는 [doctrine|E]에 대한 [rite_possessive|E] 입장입니다. 가능한 입장은 다섯 가지가 있습니다: \n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — $game_concept_rite$은 이 $game_concept_core_tenet$이나 $game_concept_doctrine$에 대해 들어본 적이 없습니다. \n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — $game_concept_rite$은 이를 인지하고 있으며 그 관행에 대해 판결하지 않았습니다. \n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — $game_concept_rite$이 관행을 승인합니다. \n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — $game_concept_rite$이 그 관행을 금지합니다. \n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — $game_concept_rite$이 $game_concept_core_tenet$을 허용하고 적극적으로 장려합니다. \n\n 이데올로기의 입장은 $game_concept_rite$을 작성하거나 분기시킬 때 $game_concept_core_tenet$나 $game_concept_doctrine$를 선택할 수 있는지, 그리고 어떤 실천이 영적 벌을 [followers|E] 치르는지를 결정합니다. \n\n카우즈 상태는 [character_possessive|E] [tenet_knowledge|E]와 구별되며, 은 개인적 인식이지 전체 $game_concept_rite$의 입장을 의미하지 않습니다."
 game_concept_tenets: "원인들"
 game_concept_the_christian_church_desc: "기독교 교회는 예수 그리스도의 추종자들을 감독하고 안내하는 교회 기관으로 [situation|E]로 표현되며, [the_christian_church_chapters_short|E]의 순서를 따라 발전합니다.\n\n 그 경계는 세계의 모든 [archdiocese|E]를 포함합니다; 모든 [christian|E] [ruler|E] [county|E] 이상의 지위를 가진 [realm|E]의 일부가 대교구 안에 있다면 그들은 정당 관계자이든 세속인이든 회원입니다."
 game_concept_theocratic_vassal: "신정당 의원"
 game_concept_theocratic_vassal_desc: "[theocratic_government|E] 형태를 가진 백벤처들.\n\n그들의 기능은 [faithpossessive|E] [doctrines|E]에 의해 결정됨."
 game_concept_theocratic_vassals: "신정당 의원들"
 game_concept_title_allegiance_desc: "[vassals|E]는 그들의 [liege|E] 개인이 아닌 특정 [title|E]에 충성을 다할 수 있습니다. 이는 해당 칭호가 자체 [succession_law|E]를 가진 경우에만 가능합니다. [succession|E]에는, 이러한 후배들은 새로운 칭호 [holder|E]의 후배가 됩니다."
 game_concept_title_desc: "$game_concept_title$은 본질적으로 토지 소유권 증명서입니다. \n\n 지도에서 가장 작은 토지 단위는 [barony|E]입니다. 구역(Ward)은 [counties|E]라고 불리는 더 큰 지역으로 구성됩니다. 선거구 constituency [de_jure|E]는 [duchy|E]에 속하고, 지역(region)은 [kingdom|E]에, 국가는 [empire|E]에 속합니다. \n\n 지역, 국가 및 제국은 항상 [holder|E]을 가지는 것은 아니지만, 해당 영토를 충분히 통제하는 통치자가 [created|E]할 수 있는 칭호입니다."
 game_concept_title_men_at_arms: "타이틀 운동가"
 game_concept_top_liege: "총리"
 game_concept_top_liege_possessive: "총리의"
 game_concept_top_lieges: "총리들"
 game_concept_top_realm: "최상위 정당"
 game_concept_torture_desc: "[imprisoned|E] 캐릭터는 $game_concept_tortured$ 수 있으며, [health|E]에 피해를 입거나 심지어 다양한 방식으로 불구를 입힐 수 있습니다. \n\norture는 [GetTrait('callous').GetName( GetNullCharacter )] 캐릭터와 [GetTrait('sadistic').GetName( GetNullCharacter )] 캐릭터의 [stress|E]을 덜어주지만, 친절한 캐릭터에게는 압박을 줍니다. \n\n의 [rulers|E] [dread|E]도 증가시킬 수 있습니다."
 game_concept_tour_stop_desc: "[activity_phase|E] [royal_tour|E] 동안 파티 리더가 [hosted_dinner|E]에 참석하거나, 자신의 [vassal|E] [tour_the_grounds|E], 혹은 [cultural_festival|E]을 즐길 수 있습니다."
 game_concept_transfer_desc: "[rulers|E]는 이전 사람이 후자의 직급보다 낮은 한, 그들의 [vassals|E] 중 하나를 다른 후방 의원에게 $game_concept_transfer$할 수 있습니다. 이는 특히 전근된 후방 의원이 [de_jure|E] 그들의 [realm|E]의 일부일 경우 후방 의원의 [opinion|E]를 올리는 좋은 방법입니다."
 game_concept_treasury_vassal_development: "백벤처 개발"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ [tribal|E] [ruler|E]이 자신의 [vassals|E]에 행사하는 일반적인 영향력을 나타냅니다. [crown_authority|E]에 비해 권한이 적고 높은 레벨에서 제공합니다. \n\n $game_concept_tribal_authority$은 네 단계로 나뉩니다: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E], [absolute_tribal|E]. $game_concept_tribal_authority$ 증가는 레벨과 통치자의 [learning_skill|E]에 따라 [prestige|E]가 들지만, 일반적으로 왕실 권위를 높이는 것보다 더 비용이 듭니다. \n\n#weak 백벤처 의원들은 높은 수준의 $game_concept_tribal_authority$을 싫어하며, 이를 낮추는 것이 어떤 [liberty_faction|E]의 주요 목표이기도 합니다. #!"
 game_concept_tribal_desc: "부족 정당은 [development|E]에서 제한된 구성원을 가지고 있으며, 부족 시대 [innovations|E]를 지날 수 없고, 새로운 [holdings|E]를 건설할 수 없으며, 일반적으로 [succession_law|E].\n\n을 변경할 수 없다. 그러나 그들은 [gold|E] 대신 [prestige|E]을 사용하여 당을 구성하고 [men_at_arms|E]를 고용할 수 있으며, [feudal|E] 정당과 비교해 더 많은 [casus_belli|E]에 접근할 수 있다. 비 부족 군대는 적대적인 부족 지역에서 [supply_limit|E] 패널티를 받는다."
 game_concept_unassigned_vassal: "면세 하원의원"
 game_concept_unassigned_vassals: "면세 하원의원"
 game_concept_undirected_great_holy_war_desc: "$game_concept_undirected_great_holy_war$는 $doctrine_spiritual_head_name$ [head_of_faith|E]가 그 [faith|E]의 지배 하에 [kingdom|E]를 두려는 의도로 선언합니다.\n\n$game_concept_undirected_great_holy_wars$는 바로 시작되지 않고, 대신 [preparation_phase|E] 상태가 됩니다.\n\n전쟁 전과 도중에, 공격 이데올로기의 군주는 [war_chest|E]에 [gold|E]를 기부하도록 선택할 수 있습니다.\n\n승리하면, 대상 국가는 공격 이데올로기의 캐릭터에게 넘어갑니다. 공격자의 보상에는 [piety|E]와 잠재적으로 그들의 [dynasty|E]가 정복된 국가 내에서 [landed|E]가 되는 것이 포함됩니다."
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] 그들의 이념에 [battle|E] [advantage|E] [counties|E] 있어."
 game_concept_usurp_title_desc: "외국 [ruler|E]가 보유한 [title|E]은 보통 #V [de_jure|E] [counties|E]의 50% 이상이 [realm|E] 내에 있을 경우 #! 찬탈될 수 있습니다. 이 과정은 당신에게 [title|E]을 주며, 이는 당신이 [vassals|E]의 [rightful_liege|E]임을 보장하는 데 특히 중요합니다. \n\n 현재 보유자의 [faith|E]가 적대적일 경우 상륙이 더 어렵습니다; 이 경우 찬탈은 보유자가 더 이상 당 내에서 [de_jure|E] [counties|E]을 소유하지 않을 때만 가능하다."
 game_concept_varangian_adventure_desc: "이것은 [war|E]의 특별한 유형으로, 공격자가 자신의 [realm|E]를 [war_target|E]로 대규모 이동시키려는 경우입니다.\n\n승리하면, 적절한 [counties|E]를 즉시 합병하고 자신의 [capital|E]를 그곳으로 이동시킵니다. 기존 후방 지지자들은 독립하고, 기존 $game_concept_counties$는 신흥 지역 군벌에게 넘겨집니다. $game_concept_varangian_adventures$는 #EMP ONLY#!로서 [duke|E] 및 $game_concept_count$-[title_tier|E] [rulers|E]에서만 이용 가능하며, 성공적인 $game_concept_varangian_adventure_adventure$마다 점점 더 비용이 증가합니다.\n\n이 [casus_belli|E]는 #EMP NEVER#!로 $culture_era_tribal$ [era|E] 이후에는 이용할 수 없으며, 다른 [cultures|E]에 대해 $game_concept_varangian_adventure_adventure$할 수 없고, 인접한 $game_concept_rulers$에 대해서도 사용할 수 없습니다.\n\n$north_germanic_group_collective_noun$ 첫 번째 $game_concept_varangian_adventure$를 시작하는 경우 최대 [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] 보너스 [special_troops|E]를 받고, [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName] 내에서 완전히 통제되는 동일 [faith|E] 동일 [culture|E] 선거구마다 그 양이 증가합니다."
 game_concept_vassal: "백벤처"
 game_concept_vassal_contract: "백벤처 계약"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ [vassal|E]와 [liege|E] 사이의 [obligations|E]을 결정합니다. \n\n [feudal|E], [clan|E], [administrative|E], [nomadic|E] $game_concept_government_forms$의 백벤처들은 각 백벤처별로 개별적으로 협상된 서로 다른 [obligations|E]에 접근할 수 있습니다. \n\n모든 백벤처는 [obligations|E]에 따라 총 [taxes|E]과 [levies|E]의 일정 비율을 당 대표에게 지불합니다. #EMP 이러한 [modifier_contributions|E]은 [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )]과 같은 '세밀한 글씨' 옵션으로 수정될 수 있습니다. #!\n\n 일부 특별 계약은 특정 등급으로 제한됩니다: \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] 및 [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] 이상 \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] 이상 \n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: [count|E] 전부만 \n\n#weak 참고, [governor|E] [obligations|E] [province_administrations|E]로도 알려져 있습니다. #!"
 game_concept_vassal_contracts: "백벤처 계약들"
 game_concept_vassal_desc: "$game_concept_vassal$는 다른 사람에게 보고하는 정치인을 말합니다: [liege|E]의 국회의원, 총리의 당 대표입니다. \n\n백벤치원들은 당 대표에게 [levies|E]과 [taxes|E] — 즉 [obligations|E]을 — 대신 채찍과 지지를 받습니다. \n\n $game_concept_vassal$의 당 대표 [opinion|E]이 낮으면 [factions|E]에 합류하거나 대체[scheme|E] 할 수 있습니다."
 game_concept_vassal_directive: "백벤처 지침"
 game_concept_vassal_directive_desc: "[liege|E]로서 [vassals|E]에게 지시를 발행할 수 있으며, 이는 그들의 [councillor_tasks|E]과 어떤 [buildings|E]을 구성하는지에 영향을 미칩니다. \n\n 지시를 발행하려면 백벤처와 함께 50#! 이상의 [opinion|E] #P 있어야 활성화해야 합니다. 고급 [government_forms|E]은 이를 요구하지 않습니다."
 game_concept_vassal_directives: "백벤처 지침들"
 game_concept_vassal_limit: "백벤처 한도"
 game_concept_vassal_limit_desc: "$game_concept_vassal_limit$은 법적으로 가질 수 있는 [direct_vassals|E] 수를 결정합니다([barony|E]등급 백벤처 제외). \n\nKEEP $game_concept_vassal_limit$보다 높은 임원을 낼 수 있지만, 그렇게 하면 백벤처들이 제공하는 [taxes|E]과 [levies|E] [transferring|E] 내려가며, 한도 이하로 유지하려면 일부 백벤처를 하는 것이 더 나을 수도 있습니다."
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ [subject|E]가 [suzerain|E]에 제공하는 [tax|E]량과 [levies|E]수를 정의합니다. 주체의 [government_form|E]은 그들의 $game_concept_obligations$가 어떻게 수정되는지를 결정합니다. \n\n#weak 예를 들어, [GetGovernment('feudal_government').GetName]와 [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$은 [vassal_contract|E]에 따라 다르고, 백벤처는 [province_administration|E]에 따라 달라[GetGovernment('administrative_government').GetName] 반면, [tributary_possessive|E]은 [tributary_contract|E]에 따라 달라집니다."
 game_concept_vassal_possessive: "백벤처의"
 game_concept_vassal_stance: "백벤처 입장"
 game_concept_vassal_stance_desc: "모든 [vassal|E]은 백벤처 입장을 가지고 있는데, 이는 당신과 [liege|E] [opinion|E]에 영향을 미치고, [realm|E]의 후계자로서 어떤 [heir|E]을 선호합니다. \n\n같은 입장을 가진 백벤처들은 같은 것을 좋아하거나 싫어합니다. 예를 들어; 모든 백벤처[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] 당신이 [wars|E]를 잃는 것을 싫어합니다. \n\nE매우 백벤처 입장은 특정 후계자를 선호합니다. 승계 시 각 선호 후계자는 해당 입장의 백벤처들과 낮은 지[legitimacy_expectations|E]을 갖게 됩니다. \n\n#low 백벤처 입장은 다음과 같습니다#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "백벤처 입장들"
 game_concept_vassal_taxes: "백벤처 세금"
 game_concept_vassal_taxes_desc: "당신의 $game_concept_vassal_taxes$는 [vassals|E]로부터 받는 [taxes|E]로 구성됩니다. 금액은 각 백벤처의 [obligations|E]에 따라 달라집니다.\n\n백벤처의 관점에서 이 세금은 자신의 $game_concept_vassals$로부터 징수하는 $game_concept_vassal_taxes$와 구별하기 위해 [liege_taxes|E]라고 불립니다."
 game_concept_vassals: "백벤처들"
 game_concept_vassals_possessive: "백벤처들의"
 game_concept_victory_desc: "$game_concept_victory$는 세 가지 가능한 [peace_offers|E] 중 하나입니다. [war|E]에서 승리의 정확한 결과는 [casus_belli|E]에 따라 달라집니다.\n\n공격자의 경우, 일반적으로 [war_target|E] 지역 내의 [titles|E]를 점령하는 것을 포함합니다.\n\n방어자의 경우, 승리는 일반적으로 공격자가 전쟁 배상금으로 큰 금액을 지불해야 함을 의미합니다."
 game_concept_virtue_desc: "모든 [rite|E]은 특정 [traits|E]을 덕망(Virtuous)으로 간주합니다. 이 특성들을 가진 캐릭터는 같은 이념을 공유하지 않더라도 그 특성을 덕망으로 여기는 모든 캐릭터로부터 [opinion|E] 보너스를 받습니다. 또한, 자신의 이념이 덕을 인정하는 특성을 가진 캐릭터는 매달 [piety|E] 보너스를 받습니다. \n\n어떤 특성이 덕목으로 간주되는지는 이념마다 다르지만, 일반적으로 해당 이념의 [core_tenets|E]과 그 이데올로기가 속한 [religion|E]의 조합으로 결정됩니다."
 game_concept_virtue_weight_desc: "특성은 [rite|E]의 [core_tenets|E]과 [doctrines|E], 그리고 그것이 속한 [religion|E]에 의해 결정되는 [sin|E] 또는 [virtue|E] 무게를 가질 수 있다. \n\n 이념 내에서 가장 높은 죄악 또는 덕 무게를 가진 특성은 그 이데올로기의 [sins|E]과 [virtues|E]가 된다."
 game_concept_wanderer_desc: "[court|E]에 속하지 않거나 [titles|e]을 보유하지 않은 캐릭터는 방랑자라고 부릅니다. 그들은 세계를 여행하며, 그 과정에서 사무실을 [guests|E]로 방문합니다. 방랑자는 [mercenary|E] 선장, [holy_orders|E]의 지도자, [clergy|E] 회원, 또는 [city|E] 보유자가 될 수 있습니다."
 game_concept_wanua_desc: "$wanua_government_adjective$ [government|E]는 [GetGovernment('tribal_government').GetNameWithIcon] [government|E]와 약점을 공유하지만, [domain_limit|E]와 [vassal_limit|E]는 줄어듭니다. [gold|E]를 사용하여 [buildings|E]를 건설하고 [men_at_arms|E]를 모집하지만, 건물에서 얻는 자금은 매우 적습니다.\n\n그러나 [barter_goods_i][barter|E], [raid|E]를 할 수 있으며 [GetGovernment('mandala_government').GetName] 정부와 시너지가 있으며 [tributary|E]가 됨으로써 [legitimacy|E]를 얻습니다."
 game_concept_war_chest_desc: "$game_concept_war_chest$는 [gold|E], [piety|E] 및 [prestige|E]의 집합입니다. 내용물은 주로 [undirected_great_holy_wars|E]에서 성공적으로 승리한 보상으로 사용되며, 공격자의 [war|E] 참여도에 따라 분배됩니다.\n\n$game_concept_war_chest$에 있는 일부는 전쟁이 선언될 때 공격자 사이에서도 분배됩니다.\n\n[undirected_great_holy_war|E]가 패배하면, 수비자는 $game_concept_war_chest$의 정치적 자본과 프로필 부분을 #weak 사이에서 나누게 됩니다(자금은 손실됩니다).#!"
 game_concept_winter_desc: "시간이 지남에 따라 [supply|E]을 꾸준히 소모시키며, 군대가 겨울의 영향을 받은 병동 안에 서 있을 때 보급을 잃게 만듭니다. 보급 패널티는 심각도가 심할수록 증가합니다. 겨울에는 세 가지 심각한 정도가 있습니다; [Concept( 'winter_severity_mild', 'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E], [Concept( 'winter_severity_harsh', 'Harsh' )|E]."
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$는 $game_concept_yurt$.\n\n의 독특한 개선 사항입니다. 기계적으로는 [domicile_buildings|E]이지만, 많은 것들은 문자 그대로의 구조보다는 $game_concept_nomad$ 부족의 사회적 관습이나 단순한 주요 관심 분야를 나타냅니다. \n\n 그들이 제공할 수 있는 보너스는 다음과 같습니다: \n$EFFECT_LIST_BULLET$ [court_positions|E]와 유목 [decisions|E] 및 [character_interaction|E] 잠금 해제 \n$EFFECT_LIST_BULLET$ [herd|E]와 [county_fertility|E]에 대한 다양한 보너스, [terrain|E] 전문화를 포함 \n$EFFECT_LIST_BULLET$ 유목 [men_at_arms|E] 잠금 해제 및 개선과 [horde|E]의 힘 향상 \n$EFFECT_LIST_BULLET$ 고유 유목 [culture_tradition|E] 보너스 \n$EFFECT_LIST_BULLET$ [vassals|E]와 [tributaries|E]을 관리하고 사무실에서 [characters|E]에 영향력을 행사하는 방법 \n$EFFECT_LIST_BULLET$ [kurultai|E]와 [obedience|E] 보너스."
 maximum_piety_level_mandala: "\n\n그러나 [mandala|E] [ruler|E]가 [aspect|E]에 합당한 방식으로 [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L]에 도달한 후 사망하면, 그 통치자의 [heir|E]는 [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]에 도달할 때까지 다음 정치 자본 단계로 진행할 수 있는 능력을 발전시킵니다."
