 camp_purpose_confirmation_button_text: "초점 변경"
 camp_purpose_explorers: "풀뿌리 조직가"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$더 많은 거리 모금, 전화 홍보 및 투표 독려 업무 제공\n$EFFECT_LIST_BULLET$집집 사이를 더 빠르게 이동\n$EFFECT_LIST_BULLET$[camp_buildings|E] 잠금 해제: \n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK 아직 두드리지 않은 문이 있는 거리마다 존재#!"
 camp_purpose_legitimists: "정당 문제 해결자"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$당의 내부 업무를 더 많이 제공함: 연설문 작성 및 조사\n$EFFECT_LIST_BULLET$모든 업무를 잘 수행하면 추가 당 점수 획득\n$EFFECT_LIST_BULLET$특정 [camp_buildings|E] 잠금 해제:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$특정 특별 [officers|E] 접근 가능:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak ($baggage_train_proof_of_claims_domicile_building$을 통해 잠금 해제)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak ($proving_grounds_lockwagon_domicile_building$을 통해 잠금 해제)#!\n\n#WEAK 투표 전에 누가 표를 세워야 하는지, 누가 누구에게 빚을 지고 있는지 알아야 함#!"
 camp_purpose_mercenaries: "선거 캠페인 컨설턴트"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$더 많은 모금, 전화 은행 및 비용 관련 업무 제공\n$EFFECT_LIST_BULLET$모든 작업을 잘 수행하면 추가 [gold|E]: 인보이스\n$EFFECT_LIST_BULLET$잠금 해제 [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$특정 특별 [officers|E]에 접근 가능:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak ($baggage_train_siege_engineers_domicile_building$를 통해 잠금 해제됨)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak ($proving_grounds_lockwagon_domicile_building$를 통해 잠금 해제됨)#!\n\n#WEAK 전략, 데이터 및 일일 요금. 결과는 보장되지 않음; 인보이스만 보장됨.#!"
 camp_purpose_pass_phrase: "[Law.GetNameNoTooltip]가 되세요"
 camp_purpose_scholars: "싱크탱크 전문가"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$정책 보고서, 연설문 작성 및 비용 산정 업무 더 제공\n$EFFECT_LIST_BULLET$모든 업무에서 더 빠르게 학습\n$EFFECT_LIST_BULLET$특정 [camp_buildings|E] 잠금 해제:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$특정 특별 [officers|E] 접근 가능:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak ($baggage_train_siege_engineers_domicile_building$을 통해 잠금 해제)#!\n\n#WEAK 모든 항목에 각주가 있으며, 대부분의 항목에는 차트가 있음#!"
 camp_purpose_wanderers: "정당 활동가"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$모든 종류의 업무 제공, 어느 것도 다른 것보다 많지 않음\n$EFFECT_LIST_BULLET$다른 $camp_purpose$로 변경 가능, [prestige|E]를 사용하지 않고도ZZ\n\n#WEAK 한 주머니에는 전단지가, 다른 주머니에는 회원 카드가 있고, 모든 것이 어디로 이어질지 아직 모름#!"
 chief_engineer_camp_officer: "디지털 디렉터"
 chief_engineer_camp_officer_desc: "$chief_engineer_camp_officer$는 현대 캠페인의 데이터, 광고 및 기계를 운영합니다."
 chief_forager_camp_officer: "기금 모금 책임자"
 chief_forager_camp_officer_desc: "$chief_forager_camp_officer$는 추첨, 저녁 식사, 상시 주문, 그리고 가끔씩 관대한 기부자를 찾아낸다."
 chief_forager_camp_officer_employer_custom_effect_description: "$BULLET$캠페인 기금 모금 지원 가능 [decisions|E]"
 domicile_temperament_high: "열정적인 팀"
 domicile_temperament_low: "사기가 떨어진 팀"
 domicile_temperament_neutral: "스테디 팀"
 elephantry_captain_camp_officer: "유명인 연락 담당"
 elephantry_captain_camp_officer_desc: "$elephantry_captain_camp_officer$은 유명한 후원자들과 그들의 일정, 자존심을 관리합니다."
 ep3_can_have_legitimists_camp_purpose_trigger.tt.explanation: "당신은 최소 40의 당 지위를 가져야 합니다."
 game_concept_adventurer: "캠페이너"
 game_concept_adventurer_camp: "캠페인 사무실"
 game_concept_adventurer_camps: "캠페인 사무실들"
 game_concept_adventurer_desc: "A $game_concept_adventurer$ is a politician without a seat: an activist, a candidate or a former MP, leading a [camp|E].

They have no constituency and no income of their own: they take [task_contracts|E] from their party's MPs to earn money, profile and Party Standing, and call in favours from their [contact_list|E].

A $game_concept_adventurer$ can move their office anywhere. The goal is a seat: get on the approved list, win a selection, then win the election."
 game_concept_adventurer_possessive: "캠페이너의"
 game_concept_adventurer_siege_replenishment_desc: "[adventurer|E]가 [holding|E]를 성공적으로 [sieges|E]하면, 그들의 [men_at_arms|E] 일부가 보충됩니다.\n\n모든 행동가의 [regiments|E]는 [army|E]에서 #V x2#! 배의 보유 [loot|E] 가치에 의해 보충됩니다.\n\n#weak 증가는 새로운 신병 모집, 현지인 강제 동원, 그리고 포위 동안 떠난 사람들에게 단순히 급여를 지급하는 것으로 이루어집니다.#!"
 game_concept_adventurers: "캠페이너들"
 game_concept_adventurers_possessive: "캠페이너들의"
 game_concept_camp: "캠페인 사무실"
 game_concept_camp_building: "사무실 시설"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$ are improvements to a [camp|E]: rooms, equipment, people and habits.

Mechanically, they are [domicile_buildings|E]. They can:
$EFFECT_LIST_BULLET$ Unlock new [officers|E]
$EFFECT_LIST_BULLET$ Give bonuses to the campaigner and the team
$EFFECT_LIST_BULLET$ Improve [task_contract|E] rewards"
 game_concept_camp_buildings: "사무실 시설"
 game_concept_camp_desc: "A $game_concept_camp$ is a campaigner's base: a rented room, a shopfront or a regional headquarters, its staff and volunteers, and the battle bus that takes it from town to town.

Every [GetGovernment( 'landless_adventurer_government' ).GetName] has a $game_concept_camp$ [domicile|E] that moves across the map with them.

[camp_buildings|E] can be added, which give the $game_concept_camp$ and its campaigner lasting bonuses."
 game_concept_camp_purpose: "정치 집중"
 game_concept_camp_purpose_desc: "A $game_concept_camp_purpose$ is what a campaigner is known for: the kind of politician they are becoming.

It decides which [task_contracts|E] their party offers them most, gives a bonus of its own, and unlocks some [camp_buildings|E]. A $game_concept_camp_purpose_purpose$ can be changed, but changing from one to another costs [prestige|E]; a Party Activist may pick any for free."
 game_concept_camp_purpose_purpose: "집중"
 game_concept_camp_purpose_purposes: "초점"
 game_concept_camp_purposes: "정치 집중들"
 game_concept_camp_temperament: "팀 사기"
 game_concept_camps: "캠페인 사무실들"
 game_concept_contract_scheme: "직업 계획"
 game_concept_contract_scheme_contract: "직업"
 game_concept_contract_scheme_possessive: "직업 계획"
 game_concept_contract_schemes: "직업 계획"
 game_concept_contract_schemes_possessive: "직업 제도"
 game_concept_contractor: "고용주"
 game_concept_contractor_desc: "$game_concept_contractor$은 [task_contract|E]를 제공하는 의원 또는 정당 지도자입니다. 그들은 비용을 지불하고, 그것이 얼마나 잘 이루어졌는지를 기억합니다."
 game_concept_contractor_possessive: "고용주의"
 game_concept_contractors: "고용주들"
 game_concept_contractors_possessive: "고용주들의"
 game_concept_domicile: "기지"
 game_concept_domicile_building: "기지 건물"
 game_concept_domicile_buildings: "기지 건물"
 game_concept_domiciles: "기지"
 game_concept_follower: "팀원"
 game_concept_follower_desc: "A $game_concept_follower$ is a volunteer or staffer who works for a [adventurer|E] without a seat.

Mechanically, they are like [courtiers|E], but they owe less and leave sooner if they dislike their boss.

The collective [opinion|E] of the $game_concept_followers$ sets the [camp_temperament|E]."
 game_concept_followers: "팀 멤버"
 game_concept_officer: "수석 직원"
 game_concept_officer_desc: "$game_concept_officers$ are the jobs [followers|E] can be given to run the [camp|E]: office manager, field director, treasurer and so on.

They work like [court_positions|E]: what they bring depends on the holder's [aptitude|E] for the job."
 game_concept_officers: "고위 직원"
 game_concept_provision: "선거 캠페인 기금"
 game_concept_provisions: "선거 캠페인 자금"
 game_concept_provisions_desc: "$game_concept_provisions$ are the office's running budget: rent, fuel, print and food for the volunteers.

A [camp|E] spends $game_concept_provisions$ while it moves to a new [location|E]; how much depends on the size of the team, the distance and the [officers|E] it has.

Running out means unpaid bills and an unhappy team. Jobs done well, and some [camp_buildings|E], bring more in."
 game_concept_task_contract: "직업"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ are work a [adventurer|E] does for the party's MPs: canvassing, fundraising, speechwriting, research, phone banks, policy papers and media rounds.

Each takes three weeks and is settled by a skill check. Doing it well earns [gold|E], [prestige|E], [provisions|E], Party Standing and the MP as a contact; doing it badly costs a little standing.

The party's candidate assessment is a $game_concept_task_contract$ too: pass it to join the approved candidates list."
 game_concept_task_contract_possessive: "잡의"
 game_concept_task_contract_tier: "직무 등급"
 game_concept_task_contracts: "직업"
 game_concept_task_contracts_possessive: "잡스'"
 head_groom_camp_officer: "교통 관리자"
 head_groom_camp_officer_desc: "$head_groom_camp_officer$은 미니버스, 연료 카드 및 주차 벌금을 관리합니다."
 head_porter_camp_officer: "물류 코디네이터"
 head_porter_camp_officer_desc: "$head_porter_camp_officer$는 사무실, 상자, 사람들을 무사히 다음 마을로 데려간다."
 heavy_cavalry_captain_camp_officer: "전투 버스 선장"
 heavy_cavalry_captain_camp_officer_desc: "$heavy_cavalry_captain_camp_officer$은 버스 투어를 운영합니다: 큰 방문, 큰 인파, 큰 사진."
 heavy_infantry_captain_camp_officer: "도어스텝 팀 리더"
 heavy_infantry_captain_camp_officer_desc: "$heavy_infantry_captain_camp_officer$은 큰 토요일 유세 활동을 이끕니다."
 horse_archer_captain_camp_officer: "전단지 배포 선두"
 horse_archer_captain_camp_officer_desc: "$horse_archer_captain_camp_officer$은 빠른 배달 라운드를 거리별로 조직합니다."
 huntperson_camp_officer: "홍보 조직자"
 huntperson_camp_officer_desc: "$huntperson_camp_officer$은 외출 일정을 계획합니다: 거리 부스, 지역 행사, 방문."
 huntperson_camp_officer_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] [aptitude|E]\n$BULLET$ 모든 [martial|E] [education|E] 결과를 향상시킵니다 [children|E] [camp|E]\n$BULLET$전선 기금 모금에 도움을 줄 수 있음 [decisions|E]"
 kennelperson_camp_officer: "자원봉사 코디네이터"
 kennelperson_camp_officer_desc: "$kennelperson_camp_officer$은 자원봉사자에게 식사를 제공하고, 감사를 표하며, 올바른 방향으로 안내합니다."
 landless_adventurer_government: "캠페이너"
 landless_adventurer_government_adjective: "캠페인 중"
 landless_adventurer_government_realm: "캠페인 사무실"
 laureate_camp_officer: "워드스미스"
 laureate_camp_officer_desc: "$laureate_camp_officer$는 사람들이 기억하는 대사와, 그들이 당신에게 되돌려 인용하는 대사를 씁니다."
 light_cavalry_captain_camp_officer: "신속 대응 리더"
 light_cavalry_captain_camp_officer_desc: "$light_cavalry_captain_camp_officer$은 한 시간 이내에 이 지역 어디든 팀을 배치합니다."
 light_infantry_captain_camp_officer: "거리 노점 리드"
 light_infantry_captain_camp_officer_desc: "$light_infantry_captain_camp_officer$는 시장 광장과 역 밖의 가판대를 운영합니다."
 master_bard_camp_officer: "콘텐츠 제작자"
 master_bard_camp_officer_desc: "$master_bard_camp_officer$는 문간에서의 하루를 비디오, 게시물, 가끔은 바이럴 순간으로 바꿉니다."
 master_of_arms_camp_officer: "현장 감독"
 master_of_arms_camp_officer_desc: "$master_of_arms_camp_officer$은 유세 팀을 운영합니다: 누가 어디를 언제 두드릴지 결정합니다."
 master_of_spoils_camp_officer: "재무관"
 master_of_spoils_camp_officer_desc: "$master_of_spoils_camp_officer$은 회계를 관리하고, 수표에 서명하며, 선거 위원회에 신고서를 제출합니다."
 master_thief_camp_officer: "야당 연구원"
 master_thief_camp_officer_desc: "$master_thief_camp_officer$은 상대편이 2011년에 무슨 말을 했는지, 어디에 적었는지 알고 있습니다."
 mess_tent_01_domicile_building: "사무실 주방"
 mess_tent_01_domicile_building_desc: "차 통, 우유 가득한 냉장고, 누군가의 생일 케이크: 선거운동은 배를 채워야 돌아갑니다."
 mess_tent_bakers_domicile_building: "베이컨 롤"
 mess_tent_bakers_domicile_building_desc: "#weak (필요 [GetDomicileBuilding('mess_tent_01').GetName])#!\n토요일 아침, 문 앞 세션 전. 아무도 놓치지 않는다."
 mess_tent_brewers_domicile_building: "커피머신"
 mess_tent_brewers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\n콩이 들어있는 진짜 한 잔. 아침 유세 참여율이 두 배가 됩니다."
 mess_tent_cooks_domicile_building: "자원 요리사"
 mess_tent_cooks_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\n유세할 수는 없지만 30명을 예산으로 먹일 수 있는 회원들."
 mess_tent_curers_domicile_building: "배치 조리"
 mess_tent_curers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\n짧은 선거 기간 동안 긴 밤을 위한 고추가 가득한 냉동고."
 mess_tent_herbalists_domicile_building: "건강 간식"
 mess_tent_herbalists_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\n비스킷뿐만 아니라 과일도. 작은 혁명."
 person_haggler_camp_officer: "딜 브로커"
 person_haggler_camp_officer_desc: "$person_haggler_camp_officer$는 어색한 방문객들을 처리하고 모든 호의에서 최상의 조건을 받아냅니다."
 pike_captain_camp_officer: "전화 은행 책임자"
 pike_captain_camp_officer_desc: "$pike_captain_camp_officer$는 저녁 전화 은행을 운영합니다: 스크립트, 명단 및 지속적인 전화."
 proving_grounds_01_domicile_building: "훈련실"
 proving_grounds_01_domicile_building_desc: "도어스텝 스크립트, 역할극 및 묻지 않은 질문에 답하는 방법"
 proving_grounds_bodyguard_drills_domicile_building: "근접 보호 훈련"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n공개 석상에 있는 후보에게는 관중을 살펴줄 사람이 필요합니다."
 proving_grounds_camel_run_domicile_building: "농촌 경로"
 proving_grounds_camel_run_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] 필요)#!\n거리 이름 없는 마을, 농장, 골목: 시골을 위한 표본 계획."
 proving_grounds_elephantry_reserve_domicile_building: "유명인 지지자"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n카메라를 위해 나타날 배우, 축구 선수, TV 요리사."
 proving_grounds_horse_run_domicile_building: "사이클 캔버스 거래 성사"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n미니버스가 닿지 못하는 장거리 도로와 주거 지역을 위한 자전거."
 proving_grounds_life_in_the_saddle_domicile_building: "길 위의 삶"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (필요 [GetDomicileBuilding('proving_grounds_01').GetName])#!\n어떤 사람들은 매일 다른 마을에서만 살아 움직입니다."
 proving_grounds_lockwagon_domicile_building: "공유된 고양이"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n모든 기부는 한 통에 들어가며, 그 통이 모든 것을 지불한다. 대부분."
 proving_grounds_martial_study_domicile_building: "선거 캠페인 사례 연구"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n모든 선거는 이전에 싸워진 적이 있다. 어떻게 승리했는지 읽어보라."
 proving_grounds_mock_battle_drills_domicile_building: "모의 투표일"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n투표일 전체 리허설, 첫 알림부터 투표 종료까지."
 proving_grounds_nightly_barding_drills_domicile_building: "전투 버스 훈련"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n싣고, 운전하고, 내리고, 유세하고, 반복, 시계처럼 돌아갈 때까지."
 proving_grounds_personal_bouts_domicile_building: "토론 연습"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n가장 악랄한 상대 역할을 하는 스태프와의 모의 유세."
 proving_grounds_the_stick_game_domicile_building: "사무실 복권"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] 필요) #!\n결과, 투표율, 그리고 누가 먼저 울부짖을지 모두 포함해서."
 proving_grounds_the_stump_domicile_building: "연단(The Soapbox)"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n시장 광장의 상자 한 개와 야유를 받는 연습 많이."
 proving_grounds_training_circle_domicile_building: "역할극 서클"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\n화난 유권자, 걱정하는 유권자, 쓰레기통에 대해 이야기하고 싶은 유권자: 모두가 모든 것을 연습한다."
 quartermaster_camp_officer: "사무실 관리자"
 quartermaster_camp_officer_desc: "$quartermaster_camp_officer$은 캠페인 자금, 문구류 보관함 및 순서를 정리합니다."
 second_camp_officer: "선거 캠페인 부부장"
 second_camp_officer_desc: "$second_camp_officer$는 후보자가 현장에 없을 때 사무실을 운영하며, 다른 모든 사람들이 업무를 수행하도록 합니다."
 stooge_camp_officer: "인턴"
 stooge_camp_officer_desc: "$stooge_camp_officer$ 복사, 커피 사러 가기, 그리고 아무도 원하지 않는 모든 일을 다 해. 다른 사람들의 사기는 올라간다."
 supply_tent_01_domicile_building: "인쇄실"
 supply_tent_01_domicile_building_desc: "전단지, 포스터, 봉투 및 모두가 싫어하는 프린터 하나. 캠페인은 종이로 운영된다."
 supply_tent_arsenal_domicile_building: "전단지 비축"
 supply_tent_arsenal_domicile_building_desc: "#weak ([GetDomicileBuilding('supply_tent_01').GetName] 필요) #! 캠페인이 지금까지 디자인한 모든 전단지 상자, 언제든지 거리에 배포할 준비 완료."
 supply_tent_climbing_gear_domicile_building: "사다리와 케이블 타이"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!지역구의 모든 가로등은 접근할 수 있다면 포스터 게시 장소가 됩니다."
 supply_tent_mender_domicile_building: "중고 키트"
 supply_tent_mender_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!기부받은 노트북과 리퍼비시 폰: 예쁘진 않지만, 작동합니다."
 supply_tent_reserve_provisions_domicile_building: "준비금"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!모든 파운드가 두 배로 중요한 마지막 2주를 위해 따로 마련한 돈."
 supply_tent_reserve_water_domicile_building: "비상 부양"
 supply_tent_reserve_water_domicile_building_desc: "#weak ([GetDomicileBuilding('supply_tent_01').GetName] 필요) #! 아무도 예산을 책정하지 않은 것들을 위한 잡동사니 현금통."
 supply_tent_smithy_domicile_building: "인하우스 프린터"
 supply_tent_smithy_domicile_building_desc: "#weak ([GetDomicileBuilding('supply_tent_01').GetName] 필요) #! 뒤방에 제대로 된 인쇄기: 더 이상 인쇄기를 일주일씩 기다릴 필요 없음."
 supply_tent_subdued_gear_domicile_building: "평상복"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!장식 배지도, 목걸이도 없음: 어떤 일은 색상 없이 하는 것이 더 좋습니다."
 supply_tent_sutler_domicile_building: "대량 구매 공급업체"
 supply_tent_sutler_domicile_building_desc: "#weak ([GetDomicileBuilding('supply_tent_01').GetName] 필요) #! 정시에 지불하고 정중히 요청하면 A5용으로 좋은 가격을 해주는 도매상."
 witness_camp_officer: "추천 담당관"
 witness_camp_officer_desc: "$witness_camp_officer$는 모든 지지 편지를 수집하고 모든 사람이 그것에 대해 알 수 있도록 한다."
