 doctrine_monasticism_forbidden_desc: "이 이데올로기는 수도 생활을 명시적으로 거부합니다. 서약을 하는 것은 금지되어 있으며, 수도 특성을 가진 사람들은 이 이데올로기에서는 범죄자로 간주됩니다."
 doctrine_mythic_literary_desc: "이 이데올로기는 신의 업적에 대한 이야기들을 통해 퍼지고 지속되며, 그중 많은 이야기가 문학 작품으로 수집된다."
