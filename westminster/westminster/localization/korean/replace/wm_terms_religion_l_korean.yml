 doctrine_parameter_spiritual_head_of_faith: "[head_of_faith|E]의 직위는 저명한 당직원에게 주어졌습니다."
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "이데올로기에 [great_holy_wars|E]가 있다면, 운동 지도자는 전쟁을 지휘하고 전쟁의 목표를 선택할 수 있습니다."
 doctrine_pilgrimage_encouraged_desc: "이 이데올로기는 구성원들이 [ROOT.Faith.PantheonTerm]에 대한 존경을 나타내는 수단으로 영적 중요성이 있다고 여겨지는 지상을 방문하도록 권장합니다."
 doctrine_pilgrimage_forbidden_desc: "[ROOT.Faith.HighGodName]의 존재는 어디서나 느낄 수 있으며, 특정 장소가 다른 곳보다 더 신성하다는 생각은 단순히 분열적입니다."
 doctrine_pilgrimage_local_rites_desc: "이 이념을 지지하는 이들은 긴 순례의 위험과 부담보다 지역 성지에서의 일상적인 이념의 안락함과 안정을 선호합니다."
 doctrine_pilgrimage_local_rites_name: "로컬 이데올로기"
 doctrine_pluralism_fundamentalist_desc: "우리 이데올로기는 유일한 진정한 이데올로기이며, 우리의 말은 유일한 진정한 말입니다. [ROOT.Faith.ReligiousText]에서 벗어나는 모든 것은 본질적으로 신성모독입니다."
 doctrine_sacraments_absent_desc: "이 전통은 성례전이나 공식적인 신성한 이념 체계를 강조하지 않는다. 종교 생활은 당 간부들의 의식 집행이나 특정 의식의 중요성에 초점을 맞추지 않는다."
 doctrine_sacraments_general_desc: "이 이데올로기는 성례와 신성한 이데올로기를 중심적으로 중요시한다. 의식은 단순히 상징적인 것이 아니라 신의 존재를 불러온다. 당 관리들이 이를 집행하며 신봉자들은 파문될 수 있다."
 doctrine_spiritual_head_desc: "물리적 세계와 영적 세계는 서로 다릅니다. 우리는 영적 세계가 우리를 인도하고 물질적 욕망에 의해 우리의 이념이 모독당하지 않도록 보호할 수 있는 독자적인 지도자를 가져야 합니다."
 doctrine_status_mainline: "주요 정책 입장"
 doctrine_status_rite: "이념 정책 입장"
 doctrine_status_rite_mainline: "주요 정책 입장"
 doctrine_temporal_head_desc: "정신적인 것과 물질적인 것은 본질적으로 서로 결합되어 있으며 온전하고 분리할 수 없습니다. 한 당에 두 명의 다른 지도자가 있는 것은 어리석은 일입니다."
 doctrine_theocracy_lay_clergy_desc: "헌신적인 신봉자는 우리 이념의 정책 입장을 이해하고, 따르며, 설교할 능력이 충분합니다."
 doctrine_theocracy_lay_clergy_name: "평신도 당 간부"
 doctrine_theocracy_temporal_desc: "인가된 [ROOT.Faith.PriestNeuterPlural]만이 우리 이념의 정책 입장을 유지하고, 나아가 신성한 장소를 관리하고 돌볼 책임을 맡을 수 있습니다."
