 holy_site_site_of_miracles_desc: "이곳에서 일어난 [faith.GetName]의 기적에 헌신된 중심지입니다."
 holy_site_site_of_prophecy_desc: "[faith.GetName]의 예언적 힘에 바쳐진 심장부."
 holy_site_site_of_revelation_desc: "[faith.GetName]을 통해 부여된 신성한 통찰에 헌신된 심장부."
