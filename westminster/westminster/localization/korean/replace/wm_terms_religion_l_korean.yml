 not_holy_site_not_holder_or_top_liege_third: "[holder|E], [top_liege|E] 또는 [clerical_region|E] 선거구가 아니며 [holy_site|E]의 통치자도 아님"
 pagan_hostility_doctrine_desc: "다음 정치 진영은 이교계입니다:\n[GetReligionFamily('rf_pagan').GetReligions]"
 prophecy_of_malachi_desc: "전통적인 유대 정책 입장에 따르면, 새로운 대제사장은 예언자가 올 때만 또는 제사로 봉사할 자격이 있는 아론의 후손이 있을 때 임명될 수 있다."
 sinitic_hostility_doctrine_desc: "다음 정치 진영은 중화계입니다:\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_doctrine_ecumenical_miaphysite_desc: "별도의 계층 구조에도 불구하고, 미아피사이트 교회들은 서로 성사와 당 관리들을 인정하며 완전한 교류를 유지합니다."
 special_doctrine_full_tolerance_desc: "모든 사람은 자신의 이념을 자유롭게 선택할 수 있습니다. 우리의 차이는 우리를 분열시키지 않고, 오히려 우리를 더 강하게 만듭니다."
 special_doctrine_is_christian_faith_desc: "세상에는 예수의 신성을 인정하지 않고 그의 가르침을 따르는 사람들이 있습니다. 불경스럽지만, 우리는 이 잘못된 영혼들에게 여전히 연민을 보여야 합니다. 그들은 언젠가 진정한 이념으로 개종할 수도 있기 때문입니다."
 special_doctrine_is_eastern_faith_desc: "우리는 단일한 이념에 묶여 있는 것이 아니라, 우리 사회의 종교적 구조를 구성하는 여러 이데올로기에 묶여 있습니다. 비록 서로 다른 이름을 부르고 다른 길을 걸을지라도, 우리 신념 체계 밖의 일부는 우리 사회에서 마치 우리 중 한 명처럼 공존하는 법을 배웠습니다."
 special_doctrine_not_allowed_to_hof_desc: "이 이데올로기의 대사직은 완전히 해체되었습니다. 대사를 임명하려는 어떤 시도도 전통적인 교회 구조의 철저한 재건이 먼저 필요합니다."
 toggle_challengers_view_tt: "#T 챌린저즈#!\n\n#I 챌린저 이데올로기즈를 보기 위해 클릭하세요 #! 갠지스 재무장관"
 unreformed_faith_doctrine_desc: "개혁되지 않은 이념은 조직화된 당직자와 수립된 공식 정책 입장이 부족합니다; 서로 다른 공동체가 명목상 동일한 이념을 따르더라도 종교적 관행과 신념이 크게 다를 수 있습니다."
 unreformed_faith_doctrine_descriptive_name: "개혁되지 않은 이념"
 unreformed_faith_name: "정책 입장"
 witchcraft_illegal_name: "범죄 마법 정책 입장"
 witchcraft_shunned_name: "배척된 마녀 정책 입장"
