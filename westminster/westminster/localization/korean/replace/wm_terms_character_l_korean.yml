 ally_at_court_opinion: "동맹 내"
 backwater_county_modifier_desc: "그들이 클수록, 더 크게 무너집니다. 한때 헬라스의 불가침 통치자들의 영토였던 이 선거구는 안타깝게도 치욕 속에 떨어졌습니다. 현재는 과거의 그림자에 불과하지만, 이 선거구는 다시 위대함으로 일어설 수 있습니다. \n\n#X @warning_icon! 이 수식어는 [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E]를 사용해 제거할 수 있습니다. [development|E] 이 [county|E]가 #V 50#! 이상일 때!#!\n\n"
