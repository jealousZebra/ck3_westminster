 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "저는 제 잘못을 깨닫고 잘못된 행동을 회개한 후, 이데올로기의 형제자매들과 다시 합류할 수 있도록 저의 출교를 해제해 달라고 청원합니다."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "\n저는 좋은 [puppet_or_actor.GetFaith.GetAdherentName]가 되려고 노력하지만, 저는 다른 [actor.GetWomanMan]와 마찬가지로 완벽하지 않습니다. 제 실수와 실패를 보상하기 위해, 저는 이 금액을 교회에 기부하고자 합니다.\n\n또한, 모든 죄를 삼가겠다는 맹세를 할 것입니다."
 RETRACT_VASSAL_PROPOSAL: "저는 [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip]의 더 큰 이익을 위해 [recipient.GetFullName]를 제 직접적인 권한 아래 후방 의원으로 배치해야 한다는 결론에 도달했습니다."
 WASTREL_ACCOLADE_BONUS: "당신의 [acclaimed_knight|E]는 사무실에서의 생활을 매력적으로 보이게 합니다: $VALUE|=+0$"
