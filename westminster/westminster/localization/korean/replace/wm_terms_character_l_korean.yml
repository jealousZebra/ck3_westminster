 celestial_bureaucracy_0_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 후방의 [titles|E]는 [realm|E] 외부의 캐릭터가 상속할 수 없습니다#!"
 celestial_bureaucracy_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 비[governor|E] [vassals|E] 의원은 [hook|E]를 사용하지 않는 한 다른 백벤처들과 [war|E] 싸울 수 없다[liege|E]#!"
 celestial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 통치자들은 모든 사용 가능한 사람 사이에서 변경할 수 있습니다 [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 직위 취소나 백벤처 철회를 거부하는 모든 백벤처가 비용 절감[criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! 고려됩니다"
 char_interaction.0001.desc: "나는 당신의 관대한 종속 제안을 받아들입니다. 나의 당 지도자!"
 char_interaction.0002.desc: "나는 당신의 보호가 필요 없으며, 당의 상금을 나 혼자 가지고 싶습니다."
 char_interaction.0010.a: "내 당 지도자!"
 char_interaction.0090.from_ward.desc: "나는 당신 사무실에서의 교육이 더 이상 내 필요에 맞지 않을까 두렵습니다. 나는 즉시 [capital.GetNameNoTierNoTooltip]로 돌아갈 것입니다."
 char_interaction.0090.one_ward.desc: "나는 [ward.GetTitledFirstName]의 당신 사무실에서의 교육이 더 이상 우리의 필요에 맞지 않을까 두렵습니다. [ward.GetSheHe|U]는 즉시 우리의 보호 아래 소환됩니다."
 char_interaction.0090.two_wards.desc: "나는 [ward.GetTitledFirstName]와 [ward_2.GetTitledFirstName]의 당신 사무실에서의 교육이 더 이상 우리의 필요에 맞지 않을까 두렵습니다. 그들은 즉시 우리의 보호 아래 소환됩니다."
 char_interaction.0180.desc: "당신의 가장으로서, 나는 당신이 진정한 이념인 [puppet_or_actor.GetFaith.GetName]을 받아들여야 한다고 결정했습니다. 이 문제에 대해 선택권이 없을 것 같습니다."
 char_interaction.0180.desc.liege: "당의 지도자로서 나는 네가 거짓 이념을 버리고 즉시 나와 함께할 [puppet_or_actor.GetFaith.GetAdherentName]로 합류할 것을 요구한다."
 char_interaction.0181.desc: "좋아요, 저는 [puppet_or_actor.GetFaith.GetAdjective] 이데올로기를 받아들이겠습니다. 다만 익숙한 것을 너무 많이 버리는 것은 이상하게 느껴질 것입니다."
 char_interaction.0182.desc: "나는 내 이념을 결코 버리지 않을 것이며, 대신 내 자신의 가문을 세울 것이다!"
 char_interaction.0190.desc: "좋아요, 저는 [puppet_or_actor.GetFaith.GetAdjective] 이데올로기를 받아들이겠습니다. 다만 익숙한 것을 너무 많이 버리는 것은 이상하게 느껴질 것입니다."
 char_interaction.0191.desc: "나의 이데올로기는 내 존재의 핵심에 있다 — 나는 그것을 결코 버리지 않을 것이다."
 char_interaction.0200.desc: "저는 당신에게 [landed_title.GetName]의 존엄성과 책임을 맡길 수 없다는 결론에 도달했습니다. 따라서 당의 더 큰 이익을 위해 당신의 이 칭호를 앞으로 박탈합니다."
 char_interaction.0211.desc: "[secondary_recipient.GetShortUIName]를 내 후방 의원으로 만들겠다는 당신의 관대한 제안을 진심으로 감사드리지만, 나는 아쉽게도 거절해야 한다."
 char_interaction.0220.desc: "나는 [secondary_recipient.GetShortUIName]인 내 백벤처를 철회해 주신 것을 받아들이지만, 부당하다고 생각합니다."
 char_interaction.0221.desc: "나는 [secondary_recipient.GetShortUIName]에 대한 충성의 맹세를 배신할 수 없습니다. 당 백벤처를 보호할 것이며, 그것이 당신에 대한 약속을 깨는 것을 의미하더라도 지킬 것입니다."
 char_interaction.0232.liege: "나는 우리 당 대표가 [actor.GetHerHis] 충성스러운 후방 의원들을 학대하는 동안 가만히 있지 않을 것이다. 나는 당신이 이 폭군을 쫓아내기 위한 싸움에 나와 함께하길 촉구한다."
 char_interaction.0232.regent: "나는 [actor.GetSheHe]가 [ceremonial_liege.GetTitledFirstNamePossessive] 충성스러운 후방 의원들을 학대하는 동안 가만히 있지 않을 것이다. 나는 당신이 이 폭군을 쫓아내기 위한 싸움에 나와 함께하길 촉구한다."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n나는 당신에게 좋은 후열 의원이었지만, 나 역시 나만의 신민이 있다는 것을 당신도 분명히 이해할 것입니다!\n\n현재 내 계약은 매우 제한적입니다, 분명히 당신은 그것을 더 관대하게 만드는 것이 현명하다는 것을 알 수 있을 것입니다?\n\n게다가, 당신 #emphasis 는 나에게 빚진 것도 있습니다!#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n우리의 헌신과 [recipient.GetPrimaryTitle.GetNameNoTooltip]에 대한 존경을 인정하여, 나는 당신이 그 헌신을 존중하여 [SCOPE.Custom('CelestialTributaryRequest')]를 수여해 주시기를 부탁드립니다.\n\n이 은혜가 당신의 왕좌와 우리 겸손한 당 사이의 화합을 강화하기를 바랍니다."
 char_interaction.0271.desc: "[intermediary.GetTitledFirstName]가 내게 부여한 사무 권한으로, 나는 당의 경계에서 몇 가지 사소한 불일치를 바로잡고 있다.\n\n 당신은 [intermediary.GetTitledFirstName]의 봉토를 [intermediary.GetHerHis]의 정당한 당 지도자에게 항복하라는 명령을 받았다. 나다."
 char_interaction.0272.desc: "당신은 권한의 범위를 넘어섰지만, [intermediary.GetTitleAsName]의 직위를 거부할 수 없습니다, 그것이 단지 #EMP 당신#!이 행사하는 것일지라도.\n\n 저는 당신이 후방 의원을 철회한 것을 받아들입니다."
 char_interaction.0273.desc: "나는 내 후방 의원들을 보호하겠다고 맹세했으며, 그것은 #EMP 와 같은 자들의 약탈로부터도 포함된다, 당신#!.\n\n당신은 전투에서 [intermediary.GetTitledFirstName]와 [intermediary.GetHerHis]의 땅을 나에게서 뺏을 수 있거나, 아니면 [recipient.GetFaith.random_GoodGodNames]이 버린 구멍으로 도망치면 된다."
 char_interaction.0282.desc: "나의 행동과 달리, 당신의 요구는 범죄이다.\n\n당의 이익을 위해 나는 따르겠지만, 이 모욕을 잊지 않으리라 알아라."
 char_interaction.0291.a: "나는 나의 당 지도자가 최선의 판단을 내릴 것이라고 확신합니다."
 char_interaction.0291.desc.negative: "#EMP 이걸 좀 못 하겠어요#!? 땅에서 가장 느린 바보도 [recipient.GetTitledFirstName]에 집중하면 안 된다는 것을 알 수 있습니다. 더 나은 백벤처들을 괴롭히지 말고 당신의 일을 하세요."
 char_interaction.0370.a.herder: "저는 제 당을 지켜야 했습니다."
