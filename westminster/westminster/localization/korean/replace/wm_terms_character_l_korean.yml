 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "우리는 올바른 단정과 외모에 관한 법을 몇 시간이고 토론하며 서로에게 격렬하게 손짓을 하며 사무실 사람들 중 거의 아는 사람이 없는 고대 법들을 인용했음에 틀림없다. 장관의 연기에 휩싸였을 때,"
 court_amenities_interactions.0002.desc_lost: "내가 사실 법을 위반하고 있다는 사실에 충격을 받았습니다!\n\n [debate_locale.GetNameNoTierNoTooltip] 성의 경비병과 스타일리스트들이 나를 속옷 차림으로 만든 후 계속해서 벗기자 나는 창피함을 느끼며 사무실을 향해 도망칩니다. 내 자존심을 다리 사이에 두고."
 court_amenities_interactions.0002.desc_won: "내가 이긴 것 같습니다!\n\n 그 결과, [recipient.GetName]는 [recipient.GetHerHis] 속옷만 남기고 벗어야 했습니다! 사무실에 있는 모든 사람들은 [recipient.GetHerHim]이 [ROOT.Char.GetFaith.CreatorName]가 만든 [recipient.GetHerHim] 그대로 본 것 같습니다!"
 court_amenities_interactions.0003.desc_won: "내가 이긴 것 같습니다!\n\n 그 결과, [actor.GetName]는 [actor.GetHerHis] 속옷만 남기고 벗어야 했습니다! 사무실에 있는 모든 사람들은 [actor.GetHerHim]이 [ROOT.Char.GetFaith.CreatorName]가 만든 [actor.GetHerHim] 그대로 본 것 같습니다!"
