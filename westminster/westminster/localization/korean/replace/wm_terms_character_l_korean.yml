 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U]는 우리 이념의 가치를 잘 지키지 못했고, [target.GetNameNoTier]의 [puppet_or_actor.GetFaith.GetAdherentNamePlural]는 그로 인해 고통받고 있습니다. [secondary_recipient.GetHerHis]의 잘못된 통치로부터 그 땅을 해방시키는 것에 대한 당신의 축복을 주시겠습니까?"
