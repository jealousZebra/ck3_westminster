 peasant_faction_desc: "농민 [faction|E]는 외세나 반대 세력의 지배로부터 국민의 자유를 원하며, [counties|E]에서 평민들의 [culture|E]와 [faith|E]을 공유하지 않는 당 지도자를 교체하기 위해 노력할 것입니다."
 populist_faction: "포퓰리스트 운동"
 populist_faction_desc: "포퓰리스트 [faction|E]는 외세나 반대 세력의 지배로부터의 자유를 원하며, 자신의 [culture|E] 또는 [faith|E]을 공유하지 않는 당 지도자로부터 독립을 추구할 것입니다."
