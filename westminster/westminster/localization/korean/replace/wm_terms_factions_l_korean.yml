 liege_primary_title_dissolution_desc: "당신의 정당 지도자는 $nation_fracturing_faction$ [faction|E] 때문에 [primary_title|E]을 잃었습니다."
 nation_fracturing_faction_desc: "$nation_fracturing_faction$ [faction|E]의 회원들은 그들의 [liege|E].\n\n#S 최후통첩#!\n을 파괴하려고 시도합니다. 모든 파벌 회원은 [independent|E]\n[liege|E]를 얻으며 그들의 [primary_title|E]와 같은 [title_tier|E]의 다른 [titles|E]를 잃게 됩니다."
 nation_fracturing_faction_short_effect_desc: "그들의 [liege|E] 당을 파괴하고 싶어한다"
