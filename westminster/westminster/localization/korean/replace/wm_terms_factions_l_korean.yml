l_korean:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "마침내! [faction_target.GetName] 단지 광대가 [faction_target.GetTitleAsNameNoTooltip] 역할을 하는 것에 불과하며, 나는 당이 내 대의를 지지할 것이라고 확신한다. 나를 돕는 사람은 잊히지 않을 것이다."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName]는 정당하게 당신의 것이어야 할 왕좌를 차지하고 있습니다! 나는 말과 칼로 당신의 권리를 지지할 준비가 되어 있으며, 당 내 다른 사람들도 이 정당한 대의를 지지할 것이라 확신합니다. 당신이 해야 할 유일한 일은 수락하는 것입니다."
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "마침내! [faction_target.GetName] 단지 광대가 [faction_target.GetTitleAsNameNoTooltip] 역할을 하는 것에 불과하며, 나는 당이 내 대의를 지지할 것이라고 확신한다. 나를 돕는 사람은 잊히지 않을 것이다."
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName]는 정당하게 당신의 것이어야 할 왕좌를 차지하고 있습니다! 나는 말과 칼로 당신의 권리를 지지할 준비가 되어 있으며, 당 내 다른 사람들도 이 정당한 대의를 지지할 것이라 확신합니다. 당신이 해야 할 유일한 일은 수락하는 것입니다."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "드디어! [faction_target.GetName]는 [faction_target.GetTitleAsNameNoTooltip]을 연기하는 어릿광대에 불과하며, 나는 당원들이 내 대의에 동참할 것이라고 확신합니다.\n\n현재 낮은 신분 때문에 당신을 도울 수는 없습니다. 하지만 이 사실을 기억하세요 – #emphasis 당신이 #! 승리할 때, 나는 당신이 충분히 보상받는 것을 보장할 것입니다!"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "거짓 [faction_target.GetTitledFirstName]에 맞서 당이 일어나는 모습을 보니 기쁘지만, 현재의 곤경 때문에 이 정의로운 일에 동참할 수 없습니다. 성공한다면 저는 당신에게 빚을 지겠습니다."
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "나는 당신이 이 어리석은 모험을 포기하기 전에 당이 불타는 것을 보겠다고 하는 것이 분명합니다. 당을 위해 나는 당신의 요구를 받아들여야 하지만, 오늘 여기서 큰 부정이 일어났다는 것을 알아두십시오. 이것은 용납될 수 없습니다!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "당신이 이 어리석은 일을 포기하기 전에 당이 타는 것을 보고 싶어 할 것이라는 것이 나에게 명확하다. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]의 이익을 위해 나는 당신의 요구를 받아들여야 하지만, 오늘 이 자리에서 큰 부정이 저질러졌다는 것을 알아라. 이는 용납되지 않을 것이다!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n당신의 잘못된 요구는 우리 모두를 약화시킬 뿐입니다. 그럼에도 불구하고, 당을 헛된 유혈사태에서 구하기 위해 저는 어쩔 수 없이 당신의 독립 요청을 받아들입니다."
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "당신이 이 어리석은 일을 포기하기 전에 당이 타는 것을 보고 싶어 할 것이라는 것이 나에게 명확하다. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]의 이익을 위해 나는 당신의 요구를 받아들여야 하지만, 오늘 이 자리에서 큰 부정이 저질러졌다는 것을 알아라. 이는 용납되지 않을 것이다!"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n당의 충성스러운 신하들은 당신의 잘못된 정책을 너무 오래 참아왔습니다. [faction.GetName]는 [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]에 대해 새로운 방향에 동의할 것을 요구하며, 그렇지 않으면 우리가 강제로 이를 시행할 것입니다!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "드디어 그 순간이 왔습니다! [faction_target.GetTitledFirstNamePossessive] 잘못된 정책을 철회하는 것을 지지하는 모든 사람들이 이제 하나로 뭉쳐 당을 새로운 방향으로 이끌도록 할 것입니다. 필요하다면 우리는 칼과 불로 그것을 이루는 것을 보게 될 것입니다!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n당신의 잘못된 요구는 우리 모두를 약화시킬 뿐입니다. 그럼에도 불구하고, 당을 헛된 유혈사태에서 구하기 위해 저는 어쩔 수 없이 당신의 독립 요청을 받아들입니다."
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n당신의 '자유'라는 이기적인 개념은 당 전체를 약화시킬 것입니다. 그러나 불필요한 유혈사태를 피하기 위해 저는 당신의 요구를 수용하겠습니다."
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n 이제 당신의 후방의원들의 고대적이고 양도할 수 없는 권리를 인정할 때입니다! [faction.GetName]의 요구를 받아들이거나 전장에서 우리의 칼을 마주하십시오!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "좋습니다! 내 당은 당신의 더럽혀진 무리들을 위해 자리가 없습니다."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "우리는 더 이상 당신의 불쾌한 억압으로부터 자랑스러운 [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]를 참을 수 없다. 이 열린 하늘 아래 자유롭게 돌아다니도록 태어난 우리는 당신의 폭정을 거부한다 — 우리의 시간이 다가왔다! \n\n 우리는 당신의 통치와 당신 당 지도자 [faction_target.GetTitledFirstName]의 통치를 완전히 벗어버릴 것이다!!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "우리는 당신의 [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] 통치로부터 더 이상의 억압을 허용하지 않을 것이다. [peasant_leader.GetRite.GetName|U]는 [ROOT.Char.GetPrimaryTitle.GetName]의 최고의 [rite|E]로 인정받아야 한다! \n\n 우리의 이념에 마땅한 지위를 부여하라, 그렇지 않으면 우리의 많은 신실한 자들의 분노를 감수하게 될 것이다!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "우리는 더 이상 선량한 [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]에 대한 당신의 불쾌한 억압을 참지 않을 것이다. 우리의 시간이 지금 다가왔다! \n\n 우리는 당신의 통치와 당신 당 지도자 [faction_target.GetTitledFirstName]의 폭정으로부터 우리 자신을 해방시킬 것이다!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "우리는 [peasant_leader.GetCulture.GetName] 전통에 대한 외국의 억압을 더 이상 용납하지 않을 것이다. 우리의 시간이 지금 다가왔다! \n\n 우리는 당신 당 지도자 [faction_target.GetTitledFirstName]로부터 완전한 자유를 요구할 것이다!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "우리는 더 이상 신실한 [peasant_leader.GetFaith.GetAdherentNamePlural]에 대한 당신의 불쾌한 억압을 참지 않을 것이다. 우리의 시간이 지금 다가왔다! \n\n [peasant_leader.GetFaith.WarGodName]가 우리를 인도하면서, 우리는 일어나 당신 당 지도자 [faction_target.GetTitledFirstName]의 통치로부터 우리 자신을 해방시킬 것이다!"
