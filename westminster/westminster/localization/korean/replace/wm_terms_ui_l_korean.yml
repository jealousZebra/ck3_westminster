 TLFR_FOREIGN_RULER_SUCCESSION_TIPS: "#help 만약 백벤처가 현재 [primary_title|E]보다 더 높은 [title_rank|E]의 외국 정당에서 칭호를 얻으면 더 이상 당신의 백벤처가 아닙니다. \n\n백벤처의 땅이 당을 떠나는 것을 막을 수 있는 방법은 다음과 같습니다: 백벤처 직함을 \n$BULLET_WITH_TAB$[Concept( 'revoke', 'Revoking' )|E] 당신의 백벤처 직함\n$BULLET_WITH_TAB$백벤처에게 그들이 상속받을 것과 동등한 [Concept('title_tier', 'Tier')|E] 칭호를 부여하는 것#!"
