 action_has_unopened_court_event: "사무실 이벤트 가능"
 action_has_unopened_court_event_label: "당신은 새로운 사무실 이벤트를 갖게 됩니다."
 action_in_debt_desc: "당신은 [gold_i|E]#V 0#! [gold|E] 미만을 가지고 있으므로 [debt|E]에 있습니다!\n\n부채 상태는 다음과 같은 영향을 미칩니다:\n$BULLET_WITH_TAB$[war|E] 선언할 수 없습니다 \n$BULLET_WITH_TAB$[men_at_arms|E] 강화할 수 없습니다 [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] [domain|E]에 퍼지는 확률이 높습니다\n$BULLET_WITH_TAB$[vassals|E][factions|E] \n에 참여할 가능성이 더 높습니다\n\n부채가 깊을수록 부과되는 처벌도 더 가혹해집니다. 현재 부채 수준이 추가로 미치는 영향은 다음과 같습니다:\n[GetPlayer.GetDebtModifierDescription]\n\n#help\n 매달 자금을 벌고 있지 않다면 지출을 줄이는 것을 고려해보세요. 예를 들어:$BULLET_WITH_TAB$[armies|E] \n 해체$BULLET_WITH_TAB$[men_at_arms|E]\n $BULLET_WITH_TAB$ 규모 축소 또는 파괴[control|E][marshal|E]\n $BULLET_WITH_TAB$ 증가 [court_positions|E]#!ZZKEEP0045ZZ ZZKEEP0046ZZ 취소ZZKEEP0047ZZZZKEEP0048ZZ"
 action_in_debt_landless_desc: "당신은 [gold_i|E]#V 0#! [gold|E] 미만을 가지고 있으므로 [debt|E]에 있습니다!\n\n부채 상태는 다음과 같은 영향을 미칩니다:\n$BULLET_WITH_TAB$[war|E] 선언할 수 없습니다 \n$BULLET_WITH_TAB$[men_at_arms|E] [gold_i|E] 사용하여 강화할 수 없습니다[gold|E]\n\n 부채가 깊을수록 부과되는 처벌도 더 가혹해집니다. 현재 부채 수준이 추가로 미치는 영향은 다음과 같습니다:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help [task_contract|E] 자금을 벌기 위해 활동을 고려해보세요#!"
