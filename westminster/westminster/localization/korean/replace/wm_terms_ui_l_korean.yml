 action_can_ask_hof_for_claim_combined_group_name: "@hof_icon! 당신의 운동 지도자가 청구를 승인할 것입니다"
 action_can_ask_hof_for_claim_label: "@hof_icon! 당신의 운동 지도자인 [secondary_recipient.GetUINameNoTooltip]가 [target_title.Custom('GetTierIcon')][target_title.GetNameNoTooltip]에 대한 청구권을 부여할 것입니다"
 action_can_ask_hof_for_money: "@gold_icon!귀하는 자금 요청을 위해 운동 지도자에게 요청할 수 있습니다"
 action_can_choose_dynasty_perk_desc: "당신은 [dynasty|E] 용 [dynasty_perk|E]를 잠금 해제할 충분한 [dynasty_prestige|E]를 가지고 있습니다.\n\n#help [dynast|E]으로서, 당신은 동료 왕조 구성원에게 행동을 취하는 데 파티 브랜드를 사용할 수 있지만, 레거시는 전체 왕조에 대한 장기 보너스입니다.#!"
 action_can_claim_liege_title: "@titles_icon! 당신은 당 지도자의 직함을 주장할 수 있습니다"
 action_can_claim_liege_title_desc: "당신은 [liege_possessive|E] [titles|E] 중 하나에 [de_jure|E]되는 [counties|E]의 대부분을 통제합니다. 이것은 [prestige|E]를 사용하여 여기에 [unpressed_claim|E]를 얻을 수 있다는 것을 의미합니다!\n\n#help 상위 등급 타이틀에 대한 미확정 청구권을 가지면 순위를 올릴 기회를 가집니다. 이를 사용하여 [claimant_faction|E]를 시작하거나 단순히 파티 리더에게 [war|E]를 선언할 수 있습니다.#!"
