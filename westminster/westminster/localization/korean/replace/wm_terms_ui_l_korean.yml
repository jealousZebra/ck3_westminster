 action_not_rightful_liege: "[recipient.GetShortUINameNoTooltip]의 정당 당원의 정당한 지도자가 아님"
 action_not_rightful_liege_combined_group_description: "당신은 몇몇 백벤처의 [rightful_liege|E]가 아닙니다. \n\nCK 당신이 그들의 [de_jure|E] [liege|E]가 될 [create|E] 또는 [usurp|E] 칭호를 얻을 수 있다면 말이죠; 그렇게 하면 그들의 [opinion|E]도 높아지고 그들로부터 받는 [taxes|E]과 [levies|E]도 증가할 것입니다. \n\n그게 불가능하다면, 특히 그 백벤처가 그들의 [rightful_liege|E]라면 그들을 다른 백벤처에게 [transferring|E]하는 것을 고려해 보세요."
 action_not_rightful_liege_combined_group_label: "평의원들의 정당 정당한 지도자가 아님"
 action_not_rightful_liege_desc: "당신은 [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\n의 [rightful_liege|E]이 아닙니다. [create|E] 또는 [usurp|E] 할 수 있는지 확인하여 [recipient.GetHerHis] [de_jure|E] [liege|E]이 될 수 있는 직함을 얻으세요; 이렇게 하면 [recipient.GetHerHis] [opinion|E]가 향상되고 [recipient.GetHerHim]로부터 받는 [taxes|E] 및 [levies|E]이 증가합니다.\n\n 가능하지 않다면, 특히 그 의원이 그들의 [rightful_liege|E]가 될 수 있다면, 다른 후방 의원에게 [transferring|E]를 고려할 수 있습니다."
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! 강력한 후임 의원은 [GetPlayer.Custom( 'GetCouncilConcept' )] 직위를 기대합니다"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help 강력한 후방 의원들에게 [GetPlayer.Custom( 'GetCouncillorConcept' )|E] 직위를 주는 것을 고려해야 합니다. 그렇지 않으면 그들의 [opinion|E]가 낮아지고, 당신에게 반하는 [faction|E]에 합류할 수 있습니다.\n\n 그러나, 모든 사람들이 유용할 만큼 충분히 높은 [skills|E]을 가진 것은 아니며, 당신의 [rank|E]이 충분히 높다면, 단순히 [GetPlayer.Custom( 'GetCouncilConcept' )|E]의 의석 수보다 강력한 후방 의원이 더 많을 수 있습니다.#!"
