 action_above_domain_limit_desc: "[domain|E] 한도인 [actor.GetDomainLimit|V]보다 [actor.GetDomainLimitOverrunWithoutGracePeriod|V] [holdings|E] 초과하여 [taxes|E]과 [levies|E]가 줄어듭니다. \n\n#help [ruler|E] 보유할 수 있는 보유량은 제한적입니다. [realm|E] 내 나머지 보유 자산은 [vassals|E]가 보유해야 합니다. \n\n보유 보유 자산 중 일부를 보유한 상태에서 일부 [titles|E]을 부여해야 합니다. [courtiers|E]와 [guests|E]은 약한 편이기 때문에 좋은 선택입니다. 기존 백벤처들도 직함을 받을 수 있지만, 그 후 더 강해져 미래에 위협이 될 수 있습니다! #!"
 action_above_vassal_limit_click: "#I 백벤처 #!를 보여주려면 클릭하세요"
 action_above_vassal_limit_desc: "백벤처 한도인 [actor.GetVassalLimit|V] [actor.GetVassalLimitOverrun|V] [direct_vassals|E] 초과하여 [vassals|E]에서 받는 [taxes|E]과 [levies|E]이 줄어듭니다. \n#help 각 [ruler|E]은 직접 백벤처의 수만 통제할 수 있습니다. 직접 백벤처로 두는 대신, 다른 백벤처 중 한 명이 관리해야 합니다. 이를 위해 백벤처 한 명을 다른 백벤처에게 옮기세요#!"
 action_accolade_can_spend_attribute_click: "#I 주최자 #!를 보려면 클릭하세요"
 action_appoint_tax_collector_desc: "당신은 [clan|E] [vassals|E]에 세금을 부과하는 것이 아닙니다. \n\n#help [tax_collectors|E] 클랜 백벤처들로부터 [levies|E]과 [gold|E]을 징수하는 책임을 맡고 있습니다. $game_concept_tax_collector$를 임명하고 [tax_jurisdictions|E]에 [taxpayers|E]을 배정해야 합니다. #!"
 action_appoint_tax_collector_label: "@tax_collector_icon! 당신은 자당 의원들에게 세금을 부과하지 않고 있습니다"
 action_ask_for_pardon_desc: "현재 [top_liege|E]에 의해 [criminal|E]으로 간주되지만, [recipient.GetSheHe]가 사면을 허락할 수 있습니다. \n\n#help 범죄자라면 당 지도자가 언제든지 [imprison|E]할 수 있습니다! [hook|E] 비용이 들 수 있지만, 보통은 사면을 받으려 노력하는 것이 최선입니다. #!"
 action_assign_tax_payers_desc: "당신은 [clan|E] [vassals|E]에 세금을 부과하지 않습니다. \n\n#help [tax_collector|E]가 있지만 [taxpayers|E]가 없는 [tax_jurisdiction|E]은 [gold|E]이나 [levy|E] 기여를 하지 못합니다. 클랜 백벤처를 $game_concept_taxpayers$으로 지정하여 그들로부터 $game_concept_taxes$을 징수하게 하세요. #!"
