 action_can_demand_payment_desc: "당신은 [hook|E]을 [recipient.GetUIName]에 사용하여 [gold|E]를 지불하도록 요구할 수 있습니다.\n\n[recipient.GetSheHe|U] 현재 @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#!의 자금을 요구할 수 있습니다.$action_can_demand_payment_HELP$"
 action_can_find_secrets_HELP: "\n\n#help 여기에는 10명의 [title_tier|E] [titles|E] 중 가장 높은 [vassals|E] 보유자만 표시됩니다. 이들은 가장 중요한 목표이지만, [liege|E]의 어떤 후열 의원이라도 자유롭게 목표로 삼을 수 있습니다.#!"
