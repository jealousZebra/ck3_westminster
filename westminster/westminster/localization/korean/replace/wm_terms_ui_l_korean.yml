 action_landless_admin_escape_to_realm_desc: "당신은 다른 [government|E]\n\n#help [liege|E] 아래 있는 무토지 [noble_family|E] [title|E] [holder|E]입니다. [government|E] 있는 다른 [independent_rulers|E]들에게 새 당 리더가 되어 [domicile|E]을 그들의 [capital|E]#!으로 옮길 수 있습니다"
