 action_grant_vassal_to_rightful_liege: "@vassal_icon! 정당한 당 대표에게 백벤처를 부여할 수 있습니다"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] 당신이 올바른 당대표가 아닌 경우, 그들이 제공하는 자원이 줄어들고 당신에 대한 [opinion|E]이 감소합니다. 때로는 이러한 후방의원을 그들의 정당 대표에게 돌려주는 것이 최선일 수 있습니다. 그들이 또한 당신의 후방의원이라고 가정할 때 말입니다.\n\n 때로는 후방의원을 그들의 정당 대표에게 돌려주는 것이 수입을 줄일 수 있지만, 그럼에도 불구하고 대부분 허용할 가치가 있습니다 – 그들의 정당 대표는 자신이 속해야 한다고 생각하는 후방의원을 당신이 보유하고 있는 것에 대해 상당한 의견 페널티를 가질 것입니다.\n\n 좋은 후방의원 구조를 유지하는 것이 안정적인 당의 핵심입니다.#!"
 action_grant_vassal_to_rightful_liege_click: "#I 그랜트 백벤처#!"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! 정당한 당 대표에게 백벤처를 부여할 수 있습니다"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! 백벤처들은 그들의 정당 지도자에게 부여될 수 있습니다"
 action_has_any_display_cb_on_HELP: "\n\n#help 만약 당신의 군사력과 [allies|E]가 적보다 강하다면, 전쟁은 매우 유익할 수 있습니다. [titles|E]를 차지하고, [realm|E]를 확장하며, [prestige_experience|E]를 벌 수 있습니다.\n\n 하지만 전쟁은 비용이 많이 들며, 특히 [defeat|E]를 인정해야 한다면 더욱 그렇습니다. 야심 있는 이웃이 당신의 약화된 정당을 이용할 수 있습니다.#!"
 action_has_courtier_or_guest_with_inspiration_desc: "귀하의 직원이나 손님 중 한 명이 [inspiration|E]를 가지고 있으며, [artifact|E]를 생성하도록 후원받을 수 있습니다."
