 action_can_request_preach_legitimacy_help_desc: "\n\n#help [legitimacy|E] 의 [rulers|E] 은 [actor.GetFaith.HighGodNamePossessive] 승인에 달려 있으며, [actor.GetFaith.HighGodNamePossessive] 승인은 오직 당 관계자를 통해서만 알 수 있습니다.#!"
