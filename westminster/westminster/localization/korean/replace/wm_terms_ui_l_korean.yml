 action_county_in_dangerous_populist_faction_combined_group_description: "여러분의 여러 지역구의 농민들이 [popular_faction|E]에서 당 지도자에 반대하여 연합했습니다.\n\n이 지역구의 [county_opinion|E]를 증가시키거나, 그들이 요구를 제시할 때 완전히 잃을 위험을 감수하세요!"
