l_korean:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "연립 합의됨"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] 및 [wm_coal_leader.GetName] 넘버 10 앞 계단에서 악수했습니다. [wm_coal_party.GetNameNoTier] ([wm_coal_party_seats|0] 의석) 가 [wm_coal_senior.GetNameNoTier] ([wm_coal_senior_seats|0]) 에 합류하며, [wm_coal_leader.GetFirstName] 는 부총리가 됩니다."
 wm_coalition_headline_supply: ": 정부 지지"
 wm_coalition_headline_supply_desc: "[wm_coal_party.GetNameNoTier]은 [wm_coal_pm.GetName] 정부와 신임 및 공급 협정에 합의했습니다. [wm_coal_party_seats|0] 의원들은 신임 투표와 예산안에서 정부를 지지할 것이며, 지도자는 우선순위를 위한 자금을 확보했습니다. 그 외에는 모든 것이 자기 자신을 위한 투표입니다."
 wm_coalition_headline_minority: "소수 정부"
 wm_coalition_headline_minority_desc: "협상은 아무런 성과를 내지 못했습니다. [wm_coal_pm.GetName] [wm_coal_senior_seats|0]석을 가진 소수 정부[wm_coal_senior.GetNameNoTier] 이끌 것이며, 하원에서 모든 표를 힘들게 이겨야 할 것입니다."
 wm_coalition_headline_collapse: "연립 붕괴"
 wm_coalition_headline_collapse_desc: "[wm_coal_party.GetNameNoTier]은 [wm_coal_pm.GetName] 정부를 떠났습니다. 그들의 투표가 없으면 정부는 과반수를 확보하지 못하며, 웨스트민스터는 불신임 투표나 총선을 대비하고 있습니다."

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "헝 의회"
 wm_coalition.1.desc: "국민이 의견을 표명했지만, 정확히 무엇을 말했는지는 아무도 알지 못합니다. [wm_coal_senior.GetNameNoTier]이 가장 큰 정당이며, #bold [wm_coal_senior_seats|0]#! 의석으로, 의회에서 단독으로 표를 얻기 위해 필요한 [wm_coal_majority|0] 의석에는 모자랍니다.\n\n 내각 사무국장은 공무원 협상실을 준비했습니다. 다른 정당의 지도자들은 전화기 근처에서 기다리고 있으며, 언론은 10번가 밖에서 대기 중입니다. 누구에게 전화를 걸까요?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] 석"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] 석"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] 석"
 wm_coalition.1.a: "[wm_coal_choice_1.GetNameNoTier]와의 공개 회담."
 wm_coalition.1.b: "[wm_coal_choice_2.GetNameNoTier]와의 공개 회담."
 wm_coalition.1.c: "[wm_coal_choice_3.GetNameNoTier]와의 공개 회담."
 wm_coalition.1.d: "우리는 단독으로 통치할 것이며, 그들이 우리를 무너뜨리기를 감히 도전할 것이다."
 wm_coalition.1.d.tt: "당신은 #bold 소수 정부#!를 이끕니다: 모든 법안과 신임 투표는 그 날에 표를 확보해야 합니다."

 # The terms
 wm_coalition.2.t: "협상 테이블"
 wm_coalition.2.desc: "[wm_coal_talks.GetNameNoTier] 팀은 [wm_coal_talks_leader.GetName]가 이끄는 상태로 내각 사무처에 도착했으며, 긴 요구 목록을 가지고 있다. 그들은 #bold [wm_coal_talks_seats|0]#! 의원들을 보유하고 있으며, 우리의 것까지 더하면 [wm_coal_combined_seats|0]가 된다."
 wm_coalition.2.majority: "함께하면 우리는 과반수를 차지할 것입니다."
 wm_coalition.2.no_majority: "함께해도 우리는 과반수를 채우지 못하겠지만, 제공되는 최선의 거래입니다."
 wm_coalition.2.mood_warm: "\n\n 분위기는 따뜻합니다. 그들의 협상가들은 우리 공약의 많은 부분에 동의하며 정부에 들어가고 싶어 합니다."
 wm_coalition.2.mood_cool: "\n\n의 분위기는 비즈니스적이다. 그들은 많은 대가를 원할 것이고, 그들의 활동가들은 우리의 실수에 대해 비난받는 것을 경계한다."
 wm_coalition.2.mood_cold: "\n\n 분위기는 냉랭합니다. 우리 정당들은 멀리 떨어져 있고, 그들의 의원들은 우리를 싸게 지지하기보다는 야당에 앉기를 원합니다."
 wm_coalition.2.a: "연립 정부 제안: 부총리 및 내각 한 자리."
 wm_coalition.2.a.tt: "그들의 지도자가 #bold 부총리#!가 되고, 그들 중 한 국회의원이 내각에 들어갑니다. 그들의 국회의원들은 모든 투표에서 정부 당론을 따릅니다."
 wm_coalition.2.b: "연립 정부를 제안하고, 그들의 주요 정책 중 하나를 채택."
 wm_coalition.2.b.tt: "위와 마찬가지로, 그들의 애착 정책은 정부 프로그램에 포함된다. 우리 백벤처 의원들은 좋아하지 않을 것이다: 연합 컨타협#!를 5년간 #bold."
 wm_coalition.2.c: "연립 정부 제안: 내각 두 자리와 그들의 정책 하나 포함."
 wm_coalition.2.c.tt: "그들의 지도자가 #bold 부총리#!가 되고, 두 명의 국회의원이 내각에 들어가며, 그들의 선호 정책이 정부 프로그램에 포함됩니다."
 wm_coalition.2.d: "신뢰와 공급 제공: 돈을 대가로 신뢰와 예산에 대한 그들의 투표."
 wm_coalition.2.d.tt: "그들은 정부에서 벗어나 있지만 #bold 신임 안건#!과 #bold 재정 법안#!에 대해 우리를 지지합니다. 그 대가로 우리는 그들의 우선순위에 자금을 제공합니다: 우리에게 비용이 들고 그들의 지도자에게 지불됩니다."
 wm_coalition.2.e: "다른 파티를 시도해 봅시다."
 wm_coalition_signals_yes_tt: "그들의 협상자들이 이것에 서명할 수 있음을 시사하고 있습니다."
 wm_coalition_signals_no_tt: "그들의 협상자들이 이것으로는 충분하지 않음을 시사하고 있습니다."

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "연합 제안"
 wm_coalition.3.t_supply: "신뢰 및 지원(Confidence-and-Supply) 제안"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName]가 전화를 걸었습니다. [wm_coal_senior.GetNameNoTier]는 [wm_coal_senior_seats|0] 의석을 가진 과반수 부족 상태이며, 우리를 정부에 참여시키려 합니다: 당신은 #bold 부총리#!로, 우리 의원 [wm_coal_offer_seats|0]명이 내각 회의에 참여하게 됩니다. 그 대가로 우리 의원들은 모든 안건에서 정부와 함께 투표합니다."
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName]가 전화를 걸었습니다. [wm_coal_senior.GetNameNoTier]는 [wm_coal_senior_seats|0] 의석을 가진 과반수 부족 상태이며, 우리를 정부에 참여시키려 합니다: 당신은 #bold 부총리#!로, [wm_coal_offer_seats|0]명의 우리 의원들이 내각 회의에 참여하며, 우리의 핵심 정책 중 하나가 정부 프로그램에 포함됩니다. 그 대가로 우리 의원들은 모든 안건에서 정부와 함께 투표합니다."
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName]가 전화를 걸었습니다. [wm_coal_senior.GetNameNoTier]는 [wm_coal_senior_seats|0] 의석을 가진 과반수 부족 상태이며, 신임 및 재정 지원 협정을 원합니다: 우리 의원들은 신임 투표와 예산안에서 정부를 지지하고, 그 대가로 정부는 우리의 우선사항에 자금을 지원합니다. 그 외 모든 사항에 대해서는 자유롭게 투표할 수 있습니다."
 wm_coalition.3.a: "우리는 합의했습니다."
 wm_coalition.3.a.tt: "협정이 서명되면 [wm_coal_pm.GetFirstName]이 당신에게 빚을 지게 됩니다."
 wm_coalition.3.b: "감사합니다, 하지만 아니요."
 wm_coalition.3.b.tt: "우리 의원들은 야당에 남아 자유롭게 정부에 반대하는 투표를 합니다."

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "거래 성사"
 wm_coalition.4.t_refused: "협상 결렬"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName]는 동의했다. [wm_coal_party.GetNameNoTier]가 정부에 합류하고, [wm_coal_leader.GetFirstName]가 총리 부총리가 되며, 언론은 이미 이를 편리한 결혼이라고 부른다. 그 의원들은 우리의 당권을 따를 것이다."
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName]가 동의했습니다. [wm_coal_party.GetNameNoTier]는 일정 비용을 대가로 신임 투표와 재정 법안에서 우리를 지원할 것입니다. 그 외 모든 사항에 대해서는, 당의 고문들이 한 표씩 의원들을 설득해야 합니다."
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName]는 우리를 거절했습니다. [wm_coal_talks.GetNameNoTier]는 우리 제안이 구성원들이 받아들일 수준에 훨씬 미치지 못한다고 말합니다."
 wm_coalition.4.a: "국가를 위한 새로운 장."
 wm_coalition.4.b: "제안을 달게 하다"
 wm_coalition.4.c: "다른 당을 시도해 보세요."
 wm_coalition.4.d: "그러면 우리는 단독으로 통치합니다."

 # Breakdown
 wm_coalition.20.t: "퇴근할 시간인가?"
 wm_coalition.20.desc_coalition: "우리 의원들은 불안해하고 있습니다. 정부가 내리는 모든 인기 없는 결정은 우리에게 떠넘겨지고, [wm_coal_senior.GetNameNoTier]은 잘 된 일에 대해 공을 인정받습니다. 일부는 오늘 우리를 연합에서 나오게 하기를 원합니다."
 wm_coalition.20.desc_supply: "우리 의원들은 불안해하고 있습니다. [wm_coal_pm.GetName]의 정부를 지탱하는 것이 우리에게 비용이 되고 있으며, 우리 우선순위를 위한 자금이 기대했던 감사는 사지 못했습니다. 일부는 오늘 합의를 파기하길 원합니다."
 wm_coalition.20.polls_bad: "\n\n여론조사는 암울하다: 우리는 거래를 한 이후로 크게 하락했다."
 wm_coalition.20.polls_ok: "\n\n현재로서는 여론조사가 잘 버티고 있습니다."
 wm_coalition.20.a: "우리는 나갔다. 정부는 스스로를 방어하게 하라."
 wm_coalition.20.a.tt: "협정이 종료됩니다. 정부는 당신의 의원들의 표를 잃고, 신임 투표 또는 총선을 맞이할 수 있습니다. 총리는 당신을 용서하지 않을 것입니다."
 wm_coalition.20.b: "우리는 약속했습니다. 우리는 남습니다."
 wm_coalition.21.t: "우리 파트너들이 나갔습니다."
 wm_coalition.21.desc: "우리 파트너들이 떠났고, 그들과 함께 우리의 다수도 사라졌습니다. 야당은 혈흔을 맡고 있으며, 언론은 우리가 살아남을 수 있는지 알고 싶어 하고, 수석 엄호자는 이미 인원을 세고 있습니다."
 wm_coalition.21.a: "우리는 소수 정부로 계속합니다."
 wm_coalition.21.a.tt: "하원에서의 모든 표결은 투쟁이 될 것입니다."
 wm_coalition.21.b: "새로운 파트너 찾기"
 wm_coalition.21.c: "나라가 결정하게 하자: 총선을 소집하라."
 wm_coalition.21.c.tt: "의회가 해산되고 5주 후 #bold 총선#!이 시행됩니다."

 # Decision
 wm_coalition_leave_decision: "정부 협정에서 떠나다"
 wm_coalition_leave_decision_desc: "정부와의 거래에서 당을 철수시킴. 의원들은 자유롭게 투표 가능, 정부는 과반수 상실, 총리는 절대 용서하지 않을 것임"
 wm_coalition_leave_decision_tooltip: "연립 정부나 신뢰 및 공급 협정을 끝내라"
 wm_coalition_leave_decision_confirm: "나가다"
 wm_coalition_leave_decision_effect_tt: "협정이 종료됩니다. 정부는 당신의 의원들의 표를 잃고, 신임 투표 또는 총선을 맞이할 수 있습니다."
 wm_coalition_leave_no_election_desc: "총선은 실시되지 않았다"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "부총리"
 wm_coalition_deputy_pm_modifier_desc: "정부에서 두 번째이며, 연립 정부의 소수당 지도자."
 wm_coalition_compromise_modifier: "연립 타협"
 wm_coalition_compromise_modifier_desc: "연합 파트너의 주요 정책 중 하나가 정부 프로그램에 포함되어 있고, 우리 당의 백벤처들도 불만을 가지고 있습니다."
 wm_coalition_supply_deal_modifier: "신뢰 및 지원 협약"
 wm_coalition_supply_deal_modifier_desc: "신임 투표와 예산에서 정부를 지지하며, 우선순위에 대한 자금도 확보함"
 wm_coalition_partner_opinion: "연립 파트너"
 wm_coalition_walked_out_opinion: "우리 정부에서 나갔다"
 wm_coalition_deputyship_diarchy_type: "연립"
 wm_coalition_deputyship_diarch_title: "부총리"
