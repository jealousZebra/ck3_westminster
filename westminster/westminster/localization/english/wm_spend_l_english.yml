l_english:
 # Campaign spending (common/scripted_effects/wm_spend_effects.txt)
 wm_spend_press_decision: "Fund a Press Campaign"
 wm_spend_press_decision_desc: "Buy adverts, sponsor think-tank reports and keep the friendly columnists supplied with stories. A campaign about your party and its policies, paid for every month.\n\nIt costs about #bold [GetPlayer.MakeScope.ScriptValue('wm_spend_press_cost')|1]#! Funds a month (30% of your income). A party leader's campaign lifts the party about 0.15 points a month, settling around 3 points above where it would be; a backbencher's does a fifth as much."
 wm_spend_press_decision_tooltip: "Spend money to lift your party in the polls."
 wm_spend_press_decision_confirm: "Sign the Cheques"
 wm_spend_press_decision_effect_tt: "Each month you pay 30% of your income and your party's poll rises. The campaign runs for up to a year, or until you stop it or the money runs out."
 wm_spend_not_campaigning_tt: "You aren't already paying for a campaign"
 wm_spend_press_afford_tt: "You can afford the first month ([GetPlayer.MakeScope.ScriptValue('wm_spend_press_cost')|1] Funds)"
 wm_spend_smear_afford_tt: "You can afford the first month ([GetPlayer.MakeScope.ScriptValue('wm_spend_smear_cost')|1] Funds)"

 wm_spend_smear_decision: "Fund a Smear Campaign"
 wm_spend_smear_decision_desc: "Attack adverts, rebuttal units and a steady drip of unflattering stories about a rival party's record and its sums. Never anyone's private life: the target is the party and its policies.\n\nIt costs about #bold [GetPlayer.MakeScope.ScriptValue('wm_spend_smear_cost')|1]#! Funds a month (40% of your income). A leader's campaign knocks about 0.2 points a month off the rival, a backbencher's a quarter of that. It wears down public trust, and each month there is a #N [GetPlayer.MakeScope.ScriptValue('wm_spend_backfire_chance')|0]%#! chance it backfires (less for a good schemer): your own party loses a point, trust falls, the rival's leader resents you, and the press keeps the story."
 wm_spend_smear_decision_tooltip: "Spend money to drag a rival party down. It can backfire."
 wm_spend_smear_decision_confirm: "Choose a Target"
 wm_spend_smear_decision_effect_tt: "Choose the rival party. Each month you pay 40% of your income, their poll falls and public trust slips, and the campaign may backfire."

 wm_spend_stop_decision: "Stop Campaign Spending"
 wm_spend_stop_decision_desc: "Cancel the adverts and stop paying for your campaign."
 wm_spend_stop_decision_tooltip: "End your press or smear campaign."
 wm_spend_stop_decision_confirm: "Cancel It"
 wm_spend_stop_decision_effect_tt: "Your campaign ends and you stop paying for it."

 wm_spend_favour_decision: "Call In a Favour"
 wm_spend_favour_decision_desc: "Years of quiet deals between the whips' offices have left a rival party in your debt: a pairing arrangement honoured, a committee seat traded, a vote delivered when it mattered. Spend some of your political capital to make sure their leader remembers it."
 wm_spend_favour_decision_tooltip: "Spend political capital for a favour owed by a rival party's leader."
 wm_spend_favour_decision_confirm: "Make the Call"
 wm_spend_favour_decision_effect_tt: "Choose a rival party's leader: you gain a #bold Favour#! hook on them."
 wm_spend_favour_rival_tt: "Another party has a leader"

 wm_spend.10.t: "The Attack Campaign"
 wm_spend.10.desc: "The agency has the adverts ready and the researchers have been through every costing and every broken pledge. Which party's record do we go after?"
 wm_spend.10.a: "The [wm_spend_party_1.GetNameNoTier]."
 wm_spend.10.b: "The [wm_spend_party_2.GetNameNoTier]."
 wm_spend.10.c: "The [wm_spend_party_3.GetNameNoTier]."
 wm_spend.10.d: "On reflection, let's keep it clean."

 wm_spend.20.t: "A Favour Owed"
 wm_spend.20.desc: "Your Chief Whip has a list of every favour the other parties owe us. Which of their leaders should be reminded?"
 wm_spend.20.a: "[wm_spend_rival_1.GetName] of the [wm_spend_party_1.GetNameNoTier]."
 wm_spend.20.b: "[wm_spend_rival_2.GetName] of the [wm_spend_party_2.GetNameNoTier]."
 wm_spend.20.c: "[wm_spend_rival_3.GetName] of the [wm_spend_party_3.GetNameNoTier]."

 wm_spend_ended_toast: "Campaign Over"
 wm_spend_ended_toast_desc: "Your paid campaign has ended: the year is up, the money ran out, or its target is gone."
 wm_spend_backfire_toast: "DIRTY TRICKS EXPOSED"
 wm_spend_backfire_toast_desc: "A smear campaign against the [wm_spend_target_party.GetNameNoTier] has been traced back to [wm_spend_spender.GetName]. Their party drops a point in the polls and public trust takes another knock."

 wm_secret_smear_campaign: "Smear Campaign"
 wm_secret_smear_campaign_type_desc: "Paid for a smear campaign"
 wm_secret_smear_campaign_desc: "Paid for a smear campaign against a rival party"
 wm_secret_smear_campaign_tooltip_desc: "This character paid for a smear campaign against a rival party, and the press can prove it."
