 wm_ideo_pick_liberal_desc: "Become a Liberal. Personal freedom, fair votes and a close relationship with Europe: the liberal tradition."
 wm_ideo_pick_centrist_desc: "Become a Centrist. Competence over ideology: moderate, pro-business and pragmatic."
 wm_ideo_pick_cross_community_desc: "Become a Cross-community. Neither unionist nor nationalist: a shared future for Northern Ireland's communities."
 wm_ideo_pick_one_nation_desc: "Become an One Nation Conservative. Moderate, paternalist conservatism: social responsibility, stable institutions and the Union."
 wm_ideo_pick_free_market_desc: "Become a Free-marketeer. Lower taxes, deregulation and a smaller state to drive growth."
 wm_ideo_pick_national_conservative_desc: "Become a National Conservative. Family, nation and tradition, with far lower immigration."
 wm_ideo_pick_populist_right_desc: "Become a Populist. Against the Westminster establishment: border control, sovereignty and lower taxes."
 wm_ideo_pick_scottish_nationalist_desc: "Become a Scottish Nationalist. An independent Scotland in Europe, with a social-democratic programme at home."
 wm_ideo_pick_welsh_nationalist_desc: "Become a Welsh Nationalist. Self-government for Wales and the protection of the Welsh language."
