l_english:
 bm_2024_starmer: "2024: A Change of Government"
 bm_2024_starmer_desc: "Labour has won the general election of 4 July 2024 with 411 seats, a majority of 174. Keir Starmer is Prime Minister; the Conservatives, reduced to 121 seats, must choose a new leader; the Liberal Democrats have their best result in a century; and Reform UK, the Greens and a group of independents have broken into the Commons.\n\n#bold Every one of the 650 MPs is playable.#!"
 bm_group_2024: "2024"
 bookmark_2024_keir_starmer: "Keir Starmer"
 bookmark_2024_keir_starmer_subheading: "Prime Minister"
 bookmark_2024_keir_starmer_desc: "Prime Minister with a landslide behind him and a full in-tray in front of him."
 bookmark_2024_rishi_sunak: "Rishi Sunak"
 bookmark_2024_rishi_sunak_subheading: "Leader of the Opposition"
 bookmark_2024_rishi_sunak_desc: "Leader of the Opposition for now, after the Conservatives' worst defeat. His party will soon choose his successor."
 bookmark_2024_ed_davey: "Ed Davey"
 bookmark_2024_ed_davey_subheading: "Leader of the Liberal Democrats"
 bookmark_2024_ed_davey_desc: "Leader of the Liberal Democrats, back as the third party with 72 seats."
 bookmark_2024_sam_carling: "Sam Carling"
 bookmark_2024_sam_carling_subheading: "MP for North West Cambridgeshire"
 bookmark_2024_sam_carling_desc: "The youngest MP in the new Parliament, elected in his early twenties. A long career lies ahead, if he wants it."
