l_english:
 # Party conferences (events/wm_conference_events.txt). Satire is generic: never about a named real person.

 wm_conference.1.t: "Conference: The Leader's Speech"
 wm_conference.1.desc: "It is conference season, and the [wm_conference_party.GetNameNoTier] has taken over a seaside conference centre for four days of fringe meetings, lanyards and lukewarm coffee. Tomorrow is the big one: my speech to the hall, live on every news channel. The speechwriters have produced draft number nineteen. The lozenges are in my pocket. The set has a slogan on it in letters four feet high, and somebody has checked that none of them are loose. Probably."
 wm_conference.1.a: "Deliver the speech as written."
 wm_conference.1.b: "Tear up the script and speak from the heart."
 wm_conference.1.c: "Unveil a set-piece policy announcement."

 wm_conference_headline_triumph: "TRIUMPHANT SPEECH BRINGS HALL TO ITS FEET"
 wm_conference_headline_solid: "LEADER'S SPEECH: 'FINE', SAY DELEGATES"
 wm_conference_headline_disaster: "COUGH-RIDDEN DISASTER AS SET FALLS APART"
 wm_conference_headline_policy_hit: "BOLD PLEDGE STEALS THE SHOW"
 wm_conference_headline_policy_flop: "FLAGSHIP POLICY SINKS BY LUNCHTIME"
 wm_conference.2.desc_triumph: "Eleven standing ovations, one of them during a pause for breath. The sketch writers are struggling to be rude, the overnight polls are up, and the parliamentary party is suddenly very keen to be seen with me in the bar."
 wm_conference.2.desc_solid: "No standing ovations, no disasters, and no letters falling off the backdrop. The papers call it \"workmanlike\", which from them is practically a love letter."
 wm_conference.2.desc_disaster: "It began with a tickle in my throat and ended with a hall full of delegates passing lozenges to the stage while the slogan behind me lost two of its letters. A protester got as far as the lectern. The sketch writers have not had a day like it in years, and in the bar my colleagues are speaking in low voices."
 wm_conference.2.desc_policy_hit: "The policy wasn't trailed, it wasn't leaked, and it leads every bulletin. Rival parties are scrambling to say they thought of it first. The hall chanted my name, which was nice, if a little unsettling."
 wm_conference.2.desc_policy_flop: "By the time I had left the stage, a think tank had found a forty-billion-pound hole in the costings and two of my own front bench had said on the radio that they had never heard of it."
 wm_conference.2.a: "There's always next year."

 wm_conference.10.t: "Conference: Lanyards and Fringe"
 wm_conference.10.desc: "The [wm_conference_party.GetNameNoTier] conference is in full swing: four days of fringe meetings in overheated side rooms, receptions sponsored by trade bodies nobody has heard of, and the hotel bar, where the real business happens after midnight. [wm_conference_leader.GetName] speaks tomorrow. How do I spend my conference?"
 wm_conference.10.a: "Speak at a fringe meeting."
 wm_conference.10.b: "Plot in the hotel bar."
 wm_conference.10.c: "Work the receptions and make contacts."
 wm_conference.10.d: "Sit in the hall and applaud the leader, loudly and visibly."
 wm_conference_fringe_good: "Fringe: A Packed Room and a Good Write-Up"
 wm_conference_fringe_off_message: "Fringe: Remarks 'Go Off-Message'"
 wm_conference_plot_found_out: "Plotting: Overheard by the Whips"

 wm_conference.20.t: "Leadership Rumblings"
 wm_conference.20.desc: "Conference is over, and the talk is not of my speech. Anonymous colleagues are telling the Sunday papers that the [wm_conference_party.GetNameNoTier] needs \"a fresh start\", a phrase that never means a new logo. The whips have names. The question is what I do about it."
 wm_conference.20.a: "Face down the plotters."
 wm_conference.20.b: "Promise to listen to the parliamentary party."
 wm_conference.20.c: "Dismiss it as Westminster bubble chatter."
 wm_conference_faced_down: "Rumblings: Plotters Back Down"
 wm_conference_not_faced_down: "Rumblings: The Story Runs and Runs"

 wm_conference_triumph_modifier: "Conference Triumph"
 wm_conference_triumph_modifier_desc: "Gave a conference speech that people will still be quoting next year, for the right reasons."
 wm_conference_disaster_modifier: "Conference Disaster"
 wm_conference_disaster_modifier_desc: "Gave a conference speech that people will still be quoting next year, for the wrong reasons."

 wm_conference_triumph_opinion: "Triumphant conference speech"
 wm_conference_disaster_opinion: "Disastrous conference speech"
 wm_conference_listened_opinion: "Promised to listen to the party"
 wm_conference_contacts_opinion: "Met at conference"
 wm_conference_fellow_plotter_opinion: "Plotted together in the hotel bar"
 wm_conference_caught_plotting_opinion: "Caught plotting against me"
 wm_conference_loyal_applause_opinion: "Applauded my speech loudest"
 wm_conference_off_message_opinion: "Went off-message at a fringe meeting"
