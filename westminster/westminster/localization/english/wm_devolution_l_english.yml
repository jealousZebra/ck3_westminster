l_english:
 # Devolution (common/scripted_effects/wm_devolution_effects.txt)
 wm_devolution_briefing_decision: "Read the Devolution Briefing"
 wm_devolution_briefing_decision_desc: "The Cabinet Office's weekly note on the state of the Union:\n\n#bold Scotland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10\n#bold Northern Ireland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% back a united Ireland; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10; power-sharing stability [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] of 100\n\n#bold Public trust in politics:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] of 100."
 wm_devolution_briefing_decision_tooltip: "Where the Union stands, and how much the public trusts its politicians."
 wm_devolution_briefing_decision_confirm: "Read It"
 wm_devolution.30.t: "The State of the Union"
 wm_devolution.30.desc: "#italic Cabinet Office, for circulation#!\n\n#bold Scotland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10\n#bold Northern Ireland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% back a united Ireland; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10; power-sharing stability [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] of 100\n\nSupport for leaving drifts with the public's trust in Westminster, with powers clawed back or handed over, and with who runs each devolved government. Once it passes half, a nationalist-led government can formally ask for a referendum.\n\n#bold Public trust in politics:#! [EmptyScope.ScriptValue('wm_ui_public_trust')|0] of 100; expected turnout at a general election [EmptyScope.ScriptValue('wm_ui_trust_turnout')|0]%."
 wm_devolution.30.suspended: "\n\n#N The Northern Ireland Assembly is suspended:#! power-sharing has collapsed, and only talks (or time) will bring it back."
 wm_devolution.30.sitting: "\n\nThe Northern Ireland Assembly is sitting, and power-sharing holds."
 wm_devolution.30.a: "Noted."
 wm_devolution_devolve_decision: "Devolve a Power"
 wm_devolution_devolve_decision_desc: "Hand another power to Edinburgh, Cardiff or Belfast. More powers take the heat out of the case for leaving and please the devolved government.\n\n#bold Scotland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10\n#bold Northern Ireland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% back a united Ireland; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10; power-sharing stability [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] of 100"
 wm_devolution_devolve_decision_tooltip: "Give a devolved government more powers."
 wm_devolution_devolve_decision_confirm: "Choose a Nation"
 wm_devolution_devolve_decision_effect_tt: "Choose a nation: its powers rise by 1, support for leaving falls by #P 3#! points (and settles lower), its First Minister is pleased, and public trust rises by 1."
 wm_devolution_claw_back_decision: "Claw Back a Power"
 wm_devolution_claw_back_decision_desc: "Take a power back to Westminster. The unionist papers will cheer; the devolved government and its voters will not.\n\n#bold Scotland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_scotland')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10\n#bold Wales:#! [EmptyScope.ScriptValue('wm_ui_dev_support_wales')|0]% back independence; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10\n#bold Northern Ireland:#! [EmptyScope.ScriptValue('wm_ui_dev_support_northern_ireland')|0]% back a united Ireland; powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10; power-sharing stability [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] of 100"
 wm_devolution_claw_back_decision_tooltip: "Return a devolved power to Westminster."
 wm_devolution_claw_back_decision_confirm: "Choose a Nation"
 wm_devolution_claw_back_decision_effect_tt: "Choose a nation: its powers fall by 1, support for leaving jumps #N 3#! points (and settles higher), its First Minister is furious, public trust falls by 2, and you gain a little profile."
 wm_devolution_stormont_talks_decision: "Convene Stormont Talks"
 wm_devolution_stormont_talks_decision_desc: "Power-sharing in Northern Ireland has collapsed. Bring the parties to the table for intensive talks: a deal restores the Assembly. Your chance improves with your charisma and with power-sharing's stability (now [EmptyScope.ScriptValue('wm_ui_dev_stability')|0] of 100)."
 wm_devolution_stormont_talks_decision_tooltip: "Try to restore power-sharing at Stormont."
 wm_devolution_stormont_talks_decision_confirm: "Convene the Talks"
 wm_devolution_stormont_talks_decision_effect_tt: "Success restores the Assembly, raises public trust by 2 and earns you profile. Failure still nudges the parties closer (+5 stability)."
 wm_devolution.1.t: "A Request for a Referendum"
 wm_devolution.1.desc: "The [wm_dev_gov.GetNameNoTier] has formally asked Westminster for the power to hold a referendum on leaving the United Kingdom. Its own polling puts support at [wm_dev_gov.MakeScope.Var('wm_dev_support').GetValue|0]%, and it says the mandate is clear.\n\nThe unionist benches want a flat no. Your advisers are less sure."
 wm_devolution.1.a: "Agree to a referendum."
 wm_devolution.1.a.tt: "Polling day in six months. The result depends on support then, give or take a few points. A Yes would be a disaster for you."
 wm_devolution.1.b: "Now is not the time."
 wm_devolution.1.b.tt: "Support for leaving rises by #N 4#! points and the First Minister resents you. They can ask again in three years."
 wm_devolution.1.c: "Offer more powers instead."
 wm_devolution.1.c.tt: "The nation gains a power and support falls by #P 3#! points, at a small cost in profile. They can ask again in three years."
 wm_devolution.20.t: "Devolving Power"
 wm_devolution.20.desc: "Which devolved government gets the new powers?"
 wm_devolution.20.scotland: "Devolve to Scotland (powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10)."
 wm_devolution.20.wales: "Devolve to Wales (powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10)."
 wm_devolution.20.northern_ireland: "Devolve to Northern Ireland (powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10)."
 wm_devolution.20.none: "On second thoughts, not now."
 wm_devolution.21.t: "Taking Back Control"
 wm_devolution.21.desc: "Which devolved government loses a power to Westminster?"
 wm_devolution.21.scotland: "Claw back from Scotland (powers [EmptyScope.ScriptValue('wm_ui_dev_powers_scotland')|0] of 10)."
 wm_devolution.21.wales: "Claw back from Wales (powers [EmptyScope.ScriptValue('wm_ui_dev_powers_wales')|0] of 10)."
 wm_devolution.21.northern_ireland: "Claw back from Northern Ireland (powers [EmptyScope.ScriptValue('wm_ui_dev_powers_northern_ireland')|0] of 10)."
 wm_devolution.21.none: "On second thoughts, not now."
 wm_dev_referendum_agreed_toast: "REFERENDUM AGREED"
 wm_dev_referendum_agreed_toast_desc: "Westminster has agreed to the [wm_dev_gov.GetNameNoTier]'s request: a referendum on leaving the United Kingdom will be held in six months."
 wm_dev_referendum_refused_toast: "REFERENDUM REFUSED"
 wm_dev_referendum_refused_toast_desc: "Westminster has turned down the [wm_dev_gov.GetNameNoTier]'s request for a referendum. Support for leaving rises."
 wm_dev_referendum_powers_toast: "MORE POWERS INSTEAD"
 wm_dev_referendum_powers_toast_desc: "Westminster has answered the [wm_dev_gov.GetNameNoTier]'s request for a referendum with an offer of new powers."
 wm_dev_stormont_collapse_toast: "STORMONT COLLAPSES"
 wm_dev_stormont_collapse_toast_desc: "Power-sharing in Northern Ireland has collapsed and the Assembly is suspended. Public trust takes a knock."
 wm_dev_stormont_restored_toast: "STORMONT RESTORED"
 wm_dev_stormont_restored_toast_desc: "A deal has been struck and power-sharing returns to Northern Ireland."
 wm_dev_stormont_talks_failed_toast: "STORMONT TALKS FAIL"
 wm_dev_stormont_talks_failed_toast_desc: "The talks broke up without a deal, though the parties are closer than they were."
 wm_dev_referendum_yes_toast_scotland: "SCOTLAND VOTES YES"
 wm_dev_referendum_yes_toast_scotland_desc: "Scotland has voted for Scottish independence, by [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Negotiations on leaving the United Kingdom begin, and the Prime Minister's authority is shattered."
 wm_dev_referendum_no_toast_scotland: "SCOTLAND VOTES NO"
 wm_dev_referendum_no_toast_scotland_desc: "Scotland has rejected Scottish independence: only [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% voted Yes. The question is settled for a generation, or so Westminster hopes."
 wm_dev_referendum_yes_toast_wales: "WALES VOTES YES"
 wm_dev_referendum_yes_toast_wales_desc: "Wales has voted for Welsh independence, by [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Negotiations on leaving the United Kingdom begin, and the Prime Minister's authority is shattered."
 wm_dev_referendum_no_toast_wales: "WALES VOTES NO"
 wm_dev_referendum_no_toast_wales_desc: "Wales has rejected Welsh independence: only [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% voted Yes. The question is settled for a generation, or so Westminster hopes."
 wm_dev_referendum_yes_toast_northern_ireland: "NORTHERN IRELAND VOTES YES"
 wm_dev_referendum_yes_toast_northern_ireland_desc: "Northern Ireland has voted for a united Ireland, by [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]%. Negotiations on leaving the United Kingdom begin, and the Prime Minister's authority is shattered."
 wm_dev_referendum_no_toast_northern_ireland: "NORTHERN IRELAND VOTES NO"
 wm_dev_referendum_no_toast_northern_ireland_desc: "Northern Ireland has rejected a united Ireland: only [wm_dev_gov.MakeScope.Var('wm_dev_ref_yes').GetValue|0]% voted Yes. The question is settled for a generation, or so Westminster hopes."
 wm_dev_assembly_suspended_modifier: "Assembly Suspended"
 wm_dev_assembly_suspended_modifier_desc: "Power-sharing has collapsed and the Northern Ireland Assembly is suspended."
