l_english:
 # Riots and protest marches (events/wm_riot_events.txt). They replace vanilla's peasant and popular revolts.
 wm_riot_gathering_toast: "Rioters in [wm_riot_seat.GetName]"
 wm_riot_gathering_toast_desc: "Angry crowds have gathered in [wm_riot_seat.GetName]. [wm_riot_organiser.GetName] is organising a protest march on Westminster."
 wm_riot_marching_toast: "Protest March from [wm_riot_seat.GetName]"
 wm_riot_marching_toast_desc: "The protest march from [wm_riot_seat.GetName] has set off for Westminster, led by [wm_riot_organiser.GetName]. It will arrive within the month with its demands."

 wm_riot_demand_1_desc: "\n\nThey want help with the #bold cost of living#!: bills, rents and food prices have gone through the roof, and they say the government doesn't care."
 wm_riot_demand_2_desc: "\n\nThey want a #bold minister's resignation#!: someone in the Cabinet has to take the blame, and they want a head."
 wm_riot_demand_3_desc: "\n\nThey want a #bold general election#!: the government has no mandate for what it is doing, they say, and the country should decide."
 wm_riot_demand_4_desc: "\n\nThey want a #bold U-turn#!: a policy they hate scrapped, now, with no ifs or buts."

 wm_riot.10.t: "Trouble in [wm_riot_seat.GetName]"
 wm_riot.10.desc: "My constituency office phone hasn't stopped ringing. Hundreds of people are out on the streets of [wm_riot_seat.GetName], shops have their shutters down, and a local activist, [wm_riot_organiser.GetName], is telling the cameras that the crowd will march on Westminster unless somebody listens."
 wm_riot.10.a: "Go out and talk to them."
 wm_riot.10.a.success: "The crowd listens, and goes home"
 wm_riot.10.a.failure: "Heckled off the street"
 wm_riot.10.b: "Say publicly that they have a point."
 wm_riot.10.c: "Keep my head down and let Number 10 deal with it."

 wm_riot.20.t: "The March Reaches Westminster"
 wm_riot.20.desc: "Parliament Square is full of placards. "
 wm_riot.20.desc_first: "The protest march from [wm_riot_seat.GetName] has arrived, and its organiser, [wm_riot_organiser.GetName], has asked to meet me with a list of demands."
 wm_riot.20.desc_bigger: "The march from [wm_riot_seat.GetName] is back, bigger and angrier than before. [wm_riot_organiser.GetName] says there will be no more talks."
 wm_riot.20.desc_gone: "\n\nBy the time I have read the briefing, the crowd has drifted home."
 wm_riot.20.a: "Give them what they want."
 wm_riot.20.b: "Invite the organisers in to talk."
 wm_riot.20.b.success: "A compromise is agreed"
 wm_riot.20.b.failure: "The talks collapse"
 wm_riot.20.c: "Tell the police to clear the square."
 wm_riot.20.c.dispersed: "The police clear the square"
 wm_riot.20.c.violence: "Scenes of violence on the evening news"
 wm_riot.20.d: "Good."

 wm_riot_county_modifier: "Rioting"
 wm_riot_county_modifier_desc: "Angry crowds are on the streets and a protest march is under way."
 wm_riot_demands_met_county_modifier: "Demands Met"
 wm_riot_demands_met_county_modifier_desc: "The government gave the protesters what they wanted."
 wm_riot_compromise_county_modifier: "A Compromise"
 wm_riot_compromise_county_modifier_desc: "The protesters went home with a deal."
 wm_riot_policed_county_modifier: "Protest Broken Up"
 wm_riot_policed_county_modifier_desc: "The police broke up the protest march, and people here haven't forgotten it."
 wm_riot_crackdown_county_modifier: "Police Violence"
 wm_riot_crackdown_county_modifier_desc: "The pictures of the police charging the protest march are still being shared."
 wm_mp_backed_protesters_county_modifier: "MP Backed the Protest"
 wm_mp_backed_protesters_county_modifier_desc: "The local MP stood with the protesters."
 wm_cost_of_living_package_modifier: "Cost-of-Living Package"
 wm_cost_of_living_package_modifier_desc: "Help with bills, paid for by the government."
 wm_u_turn_modifier: "U-Turn"
 wm_u_turn_modifier_desc: "Forced into a humiliating U-turn by a protest march."
 wm_heavy_handed_modifier: "Heavy-Handed"
 wm_heavy_handed_modifier_desc: "Sent the police in against a protest march."
 wm_crackdown_modifier: "Blamed for Police Violence"
 wm_crackdown_modifier_desc: "Policing a protest march turned violent, and the blame landed here."

 wm_forced_to_resign_opinion: "Forced me to resign"
 wm_backed_protesters_opinion: "Sided with the protesters"
 wm_policed_my_constituents_opinion: "Sent the police against my constituents"
