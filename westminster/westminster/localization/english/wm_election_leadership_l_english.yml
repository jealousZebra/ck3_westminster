l_english:
 # Shortlist ballots for party leaders (common/scripted_effects/wm_election_leadership_effects.txt)
 wm_leadership.1.t: "A Leadership Contest"
 wm_leadership.1.desc_vacancy: "The [wm_lead_party.GetNameNoTier] needs a new leader. [wm_lead_party_holder.GetName] is minding the shop for now, but the party will choose for itself.\n\n"
 wm_leadership.1.desc_resign: "[wm_lead_party_holder.GetName] is standing down as leader of the [wm_lead_party.GetNameNoTier], and the race to succeed them has begun.\n\n"
 wm_leadership.1.desc_challenge: "[wm_lead_party_holder.GetName] faces a challenge for the leadership of the [wm_lead_party.GetNameNoTier]. Anyone else who fancies their chances can join in.\n\n"
 wm_leadership.1.rules: "#bold The rules:#! nominations from the party's MPs close in ten days. A candidate needs 15% of them (a challenger 20%) to go forward, and the two best-backed go to a ballot of the members, three weeks later. Members look for a communicator, a record, political capital in the party and the MPs' support."
 wm_leadership.1.a: "Throw my hat into the ring."
 wm_leadership.1.a.tt: "You stand for the leadership. Your colleagues will decide whether to nominate you."
 wm_leadership.1.b: "Not this time."
 wm_leadership.2.t: "A Challenge"
 wm_leadership.2.desc: "[wm_lead_challenger.GetName] has announced a challenge to your leadership of the [wm_lead_party.GetNameNoTier]. If they find enough nominations, the members will choose between you."
 wm_leadership.2.a: "Fight them, and win."
 wm_leadership.2.a.tt: "You are on the ballot as of right. The challenger needs a fifth of the party's MPs to nominate them."
 wm_leadership.2.b: "Stand down with dignity."
 wm_leadership.2.b.tt: "You don't stand. The contest goes on without you, and you lead until there is a winner."
 wm_leadership.3.t: "The Members' Ballot"
 wm_leadership.3.desc: "You have made the shortlist for the leadership of the [wm_lead_party.GetNameNoTier], against [wm_lead_rival.GetName]. Three weeks of hustings, phone banks and interviews lie ahead. The members will decide."
 wm_leadership.3.a: "Tour the constituency parties."
 wm_leadership.3.a.tt: "A campaign of handshakes and hustings: it plays to your #bold charisma#!."
 wm_leadership.3.b: "Set out a serious programme."
 wm_leadership.3.b.tt: "A policy platform: it plays to your #bold economy#! and #bold policy#!."
 wm_leadership.3.c: "Hire the best campaign money can buy."
 wm_leadership.3.c.tt: "Slick videos and a ruthless ground game. Expensive, but it works."
 wm_leadership.3.d: "Let my record speak for itself."
 wm_leadership.4.t: "[wm_lead_news_winner.GetName|U] WINS [wm_lead_news_party.GetAdjective|U] LEADERSHIP"
 wm_leadership.4.t_unopposed: "[wm_lead_news_winner.GetName|U] CROWNED UNOPPOSED"
 wm_leadership.4.t_survives: "[wm_lead_news_winner.GetName|U] SEES OFF CHALLENGE"
 wm_leadership.4.t_failed: "LEADERSHIP CHALLENGE FIZZLES OUT"
 wm_leadership.4.desc_ballot: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nThe members have spoken: [wm_lead_news_winner.GetName] takes [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% of the vote against [wm_lead_news_second.GetName] and is the new leader of the [wm_lead_news_party.GetNameNoTier]. [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] of the party's [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] MPs had nominated them."
 wm_leadership.4.desc_ballot_alone: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\n[wm_lead_news_winner.GetName] is the new leader of the [wm_lead_news_party.GetNameNoTier], with [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% of the members' vote."
 wm_leadership.4.desc_survives: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nThe members have backed their leader: [wm_lead_news_winner.GetName] wins [EmptyScope.ScriptValue('wm_election_leadership_news_share')|1]% of the vote against [wm_lead_news_second.GetName], whose career may not recover."
 wm_leadership.4.desc_unopposed: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nOnly [wm_lead_news_winner.GetName] reached the nominations needed for the ballot, with [EmptyScope.ScriptValue('wm_election_leadership_news_noms')|0] of the party's [EmptyScope.ScriptValue('wm_election_leadership_news_electors')|0] MPs, and is elected leader of the [wm_lead_news_party.GetNameNoTier] unopposed. The members never got a vote."
 wm_leadership.4.desc_failed: "#italic The [wm_lead_news_party.GetNameNoTier]#!\n\nThe challenge to [wm_lead_news_winner.GetName] has failed before it began: no challenger found the nominations needed to force a ballot. The leader is safe, for now."
 wm_leadership.4.a_won: "Now the real work begins."
 wm_leadership.4.a: "The party has chosen."
 wm_leadership.5.t: "After the Count"
 wm_leadership.5.desc: "The general election has gone badly for the [wm_lead_party.GetNameNoTier]. The papers are already writing your political obituary, and some colleagues are not returning calls.\n\nYou could fight on, or announce that you will stand down once the party has chosen a successor."
 wm_leadership.5.a: "I am going nowhere."
 wm_leadership.5.b: "It is time for someone else."
 wm_leadership.5.b.tt: "A leadership contest begins. You don't stand, and you lead until it is over."
 wm_leadership_contest_toast: "Leadership Contest: [wm_lead_party.GetNameNoTier]"
 wm_leadership_contest_toast_desc: "The [wm_lead_party.GetNameNoTier] is choosing a leader: nominations from its MPs, then a ballot of the members."
 wm_leadership_result_toast: "New Leader: [wm_lead_party.GetNameNoTier]"
 wm_leadership_result_toast_desc: "[wm_lead_winner.GetName] leads the [wm_lead_party.GetNameNoTier]."
 wm_leadership_challenge_decision: "Challenge for the Leadership"
 wm_leadership_challenge_decision_desc: "Your party deserves better, and you know who. Declare a challenge: if a fifth of the party's MPs nominate you, the members will choose between you and the leader."
 wm_leadership_challenge_decision_tooltip: "Challenge your party's leader."
 wm_leadership_challenge_decision_confirm: "Declare the challenge"
 wm_leadership_challenge_decision_effect_tt: "A #bold leadership contest#! begins: ten days of nominations from the party's MPs, then a members' ballot. If you lose, the leader won't forget it."
 wm_leadership_no_contest_tt: "No leadership contest is already under way"
 wm_leadership_parliament_sitting_tt: "No general election is under way"
 wm_leadership_challenged_opinion: "Challenged me for the leadership"
 wm_leadership_deposed_opinion: "Took my party from me"
 wm_leadership_gracious_opinion: "A gracious winner"
