l_english:
 # Election campaigns (events/wm_campaign_events.txt). Gaffes are generic: never about a named real person.

 wm_campaign.1.t: "On the Campaign Trail: Week [EmptyScope.ScriptValue('wm_campaign_week_value')|0]"
 wm_campaign.1.desc: "Parliament is dissolved and the battle bus is idling outside. The grid has a slot to fill this week, my phone has 140 unread messages, and somebody has put a rosette on me without asking."
 wm_campaign.1.desc_leader: "\n\nAs leader of the [wm_campaign_party.GetNameNoTier], every move I make is national news. The broadcasters want a head-to-head with [wm_campaign_rival.GetName], and the policy unit has a launch ready to go. Back home, my agent in [wm_campaign_seat.GetNameNoTier] would like to see me at least once before polling day."
 wm_campaign.1.desc_leader_no_rival: "\n\nAs leader of the [wm_campaign_party.GetNameNoTier], every move I make is national news, and the policy unit has a launch ready to go."
 wm_campaign.1.desc_mp: "\n\nThe national campaign has no idea who I am, which is a relief. What matters is [wm_campaign_seat.GetNameNoTier]: the leaflets, the doorsteps, and whether the local paper prints my photo the right way up."
 wm_campaign.1.a: "Hold a big rally."
 wm_campaign.1.b: "Take on [wm_campaign_rival.GetFirstName] in the TV debate."
 wm_campaign.1.c: "Do the TV debate, and bury [wm_campaign_rival.GetFirstName] in statistics."
 wm_campaign.1.d: "Launch a flagship policy."
 wm_campaign.1.e: "Go door-knocking in [wm_campaign_seat.GetNameNoTier]."
 wm_campaign.1.f: "A quiet week at campaign HQ, approving leaflets."

 wm_campaign_rally_success: "Rally: Rapturous Reception"
 wm_campaign_rally_flat: "Rally: Polite Applause"
 wm_campaign_rally_flop: "Rally: Half-Empty Hall"
 wm_campaign_debate_won: "Debate: Instant Polls Call It for You"
 wm_campaign_debate_lost: "Debate: Floundered Under the Lights"
 wm_campaign_debate_wonk_won: "Debate: Death by Spreadsheet (Theirs)"
 wm_campaign_debate_wonk_lost: "Debate: Lost the Audience at 'Fiscal Headroom'"
 wm_campaign_policy_success: "Policy Launch: It Cuts Through"
 wm_campaign_policy_flop: "Policy Launch: Costings Unravel on Breakfast Radio"
 wm_campaign_door_knock: "Door-Knocking: Doorsteps Won Over"

 wm_campaign.2.t: "Gaffe!"
 wm_campaign.2.desc: "My press officer has the face of someone who has just seen tomorrow's front pages. "
 wm_campaign_gaffe_1: "A photographer caught me eating a bacon sandwich at a café stop, and the result is being described online as \"a hostage situation with a breakfast\". It is already a meme, a mug and a ringtone."
 wm_campaign_gaffe_2: "I forgot my microphone was still on after a factory visit, and the whole country has now heard me call a voter \"a bit much, frankly\". She has given four interviews since lunch."
 wm_campaign_gaffe_3: "Asked on live radio how much a pint of milk costs, I said \"about eleven pounds?\" with real confidence. The presenter let the silence run for nine seconds."
 wm_campaign_gaffe_4: "At a photo opportunity I confidently walked through the wrong door, into a cupboard, and the cameras waited for me to come back out. I did, eventually, holding a mop."
 wm_campaign_gaffe_5: "I was filmed holding up one of our leaflets upside down for an entire speech, under a banner that misspelled the name of the constituency. Our own candidate's name, too."
 wm_campaign.2.a: "Laugh it off. Everyone has a bad sandwich day."
 wm_campaign.2.b: "Blame a junior staffer."
 wm_campaign.2.c: "Lean into it: do it again, on purpose, for the cameras."
 wm_campaign_gaffe_shrugged: "Gaffe: The Public Finds It Rather Endearing"
 wm_campaign_gaffe_stuck: "Gaffe: It Leads Every Bulletin"
 wm_campaign_gaffe_viral: "Gaffe: Self-Mockery Goes Viral (in a Good Way)"
 wm_campaign_gaffe_doubled: "Gaffe: \"Doubling Down\" Was Not the Answer"

 wm_campaign_doorstep_county_modifier: "Met Their MP on the Doorstep"
 wm_campaign_doorstep_county_modifier_desc: "Their MP knocked on doors here during the campaign, and remembered to wipe their feet."
 wm_campaign_viral_gaffe_modifier: "Viral Gaffe"
 wm_campaign_viral_gaffe_modifier_desc: "A campaign gaffe that the internet will not let go of."

 wm_campaign_debate_humiliated_opinion: "Beat me in the TV debate"
