l_english:
 # Jobs (common/task_contracts/wm_career_contracts.txt)
 wm_career_contracts_group: "Party Work"
 wm_job_canvassing_contract: "Canvassing"
 wm_job_canvassing_desc_title: "Door-knockers wanted"
 wm_job_canvassing_desc: "[TaskContract.GetEmployer.GetName] needs volunteers on the doorstep this weekend: clipboards, leaflets and a thick skin. The party notices who turns up in the rain."
 wm_job_canvassing_request: "Spend three weeks knocking on doors. Success depends on your [diplomacy|E]."
 wm_job_fundraising_contract: "Fundraising Dinner"
 wm_job_fundraising_desc_title: "Help fill the tables"
 wm_job_fundraising_desc: "[TaskContract.GetEmployer.GetName] is hosting a fundraising dinner and needs someone to sell the tables, chase the donors and keep the raffle honest."
 wm_job_fundraising_request: "Organise the dinner over three weeks. Success depends on your [stewardship|E]."
 wm_job_speechwriting_contract: "Speechwriting"
 wm_job_speechwriting_desc_title: "A speech that lands"
 wm_job_speechwriting_desc: "[TaskContract.GetEmployer.GetName] has a big speech coming up and the current draft is, in the words of their office, 'a hostage video'."
 wm_job_speechwriting_request: "Write the speech over three weeks. Success depends on your [learning|E]."
 wm_job_research_contract: "Opposition Research"
 wm_job_research_desc_title: "Dig into the other side"
 wm_job_research_desc: "[TaskContract.GetEmployer.GetName] wants a briefing on their opponents: voting records, old tweets, broken promises. All of it public, all of it useful."
 wm_job_research_request: "Compile the dossier over three weeks. Success depends on your [intrigue|E]."
 wm_job_phonebank_contract: "Phone Bank"
 wm_job_phonebank_desc_title: "An evening on the phones"
 wm_job_phonebank_desc: "[TaskContract.GetEmployer.GetName]'s office has a list of four hundred members who haven't renewed, a room of borrowed phones and a script nobody has rehearsed."
 wm_job_phonebank_request: "Work through the call list over three weeks. Success depends on your [diplomacy|E]."
 wm_job_policy_paper_contract: "Policy Paper"
 wm_job_policy_paper_desc_title: "Ten pages, fully costed"
 wm_job_policy_paper_desc: "[TaskContract.GetEmployer.GetName] wants something to say about local buses that isn't a slogan: evidence, numbers and a recommendation a minister could sign."
 wm_job_policy_paper_request: "Write the paper over three weeks. Success depends on your [learning|E]."
 wm_job_media_round_contract: "Media Round"
 wm_job_media_round_desc_title: "Six studios before breakfast"
 wm_job_media_round_desc: "Local radio, regional television and two podcasts want someone from [TaskContract.GetEmployer.GetName]'s side to go on and defend the line. Nobody else volunteered."
 wm_job_media_round_request: "Prepare the lines and do the interviews over three weeks. Success depends on your [intrigue|E]."
 wm_job_gotv_contract: "Get Out the Vote"
 wm_job_gotv_desc_title: "Knock them up, get them out"
 wm_job_gotv_desc: "[TaskContract.GetEmployer.GetName]'s team needs runners for the council by-election: polling cards, tellers' numbers and a lot of stairs in a lot of tower blocks."
 wm_job_gotv_request: "Run the get-out-the-vote operation over three weeks. Success depends on your [prowess|E]."
 wm_job_budget_contract: "Costing a Pledge"
 wm_job_budget_desc_title: "Where's the money coming from?"
 wm_job_budget_desc: "[TaskContract.GetEmployer.GetName] has promised something expensive and the other side keeps asking how it will be paid for. A spreadsheet is needed, urgently."
 wm_job_budget_request: "Cost the pledge over three weeks. Success depends on your [stewardship|E]."
 wm_selection_contract: "Candidate Assessment"
 wm_selection_contract_contract: "Candidate Assessment"
 wm_selection_contract_desc_title: "The party's approved list"
 wm_selection_contract_desc: "Before anyone can stand for the party they must pass an assessment day: a mock interview, a policy test and a role-play with an angry 'constituent'."
 wm_selection_contract_request: "Pass the assessment to join the approved candidates list. Success depends on your [diplomacy|E]."

 # Selections (events/wm_career_events.txt)
 wm_career.20.t: "Applications Open in [wm_sel_seat.GetName]"
 wm_career.20.desc: "The local [wm_sel_party.GetName] is choosing its candidate for [wm_sel_seat.GetName]. The email from the constituency chair is short: applications close in a few weeks, and there will be hustings in the community centre.\n\nPeople who stand in seats like this become MPs."
 wm_career.20.a: "Put my name forward."
 wm_career.20.b: "Not this one."
 wm_career.21.t: "Hustings in [wm_sel_seat.GetName]"
 wm_career.21.desc: "Plastic chairs, a tea urn and sixty party members who have heard every pitch before. Each applicant gets ten minutes and questions from the floor. How do I win them over?"
 wm_career.21.a: "Talk about the area: its high street, its buses, its people."
 wm_career.21.b: "Set out a costed plan, policy by policy."
 wm_career.21.c: "Gently remind them what the other applicants have said in the past."
 wm_career.21.success: "The room warmed to you"
 wm_career.21.failure: "The room stayed cold"

 wm_career_selected_toast: "Selected for [wm_sel_seat.GetName]"
 wm_career_selected_toast_desc: "The local [wm_sel_party.GetName] has chosen you as its candidate. Win the seat at the next election or by-election and you are an MP."
 wm_career_not_selected_toast: "Not Selected in [wm_sel_seat.GetName]"
 wm_career_not_selected_toast_desc: "The members chose [wm_sel_winner.GetName]. You'll be better known next time."
 wm_career_elected_toast: "Elected to Parliament"
 wm_career_elected_toast_desc: "The count is in and the seat is yours. The campaign team is wound up; your party's whips will be in touch."

 # Decisions (common/decisions/wm_career_decisions.txt)
 wm_career_apply_decision: "Apply for Selection"
 wm_career_apply_decision_desc: "Put my name forward to be my party's candidate in a seat where the local members are choosing one. Party Standing: [GetPlayer.MakeScope.Var('wm_standing').GetValue|0]."
 wm_career_apply_decision_tooltip: "Apply to be the party's candidate for a seat"
 wm_career_apply_decision_free_tt: "Not already applying for a seat or selected as a candidate"
 wm_career_apply_decision_standing_tt: "On the party's approved candidates list, or with a Party Standing of at least 30"
 wm_career_apply_decision_open_tt: "The party is choosing a candidate somewhere"
 wm_career_apply_decision_effect_tt: "You apply to one of the selections the party has open, preferably in your own nation, and speak at its hustings."
 wm_career_return_decision: "Back on the Campaign Trail"
 wm_career_return_decision_desc: "The voters have spoken, and they can change their minds. Put together a campaign team and look for a seat."
 wm_career_return_decision_tooltip: "Seek selection again after losing your seat"
 wm_career_return_decision_effect_tt: "You get a campaign team, join the party's approved candidates list and can apply for selections."

 # Opinions (common/opinion_modifiers/wm_career_opinions.txt)
 wm_career_good_work_opinion: "Did Good Work for Me"
 wm_career_poor_work_opinion: "Let Me Down"
 wm_career_apply_decision_confirm: "Submit My Application"
 wm_career_return_decision_confirm: "Back to the Doorsteps"
