l_english:
 # Coalitions, confidence-and-supply and minority government (events/wm_coalition_events.txt)

 # Headlines (toasts for every player)
 wm_coalition_headline_coalition: "COALITION AGREED"
 wm_coalition_headline_coalition_desc: "[wm_coal_pm.GetName] and [wm_coal_leader.GetName] have shaken hands on the steps of Number 10. The [wm_coal_party.GetNameNoTier] ([wm_coal_party_seats|0] seats) joins the [wm_coal_senior.GetNameNoTier] ([wm_coal_senior_seats|0]) in government, and [wm_coal_leader.GetFirstName] becomes Deputy Prime Minister."
 wm_coalition_headline_supply: "DEAL DONE: GOVERNMENT PROPPED UP"
 wm_coalition_headline_supply_desc: "The [wm_coal_party.GetNameNoTier] has agreed a confidence-and-supply deal with [wm_coal_pm.GetName]'s government. Its [wm_coal_party_seats|0] MPs will back the government on confidence votes and the Budget, and its leader has secured money for their priorities. On everything else, it's every vote for itself."
 wm_coalition_headline_minority: "MINORITY GOVERNMENT"
 wm_coalition_headline_minority_desc: "Talks have come to nothing. [wm_coal_pm.GetName] will lead a minority [wm_coal_senior.GetNameNoTier] government with [wm_coal_senior_seats|0] seats, and will have to win every vote in the Commons the hard way."
 wm_coalition_headline_collapse: "COALITION COLLAPSES"
 wm_coalition_headline_collapse_desc: "The [wm_coal_party.GetNameNoTier] has walked out on [wm_coal_pm.GetName]'s government. Without its votes, the government has no majority and Westminster is braced for a vote of no confidence, or an election."

 # Hung parliament: whom to talk to
 wm_coalition.1.t: "Hung Parliament"
 wm_coalition.1.desc: "The country has spoken, and nobody quite knows what it said. The [wm_coal_senior.GetNameNoTier] is the largest party with #bold [wm_coal_senior_seats|0]#! seats, short of the [wm_coal_majority|0] needed to win votes in the Commons on our own.\n\nThe Cabinet Secretary has the civil service's negotiating rooms ready. The other parties' leaders are waiting by their phones, and the press is camped outside Number 10. Who do we call?\n"
 wm_coalition.1.choice_1: "\n#bold [wm_coal_choice_1.GetNameNoTier]:#! [wm_coal_choice_1_seats|0] seats"
 wm_coalition.1.choice_2: "\n#bold [wm_coal_choice_2.GetNameNoTier]:#! [wm_coal_choice_2_seats|0] seats"
 wm_coalition.1.choice_3: "\n#bold [wm_coal_choice_3.GetNameNoTier]:#! [wm_coal_choice_3_seats|0] seats"
 wm_coalition.1.a: "Open talks with the [wm_coal_choice_1.GetNameNoTier]."
 wm_coalition.1.b: "Open talks with the [wm_coal_choice_2.GetNameNoTier]."
 wm_coalition.1.c: "Open talks with the [wm_coal_choice_3.GetNameNoTier]."
 wm_coalition.1.d: "We'll govern alone and dare them to bring us down."
 wm_coalition.1.d.tt: "You lead a #bold minority government#!: every bill and every confidence vote must find its votes on the day."

 # The terms
 wm_coalition.2.t: "The Negotiating Table"
 wm_coalition.2.desc: "The [wm_coal_talks.GetNameNoTier] team, led by [wm_coal_talks_leader.GetName], has arrived at the Cabinet Office with a long list of demands. They have #bold [wm_coal_talks_seats|0]#! MPs; with ours, that makes [wm_coal_combined_seats|0]."
 wm_coalition.2.majority: " Together we would have a majority."
 wm_coalition.2.no_majority: " Even together we would fall short of a majority, but it is the best deal on offer."
 wm_coalition.2.mood_warm: "\n\nThe mood is warm. Their negotiators agree with much of our manifesto and want to be in government."
 wm_coalition.2.mood_cool: "\n\nThe mood is businesslike. They will want a lot in return, and their activists are wary of being blamed for our mistakes."
 wm_coalition.2.mood_cold: "\n\nThe mood is frosty. Our parties are far apart, and their MPs would rather sit in opposition than prop us up cheaply."
 wm_coalition.2.a: "Offer a coalition: Deputy Prime Minister and one Cabinet seat."
 wm_coalition.2.a.tt: "Their leader becomes #bold Deputy Prime Minister#! and one of their MPs joins the Cabinet. Their MPs take the government whip on every vote."
 wm_coalition.2.b: "Offer a coalition, and adopt one of their flagship policies."
 wm_coalition.2.b.tt: "As above, and their pet policy goes into the programme for government. Our own backbenchers won't love it: #bold Coalition Compromise#! for five years."
 wm_coalition.2.c: "Offer a coalition with two Cabinet seats and one of their policies."
 wm_coalition.2.c.tt: "Their leader becomes #bold Deputy Prime Minister#!, two of their MPs join the Cabinet, and their pet policy goes into the programme for government."
 wm_coalition.2.d: "Offer confidence-and-supply: their votes on confidence and the Budget, for money."
 wm_coalition.2.d.tt: "They stay out of government but back us on #bold motions of no confidence#! and the #bold Finance Bill#!. In return we fund their priorities: it costs us money and pays it to their leader."
 wm_coalition.2.e: "Let's try another party."
 wm_coalition_signals_yes_tt: "Their negotiators are signalling that they could sign this."
 wm_coalition_signals_no_tt: "Their negotiators are signalling that this won't be enough."

 # A player party leader receives an offer
 wm_coalition.3.t_coalition: "An Offer of Coalition"
 wm_coalition.3.t_supply: "An Offer of Confidence-and-Supply"
 wm_coalition.3.desc_coalition: "[wm_coal_pm.GetName] has called. The [wm_coal_senior.GetNameNoTier] has [wm_coal_senior_seats|0] seats, short of a majority, and wants us in government: you as #bold Deputy Prime Minister#! and [wm_coal_offer_seats|0] of our MPs around the Cabinet table. In return our MPs would vote with the government on everything."
 wm_coalition.3.desc_coalition_policy: "[wm_coal_pm.GetName] has called. The [wm_coal_senior.GetNameNoTier] has [wm_coal_senior_seats|0] seats, short of a majority, and wants us in government: you as #bold Deputy Prime Minister#!, [wm_coal_offer_seats|0] of our MPs around the Cabinet table, and one of our flagship policies in the programme for government. In return our MPs would vote with the government on everything."
 wm_coalition.3.desc_supply: "[wm_coal_pm.GetName] has called. The [wm_coal_senior.GetNameNoTier] has [wm_coal_senior_seats|0] seats, short of a majority, and wants a confidence-and-supply deal: our MPs back the government on confidence votes and the Budget, and in return the government funds our priorities. On everything else we would be free to vote as we like."
 wm_coalition.3.a: "We have a deal."
 wm_coalition.3.a.tt: "The deal is signed, and [wm_coal_pm.GetFirstName] will owe you."
 wm_coalition.3.b: "Thank you, but no."
 wm_coalition.3.b.tt: "Our MPs stay in opposition, free to vote against the government."

 # The Prime Minister hears back
 wm_coalition.4.t_accepted: "A Deal Is Done"
 wm_coalition.4.t_refused: "Talks Break Down"
 wm_coalition.4.desc_coalition: "[wm_coal_leader.GetName] has agreed. The [wm_coal_party.GetNameNoTier] joins the government, [wm_coal_leader.GetFirstName] becomes Deputy Prime Minister, and the press is already calling it a marriage of convenience. Its MPs will take our whip."
 wm_coalition.4.desc_supply: "[wm_coal_leader.GetName] has agreed. The [wm_coal_party.GetNameNoTier] will back us on confidence votes and the Finance Bill, for a price. On everything else, the whips will have to win its MPs over one vote at a time."
 wm_coalition.4.desc_refused: "[wm_coal_talks_leader.GetName] has turned us down. The [wm_coal_talks.GetNameNoTier] says our offer falls well short of what its members would accept."
 wm_coalition.4.a: "A new chapter for the country."
 wm_coalition.4.b: "Sweeten the offer."
 wm_coalition.4.c: "Try another party."
 wm_coalition.4.d: "Then we govern alone."

 # Breakdown
 wm_coalition.20.t: "Time to Walk Out?"
 wm_coalition.20.desc_coalition: "Our MPs are restless. Every unpopular decision the government makes is pinned on us, and the [wm_coal_senior.GetNameNoTier] takes the credit for anything that goes well. Some want us out of the coalition today."
 wm_coalition.20.desc_supply: "Our MPs are restless. Propping up [wm_coal_pm.GetName]'s government is costing us, and the money for our priorities hasn't bought the gratitude we hoped for. Some want to tear up the deal today."
 wm_coalition.20.polls_bad: "\n\nThe polls are grim: we are well down since we did the deal."
 wm_coalition.20.polls_ok: "\n\nThe polls are holding up, for now."
 wm_coalition.20.a: "We're out. Let the government fend for itself."
 wm_coalition.20.a.tt: "The deal ends. The government loses your MPs' votes and may face a vote of no confidence or an election. The Prime Minister won't forgive you."
 wm_coalition.20.b: "We gave our word. We stay."
 wm_coalition.21.t: "Our Partners Walk Out"
 wm_coalition.21.desc: "Our partners have walked out, and with them our majority. The Opposition smells blood, the press wants to know if we can survive, and the Chief Whip is already counting heads."
 wm_coalition.21.a: "We carry on as a minority government."
 wm_coalition.21.a.tt: "Every vote in the Commons will be a struggle."
 wm_coalition.21.b: "Find new partners."
 wm_coalition.21.c: "Let the country decide: call a general election."
 wm_coalition.21.c.tt: "Parliament is dissolved and a #bold general election#! is held in five weeks."

 # Decision
 wm_coalition_leave_decision: "Leave the Government Deal"
 wm_coalition_leave_decision_desc: "Pull your party out of its deal with the government. Your MPs will be free to vote as they like, the government will lose its majority, and the Prime Minister will never forgive you."
 wm_coalition_leave_decision_tooltip: "End your coalition or confidence-and-supply deal"
 wm_coalition_leave_decision_confirm: "Walk out"
 wm_coalition_leave_decision_effect_tt: "The deal ends. The government loses your MPs' votes and may face a vote of no confidence or an election."
 wm_coalition_leave_no_election_desc: "No general election has been called"

 # Modifiers, opinions, the Deputy Prime Minister
 wm_coalition_deputy_pm_modifier: "Deputy Prime Minister"
 wm_coalition_deputy_pm_modifier_desc: "Second in the government, and leader of the junior coalition partner."
 wm_coalition_compromise_modifier: "Coalition Compromise"
 wm_coalition_compromise_modifier_desc: "One of the coalition partner's flagship policies is in the programme for government, and our own backbenchers are grumbling."
 wm_coalition_supply_deal_modifier: "Confidence-and-Supply Deal"
 wm_coalition_supply_deal_modifier_desc: "Props up the government on confidence votes and the Budget, and has money for their priorities to show for it."
 wm_coalition_partner_opinion: "Coalition Partner"
 wm_coalition_walked_out_opinion: "Walked Out of Our Government"
 wm_coalition_deputyship_diarchy_type: "Coalition"
 wm_coalition_deputyship_diarch_title: "Deputy Prime Minister"
