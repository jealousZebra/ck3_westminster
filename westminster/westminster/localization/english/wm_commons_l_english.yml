l_english:
 # House of Commons: bills, whips, divisions and confidence motions (events/wm_commons_events.txt)

 wm_commons_introduce_bill_decision: "Introduce a Bill"
 wm_commons_introduce_bill_decision_desc: "Put a government bill before the House of Commons. The whips will count heads, the backbenches will grumble, and in a week the House divides."
 wm_commons_introduce_bill_decision_tooltip: "Put a government bill to a vote in the Commons"
 wm_commons_introduce_bill_decision_effect_tt: "Choose a bill. The House votes on it a week later."
 wm_commons_no_confidence_decision: "Table a Motion of No Confidence"
 wm_commons_no_confidence_decision_desc: "As Leader of the Opposition, put down a motion that this House has no confidence in His Majesty's Government. If the government loses, there must be a general election."
 wm_commons_no_confidence_decision_tooltip: "Try to bring down the government"
 wm_commons_no_confidence_decision_effect_tt: "The House votes on the motion within the week. If it is carried, a #bold general election#! must be held. If it fails, you lose face and the Prime Minister won't forget it."
 wm_commons_house_free_desc: "No other bill or motion is waiting for a vote in the Commons"
 wm_commons_no_election_pending_desc: "No general election has been forced on the government already"
 wm_commons_leader_of_opposition_desc: "You lead the largest party outside the government"

 # Bills
 wm_commons_bill_1_name: "#bold The Finance Bill#!"
 wm_commons_bill_2_name: "#bold The Public Services Bill#!"
 wm_commons_bill_3_name: "#bold The Public Service Reform Bill#!"
 wm_commons_bill_4_name: "#bold The Emergency Powers Bill#!"
 wm_commons_bill_5_name: "#bold The motion of no confidence in His Majesty's Government#!"
 wm_commons_bill_1_desc: "\n\nThe #bold Finance Bill#! puts up taxes to balance the books. The party's right wing hates it; the left can live with it."
 wm_commons_bill_2_desc: "\n\nThe #bold Public Services Bill#! puts more money into schools and hospitals. It is popular, and the left wing loves it; the right wing worries about the cost."
 wm_commons_bill_3_desc: "\n\nThe #bold Public Service Reform Bill#! shakes up how public services are run. The right wing has wanted it for years. The left wing calls it a betrayal, and some of them are threatening to vote against."
 wm_commons_bill_4_desc: "\n\nThe #bold Emergency Powers Bill#! gives ministers sweeping powers to deal with the crisis. Nobody likes it much, but in a crisis the country expects Parliament to act."
 wm_commons_bill_5_desc: "\n\n[wm_commons_mover.GetName], as Leader of the Opposition, has tabled a #bold motion of no confidence#! in the government. If it is carried, there must be a general election."

 wm_commons.1.t: "The Legislative Programme"
 wm_commons.1.desc: "The Leader of the House wants to know what the government is putting before the Commons next. The civil servants have drafted several bills, each with its friends and enemies on our own benches."
 wm_commons.1.a: "A Finance Bill: taxes must go up."
 wm_commons.1.a.tt: "If passed: money for the government and a tax rise, but the polls won't like it. The party's #bold right wing#! may rebel."
 wm_commons.1.b: "A Public Services Bill: more money for schools and hospitals."
 wm_commons.1.b.tt: "If passed: popular, and good for the polls, but it costs money for years. The party's #bold right wing#! may grumble."
 wm_commons.1.c: "A Public Service Reform Bill: time for real change."
 wm_commons.1.c.tt: "If passed: mandate and a reformer's reputation. #bold Controversial#!: the party's #bold left wing#! may rebel in numbers."
 wm_commons.1.d: "An Emergency Powers Bill: the country needs it."
 wm_commons.1.d.tt: "If passed: profile and mandate. The opposition may well back it."
 wm_commons.1.e: "Nothing for now."

 # The whips
 wm_commons.2.t: "The Chief Whip's Report"
 wm_commons.2.t_confidence: "A Motion of No Confidence"
 wm_commons.2.desc_bill: "The Chief Whip has been counting heads in the tea room."
 wm_commons.2.desc_confidence: "The Opposition has put down a motion to bring the government down, and the Chief Whip is already in my office."
 wm_commons.2.numbers: "\n\nWe have #bold [EmptyScope.ScriptValue('wm_commons_gov_mps_value')|0]#! MPs; there are [EmptyScope.ScriptValue('wm_commons_opp_mps_value')|0] on the other benches. The Chief Whip reckons around #bold [EmptyScope.ScriptValue('wm_commons_forecast_rebels_value')|0]#! of ours could rebel or stay away."
 wm_commons.2.opposition_backs: " The Opposition front bench has said it will back us."
 wm_commons.2.no_opposition_help: " The Opposition will vote against."
 wm_commons.2.a: "Leave it to the whips."
 wm_commons.2.b: "Issue a three-line whip. My authority is on the line."
 wm_commons.2.c: "Call the waverers in, one by one. Every constituency needs something."
 wm_commons.2.d: "Offer concessions."
 wm_commons.2.d.tt: "Fewer MPs rebel, but a bill is #bold watered down#!: it does about half as much if it passes."
 wm_commons.2.e: "Pull the bill before it is defeated."

 # The result
 wm_commons_headline_government_falls: "GOVERNMENT FALLS"
 wm_commons_headline_pm_survives: "PRIME MINISTER SURVIVES CONFIDENCE VOTE"
 wm_commons_headline_humiliation: "HUMILIATION FOR NUMBER 10"
 wm_commons_headline_defeated: "GOVERNMENT DEFEATED"
 wm_commons_headline_knife_edge: "KNIFE-EDGE: GOVERNMENT SCRAPES HOME"
 wm_commons_headline_revolt: "BILL PASSES DESPITE BACKBENCH REVOLT"
 wm_commons_headline_comfortable: "COMFORTABLE MAJORITY"
 wm_commons_headline_passed: "BILL PASSES"

 wm_commons.4.lobbies: "\n\nThe division lobbies: #bold Ayes [EmptyScope.ScriptValue('wm_commons_ayes_value')|0], Noes [EmptyScope.ScriptValue('wm_commons_noes_value')|0]#!. [EmptyScope.ScriptValue('wm_commons_abstentions_value')|0] MPs did not vote."
 wm_commons.4.rebels: " #bold [EmptyScope.ScriptValue('wm_commons_gov_rebels_value')|0]#! government MPs defied the whip."
 wm_commons.4.no_rebels: " Not a single government MP defied the whip."
 wm_commons.4.outcome_government_falls: "\n\nThe House has no confidence in [wm_commons_pm.GetName]'s government. There must be a #bold general election#!."
 wm_commons.4.outcome_pm_survives: "\n\n[wm_commons_pm.GetName] survives by [EmptyScope.ScriptValue('wm_commons_majority_value')|0] votes, and the Opposition has egg on its face."
 wm_commons.4.outcome_defeated: "\n\nThe bill falls, defeated by [EmptyScope.ScriptValue('wm_commons_majority_value')|0] votes. [wm_commons_pm.GetName] has lost control of the House."
 wm_commons.4.outcome_passed_watered_down: "\n\nThe bill passes with a majority of [EmptyScope.ScriptValue('wm_commons_majority_value')|0], but only after the government gave ground on almost everything."
 wm_commons.4.outcome_passed: "\n\nThe bill passes with a majority of [EmptyScope.ScriptValue('wm_commons_majority_value')|0]."
 wm_commons.4.a: "Order, order!"
 wm_commons.4.a_pm: "On to the next one."

 # The division bell
 wm_commons.5.t: "The Division Bell"
 wm_commons.5.desc: "The division bell is ringing all over the Palace of Westminster. In a few minutes the House votes."
 wm_commons.5.whip_none: "\n\nWith no party whip, I can vote however I like."
 wm_commons.5.whip_abstain: "\n\nMy party doesn't take its seats at Westminster. I won't be voting."
 wm_commons.5.whip_government: "\n\nThe whips want every one of us in the lobby #bold with the government#!. Rebels will be remembered."
 wm_commons.5.whip_opposition_backs: "\n\nOur front bench is backing the government on this one, and the whips expect me to follow."
 wm_commons.5.whip_opposition: "\n\nOur whips want me in the lobby #bold against the government#!."
 wm_commons.5.wing_left: " I sit on the #bold left#! of my party."
 wm_commons.5.wing_right: " I sit on the #bold right#! of my party."
 wm_commons.5.wing_centre: " I sit in the #bold centre#! of my party."
 wm_commons.5.a: "Vote with the government."
 wm_commons.5.b: "Vote against the government."
 wm_commons.5.c: "Stay away and abstain."

 wm_commons_whip_withdrawn_toast: "Whip Withdrawn"
 wm_commons_whip_withdrawn_toast_desc: "After rebelling once too often, [wm_commons_whipless.GetName] has lost the party whip and now sits as an independent."

 # Modifiers
 wm_commons_tax_rise_modifier: "Tax Rise"
 wm_commons_tax_rise_modifier_desc: "The Finance Bill put up taxes. The money is coming in, and the voters have noticed."
 wm_commons_public_services_modifier: "Public Services Spending"
 wm_commons_public_services_modifier_desc: "More money for schools and hospitals: popular, and expensive."
 wm_commons_reformer_modifier: "Reformer"
 wm_commons_reformer_modifier_desc: "Got a controversial reform through the Commons."
 wm_commons_emergency_powers_modifier: "Emergency Powers"
 wm_commons_emergency_powers_modifier_desc: "Parliament gave the government sweeping powers to deal with a crisis."
 wm_commons_defeated_in_commons_modifier: "Defeated in the Commons"
 wm_commons_defeated_in_commons_modifier_desc: "A government bill was voted down by the House of Commons."
 wm_commons_lost_confidence_modifier: "Lost the Confidence of the House"
 wm_commons_lost_confidence_modifier_desc: "The House of Commons voted that it has no confidence in this government."

 # Opinions
 wm_commons_defied_whip_opinion: "Defied the whip"
 wm_commons_whip_withdrawn_opinion: "Withdrew the whip from me"
 wm_commons_tabled_no_confidence_opinion: "Tried to bring down my government"
 wm_commons_introduce_bill_decision_confirm: "Put It to the House"
 wm_commons_no_confidence_decision_confirm: "Table the Motion"
