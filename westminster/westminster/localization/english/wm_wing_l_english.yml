l_english:
 # Party wings (common/scripted_effects/wm_wing_effects.txt). Wings of real MPs are random, not their views.
 wm_wing_badge_1: "Labour Left"
 wm_wing_badge_1_desc: "A member of the party's socialist left: public ownership, union rights and spending. (A real MP's wing in this game is random, not a statement of their views.)"
 wm_wing_badge_2: "Soft Left"
 wm_wing_badge_2_desc: "A member of the party's soft left: the leadership's critical friends, keen on public services. (A real MP's wing in this game is random, not a statement of their views.)"
 wm_wing_badge_3: "Labour Centrists"
 wm_wing_badge_3_desc: "A member of the party's centrists: fiscal caution, reform of public services, electability first. (A real MP's wing in this game is random, not a statement of their views.)"
 wm_wing_badge_4: "One Nation"
 wm_wing_badge_4_desc: "A member of the party's One Nation moderates: pragmatic, pro-public services. (A real MP's wing in this game is random, not a statement of their views.)"
 wm_wing_badge_5: "Free-marketeers"
 wm_wing_badge_5_desc: "A member of the party's free-marketeers: lower taxes, a smaller state, deregulation. (A real MP's wing in this game is random, not a statement of their views.)"
 wm_wing_badge_6: "Traditionalists"
 wm_wing_badge_6_desc: "A member of the party's traditionalists: law and order, institutions, national identity. (A real MP's wing in this game is random, not a statement of their views.)"
 wm_wing_court_decision: "Court a Party Wing"
 wm_wing_court_decision_desc_labour: "How the Parliamentary Labour Party's wings feel about their leader (out of 100):\n#bold Labour Left#! ([EmptyScope.ScriptValue('wm_ui_wing_size_1')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0]\n#bold Soft Left#! ([EmptyScope.ScriptValue('wm_ui_wing_size_2')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0]\n#bold Labour Centrists#! ([EmptyScope.ScriptValue('wm_ui_wing_size_3')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0]\n\nCourting a wing costs #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! profile: it gains 15 approval, the others lose 4. A wing without a seat in your Cabinet (or shadow cabinet) loses approval every month; one under 30 grumbles and rebels in the Commons, and one under 15 for three months mounts a leadership challenge."
 wm_wing_court_decision_desc_conservative: "How the Conservative wings feel about their leader (out of 100):\n#bold One Nation#! ([EmptyScope.ScriptValue('wm_ui_wing_size_4')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0]\n#bold Free-marketeers#! ([EmptyScope.ScriptValue('wm_ui_wing_size_5')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0]\n#bold Traditionalists#! ([EmptyScope.ScriptValue('wm_ui_wing_size_6')|0] MPs): approval [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0]\n\nCourting a wing costs #N [EmptyScope.ScriptValue('wm_wing_court_cost')|0]#! profile: it gains 15 approval, the others lose 4. A wing without a seat in your Cabinet (or shadow cabinet) loses approval every month; one under 30 grumbles and rebels in the Commons, and one under 15 for three months mounts a leadership challenge."
 wm_wing_court_decision_tooltip: "Keep the party's wings on side."
 wm_wing_court_decision_confirm: "Choose a Wing"
 wm_wing_court_decision_effect_tt: "Choose a wing: its approval of you rises by #P 15#!, every other wing's falls by #N 4#!."
 wm_wing.1.t: "Keeping the Party Together"
 wm_wing.1.desc: "A keynote speech, a policy nod, a promise of promotions to come. Which wing of the party needs the attention?"
 wm_wing.1.w1: "Reach out to the Labour Left (approval [EmptyScope.ScriptValue('wm_ui_wing_approval_1')|0])."
 wm_wing.1.w2: "Reach out to the Soft Left (approval [EmptyScope.ScriptValue('wm_ui_wing_approval_2')|0])."
 wm_wing.1.w3: "Reach out to the Labour Centrists (approval [EmptyScope.ScriptValue('wm_ui_wing_approval_3')|0])."
 wm_wing.1.w4: "Reach out to the One Nation (approval [EmptyScope.ScriptValue('wm_ui_wing_approval_4')|0])."
 wm_wing.1.w5: "Reach out to the Free-marketeers (approval [EmptyScope.ScriptValue('wm_ui_wing_approval_5')|0])."
 wm_wing.1.w6: "Reach out to the Traditionalists (approval [EmptyScope.ScriptValue('wm_ui_wing_approval_6')|0])."
 wm_wing.10.t: "A Leadership Challenge"
 wm_wing.10.desc: "The letters are in. A wing of the parliamentary party has lost patience and put up [wm_wing_challenger.GetName] to challenge you for the leadership. The papers are counting names, the broadcasters have their graphics ready, and your phone hasn't stopped ringing.\n\nYou can give the rebels what they want, or take them on."
 wm_wing.10.a: "Give them what they want."
 wm_wing.10.a.tt: "You lose #N 300#! profile; the rebel wing's approval rises by #P 30#!, the other wings' falls by #N 4#!."
 wm_wing.10.b: "Face them down."
 wm_wing.10.b.tt: "A #bold charisma#! contest against [wm_wing_challenger.GetName]. Win and the rebellion fizzles; lose and they take the leadership (and Downing Street, if you are Prime Minister)."
 wm_wing_challenge_toast: "LEADERSHIP CHALLENGE"
 wm_wing_challenge_toast_desc_1: "The Labour Left have moved against [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] is challenging for the leadership of the [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_2: "The Soft Left have moved against [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] is challenging for the leadership of the [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_3: "The Labour Centrists have moved against [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] is challenging for the leadership of the [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_4: "The One Nation have moved against [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] is challenging for the leadership of the [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_5: "The Free-marketeers have moved against [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] is challenging for the leadership of the [wm_wing_party.GetNameNoTier]."
 wm_wing_challenge_toast_desc_6: "The Traditionalists have moved against [wm_wing_leader.GetName]: [wm_wing_challenger.GetName] is challenging for the leadership of the [wm_wing_party.GetNameNoTier]."
