l_english:
 # Disputed results (common/scripted_effects/wm_dispute_effects.txt)
 wm_dispute.1.t: "The Count"
 wm_dispute.1.desc: "#italic Returning officer's declaration#!\n\n[wm_dispute_mp.GetName] has been declared the winner in [wm_dispute_seat.GetNameNoTier] by a margin of [EmptyScope.ScriptValue('wm_dispute_show_margin_points')|1] points. "
 wm_dispute.1.close: "It is close enough that the agents are already muttering about bundles of ballots counted twice and a box that arrived late. A recount (a week, [EmptyScope.ScriptValue('wm_dispute_recount_cost')|0] in fees) could change it, perhaps a [EmptyScope.ScriptValue('wm_dispute_show_recount_chance')|0]% chance; an election petition (four months and [EmptyScope.ScriptValue('wm_dispute_court_cost')|0]) could see the result declared void and the seat fought again, perhaps a [EmptyScope.ScriptValue('wm_dispute_show_court_chance')|0]% chance."
 wm_dispute.1.clear: "It isn't close. A recount ([EmptyScope.ScriptValue('wm_dispute_recount_cost')|0]) would very likely change nothing, and the public dislikes a bad loser: contesting it will cost you profile and political capital."
 wm_dispute.1.bad: "It wasn't even close: a thumping defeat. Contesting it would make you a laughing stock and could bring angry supporters onto the streets."
 wm_dispute.1.a: "Congratulate the winner."
 wm_dispute.1.b: "Demand a recount."
 wm_dispute.1.b.tt: "Every ballot paper is counted again. It costs money; if the result wasn't close it costs you profile and political capital too."
 wm_dispute.1.c: "Petition the election court."
 wm_dispute.1.c.tt: "Judges examine the conduct of the election. It is slow and expensive; they may declare the election void and order a fresh by-election, or award costs against you."
 wm_dispute_recount_toast: "Recount in [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_recount_toast_desc: "[wm_dispute_by.GetName] has demanded a recount in [wm_dispute_seat.GetNameNoTier]. The count staff are back at their tables."
 wm_dispute_court_toast: "Election Petition: [wm_dispute_seat.GetNameNoTier]"
 wm_dispute_court_toast_desc: "[wm_dispute_by.GetName] has petitioned the election court over the result in [wm_dispute_seat.GetNameNoTier]. The judges will report in a few months."
 wm_dispute_overturned_toast: "RECOUNT OVERTURNS RESULT"
 wm_dispute_overturned_toast_desc: "After a recount, [wm_dispute_mp.GetName] is declared the MP for [wm_dispute_seat.GetNameNoTier] by a handful of votes."
 wm_dispute_upheld_toast: "Recount Confirms Result"
 wm_dispute_upheld_toast_desc: "The recount in [wm_dispute_seat.GetNameNoTier] confirms [wm_dispute_mp.GetName] as its MP."
 wm_dispute_void_toast: "ELECTION DECLARED VOID"
 wm_dispute_void_toast_desc: "The election court has declared the result in [wm_dispute_seat.GetNameNoTier] void. There will be a fresh by-election."
 wm_dispute_dismissed_toast: "Election Petition Dismissed"
 wm_dispute_dismissed_toast_desc: "The election court has dismissed the petition over [wm_dispute_seat.GetNameNoTier], and awarded costs against the petitioner. [wm_dispute_mp.GetName] stays."
 wm_dispute_national_toast: "REFUSES TO CONCEDE"
 wm_dispute_national_toast_desc: "[wm_dispute_sore_loser.GetName] will not accept the result of the general election. Nothing will change, but supporters are gathering in the streets and the papers are merciless."
 wm_dispute_seat_decision: "Challenge the Count"
 wm_dispute_seat_decision_desc: "You lost your seat, but was the count right? Demand a recount, or petition the election court to declare the election void. If it wasn't close, the public will see a bad loser."
 wm_dispute_seat_decision_tooltip: "Dispute the result in the seat you lost."
 wm_dispute_seat_decision_confirm: "Consider it"
 wm_dispute_seat_decision_effect_tt: "You decide whether to accept the result, demand a #bold recount#! or petition the #bold election court#!."
 wm_dispute_not_disputed_tt: "The result hasn't already been disputed"
 wm_dispute_no_byelection_tt: "The seat isn't waiting for a by-election"
 wm_dispute_national_decision: "Refuse to Concede"
 wm_dispute_national_decision_desc: "The voters have thrown you out of Downing Street. You could refuse to accept it: question the count, the postal votes, the broadcasters. It will change nothing, cost you dearly and bring your angriest supporters onto the streets."
 wm_dispute_national_decision_tooltip: "Refuse to accept the general election result."
 wm_dispute_national_decision_confirm: "Refuse to concede"
 wm_dispute_national_decision_effect_tt: "You lose a great deal of #bold profile and political capital#!, your party falls in the polls, the new Prime Minister resents it, and #bold riots#! may break out."
 wm_dispute_sore_loser_modifier: "Sore Loser"
 wm_dispute_sore_loser_modifier_desc: "Refused to accept the result of a general election."
 wm_dispute_bad_loser_modifier: "Bad Loser"
 wm_dispute_bad_loser_modifier_desc: "Contested a result they had plainly lost."
 wm_dispute_sore_loser_opinion: "Refused to concede"
