 doctrine_clerical_gender_either_descriptive_name: "Unrestricted Genders for Party Officials"
 doctrine_clerical_gender_female_only_desc: "Only women are wise enough interpret [ROOT.Faith.HighGodNamePossessive] will and serve as [ROOT.Faith.PriestFemalePlural] of our ideology."
 doctrine_clerical_gender_female_only_descriptive_name: "Women-restricted Party Officials"
 doctrine_clerical_gender_male_only_desc: "Only men can shoulder the great responsibility of serving as [ROOT.Faith.PriestMalePlural] of our ideology."
 doctrine_clerical_gender_male_only_descriptive_name: "Men-restricted Party Officials"
 doctrine_clerical_succession_conditional_desc: "The right to replace clerical title holders is left unsettled. Such a contested arrangement inevitably drives the ideology toward an [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] are ultimately servants of the party, and so should be able to be hired and fired by their party leader with only small restrictions."
 doctrine_deviancy_virtuous_desc: "The pleasures of the flesh bring us closer to the divine, and thus those who are unshackled by conventional desires are the height of virtue in our ideology."
 doctrine_family_rites_descriptive_name: "Family Burial Ideologies"
 doctrine_family_rites_name: "Family Ideologies"
 doctrine_head_of_faith_name: "Movement Leader"
 doctrine_monasticism_accepted_desc: "Monastic life is permitted but not central to the ideology. The devout may take vows and withdraw to religious houses, yet the tradition does not emphasize monasticism as the ideal path."
 doctrine_monasticism_forbidden_desc: "This ideology explicitly rejects monastic life. Taking the vows is forbidden, and those who bear the monastic trait are considered criminals in the eyes of the ideology."
 doctrine_mythic_literary_desc: "The ideology spreads and persists through stories of divine works, many which are collected in works of literature."
 doctrine_no_head_descriptive_name: "No Movement Leader"
 doctrine_parameter_block_from_create_hof_parameter: "This ideology cannot recreate its [head_of_faith|E] under normal circumstances."
