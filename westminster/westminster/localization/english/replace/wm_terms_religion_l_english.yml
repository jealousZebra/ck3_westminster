 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "If the Ideology has [great_holy_wars|E], the Movement Leader is allowed to direct the war and choose who the war target will be"
 doctrine_pilgrimage_encouraged_desc: "This ideology encourages its members to visit earthly locations deemed to be of spiritual significance as a means of demonstrating reverence for [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_forbidden_desc: "The presence of [ROOT.Faith.HighGodName] can be felt everywhere and the notion that certain places are more divine than others is nothing short of splintering."
 doctrine_pilgrimage_local_rites_desc: "Adherents of this ideology prefer the comfort and stability of routine ideologies at local shrines over the hazards and strain of lengthy pilgrimages."
 doctrine_pilgrimage_local_rites_name: "Local Ideologies"
 doctrine_pluralism_fundamentalist_desc: "Our ideology is the one true ideology, our word the one true word. Any deviation from the [ROOT.Faith.ReligiousText] is inherently blasphemous."
 doctrine_sacraments_absent_desc: "This tradition does not emphasize sacraments or a formal system of sacred ideologies. Religious life is not centered on ritual administration by party officials or the importance of specific ceremonies."
 doctrine_sacraments_general_desc: "The ideology gives sacraments and sacred ideologies central importance. Rituals are not merely symbolic but invoke the presence of the divine. The party officials administer them and the faithful may be excommunicated."
 doctrine_spiritual_head_desc: "The physical world and the spiritual world are not alike. We must ensure the spiritual world has its own leader, to guide us and to protect our ideology from being profaned by physical desires."
 doctrine_status_mainline: "Main Policy Position"
 doctrine_status_rite: "Ideology Policy Position"
 doctrine_status_rite_mainline: "Main Policy Position"
 doctrine_temporal_head_desc: "The spiritual and the physical are intrinsically bound together, whole and inseparable. It is foolish to have two different leaders for one party."
 doctrine_theocracy_lay_clergy_desc: "Any devoted follower is more than capable of understanding, following, and preaching the policy positions of our ideology."
 doctrine_theocracy_lay_clergy_name: "Lay Party Officials"
 doctrine_theocracy_temporal_desc: "Only sanctioned [ROOT.Faith.PriestNeuterPlural] can be entrusted with upholding our ideology's policy positions and, by extension, with managing and caring for our sacred places."
