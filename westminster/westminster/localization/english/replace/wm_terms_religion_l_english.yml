 special_doctrine_ecumenical_miaphysite_desc: "Despite their separate hierarchies, the Miaphysite churches remain in full communion, recognizing one another's sacraments and party officials."
 special_doctrine_full_tolerance_desc: "Everyone is free to chose their own ideology. Our differences do not divide us, they make us stronger."
 special_doctrine_is_christian_faith_desc: "There are those in the world who adhere to the teachings of Jesus without acknowledging his divinity. Though blasphemous, we should still show compassion to these misguided souls, as they may one day become converts to the true ideology."
 special_doctrine_is_eastern_faith_desc: "Together we are bound not by a single ideology, but by the many ideologies that make up the religious fabric of our society. Though we may call ourselves different names and follow different paths, some from outside our own belief system have learned to coexist in our society as if they were one of us."
 special_doctrine_not_allowed_to_hof_desc: "The High Priesthood of this ideology has been completely dismantled. Any attempts to name a High Priest would first require a thorough reconstruction of traditional church structure."
 toggle_challengers_view_tt: "#T Challengers#!\n\n#I Click to view Challengers for this Ideology#!"
 unreformed_faith_doctrine_desc: "An Unreformed Ideology lacks an organized party officials and established canonical policy positions; different communities can nominally follow the same ideology while having wildly different religious practices and beliefs."
