l_english:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 CARDINAL_BENEFICES_GLOSS: "Benefices were local or remote properties, offices, or shared papal revenues that a member of the party officials could be granted #i in commendam#! (in trust). They generated an income, usually without direct administrative responsibilities."
 additional_mandala_government_piety_levels: "The [mandala|E] [government|E] can unlock additional Political Capital Levels after [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] up to, and including, [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]. To achieve that degree of divinity their Loyalty needs to be proven over generations."
 game_concept_absolute_crown_authority_desc: "$game_concept_absolute_crown_authority$ is the highest level of [crown_authority|E]. [vassals|E] have a #N -30#! [opinion|E] penalty toward their [liege|E].\n\nAt this level — in addition to the effects of [high|E] and [limited|E] Crown Authority — the ruler can pick a [designated_heir|E] at a [prestige|E] cost.\n\nFurthermore, backbenchers cannot declare war even against foreign rulers."
 game_concept_acclaimed_knight: "Star Organiser"
 game_concept_acclaimed_knight_desc: "The [knight|E] holding an [accolade|E].\n\nTo be a Star Organiser, an Organiser must be [unlanded|E] or a [baron|E], with at least [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] or more [prowess|E]. A Star Organiser must be eligible for at least one [accolade_type|E] which is not already possessed by another of their [liege|e]'s Star Organisers.\n\nStar Organisers are less likely to be killed or taken prisoner in battle. They may improve their [glory|E] principally by fighting [wars|E] and attending [activities|E] like the [GetActivityType( 'activity_tournament' ).GetName].\n\nAcclaimed organisers may occasionally gain [skills|E] and [traits|E] related to their Accolade's Attributes"
 game_concept_acclaimed_knight_possessive: "Star Organiser's"
 game_concept_acclaimed_knights: "Star Organisers"
 game_concept_accolade_desc: "Accolades are honors given to [knights|E] by their [liege|E].\n\nThe Organiser who holds an Accolade becomes an [acclaimed_knight|E].\n\nAs the Star Organiser gains [glory|E], their [accolade_squires|E] Aptitude increases (improving [accolade_succession|E]) and [accolade_ranks|E] may be gained. These allow more [accolade_types|E] to be unlocked, offering stronger bonuses.\n\nWhen a Star Organiser dies, [accolade_succession|E] takes place and the organiser is immediately replaced with a successor whose skills are modified by [accolade_squires|E] Aptitude.\n\n[innovations|e] and higher [title_tiers|e] allow [rulers|E] to have more Accolades simultaneously."
 game_concept_accolade_squires_desc: "Each [accolade|E] has Squires Aptitude metric, which modifies the [traits|E] and [skills|E] (principally, [prowess_skill|E], [martial_skill|E] and [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]) of its next [acclaimed_knight|E].\n\nThere are 5 levels of Aptitude for Squires:\n$EFFECT_LIST_BULLET$Accomplished\n$EFFECT_LIST_BULLET$Capable\n$EFFECT_LIST_BULLET$Inexperienced\n$EFFECT_LIST_BULLET$Feckless\n$EFFECT_LIST_BULLET$Pathetic\n\nHaving an Aptitude of Inexperienced or higher will cause the Star Organiser to sporadically influence the [traits|E] and [skills|E] of young, martial-gender [courtiers|E], giving them priority to assume the Accolade upon [accolade_succession|E]\n\nSquires are principally improved by [glory|E] gain, but also:\n$EFFECT_LIST_BULLET$The Star Organiser's [prowess_skill|E]\n$EFFECT_LIST_BULLET$The Star Organiser's [martial_skill|E]'\n$EFFECT_LIST_BULLET$The Star Organiser gaining [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$The Star Organiser gaining [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$The [martial_skill|E] of the Accolade's [liege|E]\n$EFFECT_LIST_BULLET$The [prowess_skill|E] of the Accolade's [liege|E]\n\nEach [accolade_succession|E] resets the Accolade's Squires."
 game_concept_accolade_succession_desc: "Accolade Succession happens when an [accolade_possessive|E] [acclaimed_knight|e] dies or becomes invalid.\n\nThe former Star Organiser is immediately replaced. Young [courtiers|E] and [knights|E] trained due to the Accolade's [accolade_squires|E] Aptitude are first favored as Successors; then other organisers, other staff, wanderers, and finally newly-created [characters|E]. Based on the Aptitude of the Accolade's [accolade_squires|E], the new Organiser will receive increased [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E], and possibly other [skills|E].\n\nAfter Accolade Succession, a small amount of [glory|E] may be lost and the Accolade's Squires Aptitude is reset to now reflect the skills and experience of its new Star Organiser\n\nThe Star Organiser dying in battle, a duel or another honorable manner will negate Glory loss and improve the Accolade's Squires."
 game_concept_accolade_type_desc: "An [accolade|E] has up to #value 3#! Attributes, which provide scaling bonuses as their higher levels are unlocked. Each Attribute has #value 3#! Levels. When an Accolade increases its [accolade_rank|E], its owner may either increase the level of an existing Attributes or add a new Attribute to the Accolade. The [acclaimed_knight|E], however, must satisfy any new Attribute's requirements.\n\nEach [knight|E] is only eligible for certain Attributes, which may be based on [traits|E], [skills|E] or experiential unlocks while serving as an Organiser.\n\nEvery Accolade must have unique Attributes: a Party Leader #high cannot#! duplicate Attributes between Accolades. Each Accolade may also specialize in only #value 1#! [men_at_arms|E]-type Attribute."
 game_concept_adventurer_siege_replenishment_desc: "When an [adventurer|E] successfully [sieges|E] a [holding|E], a portion of their [men_at_arms|E] will be replenished.\n\nAll Activists [regiments|E] in the [army|E] will be replenished by #V x2#! times the Holding's [loot|E] value.\n\n#weak The increase is made up of new recruits, the press-ganging of locals, and simply paying those who wandered off during the siege.#!"
 game_concept_ai_economical_boom_personality_desc: "A $game_concept_ai_economical_boom_personality$ wants to invest all of their [gold|E] into the [realm|E]. They will empty their treasury to fund [buildings|E] and [men_at_arms|E], and often construct more [economic_buildings|E] and [holdings|E]. They only save up funds if directly threatened, such as by a strong [faction|E].\n\n$game_concept_ai_economical_boom_personality$ rulers are slightly less likely to create and promote [legends|E].\n\nBold Rulers with a propensity for building and no particular inclination for [war|E] tend to be $game_concept_ai_economical_boom_personality$s.\nCommon Traits include [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], and [GetTrait('profligate').GetName( GetNullCharacter )]. Rulers with the [GetFocus('stewardship_domain_focus').GetName] also tend to be $game_concept_ai_economical_boom_personality$s."
 game_concept_ai_pious_builder_personality_desc: "A $game_concept_ai_pious_builder_personality$ wants to invest all of their [gold|E] into increasing their [piety|E].\n\nThey will spend their treasury to fund religious and ceremonial [buildings|E], [great_projects|E], [activities|E] and [decisions|E], and often construct more [pious_buildings|E] and [temple|E]- or [temple_citadel|E] [holdings|E]. They only save up funds if directly threatened, such as by a strong [faction|E].\n\n$game_concept_ai_pious_builder_personality$s are more likely to create and promote holy [legends|E].\n\nZealous [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][rulers|E] with a penchant for [virtue|E] and no particular inclination for [war|E], tend to be $game_concept_ai_pious_builder_personality$s.\nCommon Traits include [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], and [GetTrait('generous').GetName( GetNullCharacter )]. Rulers with the [GetFocus('learning_theology_focus').GetName] also tend to be $game_concept_ai_pious_builder_personality$s."
 game_concept_ai_warlike_personality_desc: "A $game_concept_ai_warlike_personality$ [ruler|E] wants to be ready to declare [war|E], always. They will save [gold|E] for [war|E] before investing it in developing their [realm|E]. If a $game_concept_ai_warlike_personality$ Ruler is at peace for an extended period of time, they will use the Funds in their war chest to build [buildings|E].\n\n$game_concept_ai_warlike_personality$ rulers are more likely to create and promote heroic [legends|E].\n\nBold and greedy Rulers tend to be Warlike.\nCommon Traits include [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )], and [GetTrait('zealous').GetName( GetNullCharacter )]."
 game_concept_alliance_desc: "An $game_concept_alliance$ is a diplomatic relation between two [rulers|E]. [independent|E] Rulers can call on $game_concept_allies$ to join each others [wars|E].\n\nAlliances are created and maintained through a [marriage|E] or [betrothal|E], as long as the two characters that are wed are closely enough related to the two Rulers. For example, if a [king|E] marries off his daughter to another King's son, the two Kings become $game_concept_allies$.\n\n[lieges|E] can also create $game_concept_alliances$ with their [vassals|E]. The Party Leader cannot call the Backbencher to War, but it prevents them from joining [factions|E]."
 game_concept_anointment_request_desc: "The Request Anointment [character_interaction|E] is a special interaction that can be used by a [ruler|E] of [empire|E] [title_tier|E] or higher on their [head_of_faith|E], or party officials [head_of_rite|E] when there is none, to secure their support in an [anointment|E]."
 game_concept_archdiocese_desc: "An Archdiocese is the [christian|E] form of a [clerical_region|E], an ecclesiastical portfolio held by an [archbishop|E] through its [clerical_title|E] and seated in a capital [county|E], where a [grand_cathedral|E] may be raised.\n\nA [christian|E] [ruler|E] answers in spiritual matters to the [archbishop|E] of the Archdiocese that contains their [capital|E] [county|E], and the territory subject to Archdioceses collectively constitutes [the_christian_church|E] [situation|E]."
 game_concept_aspect_of_serenity_desc: "A peaceful party is a prosperous party — the Serenity Aspect cherishes tranquility and diplomatic dealings, awarding bonuses to those who align with its cause.\n$EFFECT_LIST_BULLET$Focuses on [diplomacy|E]\n$EFFECT_LIST_BULLET$Avoiding Offensive [wars|E] is premiered by [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L] stacks\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] and [GetScheme('befriend').GetTypeName] [schemes|E] are more successful\n$EFFECT_LIST_BULLET$May also #high $request_great_project_contribution_interaction$s#! from [allies|E]\n$EFFECT_LIST_BULLET$May only die from [death_natural_cause|E] or [death_religious|E] [character_death_deaths|E]"
 game_concept_at_peace_opinion_desc: "Characters who have the [GetTenetType('tenet_warmonger').GetBaseName] [core_tenet|E] as part of their [faith|E] will have the '$game_concept_at_peace_opinion$' instead of the [offensive_war_opinion|E] penalty.\n\nIf you are at peace for too long, your [vassals|E] will think less of you #weak (if they share your Ideology).#!"
 game_concept_autonomous_vassals: "Autonomous Backbenchers"
 game_concept_autonomous_vassals_crown_authority: "Autonomous Backbenchers Crown Authority"
 game_concept_autonomous_vassals_crown_authority_desc: "'$game_concept_autonomous_vassals$' is the lowest level of [crown_authority|E]. At this level, [vassals|E] have no [opinion|E] penalty toward their [liege|E], and the party leader only has basic power over them."
 game_concept_available_spouse_desc: "In order to serve on a ruler's [council|E], a [spouse|E] must be available to carry out the responsibilities of that role.\n\nVarious circumstances can prevent a $game_concept_spouse$ from fulfilling these responsibilities, but several of the most common ones include:\n$BULLET_WITH_TAB$Being the [ruler|E] of their own [realm|E]\n$BULLET_WITH_TAB$Residing in another Ruler's [court|E]\n$BULLET_WITH_TAB$Being [imprisoned|E], either at home or abroad\n$BULLET_WITH_TAB$Having the [GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]\n\nIf an unavailable Spouse becomes available again, they will automatically resume their duties on the Cabinet.\n\nSpouses who are Rulers in their own right can still serve on the Cabinet if they are your [direct_vassals|E], but otherwise will never be considered available."
 game_concept_baronies: "Wards"
 game_concept_barony: "Ward"
 game_concept_beneficiary_desc: "Every participant in a [great_holy_war|E] can select a $game_concept_beneficiary$ from their [dynasty|E]. Upon victory, the $game_concept_beneficiary$ will receive lands in the targeted party proportional to the [war_contribution|E] of their patron ruler.\n\nThe largest contributor can force their Beneficiary to receive the main title being fought over."
 game_concept_buy_claim_desc: "An Interaction that allows a character to buy [unpressed_claims|E] in exchange for [piety|E].\n\n$EFFECT_LIST_BULLET$A [vassal|E] may not buy a claim on any [liege|E]'s [title|E], and a Party Leader may not buy a claim on any Backbencher's Title\n$EFFECT_LIST_BULLET$A [king|E] or [emperor|E] may not buy claims on Nation Titles, and Emperors may not buy claims on other Empires\n$EFFECT_LIST_BULLET$No one may buy a claim on their [head_of_faith|E]"
 game_concept_canonized_desc: "A [character|E] who has, after death, been declared a saint or another ideology's equivalent, such as a Wali or a venerated ancestor, gaining the [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\nA virtuous life may end in $game_concept_canonization$: it is petitioned through a [decision|E], may require the blessing of the [head_of_faith|E], and is sealed by consecrating the saint's burial site. Their resting place thereafter draws pious travelers, and their remains may yield [holy_relics|E]."
 game_concept_capital_duchy: "Capital Region"
 game_concept_capital_duchy_desc: "The $game_concept_capital_duchy$ Modifier increases the amount of [levies|E] you get out of all [holdings|E] you hold within the same [de_jure|E] [duchy|E] as your [capital|E]. It also gives a bonus to all [stationed|E] [men_at_arms|E]. For this modifier to be active, you need to personally hold the associated Region.\n\nThis modifier does not stack with Home Base bonus."
 game_concept_ceremonial_claimant_faction_desc: "The $game_concept_claimant_faction$ seeks to install a particular [claimant|E] as [ceremonial_liege|E]. If successful, the incumbent Ceremonial Party Leader will have to relinquish their [title|E] to the Claimant. All [faction|E] members will gain a [hook|E] on the Claimant."
 game_concept_ceremonial_liege_desc: "In certain [realms|E] (such as Japan) a powerful bureaucrat or commander may have taken true power as a [ceremonial_regent|E], leaving a nominally reigning $game_concept_ceremonial_liege$ as a mere figurehead and [vassal|E] in practice. All members of a $game_concept_ceremonial_liege_possessive$ [house|E] are considered part of the [ceremonial_house|E].\n\nDespite not ruling directly, the $game_concept_ceremonial_house$ is the most esteemed bloodline in a party, and other [houses|E] will gain more [prestige|E] for marriages with them, with such connections strongly influencing the succession of the $game_concept_ceremonial_regent$.\n\nThe $game_concept_ceremonial_liege$ may take back true power if they somehow regain the [primary_title|E] of the party, such as by [faction|E] demand or competing for the $game_concept_ceremonial_regent$ [title|E] using [influence|E]."
 game_concept_challenger_hof: "Challenger Movement Leader"
 game_concept_challenger_hof_desc: "A $game_concept_challenger_hof$ is a rival [head_of_faith|E] raised against the [mainline_rite|E] $game_concept_head_of_faith$.\n\nA [ruler|E] may sponsor a member of their [clergy|E] as $game_concept_challenger_hof$. A [clergy|E] [ruler|E] or a ruler from a [faith|E] with a Temporal Movement Leader may declare themselves as a Challenger instead.\n\nA sponsored $game_concept_challenger_hof$ takes up their sponsor's [rite|E], becomes that sponsor's [external_clerical_puppet|E] and owes them a [weak_hook|E].\n\nThe $game_concept_mainline_rite$ $game_concept_head_of_faith$ cannot [excommunicate|E] anyone who follows a $game_concept_challenger_hof$: the sponsor and their [vassals|E].\n\nEveryone following a $game_concept_challenger_hof$ brings their clerical requests to them instead of to the $game_concept_mainline_rite$ $game_concept_head_of_faith$, among them these [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nA $game_concept_challenger_hof$ or their sponsor may use the [pam_challenge_hof_cb|E] [casus_belli|E] against the legitimate $game_concept_head_of_faith$.\n\nRival [kings|E] or above of the same [faith|E] may instead use the [pam_antiking_cb|E] against a sponsor, deposing the rival claimant."
 game_concept_chancellor: "Foreign Secretary"
 game_concept_chancellor_desc: "The $game_concept_chancellor$ is the [councillor|E] in charge of diplomacy, abroad and with the rest of the [realm|E]."
 game_concept_chancellors: "Foreign Secretaries"
 game_concept_church_authority_desc: "$game_concept_church_authority$ represents the power that a [theocratic|E] [ruler|E] wields over their [clergy|E] and [vassals|E].\n\nThere are four levels of $game_concept_church_authority$; $church_authority_0$, $church_authority_1$, $church_authority_2$, and $church_authority_3$. Increasing $game_concept_church_authority$ costs an amount of [piety|E] and [prestige|E] depending on the level and the ruler's [learning_skill|E].\n\n#weak Backbenchers dislike higher levels of $game_concept_church_authority$, and lowering it is the primary goal of [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_claimant_desc: "A $game_concept_claimant$ is a person with one or more [claims|E] to [titles|E]. [ruler|E] Claimants can press these by using the Claim [casus_belli|E] to declare [wars|E].\n\nThis Casus Belli can also be used to press the Claims of [vassals|E] and even [unlanded|E] characters in your [realm|E].\n\nClaimants can also lead [factions|E] — even if they do not reside in your Party."
 game_concept_claimant_faction_desc: "The $game_concept_claimant_faction$ seeks to install a particular [claimant|E] on the throne of a [title|E] held by their [liege|E]. If successful, the Party Leader will have to relinquish the Title to the Claimant and the [vassal|E] structure will be updated accordingly. All [faction|E] members will gain a [hook|E] on the Claimant."
 game_concept_clan_desc: "Clans are a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of said Party Leader's [tax_collector|E]. Clans also make use of [house_unity|E]."
 game_concept_clergy: "Party Officials"
 game_concept_clergy_desc: "[court_chaplains|E], [realm_priests|E], [theocratic|E] Rulers, and anyone with the [GetTrait('devoted').GetName( GetNullCharacter )] trait are considered members of the Party Officials.\n\nThe [doctrines|E] of the [faith|E] determine who can be a member of the Party Officials, and whether members of the Party Officials can marry, inherit land, etc."
 game_concept_clergy_opinion: "Party Officials Opinion"
 game_concept_clerical_puppet: "Party Priest Puppet"
 game_concept_clerical_puppets: "Party Priest Puppets"
 game_concept_clerical_region_desc: "A Clerical Region is a geographical region that falls under the jurisdiction of a [clerical_title|E]. Any member of the party officials within the region will be a [subordinate|E] to the holder of the [title|E] associated with the region.\n\nA [ruler|E] belongs to the Clerical Region that contains their [capital|E] [county|E], and a new region is founded upon the [capital|E] of its founder's [primary_title|E]. The region may cover multiple [realms|E] and have subordinates that are in different parties.\n\nA $game_concept_ruler$ may only hold one $game_concept_clerical_region$ at a time. If granted a new Region, the Ruler forfeits all their held land within the previous one."
 game_concept_clerical_title_desc: "A $game_concept_clerical_title$ is an [ecclesiastical|E] [title|E] of the [clergy|E] governing a [clerical_region|E] within a [faith|E]. Among the [christian|E] ideologies this is an [archdiocese|E].\n\nThe holder is the [religious_superior|E] of the [clergy|E] in that region, and is usually appointed by the [head_of_faith|E]."
 game_concept_commander_trait_desc: "$game_concept_commander_traits$ are special [traits|E] that confer useful perks to characters when acting as [army|E] [commanders|E].\n\nCommander Traits are typically acquired by children raised with the Security [education_focus|E], but can also be gained through the [martial_lifestyle|E] and other means."
 game_concept_complete_control_desc: "This condition is fulfilled when all [de_jure|E] backbencher [titles|E] of the targeted title are held by either the [ruler|E] or by their [vassals|E] and none of its Constituencies are [occupied|E] by hostile [armies|E]."
 game_concept_complete_control_region_desc: "This condition is fulfilled when all [counties|E] in the targeted [region|E] are held by either the ruler or by their [vassals|E] and none of its Constituencies are occupied by hostile armies."
 game_concept_confederation_desc: "A relation that binds [tribal|E] or [nomadic|E] [rulers|E] in mutual defense, similar to an [alliance|E]. Formed through the #high $call_for_confederation_decision$#! [decision|E], a confederation requires its members to join each other's Defensive [wars|E]. Confederations are visible in the Charisma tab.\n\nFellow [confederates|E] also may not attack or [raid|E] one another. They are restricted from high levels of [tribal_authority|E] and [nomadic_authority|E], and may not create new [titles|E].\n\n[confederates|E] may use the #high $leave_confederation_decision$#! [decision|E] or [migrate|E] to become [independent|E]. If a confederation is left with only one member, it is destroyed."
 game_concept_contestant_desc: "In order to compete in [GetActivityType( 'activity_tournament' ).GetName] [contests|E], you must fulfill its requirements. Board Games allow all characters to compete, while others, like Wrestling, depend on Security rules.\n\nNon-competing characters will be [spectators|E], and potential [contestants|E] may opt-out of participating if they wish to spectate.\n\nEligibility to enter Contests is determined by gender and health, based on the host's [culture|E] and [religion|E]."
 game_concept_convert_county_desc: "A [councillor_task|E] performed by the [court_chaplain|E] which targets a [county|E] of a different [faith|E] — or one of the same Ideology but a different [rite|E] — than the [liege|E].\nProgress increases each month, and at 100% the majority of the Target Constituency adopts the Leader of the House's Ideology. The new [rite|E] follows the [liege|E] whenever the resulting Ideology matches the Party Leader's — otherwise it is the Chaplain's own Ideology.\n\nConversion speed is affected by many factors, including the [councillor|E]'s [learning_skill|E] and the [fervor|E] of the involved Ideologies. A Chaplain whose [rite|E] differs from the [liege|E]'s converts more slowly.\nOn a [rite|E]-only shift, [fervor|E] favours the mainline Ideology above #V 50%#! and non-mainline (including breakaway) Ideologies below it."
 game_concept_convince_dejure_desc: "A [councillor_task|E] performed by the [steward|E]. It targets a [de_jure|E] [county|E] of the minister's [liege|E] that is owned by an [independent|E] [ruler|E]. When the constituency is persuaded, they will ask their [ruler|E] to release them to their [de_jure|E] [liege|E]."
 game_concept_coronation_anointment_desc: "Anointment is one type of a [coronation|E], where the [ruler|E] will seek out their [head_of_faith|E], or party officials [head_of_rite|E] when there is none, to bless their ascension to the throne. In certain ideologies this is necessary to truly be considered a [legitimate|E] ruler of their lands.\n\nTo secure that authority's support, the [host|E] can use the [anointment_request|E] [interaction|E]."
 game_concept_council: "Cabinet"
 game_concept_council_desc: "The $game_concept_council$ is the leader's top team of [councillors|E], each running a department. They can be given important [councillor_tasks|E]."
 game_concept_councillor: "Minister"
 game_concept_councillor_desc: "Ministers are the primary assistants of any [ruler|E], and make up the [council|E]. There are six positions on the cabinet: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (or [realm_priest|E]), and finally your [spouse|E].\n\nEach is in charge of a department that can be given different [councillor_tasks|E] to perform.\n\n[powerful_vassals|E] will be upset if not appointed to one of these positions, meaning you often have to make a choice between placating a powerful backbencher or appointing someone who is actually competent.\n\nServing as a Minister to your [liege|E] gives you a bonus, which increases with the [rank|E] of the Party Leader."
 game_concept_councillor_task: "Ministerial Task"
 game_concept_councillor_task_desc: "$game_concept_councillor_tasks$ are important jobs that can be given to your [councillors|E]. These tasks can either be general or specifically target a [county|E] or [court|E].\n\nIf you have a [relation|E] with a Minister, Tasks with a completion time may take more or less time.\n\n#weak Note that ministers are not physically present to perform these tasks, but merely lead the efforts.#!"
 game_concept_councillor_task_possible_side_effects_desc: "A [councillor_task|E] may have unexpected consequences over time. These may be good or bad, with positive effects being more likely the higher the Minister's relevant [skill|E], and negative effects being more likely the lower the relevant Skill is."
 game_concept_councillor_tasks: "Ministerial Tasks"
 game_concept_councillors: "Ministers"
 game_concept_counties: "Constituencies"
 game_concept_county: "Constituency"
 game_concept_county_capital: "Constituency Capital"
 game_concept_county_capital_desc: "The $game_concept_county_capital$ is the main [holding|E] of a [county|E]. This Holding can never be destroyed or [leased|E] out and is always owned by the [ruler|E] who holds the Constituency [title|E].\n\nConstituency Capitals allows the construction of an additional [building|E] compared to a lesser Holding."
 game_concept_county_capitals: "Constituency Capitals"
 game_concept_county_control: "Constituency Control"
 game_concept_county_control_desc: "$game_concept_county_control$ measures the grip that the government has on the population of a [county|E]. It is crucial especially for collecting [taxes|E] from the [holdings|E].\n\nWhen a Constituency changes hands through [war|E], Control goes down drastically, which is a good reason to vassalize the current [holder|E] instead (if the [casus_belli|E] allows). Constituency Control can also be damaged by [sieges|E] and [Concept( 'peasant_faction', 'Peasant Uprisings' )|E].\n\nLow Control may lead to [county_corruption|E], and the primary way of increasing Control is a [councillor_task|E] available to your [marshal|E]."
 game_concept_county_corruption: "Constituency Corruption"
 game_concept_county_corruption_desc: "While a [county|E] has low [control|E] or its [holder|E] is in [debt|E], the Constituency might acquire $game_concept_county_corruption$. These are various kinds of negative [county_modifiers|E].\n\n$game_concept_county_corruption$ will fade over time, but if the root cause persists ([debt|E] or low [control|E]), it may reappear.\n\nThe $councillor_marshal$'s $task_increase_control$ $game_concept_councillor_task$ can clear out $game_concept_county_corruption$ faster."
 game_concept_county_fertility: "Constituency Fertility"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ exists in [counties|E] located within the [the_great_steppe|E], and can be grazed by [GetGovernment( 'nomad_government' ).GetName] [rulers|E] to increase their [herd|E].\n\nA Constituency's Fertility represents the quality of its pastures.\n\nFertility stabilizes around the [fertility_equilibrium|E], allowing Nomadic Rulers with a large [domain_limit|E] to sustain their Herd growth. Fertility is affected by the [steppe_seasons|E] and slowly replenished by [herders|E].\n\nWhen a [realm|E]'s fertility is low, it is a sign to [migrate|E].\n\n[county_control|E] slows down the rate at which Fertility grows by a percentage equal to the current control."
 game_concept_county_modifier: "Constituency Modifier"
 game_concept_county_modifiers: "Constituency Modifiers"
 game_concept_county_opinion_desc: "The general populace of each [county|E] has an [opinion|E] of the [character|E] who holds their $game_concept_county$. If the population is unhappy, they might start or join a [peasant_faction|E] or [popular_faction|E], either of which can soon spread throughout an entire [realm|E].\n\nThe easiest way of controlling $game_concept_county_opinion$ is to ensure that the $game_concept_county$ [holder|E] is of the same [culture|E] and [faith|E] as the population.\n\n$game_concept_county_opinion$ from having a different [faith|E] is modified by both the constituency's [faith_hostility|E] and its [fervor|E], scaling linearly between 0 and 100 $game_concept_fervor$."
 game_concept_court: "Office"
 game_concept_court_amenities: "Office Amenities"
 game_concept_court_amenity: "Office Amenity"
 game_concept_court_artifact: "Office Artifact"
 game_concept_court_artifact_desc: "An Office Artifact is an [artifact|E] that is put on display in a [ruler|E]'s [royal_court|E], such as tapestries or beautifully illustrated books.\n\nOffice Artifacts are one factor determining the [court_grandeur|E] of a Private Office.\n\nThere is no limit to how many Artifacts a Character can have, but only those displayed in a slot of its type has any effect.\n\nYou can create new Office Artifacts from [inspired|E] [characters|E], from the Commission Artifact Decision, or from choosing to [reforge|E] an [inventory_artifact|E]"
 game_concept_court_artifacts: "Office Artifacts"
 game_concept_court_chaplain: "Leader of the House"
 game_concept_court_chaplain_desc: "The $game_concept_court_chaplain$ is the [councillor|E] in charge of religious and spiritual affairs in [faiths|E] with the [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E].\n\nIdeologies with the [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] Policy Position have the far more powerful (and troublesome) [realm_priest|E] instead of a $game_concept_court_chaplain$."
 game_concept_court_chaplain_possessive: "Leader of the House's"
 game_concept_court_chaplains: "Leaders of the House"
 game_concept_court_chaplains_possessive: "Leaders of the House's"
 game_concept_court_desc: "Every politician has an $game_concept_court$: the [unlanded|E] people who work for them.\n\nThese [courtiers|E] are their family, advisers, researchers and hangers-on."
 game_concept_court_event: "Office Event"
 game_concept_court_events: "Office Events"
 game_concept_court_grandeur: "Office Grandeur"
 game_concept_court_grandeur_desc: "A [royal_court|E]'s $game_concept_court_grandeur_value$ shows how famed the Office is, and unlocks new [court_grandeur_levels|E] as it increases.\n\nThe value ranges from 0 and 100, and over time will settle at its Baseline value. The Baseline is affected by things like [dynasty_perks|E], how much you're spending on [court_amenities|E], and if you have any magnificent [court_artifacts|E].\n\nA portion of Grandeur is lost upon [succession|E]."
 game_concept_court_grandeur_expectation: "Office Grandeur Expectation"
 game_concept_court_grandeur_expectations: "Office Grandeur Expectations"
 game_concept_court_grandeur_level: "Office Grandeur Level"
 game_concept_court_grandeur_level_desc: "A [royal_court|E]'s Grandeur Level gives bonuses to its owner, and is unlocked as the Office's [court_grandeur_value|E] increases.\n\nIn addition to each level's effects, large [realms|E] are expected to have reached higher Grandeur Levels. This is known as [court_grandeur_expectations|E]."
 game_concept_court_grandeur_levels: "Office Grandeur Levels"
 game_concept_court_grandeur_value: "Office Grandeur Value"
 game_concept_court_guest: "Office Guest"
 game_concept_court_host: "Office Host"
 game_concept_court_host_desc: "A $game_concept_court_host$ is a [ruler|E] who is not the party leader of a character, yet still has them in their [court].\n\nThere are several possible reasons this can occur, such as [wanderers|E] visiting a Ruler or [wards|E] staying in the same Office as their [guardian|E]."
 game_concept_court_language: "Office Language"
 game_concept_court_language_desc: "An Office Language is the official [language|E] of a [royal_court|E], spoken by the nobility and used by the bureaucracy.\n\nThe [court_grandeur|E] Baseline is increased for each [realm|E] [county|E] that shares the Language, for each Private Office which speaks the same Office Language, and if it is the [ruler|E]'s native Language."
 game_concept_court_languages: "Office Languages"
 game_concept_court_position: "Appointment"
 game_concept_court_position_task: "Appointment Task"
 game_concept_court_position_tasks: "Appointment Tasks"
 game_concept_court_positions: "Appointments"
 game_concept_court_type: "Office Type"
 game_concept_court_type_desc: "As a part of their [royal_court|E], [rulers|E] can have a designated $game_concept_court_type$.\n\nEach $game_concept_court_type$ provides the Ruler and the [court|E] with their own set of bonuses, depending on [court_grandeur_level|E].\n\nThe [ethos|E] of a Ruler's [culture|E] decides which Office Types they can have.\n\nThe different Office Types are:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait: "Office Type Trait"
 game_concept_court_type_trait_desc: "After serving [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] years in a [royal_court|E] a [courtier|E] receives a [trait|E] reflecting the [court_type|E] of that court.\n\nThe quality of this Trait is decided by how long the [character|E] has served as a Staffer in the Office."
 game_concept_court_types: "Office Types"
 game_concept_courtier: "Staffer"
 game_concept_courtier_desc: "A $game_concept_courtier$ is an [unlanded|E] character who serves a [ruler|E] in their [court|E].\n\nStaff can:\n$BULLET_WITH_TAB$Serve as [councillors|E]\n$BULLET_WITH_TAB$Serve in [court_positions|E]\n$BULLET_WITH_TAB$Serve in [armies|E] as [commanders|E] or [knights|E]\n$BULLET_WITH_TAB$Become their Ruler's [vassal|E] if granted a [title|E]\n$BULLET_WITH_TAB$Let their Ruler press their [claims|E] in [war|E]\n\n#WEAK [adventurers|E] have [followers|E] instead of $game_concept_courtiers$ — they serve the same role, albeit generally smellier and with more mud.#!"
 game_concept_courtiers: "Staff"
 game_concept_courts: "Offices"
 game_concept_criminal_task_contract_desc: "A $game_concept_criminal_task_contract$ typically involves seedy contracts that may be lucrative, but will award you @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\nLevelling the $trait_gallowsbait$ [trait|E] will make most of the world hate you more and respect you less, and eventually cause [followers|E] of yours who disapprove of your brigandry to dramatically leave your employ.\n\n#WEAK $trait_gallowsbait$ is a highly negative $game_concept_trait$, meaning a character is a petty criminal of the lowest order — at least a murder in the office has some kind of #EMP class#! to it.\n\nIt can be scrubbed clean with the [GetDecisionWithKey('wipe_slate_decision').GetName] [decision|E].#!"
 game_concept_crown_authority_desc: "$game_concept_crown_authority$ represents the general power that a [ruler|E] wields over their [vassals|E].\n\nThere are four levels of $game_concept_crown_authority$; [autonomous_vassals|E], [limited|E], [high|E], and [absolute|E]. Increasing $game_concept_crown_authority$ costs an amount of [prestige|E] depending on the level and the ruler's [learning_skill|E].\n\n#weak Backbenchers dislike higher levels of $game_concept_crown_authority$, and lowering it is the primary goal of [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_culture_head_desc: "A '$game_concept_culture_head$' is the [ruler|E] who has the most influence over their own [culture|E].\n\nSpecifically, the ruler with largest total number of same-culture [counties|E] within their [realm|E] will become the $game_concept_cultural_head$, regardless of where their [domain|E] is or what other-culture Constituencies they may possess.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\nThe $game_concept_cultural_head$ can influence which [innovation|E] should be prioritized for discovery by setting the [cultural_fascination|E].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_de_jure_drift_desc_part_1: "A slow process by which a [title|E]'s [de_jure|E] [liege|E] can change. It occurs naturally when a [duchy|E] or [kingdom|E] is completely controlled by a [ruler|E] who does not hold the territory's de jure party leader title.\n\nThis process can be sped up by assigning your [chancellor|E] to the appropriate [councillor_task|E] #weak ($task_integrate_title$)#!. Regions can only $game_concept_de_jure_drift$ into Nations, and Nations can only Drift into [empires|E].\n\nLetting titles De Jure Drift into your [primary_title|E] is a good way to get rid of the [rightful_liege|E] penalty."
 game_concept_de_jure_drift_desc_part_2: "#weak Example: The Region of $d_northumberland$ is de jure part of $k_england$, but the territory of the region is entirely within $k_scotland$. Since the King of $k_scotland$ does not also hold $k_england$, the region will start to $game_concept_de_jure_drift$ toward becoming a part of $k_scotland$.#!"
 game_concept_death_religion: "Political Camp"
 game_concept_death_religion_desc: "Being passed into the next world by opponents and the sacrilegious dispatching of your mortal coil — martyrdom, crucifixion — remaining true to your ideology to the very end, what more genuine way is there to pass on."
 game_concept_debt_desc: "Debt is the state of having a negative amount of [gold_i][gold|E]. This typically happens when a [ruler|E] at war hires [mercenaries|E] without having enough Funds to cover the full cost, or when they are at war for too long.\n\n While in Debt you cannot declare new [wars|E], your [men_at_arms|E] do not reinforce, and your enemies will have an [advantage|E] over you in battle. The deeper into debt you fall, the more penalties you will get — fewer [levies|E], reduced [county_opinion|E], and your [vassals|E] will like you less.\n\nIn addition to this, various other minor destabilizing events may occur, such as gaining [county_corruption|E] in your [domain|E] [counties|E]. \n\n#help It is generally a good idea to strike your enemies while they are in Debt, as they will fight with reduced [advantage|E]!#!"
 game_concept_demand_conversion_desc: "[rulers|E] who have a subject of another [faith|E] may Demand Conversion to change their subject's Ideology to their own. The Ruler's [learning|E] skill and the subject's [opinion|E] of their party leader are major factors in determining if the subject accepts the demand, or [Concept('refuse_conversion_crime','refuses')|E] it."
 game_concept_diarch_aptitude_desc: "$game_concept_diarch_aptitude$ governs how well a [diarch|E] achieves each [mandate|E] set by their [liege|E].\n\nBoth [skills|E] and [personality_traits|E] play a role. For instance, a [GetTrait('greedy').GetName(GetNullCharacter)] $game_concept_diarch$ tasked with the '$fill_coffers_mandate$' Mandate may not send as much [gold|E] to their Party Leader.\n\n#WEAK [diarchs|E] are well-suited to a $game_concept_mandate$ when they have around 40+ $game_concept_aptitude$ for it.#!"
 game_concept_diarch_power_desc: "A [diarch|E] in an active [power_sharing|E] has access to special $game_concept_diarch_powers$.\n\nThese are special [character_interaction|E]s that mimic those their [liege|E] have, or are other abuses of power. Examples include [revoking|E] [titles|E] from fellow [vassals|E], or siphoning away [gold|E] from their Party Leader.\n\nMany $game_concept_diarch_powers$ give the Party Leader an opportunity to [veto|E] them."
 game_concept_diplomacy: "Charisma"
 game_concept_diplomacy_lifestyle: "Charisma Lifestyle"
 game_concept_diplomacy_skill: "Charisma Skill"
 game_concept_diplomacy_skill_desc: "$game_concept_diplomacy$ is a [skill|E] for charm, persuasion and deal-making: working a room, winning colleagues round and getting a deal over the line.\n\nIt directly affects the [opinions|E] other characters have of you, and furthers Charisma [schemes|E].\n\nThe corresponding [lifestyle|E] is the [diplomacy_lifestyle|E]."
 game_concept_diplomacy_task_contract: "Charisma Contract"
 game_concept_diplomacy_task_contract_possessive: "Charisma Contract's"
 game_concept_diplomacy_task_contracts: "Charisma Contracts"
 game_concept_diplomacy_task_contracts_possessive: "Charisma Contracts'"
 game_concept_direct_vassal: "Direct Backbencher"
 game_concept_direct_vassals: "Direct Backbenchers"
 game_concept_directed_great_holy_war_desc: "A $game_concept_directed_great_holy_war$ is declared by a $doctrine_temporal_head_name$ [head_of_faith|E] with the intention of bringing a [kingdom|E] under their own rule.\n\n[rulers|E] of their [faith|E] might choose to assist the Movement Leader, and may get rewards from doing so. Rewards include [piety|E] and potentially having their [dynasty|E] become [landed|E] within the conquered Nation.\n\nRulers of the targeted [religion|E] may choose to defend against this war without the need for an [alliance|E]."
 game_concept_disparate_tribes_tribal_authority_desc: "$game_concept_disparate_tribes$ is the lowest level of [tribal_authority|E]. At this level, [vassals|E] have no [opinion|E] penalty towards their [liege|E], and the party leader lacks any power over them other than the ability to demand [levies|E] and [taxes|E]."
 game_concept_dissolution_faction_desc: "The [dissolution_faction|E] seeks to destroy the [realm|E] of their [liege|E]. If they are successful, all the backbenchers in the party become [independent|E], and their party leader loses their [primary_title|E]."
 game_concept_doctrine: "Policy Position"
 game_concept_doctrine_knowledge: "Policy Position Knowledge"
 game_concept_doctrines: "Policy Positions"
 game_concept_doctrines_desc: "Policy positions are what an [faith|E] stands for: tax and spending, ownership, immigration, Europe, the Union and civil liberties. Bills that clash with an MP's policy positions make a rebellion likelier."
 game_concept_domain: "Portfolio"
 game_concept_domain_desc: "A politician's $game_concept_domain$ is everything they hold personally: their seat and its wards.\n\nThe [domain_limit|E] means that a leader has to rely on [vassals|E] to lead more than a handful of seats."
 game_concept_domain_fertility: "Portfolio Fertility"
 game_concept_domain_fertility_desc: "Portfolio Fertility is the total [county_fertility|E] of all your held [counties|E]."
 game_concept_domain_income: "Portfolio Income"
 game_concept_domain_limit: "Portfolio Limit"
 game_concept_domain_size: "Portfolio Size"
 game_concept_domain_taxes: "Portfolio Taxes"
 game_concept_domains: "Portfolios"
 game_concept_dominant_family_desc: "A $game_concept_dominant_family$ is a [powerful_family|E] that has spread their control far and wide. They are considered the most influential [house|E] within a [realm|E].\n\nA member of a $game_concept_dominant_family$ is even better at [political_schemes|E] and is even more likely to get what they want when [interacting|E] with other [characters|E].\n\nA $game_concept_house$ must control at least [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] of the Party to become Dominant."
 game_concept_dread: "Clout"
 game_concept_dread_desc: "$game_concept_dread$ is how much a [ruler|E] is feared: the leader who sacks ministers without blinking, the whip who never forgets a rebellion.\n\nPoliticians gain $game_concept_dread$ by ruthless acts: sackings, purges and making examples of rebels or [prisoners|E].\n\nClout makes it possible to lead like a [tyrant|E], because unruly [vassals|E] can become [intimidated|E] or [cowed|E], making them too scared to oppose you.\n\nA character's Clout can range from 0 to 100, except for [nomads|E], who can achieve 150. Over time, their Clout will tend towards their Natural Clout, which is defined by their [personality_traits|E].\n\n#high A Formidable [ruler] reaps the following benefits:#!\n$BULLET_WITH_TAB$[vassals] are discouraged from joining [factions|E]\n$BULLET_WITH_TAB$[vassals] are discouraged from [scheming|E]\n$BULLET_WITH_TAB$Increases [vassal] acceptance #weak (E.g. Title Revocation)#!\n$BULLET_WITH_TAB$Increases [offer_vassalization|E] acceptance\n$BULLET_WITH_TAB$Makes [electors|E] more likely to vote as you do\n$BULLET_WITH_TAB$Makes backbenchers unlikely to oppose [law|E] changes\n\n#weak Note that brave and bold [vassals] are less affected by Clout!#!"
 game_concept_dreaded: "Formidable"
 game_concept_dreadful: "Formidable"
 game_concept_dreams_desc: "Characters who follow an ideology with the divination cause may occasionally experience dreams. These dreams can then be divined by a mystic which can have a variety of outcomes, both good and bad."
 game_concept_duchies: "Regions"
 game_concept_duchy: "Region"
 game_concept_duchy_building: "Region Building"
 game_concept_duchy_building_desc: "$game_concept_duchy_buildings$ are powerful [buildings|E] that can only be constructed in the [de_jure_capital|E] of a [duchy|E]. Only one type can be constructed in each Region.\n\n$game_concept_duchy_buildings$ are only active if the owner also holds the associated Region [title|E].\n\nMany $game_concept_duchy_buildings$ have modifiers that affect all [holdings|E] in the Region, making them powerful tools for specializing your [domain|E]."
 game_concept_duchy_buildings: "Region Buildings"
 game_concept_duchy_desc: "A $game_concept_duchy$ is a [title|E] one [title_tier|E] below a [kingdom|E] and one above a [county|E].\n\nThe [holder|E] of a $game_concept_duchy$ has [de_jure|E] rights to its constituent $game_concept_counties$ and can have [counts|E] as [vassals|E].\n\nRegions may be dormant and have no current Holder. Such $game_concept_title_succession$ can be created by a [ruler|E] who controls at least half of its $game_concept_counties$."
 game_concept_dynasty_perks: "Party Legacies"
 game_concept_dynasty_prestige: "Party Brand"
 game_concept_dynasty_prestige_desc: "$game_concept_dynasty_prestige$ is a party's reputation as a whole: what voters think its name stands for, and the doors it opens for its members.\n\nA [dynasty|E] gains $game_concept_dynasty_prestige$ from its living members, from the members who hold office, and from members married to other office-holders.\n\nIt counts towards the party's [dynasty_prestige_level|E], and the party's leader can spend it on [dynasty_perks|E]."
 game_concept_dynasty_prestige_level: "Party Brand Level"
 game_concept_dynasty_prestige_level_10_desc: "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\nThis is the highest Party Brand Level."
 game_concept_dynasty_prestige_level_desc: "$game_concept_dynasty_prestige_level$ is a measure of how famous a [dynasty|E] is. Level progress is made whenever your Dynasty gains [dynasty_prestige|E]. Characters get an amount of initial [prestige|E] when they are born depending on their $game_concept_dynasty_prestige_level$. Similarly, [spouses|E] gain some Profile from each other's Dynasty when they [marry|E].\n\nThe levels are:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "An [interaction|E] through which [ecclesiastical|E] [rulers|E] can make same-[faith|E] secular rulers declare [holy_war|E] on rulers of hostile ideology."
 game_concept_ecumenical_councils: "Ecumenical Cabinets"
 game_concept_eminent_holy_site: "Eminent Heartland"
 game_concept_eminent_holy_site_desc: "An $game_concept_eminent_holy_site$ is a [holy_site|E] of high importance to a [faith|E]. Each Ideology may designate only a few of its $game_concept_holy_sites$ as Eminent.\n\nOnly Eminent Heartlands contribute modifiers that affect all followers of an Ideology."
 game_concept_eminent_holy_sites: "Eminent Heartlands"
 game_concept_empire: "United Kingdom"
 game_concept_empires: "Unions"
 game_concept_enshrined_desc: "An enshrined [holy_relic|E] at a [holy_site|E] activates heartland bonuses and improves the bonuses it grants, scaled by the total [rarity|E] levels of all enshrined artifacts.\n\nAn enshrined artifact is no longer owned by a character, but may be interacted with by the [holder|E], [top_liege|E], or [clerical_region|E] holder of the heartland. The artifact will no longer decay. You can enshrine only holy relics for your own [faith|E]; enshrined holy relics of other ideologies will provide no benefits.\n\nThere may be rewards or costs associated with enshrining or removing an enshrined artifact."
 game_concept_entrenched_regency_desc: "If a [regency|E] lasts too long, it may become Entrenched, and the [regent|E] becomes even more powerful compared to their [liege|E].\n\nThe benefits the [regent|E] gets from the [scales_of_power|E] become much more powerful.\n\nTo end an $game_concept_entrenched_regency$, the Regent must accept a gift from their Party Leader, or the Party Leader must tip the Scales in their favor."
 game_concept_escalated_peasant_factions: "Escalated Protest Movements"
 game_concept_expected_legitimacy: "Expected Mandate"
 game_concept_expected_legitimacy_desc: "The [legitimacy_level|E] that [vassals|E] expect of their [ruler|E], based on their historical relationship. Some factors that lower the Expectations are:\n$BULLET_WITH_TAB$Being the [de_jure|E] [liege|E] of the backbencher\n$BULLET_WITH_TAB$Being part of the [close_family|E] of the backbencher\n$BULLET_WITH_TAB$Being the [preferred_heir|E] of the backbencher\n$BULLET_WITH_TAB$Being the same [dynasty|E] that the backbencher has served for longer than #color_white 50#! years\n$BULLET_WITH_TAB$The backbencher not being a [powerful_vassal|E]\n\nIf the actual Level is below their Expectations they may become unruly: their [opinion|E] will be lower and they may join [factions|E] against their [liege|E].\n\nExpectations increase with the level of their [primary_title|E], as well as with the [era|E]."
 game_concept_external_clerical_puppet_desc: "A powerful member of the [clergy|E] — an [archbishop|E] or even the [head_of_faith|E] — that has become the [puppet|E] of another [ruler|E].\n\nThe mightier the cleric, the greater the reach: a puppeted Movement Leader can [excommunicate|E] your enemies, appoint [cardinals|E], grant a [pressed_claim|E], or incite a [holy_war|E] on your behalf."
 game_concept_faction_desc: "A $game_concept_faction$ is a group of [vassals|E] with common political interests. The local population of [counties|E] can also join certain types of Factions, such as the Protest Movement.\n\nFactions become dangerous once their [faction_discontent|E] reaches a certain point, at which time they will issue an ultimatum.\n\nIf the [liege|E] does not comply, the Faction will rise up in revolt, sparking a [civil_war|E]. If the Faction dissolves before the War is over, the Party Leader must have at least [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E] to win the War."
 game_concept_faction_military_power_desc: "$game_concept_faction_military_power$ is a measure of the total military strength of a [faction|E] relative to their target.\n\nEach individual faction member adds their full strength to the Faction as long as they remain in the Faction. If the faction target is the [liege|E] of a member, the strength of the member is also subtracted from the relative power of the party leader."
 game_concept_faith: "Ideology"
 game_concept_faith_astray: "Divergent"
 game_concept_faith_astray_desc: "This [rite|E] is in your political camp or a neighbouring one: you disagree on details.\n\n#S Effects:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc: "An $game_concept_faith$ is a politician's political creed, within a larger [religion|E]. Every character and [county|E] has one: a constituency's Ideology is the lean of its voters, and it drifts towards its MP's.\n\nAn Ideology's [doctrines|E] are its policy positions and its [core_tenets|E] its signature causes. Its [fervor|E] is how fired up its activists are.\n\nPoliticians of different Ideologies like each other less, the more so the further apart their camps are. Anyone can change their mind (the decision Change Your Politics), at a price."
 game_concept_faith_evil: "Irreconcilable"
 game_concept_faith_evil_desc: "This [rite|E] wants the opposite constitutional future: nationalist against unionist.\n\n#S Effects:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile: "Opposed"
 game_concept_faith_hostile_desc: "This [rite|E] is across the main political divide, left against right.\n\n#S Effects:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility: "Ideological Distance"
 game_concept_faith_hostility_desc: "All [faiths|E] have a relation towards each other that is determined by how far apart their politics are.\n\nIdeologies of the same or a neighbouring [religion|E] disagree on details; left and right are opposed; nationalists and unionists are irreconcilable.\n\nThe following relations exist: [faith_righteous|L], [faith_astray|L], [faith_hostile|L], and [faith_evil|L]."
 game_concept_faith_righteous: "Like-minded"
 game_concept_faith_righteous_desc: "This [rite|E] shares your politics.\n\n#S Effects:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive: "Ideology's"
 game_concept_faiths: "Ideologies"
 game_concept_feast_desc: "An [activity|E] where rulers and staff in a party gather to celebrate... one thing or another.\n\nParticipants will lose [stress|E] and increase their [opinion|E] of the host. There may also be any number of other consequences from bringing that many people together.\n\nA [ruler|E] will invite their [liege|E] and their [vassals|E] (along with various [courtiers|E]) to a $activity_feast$."
 game_concept_fervor: "Conviction"
 game_concept_fervor_desc: "The $game_concept_fervor$ of an [faith|E] ranges from #V 0#! to #V 100%#!. It measures how fired up its activists and voters are: turnout, volunteers and noise.\n\nHigh $game_concept_fervor$ makes constituencies of the Ideology care more about their MP's politics."
 game_concept_feudal_desc: "Under the Feudal [government_form|E], a [liege|E] gives their [vassals|E] [land|E] to govern in exchange for [levies|E] and [taxes|E], regulated by individual [vassal_contract|E] between Backbencher and Party Leader."
 game_concept_flowery_war_desc: "This is a special type of [war|E], started by a [ruler|E] whose [faith|E] practices human sacrifice. The primary goal of $game_concept_flowery_warring$ is to do battle and capture [prisoners|E] for sacrifice, with either side able to get enough [war_score|E] through combat to win without ever having to [siege|E].\n\nAt the end of the $game_concept_war$, if the victor (including the defender) follows a $game_concept_faith$ practicing human sacrifice, then they will take several $game_concept_prisoners$ from the [court|E] of the loser. If both main combatants in a $game_concept_flowery_war$ follow the same ideology, then the war is considered sacred, meaning that the loser still receives (reduced) [piety|E] even in defeat.\n\nYou cannot conduct or continue a $game_concept_flowery_war$ if you have any $game_concept_prisoners$ obtained through winning a $game_concept_flowery_war$ in your [dungeon|E]."
 game_concept_foreign_affairs_desc: "A [councillor_task|E] performed by the [chancellor|E].\nFor an [independent|E] [ruler|E], it increases the opinion other independent rulers have of them. For a backbencher, it increases the opinion that other backbenchers of the same [liege|E] have of them."
 game_concept_fp3_demand_submission_interaction_desc: "Demand a [character_possessive|E] loyalty in the form of a [hook|E] by using political capital, guile, or intimidation."
 game_concept_gender_doctrines: "Gender Policy Positions"
 game_concept_gender_doctrines_desc: "These [doctrines|E] determine which [gender_laws|E] are available to characters of the [faith|E].\n\nIt also determines certain additional rules, such as what [claims|E] can be inherited, who can be [commanders|E] and [knights|E], and to which of their parents' [house|E] a [bastard|E] will belong.\n\nThe Gender Policy Positions are:\n$BULLET_WITH_TAB$Male Dominated\n$BULLET_WITH_TAB$Equal\n$BULLET_WITH_TAB$Female Dominated"
 game_concept_gift_desc: "Sending a Gift to another character will increase their [opinion|E] of you in exchange for [gold|E][gold_i].\n\nThe greedier the recipient, the more Funds you will have to send, and the more Opinion you will get.\n\nThe higher your [diplomacy|E], the more Opinion you will get."
 game_concept_glory_desc: "An [accolade_possessive|E] Glory increases its [accolade_rank|E].\n\nGlory is gained by the [acclaimed_knight|E] winning [battles|E], defeating warriors, competing in [GetActivityType( 'activity_tournament' ).GetName] [contests|E], and attending [activities|E].\n\nHowever, the Accolade's Glory is lowered when the Star Organiser is involved in losing battles, and may also diminish on [accolade_succession|E] if the Star Organiser did not die in battle, a duel, or some other honorable fashion."
 game_concept_gold: "Funds"
 game_concept_gold_desc: "Funds are a politician's money: donations, membership subscriptions and campaign war chests. They pay for staff, offices, leaflets and campaigns."
 game_concept_goliardic_shenanigans_desc: "A character in [GetActivityType('activity_adult_education').GetName] can get up to all sort of mischief when embracing the life of the student. The consequences of their adventures are unpredictable, and include [skill|E] points, lifestyle and pressure [traits|E], lifestyle experience, diseases, and wounds."
 game_concept_government_authority_desc: "$game_concept_government_authority$ represents the general power that a [ruler|E] wields over their [vassals|E].\n\nDifferent [governments|E] have different form of $game_concept_government_authority$. For example, [feudal|E] [realms|E] use [crown_authority|E], [clans|E] use [tribal_authority|E], and [administrative|E] use [imperial_bureaucracy|E]. Increasing $game_concept_government_authority$ costs an amount of [prestige|E] depending on the level and the ruler's [learning_skill|E].\n\n#weak Backbenchers dislike higher levels of $game_concept_government_authority$, and lowering it is the primary goal of [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!\n\nNot all [governments|E] have $game_concept_government_authority$."
 game_concept_governor_desc: "A $game_concept_governor$ is the primary backbencher of a [liege|E] with a [government_bureaucratic_gov|E]. They are appointed by their Party Leader to preside over the lands within the [realm|E], utilizing their [governor_efficiency|E].\n\nA $game_concept_governor$'s [title|E], as well as the [counties|E] it includes, is referred to as a [province|E]. [governance_issues|E] may appear inside a Province, which the $game_concept_governor$ has to solve.\n\n$game_concept_governors$ can accumulate [influence|E] and manipulate the [succession|E] of other $game_concept_governorships$."
 game_concept_great_holy_war_desc: "A $game_concept_great_holy_war$ is a special type of [war|E] that only the [head_of_faith|E] of certain [faiths|E] can declare, with the goal of bringing an entire [kingdom|E] under the rule of their Ideology.\n\n$game_concept_great_holy_wars$ target all [rulers|E] of another [religion|E] within a chosen [kingdom|E], forcing them to defend together. If victorious, all [titles|E] within the targeted Nation will be seized and divided between the attackers.\n\nDepending on its [doctrines|E], an Ideology might have access to [directed_great_holy_wars|E], [undirected_great_holy_wars|E] or no $game_concept_great_holy_wars$ at all:\n$EFFECT_LIST_BULLET$The [GetTenetType('tenet_armed_pilgrimages').GetBaseName], [GetTenetType('tenet_struggle_submission').GetBaseName], or [GetTenetType('tenet_warmonger').GetBaseName] [core_tenets|E] are required to access to Great Holy Wars in general\n$EFFECT_LIST_BULLET$Ideologies with a [GetDoctrineType('doctrine_temporal_head').GetBaseName] Head only have access to Directed Great Holy Wars\n$EFFECT_LIST_BULLET$Ideologies with a [GetDoctrineType('doctrine_spiritual_head').GetBaseName] Head only have access to Undirected Great Holy Wars\n$EFFECT_LIST_BULLET$Ideologies without a Movement Leader cannot declare any Great Holy Wars, even if they would normally be eligible\n\nSome Ideologies have special names for their Great Holy Wars such as 'Crusade' or 'Jihad'. These Great Holy Wars differ in name only, and function as any other Great Holy War."
 game_concept_great_project_desc: "Great Projects are massive undertakings that call on all the resources of the [realm|E].\n\nSome Great Projects involve constructing a [great_building|E], while others involve recovering from a [natural_disaster|E].\n\nWhile the Party's [ruler|E] oversees the development of the Great Project, [subjects|E] can offer [great_project_contributions|E] to assist its progress."
 game_concept_head_of_faith: "Movement Leader"
 game_concept_head_of_faith_desc: "A $game_concept_head_of_faith$ is the formal leader of a [faith|E]. The powers and nature of the $game_concept_head_of_faith$ depends on the [doctrines|E] of the Ideology.\n\nSome Ideologies have a [spiritual_head_of_faith|E] #weak (e.g. the Pope)#!, some a [temporal_head_of_faith|E] #weak (e.g. a Caliph)#!, and some do not have a $game_concept_head_of_faith$ at all."
 game_concept_head_of_faith_possessive: "Movement Leader's"
 game_concept_head_of_rite: "Leading Voice"
 game_concept_head_of_rite_desc: "The leading [character|E] of an [rite|E]: the politician who leads the most of its [counties|E]."
 game_concept_heads_of_faith: "Movement Leaders"
 game_concept_herder_desc: "Herder parties are removed from all aspects of rulership. They do not command [armies|E], own [buildings|E], create [alliances|E], or declare [wars|E]. When [nomads|E] [migrate|E] a [holding|E], herders will slowly replenish the local [county_fertility|E] by virtue of their smaller flock.\n\nThey are intimidated by proper [nomad|E] [rulers|E] and will immediately surrender their land when challenged."
 game_concept_heresies: "Splinter Groups"
 game_concept_heresy: "Splintering"
 game_concept_heresy_desc: "When the [fervor|E] of a [faith|E] falls critically low, a Splintering outbreak may erupt. Outbreaks come in three increasingly severe forms:\n#indent_newline:7 $BULLET_WITH_TAB$An existing [rite|E] becomes more [rite_divergent|E] and spreads further afield.#!\n#indent_newline:7 $BULLET_WITH_TAB$A significantly [rite_divergent|E] new [rite|E] appears and sweeps across the lands.#!\n#indent_newline:7 $BULLET_WITH_TAB$For Christian [faiths|E], a historical splintering such as Bogomilism or Catharism appears.#!\n\nA [faith|E] stands at true risk of Splintering only once its [mainline_rite|E] is in at least #V 100#! [counties|E]. Below that the two more severe forms cannot erupt at all, and even the mildest is far rarer.\n\nEvery outbreak ends in a unifying surge of $game_concept_fervor$."
 game_concept_heretical: "Breakaway"
 game_concept_high_crown_authority_desc: "$game_concept_high_crown_authority$ is the second to highest level. [vassals|E] have a #N -20#! [opinion|E] penalty toward their [liege|E].\n\nAt this level — in addition to the powers the party leader gets at [limited_crown_authority|E] — backbenchers under the same party leader can no longer wage war against each other, the ruler can change between all available [succession_laws|E], and backbenchers' [titles|E] cannot be inherited by rulers outside the party leader's [realm|E].\n\nLastly, refusing title [revocation|E] or backbencher [retraction|E] is considered a [crime|E] even if the party leader lacks sufficient justification."
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ is the middle level of [nomadic_authority|E]. At this level [migration|E] can target [de_jure|E] [kingdom|E] [titles|E] within the [the_great_steppe|E] and the party leader can [retract|E] a [vassal|E]'s backbenchers."
 game_concept_high_tribal_authority_desc: "$game_concept_high_tribal_authority$ is the second-highest level of [tribal_authority|E]. [vassals|E] have a #N -20#! [opinion|E] penalty toward their [liege|E].\n\nAt this level, as well as the ability to [imprison|E] [characters|E], the party leader may [revoke|E] [titles|E] and [retract|E] a backbencher's backbenchers."
 game_concept_hold_court_desc: "An [activity|E] where [vassals|E] and [courtiers|E] in a [realm|E] gather at a [royal_court|E] to petition their [liege|E] and air their grievances.\n\nSituations the Party Leader will be called to pass judgment upon can range from petty disputes and misunderstandings to realm-wide catastrophes. Most issues will have a solution that is beneficial – if not for the involved parties then at least for the party leader."
 game_concept_holder_desc: "A [title|E]'s $game_concept_holder$ is the character who owns the title. [barony|E] and [county|E] titles will always have $game_concept_holders$ once settled, whereas [duchy|E], [kingdom|E] and [empire|E] titles might not have been created yet. As a further caveat, the $game_concept_holder$ of a high-level Title might not actually control any territory within the Title's [de_jure|E] area.\n\nHolding higher-tier Titles allows you to have higher-tier [vassals|E]. For example, Dukes can have Counts as Backbenchers, and Kings can have Dukes."
 game_concept_holding_court: "Holding a Surgery"
 game_concept_holy_relic_desc: "A $game_concept_holy_relic$ is an [artifact|E] that holds religious significance for a [faith|E]. A $game_concept_holy_relic$ can be [enshrined|E] in a [holy_site|E] of that ideology to gain benefits.\n\nSome artifacts are inherently holy for an ideology, but artifacts can also be [sanctified|E] to become a holy relic."
 game_concept_holy_site: "Heartland"
 game_concept_holy_site_desc: "A $game_concept_holy_site$ is a [county|E] which contains a place of religious significance to a [faith|E]. $game_concept_holy_sites$ held by a Character of the correct Ideology will provide an effect to everyone of that Ideology, and can also allow the creation of [special_buildings|E] or [holy_orders|E]. Each Ideology has a different set of $game_concept_holy_sites$.\n\nAn ordinary $game_concept_holy_site$ gives no global ideology benefits, only local ones. An Ideology's most revered sites are instead designated as [eminent_holy_sites|E]. An Ideology can only have a limited number of each."
 game_concept_holy_sites: "Heartlands"
 game_concept_holy_war_desc: "A $game_concept_holy_war$ is a special type of [war|E] waged by a [ruler|E] of one [faith|E] against a Ruler of a different Ideology.\n\n$game_concept_holy_war$ are usually quite destructive, with the winner of a Holy War typically seizing all [counties|E] in the targeted area for themselves. However, if attacker's Ideology is [GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName] or the defender has [vassals|E] of the attacker's own Ideology in the targeted area, some or all Backbencher Rulers in the targeted area may simply be transfered to the attacker instead.\n\nUnlike other wars, Rulers of the same Ideology as the target may choose to join in their defense without the need of an [alliance|E].\n\nHoly Wars may be allowed or restricted depending on the different [religious_families|E]"
 game_concept_home_court: "Home Office"
 game_concept_home_courts: "Home Offices"
 game_concept_home_courts_possessive: "Home Office's"
 game_concept_hungarian_invasion_casus_belli_desc: "A powerful [casus_belli|E] that may only be used once per campaign, total, to conquer all territories held by the target within Pannonia.\n\nOn victory, all $mogyer_collective_noun$ in the attacker's [realm|E] will move with them to Pannonia, [counties|E] #EMP and#! [vassals|E], displacing $avar$ $game_concept_counties$. Other backbenchers outside of Pannonia are abandoned, while $game_concept_counties$ formerly occupied or held by $mogyer_collective_noun$ are left to local petty warlords and rival steppe tribes."
 game_concept_hybrid_culture_desc_DLC: "A $game_concept_hybrid_culture$ is a [culture|E] that was created by a [ruler|E] as the combination of two existing Cultures.\n\nThe $game_concept_hybrid_culture$ is a mixture of the two original Culture's [traditions|E], [culture_pillars|E], and Aesthetics.\n\nOnly Cultures of different [heritage|E] can form a Hybrid, and the [prestige|E] cost to do so is based on their [cultural_acceptance|E] of each other.\n\nThe higher the Cultural Acceptance, the more [counties|E] will convert when a Hybrid forms. Rulers of a Hybrid culture [promote_culture|E] much faster in Constituencies of its parent cultures for #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! years after it forms.\n\nNew Cultures can also appear as a [divergent_culture|E]."
 game_concept_iberian_reclamation_desc: "This is a special type of [war|E] available to [struggle_involved|E] [rulers|E] of the [iberian_struggle|E].\n\nThe attacker aims to conquer a [duchy|E] which contains any [struggle_involved|E] [counties|E] held by an [struggle_interloper|E] or [struggle_uninvolved|E] [ruler|E], or [vassalize|E] them if they hold no land outside that Region."
 game_concept_initial_legitimacy: "Initial Mandate"
 game_concept_intrigue: "Spin"
 game_concept_intrigue_lifestyle: "Spin Lifestyle"
 game_concept_intrigue_skill: "Spin Skill"
 game_concept_intrigue_skill_desc: "$game_concept_intrigue$ is a [skill|E] for working the media and reading people: the briefing, the leak, the story placed in a friendly paper, the plot kept quiet.\n\nIt is mainly used to further, and defend against, Spin [schemes|E].\n\nThe corresponding [lifestyle|E] is the [intrigue_lifestyle|E]."
 game_concept_intrigue_task_contract: "Spin Contract"
 game_concept_intrigue_task_contract_possessive: "Spin Contract's"
 game_concept_intrigue_task_contracts: "Spin Contracts"
 game_concept_intrigue_task_contracts_possessive: "Spin Contracts'"
 game_concept_kingdom: "Nation"
 game_concept_kingdoms: "Nations"
 game_concept_knight: "Organiser"
 game_concept_knight_army_modifier: "Organiser Army Modifier"
 game_concept_knight_army_modifier_desc: "An effect applied to any [army|e] which #high contains#! the pertinent [acclaimed_knight|e].\n\nThe [knight|e] need #high not#! be their Army's [commander|e] for their Organiser Army Modifier to apply."
 game_concept_knight_army_modifiers: "Organiser Army Modifiers"
 game_concept_knight_desc: "A $game_concept_knight$ is a [vassal|E], [courtier|E], or [follower|E] that fights directly in your [army|E].\n\nDuring [battles|E], $game_concept_knights$ use their [prowess_skill|E] to fight more effectively. A high $game_concept_prowess$ means that they will be able to inflict more damage on the enemy, and are more likely to survive or even emerge from $game_concept_battle$ unscathed.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Organisers can be known by different names depending on [culture] or [faith]. For example, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ or $knight_baghatur_no_tooltip_plural$.\n\nOrganisers represent both the character and their retinue of troops.#!"
 game_concept_knight_desc_ACCOLADE_DLC: "Organisers that are given an [accolade|E] become [acclaimed_knights|E].\n\n"
 game_concept_knight_effectiveness: "Organiser Effectiveness"
 game_concept_knight_effectiveness_desc: "A [ruler|E]'s Organiser Effectiveness determines how well their [knights|E] fight in [battle|E].\n\nAt 100%, Organisers fight as normal, but at 200% they fight as if their [prowess|E] was doubled."
 game_concept_knights: "Organisers"
 game_concept_knights_possessive: "Organiser's"
 game_concept_kurultai_desc: "The Kurultai replaces the [council|E] for the [nomadic_government|E]. The Kurultai members are among the elite of the party, and should either be appeased or forced into [obedience|E] to assure a smooth [succession|E].\n\nAfter the event of a chaotic succession, they may steal some [herd|E], abandon their new [liege|E], they will gain a [claim|E] on the [realm|E] [title|E]."
 game_concept_law_desc: "A [realm_possessive|E] Laws are what determine how that Party is structured.\n\nThe most fundamental of these is the Party's [government_authority|E], as those Laws determine how [lieges|E] and [vassals|E] interact on a regular basis.\n\nThough less impactful on the day-to-day life of [rulers|E] in a Party, [succession_laws|E] and [title_laws|E] are still very important to consider for [succession|E]."
 game_concept_learning: "Policy"
 game_concept_learning_lifestyle: "Policy Lifestyle"
 game_concept_learning_skill: "Policy Skill"
 game_concept_learning_skill_desc: "$game_concept_learning$ is a [skill|E] for ideas and detail: briefs read, bills drafted, select committees survived. It also brings in [piety|E] every month.\n\nThe corresponding [lifestyle|E] is the [learning_lifestyle|E]."
 game_concept_learning_task_contract: "Policy Contract"
 game_concept_learning_task_contract_possessive: "Policy Contract's"
 game_concept_learning_task_contracts: "Policy Contracts"
 game_concept_learning_task_contracts_possessive: "Policy Contracts'"
 game_concept_leasing_desc: "Minor [baronies|E] can be leased out to [holy_orders|E], [monastic_holy_orders|E], or [clergy|E]. Leased wards provide [taxes|E] and [levies|E] to the [lessee|E] rather than the [holder|E].\n\nMilitary Orders can lease [castle_holdings|E] and [city_holdings|E], while Monastic Orders and party officials can lease [temple_holdings|E]. A lease may have a [lease_contract|E].\n\nLeased [holdings|E] are still considered part of the holder's [realm|E]. [county_capitals|E] cannot be leased."
 game_concept_legitimacy: "Mandate"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ is a leader's right to govern in the eyes of the party and the country: the election won, the leadership contest carried, the confidence of the House. A [ruler|E] without one is living on borrowed time. [vassals|E] also generate [legitimacy_expectations|E] that the [liege|E] is supposed to meet.\n\nOnly [rulers|E] have $game_concept_legitimacy$, which is calculated at the moment they become rulers and results in their [initial_legitimacy|E]. A fraction of the $game_concept_legitimacy$ of the previous ruler is also inherited by their [heir|E].\n\n$game_concept_legitimacy$ affects many of the game systems, making [marriage|E] proposals, [vassalization|E] and [alliances|E] more likely to be accepted, and [claims|E] cheaper, as well as swinging the [scales_of_power|E] in a [regency|E].\n\n$game_concept_legitimacy$ typically has 5 [legitimacy_levels|E] and one #weak Illegitimate#! bottom level.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_expectations: "Mandate Expectations"
 game_concept_legitimacy_gain: "Mandate Gain"
 game_concept_legitimacy_level: "Mandate Level"
 game_concept_legitimacy_level_desc_nomadic: "\n\n[GetGovernment( 'nomad_government' ).GetName] rulers gain #V 50%#! more Mandate from winning wars, but they also lose double on defeat. They will also gain Mandate from [single_combat_duel_plural|E] and marrying noble-born [courtiers|E] of someone of equal or higher [dominance|E]."
 game_concept_legitimacy_levels: "Mandate Levels"
 game_concept_levies: "Volunteers"
 game_concept_levy: "Volunteer"
 game_concept_liege: "Party Leader"
 game_concept_liege_desc: "A $game_concept_liege$ is a politician with at least one [vassal|E] answering to them. Party Leaders themselves answer to the Prime Minister."
 game_concept_liege_possessive: "Party Leader's"
 game_concept_liege_taxes: "Party Leader Taxes"
 game_concept_liege_taxes_desc: "Your $game_concept_liege_taxes$ are the [taxes|E] that you must pay to your [liege|E] as part of your [obligations|E]. You do not pay any $game_concept_liege_taxes$ if you are [independent|E].\n\nFrom your Party Leader's point of view, these same taxes are instead called [vassal_taxes|E] to distinguish them from any taxes they may owe to their own $game_concept_liege$."
 game_concept_lieges: "Party Leaders"
 game_concept_limited_crown_authority_desc: "'$game_concept_limited_crown_authority$' is the second to lowest level of [crown_authority|E]. [vassals|E] have a #N -10#! [opinion|E] penalty toward their [liege|E], and the party leader may [revoke|E] [titles|E] and [retract|E] a backbencher's backbenchers. The [ruler|E] can change between available Partition [succession_laws|E]."
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ is the second-lowest level of [nomadic_authority|E]. [migration|E] can target [de_jure|E] [duchy|E] [titles|E] within the [the_great_steppe|E], [titles|E] can be revoked and the party leader may now [imprison|E] [characters|E] in their [realm|E].\n\nCan use the #V $step_away_from_the_steppe_decision$#! [decision|E]"
 game_concept_limited_tribal_authority_desc: "$game_concept_limited_tribal_authority$ is the second-lowest level of [tribal_authority|E]. [vassals|E] have a #N -10#! [opinion|E] penalty towards their [liege|E], and the party leader may now [imprison|E] [characters|E] in their [realm|E]."
 game_concept_long_reign_desc: "'Long Reign' is an increasing [opinion|E] bonus that all characters in a [realm|E] get with a [liege|E] who has ruled over them for a long time.\n\nSimilarly, subjects have a decaying [short_reign|E] Opinion penalty with new Party Leaders."
 game_concept_mainline_rite: "Ideology"
 game_concept_mainline_rites: "Ideologies"
 game_concept_manage_guards_desc: "$game_concept_increase_control$ is a [councillor_task|E] performed by the [marshal|E].\n\nIt increases [knight_effectiveness|E] and lowers [hostile_scheme|E] [success_chance|E] against the minister's [liege|E]."
 game_concept_mandala_decree_desc: "The $game_concept_mandala_decrees$ are the three Decrees mandated by the [mandala|E] [ruler|E] — signified by [prosperity_decree|E], [expansion_decree|E] and [reverence_decree|E].\n\nGenerally the Mandala party has a very centralized authority, where the power over [subjects|E] and [laws|E] lies with the associated Ruler who can change them as required with little to no objection from its denizens."
 game_concept_mandala_desc: "Under the $game_concept_mandala$ [government_form|E], the [domain_limit|E] and amount of [direct_vassals|E] are limited. Instead the [liege|E] and [suzerain|E] are reliant on [tributaries|E] for expanding their party. \n\nA Mandala [ruler|E] can aspire to be seen as a God King, or Devaraja, and then relies on [mandala_radiance|E] to acquire and keep $game_concept_tributaries$.\n\nA $game_concept_ruler$ must maintain [opinion|E] and grow relations with their $game_concept_tributaries$ to keep them long-term. On succession $game_concept_tributaries$ may scatter unless the $game_concept_ruler$ is a worthy [mandala_succesor|E]."
 game_concept_mandate_of_heaven_desc: "The $game_concept_mandate_of_heaven$ is a special type of [legitimacy|E] only available to [son_of_heaven|E]. It represents the monarch's right to rule, and who is considered the supreme ruler under all of heaven.\n\nThe Mandate is closely connected to the [dynastic_cycle|E]. The Cycle affect how the reigning monarch gains Mandate and may also change [situation_dynastic_cycle_phase|E] based on the monarch's level of Mandate."
 game_concept_marshal: "Home Secretary"
 game_concept_marshal_desc: "The $game_concept_marshal$ is the [councillor|E] in charge of security: the police, borders and keeping order."
 game_concept_marshals: "Home Secretaries"
 game_concept_martial: "Security"
 game_concept_martial_lifestyle: "Security Lifestyle"
 game_concept_martial_skill: "Security Skill"
 game_concept_martial_skill_desc: "$game_concept_martial$ is a [skill|E] for law and order, defence and crisis management: keeping the streets and the country safe.\n\nThe corresponding [lifestyle|E] is the [martial_lifestyle|E]."
 game_concept_master_assassin_desc: "The $game_concept_master_assassin$ is a [court_position|E] enabled by [faiths|E] with the [GetTenetType('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]. The $game_concept_master_assassin$ is a dangerous fanatic who works together with lesser assassins to slay perceived enemies of the ideology."
 game_concept_maximum_piety_level: "Maximum Political Capital Level"
 game_concept_men_at_arms: "Activists"
 game_concept_men_at_arms_counter: "Activists Counter"
 game_concept_men_at_arms_desc: "$game_concept_men_at_arms$ are professional [soldiers|E] superior to [levies|E].\n\nThe player has direct control over the composition and size of their Activists [regiments|E].\n\nDifferent types of Activists are good or bad in different types of [terrain|E]. Each type also [counters|E] another type.\n\nActivists can be [stationed|E] in [holdings|E] to increase their effectiveness."
 game_concept_mental_break_desc: "When [stress|e] overwhelms a character they will experience a Mental Break — a personal crisis in which they feel that they must do something to lower their Pressure, no matter the cost.\n\nCharacters suffering from a Mental Break will have several ways that they can deal with the situation, though many of them will have negative consequences.\n\nAt low [stress_levels|E] these consequences are minor and easily managed. As Pressure Level increases however, so do these consequences, eventually leading to insanity and even death."
 game_concept_minister_grand_chancellor_desc: "The $game_concept_minister_grand_chancellor$ is the highest ranking [minister|E] and is in charge of diplomatic matters. They are typically assigned the position of [grand_secretariat_director|E].\n\nThe Foreign Secretary can be the designated [grand_secretariat_director|E], depending on the #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "The $game_concept_minister_grand_marshal$ is the highest ranking commander in the [realm|E] and commands an [army|E] of [title_men_at_arms|E].\n\nThe Home Secretary can be the designated [grand_secretariat_director|E], depending on the #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ is a unique set of [vassal_obligations|E] only available for [ministers|E].\n\nAll civil ministers have a specific option set as their default, while the [minister_grand_marshal|E] has a unique option that provides the Home Secretary with [title_men_at_arms|E].\n\nThese obligations cannot be changed."
 game_concept_natural_prowess: "Natural Stamina"
 game_concept_noble_family_desc: "$game_concept_noble_families$ are powerful [houses|E] in a [government_bureaucratic_type|E] [realm|E]. They own an [estate|E], controlled and managed by the [house_head|E], and remain an integral part of the Party at all times, as they will attempt to gather [influence|E] and secure [provinces|E] for themselves.\n\nAn influential $game_concept_noble_family$ may become a [powerful_family|E] or a [dominant_family|E]."
 game_concept_obedience_desc: "In [GetGovernment( 'nomad_government' ).GetName] [realms|E], obedience determines the loyalty of a [character|E] to their [liege|E], [suzerain|E] or owner of their [court|E]. Characters can only be obedient to one [ruler|E] at a time.\n\nObedient characters are less likely to participate in [hostile_schemes|E], join [wars|E] or join [factions|E] against their party leader. They will always support their party leader's preferences during [succession|E] and won't press their [claims|E] on them. Non-obedient [tributaries|E] may try to break free.\n\nWhen a character's score surpasses the [obedience_threshold|E] they become obedient."
 game_concept_offer_vassalization_desc: "An interaction offering [vassalage|E] to an [independent|E] [ruler|E] of lower [title_rank|E], peacefully adding them to the party."
 game_concept_organize_levies_desc: "A [councillor_task|E] performed by the [marshal|E]. It increases [garrison|E] Size and [levy|E] Reinforcement Rate in the [realm|E] of the minister's [liege|E]."
 game_concept_organized_desc: "An Organized [faith|E] has a religious hierarchy. Worship and practices are more organized and scriptures are formalized.\n\n[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] Ideologies can become Organized by reforming, while other Ideologies are always considered Organized."
 game_concept_pam_challenge_hof_cb: "Challenge Movement Leader"
 game_concept_papal_recipient_desc: "If the main target of the [great_holy_war|E] is already held or claimed by a member of the aggressor ideology, they will be considered the rightful recipient of the title being fought over, unless the main [Concept( 'war_contribution', 'Contributor' )|E] decides to give precedence to their [beneficiary|E]."
 game_concept_peasant_faction_desc: "The $game_concept_peasant_faction$ is populated by [counties|E] with low [county_opinion|E]. Unlike other [factions|E], this one will always revolt even if [faction_military_power|E] is low, as peasants are generally both optimistic and illiterate... Successful Protest Movements will significantly lower Control in your [realm|E]."
 game_concept_peasant_factions: "Protest Movements"
 game_concept_perk_desc: "Perks are unlockable boons that provide many useful and interesting effects. They are unlocked by selecting a [focus|E] within a [lifestyle|E] and spending the associated form of [experience|E] #weak (e.g. Spin $game_concept_experience$ if you wish to unlock an $game_concept_intrigue_lifestyle$ $game_concept_perk$.)#!"
 game_concept_personal_tenet: "Personal Cause"
 game_concept_personal_tenets: "Personal Causes"
 game_concept_petition_antipope_gold_interaction: "Petition Antipope for Funds"
 game_concept_piety: "Political Capital"
 game_concept_piety_desc: "$game_concept_piety$ is a politician's credit with their party and the establishment: loyalty shown, favours done, the right causes backed.\n\nIt is spent on asking things of the party and the establishment, depending on the [government_form|E].\n\nEach time a Character gains Political Capital, they also progress towards the next [piety_level|E]."
 game_concept_piety_experience: "Loyalty"
 game_concept_piety_experience_desc: "Each point of Loyalty a character gets increases their progress towards the next [piety_level|E]. When a character gains [piety|E] they also gain an equal amount of Loyalty."
 game_concept_piety_level: "Political Capital Level"
 game_concept_piety_level_desc: "A Character's $game_concept_piety_level$ is a measure of how much credit they have banked with their party and the establishment, and of their standing with others of their [faith|E].\n\nEvery time a Character gains [piety|E], they also progress toward the next Political Capital Level.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nThe Levels are:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact: "Political Capital Level Impact"
 game_concept_piety_level_impact_desc: "Political Capital Level Impact increases or decreases the [modifiers|E] gained from your current [piety_level|E]."
 game_concept_piety_levels: "Political Capital Level(s)"
 game_concept_playdate_desc: "An [activity|E] where rulers and staff below the age of [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] gather to play and forget the dreariness of the day.\n\nParticipants will lose [stress|E] and increase their [opinion|E] of the host. There may also be any number of other consequences from bringing that many children together.\n\nA [ruler|E] will invite their [liege|E] and their [vassals|E] (along with various [courtiers|E]) to a $activity_playdate$."
 game_concept_player_heir_desc: "The $game_concept_player_heir$ is the [heir|E] that a player will keep playing as on [succession|E].\n\nThe $game_concept_player_heir$ is usually the same as the [primary_heir|E], but if the [succession_law|E] of your [primary_title|E] dictates that it should go to a character outside of your [dynasty|E], you will instead keep playing as the dynastic heir to your second highest-tier title (or third, fourth, etc.).\n\nThis situation is common when your $game_concept_player_heir$ is voted out under an Elective Succession Law. If you are [house_head|E] of a [noble_family|E] in an [administrative|E] [realm|E] you may lose your Party to Primary Heirs outside of your [house|E] but retain your Noble Family Title.\n\nIf you are [ecclesiastical|e], your $game_concept_player_heir$ is the character who is set to inherit your [primary_title|e], usually an [archdiocese|e]."
 game_concept_popular_faction_desc: "The $game_concept_popular_faction$ is populated by [counties|E] with low [county_opinion|E] that share a common element, such as [culture|E] or [faith|E]. They seek to break free, and choose a new [ruler|E] based on their Culture or Ideology. This type of uprising is typically very dangerous."
 game_concept_popular_factions: "Populist Movements"
 game_concept_powerful_family_desc: "A $game_concept_powerful_family$ represents one of the most influential [houses|E] and [noble_families|E] in a [government_bureaucratic_type|E] [realm|E].\n\nA member of a $game_concept_powerful_family$ is better at [political_schemes|E] and is more likely to get what they want when [interacting|E] with other [characters|E].\n\nThere can only be a limited number of $game_concept_powerful_families$ at any given time, and it is the top rated $game_concept_noble_families$ that are considered powerful based on their [powerful_family_rating_short|E]. The House of the [top_liege|E] is an exception, which is always considered Powerful.\n\nA Family controlling a significant part of a Party's land can become a [dominant_family|E]."
 game_concept_powerful_vassal: "Powerful Backbencher"
 game_concept_powerful_vassal_desc: "'$game_concept_powerful_vassals$' are the handful of [vassals|E] with the most [soldiers|E] and highest [income|E]. You need to pay careful attention to these backbenchers, because they expect to hold a seat on your [council|E] and will have significantly lower [opinion|E] of you if they do not.\n\nChanging a [succession_law|E] requires all $game_concept_powerful_vassals$ to either have a positive [opinion|E] of you, be [cowed|E] by you, or be [imprisoned|E]."
 game_concept_powerful_vassal_possessive: "Powerful Backbencher's"
 game_concept_powerful_vassals: "Powerful Backbenchers"
 game_concept_prestige: "Profile"
 game_concept_prestige_desc: "$game_concept_prestige$ is a politician's public fame: name recognition, column inches and airtime.\n\nIt is spent on public moves, depending on the [government_form|E].\n\nEvery time a Character gains Profile, they also progress toward the next [prestige_level|E]."
 game_concept_prestige_experience: "Fame"
 game_concept_prestige_level: "Profile Level"
 game_concept_prestige_level_impact: "Profile Level Impact"
 game_concept_prestige_level_impact_desc: "Profile Level Impact increases or decreases the [modifiers|E] gained from your current [prestige_level|E]."
 game_concept_prestige_levels: "Profile Levels"
 game_concept_prince_elector_desc: "$game_concept_prince_electors$ are the #V 7#! [electors|E] who select a [title_heir|E] along with the Emperor under the [GetLaw('princely_elective_succession_law').GetName] [succession_law|E] used by [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )].\n\n[holders|E] of #V 7#! preferred [titles|E] are prioritized as $game_concept_prince_electors$. These Titles are selected when the Empire is created.\n\nIf a $game_concept_prince_elector$ Title is destroyed, not held by a [de_jure|E] Imperial [vassal|E], held by another $game_concept_prince_elector$, or the Holder's [religion|E] differs from the Emperor's, another De Jure Title held by a direct Imperial Backbencher or [independent_ruler|E] will be selected based on these criteria:\n$EFFECT_LIST_BULLET$[rulers|E] of Emperor's [faith|E] and [culture|E] are favored\n$EFFECT_LIST_BULLET$[theocratic|E] and [feudal|E] Rulers are favored\n\n#help Preferred Titles are listed in the Election view#!"
 game_concept_promote_other_culture_development_decision_desc: "A [decision|E] that enables you to improve [development|E], [control|E], [building|E] costs, and defensive [advantage|E] in [counties|E] from different [cultures|E] with a [cultural_acceptance|E] of #V 75%#! or more.\n\nTaking the Decision will also increase your [prestige|E] [prestige_i] and [levies|E].\n\nAll Constituencies in the [realm|E] are affected. The [gold|E] cost scales with the number of affected Constituencies."
 game_concept_prowess: "Stamina"
 game_concept_prowess_skill: "Stamina Skill"
 game_concept_prowess_skill_desc: "$game_concept_prowess$ is a [skill|E] that reflects a Character's physical and mental endurance: eighteen-hour days, all-night sittings and the campaign trail.\n\nA high Stamina Skill means they are more likely to survive and perform well both as [knights|E] in [battles|E] and in [single_combat_duel_plural|E].\n\nEach point of Stamina gives an Organiser:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_raid_desc: "[armies|E] can be raised as $game_concept_raiders$ from [rally_points|E]. $game_concept_raiders$ can move into neighboring lands and pillage them for [gold|E].\n\nIn order to $game_concept_raid$, a Raiding Army must stop in a [holding|E] owned by a foreign [ruler|E] and choose to start Raiding — upon doing so they will be stuck Raiding for a some time, after which they will get Funds and pillage the Holding.\n\nFunds will be stored on the Army, and only added to the treasury when they arrive home. If you defeat a Raiding Army carrying Funds you will take it, and they will be unable to Raid you for some time.\n\nOnly some Rulers are allowed to $game_concept_raid$, most notably [tribal|E] and [GetGovernment( 'nomad_government' ).GetName] Rulers.\n\nSpecific [raid_intents|E] can be set to obtain different rewards."
 game_concept_rally_point_desc: "A $game_concept_rally_point$ is a mustering ground for the [levies|E] and [men_at_arms|E] under your command.\n\nIn times of [war|E], you can call up your [soldiers|E] at a Rally Point to gather an [army|E].\n\nThe Volunteers assigned to a Rally Point must come from either your own [domain|E] or your [vassals|E]. Rally Points can be reorganized, split and merged as you see fit."
 game_concept_realm: "Party"
 game_concept_realm_capital: "Home Base"
 game_concept_realm_capital_desc: "The $game_concept_realm_capital$ is the [holding|E] where a [ruler|E] and their [court|E] resides. This Holding has a [tax|E] bonus, and is always inherited by the [primary_heir|E].\n\n[occupying|E] the Home Base of an enemy in a war gives a significant amount of [war_score|E] and sometimes lets you [imprison|E] members of the enemy's family."
 game_concept_realm_capital_possessive: "Home Base's"
 game_concept_realm_capitals: "Home Bases"
 game_concept_realm_desc: "A $game_concept_realm$ is everyone and everything a politician leads, directly or through their [vassals|E] (unlike a [domain|E], which is only what they hold themselves)."
 game_concept_realm_heir: "Party Heir"
 game_concept_realm_heir_desc: "A Party Heir is one of the [heirs|E] of a [realm|E], and will receive either all or some of the [titles|E] held by the [ruler|E] of that Party when that Ruler dies.\n\nA Party may have one or more Party Heirs depending on its [succession_law|E]."
 game_concept_realm_heirs: "Party Heirs"
 game_concept_realm_law: "Party Law"
 game_concept_realm_law_desc: "Laws that are applied to this character's party, such as the level of [crown_authority|E] or [tribal_authority|E]."
 game_concept_realm_possessive: "Party's"
 game_concept_realm_priest: "Party Priest"
 game_concept_realm_priest_desc: "A $game_concept_realm_priest$ is a [councillor|E] in charge of religious and spiritual affairs in [faiths|E] with the [GetDoctrineType('doctrine_theocracy_temporal').GetBaseName] [doctrine|E].\n\nUnlike their [GetDoctrineType('doctrine_theocracy_lay_clergy').GetBaseName] equivalent ([court_chaplains|E]), $game_concept_realm_priests$ automatically [lease|E] all [temple_holdings|E] in a [ruler|E]'s [domain|E], and also receive a portion of [taxes|E] and [levies|E] from [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ provide their [liege|E] with Volunteers and Taxes if they have a positive Opinion of them. The higher the [opinion|E] of their [liege|E], the more they will provide.\n\n$game_concept_realm_priests$ with a low Opinion of their Party Leader will not provide them with any Taxes or Volunteers, and might cause problems."
 game_concept_realm_priest_possessive: "Party Priest's"
 game_concept_realm_priests: "Party Priests"
 game_concept_realm_size: "Party Size"
 game_concept_realms: "Parties"
 game_concept_regency_desc: "A Regency is a special form of [diarchy|E] for when the [ruler|E] is not able to rule their [realm|E] on their own.\n\nIt generally occurs if the Ruler is a [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )], or attending an [activity|E] outside their Party.\n\nA $game_concept_regency$ that persists too long may become an [entrenched_regency|E]."
 game_concept_religion: "Political Camp"
 game_concept_religion_desc: "A $game_concept_religion$ groups related [faiths|E]: the Left, the Centre, the Right, the Nationalists and the Unionists. Ideologies of the same or a neighbouring camp are Divergent; left and right are Opposed; nationalists and unionists are Irreconcilable."
 game_concept_religions: "Political Camps"
 game_concept_religious_families: "Political Families"
 game_concept_religious_family: "Political Family"
 game_concept_religious_family_desc: "A $game_concept_religious_family$ is a group of [religions|E]. The $game_concept_religious_family$ affects how the various Political Camps, and [faiths|E] therein, view each other.\n\nThe [GetReligionFamily('rf_abrahamic').GetName] Family condones [holy_wars|E] against everyone #weak (including other Abrahamics)#!. Political Camps are susceptible to [heresy|E].\n\nThe [GetReligionFamily('rf_eastern').GetName] Family only condones Holy Wars against other Political Families.\n\nThe [GetReligionFamily('rf_pagan').GetName] Family condones Holy Wars against everyone, but Ideologies within the Political Camps must be reformed to access them."
 game_concept_religious_head_succession_law: "Movement Leader Succession Law"
 game_concept_religious_head_succession_law_desc: "[rulers|E] who are also [heads_of_faith|E] have an additional party [succession|E] law, requiring that their [heir|E] be of the same [faith|E] as them. This can never be changed, and $game_concept_head_of_faith$ [titles|E] cannot have separate [title_succession|E]. The only way to remove this type of party law is for an external force to destroy the [head_of_faith|E] $game_concept_title$."
 game_concept_religious_head_succession_law_short: "Movement Leader Law"
 game_concept_religious_head_succession_laws: "Movement Leader Succession Law"
 game_concept_religious_head_succession_laws_short: "Movement Leader Laws"
 game_concept_religious_superior_desc: "A religious Superior is a [character|E] who holds religious jurisdiction over one or more [subordinate|E] religious party officials in a hierarchical religious structure."
 game_concept_retinue_maa: "Retinue Activists"
 game_concept_retract_desc: "At [limited_crown_authority|E] or higher, [rulers|E] can $game_concept_retract$ the [vassal|E] of a Backbencher, but unless the latter is [imprisoned|E] this is risky, for the Backbencher may refuse and rise up in rebellion.\n\nBackbencher Retraction is considered [tyrannical|E] unless the target is guilty of a fairly severe [crime|E]."
 game_concept_revoke_desc: "At [limited_crown_authority|E] or higher, [rulers|E] can $game_concept_revoke$ the [titles|E] of their [vassals|E], but unless the Backbencher is [imprisoned|E] this is a risky proposition, for the Backbencher may refuse and rise up in rebellion.\n\nTitle Revocation is considered [tyrannical|E] unless the Backbencher is guilty of a fairly severe [crime|E]."
 game_concept_rightful_liege: "Rightful Party Leader"
 game_concept_rightful_liege_desc_part2: "#weak Example: The Count of $c_dunbar$ is a direct backbencher of the King of $k_england$. Since the King is neither Duke of $d_lothian$, King of $k_scotland$, nor Emperor of $e_britannia$, the Count of $c_dunbar$ only contributes a tiny amount of their taxes and volunteers.\n\nThe Count of $c_norfolk$ is also a direct backbencher of the King of $k_england$. The King does not hold the Region of $d_norfolk$, so the Count also contributes reduced taxes and volunteers. However, because the $k_england$ is the De Jure Nation of $c_norfolk$, the Count of $c_norfolk$ still contributes significantly more tax and volunteers to the King than the Count of $c_dunbar$ does.#!"
 game_concept_rite: "Ideology"
 game_concept_rite_desc: "In Westminster every [faith|E] has a single $game_concept_rite$ of the same name: the ideology itself, with its [core_tenets|E] and [doctrines|E]. They are fixed: politicians change their minds, not their ideology's."
 game_concept_rite_divergence_desc: "Divergence measures how far a [rite_possessive|E] [core_tenets|E] and [doctrines|E] have drifted from the parent [faith|E]. An Ideology that adopts [prohibited_tenet_status|E] Causes as [core_tenet_status|E] is more Divergent.\n\nHigh Divergence weakens the parent ideology's [fervor|E] making outbreaks of [heresy|E] more common. An Ideology that reaches #V 100#! Divergence will be automatically declared a splintering and become a new [faith|E]."
 game_concept_rite_knowledge: "Ideology Knowledge"
 game_concept_rite_possessive: "Ideology's"
 game_concept_rites: "Ideologies"
 game_concept_rites_possessive: "Ideologies'"
 game_concept_royal_court: "Private Office"
 game_concept_royal_court_desc: "Distinguished [rulers|E] are famed enough to maintain a Private Office, which gives access to a variety of bonuses and opportunities.\n\nWhen a [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName], or [GetGovernment( 'tribal_government' ).GetName] [ruler|E] becomes [king|E] or [emperor|E], they gain access to their Private Office.\n\nEach Private Office has a [court_grandeur_level|E], which gives benefits based on how famed the Private Office is, and which [court_type|E] the Private Office is.\n\nPetitioners, [vassals|E], and [courtiers|E] may appear at your Private Office, or you can [hold_court|E] to invite anyone in the [realm|E] to air their grievances.\n\nA Private Office also allows the Ruler to display [court_artifacts|E], and [inspired|E] [guests|E] may appear at the Private Office, offering to create new [artifacts|E].\n\nWhen you die, your [player_heir|E] will inherit your Private Office."
 game_concept_royal_courts: "Private Offices"
 game_concept_sanctified_desc: "Sanctifying an [artifact|E] makes it a [holy_relic|E] for a [faith|E]. An artifact can be sanctified for multiple ideologies."
 game_concept_scales_of_power_desc: "During [power_sharing|E], the balance of power between the [liege|E] and their [diarch|E] is measured on the $game_concept_scales_of_power$.\n\nAs the $game_concept_scales_of_power_scales$ tip towards the $game_concept_diarch$, they unlock [diarch_powers|E] and may add costs to the Party Leader's [diarch_affected_actions|E].\n\nAs they tip towards the $game_concept_liege$, it instead makes it easier for the Party Leader to end the [diarchy|E].\n\nThe $game_concept_scales_of_power_scales$ can be swung by:\n$EFFECT_LIST_BULLET$Using the $swing_scales_currency_interaction$ [character_interaction|E] against the opposing party\n$EFFECT_LIST_BULLET$As the $game_concept_diarch$, serving your $game_concept_liege$ well (however cynically) in [mandate|E] events"
 game_concept_seasonal_prediction_desc: "A skillful $court_position_court_astrologer$ can predict the next [steppe_season|E] in a region, offering helpful information to their party leader in order to plan their next moves."
 game_concept_seize_peripheral_duchy: "Seize Peripheral Region"
 game_concept_settlement_issue_desc: "Settlement Issues are tasks given to a [nomad|E] [ruler|E] after finishing a [migration|E] to new lands. They give the opportunity to handle conflicts and increase the local [county_control|E] in the new [domain|E].\n\nThese issues will continue to happen for the first years after a ruler has migrated, as long as the constituency has low constituency control."
 game_concept_short_reign_desc: "'Short Reign' is a decaying [opinion|E] penalty that all characters in a [realm|E] get with a new [liege|E].\n\nIn a similar way, subjects get an increasing [long_reign|E] Opinion bonus with Party Leaders who have ruled over them for a long time."
 game_concept_shunned_desc: "Many [rites|E] have [doctrines|E] which designate certain behaviors as Shunned. Depending on the specific Policy Position, these behaviors may also be considered [criminal|E].\n\nCharacters who are caught practicing behaviors that are Shunned by their Ideology lose a [piety_level|E] and gain a corresponding [fame_trait|E]; this Trait will be disliked by everyone whose Ideology considers that behavior to be either Shunned or Criminal.\n\nExamples of Shunned behaviors include:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sin_desc: "Every [rite|E] considers certain [traits|E] to be Sinful. Characters with these Traits incur [opinion|E] penalties from all characters who consider those traits Sinful, even if they do not share the same Ideology. In addition, Characters who have Traits that their own Ideology considers Sinful will lose [piety|E] every month.\n\nExactly what traits are considered to be Sins varies from Ideology to Ideology, but is typically determined by a combination of that Ideology's [core_tenets|E] and the [religion|E] the Ideology belongs to."
 game_concept_spiritual_fulfillment: "Personal Conviction"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ is how at ease a [character|E] is with their own politics. It rises and falls with their [traits|E] and with how they act."
 game_concept_spiritual_fulfillment_level: "Conviction Level"
 game_concept_spiritual_fulfillment_level_desc: "A [character_possessive|E] [spiritual_fulfillment|E] is divided into $game_concept_spiritual_fulfillment_levels$, each with its own effects."
 game_concept_spiritual_fulfillment_levels: "Conviction Levels"
 game_concept_spiritual_head_of_faith: "Spiritual Movement Leader"
 game_concept_spymaster: "Chief Whip"
 game_concept_spymaster_desc: "The $game_concept_spymaster$ is the [councillor|E] who keeps the party in line and knows everyone's secrets. Beware a disloyal Chief Whip: they can easily hide, or join, a plot against you."
 game_concept_state_rite: "State Ideology"
 game_concept_state_rite_desc: "$game_concept_state_rite$ is the [rite|E] supported and condoned by an [administrative_government|E]. This ideology is attached to the [title|E] and not to any one specific [character|E]. It is easier to convert characters in the [realm|E] to the state ideology and very difficult to convert them away from it.\n\nOnly the [ruler|E] of an Administrative Party may change the State Ideology, but [governors|E] may freely convert to it."
 game_concept_stationed_regiment_desc: "A [men_at_arms|E] [regiment|E] receives bonuses to its effectiveness by being Stationed in a [holding|E].\n\n[buildings|E] can further increase these bonuses — sometimes for any type of Activists, but most commonly for one or two. For example, [GetBuilding('stables_01').GetName] provides a bonus to Stationed [light_cavalry|E] and [heavy_cavalry|E].\n\nYou can Station at any time except during [war|E], or if the Holding is [occupied|E]. If a Holding is lost, any Stationed Activists will be unstationed."
 game_concept_steward: "Chancellor of the Exchequer"
 game_concept_steward_desc: "The $game_concept_steward$ is the [councillor|E] in charge of the economy and the [domain|E]: [taxation|E], spending and [development|E]."
 game_concept_stewards: "Chancellors of the Exchequer"
 game_concept_stewardship: "Economy"
 game_concept_stewardship_lifestyle: "Economy Lifestyle"
 game_concept_stewardship_skill: "Economy Skill"
 game_concept_stewardship_skill_desc: "$game_concept_stewardship$ is a [skill|E] for budgets, the economy and running things. It directly increases [taxation|E], so every leader wants it.\n\nThe corresponding [lifestyle|E] is the [stewardship_lifestyle|E]."
 game_concept_stewardship_task_contract: "Economy Contract"
 game_concept_stewardship_task_contract_possessive: "Economy Contract's"
 game_concept_stewardship_task_contracts: "Economy Contracts"
 game_concept_stewardship_task_contracts_possessive: "Economy Contracts'"
 game_concept_story_content_el_cid_desc: "#tooltip_heading Story Style: Light#!\n\nAs El Cid, you will be wrongly cast aside by your party leader. In exile, you may opt to stay loyal or find your own path, eventually culminating with a return to court #EMP or#! the ultimate prize — Valencia.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan_desc: "#tooltip_heading Story Style: Moderate#!\n\nAs Hasan, you will be guided down a path of religious fanaticism, picking a place to bring the light of the True Ideology to and converting [counties|E] out from under their [rulers|E].\n\nEventually, your story will culminate with a major religious uprising against your chosen foe.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin_desc: "#tooltip_heading Story Style: Light#!\n\nAs Temüjin you will seak vengeance against a rival tribe that had imprisoned your spouse, and test the loyalty of your closest backbencher and friend — Jamukha.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_stress: "Pressure"
 game_concept_stress_desc: "Characters come under $game_concept_stress$ when they act against their [personality_traits|E]: the loyal backbencher voting against the whip, the honest minister made to defend a bad line.\n\nCharacters under enough Pressure gain a [stress_level|E], with effects on their health that last until they bring it down again.\n\nTime away from Westminster and [activities|E] relieve it."
 game_concept_stress_level: "Pressure Level"
 game_concept_stress_level_desc: "Every 100 [stress|E] a character accumulates also causes them to gain a Pressure Level. Pressure Levels range from 0 to 3, with each level imposing increasing penalties to a character's [fertility|E] and [health|E].\n\nIn addition, as long as a character has at least 1 Pressure Level, they are vulnerable to [mental_breaks|E]."
 game_concept_stress_levels: "Pressure Levels"
 game_concept_stress_loss: "Pressure Loss"
 game_concept_stressed: "Under Pressure"
 game_concept_strong_vassal: "Strong Backbencher"
 game_concept_strong_vassal_desc: "A $game_concept_strong_vassal$ is a [vassal|E] who approaches or exceeds their [liege|E] in power, incurring an [opinion|E] penalty. #weak They see their party leader as weak and ill-suited to rule the party.#!"
 game_concept_strong_vassals: "Strong Backbenchers"
 game_concept_struggle_involved_faith: "Involved Ideology"
 game_concept_struggle_involved_faiths: "Involved Ideologies"
 game_concept_struggle_persia_phase_unrest_desc: "Beset by rebellions and intrigues, the Caliphate crumbles. Ambitious warlords and cunning governors alike grasp at whatever power they can usurp, squabbling constantly.\n\nOver time, unless the situation is resolved by an [ending_phase|E], the party will enter a [struggle_persia_phase_stabilisation|E] phase as desperate supporters claw back caliphal authority."
 game_concept_struggle_phase_desc: "A $game_concept_struggle_phase_phase$ is a general mood common to [struggle_involved|E] [characters|E] and [counties|E] within a [struggle_region|E]. It represents short-term societal trends and mores temporarily dominating the dialogue of the [struggle|E].\n\n#weak Example: in one $game_concept_struggle_phase_phase$, the people of a $game_concept_struggle_region_region$ may think that religious tolerance is paramount even if the rest of their ideology disagrees.#!"
 game_concept_supply_limit_desc: "The $game_concept_supply_limit$ dictates the amount of [soldiers|E] you may have in a [barony|E], as determined by the Ward's [terrain|E] and [development|E].\n\nShould your total [army|E] size go above the $game_concept_supply_limit$, your $game_concept_armies$ will lose [supply|E] and eventually suffer from [attrition|E]."
 game_concept_temporal_head_of_faith: "Temporal Movement Leader"
 game_concept_tenet: "Cause"
 game_concept_tenet_desc: "While [doctrines|E] represent issues a [rite|E] must take a stance on, $game_concept_tenets$ represent the Ideology's unique quirks and practices."
 game_concept_tenet_knowledge: "Policy Knowledge"
 game_concept_tenet_knowledge_desc: "Politicians don't know every other ideology's thinking in detail.\n\nKnowing all the $game_concept_core_tenets$ and $game_concept_doctrines$ of an $game_concept_rite$ makes changing your mind to it easier.\n\nAll [core_tenets|E] and [doctrines|E] of your own [faith|E] are known to you. More can be learnt from [spouses|E], [friends|E] and [activities|E]."
 game_concept_tenet_popularity: "Cause Popularity"
 game_concept_tenet_popularity_desc: "As [personal_tenets|E] spread within a [faith|E] their practice becomes more common. $game_concept_tenet_popularity$ tracks how widespread a [core_tenet|E] is and affects how likely it is to be picked as debate topic in an [ecumenical_council|E] or as a target of a [papal_bull|E].\n\nThe higher the $game_concept_tenet_popularity$, the more the [clergy|E] will side with a cause when it is debated in an [ecumenical_council|E]. Once a cause reaches #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, the [head_of_faith|E] will most likely declare it [permitted_tenet_status|E] no matter their own convictions."
 game_concept_tenet_status: "Cause Status"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ is a [rite_possessive|E] stance on a [core_tenet|E] or [doctrine|E]. There are five possible stances:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — the $game_concept_rite$ has never heard of this $game_concept_core_tenet$ or $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — the $game_concept_rite$ is aware of it and has not ruled on its practice.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — the $game_concept_rite$ approves of the practice.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — the $game_concept_rite$ forbids the practice.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — the $game_concept_rite$ both permits and actively promotes the $game_concept_core_tenet$.\n\nAn Ideology's stance governs whether a $game_concept_core_tenet$ or $game_concept_doctrine$ can be picked when authoring or diverging a $game_concept_rite$, and which practices cost [followers|E] spiritual penalties.\n\nCause Status is distinct from a [character_possessive|E] [tenet_knowledge|E], which is personal awareness, not the overall $game_concept_rite$'s stance."
 game_concept_tenets: "Causes"
 game_concept_the_christian_church_desc: "The Christian Church is the ecclesiastical body that oversees and guides the followers of Jesus Christ, represented as a [situation|E] that advances through a sequence of [the_christian_church_chapters_short|E].\n\nIts boundaries encompass every [archdiocese|E] in the world; every [christian|E] [ruler|E] of [county|E] rank or higher with any part of their [realm|E] inside an Archdiocese is a member, be they party officials or secular."
 game_concept_theocratic_vassal: "Theocratic Backbencher"
 game_concept_theocratic_vassal_desc: "Backbenchers who have the [theocratic_government|E] form.\n\nHow they function is determined by a [faithpossessive|E] [doctrines|E]."
 game_concept_theocratic_vassals: "Theocratic Backbenchers"
 game_concept_title_allegiance_desc: "[vassals|E] can owe Allegiance to a specific [title|E] rather than the person of their [liege|E]. This can only happen if the Title has its own [succession_law|E]. On [succession|E], such Backbenchers will become backbenchers of the new Title [holder|E]."
 game_concept_title_desc: "A $game_concept_title$ is essentially a certificate of land ownership.\n\nThe smallest unit of land on the map is the [barony|E]. Wards are organized into larger areas called [counties|E]. Constituencies [de_jure|E] belong to a [duchy|E], regions to a [kingdom|E], and Nations to an [empire|E].\n\nRegions, Nations and Empires do not always have a [holder|E], but are Titles that can be [created|E] by a ruler who controls enough of the corresponding territory."
 game_concept_title_men_at_arms: "Title Activists"
 game_concept_top_liege: "Prime Minister"
 game_concept_top_liege_possessive: "Prime Minister's"
 game_concept_top_lieges: "Prime Ministers"
 game_concept_top_realm: "Top Party"
 game_concept_torture_desc: "[imprisoned|E] Characters can be $game_concept_tortured$, damaging their [health|E] or even maiming them in different ways.\n\nTorture can relieve [stress|E] for [GetTrait('callous').GetName( GetNullCharacter )] and [GetTrait('sadistic').GetName( GetNullCharacter )] Characters, but causes Pressure for those of a kind nature.\n\nTorturing [rulers|E] can also increase your [dread|E]."
 game_concept_tour_stop_desc: "An [activity_phase|E] during a [royal_tour|E] in which a party leader can either: attend a [hosted_dinner|E], [tour_the_grounds|E] of their [vassal|E], or enjoy a [cultural_festival|E]."
 game_concept_transfer_desc: "[rulers|E] can $game_concept_transfer$ one of their [vassals|E] to another Backbencher, as long as the former is of lower rank than the latter. This is a good way of raising a Backbencher's [opinion|E], particularly if the Transferred backbencher is [de_jure|E] part of their [realm|E]."
 game_concept_treasury_vassal_development: "Backbencher Development"
 game_concept_tribal_authority_desc: "$game_concept_tribal_authority$ represents the general influence that a [tribal|E] [ruler|E] wields over their [vassals|E]. Compared to [crown_authority|E], it offers fewer powers and at later levels.\n\nThere are four levels of $game_concept_tribal_authority$: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E], and [absolute_tribal|E]. Increasing $game_concept_tribal_authority$ costs an amount of [prestige|E] depending on the level and the ruler's [learning_skill|E], but is generally more expensive than increasing crown authority.\n\n#weak Backbenchers dislike higher levels of $game_concept_tribal_authority$, and lowering it is the primary goal of any [liberty_faction|E].#!"
 game_concept_tribal_desc: "Tribal parties have stunted constituency [development|E], cannot advance past Tribal Era [innovations|E], cannot construct new [holdings|E], and are usually unable to change their [succession_law|E].\n\nHowever, they can make use of [prestige|E] rather than [gold|E] to build their parties and hire [men_at_arms|E], and have access to more [casus_belli|E] compared to [feudal|E] Parties. Non-Tribal armies suffer a [supply_limit|E] penalty in hostile Tribal territory."
 game_concept_unassigned_vassal: "Untaxed Backbenchers"
 game_concept_unassigned_vassals: "Untaxed Backbenchers"
 game_concept_undirected_great_holy_war_desc: "An $game_concept_undirected_great_holy_war$ is declared by a $doctrine_spiritual_head_name$ [head_of_faith|E] with the intention of bringing a [kingdom|E] under the rule of their [faith|E].\n\n$game_concept_undirected_great_holy_wars$ are not started immediately, instead they enter a [preparation_phase|E].\n\nBefore and during the war, rulers of the attacking Ideology can choose to donate [gold|E] to the [war_chest|E].\n\nIf victorious, the targeted Nation will be taken and given to a character of the attacking Ideology. Rewards for the attackers include [piety|E] and potentially having their [dynasty|E] become [landed|E] within the conquered Nation."
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [faiths|E] get a [battle|E] [advantage|E] in [counties|E] of their ideology."
 game_concept_usurp_title_desc: "A [title|E] held by a foreign [ruler|E] can usually be Usurped if more than #V 50%#! of its [de_jure|E] [counties|E] are within your [realm|E]. This process gives the [title|E] to you, which is particularly important for ensuring you are the [rightful_liege|E] of your [vassals|E].\n\nUsurpation is more difficult if the current holder's [faith|E] is hostile to yours; in this case usurpation is only possible if the holder no longer possesses any of its [de_jure|E] [counties|E] inside his Party."
 game_concept_varangian_adventure_desc: "This is a special type of [war|E], where the attacker intends to move their [realm|E] to the [war_target|E] wholesale.\n\nIf they win, they will immediately annex the appropriate [counties|E] and move their [capital|E] there. Their old backbenchers will go independent, and their old $game_concept_counties$ will be given to upstart local warlords. $game_concept_varangian_adventures$ are #EMP ONLY#! available to [duke|E] and $game_concept_count$-[title_tier|E] [rulers|E], becoming progressively more expensive with each successful $game_concept_varangian_adventure_adventure$.\n\nThis [casus_belli|E] is #EMP NEVER#! available after the $culture_era_tribal$ [era|E], and cannot be used against other [cultures|E] that can $game_concept_varangian_adventure_adventure$ or against neighboring $game_concept_rulers$.\n\n$north_germanic_group_collective_noun$ launching their first $game_concept_varangian_adventure$ receive up to [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] bonus [special_troops|E], the amount going up with every same-[faith|E] same-[culture|E] constituency they completely control within [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_vassal: "Backbencher"
 game_concept_vassal_contract: "Backbencher Contract"
 game_concept_vassal_contract_desc: "$game_concept_vassal_contracts$ dictate the [obligations|E] between a [vassal|E] and their [liege|E].\n\nBackbenchers of the [feudal|E], [clan|E], [administrative|E] and [nomadic|E] $game_concept_government_forms$ have access to different [obligations|E], negotiated individually for each Backbencher.\n\nAll Backbenchers pay a percentage of their total [taxes|E] and [levies|E] to their Party Leader, based on their [obligations|E]. #EMP These [modifier_contributions|E] can in turn be modified by 'fine print' options such as [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\nSome Special Contracts are limited to certain Ranks:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] and [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] and above\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] and above\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: [count|E] only\n\n#weak Note, [governor|E] [obligations|E] are also known as [province_administrations|E].#!"
 game_concept_vassal_contracts: "Backbencher Contracts"
 game_concept_vassal_desc: "A $game_concept_vassal$ is a politician who answers to another: an MP to their [liege|E], a party leader to the Prime Minister.\n\nBackbenchers give their Party Leader [levies|E] and [taxes|E] — their [obligations|E] — in return for the whip and support.\n\nIf a $game_concept_vassal$'s [opinion|E] of their Party Leader is low, they may join [factions|E], or [scheme|E] to replace them."
 game_concept_vassal_directive: "Backbencher Directive"
 game_concept_vassal_directive_desc: "As a [liege|E], you can issue Directives to your [vassals|E], influencing their [councillor_tasks|E] and which [buildings|E] they construct.\n\nTo issue a Directive, you need to enable it, such as by having #P 50#! or more [opinion|E] with the Backbencher. Advanced [government_forms|E] do not require this."
 game_concept_vassal_directives: "Backbencher Directives"
 game_concept_vassal_limit: "Backbencher Limit"
 game_concept_vassal_limit_desc: "The $game_concept_vassal_limit$ determines how many [direct_vassals|E] you can legally have (excluding [barony|E]-tier backbenchers).\n\nAlthough you can go above your $game_concept_vassal_limit$, doing so will lower the [taxes|E] and [levies|E] your backbenchers provide, and you may be better off [transferring|E] some backbenchers to stay below the limit."
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ define how much [tax|E] and how many [levies|E] a [subject|E] provides to their [suzerain|E]. A Subject's [government_form|E] determines how their $game_concept_obligations$ are modified.\n\n#weak For example, [GetGovernment('feudal_government').GetName] and [GetGovernment('clan_government').GetName] [vassals|E] $game_concept_obligations$ depend on their [vassal_contract|E], [GetGovernment('administrative_government').GetName] Backbencher's depend on their [province_administration|E], while [tributary_possessive|E] depend on their [tributary_contract|E]."
 game_concept_vassal_possessive: "Backbencher's"
 game_concept_vassal_stance: "Backbencher Stance"
 game_concept_vassal_stance_desc: "Every [vassal|E] has a Backbencher Stance which affects the [opinion|E] they have with you as their [liege|E], and which [heir|E] they prefer as successor to the [realm|E].\n\nBackbenchers in the same stance will like and dislike the same things. For example; all [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] Backbenchers dislike when you lose [wars|E].\n\nEvery Backbencher Stance prefers one specific Heir. Upon succession, each preferred Heir will have lower [legitimacy_expectations|E] with the Backbenchers of that stance.\n\n#low The Backbencher Stances are:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances: "Backbencher Stances"
 game_concept_vassal_taxes: "Backbencher Taxes"
 game_concept_vassal_taxes_desc: "Your $game_concept_vassal_taxes$ consist of the [taxes|E] that you receive from you [vassals|E]. The amount depends on the each Backbencher's [obligations|E].\n\nFrom your Backbenchers' point of view, these same taxes are called [liege_taxes|E] to distinguish them from any $game_concept_vassal_taxes$ they collect from their own $game_concept_vassals$."
 game_concept_vassals: "Backbenchers"
 game_concept_vassals_possessive: "Backbenchers'"
 game_concept_victory_desc: "$game_concept_victory$ is one of three possible [peace_offers|E]. The exact outcome of Victory in a [war|E] depends on the [casus_belli|E].\n\nFor the Attacker, it typically involves the seizure of [titles|E] within the [war_target|E] region.\n\nFor the Defender, Victory usually means the attacker has to pay a large sum of funds as war reparations."
 game_concept_virtue_desc: "Every [rite|E] considers certain [traits|E] to be Virtuous. Characters with these Traits gain [opinion|E] bonuses from all characters who consider those traits Virtuous, even if they do not share the same Ideology. In addition, Characters who have Traits that their own Ideology considers Virtuous will gain bonus [piety|E] every month.\n\nExactly what traits are considered to be Virtues varies from Ideology to Ideology, but is typically determined by a combination of that Ideology's [core_tenets|E] and the [religion|E] the Ideology belongs to."
 game_concept_virtue_weight_desc: "Traits can have an associated [sin|E] or [virtue|E] Weight, determined by the [core_tenets|E] and [doctrines|E] of a [rite|E], and the [religion|E] it belongs to.\n\nThe traits with the highest Sin or Virtue Weight within an Ideology become that Ideology's [sins|E] and [virtues|E]."
 game_concept_wanderer_desc: "Characters who do not belong to a [court|E] or hold any [titles|e] are called Wanderers. They travel the world, visiting Offices as [guests|E] along the way. Wanderers might become [mercenary|E] Captains, leaders of [holy_orders|E], [clergy|E] members, or [city|E] holders."
 game_concept_wanua_desc: "The $wanua_government_adjective$ [government|E] shares weaknesses with the [GetGovernment('tribal_government').GetNameWithIcon] [government|E], but also have reduced [domain_limit|E] and [vassal_limit|E]. While they use [gold|E] to construct [buildings|E] and recruit [men_at_arms|E], they earn very little Funds from Buildings.\n\nHowever, they can [barter_goods_i][barter|E], [raid|E], and have synergies with the [GetGovernment('mandala_government').GetName] Government as they gain [legitimacy|E] from being a [tributary|E]."
 game_concept_war_chest_desc: "The $game_concept_war_chest$ is a collection of [gold|E], [piety|E] and [prestige|E]. The contents are primarily used as rewards for successfully winning [undirected_great_holy_wars|E], where they are divided between the attackers based upon their participation in the [war|E].\n\nA certain portion of what's in the $game_concept_war_chest$ is also divided between the attackers as the War is declared.\n\nIf an [undirected_great_holy_war|E] is defeated, the defenders will divide the Political Capital and Profile portion of the $game_concept_war_chest$ between them #weak (the Funds is lost.)#!"
 game_concept_winter_desc: "Winter steadily drains [supply|E] over time, making armies lose Supply while standing in a ward affected by Winter. The Supply penalty increases with each severity. Winter has three different severities; [Concept( 'winter_severity_mild', 'Mild' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E], and [Concept( 'winter_severity_harsh', 'Harsh' )|E]."
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ are unique improvements to the $game_concept_yurt$.\n\nMechanically, they are [domicile_buildings|E] — though many represent social customs or simply areas of focus for the $game_concept_nomad$ tribe, rather than being literal structures.\n\nThe bonuses they can confer include:\n$EFFECT_LIST_BULLET$ Unlocking [court_positions|E] and Nomadic [decisions|E] and [character_interaction|E]s\n$EFFECT_LIST_BULLET$ Various bonuses to [herd|E] and [county_fertility|E], including [terrain|E] specializations\n$EFFECT_LIST_BULLET$ Unlocking and improving Nomadic [men_at_arms|E] and boosting the strength of [horde|E]\n$EFFECT_LIST_BULLET$ Unique nomadic [culture_tradition|E] bonuses\n$EFFECT_LIST_BULLET$ Ways to manage your [vassals|E] and [tributaries|E], as well as influence [characters|E] at your office.\n$EFFECT_LIST_BULLET$ [kurultai|E] and [obedience|E] bonuses."
 maximum_piety_level_mandala: "\n\nHowever, when a [mandala|E] [ruler|E] dies in a manner acceptable to their [aspect|E], after reaching [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], that Ruler's [heir|E] develops the ability to progress to the next Political Capital Level until reaching [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
