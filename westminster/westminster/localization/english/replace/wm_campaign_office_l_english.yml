 camp_priest_camp_officer_desc: "The $camp_priest_camp_officer$ looks after the team: a listening ear, a quiet word and an eye on who is burning out."
 camp_purpose: "Political Focus"
 camp_purpose_brigands: "Media Pundit"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Offered more media rounds and opposition research\n$EFFECT_LIST_BULLET$Every job done well earns extra [prestige|E]: more airtime\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$Can access certain special [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Unlocked via $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (Unlocked via $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Unlocked via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Available for comment, any channel, any hour, any subject.#!"
 camp_purpose_confirmation_button_text: "Change Focus"
 camp_purpose_explorers: "Grassroots Organiser"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Offered more canvassing, phone bank and get-out-the-vote jobs\n$EFFECT_LIST_BULLET$Travels faster between doorsteps\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK Every street has a door that hasn't been knocked on yet.#!"
 camp_purpose_legitimists: "Party Fixer"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$Offered more of the party's inside jobs: speechwriting and research\n$EFFECT_LIST_BULLET$Every job done well earns extra Party Standing\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$Can access certain special [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak (Unlocked via $baggage_train_proof_of_claims_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Unlocked via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Somebody has to count the votes before the vote, and know who owes whom.#!"
 camp_purpose_mercenaries: "Campaign Consultant"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Offered more fundraising, phone bank and costing jobs\n$EFFECT_LIST_BULLET$Every job done well earns extra [gold|E]: the invoice\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$Can access certain special [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Unlocked via $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Unlocked via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Strategy, data and a day rate. Results not guaranteed; invoices are.#!"
 camp_purpose_pass_phrase: "Become a [Law.GetNameNoTooltip]"
 camp_purpose_scholars: "Think-Tank Wonk"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Offered more policy papers, speechwriting and costing jobs\n$EFFECT_LIST_BULLET$Learns faster from every job\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Can access certain special [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Unlocked via $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK There is a footnote for everything, and a chart for most of it.#!"
 camp_purpose_wanderers: "Party Activist"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Offered every kind of job, none more than another\n$EFFECT_LIST_BULLET$May change to any other $camp_purpose$ without spending [prestige|E]\n\n#WEAK Leaflets in one pocket, a membership card in the other, and no idea yet where it all leads.#!"
