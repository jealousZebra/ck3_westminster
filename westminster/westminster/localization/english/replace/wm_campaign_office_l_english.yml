 game_concept_follower: "Team Member"
 game_concept_follower_desc: "A $game_concept_follower$ is a volunteer or staffer who works for a [adventurer|E] without a seat.\n\nMechanically, they are like [courtiers|E], but they owe less and leave sooner if they dislike their boss.\n\nThe collective [opinion|E] of the $game_concept_followers$ sets the [camp_temperament|E]."
 game_concept_followers: "Team Members"
 game_concept_officer: "Senior Staffer"
 game_concept_officer_desc: "$game_concept_officers$ are the jobs [followers|E] can be given to run the [camp|E]: office manager, field director, treasurer and so on.\n\nThey work like [court_positions|E]: what they bring depends on the holder's [aptitude|E] for the job."
 game_concept_officers: "Senior Staff"
 game_concept_provision: "Campaign Fund"
 game_concept_provisions: "Campaign Funds"
 game_concept_provisions_desc: "$game_concept_provisions$ are the office's running budget: rent, fuel, print and food for the volunteers.\n\nA [camp|E] spends $game_concept_provisions$ while it moves to a new [location|E]; how much depends on the size of the team, the distance and the [officers|E] it has.\n\nRunning out means unpaid bills and an unhappy team. Jobs done well, and some [camp_buildings|E], bring more in."
 game_concept_task_contract: "Job"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ are work a [adventurer|E] does for the party's MPs: canvassing, fundraising, speechwriting, research, phone banks, policy papers and media rounds.\n\nEach takes three weeks and is settled by a skill check. Doing it well earns [gold|E], [prestige|E], [provisions|E], Party Standing and the MP as a contact; doing it badly costs a little standing.\n\nThe party's candidate assessment is a $game_concept_task_contract$ too: pass it to join the approved candidates list."
 game_concept_task_contract_possessive: "Job's"
 game_concept_task_contract_tier: "Job Grade"
 game_concept_task_contracts: "Jobs"
 game_concept_task_contracts_possessive: "Jobs'"
 head_groom_camp_officer: "Transport Manager"
 head_groom_camp_officer_desc: "The $head_groom_camp_officer$ looks after the minibuses, the fuel cards and the parking fines."
 head_porter_camp_officer: "Logistics Coordinator"
 head_porter_camp_officer_desc: "The $head_porter_camp_officer$ gets the office, the boxes and the people to the next town in one piece."
 heavy_cavalry_captain_camp_officer: "Battle Bus Captain"
 heavy_cavalry_captain_camp_officer_desc: "The $heavy_cavalry_captain_camp_officer$ runs the bus tours: big visits, big crowds, big pictures."
 heavy_infantry_captain_camp_officer: "Doorstep Team Lead"
 heavy_infantry_captain_camp_officer_desc: "The $heavy_infantry_captain_camp_officer$ leads the big Saturday canvass sessions."
 horse_archer_captain_camp_officer: "Leaflet Run Lead"
 horse_archer_captain_camp_officer_desc: "The $horse_archer_captain_camp_officer$ organises the fast delivery rounds, street by street."
 huntperson_camp_officer: "Outreach Organiser"
 huntperson_camp_officer_desc: "The $huntperson_camp_officer$ plans the days out: street stalls, community events and visits."
 huntperson_camp_officer_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] increases with [aptitude|E]\n$BULLET$Improves [martial|E] [education|E] outcomes for all [children|E] in your [camp|E]\n$BULLET$May aid in Gather Campaign Funds [decisions|E]"
 kennelperson_camp_officer: "Volunteer Coordinator"
 kennelperson_camp_officer_desc: "The $kennelperson_camp_officer$ keeps the volunteers fed, thanked and pointed in the right direction."
 landless_adventurer_government: "Campaigner"
 landless_adventurer_government_adjective: "Campaigning"
 landless_adventurer_government_realm: "Campaign Office"
 laureate_camp_officer: "Wordsmith"
 laureate_camp_officer_desc: "The $laureate_camp_officer$ writes the lines people remember, and the ones they quote back at you."
 light_cavalry_captain_camp_officer: "Rapid Response Lead"
 light_cavalry_captain_camp_officer_desc: "The $light_cavalry_captain_camp_officer$ gets a team anywhere in the area within the hour."
 light_infantry_captain_camp_officer: "Street Stall Lead"
 light_infantry_captain_camp_officer_desc: "The $light_infantry_captain_camp_officer$ runs the stalls in the market square and outside the station."
 master_bard_camp_officer: "Content Creator"
 master_bard_camp_officer_desc: "The $master_bard_camp_officer$ turns a day on the doorstep into a video, a post and, now and then, a viral moment."
 master_of_arms_camp_officer: "Field Director"
 master_of_arms_camp_officer_desc: "The $master_of_arms_camp_officer$ runs the canvass teams: who knocks where, and when."
 master_of_spoils_camp_officer: "Treasurer"
 master_of_spoils_camp_officer_desc: "The $master_of_spoils_camp_officer$ keeps the accounts, signs the cheques and files the returns with the Electoral Commission."
 master_thief_camp_officer: "Opposition Researcher"
 master_thief_camp_officer_desc: "The $master_thief_camp_officer$ knows what the other side said in 2011, and where it was written down."
 mess_tent_01_domicile_building: "Office Kitchen"
 mess_tent_01_domicile_building_desc: "A tea urn, a fridge full of milk and somebody's birthday cake: the campaign marches on its stomach."
 mess_tent_bakers_domicile_building: "Bacon Rolls"
 mess_tent_bakers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nSaturday morning, before the doorstep session. Nobody misses it."
 mess_tent_brewers_domicile_building: "Coffee Machine"
 mess_tent_brewers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nA real one, with beans. Morning canvass turnout doubles."
 mess_tent_cooks_domicile_building: "Volunteer Cooks"
 mess_tent_cooks_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nMembers who can't canvass but can feed thirty people on a budget."
 mess_tent_curers_domicile_building: "Batch Cooking"
 mess_tent_curers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nA freezer full of chilli for the long nights of the short campaign."
 mess_tent_herbalists_domicile_building: "Healthy Snacks"
 mess_tent_herbalists_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nFruit as well as biscuits. A small revolution."
 person_haggler_camp_officer: "Deal Broker"
 person_haggler_camp_officer_desc: "The $person_haggler_camp_officer$ handles the awkward visitors and gets the best terms out of every favour."
 pike_captain_camp_officer: "Phone Bank Lead"
 pike_captain_camp_officer_desc: "The $pike_captain_camp_officer$ runs the evening phone banks: scripts, lists and a steady line of calls."
 proving_grounds_01_domicile_building: "Training Room"
 proving_grounds_01_domicile_building_desc: "Doorstep scripts, role-plays and how to answer the question you weren't asked."
 proving_grounds_bodyguard_drills_domicile_building: "Close Protection Drills"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA candidate in public needs someone watching the crowd."
 proving_grounds_camel_run_domicile_building: "Rural Routes"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nVillages, farms and lanes without street names: a canvass plan for the countryside."
 proving_grounds_elephantry_reserve_domicile_building: "Celebrity Supporters"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAn actor, a footballer and a TV cook who will turn up for the cameras."
 proving_grounds_horse_run_domicile_building: "Cycle Canvass"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nBikes for the long roads and the estates the minibus can't reach."
 proving_grounds_life_in_the_saddle_domicile_building: "Life on the Road"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSome people only come alive in a different town every day."
 proving_grounds_lockwagon_domicile_building: "Shared Kitty"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nEvery donation goes into one pot, and the pot pays for everything. Mostly."
 proving_grounds_martial_study_domicile_building: "Campaign Case Studies"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nEvery election has been fought before. Read how it was won."
 proving_grounds_mock_battle_drills_domicile_building: "Mock Polling Days"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA full rehearsal of polling day, from the first knock-up to the close of poll."
 proving_grounds_nightly_barding_drills_domicile_building: "Battle Bus Drills"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nLoad, drive, unload, canvass, repeat, until it runs like clockwork."
 proving_grounds_personal_bouts_domicile_building: "Debate Practice"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nMock hustings with a staffer playing your nastiest opponent."
 proving_grounds_the_stick_game_domicile_building: "Office Sweepstake"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nOn the result, the turnout and which candidate cries first."
 proving_grounds_the_stump_domicile_building: "The Soapbox"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA crate in the market square and a lot of practice at being heckled."
 proving_grounds_training_circle_domicile_building: "Role-Play Circle"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAngry voter, worried voter, voter who wants to talk about bins: everyone practises everything."
 quartermaster_camp_officer: "Office Manager"
 quartermaster_camp_officer_desc: "The $quartermaster_camp_officer$ keeps the campaign funds, the stationery cupboard and the rota in order."
 second_camp_officer: "Deputy Campaign Manager"
 second_camp_officer_desc: "The $second_camp_officer$ runs the office when the candidate is out on the doorstep, and keeps everyone else on task."
 stooge_camp_officer: "Intern"
 stooge_camp_officer_desc: "The $stooge_camp_officer$ does the photocopying, the coffee run and every job nobody else wants. Morale improves, for everyone else."
 supply_tent_01_domicile_building: "Print Room"
 supply_tent_01_domicile_building_desc: "Leaflets, posters, envelopes and the one printer everybody swears at. The campaign runs on paper."
 supply_tent_arsenal_domicile_building: "Leaflet Stockpile"
 supply_tent_arsenal_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Boxes of every leaflet the campaign has ever designed, ready for any street at an hour's notice."
 supply_tent_climbing_gear_domicile_building: "Ladders and Cable Ties"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Every lamp post in the constituency is a poster site if you can reach it."
 supply_tent_mender_domicile_building: "Second-Hand Kit"
 supply_tent_mender_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Donated laptops and refurbished phones: not pretty, but they work."
 supply_tent_reserve_provisions_domicile_building: "Reserve Fund"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Money put aside for the last fortnight, when every pound counts double."
 supply_tent_reserve_water_domicile_building: "Emergency Float"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!A biscuit tin of petty cash for the things nobody budgeted for."
 supply_tent_smithy_domicile_building: "In-House Printer"
 supply_tent_smithy_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!A proper press in the back room: no more waiting a week for the printers."
 supply_tent_subdued_gear_domicile_building: "Plain Clothes"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!No rosettes, no lanyards: some work is better done without the colours on."
 supply_tent_sutler_domicile_building: "Bulk-Buy Suppliers"
 supply_tent_sutler_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!A wholesaler who does a good price on A5 if you ask nicely and pay on time."
 witness_camp_officer: "Endorsements Officer"
 witness_camp_officer_desc: "The $witness_camp_officer$ collects every letter of support and makes sure everybody hears about them."
