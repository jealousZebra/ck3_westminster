 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nA buzzer, a camera and a list of who's expected."
 camp_perimeter_fixed_layout_domicile_building: "Hot-Desk Plan"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nThe same desks, the same rota, wherever the office moves. Everyone knows where everything is."
 camp_perimeter_good_siting_domicile_building: "High Street Frontage"
 camp_perimeter_good_siting_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nRight by the bus stop and the supermarket: everyone walks past the window."
