 camp_fire_local_hangers_on_domicile_building: "Local Gossips"
 camp_fire_local_hangers_on_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nThe newsagent, the school-gate parents and the man in the pub who knows everything."
