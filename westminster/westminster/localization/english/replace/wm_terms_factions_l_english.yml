l_english:
 # Generated by westminster/tools/ui/build_terms.py from the installed game's English localization. Don't edit: change the script and re-run it.
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Finally! [faction_target.GetName] is nothing more than a jester acting a [faction_target.GetTitleAsNameNoTooltip], and I am sure the party will rise to my cause. Those who aid me will not be forgotten."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] occupies a throne that should rightly be yours! I am willing to support your claim with word and sword, and I am sure others in the party will also champion this rightful cause. All you need to do is accept."
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "Finally! [faction_target.GetName] is nothing more than a jester acting a [faction_target.GetTitleAsNameNoTooltip], and I am sure the party will rise to my cause. Those who aid me will not be forgotten."
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] occupies a throne that should rightly be yours! I am willing to support your claim with word and sword, and I am sure others in the party will also champion this rightful cause. All you need to do is accept."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "Finally! [faction_target.GetName] is nothing more than a jester acting a [faction_target.GetTitleAsNameNoTooltip], and I am sure the party will rise to my cause.\n\nDue to my current lowly status, I cannot aid you. But know this – #emphasis when#! you are victorious, I will see you rewarded handsomely!"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "While I am glad to see the party rise against the false [faction_target.GetTitledFirstName] my current predicament prevents me from joining you in this righteous endeavor. If you succeed, I will be in your debt."
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "It is clear to me that you would see the party burn before giving up this foolish venture. For the good of the party I must accept your demands, but know that a great injustice was done here today. This will not stand!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "It is clear to me that you would see the party burn before giving up this foolish venture. For the good of the [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] I must accept your demands, but know that a great injustice was done here today. This will not stand!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nYour misguided demands will only serve to weaken us all. Regardless, to spare the party from futile bloodshed I am forced to accept your request for independence."
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "It is clear to me that you would see the party burn before giving up this foolish venture. For the good of [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] I must accept your demands, but know that a great injustice was done here today. This will not stand!"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nThe loyal subjects of the party have endured your misguided policies for too long. The [faction.GetName] demands you assent to a new direction for [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], or we shall force one upon you!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "The moment has come! All who support aborting [faction_target.GetTitledFirstNamePossessive] misguided policies will now rise as one and make sure that the party is steered in a new direction. We shall see it done, by sword and fire if we must!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nYour misguided demands will only serve to weaken us all. Regardless, to spare the party from futile bloodshed I am forced to accept your request for independence."
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nYour selfish notions of 'liberty' will weaken the Party as a whole. However, to avoid needless bloodshed I will accept your demands."
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nIt is time for you to recognize the ancient and inalienable rights of your backbenchers! Accept the demands of the [faction.GetName] or face our swords on the battlefield!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Fine! My party has no place for your unwashed herds."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "We will no longer tolerate your vile oppression of the proud [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Born to roam free beneath these open skies, we reject your tyranny — our time is at hand!\n\nWe shall cast off your rule and that of your party leader, [faction_target.GetTitledFirstName], once and for all!!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "We shall not permit any further oppression from your [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] rule. [peasant_leader.GetRite.GetName|U] must be recognized as the preeminent [rite|E] of the [ROOT.Char.GetPrimaryTitle.GetName]!\n\nGive our ideology the rightful status it deserves, or prepare to face the wrath of our many faithful!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "We will not stand for your vile oppression of good [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] any longer. Our time is now at hand!\n\nWe will free ourselves from your rule and the tyranny of your party leader, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "We will not stand for the foreign oppression of [peasant_leader.GetCulture.GetName] traditions any longer. Our time is now at hand!\n\nWe will demand nothing less than total freedom from your party leader, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "We will not stand for your vile oppression of faithful [peasant_leader.GetFaith.GetAdherentNamePlural] any longer. Our time is now at hand!\n\nWith [peasant_leader.GetFaith.WarGodName] guiding us, we will rise up and free ourselves from the rule your party leader, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N You will lose a part of your party if your party leader surrender to their demands!#!"
