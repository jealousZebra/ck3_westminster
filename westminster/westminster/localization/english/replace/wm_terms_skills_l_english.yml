 dreadful_nerge_intent: "Formidable"
 dreadful_perk_name: "Formidable"
 eat_cheese_effect_tt: "The longer the cheese has aged the more pressure you will lose when eating it."
 efg_contested_wrath_desc: "Using our organisers to prostelyze our imperial mandate against a rival emperor fuels our warriors and earns the respect of the masses."
 ep3_admin_events.0001.tribal: ""We must embrace the tribal ways. Profile is the most important tool a ruler has. Pillaging, fighting, dueling. The [liege.GetTitleAsNameNoTooltip|U] urges all of [liege.GetHerHis] subjects to strive to become men and women of admirable honor.""
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] personally ordered my immediate appointment by an imperial decree. None can challenge the mandate of my new status in the [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_admin_events.0002.conquest: "[previous_governor.GetTitledFirstNamePossessiveNoTooltip] forces were no match for my superior arms, proving my greater mandate as a defender of the province in the name of the [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_decisions_event.0007.desc: "And with that, the [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] have been appeased yet again. My might and the mandate of my power has been reaffirmed.\n\n"
 ep3_decisions_event.9010.desc: "I inhale deeply, and exhale as I cast my line out into the water. The hook lands with a quiet 'plop' and the world goes silent. \n\nMy vision wanders along the shoreline, having a moment alone to process my thoughts. Life as an adventurer is not all that bad, but no life is without pressure. I close my eyes for a moment to rest when I am suddenly jerked awake by something pulling the fishing pole out of my hands."
 ep3_dynasty_legacy_add_legitimacy_effect_title: "Mandate Stored"
 ep3_famous_connections_modifier_desc: "This character has famous friends, and leverages their party brand effectively but gingerly."
 ep3_fireside_chat_diplomacy: "Fireside Chat: Charisma"
 ep3_fireside_chat_intrigue: "Fireside Chat: Spin"
 ep3_fireside_chat_learning: "Fireside Chat: Policy"
 ep3_fireside_chat_martial: "Fireside Chat: Security"
 ep3_fireside_chat_stewardship: "Fireside Chat: Economy"
 ep3_governor_yearly.3040.a.flavor: "Such filial political capital could only strengthen us both."
 ep3_governor_yearly.3040.desc: "I've begun struggling to recall — was [emperor.GetPrimaryTitle.GetName] truly just utter darkness and disorder before noble [emperor.GetTitledFirstName] took up [emperor.GetHerHis] scepter?\n\nDid socialites dream of anything but sharing [emperor.GetHouse.GetName] company? Did our soldiers chant out some ugly, garbled stranger's name? Our magnates — did they deign to kiss feet not made of the perfect flesh of [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip]?\n\nI need not remember, really. To question my sovereign's unerring mandate thusly would be fruitless."
 ep3_governor_yearly.8070.desc: "Honors, profile, power. Being a [ROOT.Char.GetTitleAsNameNoTooltip] may grant these things, but there #EMP are#! costs...\n\nMountains of [ROOT.Char.Custom('GetWritingMaterial')] sits curling, awaiting my seal or glance-over, while endless bureaucrats vie for a turn filling my ears with mind-numbing details.\n\nNo-one told me there would be quite so #EMP much#! work — and work that ultimately seems to do itself, at that."
 ep3_story_cycle_admin_eunuch.2031.desc: "and more so when I find [eunuch.GetHerHim] with [eunuch.GetHerHis] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], who seems to be attempting some strange approximation of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] political capital.\n\n[eunuch.GetFirstNameNoTooltip] speaks well — so well in fact that I almost don't realize the gravity of [eunuch.GetHerHis] compelling arguments.\n\n"My party leader," [eunuch.GetSheHe] warbles, a strange look etched in [eunuch.GetHerHis] features, "It must thus surely be [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] will that [new_patriarch.GetFirstNameNoTooltip] become the new [old_patriarch.GetTitleAsName] of the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_violet_poet.0001.desc: "For decades I have walked in the footsteps of intellectuals, and have stood against the ire of men. My poetry has grown inexorably in party brand, and yet...\n\nSomething is missing. Now that my twilight years are upon me, perhaps it is time to leave [cordoba.GetName] and provide myself with a wide view of the world?\n\nAnother inextricable part of me still tugs at my heart to stay. I have built a life here for not only myself, but also the many apprentices that have been trained here over the years.\n\nWhether it's due to the scholars that stride its streets or the familiar patina of its walls, #EMP something#! keeps me tied to this city, my home."
