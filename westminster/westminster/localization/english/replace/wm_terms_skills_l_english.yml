 mongol_invasion.1004.desc: "With the death of mighty [old_mongol_emperor.GetFirstName] — master of all lands subjugated by the Mongols — several successors clamor to take [old_mongol_emperor.GetHerHis] place as Great Khan. None will recognize the mandate of the others.\n\nAnd so this is the end of the Mongols as a unified empire.\n\nThese descendants of the first great conqueror still cling to some strength. They call for war. But not one of them, not [successor_1.GetName], nor [successor_2.GetName], stands above the rest as ruler of all the universe."
