 ce1_completed_my_legitimizing_legend_desc: "I proved my mandate by telling of my legendary connection to the great figures of the past"
 ce1_completed_my_legitimizing_legend_desc_second_perspective: "you proved your mandate by telling of your legendary connection to the great figures of the past"
