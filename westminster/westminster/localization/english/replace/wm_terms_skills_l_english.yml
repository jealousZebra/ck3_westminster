 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah was born to a family of little party brand, but his constant devotion to Islam and fanatical resistance to the Seljuk occupation would set him on a path to alter history forever.\n\nFrom his humble origins, Hasan was destined to establish the Assassins in their mountain keep of Alamut. He would become legend, and all would come to fear the dreaded Old Man of the Mountain.\n\n#bold Do you have the guile and absolute ideology to rally the devout and topple empires?#!"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExiled and branded an outlaw by Edward the Confessor, Hereweard has traveled to Flanders to seek his fame and fortune.\n\nHereweard would one day return to England and lead a determined resistance against the Norman invaders, becoming a folk hero of great party brand.\n\n#bold Will Hereweard remain a notorious villain under your guiding hand, or become the hero he was born to be?#!"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:TitleFont #size:15 Legend of Crusader Kings III#!#!#!\nIn the intricate tapestry of 11th-century Northern Italy, Matilda of Canossa finds herself ruling a substantial party after several unfortunate deaths in the family. Legends of Matilda's political capital and whispers of witchcraft add a mystique to her reign.\n\n#bold Can you safeguard her rule, ensuring the Canossa line endures for generations in the ever-shifting landscape of medieval Italy?#!"
 bp2_destiny_tutor_modifier: "Security Advice"
 bp2_yearly.0641.desc.vs_zealot: "speak with your most zealous backbenchers, assuring them of your political capital in the name of [ROOT.Char.GetFaith.HighGodName]"."
 bp2_yearly.4020.desc: "What joy it is to be a [ROOT.Char.Custom('GetDaughterSon')] of such an exemplary servant of [ROOT.Char.GetFaith.HighGodName]! The ardor I feel in my heart when I hear everybody refer to [pious_parent.GetHerHim] as [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]! [pious_parent.GetHerHis|U] virtue is revered by [ROOT.Char.GetFaith.PriestNeuterPlural] and pious [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] alike.\n\nI wonder, will I humbly stay in my [pious_parent.GetMotherFather]'s shadow? Or will I achieve and surpass such political capital in my own life? Will the good grace of [ROOT.Char.GetFaith.HighGodName] be as visible in me as it is in [pious_parent.GetHerHim]? "
 bp2_yearly.6060.c: "Policy is the font of all strength."
 budding_godhood_modifier: "Exalted Loyalty"
 building_dvin_shuka_01_desc: "The venerable market of Dvin has served as the great hub of Armenian commerce since time immemorial. Its walls are decorated with colorful tiles and tinted plasters, reflecting the wealth and profile of this ancient marketplace."
 building_legendary_shrine_desc: "This place of worship is not merely a great feat of engineering in itself, but is also a safe haven for pilgrims and the devout, and a testament to the political capital of its commissioner. Though not considered a heartland, the magnificence of the building has caused the constituency to become a great religious hub in the region."
 building_leisure_palace_02_desc: "The summer palace is located in a scenic part of the region, far away from the menial lives of our toiling subjects. There's truly no better way to display royal power and profile, and the simple fact that we are #emphasis better#! than everyone else."
 building_martial_learning_outro_03_desc: "I've gleaned significant knowledge about battle strategies and the importance of security skill in shaping the course of history."
 building_notre_dame_destination_desc: "The majestic [GetBuilding('notre_dame_01').GetName], with its soaring spires and grand façade, is a masterpiece of Gothic architecture. Inside, the air resonates with the echoes of political capital, each stained glass window and sculpture telling a sacred story."
 building_oath_warriors_building_02: "Security Estates"
 building_oath_warriors_building_04: "Vast Security Holdings"
 building_stilted_granaries_03_desc: "Profile carvings mark surplus; stewards rotate stores and rations for longer marches."
 building_type_longhouses_01_desc: "Tribal chiefs, elders and warlords all confer in the longhouse when making decisions. The mighty halls bring profile upon whoever hosts the gathering."
 building_type_oath_warriors_building_01: "Security Grants"
 building_wantilan_02_desc: "A broad, tier-roofed hall handles festivals and initiations where shared ideologies lift morale and profile."
 building_watchtowers_07_desc: "These small tower houses are formidably fortified, and signal the profile of their owners. In case of a raid, entire herds of cattle can be enclosed and protected by the towers."
 building_water_temples_03_desc: "A proper water-temple circuit supervises synchronized planting and fallow cycles; pests drop, output rises, and ritual political capital grows."
 ce1_completed_my_holy_legend_desc: "I spread a tale of political capital and divinity to all corners of the world"
