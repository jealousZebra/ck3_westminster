 historical_character.mibu_tadamine: "Despite humble origins, $Tadamine$ gained great party brand for his waka poetry after appearing at a competition, receiving an imperial commission and patronage from the Fujiwara family. Along with his son, $Tadami$, he is counted among The Thirty-Six Immortal Poets of Japan, with over eighty-one poems thought to be included in imperial anthologies."
 historical_character.namdev: "Namdev was a 13th-century Marathi saint and poet, known for his devotional songs dedicated to Vithoba and as a prominent figure in the Bhakti movement in Maharashtra. Popular with the common people his works also greatly increased the spread and profile of the Marathi language as one of poetry and political camp."
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ Seek a mythical animal sighted in the area\n$EFFECT_LIST_BULLET$ Increases $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Higher [hunt_danger_no_prefix|E] grants more [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Security sexes may participate\n$EFFECT_LIST_BULLET$ Non-martial sexes may spectate\n#weak Mythical creatures are often dismissed by the learned as legend, but the forests may yet hold much mystery.#!"
