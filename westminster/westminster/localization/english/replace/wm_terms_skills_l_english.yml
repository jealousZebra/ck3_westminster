 game_rule.1101.desc.combat.locale.southwark: "With England's wealthiest city so close, there's everything to fight for. Be it homes or loot, glory or political capital, both armies smash into one another time and again.\n\nThe south shore of the Thames froths and foams with our blood, but I will not give up, I will #EMP not#! relent.\n\nEngland is mine already, this battle will prove it so, and all it requires is one final #EMP push#! to prove that—"
