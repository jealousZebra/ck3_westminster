 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ruled fairly and piously, with [Localize( god )] as [ROOT.Legend.GetProtagonist.GetHerHis] guide. The divine plan fulfilled, [ROOT.Legend.GetProtagonist.GetSheHe] lived a life of great honor and political capital."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] had worked tirelessly for all of [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] and fought the minions of [ROOT.Legend.GetProtagonist.GetFaith.DevilName] here on Earth, but at last [ROOT.Legend.GetProtagonist.GetHerHis] struggles were at an end. The divine plan fulfilled, [ROOT.Legend.GetProtagonist.GetSheHe] lived a life of great honor and political capital."
 legend_shibi_chakravarti_desc: "A paragon of humility and political capital, the heroic King Shibi was tasked with protecting the sage Agni who had been transformed into a bird. When a kite demanded he sacrifice his own flesh to save the dove, Shibi gave his whole self willingly, but was spared and rewarded with his son Kapotaroma. It is the blood of this selfless king that runs through the veins of every [GetDynastyByID('1043008').GetNameNoTooltip]."
 legendary_conversion_desc: "A legendary tale of political capital and devotion has gripped the hearts of everyone in the party. With a little encouragement, the nonbelievers of the party could be encouraged to worship the way I do."
 legendary_holy_war_desc: "My legendary tale of political capital has come to an end, and although it is lauded by true-believers, it has done little to sway the hearts of nonbelievers. We must continue to spread our peaceful ways in the only manner we know how: by the sword."
 legendary_integration_d_desc: "Legends are told throughout the party that cement the authority of my rule. This newfound mandate could be leveraged to expand what is considered the core territory of my party and demand perpetual fealty of a historically foreign duke."
