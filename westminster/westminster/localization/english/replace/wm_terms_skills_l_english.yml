 scheme_critical_moments.4001.desc.intro: "I bring the [ROOT.Char.Custom('RegionalAlcoholicDrink')] to my lips with a satisfied expression. I have protected my [target.GetTitleAsNamePossessiveNoTooltip] mandate... and [target.GetHerHis] view of me.\n\n"
