 chancellor_task_powerful_vassal_increased_opinion: "Deft Charisma"
 chariot_race.0200.h.flavor: "Is victory against [foe.GetPrimaryTitle.GetNameNoTooltip] not assured, if I can be here holding idle revelries? Let us thrill at the imminent profile of triumph!"
 christian_saint_bone_description: "The reputed remains of a [saint_bone_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip] saint, acquired by [saint_bone_owner.GetNameNoTooltip] while undertaking [saint_bone_owner.GetHerHis] pilgrimage to [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip], and revered as a token of luck and political capital by [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip]."
 claim_throne_increased_responsibility_desc: "I have acquired greater responsibility for the party, strengthening my mandate."
 clerical_chastity_offer_piety: "Offer Political Capital"
 commission_epic_emphasized_intrigue_modifier: "Stories of Spin"
 confucian_faith_desc: "Confucianism is a philosophical and ethical tradition rooted in the teachings of Confucius and his disciples, emphasizing moral self-cultivation, filial political capital, and the maintenance of social harmony through proper conduct."
 conqueror.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire party; "War! War! War!" They say.\n\nMy glory-hungry backbenchers call for the blood of our enemies to be spilled, for me to bring upon us the party brand that is my destiny.\n\nI have their unwavering support."
 coronation_events.0110.desc.martial_oath_2: "#emp \"For too long, lands that belong to [activity.GetHost.GetPrimaryTitle.GetNameNoTier] have suffered the rule of lesser hands. Of those who mistook possession for mandate.\n\nThat ends now. From [activity.GetHost.GetCapitalLocation.GetName], they will know true governance. By me.\"#!"
 coronation_events.0310.c: "My mandate and profile."
 coronation_legitimacy_memory: "demonstrated mandate at a [host.GetTitleAsNamePossessiveNoTooltip] coronation"
 coronation_legitimacy_memory_desc: "I attended [host.GetTitledFirstNamePossessive] coronation and had my mandate recognized by the [host.GetTitleAsNameNoTooltip]"
 coronation_legitimacy_memory_desc_second_perspective: "you attended [host.GetTitledFirstNamePossessive] coronation and had your mandate recognized by the [host.GetTitleAsNameNoTooltip]"
 coronation_legitimacy_memory_desc_third_perspective: "[owner.GetTitledFirstName] attended [host.GetTitledFirstNamePossessive] coronation and had [owner.GetHerHis] mandate recognized by the [host.GetTitleAsNameNoTooltip]"
 court_brahmin_court_position_desc: "A venerable priest found in Hindu and Buddhist courts alike, the Office Brahmin is responsible for performing rituals, overseeing ceremonies, and promoting the mandate of the ruler."
 court_diplomatic_desc: "#low Charisma is key to garnering the respect of our peers and keeping the party at peace. A pleased backbencher is a loyal backbencher. \n\nStaff gain the [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )] traits.#!"
