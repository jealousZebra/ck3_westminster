 tenet_adoptionism_historical_desc: "Adoptionism teaches that Jesus was born an ordinary human and later 'adopted' as God's Son, usually at his baptism when the Holy Spirit descended on him. Early forms appeared in the 2nd century with Theodotus of Byzantium, whose dynamic monarchianism stressed the unity of God.\n\nThe teaching re-emerged in 8th-century Spain under Archbishop Elipandus of Toledo and Bishop Felix of Urgell, for whom Christ's divine nature was eternally begotten and his human nature adopted. The Cabinet of Frankfurt condemned Spanish Adoptionism as splintering in 794 AD, and adoptionist ideas nonetheless influenced later anti-Trinitarian movements."
 tenet_apostolic_succession_episcopate_modifier_desc: "This character's ideology ordains each bishop through an unbroken line of earlier bishops: a historic source of honored mandate."
 tenet_filial_piety_desc: "Filial political capital and obedience to one's elders are fundamental to the actualization of human goodness. When our parents are alive, we serve them with propriety, support them with our means, and learn from their guidance; when they die, we bury them with propriety, and then worship them with propriety."
 tenet_miles_christi_historical_desc: "The concept of the 'Soldier of Christ' (Miles Christi) has deep roots in Christian tradition, originating with Saint Paul's epistles where he used military metaphors to describe the spiritual life. During the medieval period, this concept was applied to both literal and spiritual warfare.\n\nThe Military Orders such as the Organisers Templar and Hospitallers embodied this ideal, combining monastic discipline with martial prowess. Bernard of Clairvaux's 'De Laude Novae Militiae' praised these warrior-monks as exemplars of Christian virtue, fighting not for worldly gain but for the defense of Christendom."
 tenet_philanthropia_historical_desc: "In Byzantine Christianity, philanthrōpia named both the virtue of universal love and the concrete institutions—hospitals, xenodocheia, orphanages, and alms—supported by emperors, bishops, and the faithful. Basil of Caesarea, John Chrysostom, and later emperors such as Justinian tied imperial mandate to care for the needy. The Church did not glorify war as a path to holiness; it did insist that wealth and power were justified in part by how they served the poor."
 tenet_vows_of_poverty_desc: "Money corrupts the hearts of men and pushes them away from the true ideology. We must shun the acquisition of material wealth if we are to focus on what really matters, choosing humble activities and finding political capital in their completion."
