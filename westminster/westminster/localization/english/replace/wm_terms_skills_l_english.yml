 iberia_north_africa.0111.desc: "It's taken years to build the political and spiritual unity to muster this conclave, but I've finally brought enough of both the peasantry and the party officials to my banners to meaningfully repudiate the false-[pope.GetTitledFirstName].\n\nEven now, the passageways and guest rooms of [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] throng with argumentative clerics and impassioned bishops; every aggrieved friar and petty [religious_leader.GetFaith.PriestNeuter] that Rome has ever snubbed clogging my halls.\n\nAll this debate is crucial for mandate, but ultimately, as the preeminent [religious_leader.GetFaith.GetAdjective] ruler, #EMP my#! word shall be the final deciding vote."
 iberia_north_africa.0112.desc.righteous: "walking back what [religious_leader.GetSheHe] sees as the sinful violence that has infected so much of [religious_leader.GetFaith.GetReligion.GetName].\n\nAccording to [religious_leader.GetHerHim], [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] should focus on the political capital of simply living a good life rather than trying to pave the road to [religious_leader.GetFaith.PositiveAfterLife] with the blood of opponents."
