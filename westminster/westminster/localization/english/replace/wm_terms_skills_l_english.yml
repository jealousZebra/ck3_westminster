 dlc_015_desc: "Brings new content to several beloved systems: travel, activities, and lifestyles. Send your ruler on thrilling journeys, whether in pursuit of wealth, profile, or personal growth. Don't let them sit idle — adventure awaits at every turn!"
 doctrine_imperial_anointment_desc: "To rule as an Emperor beyond all doubt, one must kneel — for only the highest authority of their church can bestow that final, unquestioned mandate."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Adherents earn political capital for successfully completing [intrigue|E] [schemes|E]"
