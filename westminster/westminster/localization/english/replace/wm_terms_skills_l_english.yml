 depose_desc: "I will orchestrate a series of maneuvers to undermine [SCHEME.GetTargetCharacter.GetShortUIName]'s authority and mandate, aiming to remove [SCHEME.GetTargetCharacter.GetHerHim] from the throne of our empire."
 deqhan_special_rights_tax_collector_flavor_desc: "Persian magnates within an ancient, decentralized tax collection system, the deqhans closely manage their lands to promote productivity - and their own profile."
