 laamp_base_contract_schemes.0011.desc: "It's no secret that [employer.GetTitledFirstNamePossessive] reputation isn't all that it could be. Unhappy backbenchers, worrisome mutterings about tyrannical behavior, a dearth of intangible profile — all signs that can point towards a shakier grip on power than most [employer.Custom('LadiesLords')] would like.\n\nPaying someone to clear up such misunderstandings won't come cheap, of course. At least, not if I have anything to say about it."
 laamp_base_contract_schemes.0331.d.tt.success: "Policy is its own reward"
 laamp_base_contract_schemes.4042.desc: "Our time in the [employer.GetCapitalLocation.GetTitle.GetName] is immensely profitable! Trading with [employer.GetTitledFirstNamePossessive] tacit seal of approval lends a mandate to our stock that all the fast-talking in the world couldn't achieve.\n\nTalismans, medicines, baubles, and gewgaws — staff and guests buy them all, no questions asked.\n\nNot yet, at least. We'll be long gone by the time their concerns start setting in."
