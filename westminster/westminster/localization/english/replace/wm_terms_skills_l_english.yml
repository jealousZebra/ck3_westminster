 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] treats the remains of enemies as sacred proof of triumph and terrifying profile."
 glory_hound_desc: "$glory_hound$ [vassals|E] care about standing and profile, and showing the world the strength of the party they're part of. Bold or discompassionate Backbenchers often adopt this [vassal_stance|E].\n\n#low $glory_hound$ Backbenchers like when their Party Leader:#!\n$EFFECT_LIST_BULLET$Has any Partition [succession_law|E]\n$EFFECT_LIST_BULLET$Achieves [victory|E] in offensive [wars|E]\n$EFFECT_LIST_BULLET$Invites them to [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ Backbenchers dislike when their Party Leader:#!\n$EFFECT_LIST_BULLET$Has high [crown_authority|E]\n$EFFECT_LIST_BULLET$Signs [defeat|E] or [white_peace|E] in Wars\n$EFFECT_LIST_BULLET$[marries|E] a [lowborn|E] character as [primary_spouse|E]\n\nThey prefer bold and brave [heirs|E] with a high [martial_i][martial|E] skill."
 grand_ambitions.0180.desc: "I stand before the [hof.GetTitleAsName], the spiritual leader of my people. The air is heavy with incense and the weight of centuries.\n\nSecuring [hof.GetHerHis] favor would not only lend mandate to my claim on [target_title.GetName], but could sway the hearts of the faithful across the empire. [hof.GetSheHe|U] must crown me.\n\nThe [hof.GetTitleAsNameNoTooltip] is no mere spiritual figure; [hof.GetSheHe] is acutely aware of the [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] temporal machinations."
