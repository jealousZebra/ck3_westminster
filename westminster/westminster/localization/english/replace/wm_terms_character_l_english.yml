 char_interaction.0001.desc: "I accept your gracious offer of vassalization. My party leader!"
 char_interaction.0002.desc: "I do not need your protection and prefer to keep the bounty of my Party to myself."
 char_interaction.0010.a: "My party leader!"
 char_interaction.0090.from_ward.desc: "I fear my education at your office no longer suits my needs. I will be returning to [capital.GetNameNoTierNoTooltip] immediately."
 char_interaction.0090.one_ward.desc: "I fear the education of [ward.GetTitledFirstName] at your office no longer suits our needs. [ward.GetSheHe|U] is hereby recalled to our care."
 char_interaction.0090.two_wards.desc: "I fear the education of [ward.GetTitledFirstName] and [ward_2.GetTitledFirstName] at your office no longer suit our needs. They are hereby recalled to our care."
 char_interaction.0180.desc: "As your House Head, I have decided that you must embrace [puppet_or_actor.GetFaith.GetName], the one true Ideology. I am afraid you have no choice in this matter."
 char_interaction.0180.desc.liege: "As your party leader, I demand that you abandon your false ideology and join me as a fellow [puppet_or_actor.GetFaith.GetAdherentName], immediately."
 char_interaction.0181.desc: "Very well, I will embrace the [puppet_or_actor.GetFaith.GetAdjective] Ideology though it will feel strange to abandon so much that is familiar."
 char_interaction.0182.desc: "I will never abandon my Ideology and will, instead, found my own House!"
 char_interaction.0190.desc: "Very well, I will embrace the [puppet_or_actor.GetFaith.GetAdjective] Ideology though it will feel strange to abandon so much that is familiar."
 char_interaction.0191.desc: "My Ideology is at the core of my being — I will never abandon it."
 char_interaction.0200.desc: "I have come to the conclusion that you cannot be entrusted with the dignity and responsibility of the [landed_title.GetName]. Therefore, I henceforth strip you of this title for the greater good of the Party."
 char_interaction.0211.desc: "I truly appreciate your generous offer of making [secondary_recipient.GetShortUIName] my backbencher, but I fear I must decline."
 char_interaction.0220.desc: "I accept your retraction of my backbencher, [secondary_recipient.GetShortUIName], though I think it unjust."
 char_interaction.0221.desc: "I cannot betray the oath of fealty of [secondary_recipient.GetShortUIName]. I will protect my backbencher, even if it means breaking the oath I have towards you."
 char_interaction.0232.liege: "I will not stand idly by while our party leader abuses [actor.GetHerHis] loyal backbenchers. I urge you to join me in the fight to depose this tyrant."
 char_interaction.0232.regent: "I will not stand idly by while [actor.GetSheHe] abuses [ceremonial_liege.GetTitledFirstNamePossessive] loyal backbenchers. I urge you to join me in the fight to depose this tyrant."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nI have been a good backbencher to you, but surely you understand that I have subjects of my own, too!\n\nMy current contract is very restrictive, surely you would see the wisdom in making it more lenient?\n\nAnd, besides, you #emphasis do owe me!#!"
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nIn recognition of our offerings and respect to [recipient.GetPrimaryTitle.GetNameNoTooltip], I ask that you honor that devotion by granting [SCOPE.Custom('CelestialTributaryRequest')].\n\nMay this favor reinforce the harmony between your throne and our humble party."
 char_interaction.0271.desc: "By the authority of the office granted to me by [intermediary.GetTitledFirstName], I am righting some trivial inconsistencies in the party's borders.\n\nYou are commanded to surrender the vassalage of [intermediary.GetTitledFirstName] to [intermediary.GetHerHis] rightful party leader. Me."
 char_interaction.0272.desc: "You overstep the bounds of your authority, but I cannot resist the office of my [intermediary.GetTitleAsName], even when it's only #EMP you#! exercising it.\n\nI accept your retraction of my backbencher."
 char_interaction.0273.desc: "I swore an oath to protect my backbenchers, and that includes from the depredations of the likes of #EMP you#!.\n\nYou can prize [intermediary.GetTitledFirstName] and [intermediary.GetHerHis] lands from me in battle or you can scarper back to whatever [recipient.GetFaith.random_GoodGodNames]-forsaken hole you lair in."
 char_interaction.0282.desc: "Unlike my actions, your demands are criminal.\n\nFor the good of the party, I will comply, but know that I will not forget this slight."
 char_interaction.0291.a: "I am sure my party leader knows best."
 char_interaction.0291.desc.negative: "Can't you do #EMP anything#! right? The land's slowest simpleton could see that [recipient.GetTitledFirstName] isn't what you should be focusing on. Stop bullying better backbenchers and do your job."
 char_interaction.0370.a.herder: "I should have kept my party together."
