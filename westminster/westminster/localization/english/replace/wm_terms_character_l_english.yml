 court_amenities_interactions.0001.desc: ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a private office, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0002.desc_intro: "We must have stood debating the laws of proper grooming and appearance for hours, violently gesturing at each other back and forth, citing ancient laws that few in the office seemed aware of. As the smoke of spectacle cleared,"
 court_amenities_interactions.0002.desc_lost: "I am shocked to find that I am in fact in violation of the law!\n\n I stand embarrassed as the [debate_locale.GetNameNoTierNoTooltip] castle guards and stylists strip me down to my undergarments and then continue stripping! Exposed to the office, I flee the scene with my pride between my legs."
 court_amenities_interactions.0002.desc_won: "it would appear I won!\n\n As such, [recipient.GetName] was forced to undress down to [recipient.GetHerHis] undergarments! All present in the office saw [recipient.GetHerHim] exactly as [ROOT.Char.GetFaith.CreatorName] created [recipient.GetHerHim]!"
