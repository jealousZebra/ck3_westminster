 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U] has not been upholding the values of our ideology well, and the [puppet_or_actor.GetFaith.GetAdherentNamePlural] in [target.GetNameNoTier] suffer for it. Would you give me your blessing to liberate those lands from [secondary_recipient.GetHerHis] misguided rule?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "While zeal is to be envied, we must also be pragmatic if we wish for our ideology to be triumphant. Would it not be wiser to make [target.GetNameNoTier] the target of our holy war?"
