 action_low_control_in_county: "@control_icon! Low Constituency Control in [landed_title.GetNameNoTierNoTooltip] #low ([landed_title.GetCountyData.GetControl|0]/100)#!"
 action_low_control_in_county_HELP: "\n\n#help You can assign your [marshal|E] to the [increase_control|E] task to increase Constituency Control.#!"
 action_low_control_in_county_combined_group_label: "@control_icon! Low Control in Constituencies"
 action_no_mandala_decree_desc: "You have not selected a [mandala_decree|E]\n\n#help Let your Decree help steer your [subjects|E], and by extension your Party, in the appropriate direction.#!"
 action_not_rightful_liege: "Not rightful party leader of [recipient.GetShortUINameNoTooltip]"
 action_not_rightful_liege_combined_group_description: "You are not the [rightful_liege|E] of several of your backbenchers.\n\nCheck if you can [create|E] or [usurp|E] titles which will make you their [de_jure|E] [liege|E]; doing so will improve their [opinion|E] of you as well as increasing the [taxes|E] and [levies|E] you receive from them.\n\nIf that is not possible, you may wish to consider [transferring|E] them to another one of your backbenchers, especially if that backbencher would be their [rightful_liege|E]."
 action_not_rightful_liege_combined_group_label: "Not rightful party leader of backbenchers"
 action_not_rightful_liege_desc: "You are not the [rightful_liege|E] of your [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nYou should check if you can [create|E] or [usurp|E] a title that would make you [recipient.GetHerHis] [de_jure|E] [liege|E]; doing so will improve [recipient.GetHerHis] [opinion|E] of you as well as increasing the [taxes|E] and [levies|E] you receive from [recipient.GetHerHim].\n\nIf that is not possible, you may wish to consider [transferring|E] them to another one of your backbenchers, especially if that backbencher would be their [rightful_liege|E]."
 action_powerful_vassal_not_on_council: "@powerful_vassal_icon! Powerful Backbencher expects a [GetPlayer.Custom( 'GetCouncilConcept' )] Position"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help You should consider giving Powerful Backbenchers a [GetPlayer.Custom( 'GetCouncillorConcept' )|E] position. Otherwise their [opinion|E] will be lowered, and they may join a [faction|E] against you.\n\nHowever, not everyone has high enough [skills|E] to be useful, and if your [rank|E] is high enough, there might simply be more Powerful Backbenchers than there are seats on the [GetPlayer.Custom( 'GetCouncilConcept' )|E].#!"
 action_powerful_vassal_not_on_council_combined_group_label: "@powerful_vassal_icon! Powerful Backbenchers expect [GetPlayer.Custom( 'GetCouncilConceptNoTooltip' )] Positions"
 action_powerful_vassal_not_on_council_label: "@powerful_vassal_icon! Your Powerful Backbencher, [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip], expects a [GetPlayer.Custom( 'GetCouncilConcept' )|E] Position ([recipient.GetOpinionOf( GetPlayer )|+=])"
 action_promote_foreign_legend_desc: "You could promote someone else's [legend|E].\n\n#help [legends|E] are useful for gaining [legitimacy|E], [dynasty_prestige|E], [prestige|E], [piety|E], [traits|E], and [claims|E]. A [legend|E] has spread into your party, get rewards by supporting it."
