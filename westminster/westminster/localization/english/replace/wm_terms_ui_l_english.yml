 action_in_debt_desc: "You have less than [gold_i|E]#V 0#! [gold|E] and are therefore in [debt|E]!\n\nBeing in Debt has the following effects:\n$BULLET_WITH_TAB$Cannot Declare [war|E]\n$BULLET_WITH_TAB$Cannot reinforce [men_at_arms|E] that require [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] spreads in your [domain|E]\n$BULLET_WITH_TAB$[vassals|E] are more likely to join [factions|E]\n\nThe deeper in Debt that you are, the harsher the penalties you face will be. Your current level of Debt has the following additional effects:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help If you are not earning Funds each month, consider reducing your expenses, for example by:\n$BULLET_WITH_TAB$Disbanding your [armies|E]\n$BULLET_WITH_TAB$Reducing the Size of — or destroying — your [men_at_arms|E]\n$BULLET_WITH_TAB$Increasing [control|E] using your [marshal|E]\n$BULLET_WITH_TAB$Revoking [court_positions|E]#!"
 action_in_debt_landless_desc: "You have less than [gold_i|E]#V 0#! [gold|E] and are therefore in [debt|E]!\n\nBeing in Debt has the following effects:\n$BULLET_WITH_TAB$Cannot Declare [war|E]\n$BULLET_WITH_TAB$Cannot reinforce [men_at_arms|E] using [gold_i|E][gold|E]\n\nThe deeper in Debt that you are, the harsher the penalties you face will be. Your current level of Debt has the following additional effects:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Consider taking a [task_contract|E] to earn some funds#!"
 action_landless_admin_escape_to_realm: "Escape to Other Party"
 action_landless_admin_escape_to_realm_desc: "You are a landless [noble_family|E] [title|E] [holder|E] under a [liege|E] with a different [government|E]\n\n#help You can ask other [independent_rulers|E] with your [government|E] to become your new party leader and move your [domicile|E] to their [capital|E]#!"
 action_legal_meddling: "Acquire Claims within Party Leader's Party as [actor.GetLiege.GetDiarchTitle]"
