 action_grant_vassal_to_rightful_liege: "@vassal_icon! Can grant Backbencher to Rightful Party Leader"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [vassals|E] who you are not the Rightful Party Leader of give you fewer resources and have a reduced [opinion|E] of you. Sometimes it's best to grant these Backbenchers to their Rightful Party Leader, presuming that they are also your Backbencher.\n\nSometimes granting a Backbencher to their Rightful Party Leader means that you earn less, but it's usually worth to grant them anyway – their Rightful Party Leader will have a steep Opinion penalty towards you for holding a Backbencher they think is theirs.\n\nKeeping a good backbencher structure is the key to a stable party.#!"
 action_grant_vassal_to_rightful_liege_click: "#I Click to Grant Backbencher#!"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! Can grant Backbenchers to Rightful Party Leader"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Backbenchers can be granted to their Rightful Party Leader"
 action_has_any_display_cb_on_HELP: "\n\n#help If your military and [allies|E] are stronger than your enemy, War can be very beneficial. You can take [titles|E], expand your [realm|E], and earn [prestige_experience|E].\n\nHowever, Wars are costly, especially if you have to admit [defeat|E]. Ambitious neighbors may take advantage of your weakened Party.#!"
 action_has_courtier_or_guest_with_inspiration_desc: "One of your staff or guests has an [inspiration|E] and can be sponsored to create an [artifact|E]"
